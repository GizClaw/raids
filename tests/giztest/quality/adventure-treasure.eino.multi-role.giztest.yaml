  expect:
    "/text":
      not_contains:
      - "【"
      - "】"
      - 进入下一章
      - 要不要继续
      - 想继续听就说
      - 这一章的选择完成啦
      - 等你说要不要
      - 是否继续听
      - say continue
      - say next chapter
      - would you like to continue
      min_length: 200
      max_length: 900
      pattern: "(还是|或|选|哪|谁|先| or |which|where|who)[^。.!！]*[？?]\\s*$"
      contains_any:
      - 诗句解谜
      - 航路回顾
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/audio_integrity/streams":
      equals: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- timeout: 2m
  id: eino_multi_role_child_extra_0
  client: eino_multi_role__routing
  peer_stream:
    mode: text
    input: 哈哈，我肚子咕咕叫了！刚才那一小段没听清，再讲讲嘛。
    idle_timeout: 90s
    require_text: true
