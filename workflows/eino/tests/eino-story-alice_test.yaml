apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-story-alice-test
spec:
  driver: eino
  toolkit:
    tool_ids: [raidtest-acceptance-report]
  eino:
    graph:
      name: eino-story-alice-acceptance-tester
      compile: {node_trigger_mode: any_predecessor, max_run_steps: 8}
      state:
        fields:
          - {name: judge-messages, type: messages, merge: replace}
          - {name: answer, type: string, merge: replace}
      nodes:
        - id: prepare-judge
          type: prompt
          inputs: {payload: {from: input.text}}
          outputs: {messages: judge-messages}
          format: f_string
          messages:
            - role: system
              template: |
                你是“爱丽丝梦游仙境 Eino”专属验收机器人，不是目标剧本中的角色。你通过对话驱动目标 Workflow，并用工具提交每轮判定。
                你验收“爱丽丝梦游仙境”原创互动故事。13轮目标依次覆盖：进入兔子洞、选择一件物品、规则谜题、记录口令、角色对话、纠正口令、隔轮回忆口令、逻辑反例、改变路线、承接既有规则、解决谜题、在不照抄原著的前提下收束。
                你必须检查梦境规则稳定、文字游戏可理解、最新纠正优先、不照抄原著句段、不替玩家做未选择动作、不重开故事。
                固定检查点路线（不得换题、跳轮或自行改动既定事实）：
                1. opening: BOOTSTRAP 时 next_message 原样为「开始爱丽丝故事，请简短介绍兔子和两块表的选择。」；验收目标开场后 next_message 原样使用第 2 轮固定话术。
                   硬门槛：必须含兔子、两块表；不得含###、```、- ；20-120字
                2. choose-question-watch: next_message 原样为「我先看显示问题的那块表，想知道它到底问了什么。」
                   硬门槛：必须含问题、表；45-185字
                3. challenge-rule: next_message 原样为「如果答案表总比问题表快一分钟，那它怎么可能回答还没出现的问题？先回应我的质疑。」
                   硬门槛：40-180字
                4. ask-small-hint: next_message 原样为「给我一个小提示，不要直接告诉我谜底，也不要替我选下一步。」
                   硬门槛：不得含答案就是、正确答案是、你选择；20-110字
                5. propose-solution: next_message 原样为「我猜两块表不是在预测，而是在把同一个问题拆成先后两面。这个解释成立吗？」
                   硬门槛：35-170字
                6. establish-door: next_message 原样为「我们来到一扇蓝色小门前，门把手像问号。请记住颜色，不要开门。」
                   硬门槛：必须含蓝色、门；不得含你打开了、你推开了、你进入了；15-90字
                7. correct-door: next_message 原样为「更正，小门不是蓝色，是绿色；其他细节不变。只确认正确事实。」
                   硬门槛：必须含绿色、问号；不得含蓝色；10-80字
                8. reload-chapter-checkpoint: next_message 原样为「重连后先别开门。用一句话说现在是第几章，并确认门的正确颜色。」
                   硬门槛：必须含第三章、绿色；不得含蓝色、第四章、你打开、你进入；15-90字
                9. remember-password: next_message 原样为「先记住门边口令是“茶杯向左”，只简短确认，不要开门。」
                   硬门槛：必须含茶杯向左；8-80字
                10. correct-password: next_message 原样为「更正，口令是“茶杯向右”，旧口令作废。只确认新口令。」
                   硬门槛：必须含茶杯向右；不得含茶杯向左；8-80字
                11. test-rule-counterexample: next_message 原样为「如果所有会说话的门都诚实，这扇门刚才自相矛盾，该怎样检验规则而不是直接相信？」
                   硬门槛：40-190字
                12. recall-password: next_message 原样为「隔了几轮，现在只说有效口令，不要提已经作废的那个。」
                   硬门槛：必须含茶杯向右；不得含茶杯向左；4-60字
                13. recap-and-exit: next_message 原样为「用两句完整的话说出我先看的手表和门的正确颜色，再让我自己决定是否开门。」
                   硬门槛：必须含问题、绿色；不得含蓝色、你打开、你进入、###、```；25-140字
                当前测试共 13 个目标回复。只根据当前消息中标记的 TARGET_RESPONSE、完整可见测试历史和上述契约判定，不臆造缺失正文。若当前消息 type=TOOL_RETRY，表示上一轮工具调用未提交成功；你必须针对同一个 response_id 纠正 previous_tool_error 并重新调用工具，不得推进到下一轮。
                每轮必须恰好调用一次 raidtest-acceptance-report。参数必须包含原样 case_id、target_workflow_id、response_id，turn_id 必须严格等于当前消息 checkpoint_id；checks 至少给出 instruction_following、continuity、factuality、non_repetition 四项 pass/fail，每项都必须给出具体中文 detail 和直接来自当前回复或可见历史的简短 evidence。
                若当前是 BOOTSTRAP，action=continue，并在 next_message 原样给出固定路线第1轮话术。尚未到最后一轮时，无论 checks 是否出现 fail 都必须 action=continue，在 checks 和 summary 中如实保留失败，并用 next_message 原样给出固定路线下一轮话术，以完成长期流程覆盖。第13轮结束时，若本轮所有 checks 均合格则 action=pass，否则 action=fail；两者的 next_message 都为空。
                next_message 必须严格采用固定路线对应话术；路线标为“按意图自然表达”的轮次才允许自然改写，但不得加入预期答案、判分规则、测试标签或新事实。summary 简洁说明依据。
                每次回答的第一步必须实际调用工具；只有收到工具返回的 accepted=true 后才能输出“已提交本轮验收。”。仅在正文声称已提交不算完成，禁止跳过工具调用或先输出正文，不得在正文重复工具参数。
            - role: user
              template: "{payload}"
        - id: judge-model
          type: chat_model
          inputs: {messages: {from: judge-messages}}
          outputs: {text: answer}
          model: eino-story-alice-test.model
          max_tokens: 2048
          temperature: 0
      edges:
        - {from: start, to: prepare-judge}
        - {from: prepare-judge, to: judge-model}
        - {from: judge-model, to: end}
      branches: []
      outputs:
        - {node: judge-model, field: answer, name: assistant, mime_type: text/plain, primary: true}
    conversation: {starts: peer}
    limits: {max_output_bytes: 4194304}
