<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Raids 测试报告</title>
  <link rel="stylesheet" href="report.css?v=a6da90b65189">
  <script defer src="report-data.js?v=0d0422d177f6"></script>
  <script defer src="report.js?v=0218d3a8b9a5"></script>
</head>
<body>
  <main>
    <header><h1>Raids 测试报告</h1><div class="links"><a href="report.json" download>JSON</a><a href="scoring.md" target="_blank" rel="noopener">评分标准</a></div></header>
    <p id="metadata" class="metadata">加载中…</p>
    <form id="filters" class="filters" role="search">
      <div class="filter-field search-field"><label for="search">搜索</label><input id="search" type="search" placeholder="剧本名称 / ID" autocomplete="off"></div>
      <div class="filter-field"><label id="category-label" for="category">类别</label><select id="category"><option value="all">全部</option></select></div>
      <div class="filter-field"><label id="language-label" for="language">语言</label><select id="language"><option value="all">全部</option><option value="zh">中文</option><option value="en">English</option></select></div>
      <div class="filter-field"><label id="scope-label" for="scope">范围</label><select id="scope"><option value="all">全部剧本</option><option value="current">本轮测试</option><option value="untested">未测试</option></select></div>
      <span id="row-count" class="muted"></span>
    </form>
    <div class="table-wrap report-scroll" tabindex="0" role="region" aria-label="剧本报告表">
      <table id="report-table">
        <colgroup><col class="col-title"><col class="col-category"><col class="col-language"><col class="col-status"><col span="2" class="col-progress"><col span="2" class="col-score"><col class="col-detail"></colgroup>
        <thead><tr>
          <th scope="col" data-sort="title" aria-sort="none"><button type="button">剧本</button></th>
          <th scope="col" data-sort="category" aria-sort="none"><button type="button">类别</button></th>
          <th scope="col" data-sort="language" aria-sort="none"><button type="button">语言</button></th>
          <th scope="col" data-sort="status" aria-sort="none"><button type="button">状态</button></th>
          <th scope="col" class="num" data-sort="collected" aria-sort="none"><button type="button">回复</button></th>
          <th scope="col" class="num" data-sort="scored" aria-sort="none"><button type="button">已评分</button></th>
          <th scope="col" class="num" data-sort="mean" aria-sort="none"><button type="button">均分</button></th>
          <th scope="col" class="num" data-sort="minimum" aria-sort="none"><button type="button">最低</button></th>
          <th scope="col">日志</th>
        </tr></thead>
        <tbody id="report-rows"></tbody>
      </table>
    </div>
    <p class="footnote">每种语言分别评分。每场 51 轮用户对话 + 开场（52 条回复）；均分、最低分在本场逐轮评分完成后汇总。</p>
    <details id="history"><summary id="history-title">历史记录</summary><div class="table-wrap"><table><thead><tr><th scope="col">记录</th><th scope="col">语言</th><th scope="col" class="num">回复</th><th scope="col" class="num">已评分</th><th scope="col">备注</th><th scope="col">日志</th></tr></thead><tbody id="history-rows"></tbody></table></div></details>
    <details id="rubric"><summary>评分权重</summary><table class="rubric-table"><thead><tr><th scope="col">回应与推进</th><th scope="col">连贯与规则</th><th scope="col">事实与逻辑</th><th scope="col">互动表达</th><th scope="col">角色与语言</th></tr></thead><tbody><tr><td>25</td><td>25</td><td>25</td><td>15</td><td>10</td></tr></tbody></table><p class="footnote">每项评级 0–5，由 Codex 根据实际日志给分；程序加权计算。Pro 仅作玩家。</p></details>
    <p id="load-error" class="failure" role="alert" hidden>报告数据读取失败。</p>
  </main>
</body>
</html>
