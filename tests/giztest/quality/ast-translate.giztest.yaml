repeat: 1
timeout: 10m
steps:
- id: register_ast
  client: ast
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: ast_case1_stop_create_workspace
  client: ast
  rpc:
    method: server.run.stop
    request: {}
- id: ast_case1_create_workspace
  client: ast
  rpc:
    method: server.workspace.create
    request:
      name: "${ast_case1_workspace_name}"
      collection: translates
      workflow_name: translate-ja-zh
      parameters:
        asttranslate_workspace_parameters:
          agent_type: ASTTRANSLATE_WORKSPACE_PARAMETERS_AGENT_TYPE_AST_TRANSLATE
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: ast_case1_select_workspace
  client: ast
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${ast_case1_workspace_name}"
- id: ast_case1_warmup_workspace
  client: ast
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: ast_case1_synthesize_1_gratitude
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: 心からご親切に感謝いたします。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case1_audio_1
- id: ast_case1_turn_1_gratitude
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case1_audio_1}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 谢谢
      - 感谢
      - 感激
      - 谢意
      pattern: "\\p{Han}"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case1_synthesize_2_good-day
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: 今日が素晴らしい一日になりますように。
