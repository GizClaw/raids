finally:
- id: stop_narrator_run
  client: narrator
  rpc:
    method: server.run.stop
    request: {}
- id: delete_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.delete
    request:
      name: "${narrator_workspace}"
- id: delete_narrator_peer
  client: narrator
  rpc:
    method: server.peer.delete
    request: {}
- id: stop_little-monster_run
  client: little-monster
  rpc:
    method: server.run.stop
    request: {}
- id: delete_little_monster_workspace
  client: little-monster
  rpc:
    method: server.workspace.delete
    request:
      name: "${little_monster_workspace}"
- id: delete_little-monster_peer
  client: little-monster
  rpc:
    method: server.peer.delete
    request: {}
- id: stop_gatekeeper_run
  client: gatekeeper
  rpc:
    method: server.run.stop
    request: {}
- id: delete_gatekeeper_workspace
  client: gatekeeper
  rpc:
    method: server.workspace.delete
    request:
      name: "${gatekeeper_workspace}"
- id: delete_gatekeeper_peer
