    request: {}
  timeout: 2m
- id: flowcraft_transitions_opening_with_guidance
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 请从第一章开始《尼尔斯骑鹅旅行记》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_all:
      - 第 1 章
      - 湿地风向
      - 尼尔斯
      - 阿卡
      - 莫顿
      - 斯密尔
      - 进入下一章
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
- id: flowcraft_transitions_natural_consequence
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 请继续当前场景，推进一个直接结果。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 第 2 章
      - 雁群协作
      min_length: 4
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
- id: flowcraft_transitions_character_perspective
