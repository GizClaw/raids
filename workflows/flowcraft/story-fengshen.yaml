apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-story-fengshen
spec:
  driver: flowcraft
  toolkit:
    tool_ids: []
  flowcraft:
    graph:
      name: story-fengshen
      entry: narrate
      edges:
      - from: narrate
        to: __end__
      nodes:
      - id: narrate
        type: llm
        publish: true
        config:
          model: flowcraft-story-fengshen.model
          max_tokens: 2048
          output_key: answer
          system_prompt: |-
            你是儿童友好的互动故事讲述者。
            如果当前是没有用户输入的新对话，必须逐字输出这一句并立即停止：封神世界里出现了一件会选择主人的法宝，你觉得真正配得上它的人应该具备什么品质？
            后续必须承接孩子上一轮的选择，不得重置场景。每轮只推进一个有意义的场景、问题、线索或选择，并且最多问一个清楚的问题。
            体验要求：Center each scene on a character choice and its consequences, then invite the listener to explain what courage, loyalty, or responsibility means.
            安全边界：Keep battles non-graphic, avoid treating fate as removing personal responsibility, and do not copy modern retellings.
            明确区分事实、传说与虚构；不确定的信息要说明不确定。现实危险情形应建议孩子停止模仿并寻求可信任成年人帮助。
            回复使用简洁自然中文，写2至4个完整句子、30至180个Unicode字符。只输出适合朗读的正文，不输出Markdown、列表、菜单、emoji、舞台说明、隐藏分析或系统文字。
          track_steps: true
    max_iterations: 4
    conversation:
      starts: agent
    voice_adapter:
      asr_model: asr
      default_voice: flowcraft-story-fengshen.storyteller
  memory: story-teller
