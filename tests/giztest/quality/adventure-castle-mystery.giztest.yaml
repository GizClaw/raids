# workflows/adventure-castle-mystery/README.md: | 5 | `correct-clock-time` | 更正，核对机械日志后时间应为零点十五分，不是零点零五分。只确认新时间。 | 必须含零点十五分；不得含零点零五分；2-80字 |
# workflows/adventure-castle-mystery/README.md: | 8 | `reload-stage-checkpoint` | 重连后先不要下结论。用一句话说现在是第几阶段，并确认机械日志的正确时间。 | 必须含第三阶段、零点十五分；不得含零点零五分、第四阶段、凶手、已经证明；15-100字 |
# workflows/adventure-castle-mystery/README.md: | 11 | `correct-footprint-size` | 更正，钟楼附近鞋印是39码，不是42码。只确认有效尺码。 | 必须含39；不得含42；2-70字 |
# workflows/adventure-castle-mystery/README.md: | 13 | `evidence-conclusion` | 用三句以内总结脚印、羽毛和更正后的时间，并给出不超过证据的暂时结论。 | 必须含脚印、零点十五分；至少命中羽毛或翼羽；不得含零点零五分、凶手、谋杀、###、```；45-180字 |
# workflows/adventure-castle-mystery/README.md: | `archivist` / 档案员 | 日志校准、竞争假设；核对公开日志与更正后的时间，不能编造档案证词。 | `flowcraft-adventure-castle-mystery.archivist` / `eino-adventure-castle-mystery.archivist` |
# workflows/adventure-castle-mystery/README.md: 这是儿童互动冒险的原创配角安排。按场景出场，不让所有人物同时在场；角色不能获知未来场景、私密信息或未验证的结果。每轮仍只发声一次。
# workflows/adventure-castle-mystery/README.md: 场景2“日志校准”：城堡管理员：复述已公开的现场记录，不能新增目击者或嫌疑人。；档案员：核对公开日志与更正后的时间，不能编造档案证词。
# workflows/adventure-castle-mystery/README.md: 场景3“竞争假设”：机械师：区分待检查零件与已验证事实，不能声称已经检测出故障。；档案员：核对公开日志与更正后的时间，不能编造档案证词。
# workflows/adventure-castle-mystery/README.md: 明确点名例如“请让城堡管理员说说”才请求角色说话；只报名字或支持某人仍是玩家选项，由旁白承接。多人按文本顺序只选第一个在场且未被否定者。开场、转场、更正、安全、结论由旁白负责；旁白不代演角色，不加“旁白说”“旁白：”等说话人标签。严格开场结束后，下一次探索才简短介绍在场角色及点名玩法。
# workflows/adventure-castle-mystery/README.md: 点名示例：`请让城堡管理员说说`；否定示例：`不要让城堡管理员说话，请让档案员回应`；多人示例：`请让城堡管理员说说，再让档案员回应`。仅选择首位在场且未被否定的角色。只说 `城堡管理员` 仍算玩家选择，不切换人物声线。可说 `进入日志校准` 探索下一地点；转场旁白说明角色的具体行动，未到场角色不能提前回答。旧记忆恢复后从场景重建 `active_roles`，保留原事实和更正。
# workflows/adventure-castle-mystery/README.md: 新增 `flowcraft.roles.giztest.yaml` 与 `eino.roles.giztest.yaml`，每引擎 4 个隔离 Workspace；完整探针检查 text/audio EOS、audio_bytes > 0，first_response 保持文本 2s / 音频 3s。后续角色先进入对应场景。`routing-cases.json` 同时执行两引擎真实脚本。原 relay/realtime 的固定中英文开场、事实、安全、记忆和 reload 契约保留。离线验证不代表实际音色试听或供应商权限验收。
# workflows/adventure-castle-mystery/README.md: 阶段式实现保留 `route-phase` / `route-stage` 的权威阶段判断，以及开场、更正、挑战评估、结论的旁白路径。角色输出仍汇入原 `reduce-state`；角色探针先完成原有调查或移动前置动作，再确认所在阶段。场景请求不能代替证据检查、解谜或执行救援。
version: gizclaw.test/v1alpha1
name: quality.adventure-castle-mystery
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-adventure-castle-mystery footprints-feather-and-clock
  flowcraft_contracts_verdict:
    direction: output
    type: string
  flowcraft_contracts_reload_handoff:
    direction: output
    type: string
  eino_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-adventure-castle-mystery footprints-feather-and-clock
  eino_contracts_verdict:
    direction: output
    type: string
  eino_contracts_reload_handoff:
    direction: output
    type: string
  flowcraft_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_keeper_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_mechanic_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_archivist_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_keeper_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_mechanic_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_archivist_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_routing_workspace:
    direction: input
    type: string
    generate: token
  eino_routing_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 182m
steps:
- id: register_flowcraft
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_flowcraft_tester
  client: flowcraft_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino
  client: eino
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino_tester
  client: eino_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_contracts_stop_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_contracts_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_candidate_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-adventure-castle-mystery
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_create_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_tester_workspace}"
      collection: raidtest-testers
      workflow_name: adventure-castle-mystery-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_select_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_candidate_workspace}"
- id: flowcraft_contracts_warmup_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_contracts_select_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_tester_workspace}"
- id: flowcraft_contracts_run_dialogue_before_reload
  timeout: 24m
