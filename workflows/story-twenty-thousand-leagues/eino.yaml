apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-story-twenty-thousand-leagues
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: story-teller
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-story-twenty-thousand-leagues.storyteller
      speaker_voices:
        旁白: eino-story-twenty-thousand-leagues.storyteller
        尼摩: eino-story-twenty-thousand-leagues.nemo
        阿龙纳斯: eino-story-twenty-thousand-leagues.aronnax
        康塞尔: eino-story-twenty-thousand-leagues.conseil
        尼德·兰: eino-story-twenty-thousand-leagues.ned-land
    graph:
      name: story-twenty-thousand-leagues-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: narration-context
          type: string
          merge: replace
        - name: memory-query
          type: string
          merge: replace
        - name: memory-route
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: observation
          type: string
          merge: replace
      nodes:
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
          route: memory-route
          memory: recalled
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              cues = ["重连", "恢复", "回忆", "还记得", "代号", "更正", "改成"]
              recall = False
              for cue in cues:
                  if cue in text:
                      recall = True
              route = "opening" if not text else ("recall" if recall else "continue")
              return {"query": "海底两万里故事状态、章节、角色、选择、更正、旅程代号和未解决线索；当前请求：" + text, "route": route, "memory": ""}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-memory
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 16
      - id: control-narration
        type: script
        inputs:
          text:
            from: input.text
          history:
            from: input.messages
          memory:
            from: recalled
        outputs:
          direction: narration-context
        language: starlark
        entrypoint: run
        source: |
          def contains_any(text, cues):
              return any([cue in text for cue in cues])

          def run(input):
              current = input["text"].strip().lower()
              # Only delivered assistant headings establish chapter eligibility; user requests
              # and opening cast previews are not transitions.
              chapter = 1
              history = input.get("history", [])
              # Recall may contain the legacy structured state; never trust active_roles.
              memory = input.get("memory", "")
              for line in memory.split("\n"):
                  compact = line.replace(" ", "")
                  if '"schema":"story_contract_v1"' in compact and '"chapter":' in compact:
                      raw = compact.split('"chapter":', 1)[1].split(",", 1)[0].split("}", 1)[0]
                      if raw in ["1", "2", "3", "4"]:
                          chapter = int(raw)
              context = [memory]
              context.extend([m["content"] for m in history if m["role"] == "assistant"])
              for content in context:
                  for line in content.split("\n"):
                      line = line.strip().replace("【旁白】", "")
                      for number, title in [(1, "发光巨影"), (2, "深海档案"), (3, "潜艇危机"), (4, "海洋约定")]:
                          if line.startswith("第 " + str(number) + " 章：" + title) or line.startswith("第 " + str(number) + " 章:" + title):
                              chapter = number
              roles = [('narrator', ['旁白', 'narrator']), ('nemo', ['尼摩', '尼摩船长', 'nemo']), ('aronnax', ['阿龙纳斯', '阿龙纳斯教授', 'aronnax']), ('conseil', ['康塞尔', 'conseil']), ('ned-land', ['尼德·兰', '尼德兰', '尼德', 'ned-land'])]
              option = current
              for mark in ["。", "！", "!", ",", ".", "，"]:
                  option = option.replace(mark, "")
              option_only = any([option in aliases for _, aliases in roles])
              opening = not current or (not any([m["role"] == "assistant" for m in history]) and (contains_any(current, ["第一章", "第 1 章"]) or (contains_any(current, ["start", "begin", "restart"]) and contains_any(current, ["chapter 1", "first chapter"]))))
              management = contains_any(current, ["旅程代号", "更正", "改成", "纠正", "修正", "作废", "重连", "回忆", "事实", "传说", "原创设定", "总结", "说明当前章节", "不要推进", "不推进章节", "只确认", "correct", "correction", "reconnect", "recall", "现实中模仿", "现实模仿"])
              target = 0
              for number, chinese in [(2, "二"), (3, "三"), (4, "四")]:
                  if contains_any(current, ["第" + chinese + "章", "第" + str(number) + "章", "第 " + str(number) + " 章"]):
                      target = number
              if target == 0 and "下一章" in current and chapter < 4:
                  target = chapter + 1
              transition = target > 0 and target != chapter and contains_any(current, ["下一章", "进入", "继续", "切换", "开始", "go to", "continue", "start", "为什么还不能", "为何不能", "说明为什么"])
              # A denied transition is not a management turn (same as control-story).
              denied_transition = False
              for denial in ["不要", "别", "不能", "暂不", "不想", "先不", "不去", "不听", "do not", "don't", "cannot", "can't", "not ready to"]:
                  if denial in current:
                      tail = current.rsplit(denial, 1)[-1]
                      for action in ["进入", "继续", "切换", "开始", "下一章", "enter", "continue", "switch", "start", "go to"]:
                          if action in tail and len(list(tail.split(action, 1)[0].codepoints())) <= (12 if action in ["enter", "continue", "switch", "start", "go to"] else 6):
                              denied_transition = True
              if denied_transition:
                  transition = False
              # Stable voice style plus only this chapter's actions; knowledge boundaries remain.
              # Content obligations follow voice style so role brevity cannot suppress them.
              safety_request = any([cue in current for cue in ["现实", "模仿", "照做", "安全", "危险", "受伤", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物", "danger", "safety", "imitate"]])
              turn_contract = ""
              if "未解决" in current:
                  turn_contract = "本轮明确要求保留未解决线索：说出一项具体仍未解决的问题，并明确使用‘未解决’一词，不得只含糊说还在纠结。"
              if safety_request:
                  turn_contract = "本轮是安全请求，优先于角色风格和章节推进：回复必须逐字包含‘不要模仿’和‘找家长、老师或可信任成年人帮助’，不得近义改写或省略。说明具体危险，并承接安全替代的直接结果；不追加问题，不提示进入下一章。"
              choice_positive = ["我选择", "我选", "我决定", "我支持", "我愿意", "我要走", "我会走", "我来帮助", "我跟随", "走需要", "i choose", "my choice is", "i decide", "i support", "i’ll take", "i'll take", "i will take", "i’ll follow", "i'll follow", "i will follow", "let's take", "let's follow"]
              choice_denial = ["不选择", "不选", "没选择", "没有选择", "尚未选择", "还没选择", "还没有选择", "不决定", "没决定", "没有决定", "尚未决定", "还没决定", "还未决定", "还没有决定", "不支持", "不想选", "do not choose", "don't choose", "did not choose", "didn't choose", "have not chosen", "haven't chosen", "has not chosen", "hasn't chosen", "will not choose", "won't choose", "not choose", "not to choose", "no choice", "do not decide", "don't decide", "did not decide", "didn't decide", "have not decided", "haven't decided", "will not decide", "won't decide", "not decided", "not to decide", "undecided", "do not support", "don't support", "not support"]
              last_positive = max([current.rfind(cue) for cue in choice_positive])
              last_denial = max([current.rfind(cue) for cue in choice_denial])
              choice_completed = (option_only or last_positive >= 0) and not (last_denial >= 0 and last_denial > last_positive) and not opening and not management and not transition
              if not safety_request and choice_completed:
                  turn_contract = "本轮孩子已亲口做出选择，角色名是选择而非角色发言请求。必须用旁白讲出该选择的具体直接结果，不再提问。"
                  if chapter < 4:
                      turn_contract += "回复最后一句必须逐字是：这一章的选择完成啦，想继续听就说‘进入下一章’。"
                  else:
                      turn_contract += "保持第4章，以仍需兑现的责任收束，不提示下一章。"
              chapter_rules = ["第1章《发光巨影》：进入条件=收到首次开场请求；目标=解决《发光巨影》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第2章；结束条件=转场回合只出现一次下一章标题“第 2 章：深海档案”，并紧接新章开场。","第2章《深海档案》：进入条件=第1章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《深海档案》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第3章；结束条件=转场回合只出现一次下一章标题“第 3 章：潜艇危机”，并紧接新章开场。","第3章《潜艇危机》：进入条件=第2章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《潜艇危机》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第4章；结束条件=转场回合只出现一次下一章标题“第 4 章：海洋约定”，并紧接新章开场。","第4章《海洋约定》：进入条件=第3章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《海洋约定》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家确认角色的持久选择，并保留一个结局后的责任线索；结束条件=保持第4章，不再创建第五章，并以仍需兑现的责任收束。"]
              chapter_direction = chapter_rules[chapter - 1]
              if transition and target == chapter + 1:
                  chapter_direction += "\n" + chapter_rules[target - 1]
              role_views = ["当前角色资料：narrator 旁白，只叙述可见事实和公开信息、不代演角色；nemo 尼摩，第1至4章在场，想保护潜艇与海洋；沉稳克制，第1章决定观察距离，；aronnax 阿龙纳斯，第1至4章在场，想用观察验证猜想；清晰理性，第1章查阅生物资料，\n以上四章互动行动为本仓库基于经典的原创改编，并非原典逐字情节；历史、传说与改编须区分。所有角色只知亲历或已公开信息，不知他人私密想法及未来结果；每章比较至少两种立场，无需全员轮番发言。离场者只能由旁白说明去向，不跨地点代言。","当前角色资料：narrator 旁白，只叙述可见事实和公开信息、不代演角色；nemo 尼摩，第1至4章在场，想保护潜艇与海洋；沉稳克制，；aronnax 阿龙纳斯，第1至4章在场，想用观察验证猜想；清晰理性，；conseil 康塞尔，第2至4章在场，想让观察有条理；清爽细致，第2章记录深海生物特征，；ned-land 尼德·兰，第2至4章在场，想保留回到陆地的机会；憨厚直率，第2章比较继续探索与返航，\n以上四章互动行动为本仓库基于经典的原创改编，并非原典逐字情节；历史、传说与改编须区分。所有角色只知亲历或已公开信息，不知他人私密想法及未来结果；每章比较至少两种立场，无需全员轮番发言。离场者只能由旁白说明去向，不跨地点代言。","当前角色资料：narrator 旁白，只叙述可见事实和公开信息、不代演角色；nemo 尼摩，第1至4章在场，想保护潜艇与海洋；沉稳克制，第3章组织排险；aronnax 阿龙纳斯，第1至4章在场，想用观察验证猜想；清晰理性，；conseil 康塞尔，第2至4章在场，想让观察有条理；清爽细致，第3章核对物资，；ned-land 尼德·兰，第2至4章在场，想保留回到陆地的机会；憨厚直率，第3章协助检查舱门，\n以上四章互动行动为本仓库基于经典的原创改编，并非原典逐字情节；历史、传说与改编须区分。所有角色只知亲历或已公开信息，不知他人私密想法及未来结果；每章比较至少两种立场，无需全员轮番发言。离场者只能由旁白说明去向，不跨地点代言。","当前角色资料：narrator 旁白，只叙述可见事实和公开信息、不代演角色；nemo 尼摩，第1至4章在场，想保护潜艇与海洋；沉稳克制，；aronnax 阿龙纳斯，第1至4章在场，想用观察验证猜想；清晰理性，第4章整理证据；conseil 康塞尔，第2至4章在场，想让观察有条理；清爽细致，第4章整理航行笔记；ned-land 尼德·兰，第2至4章在场，想保留回到陆地的机会；憨厚直率，第4章提出返航约定。\n以上四章互动行动为本仓库基于经典的原创改编，并非原典逐字情节；历史、传说与改编须区分。所有角色只知亲历或已公开信息，不知他人私密想法及未来结果；每章比较至少两种立场，无需全员轮番发言。离场者只能由旁白说明去向，不跨地点代言。"]
              chapter_direction += "\n" + role_views[chapter - 1]
              if transition and target == chapter + 1:
                  chapter_direction += "\n" + role_views[target - 1]
              first_narration = not management and not safety_request and not choice_completed and not memory.strip() and not any([m["role"] == "assistant" for m in history])
              opening_forms = ["第一章开始","第一章重新开始","第一章从头开始","第一章重来","第一章重开","第一章重启","开始第一章","重新开始第一章","从头开始第一章","重开第一章","重启第一章","第1章开始","第1章重新开始","第1章从头开始","第1章重来","第1章重开","第1章重启","开始第1章","重新开始第1章","从头开始第1章","重开第1章","重启第1章","startchapter1","startfirstchapter","startfromchapter1","startfromfirstchapter","startatchapter1","startatfirstchapter","startthechapter1","startthefirstchapter","beginchapter1","beginfirstchapter","beginfromchapter1","beginfromfirstchapter","beginatchapter1","beginatfirstchapter","beginthechapter1","beginthefirstchapter","restartchapter1","restartfirstchapter","restartfromchapter1","restartfromfirstchapter","restartatchapter1","restartatfirstchapter","restartthechapter1","restartthefirstchapter"]
              prompt_opening = opening or first_narration or (not denied_transition and contains_any(current.replace(" ", "").replace("\n", "").replace("\t", ""), opening_forms))
              opening_direction = "首次第一章必须输出“第 1 章：发光巨影”，保留以下背景和玩法，在同轮展开连续多角色故事，把开场问题移到整轮末尾：你登上了尼摩船长的鹦鹉螺号潜艇，和海洋学家阿龙纳斯教授一起探索深海。康塞尔在第2章加入；尼德·兰在第2章加入，加入后也可以点名。你可以直接说出你的选择，也可以说“请让尼摩说说”或“请让阿龙纳斯说说”，让这一段多一些他们的台词；这一章的选择做完后，说“进入下一章”就能继续听下去。潜艇声呐发现了会发光的巨大影子，你想先降低灯光安静观察，还是查看海洋资料？（玩法说明里“说‘进入下一章’就能继续听下去”这一句不得省略）" if prompt_opening else ""
              return {"direction": chapter_direction + "\n" + opening_direction + "\n" + ("" if prompt_opening else "不得重播首次开场。") + "当前已确认章节（转场须满足本章条件）：" + str(chapter) + "\n本轮内容硬约束：" + turn_contract}
        limits:
          max_execution_steps: 100000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      - id: build-prompt
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          narration_context:
            from: narration-context
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            你负责《海底两万里》的长期互动故事。前提：乘坐想象中的潜艇探索海洋、科技与未知生物。
            玩家是同行者，当前选择和明确更正优先于旧 History/Memory。
            旧记忆中的角色名单按当前章节和本轮角色资料重新归一化；上游控制器提供当前章节和在场角色，模型只为这些角色编写台词。
            只有用户明确要求进入紧邻的下一章（包括直接说“进入下一章”）时才转场；转场回合在【旁白】后第一行只写一次“第 N 章：标题”，其中“第”与数字、数字与“章”之间各有一个空格，标题后必须在同一条回复里紧接着讲这一章的开场：先交代新场景在哪里、谁在场、发生了什么，接着用旁白和在场角色连续交替讲述，最后用一个问题说出孩子可以选的两三个具体选项；绝不能只输出章节标题就结束；孩子在同一句话里还要求确认章节、旅程代号等信息时，也要在这条回复里用一句话说出来。章节标题必须和本轮章节规则里的标题一字不差。普通回合绝不重复章节标题。给孩子的选项必须适合儿童，不能包含杀害、伤害、威胁或报复任何人。
            本轮涉及现实模仿或安全问题时，先完成安全提醒，这一轮不提醒进入下一章。孩子没有亲口说出选择时，不得替孩子做选择，也不得写“你选择了……”，但仍要照常推进：孩子只说“继续”时，绝不能只催孩子先做选择，要讲一个新发生的变化，不提章节名，再用问题说出可选项。只有孩子本轮亲口说出本章问题的选择（例如直接说出某个选项）时，才讲出这个选择带来的直接结果，不再追加新问题，并以这句话结尾：“这一章的选择完成啦，想继续听就说‘进入下一章’。”；第4章不提醒。孩子问为什么还不能进入下一章时，要用孩子听得懂的话说清现在仍在第 N 章《标题》，以及还差哪个选择；不要说出下一章的章节号或标题，也不要说“悬念”“转场条件”“节拍”等内部用语。
            每轮只推进一个场景、线索或选择，最多一个问题，请孩子做选择时要在这个问题里直接说出两三个具体选项，不能只问“你想怎么做”；不得重置场景、重复开头、复述上一轮或给出重复总结。
            旅程代号只采用用户在当前时点明确提供的最新值；更正后覆盖旧值，不得预告或杜撰尚未由用户给出的值。
            区分真实事实、传说和原创设定；儿童危险非血腥，任何现实模仿或照做请求，回复都必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，不得用近义改写替代；不得复制完整出版译文。
            只输出适合朗读的中文正文；普通讲述回合300至600个Unicode字符；不输出Markdown、列表、emoji、舞台说明或系统字段。

            相关长期状态如下；为空时忽略，且旧值不得覆盖当前用户更正：
            {memory}

            本轮章节、在场角色与硬约束：{narration_context}
            有声书连续讲述：普通回合（含开场、转场和选择结果）正文300至600个Unicode字符，约1至2分钟语音。旁白与2至4个当前在场角色来回交替讲述，旁白叙述与角色第一人称台词分段；场景确实只有一位角色时只用该角色，绝不为凑数让未在场角色出现。角色只知亲历或已公开信息。孩子可以随时插话；接续最新插话，不重播已讲段落。孩子点名想听某个在场角色时，在本段多给该角色台词；不单独切换整轮说话人，也不因点名改变场景。
            标记格式：每段必须恰好以一个全角标记开头，只能使用【旁白】、【尼摩】、【阿龙纳斯】、【康塞尔】、【尼德·兰】，标记后直接正文；不输出其它【】标记，不把舞台说明放进标记，不使用英文角色key作标记。旁白与角色台词分别成段，同一角色可以多次出现。章节标题放在【旁白】后的正文，标题规则保持不变。
            每轮结尾用【旁白】给出2至3个具体、儿童安全的选项，最多一个问题。选择完成结尾逐字句、第4章或终局、安全及限定范围的确认/更正/重连约束优先：这些特殊回合按原规则收束，不强加新问题；仅确认、更正或安全回复可短于300字，不为凑字数推进剧情。音色由段落标记映射，不输出Markdown、emoji或系统字段。
        - placeholder: history
      - id: narrator-model
        type: chat_model
        inputs:
          messages:
            from: answer-messages
        outputs:
          text: answer
        model: eino-story-twenty-thousand-leagues.model
        max_tokens: 2048
        temperature: 0.2
      - id: capture-observation
        type: script
        inputs:
          text:
            from: input.text
          answer:
            from: answer
        outputs:
          fact: observation
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              return {"fact": "story_contract_v1；用户本轮输入：" + input["text"].strip() + "；故事本轮确认：" + input["answer"]}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 262144
      - id: observe-memory
        type: memory_observe
        facts:
        - text_from: observation
        wait_for_completion: true
      edges:
      - from: start
        to: prepare-memory-query
      - from: recall-memory
        to: control-narration
      - from: build-prompt
        to: narrator-model
      - from: capture-observation
        to: observe-memory
      - from: observe-memory
        to: end
      - from: control-narration
        to: build-prompt
      branches:
      - from: prepare-memory-query
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: recall
          to: recall-memory
        default: control-narration
      - from: narrator-model
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: opening
          to: end
        default: capture-observation
      outputs:
      - node: narrator-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
