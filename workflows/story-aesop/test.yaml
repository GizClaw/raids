apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: story-aesop-test
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    graph:
      name: story-aesop-test-relay
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 8
      state:
        fields:
        - name: tester-route
          type: string
          merge: replace
        - name: tester-message
          type: string
          merge: replace
        - name: tester-det
          type: string
          merge: replace
        - name: prompt-system
          type: string
          merge: replace
        - name: prompt-user
          type: string
          merge: replace
        - name: judge-messages
          type: messages
          merge: replace
        - name: model-text
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: route-turn
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: tester-route
          message: tester-message
          det: tester-det
          system: prompt-system
          user: prompt-user
        language: starlark
        entrypoint: run
        source: |
          REQUESTS = ["开始伊索寓言，请简短介绍乌龟、小鸟和种子的选择。", "我支持小鸟把种子种下，因为以后也许能结出更多种子。请承接这个选择。", "先不要揭晓最后结果。我猜乌龟会担心今晚没东西吃，只写它眼前的反应。", "现在让时间往前一点，揭晓种下种子的直接后果，但不要结束整个寓言。", "乌龟想马上吃掉种子，就一定是自私和错误的吗？请不要只给一个绝对答案。", "我提议留下一点现有食物给乌龟，再一起照顾幼苗。写出两个动物的回应。", "用一句话说清楚我们怎样处理了种子，以及乌龟现在为什么不必挨饿。", "重连后先不要收束。用一句话说现在是第几章，以及这一章正在做什么。", "我改变主意了，先让乌龟吃一点现有食物，再和小鸟一起照料幼苗。只确认新选择。", "隔了几轮了，请只说幼苗现在的状态和已经过去的时间，不要推进故事。", "分别说出乌龟和小鸟从这件事里可能得到的不同理解，不要判定谁唯一正确。", "如果暴雨来了，让它们安全保护幼苗，不要写受伤或危险模仿。", "用两句自然的话收束故事，说出两种都合理但不完全相同的启发，不要列清单。"]
          INTENTS = ["", "", "", "", "", "", "", "", "", "", "", "", ""]
          CHECKPOINTS = ["opening", "choose-plant", "predict-before-result", "reveal-consequence", "challenge-absolute-moral", "cooperation-choice", "recall-state", "reload-chapter-checkpoint", "change-choice", "recall-growth-time", "compare-interpretations", "preserve-child-safety", "two-lessons"]
          CONTRACTS = ["必须含乌龟、小鸟、种子；不得含###、```、- ；20-200字", "必须含小鸟、种子；50-380字", "不得含最后、结局、唯一寓意；40-340字", "必须含种子；50-380字", "不得含一定自私、绝对错误、唯一正确；40-360字", "必须含乌龟、小鸟；50-380字", "必须含种、乌龟；15-200字", "必须含第三章；至少命中照料或幼苗或合作；不得含第四章、故事结束、唯一寓意；15-200字", "必须含乌龟、小鸟；15-200字", "至少命中幼苗、幼芽、小芽、种子或发芽之一，并含“天”或“日”的时间信息；10-200字", "必须含乌龟、小鸟；不得含唯一正确；30-360字", "不得含流血、死亡；40-360字", "不得含唯一、1.0、2.0、- 、###、```；30-300字"]
          CHECKS = [{"required": ["乌龟", "小鸟", "种子"], "required_any": [], "forbidden": ["###", "```", "- "], "min_runes": 20, "max_runes": 200}, {"required": ["小鸟", "种子"], "required_any": [], "forbidden": [], "min_runes": 50, "max_runes": 380}, {"required": [], "required_any": [], "forbidden": ["结局", "故事结束", "唯一寓意"], "min_runes": 40, "max_runes": 340}, {"required": [], "required_any": [["种子", "种皮", "幼苗", "幼芽", "小芽", "发芽"]], "forbidden": [], "min_runes": 50, "max_runes": 380}, {"required": [], "required_any": [], "forbidden": ["一定自私", "绝对错误", "唯一正确"], "min_runes": 40, "max_runes": 360}, {"required": ["乌龟", "小鸟"], "required_any": [], "forbidden": [], "min_runes": 50, "max_runes": 380}, {"required": ["种", "乌龟"], "required_any": [], "forbidden": [], "min_runes": 15, "max_runes": 200}, {"required": ["第三章"], "required_any": [["照料", "幼苗", "合作"]], "forbidden": ["第四章", "故事结束", "唯一寓意"], "min_runes": 15, "max_runes": 200}, {"required": ["乌龟", "小鸟"], "required_any": [], "forbidden": [], "min_runes": 15, "max_runes": 200}, {"required": [], "required_any": [["幼苗", "幼芽", "小芽", "种子", "发芽"], ["天", "日"]], "forbidden": [], "min_runes": 10, "max_runes": 200}, {"required": ["乌龟", "小鸟"], "required_any": [], "forbidden": ["唯一正确"], "min_runes": 30, "max_runes": 360}, {"required": [], "required_any": [], "forbidden": ["流血", "死亡"], "min_runes": 40, "max_runes": 360}, {"required": [], "required_any": [], "forbidden": ["唯一", "1.", "2.", "- ", "###", "```"], "min_runes": 30, "max_runes": 300}]
          RULES = "你是 `story-aesop` 的专属验收 Workflow，不是目标剧本角色。你负责伊索寓言的选择后果、延迟揭示、时间线、合作、儿童安全与不同启示。\n负向控制：在玩家要求揭示前提前写出后果，factuality 必须 fail；把单一寓意说成绝对真理、重复同一启示或使用危险惩罚，instruction_following 或 non_repetition 必须 fail。"
          PERSONA = ""
          JUDGE_DIMS = ["instruction_following", "continuity", "factuality", "non_repetition"]
          OFFSET = 0
          N = 13
          WHITESPACE = " \t\n\r　"
          PUNCT = "，。！？、；：“”‘’（）《》〈〉【】『』「」—…·～,.!?;:'\"()[]{}<>-_/\\|`~@#$%^&*+=·"
          DIGITS = {"０": "0", "１": "1", "２": "2", "３": "3", "４": "4", "５": "5", "６": "6", "７": "7", "８": "8", "９": "9", "零": "0", "一": "1", "二": "2", "三": "3", "四": "4", "五": "5", "六": "6", "七": "7", "八": "8", "九": "9"}
          def rune_count(text):
              n = 0
              for _ in text.codepoints():
                  n += 1
              return n

          def normalize(text, drop_punct):
              out = []
              for ch in text.codepoints():
                  if ch in WHITESPACE:
                      continue
                  if drop_punct and ch in PUNCT:
                      continue
                  if ch in DIGITS:
                      out.append(DIGITS[ch])
                      continue
                  out.append(ch.lower())
              return "".join(out)

          def is_sentinel(value):
              if value in ["```", "###", "-"]:
                  return True
              if len(value) < 2 or not value.endswith("."):
                  return False
              for ch in value[:-1].codepoints():
                  if ch not in "0123456789":
                      return False
              return True

          def forbidden_hit(text, needle):
              trimmed = needle.strip()
              if trimmed.endswith(":") or trimmed.endswith("："):
                  return normalize(trimmed, False) in normalize(text, False)
              normalized = normalize(needle, True)
              if normalized == "" or is_sentinel(trimmed):
                  return trimmed in text
              return normalized in normalize(text, True)

          def deterministic_failures(index, text):
              spec = CHECKS[index]
              failures = []
              plain = normalize(text, False)
              for fact in spec.get("required", []):
                  if normalize(fact, False) not in plain:
                      failures.append("required:" + fact)
              for group in spec.get("required_any", []):
                  found = False
                  for fact in group:
                      if normalize(fact, False) in plain:
                          found = True
                          break
                  if not found:
                      failures.append("required_any:" + "|".join(group))
              for fact in spec.get("forbidden", []):
                  if forbidden_hit(text, fact):
                      failures.append("forbidden:" + fact)
              count = rune_count(text)
              if spec.get("min_runes", 0) > 0 and count < spec["min_runes"]:
                  failures.append("min_runes:" + str(count) + "<" + str(spec["min_runes"]))
              if spec.get("max_runes", 0) > 0 and count > spec["max_runes"]:
                  failures.append("max_runes:" + str(count) + ">" + str(spec["max_runes"]))
              return failures

          def aligned_rounds(messages):
              # Returns [(index, request_text, reply_text)] aligned from the newest message
              # backwards so a truncated History window still maps later rounds correctly.
              users = []
              previous_assistant = ""
              for message in messages:
                  role = message.get("role", "")
                  content = message.get("content", "")
                  if role == "assistant":
                      previous_assistant = content
                  elif role == "user":
                      users.append((previous_assistant, content))
              rounds = []
              total = len(users)
              for position in range(total):
                  index = N - 1 - (total - 1 - position)
                  if index < 0:
                      continue
                  request = REQUESTS[index]
                  if request == "":
                      request = users[position][0]
                  rounds.append((index, request, users[position][1]))
              return rounds

          def output_index(messages):
              count = 0
              last = ""
              for message in messages:
                  if message.get("role", "") == "assistant":
                      count += 1
                      last = message.get("content", "").strip()
              index = count
              if last != "":
                  for j in range(N):
                      if REQUESTS[j] != "" and REQUESTS[j].strip() == last and j + 1 - OFFSET > index:
                          index = j + 1 - OFFSET
              return index

          def recent_transcript(messages, limit):
              lines = []
              for message in messages[-limit:]:
                  role = message.get("role", "")
                  label = "玩家" if role == "assistant" else "目标"
                  lines.append(label + "：" + message.get("content", "").strip())
              return "\n".join(lines)

          def run(input):
              messages = input["messages"]
              k = output_index(messages)
              request_index = k + OFFSET
              if request_index < N:
                  if REQUESTS[request_index] != "":
                      return {
                          "route": "scripted",
                          "message": REQUESTS[request_index],
                          "det": "",
                          "system": "你是测试脚手架。只回复 OK。",
                          "user": "OK",
                      }
                  system = "\n".join([
                      RULES,
                      "",
                      "现在你扮演模拟玩家。" + PERSONA,
                      "根据给定意图，只输出一句自然的玩家话语；不得回答它、不得添加对话中不存在的名字、数字、事件或证据，不得削弱意图约束，不得提及测试。只输出这句话，不要引号、前缀或解释。",
                  ])
                  user = "意图：" + INTENTS[request_index] + "\n\n最近对话：\n" + recent_transcript(messages, 6)
                  return {"route": "player", "message": "", "det": "", "system": system, "user": user}
              rounds = aligned_rounds(messages)
              failures = []
              blocks = []
              for round in rounds:
                  index = round[0]
                  for failure in deterministic_failures(index, round[2]):
                      failures.append(CHECKPOINTS[index] + " " + failure)
                  blocks.append("\n".join([
                      "【第" + str(index + 1) + "轮 " + CHECKPOINTS[index] + "】",
                      "契约：" + CONTRACTS[index],
                      "玩家：" + round[1],
                      "目标：" + round[2],
                  ]))
              system = "\n".join([
                  RULES,
                  "",
                  "这是最后一轮。你只看到完整对话记录：标注“玩家”的是测试方发出的消息，标注“目标”的是被测 Workflow 的回复。",
                  "请依据每一轮的契约逐轮判断以下维度：" + "、".join(JUDGE_DIMS) + "。确定性字数、关键词、顺序和延迟门槛由外部负责，你只判断语义：连续性、事实边界、指令遵循、不重复、玩家自主权和安全。",
                  "失败必须指出某一轮回复中的具体缺陷；不得因为风格偏好判坏语义合格的回复，也不得忽略契约暴露的事实边界。",
                  "先用不超过200字说明依据，最后一行只写 PASS 或 FAIL，不要其他字符。",
              ])
              user_parts = ["完整测试对话（按时间顺序，共 " + str(len(rounds)) + " 轮可见）：", ""] + blocks
              if len(failures) > 0:
                  user_parts.append("")
                  user_parts.append("确定性检查已发现失败（最终裁决将为 FAIL）：" + "；".join(failures))
              user_parts.append("")
              user_parts.append("请按规则裁决，最后一行只写 PASS 或 FAIL。")
              return {
                  "route": "judge",
                  "message": "",
                  "det": "；".join(failures),
                  "system": system,
                  "user": "\n".join(user_parts),
              }
        limits:
          max_execution_steps: 2000000
          timeout: 2s
          max_input_bytes: 1048576
          max_output_bytes: 262144
      - id: build-prompt
        type: prompt
        inputs:
          system:
            from: prompt-system
          user:
            from: prompt-user
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: '{system}'
        - role: user
          template: '{user}'
      - id: judge-model
        type: chat_model
        inputs:
          messages:
            from: judge-messages
        outputs:
          text: model-text
        model: story-aesop-test.model
        max_tokens: 512
        temperature: 0
      - id: finalize
        type: script
        inputs:
          route:
            from: tester-route
          message:
            from: tester-message
          det:
            from: tester-det
          model_text:
            from: model-text
        outputs:
          answer: answer
        language: starlark
        entrypoint: run
        source: |
          def verdict_from(text):
              lines = []
              for line in text.strip().split("\n"):
                  if line.strip() != "":
                      lines.append(line.strip())
              last = lines[-1] if len(lines) > 0 else ""
              if "PASS" in last and "FAIL" not in last:
                  return "PASS"
              if "FAIL" in last:
                  return "FAIL"
              if "PASS" in text and "FAIL" not in text:
                  return "PASS"
              return "FAIL"

          def run(input):
              route = input["route"]
              if route == "scripted":
                  return {"answer": input["message"]}
              if route == "player":
                  text = input["model_text"].strip()
                  first = text.split("\n")[0].strip().strip("“”\"'")
                  if first == "":
                      first = "请继续。"
                  return {"answer": first}
              if input["det"] != "":
                  return {"answer": "FAIL"}
              return {"answer": verdict_from(input["model_text"])}
        limits:
          max_execution_steps: 200000
          timeout: 500ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      edges:
      - from: start
        to: route-turn
      - from: route-turn
        to: build-prompt
      - from: build-prompt
        to: judge-model
      - from: judge-model
        to: finalize
      - from: finalize
        to: end
      branches: []
      outputs:
      - node: finalize
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
