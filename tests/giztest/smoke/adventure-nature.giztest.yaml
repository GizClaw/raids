    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: flowcraft_realtime_roundtrip_stop_probe
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_realtime_roundtrip_resume_workspace
  client: flowcraft
  timeout: 2m
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: eino_realtime_roundtrip_stop_probe
  client: eino
  rpc:
    method: server.run.stop
    request: {}
- id: eino_realtime_roundtrip_resume_workspace
  client: eino
  timeout: 2m
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_multi_role_register
  client: flowcraft_multi_role
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_multi_role_register
  client: eino_multi_role
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_multi_role_create_text
  client: flowcraft_multi_role
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_multi_role_text_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-adventure-nature-multi-role
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
