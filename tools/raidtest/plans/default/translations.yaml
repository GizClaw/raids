version: v1
name: default-translations
driver: translate
persona: 直接说出待翻译句子的普通用户，不要求解释。
# The deployed AST model is fixed and has known provider-side variability for
# names, places, numbers, times, and negation. These cases therefore qualify the
# speech-to-speech route with ten simple, unambiguous utterances per direction.
# Each utterance is long enough to cross speech-activity/VAD thresholds, while
# realtime output segments are aggregated until input EOS settles. Target
# language text, bounded output, and non-empty target audio remain release gates.
# Exact fact preservation for known model limitations remains diagnostic evidence
# rather than a Raids release gate.
cases:
  - id: ja-to-zh
    workflow_id: ast-translate-ja-zh
    turns:
      - {id: gratitude, user: "心からご親切に感謝いたします。", required_any: [[谢谢, 感谢]], scripts: [han], max_runes: 90}
      - {id: good-day, user: "今日が素晴らしい一日になりますように。", required_any: [[愉快, 美好, 开心, 顺利, 一天]], scripts: [han], max_runes: 90}
      - {id: farewell, user: "次回またお会いできるのを楽しみにしています。", required_any: [[再见, 再会, 下次, 见面, 再次]], scripts: [han], max_runes: 90}
      - {id: apology, user: "ご迷惑をおかけして本当に申し訳ありません。", required_any: [[抱歉, 对不起, 歉意]], scripts: [han], max_runes: 90}
      - {id: agreement, user: "私はこの計画に心から賛成しています。", required_any: [[同意, 赞同, 赞成]], scripts: [han], max_runes: 90}
      - {id: ready, user: "出発の準備ができているか教えてください。", required_any: [[准备好, 准备, 就绪]], scripts: [han], max_runes: 90}
      - {id: help, user: "この荷物を運ぶのを手伝っていただけますか。", required_any: [[帮助, 帮忙, 协助, 帮]], scripts: [han], max_runes: 90}
      - {id: welcome, user: "私たちの美しい町を訪れてくださり、心から歓迎いたします。", required_any: [[欢迎]], scripts: [han], max_runes: 90}
      - {id: congratulations, user: "ご成功を心からお祝い申し上げます。", required_any: [[恭喜, 祝贺, 庆祝]], scripts: [han], max_runes: 90}
      - {id: good-night, user: "今夜はゆっくり休んで良い夢を見てください。", required_any: [[晚安, 好梦, 休息]], scripts: [han], max_runes: 90}
  - id: ko-to-zh
    workflow_id: ast-translate-ko-zh
    turns:
      - {id: gratitude, user: "진심으로 친절한 도움에 감사드립니다.", required_any: [[谢谢, 感谢]], scripts: [han], max_runes: 90}
      - {id: good-day, user: "오늘이 멋진 하루가 되기를 바랍니다.", required_any: [[愉快, 美好, 开心, 顺利, 一天]], scripts: [han], max_runes: 90}
      - {id: farewell, user: "다음에 다시 만나기를 기대하겠습니다.", required_any: [[再见, 再会, 下次, 见面, 再次]], scripts: [han], max_runes: 90}
      - {id: apology, user: "불편을 드려 정말 죄송합니다.", required_any: [[抱歉, 对不起, 歉意]], scripts: [han], max_runes: 90}
      - {id: agreement, user: "저는 이 계획에 진심으로 동의합니다.", required_any: [[同意, 赞同, 赞成]], scripts: [han], max_runes: 90}
      - {id: ready, user: "출발할 준비가 되었는지 알려주세요.", required_any: [[准备好, 准备, 就绪]], scripts: [han], max_runes: 90}
      - {id: help, user: "이 짐을 옮기는 것을 도와주시겠어요.", required_any: [[帮助, 帮忙, 协助, 帮]], scripts: [han], max_runes: 90}
