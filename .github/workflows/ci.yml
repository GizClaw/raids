name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go for Starlark checks
        uses: actions/setup-go@v5
        with:
          go-version-file: scripts/test/starlark/go.mod
          cache-dependency-path: scripts/test/starlark/go.sum

      - name: Download GizClaw v0.18.12
        env:
          GIZCLAW_ASSET: gizclaw_0.18.12_amd64.deb
          GIZCLAW_SHA256: cd774a2b34f41f640faad15dd1aa40b1b42dda3982fcf0be5ae6bca153961767
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/$GIZCLAW_ASSET"
          root="$RUNNER_TEMP/gizclaw-v0.18.12"
          curl --fail --location --retry 3 \
            --output "$package" \
            "https://github.com/GizClaw/gizclaw/releases/download/v0.18.12/$GIZCLAW_ASSET"
          printf '%s  %s\n' "$GIZCLAW_SHA256" "$package" | sha256sum --check --status
          dpkg-deb --extract "$package" "$root"
          printf 'GIZCLAW=%s\n' "$root/usr/bin/gizclaw" >> "$GITHUB_ENV"

      - name: Validate Resources and Giztest documents
        run: make test-unit-resources

      - name: Check generated learn raid packages
        run: make test-unit-learn

      - name: Check catalog Voice invariants
        run: make test-unit-voices
