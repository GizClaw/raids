- id: flowcraft_multi_role_probe_lawyer
  client: flowcraft_multi_role
  timeout: 2m
  peer_stream:
    mode: text
    input: 我去问律师：遗嘱最近有没有修改？还有谁知道内容？
    idle_timeout: 90s
    require_text: true
