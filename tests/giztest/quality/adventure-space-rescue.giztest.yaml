# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of adventure-space-rescue,
# So that safety, correction, recall, routing and language regressions fail at the original gates.
version: gizclaw.test/v1alpha1
name: quality.adventure-space-rescue
clients:
  flowcraft__roles: &1
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino__roles: &2
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft__routing: *1
  eino__routing: *2
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_captain_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_engineer_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_navigator_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_medic_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_captain_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_engineer_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_navigator_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_medic_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_routing_workspace:
    direction: input
    type: string
    generate: token
  eino_routing_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 10m
steps:
- id: flowcraft__roles_register
  client: flowcraft__roles
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino__roles_register
  client: eino__roles
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft__routing_register
  client: flowcraft__routing
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino__routing_register
  client: eino__routing
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_roles_stop_create_narrator_workspace
  client: flowcraft__roles
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_roles_create_narrator_workspace
  client: flowcraft__roles
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_roles_narrator_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-adventure-space-rescue
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_roles_select_narrator_workspace
  client: flowcraft__roles
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_roles_narrator_workspace}"
- id: flowcraft_roles_warmup_narrator_workspace
  client: flowcraft__roles
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_roles_stop_create_narrator_workspace
  client: eino__roles
  rpc:
    method: server.run.stop
    request: {}
- id: eino_roles_create_narrator_workspace
  client: eino__roles
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_roles_narrator_workspace}"
      collection: raidtest-targets
      workflow_name: eino-adventure-space-rescue
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_roles_select_narrator_workspace
  client: eino__roles
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_roles_narrator_workspace}"
- id: eino_roles_warmup_narrator_workspace
  client: eino__roles
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_routing_stop
  client: flowcraft__routing
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_routing_create
  client: flowcraft__routing
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_routing_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-adventure-space-rescue
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_routing_select
  client: flowcraft__routing
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_routing_workspace}"
- id: flowcraft_routing_warmup
  client: flowcraft__routing
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_routing_stop
  client: eino__routing
  rpc:
    method: server.run.stop
    request: {}
- id: eino_routing_create
  client: eino__routing
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_routing_workspace}"
      collection: raidtest-targets
      workflow_name: eino-adventure-space-rescue
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_routing_select
  client: eino__routing
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_routing_workspace}"
- id: eino_routing_warmup
  client: eino__routing
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft__roles_keepalive_1
  client: flowcraft__roles
  rpc:
    method: server.run.status
    request: {}
- id: eino__roles_keepalive_1
  client: eino__roles
  rpc:
    method: server.run.status
    request: {}
- id: flowcraft__routing_keepalive_1
  client: flowcraft__routing
  rpc:
    method: server.run.status
    request: {}
- id: eino__routing_keepalive_1
  client: eino__routing
  rpc:
    method: server.run.status
    request: {}
- id: quality_round_1
  timeout: 2m
  parallel:
  - id: flowcraft_roles_probe_narrator
    client: flowcraft__roles
    peer_stream:
      mode: text
      input: 开始救援
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_roles_probe_narrator
    client: eino__roles
    peer_stream:
      mode: text
      input: 开始救援
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: flowcraft_routing_opening
    client: flowcraft__routing
    peer_stream:
      mode: text
      input: 开始救援
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_routing_opening
    client: eino__routing
    peer_stream:
      mode: text
      input: 开始救援
      idle_timeout: 90s
      require_text: true
      require_audio: true
  expect:
    "/flowcraft_roles_probe_narrator/text_eos":
      equals: true
    "/flowcraft_roles_probe_narrator/audio_eos":
      equals: true
    "/flowcraft_roles_probe_narrator/audio_bytes":
      minimum: 1
    "/flowcraft_roles_probe_narrator/first_text_ms":
      maximum: 6000
    "/flowcraft_roles_probe_narrator/first_audio_ms":
      maximum: 90000
    "/flowcraft_roles_probe_narrator/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/eino_roles_probe_narrator/text_eos":
      equals: true
    "/eino_roles_probe_narrator/audio_eos":
      equals: true
    "/eino_roles_probe_narrator/audio_bytes":
      minimum: 1
    "/eino_roles_probe_narrator/first_text_ms":
      maximum: 6000
    "/eino_roles_probe_narrator/first_audio_ms":
      maximum: 90000
    "/eino_roles_probe_narrator/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/flowcraft_routing_opening/text_eos":
      equals: true
    "/flowcraft_routing_opening/audio_eos":
      equals: true
    "/flowcraft_routing_opening/audio_bytes":
      minimum: 1
    "/flowcraft_routing_opening/first_text_ms":
      maximum: 6000
    "/flowcraft_routing_opening/first_audio_ms":
      maximum: 90000
    "/flowcraft_routing_opening/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/eino_routing_opening/text_eos":
      equals: true
    "/eino_routing_opening/audio_eos":
      equals: true
    "/eino_routing_opening/audio_bytes":
      minimum: 1
    "/eino_routing_opening/first_text_ms":
      maximum: 6000
    "/eino_routing_opening/first_audio_ms":
      maximum: 90000
    "/eino_routing_opening/text":
      not_contains:
      - 旁白说
      - 旁白：
