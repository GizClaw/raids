# workflows/story-water-margin/README.md: | 旁白 / 旁白, narrator | 1,2,3,4 | 只述可见事实、管理和转场，不代演 | `flowcraft-story-water-margin.storyteller` / `eino-story-water-margin.storyteller` | `flowcraft-story-water-margin.storyteller` / `eino-story-water-margin.storyteller` |
# workflows/story-water-margin/README.md: 角色表：narrator 旁白，只叙述可见事实和公开信息、不代演角色；lin-chong 林冲（别名 林冲/林教头/lin-chong），第1至4章在场，想讲清是非并保护无辜；清晰克制，第1章核对求助经过，第4章承担守约责任；lu-zhishen 鲁智深（别名 鲁智深/鲁提辖/lu-zhishen），第1至4章在场，想立即帮助弱者；憨厚直率，第1章提议先安置求助者，第3章劝阻冲动；wu-song 武松（别名 武松/wu-song），第2至3章在场，想辨清事实再行动；清爽坚定，第2章沿路核对目击线索，第3章提议先护送受困者再求助，之后外出护送；song-jiang 宋江（别名 宋江/宋公明/song-jiang），第3至4章在场，想协调伙伴承担责任；沉稳审慎，第3章比较各方公开说法并安排互助，第4章提出守信与不伤及无辜的约定。以上四章互动行动为本仓库基于经典的原创改编，并非原典逐字情节；历史、传说与改编须区分。所有角色只知亲历或已公开信息，不知他人私密想法及未来结果；每章比较至少两种立场，无需全员轮番发言。离场者只能由旁白说明去向，不跨地点代言。
# workflows/story-water-margin/README.md: 旧记忆中的角色名单按当前章节和角色表重新归一化，不覆盖旅程代号、更正和进度。开场、转场（含阻塞）、更正、安全管理优先旁白；其次按文本顺序选第一个明确点名且在场的角色，否定点名不触发，否则旁白。只报角色名或“我支持某人”是玩家选择。每轮一人直接第一人称发言，不加说话人标签，旁白不代演。
# workflows/story-water-margin/README.md: `routing-cases.json` 离线执行真实 JS / Starlark，覆盖点名、否定、顺序、章节出场、只报名字、管理优先、旧状态恢复与转场。离线门禁不等于在线音色验收；实际选中 Voice 仍需运行日志与试听确认。
version: gizclaw.test/v1alpha1
name: quality.story-water-margin
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
