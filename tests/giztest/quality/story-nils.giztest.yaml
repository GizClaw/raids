    require_audio: true
  expect:
    "/text":
      contains_all:
      - 第 2 章
      - 雁群协作
      not_contains:
      - 第 1 章
      pattern: 第 2 章[：:]\s*雁群协作[\s\S]{20,}[。！？]
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
