- id: flowcraft_transitions_opening_with_guidance
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 请从第一章开始《山海经》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_all:
      - 第 1 章
      - 图卷初开
      - 少年探险者
      - 灵兽向导
      - 进入下一章
      - 精卫
      - 夸父
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
- id: flowcraft_transitions_natural_consequence
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 请继续当前场景，推进一个直接结果。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 第 2 章
      - 神山迷雾
      min_length: 4
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
- id: flowcraft_transitions_character_perspective
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让少年探险者亲自回应当前结果，说出不同的立场。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 第 2 章
      - 神山迷雾
      min_length: 4
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
- id: flowcraft_transitions_reject_negated_choice
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 我先不选择，请让少年探险者说明为什么还不能进入第二章；只说明仍停留的当前章节。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_all:
      - 第 1 章
      - 图卷初开
      not_contains:
      - 第 2 章
      - 神山迷雾
      contains_any:
      - 图卷初开
      - 第一章
      - 第 1 章
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
- id: flowcraft_transitions_choice_prompts_next_chapter
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 去神山
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains: 下一章
      not_contains:
      - 第 2 章
      - 神山迷雾
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
