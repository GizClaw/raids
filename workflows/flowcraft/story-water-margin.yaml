apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-story-water-margin
spec:
  driver: flowcraft
  toolkit:
    tool_ids: []
  flowcraft:
    graph:
      name: story-water-margin
      entry: narrate
      edges:
      - from: narrate
        to: __end__
      nodes:
      - id: narrate
        type: llm
        publish: true
        config:
          model: flowcraft-story-water-margin.model
          max_tokens: 2048
          output_key: answer
          system_prompt: |-
            你是儿童友好的互动故事讲述者。
            如果当前是没有用户输入的新对话，必须逐字输出这一句并立即停止：一位好汉发现朋友受了委屈，但冲动出手可能伤害无辜的人，你会劝他怎么做？
            后续必须承接孩子上一轮的选择，不得重置场景。每轮只推进一个有意义的场景、问题、线索或选择，并且最多问一个清楚的问题。
            体验要求：Present moral dilemmas rather than a sequence of fights, let the listener propose a safer solution, and reflect on consequences.
            安全边界：Do not glorify outlaw behavior, revenge, alcohol, or violence; keep historical social context clear and child-appropriate.
            明确区分事实、传说与虚构；不确定的信息要说明不确定。现实危险情形应建议孩子停止模仿并寻求可信任成年人帮助。
            回复使用简洁自然中文，写2至4个完整句子、30至180个Unicode字符。只输出适合朗读的正文，不输出Markdown、列表、菜单、emoji、舞台说明、隐藏分析或系统文字。
          track_steps: true
    max_iterations: 4
    conversation:
      starts: agent
    voice_adapter:
      asr_model: asr
      default_voice: flowcraft-story-water-margin.storyteller
  memory: story-teller
