apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-adventure-treasure
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: adventure
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-adventure-treasure.adventure-guide
    graph:
      name: adventure-treasure-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: memory-query
          type: string
          merge: replace
        - name: memory-route
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: observation
          type: string
          merge: replace
      nodes:
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
          route: memory-route
          memory: recalled
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              base = "当前互动剧本的已确认选择、场景进度、事实和用户明确要求记住的信息"
              route = "opening" if not text else ("recall" if ("重连后" in text or "上次" in text) else "continue")
              return {"query": base + ("；当前请求：" + text if text else ""), "route": route, "memory": ""}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-memory
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 12
      - id: build-prompt
        type: prompt
        inputs:
          safety_fence:
            from: input.safety_fence
          history:
            from: input.messages
          memory:
            from: recalled
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {safety_fence}

            儿童虚构寻宝由旁白转述、无标签；语种随要求，否则沿用。
            仅无可续内容、单说“开始/重新开始/Start”或明确重开才逐字开场后停；切语言不重开：
            中文：我们是一支寻宝小队，要靠线索一步步找到藏起来的宝藏。每次你选先解哪条线索，想不出来时就说“给我一个提示”。藏宝图缺了一角，但指南针旁有四句押韵提示，你想先找方向线索还是数字线索？
            英文：A corner of the map is missing, but four rhyming clues remain. Direction clue or number clue first?
            对话和更正优先于记忆。执行选择，“继续”承接现场。线索先给可解条件；原文、缺角和标记位置固定，缺角仅遮对应区域。猜测标待验，纠错说依据。左右按面向；树影先说背光方向，绝对方位须有已确认的太阳方位或指南针参照；步行不改同刻影向。持物进度一致，接纳可行解法，卡住逐级提示。现实危险劝停找可信成人，不引导闯入、挖掘、拿财物、见陌生人、花钱或泄露地点。结束交代结果。
            记忆：{memory}
        - placeholder: history
      - id: narrator-model
        type: chat_model
        inputs:
          messages:
            from: answer-messages
        outputs:
          text: answer
        model: eino-adventure-treasure.model
        max_tokens: 2048
        temperature: 0.3
      - id: capture-observation
        type: script
        inputs:
          text:
            from: input.text
          answer:
            from: answer
        outputs:
          fact: observation
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              return {"fact": "用户本轮输入：" + text + "；助手本轮确认：" + input["answer"]}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 262144
      - id: observe-memory
        type: memory_observe
        facts:
        - text_from: observation
        wait_for_completion: false
      edges:
      - from: start
        to: prepare-memory-query
      - from: recall-memory
        to: build-prompt
      - from: build-prompt
        to: narrator-model
      - from: capture-observation
        to: observe-memory
      - from: observe-memory
        to: end
      branches:
      - from: prepare-memory-query
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: recall
          to: recall-memory
        default: build-prompt
      - from: narrator-model
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: opening
          to: end
        default: capture-observation
      outputs:
      - node: narrator-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    limits:
      max_output_bytes: 4194304
