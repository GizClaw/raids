# User Story:
# As a Raids catalog maintainer,
# I want to drive `uzero-03001-battle-command` through the scripted `h106-battle-command` / `battle-command-contract` turns over text input,
# So that the deterministic keyword, length, script, and latency gates run as one isolated declarative task.
version: gizclaw.test/v1alpha1
name: h106.uzero-03001-battle-command.battle-command-contract
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  workspace_name:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 11m
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: ${registration_token}
- id: create_workspace
  client: peer
  rpc:
    method: server.workspace.create
    request:
      name: ${workspace_name}
      collection: assistants
      workflow_name: uzero-03001-battle-command
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_workspace
  client: peer
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: ${workspace_name}
- id: turn_1_establish-mission
  client: peer
  timeout: 2m
  peer_stream:
    mode: text
    input: 我们在虚构的蓝环星进行救援演习，先记住地点。
    require_text: true
  expect:
    /text:
      contains_all:
      - 蓝环星
      min_length: 24
      max_length: 180
- id: turn_2_civilian-first
  client: peer
  timeout: 2m
  peer_stream:
    mode: text
    input: 如果居民还没撤离，第一步应该做什么？
    require_text: true
  expect:
    /text:
      min_length: 20
      max_length: 150
- id: turn_3_safe-summary
  client: peer
  timeout: 2m
  peer_stream:
    mode: text
    input: 不要教我现实武器，用三步总结蓝环星的模拟方案。
    require_text: true
  expect:
    /text:
      contains_all:
      - 蓝环星
      min_length: 30
      max_length: 190
finally:
- id: stop_run
  client: peer
  rpc:
    method: server.run.stop
    request: {}
- id: delete_workspace
  client: peer
  rpc:
    method: server.workspace.delete
    request:
      name: ${workspace_name}
- id: delete_peer
  client: peer
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
