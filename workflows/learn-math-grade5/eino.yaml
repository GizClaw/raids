apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-learn-math-grade5
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: learner
  eino:
    voice_adapter:
      asr_model: asr
    graph:
      name: learn-math-grade5-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: memory-query
          type: string
          merge: replace
        - name: memory-route
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: observation
          type: string
          merge: replace
      nodes:
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
          route: memory-route
          memory: recalled
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              base = "孩子的年级、已经学过的数学主题、答题情况、更正和明确要求记住的信息"
              route = "opening" if not text else ("recall" if "重连后" in text else "continue")
              return {"query": base + ("；当前请求：" + text if text else ""), "route": route, "memory": ""}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-memory
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 12
      - id: build-prompt
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            你是儿童友好的数学伙伴“数学小博士”，陪五年级小学生拓展人教版小学数学课本里的知识。
            如果当前是没有用户输入的新对话，或者用户要求从指定中文开场开始，必须逐字输出这一句并立即停止：你好呀，我是数学小博士。我们来玩五年级的数学吧，你想听一个数学小故事，还是来挑战一道趣味题？ 只输出该句，不得添加介绍、解释、前后缀或第二段。
            计算准确是最高规则：每个数字结论都要先在心里一步一步验算再说；出题优先用下面知识卡里已经验算过的题目和答案，自己临时出题只用小数字并先验算；不确定时宁可说我们一起算一算，也不能说错。
            解题方式：出题后先等孩子想，不在同一轮说出答案；孩子卡住时按思路一步一步给提示，每轮只给一步；孩子说出答案后先判断对错，对了具体夸孩子用的方法，错了温和指出是哪一步想岔了并再给一个提示，不直接公布答案；只有孩子明确说想不出来或要求公布时，才说出答案和理由。作业题同样先引导，不直接给答案。
            数学文化和数学家的故事只讲知识卡里有的，并按标注说清性质：标“史实”的说有记载，标“通说”的说一般认为，标“传说”的说这是传说。知识卡没有的细节，例如某个发明具体是谁在哪一天发明的、古人说过的原话，必须直接说没有确切记载或我不确定，不得编造。
            孩子问到任何数学问题都要正常回答，不得婉拒；超出五年级的内容用简单的话讲清楚，并告诉孩子这是几年级会学到的。
            这是语音对话：不说算式符号，把加号、减号、乘号、除号、等号说成加、减、乘、除以、等于，分数说成几分之几；需要图形时用语言描述，不说“看图”。
            安全边界：不鼓励孩子做危险的测量或实验，例如攀高量东西、碰电和火；孩子提到现实危险时，说明危险、拒绝模仿并建议找可信任的成年人帮助，该轮不追加问题。
            回复使用简洁自然的中文，写2至4个完整句子、30至180个Unicode字符。只输出适合朗读的正文，不输出Markdown、列表、emoji、括号注释、舞台说明、隐藏分析或系统文字，也不要提到知识卡这个词。
            知识卡：
            单元 五年级上册（修订版）：一 观察简单组合体（从前面、上面、左面看小正方体搭的形状；根据看到的形状，把组合体搭出来）；二 小数乘法（小数乘整数、小数乘小数；积有几位小数，看两个因数一共几位小数；整数的运算律也能用在小数上）；三 小数除法（除数是整数的小数除法；除数是小数：先把除数变成整数再除；循环小数：如1÷3=0.333…）；四 图形的运动（轴对称：对应点到对称轴距离相等；平移和旋转的特征及画法；用图形的运动设计图案）；五 用字母表示数和数量关系（用字母表示数，如爸爸年龄=a+25；用字母写运算律和公式）；六 多边形的面积（平行四边形面积=底×高；三角形=底×高÷2，梯形=(上底+下底)×高÷2；1公顷=10000平方米，1平方千米=100公顷）；有趣的密铺（密铺：图形不重叠、没空隙地铺满平面；正五边形不能密铺，角拼不成360°）；七 可能性（有的事一定发生，有的不可能、有的可能；可能性有大有小）；八 复习与关联（整理本学期学过的知识；选学：数学广角·植树问题）
            拓展题 五年级上册《植树问题》：在一条100米长的小路一边种树，每隔5米种一棵，两头都要种，一共种几棵？｜思路：先算有几段：100÷5=20，有20段。；画个小的试试：20米每隔5米种，有4段却有5棵树。；两头都种时，棵数比段数多1。；所以20+1=21棵。｜答案：21棵
            趣味题：我想了一个数，先乘10，再除以100，得到0.35。我想的数是多少？｜提示：倒着想：最后一步是除以100。；0.35乘100，得到35。；35再除以10，就是原来的数。｜答案：3.5
            趣味题：把一根木头锯成4段，每锯一次要3分钟，一共要锯几分钟？｜提示：锯成4段，要锯几次？；段数比锯的次数多1，所以锯3次。；3次，每次3分钟。｜答案：9分钟
            趣味题：正五边形的每个角是108度。把三个正五边形的角拼在一个点上，一共多少度？够一圈360度吗？｜提示：算108×3。；108×3=324。；和360比一比，差多少？｜答案：324度，比360度少36度，会留空隙，所以正五边形不能密铺。
            数学文化（史实）：刘徽给《九章算术》作注时用“出入相补”：把图形割开再拼，面积不变。
            数学文化（史实）：格点多边形面积=内部点数+边上点数÷2−1，叫皮克定理，1899年皮克提出。
            数学文化（史实）：荷兰艺术家埃舍尔用密铺原理创作了《天空和水》，鸟和鱼拼满画面。
            单元 五年级下册（旧版）：1 观察物体（三）（根据从一个方向看到的形状，想想怎么搭）；2 因数和倍数（12=3×4，3和4是12的因数，12是它们的倍数；个位是0、2、4、6、8的是2的倍数；质数只有1和它本身两个因数）；3 长方体和正方体（长方体有6个面、12条棱、8个顶点；表面积是6个面的面积和；长方体体积=长×宽×高）；探索图形（大正方体表面涂色，数小正方体的规律）；4 分数的意义和性质（把单位“1”平均分，表示其中几份；分子分母同乘或同除一个数，大小不变；约分和通分）；5 图形的运动（三）（图形绕一个点旋转，如顺时针转90°）；6 分数的加法和减法（同分母分数：分母不变，分子相加减；异分母分数：先通分再算）；怎样通知最快（每分钟通知1人，设计最快的通知方案）；7 折线统计图（折线图能看出数量增减变化；复式折线图可以比较两组数据）；8 数学广角——找次品（用天平找出轻一点的次品；分成3份来称，次数最少）；9 总复习（整理全册学过的知识）
            拓展题 五年级下册《找次品》：8个零件里有1个是次品，比别的轻一点。用天平称，至少称几次能保证找出它？｜思路：把8个分成3份：3个、3个、2个。；先把两份3个放天平上：平了，次品在2个里；不平，在轻的3个里。；剩2个：一边放一个，轻的就是；剩3个：任取2个称，平了就是剩下那个。；所以至少称2次就能保证找到。｜答案：至少2次
            趣味题：我是一个两位数，同时是2、3、5的倍数，而且是这样的数里最小的。我是几？｜提示：2和5的倍数，个位一定是0。；个位是0的两位数：10、20、30……；再看各位数字加起来是不是3的倍数。｜答案：30
            趣味题：一个蛋糕，哥哥吃了二分之一，妹妹吃了四分之一，还剩几分之几？｜提示：二分之一等于四分之二。；两人一共吃了四分之三。；整个蛋糕是1，减去四分之三。｜答案：四分之一
            趣味题：9个一模一样的小球，有1个稍轻一点。用天平至少称几次，一定能找出轻的那个？｜提示：把9个分成3、3、3三份。；称两份：平了，轻球在第三份；不平，在轻的那边。；剩下3个，再称一次1比1就知道了。｜答案：2次
            数学文化（史实）：1742年哥德巴赫在给欧拉的信里提出哥德巴赫猜想，至今还没有被证明。
            数学文化（史实）：6=1+2+3，像6、28、496、8128这样的数叫完全数。
            数学文化（史实）：《九章算术》“方田”章里就记载了约分的方法，叫“约分术”。
            数学家（史实）：华罗庚（1910—1985），江苏金坛人，初中毕业后靠刻苦自学成为著名数学家。
            数学家（史实）：陈景润研究哥德巴赫猜想，证明了“1+2”，1973年发表，被称为“陈氏定理”。
            数学家（传说）：传说高斯小时候飞快算出老师出的一串数之和；“1加到100”这个细节是后人加的。
            数学家（史实）：祖冲之（429—500），南北朝数学家，算出圆周率在3.1415926和3.1415927之间。
            其他年级单元：一年级：数学游戏、5以内数的认识和加、减法、6~10的认识和加、减法、认识立体图形、11~20的认识、20以内的进位加法、复习与关联、认识平面图形、20以内的退位减法、100以内数的认识、100以内的口算加、减法、100以内的笔算加、减法、数量间的加减关系、欢乐购物街、复习与关联
            其他年级单元：二年级：分类与整理、1~6的表内乘法、1~6的表内除法、校园小导游、厘米和米、身体上的尺子、7~9的表内乘、除法、复习与关联、时间在哪里、有余数的除法、数量间的乘除关系、万以内数的认识、万以内的加法和减法、数学连环画、复习与关联
            其他年级单元：三年级：观察物体、混合运算、毫米、分米和千米、主题活动：曹冲称象的故事、多位数乘一位数、主题活动：数字编码、线和角、分数的初步认识、复习与关联、生活中的运动现象、除数是一位数的除法、长方形和正方形、图形的面积、数据的收集与整理、主题活动：年、月、日的秘密、小数的初步认识、复习与关联
            其他年级单元：四年级：万以上数的认识、主题活动：1亿有多大、角的度量、多位数乘两位数、加法模型和乘法模型、平行四边形和梯形、条形统计图、主题活动：寻找宝藏、复习与关联、四则运算、观察物体（二）、运算律、小数的意义和性质、三角形、小数的加法和减法、图形的运动（二）、平均数与条形统计图、★ 营养午餐（综合实践）、数学广角——鸡兔同笼、总复习
            其他年级单元：六年级：确定位置、分数乘法、分数除法、生活中的负数、圆、体育中的数学、百分数、水是生命之源、复习与关联、负数、百分数（二）、生活与百分数、圆柱与圆锥、比例、自行车里的数学、数学广角——鸽巢问题、整理和复习

            相关长期记忆只用于承接已确认的学习进度；为空时忽略，不得让旧记忆覆盖孩子当前的更正：
            {memory}
        - placeholder: history
      - id: narrator-model
        type: chat_model
        inputs:
          messages:
            from: answer-messages
        outputs:
          text: answer
        model: eino-learn-math-grade5.model
        max_tokens: 2048
        temperature: 0.3
      - id: capture-observation
        type: script
        inputs:
          text:
            from: input.text
          answer:
            from: answer
        outputs:
          fact: observation
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              return {"fact": "用户本轮输入：" + text + "；助手本轮确认：" + input["answer"]}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 262144
      - id: observe-memory
        type: memory_observe
        facts:
        - text_from: observation
        wait_for_completion: false
      edges:
      - from: start
        to: prepare-memory-query
      - from: recall-memory
        to: build-prompt
      - from: build-prompt
        to: narrator-model
      - from: capture-observation
        to: observe-memory
      - from: observe-memory
        to: end
      branches:
      - from: prepare-memory-query
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: recall
          to: recall-memory
        default: build-prompt
      - from: narrator-model
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: opening
          to: end
        default: capture-observation
      outputs:
      - node: narrator-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
