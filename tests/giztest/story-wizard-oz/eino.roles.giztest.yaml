# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for eino-story-wizard-oz,
# So that every reachable role path produces text and non-empty synthesized audio.
version: gizclaw.test/v1alpha1
name: story-wizard-oz.eino.roles
clients:
  narrator:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  dorothy:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  scarecrow:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  tin-man:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  lion:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  glinda:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  narrator_workspace:
    direction: input
    type: string
    generate: token
  dorothy_workspace:
    direction: input
    type: string
    generate: token
  scarecrow_workspace:
    direction: input
    type: string
    generate: token
  tin_man_workspace:
    direction: input
    type: string
    generate: token
  lion_workspace:
    direction: input
    type: string
    generate: token
  glinda_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 60m
steps:
- id: register_narrator
  client: narrator
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: "${narrator_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-wizard-oz
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${narrator_workspace}"
- id: warmup_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_dorothy
  client: dorothy
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_dorothy_workspace
  client: dorothy
  rpc:
    method: server.workspace.create
    request:
      name: "${dorothy_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-wizard-oz
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_dorothy_workspace
  client: dorothy
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${dorothy_workspace}"
- id: warmup_dorothy_workspace
  client: dorothy
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_scarecrow
  client: scarecrow
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_scarecrow_workspace
  client: scarecrow
  rpc:
