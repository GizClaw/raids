# workflows/adventure-space-rescue/README.md: 这是儿童互动冒险的原创配角安排。按场景出场，不让所有人物同时在场；角色不能获知未来场景、私密信息或未验证的结果。每轮仍只发声一次。
# workflows/adventure-space-rescue/README.md: 场景1“恢复通信”：救援队长：比较安全方案并让玩家决定，不自行执行救援。
# workflows/adventure-space-rescue/README.md: 场景2“校准能源”：救援队长：比较安全方案并让玩家决定，不自行执行救援。；工程师：解释已确认的能源与备用电池约束，不编造消耗数字。
# workflows/adventure-space-rescue/README.md: 场景3“准备安全会合”：救援队长：比较安全方案并让玩家决定，不自行执行救援。；工程师：解释已确认的能源与备用电池约束，不编造消耗数字。；领航员：比较安全窗口和会合条件，不擅自宣布已经对接。；医护员：核对已公开人员状态与生命保障，不把牺牲当英雄选择。
# workflows/adventure-space-rescue/README.md: 明确点名例如“请让救援队长说说”才请求角色说话；只报名字或支持某人仍是玩家选项，由旁白承接。多人按文本顺序只选第一个在场且未被否定者。开场、转场、更正、安全、结论由旁白负责；旁白不代演角色，不加“旁白说”“旁白：”等说话人标签。严格开场结束后，下一次探索才简短介绍在场角色及点名玩法。
# workflows/adventure-space-rescue/README.md: 点名示例：`请让救援队长说说`；否定示例：`不要让救援队长说话，请让工程师回应`；多人示例：`请让救援队长说说，再让工程师回应`。仅选择首位在场且未被否定的角色。只说 `救援队长` 仍算玩家选择，不切换人物声线。可说 `进入校准能源` 探索下一地点；转场旁白说明角色的具体行动，未到场角色不能提前回答。旧记忆恢复后从场景重建 `active_roles`，保留原事实和更正。
# workflows/adventure-space-rescue/README.md: 新增 `flowcraft.roles.giztest.yaml` 与 `eino.roles.giztest.yaml`，每引擎 5 个隔离 Workspace；完整探针检查 text/audio EOS、audio_bytes > 0，first_response 保持文本 2s / 音频 3s。后续角色先进入对应场景。`routing-cases.json` 同时执行两引擎真实脚本。原 relay/realtime 的固定中英文开场、事实、安全、记忆和 reload 契约保留。离线验证不代表实际音色试听或供应商权限验收。
# workflows/adventure-space-rescue/README.md: 阶段式实现保留 `route-phase` / `route-stage` 的权威阶段判断，以及开场、更正、挑战评估、结论的旁白路径。角色输出仍汇入原 `reduce-state`；角色探针先完成原有调查或移动前置动作，再确认所在阶段。场景请求不能代替证据检查、解谜或执行救援。
version: gizclaw.test/v1alpha1
name: quality.adventure-space-rescue
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
