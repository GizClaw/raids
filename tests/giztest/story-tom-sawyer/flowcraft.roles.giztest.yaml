# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for flowcraft-story-tom-sawyer,
# So that every reachable role path produces text and non-empty synthesized audio.
version: gizclaw.test/v1alpha1
name: story-tom-sawyer.flowcraft.roles
clients:
  narrator: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  tom: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  becky: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
  narrator_workspace: {direction: input, type: string, generate: token}
  tom_workspace: {direction: input, type: string, generate: token}
  becky_workspace: {direction: input, type: string, generate: token}
repeat: 1
timeout: 12m
steps:
- id: register_narrator
  client: narrator
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: ${narrator_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-tom-sawyer
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${narrator_workspace}"}}
- id: warmup_narrator_workspace
  client: narrator
  rpc: {method: server.run.workspace.reload, request: {}}
  timeout: 2m
- id: register_tom
  client: tom
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_tom_workspace
  client: tom
  rpc:
    method: server.workspace.create
    request:
      name: ${tom_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-tom-sawyer
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_tom_workspace
  client: tom
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${tom_workspace}"}}
- id: warmup_tom_workspace
  client: tom
  rpc: {method: server.run.workspace.reload, request: {}}
  timeout: 2m
- id: register_becky
  client: becky
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_becky_workspace
  client: becky
  rpc:
    method: server.workspace.create
    request:
      name: ${becky_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-tom-sawyer
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_becky_workspace
  client: becky
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${becky_workspace}"}}
- id: warmup_becky_workspace
  client: becky
  rpc: {method: server.run.workspace.reload, request: {}}
  timeout: 2m
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: "请由旁白承接当前故事，只推进一个可见线索。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 旁白}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: reject_premature_chapter_two
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: "请直接进入第二章；如果条件不足，只说明仍停留的当前章节。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_all:
      - "第 1 章"
      - "河边地图"
      not_contains:
      - "第 2 章"
      - "承诺冲突"
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_narrator_first_response
  client: narrator
  timeout: 15s
  peer_stream:
    mode: text
    input: "请直接进入第二章；如果条件不足，只说明仍停留的当前章节。"
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    /events: {non_empty: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 2000}
    /first_audio_ms: {maximum: 3000}
- id: probe_tom
  client: tom
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让汤姆亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 汤姆}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_tom_first_response
  client: tom
  timeout: 15s
  peer_stream:
    mode: text
    input: "请让汤姆亲自回应，只说这个角色知道的事。"
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    /events: {non_empty: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 2000}
    /first_audio_ms: {maximum: 3000}
- id: probe_becky
  client: becky
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让贝琪亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 贝琪}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_becky_first_response
  client: becky
  timeout: 15s
  peer_stream:
    mode: text
    input: "请让贝琪亲自回应，只说这个角色知道的事。"
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    /events: {non_empty: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 2000}
    /first_audio_ms: {maximum: 3000}
finally:
- id: stop_narrator_run
  client: narrator
  rpc: {method: server.run.stop, request: {}}
- id: delete_narrator_workspace
  client: narrator
  rpc: {method: server.workspace.delete, request: {name: "${narrator_workspace}"}}
- id: delete_narrator_peer
  client: narrator
  rpc: {method: server.peer.delete, request: {}}
- id: stop_tom_run
  client: tom
  rpc: {method: server.run.stop, request: {}}
- id: delete_tom_workspace
  client: tom
  rpc: {method: server.workspace.delete, request: {name: "${tom_workspace}"}}
- id: delete_tom_peer
  client: tom
  rpc: {method: server.peer.delete, request: {}}
- id: stop_becky_run
  client: becky
  rpc: {method: server.run.stop, request: {}}
- id: delete_becky_workspace
  client: becky
  rpc: {method: server.workspace.delete, request: {name: "${becky_workspace}"}}
- id: delete_becky_peer
  client: becky
  rpc: {method: server.peer.delete, request: {}}
report:
  redact: [registration_token]
