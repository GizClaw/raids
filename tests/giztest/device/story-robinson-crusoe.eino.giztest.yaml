# User Story:
# As a child entering a story or adventure on the H106 device,
# I want every reply to end with a question, "继续" to carry the story on, and "继续上次的内容" / "开始" to resume or restart,
# So that the story never stops in silence after a chapter ends.
# Generated by scripts/test/device-flow.rb; edit the generator, not this file.
version: gizclaw.test/v1alpha1
name: story-robinson-crusoe.device.eino
clients:
  eino:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  workspace:
    direction: input
    type: string
    generate: token
  last_history_type:
    direction: output
    type: string
  last_history_text:
    direction: output
    type: string
repeat: 1
timeout: 30m
steps:
- id: eino_device_register
  client: eino
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_device_create_workspace
  client: eino
  rpc:
    method: server.workspace.create
    request:
      name: "${workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-robinson-crusoe
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_device_select_workspace
  client: eino
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${workspace}"
- id: eino_device_warmup_workspace
  client: eino
  timeout: 2m
  rpc:
    method: server.run.workspace.reload
    request: {}
- timeout: 4m
  id: eino_device_start
  client: eino
  peer_stream:
    mode: text
    input: 开始
    idle_timeout: 120s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/text":
      min_length: 20
      pattern: "[？?][^？?]{0,40}$"
      contains_all:
      - 第 1 章
      - 退潮物资
- timeout: 4m
  id: eino_device_chapter_choice
  client: eino
  peer_stream:
    mode: text
    input: 我选第一个
    idle_timeout: 120s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/text":
      min_length: 20
      pattern: "[？?][^？?]{0,40}$"
- timeout: 4m
  id: eino_device_continue
  client: eino
  peer_stream:
    mode: text
    input: 继续
    idle_timeout: 120s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/text":
      min_length: 20
      pattern: "[？?][^？?]{0,40}$"
- timeout: 4m
  id: eino_device_next_chapter
  client: eino
  peer_stream:
    mode: text
    input: 进入下一章
    idle_timeout: 120s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/text":
      min_length: 20
      pattern: "[？?][^？?]{0,40}$"
      contains_all:
      - 第 2 章
      - 荒岛营地
- id: eino_device_leave
  client: eino
  rpc:
    method: server.run.stop
    request: {}
- id: eino_device_reenter
  client: eino
  timeout: 2m
  rpc:
    method: server.run.workspace.reload
    request: {}
- timeout: 4m
  id: eino_device_resume
  client: eino
  peer_stream:
    mode: text
    input: 继续上次的内容
    idle_timeout: 120s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/text":
      min_length: 20
      pattern: "[？?][^？?]{0,40}$"
      not_contains:
      - 第 1 章
      - 你可以直接说出你的选择
      contains: 荒岛营地
- timeout: 4m
  id: eino_device_restart
  client: eino
  peer_stream:
    mode: text
    input: 开始
    idle_timeout: 120s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/text":
      min_length: 20
      pattern: "[？?][^？?]{0,40}$"
      contains_all:
      - 第 1 章
      - 退潮物资
finally:
- id: eino_device_read_last_history
  client: eino
  timeout: 5s
  rpc:
    method: server.run.workspace.history
    request:
      limit: 1
      order: PEER_RUN_HISTORY_LIST_REQUEST_ORDER_DESC
  capture:
    last_history_text: "/items/0/text"
    last_history_type: "/items/0/type"
- id: eino_device_last_history_type_emit
  output:
    variable: last_history_type
- id: eino_device_last_history_text_emit
  output:
    variable: last_history_text
- id: eino_device_stop_run
  client: eino
  rpc:
    method: server.run.stop
    request: {}
- id: eino_device_delete_workspace
  client: eino
  rpc:
    method: server.workspace.delete
    request:
      name: "${workspace}"
- id: eino_device_delete_peer
  client: eino
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
