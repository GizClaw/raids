# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of story-chu-han,
# So that safety, correction, recall, routing and language regressions fail at the original gates.
version: gizclaw.test/v1alpha1
name: quality.story-chu-han
clients:
  flowcraft__transitions: &1
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino__transitions: &2
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft__roles: *1
  eino__roles: *2
  flowcraft__routing: *1
  eino__routing: *2
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_transitions_workspace:
    direction: input
    type: string
    generate: token
  eino_transitions_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_xiang_yu_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_empress_lu_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_liu_bang_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_zhang_liang_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_xiang_yu_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_empress_lu_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_liu_bang_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_zhang_liang_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_routing_workspace:
    direction: input
    type: string
    generate: token
  eino_routing_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 10m
steps:
- id: flowcraft__transitions_register
  client: flowcraft__transitions
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino__transitions_register
  client: eino__transitions
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft__roles_register
  client: flowcraft__roles
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino__roles_register
  client: eino__roles
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft__routing_register
  client: flowcraft__routing
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino__routing_register
  client: eino__routing
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_transitions_stop_create_workspace
  client: flowcraft__transitions
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_transitions_create_workspace
  client: flowcraft__transitions
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_transitions_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-chu-han
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_transitions_select_workspace
  client: flowcraft__transitions
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_transitions_workspace}"
- id: flowcraft_transitions_warmup_workspace
  client: flowcraft__transitions
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_transitions_stop_create_workspace
  client: eino__transitions
  rpc:
    method: server.run.stop
    request: {}
- id: eino_transitions_create_workspace
  client: eino__transitions
