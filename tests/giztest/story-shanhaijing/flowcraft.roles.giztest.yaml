    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_spirit-guide_first_response
  client: spirit-guide
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让灵兽向导亲自回应，只说这个角色知道的事。
    completion: first_response
