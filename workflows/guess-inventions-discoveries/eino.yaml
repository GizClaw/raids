, "en": "light bulb", "aliases": ["电灯泡", "灯泡", "白炽灯"], "profile": "通电后会发光的灯，让人们在夜晚也能像白天一样看书、工作。", "hints": ["它要用电", "它和光有关", "它常挂在天花板上"]}, {"zh": "电视", "en": "television", "aliases": ["电视机", "TV"], "profile": "能接收节目信号、把声音和活动的画面同时放出来的机器。", "hints": ["它要用电", "它有一块屏幕", "它能播放动画片"]}, {"zh": "牙刷", "en": "toothbrush", "aliases": [], "profile": "一头带着一排排细毛的小刷子，每天早晚用它清洁牙齿。", "hints": ["它是一种日常用品", "它早晚都要用", "它和牙齿有关"]}, {"zh": "电话", "en": "telephone", "aliases": ["固定电话", "座机"], "profile": "能把说话的声音变成电信号传到远方，让相隔很远的人对着说话。", "hints": ["它和声音有关", "它要用电", "它能让远方的人聊天"]}, {"zh": "自行车", "en": "bicycle", "aliases": ["单车", "脚踏车", "bike"], "profile": "两个轮子一前一后，人坐在上面用脚蹬踏板就能骑着前进的交通工具。", "hints": ["它和交通有关", "它靠人的力气前进", "它有两个轮子"]}, {"zh": "汽车", "en": "car", "aliases": ["小汽车", "轿车"], "profile": "靠发动机带动、在马路上跑的交通工具，能载人也能运货。", "hints": ["它是一种交通工具", "它在马路上跑", "它通常有四个轮子"]}, {"zh": "飞机", "en": "airplane", "aliases": ["aeroplane"], "profile": "有翅膀、靠发动机推动在天上飞的交通工具，能载人飞过高山大海。", "hints": ["它是一种交通工具", "它比汽车跑得快", "它能飞上天"]}, {"zh": "火车", "en": "train", "aliases": ["列车"], "profile": "由车头拉着一节节车厢、沿着铁轨行驶的交通工具，能运很多人和货物。", "hints": ["它是一种交通工具", "它特别长", "它只在铁轨上跑"]}, {"zh": "冰箱", "en": "refrigerator", "aliases": ["电冰箱", "fridge"], "profile": "能让里面一直保持低温的柜子，把食物放进去就不容易变坏。", "hints": ["它要用电", "它常放在厨房里", "它里面总是很冷"]}, {"zh": "雨伞", "en": "umbrella", "aliases": ["伞"], "profile": "下雨时撑开挡雨、晴天还能遮太阳的工具，不用时可以收起来。", "hints": ["它是一种日常用品", "它可以收起来", "它和下雨天有关"]}, {"zh": "手机", "en": "mobile phone", "aliases": ["移动电话", "智能手机", "cell phone", "cellphone"], "profile": "可以随身带着走、不用电线就能打电话的小机器，现在还能拍照上网。", "hints": ["它要用电", "它可以装进口袋", "它能随时和别人通话"]}, {"zh": "红绿灯", "en": "traffic light", "aliases": ["交通信号灯", "信号灯"], "profile": "路口用红、黄、绿三种颜色的灯指挥车辆和行人，红灯停，绿灯行。", "hints": ["它和交通有关", "它会变颜色", "它常站在路口"]}, {"zh": "剪刀", "en": "scissors", "aliases": ["剪子"], "profile": "两片刀刃交叉装在一起、一开一合就能剪开纸和布的工具。", "hints": ["它是一种工具", "它能一开一合", "它能把纸分成两半"]}, {"zh": "风筝", "en": "kite", "aliases": ["纸鸢"], "profile": "用竹条和纸或布扎成、拴着长线借着风力飞上天空的玩具。", "hints": ["它是一种玩具", "它喜欢