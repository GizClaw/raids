version: v1
name: default-assistant-doubao
driver: realtime
persona: 使用实时语音助手安排就诊的普通用户，连续补充并纠正事实，要求即时短答、精确措辞和重连后的会话连续性。
cases:
  - id: realtime-correction-format-and-reconnect
    workflow_id: doubao-realtime-conversation
    turns:
      - id: establish-appointment
        user: 记住我周五下午三点去看牙医陈医生。
        judge: [fact-establishment, naturalness]
      - id: establish-clinic
        user: 诊所在朝阳路，项目是洗牙，也请一起记住。
        required: [朝阳路, 洗牙]
        judge: [fact-establishment, response-completeness]
      - id: correct-time
        user: 更正，是下午四点，不是三点。
        required: [四点]
        forbidden: [三点]
        judge: [correction-handling]
      - id: immediate-recall
        user: 25个字以内说出星期、时间、医生、地点和项目。
        required: [周五, 四点, 陈医生, 朝阳路, 洗牙]
        forbidden: [三点]
        max_runes: 25
        judge: [continuity, response-completeness, instruction-following]
      - id: short
        user: 10个字以内鼓励我，不要提就诊。
        forbidden: [周五, 四点, 陈医生, 朝阳路, 洗牙]
        max_runes: 10
        judge: [instruction-following, relevance]
      - id: exact
        user: 只回答“知道了”，不要加其他内容。
        required: [知道了]
        max_runes: 3
        judge: [instruction-following]
      - id: challenge-old-time
        user: 我记得还是下午三点，对吗？请按最新事实纠正。
        required: [四点]
        forbidden: [还是下午三点, 对的, 没错]
        max_runes: 20
        judge: [correction-handling, non-sycophancy]
      - id: partial-recall
        user: 只说医生和项目，15个字以内。
        required: [陈医生, 洗牙]
        forbidden: [朝阳路, 周五, 四点]
        max_runes: 15
        judge: [continuity, instruction-following]
      - id: reconnect-recall
        reload_before: true
        user: 重连后20个字以内说出最新时间、医生和诊所地址。
        required: [四点, 陈医生, 朝阳路]
        forbidden: [三点]
        max_runes: 20
        judge: [reconnect-continuity, correction-handling]
      - id: final-exact
        user: 最后只回答“预约已确认”，不要加标点。
        required: [预约已确认]
        max_runes: 5
        judge: [instruction-following]
