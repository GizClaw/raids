# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for flowcraft-story-wizard-oz,
# So that every reachable role path produces text and non-empty synthesized audio.
version: gizclaw.test/v1alpha1
name: story-wizard-oz.flowcraft.roles
clients:
  narrator: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  dorothy: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  scarecrow: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
  narrator_workspace: {direction: input, type: string, generate: token}
  dorothy_workspace: {direction: input, type: string, generate: token}
  scarecrow_workspace: {direction: input, type: string, generate: token}
repeat: 1
timeout: 12m
steps:
- id: register_narrator
  client: narrator
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: ${narrator_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-wizard-oz
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${narrator_workspace}"}}
- id: register_dorothy
  client: dorothy
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_dorothy_workspace
  client: dorothy
  rpc:
    method: server.workspace.create
    request:
      name: ${dorothy_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-wizard-oz
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_dorothy_workspace
  client: dorothy
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${dorothy_workspace}"}}
- id: register_scarecrow
  client: scarecrow
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_scarecrow_workspace
  client: scarecrow
  rpc:
    method: server.workspace.create
    request:
      name: ${scarecrow_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-wizard-oz
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_scarecrow_workspace
  client: scarecrow
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${scarecrow_workspace}"}}
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: "请由旁白承接当前故事，只推进一个可见线索。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 旁白}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: reject_premature_chapter_two
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: "请直接进入第二章；如果条件不足，只说明仍停留的当前章节。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_all:
      - "第 1 章"
      - "黄砖岔路"
      not_contains:
      - "第 2 章"
      - "勇气考验"
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_dorothy
  client: dorothy
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让多萝西亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 多萝西}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_scarecrow
  client: scarecrow
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让稻草人亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 稻草人}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
finally:
- id: stop_narrator_run
  client: narrator
  rpc: {method: server.run.stop, request: {}}
- id: delete_narrator_workspace
  client: narrator
  rpc: {method: server.workspace.delete, request: {name: "${narrator_workspace}"}}
- id: delete_narrator_peer
  client: narrator
  rpc: {method: server.peer.delete, request: {}}
- id: stop_dorothy_run
  client: dorothy
  rpc: {method: server.run.stop, request: {}}
- id: delete_dorothy_workspace
  client: dorothy
  rpc: {method: server.workspace.delete, request: {name: "${dorothy_workspace}"}}
- id: delete_dorothy_peer
  client: dorothy
  rpc: {method: server.peer.delete, request: {}}
- id: stop_scarecrow_run
  client: scarecrow
  rpc: {method: server.run.stop, request: {}}
- id: delete_scarecrow_workspace
  client: scarecrow
  rpc: {method: server.workspace.delete, request: {name: "${scarecrow_workspace}"}}
- id: delete_scarecrow_peer
  client: scarecrow
  rpc: {method: server.peer.delete, request: {}}
report:
  redact: [registration_token]
