召哨娋弰招捎搜旓杓柖梢溲潲烧焼燒燿玿睄稍笤筲紹綃綤绍艄芍苕莦萷蕱蛸袑裢輎邵鞘韒韶颵髾鮹", "尔": "二佴侕儿児兒刵厼咡唲嬭尒尓峏弍弐杒栭栮樲毦洏洱濡爾珥粫而耏耳聏胹腝臑荋薾衈袻誀貮貳贰趰輀輭轜迩邇鉺铒陑陾隭餌饵駬髵髶鮞鲕鴯鸸", "尤": "丣亴优佑侑偤優冘卣又友右叹呦哊唀嚘囿坳奥妋姷孧宥尢峟峳幼幽庮忧怞怣怮悠憂懮戭扰揂揄攸斿有朓柚栯梄梎楢槱櫌櫾汓汼沋油泅泑浟游湵滺瀀牖牗牰犹狖猶猷獶由甴疣痏祐禉秞糿繇纋羐羑羗耰聈聱肬脜脩苃莜莠莤莸蒏蕕蚘蚰蚴蜏蝣蝤褎訧誘诱貁輏輶迶逌逰遊邮郵鄾酉酭釉鈾銪銹铀铕駀魷鮋鯈鱿鲉麀黝鼬", "尼": "伱伲你倪儗儞兒匿呢坭埿堄妮妳婗嫟嬭嬺孨孴屔屰嶷彌怩惄愵慝懝抐抳拟掜擬旎昵晲暱柅棿檷氼泥淣溺濔濘瀰灄爾狔猊痆眤睨祢禰秜籾縌聣聻胒腝腻膩臡苨薿蚭蛪蜺觬誽譺貎跜輗迡逆郳鈮鉨鑈铌隬霓馜鯢鲵麑齯鿭", "尾": "一为丿乁乂义乊乙也亄于亦亹亿仡以仪伇伊伟伪伿佁位佗佚佾侇依俋倚倭偉偎偯偽僞儀億儗儰兿冝刈劓劮勚勩匇匜医卫印危厃厭叕叞台叹吚听呓呭味呹咦咿唈唩唯喂喡喦喴嗌噎噫噲囈囗围圍圛圩圪圯坄坨垼埶埸堤墛墿壝壱壹夁夕失夷奇奕妷委姨姬威娓媁媐媙媦嫕嫛嬄嬑嬟孴它宐宜宧寪寱寲射尉屗屹峄峓峗峞崎崣崴崺嵔嵬嶧嶬嶶嶷巋巍已巳巸帏帟帠帷幃幆庡廆廙异弈弋弌弬彛彜彝彞彵役徫微忆忔怈怠怡怿恑恞悒悘悥惟愄愇意慰憶懀懌懿戲戺扅扆扡抑拸挹捤捼掎掜揋揖揻搋搤撎撝撱擇攺敡敼斁斖施旑旖易昳晹暆暐曀曎有未机杙杝枍枻柂栘栧栺桅桋梶棭椅椬椲椳椸楲榏槷槸樴檍檥檹欈欥欭欹歖歝殔殪殹毅毉汽沂沇沩沶泄泆洈洢洧洩洫浂浘浥浳涠渏渨渫渭湋湙溈溢溦漪潍潙潩潿澤澺濊濰濻瀢瀷炈炜為烓焉焬焱焲煀煒煟煨熙熠熤熨熪熭熼燚燡燰燱爲犄犚犩狋狏猗猚猥猬獈玮玴珆琟瑋瑿璏瓗瓵畏畩異疑疙疫痍痏痬痿瘗瘞瘱癐癓癔益眙眭睢睪瞖瞶矣硊硙硛硪碨磈磑礒礙祎禕秇移稦穓立竩笖箷簃籎紲絏維綺緭緯縅縊繄繶繹纬绎维缢罻羛羠羡義羿翊翌翳翼耛耴肄肊胃胰腲膉膸臆舣艉艗艤艺艾芅芛芟苅苇苡苢苿茟荑荱荽菋萎萓萟葦葨葳蒍蓶蓺蔚蔿薇薏薳藙藝藯蘙蘶虉蚁蛇蛜蛡蛦蛾蜲蜴蜹蜼蝛蝟螔螘螠螱蟻衛衞衣衤衪衵袂袘袣裔裛裿褘褹褽襗襼覣覹觺觿訑訲訳詍詑詒詣詴誃誒誼諉謂謚謻譩譯議譺讆讉讏讛议译诒诣诿谊谓豙豛豷貖貤貽賹贀贻趡跇跠踒踓踦躗躛軎軼輗輢轊轙轶辥辷迆违迤迭迱迻逘逶逸違遗遺邑郼鄬酏醀醫醳醷釋釔釴釶鈘鈠鉇鉈鉯銕銥錗錡鍏鍡鎰鏏鏔鐿钀钇铱镒镱闈闱阢阣阤陁陭隇隈隗隶隹隿雉霅霨霬霺靉靾韋韑韙韡韦韪頉頠頤頥顊顗颐颹食飴餧餵饐饖饴駅驛驿骩骪骫骮魏鮇鮠鮧鮨鮪鯣鰃鰄鰖鲔鳂鳚鳦鴺鶂鶃鶍鷁鷊鷖鷧鷾鸃鹝鹢鹥黓黝黟黳齮齸", "山": "傓僐僤儃儋删刪剡剼单善單嘇圸埏墠墡壇姍姗嬗嶦幓彡扇挻掞掸掺搧摻撣擅擔攙敾晱杉杣柵栅椫樿檀檆櫼歚汕潬潸澘澹灗炶烻煔煽熌狦猭珊疝痁睒磰禅禪穇笘笧縿繕纔缮羴羶脠膳膻舢芟苫葠蔪蟬蟮蟺衫襂襳覢訕謆譱讪贍赡赸跚軕邓邖鄯釤銏鐥钐閃閄閊闪陕陝顃顫饍騸骟髟鯅鱓鱔鱣鳝鿃", "岛": "佻倒儔刀刂到受叨啁嘄噵壔导導島嶋嶌嶹帱幬忉忑悼惆捣捯搗擣敦朷椡槝檤檮氘洮濤焘燾瓙盗盜祷禂禱稲稻箌絩纛翢翿舠艔菿薵虭衜衟裯蹈軇道醻釖陦陶隝隯魛鱽鳥", "岩": "严乵但俨俺偃偐偣傿儼兖兗剡剦匽厂厃厌厣厭厳厴咽唁唌啱喭噞嚥嚴囐埏埯堰塩墕壛壧夵奄妍妟姲姸娫娮媕嫣嬊嬐嬮嬿孍宴屵崦嵃嵒嵓嶖嶮巌巖巗巘巚巡广庵延弇彥彦恹愝懕懨戭扊抁挻捝掞掩揅揜揞敥昖晏晻暥曕曣曮棪椻椼楌樮橪檐檿櫩欕殗殷氤汧沇沿洇洝涎淊淡淫淹渰渷湮溎滟演漹灎灔灧灩炎炏烟烻焉焑焔焰焱煙熖燄燕爓牪狠狿猒珚琂琰瓛甗癌盐眼研砚硏硯硽碞礹筵篶簷綖縯罨羡羬胭腌膁臙艳艶艷芫莚菴菸萒葕蔅蔫薟虤蜒蝘衍裺褗覃覎觃觾言訁訮詽諺讌讞讠谚谳豓豔豣贋贗赝趼躽軅這遃郔郾鄢酀酓酽醃醶醼釅鉛鋋錟铅閆閹閻閼闫阉阎阏阭阽隁隒險雁靨顏顑顔顩颜餍饜騐験騴驗驠验鬳魇魘鰋鳫鳱鴈鴳鶠鷃鷰鹽麙麣麲黡黤黫黬黭黰黶鼴鼹齗齞齴龑", "峡": "丅下乤侠俠假傄匣厦叚吓呀呷呼哧唬嗄嗑嚇圷埉夏夓夾岈峽廈徦懗押捾搳敮斜昰暇柙梺欱歃毳浹炠烚煆狎狭狹珨瑕疜疨瘕睱瞎硖硤碬磍祫笚筪給縀縖罅翈舝舺芐葭蕸虲虾蝦螛諕謑谺赮轄辖遐郃鍜鎋鎼鏬閕閜陜陿霞颬騢魻鰕鶷黠", "峰": "丰仹俸偑僼冯凤凨凬凮唪埄堸夆奉妦寷封峯崶捀捧摓方枫桻楓檒沣沨泛浲渢湗溄漨灃炐烽焨煈熢犎猦琒甮疯瘋盽砜碸篈綘縫缝肨舽艂莑葑蘴蚌蜂蠭覂諷讽豊豐賵赗逄逢鄷酆鋒鎽鏠锋闏霻靊風飌风馮鳯鳳鴌鵬麷", "崖": "丫乛亚亜亞伢俹劜厊压厑厓厭吖吾呀呾哑唖啞圔圠圧垭埡堊堐壓姶娅婭孲岈崕庌庘御押拁挜掗揠札枒桠椏椻歇氩氬浥涯漄潝烏牙犽猚猰玡琊瑘疋疨痖瘂睚砑碣磍稏穵窫笌聐芽蕥蚜衙襾訝讶軋輅輵轧迓邪釾錏鐚铔閘雅顔鴉鴨鵪鵶鸦鸭齖齾", "州": "伷侏侜倜僽冑周呪咒咮啁啄喌喙噣嚋妯婤宙帚徟扭掫昼晝晭柚椆注洀洲淍炿烐珘甃疛皱皺盩睭矪碡祝箒籀籒籕粙粥紂紬縐繇纣绉翢肘育胄胕舟舳荮菷葤薵詋詶調諏謅譸诌诪賙赒軸輈輖轴辀逐週郮酎鈾銂霌駎駲騆騶驟骤鬻鯞鵃鸼", "工"