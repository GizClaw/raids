    "/flowcraft_roles_ranger_scene_setup_1/first_text_ms":
      maximum: 6000
    "/flowcraft_roles_ranger_scene_setup_1/first_audio_ms":
      maximum: 90000
    "/eino_roles_ranger_scene_setup_1/text_eos":
      equals: true
    "/eino_roles_ranger_scene_setup_1/audio_eos":
      equals: true
    "/eino_roles_ranger_scene_setup_1/audio_bytes":
