    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_captain
  client: captain
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让救援队长亲自回应。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      not_contains:
      - 救援队长说
      - 救援队长：
- id: probe_captain_first_response
  client: captain
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让救援队长亲自回应。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
