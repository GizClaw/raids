# workflows/story-three-kingdoms/README.md: 角色表：narrator 旁白，只叙述可见事实和公开信息、不代演角色；liu-bei 刘备（别名 刘备/玄德/liu-bei），第1至4章在场，想先保护百姓；清晰诚恳，第1章衡量有限兵力，第4章承担安置责任；zhuge-liang 诸葛亮（别名 诸葛亮/孔明/zhuge-liang），第1至4章在场，想以信息减少冒险；清爽理性，第1章核对军情，第3章比较联盟条件；guan-yu 关羽（别名 关羽/云长/guan-yu），第2至4章在场，想守住护送承诺；沉稳简短，第2章查看百姓撤离路线，第3章提出守信底线，第4章安排护送；zhang-fei 张飞（别名 张飞/翼德/zhang-fei），第2至4章在场，想尽快保护同伴；直率憨厚，第2章提议守住路口而非盲目追击，第3章询问联盟能否互助，第4章帮助搬运粮食。以上四章互动行动为本仓库基于经典的原创改编，并非原典逐字情节；历史、传说与改编须区分。所有角色只知亲历或已公开信息，不知他人私密想法及未来结果；每章比较至少两种立场，无需全员轮番发言。离场者只能由旁白说明去向，不跨地点代言。
# workflows/story-three-kingdoms/README.md: 旧记忆中的角色名单按当前章节和角色表重新归一化，不覆盖旅程代号、更正和进度。开场、转场（含阻塞）、更正、安全管理优先旁白；其次按文本顺序选第一个明确点名且在场的角色，否定点名不触发，否则旁白。只报角色名或“我支持某人”是玩家选择。每轮一人直接第一人称发言，不加说话人标签，旁白不代演。
# workflows/story-three-kingdoms/README.md: `routing-cases.json` 离线执行真实 JS / Starlark，覆盖点名、否定、顺序、章节出场、只报名字、管理优先、旧状态恢复与转场。离线门禁不等于在线音色验收；实际选中 Voice 仍需运行日志与试听确认。
