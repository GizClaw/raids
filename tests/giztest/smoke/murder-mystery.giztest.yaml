# User Story:
# As a Raids catalog maintainer,
# I want equal opening, role and realtime responsiveness gates for every implementation,
# So that text and audio respond promptly without overlap or playback stalls.
version: gizclaw.test/v1alpha1
name: murder-mystery.smoke
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_text_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_realtime_workspace:
    direction: input
    type: string
    generate: token
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
repeat: 1
timeout: 12m
steps:
- id: flowcraft_register
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_create_text
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_text_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-murder-mystery
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_select_text
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_text_workspace}"
- id: flowcraft_warmup_text
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_create_realtime
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_realtime_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-murder-mystery
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_REALTIME
- id: flowcraft_probe_narrator
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 请开始主持《雨夜留声机》，只给出初始案情和自由调查邀请。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - '【'
      - '】'
      - 主持人说
      - 主持人：
      # PeerStream text is a fragment array; full text plus exact length preserves equality.
      contains: 22:00，沈鹤年被发现死在沈家大宅二楼书房。此时正值雨夜。你可以自由调查任何感兴趣的地点、物品或相关人物：可以问话的人有管家、厨师、死者的次子沈知秋和律师，可以查看的地方有二楼书房、阳台、厨房和后门、花园、沈知秋的房间、壁炉和后廊。想去哪里、想问谁，直接告诉我就行。
      min_length: 134
      max_length: 134
      non_empty: true
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/events":
      non_empty: true
    "/text_eos_ms":
      maximum: 90000
    "/audio_eos_ms":
      maximum: 90000
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- id: flowcraft_probe_narrator_first_response
  client: flowcraft
  timeout: 15s
  peer_stream:
    mode: text
    input: 请主持人说明还能问谁，不透露发现。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: flowcraft_probe_narrator_stop_probe
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_probe_narrator_resume_workspace
  client: flowcraft
  timeout: 2m
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_housekeeper_opening_setup
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 请开始主持《雨夜留声机》，只给出初始案情和自由调查邀请。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      # PeerStream text is a fragment array; full text plus exact length preserves equality.
      contains: 22:00，沈鹤年被发现死在沈家大宅二楼书房。此时正值雨夜。你可以自由调查任何感兴趣的地点、物品或相关人物：可以问话的人有管家、厨师、死者的次子沈知秋和律师，可以查看的地方有二楼书房、阳台、厨房和后门、花园、沈知秋的房间、壁炉和后廊。想去哪里、想问谁，直接告诉我就行。
      min_length: 134
      max_length: 134
      non_empty: true
      not_contains:
      - '【'
      - '】'
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/events":
      non_empty: true
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- id: flowcraft_probe_housekeeper
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 我找管家问问：停电时你在哪里？钥匙在谁手里？有没有听到什么声响？
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - '【'
      - '】'
      - 管家说
      - 管家：
      - 伪造密室
      - 经后廊返回
      - 私密真相
      - 留声机循环误导
      contains_all:
      - 我
      non_empty: true
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/events":
      non_empty: true
    "/text_eos_ms":
      maximum: 90000
    "/audio_eos_ms":
      maximum: 90000
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- id: flowcraft_probe_housekeeper_first_response
  client: flowcraft
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让管家再简短说说自己的固定说法。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: flowcraft_probe_housekeeper_stop_probe
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_probe_housekeeper_resume_workspace
  client: flowcraft
  timeout: 2m
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_probe_chef
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 我去问厨师：停电前后你分别在哪里？具体时间记得吗？
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - '【'
      - '】'
      - 厨师说
      - 厨师：
      - 伪造密室
      - 经后廊返回
      - 私密真相
      - 留声机循环误导
      contains_all:
      - 我
      non_empty: true
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/events":
      non_empty: true
    "/text_eos_ms":
      maximum: 90000
    "/audio_eos_ms":
      maximum: 90000
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- id: flowcraft_probe_chef_first_response
  client: flowcraft
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让厨师再简短说说自己的固定说法。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: flowcraft_probe_chef_stop_probe
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_probe_chef_resume_workspace
  client: flowcraft
  timeout: 2m
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_probe_heir
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 我去找沈知秋，问他和死者的关系、当晚行踪，以及他是否知道那些鞋印。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - '【'
      - '】'
      - 沈知秋说
      - 沈知秋：
      - 伪造密室
      - 经后廊返回
      - 私密真相
      - 留声机循环误导
      contains_all:
      - 我
      non_empty: true
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/events":
      non_empty: true
    "/text_eos_ms":
      maximum: 90000
    "/audio_eos_ms":
      maximum: 90000
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- id: flowcraft_probe_heir_first_response
  client: flowcraft
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让沈知秋再简短说说自己的固定说法。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: flowcraft_probe_heir_stop_probe
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_probe_heir_resume_workspace
  client: flowcraft
  timeout: 2m
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_probe_lawyer
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 我去问律师：遗嘱最近有没有修改？还有谁知道内容？
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - '【'
      - '】'
      - 律师说
      - 律师：
      - 伪造密室
      - 经后廊返回
      - 私密真相
      - 留声机循环误导
      contains_all:
      - 我
      non_empty: true
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/events":
      non_empty: true
    "/text_eos_ms":
      maximum: 90000
    "/audio_eos_ms":
      maximum: 90000
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- id: flowcraft_probe_lawyer_first_response
  client: flowcraft
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让律师再简短说说自己的固定说法。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: flowcraft_probe_lawyer_stop_probe
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_probe_lawyer_resume_workspace
  client: flowcraft
  timeout: 2m
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_select_realtime
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_realtime_workspace}"
- id: flowcraft_warmup_realtime
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: synthesize_input_audio
  client: flowcraft
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 请开始主持《雨夜留声机》，只给出初始案情和自由调查邀请。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: input_audio
- id: flowcraft_realtime_roundtrip
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${input_audio}"
    pacing: 20ms
    require_audio: true
    require_text: true
    idle_timeout: 90s
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/text":
      non_empty: true
      not_contains:
      - '【'
      - '】'
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
  client: flowcraft
finally:
- id: flowcraft_stop_run
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_delete_text
  client: flowcraft
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_text_workspace}"
- id: flowcraft_delete_realtime
  client: flowcraft
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_realtime_workspace}"
- id: flowcraft_delete_peer
  client: flowcraft
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
