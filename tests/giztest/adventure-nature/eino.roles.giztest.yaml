finally:
- id: stop_narrator_run
  client: narrator
  rpc:
    method: server.run.stop
    request: {}
- id: delete_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.delete
    request:
      name: "${narrator_workspace}"
- id: delete_narrator_peer
  client: narrator
  rpc:
    method: server.peer.delete
    request: {}
- id: stop_ranger_run
  client: ranger
  rpc:
    method: server.run.stop
    request: {}
- id: delete_ranger_workspace
  client: ranger
  rpc:
    method: server.workspace.delete
    request:
      name: "${ranger_workspace}"
- id: delete_ranger_peer
  client: ranger
  rpc:
    method: server.peer.delete
    request: {}
- id: stop_botanist_run
  client: botanist
