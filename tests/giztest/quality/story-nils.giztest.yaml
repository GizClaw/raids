    "/eino_roles_probe_narrator/first_text_ms":
      maximum: 6000
    "/eino_roles_probe_narrator/first_audio_ms":
      maximum: 90000
    "/flowcraft_routing_negated_name/text":
      min_length: 4
      not_contains:
      - 尼尔斯说
      - 尼尔斯：
      - '尼尔斯:'
      - 我是尼尔斯
