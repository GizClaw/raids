# User Story:
# As a Raids catalog maintainer,
# I want to drive `doubao-realtime-conversation` through the scripted `default-assistant-doubao-dev-v033-regression` / `dev-v033-e2e-regression` turns over realtime input,
# So that the deterministic keyword, length, script, and latency gates run as one isolated declarative task.
version: gizclaw.test/v1alpha1
name: doubao-realtime.conversation.dev-v033-e2e-regression
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  workspace_name:
    direction: input
    type: string
    generate: token
  audio_1:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_2:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_3:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_4:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_5:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_6:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_7:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_8:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
repeat: 1
timeout: 19m
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: ${registration_token}
- id: create_workspace
  client: peer
  rpc:
    method: server.workspace.create
    request:
      name: ${workspace_name}
      collection: assistants
      workflow_name: doubao-realtime
      parameters:
        doubao_realtime_workspace_parameters:
          agent_type: DOUBAO_REALTIME_WORKSPACE_PARAMETERS_AGENT_TYPE_DOUBAO_REALTIME
          input: WORKSPACE_INPUT_MODE_REALTIME
- id: select_workspace
  client: peer
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: ${workspace_name}
- id: synthesize_1_establish-context
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 请记住：暗号是紫色灯塔，称呼我松果队长，我在计划周末露营，原本更喜欢轮船。请简短确认。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_1
- id: turn_1_establish-context
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_1}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      contains_all:
      - 紫色灯塔
      min_length: 4
      max_length: 200
- id: synthesize_2_recall-marker
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 我刚才说的暗号是什么？只回答暗号。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_2
- id: turn_2_recall-marker
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_2}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      contains_all:
      - 紫色灯塔
      min_length: 4
      max_length: 200
- id: synthesize_3_continue-topic
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 继续刚才的计划，我原本偏好的出行方式是什么？用一句话回答。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_3
- id: turn_3_continue-topic
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_3}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      contains_all:
      - 轮船
      min_length: 4
      max_length: 200
- id: synthesize_4_correct-fact
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 更正一下，我现在改为更喜欢出租车，请记住这个变化。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_4
- id: turn_4_correct-fact
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_4}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      contains_all:
      - 出租车
      min_length: 4
      max_length: 200
- id: synthesize_5_use-correction
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 那我现在更喜欢哪种方式？不要提已经更正的旧选择。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_5
- id: turn_5_use-correction
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_5}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      contains_all:
      - 出租车
      not_contains:
      - 轮船
      min_length: 4
      max_length: 200
- id: synthesize_6_short-answer
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 用不超过十二个字概括我正在计划的主题。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_6
- id: turn_6_short-answer
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_6}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      contains_all:
      - 周末露营
      min_length: 4
      max_length: 200
- id: synthesize_7_detailed-answer
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 请为这个计划给出三个具体建议，每点说明理由，回答至少八十字。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_7
- id: turn_7_detailed-answer
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_7}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      min_length: 80
      max_length: 720
- id: synthesize_8_final-summary
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 最后总结：我的称呼、暗号、计划主题和当前偏好分别是什么？不要提旧偏好。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_8
- id: turn_8_final-summary
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_8}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      contains_all:
      - 松果队长
      - 紫色灯塔
      - 周末露营
      - 出租车
      not_contains:
      - 轮船
      min_length: 20
      max_length: 360
finally:
- id: stop_run
  client: peer
  rpc:
    method: server.run.stop
    request: {}
- id: delete_workspace
  client: peer
  rpc:
    method: server.workspace.delete
    request:
      name: ${workspace_name}
- id: delete_peer
  client: peer
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
