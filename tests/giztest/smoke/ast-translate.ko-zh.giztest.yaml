# User Story:
# As a Raids catalog maintainer,
# I want equal opening, role and realtime responsiveness gates for every implementation,
# So that text and audio respond promptly without overlap or playback stalls.
version: gizclaw.test/v1alpha1
name: ast-translate.smoke.ko-zh
clients:
  ko_zh_ko_to_zh:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  ko_zh_ko_to_zh_text_workspace:
    direction: input
    type: string
    generate: token
  ko_zh_ko_to_zh_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ko_zh_ko_to_zh_realtime_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 12m
steps:
- id: ko_zh_ko_to_zh_register
  client: ko_zh_ko_to_zh
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: ko_zh_ko_to_zh_create_text
  client: ko_zh_ko_to_zh
  rpc:
    method: server.workspace.create
    request:
      name: "${ko_zh_ko_to_zh_text_workspace}"
      collection: translates
      workflow_name: translate-ko-zh
      parameters:
        asttranslate_workspace_parameters:
          agent_type: ASTTRANSLATE_WORKSPACE_PARAMETERS_AGENT_TYPE_AST_TRANSLATE
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: ko_zh_ko_to_zh_select_text
  client: ko_zh_ko_to_zh
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${ko_zh_ko_to_zh_text_workspace}"
- id: ko_zh_ko_to_zh_warmup_text
  client: ko_zh_ko_to_zh
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: ko_zh_ko_to_zh_create_realtime
  client: ko_zh_ko_to_zh
  rpc:
    method: server.workspace.create
    request:
      name: "${ko_zh_ko_to_zh_realtime_workspace}"
      collection: translates
      workflow_name: translate-ko-zh
      parameters:
        asttranslate_workspace_parameters:
          agent_type: ASTTRANSLATE_WORKSPACE_PARAMETERS_AGENT_TYPE_AST_TRANSLATE
          input: WORKSPACE_INPUT_MODE_REALTIME
- id: synthesize_ko_zh_ko_to_zh_audio
  client: ko_zh_ko_to_zh
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ko
      text: 진심으로 친절한 도움에 감사드립니다.
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ko_zh_ko_to_zh_audio
- id: ko_zh_ko_to_zh_turn_1_gratitude
  client: ko_zh_ko_to_zh
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ko_zh_ko_to_zh_audio}"
    pacing: 20ms
    require_text: true
    require_audio: true
    idle_timeout: 90s
  expect:
    "/text":
      contains_any:
      - 谢谢
      - 感谢
      - 感激
      - 谢意
      pattern: "\\p{Han}"
      max_length: 200
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/events":
      non_empty: true
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- id: ko_zh_ko_to_zh_select_realtime
  client: ko_zh_ko_to_zh
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${ko_zh_ko_to_zh_realtime_workspace}"
- id: ko_zh_ko_to_zh_warmup_realtime
  client: ko_zh_ko_to_zh
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: ko_zh_ko_to_zh_realtime_roundtrip
  client: ko_zh_ko_to_zh
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${ko_zh_ko_to_zh_audio}"
    pacing: 20ms
    require_text: true
    require_audio: true
    idle_timeout: 90s
  expect:
    "/text":
      contains_any:
      - 谢谢
      - 感谢
      - 感激
      - 谢意
      pattern: "\\p{Han}"
      max_length: 200
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/events":
      non_empty: true
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
finally:
- id: ko_zh_ko_to_zh_stop_run
  client: ko_zh_ko_to_zh
  rpc:
    method: server.run.stop
    request: {}
- id: ko_zh_ko_to_zh_delete_text
  client: ko_zh_ko_to_zh
  rpc:
    method: server.workspace.delete
    request:
      name: "${ko_zh_ko_to_zh_text_workspace}"
- id: ko_zh_ko_to_zh_delete_realtime
  client: ko_zh_ko_to_zh
  rpc:
    method: server.workspace.delete
    request:
      name: "${ko_zh_ko_to_zh_realtime_workspace}"
- id: ko_zh_ko_to_zh_delete_peer
  client: ko_zh_ko_to_zh
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
