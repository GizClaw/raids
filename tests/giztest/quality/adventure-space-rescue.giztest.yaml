      equals: true
    "/flowcraft_roles_captain_scene_setup_1/audio_eos":
      equals: true
    "/flowcraft_roles_captain_scene_setup_1/audio_bytes":
      minimum: 1
    "/flowcraft_roles_captain_scene_setup_1/first_text_ms":
      maximum: 6000
    "/flowcraft_roles_captain_scene_setup_1/first_audio_ms":
      maximum: 90000
    "/eino_roles_captain_scene_setup_1/text_eos":
      equals: true
    "/eino_roles_captain_scene_setup_1/audio_eos":
      equals: true
    "/eino_roles_captain_scene_setup_1/audio_bytes":
      minimum: 1
    "/eino_roles_captain_scene_setup_1/first_text_ms":
      maximum: 6000
    "/eino_roles_captain_scene_setup_1/first_audio_ms":
      maximum: 90000
    "/flowcraft_routing_negated_name/text":
      min_length: 4
      not_contains:
      - 救援队长说
      - 救援队长：
      - '救援队长:'
      - 我是救援队长
      - 作为救援队长
      - 我这只救援队长
    "/flowcraft_routing_negated_name/text_eos":
      equals: true
    "/flowcraft_routing_negated_name/audio_eos":
      equals: true
    "/flowcraft_routing_negated_name/audio_bytes":
      minimum: 1
    "/flowcraft_routing_negated_name/first_text_ms":
      maximum: 6000
    "/flowcraft_routing_negated_name/first_audio_ms":
      maximum: 90000
    "/eino_routing_negated_name/text":
