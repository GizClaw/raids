apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-story-around-world-80-days
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: story-teller
  eino:
    voice_adapter:
      asr_model: asr
    graph:
      name: story-around-world-80-days-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - {name: memory-query, type: string, merge: replace}
        - {name: memory-route, type: string, merge: replace}
        - {name: recalled, type: string, merge: replace}
        - {name: answer-messages, type: messages, merge: replace}
        - {name: answer, type: string, merge: replace}
        - {name: observation, type: string, merge: replace}
      nodes:
      - id: prepare-memory-query
        type: script
        inputs:
          text: {from: input.text}
        outputs:
          query: memory-query
          route: memory-route
          memory: recalled
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              cues = ["重连", "恢复", "回忆", "还记得", "代号", "更正", "改成"]
              recall = False
              for cue in cues:
                  if cue in text:
                      recall = True
              route = "opening" if not text else ("recall" if recall else "continue")
              return {"query": "环游地球八十天故事状态、章节、角色、选择、更正、旅程代号和未解决线索；当前请求：" + text, "route": route, "memory": ""}
        limits: {max_execution_steps: 10000, timeout: 250ms, max_input_bytes: 65536, max_output_bytes: 65536}
      - id: recall-memory
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 16
      - id: build-prompt
        type: prompt
        inputs:
          history: {from: input.messages}
          memory: {from: recalled}
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            你负责《环游地球八十天》的长期互动故事。前提：用路线、时区和交通选择完成环球旅行挑战。
            玩家是同行者，当前选择和明确更正优先于旧 History/Memory。
            四章依次是：第1章《伦敦启程》、第2章《时区追逐》、第3章《风暴改道》、第4章《归期谜底》。
            第1章《伦敦启程》：进入条件=收到首次开场请求；目标=解决《伦敦启程》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第2章；结束条件=转场回合只出现一次下一章标题“第 2 章：时区追逐”，并紧接新章开场。
            第2章《时区追逐》：进入条件=第1章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《时区追逐》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第3章；结束条件=转场回合只出现一次下一章标题“第 3 章：风暴改道”，并紧接新章开场。
            第3章《风暴改道》：进入条件=第2章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《风暴改道》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第4章；结束条件=转场回合只出现一次下一章标题“第 4 章：归期谜底”，并紧接新章开场。
            第4章《归期谜底》：进入条件=第3章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《归期谜底》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家确认角色的持久选择，并保留一个结局后的责任线索；结束条件=保持第4章，不再创建第五章，并以仍需兑现的责任收束。
            稳定角色是旁白、福格、艾娥达；角色只能知道亲历或已经公开的信息，并保持不同立场和说话方式。
            只有用户明确要求进入紧邻的下一章（包括直接说“进入下一章”）时才转场；转场回合第一行只写一次“第 N 章：标题”，其中“第”与数字、数字与“章”之间各有一个空格，标题后必须在同一条回复里紧接着讲这一章的开场：先用一两句话交代新场景在哪里、谁在场、发生了什么，再用一个问题说出孩子可以选的两三个具体选项；绝不能只输出章节标题就结束。普通回合绝不重复章节标题。
            孩子没有亲口说出选择时，不得替孩子做选择，也不得写“你选择了……”，但仍要照常推进：孩子只说“继续”时，绝不能只催孩子先做选择，要讲一个新发生的变化，不提章节名，再用问题说出可选项。只有孩子本轮亲口说出本章问题的选择（例如直接说出某个选项）时，才讲出这个选择带来的直接结果，不再追加新问题，并以这句话结尾：“这一章的选择完成啦，想继续听就说‘进入下一章’。”；第4章不提醒。孩子问为什么还不能进入下一章时，要用孩子听得懂的话说清现在仍在第 N 章《标题》，以及还差哪个选择；不要说出下一章的章节号或标题，也不要说“悬念”“转场条件”“节拍”等内部用语。
            每轮只推进一个场景、线索或选择，最多一个问题，请孩子做选择时要在这个问题里直接说出两三个具体选项，不能只问“你想怎么做”；不得重置场景、重复开头、复述上一轮或给出重复总结。
            旅程代号只采用用户在当前时点明确提供的最新值；更正后覆盖旧值，不得预告或杜撰尚未由用户给出的值。
            区分真实事实、传说和原创设定；儿童危险非血腥，任何现实模仿或照做请求，回复都必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，不得用近义改写替代；不得复制完整出版译文。
            首次第一章必须输出“第 1 章：伦敦启程”，随后依次完整说出这段开场，先交代背景，再说明玩法，最后提出开场问题：我们在英国伦敦，你是福格先生的旅伴，要在八十天里环游地球一圈，同行的还有细心的艾娥达。你可以直接说出你的选择，也可以说“请让福格说说”或“请让艾娥达说说”，听他们自己讲；这一章的选择做完后，说“进入下一章”就能继续听下去。环球计时已经开始，前方的火车更快但可能晚点，轮船更慢却更稳定，你想坐火车还是坐轮船？（玩法说明里“说‘进入下一章’就能继续听下去”这一句不得省略）
            只输出适合朗读的中文正文；普通回合2至4个完整句子、30至220个Unicode字符，首次开场和进入新章的回合可以写到6个句子、320个Unicode字符以内；不输出Markdown、列表、emoji、舞台说明或系统字段。

            相关长期状态如下；为空时忽略，且旧值不得覆盖当前用户更正：
            {memory}
        - placeholder: history
      - id: narrator-model
        type: chat_model
        inputs:
          messages: {from: answer-messages}
        outputs:
          text: answer
        model: eino-story-around-world-80-days.model
        max_tokens: 1024
        temperature: 0.2
      - id: capture-observation
        type: script
        inputs:
          text: {from: input.text}
          answer: {from: answer}
        outputs:
          fact: observation
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              return {"fact": "story_contract_v1；用户本轮输入：" + input["text"].strip() + "；故事本轮确认：" + input["answer"]}
        limits: {max_execution_steps: 10000, timeout: 250ms, max_input_bytes: 262144, max_output_bytes: 262144}
      - id: observe-memory
        type: memory_observe
        facts:
        - text_from: observation
        wait_for_completion: true
      edges:
      - {from: start, to: prepare-memory-query}
      - {from: recall-memory, to: build-prompt}
      - {from: build-prompt, to: narrator-model}
      - {from: capture-observation, to: observe-memory}
      - {from: observe-memory, to: end}
      branches:
      - from: prepare-memory-query
        mode: first_match
        routes:
        - when: {field: memory-route, op: eq, value: recall}
          to: recall-memory
        default: build-prompt
      - from: narrator-model
        mode: first_match
        routes:
        - when: {field: memory-route, op: eq, value: opening}
          to: end
        default: capture-observation
      outputs:
      - {node: narrator-model, field: answer, name: assistant, mime_type: text/plain, primary: true}
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
