- id: quality_round_1
  timeout: 2m
  parallel:
  - id: flowcraft_transitions_opening_with_guidance
    client: flowcraft__transitions
    peer_stream:
      mode: text
      input: 请从第一章开始《环游地球八十天》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_transitions_opening_with_guidance
    client: eino__transitions
    peer_stream:
      mode: text
      input: 请从第一章开始《环游地球八十天》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: flowcraft_roles_probe_narrator
    client: flowcraft__roles
    peer_stream:
      mode: text
      input: 请由旁白承接当前故事，只推进一个可见线索。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_roles_probe_narrator
    client: eino__roles
    peer_stream:
      mode: text
      input: 请由旁白承接当前故事，只推进一个可见线索。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: flowcraft_routing_opening
    client: flowcraft__routing
    peer_stream:
      mode: text
      input: 请从第一章开始《环游地球八十天》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_routing_opening
    client: eino__routing
    peer_stream:
      mode: text
      input: 请从第一章开始《环游地球八十天》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  expect:
    "/flowcraft_transitions_opening_with_guidance/text":
      contains_all:
      - 第 1 章
      - 伦敦启程
      - 福格
      - 艾娥达
      - 进入下一章
    "/flowcraft_transitions_opening_with_guidance/text_eos":
      equals: true
    "/flowcraft_transitions_opening_with_guidance/audio_eos":
      equals: true
    "/flowcraft_transitions_opening_with_guidance/audio_bytes":
      minimum: 1
    "/flowcraft_transitions_opening_with_guidance/first_text_ms":
      maximum: 6000
    "/eino_transitions_opening_with_guidance/text":
      contains_all:
      - 第 1 章
      - 伦敦启程
      - 福格
      - 艾娥达
      - 进入下一章
    "/eino_transitions_opening_with_guidance/text_eos":
      equals: true
    "/eino_transitions_opening_with_guidance/audio_eos":
      equals: true
    "/eino_transitions_opening_with_guidance/audio_bytes":
      minimum: 1
    "/eino_transitions_opening_with_guidance/first_text_ms":
      maximum: 6000
    "/flowcraft_roles_probe_narrator/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/flowcraft_roles_probe_narrator/text_eos":
      equals: true
    "/flowcraft_roles_probe_narrator/audio_eos":
      equals: true
    "/flowcraft_roles_probe_narrator/audio_bytes":
      minimum: 1
    "/flowcraft_roles_probe_narrator/first_text_ms":
      maximum: 6000
    "/flowcraft_roles_probe_narrator/first_audio_ms":
      maximum: 90000
    "/eino_roles_probe_narrator/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/eino_roles_probe_narrator/text_eos":
