apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: learn-chinese-poetry-grade3-test
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    graph:
      name: learn-chinese-poetry-grade3-test-relay
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 8
      state:
        fields:
        - name: tester-route
          type: string
          merge: replace
        - name: tester-message
          type: string
          merge: replace
        - name: tester-det
          type: string
          merge: replace
        - name: prompt-system
          type: string
          merge: replace
        - name: prompt-user
          type: string
          merge: replace
        - name: judge-messages
          type: messages
          merge: replace
        - name: model-text
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: route-turn
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: tester-route
          message: tester-message
          det: tester-det
          system: prompt-system
          user: prompt-user
        language: starlark
        entrypoint: run
        source: |
          REQUESTS = ["请从指定中文开场开始。", "我们刚学了《九月九日忆山东兄弟》，你给我讲讲吧。", "你能把这首诗完整地念给我听吗？", "这首诗是在什么情况下写的？是有记载的，还是一般认为的，还是传说？", "诗人写这首诗那天中午吃的是什么？", "我还会背《咏鹅》，你能念给我听吗？", "请记住：我今天学会了《九月九日忆山东兄弟》，下次想学《望天门山》。只确认你已经记住。", "重连后，请只说我下次想学哪首诗。"]
          INTENTS = ["", "", "", "", "", "", "", ""]
          CHECKPOINTS = ["opening", "poem-intro", "recite-exact", "background-label", "unknown-boundary", "other-grade-poem", "memory-store", "memory-recall"]
          CONTRACTS = ["必须逐字符合指定中文开场；不得含Markdown、列表、emoji或舞台说明；15-240字", "必须承接这首诗并正确说出作者王维；只讲知识卡内的作者或背景；最多一个问题；30-360字", "必须逐字念出课本正文“独在异乡为异客，每逢佳节倍思亲。遥知兄弟登高处，遍插茱萸少一人。”，不得改字漏字；20-360字", "必须按知识卡讲背景“《全唐诗》题下原注“时年十七”：王维十七岁客居他乡，重阳节思念家乡兄弟而作。”，并说明它属于史实；不得添加知识卡外的细节；20-360字", "知识卡没有这个细节，必须明确说没有记载或不确定，不得编造食物、地名或人名，也不得用可能、大概去猜；10-320字", "《咏鹅》是一年级的诗，必须正常念出全文“鹅，鹅，鹅，曲项向天歌。白毛浮绿水，红掌拨清波。”，不得婉拒；20-360字", "必须确认已记住今天学会的诗和下次想学《望天门山》（复述措辞可以不同，下一轮重连后再严格核对）；4-320字", "重载后必须从长期记忆准确回忆《望天门山》；只回答诗名；2-200字"]
          CHECKS = [{"required": ["你好呀，我是古诗小书童。我们来聊聊三年级的古诗吧，说一首你学过的，我给你讲讲它背后的故事。"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 15, "max_runes": 240}, {"required": ["王维"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 30, "max_runes": 360}, {"required": ["独在异乡为异客", "每逢佳节倍思亲", "遥知兄弟登高处", "遍插茱萸少一人"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["记载", "原注", "注明", "写着"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["没有记载", "没有留下记载", "没有相关记载", "没有确切记载", "不确定", "不知道", "查不到", "没有资料", "无法确定", "没法确定", "没有确切"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 10, "max_runes": 320}, {"required": ["鹅", "鹅", "鹅", "曲项向天歌", "白毛浮绿水", "红掌拨清波"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["记住", "记下", "记好", "记得"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 4, "max_runes": 320}, {"required": ["望天门山"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 2, "max_runes": 200}]
          RULES = "你是 `learn-chinese-poetry-grade3` 的专属验收 Workflow，不是目标角色。指定中文开场是：你好呀，我是古诗小书童。我们来聊聊三年级的古诗吧，说一首你学过的，我给你讲讲它背后的故事。 体验要求：古诗小书童陪孩子拓展课本古诗，念知识卡里的诗必须与课本正文逐字一致；背景要区分有记载、一般认为和传说；知识卡没有的细节必须承认没有记载或不确定，不得编造；孩子提到的任何诗都要正常讲、正常念，婉拒属于失败。本路线使用的知识卡条目：《九月九日忆山东兄弟》唐·王维，正文“独在异乡为异客，每逢佳节倍思亲。遥知兄弟登高处，遍插茱萸少一人。”，背景（史实）：《全唐诗》题下原注“时年十七”：王维十七岁客居他乡，重阳节思念家乡兄弟而作。。《咏鹅》唐·骆宾王，正文“鹅，鹅，鹅，曲项向天歌。白毛浮绿水，红掌拨清波。”。《望天门山》唐·李白。知识卡没有记录诗人写诗那天吃了什么。 目标可用的完整知识卡如下，其中任何内容都不算编造，知识卡以外的人物、年代、历史、数字和情节才算：常识：绝句每首四句，属于唐代成熟的“近体诗”。五言绝句每句5个字、共20字；七言绝句每句7个字、共28字。 常识：律诗每首八句：五言律诗共40字，七言律诗共56字；第二、四、六、八句要押韵，格律要求很严。 常识：“五言”指每句五个字，“七言”指每句七个字，例如《登鹳雀楼》是五言绝句，《暮江吟》是七言绝句。 常识：《全唐诗》是清代康熙年间（1705年开始编）奉皇帝命令编成的唐诗总集，共900卷，收诗四万八千九百多首、诗人两千二百多位。 常识：李白被后人誉为“诗仙”，杜甫被尊为“诗圣”，两人合称“李杜”。 常识：《唐诗三百首》是清代孙洙（号蘅塘退士）和夫人徐兰英编的唐诗选本，1763年前后成书，原本收77位诗人的311首诗，后来的版本有增补。 作者 查慎行：查慎行（1650—1727），浙江海宁人；金庸《鹿鼎记》的回目集自他的诗句。 作者 刘禹锡：刘禹锡（772—842），白居易称他为“诗豪”。 作者 杜牧：杜牧（803—约852），与李商隐并称“小李杜”。 作者 叶绍翁：叶绍翁是南宋诗人，生卒年不详；“一枝红杏出墙来”也是他写的。 作者 王维：王维（701？—761，生年一说699），苏轼称赞他“诗中有画，画中有诗”。 作者 李白：李白（701—762），被后人称为“诗仙”。 作者 苏轼：苏轼（1037—1101），号东坡居士，是“唐宋八大家”之一。 作者 袁枚：袁枚（1716—1798，卒年一说1797），辞官后住在南京随园，还写过美食书《随园食单》。 作者 王昌龄：王昌龄（约698—约757），擅长七言绝句，被誉为“七绝圣手”。 作者 王安石：王安石（1021—1086），字介甫，号半山，北宋政治家、文学家。 作者 杜甫：杜甫（712—770），被后人称为“诗圣”，在成都浣花溪边住过草堂。 作者 曾几：曾几（1084—1166），南宋诗人，大诗人陆游曾向他学诗。 作者 白居易：白居易（772—846），字乐天，年轻时做过杭州、苏州刺史。 作者 韦应物：韦应物（约737—约792），年轻时做过唐玄宗的侍卫，后来发奋读书。 《舟夜书所见》清·查慎行｜三年级上册·日积月累｜正文：月黑见渔灯，孤光一点萤。微微风簇浪，散作满河星。｜背景（史实）：写作时间、地点没有确切记载｜拓展：水面起了小波浪，一盏灯的倒影被打散，就像满河星星。 《望洞庭》唐·刘禹锡｜三年级上册｜正文：湖光秋月两相和，潭面无风镜未磨。遥望洞庭山水翠，白银盘里一青螺。｜背景（通说）：一般认为是824年秋刘禹锡赴和州刺史任、途经洞庭湖时所作。｜拓展：“白银盘里一青螺”的青螺，指的是洞庭湖中的君山。｜异文：“山水翠”一作“山水色”。 《山行》唐·杜牧｜三年级上册｜正文：远上寒山石径斜，白云生处有人家。停车坐爱枫林晚，霜叶红于二月花。｜背景（史实）：写作时间、地点没有确切记载｜拓展：“停车坐爱”的“坐”不是坐下，而是“因为”的意思。｜异文：“生处”一作“深处”，教材作“生处”；“斜”教材注音xié。 《夜书所见》宋·叶绍翁｜三年级上册｜正文：萧萧梧叶送寒声，江上秋风动客情。知有儿童挑促织，夜深篱落一灯明。｜背景（史实）：写作时间、地点没有确切记载｜拓展：诗里的“促织”就是蟋蟀，秋夜里雄蟋蟀靠摩擦翅膀鸣叫。 《鹿柴》唐·王维｜三年级上册｜正文：空山不见人，但闻人语响。返景入深林，复照青苔上。｜背景（史实）：鹿柴是王维辋川别业的一处景点，此诗收入他和好友裴迪唱和的《辋川集》。｜拓展：“鹿柴”的“柴”同“寨”，读zhài，意思是栅栏。 《望天门山》唐·李白｜三年级上册｜正文：天门中断楚江开，碧水东流至此回。两岸青山相对出，孤帆一片日边来。｜背景（通说）：一般认为是725年李白初出蜀地、乘船东下经过天门山时所作。｜拓展：天门山是东梁山和西梁山，两山隔着长江相对，像一扇门。 《饮湖上初晴后雨》宋·苏轼｜三年级上册｜正文：水光潋滟晴方好，山色空蒙雨亦奇。欲把西湖比西子，淡妆浓抹总相宜。｜背景（通说）：苏轼任杭州通判时游西湖所作，一般系于1073年。｜拓展：诗里把西湖比作美女西施，西湖因此又叫“西子湖”。｜异文：原为《饮湖上初晴后雨二首》其二；“空蒙”一作“空濛”。 《所见》清·袁枚｜三年级上册·日积月累｜正文：牧童骑黄牛，歌声振林樾。意欲捕鸣蝉，忽然闭口立。｜背景（史实）：写作时间、地点没有确切记载｜拓展：“林樾”指树荫；牧童忽然闭嘴，是怕把树上的蝉吓跑。 《早发白帝城》唐·李白｜三年级上册·日积月累｜正文：朝辞白帝彩云间，千里江陵一日还。两岸猿声啼不住，轻舟已过万重山。｜背景（通说）：一般认为是759年李白流放途中在白帝城遇赦，乘船东下江陵时所作；也有学者认为作于早年。｜拓展：白帝城在今重庆奉节，江陵在今湖北荆州，中间要穿过三峡。｜异文：诗题一作《下江陵》。 《采莲曲》唐·王昌龄｜三年级上册·日积月累｜正文：荷叶罗裙一色裁，芙蓉向脸两边开。乱入池中看不见，闻歌始觉有人来。｜背景（史实）：写作时间、地点没有确切记载｜拓展：“芙蓉”在这里指荷花；姑娘的绿裙和荷叶一个颜色。｜异文：原为《采莲曲二首》其二。 《惠崇春江晚景》宋·苏轼｜三年级下册｜正文：竹外桃花三两枝，春江水暖鸭先知。蒌蒿满地芦芽短，正是河豚欲上时。｜背景（史实）：苏轼为僧人惠崇的画《春江晚景》所写的题画诗，共两首；一般系于元丰八年（1085）。｜拓展：惠崇是北宋会画画的僧人，擅长画鹅、雁、鹭鸶等水边小景，原画没有流传下来。｜异文：原题《惠崇春江晚景二首》，课文选第一首。 《元日》宋·王安石｜三年级下册｜正文：爆竹声中一岁除，春风送暖入屠苏。千门万户曈曈日，总把新桃换旧符。｜背景（通说）：一说作于王安石开始主持变法之初的新年，借新年新气象寄托革新愿望。｜拓展：桃符是用桃木板做的，古人新年把它挂在大门两旁，用来辟邪祈福。｜异文：“春风”一作“东风”，“总把”一作“争插”。 《清明》唐·杜牧｜三年级下册｜正文：清明时节雨纷纷，路上行人欲断魂。借问酒家何处有？牧童遥指杏花村。｜背景（史实）：最早见于南宋类书《锦绣万花谷》，注明出自唐诗；写作时间、地点没有确切记载。｜拓展：清明既是二十四节气之一，也是传统节日，一般在公历4月4日到6日之间。｜异文：作者归属有争议：此诗最早见于南宋《锦绣万花谷》，只注“出唐诗”；后来因《千家诗》署名杜牧而广为流传。课本署杜牧。 《九月九日忆山东兄弟》唐·王维｜三年级下册｜正文：独在异乡为异客，每逢佳节倍思亲。遥知兄弟登高处，遍插茱萸少一人。｜背景（史实）：《全唐诗》题下原注“时年十七”：王维十七岁客居他乡，重阳节思念家乡兄弟而作。｜拓展：重阳节在农历九月初九，古人有登高、佩插茱萸的习俗。 《绝句》唐·杜甫｜三年级下册｜正文：迟日江山丽，春风花草香。泥融飞燕子，沙暖睡鸳鸯。｜背景（通说）：一般认为是764年春杜甫住在成都草堂时所作。｜拓展：春天泥土变得湿软，燕子忙着衔泥筑巢，所以“泥融飞燕子”。｜异文：原为《绝句二首》其一；与二年级下册“两个黄鹂鸣翠柳”那首《绝句》不是同一首。 《三衢道中》宋·曾几｜三年级下册｜正文：梅子黄时日日晴，小溪泛尽却山行。绿阴不减来时路，添得黄鹂四五声。｜背景（史实）：三衢指今浙江衢州一带，诗写诗人山行所见；具体写作年份没有确切记载。｜拓展：“梅子黄时”是江南梅雨季节，本该常下雨，诗人却遇上天天晴。 《忆江南》唐·白居易｜三年级下册·日积月累｜正文：江南好，风景旧曾谙。日出江花红胜火，春来江水绿如蓝。能不忆江南？｜背景（通说）：一般认为是白居易晚年在洛阳回忆江南所作，约在837年。｜拓展：“绿如蓝”的“蓝”是蓝草，一种能提取蓝色染料的植物。｜异文：这是一首词，原为《忆江南三首》其一。 《滁州西涧》唐·韦应物｜三年级下册·日积月累｜正文：独怜幽草涧边生，上有黄鹂深树鸣。春潮带雨晚来急，野渡无人舟自横。｜背景（通说）：一般认为是韦应物任滁州刺史时游城西西涧所作。｜拓展：“野渡无人舟自横”：没人的渡口，小船随水漂着打横。 《大林寺桃花》唐·白居易｜三年级下册·日积月累｜正文：人间四月芳菲尽，山寺桃花始盛开。长恨春归无觅处，不知转入此中来。｜背景（史实）：817年四月白居易贬江州司马时游庐山大林寺所作，另有《游大林寺序》记此事。｜拓展：山越高气温越低，所以山下花谢了，山上桃花才开。"
          PERSONA = ""
          JUDGE_DIMS = ["instruction_following", "continuity", "factuality", "non_repetition"]
          OFFSET = 0
          N = 8
          WHITESPACE = " \t\n\r　"
          PUNCT = "，。！？、；：“”‘’（）《》〈〉【】『』「」—…·～,.!?;:'\"()[]{}<>-_/\\|`~@#$%^&*+=·"
          DIGITS = {"０": "0", "１": "1", "２": "2", "３": "3", "４": "4", "５": "5", "６": "6", "７": "7", "８": "8", "９": "9", "零": "0", "一": "1", "二": "2", "三": "3", "四": "4", "五": "5", "六": "6", "七": "7", "八": "8", "九": "9"}
          def rune_count(text):
              n = 0
              for _ in text.codepoints():
                  n += 1
              return n

          def normalize(text, drop_punct):
              out = []
              for ch in text.codepoints():
                  if ch in WHITESPACE:
                      continue
                  if drop_punct and ch in PUNCT:
                      continue
                  if ch in DIGITS:
                      out.append(DIGITS[ch])
                      continue
                  out.append(ch.lower())
              return "".join(out)

          def is_sentinel(value):
              if value in ["```", "###", "-"]:
                  return True
              if len(value) < 2 or not value.endswith("."):
                  return False
              for ch in value[:-1].codepoints():
                  if ch not in "0123456789":
                      return False
              return True

          def forbidden_hit(text, needle):
              trimmed = needle.strip()
              if trimmed.endswith(":") or trimmed.endswith("："):
                  return normalize(trimmed, False) in normalize(text, False)
              normalized = normalize(needle, True)
              if normalized == "" or is_sentinel(trimmed):
                  return trimmed in text
              return normalized in normalize(text, True)

          def deterministic_failures(index, text):
              spec = CHECKS[index]
              failures = []
              plain = normalize(text, False)
              for fact in spec.get("required", []):
                  if normalize(fact, False) not in plain:
                      failures.append("required:" + fact)
              for group in spec.get("required_any", []):
                  found = False
                  for fact in group:
                      if normalize(fact, False) in plain:
                          found = True
                          break
                  if not found:
                      failures.append("required_any:" + "|".join(group))
              for fact in spec.get("forbidden", []):
                  if forbidden_hit(text, fact):
                      failures.append("forbidden:" + fact)
              count = rune_count(text)
              if spec.get("min_runes", 0) > 0 and count < spec["min_runes"]:
                  failures.append("min_runes:" + str(count) + "<" + str(spec["min_runes"]))
              if spec.get("max_runes", 0) > 0 and count > spec["max_runes"]:
                  failures.append("max_runes:" + str(count) + ">" + str(spec["max_runes"]))
              return failures

          def aligned_rounds(messages):
              # Returns [(index, request_text, reply_text)] aligned from the newest message
              # backwards so a truncated History window still maps later rounds correctly.
              users = []
              previous_assistant = ""
              for message in messages:
                  role = message.get("role", "")
                  content = message.get("content", "")
                  if role == "assistant":
                      previous_assistant = content
                  elif role == "user":
                      users.append((previous_assistant, content))
              rounds = []
              total = len(users)
              for position in range(total):
                  index = N - 1 - (total - 1 - position)
                  if index < 0:
                      continue
                  request = REQUESTS[index]
                  if request == "":
                      request = users[position][0]
                  rounds.append((index, request, users[position][1]))
              return rounds

          def output_index(messages):
              count = 0
              last = ""
              for message in messages:
                  if message.get("role", "") == "assistant":
                      count += 1
                      last = message.get("content", "").strip()
              index = count
              if last != "":
                  for j in range(N):
                      if REQUESTS[j] != "" and REQUESTS[j].strip() == last and j + 1 - OFFSET > index:
                          index = j + 1 - OFFSET
              return index

          def recent_transcript(messages, limit):
              lines = []
              for message in messages[-limit:]:
                  role = message.get("role", "")
                  label = "玩家" if role == "assistant" else "目标"
                  lines.append(label + "：" + message.get("content", "").strip())
              return "\n".join(lines)

          def run(input):
              messages = input["messages"]
              k = output_index(messages)
              request_index = k + OFFSET
              if request_index < N:
                  if REQUESTS[request_index] != "":
                      return {
                          "route": "scripted",
                          "message": REQUESTS[request_index],
                          "det": "",
                          "system": "你是测试脚手架。只回复 OK。",
                          "user": "OK",
                      }
                  system = "\n".join([
                      RULES,
                      "",
                      "现在你扮演模拟玩家。" + PERSONA,
                      "根据给定意图，只输出一句自然的玩家话语；不得回答它、不得添加对话中不存在的名字、数字、事件或证据，不得削弱意图约束，不得提及测试。只输出这句话，不要引号、前缀或解释。",
                  ])
                  user = "意图：" + INTENTS[request_index] + "\n\n最近对话：\n" + recent_transcript(messages, 6)
                  return {"route": "player", "message": "", "det": "", "system": system, "user": user}
              rounds = aligned_rounds(messages)
              failures = []
              blocks = []
              for round in rounds:
                  index = round[0]
                  for failure in deterministic_failures(index, round[2]):
                      failures.append(CHECKPOINTS[index] + " " + failure)
                  blocks.append("\n".join([
                      "【第" + str(index + 1) + "轮 " + CHECKPOINTS[index] + "】",
                      "契约：" + CONTRACTS[index],
                      "玩家：" + round[1],
                      "目标：" + round[2],
                  ]))
              system = "\n".join([
                  RULES,
                  "",
                  "这是最后一轮。你只看到完整对话记录：标注“玩家”的是测试方发出的消息，标注“目标”的是被测 Workflow 的回复。",
                  "请依据每一轮的契约逐轮判断以下维度：" + "、".join(JUDGE_DIMS) + "。确定性字数、关键词、顺序和延迟门槛由外部负责，你只判断语义：连续性、事实边界、指令遵循、不重复、玩家自主权和安全。",
                  "确定性检查（字数、关键词、顺序、延迟）已由外部完成：本轮若未列出失败，就不得以这些理由判 FAIL，也不得自行重新计数。",
                  "判 FAIL 必须写明具体轮号和该轮回复中的具体缺陷原文；举不出具体轮号和原文时一律判 PASS。",
                  "不得因为风格偏好、篇幅、语气或可以更好判坏语义合格的回复；但契约明确暴露的事实边界被违反时必须判 FAIL。",
                  "先用不超过200字说明依据，最后一行只写 PASS 或 FAIL，不要其他字符。",
              ])
              user_parts = ["完整测试对话（按时间顺序，共 " + str(len(rounds)) + " 轮可见）：", ""] + blocks
              if len(failures) > 0:
                  user_parts.append("")
                  user_parts.append("确定性检查已发现失败（最终裁决将为 FAIL）：" + "；".join(failures))
              user_parts.append("")
              user_parts.append("请按规则裁决，最后一行只写 PASS 或 FAIL。")
              return {
                  "route": "judge",
                  "message": "",
                  "det": "；".join(failures),
                  "system": system,
                  "user": "\n".join(user_parts),
              }
        limits:
          max_execution_steps: 2000000
          timeout: 2s
          max_input_bytes: 1048576
          max_output_bytes: 262144
      - id: build-prompt
        type: prompt
        inputs:
          system:
            from: prompt-system
          user:
            from: prompt-user
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: '{system}'
        - role: user
          template: '{user}'
      - id: judge-model
        type: chat_model
        inputs:
          messages:
            from: judge-messages
        outputs:
          text: model-text
        model: learn-chinese-poetry-grade3-test.model
        max_tokens: 512
        temperature: 0
      - id: finalize
        type: script
        inputs:
          route:
            from: tester-route
          message:
            from: tester-message
          det:
            from: tester-det
          model_text:
            from: model-text
        outputs:
          answer: answer
        language: starlark
        entrypoint: run
        source: |
          def verdict_from(text):
              lines = []
              for line in text.strip().split("\n"):
                  if line.strip() != "":
                      lines.append(line.strip())
              last = lines[-1] if len(lines) > 0 else ""
              if "PASS" in last and "FAIL" not in last:
                  return "PASS"
              if "FAIL" in last:
                  return "FAIL"
              if "PASS" in text and "FAIL" not in text:
                  return "PASS"
              return "FAIL"

          def run(input):
              route = input["route"]
              if route == "scripted":
                  return {"answer": input["message"]}
              if route == "player":
                  text = input["model_text"].strip()
                  first = text.split("\n")[0].strip().strip("“”\"'")
                  if first == "":
                      first = "请继续。"
                  return {"answer": first}
              if input["det"] != "":
                  return {"answer": "FAIL 确定性检查：" + input["det"]}
              verdict = verdict_from(input["model_text"])
              if verdict == "PASS":
                  return {"answer": "PASS"}
              return {"answer": "FAIL 裁判：" + input["model_text"].strip()[:400]}
        limits:
          max_execution_steps: 200000
          timeout: 500ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      edges:
      - from: start
        to: route-turn
      - from: route-turn
        to: build-prompt
      - from: build-prompt
        to: judge-model
      - from: judge-model
        to: finalize
      - from: finalize
        to: end
      branches: []
      outputs:
      - node: finalize
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
