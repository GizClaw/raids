---
apiVersion: gizclaw.admin/v1alpha1
kind: Model
metadata:
  id: doubao-seed-2-1-lite-narration
spec:
  kind: llm
  source: manual
  provider:
    kind: volc-tenant
    id: volc-cn-beijing
  display_name: Doubao Seed 2.1 Lite News Narration
  description: News narration and factual answers with function tools omitted from provider requests
  provider_data:
    api_mode: chat_completions
    service_tier: fast
    upstream_model: doubao-seed-2-1-lite-260915
    support_json_output: true
    support_temperature: true
    support_text_only: true
    support_tool_calls: false
    support_thinking: true
    thinking_param: thinking.type
    # Ark: doubao-seed-2-1-lite-260915 accepts thinking.type enabled (default) or disabled.
    thinking_levels:
      - enabled
      - disabled
    default_thinking_level: disabled
    use_system_role: true
