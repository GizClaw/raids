apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: learn-chinese-words-test
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    graph:
      name: learn-chinese-words-test-relay
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 8
      state:
        fields:
        - name: tester-route
          type: string
          merge: replace
        - name: tester-message
          type: string
          merge: replace
        - name: tester-det
          type: string
          merge: replace
        - name: prompt-system
          type: string
          merge: replace
        - name: prompt-user
          type: string
          merge: replace
        - name: judge-messages
          type: messages
          merge: replace
        - name: model-text
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: route-turn
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: tester-route
          message: tester-message
          det: tester-det
          system: prompt-system
          user: prompt-user
        language: starlark
        entrypoint: run
        source: |
          REQUESTS = ["请从指定中文开场开始。", "我一年级。我们来猜歇后语：竹篮打水，下半句是什么？你先别告诉我，给我一个提示。", "是“一场雨”吗？", "我猜不出来，告诉我答案和意思吧。", "“书山有路勤为径”是谁说的？", "给我讲讲“森”字是怎么来的。", "请记住：我今天学会了歇后语竹篮打水，下次想学对韵歌。只确认你已经记住。", "重连后，请只说我下次想学什么。"]
          INTENTS = ["", "", "", "", "", "", "", ""]
          CHECKPOINTS = ["opening", "riddle-no-spoiler", "wrong-guess", "reveal", "disputed-quote", "character-story", "memory-store", "memory-recall"]
          CONTRACTS = ["必须逐字符合指定中文开场；不得含Markdown、列表、emoji或舞台说明；15-240字", "只给提示，不得说出后半句；20-360字", "温和说不对并再给一个提示，不得公布答案；10-360字", "说出“竹篮打水——一场空”并讲清意思；20-360字", "必须说明课本没写作者、常说是韩愈但他的作品里找不到这句，不得肯定地说就是韩愈说的；20-360字", "按知识卡描述古字样子（三个木），不说看图；20-360字", "必须确认已记住下次想学对韵歌（复述措辞可以不同，下一轮重连后再严格核对）；4-320字", "重载后必须从长期记忆准确回忆对韵歌；只回答主题；2-200字"]
          CHECKS = [{"required": ["你好呀，我是语文小书童。我们来玩语文积累游戏吧，猜谚语下半句、猜歇后语，还是听一个汉字的小故事？先告诉我你上几年级。"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 15, "max_runes": 240}, {"required": [], "required_any": [], "forbidden": ["###", "```", "- ", "* ", "一场空"], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["不对", "不是", "差一点", "再想想", "不太对"]], "forbidden": ["###", "```", "- ", "* ", "一场空"], "min_runes": 10, "max_runes": 360}, {"required": ["一场空"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["没写", "没有写", "不确定", "说法", "一般认为", "常说", "有人说", "没有确切", "找不到", "不同"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["木"]], "forbidden": ["###", "```", "- ", "* ", "看图"], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["记住", "记下", "记好", "记得"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 4, "max_runes": 320}, {"required": ["对韵歌"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 2, "max_runes": 200}]
          RULES = "你是 `learn-chinese-words` 的专属验收 Workflow，不是目标角色。指定中文开场是：你好呀，我是语文小书童。我们来玩语文积累游戏吧，猜谚语下半句、猜歇后语，还是听一个汉字的小故事？先告诉我你上几年级。 体验要求：语文小书童陪一到六年级孩子玩语言积累；谚语、歇后语、名言和对子原文必须逐字一致；猜题必须先提示后公布；孩子接错时要温和说不对并再提示，不直接公布；孩子明确猜不出时才公布并解释；名言争议必须说清，不编造出处、年代和人物细节；孩子提到卡外的谚语、成语或名言也要正常陪聊，婉拒属于失败。本路线的歇后语是“竹篮打水——一场空”，意思是白费力气，什么也没得到。“书山有路勤为径，学海无涯苦作舟”在课本中未署作者，常被说成韩愈所作，但韩愈作品里没有这两句，作者不详。“森”的古字样子是三个“木”叠在一起，表示树木又多又密；课文写“三木森”。 目标可用的完整知识卡如下，其中任何内容都不算编造，知识卡以外的人物、年代、历史、数字和情节才算：谚语（一年级上册）：一年之计在于春，一日之计在于晨。｜意思：春天和早晨是打基础的好时光 谚语（一年级上册）：一寸光阴一寸金，寸金难买寸光阴。｜意思：时间宝贵，用钱也买不回 谚语（一年级上册）：站如松，坐如钟。行如风，卧如弓。｜意思：站坐走睡都要有好姿势 谚语（一年级上册）：种瓜得瓜，种豆得豆。｜意思：做什么事，就得什么结果 谚语（一年级上册）：前人栽树，后人乘凉。｜意思：前人辛苦付出，后人得到好处 谚语（一年级上册）：千里之行，始于足下。｜意思：再远的路也要从第一步走起 谚语（一年级上册）：百尺竿头，更进一步。｜意思：已经很好了，还要再努力 谚语（一年级下册）：朝霞不出门，晚霞行千里。｜意思：早上有霞可能下雨，傍晚有霞多晴 谚语（一年级下册）：有雨山戴帽，无雨半山腰。｜意思：云盖山顶要下雨，云在山腰不下 谚语（一年级下册）：早晨下雨当日晴，晚上下雨到天明。｜意思：早雨白天会晴，夜雨下到天亮 谚语（一年级下册）：蚂蚁搬家蛇过道，大雨不久要来到。｜意思：蚂蚁搬家、蛇出洞，大雨快来了 谚语（二年级上册）：十年树木，百年树人。｜意思：培养一个人要花很长时间 谚语（二年级上册）：树无根不长，人无志不立。｜意思：人没有志向就立不住 谚语（二年级上册）：一九二九不出手，三九四九冰上走，五九六九，沿河看柳，七九河开，八九雁来，九九加一九，耕牛遍地走。｜意思：数九：冬天到春天的天气变化 谚语（二年级上册）：一日读书一日功，一日不读十日空。｜意思：天天读书才有收获 谚语（二年级下册）：予人玫瑰，手有余香。｜意思：帮助别人，自己也快乐 谚语（二年级下册）：平时肯帮人，急时有人帮。｜意思：常帮别人，有难时别人也帮你 谚语（二年级下册）：与其锦上添花，不如雪中送炭。｜意思：在别人最难时帮忙最可贵 谚语（二年级下册）：春雨惊春清谷天，夏满芒夏暑相连。秋处露秋寒霜降，冬雪雪冬小大寒。｜意思：每字代表一个节气，共二十四个 谚语（三年级上册）：人心齐，泰山移。｜意思：大家一条心，力量大无比 谚语（三年级上册）：二人同心，其利断金。｜意思：两人齐心，力量能切断金属 谚语（三年级上册）：三个臭皮匠，顶个诸葛亮。｜意思：大家一起想办法，胜过聪明人 谚语（三年级下册）：兵来将挡，水来土掩。｜意思：遇到什么问题就想办法应对 谚语（三年级下册）：不入虎穴，焉得虎子。｜意思：不冒险就难以成功 谚语（三年级下册）：眼见为实，耳听为虚。｜意思：亲眼看到的比听说的可靠 谚语（三年级下册）：近朱者赤，近墨者黑。｜意思：常和什么人在一起就会受影响 谚语（四年级上册）：立了秋，把扇丢。｜意思：立秋后天凉，不用扇子了 谚语（四年级上册）：二八月，乱穿衣。｜意思：农历二月八月冷热多变 谚语（四年级上册）：一场秋雨一场寒，十场秋雨要穿棉。｜意思：秋雨一场场，天一天天变冷 谚语（四年级上册）：八月里来雁门开，雁儿脚上带霜来。｜意思：大雁南飞时，霜也快来了 谚语（四年级上册）：尺有所短，寸有所长。｜意思：人和物各有长处和短处 谚语（四年级上册）：一言既出，驷马难追。｜意思：话说出口就要算数 谚语（四年级上册）：差之毫厘，谬以千里。｜意思：开始差一点，结果差很远 谚语（四年级下册）：少年不知勤学苦，老来方知读书迟。｜意思：小时不勤学，老了才后悔 谚语（六年级下册）：莫道君行早，更有早行人。｜意思：别以为自己最早，还有更早的 谚语（六年级下册）：路遥知马力，日久见人心。｜意思：时间长了才看出人好坏 谚语（六年级下册）：听君一席话，胜读十年书。｜意思：听了你的话，收获特别大 谚语（六年级下册）：有意栽花花不发，无心插柳柳成荫。｜意思：用心做的未必成，随手做的却成了 谚语（六年级下册）：书到用时方恨少，事非经过不知难。｜意思：要用时才觉得书读少了 谚语（六年级下册）：良药苦口利于病，忠言逆耳利于行。｜意思：批评的话难听，却对人有益 歇后语（一年级下册）：芝麻开花——节节高｜意思：一步比一步好 歇后语（一年级下册）：竹篮打水——一场空｜意思：白费力气，什么也没得到 歇后语（一年级下册）：十五个吊桶打水——七上八下｜意思：心里慌乱不安 名言（一年级下册）：不知则问，不能则学。｜出处：《荀子》｜意思：不懂就问，不会就学 名言（一年级下册）：读万卷书，行万里路。｜出处：董其昌｜意思：多读书，也要多出去见识 名言（一年级下册）：读书破万卷，下笔如有神。｜出处：杜甫｜意思：书读得多，写作就流畅 名言（二年级上册）：黑发不知勤学早，白首方悔读书迟。｜出处：教材未署作者｜意思：年轻不勤学，老了才后悔｜注意：课本没写作者，常说是颜真卿，但没找到可靠早期出处 名言（二年级上册）：书山有路勤为径，学海无涯苦作舟。｜出处：教材未署作者｜意思：勤奋和吃苦是学习的路和船｜注意：课本没写作者，常说是韩愈，但他的作品里找不到这句 名言（二年级上册）：有志者事竟成。｜出处：《后汉书》｜意思：有志向的人终能成功 名言（二年级上册）：志当存高远。｜出处：诸葛亮｜意思：志向要远大 名言（二年级上册）：穷且益坚，不坠青云之志。｜出处：王勃｜意思：处境越难越坚定，不丢大志向 名言（二年级上册）：己所不欲，勿施于人。｜出处：《论语》｜意思：自己不想要的，别强加给别人 名言（二年级上册）：与朋友交，言而有信。｜出处：《论语》｜意思：和朋友交往要说话算数｜注意：这句是子夏说的，不是孔子说的 名言（二年级上册）：不以规矩，不能成方圆。｜出处：《孟子》｜意思：做事要守规则 名言（二年级下册）：失信不立。｜出处：《左传》｜意思：不讲信用就立不住脚 名言（二年级下册）：诚信者，天下之结也。｜出处：《管子》｜意思：诚信是连结天下人的纽带 名言（二年级下册）：小信成则大信立。｜出处：《韩非子》｜意思：小事守信，才能赢得大信任 名言（三年级上册）：仁者爱人，有礼者敬人。｜出处：《孟子》｜意思：仁爱的人爱别人，有礼的人尊重人 名言（三年级上册）：与人善言，暖于布帛；伤人以言，深于矛戟。｜出处：《荀子》｜意思：好话暖人心，恶语比刀伤人深 名言（三年级上册）：士不可以不弘毅，任重而道远。｜出处：《论语》｜意思：读书人要胸怀宽、意志坚｜注意：这句是曾子说的，不是孔子说的 名言（三年级上册）：锲而舍之，朽木不折；锲而不舍，金石可镂。｜出处：《荀子》｜意思：坚持不放弃，金石也能刻穿 名言（三年级下册）：人谁无过？过而能改，善莫大焉。｜出处：《左传》｜意思：谁都会犯错，改了就是好事 名言（四年级上册）：人非生而知之者，孰能无惑？｜出处：韩愈｜意思：没人天生就懂，谁都有疑问 名言（四年级上册）：善疑者，不疑人之所疑，而疑人之所不疑。｜出处：方以智｜意思：会提问的人能在没人怀疑处发现问题 名言（四年级下册）：天行健，君子以自强不息。｜出处：《周易》｜意思：像天运行不停一样，永远努力 名言（四年级下册）：生于忧患而死于安乐。｜出处：《孟子》｜意思：忧患使人奋发，安乐使人衰败 名言（五年级上册）：盛年不重来，一日难再晨。及时当勉励，岁月不待人。｜出处：陶渊明｜意思：青春不再来，要抓紧时间努力 名言（五年级上册）：莫等闲，白了少年头，空悲切。｜出处：岳飞｜意思：别虚度青春，老了空后悔｜注意：课本写岳飞，但《满江红》是不是他写的仍有争议 名言（五年级下册）：君子坦荡荡，小人长戚戚。｜出处：《论语》｜意思：君子心胸宽，小人常忧愁 名言（五年级下册）：多行不义，必自毙。｜出处：《左传》｜意思：坏事做多了，必然自取灭亡 名言（六年级上册）：位卑未敢忘忧国。｜出处：陆游｜意思：地位再低也不忘关心国家 名言（六年级上册）：其实地上本没有路，走的人多了，也便成了路。｜出处：鲁迅｜意思：路是人走出来的，要敢开拓 名言（六年级下册）：青，取之于蓝，而青于蓝。｜出处：《荀子》｜意思：学生可以超过老师 对子（一年级上册）：云对雨，雪对风。花对树，鸟对虫。山清对水秀，柳绿对桃红。 对子（一年级下册）：古对今，圆对方。严寒对酷暑，春暖对秋凉。晨对暮，雪对霜。和风对细雨，朝霞对夕阳。桃对李，柳对杨。莺歌对燕舞，鸟语对花香。 对子（二年级上册）：有山皆图画，无水不文章。 对子（二年级上册）：白马西风塞上，杏花烟雨江南。 对子（二年级上册）：清风明月本无价，近水远山皆有情。 对子（二年级上册）：雾锁山头山锁雾，天连水尾水连天。 汉字（一年级上册）：日｜古字样子：甲骨文是个圆圈像太阳，中间一点或一横表示太阳的光。｜来历：没有另外记载小故事 汉字（一年级上册）：月｜古字样子：古字像一弯半个月亮，《说文》说像月亮不圆满的样子。｜来历：没有另外记载小故事 汉字（一年级上册）：山｜古字样子：古字像几座山峰并排立在一起。｜来历：没有另外记载小故事 汉字（一年级上册）：水｜古字样子：甲骨文中间一道弯弯像水流，两边小点像流动的水花。｜来历：没有另外记载小故事 汉字（一年级上册）：火｜古字样子：甲骨文像一团向上蹿的火苗，下面大，上面尖。｜来历：没有另外记载小故事 汉字（一年级上册）：田｜古字样子：字形像田埂横竖交错，把地分成一块块农田。｜来历：没有另外记载小故事 汉字（一年级上册）：禾｜古字样子：金文像一棵庄稼，顶上的谷穗沉甸甸地垂下来。｜来历：没有另外记载小故事 汉字（一年级上册）：口｜古字样子：甲骨文像人张开的嘴巴。｜来历：没有另外记载小故事 汉字（一年级上册）：目｜古字样子：古字像一只眼睛，外框是眼眶，里面是眼珠。｜来历：没有另外记载小故事 汉字（一年级上册）：人｜古字样子：甲骨文像一个侧着身子站立的人。｜来历：没有另外记载小故事 汉字（一年级上册）：木｜古字样子：甲骨文像一棵树，上面是树枝，下面是树根。｜来历：没有另外记载小故事 汉字（一年级上册）：林｜古字样子：两个“木”并排站，表示树木成片生长。｜来历：课文：双木林。 汉字（一年级上册）：森｜古字样子：三个“木”叠在一起，表示树木又多又密。｜来历：课文：三木森。 汉字（一年级上册）：明｜古字样子：甲骨文把“日”和“月”放在一起，表示明亮。｜来历：课文：日月明。 汉字（二年级下册）：贝｜古字样子：甲骨文像一枚海贝，背部拱起，下面有一道开口。｜来历：古人觉得贝壳漂亮珍贵，还把它当钱用，所以贝字旁的字多和钱财有关，如赚、赔、购、贫、货。"
          PERSONA = ""
          JUDGE_DIMS = ["instruction_following", "continuity", "factuality", "non_repetition"]
          OFFSET = 0
          N = 8
          WHITESPACE = " \t\n\r　"
          PUNCT = "，。！？、；：“”‘’（）《》〈〉【】『』「」—…·～,.!?;:'\"()[]{}<>-_/\\|`~@#$%^&*+=·"
          DIGITS = {"０": "0", "１": "1", "２": "2", "３": "3", "４": "4", "５": "5", "６": "6", "７": "7", "８": "8", "９": "9", "零": "0", "一": "1", "二": "2", "三": "3", "四": "4", "五": "5", "六": "6", "七": "7", "八": "8", "九": "9"}
          def rune_count(text):
              n = 0
              for _ in text.codepoints():
                  n += 1
              return n

          def normalize(text, drop_punct):
              out = []
              for ch in text.codepoints():
                  if ch in WHITESPACE:
                      continue
                  if drop_punct and ch in PUNCT:
                      continue
                  if ch in DIGITS:
                      out.append(DIGITS[ch])
                      continue
                  out.append(ch.lower())
              return "".join(out)

          def is_sentinel(value):
              if value in ["```", "###", "-"]:
                  return True
              if len(value) < 2 or not value.endswith("."):
                  return False
              for ch in value[:-1].codepoints():
                  if ch not in "0123456789":
                      return False
              return True

          def forbidden_hit(text, needle):
              trimmed = needle.strip()
              if trimmed.endswith(":") or trimmed.endswith("："):
                  return normalize(trimmed, False) in normalize(text, False)
              normalized = normalize(needle, True)
              if normalized == "" or is_sentinel(trimmed):
                  return trimmed in text
              return normalized in normalize(text, True)

          def deterministic_failures(index, text):
              spec = CHECKS[index]
              failures = []
              plain = normalize(text, False)
              for fact in spec.get("required", []):
                  if normalize(fact, False) not in plain:
                      failures.append("required:" + fact)
              for group in spec.get("required_any", []):
                  found = False
                  for fact in group:
                      if normalize(fact, False) in plain:
                          found = True
                          break
                  if not found:
                      failures.append("required_any:" + "|".join(group))
              for fact in spec.get("forbidden", []):
                  if forbidden_hit(text, fact):
                      failures.append("forbidden:" + fact)
              count = rune_count(text)
              if spec.get("min_runes", 0) > 0 and count < spec["min_runes"]:
                  failures.append("min_runes:" + str(count) + "<" + str(spec["min_runes"]))
              if spec.get("max_runes", 0) > 0 and count > spec["max_runes"]:
                  failures.append("max_runes:" + str(count) + ">" + str(spec["max_runes"]))
              return failures

          def aligned_rounds(messages):
              # Returns [(index, request_text, reply_text)] aligned from the newest message
              # backwards so a truncated History window still maps later rounds correctly.
              users = []
              previous_assistant = ""
              for message in messages:
                  role = message.get("role", "")
                  content = message.get("content", "")
                  if role == "assistant":
                      previous_assistant = content
                  elif role == "user":
                      users.append((previous_assistant, content))
              rounds = []
              total = len(users)
              for position in range(total):
                  index = N - 1 - (total - 1 - position)
                  if index < 0:
                      continue
                  request = REQUESTS[index]
                  if request == "":
                      request = users[position][0]
                  rounds.append((index, request, users[position][1]))
              return rounds

          def output_index(messages):
              count = 0
              last = ""
              for message in messages:
                  if message.get("role", "") == "assistant":
                      count += 1
                      last = message.get("content", "").strip()
              index = count
              if last != "":
                  for j in range(N):
                      if REQUESTS[j] != "" and REQUESTS[j].strip() == last and j + 1 - OFFSET > index:
                          index = j + 1 - OFFSET
              return index

          def recent_transcript(messages, limit):
              lines = []
              for message in messages[-limit:]:
                  role = message.get("role", "")
                  label = "玩家" if role == "assistant" else "目标"
                  lines.append(label + "：" + message.get("content", "").strip())
              return "\n".join(lines)

          def run(input):
              messages = input["messages"]
              k = output_index(messages)
              request_index = k + OFFSET
              if request_index < N:
                  if REQUESTS[request_index] != "":
                      return {
                          "route": "scripted",
                          "message": REQUESTS[request_index],
                          "det": "",
                          "system": "你是测试脚手架。只回复 OK。",
                          "user": "OK",
                      }
                  system = "\n".join([
                      RULES,
                      "",
                      "现在你扮演模拟玩家。" + PERSONA,
                      "根据给定意图，只输出一句自然的玩家话语；不得回答它、不得添加对话中不存在的名字、数字、事件或证据，不得削弱意图约束，不得提及测试。只输出这句话，不要引号、前缀或解释。",
                  ])
                  user = "意图：" + INTENTS[request_index] + "\n\n最近对话：\n" + recent_transcript(messages, 6)
                  return {"route": "player", "message": "", "det": "", "system": system, "user": user}
              rounds = aligned_rounds(messages)
              failures = []
              blocks = []
              for round in rounds:
                  index = round[0]
                  for failure in deterministic_failures(index, round[2]):
                      failures.append(CHECKPOINTS[index] + " " + failure)
                  blocks.append("\n".join([
                      "【第" + str(index + 1) + "轮 " + CHECKPOINTS[index] + "】",
                      "契约：" + CONTRACTS[index],
                      "玩家：" + round[1],
                      "目标：" + round[2],
                  ]))
              system = "\n".join([
                  RULES,
                  "",
                  "这是最后一轮。你只看到完整对话记录：标注“玩家”的是测试方发出的消息，标注“目标”的是被测 Workflow 的回复。",
                  "请依据每一轮的契约逐轮判断以下维度：" + "、".join(JUDGE_DIMS) + "。确定性字数、关键词、顺序和延迟门槛由外部负责，你只判断语义：连续性、事实边界、指令遵循、不重复、玩家自主权和安全。",
                  "确定性检查（字数、关键词、顺序、延迟）已由外部完成：本轮若未列出失败，就不得以这些理由判 FAIL，也不得自行重新计数。",
                  "判 FAIL 必须写明具体轮号和该轮回复中的具体缺陷原文；举不出具体轮号和原文时一律判 PASS。",
                  "不得因为风格偏好、篇幅、语气或可以更好判坏语义合格的回复；但契约明确暴露的事实边界被违反时必须判 FAIL。",
                  "先用不超过200字说明依据，最后一行只写 PASS 或 FAIL，不要其他字符。",
              ])
              user_parts = ["完整测试对话（按时间顺序，共 " + str(len(rounds)) + " 轮可见）：", ""] + blocks
              if len(failures) > 0:
                  user_parts.append("")
                  user_parts.append("确定性检查已发现失败（最终裁决将为 FAIL）：" + "；".join(failures))
              user_parts.append("")
              user_parts.append("请按规则裁决，最后一行只写 PASS 或 FAIL。")
              return {
                  "route": "judge",
                  "message": "",
                  "det": "；".join(failures),
                  "system": system,
                  "user": "\n".join(user_parts),
              }
        limits:
          max_execution_steps: 2000000
          timeout: 2s
          max_input_bytes: 1048576
          max_output_bytes: 262144
      - id: build-prompt
        type: prompt
        inputs:
          system:
            from: prompt-system
          user:
            from: prompt-user
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: '{system}'
        - role: user
          template: '{user}'
      - id: judge-model
        type: chat_model
        inputs:
          messages:
            from: judge-messages
        outputs:
          text: model-text
        model: learn-chinese-words-test.model
        max_tokens: 512
        temperature: 0
      - id: finalize
        type: script
        inputs:
          route:
            from: tester-route
          message:
            from: tester-message
          det:
            from: tester-det
          model_text:
            from: model-text
        outputs:
          answer: answer
        language: starlark
        entrypoint: run
        source: |
          def verdict_from(text):
              lines = []
              for line in text.strip().split("\n"):
                  if line.strip() != "":
                      lines.append(line.strip())
              last = lines[-1] if len(lines) > 0 else ""
              if "PASS" in last and "FAIL" not in last:
                  return "PASS"
              if "FAIL" in last:
                  return "FAIL"
              if "PASS" in text and "FAIL" not in text:
                  return "PASS"
              return "FAIL"

          def run(input):
              route = input["route"]
              if route == "scripted":
                  return {"answer": input["message"]}
              if route == "player":
                  text = input["model_text"].strip()
                  first = text.split("\n")[0].strip().strip("“”\"'")
                  if first == "":
                      first = "请继续。"
                  return {"answer": first}
              if input["det"] != "":
                  return {"answer": "FAIL 确定性检查：" + input["det"]}
              verdict = verdict_from(input["model_text"])
              if verdict == "PASS":
                  return {"answer": "PASS"}
              return {"answer": "FAIL 裁判：" + input["model_text"].strip()[:400]}
        limits:
          max_execution_steps: 200000
          timeout: 500ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      edges:
      - from: start
        to: route-turn
      - from: route-turn
        to: build-prompt
      - from: build-prompt
        to: judge-model
      - from: judge-model
        to: finalize
      - from: finalize
        to: end
      branches: []
      outputs:
      - node: finalize
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
