---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-story-three-kingdoms
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: story-teller
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-story-three-kingdoms.storyteller
    graph:
      name: story-three-kingdoms-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: memory-query
          type: string
          merge: replace
        - name: memory-route
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: observation
          type: string
          merge: replace
        - name: chapter-direction
          type: string
          merge: replace
        - name: chapter-route
          type: string
          merge: replace
      nodes:
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
          route: memory-route
          memory: recalled
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              cues = ["重连", "恢复", "回忆", "还记得", "代号", "更正", "改成", "上次", "continue where", "left off"]
              recall = False
              for cue in cues:
                  if cue in text:
                      recall = True
              route = "opening" if not text else ("recall" if recall else "continue")
              return {"query": "三国乱世故事状态、章节、角色、选择、更正、旅程代号和未解决线索；当前请求：" + text, "route": route, "memory": ""}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-memory
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 16
      - id: control-chapter
        type: script
        inputs:
          text:
            from: input.text
          history:
            from: input.messages
        outputs:
          direction: chapter-direction
          route: chapter-route
        language: starlark
        entrypoint: run
        source: |
          def device_text(text):
              for mark in ["。", "！", "!", "，", ",", ".", "?", "？", " ", "\n"]:
                  text = text.replace(mark, "")
              return text.lower()

          def run(input):
              chapters = ["营帐军情", "百姓与追击", "联盟试探", "责任定策"]
              current = input["text"].strip()
              compact = device_text(current)
              history = input.get("history", [])
              start_words = ["开始", "开始吧", "从头开始", "重新开始", "start", "startover", "restart"]
              continue_words = ["继续", "继续吧", "继续听", "好", "好的", "好呀", "要", "要的", "可以", "嗯", "行", "continue", "yes", "ok", "okay"]
              # Only a heading this Workflow already spoke establishes the chapter; a restart
              # request drops everything before it.
              chapter = 1
              spoken_since = 0
              hinted = False
              for message in history:
                  if message["role"] == "user" and device_text(message["content"]) in start_words:
                      chapter = 1
                      spoken_since = 0
                      hinted = False
                  if message["role"] != "assistant" and message["role"] != "model":
                      continue
                  content = message["content"]
                  delivered = 0
                  for index in range(len(chapters)):
                      if ("第 " + str(index + 1) + " 章：" + chapters[index]) in content or ("第" + str(index + 1) + "章：" + chapters[index]) in content:
                          delivered = index + 1
                  if delivered > 0:
                      chapter = delivered
                      spoken_since = 0
                      hinted = False
                  else:
                      spoken_since += 1
                      if "这一章的选择完成啦" in content or "下一章" in content:
                          hinted = True
              # One exchange in the chapter is enough: 继续 then means the next chapter,
              # whether or not the narrator remembered to speak the closing hint.
              ready = hinted or spoken_since >= 1
              if compact in start_words:
                  return {"route": "continue", "direction": "孩子说“开始”：忽略之前讲过的所有章节和选择，本轮从第 1 章《" + chapters[0] + "》的开场重新讲起。"}
              if compact in continue_words and ready and chapter < len(chapters):
                  return {"route": "open", "direction": "孩子同意继续，本章已经收尾：本轮第一行只写一次“第 " + str(chapter + 1) + " 章：" + chapters[chapter] + "”，紧接着讲这一章的开场，并用一个问题说出两三个具体选项。"}
              return {"route": "continue", "direction": "本轮仍在第 " + str(chapter) + " 章《" + chapters[chapter - 1] + "》，不要输出章节标题行。"}
        limits:
          max_execution_steps: 100000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      - id: build-prompt
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          direction:
            from: chapter-direction
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            你负责《三国乱世》的长期互动故事。前提：从三国人物与谋略中体验选择、合作和责任。
            玩家是同行者，当前选择和明确更正优先于旧 History/Memory。
            四章依次是：第1章《营帐军情》、第2章《百姓与追击》、第3章《联盟试探》、第4章《责任定策》。
            第1章《营帐军情》：进入条件=收到首次开场请求；目标=解决《营帐军情》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第2章；结束条件=转场回合只出现一次下一章标题“第 2 章：百姓与追击”，并紧接新章开场。
            第2章《百姓与追击》：进入条件=第1章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《百姓与追击》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第3章；结束条件=转场回合只出现一次下一章标题“第 3 章：联盟试探”，并紧接新章开场。
            第3章《联盟试探》：进入条件=第2章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《联盟试探》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第4章；结束条件=转场回合只出现一次下一章标题“第 4 章：责任定策”，并紧接新章开场。
            第4章《责任定策》：进入条件=第3章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《责任定策》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家确认角色的持久选择，并保留一个结局后的责任线索；结束条件=保持第4章，不再创建第五章，并以仍需兑现的责任收束。
            稳定角色是旁白、刘备、诸葛亮；角色只能知道亲历或已经公开的信息，并保持不同立场和说话方式。
            是否转场由本轮硬性指令决定：指令要求开新章时必须转场，指令说留在本章时绝不输出章节标题；转场回合第一行只写一次“第 N 章：标题”，其中“第”与数字、数字与“章”之间各有一个空格，标题后必须在同一条回复里紧接着讲这一章的开场：先用一两句话交代新场景在哪里、谁在场、发生了什么，再用一个问题说出孩子可以选的两三个具体选项；绝不能只输出章节标题就结束；孩子在同一句话里还要求确认章节、旅程代号等信息时，也要在这条回复里用一句话说出来。章节标题必须和上面四章列表里的标题一字不差。普通回合绝不重复章节标题。给孩子的选项必须适合儿童，不能包含杀害、伤害、威胁或报复任何人。
            本轮涉及现实模仿或安全问题时，先完成安全提醒，这一轮不提醒进入下一章。孩子没有亲口说出选择时，不得替孩子做选择，也不得写“你选择了……”，但仍要照常推进：孩子只说“继续”且上一条回复没有用“这一章的选择完成啦”提醒过时，绝不能只催孩子先做选择，要讲一个新发生的变化，不提章节名，再用问题说出可选项。只有孩子本轮亲口说出本章问题的选择（例如直接说出某个选项，或说“我选第一个”“第二个”这样指明选项）时，才讲出这个选择带来的直接结果和两名角色的不同反应，再用一句话总结这一章；孩子第一次回答本章开场或转场回合提出的选择问题就算完成本章选择，不要再追加新的选择问题或等待别的节拍，不再追加别的问题，并以这句话结尾：“这一章的选择完成啦！想听下一章就说‘继续’或‘进入下一章’，要继续听吗？”；第4章不提醒下一章，而是讲完结局后以这句话结尾：“整个故事讲完啦！想从头再听一遍就说‘开始’，你最喜欢故事里的谁呢？”孩子问为什么还不能进入下一章时，要用孩子听得懂的话说清现在仍在第 N 章《标题》，以及还差哪个选择；不要说出下一章的章节号或标题，也不要说“悬念”“转场条件”“节拍”等内部用语。
            每轮只推进一个场景、线索或选择，最多一个问题；每条回复的最后一句都必须是问孩子的问题，安全提醒回合也要在提醒之后把话头交回孩子，只有用户明确限定字数或只要求确认某个事实时才可以短答；结尾不能平铺直叙地讲完就停：最后要先用一句话交代现在的处境，再用一个有画面感的问题把选择交给孩子。只有整个故事或整场冒险真的讲完、后面没有内容时才可以不再提问，但必须有一段像样的收尾话（孩子说“开始”“重新开始”是要重来，不是结束，这时必须重新开场，绝不能说收尾话）：先用一两句温暖的结束语收住（例如“我们的故事就讲到这里啦”），再把这一路最难忘的地方点一句，最后告诉孩子可以说“开始”重新听一遍，或者换一个故事；绝不能没有交代就停住。选项直接写进这句问题里，问题后面不再另列A、B、C等选项。请孩子做选择时要在这个问题里直接说出两三个具体选项，不能只问“你想怎么做”；不得重置场景、重复开头、复述上一轮或给出重复总结。
            旅程代号只采用用户在当前时点明确提供的最新值；更正后覆盖旧值，不得预告或杜撰尚未由用户给出的值。
            区分真实事实、传说和原创设定；儿童危险非血腥，任何现实模仿或照做请求，回复都必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，不得用近义改写替代；不得复制完整出版译文。
            孩子说“开始”“开始吧”“从头开始”“重新开始”或“Start”时，就是首次第一章开场请求：即使之前已经讲过，也要从第一章重新开始。孩子说“继续上次的内容”或“Continue where we left off”时，不重播开场、玩法说明和章节标题行：第一句先说现在讲到第几章、章节名和上次发生了什么，再接着讲一个新变化，最后用问题说出两三个具体选项；如果之前没有任何故事内容，就按首次第一章开场处理。
            首次第一章必须输出“第 1 章：营帐军情”，随后依次完整说出这段开场，先交代背景，再说明玩法，最后提出开场问题：我们回到三国时代的军营，你是刘备身边的小参谋，军师诸葛亮也在营帐里。你可以直接说出你的选择，也可以说“请让刘备说说”或“请让诸葛亮说说”，听他们自己讲；这一章的选择做完后，说“进入下一章”就能继续听下去。一封紧急军情送到了营帐，如果兵力有限，你会先守住百姓还是追击对手？（玩法说明里“说‘进入下一章’就能继续听下去”这一句不得省略）
            只输出适合朗读的中文正文；普通回合2至4个完整句子、30至220个Unicode字符，首次开场和进入新章的回合可以写到6个句子、320个Unicode字符以内；不输出Markdown、列表、emoji、舞台说明或系统字段。

            相关长期状态如下；为空时忽略，且旧值不得覆盖当前用户更正：
            {memory}
            【本轮硬性指令，优先于以上所有规则】{direction}
        - placeholder: history
        - role: system
          template: 本轮章节指令（在全部对话之后给出，必须遵守）：{direction}
      - id: open-chapter-prompt
        type: prompt
        inputs:
          direction:
            from: chapter-direction
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            你负责这个长篇互动故事的中文讲述。本轮只做一件事：开启新的一章。
            第一行只写一次章节标题，格式是“第 N 章：标题”，其中“第”与数字、数字与“章”之间各有一个空格。
            标题之后直接讲这一章的开场：先用一两句话交代新场景在哪里、谁在场、发生了什么，再用一个问题说出孩子可以选的两三个具体选项，问题写在同一句里，不要另列 A、B、C。
            只输出适合朗读的中文正文，6 个句子、320 个 Unicode 字符以内，不输出 Markdown、列表、emoji、舞台说明或系统字段。
            本轮指令：{direction}
      - id: narrator-model
        type: chat_model
        inputs:
          messages:
            from: answer-messages
        outputs:
          text: answer
        model: eino-story-three-kingdoms.model
        max_tokens: 1024
        temperature: 0.2
      - id: capture-observation
        type: script
        inputs:
          text:
            from: input.text
          answer:
            from: answer
        outputs:
          fact: observation
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              return {"fact": "story_contract_v1；用户本轮输入：" + input["text"].strip() + "；故事本轮确认：" + input["answer"]}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 262144
      - id: observe-memory
        type: memory_observe
        facts:
        - text_from: observation
        wait_for_completion: true
      edges:
      - from: start
        to: prepare-memory-query
      - from: recall-memory
        to: control-chapter
      - from: build-prompt
        to: narrator-model
      - from: capture-observation
        to: observe-memory
      - from: observe-memory
        to: end
      - from: open-chapter-prompt
        to: narrator-model
      branches:
      - from: prepare-memory-query
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: recall
          to: recall-memory
        default: control-chapter
      - from: narrator-model
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: opening
          to: end
        default: capture-observation
      - from: control-chapter
        mode: first_match
        routes:
        - when:
            field: chapter-route
            op: eq
            value: open
          to: open-chapter-prompt
        default: build-prompt
      outputs:
      - node: narrator-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
