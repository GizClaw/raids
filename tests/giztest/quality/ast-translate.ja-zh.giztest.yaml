# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of ast-translate,
# So that safety, correction, recall, routing and language regressions fail at the original gates.
version: gizclaw.test/v1alpha1
name: ast-translate.quality.ja-zh
clients:
  ast:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  ast_case1_workspace_name:
    direction: input
    type: string
    generate: token
  ast_case1_audio_1:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case1_audio_2:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case1_audio_3:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case1_audio_4:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case1_audio_5:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case1_audio_6:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case1_audio_7:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case1_audio_8:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case1_audio_9:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case1_audio_10:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
repeat: 1
timeout: 10m
steps:
- id: register_ast
  client: ast
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: ast_case1_stop_create_workspace
  client: ast
  rpc:
    method: server.run.stop
    request: {}
- id: ast_case1_create_workspace
  client: ast
  rpc:
    method: server.workspace.create
    request:
      name: "${ast_case1_workspace_name}"
      collection: translates
      workflow_name: translate-ja-zh
      parameters:
        asttranslate_workspace_parameters:
          agent_type: ASTTRANSLATE_WORKSPACE_PARAMETERS_AGENT_TYPE_AST_TRANSLATE
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: ast_case1_select_workspace
  client: ast
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${ast_case1_workspace_name}"
- id: ast_case1_warmup_workspace
  client: ast
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: ast_case1_synthesize_1_gratitude
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: 心からご親切に感謝いたします。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case1_audio_1
- id: ast_case1_turn_1_gratitude
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case1_audio_1}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 谢谢
      - 感谢
      - 感激
      - 谢意
      pattern: "\\p{Han}"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case1_synthesize_2_good-day
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: 今日が素晴らしい一日になりますように。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case1_audio_2
- id: ast_case1_turn_2_good-day
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case1_audio_2}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 愉快
      - 美好
      - 开心
      - 顺利
      - 一天
      pattern: "\\p{Han}"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case1_synthesize_3_farewell
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: 次回またお会いできるのを楽しみにしています。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case1_audio_3
- id: ast_case1_turn_3_farewell
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case1_audio_3}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 再见
      - 再会
      - 下次
      - 见面
      - 再次
      pattern: "\\p{Han}"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case1_synthesize_4_apology
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: ご迷惑をおかけして本当に申し訳ありません。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case1_audio_4
- id: ast_case1_turn_4_apology
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case1_audio_4}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 抱歉
      - 对不起
      - 歉意
      pattern: "\\p{Han}"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case1_synthesize_5_agreement
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: 私はこの計画に心から賛成しています。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case1_audio_5
- id: ast_case1_turn_5_agreement
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case1_audio_5}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 同意
      - 赞同
      - 赞成
      pattern: "\\p{Han}"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case1_synthesize_6_ready
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: 出発の準備ができているか教えてください。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case1_audio_6
- id: ast_case1_turn_6_ready
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case1_audio_6}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 准备好
      - 准备
      - 就绪
      pattern: "\\p{Han}"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case1_synthesize_7_help
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: この荷物を運ぶのを手伝っていただけますか。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case1_audio_7
- id: ast_case1_turn_7_help
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case1_audio_7}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 帮助
      - 帮忙
      - 协助
      - 帮
      pattern: "\\p{Han}"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case1_synthesize_8_welcome
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: 私たちの美しい町を訪れてくださり、心から歓迎いたします。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case1_audio_8
- id: ast_case1_turn_8_welcome
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case1_audio_8}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 欢迎
      pattern: "\\p{Han}"
      max_length: 200
    "/audio_bytes":
