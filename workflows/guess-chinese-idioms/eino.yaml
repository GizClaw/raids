劐化华叱吪咶哇哗嘩埖夻姡婲婳嫿嬅學崋找搳摦撶敌杹枠桦椛槬樺檴滑澅澮猾獪画畫畵砉硴磆稞竵粿糀繣罫腂舙芲華蒊蒍蕐蘤螖觟話誮諙諣譁譮话豁輠釪釫鋘錵鏵铧驊骅魤鮭鷨黊", "苗": "仯吵喵妙媌嫹庙庿廟彯描杪淼渺猫玅眇瞄秒竗篎紗緢緲繆缈缪藐蜱訬邈鱙鶓鹋", "若": "偌叒喏婼嵶弱惹挼捼撋楉渃溺热焫熱爇箬篛芮蒻蹃鄀鰙鰯鶸", "苦": "乎乕乥乯互估俈俿傦僱冱冴凅刳匢匫古告呱呴呼和咕哌哭唂唃唬唿啒喖喾嗀嗃嗗嘏嘑嘝嚛嚳囫固圐圣垀堀堌壶壷壺夃姑姱婟媩嫭嫮嫴孤家寣尳岵崓崫崮帍幠库庫廤弖弧忽怘怙恗惚惡愲戏戯戲戶户戸戽扈扝扢抇护挎捁掘搰摢擭故斛昈昒曶朏枑枯柧核桍梏棝楛楜榖榾槲槴橭櫎欻歑毂汩汻沍沪沽泏泒泘洿浒淈淲淴湖滑滬滸滹濩濲瀔瀫烀焀焅焸煳熩牯牿狐狜猢琥瑚瓠瓡瓳痼瘔皋皷皼盬瞽矻硞磆礐祜祻秙稒穀穫窋窟笏笟箍箎箛箶篐簄粐糊糓絗絝綔縎縠绔罛罟羖羽股胍胡脵膴臌芐芔芦芴苸苽菇菰萀葫蓇蔛蔰薣虍虎虖虝蛄蛊蛌蝴螜蠱衚袴裤褲角觚觳觷許詁謼護许诂谷豰賈贾趶跍跨軤軱軲轂轱轷辜逧郀鄠酤酷醐鈲鈷鋘錮錿鍙鍸钴锢隺雇雐離雽韄頀頶顧顾餬餶馉骨骰骷鬍魱鮕鮬鯝鯱鰗鱯鲴鳠鳸鴣鴩鵠鶘鶦鶮鶻鸌鸪鹄鹕鹘鹱鼓鼔齁", "范": "仮伋凡凢凣勫匥反噃墦奿婏嬎嬏帆幡忛憣払拚旙旛杋柉梵棥楓樊橎氾汎泛渢滼潘瀪瀿烦煩燔犯犿璠畈畨番盕矾礬笲笵範籓籵緐繁繙羳翻膰舤舧舩蕃薠藩蘩蟠蠜袢襎訉販贩蹯軓軬轓返釩鐇鐢钒颿飜飯飰饭鱕鷭", "药": "么仸佻侥倄偠傜僥匋吆咬喓嗂嚙垚堯夭妖姚婹媱嬈宎尧尭岆峣崤崾嶢嶤幺幼徭徼怮恌愮抭揄揺搖摇摿撽暚曜杳枖柼楆榚榣樂殀殽洮淫溔滧瀹烄烑熎燿爻狕猶猺獟玅珧瑤瑶由疟瘧眑矅磘祅穾窅窈窑窔窯窰筄箹約繇纅约耀肴腰舀艞苭葯葽蓔蕘薬藥蘨袎要覞訞詏謠謡讑谣趯踰軺轺遙遥邀邎銚鎐鑰钥铫闄陶隃靿顤颻飖餆餚騕驁鰩鳐鴁鴢鷂鷕鹞鼼齩", "荻": "仾低俤偙僀儥勺厎呧哋唙啇啲啻嘀嚁地坔坘坻埅埊埞堤墆墑墬奃娣媂嫡嵽嶳帝底廸弔弟弤彽怟慸扚抵拞掋提揥摕敌敵旳杓杕枤柢梊梑棣楴樀櫂氐浟涤渧滌滴焍牴狄玓珶甋疐的眱睇砥碮碲磾祶禘笛第篴籴糴約締缔羝翟聜肑胝腣芍苐苖茋莜菂菧蒂蓧蔋蔐蔕藋藡蚳蝃螮袛覿觌觝詆諟諦诋谛豴赿趆踧踶蹄蹢軧迪逐递逓逮遞適遰邸釱鉪鍉鏑镝阺隄隶靮鞮頔題馰骶髢鬄魡鯳鸐", "莱": "來俫倈勑厲唻娕婡崃崍庲徕徠懶攋来梾棶櫴涞淶濑瀨瀬猍琜癘癞癩睐睞筙箂籁籟萊藾襰誺賚賴赉赖逨郲釐錸铼頼顂騋鯠鵣鶆麳黧", "萤": "俓偀僌吋呎哩哽唡啢啨営嘤噟嚶塋夃央婴媖媵嫈嬰嬴孆孾嵤巆巊应廮影応愥應摬撄攍攖旲映景暎朠柍桜桯梬楹樱櫻櫿泂浧渶溁溋滎滢潁潆濙濚濴瀅瀛瀠瀯瀴灐灜焸煐熒營珱瑛瑩璎瓔甇甖甸瘿癭盁盈眏矨硬碤礯禜穎籝籯緓縈繩纓绬缨罂罃罌耺膡膺英茔荥荧莖莹莺营萦萾蓥藀蘡蛍蝇蝧蝿螢蠅蠳褮覮謍譍譻賏贏赢軈迎逞郢鍈鎣鐛鑍锳霙鞕韹韺頴颍颕颖鱦鴬鶑鶧鶯鷪鷹鸎鸚鹦鹰", "萧": "佼侾俏俲傚削効叟号呺呼咲咻哓哨哮唬啋啸嗃嘋嘐嘨嘮嘯嘵嚣嚻囂奡姣婋孝宯宵小崤庨彇恔恷憢捎揱搜撓撨效敩斅斆晓暁曉枭枵校梟梢橚櫹歊歒歗殽毊洨消涍淆滧漻潇潚澩瀟灱灲烋焇熇熽燆爻狡猇獟獢痚痟皛皢睄硝硣穘窙笑筊筱筿箫箾篠簘簫絞綃縿绡翛肖胶脩膮芍茭莦萷蕭薂藃虈虓蛸蟂蟏蟰蠨訤詨誟誵謏謞謼譊踃較轇逍郩銷销霄颵騷驍驕骁骹髇髐魈鴞鴵鵁鷍鷕鸮", "落": "佬倮僗僚儠儸儽剆剌劳労勞咯咾哰唠啦啰喇嗠嘐嘮嚹囉垃姥嫪嫽峈崂嶗恅憥憦拉挼捋捞捰揦揧搚摞摺撈撩擸攋攎攞攭旯曪朥果柆栳格椤楋樂橐橑橯櫟欏欙泺洛洜浶涝溂漯潦澇濼烙爉爍牢犖狫猓猡獠玀珞珯瓎痨瘌瘰癆癩癳皪砢砬硌硓硦碌磖磱礫窂笿箩簩籮粩絡纙络罖罗羅翋老耂耢耮脶腊腡臈臘臝茖荖荦菈萝蓏蓝蓼藍藞蘿蛒蛯蜡蜾蝋蝲蝸螺蟧蠃蠟蠡袼裸覙覶覼詻跞路躒躶躼軂轑辢辣逻邋邏酪醪鉻銠鎯鏍鐒鑞鑼铑铹锣镙镴雒鞡頱顟饠駱騾驘骆骡髝鬎鮥鮱鯻鱲鱳鴼鵅鸁鿲", "蔽": "丿仳佊佖佛俾偪別别匕卑吡咇哔啚嗶坒埤堛壁夶奰妣妼娝婢媲嫳嬖嬶屄崥币幅幣幤庇庳廦弊弻弼彃彆彼徶必怭怶悂愊愎憋扒拂拔捌捭撆撇敝斃旇暼服朼枇枈柀柭柲梐椑楅榌檗殍比毕毖毙毴氕沘泌波湢滗滭潎潷濞煏熚狴獘獙珌璧畀畁畐畢疕疪痹痺瘪癟癿皀皕睤瞥碧祕禆秕秘稫穪笓笔筆筚箄箅箆篦篳粃粊紕紴綼縪繴罷罼翍聛肥肶肸胇脾腷臂舭芘苤苾茀荜荸莂萆萞蓖蓽薜蘗虌虑蛂蜌螕蟞袐被裨襅襒襞襣覕觱詖诐豍貏貱費賁贔贲赑跛跸踾蹕蹩躃躄辟逼避邲鄙鄨鄪鈚鉍錍鎞鏎鐅鐴铋閇閈閉閟闭陂陛陴鞁鞞鞸韠飶饆馝馥駜驆髀髲魓魮鮅鮩鰏鱉鲾鳖鴓鵖鶝鷝鷩鸊鼈鼊鼻龞", "薪": "伈伩信俽噷噺囟妡姰嬜孞寻尋庍廞心忄忻惞愖憖撢新昕杺枔橝欣款歆炘焮盺礥脪興舋芯莘衅襑訢訫軐辛邤釁鈊鋅鐔鑫锌镡阠顖馨馫馸鬵", "虎": "乎乕乥乯互俿冱冴匢匫呼和唬唿喖嗀嗃嘑嘝嚛囫垀壶壷壺姱婟媩嫭嫮寣岵帍幠弖弧忽怘怙恗惚惡戏戯戲戶户戸戽扈抇护搰摢擭斛昈昒曶枑核楛楜槲槴欻歑汩汻沍沪泘洿浒淈淲淴湖滬滸滹濩瀫烀焀煳熩狐猢琥瑚瓠瓡瓳礐祜穫笏箎箶簄粐糊絗綔縎縠羽胍胡膴芐芔芦芴苦苸萀葫蔛蔰虍虖虝蝴螜衚觳觷許謼護许豰軤轷鄠醐鈷鋘