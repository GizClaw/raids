# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for flowcraft-story-shanhaijing,
# So that every reachable role path produces text and non-empty synthesized audio.
version: gizclaw.test/v1alpha1
name: story-shanhaijing.flowcraft.roles
clients:
  narrator:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  young-explorer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  spirit-guide:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  jingwei:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  kuafu:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  narrator_workspace:
    direction: input
    type: string
    generate: token
  young_explorer_workspace:
    direction: input
    type: string
    generate: token
  spirit_guide_workspace:
    direction: input
    type: string
    generate: token
  jingwei_workspace:
    direction: input
    type: string
    generate: token
  kuafu_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 60m
steps:
- id: register_narrator
  client: narrator
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: "${narrator_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-shanhaijing
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${narrator_workspace}"
- id: warmup_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_young-explorer
  client: young-explorer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_young_explorer_workspace
  client: young-explorer
  rpc:
    method: server.workspace.create
    request:
      name: "${young_explorer_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-shanhaijing
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_young_explorer_workspace
  client: young-explorer
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${young_explorer_workspace}"
- id: warmup_young_explorer_workspace
  client: young-explorer
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_spirit-guide
  client: spirit-guide
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_spirit_guide_workspace
  client: spirit-guide
  rpc:
    method: server.workspace.create
    request:
      name: "${spirit_guide_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-shanhaijing
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_spirit_guide_workspace
  client: spirit-guide
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${spirit_guide_workspace}"
- id: warmup_spirit_guide_workspace
  client: spirit-guide
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_jingwei
  client: jingwei
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_jingwei_workspace
  client: jingwei
  rpc:
    method: server.workspace.create
    request:
      name: "${jingwei_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-shanhaijing
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_jingwei_workspace
  client: jingwei
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${jingwei_workspace}"
- id: warmup_jingwei_workspace
  client: jingwei
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_kuafu
  client: kuafu
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_kuafu_workspace
  client: kuafu
  rpc:
    method: server.workspace.create
    request:
      name: "${kuafu_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-shanhaijing
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_kuafu_workspace
  client: kuafu
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${kuafu_workspace}"
- id: warmup_kuafu_workspace
  client: kuafu
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: 请由旁白承接当前故事，只推进一个可见线索。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_narrator_first_response
  client: narrator
  timeout: 15s
  peer_stream:
    mode: text
    input: 请由旁白承接当前故事，只推进一个可见线索。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: probe_young-explorer
  client: young-explorer
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让少年探险者亲自回应，只说这个角色知道的事。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
