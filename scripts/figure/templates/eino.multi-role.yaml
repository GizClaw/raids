apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-@@RAID@@-multi-role
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: story-teller
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-@@RAID@@-mr.storyteller
      speaker_voices:
        旁白: eino-@@RAID@@-mr.storyteller
        @@FIGURE@@: eino-@@RAID@@-mr.@@FIGURE_KEY@@
        @@COMPANION@@: eino-@@RAID@@-mr.@@COMPANION_KEY@@
        @@GUEST1@@: eino-@@RAID@@-mr.@@GUEST1_KEY@@
        @@GUEST2@@: eino-@@RAID@@-mr.@@GUEST2_KEY@@
    graph:
      name: @@RAID@@-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: @@MAX_RUN_STEPS@@
      state:
        fields:
@@NARRATION_STATE@@        - name: memory-query
          type: string
          merge: replace
        - name: memory-route
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: observation
          type: string
          merge: replace
      nodes:
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
          route: memory-route
          memory: recalled
@@INITIAL_MODEL_OUTPUTS@@        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              cues = ["重连", "恢复", "回忆", "还记得", "代号", "更正", "改成", "上次", "continue where", "left off"]
              recall = False
              for cue in cues:
                  if cue in text:
                      recall = True
              route = "opening" if not text else ("recall" if recall else "continue")
              return {"query": "@@TITLE@@故事状态、章节、角色、选择、更正、旅程代号和未解决线索；当前请求：" + text, "route": route, "memory": ""@@INITIAL_MODEL_VALUES@@}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-memory
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 16
@@NARRATION_CONTROL@@@@BUILD_PROMPT@@      - id: narrator-model
        type: chat_model
        inputs:
          messages:
            from: answer-messages
        outputs:
          text: answer
        model: eino-@@RAID@@-mr.@@NARRATION_MODEL@@
        max_tokens: 2048
        temperature: 0.2
@@REFERENCE_LOOP@@      - id: capture-observation
        type: script
        inputs:
          text:
            from: input.text
          answer:
            from: answer
        outputs:
          fact: observation
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              return {"fact": "story_contract_v1；@@OBSERVATION_PREFIX@@用户本轮输入：" + input["text"].strip() + "；@@OBSERVATION_REPLY@@\n" + input["answer"]}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 262144
      - id: observe-memory
        type: memory_observe
        facts:
        - text_from: observation
        wait_for_completion: true
      edges:
      - from: start
        to: prepare-memory-query
      - from: recall-memory
        to: @@NARRATION_NEXT@@
@@NARRATION_EDGE@@@@MODEL_EDGE@@@@REFERENCE_EDGES@@      - from: capture-observation
        to: observe-memory
      - from: observe-memory
        to: end
      branches:
      - from: prepare-memory-query
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: recall
          to: recall-memory
        default: @@NARRATION_NEXT@@
@@REFERENCE_BRANCHES@@@@NARRATOR_BRANCH@@      outputs:
      - node: narrator-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    limits:
      max_output_bytes: 4194304
