", "温": "云伝傊允免刎勻匀匁吻呅员呚呡員問喗囩均塭夽奫妏妘娩媪孕宛尉尹彣忞忟怨恽惲愠愪慍抆抎抣揾搵文昀昧昷晕暈枟桽榅榲橒歾殁殒殞殟氲氳汶沄涒涢渂溫溳澐炆煇煴煾熅熉熨狁玟玧珳瑥璺畇瘒瘟盾眃眼磒秐稳穏穩笏筍筠筼篔紊紋紜絻緷緼縕縜繧纭纹缊耘耺聞肳脕脗腪芠芸苑荺莬菀蒀蒕蒷蕓蕰蕴薀藴蘊蚉蚊蜵蝹螡蟁褞豱賱贇赟輼轀辒运運郓郧鄆鄖酝醖醞鈗鋆鎾閺閿闅闦问闻阌阭限陨隕雯雲霣鞰韗韞韫韵韻頵顐餫饂馧馻馼駇魰鰛鰮鳁鳼鴍鴖鼤齫齳", "游": "丣亴优佑侑偤僂優六冘刘劉卣又友右叹呦哊唀嚘嚠囿坳塯奥妋姷媹嬼孧宥尢尤峟峳嵧幼幽庮廇忧怞怣怮悠憂懮懰戭扰揂揄摎攸斿旈旒有朓柚柳栁栯桞桺梄梎楢榴槱橊橮櫌櫾汓汼沋沠油泅泑泖泵流浏浟湵溜滺漻澑瀀瀏熘熮牖牗牰犹狖猶猷獶珋琉瑠瑬璢由甴畂畄留畱疁疣痏瘤癅硐硫碌磂磟祐禉秞窌糿綹繇纋绺罶羀羐羑羗翏耰聈聊聱肬脜脩苃莜莠莤莸蒏蒥蓅蓼蔞蕕藰蚘蚰蚴蜏蝣蝤蟉裗褎訧誘诱貁蹓輏輶迶逌逰遊遛邮郵鄾酉酭釉鈾鉚銪銹鋶鎏鎦鏐鐂铀铕锍镏镠陆陸雡霤飀飂飅飗餾馏駀駠駵騮驑骝鬸魷鮋鯈鰡鱿鲉鶹鷚鹠鹨麀麍黝鼬", "潘": "乑亳仢仮伋伯伴佛侼僠僰冸凡凢凣判剝剥勃募勫匥半博卜卞反叛哱啵噃嚗坢墦壆奿妭姍婏媻嬎嬏孛孹審嶓帆帗帛幋幡弁彦彴忛怕愽憣懪払扳拌拍拔拚拨挬搏搫撥播擗擘攀旙旛暴服杋柈柉柏柭桲梵棥楓榑槃樊橎檗檘欂殕氾汎沜泊泛波泮洀浡淿渢渤湴溊溥溿滼潑瀊瀋瀑瀪瀿炍烦煩煿燔爆爿片牉牔犦犯犻犿狛猼玻璠瓝瓟畈畔畨番癶癷發白百皤皪盋盕盘盤盻盼眅眫矾砵碆磐磻礡礬礴秡穛笲笵箔箥範簙簸簿籓籵糪紴緐縏繁繙缽羳翻聁肑胉胖脖膊膰舤舧舩般舶艊艴苩茀范茷菠菩萠萡葧蒰蒲蔔蔢蕃薄薜薠藩蘖蘗蘩蚾螌蟠蠜袚袢袯袰袹褩襎襏襮襻訉詊詙譒豰販賁贩趵跑跘跛踣踫蹒蹣蹯蹳軓軬轓返郣鄱釩鈸鉑鉢鋍鋬鎛鎜鐇鐢鑮鑻钒钵钹铂镈闆鞶頖颿飜飯飰餑餺饭饽馎馛馞駁駮驋驳髆髉魄鮁鮊鱍鱕鲅鲌鵓鵥鷭鹁", "潜": "乾仟仱伣佥俔倩偂傔僉儙兛凵刋前千厱唊嗛圱圲堑塹墘壍奷婜媊嬱孅孯寨岍岒嵌嵰幵廞忏忴悓悭愆慊慳扦扲拑拪掔掮揃揵搴摼撁撍撖攐攑攓朁杄杴柑棈椠榩槏槧橬檶櫏欠欦欿歁歉歬汘汧浅涔淒淺湔漸潛濳灊灒煔熑燂燖牵牽犍玪瓩皘磏竏筋签箝箞篏篟簽籖籤粁綪縴繾纤缱羥羬肷脥腱膁臤艌芊芡茜茾荨葥葴蒨蔳蕁藖虔蚈蚙蜸褰諐謙譴谦谴谸赶軡輤迁遣遷釺鈆鈐鉆鉗鉛銭鋟錎錢鍼鎆鏲鐱鑓鑯钎钤钱钳铅開阡雃靬韆顅顩馯騚騝騫骞鬜鬝鰜鰬鳽鵮鶼鹐黔黚齦", "灵": "令伶倰冷凌刢另呤囹坽夌姈婈孁岭岺崚嶺彾怜拎掕昤朎柃棂棱櫺欞泠淩澪瀮炩燯爧狑玲琌瓴皊砱磷祾秢稜竛笭紷綾绫羚翎聆舲苓菱蓤蔆蕶蘦蛉衑袊裬詅跉軨輘酃醽釘鈴錂铃閝阾陵零霊霗霛霝靇靈領领駖魿鯪鲮鴒鸰鹷麢齡齢龄龗", "炎": "严乵但俨俺倓偃偐偣傝傿僋儃儼兖兗剡剦匽厂厃厌厣厭厳厴叹咽唁唌啱啴喭單嗿嘆嘽嘾噞嚥嚴囐坍坛坦埏埮埯堰塩墕墰墵壇壛壜壧夵奄妍妟姲姸娫娮婒媕嫣嬊嬐嬮嬿孍宴屵岩崦嵃嵒嵓嶖嶮巌巖巗巘巚巡广庵延弇弹彈彥彦忐怹恹惔愝憛憳憻懕懨戭扊抁挻捝掞探掩揅揜揞摊撢撣擹攤敥昖昙晏晻暥暺曇曕曣曮棪椻椼楌榃樮橝橪檀檐檿櫩欕歎殗殷毯氤汧沇沈沿洇洝涎淊淡淫淹渰渷湛湠湮溎滟滩演漢漹潬潭澹灎灔灘灧灩炏炭烟烻焉焑焔焰焱煙熖燂燄燕爓牪狠狿猒珚琂琰璮瓛甗痑痰瘫癉癌癱盐眼研砚硏硯硽碞碳磹礹禪筵篶簷綖緂縯繵罈罎罨羡羬胆胭腌膁臙舑舔舕艳艶艷芫莚菴菸菼萒葕蔅蔫蕁蕈薟藫虤蜒蝘衍袒裧裺褗襢覃覎觃觾言訁訮詽談諺譚譠讌讞讠谈谚谭谳豓豔豣貚貪賧贋贗贪赝趼躽軅這遃郔郯郾鄢酀酓酽醃醈醓醰醶醼釅鉛鉭鋋錟钽铅锬镡閆閹閻閼闫阉阎阏阭阽隁隒險雁靨顃顏顑顔顩颜餍餤饜騐験騴驗驠验鬳魇魘鰋鳫鳱鴈鴳鶠鷃鷤鷰鹽麙麣麲黡黤黫黬黭黮黰黶鼴鼹齗齞齴龑", "烈": "例倈儠冽列劣劦劽咧哷埒埓奊姴峛巁巤忚挒挘捩擖擸栗栵棙毟洌浖烮煭燤爄爉犣猎猟獦獵睙累綟聗脟膊臘茢蛚裂趔躐迾邋颲鬛鬣鮤鱲鴷", "烨": "业也亪亱倻偞僷冶叶吔咽啘喝嘢噎嚈埜堨墅墷壄夜射峫嶪嶫懕抴拽捓捙掖揞揲揶擖擛擨擪擫斜晔暍曄曅曗曳曵枒枼枽椰楪業歋殕殗洂洇涂液漜潱澲焆煠熀燁爗爷爺璍瓛痷皣瞱瞸礏窫緤耶聶腋荼葉虵蠮蠱謁谒邪邺鄓鄴野釶釾鋣鍱鎁鎑鐷铘靥靨頁页餘餣饁饐馌驜鵺鸈黦", "照": "佋佻兆召啁啅嘲垗妱巶找招旐昭晁曌朝枛桃棹櫂沼淖濯炤燳爪爫狣瑵皽盄着瞾窼笊箌罀罩羄肁肇肈菬著蚤詔诏赵趙釗釽鉊鍣钊駋鮡鳭鼂", "熙": "一丿乁乂义乊乙也习亄亦亿仡以仪伇伊伿佁佗佚佾侇依係俋俙倚偯傒僖儀億儗兮兿冝凞刈劓劮勚勩匇匜匸医卌卤卥印卻厀厭叕台叹吚听吸呓呬呭呰呹咥咦咭咿唈唏唽喜喦喺嗌嘻噎噏噫嚊嚱囈囍圛圪圯坄坨垼埶埸塈墍墿壐壱壹夁夕失夷奇奊奕奚妷姨姬娭媐媳嫕嫛嬄嬆嬉嬑嬟孴它宐宜宧寱寲射尾屃屎屖屣屭屹峄峓崎崺嵇嵠嶍嶧嶬嶲嶷巂巇已巳巸希帟帠席幆庡廙异弈弋弌弬彛彜彝彞彵役徆徙徯忆忔忚忥怈怠怡怬怸怿恄恓恞息悉悒悕悘悥惁惜意愾慀憘憙憶懌懿戏戯戱戲戺扅扆扡扱扸抑拸挹掎掜揖搋搤摡撎撕擇擊攺敡敼斁施旑旖既易昔昳晞晰晳晹暆暿曀曎曦杙杝杫枍析枲枻柂栖栘栧栺桋桸棭棲