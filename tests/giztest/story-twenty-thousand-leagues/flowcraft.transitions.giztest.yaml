# User Story:
# As a child playing `flowcraft-story-twenty-thousand-leagues`,
# I want a guided opening, a "进入下一章" prompt after my choice, and story text right after each new chapter heading,
# So that I never have to guess what to say or speak again after a bare chapter title.
version: gizclaw.test/v1alpha1
name: story-twenty-thousand-leagues.flowcraft.transitions
clients:
  player: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
  workspace: {direction: input, type: string, generate: token}
repeat: 1
timeout: 14m
steps:
- id: register_player
  client: player
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_workspace
  client: player
  rpc:
    method: server.workspace.create
    request:
      name: ${workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-twenty-thousand-leagues
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_workspace
  client: player
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${workspace}"}}
- id: warmup_workspace
  client: player
  rpc: {method: server.run.workspace.reload, request: {}}
  timeout: 2m
- id: opening_with_guidance
  client: player
  timeout: 2m
  peer_stream:
    mode: text
    input: "请从第一章开始《海底两万里》。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_all: ["第 1 章", "发光巨影", "尼摩", "阿龙纳斯", "进入下一章"]
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
- id: natural_consequence
  client: player
  timeout: 2m
  peer_stream:
    mode: text
    input: "请继续当前场景，推进一个直接结果。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text:
      not_contains: ["第 2 章", "深海档案"]
      min_length: 4
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
- id: character_perspective
  client: player
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让尼摩亲自回应当前结果，说出不同的立场。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text:
      not_contains: ["第 2 章", "深海档案"]
      min_length: 4
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
- id: reject_negated_choice
  client: player
  timeout: 2m
  peer_stream:
    mode: text
    input: "我先不选择，请让尼摩说明为什么还不能进入第二章；只说明仍停留的当前章节。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_all: ["第 1 章", "发光巨影"]
      not_contains: ["第 2 章", "深海档案"]
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
- id: choice_prompts_next_chapter
  client: player
  timeout: 2m
  peer_stream:
    mode: text
    input: "安静观察"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text:
      contains: "下一章"
      not_contains: ["第 2 章", "深海档案"]
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
- id: enter_next_chapter_with_story
  client: player
  timeout: 2m
  peer_stream:
    mode: text
    input: "进入下一章。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_all: ["第 2 章", "深海档案"]
      not_contains: ["第 1 章"]
      pattern: "第 2 章[：:]\\s*深海档案[\\s\\S]{20,}[。！？]"
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
- id: continue_current_chapter
  client: player
  timeout: 2m
  peer_stream:
    mode: text
    input: "请继续第二章当前场景，推进一个直接结果，不要重复章节标题。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text:
      not_contains: ["第 2 章", "深海档案", "转场条件"]
      min_length: 4
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
finally:
- id: stop_run
  client: player
  rpc: {method: server.run.stop, request: {}}
- id: delete_workspace
  client: player
  rpc: {method: server.workspace.delete, request: {name: "${workspace}"}}
- id: delete_peer
  client: player
  rpc: {method: server.peer.delete, request: {}}
report:
  redact: [registration_token]
