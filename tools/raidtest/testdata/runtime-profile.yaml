apiVersion: gizclaw.admin/v1alpha1
kind: RuntimeProfile
metadata: {id: fixture-profile}
spec:
  workflows:
    system: {friend_chatroom: fixture-flowcraft, group_chatroom: fixture-flowcraft, pet: fixture-pet}
    collections:
      assistants:
        fixture: {resource_id: fixture-flowcraft}
  resources:
    models: {}
    voices: {}
    memories:
      fixture-memory: {layout_id: fixture-memory, driver: flowcraft, connection: {type: flowcraft_bbh}}
