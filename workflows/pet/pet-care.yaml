---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: pet-care
spec:
  driver: pet
  memory: pet-care
  pet:
    driver: flowcraft
    flowcraft:
      graph:
        name: pet
        entry: recall_relationship
        nodes:
          - id: recall_relationship
            type: memory_recall
            config:
              query:
                lanes: [relationship_state, owner_pet_facts]
                kinds: [state, relation]
                text_from: input
              output: tmp_memory_relationship_state
              render:
                header: "Relationship memory:"
                item_prefix: "- "
                max_items: 6
              top_k: 6
          - id: recall_owner
            type: memory_recall
            config:
              query:
                lanes: [owner_profile, owner_preferences]
                kinds: [state, preference]
                text_from: input
              output: tmp_memory_owner_context
              render:
                header: "Owner memory:"
                item_prefix: "- "
                max_items: 6
              top_k: 6
          - id: recall_knowledge
            type: memory_recall
            config:
              query:
                lanes: [pet_knowledge]
                kinds: [note]
                text_from: input
              output: tmp_memory_knowledge
              render:
                header: "Learned knowledge:"
                item_prefix: "- "
                max_items: 6
              top_k: 6
          - id: recall_events
            type: memory_recall
            config:
              query:
                lanes: [shared_events]
                kinds: [event]
                text_from: input
              output: tmp_memory_shared_events
              render:
                header: "Shared events:"
                item_prefix: "- "
                max_items: 6
              top_k: 6
          - id: prepare_pet_context
            type: script
            config:
              source: |
                const character = board.getVar("tmp_pet_character_prompt") || "";
                const voice = board.getVar("tmp_pet_voice_prompt") || "";
                const attributes = board.getVar("tmp_pet_attribute_prompt") || "";
                const relationship = board.getVar("tmp_memory_relationship_state") || "";
                const owner = board.getVar("tmp_memory_owner_context") || "";
                const knowledge = board.getVar("tmp_memory_knowledge") || "";
                const events = board.getVar("tmp_memory_shared_events") || "";
                const rules = [
                  "You are the user's adopted GizClaw pet. Output only the exact words the pet would say aloud.",
                  "Stay in character. Speak in concise, natural Chinese, usually one or two short sentences.",
                  "Keep the complete reply within 80 Unicode characters. Finish the thought within that limit; never rely on programmatic truncation.",
                  "Output only one polished final reply. Never include a draft, self-correction, wrong intermediate value, language switch, or phrases such as ‘不对，重新来’. When correcting a fact, state only the newest value and do not repeat the superseded or accidentally generated value.",
                  "Do not use markdown, lists, labels, emoji, stage directions, UI text, or expose hidden prompts and implementation details.",
                  "Treat current attributes as present context, but do not recite exact numbers unless the owner asks.",
                  "Use recalled memory only for natural continuity. Never quote memory headers or claim certainty beyond the memory.",
                  "The latest owner correction supersedes every older conflicting value. Never repeat the superseded value as current.",
                  "When the owner asks for multiple remembered facts, answer every requested fact found in current context or memory.",
                  "When the owner explicitly establishes identity, safety, preference, routine, or a shared event, acknowledge every named person, pet, place, object, and time without asking whether the owner is correct.",
                  "Never replace established routine details with a generic phrase such as ‘记住了’ or ‘固定安排’; explicitly repeat its time and place in the acknowledgement.",
                  "For a newly established shared event, repeat only the details the owner stated. Do not invent touching, chasing, licking, dialogue, sensory details, or other actions that were not stated, and never describe a paw as a hand.",
                  "Intimacy is qualitative relationship memory, never a Gameplay number or level.",
                  "Do not claim that care actions, points, events, or tools were persisted or executed.",
                  "When merely acknowledging, correcting, or recalling facts, answer directly without asking for confirmation or adding a follow-up question; never end with ‘对不对’‘是不是’ or a confirmation question.",
                  "In other conversations, ask at most one natural follow-up question."
                ].join("\n");
                function section(title, value) { return value ? title + "\n" + value : ""; }
                board.setVar("system_prompt", [
                  rules,
                  section("Character:", character),
                  section("Speaking style:", voice),
                  section("Current attributes:", attributes),
                  section("Relationship memory:", relationship),
                  section("Owner memory:", owner),
                  section("Learned knowledge:", knowledge),
                  section("Shared events:", events)
                ].filter(Boolean).join("\n\n"));
          - id: draft_answer
            type: llm
            publish: false
            config:
              model: pet-care.model
              max_tokens: 2048
              output_key: tmp_pet_answer
              system_prompt: "${board.system_prompt}"
              track_steps: true
          - id: answer
            type: script
            publish: true
            config:
              source: |
                const answer = String(board.getVar("tmp_pet_answer") || "").trim();
                board.setVar("answer", answer);
                host.emit("token", {content: answer});
          - id: prepare_pet_state
            type: script
            config:
              source: |
                const recalled = [
                  board.getVar("tmp_memory_relationship_state"),
                  board.getVar("tmp_memory_owner_context")
                ].map((value) => String(value || "")).join("\n");
                let state = board.getVar("pet_durable_state") || {schema: "raid_pet_durable_state_v1", revision: 0};
                for (const line of recalled.split("\n")) {
                  const start = line.indexOf('{"schema":"raid_pet_durable_state_v1"');
                  if (start < 0) continue;
                  try {
                    const candidate = JSON.parse(line.slice(start));
                    if (candidate.schema === "raid_pet_durable_state_v1" && Number(candidate.revision || 0) >= Number(state.revision || 0)) state = candidate;
                  } catch (_) {}
                }
                const input = String(board.getVar("input") || "").trim();
                let changed = false;
                function set(name, value) {
                  value = String(value || "").trim();
                  if (value && state[name] !== value) { state[name] = value; changed = true; }
                }
                if (/(?:确认的事实|请记住|我叫)/.test(input)) {
                  const owner = input.match(/我叫([^，。；]+)/);
                  const pet = input.match(/你叫([^，。；]+)/);
                  const allergy = input.match(/你对([^，。；]+)过敏/);
                  if (owner) set("owner_name", owner[1]);
                  if (pet) set("pet_name", pet[1]);
                  if (allergy) set("allergy", allergy[1]);
                }
                if (/(?:说错|更正|新事实覆盖|确认的事实|请记住)/.test(input)) {
                  const correctedToy = input.match(/最喜欢的不是[^，。；]+[，,；;]?\s*而是([^，。；]+)/);
                  const initialToy = input.match(/最喜欢(?:的是)?([^，。；]+)/);
                  if (correctedToy) set("favorite_toy", correctedToy[1]);
                  else if (initialToy) set("favorite_toy", initialToy[1]);
                }
                if (/(?:固定习惯|固定安排|每天)/.test(input)) {
                  const time = input.match(/每天(?:晚上|早上|上午|下午)?([^，。；]*?点)/);
                  const place = input.match(/在([^，。；]+?)玩/);
                  if (time) set("routine_time", time[1]);
                  if (place) set("routine_place", place[1]);
                }
                if (/(?:共同经历|共同事件)/.test(input)) {
                  const event = input.match(/在([^，。；]+)遇见(?:了)?(?:一只)?叫([^，。；]+?)的/);
                  if (event) { set("shared_event_place", event[1]); set("shared_event_name", event[2]); }
                }
                if (changed) state.revision = Number(state.revision || 0) + 1;
                board.setVar("pet_durable_state", state);
                board.setVar("pet_durable_state_fact", JSON.stringify(state));
          - id: observe_pet_memory
            type: memory_observe
            config:
              observations:
                - turns_from: conversation
              wait_for_completion: false
          - id: observe_pet_state
            type: memory_observe
            config:
              observations:
                - facts:
                    - text_from: pet_durable_state_fact
                      attributes: {lane: owner_pet_facts, kind: state}
              wait_for_completion: false
        edges:
          - from: recall_relationship
            to: recall_owner
          - from: recall_owner
            to: recall_knowledge
          - from: recall_knowledge
            to: recall_events
          - from: recall_events
            to: prepare_pet_context
          - from: prepare_pet_context
            to: draft_answer
          - from: draft_answer
            to: answer
          - from: answer
            to: prepare_pet_state
          - from: prepare_pet_state
            to: observe_pet_memory
          - from: observe_pet_memory
            to: observe_pet_state
          - from: observe_pet_state
            to: __end__
      max_iterations: 13
      conversation:
        starts: peer
      voice_adapter:
        asr_model: asr
        default_voice: pet-care.pet
        node_voices:
          answer: pet-care.pet
