name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache-dependency-path: |
            tools/raidtest/go.sum
            tools/raids/go.sum

      - name: Download GizClaw v0.6.0
        env:
          GIZCLAW_ASSET: gizclaw_0.6.0_amd64.deb
          GIZCLAW_SHA256: 0a407f8a8ba75999ff55a16e972ce660514290fe0bb6f72e7ccc114de34e2b9e
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/$GIZCLAW_ASSET"
          root="$RUNNER_TEMP/gizclaw-v0.6.0"
          curl --fail --location --retry 3 \
            --output "$package" \
            "https://github.com/GizClaw/gizclaw/releases/download/v0.6.0/$GIZCLAW_ASSET"
          printf '%s  %s\n' "$GIZCLAW_SHA256" "$package" | sha256sum --check --status
          dpkg-deb --extract "$package" "$root"
          printf 'GIZCLAW=%s\n' "$root/usr/bin/gizclaw" >> "$GITHUB_ENV"

      - name: Run repository checks
        env:
          CGO_ENABLED: "0"
        run: make ci
