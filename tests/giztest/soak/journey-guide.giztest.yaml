# User Story:
# As a Raids catalog maintainer,
# I want every available journey-guide implementation to complete the same bounded Tester relay,
# So that the 20-response `default-journey` route, its deterministic contracts, and the final verdict stay declarative.
version: gizclaw.test/v1alpha1
name: soak.journey-guide
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_history:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_history_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_memory_async:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_memory_async_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_memory_recall:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_memory_recall_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-journey-guide long-form-branch-correction-return
  flowcraft_candidate_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_verdict:
    direction: output
    type: string
  flowcraft_reload_handoff:
    direction: output
    type: string
  eino_history_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_history_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_history_verdict:
    direction: output
    type: string
  eino_history_reload_handoff:
    direction: output
    type: string
  eino_memory_async_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_async_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_async_verdict:
    direction: output
    type: string
  eino_memory_async_reload_handoff:
    direction: output
    type: string
  eino_memory_recall_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_recall_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_recall_verdict:
    direction: output
    type: string
  eino_memory_recall_reload_handoff:
    direction: output
    type: string
repeat: 1
timeout: 316m
steps:
- id: flowcraft_register_candidate
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_register_tester
  client: flowcraft_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_candidate_workspace}"
      collection: story-teller
      workflow_name: journey
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_create_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_tester_workspace}"
      collection: raidtest-testers
      workflow_name: journey-guide-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_select_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_candidate_workspace}"
- id: flowcraft_warmup_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_select_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_tester_workspace}"
- id: flowcraft_run_dialogue_before_reload
  timeout: 40m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 24
    terminal_client: flowcraft
  capture:
    flowcraft_reload_handoff: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft
    "/completed_turns":
      equals: 24
    "/turns/flowcraft/count":
      equals: 12
    "/turns/flowcraft_tester/count":
      equals: 12
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 10
    "/turns/flowcraft/text_runes/max":
      maximum: 520
- id: flowcraft_recall_barrier_1
  client: flowcraft
  rpc:
    method: server.run.workspace.recall
    request:
      query: 明月
  timeout: 90s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: flowcraft_recall_barrier_2
  client: flowcraft
  rpc:
    method: server.run.workspace.recall
    request:
      query: 青铜铃
  timeout: 90s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: flowcraft_recall_barrier_3
  client: flowcraft
  rpc:
    method: server.run.workspace.recall
    request:
      query: 商队
  timeout: 90s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: flowcraft_reload_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_run_dialogue_after_reload
  timeout: 29m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${flowcraft_reload_handoff}"
    media: text
    idle_timeout: 90s
    max_turns: 17
    terminal_client: flowcraft_tester
  capture:
    flowcraft_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 17
    "/turns/flowcraft/count":
      equals: 8
    "/turns/flowcraft_tester/count":
      equals: 9
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 10
    "/turns/flowcraft/text_runes/max":
      maximum: 200
- id: flowcraft_emit_verdict
  output:
    variable: flowcraft_verdict
- id: eino_history_register_candidate
  client: eino_history
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_history_register_tester
