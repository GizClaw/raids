            {rules}

            【谜底卡】
            简介：鼻子又大又软、像短短象鼻一样垂下来的羚羊，生活在中亚寒冷干旱的草原上。
            类别：哺乳动物（牛科）
            生活在哪里：中亚的干草原，主要在哈萨克斯坦、俄罗斯和蒙古
            吃什么：草食，吃草和灌木
            大小：比绵羊大一点，肩高约七八十厘米，比人矮
            会不会飞：不会
            会不会游泳：会
            特点：大鼻子能过滤灰尘、温暖冷空气；雄的有半透明的角
            注意：它的大鼻子冬天暖空气、夏天滤沙尘；它曾和猛犸象生活在同一时代
        - placeholder: history
        - role: system
          template: '【本轮指令】{direction}'
      - id: card-l10-p11
        type: prompt
