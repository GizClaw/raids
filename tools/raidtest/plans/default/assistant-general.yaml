version: v1
name: default-assistant-general
driver: flowcraft
persona: 普通用户，以自然口语验证助手是否真正记住更正后的事实并服从长度要求。
cases:
  - id: correction-and-reload
    workflow_id: flowcraft-chat-assistant
    turns:
      - id: establish
        user: 我下周三要去杭州见周宁，车次是G7331，请记住。
      - id: correct
        user: 更正一下，不是杭州，是苏州；车次也改成G7105。
        required: [苏州, G7105]
        forbidden: [杭州, G7331]
      - id: non-adjacent
        user: 先用不超过10个字鼓励我。
        max_runes: 10
      - id: recall
        reload_before: true
        user: 20个字以内告诉我去哪、见谁、坐哪趟车。
        required: [苏州, 周宁, G7105]
        forbidden: [杭州, G7331]
        max_runes: 20
        judge: [correction-handling, instruction-following]
  - id: explicit-format-instruction
    workflow_id: flowcraft-chat-assistant
    turns:
      - id: exact-answer
        user: 只回答“收到”，不要加其他内容。
        required: [收到]
        max_runes: 2
        judge: [instruction-following]
