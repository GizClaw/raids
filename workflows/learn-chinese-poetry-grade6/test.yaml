apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: learn-chinese-poetry-grade6-test
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    graph:
      name: learn-chinese-poetry-grade6-test-relay
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 8
      state:
        fields:
        - name: tester-route
          type: string
          merge: replace
        - name: tester-message
          type: string
          merge: replace
        - name: tester-det
          type: string
          merge: replace
        - name: prompt-system
          type: string
          merge: replace
        - name: prompt-user
          type: string
          merge: replace
        - name: judge-messages
          type: messages
          merge: replace
        - name: model-text
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: route-turn
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: tester-route
          message: tester-message
          det: tester-det
          system: prompt-system
          user: prompt-user
        language: starlark
        entrypoint: run
        source: |
          REQUESTS = ["请从指定中文开场开始。", "我们刚学了《六月二十七日望湖楼醉书》，你给我讲讲吧。", "你能把这首诗完整地念给我听吗？", "这首诗是在什么情况下写的？是有记载的，还是一般认为的，还是传说？", "诗人写这首诗那天中午吃的是什么？", "我还会背《静夜思》，你能念给我听吗？", "请记住：我今天学会了《六月二十七日望湖楼醉书》，下次想学《泊船瓜洲》。只确认你已经记住。", "重连后，请只说我下次想学哪首诗。"]
          INTENTS = ["", "", "", "", "", "", "", ""]
          CHECKPOINTS = ["opening", "poem-intro", "recite-exact", "background-label", "unknown-boundary", "other-grade-poem", "memory-store", "memory-recall"]
          CONTRACTS = ["必须逐字符合指定中文开场；不得含Markdown、列表、emoji或舞台说明；15-240字", "必须承接这首诗并正确说出作者苏轼；只讲知识卡内的作者或背景；最多一个问题；30-360字", "必须逐字念出课本正文“黑云翻墨未遮山，白雨跳珠乱入船。卷地风来忽吹散，望湖楼下水如天。”，不得改字漏字；20-360字", "必须按知识卡讲背景“熙宁五年（1072）苏轼任杭州通判，六月二十七日游西湖，在望湖楼饮酒时写下。”，并说明它属于史实；不得添加知识卡外的细节；20-360字", "知识卡没有这个细节，必须明确说没有记载或不确定，不得编造食物、地名或人名，也不得用可能、大概去猜；10-320字", "《静夜思》是一年级的诗，必须正常念出全文“床前明月光，疑是地上霜。举头望明月，低头思故乡。”，不得婉拒；20-360字", "必须确认已记住今天学会的诗和下次想学《泊船瓜洲》（复述措辞可以不同，下一轮重连后再严格核对）；4-320字", "重载后必须从长期记忆准确回忆《泊船瓜洲》；只回答诗名；2-200字"]
          CHECKS = [{"required": ["你好呀，我是古诗小书童。我们来聊聊六年级的古诗吧，说一首你学过的，我给你讲讲它背后的故事。"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 15, "max_runes": 240}, {"required": ["苏轼"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 30, "max_runes": 360}, {"required": ["黑云翻墨未遮山", "白雨跳珠乱入船", "卷地风来忽吹散", "望湖楼下水如天"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["记载", "原注", "注明", "写着"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["没有记载", "没有留下记载", "没有相关记载", "没有确切记载", "不确定", "不知道", "查不到", "没有资料", "无法确定", "没法确定", "没有确切"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 10, "max_runes": 320}, {"required": ["床前明月光", "疑是地上霜", "举头望明月", "低头思故乡"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["记住", "记下", "记好", "记得"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 4, "max_runes": 320}, {"required": ["泊船瓜洲"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 2, "max_runes": 200}]
          RULES = "你是 `learn-chinese-poetry-grade6` 的专属验收 Workflow，不是目标角色。指定中文开场是：你好呀，我是古诗小书童。我们来聊聊六年级的古诗吧，说一首你学过的，我给你讲讲它背后的故事。 体验要求：古诗小书童陪孩子拓展课本古诗，念知识卡里的诗必须与课本正文逐字一致；背景要区分有记载、一般认为和传说；可以在知识卡基础上补充公认准确的内容；查无实据的细节必须承认没有记载或不确定，不得编造；孩子提到的任何诗都要正常讲、正常念，婉拒属于失败。本路线使用的知识卡条目：《六月二十七日望湖楼醉书》宋·苏轼，正文“黑云翻墨未遮山，白雨跳珠乱入船。卷地风来忽吹散，望湖楼下水如天。”，背景（史实）：熙宁五年（1072）苏轼任杭州通判，六月二十七日游西湖，在望湖楼饮酒时写下。。《静夜思》唐·李白，正文“床前明月光，疑是地上霜。举头望明月，低头思故乡。”。《泊船瓜洲》宋·王安石。知识卡没有记录诗人写诗那天吃了什么。 知识卡是目标的提纲：目标可以在知识卡基础上补充公认准确的常识、背景和延伸知识，这不算编造；只有和知识卡矛盾、明显错误，或查无实据的细节（例如某人某天吃了什么、说过的原话、具体日期）才算编造。完整知识卡如下：常识：绝句每首四句，属于唐代成熟的“近体诗”。五言绝句每句5个字、共20字；七言绝句每句7个字、共28字。 常识：律诗每首八句：五言律诗共40字，七言律诗共56字；第二、四、六、八句要押韵，格律要求很严。 常识：“五言”指每句五个字，“七言”指每句七个字，例如《登鹳雀楼》是五言绝句，《暮江吟》是七言绝句。 常识：《全唐诗》是清代康熙年间（1705年开始编）奉皇帝命令编成的唐诗总集，共900卷，收诗四万八千九百多首、诗人两千二百多位。 常识：李白被后人誉为“诗仙”，杜甫被尊为“诗圣”，两人合称“李杜”。 常识：《唐诗三百首》是清代孙洙（号蘅塘退士）和夫人徐兰英编的唐诗选本，1763年前后成书，原本收77位诗人的311首诗，后来的版本有增补。 作者 孟浩然：孟浩然（689—740），名浩，字浩然，襄州襄阳人，世称“孟襄阳”。 作者 苏轼：苏轼（1037—1101），字子瞻，号东坡居士，北宋文学家、书画家。 作者 刘禹锡：刘禹锡（772—842），字梦得，唐代诗人、哲学家，有“诗豪”之称。 作者 杜牧：杜牧（803—约852），字牧之，号樊川居士，晚唐诗人。 作者 杜甫：唐代诗人，被尊为“诗圣”。 作者 辛弃疾：南宋豪放派词人，号稼轩，年轻时曾起兵抗金。 作者 王安石：北宋政治家、改革家，“唐宋八大家”之一。 作者 朱熹：南宋理学家，著有《四书章句集注》。 作者 王维：唐代诗人、画家，苏轼称赞他“诗中有画，画中有诗”。 作者 贺知章：唐代诗人，自号“四明狂客”，曾称李白为“谪仙人”。 作者 韩翃：唐代诗人，“大历十才子”之一。 作者 佚名（《古诗十九首》）：《古诗十九首》作者已不可考，南朝萧统把它们编进了《文选》。 作者 王建：唐代诗人，擅长乐府诗，与张籍并称“张王乐府”。 作者 李贺：唐代诗人，人称“诗鬼”，二十七岁就去世了。 作者 于谦：明代名臣，曾领导北京保卫战。 作者 郑燮：清代书画家，号板桥，“扬州八怪”之一。 作者 汉乐府：乐府原是汉代管理音乐的官署，负责采集民间歌谣。 作者 《诗经·小雅》：《诗经》是我国最早的诗歌总集，收诗305篇。 作者 叶绍翁：南宋诗人，属“江湖诗派”。 作者 王观：北宋词人，曾任翰林学士。 作者 黄庭坚：北宋诗人、书法家，“苏门四学士”之一。 《宿建德江》唐·孟浩然｜六年级上册｜正文：移舟泊烟渚，日暮客愁新。野旷天低树，江清月近人。｜背景（通说）：一般认为是孟浩然开元年间漫游吴越、夜里停船在建德江边时所作。｜拓展：建德江是新安江流经浙江建德的一段，新安江以江水清澈出名。｜异文：“烟渚”一作“幽渚”。 《六月二十七日望湖楼醉书》宋·苏轼｜六年级上册｜正文：黑云翻墨未遮山，白雨跳珠乱入船。卷地风来忽吹散，望湖楼下水如天。｜背景（史实）：熙宁五年（1072）苏轼任杭州通判，六月二十七日游西湖，在望湖楼饮酒时写下。｜拓展：望湖楼在杭州西湖断桥附近，最早由吴越国王钱弘俶建造，起初叫“看经楼”。｜异文：原来是五首一组，课文选的是第一首。 《浪淘沙（其一）》唐·刘禹锡｜六年级上册｜正文：九曲黄河万里沙，浪淘风簸自天涯。如今直上银河去，同到牵牛织女家。｜背景（通说）：《浪淘沙九首》的第一首；写作时间、地点说法不一，有学者认为作于夔州。｜拓展：黄河是中国第二长河，全长约5464公里，最后流入渤海。｜异文：出自组诗《浪淘沙九首》，此为第一首。 《江南春》唐·杜牧｜六年级上册｜正文：千里莺啼绿映红，水村山郭酒旗风。南朝四百八十寺，多少楼台烟雨中。｜背景（通说）：写江南春景和南朝古寺；写作时间、地点说法不一，一说作于赴宣州途中。｜拓展：诗中“南朝”的都城建康，就是今天的江苏南京。｜异文：诗题一作《江南春绝句》。 《江畔独步寻花（其五）》唐·杜甫｜六年级上册·日积月累｜正文：黄师塔前江水东，春光懒困倚微风。桃花一簇开无主，可爱深红爱浅红？｜背景（通说）：杜甫定居成都草堂后，春天独自在锦江边赏花写下的组诗之一。｜拓展：这组诗共七首，“黄四娘家花满蹊”是第六首。｜异文：最后一句也有写作“可爱深红映浅红”的。 《西江月·夜行黄沙道中》宋·辛弃疾｜六年级上册｜正文：明月别枝惊鹊，清风半夜鸣蝉。稻花香里说丰年，听取蛙声一片。七八个星天外，两三点雨山前。旧时茅店社林边，路转溪桥忽见。｜背景（通说）：辛弃疾罢官闲居江西上饶期间，夜行黄沙岭道中所作。｜拓展：黄沙岭在今江西上饶，这首词写的是夏夜乡村。 《书湖阴先生壁》宋·王安石｜六年级上册｜正文：茅檐长扫净无苔，花木成畦手自栽。一水护田将绿绕，两山排闼送青来。｜背景（史实）：王安石退居金陵（今南京）时，题在邻居杨德逢家墙壁上的诗。｜拓展：湖阴先生名叫杨德逢，是王安石的邻居和朋友。｜异文：原为《书湖阴先生壁二首》其一；“长”一作“常”。 《观书有感（其二）》宋·朱熹｜六年级上册·日积月累｜正文：昨夜江边春水生，蒙冲巨舰一毛轻。向来枉费推移力，此日中流自在行。｜背景（史实）：写作时间、地点没有确切记载｜拓展：“蒙冲”是古代一种用牛皮蒙住船身的战船。｜异文：“蒙冲”也写作“艨艟”，是古代的一种战船。 《送元二使安西》唐·王维｜六年级上册·日积月累｜正文：渭城朝雨浥轻尘，客舍青青柳色新。劝君更尽一杯酒，西出阳关无故人。｜背景（史实）：王维在渭城为出使安西的朋友元二送行时所作。｜拓展：这首诗后来被谱成琴曲，名叫《阳关三叠》。 《过故人庄》唐·孟浩然｜六年级上册·日积月累｜正文：故人具鸡黍，邀我至田家。绿树村边合，青山郭外斜。开轩面场圃，把酒话桑麻。待到重阳日，还来就菊花。｜背景（通说）：孟浩然隐居家乡襄阳一带时，应邀到农家老友家做客所作。｜拓展：重阳节有赏菊习俗，“还来就菊花”是约好重阳再来。｜异文：“开轩面场圃”也有写作“开筵面场圃”的。 《春日》宋·朱熹｜六年级上册·日积月累｜正文：胜日寻芳泗水滨，无边光景一时新。等闲识得东风面，万紫千红总是春。｜背景（通说）：泗水当时已在金朝境内，一般认为诗人借游春表达对孔子之道的向往。｜拓展：成语“万紫千红”就出自这首诗。 《回乡偶书》唐·贺知章｜六年级上册·日积月累｜正文：少小离家老大回，乡音无改鬓毛衰。儿童相见不相识，笑问客从何处来。｜背景（通说）：一般认为作于744年，贺知章八十多岁辞官回到故乡越州时。｜拓展：贺知章离家五十多年才回乡，连孩子都把他当客人。｜异文：原题共两首，课本选的是第一首。 《寒食》唐·韩翃｜六年级下册｜正文：春城无处不飞花，寒食东风御柳斜。日暮汉宫传蜡烛，轻烟散入五侯家。｜背景（史实）：写作时间、地点没有确切记载｜拓展：唐人《本事诗》记载，皇帝因喜欢这首诗提拔了韩翃。 《迢迢牵牛星》汉·佚名（《古诗十九首》）｜六年级下册｜正文：迢迢牵牛星，皎皎河汉女。纤纤擢素手，札札弄机杼。终日不成章，泣涕零如雨。河汉清且浅，相去复几许。盈盈一水间，脉脉不得语。｜背景（通说）：《古诗十九首》之一，一般认为是东汉末年无名文人所作。｜拓展：牵牛星在天鹰座，织女星在天琴座，中间隔着银河。｜异文：出自《古诗十九首》，作者不详，旧时有人说是枚乘写的。 《十五夜望月》唐·王建｜六年级下册｜正文：中庭地白树栖鸦，冷露无声湿桂花。今夜月明人尽望，不知秋思落谁家。｜背景（通说）：中秋夜王建与朋友相聚时写给杜郎中的诗，题下原注“时会琴客”。｜拓展：“十五夜”指农历八月十五中秋节的夜晚。｜异文：原题《十五夜望月寄杜郎中》；“秋思落谁家”也有写作“在谁家”的。 《马诗》唐·李贺｜六年级下册｜正文：大漠沙如雪，燕山月似钩。何当金络脑，快走踏清秋。｜背景（史实）：写作时间、地点没有确切记载｜拓展：李贺一共写了二十三首《马诗》，这是第五首。｜异文：原题《马诗二十三首》，课本选的是第五首。 《石灰吟》明·于谦｜六年级下册｜正文：千锤万凿出深山，烈火焚烧若等闲。粉骨碎身浑不怕，要留清白在人间。｜背景（传说）：相传于谦少年时看工匠烧石灰有感而作。｜拓展：1449年于谦主持北京保卫战，击退了瓦剌军队。｜异文：题目也有作《咏石灰》的，有的版本写作“粉身碎骨全不怕”。 《竹石》清·郑燮｜六年级下册｜正文：咬定青山不放松，立根原在破岩中。千磨万击还坚劲，任尔东西南北风。｜背景（史实）：郑燮题在自己所画《竹石图》上的题画诗。｜拓展：郑板桥最爱画竹子，这首诗就写在他的画上。｜异文：郑燮多幅《竹石图》都题有此诗，文字略有差异。 《长歌行》汉·汉乐府｜六年级下册·日积月累｜正文：青青园中葵，朝露待日晞。阳春布德泽，万物生光辉。常恐秋节至，焜黄华叶衰。百川东到海，何时复西归？少壮不努力，老大徒伤悲！｜背景（史实）：汉代乐府诗，作者已不可考，写作时间、地点没有确切记载。｜拓展：“少壮不努力，老大徒伤悲”成了劝人惜时的名言。 《采薇（节选）》先秦·《诗经·小雅》｜六年级下册·古诗词诵读｜正文：昔我往矣，杨柳依依。今我来思，雨雪霏霏。行道迟迟，载渴载饥。我心伤悲，莫知我哀！｜背景（通说）：写戍边士兵归途所感，写作年代说法不一。｜拓展：“雨雪霏霏”的“雨”读yù，是“下雪”的意思。｜异文：课本节选《采薇》末章。 《春夜喜雨》唐·杜甫｜六年级下册·古诗词诵读｜正文：好雨知时节，当春乃发生。随风潜入夜，润物细无声。野径云俱黑，江船火独明。晓看红湿处，花重锦官城。｜背景（通说）：一般认为作于761年春，杜甫定居成都草堂时。｜拓展：“锦官城”是成都的别称，成都古时以织锦出名。 《泊船瓜洲》宋·王安石｜六年级下册·古诗词诵读｜正文：京口瓜洲一水间，钟山只隔数重山。春风又绿江南岸，明月何时照我还。｜背景（通说）：一般认为作于1075年王安石第二次被召回京任宰相途中。｜拓展：宋人洪迈记载，“绿”字王安石改了十多次才定下。｜异文：宋代的王安石文集里写作“春风自绿江南岸”，课本用的是通行的“又绿”。 《游园不值》宋·叶绍翁｜六年级下册·古诗词诵读｜正文：应怜屐齿印苍苔，小扣柴扉久不开。春色满园关不住，一枝红杏出墙来。｜背景（史实）：写作时间、地点没有确切记载｜拓展：“屐”是木底鞋，鞋底有齿，踩在青苔上会留下印子。｜异文：“一枝红杏”也有写作“一支红杏”的，“应怜”也有写作“应嫌”的。 《卜算子·送鲍浩然之浙东》宋·王观｜六年级下册·古诗词诵读｜正文：水是眼波横，山是眉峰聚。欲问行人去那边？眉眼盈盈处。才始送春归，又送君归去。若到江南赶上春，千万和春住。｜背景（史实）：王观送好友鲍浩然前往浙东时写的送别词。｜拓展：词里把水比作眼波，把山比作眉峰。｜异文：“那边”就是“哪边”的意思。 《浣溪沙》宋·苏轼｜六年级下册·古诗词诵读｜正文：游蕲水清泉寺，寺临兰溪，溪水西流。山下兰芽短浸溪，松间沙路净无泥，萧萧暮雨子规啼。谁道人生无再少？门前流水尚能西！休将白发唱黄鸡。｜背景（史实）：1082年春苏轼被贬黄州期间，游蕲水清泉寺时所作。｜拓展：中国河流大多向东流，这里的兰溪却向西流。 《清平乐》宋·黄庭坚｜六年级下册·古诗词诵读｜正文：春归何处？寂寞无行路。若有人知春去处，唤取归来同住。春无踪迹谁知？除非问取黄鹂。百啭无人能解，因风飞过蔷薇。｜背景（通说）：一般认为作于1105年黄庭坚被贬宜州时。｜拓展：黄庭坚也是大书法家，是书法“宋四家”之一。｜异文：“问取”也有写作“唤取”的。"
