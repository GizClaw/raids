              {'field': '生平', 'line': 9, 'part': 1, 'text': '701年，出生，少年时在蜀中读书学剑，曾在匡山读书', 'terms': {'701': 50, 'chronology': 8, 'journey': 8, 'life': 8, 'year': 8, '中读': 100, '书学': 100, '出生': 33, '匡山': 100, '在匡': 100, '在蜀': 100, '学剑': 100, '少年': 50, '山读': 100, '年时': 100, '时在': 100, '曾在': 100, '生平': 8, '蜀中': 33, '读书': 100, 'as': 14, 'at': 9, 'books': 100, 'born': 100, 'in': 3, 'including': 25, 'kuang': 100, 'mount': 20, 'shu': 14, 'studied': 100, 'study': 50, 'swordsmanship': 100, 'youth': 100}, 'rendered': '生平：701年，出生，少年时在蜀中读书学剑，曾在匡山读书', 'characters': 29, 'id': 'L9.1', 'en': 'Life: born in 701; studied books and swordsmanship in Shu as a youth, including study at Mount Kuang'},
              {'field': '生平', 'line': 9, 'part': 2, 'text': '约725年，二十多岁时出蜀，沿长江东下漫游洞庭、金陵、扬州等地', 'terms': {'725': 100, 'chronology': 8, 'journey': 8, 'life': 8, 'year': 8, '下漫': 100, '东下': 100, '二十': 100, '出蜀': 50, '十多': 33, '多岁': 50, '岁时': 100, '州等': 100, '扬州': 25, '时出': 100, '江东': 100, '沿长': 100, '洞庭': 33, '游洞': 100, '漫游': 33, '生平': 8, '等地': 50, '金陵': 100, '长江': 100, 'along': 50, 'around': 25, 'dongting': 33, 'east': 33, 'in': 3, 'including': 25, 'jinling': 100, 'left': 100, 'places': 33, 'shu': 14, 'through': 50, 'travelled': 16, 'twenties': 100, 'yangtze': 100, 'yangzhou': 25}, 'rendered': '生平：约725年，二十多岁时出蜀，沿长江东下漫游洞庭、金陵、扬州等地', 'characters': 35, 'id': 'L9.2', 'en': 'Life: around 725, in his twenties, left Shu and travelled east along the Yangtze through places including Dongting, Jinling, and Yangzhou'},
              {'field': '生平', 'line': 9, 'part': 3, 'text': '约727年，在安陆成婚，此后以安陆为中心漫游约十年', 'terms': {'727': 100, 'chronology': 8, 'journey': 8, 'life': 8, 'year': 8, '中心': 100, '为中': 100, '以安': 100, '十年': 100, '后以': 100, '在安': 100, '安陆': 100, '心漫': 100, '成婚': 100, '此后': 50, '游约': 100, '漫游': 33, '生平': 8, '约十': 100, '陆为': 100, '陆成': 100, 'about': 50, 'anlu': 100, 'around': 25, 'as': 14, 'base': 100, 'for': 10, 'in': 3, 'married': 100, 'ten': 50, 'travelled': 16, 'years': 25}, 'rendered': '生平：约727年，在安陆成婚，此后以安陆为中心漫游约十年', 'characters': 29, 'id': 'L9.3', 'en': 'Life: married in Anlu around 727 and travelled with Anlu as his base for about ten years'},
              {'field': '生平', 'line': 9, 'part': 4, 'text': '742年，被唐玄宗召入长安供奉翰林，写过奉命应制的诗', 'terms': {'742': 100, 'chronology': 8, 'journey': 8, 'life': 8, 'year': 8, '供奉': 50, '入长': 100, '写过': 100, '制的': 100, '召入': 100, '命应': 100, '唐玄': 100, '奉命': 100, '奉翰': 50, '安供': 100, '宗召': 100, '应制': 100, '玄宗': 100, '生平': 8, '的诗': 33, '翰林': 16, '被唐': 100, '过奉': 100, '长安': 50, 'an': 20, 'as': 14, 'attendant': 50, 'by': 100, 'chang': 50, 'command': 100, 'emperor': 100, 'hanlin': 25, 'imperial': 100, 'in': 3, 'on': 33, 'poetry': 50, 'serve': 100, 'summoned': 100, 'to': 4, 'wrote': 25, 'xuanzong': 100}, 'rendered': '生平：742年，被唐玄宗召入长安供奉翰林，写过奉命应制的诗', 'characters': 30, 'id': 'L9.4', 'en': "Life: summoned by Emperor Xuanzong to Chang'an in 742 to serve as a Hanlin attendant; wrote poetry on imperial command"},
              {'field': '生平', 'line': 9, 'part': 5, 'text': '744年，受排挤被赐金放还，同年在洛阳与杜甫相识，又与杜甫、高适同游梁宋', 'terms': {'744': 50, 'chronology': 8, 'du': 33, 'fu': 33, 'journey': 8, 'life': 8, 'year': 8, '与杜': 50, '又与': 100, '受排': 100, '同年': 100, '同游': 33, '在洛': 100, '子美': 33, '年在': 100, '挤被': 100, '排挤': 100, '放还': 100, '杜子': 33, '杜甫': 33, '梁宋': 100, '洛阳': 100, '游梁': 100, '生平': 8, '甫相': 100, '相识': 50, '被赐': 100, '赐金': 100, '适同': 100, '金放': 100, '阳与': 100, '高适': 100, 'after': 25, 'court': 50, 'dismissed': 100, 'exclusion': 100, 'facing': 100, 'gao': 33, 'gift': 100, 'gold': 33, 'in': 3, 'liang': 100, 'luoyang': 100, 'met': 25, 'of': 7, 'shi': 50, 'song': 25, 'travelled': 16}, 'rendered': '生平：744年，受排挤被赐金放还，同年在洛阳与杜甫相识，又与杜甫、高适同游梁宋', 'characters': 40, 'id': 'L9.5', 'en': 'Life: dismissed from court with a gift of gold in 744 after facing exclusion; met Du Fu in Luoyang that year and travelled in Liang and Song with Du Fu and Gao Shi'},
              {'field': '生平', 'line': 9, 'part': 6, 'text': '745年，与杜甫在东鲁分别，此后再未相见', 'terms': {'745': 100, 'chronology': 8, 'du': 33, 'fu': 33, 'journey': 8, 'life': 8, 'year': 8, '与杜': 50, '东鲁': 100, '再未': 100, '分别': 50, '后再': 100, '在东': 100, '子美': 33, '未相': 100, '杜子': 33, '杜甫': 33, '此后': 50, '生平': 8, '甫在': 100, '相见': 50, '鲁分': 100, 'again': 50, 'eastern': 100, 'in': 3, 'lu': 33, 'met': 25, 'never': 100, 'parted': 50, 'they': 33}, 'rendered': '生平：745年，与杜甫在东鲁分别，此后再未相见', 'characters': 24, 'id': 'L9.6', 'en': 'Life: parted from Du Fu in eastern Lu in 745; they never met again'},
              {'field': '生平', 'line': 9, 'part': 7, 'text': '756年底，安史之乱中加入永王李璘幕府', 'terms': {'756': 100, 'chronology': 8, 'journey': 8, 'life': 8, 'year': 8, '中加': 100, '之乱': 50, '乱中': 100, '入永': 100, '加入': 100, '史之': 50, '安史': 50, '幕府': 100, '年底': 100, '李璘': 100, '永王': 50, '王李': 100, '璘幕': 100, '生平': 8, 'an': 20, 'during': 50, 'in': 3, 'joined': 100, 'late': 100, 'li': 4, 'lin': 100, 'lushan': 100, 'prince': 50, 'rebellion': 50, 'staff': 100, 'yong': 50}, 'rendered': '生平：756年底，安史之乱中加入永王李璘幕府', 'characters': 23, 'id': 'L9.7', 'en': "Life: joined Prince Yong Li Lin's staff late in 756, during the An Lushan Rebellion"},
              {'field': '生平', 'line': 9, 'part': 8, 'text': '757年，永王兵败，李白获罪入浔阳狱，次年被判流放夜郎', 'terms': {'757': 100, 'chronology': 8, 'journey': 8, 'life': 8, 'year': 8, '入浔': 100, '兵败': 100, '判流': 100, '夜郎': 100, '年被': 100, '放夜': 100, '李白': 4, '次年': 100, '永王': 50, '流放': 50, '浔阳': 100, '王兵': 100, '生平': 8, '白获': 100, '罪入': 100, '获罪': 100, '被判': 100, '阳狱': 100, 'after': 25, 'defeat': 100, 'exile': 50, 'following': 100, 'imprisoned': 100, 'in': 3, 'prince': 50, 'sentenced': 100, 'to': 4, 'xunyang': 100, 'yelang': 100, 'yong': 50}, 'rendered': '生平：757年，永王兵败，李白获罪入浔阳狱，次年被判流放夜郎', 'characters': 31, 'id': 'L9.8', 'en': "Life: imprisoned in Xunyang after Prince Yong's defeat in 757; sentenced the following year to exile in Yelang"},
              {'field': '生平', 'line': 9, 'part': 9, 'text': '759年，行至白帝城一带遇赦东还，一说《早发白帝城》作于此时', 'terms': {'759': 100, 'chronology': 8, 'journey': 8, 'life': 8, 'year': 8, '一带': 50, '一说': 33, '东还': 100, '于此': 100, '作于': 100, '发白': 33, '城一': 100, '帝城': 33, '带遇': 100, '早发': 33, '此时': 100, '生平': 8, '白帝': 33, '至白': 100, '行至': 100, '赦东': 100, '遇赦': 100, 'account': 33, 'baidi': 33, 'dates': 50, 'departure': 25, 'early': 33, 'east': 33, 'in': 3, 'near': 33, 'one': 25, 'pardoned': 100, 'returned': 100, 'this': 50, 'to': 4}, 'rendered': '生平：759年，行至白帝城一带遇赦东还，一说《早发白帝城》作于此时', 'characters': 34, 'id': 'L9.9', 'en': 'Life: pardoned near Baidi in 759 and returned east; one account dates Early Departure from Baidi to this journey'},
