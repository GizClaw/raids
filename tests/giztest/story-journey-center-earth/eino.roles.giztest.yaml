          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_lidenbrock_workspace
  client: lidenbrock
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${lidenbrock_workspace}"
- id: warmup_lidenbrock_workspace
  client: lidenbrock
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: lidenbrock_chapter_setup_1
  client: lidenbrock
  timeout: 2m
  peer_stream:
    mode: text
    input: 请从第一章开始《地心游记》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains: 第 1 章：岩层入口
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_lidenbrock
  client: lidenbrock
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让黎登布洛克亲自回应，只说这个角色知道的事。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 黎登布洛克说
      - 黎登布洛克：
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_lidenbrock_first_response
  client: lidenbrock
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让黎登布洛克亲自回应，只说这个角色知道的事。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: register_hans
  client: hans
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_hans_workspace
  client: hans
  rpc:
    method: server.workspace.create
    request:
      name: "${hans_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-journey-center-earth
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
