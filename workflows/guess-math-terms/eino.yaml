ution", "aliases": ["高斯分布"], "profile": "中间高、两边低、左右对称的钟形分布，很多自然数据都符合它。", "hints": ["它和统计有关", "它的图像像一口钟", "它左右对称"]}, {"zh": "杨辉三角", "en": "Pascal's triangle", "aliases": ["帕斯卡三角形", "贾宪三角"], "profile": "把数排成三角形的数表，每个数等于它上方两个数之和。", "hints": ["它是一张数表", "它排成三角形", "它的两条边上都是1"]}, {"zh": "矩阵", "en": "matrix", "aliases": [], "profile": "把数排成横行竖列的长方形数表，在电脑图像和数据计算中很常用。", "hints": ["它是一张数表", "它有行也有列", "它常用于电脑图像"]}, {"zh": "自然常数", "en": "Euler's number", "aliases": ["欧拉数", "自然对数的底数"], "profile": "约等于2.718的无理数，在描述自然增长和复利时会自然出现。", "hints": ["它是一个数", "它的小数写不完", "它和复利增长有关"]}, {"zh": "斐波那契数列", "en": "Fibonacci sequence", "aliases": ["兔子数列"], "profile": "从1、1开始，每个数都等于前两个数之和的数列，比如1、1、2、3、5、8。", "hints": ["它是一列数", "它和前两个数的和有关", "它在向日葵上能找到"]}, {"zh": "反证法", "en": "proof by contradiction", "aliases": ["归谬法"], "profile": "先假设要证明的结论不成立，推出矛盾，从而说明结论成立的证明方法。", "hints": ["它是一种证明方法", "它先做一个假设", "它要推出矛盾"]}, {"zh": "无穷大", "en": "infinity", "aliases": ["无穷", "无限大"], "profile": "比任何数都大、没有尽头的概念，符号像一个横着的8。", "hints": ["它没有尽头", "它比任何数都大", "它的符号像横着的8"]}]}, {"title_zh": "无穷解谜者", "title_en": "Infinity Puzzle Solver", "step": 7, "offset": 0, "items": [{"zh": "积分", "en": "integral", "aliases": ["定积分"], "profile": "高等数学里求曲线下方面积等累积量的运算，和求导数互为逆运算。", "hints": ["它是一种运算", "它能求曲线下的面积", "它和导数正好相反"]}, {"zh": "欧拉恒等式", "en": "Euler's identity", "aliases": ["欧拉公式"], "profile": "把e、i、π、1和0这五个重要的数连在一个等式里，被称为最美的数学公式。", "hints": ["它是一个等式", "它包含五个重要的数", "它被称为最美的公式"]}, {"zh": "费马大定理", "en": "Fermat's Last Theorem", "aliases": ["费马最后定理"], "profile": "说n大于2时，x的n次方加y的n次方等于z的n次方没有正整数解的定理。", "hints": ["它是一个定理", "它和整数方程有关", "它等了三百多年才被证明"]}, {"zh": "哥德巴赫猜想", "en": "Goldbach's conjecture", "aliases": [], "profile": "猜想每个大于2的偶数都能写成两个质数之和，至今还没有被证明。", "hints": ["它还没被证明", "它和质数有关", "它和偶数有关"]}, {"zh": "黎曼猜想", "en": "Riemann hypothesis", "aliases": ["黎曼假设"], "profile": "关于质数分布规律的著名猜想，是千禧年七大数学难题之一，至今未被证明。", "hints": ["它还没被证明", "它和质数有关", "它有百万美元的奖金"]}, {"zh": "四色定理", "en": "four color theorem", "aliases": ["四色猜想", "四色问题"], "profile": "任何地图只