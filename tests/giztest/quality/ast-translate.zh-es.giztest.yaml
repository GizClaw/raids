# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of ast-translate,
# So that safety, correction, recall, routing and language regressions fail at the original gates.
version: gizclaw.test/v1alpha1
name: ast-translate.quality.zh-es
clients:
  ast:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  ast_case5_workspace_name:
    direction: input
    type: string
    generate: token
  ast_case5_audio_1:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case5_audio_2:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case5_audio_3:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case5_audio_4:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case5_audio_5:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case5_audio_6:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case5_audio_7:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case5_audio_8:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case5_audio_9:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case5_audio_10:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
repeat: 1
timeout: 10m
steps:
- id: register_ast
  client: ast
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: ast_case5_stop_create_workspace
  client: ast
  rpc:
    method: server.run.stop
    request: {}
- id: ast_case5_create_workspace
  client: ast
  rpc:
    method: server.workspace.create
    request:
      name: "${ast_case5_workspace_name}"
      collection: translates
      workflow_name: translate-zh-es
      parameters:
        asttranslate_workspace_parameters:
          agent_type: ASTTRANSLATE_WORKSPACE_PARAMETERS_AGENT_TYPE_AST_TRANSLATE
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: ast_case5_select_workspace
  client: ast
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${ast_case5_workspace_name}"
- id: ast_case5_warmup_workspace
  client: ast
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: ast_case5_synthesize_1_gratitude
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 我真的非常感谢你的热心帮助。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case5_audio_1
- id: ast_case5_turn_1_gratitude
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case5_audio_1}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      pattern: "(?i)gracias|agrade\\s*z\\s*co|agradecimiento|agradecid[oa]|agradecer(te|le)?|aprecio|gratitud"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case5_synthesize_2_good-day
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 祝你今天度过愉快美好的一天。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case5_audio_2
- id: ast_case5_turn_2_good-day
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case5_audio_2}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      pattern: "(?i)buen\\s*día|buenos\\s*días|maravilloso|excelente|agrad\\s*able|feliz"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case5_synthesize_3_farewell
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 期待下次和你再次见面。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case5_audio_3
- id: ast_case5_turn_3_farewell
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case5_audio_3}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - nos vemos
      - volver a ver
      - verte
      - próxima
      - próximo
      - nuevamente
      pattern: "[A-Za-z]"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case5_synthesize_4_apology
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 给你带来不便我真的很抱歉。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case5_audio_4
- id: ast_case5_turn_4_apology
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case5_audio_4}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      pattern: "(?i)(lo|me)\\s*s\\s*iento|disculpa|perdón|arrepentid[oa]"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case5_synthesize_5_agreement
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 我完全同意这个计划。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case5_audio_5
- id: ast_case5_turn_5_agreement
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case5_audio_5}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - de acuerdo
      - acuerdo
      - coincido
      pattern: "[A-Za-z]"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case5_synthesize_6_ready
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 请告诉我你是否已经准备好出发。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case5_audio_6
- id: ast_case5_turn_6_ready
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case5_audio_6}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      pattern: "(?i)l\\s*i\\s*s\\s*t\\s*[oa]|p\\s*r\\s*e\\s*p\\s*a\\s*r\\s*a\\s*d\\s*[oa]"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case5_synthesize_7_help
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 你可以帮我搬一下这个箱子吗。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case5_audio_7
- id: ast_case5_turn_7_help
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case5_audio_7}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - ayuda
      - ayudar
      - ayudarme
      pattern: "[A-Za-z]"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case5_synthesize_8_welcome
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 欢迎你来到我们的城市。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case5_audio_8
- id: ast_case5_turn_8_welcome
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case5_audio_8}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      pattern: "(?i)b\\s*i\\s*e\\s*n\\s*v\\s*e\\s*n\\s*i\\s*d\\s*[oa]|damos\\s+la\\s+bienvenida|recibir|acogida"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case5_synthesize_9_congratulations
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 衷心祝贺你取得成功。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case5_audio_9
- id: ast_case5_turn_9_congratulations
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case5_audio_9}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      pattern: "(?i)f\\s*e\\s*l\\s*i\\s*c|e\\s*n\\s*h\\s*o\\s*r\\s*a\\s*b\\s*u\\s*e\\s*n\\s*a"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case5_synthesize_10_good-night
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 祝你今晚休息好并做个好梦。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case5_audio_10
- id: ast_case5_turn_10_good-night
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case5_audio_10}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      pattern: "(?i)b\\s*u\\s*e\\s*n\\s*a\\s*s?\\s+n\\s*o\\s*c\\s*h\\s*e\\s*s|d\\s*u\\s*l\\s*c\\s*e\\s*s\\s+s\\s*u\\s*e\\s*ñ\\s*o\\s*s|descansar|buen\\s+descanso|buen\\s+sueño"
      max_length: 200
    "/audio_bytes":
      minimum: 1
finally:
- id: stop_ast
  client: ast
  rpc:
    method: server.run.stop
    request: {}
- id: ast_case5_delete_workspace
  client: ast
  rpc:
    method: server.workspace.delete
    request:
      name: "${ast_case5_workspace_name}"
- id: delete_ast
  client: ast
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
