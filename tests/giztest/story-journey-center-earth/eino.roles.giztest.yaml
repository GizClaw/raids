    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: hans_chapter_1_0
  client: hans
  timeout: 2m
  peer_stream:
    mode: text
    input: 我选择刚才的第一个方向，请推进一个直接结果。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: hans_chapter_1_1
  client: hans
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让阿克塞尔亲自回应，说出不同立场。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: hans_chapter_1_2
  client: hans
  timeout: 2m
  peer_stream:
    mode: text
    input: 进入下一章。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      contains: 第 2 章：地下水路
- id: probe_hans
  client: hans
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让汉斯亲自回应，只说这个角色知道的事。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 汉斯说
      - 汉斯：
    "/text_eos":
