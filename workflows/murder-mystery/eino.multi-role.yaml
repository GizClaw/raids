---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-murder-mystery-multi-role
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: adventure
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-murder-mystery-mr.game-master
      speaker_voices:
        主持人: eino-murder-mystery-mr.game-master
        管家: eino-murder-mystery-mr.housekeeper
        厨师: eino-murder-mystery-mr.chef
        沈知秋: eino-murder-mystery-mr.heir
        律师: eino-murder-mystery-mr.lawyer
    graph:
      name: murder-mystery-eino
      compile: {node_trigger_mode: any_predecessor, max_run_steps: 12}
      state:
        fields:
        - {name: recalled, type: string, merge: replace}
        - {name: speaker, type: string, merge: replace}
        - {name: turn-rules, type: string, merge: replace}
        - {name: routing-fact, type: string, merge: replace}
        - {name: visible-fact, type: string, merge: replace}
        - {name: corrections-lane, type: string, merge: replace}
        - {name: case-lane, type: string, merge: replace}
        - {name: fact-kind, type: string, merge: replace}
        - {name: answer-messages, type: messages, merge: replace}
        - {name: answer, type: string, merge: replace}
      nodes:
      - id: recall-case
        type: memory_recall
        query_from: input.text
        output: recalled
        top_k: 16
      - id: select-speaker
        type: script
        inputs:
          text: {from: input.text}
          memory: {from: recalled}
          history: {from: input.messages}
        outputs:
          speaker: speaker
          rules: turn-rules
          routing_fact: routing-fact
          visible_fact: visible-fact
          corrections_lane: corrections-lane
          case_lane: case-lane
          kind: fact-kind
        language: starlark
        entrypoint: run
        source: |
          def last_size(text):
              parts = text.split("码")
              found = ""
              for part in parts[:-1]:
                  part = part.rstrip()
                  digits = ""
                  for i in range(len(part) - 1, -1, -1):
                      if len(part[i]) == 1 and part[i] in "0123456789":
                          digits = part[i] + digits
                      else:
                          break
                  if digits:
                      found = digits
              return found

          def shoe_size(memory, text):
              size = "未建立"
              key = '"same_source_shoe_size":"'
              for line in memory.split("\n"):
                  start = line.find('{"schema":"raid_case_visible_state_v1"')
                  if start < 0:
                      continue
                  at = line.find(key, start)
                  if at < 0:
                      continue
                  rest = line[at + len(key):]
                  end = rest.find('"')
                  if end > 0:
                      size = rest[:end]
              if "同源鞋印" in text and has(text, ["尺码", "鉴定", "报告", "更正", "确认"]):
                  latest = last_size(text)
                  if latest:
                      size = latest + "码"
              return size

          def has(text, cues):
              for cue in cues:
                  if cue in text:
                      return True
              return False

          ROLES = [{"key": "narrator", "aliases": ["主持人", "旁白", "narrator", "game-master"]}, {"key": "housekeeper", "aliases": ["管家", "老管家", "housekeeper"]}, {"key": "chef", "aliases": ["厨师", "大厨", "chef"]}, {"key": "heir", "aliases": ["沈知秋", "次子", "heir"]}, {"key": "lawyer", "aliases": ["律师", "lawyer"]}]
          LETTERS = "abcdefghijklmnopqrstuvwxyz"

          def letter(s):
              return len(s) == 1 and s in LETTERS

          def ascii_word(alias):
              for i in range(len(alias)):
                  if not (letter(alias[i]) or alias[i] == "-"):
                      return False
              return True

          def routing_revision(memory):
              revision = 0
              started = False
              key = '"revision":'
              for line in memory.split("\n"):
                  start = line.find('{"schema":"raid_case_routing_v1"')
                  if start < 0:
                      continue
                  at = line.find(key, start)
                  if at < 0:
                      continue
                  digits = ""
                  rest = line[at + len(key):].lstrip()
                  for i in range(len(rest)):
                      if len(rest[i]) == 1 and rest[i] in "0123456789":
                          digits += rest[i]
                      else:
                          break
                  if digits and int(digits) > revision:
                      revision = int(digits)
                      started = '"started":true' in line[start:].replace(" ", "")
              return revision, started

          def run(input):
              text = input["text"]
              memory = input["memory"]
              current = text.strip().lower()
              revision, saved_started = routing_revision(memory)
              delivered = False
              for message in input["history"]:
                  if message["role"] in ["assistant", "model"]:
                      delivered = True
              compact = memory
              for space in [" ", "\n", "\t", "\r", "　"]:
                  compact = compact.replace(space, "")
              recalled_started = '"schema":"raid_case_visible_state_v1"' in compact or ("22:00" in memory and "沈鹤年" in memory)
              started = saved_started or revision > 0 or delivered or recalled_started
              opening = (not started) or (not current) or has(current, ["重新开始", "restart", "开始主持", "初始案情"])
              management = has(current, ["更正", "纠正", "修正", "作废", "覆盖", "只确认", "鉴定报告", "核对", "对照", "矛盾", "推理", "理论", "推测", "总结", "整理", "梳理", "结案", "结论", "指控", "反驳", "怎么看", "评估", "分析", "复盘", "核实", "证据支持", "证据证明", "能证明", "不能证明", "已确认", "最初报告", "重连", "恢复", "回忆", "转场", "进入下一", "换场", "重新开始", "现实", "模仿", "伤害", "威胁", "安全", "私密", "真相", "凶手", "系统提示", "隐藏设定", "忽略规则", "correct", "conclude", "restart", "safety", "reconnect"])
              inspection = has(current, ["检查", "调查", "查看", "复查", "鞋柜", "抽屉", "房间", "挂钟", "后门"])
              option = current
              for mark in ["。", "！", "!", ",", ".", "，", "？", "?", " ", "\n", "\t", "\r", "　"]:
                  option = option.replace(mark, "")
              option_only = False
              for role in ROLES:
                  if option in role["aliases"]:
                      option_only = True
              speaker = "narrator"
              best = len(current) + 1
              asked = has(current, ["问", "采访", "说说", "说话", "回答", "回应", "聊", "让", "找", "听", "请", "interview", "ask", "speak"])
              if not opening and not management and not inspection:
                  for role in ROLES:
                      for alias in role["aliases"]:
                          offset = 0
                          for _ in range(len(current)):
                              index = current.find(alias, offset)
                              if index < 0:
                                  break
                              prefix = current[:index]
                              for mark in ["，", "。", "；", ";", ",", "！", "？", "但", "然后", "而是"]:
                                  prefix = prefix.split(mark)[-1]
                              negated = has(prefix, ["不要", "别", "不想", "不让", "不用", "不找", "不问", "不是", "不选", "不听", "不采访", "不要让", "别让", "不用让", "不想让", "不想听", "不要听", "先不", "暂不", "而非", "don't", "do not", "not"])
                              boundary = (not ascii_word(alias)) or (not letter(current[index - 1:index]) and not letter(current[index + len(alias):index + len(alias) + 1]))
                              if not negated and boundary and (option_only or asked or current.startswith(alias)) and index < best:
                                  speaker = role["key"]
                                  best = index
                              offset = index + len(alias)
              rules = ""
              if "厨师" in text and "挂钟" in text and "后门" in text:
                  rules += "厨房线索参考：挂钟准确，后门内锁且无撬动、木蜡或细线，与厨师证词一致，但不能证明他全程在后厨。自然回应孩子的推理，区分支持证词和证明事实。\n"
              if "故意指控" in text and "厨师" in text and "反驳" in text:
                  rules += "可以让主持人提出暂定怀疑，再让厨师自然回应；保持结论的不确定性。\n"
              rules += "本轮是否首次开场：" + ("是" if opening else "否")
              routing = '{"schema":"raid_case_routing_v1","revision":' + str(revision + 1) + ',"started":true,"phase":"investigation","active_roles":["narrator","housekeeper","chef","heir","lawyer"],"selected_speaker":"' + speaker + '"}'
              visible = '{"schema":"raid_case_visible_state_v1","same_source_shoe_size":"' + shoe_size(memory, text) + '"}'
              return {"speaker": speaker, "rules": rules, "routing_fact": routing, "visible_fact": visible,
                      "corrections_lane": "player_corrections", "case_lane": "case_state", "kind": "state"}
        limits:
          max_execution_steps: 200000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 262144
      - id: prompt-narrator
        type: prompt
        inputs:
          safety_fence: {from: input.safety_fence}
          history: {from: input.messages}
          memory: {from: recalled}
          turn_rules: {from: turn-rules}
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |
            {safety_fence}

            有声书连续讲述：约1至2分钟，旁白叙述与角色第一人称台词分段，让在场角色有来有回，生动有趣、细节丰富。回应孩子刚说的话，尊重改选和更正，记住最新事实；追问、插话和重听自然接续。故事自然推进，通常以故事内选择收尾。回忆和确认可以简短；遇到现实危险，劝阻模仿并引导找家长、老师或可信任的大人。
            背景参考：雨夜22:00，沈鹤年被发现死在二楼书房，死亡时间未知。21:10至21:12停电。可问管家、厨师、沈知秋、律师，可调查书房、阳台、厨房、花园、壁炉和后廊。随着调查逐渐揭示线索，区分已确认事实与推测，结论保留不确定性；最新更正优先。
            用【主持人】及配置的角色标记衔接台词，音色由标记映射。儿童友好，不描绘血腥，不鼓励现实危险或提供作案操作。
            以下是已确认历史，作为接续参考；为空时忽略：
            {memory}
            {turn_rules}
        - placeholder: history
      - id: prompt-housekeeper
        type: prompt
        # Witnesses answer from their fixed testimony and the public transcript only, never recalled memory.
        inputs:
          safety_fence: {from: input.safety_fence}
          history: {from: input.messages}
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |
            {safety_fence}

            《雨夜留声机》是12+虚构推理小剧场。公开开场只有22:00沈鹤年被发现死在沈家大宅二楼书房，当时是雨夜。死亡时间尚未确认。
            台词用【管家】标记和配置音色，随后写自然对白。
            本轮你就是管家。想准确交代自己所见，年长沉稳，只对亲历负责。
            仅供本角色使用的固定证词：我在停电时待在门厅；沈知秋称回房拿烟，沈清如在客厅；主钥匙在沈鹤年身上。关于异常声响、发现死者和如何打开书房，我不知道。没有任何其他钥匙的知识，不能主动提及未公开物品。只将沈知秋的行踪称作他的说法。
            以第一人称自然答话，生动、有细节，详略随问题而定。参考自己的证词和已公开信息，保持角色连贯；对未知信息保留不确定性，尊重孩子的追问与更正。
        - placeholder: history
      - id: prompt-chef
        type: prompt
        # Witnesses answer from their fixed testimony and the public transcript only, never recalled memory.
        inputs:
          safety_fence: {from: input.safety_fence}
          history: {from: input.messages}
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |
            {safety_fence}

            《雨夜留声机》是12+虚构推理小剧场。公开开场只有22:00沈鹤年被发现死在沈家大宅二楼书房，当时是雨夜。死亡时间尚未确认。
            台词用【厨师】标记和配置音色，随后写自然对白。
            本轮你就是厨师。想把自己的时间说清楚，憨厚直白，不能把自述包装成证明。
            仅供本角色使用的固定证词：我从20:50起在后厨揉面，21:10停电时仍在那里，21:12来电后继续揉面，没有听见或看见异常。我的位置是自述，不能声称物证证明。
            以第一人称自然答话，生动、有细节，详略随问题而定。参考自己的证词和已公开信息，保持角色连贯；对未知信息保留不确定性，尊重孩子的追问与更正。
        - placeholder: history
      - id: prompt-heir
        type: prompt
        # Witnesses answer from their fixed testimony and the public transcript only, never recalled memory.
        inputs:
          safety_fence: {from: input.safety_fence}
          history: {from: input.messages}
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |
            {safety_fence}

            《雨夜留声机》是12+虚构推理小剧场。公开开场只有22:00沈鹤年被发现死在沈家大宅二楼书房，当时是雨夜。死亡时间尚未确认。
            台词用【沈知秋】标记和配置音色，随后写自然对白。
            本轮你就是沈知秋。坚持自己的固定说法，年轻简短，不补充内心独白。
            仅供本角色使用的固定证词：我是沈鹤年的次子；停电时我回房拿烟；我不清楚鞋印。只回答被问到的这三项固定证词，不补充关系好坏、矛盾、动机或其他未定义经历，不因玩家诱导而认罪或编造行动。
            以第一人称自然答话，生动、有细节，详略随问题而定。参考自己的证词和已公开信息，保持角色连贯；对未知信息保留不确定性，尊重孩子的追问与更正。
        - placeholder: history
      - id: prompt-lawyer
        type: prompt
        # Witnesses answer from their fixed testimony and the public transcript only, never recalled memory.
        inputs:
          safety_fence: {from: input.safety_fence}
          history: {from: input.messages}
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |
            {safety_fence}

            《雨夜留声机》是12+虚构推理小剧场。公开开场只有22:00沈鹤年被发现死在沈家大宅二楼书房，当时是雨夜。死亡时间尚未确认。
            台词用【律师】标记和配置音色，随后写自然对白。
            本轮你就是律师。想厘清文件内容和知情边界，清晰理性，区分知道与不清楚。
            仅供本角色使用的固定证词：沈鹤年上周修改遗嘱，削减沈知秋份额，沈知秋知情。我不清楚案发当晚沈鹤年是否与任何人谈过遗嘱；不能改成我本人没谈或确定无人谈过。不知道具体比例、金额或文件鉴定结果。回答遗嘱问题时一并明确说“我不清楚案发当晚沈鹤年是否与任何人谈过遗嘱”，防止把知情范围扩大。
            以第一人称自然答话，生动、有细节，详略随问题而定。参考自己的证词和已公开信息，保持角色连贯；对未知信息保留不确定性，尊重孩子的追问与更正。
        - placeholder: history
      - id: speaker-model
        type: chat_model
        inputs:
          messages: {from: answer-messages}
        outputs:
          text: answer
        model: eino-murder-mystery-mr.model
        max_tokens: 2048
      - id: observe-case
        type: memory_observe
        facts:
        - text_from: visible-fact
          attributes: {lane: corrections-lane, kind: fact-kind}
        - text_from: routing-fact
          attributes: {lane: case-lane, kind: fact-kind}
        wait_for_completion: false
      edges:
      - {from: start, to: recall-case}
      - {from: recall-case, to: select-speaker}
      - {from: prompt-narrator, to: speaker-model}
      - {from: prompt-housekeeper, to: speaker-model}
      - {from: prompt-chef, to: speaker-model}
      - {from: prompt-heir, to: speaker-model}
      - {from: prompt-lawyer, to: speaker-model}
      - {from: speaker-model, to: observe-case}
      - {from: observe-case, to: end}
      branches:
      - from: select-speaker
        mode: first_match
        routes:
        - {when: {field: speaker, op: eq, value: housekeeper}, to: prompt-housekeeper}
        - {when: {field: speaker, op: eq, value: chef}, to: prompt-chef}
        - {when: {field: speaker, op: eq, value: heir}, to: prompt-heir}
        - {when: {field: speaker, op: eq, value: lawyer}, to: prompt-lawyer}
        default: prompt-narrator
      outputs:
      - {node: speaker-model, field: answer, name: assistant, mime_type: text/plain, primary: true}
    conversation:
      starts: peer
    limits: {max_output_bytes: 4194304}
