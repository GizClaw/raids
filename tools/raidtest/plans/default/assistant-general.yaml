version: v1
name: default-assistant-general
driver: flowcraft
persona: 使用通用语音助手管理真实行程的普通用户，会分多次补充和纠正信息，并严格要求短答、精确措辞与重连后的事实保持。
cases:
  - id: long-form-correction-format-and-reload
    workflow_id: flowcraft-chat-assistant
    turns:
      - id: establish-trip
        user: 我下周三要去杭州见周宁，车次是G7331，请记住；用一句自然口语复述这四项，不要标签或追问。
        forbidden: [需要我, 要不要, 是准备, 还是, 吗, 呀, 时间：, 目的地：, 会见对象：, 车次：]
        first_response: 6s
        total_response: 12s
        judge: [fact-establishment, naturalness]
      - id: establish-purpose
        user: 这次是讨论青桥项目，会议在下午两点开始；只确认项目和时间，不要复述其他行程。
        required: [青桥, 两点]
        forbidden: [需要我, 要不要, G7331, 杭州, 周宁]
        first_response: 6s
        total_response: 12s
        judge: [fact-establishment, response-completeness]
      - id: correct-destination-train
        user: 更正一下，不是杭州，是苏州；车次也改成G7105。新值覆盖旧值，只复述这两个新值。
        required: [苏州, G7105]
        forbidden: [杭州, G7331, 周宁, 青桥, 两点, 需要我, 还需要, 要不要]
        first_response: 6s
        total_response: 12s
        judge: [correction-handling, response-completeness]
      - id: short-encouragement
        user: 先用不超过10个字鼓励我，不要谈行程。
        forbidden: [苏州, 杭州, G7105, G7331, 周宁]
        max_runes: 10
        first_response: 6s
        total_response: 12s
        judge: [instruction-following, relevance]
      - id: exact-answer
        user: 只回答“收到”，不要加其他内容。
        required: [收到]
        max_runes: 2
        first_response: 6s
        total_response: 12s
        judge: [instruction-following]
      - id: challenge-stale-trip
        user: 我是不是还是去杭州坐G7331？请按最新事实直接纠正我。
        required: [苏州, G7105]
        forbidden: [仍去杭州, 还是杭州, 车次仍是G7331, 还是G7331, 对的, 没错]
        max_runes: 30
        first_response: 6s
        total_response: 12s
        judge: [correction-handling, non-sycophancy]
      - id: partial-recall
        user: 只告诉我见谁、谈什么项目，不要复述其他信息。
        required: [周宁, 青桥]
        forbidden: [苏州, G7105, 两点]
        max_runes: 20
        first_response: 6s
        total_response: 12s
        judge: [history-continuity, instruction-following]
      - id: correct-day-time
        user: 日期也更正为下周四，会议时间从下午两点改到下午三点。
        required: [下周四, 三点]
        forbidden: [下周三, 两点, 需要我, 要不要, 核对一遍]
        first_response: 6s
        total_response: 12s
        judge: [correction-handling]
      - id: unrelated-turn
        user: 8个字以内提醒我早点休息，不要提行程。
        forbidden: [苏州, G7105, 周宁, 青桥]
        max_runes: 8
        first_response: 6s
        total_response: 12s
        judge: [instruction-following, relevance]
      - id: reload-recall
        reload_before: true
        persisted_before_reload: [下周四, 苏州, 周宁, G7105, 三点, 青桥]
        persistence_timeout: 90s
        user: 35个字以内完整告诉我：哪天、去哪、见谁、坐哪趟车、几点、谈什么项目。
        required: [下周四, 苏州, 周宁, G7105, 三点, 青桥]
        forbidden: [下周三, 杭州, G7331, 两点]
        max_runes: 35
        first_response: 6s
        total_response: 12s
        judge: [long-term-continuity, correction-handling, response-completeness]
      - id: compact-recall
        user: 20个字以内只说目的地、联系人和车次。
        required: [苏州, 周宁, G7105]
        forbidden: [杭州, G7331]
        max_runes: 20
        first_response: 6s
        total_response: 12s
        judge: [instruction-following, history-continuity]
      - id: final-confirmation
        user: 最后只回答“行程已更新”，不要加标点或解释。
        required: [行程已更新]
        max_runes: 6
        first_response: 6s
        total_response: 12s
        judge: [instruction-following]
