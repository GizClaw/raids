---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-journey-guide
spec:
  driver: flowcraft
  memory: story-teller
  flowcraft:
    graph:
      name: journey-story
      entry: recall_story
      edges:
        - {from: recall_story, to: prepare_story}
        - {from: prepare_story, to: draft_story}
        - {from: draft_story, to: bound_story}
        - {from: bound_story, to: answer}
        - {from: answer, to: commit_progress}
        - {from: commit_progress, to: observe_story}
        - {from: observe_story, to: __end__}
      nodes:
        - id: recall_story
          type: memory_recall
          config:
            query: {text_from: input}
            output: story_memory
            render: {header: 'Established story continuity:', item_prefix: '- ', max_items: 12}
            top_k: 12
        - id: prepare_story
          type: script
          config:
            source: |
              const memory = String(board.getVar("story_memory") || "");
              const state = board.getVar("journey_progress") || {chapter: 1, last_action: "故事开始"};
              const rules = [
                "你是西游记互动故事的中文讲述者。用户可以自由决定行动，你要承接当前行动推进一个小情节。",
                "只输出一句自然口语，不输出标题、列表、标签、内部字段、英文、分析或舞台说明。",
                "每次回复最多40个Unicode字符；优先保留用户要求的姓名、物品、地点和本轮结果，不用无关修饰填满字数。",
                "用户最新明确更正覆盖旧事实，之后不得把旧值当成当前事实。",
                "重载后以已建立故事事实继续，不重开故事，不重复已经完成的情节。",
                "Graph状态是进度权威：当前第" + Number(state.chapter || 1) + "回，上轮行动是“" + String(state.last_action || "故事开始") + "”。不得让召回文本把进度倒退。"
              ];
              if (memory) rules.push("已建立的故事事实：\n" + memory);
              board.setVar("story_system_prompt", rules.join("\n"));
        - id: draft_story
          type: llm
          publish: false
          config:
            max_tokens: 96
            model: flowcraft-journey-guide.model
            output_key: tmp_story_answer
            system_prompt: "${board.story_system_prompt}"
            track_steps: true
        - id: commit_progress
          type: script
          config:
            source: |
              const prior = board.getVar("journey_progress") || {chapter: 1};
              const next = {
                chapter: Math.min(999, Math.max(1, Number(prior.chapter || 1)) + 1),
                last_action: String(board.getVar("input") || "").slice(0, 120)
              };
              board.setVar("journey_progress", next);
        - id: bound_story
          type: script
          config:
            source: |
              const raw = String(board.getVar("tmp_story_answer") || "").trim();
              board.setVar("bounded_story_answer", Array.from(raw).slice(0, 40).join(""));
        - id: answer
          type: script
          publish: true
          config:
            source: |
              const answer = String(board.getVar("bounded_story_answer") || "");
              board.setVar("answer", answer);
              host.emit("token", {content: answer});
        - id: observe_story
          type: memory_observe
          config:
            observations:
              - {turns_from: conversation}
            wait_for_completion: true
    max_iterations: 9
    conversation:
      starts: peer
    voice_adapter:
      asr_model: asr
      default_voice: flowcraft-journey-guide.narrator
      node_voices:
        answer: flowcraft-journey-guide.narrator
