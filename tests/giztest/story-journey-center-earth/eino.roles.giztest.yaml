  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: hans_chapter_setup_1
  client: hans
  timeout: 2m
  peer_stream:
    mode: text
    input: 请从第一章开始《地心游记》。
    idle_timeout: 90s
    require_text: true
