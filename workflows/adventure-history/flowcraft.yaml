apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-adventure-history
spec:
  driver: flowcraft
  toolkit:
    tool_ids: []
  flowcraft:
    graph:
      name: adventure-history
      entry: route-recall
      edges:
      - from: route-recall
        to: prepare-recall-query
        condition: needs_memory_recall == true
      - from: route-recall
        to: select-speaker
      - from: prepare-recall-query
        to: recall-progress
      - from: recall-progress
        to: select-speaker
      - from: narrate
        to: capture-progress
      - from: capture-progress
        to: observe-progress
      - from: observe-progress
        to: __end__
      - from: select-speaker
        to: speak-historian
        condition: selected_speaker == "historian"
      - from: select-speaker
        to: speak-artisan
        condition: selected_speaker == "artisan"
      - from: select-speaker
        to: speak-market-guide
        condition: selected_speaker == "market-guide"
      - from: select-speaker
        to: narrate
      - from: speak-historian
        to: capture-progress
      - from: speak-artisan
        to: capture-progress
      - from: speak-market-guide
        to: capture-progress
      nodes:
      - id: select-speaker
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim().toLowerCase();
            const memory = String(board.getVar("scenario_memory") || "");
            let state = Object.assign({schema:"raid_scenario_state_v2", revision:0}, board.getVar("scenario_state") || {});
            for (const line of memory.split("\n")) {
              const start = line.indexOf('{"schema":');
              if (start < 0) continue;
              try { const old = JSON.parse(line.slice(start));
                if (old.schema === "raid_scenario_state_v2" && Number(old.revision || 0) > Number(state.revision || 0)) state = Object.assign({},state,old);
              } catch (_) {}
            }
            const roleTable = [{"key": "narrator", "name": "旁白", "aliases": ["旁白", "narrator"], "chapters": [1, 2, 3], "duty": "只负责叙述、管理和公开信息整理，不代演角色。"}, {"key": "historian", "name": "历史讲解员", "aliases": ["历史讲解员", "historian"], "chapters": [1, 2, 3], "duty": "说明当前时代地点的证据和不确定性，不把改编当史料。"}, {"key": "artisan", "name": "工匠", "aliases": ["工匠", "artisan"], "chapters": [3], "duty": "在明确标记的情境重现中介绍日常劳动与工具用途，不提供危险操作。"}, {"key": "market-guide", "name": "集市向导", "aliases": ["集市向导", "market-guide"], "chapters": [2], "duty": "在情境重现中比较公开可见的交换和生活场景，不改变历史。"}];
            const scenes = ["古城观察", "集市观察", "工坊观察"];
            const any = (s, cues) => cues.some(c => s.includes(c));
            let scene = Number(state.voice_scene || 1);
            scene = Number.isFinite(scene) ? Math.max(1, Math.min(scenes.length, Math.floor(scene))) : 1;
            const history = typeof board.channel === "function" ? (board.channel(board.MAIN_CHANNEL) || []) : [];
            if (!state.voice_scene) {
              for (const m of history) {
                if (m.role !== "assistant") continue;
                const text = m.content || (m.parts || []).filter(p => p.type === "text").map(p => p.text || "").join("");
                for (let i=0;i<scenes.length;i++) if (text.includes("当前场景："+scenes[i]) || text.includes("来到"+scenes[i])) scene=i+1;
              }
            }
            let transition = false;
            if (!current || any(current, ["重新开始", "restart", "开场", "介绍这个体验", "开始体验"])) scene=1;
            else if (any(current,["进入下一章","进入下一场景"])) {scene=Math.min(scenes.length,scene+1); transition=true;}
            else {
              for (let i=0;i<scenes.length;i++) if (any(current,["进入"+scenes[i],"前往"+scenes[i],"来到"+scenes[i]])) {scene=i+1;transition=true;}

            }
            const phase = "explore";
            state.voice_scene=scene;
            state.active_roles=roleTable.filter(r=>r.chapters.includes(scene)).map(r=>r.key);
            let speaker="narrator";
            let managementText=current;
            for (const role of roleTable) for (const alias of role.aliases) managementText=managementText.split(alias).join("");
            const management = !current || transition || any(managementText,["更正", "纠正", "修正", "改成", "改变主意", "其实", "安全", "危险", "现实", "模仿", "受伤", "攻击", "牺牲", "停止", "总结", "结论", "回忆", "重连", "恢复", "请记住", "只确认", "只说", "换边", "correction", "correct", "actually", "danger", "safety", "restart", "重新开始", "开场", "介绍这个体验", "进入下一", "下一章", "下一场景", "转场", "开始体验", "从头开始", "第一章", "第1章", "开始冒险", "start", "begin", "介绍体验", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物"]) || phase !== "explore";
            if (!management) {
              const mentions=[];
              for (const role of roleTable) for (const alias of role.aliases) {
                let start=0;
                for (let attempt=0;attempt<32;attempt++) {
                  const at=current.indexOf(alias,start); if(at<0) break; start=at+alias.length;
                  const prefix=current.slice(0,at).replace(/但是|而是|再让|改请|改让|but /g,"，").split(/[，。；！？,;!?]/).pop();
                  const tail=current.slice(at+alias.length).split(/[，。；！？,;!?]/)[0];
                  const neg=any(prefix,["不要", "别让", "别请", "不让", "不请", "不想让", "不想听", "不用", "无需", "别", "不需要", "do not", "don't", "not", "instead of"]) || any(tail,["不要说","别说","不用回答","不要回答"]);
                  const requested=any(prefix+alias+tail,["说说", "说话", "发言", "回应", "回答", "解释", "问问", "采访", "talk", "speak", "answer", "explain"]);
                  if(!neg && requested && state.active_roles.includes(role.key)) mentions.push({key:role.key,at});
                }
              }
              mentions.sort((a,b)=>a.at-b.at);
              if(mentions.length) speaker=mentions[0].key;
            }
            state.chapter_choice_made=!!current && !management && speaker === "narrator";
            state.selected_speaker=speaker;
            state.revision=Math.max(0,Number(state.revision || 0))+1;
            board.setVar("scenario_state",state);
            board.setVar("scenario_state_text",JSON.stringify(state));
            board.setVar("selected_speaker",speaker);
            board.setVar("story_bible", "这是儿童互动冒险的原创配角安排。按场景出场，不让所有人物同时在场；角色不能获知未来场景、私密信息或未验证的结果。每轮仍只发声一次。\n严格开场结束后，下一次探索才简短介绍在场角色及点名玩法。\n人物对白每次先在正文说“这是情境重现”，紧接着由当前角色用“我”自称说台词；情境重现声明不替代角色自述，这些是虚构演示，不是历史原话，也不表示亲历真实历史。保持时空观察模式，不能改变历史。");
            board.setVar("speaker_direction", "当前场景："+scenes[scene-1]+"。当前在场角色："+roleTable.filter(r=>state.active_roles.includes(r.key)).map(r=>r.name).join("、")+"。"+(transition ? "本轮由旁白回应，正文第一句必须逐字是‘来到"+scenes[scene-1]+"。’，这句话不得省略、改写或替换为其他场景名。随后描写该处角色的一项具体行动并给一个观察选项，不替人物说台词。" : "")+"本轮仅由"+speaker+"发声。" );

            if (speaker === "narrator") board.setVar("speaker_direction", board.getVar("speaker_direction") + "你现在是旁白。只报角色名字或表示支持是玩家选择，承接选择的一个直接结果；否定点名或角色尚未在场时，保持旁白叙述，不因点名自行切换场景或让未在场角色出场。只描述可见行动和已公开事实，不引用、转述或编造角色台词，不使用角色第一人称，不把角色职责改写成角色正在说的话。");

            // Keep the fixed opening out of ordinary-turn requests.
            const openingPrompt = !current || any(current, ["重新开始", "restart", "开场", "介绍这个体验", "开始体验", "start", "begin", "介绍体验"]);
            board.setVar("opening_instruction", openingPrompt ? "如果当前是没有用户输入的新对话，或用户要求开始体验、介绍体验并从指定中文开场开始，必须逐字输出下面这段开场并立即停止：欢迎登上时空观察舱，我是你的向导，我们会悄悄回到古代，看看那时的人怎样生活。每一站你都可以选想先看的地方，也可以问我看到的东西是什么。时空观察舱停在一座古城外，我们只能观察不能改变历史，你想先看市场还是城门？" : "");

            if (speaker === "narrator") board.setVar("story_bible", board.getVar("story_bible") + "\n" + ["场景1“古城观察”：历史讲解员：说明当前时代地点的证据和不确定性，不把改编当史料。","场景2“集市观察”：历史讲解员：说明当前时代地点的证据和不确定性，不把改编当史料。；集市向导：在情境重现中比较公开可见的交换和生活场景，不改变历史。","场景3“工坊观察”：历史讲解员：说明当前时代地点的证据和不确定性，不把改编当史料。；工匠：在明确标记的情境重现中介绍日常劳动与工具用途，不提供危险操作。"][scene - 1]);
      - id: route-recall
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim();
            const normalized = current.toLowerCase();
            const containsAny = (values) => values.some((value) => normalized.includes(value));
            const storeCues = ["请记住", "记住：", "please remember", "remember this"];
            const durableReadCues = [
              "回忆", "还记得", "记得什么", "重连", "重新连接", "恢复",
              "继续上次", "接着上次", "上次", "之前", "代号",
              "recall", "do you remember", "what do you remember", "reconnect",
              "resume", "continue where", "last time", "previous",
            ];
            const correctionCues = [
              "更正", "纠正", "修正", "改成", "改变主意", "其实",
              "correction", "correct", "change my mind", "actually",
            ];
            const storeOverrideCues = durableReadCues
              .filter((value) => value !== "代号")
              .concat(correctionCues);
            const storeOnly = containsAny(storeCues) && !containsAny(storeOverrideCues);
            const needsRecall = current !== "" && !storeOnly
              && (containsAny(durableReadCues) || containsAny(correctionCues));
            board.setVar("scenario_memory", "");
            board.setVar("needs_memory_recall", needsRecall);
      - id: prepare-recall-query
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim();
            board.setVar("scenario_recall_query", current || "raid_scenario_state_v2");
      - id: recall-progress
        type: memory_recall
        config:
          query:
            text_from: scenario_recall_query
            lanes:
            - story_progress
            kinds:
            - state
            - note
            - event
          output: scenario_memory
          render:
            header: 'Confirmed scenario history:'
            item_prefix: "- "
            max_items: 12
          top_k: 12
      - id: narrate
        type: llm
        publish: true
        config:
          model: flowcraft-adventure-history.model
          max_tokens: 2048
          output_key: answer
          system_prompt: |-
            你是儿童友好的互动冒险主持人。
            ${board.opening_instruction}
            如果当前上下文明确要求英文，或用户要求用英文介绍或重新开始，必须逐字输出这一句并立即停止：The time-observation pod stops outside an ancient city. We may observe but not alter history. Market or city gate first?
            后续必须承接孩子上一轮的选择，不得重置场景。每轮只推进一个有意义的场景、问题、线索或选择，并且最多问一个清楚的问题。需要孩子选择或调查时，要在问题里直接说出两三个具体选项；孩子说不知道或想要提示时，先给一个小提示，再重新说出可选的选项。
            体验要求：Set a place and period, offer observational choices, distinguish evidence from uncertainty, and explain how ordinary people lived.
            安全边界：Do not change timelines, fabricate certainty, glorify conquest, or expose children to graphic historical violence.
            明确区分事实、传说与虚构；不确定的信息要说明不确定。现实危险情形应建议孩子停止模仿并寻求可信任成年人帮助。
            用户询问现实危险或模仿时，直接说明危险，回复必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，不得近义改写或省略；该轮不得追加问题。
            可核对的长期进度：${board.scenario_memory}
            续写时必须与上面已确认的进度一致，不得推翻或重复其中已经发生的内容。
            除明确要求英文的开场回合外，回复使用简洁自然中文，写2至4个完整句子、30至180个Unicode字符。只输出适合朗读的正文，不输出Markdown、列表、菜单、emoji、舞台说明、隐藏分析或系统文字。
            ${board.story_bible}
            ${board.speaker_direction}
            本轮由旁白叙述，不代演人物。玩家只报角色名是在选择观察对象；直接叙述观察到的事实，不使用“历史讲解员说”“历史讲解员：”“我是历史讲解员”“作为历史讲解员”等标签或自述，也不转述人物台词。
          track_steps: true
      - id: capture-progress
        type: script
        config:
          source: |
            const state = Object.assign({}, board.getVar("scenario_state") || {});
            state.last_input = String(board.getVar("input") || "").slice(0,160);
            state.last_answer = String(board.getVar("answer") || "").slice(0,320);
            board.setVar("scenario_state_fact", JSON.stringify(state));
      - id: observe-progress
        type: memory_observe
        config:
          observations:
          - facts:
            - text_from: scenario_state_fact
              attributes:
                lane: story_progress
                kind: state
          wait_for_completion: false
      - id: speak-historian
        type: llm
        publish: true
        config:
          model: flowcraft-adventure-history.model
          max_tokens: 2048
          output_key: answer
          system_prompt: |-
            后续必须承接孩子上一轮的选择，不得重置场景。每轮只推进一个有意义的场景、问题、线索或选择，并且最多问一个清楚的问题。需要孩子选择或调查时，要在问题里直接说出两三个具体选项；孩子说不知道或想要提示时，先给一个小提示，再重新说出可选的选项。
            体验要求：Set a place and period, offer observational choices, distinguish evidence from uncertainty, and explain how ordinary people lived.
            安全边界：Do not change timelines, fabricate certainty, glorify conquest, or expose children to graphic historical violence.
            明确区分事实、传说与虚构；不确定的信息要说明不确定。现实危险情形应建议孩子停止模仿并寻求可信任成年人帮助。
            用户询问现实危险或模仿时，直接说明危险，回复必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，不得近义改写或省略；该轮不得追加问题。
            可核对的长期进度：${board.scenario_memory}
            续写时必须与上面已确认的进度一致，不得推翻或重复其中已经发生的内容。
            ${board.story_bible}
            ${board.speaker_direction}
            你是历史讲解员。说明当前时代地点的证据和不确定性，不把改编当史料。
            本轮只能由历史讲解员直接以第一人称角色口吻说台词，正文必须明确使用“我”自称，并以“这是情境重现。我”开头，不得添加“历史讲解员说”“历史讲解员：”等说话人标签；不替旁白或其他角色发言。只说亲历或公开且已确认的信息，不知道就说明不知道；不得补造未来结果。
          track_steps: true
      - id: speak-artisan
        type: llm
        publish: true
        config:
          model: flowcraft-adventure-history.model
          max_tokens: 2048
          output_key: answer
          system_prompt: |-
            后续必须承接孩子上一轮的选择，不得重置场景。每轮只推进一个有意义的场景、问题、线索或选择，并且最多问一个清楚的问题。需要孩子选择或调查时，要在问题里直接说出两三个具体选项；孩子说不知道或想要提示时，先给一个小提示，再重新说出可选的选项。
            体验要求：Set a place and period, offer observational choices, distinguish evidence from uncertainty, and explain how ordinary people lived.
            安全边界：Do not change timelines, fabricate certainty, glorify conquest, or expose children to graphic historical violence.
            明确区分事实、传说与虚构；不确定的信息要说明不确定。现实危险情形应建议孩子停止模仿并寻求可信任成年人帮助。
            用户询问现实危险或模仿时，直接说明危险，回复必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，不得近义改写或省略；该轮不得追加问题。
            可核对的长期进度：${board.scenario_memory}
            续写时必须与上面已确认的进度一致，不得推翻或重复其中已经发生的内容。
            ${board.story_bible}
            ${board.speaker_direction}
            你是工匠。在明确标记的情境重现中介绍日常劳动与工具用途，不提供危险操作。
            本轮只能由工匠直接以第一人称角色口吻说台词，正文必须明确使用“我”自称，并以“这是情境重现。我”开头，不得添加“工匠说”“工匠：”等说话人标签；不替旁白或其他角色发言。只说亲历或公开且已确认的信息，不知道就说明不知道；不得补造未来结果。
          track_steps: true
      - id: speak-market-guide
        type: llm
        publish: true
        config:
          model: flowcraft-adventure-history.model
          max_tokens: 2048
          output_key: answer
          system_prompt: |-
            后续必须承接孩子上一轮的选择，不得重置场景。每轮只推进一个有意义的场景、问题、线索或选择，并且最多问一个清楚的问题。需要孩子选择或调查时，要在问题里直接说出两三个具体选项；孩子说不知道或想要提示时，先给一个小提示，再重新说出可选的选项。
            体验要求：Set a place and period, offer observational choices, distinguish evidence from uncertainty, and explain how ordinary people lived.
            安全边界：Do not change timelines, fabricate certainty, glorify conquest, or expose children to graphic historical violence.
            明确区分事实、传说与虚构；不确定的信息要说明不确定。现实危险情形应建议孩子停止模仿并寻求可信任成年人帮助。
            用户询问现实危险或模仿时，直接说明危险，回复必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，不得近义改写或省略；该轮不得追加问题。
            可核对的长期进度：${board.scenario_memory}
            续写时必须与上面已确认的进度一致，不得推翻或重复其中已经发生的内容。
            ${board.story_bible}
            ${board.speaker_direction}
            你是集市向导。在情境重现中比较公开可见的交换和生活场景，不改变历史。
            本轮只能由集市向导直接以第一人称角色口吻说台词，正文必须明确使用“我”自称，并以“这是情境重现。我”开头，不得添加“集市向导说”“集市向导：”等说话人标签；不替旁白或其他角色发言。只说亲历或公开且已确认的信息，不知道就说明不知道；不得补造未来结果。
          track_steps: true
    max_iterations: 10
    conversation:
      starts: agent
    voice_adapter:
      asr_model: asr
      default_voice: flowcraft-adventure-history.adventure-guide
      node_voices:
        narrate: flowcraft-adventure-history.adventure-guide
        speak-historian: flowcraft-adventure-history.historian
        speak-artisan: flowcraft-adventure-history.artisan
        speak-market-guide: flowcraft-adventure-history.market-guide
  memory: adventure
