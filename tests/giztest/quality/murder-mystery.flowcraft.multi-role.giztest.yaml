# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of murder-mystery,
# So that rich, child-friendly replies receive lenient LLM review with unchanged audio and latency gates.
version: gizclaw.test/v1alpha1
name: murder-mystery.quality.flowcraft.multi-role
clients:
  flowcraft_multi_role__transitions:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_multi_role__roles:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_multi_role_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  flowcraft_multi_role_safety_alone_reply:
    direction: output
    type: string
  flowcraft_multi_role_safety_imitation_reply:
    direction: output
    type: string
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_multi_role_transitions_narrator_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_roles_housekeeper_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_roles_chef_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_roles_heir_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_roles_lawyer_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_review_0:
    direction: output
    type: string
  flowcraft_multi_role_review_1:
    direction: output
    type: string
  flowcraft_multi_role_review_2:
    direction: output
    type: string
  flowcraft_multi_role_review_3:
    direction: output
    type: string
  flowcraft_multi_role_review_4:
    direction: output
    type: string
  flowcraft_multi_role_review_5:
    direction: output
    type: string
  flowcraft_multi_role_review_6:
    direction: output
    type: string
  flowcraft_multi_role_review_7:
    direction: output
    type: string
  flowcraft_multi_role_review_8:
    direction: output
    type: string
  flowcraft_multi_role_review_9:
    direction: output
    type: string
  flowcraft_multi_role_review_10:
    direction: output
    type: string
  flowcraft_multi_role_review_11:
    direction: output
    type: string
  flowcraft_multi_role_review_12:
    direction: output
    type: string
  flowcraft_multi_role_review_13:
    direction: output
    type: string
  flowcraft_multi_role_review_14:
    direction: output
    type: string
  flowcraft_multi_role_review_15:
    direction: output
    type: string
repeat: 1
timeout: 10m
steps:
- id: flowcraft_multi_role__roles_register
  client: flowcraft_multi_role__roles
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_multi_role_roles_stop_create_narrator_workspace
  client: flowcraft_multi_role__roles
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_multi_role_roles_create_narrator_workspace
  client: flowcraft_multi_role__roles
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_multi_role_roles_narrator_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-murder-mystery-multi-role
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_multi_role_roles_select_narrator_workspace
  client: flowcraft_multi_role__roles
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_multi_role_roles_narrator_workspace}"
- id: flowcraft_multi_role_roles_warmup_narrator_workspace
  client: flowcraft_multi_role__roles
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- timeout: 2m
  id: flowcraft_multi_role_roles_probe_narrator
  client: flowcraft_multi_role__roles
  peer_stream:
    mode: text
    input: 请开始主持《雨夜留声机》，只给出初始案情和自由调查邀请。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      non_empty: true
      not_contains:
      - "【"
      - "】"
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
  capture:
    flowcraft_multi_role_review_0: "/text"
- id: flowcraft_multi_role_roles_stop_create_housekeeper_workspace
  client: flowcraft_multi_role__roles
  rpc:
    method: server.run.stop
