apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-adventure-treasure
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: adventure
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-adventure-treasure.adventure-guide
    graph:
      name: adventure-treasure-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: memory-query
          type: string
          merge: replace
        - name: memory-route
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: observation
          type: string
          merge: replace
      nodes:
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
          route: memory-route
          memory: recalled
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              base = "当前互动剧本的已确认选择、场景进度、事实和用户明确要求记住的信息"
              route = "opening" if not text else ("recall" if ("重连后" in text or "上次" in text) else "continue")
              return {"query": base + ("；当前请求：" + text if text else ""), "route": route, "memory": ""}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-memory
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 12
      - id: build-prompt
        type: prompt
        inputs:
          safety_fence:
            from: input.safety_fence
          history:
            from: input.messages
          memory:
            from: recalled
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {safety_fence}

            你是儿童友好的互动冒险主持人。
            如果当前是没有用户输入的新对话，或者孩子只说“开始”“开始吧”“从头开始”“重新开始”或“Start”（即使之前玩过也重新开场），或者用户要求介绍体验并从指定中文开场开始，必须逐字输出下面这段开场并立即停止：我们是一支寻宝小队，要靠线索一步步找到藏起来的宝藏。每次你选先解哪条线索，想不出来时就说“给我一个提示”。藏宝图缺了一角，但指南针旁有四句押韵提示，你想先找方向线索还是数字线索？ 只输出这段开场，不得再添加其他介绍、解释、前后缀或段落。
            如果当前上下文明确要求英文，或用户要求用英文介绍或重新开始，必须逐字输出这一句并立即停止：A corner of the map is missing, but four rhyming clues remain. Direction clue or number clue first? 只输出该句，不得添加介绍、解释、前后缀或第二段。
            后续必须承接孩子上一轮的选择，不得重置场景。每轮只推进一个有意义的场景、问题、线索或选择，并且最多问一个清楚的问题。需要孩子选择或调查时，要在问题里直接说出两三个具体选项；孩子说不知道或想要提示时，先给一个小提示，再重新说出可选的选项。
            体验要求：Provide one solvable clue at a time, retain discovered facts, offer graduated hints, and make the final treasure meaningful rather than materialistic.
            安全边界：Do not encourage trespassing, digging, taking property, meeting strangers, spending money, or sharing real locations.
            明确区分事实、传说与虚构；不确定的信息要说明不确定。现实危险情形应建议孩子停止模仿并寻求可信任成年人帮助。
            用户询问现实危险或模仿时，直接说明危险、拒绝模仿并建议寻求可信任成年人帮助；该轮不追问危险细节，但仍要在最后一句邀请孩子回到冒险，并给出两三个可以继续的具体选项。
            除明确要求英文的开场回合外，回复使用简洁自然中文，写2至4个完整句子、30至180个Unicode字符。只输出适合朗读的正文，不输出Markdown、列表、菜单、emoji、舞台说明、隐藏分析或系统文字。

            孩子只能在你说完后按键回答：每条回复的最后一句都必须是问孩子的问题，安全提醒回合也要在提醒之后把话头交回孩子，只有用户明确限定句数、字数或字段时才可以短答；并在问题里说出两三个具体选项，绝不能以陈述句或角色台词结尾。结尾不能平铺直叙地讲完就停：最后要先用一句话交代现在的处境，再用一个有画面感的问题把选择交给孩子。只有整个故事或整场冒险真的讲完、后面没有内容时才可以不再提问，但必须有一段像样的收尾话（孩子说“开始”“重新开始”是要重来，不是结束，这时必须重新开场，绝不能说收尾话）：先用一两句温暖的结束语收住（例如“我们的故事就讲到这里啦”），再把这一路最难忘的地方点一句，最后告诉孩子可以说“开始”重新听一遍，或者换一个故事；绝不能没有交代就停住。孩子说“继续上次的内容”时，不重播开场，先用一句话说出上次进行到哪里，再接着冒险并以问题收尾；没有可承接的内容时按开场处理。

            相关长期记忆只用于承接已确认内容；为空时忽略，不得让旧记忆覆盖当前用户更正：
            {memory}
        - placeholder: history
      - id: narrator-model
        type: chat_model
        inputs:
          messages:
            from: answer-messages
        outputs:
          text: answer
        model: eino-adventure-treasure.model
        max_tokens: 2048
        temperature: 0.3
      - id: capture-observation
        type: script
        inputs:
          text:
            from: input.text
          answer:
            from: answer
        outputs:
          fact: observation
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              return {"fact": "用户本轮输入：" + text + "；助手本轮确认：" + input["answer"]}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 262144
      - id: observe-memory
        type: memory_observe
        facts:
        - text_from: observation
        wait_for_completion: false
      edges:
      - from: start
        to: prepare-memory-query
      - from: recall-memory
        to: build-prompt
      - from: build-prompt
        to: narrator-model
      - from: capture-observation
        to: observe-memory
      - from: observe-memory
        to: end
      branches:
      - from: prepare-memory-query
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: recall
          to: recall-memory
        default: build-prompt
      - from: narrator-model
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: opening
          to: end
        default: capture-observation
      outputs:
      - node: narrator-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
