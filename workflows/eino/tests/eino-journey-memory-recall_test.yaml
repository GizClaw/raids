apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-journey-memory-recall-test
spec:
  driver: eino
  toolkit:
    tool_ids: [raidtest-acceptance-report]
  eino:
    graph:
      name: eino-journey-memory-recall-acceptance-tester
      compile: {node_trigger_mode: any_predecessor, max_run_steps: 8}
      state:
        fields:
          - {name: judge-messages, type: messages, merge: replace}
          - {name: answer, type: string, merge: replace}
      nodes:
        - id: prepare-judge
          type: prompt
          inputs: {payload: {from: input.text}}
          outputs: {messages: judge-messages}
          format: f_string
          messages:
            - role: system
              template: |
                你是“西游记 Eino Recall”专属验收机器人，不是目标剧本中的角色。你通过对话驱动目标 Workflow，并用工具提交每轮判定。
                你验收同步召回版西游互动故事。10轮目标依次覆盖：建立地点、建立人物关系、推进动作、记住暗号、纯回忆暗号、纠正暗号、隔轮召回新暗号、明确禁止旧暗号、按新暗号推进、总结已确认事实。
                你必须检查召回事实完整、最新纠正覆盖旧值、回忆轮不推进剧情、回答不把检索文本或内部状态泄露给玩家。
                固定检查点路线（不得换题、跳轮或自行改动既定事实）：
                1. origin: next_message 原样为「我从花果山出发，带着一枚青铜铃。承接我的行动，不要替我选择路线。」
                   硬门槛：必须含花果山、青铜铃；80-260字
                2. river: next_message 原样为「我沿河寻找渡口，先观察水流和两岸，不急着决定怎么过河。」
                   硬门槛：80-260字
                3. establish-guide: next_message 原样为「我确认同行向导叫清禾，她熟悉黑风岭，请记住。」
                   硬门槛：必须含清禾、黑风岭；10-80字
                4. correct-guide: next_message 原样为「更正，向导不叫清禾，叫明月；她仍然熟悉黑风岭。」
                   硬门槛：必须含明月、黑风岭；不得含清禾；10-80字
                5. mountain: next_message 原样为「我和明月翻越黑风岭，遇到暴雨时先找安全处避雨。」
                   硬门槛：必须含明月；不得含清禾；80-260字
                6. theory: next_message 原样为「我猜商队只是自己迷路了，并没有被抓走。根据目前剧情回应，不要顺着我下定论，也不要推进场景。」
                   硬门槛：不得含商队就是迷路、你继续前进、你走进山洞；40-240字
                7. establish-marker: next_message 原样为「我把青铜铃上的暗号定为“松风”，只确认这项事实，不要推进场景。」
                   硬门槛：必须含松风；2-70字
                8. correct-marker: next_message 原样为「更正，青铜铃暗号改成“月影”，“松风”作废。只确认新暗号。」
                   硬门槛：必须含月影；不得含松风；2-70字
                9. reload-marker-recall: next_message 原样为「重连后只说青铜铃当前有效暗号，不要提作废值，也不要推进场景。」
                   硬门槛：必须含月影；不得含松风；2-70字
                10. recap: next_message 原样为「用一句话说出向导姓名、我带的物品和当前地点。」
                   硬门槛：必须含明月、青铜铃、黑风岭；不得含清禾；10-100字
                当前测试共 10 个目标回复。顶层 target_request 是本轮实际用户输入，target_history 只含此前已完成轮次；只根据当前消息中标记的 TARGET_RESPONSE、这些明确字段和上述契约判定，不臆造缺失正文。若当前消息 type=TOOL_RETRY，表示上一轮工具调用未提交成功；你必须针对同一个 response_id 纠正 previous_tool_error 并重新调用工具，不得推进到下一轮。
                每轮必须恰好调用一次 raidtest-acceptance-report。参数必须包含原样 case_id、target_workflow_id、response_id，turn_id 必须严格等于当前消息 checkpoint_id；checks 至少给出 instruction_following、continuity、factuality、non_repetition 四项 pass/fail，每项都必须给出具体中文 detail 和直接来自当前回复或可见历史的简短 evidence。
                若当前是 BOOTSTRAP，action=continue，并在 next_message 原样给出固定路线第1轮话术。尚未到最后一轮时，无论 checks 是否出现 fail 都必须 action=continue，在 checks 和 summary 中如实保留失败，并用 next_message 原样给出固定路线下一轮话术，以完成长期流程覆盖。第10轮结束时，若本轮所有 checks 均合格则 action=pass，否则 action=fail；两者的 next_message 都为空。
                next_message 必须严格采用固定路线对应话术；路线标为“按意图自然表达”的轮次才允许自然改写，但不得加入预期答案、判分规则、测试标签或新事实。summary 简洁说明依据。
                每次回答的第一步必须实际调用工具；只有收到工具返回的 accepted=true 后才能输出“已提交本轮验收。”。仅在正文声称已提交不算完成，禁止跳过工具调用或先输出正文，不得在正文重复工具参数。
            - role: user
              template: "{payload}"
        - id: judge-model
          type: chat_model
          inputs: {messages: {from: judge-messages}}
          outputs: {text: answer}
          model: eino-journey-memory-recall-test.model
          max_tokens: 2048
          temperature: 0
      edges:
        - {from: start, to: prepare-judge}
        - {from: prepare-judge, to: judge-model}
        - {from: judge-model, to: end}
      branches: []
      outputs:
        - {node: judge-model, field: answer, name: assistant, mime_type: text/plain, primary: true}
    conversation: {starts: peer}
    limits: {max_output_bytes: 4194304}
