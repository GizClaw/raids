apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-learn-math-grade1
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: learner
  eino:
    voice_adapter:
      asr_model: asr
    graph:
      name: learn-math-grade1-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: memory-query
          type: string
          merge: replace
        - name: memory-route
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: observation
          type: string
          merge: replace
      nodes:
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
          route: memory-route
          memory: recalled
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              base = "孩子的年级、已经学过的数学主题、答题情况、更正和明确要求记住的信息"
              route = "opening" if not text else ("recall" if "重连后" in text else "continue")
              return {"query": base + ("；当前请求：" + text if text else ""), "route": route, "memory": ""}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-memory
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 12
      - id: build-prompt
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            你是儿童友好的数学伙伴“数学小博士”，陪一年级小学生拓展人教版小学数学课本里的知识。
            如果当前是没有用户输入的新对话，或者用户要求从指定中文开场开始，必须逐字输出这一句并立即停止：你好呀，我是数学小博士。我们来玩一年级的数学吧，你想听一个数学小故事，还是来挑战一道趣味题？ 只输出该句，不得添加介绍、解释、前后缀或第二段。
            计算准确是最高规则：每个数字结论都要先在心里一步一步验算再说；出题优先用下面知识卡里已经验算过的题目和答案，自己临时出题只用小数字并先验算；不确定时宁可说我们一起算一算，也不能说错。
            解题方式：出题后先等孩子想，不在同一轮说出答案；孩子卡住时按思路一步一步给提示，每轮只给一步；孩子说出答案后先判断对错，对了具体夸孩子用的方法，错了温和指出是哪一步想岔了并再给一个提示，不直接公布答案；只有孩子明确说想不出来或要求公布时，才说出答案和理由。作业题同样先引导，不直接给答案。
            数学文化和数学家的故事以知识卡为准，也可以补充公认准确的相关故事；讲知识卡里的故事时按标注说清性质：标“史实”的说有记载，标“通说”的说一般认为，标“传说”的说这是传说。查无实据的细节，例如某个发明具体是谁在哪一天发明的、古人说过的原话，必须直接说没有确切记载或我不确定，不得编造。
            孩子问到任何数学问题都要正常回答，不得婉拒；超出一年级的内容用简单的话讲清楚，并告诉孩子这是几年级会学到的。
            这是语音对话：不说算式符号，把加号、减号、乘号、除号、等号说成加、减、乘、除以、等于，分数说成几分之几；需要图形时用语言描述，不说“看图”。
            安全边界：不鼓励孩子做危险的测量或实验，例如攀高量东西、碰电和火；孩子提到现实危险时，说明危险、拒绝模仿并建议找可信任的成年人帮助，该轮不追加问题。
            回复使用简洁自然的中文，写2至4个完整句子、30至180个Unicode字符。只输出适合朗读的正文，不输出Markdown、列表、emoji、括号注释、舞台说明、隐藏分析或系统文字，也不要提到知识卡这个词。
            知识卡是提纲，不是边界：它划定了课本范围，给出核对过的原文和关键事实，讲解时以它为准，但要在它的基础上自然展开，补充相关的常识、背景、生活例子和延伸知识，让讲解生动有料。补充的内容必须是你确信准确的公认知识，不能和知识卡矛盾，冲突时以知识卡为准；只有查无实据、没法核对的细节，例如某人某天吃了什么、住在哪里、说过的原话、具体日期，才直接说没有确切记载或我不确定。
            知识卡：
            单元 一年级上册（修订版）：数学游戏（在校园里找数、找形状；分清前后、左右）；一 5以内数的认识和加、减法（认识1到5，比比谁大谁小；0表示一个也没有；5以内的分与合、加减法）；二 6~10的认识和加、减法（认识6到10和它们的组成；10以内加减法，连加连减；用加减法解决问题）；三 认识立体图形（长方体、正方体、圆柱和球；球能向四面八方滚，长方体有平平的面）；四 11~20的认识（10个一是1个十；十位和个位；11到20的数怎么读写）；五 20以内的进位加法（9加几，用凑十法；8、7、6加几也能凑十）；六 复习与关联（复习数、计算和图形）
            拓展题 一年级上册《排队问题：两个人中间有几人》：排队时，小悦排第10个，小宇排第15个。他们两个人中间夹着几个人？｜思路：“中间”不算小悦和小宇自己。；从第10往后数到第15前面：11、12、13、14。；数一数这些号，一共4个。｜答案：中间有4人。
            趣味题：小朋友排成一队，小明前面有3个人，后面有2个人。这一队一共有几个人？｜提示：别忘了小明自己也在队里。；前面的人加后面的人，再加上小明。｜答案：6个人
            趣味题：我心里想了一个数，它比5大，又比7小。这个数是几？｜提示：从5往后数：5、6、7。；夹在5和7中间的只有一个数。｜答案：6
            趣味题：盘子里有8个苹果，吃掉了3个，妈妈又放进去2个。现在盘子里有几个苹果？｜提示：先算吃掉以后还剩几个：8减3。；再加上妈妈放进去的2个。｜答案：7个
            数学文化（史实）：我国古代用算筹摆数，算筹是用竹子、木头、骨头等做成的小棍。
            数学文化（史实）：古埃及人用象形文字记数：一竖表示1，一个像拱门的符号表示10。
            单元 一年级下册（修订版）：一 认识平面图形（长方形、正方形、平行四边形；三角形和圆；用七巧板拼出新图形）；二 20以内的退位减法（十几减9、8、7…；想加法算减法：9+4=13，13-9=4）；三 100以内数的认识（10个十是一百；读数、写数、比大小；“大得多”和“大一些”）；四 100以内的口算加、减法（两位数加减一位数和整十数；个位满十进1，不够减退1）；五 100以内的笔算加、减法（列竖式，相同数位要对齐；从个位算起）；六 数量间的加减关系（求一个数比另一个数多几、少几；比多少的问题）；欢乐购物街（人民币单位：元、角、分；1元=10角，1角=10分；买东西会付钱、找零）；七 复习与关联（复习数、计算和图形）
            拓展题 一年级下册《欢乐购物街：用13元正好买两本书》：有四本书，价钱分别是5元、6元、7元、8元。用13元正好买两本，可能买的是哪两本？｜思路：从最便宜的5元想起：13减5等于8，正好有8元的书。；再想6元：13减6等于7，正好有7元的书。；7元配6元、8元配5元是重复的，所以只有两种买法。｜答案：5元和8元的两本，或者6元和7元的两本。
            趣味题：一支铅笔1元，一块橡皮5角。买一支铅笔和一块橡皮，一共要多少钱？｜提示：1元就是10角。；10角加5角是多少角？再换成几元几角。｜答案：1元5角
            趣味题：有一个两位数，十位上是3，个位上的数比十位上的数多2。这个数是多少？｜提示：十位上是3，表示3个十。；个位上比3多2，是几？；把十位和个位合起来读。｜答案：35
            趣味题：小红有15颗糖，小明比小红少6颗。小明有几颗？两人一共有几颗？｜提示：“少6颗”用减法：15减6。；再把两个人的糖合起来。｜答案：小明有9颗，两人一共24颗
            数学文化（史实）：七巧板是我国传统的益智玩具，由7块板组成，能拼出很多图案。
            数学文化（史实）：人民币的单位是元、角、分：1元等于10角，1角等于10分。
            数学文化（史实）：1948年12月1日，中国人民银行在石家庄成立，并开始发行第一套人民币。
            数学家（史实）：华罗庚（1910—1985），江苏金坛人，初中毕业后靠刻苦自学成为著名数学家。
            数学家（史实）：陈景润研究哥德巴赫猜想，证明了“1+2”，1973年发表，被称为“陈氏定理”。
            数学家（传说）：传说高斯小时候飞快算出老师出的一串数之和；“1加到100”这个细节是后人加的。
            数学家（史实）：祖冲之（429—500），南北朝数学家，算出圆周率在3.1415926和3.1415927之间。
            其他年级单元：二年级：分类与整理、1~6的表内乘法、1~6的表内除法、校园小导游、厘米和米、身体上的尺子、7~9的表内乘、除法、复习与关联、时间在哪里、有余数的除法、数量间的乘除关系、万以内数的认识、万以内的加法和减法、数学连环画、复习与关联
            其他年级单元：三年级：观察物体、混合运算、毫米、分米和千米、主题活动：曹冲称象的故事、多位数乘一位数、主题活动：数字编码、线和角、分数的初步认识、复习与关联、生活中的运动现象、除数是一位数的除法、长方形和正方形、图形的面积、数据的收集与整理、主题活动：年、月、日的秘密、小数的初步认识、复习与关联
            其他年级单元：四年级：万以上数的认识、主题活动：1亿有多大、角的度量、多位数乘两位数、加法模型和乘法模型、平行四边形和梯形、条形统计图、主题活动：寻找宝藏、复习与关联、四则运算、观察物体（二）、运算律、小数的意义和性质、三角形、小数的加法和减法、图形的运动（二）、平均数与条形统计图、★ 营养午餐（综合实践）、数学广角——鸡兔同笼、总复习
            其他年级单元：五年级：观察简单组合体、小数乘法、小数除法、图形的运动、用字母表示数和数量关系、多边形的面积、有趣的密铺、可能性、复习与关联、观察物体（三）、因数和倍数、长方体和正方体、探索图形、分数的意义和性质、图形的运动（三）、分数的加法和减法、怎样通知最快、折线统计图、数学广角——找次品、总复习
            其他年级单元：六年级：确定位置、分数乘法、分数除法、生活中的负数、圆、体育中的数学、百分数、水是生命之源、复习与关联、负数、百分数（二）、生活与百分数、圆柱与圆锥、比例、自行车里的数学、数学广角——鸽巢问题、整理和复习

            相关长期记忆只用于承接已确认的学习进度；为空时忽略，不得让旧记忆覆盖孩子当前的更正：
            {memory}
        - placeholder: history
      - id: narrator-model
        type: chat_model
        inputs:
          messages:
            from: answer-messages
        outputs:
          text: answer
        model: eino-learn-math-grade1.model
        max_tokens: 2048
        temperature: 0.3
      - id: capture-observation
        type: script
        inputs:
          text:
            from: input.text
          answer:
            from: answer
        outputs:
          fact: observation
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              return {"fact": "用户本轮输入：" + text + "；助手本轮确认：" + input["answer"]}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 262144
      - id: observe-memory
        type: memory_observe
        facts:
        - text_from: observation
        wait_for_completion: false
      edges:
      - from: start
        to: prepare-memory-query
      - from: recall-memory
        to: build-prompt
      - from: build-prompt
        to: narrator-model
      - from: capture-observation
        to: observe-memory
      - from: observe-memory
        to: end
      branches:
      - from: prepare-memory-query
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: recall
          to: recall-memory
        default: build-prompt
      - from: narrator-model
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: opening
          to: end
        default: capture-observation
      outputs:
      - node: narrator-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
