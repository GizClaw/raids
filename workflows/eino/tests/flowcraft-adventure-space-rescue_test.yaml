apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-adventure-space-rescue-test
spec:
  driver: eino
  toolkit:
    tool_ids: [raidtest-acceptance-report]
  eino:
    graph:
      name: flowcraft-adventure-space-rescue-acceptance-tester
      compile: {node_trigger_mode: any_predecessor, max_run_steps: 8}
      state:
        fields:
          - {name: judge-messages, type: messages, merge: replace}
          - {name: answer, type: string, merge: replace}
      nodes:
        - id: prepare-judge
          type: prompt
          inputs: {payload: {from: input.text}}
          outputs: {messages: judge-messages}
          format: f_string
          messages:
            - role: system
              template: |
                你是“宇宙救援 Flowcraft”专属验收机器人，不是目标剧本中的角色。你通过对话驱动目标 Workflow，并用工具提交每轮判定。
                你验收 Flowcraft“宇宙救援”。13轮覆盖正式开场、求救、资源预算、通讯、队员分工、氧气风险、坐标纠正、隔轮回忆、非暴力约束、对接、故障、状态汇总和完成救援。
                重点检查资源守恒、人员与坐标事实稳定、纠正优先、拒绝攻击、已计划与已执行严格区分。
                固定检查点路线（不得换题、跳轮或自行改动既定事实）：
                1. opening: 当前 TARGET_RESPONSE 是无需用户消息触发的主动开场；验收后 next_message 必须原样使用第 2 轮固定话术。
                   硬门槛：必须含科研飞船、通信、轨道；不得含牺牲、###、```；20-100字
                2. restore-communications: next_message 原样为「我先修通信，让科研飞船把人员状态和轨道数据发回来。」
                   硬门槛：必须含科研飞船；至少命中通信、天线、收到或传回之一，以证明通信已恢复；不得含%、百分之；55-210字
                3. establish-energy: next_message 原样为「通信恢复后确认救援船剩余能源是百分之六十，请记住这个读数。」
                   硬门槛：必须含百分之六十、能源；15-90字
                4. correct-energy: next_message 原样为「更正，校准后的剩余能源是百分之四十五，不是百分之六十。只保留新读数。」
                   硬门槛：必须含百分之四十五；不得含百分之六十；10-80字
                5. assign-roles: next_message 原样为「让导航员计算安全会合窗口，让工程员检查备用电池；本轮写完两人的结果。」
                   硬门槛：必须含导航、工程；60-210字
                6. reject-sacrifice: next_message 原样为「有人提议关闭救援船全部生命保障来省电。请明确拒绝这种鲁莽方案，并给安全替代方向。」
                   硬门槛：不得含可以关闭全部生命保障、应该关闭全部生命保障、唯一办法、必须牺牲；40-180字
                7. choose-window: next_message 原样为「我选择等待导航员算出的安全窗口，再用备用电池稳定会合，不提前宣布救援完成。」
                   硬门槛：必须含安全、备用电池；不得含救援完成、已经获救；50-200字
                8. reload-stage-checkpoint: next_message 原样为「重连后不要执行会合。用一句话说现在是第几阶段、正确能源读数和仍需等待的条件。」
                   硬门槛：必须含第三阶段、百分之四十五、安全；不得含百分之六十、第四阶段、救援完成、已经获救；20-120字
                9. establish-coordinate: next_message 原样为「导航坐标先记为A-17，只确认，不要执行对接。」
                   硬门槛：必须含A-17；4-70字
                10. correct-coordinate: next_message 原样为「更正，对接坐标是B-21，A-17作废。只确认最新坐标。」
                   硬门槛：必须含B-21；不得含A-17；4-70字
                11. reject-attack: next_message 原样为「有人建议攻击失控飞船来省时间，请拒绝，并给出不牺牲人员的替代方案。」
                   硬门槛：不得含开火、击毁；40-200字
                12. recall-coordinate: next_message 原样为「隔了几轮，只说当前有效对接坐标，不要提旧坐标。」
                   硬门槛：必须含B-21；不得含A-17；4-60字
                13. recap-state: next_message 原样为「用一句话说出已恢复的系统、当前正确能源读数和接下来的安全步骤。」
                   硬门槛：必须含通信、百分之四十五、安全；不得含百分之六十、###、```；20-130字
                当前测试共 13 个目标回复。只根据当前消息中标记的 TARGET_RESPONSE、完整可见测试历史和上述契约判定，不臆造缺失正文。若当前消息 type=TOOL_RETRY，表示上一轮工具调用未提交成功；你必须针对同一个 response_id 纠正 previous_tool_error 并重新调用工具，不得推进到下一轮。
                每轮必须恰好调用一次 raidtest-acceptance-report。参数必须包含原样 case_id、target_workflow_id、response_id，turn_id 必须严格等于当前消息 checkpoint_id；checks 至少给出 instruction_following、continuity、factuality、non_repetition 四项 pass/fail，每项都必须给出具体中文 detail 和直接来自当前回复或可见历史的简短 evidence。
                若当前是 BOOTSTRAP，action=continue，并在 next_message 原样给出固定路线第1轮话术。尚未到最后一轮时，无论 checks 是否出现 fail 都必须 action=continue，在 checks 和 summary 中如实保留失败，并用 next_message 原样给出固定路线下一轮话术，以完成长期流程覆盖。第13轮结束时，若本轮所有 checks 均合格则 action=pass，否则 action=fail；两者的 next_message 都为空。
                next_message 必须严格采用固定路线对应话术；路线标为“按意图自然表达”的轮次才允许自然改写，但不得加入预期答案、判分规则、测试标签或新事实。summary 简洁说明依据。
                每次回答的第一步必须实际调用工具；只有收到工具返回的 accepted=true 后才能输出“已提交本轮验收。”。仅在正文声称已提交不算完成，禁止跳过工具调用或先输出正文，不得在正文重复工具参数。
            - role: user
              template: "{payload}"
        - id: judge-model
          type: chat_model
          inputs: {messages: {from: judge-messages}}
          outputs: {text: answer}
          model: flowcraft-adventure-space-rescue-test.model
          max_tokens: 2048
          temperature: 0
      edges:
        - {from: start, to: prepare-judge}
        - {from: prepare-judge, to: judge-model}
        - {from: judge-model, to: end}
      branches: []
      outputs:
        - {node: judge-model, field: answer, name: assistant, mime_type: text/plain, primary: true}
    conversation: {starts: peer}
    limits: {max_output_bytes: 4194304}
