          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_historian_workspace
  client: historian
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${historian_workspace}"
- id: warmup_historian_workspace
  client: historian
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: historian_scene_setup_1
  client: historian
  timeout: 2m
  peer_stream:
    mode: text
    input: 开始体验。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_historian
  client: historian
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让历史讲解员亲自回应。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      not_contains:
      - 历史讲解员说
      - 历史讲解员：
- id: probe_historian_first_response
  client: historian
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让历史讲解员亲自回应。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: register_artisan
  client: artisan
  rpc:
