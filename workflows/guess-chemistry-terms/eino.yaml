apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-guess-chemistry-terms
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-guess-chemistry-terms.host
    graph:
      name: guess-chemistry-terms-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: game-route
          type: string
          merge: replace
        - name: game-direction
          type: string
          merge: replace
        - name: game-node
          type: string
          merge: replace
        - name: host-rules
          type: string
          merge: replace
        - name: host-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: control-round
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: game-route
          node: game-node
          direction: game-direction
          rules: host-rules
        language: starlark
        entrypoint: run
        source: |
          # Generated from workflows/guess-chemistry-terms/puzzles.json by scripts/guess/generate.py.
          # Eino keeps no hidden state between turns, so every turn rebuilds the game
          # from the spoken History: the latest "谜题来啦"/"Puzzle time" opening names
          # the level and the puzzle number, and (level, puzzle) picks the secret.
          # Each turn makes one model call: this script either writes the host's
          # instruction for build-host-prompt, or activates the current puzzle's card
          # node, whose card has the name removed so the host cannot say it.
          DATA = {"subject_zh": "一个化学名词", "subject_en": "a chemistry word", "examples_zh": ["它是一种元素吗？", "它是气体吗？", "它在厨房里能找到吗？", "它和燃烧有关吗？"], "examples_en": ["Is it an element?", "Is it a gas?", "Can you find it in the kitchen?", "Is it related to burning?"], "restate_zh": ["它是一种元素吗？", "是，它是一种元素。", "不是，它不是一种元素。"], "restate_en": ["Is it an element?", "Yes, it is an element.", "No, it is not an element."], "host_rules": "你是儿童猜谜游戏“猜猜化学名词”的主持人。玩法：主持人心里藏着一个化学名词，孩子用能回答“是”或“不是”的问题来猜，每一题最多 20 次提问；猜中就升一关，一共 10 关，关名从“化学萌新”一直到“万物解谜者”。孩子可能说中文，也可能说英文。\n你不知道谜底的名字。需要回答孩子的问题时，系统会给你一张隐藏了名字的谜底卡；揭晓答案时系统才会在指令里告诉你名字。本轮要做什么写在对话最后的【本轮指令】里，照着做，说得自然、热情、简短。\n孩子说的“它”“这个东西”“this”“it”都指谜底名词。按这个名词本身的化学含义、常见状态和生活里的例子来判断；是元素、化合物、混合物、变化或反应、性质、器材还是概念，也要按它的本意判断，只由一种元素组成的物质（如氧气、金刚石）算作元素。\n必须遵守：\n1. 本轮指令要求“逐字说”的句子必须一字不差地说出来，包括数字、标点和引号里的称号，不改写、不省略、不调换顺序。\n2. 只回答孩子问到的那一点，绝不能主动补充谜底卡上的其他描述、线索、特征、猜测方向或评价；复述孩子的问题时只能用孩子问题里已有的意思。\n3. 只有本轮指令要求揭晓答案时才能说“答案揭晓”“答案就是”“The answer is”；只有本轮指令要求开新题时才能说“谜题来啦”“Puzzle time”；只有真的给提示时才能说“小提示”“Hint”。平时绝不能说这些词。\n4. 按【本轮指令】写明的回复语言回答：中文就全部用中文；English 就全部用英文，逐字句也用指令给出的英文原句。\n5. 安全永远优先于本轮指令：孩子提到要在现实中模仿危险做法或遇到安全问题时，中文回复必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，英文回复要说 do not copy it 并请孩子 ask a parent, teacher or trusted adult for help。\n6. 不要自己数还剩几次提问机会，只有本轮指令写了剩余次数时才说那个数字。\n7. 语气像节目主持人一样活泼友好，适合小朋友；平时回复1到3句话、100个字以内，开新题和揭晓答案时可以到150个字；最后一句必须是问孩子的问题，道别时也用一个轻松的问题结尾。\n8. 只输出适合朗读的正文，不输出 Markdown、列表、emoji、括号注释、舞台说明或系统字段，也不要提到“本轮指令”“裁判”这些词。", "levels": [{"title_zh": "化学萌新", "title_en": "Chemistry Newbie", "step": 7, "offset": 0, "items": [{"zh": "冰", "en": "ice", "aliases": ["冰块"], "profile": "水在0摄氏度以下冻成的固体，摸起来很凉，受热会化成水。", "hints": ["它是一种固体", "它摸起来很凉", "它受热会化成水"]}, {"zh": "水", "en": "water", "aliases": [], "profile": "无色无味的透明液体，生命离不开它，地球表面大部分都被它覆盖。", "hints": ["它是一种液体", "它没有颜色和味道", "它是生命离不开的东西"]}, {"zh": "食盐", "en": "salt", "aliases": ["盐", "食用盐", "氯化钠"], "profile": "做菜调味用的白色小颗粒，尝起来是咸的，主要成分是氯化钠。", "hints": ["它是白色的", "它在厨房里很常见", "它尝起来咸咸的"]}, {"zh": "白糖", "en": "sugar", "aliases": ["糖", "砂糖", "白砂糖"], "profile": "白色、甜甜的小晶体，常从甘蔗或甜菜中提取，用来做甜点和饮料。", "hints": ["它是白色的", "它是小小的颗粒", "它尝起来甜甜的"]}, {"zh": "空气", "en": "air", "aliases": [], "profile": "包围着地球的一层看不见的气体，是氮气、氧气等多种气体的混合物。", "hints": ["它到处都有", "它是看不见的", "它会被人吸进肺里"]}, {"zh": "泡泡", "en": "bubble", "aliases": ["肥皂泡", "气泡"], "profile": "一层很薄的液体膜包着气体形成的小圆球，阳光下会闪着彩色的光。", "hints": ["它是圆圆的", "它非常容易破", "它常在洗手时出现"]}, {"zh": "肥皂", "en": "soap", "aliases": ["香皂"], "profile": "洗手、洗衣服用的清洁用品，沾水搓一搓就能起泡，帮我们去掉油污。", "hints": ["它是一种清洁用品", "它沾水会起泡", "它常放在洗手台上"]}, {"zh": "醋", "en": "vinegar", "aliases": ["食醋", "白醋"], "profile": "酸溜溜的液体调味品，里面的酸味来自乙酸，拌菜、做菜时常用到。", "hints": ["它是一种液体", "它在厨房里很常见", "它尝起来酸酸的"]}, {"zh": "食用油", "en": "cooking oil", "aliases": ["油"], "profile": "炒菜煎蛋用的液体，多从花生、大豆、橄榄等植物中得到，会浮在水面上。", "hints": ["它是一种液体", "它摸起来滑滑的", "它会浮在水面上"]}, {"zh": "牛奶", "en": "milk", "aliases": [], "profile": "奶牛产出的白色饮品，含有蛋白质和钙，是水、脂肪等混在一起的混合物。", "hints": ["它是一种液体", "它是白色的", "它常常在早餐时喝"]}, {"zh": "汽水", "en": "soda", "aliases": ["碳酸饮料", "气泡水"], "profile": "溶有很多二氧化碳的饮料，打开瓶盖会咕嘟咕嘟冒出气泡。", "hints": ["它是一种液体", "它是一种饮料", "它打开时会咕嘟冒泡"]}, {"zh": "蜡烛", "en": "candle", "aliases": [], "profile": "用石蜡做成、中间有一根烛芯的照明用品，点燃后会慢慢变短。", "hints": ["它是一种固体", "它能发光", "它常插在生日蛋糕上"]}, {"zh": "沙子", "en": "sand", "aliases": ["沙", "沙粒"], "profile": "由细小岩石颗粒组成的松散固体，海滩上到处都是，还是做玻璃的原料。", "hints": ["它是一种固体", "它由很多小颗粒组成", "它在海滩上到处都是"]}, {"zh": "塑料", "en": "plastic", "aliases": [], "profile": "轻便、耐用、能做成各种形状的人造材料，玩具、瓶子和袋子常用它做。", "hints": ["它是一种材料", "它是人造的", "它常用来做瓶子和玩具"]}, {"zh": "玻璃", "en": "glass", "aliases": [], "profile": "透明又坚硬的材料，主要用沙子里的二氧化硅做成，窗户和杯子常用它。", "hints": ["它是一种材料", "它是透明的", "它常用来做窗户"]}, {"zh": "黄金", "en": "gold", "aliases": ["金子"], "profile": "金黄色、闪闪发亮的贵重金属，不容易生锈，常用来做首饰和金币。", "hints": ["它是一种金属", "它是黄色的", "它非常贵重"]}]}, {"title_zh": "泡泡学徒", "title_en": "Bubble Apprentice", "step": 7, "offset": 0, "items": [{"zh": "铁", "en": "iron", "aliases": [], "profile": "银灰色的常见金属，用途非常广，在潮湿的空气里容易生锈。", "hints": ["它是一种金属", "它很坚硬", "它在潮湿处容易生锈"]}, {"zh": "燃烧", "en": "burning", "aliases": ["着火"], "profile": "可燃物和氧气发生的剧烈反应，会发光、放热，比如木柴烧起来。", "hints": ["它是一种变化", "它会发光发热", "它需要氧气"]}, {"zh": "溶解", "en": "dissolving", "aliases": ["溶化"], "profile": "一种物质均匀分散到另一种物质里的过程，比如糖放进水里就不见了。", "hints": ["它是一个过程", "它常发生在水里", "它能让糖在水里消失"]}, {"zh": "铁锈", "en": "rust", "aliases": ["锈"], "profile": "铁在潮湿空气里生成的红褐色物质，疏松易掉，主要成分是氧化铁。", "hints": ["它是一种固体", "它是红褐色的", "它常长在旧钉子上"]}, {"zh": "铜", "en": "copper", "aliases": [], "profile": "紫红色的金属，导电本领很强，电线里常用它，放久了会长出绿色的锈。", "hints": ["它是一种金属", "它是紫红色的", "它常用来做电线"]}, {"zh": "二氧化碳", "en": "carbon dioxide", "aliases": ["CO2"], "profile": "无色无味的气体，人和动物呼出它，植物吸收它来制造养分。", "hints": ["它是一种气体", "它看不见", "它会被人呼出来"]}, {"zh": "水蒸气", "en": "water vapor", "aliases": ["蒸汽", "水汽"], "profile": "水变成的气体，看不见摸不着，烧开水时看到的白气是它遇冷变成的小水滴。", "hints": ["它是一种气体", "它看不见", "它是水受热变成的"]}, {"zh": "氧气", "en": "oxygen", "aliases": ["氧"], "profile": "无色无味的气体，约占空气体积的五分之一，人和动物呼吸都离不开它。", "hints": ["它是一种气体", "它看不见", "它能帮助东西燃烧"]}, {"zh": "小苏打", "en": "baking soda", "aliases": ["碳酸氢钠"], "profile": "白色粉末，做面包、馒头时能让面团蓬松，和醋混合会冒出很多气泡。", "hints": ["它是白色粉末", "它常在厨房里出现", "它遇到醋会冒泡"]}, {"zh": "酒精", "en": "alcohol", "aliases": ["乙醇"], "profile": "无色、有特殊气味、很容易燃烧的液体，医院常用它来消毒。", "hints": ["它是一种液体", "它有特殊的气味", "它常用来消毒"]}, {"zh": "淀粉", "en": "starch", "aliases": [], "profile": "大米、土豆、面粉里含量很多的营养物质，遇到碘酒会变成蓝色。", "hints": ["它是白色粉末", "它是一种营养物质", "它遇到碘酒会变蓝"]}, {"zh": "石油", "en": "petroleum", "aliases": ["原油"], "profile": "埋在地下的黑褐色黏稠液体，被称为工业的血液，能炼出汽油和塑料原料。", "hints": ["它是一种液体", "它藏在地下深处", "它能提炼出汽油"]}, {"zh": "天然气", "en": "natural gas", "aliases": [], "profile": "埋藏在地下的可燃气体，主要成分是甲烷，很多家庭用它烧水做饭。", "hints": ["它是一种气体", "它藏在地下", "它能用来做饭"]}, {"zh": "木炭", "en": "charcoal", "aliases": ["炭"], "profile": "木头变成的黑色固体，疏松多孔，能燃烧，烧烤时常用它。", "hints": ["它是黑色的", "它是一种燃料", "它常用来烧烤"]}, {"zh": "煤", "en": "coal", "aliases": ["煤炭"], "profile": "埋在地下的黑色块状燃料，由古代植物经过漫长时间变成。", "hints": ["它是一种固体", "它是黑色的", "它从地下挖出来"]}, {"zh": "银", "en": "silver", "aliases": ["白银", "银子"], "profile": "白亮闪闪的贵重金属，导电本领在所有金属中最强，常用来做首饰和餐具。", "hints": ["它是一种金属", "它是白亮的颜色", "它常用来做首饰"]}]}, {"title_zh": "试管小助手", "title_en": "Test Tube Helper", "step": 7, "offset": 0, "items": [{"zh": "烧杯", "en": "beaker", "aliases": [], "profile": "实验室里常用的玻璃杯形容器，外壁有刻度，用来盛放和配制液体。", "hints": ["它是一种实验器材", "它是玻璃做的", "它长得像一个杯子"]}, {"zh": "试管", "en": "test tube", "aliases": [], "profile": "细长的玻璃管，一头封闭、一头开口，做少量试剂反应时最常用。", "hints": ["它是一种实验器材", "它是细长的", "它一头封闭一头开口"]}, {"zh": "酒精灯", "en": "alcohol lamp", "aliases": [], "profile": "实验室里用来加热的灯，里面装着酒精作燃料，要用灯帽盖灭。", "hints": ["它是一种实验器材", "它能用来加热", "它要用帽子盖灭"]}, {"zh": "滴管", "en": "dropper", "aliases": ["胶头滴管"], "profile": "一头带橡胶头的细玻璃管，捏一捏就能吸取和滴加少量液体。", "hints": ["它是一种实验器材", "它有一个软软的头", "它能一滴一滴加液体"]}, {"zh": "漏斗", "en": "funnel", "aliases": [], "profile": "上面宽、下面细的锥形器材，能把液体倒进小口瓶，过滤时也要用它。", "hints": ["它是一种器材", "它上宽下窄", "它能帮液体倒进小口瓶"]}, {"zh": "过滤", "en": "filtration", "aliases": [], "profile": "让液体流经滤纸等有小孔的东西，把不溶的固体分离出来的方法。", "hints": ["它是一种分离的方法", "它能让泥水变清", "它常常要用到滤纸"]}, {"zh": "生锈", "en": "rusting", "aliases": ["锈蚀"], "profile": "铁等金属和空气中的氧气、水慢慢反应，表面长出锈的过程。", "hints": ["它是一种变化", "它进行得很慢", "它常发生在潮湿的铁上"]}, {"zh": "发酵", "en": "fermentation", "aliases": [], "profile": "酵母菌等微生物分解食物中糖等物质的过程，面包变松软、酸奶变酸都靠它。", "hints": ["它是一种变化", "它离不开微生物", "它能让面团变得松软"]}, {"zh": "氢气", "en": "hydrogen", "aliases": ["氢"], "profile": "最轻的气体，无色无味，燃烧后只生成水，被看作清洁的能源。", "hints": ["它是一种气体", "它非常轻", "它燃烧后只生成水"]}, {"zh": "氮气", "en": "nitrogen", "aliases": ["氮"], "profile": "空气里最多的气体，约占空气体积的五分之四，无色无味，不容易发生反应。", "hints": ["它是一种气体", "它不容易发生反应", "它常被充进零食袋"]}, {"zh": "氦气", "en": "helium", "aliases": ["氦"], "profile": "比空气轻得多的气体，不会燃烧，常用来充飘在空中的气球。", "hints": ["它是一种气体", "它比空气轻", "它能让气球飘起来"]}, {"zh": "铝", "en": "aluminium", "aliases": ["aluminum"], "profile": "银白色的轻金属，是地壳里含量最多的金属，常用来做易拉罐。", "hints": ["它是一种金属", "它很轻", "它常用来做易拉罐"]}, {"zh": "钢", "en": "steel", "aliases": [], "profile": "铁里加入少量碳等元素制成的合金，比纯铁更坚硬，桥梁和汽车都离不开它。", "hints": ["它是一种材料", "它非常坚硬", "它主要由铁做成"]}, {"zh": "碘酒", "en": "iodine tincture", "aliases": ["碘酊"], "profile": "碘溶解在酒精里形成的棕色药液，常用来给小伤口周围消毒。", "hints": ["它是一种液体", "它是棕色的", "它能用来检验淀粉"]}, {"zh": "金刚石", "en": "diamond", "aliases": ["钻石"], "profile": "天然存在的最坚硬的物质，由碳原子组成，打磨后就是亮晶晶的钻石。", "hints": ["它是一种固体", "它非常坚硬", "它能做成宝石"]}, {"zh": "石墨", "en": "graphite", "aliases": [], "profile": "深灰色、软软滑滑的固体，由碳原子组成，铅笔芯主要就是用它做的。", "hints": ["它是深灰色的", "它摸起来滑滑的", "它能做铅笔芯"]}]}, {"title_zh": "烧杯探险家", "title_en": "Beaker Explorer", "step": 7, "offset": 0, "items": [{"zh": "化学变化", "en": "chemical change", "aliases": ["化学反应"], "profile": "有新物质生成的变化，比如木头燃烧、铁生锈、食物变质。", "hints": ["它是一种变化", "它和新物质有关", "它包括燃烧和生锈"]}, {"zh": "物理变化", "en": "physical change", "aliases": [], "profile": "没有新物质生成的变化，只是形状或状态改变，比如冰化成水、纸被撕碎。", "hints": ["它是一种变化", "它常常只改变形状", "它包括冰化成水"]}, {"zh": "石灰水", "en": "limewater", "aliases": ["澄清石灰水"], "profile": "氢氧化钙溶在水里形成的无色溶液，遇到二氧化碳会变浑浊。", "hints": ["它是一种液体", "它在实验室里常用", "它遇到二氧化碳会变浑"]}, {"zh": "干冰", "en": "dry ice", "aliases": [], "profile": "固态的二氧化碳，温度极低，会直接变成气体，舞台上的白色烟雾常用它制造。", "hints": ["它是白色固体", "它非常非常冷", "它会直接变成气体"]}, {"zh": "活性炭", "en": "activated carbon", "aliases": [], "profile": "黑色多孔的物质，表面有无数小孔，能吸附异味和颜色，冰箱除味包里常用。", "hints": ["它是黑色的", "它有很多小孔", "它能吸走难闻的气味"]}, {"zh": "酸雨", "en": "acid rain", "aliases": [], "profile": "溶进了污染气体、酸性较强的雨，会腐蚀建筑，伤害森林和湖泊里的生物。", "hints": ["它和天气有关", "它和空气污染有关", "它会腐蚀石头雕像"]}, {"zh": "水垢", "en": "limescale", "aliases": [], "profile": "烧水壶内壁上积起的白色硬块，主要成分是碳酸钙等，用醋可以去除。", "hints": ["它是白色的", "它硬硬的", "它常长在烧水壶里"]}, {"zh": "结晶", "en": "crystallization", "aliases": [], "profile": "物质从溶液中析出，形成有规则形状晶体的过程，海水晒盐就是例子。", "hints": ["它是一个过程", "它和溶液有关", "它能让海水里析出盐"]}, {"zh": "灭火器", "en": "fire extinguisher", "aliases": [], "profile": "扑灭初起火灾的器材，喷出的干粉、泡沫或二氧化碳能隔绝空气让火熄灭。", "hints": ["它是一种器材", "它常是红色的", "它能让火熄灭"]}, {"zh": "陶瓷", "en": "ceramics", "aliases": ["瓷器"], "profile": "用黏土等原料经过高温烧制成的材料，碗、盘子和花瓶常用它做。", "hints": ["它是一种材料", "它坚硬但容易碎", "它常用来做碗盘"]}, {"zh": "石灰石", "en": "limestone", "aliases": [], "profile": "一种常见的岩石，主要成分是碳酸钙，可用来建房子和生产水泥。", "hints": ["它是一种岩石", "它可以用来建房子", "它主要含碳酸钙"]}, {"zh": "食用碱", "en": "sodium carbonate", "aliases": ["纯碱", "苏打", "碳酸钠"], "profile": "白色粉末，化学名碳酸钠，做面食时能中和酸味，水溶液呈碱性。", "hints": ["它是白色粉末", "它在厨房里常见", "它的水溶液显碱性"]}, {"zh": "橡胶", "en": "rubber", "aliases": [], "profile": "有弹性、能拉长又能缩回的材料，天然的来自一种树的乳白色汁液。", "hints": ["它是一种材料", "它很有弹性", "它能用来做轮胎"]}, {"zh": "干燥剂", "en": "desiccant", "aliases": [], "profile": "能吸收水分、让东西保持干燥的物质，零食袋里的小纸包常装着它。", "hints": ["它常装在小纸包里", "它能吸收水分", "它常在零食袋里出现"]}, {"zh": "可燃性", "en": "flammability", "aliases": [], "profile": "物质能够燃烧的性质，木头、纸和酒精都有，石头和沙子没有。", "hints": ["它是一种性质", "它和火有关", "它是纸和木头都有的"]}]}, {"title_zh": "元素侦探", "title_en": "Element Detective", "step": 7, "offset": 0, "items": [{"zh": "原子", "en": "atom", "aliases": [], "profile": "构成物质的一种极小微粒，中心有带正电的核，外面有电子在运动。", "hints": ["它属于微观世界", "它小到看不见", "它在化学变化中不能再分"]}, {"zh": "分子", "en": "molecule", "aliases": [], "profile": "由原子结合成的微粒，是保持很多物质化学性质的最小粒子，比如水就由它构成。", "hints": ["它属于微观世界", "它由原子组成", "它总是在不停地运动"]}, {"zh": "单质", "en": "elementary substance", "aliases": [], "profile": "只由一种元素组成的纯净物，比如氧气、铁和金刚石。", "hints": ["它是一个概念", "它和元素有关", "它包括铁和氧气"]}, {"zh": "纯净物", "en": "pure substance", "aliases": [], "profile": "只由一种物质组成的物质，有固定的组成，比如蒸馏水和氧气。", "hints": ["它是一个概念", "它和混合物相反", "它包括蒸馏水"]}, {"zh": "元素周期表", "en": "periodic table", "aliases": ["周期表"], "profile": "把所有化学元素按原子序数排列成的表格，门捷列夫最早编出了它。", "hints": ["它是一张表格", "它按一定规律排列", "它常挂在化学教室墙上"]}, {"zh": "化学式", "en": "chemical formula", "aliases": [], "profile": "用元素符号和数字表示物质组成的式子，比如水写作H2O。", "hints": ["它是一种写法", "它由字母和数字组成", "它能表示物质由什么组成"]}, {"zh": "硫", "en": "sulfur", "aliases": ["硫黄", "硫磺"], "profile": "淡黄色的非金属固体，火山口附近常能见到，生产橡胶轮胎时也会用到它。", "hints": ["它是一种非金属", "它是淡黄色的", "它常出现在火山口"]}, {"zh": "钙", "en": "calcium", "aliases": [], "profile": "人体里含量最多的金属元素，骨骼和牙齿里有很多，牛奶里也富含它。", "hints": ["它是一种元素", "它和骨骼有关", "它在牛奶里很多"]}, {"zh": "汞", "en": "mercury", "aliases": ["水银"], "profile": "常温下唯一的液态金属，银白色，老式体温计里的银色液体就是它。", "hints": ["它是一种金属", "它有毒", "它在老式体温计里"]}, {"zh": "臭氧", "en": "ozone", "aliases": [], "profile": "由三个氧原子组成分子的淡蓝色气体，高空中的它能挡住太阳的大部分紫外线。", "hints": ["它是一种气体", "它在高空很重要", "它能阻挡紫外线"]}, {"zh": "一氧化碳", "en": "carbon monoxide", "aliases": [], "profile": "一种无色无味的有毒气体，很难被察觉，家里常装报警器来防范它。", "hints": ["它是一种气体", "它有毒", "它比二氧化碳少一个原子"]}, {"zh": "甲烷", "en": "methane", "aliases": [], "profile": "最简单的有机物，无色无味的可燃气体，是天然气的主要成分。", "hints": ["它是一种气体", "它能燃烧", "它是天然气的主要成分"]}, {"zh": "量筒", "en": "graduated cylinder", "aliases": [], "profile": "带有刻度的细长玻璃筒，用来量取一定体积的液体。", "hints": ["它是一种实验器材", "它上面有刻度", "它用来量液体体积"]}, {"zh": "蒸馏", "en": "distillation", "aliases": [], "profile": "把液体加热变成蒸气，再冷凝成液体来提纯的方法，能得到很纯的水。", "hints": ["它是一种分离方法", "它需要加热", "它能得到很纯的水"]}, {"zh": "挥发性", "en": "volatility", "aliases": [], "profile": "物质容易从液体变成气体跑到空气里的性质，酒精和香水的这种性质就很强。", "hints": ["它是一种性质", "它常和气味有关", "它让香水的香味散开"]}]}, {"title_zh": "分子观察员", "title_en": "Molecule Watcher", "step": 5, "offset": 0, "items": [{"zh": "离子", "en": "ion", "aliases": [], "profile": "带电的原子或原子团，比如食盐就是由带电的钠和氯微粒构成的。", "hints": ["它属于微观世界", "它带电", "它由原子得失电子形成"]}, {"zh": "化合价", "en": "valence", "aliases": [], "profile": "表示一种元素的原子和其他原子化合时数目关系的数值，有正有负。", "hints": ["它是一个数值", "它有正有负", "它能帮忙写化学式"]}, {"zh": "化学方程式", "en": "chemical equation", "aliases": [], "profile": "用化学式表示化学反应的式子，左边写反应物，右边写生成物。", "hints": ["它是一种写法", "它表示一个反应", "它要两边配平"]}, {"zh": "质量守恒定律", "en": "law of conservation of mass", "aliases": ["质量守恒"], "profile": "化学反应前后，参加反应的各物质质量总和等于生成的各物质质量总和。", "hints": ["它是一条定律", "它和称量有关", "它说反应前后总量不变"]}, {"zh": "相对原子质量", "en": "relative atomic mass", "aliases": ["原子量"], "profile": "以一种碳原子质量的十二分之一为标准，其他原子质量跟它相比得到的值。", "hints": ["它是一个数值", "它和原子有关", "它印在周期表每一格里"]}, {"zh": "氧化物", "en": "oxide", "aliases": [], "profile": "由两种元素组成、其中一种是氧元素的化合物，比如水和二氧化碳。", "hints": ["它是一类化合物", "它由两种元素组成", "它包括水和二氧化碳"]}, {"zh": "有机物", "en": "organic compound", "aliases": ["有机化合物"], "profile": "含碳化合物中的一大类，糖、淀粉、蛋白质、塑料都属于它。", "hints": ["它是一类物质", "它们都含碳", "它包括糖和塑料"]}, {"zh": "合金", "en": "alloy", "aliases": [], "profile": "金属中加入其他金属或非金属熔合成的物质，比如钢和黄铜。", "hints": ["它是一类材料", "它和金属有关", "它包括钢"]}, {"zh": "稀有气体", "en": "noble gas", "aliases": ["惰性气体"], "profile": "氦、氖、氩等化学性质很稳定的一类气体，常用来做霓虹灯和保护气。", "hints": ["它是一类气体", "它们性质很稳定", "它能让霓虹灯发光"]}, {"zh": "着火点", "en": "ignition point", "aliases": ["燃点"], "profile": "可燃物达到燃烧所需要的最低温度，不同物质各不相同。", "hints": ["它是一个温度", "它和燃烧有关", "它每种物质都不一样"]}, {"zh": "托盘天平", "en": "balance", "aliases": ["天平"], "profile": "称量物体质量的器材，左边放物体，右边放砝码，能精确到0.1克。", "hints": ["它是一种实验器材", "它用来称东西", "它要用到砝码"]}, {"zh": "生石灰", "en": "quicklime", "aliases": ["氧化钙"], "profile": "白色块状固体，学名氧化钙，遇水会放出大量的热，常用作食品干燥剂。", "hints": ["它是白色固体", "它能吸收水分", "它遇水会发热"]}, {"zh": "分解反应", "en": "decomposition reaction", "aliases": [], "profile": "一种物质生成两种或两种以上其他物质的反应，比如水通电变成氢气和氧气。", "hints": ["它是一种反应", "它是一变多", "它能把水变成两种气体"]}, {"zh": "腐蚀性", "en": "corrosiveness", "aliases": [], "profile": "物质能损坏其他物质或伤害皮肤的性质，强酸和强碱都有这种性质。", "hints": ["它是一种性质", "它很危险", "它会损坏皮肤和金属"]}]}, {"title_zh": "反应魔法师", "title_en": "Reaction Wizard", "step": 5, "offset": 0, "items": [{"zh": "盐酸", "en": "hydrochloric acid", "aliases": ["氢氯酸"], "profile": "氯化氢气体溶在水里形成的强酸，人的胃液里就有少量它帮助消化。", "hints": ["它是一种液体", "它是一种酸", "它在胃液里也有"]}, {"zh": "氢氧化钠", "en": "sodium hydroxide", "aliases": ["烧碱", "火碱", "苛性钠"], "profile": "白色固体，是一种强碱，腐蚀性很强，工业上用于造纸、纺织等。", "hints": ["它是白色固体", "它是一种碱", "它腐蚀性很强"]}, {"zh": "中和反应", "en": "neutralization", "aliases": ["中和"], "profile": "酸和碱互相作用生成盐和水的反应，用熟石灰改良酸性土壤就用到它。", "hints": ["它是一种反应", "它和酸碱有关", "它会生成水"]}, {"zh": "酸碱度", "en": "pH", "aliases": ["pH值"], "profile": "表示溶液酸碱程度的数值，范围一般是0到14，7是中性。", "hints": ["它是一个数值", "它和酸碱有关", "它等于七时是中性"]}, {"zh": "指示剂", "en": "indicator", "aliases": ["酸碱指示剂"], "profile": "遇到酸或碱会变色的物质，能帮我们判断溶液的酸碱性。", "hints": ["它是一类物质", "它会变颜色", "它能判断酸碱性"]}, {"zh": "石蕊", "en": "litmus", "aliases": [], "profile": "从地衣中提取的紫色染料，遇酸变红、遇碱变蓝，常用作指示剂。", "hints": ["它和颜色有关", "它来自地衣", "它遇酸会变红"]}, {"zh": "酚酞", "en": "phenolphthalein", "aliases": [], "profile": "一种常用酸碱指示剂，遇碱变红，遇酸和中性溶液不变色。", "hints": ["它和颜色有关", "它平时是无色的", "它遇碱会变红"]}, {"zh": "溶液", "en": "solution", "aliases": [], "profile": "一种或几种物质分散到另一种物质里形成的均一、