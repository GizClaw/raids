# User Story:
# As a Raids catalog maintainer,
# I want equal opening, role and realtime responsiveness gates for every implementation,
# So that text and audio respond promptly without overlap or playback stalls.
version: gizclaw.test/v1alpha1
name: doubao-realtime.smoke.conversation
clients:
  doubao:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  doubao_realtime_workspace:
    direction: input
    type: string
    generate: token
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
repeat: 1
timeout: 12m
steps:
- id: doubao_register
  client: doubao
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: doubao_create_realtime
  client: doubao
  rpc:
    method: server.workspace.create
    request:
      name: "${doubao_realtime_workspace}"
      collection: assistants
      workflow_name: doubao-realtime
      parameters:
        doubao_realtime_workspace_parameters:
          agent_type: DOUBAO_REALTIME_WORKSPACE_PARAMETERS_AGENT_TYPE_DOUBAO_REALTIME
          input: WORKSPACE_INPUT_MODE_REALTIME
- id: doubao_select_realtime
  client: doubao
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${doubao_realtime_workspace}"
- id: doubao_warmup_realtime
  client: doubao
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: synthesize_input_audio
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 请记住：暗号是紫色灯塔，称呼我松果队长，我在计划周末露营，原本更喜欢轮船。请简短确认。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: input_audio
- id: doubao_turn_1_establish-context
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${input_audio}"
    pacing: 20ms
    require_text: true
    require_audio: true
    idle_timeout: 90s
  expect:
    "/text":
      contains_all:
      - 紫色灯塔
      min_length: 4
      max_length: 200
      non_empty: true
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
finally:
- id: doubao_stop_run
  client: doubao
  rpc:
    method: server.run.stop
    request: {}
- id: doubao_delete_realtime
  client: doubao
  rpc:
    method: server.workspace.delete
    request:
      name: "${doubao_realtime_workspace}"
- id: doubao_delete_peer
  client: doubao
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
