- id: ja_zh_ja_to_zh_turn_1_gratitude
  client: ja_zh_ja_to_zh
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ja_zh_ja_to_zh_audio}"
    pacing: 20ms
    require_text: true
    require_audio: true
    idle_timeout: 90s
  expect:
    "/text":
      contains_any:
      - 谢谢
      - 感谢
      - 感激
      - 谢意
      pattern: "\\p{Han}"
      max_length: 200
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/events":
      non_empty: true
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text_eos_ms":
      maximum: 90000
    "/audio_eos_ms":
      maximum: 90000
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/max_interval_ms":
      maximum: 150
    "/audio_pacing/underruns":
      equals: 0
- id: ja_zh_ja_to_zh_turn_1_gratitude_first_response
  client: ja_zh_ja_to_zh
  timeout: 15s
  peer_stream:
    mode: push-to-talk
    input: "${ja_zh_ja_to_zh_audio}"
    pacing: 20ms
    require_text: true
    require_audio: true
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
