    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: riddle-spirit_confirm_scene
  client: riddle-spirit
  timeout: 2m
  peer_stream:
    mode: text
    input: 现在处于哪个阶段或区域？请用当前场景名称回答。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      contains: 锁孔谜题
- id: probe_riddle-spirit
  client: riddle-spirit
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让谜题精灵亲自回应。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
