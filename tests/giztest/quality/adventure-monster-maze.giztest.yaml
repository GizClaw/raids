  - id: flowcraft_roles_probe_narrator
    client: flowcraft__roles
    peer_stream:
      mode: text
      input: 开始迷宫
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_roles_probe_narrator
    client: eino__roles
    peer_stream:
      mode: text
      input: 开始迷宫
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: flowcraft_routing_opening
    client: flowcraft__routing
    peer_stream:
      mode: text
