# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for eino-story-chu-han,
# So that each reachable role produces text and non-empty audio within the latency gates.
version: gizclaw.test/v1alpha1
name: story-chu-han.eino.roles
clients:
  narrator:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  xiang-yu:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  empress-lu:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  liu-bang:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  zhang-liang:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  narrator_workspace:
    direction: input
    type: string
    generate: token
  xiang_yu_workspace:
    direction: input
    type: string
    generate: token
  empress_lu_workspace:
    direction: input
    type: string
    generate: token
  liu_bang_workspace:
    direction: input
    type: string
    generate: token
  zhang_liang_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 36m
steps:
- id: register_narrator
  client: narrator
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: "${narrator_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-chu-han
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${narrator_workspace}"
- id: warmup_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_xiang-yu
  client: xiang-yu
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_xiang_yu_workspace
  client: xiang-yu
  rpc:
    method: server.workspace.create
    request:
      name: "${xiang_yu_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-chu-han
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_xiang_yu_workspace
  client: xiang-yu
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${xiang_yu_workspace}"
- id: warmup_xiang_yu_workspace
  client: xiang-yu
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_empress-lu
  client: empress-lu
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_empress_lu_workspace
  client: empress-lu
  rpc:
    method: server.workspace.create
    request:
      name: "${empress_lu_workspace}"
      collection: raidtest-targets
