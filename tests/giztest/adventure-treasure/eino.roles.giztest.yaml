          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_cartographer_workspace
  client: cartographer
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${cartographer_workspace}"
- id: warmup_cartographer_workspace
  client: cartographer
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: cartographer_scene_setup_1
  client: cartographer
  timeout: 2m
  peer_stream:
    mode: text
    input: 开始体验。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_cartographer
  client: cartographer
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让地图员亲自回应。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      not_contains:
      - 地图员说
      - 地图员：
- id: probe_cartographer_first_response
  client: cartographer
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让地图员亲自回应。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: register_codebreaker
  client: codebreaker
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_codebreaker_workspace
  client: codebreaker
  rpc:
