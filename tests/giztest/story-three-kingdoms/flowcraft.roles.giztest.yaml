- id: guan-yu_chapter_setup_26
  client: guan-yu
  timeout: 2m
  peer_stream:
    mode: text
    input: 请从第一章开始《三国乱世》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      contains: 第 1 章：营帐军情
- id: guan-yu_chapter_setup_27
  client: guan-yu
  timeout: 2m
  peer_stream:
    mode: text
    input: 我选择先帮助同伴并核对眼前线索，请推进一个直接结果。
