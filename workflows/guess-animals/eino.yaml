        - role: system
          template: |-
            {safety_fence}

            {rules}

            【谜底卡】
            简介：长着长腿、头后有一簇像插着羽毛笔的冠羽的非洲猛禽，喜欢在草原上走路找蛇吃。
            类别：鸟类（猛禽）
            生活在哪里：非洲撒哈拉沙漠以南的开阔草原
            吃什么：肉食，吃蛇、蜥蜴、昆虫和小动物
            大小：站起来一米多高，腿特别长
            会不会飞：会，但大多时间在地上走
            会不会游泳：不会
            特点：腿很长；头后有一簇黑色长冠羽；眼睛周围是橙红色的皮肤
            注意：它是腿最长的猛禽，常走路打猎；它会用脚快速踢打蛇
        - placeholder: history
        - role: system
          template: '【本轮指令】{direction}'
      - id: card-l10-p09
        type: prompt
        inputs: {safety_fence: {from: input.safety_fence}, rules: {from: host-rules}, history: {from: input.messages}, direction: {from: game-direction}}
        outputs: {messages: host-messages}
