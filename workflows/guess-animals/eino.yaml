狢獏畆畒畝畞畮瘼百皌目眜眽眿睦瞐瞙砞砪磨礳秣穆粖糢絈絔縸繆纆耱胟脈脉膜艒苜茉茻莈莯萺蓦藐藦蘑蚞蛨蟆蟔袜袹謨謩譕谟貃貈貉貊貌貘踇鄚鉧鉬銆鏌钼镆陌雮霂靺鞨鞪饃饝馍驀髍魔魩魹鶩麽默黙", "萤": "俓偀僌吋呎哩哽唡啢啨営嘤噟嚶塋夃央婴媖媵嫈嬰嬴孆孾嵤巆巊应廮影応愥應摬撄攍攖旲映景暎朠柍桜桯梬楹樱櫻櫿泂浧渶溁溋滎滢潁潆濙濚濴瀅瀛瀠瀯瀴灐灜焸煐熒營珱瑛瑩璎瓔甇甖甸瘿癭盁盈眏矨硬碤礯禜穎籝籯緓縈繩纓绬缨罂罃罌耺膡膺英茔荥荧莖莹莺营萦萾蓥藀蘡蛍蝇蝧蝿螢蠅蠳褮覮謍譍譻賏贏赢軈迎逞郢鍈鎣鐛鑍锳霙鞕韹韺頴颍颕颖鱦鴬鶑鶧鶯鷪鷹鸎鸚鹦鹰", "葵": "亏傀刲匮匱喟喹嘳夔奎媿嬇尯岿巋巙悝愦愧憒戣揆晆暌楏楑樻櫆欳歸殨溃潰煃犪盔睽瞆瞶磈窥窺篑簣籄缺聧聩聭聵胿腃膭臾蒉蒍蕢藈蘬蘷虁虧蝰觖謉跬踩蹞躨逵鄈鍨鍷鐀鑎闋闚隗頃頄頍頯顝餽饋馈馗騤骙魁鮭", "蒂": "仾低俤偙僀儥勺厎呧哋唙啇啲啻嘀嚁地坔坘坻埅埊埞堤墆墑墬奃娣媂嫡嵽嶳帝底廸弔弟弤彽怟慸扚抵拞掋提揥摕敌敵旳杓杕枤柢梊梑棣楴樀櫂氐浟涤渧滌滴焍牴狄玓珶甋疐的眱睇砥碮碲磾祶禘笛第篴籴糴約締缔羝翟聜肑胝腣芍苐苖茋荻莜菂菧蓧蔋蔐蔕藋藡蚳蝃螮袛覿觌觝詆諟諦诋谛豴赿趆踧踶蹄蹢軧迪逐递逓逮遞適遰邸釱鉪鍉鏑镝阺隄隶靮鞮頔題馰骶髢鬄魡鯳鸐", "蓝": "僋儖儠兰剌厱啉啦喇嚂嚹囒囕坔垃壈壏婪嬾孄孏岚嵐幱廩惏懒懔懢懶拉拦揦揧揽搚摺擥擸攋攔攬斓斕旯暕柆栏楋榄欄欖欗浨湅溂滥漣漤澜濫瀾灆灠灡烂煉燗燣燷爁爉爛爤爦璼瓎瓓瘌癩砬磖礷篮籃籣糷繿纜缆罱翋腊臈臘菈落葻藍藞蘫蘭蜡蝋蝲蠟褴襕襤襴襽覧覽览諫譋讕谰躝辢辣連邋郴醂鑞鑭钄镧镴闌阑鞡韊顲鬎鯻鱲", "虎": "乎乕乥乯互俿冱冴匢匫呼和唬唿喖嗀嗃嘑嘝嚛囫垀壶壷壺姱婟媩嫭嫮寣岵帍幠弖弧忽怘怙恗惚惡戏戯戲戶户戸戽扈抇护搰摢擭斛昈昒曶枑核楛楜槲槴欻歑汩汻沍沪泘洿浒淈淲淴湖滬滸滹濩瀫烀焀煳熩狐猢琥瑚瓠瓡瓳礐祜穫笏箎箶簄粐糊絗綔縎縠羽胍胡膴芐芔芦芴苦苸萀葫蔛蔰虍虖虝蝴螜衚觳觷許謼護许豰軤轷鄠醐鈷鋘錿鍙鍸隺雇雐雽韄頀頶餬鬍魱鯱鰗鱯鳠鳸鴩鵠鶘鶦鶮鶻鸌鹄鹕鹘鹱", "虫": "会佪偅傭僡僮儶充冲匯卉叀咴哕喙喠嘃嘒噅噕噦嚖囘回囬圚埫堕墮壞婎媈嬒孈宠寭寵屶屷崇崈幑廆廻廽彗彙彚徊徸徻徽忡恚恛恢恵悔惠慧憃憓憧懳戲拻挥揮揰摏撝晖晦暉暳會桧椲楎槥樁橞橦檅檓檜櫘殨毀毁毇汇沖沬泋洃洄浍浺涌涣湏溃滙漴潓潼澮濊瀈灰灳烛烜烠烣烩煇煒燬燴爞獩珫珲琿璤璯痋痐瘣皓盅眭睢睳瞺硊祌禈种秽種穢篲絵緟繢繪绘缋罿翀翙翚翬翽舂艟芔茧茴茺荟蒐蔧蕙薈薉藱蘬蘳虺蚘蛔蛕蜖蝩螝蟪蟲衝袆褈褘襘詯詼誨諱譓譭譮譿讳诙诲豗賄贿蹖蹱輝輠辉迴逥違酮重銃銊鏸鐬鑴铳闠阓隀隓隳靧鞼韋韢頮顪颒餯鮰鰴麾鼿", "虾": "丅下乤侠俠假傄匣厦叚吓呀呵呷呼哈哧唬嗄嗑嚇圷埉夏夓夾奤岈峡峽廈徦懗押捾搳敮斜昰暇柙梺欱歃毳浹炠烚煆狎狭狹獬珨瑕疜疨瘕睱瞎硖硤碬磍祫笚筪給縀縖罅翈舝舺芐葭蕸虲蛤蝦螛諕謑谺赮轄辖遐郃鉿鍜鎋鎼鏬铪閕閜陜陿霞颬騢魻鰕鶷黠", "蚁": "一丿乁乂义乊乙也亄亦亿仡以仪伇伊伿佁佗佚佾侇依俋倚偯儀億儗兿冝刈劓劮勚勩匇匜医印厭叕台叹吚听呓呭呹咦咿唈喦嗌噎噫囈圛圪圯坄坨垼埶埸墿壱壹夁夕失夷奇奕妷姨姬媐嫕嫛嬄嬑嬟孴它宐宜宧寱寲射尾屹峄峓崎崺嶧嶬嶷已巳巸帟帠幆庡廙异弈弋弌弬彛彜彝彞彵役忆忔怈怠怡怿恞悒悘悥意憶懌懿戲戺扅扆扡抑拸挹掎掜揖搋搤撎擇攺敡敼斁施旑旖易昳晹暆曀曎杙杝枍枻柂栘栧栺桋棭椅椬椸榏槷槸樴檍檥檹欥欭欹歖歝殔殪殹毅毉汽沂沶泄泆洢洩洫浂浥浳渏渫湙溢漪潩澤澺瀷炈焉焬焱焲熙熠熤熪熼燚燡燱犄狋狏猗獈玴珆瑿瓵畩異疑疙疫痍痬瘗瘞瘱癔益眙睪瞖矣硛硪礒礙祎禕秇移稦穓竩笖箷簃籎紲絏維綺縊繄繶繹绎缢羛羠羡義羿翊翌翳翼耛耴肄肊胰膉臆舣艗艤艺艾芅苅苡苢荑萓萟蓺薏藙藝蘙虉蛇蛜蛡蛦蛾蜴螔螘螠蟻衣衤衪衵袂袘袣裔裛裿褘褹襗襼觺訑訲訳詍詑詒詣誃誒誼謚謻譩譯議譺讉讛议译诒诣谊豙豛豷貖貤貽賹贀贻跇跠踦軼輗輢轙轶辥辷迆迤迭迱迻逘逸遗遺邑郼酏醫醳醷釋釔釴釶鈘鈠鉇鉈鉯銕銥錡鎰鏔鐿钀钇铱镒镱阣阤陁陭隶隿雉霅霬靉靾頉頤頥顊顗颐食飴饐饴駅驛驿骮鮧鮨鯣鳦鴺鶂鶃鶍鷁鷊鷖鷧鷾鸃鹝鹢鹥黓黝黟黳齮齸", "蚂": "么亇傌吗唛嗎嘛嘜嚜妈媽嫲嬤嬷孖抹摩杩榪溤犘犸獁玛瑪痲痳睰码碼礣祃禡罵蔴螞蟆蟇貉貊遤鎷閁靡馬駡驀马骂鬕鰢鷌麻麽", "蚓": "乑乚伒众侌傿冘凐印吟听吲唫喑噖噾嚚囙因圁圻垔垠垦垽堙堷壹夤姻婣婬寅尹峾崟崯嶾币廕廴引愔慇慭憖憗懚斦朄栶梀檃檭檼櫽欭欽歅殥殷氤沂泿洇洕淫淾湚湛湮溵滛潭潯濥濦烎烟犾狺猌玪珢璌瘖瘾癊癮硍碒磤禋秵窨筃粌絪緸縯胤芩苂茚茵荫荶蒑蔩蔭蘟螾蟫裀言訔訚訡訢誾諲讔赺趛輑鄞酓酳釿鈏鈝銀銦铟银闇闉阥阴陰陻隂隐隠隱霒霠霪靷鞇音韾飮飲饮駰骃鮣鷣齗齦龂龈", "蚕": "佃倎傪儏兲典参參叄叅吞唺喰嗔嘇噆囋塡填天奵娗婖嬠孱寘屇嵾忝恬悿惨惭慘慙慚憯戔捵掭掺搷摲摻撣晪朁栝殄残殘沗沺沾淟淺添湉湌滇澯灿燦爘琠瑱璨璳甛甜田甸町畇畋畑畠痶