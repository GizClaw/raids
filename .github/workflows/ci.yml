name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache-dependency-path: tools/raidtest/go.sum

      - name: Download GizClaw v0.5.2
        env:
          GIZCLAW_ASSET: gizclaw_0.5.2_amd64.deb
          GIZCLAW_SHA256: 873d9e2a7995b02f5005358bb58091867638fc6e065176f57935d9d0c2863a50
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/$GIZCLAW_ASSET"
          root="$RUNNER_TEMP/gizclaw-v0.5.2"
          curl --fail --location --retry 3 \
            --output "$package" \
            "https://github.com/GizClaw/gizclaw/releases/download/v0.5.2/$GIZCLAW_ASSET"
          printf '%s  %s\n' "$GIZCLAW_SHA256" "$package" | sha256sum --check --status
          dpkg-deb --extract "$package" "$root"
          printf 'GIZCLAW=%s\n' "$root/usr/bin/gizclaw" >> "$GITHUB_ENV"

      - name: Run repository checks
        env:
          CGO_ENABLED: "0"
        run: make ci
