  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${conseil_workspace}"
- id: warmup_conseil_workspace
  client: conseil
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_ned-land
  client: ned-land
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_ned_land_workspace
  client: ned-land
  rpc:
    method: server.workspace.create
    request:
      name: "${ned_land_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-twenty-thousand-leagues
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_ned_land_workspace
  client: ned-land
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${ned_land_workspace}"
- id: warmup_ned_land_workspace
  client: ned-land
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: 请由旁白承接当前故事，只推进一个可见线索。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_narrator_first_response
  client: narrator
  timeout: 15s
  peer_stream:
    mode: text
    input: 请由旁白承接当前故事，只推进一个可见线索。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: probe_nemo
  client: nemo
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让尼摩亲自回应，只说这个角色知道的事。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 尼摩说
      - 尼摩：
    "/text_eos":
