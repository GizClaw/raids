# User Story:
# As a real news podcast listener persona,
# I want to interrupt live narration, hear sustained playback after continuing, and ask again about the latest received news,
# So that native Giztest records two real question-answer exchanges and actual resumed narration between them.
version: gizclaw.test/v1alpha1
name: podcast-news.dialogue.eino
clients:
  podcast:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
  persona:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  podcast_workspace:
    direction: input
    type: string
    generate: token
  persona_workspace:
    direction: input
    type: string
    generate: token
  host_interest_question_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  listener_interest_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  heard_news_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  listener_question_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  host_answer_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  listener_interest:
    direction: output
    type: string
  listener_question:
    direction: output
    type: string
  host_answer:
    direction: output
    type: string
  resume_request_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  stop_request_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  heard_news_recent:
    direction: output
    type: string
  heard_resumed_news_recent:
    direction: output
    type: string
  recent_news_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  recent_resumed_news_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  listener_question_again:
    direction: output
    type: string
  listener_question_audio_again:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  host_answer_again:
    direction: output
    type: string
  host_answer_audio_again:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  resume_request_audio_again:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
repeat: 1
timeout: 20m
steps:
- id: podcast_register
  client: podcast
  rpc:
    method: server.register
    request:
      token: ${registration_token}
- id: podcast_create
  client: podcast
  rpc:
    method: server.workspace.create
    request:
      name: ${podcast_workspace}
      workflow_name: podcast-news
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
          safety_fence_level: 'off'
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
- id: podcast_select
  client: podcast
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: ${podcast_workspace}
- id: persona_register
  client: persona
  rpc:
    method: server.register
    request:
      token: ${registration_token}
- id: persona_create
  client: persona
  rpc:
    method: server.workspace.create
    request:
      name: ${persona_workspace}
      workflow_name: podcast-news-persona
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
          safety_fence_level: 'off'
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
- id: persona_select
  client: persona
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: ${persona_workspace}
- id: host_asks_listener_interest
  client: podcast
  timeout: 40s
  peer_stream:
    mode: text
    input: 开始
    require_text: true
    require_audio: true
  capture:
    host_interest_question_audio: /audio
  expect:
    /reply:
      pattern: '[0-9]{4}年[0-9]{1,2}月[0-9]{1,2}日[0-9]{1,2}点[0-9]{1,2}分'
      contains_all:
      - 科技
      - 国际
      - 北京时间
      - 程正声
      - 正声新闻
    /audio_integrity/max_active:
      equals: 1
    /audio_integrity/violations:
      equals: 0
- id: listener_answers_interest
  client: persona
  timeout: 90s
  peer_stream:
    mode: push-to-talk
    input: ${host_interest_question_audio}
    pacing: 20ms
    require_text: true
    require_audio: true
  capture:
    listener_interest: /reply
    listener_interest_audio: /audio
  expect:
    /reply:
      min_length: 4
      max_length: 12
      pattern: 科技|人工智能|航天|AI
      not_contains:
      - 测试
      - PASS
      - FAIL
    /transcript:
      pattern: 想.*听|方向|领域|话题
- id: continuous_news
  timeout: 270s
  parallel:
  - id: hear_continuous_news
    client: podcast
    peer_stream:
      mode: listen
      duration: 210s
  - id: start_continuous_news
    client: podcast
    delay: 250ms
    peer_stream:
      mode: push-to-talk
      input: ${listener_interest_audio}
      pacing: 20ms
      completion: first_response
      require_text: true
      require_audio: true
      first_text_timeout: 50s
      first_audio_timeout: 55s
  capture:
    heard_news_audio: /hear_continuous_news/audio
  expect:
    /hear_continuous_news/text:
      min_length: 100
      pattern: '[0-9]{1,2}月[0-9]{1,2}日'
      not_contains:
      - 缓存材料
      - EVENT
      - FACT|
      - COMMENT|
    /hear_continuous_news/streams:
      minimum: 1
      maximum: 2
    /hear_continuous_news/audio_bytes:
      minimum: 1
    /hear_continuous_news/last_event_ms:
      minimum: 205000
    /hear_continuous_news/audio_pacing/underruns:
      equals: 0
    /hear_continuous_news/audio_pacing/minimum_buffer_ms:
      minimum: 0
    /start_continuous_news/transcript:
      pattern: 科技|人工智能|航天|AI
    /start_continuous_news/reply:
      min_length: 20
    /start_continuous_news/audio_integrity/max_active:
      equals: 1
    /start_continuous_news/audio_integrity/violations:
      equals: 0
- id: first_interrupt_recent_audio
  client: podcast
  peer_stream:
    mode: listen
    duration: 20s
  capture:
    recent_news_audio: /audio
  expect:
    /audio_bytes:
      minimum: 1
    /last_event_ms:
      minimum: 18000
- id: first_interrupt_transcribe_recent_audio
  client: persona
  timeout: 45s
  speech:
    method: server.speech.transcribe
    request:
      model_name: asr
    input: ${recent_news_audio}
  capture:
    heard_news_recent: /transcript
  expect:
    /transcript:
      min_length: 12
- id: listener_asks_about_news
  client: persona
  timeout: 100s
  peer_stream:
    mode: text
    input: ${heard_news_recent}
    require_text: true
    require_audio: true
  capture:
    listener_question: /reply
    listener_question_audio: /audio
  expect:
    /reply:
      pattern: '[？?]|来源|计划|哪|是不是'
      max_length: 24
      not_contains:
      - 主持人仍在播报
      - 现在立刻用语音
      - 你刚听到
      - 测试
    /audio_bytes:
      minimum: 1
- id: host_answers_listener
  client: podcast
  timeout: 90s
  peer_stream:
    mode: push-to-talk
    input: ${listener_question_audio}
    pacing: 20ms
    require_text: true
    require_audio: true
  capture:
    host_answer: /reply
    host_answer_audio: /audio
  expect:
    /reply:
      min_length: 20
      not_contains:
      - 今日总览
      - 你想听科技
      - 好，先停在这里。
    /audio_bytes:
      minimum: 1
- id: listener_responds_to_answer
  client: persona
  timeout: 90s
  peer_stream:
    mode: push-to-talk
    input: ${host_answer_audio}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /reply:
      min_length: 2
      max_length: 8
      not_contains:
      - PASS
      - FAIL
      - 测试
      - 评分
    /audio_bytes:
      minimum: 1
- id: listener_requests_resume
  client: persona
  peer_stream:
    mode: text
    input: 继续
    require_text: true
    require_audio: true
  capture:
    resume_request_audio: /audio
  expect:
    /reply:
      contains_all:
      - 继续
- id: resume_news
  timeout: 180s
  parallel:
  - id: hear_resume_news
    client: podcast
    peer_stream:
      mode: listen
      duration: 120s
  - id: start_resume_news
    client: podcast
    delay: 250ms
    peer_stream:
      mode: push-to-talk
      input: ${resume_request_audio}
      pacing: 20ms
      completion: first_response
      require_text: true
      require_audio: true
      first_text_timeout: 50s
      first_audio_timeout: 55s
  expect:
    /hear_resume_news/text:
      min_length: 40
    /hear_resume_news/streams:
      minimum: 1
      maximum: 2
    /hear_resume_news/audio_bytes:
      minimum: 1
    /hear_resume_news/last_event_ms:
      minimum: 115000
    /hear_resume_news/audio_pacing/underruns:
      equals: 0
    /hear_resume_news/audio_pacing/minimum_buffer_ms:
      minimum: 0
    /start_resume_news/transcript:
      contains_all:
      - 继续
    /start_resume_news/audio_integrity/max_active:
      equals: 1
    /start_resume_news/audio_integrity/violations:
      equals: 0
- id: second_interrupt_recent_audio
  client: podcast
  peer_stream:
    mode: listen
    duration: 20s
  capture:
    recent_resumed_news_audio: /audio
  expect:
    /audio_bytes:
      minimum: 1
    /last_event_ms:
      minimum: 18000
- id: second_interrupt_transcribe_recent_audio
  client: persona
  timeout: 45s
  speech:
    method: server.speech.transcribe
    request:
      model_name: asr
    input: ${recent_resumed_news_audio}
  capture:
    heard_resumed_news_recent: /transcript
  expect:
    /transcript:
      min_length: 12
- id: listener_asks_about_news_again
  client: persona
  timeout: 100s
  peer_stream:
    mode: text
    input: ${heard_resumed_news_recent}
    require_text: true
    require_audio: true
  capture:
    listener_question_again: /reply
    listener_question_audio_again: /audio
  expect:
    /reply:
      pattern: '[？?]|来源|计划|哪|是不是'
      max_length: 24
      not_contains:
      - 主持人仍在播报
      - 现在立刻用语音
      - 你刚听到
      - 测试
    /audio_bytes:
      minimum: 1
- id: host_answers_listener_again
  client: podcast
  timeout: 90s
  peer_stream:
    mode: push-to-talk
    input: ${listener_question_audio_again}
    pacing: 20ms
    require_text: true
    require_audio: true
  capture:
    host_answer_again: /reply
    host_answer_audio_again: /audio
  expect:
    /reply:
      min_length: 20
      not_contains:
      - 今日总览
      - 你想听科技
      - 好，先停在这里。
    /audio_bytes:
      minimum: 1
- id: listener_responds_to_answer_again
  client: persona
  timeout: 90s
  peer_stream:
    mode: push-to-talk
    input: ${host_answer_audio_again}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /reply:
      min_length: 2
      max_length: 8
      not_contains:
      - PASS
      - FAIL
      - 测试
      - 评分
    /audio_bytes:
      minimum: 1
- id: listener_requests_resume_again
  client: persona
  peer_stream:
    mode: text
    input: 继续
    require_text: true
    require_audio: true
  capture:
    resume_request_audio_again: /audio
  expect:
    /reply:
      contains_all:
      - 继续
- id: resume_after_second_question
  timeout: 120s
  parallel:
  - id: hear_second_resume_news
    client: podcast
    peer_stream:
      mode: listen
      duration: 60s
  - id: start_second_resume_news
    client: podcast
    delay: 250ms
    peer_stream:
      mode: push-to-talk
      input: ${resume_request_audio_again}
      pacing: 20ms
      completion: first_response
      require_text: true
      require_audio: true
      first_text_timeout: 50s
      first_audio_timeout: 55s
  expect:
    /hear_second_resume_news/text:
      min_length: 40
    /hear_second_resume_news/streams:
      minimum: 1
      maximum: 2
    /hear_second_resume_news/audio_bytes:
      minimum: 1
    /hear_second_resume_news/last_event_ms:
      minimum: 55000
    /hear_second_resume_news/audio_pacing/underruns:
      equals: 0
    /hear_second_resume_news/audio_pacing/minimum_buffer_ms:
      minimum: 0
    /start_second_resume_news/transcript:
      contains_all:
      - 继续
    /start_second_resume_news/audio_integrity/max_active:
      equals: 1
    /start_second_resume_news/audio_integrity/violations:
      equals: 0
- id: listener_requests_stop
  client: persona
  timeout: 40s
  peer_stream:
    mode: text
    input: 停一下
    require_text: true
    require_audio: true
  capture:
    stop_request_audio: /audio
  expect:
    /reply:
      contains_all:
      - 停一下
- id: host_stops_on_listener_request
  client: podcast
  timeout: 40s
  peer_stream:
    mode: push-to-talk
    input: ${stop_request_audio}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /reply:
      contains_all:
      - 先停在这里
    /transcript:
      contains_all:
      - 停一下
    /audio_bytes:
      minimum: 1
- id: remains_quiet_after_stop
  client: podcast
  peer_stream:
    mode: listen
    duration: 5s
  expect:
    /audio_bytes:
      equals: 0
finally:
- id: podcast_stop
  client: podcast
  rpc:
    method: server.run.stop
    request: {}
- id: podcast_delete_workspace
  client: podcast
  rpc:
    method: server.workspace.delete
    request:
      name: ${podcast_workspace}
- id: podcast_delete_peer
  client: podcast
  rpc:
    method: server.peer.delete
    request: {}
- id: persona_stop
  client: persona
  rpc:
    method: server.run.stop
    request: {}
- id: persona_delete_workspace
  client: persona
  rpc:
    method: server.workspace.delete
    request:
      name: ${persona_workspace}
- id: persona_delete_peer
  client: persona
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
