"], "profile": "先刻好一个个单独的字，再按文章排成版来印刷，用完还能拆开重复使用。", "hints": ["它来自中国古代", "它和书有关", "它把字一个个分开刻"]}, {"zh": "二维码", "en": "QR code", "aliases": ["QR码"], "profile": "由许多黑白小方块组成的方形图案，用手机一扫就能读出里面的信息。", "hints": ["它和信息有关", "它是黑白相间的", "它要用手机扫一扫"]}, {"zh": "创可贴", "en": "adhesive bandage", "aliases": ["Band-Aid", "止血贴"], "profile": "中间带一小块干净纱布的小胶布，小伤口贴上它能得到保护。", "hints": ["它和医学有关", "它又小又轻", "它一面是黏黏的"]}, {"zh": "拉链", "en": "zipper", "aliases": ["拉锁", "zip"], "profile": "两排小齿咬合在一起、一拉就能打开或合上，常用在衣服和书包上。", "hints": ["它是一种日常用品", "它常在衣服和书包上", "它一拉就能合上"]}]}, {"title_zh": "点子收集家", "title_en": "Idea Collector", "step": 7, "offset": 0, "items": [{"zh": "手表", "en": "wristwatch", "aliases": ["腕表", "watch"], "profile": "戴在手腕上、随时都能看时间的小钟表。", "hints": ["它是一种日常用品", "它和时间有关", "它戴在手腕上"]}, {"zh": "电风扇", "en": "electric fan", "aliases": ["风扇", "电扇"], "profile": "用电让几片扇叶飞快转动、吹出凉风的家用电器。", "hints": ["它要用电", "它有几片叶片", "它能吹出风来"]}, {"zh": "橡皮", "en": "eraser", "aliases": ["橡皮擦", "rubber"], "profile": "用橡胶或塑料做成的小块文具，能擦掉铅笔写错的字。", "hints": ["它是一种文具", "它软软的", "它能让字消失"]}, {"zh": "气球", "en": "balloon", "aliases": [], "profile": "用薄薄的橡胶做成、吹进气后会鼓起来的小玩具，常用来装饰派对。", "hints": ["它是一种玩具", "它有很多颜色", "它吹气后会变大"]}, {"zh": "手电筒", "en": "flashlight", "aliases": ["手电", "电筒", "torch"], "profile": "装着电池、拿在手里就能照亮前方的小灯。", "hints": ["它和光有关", "它可以拿在手里", "它适合在黑暗里用"]}, {"zh": "摩托车", "en": "motorcycle", "aliases": ["摩托", "机车"], "profile": "有两个轮子、靠发动机带动的交通工具，骑起来比自行车快得多。", "hints": ["它是一种交通工具", "它有发动机", "它通常只有两个轮子"]}, {"zh": "机器人", "en": "robot", "aliases": [], "profile": "能按照程序自动完成各种工作的机器，有的像人，有的像手臂或小车。", "hints": ["它要用电", "它能自动干活", "它有的长得像人"]}, {"zh": "计算器", "en": "calculator", "aliases": [], "profile": "按下数字和符号键，就能马上算出结果的小机器。", "hints": ["它和数学有关", "它有很多按键", "它能帮你算数"]}, {"zh": "算盘", "en": "abacus", "aliases": [], "profile": "用木框串着一颗颗珠子、拨动珠子来计算的古老工具。", "hints": ["它和数学有关", "它很古老", "它上面有很多珠子"]}, {"zh": "烟花", "en": "fireworks", "aliases": ["烟火", "焰火"], "profile": "点燃后飞上天空炸开、放出五颜六色光芒的节日庆祝用品。", "hints": ["它来自中国古代", "它常在节日出现", "它会在夜空里开花"]}, {"zh": "显微镜", "en": "microscope", "aliases": [], "profile": "用几片镜片把很小很小的东西放大许多倍、让人看清的仪器。", "hints": ["它是一种仪器", "它有好几片镜片", "它能看清很小的东西"]}, {"zh": "望远镜", "en": "telescope", "aliases": ["千里镜"], "profile": "用镜片或镜子收集光线、让远处的东西看起来又大又清楚的仪器。", "hints": ["它是一种仪器", "它和光有关", "它能看清很远的东西"]}, {"zh": "微波炉", "en": "microwave oven", "aliases": ["microwave"], "profile": "用微波让食物里的水分子快速振动发热，很快就能把饭菜热好的厨房电器。", "hints": ["它要用电", "它常放在厨房里", "它能很快把饭热好"]}, {"zh": "方便面", "en": "instant noodles", "aliases": ["泡面", "速食面"], "profile": "提前煮熟再弄干的面饼，用开水一泡几分钟就能吃的食品。", "hints": ["它是一种食物", "它做起来很快", "它要用开水泡"]}, {"zh": "地铁", "en": "subway", "aliases": ["地下铁", "metro"], "profile": "大部分在城市地下隧道里行驶的列车，不怕堵车，能快速运送很多乘客。", "hints": ["它是一种交通工具", "它在城市里", "它大多在地下跑"]}, {"zh": "玻璃", "en": "glass", "aliases": [], "profile": "用沙子等原料高温熔化后做成的透明材料，常用来做窗户、杯子和镜片。", "hints": ["它是一种材料", "它大多是透明的", "它摔了容易碎"]}]}, {"title_zh": "发现小达人", "title_en": "Discovery Whiz", "step": 7, "offset": 0, "items": [{"zh": "蒸汽机", "en": "steam engine", "aliases": [], "profile": "烧煤把水烧成蒸汽、用蒸汽推动机器运转的动力机器，带来了工业革命。", "hints": ["它是一种机器", "它和能源有关", "它要把水烧开"]}, {"zh": "互联网", "en": "Internet", "aliases": ["因特网"], "profile": "把全世界的电脑和手机连在一起的巨大网络，让人们能随时传递信息。", "hints": ["它和信息有关", "它把很多设备连在一起", "它能让你上网"]}, {"zh": "丝绸", "en": "silk", "aliases": ["蚕丝"], "profile": "用蚕吐出的丝织成的光滑柔软的布料，古代经丝绸之路运到很远的地方。", "hints": ["它来自中国古代", "它摸起来很光滑", "它和蚕宝宝有关"]}, {"zh": "瓷器", "en": "porcelain", "aliases": ["瓷"], "profile": "用特殊的黏土高温烧成的器物，又白又硬又光滑，英文里它和“中国”是同一个词。", "hints": ["它来自中国古代", "它要用高温烧制", "它常被做成碗和花瓶"]}, {"zh": "塑料", "en": "plastic", "aliases": [], "profile": "用石油等原料人工合成的材料，轻便又能做成各种形状，但很难自然分解。", "hints": ["它是一种材料", "它又轻又便宜", "它很难自然分解"]}, {"zh": "热气球", "en": "hot air balloon", "aliases": [], "profile": "把球囊里的空气加热，让热空气把人和吊篮一起带上天空的飞行器。", "hints": ["它能飞上天", "它下面挂着吊篮", "它靠加热空气升起"]}, {"zh": "魔术贴", "en": "Velcro", "aliases": ["尼龙搭扣", "粘扣带", "hook and loop"], "profile": "一面是小钩子、一面是小绒圈，一按就粘住、一撕就分开的扣子。", "hints": ["它是一种日常用品", "它常用在鞋子上", "它一按就粘住了"]}, {"zh": "圆珠笔", "en": "ballpoint pen", "aliases": ["原子笔"], "profile": "笔尖装着一颗小钢珠，写字时钢珠滚动把油墨带到纸上的笔。", "hints": ["它是一种文具", "它不用蘸墨水", "它的笔尖有颗小珠子"]}, {"zh": "细菌", "en": "bacteria", "aliases": [], "profile": "只有一个细胞、小到要用显微镜才能看见的微小生物，有的有益，有的会让人生病。", "hints": ["它是一项发现", "它非常非常小", "它到处都有"]}, {"zh": "风车", "en": "windmill", "aliases": [], "profile": "靠风吹动大大的叶片转动、用来磨面粉或抽水的机器，荷兰的最有名。", "hints": ["它是一种机器", "它靠风来工作", "它有几片大叶片会转"]}, {"zh": "轮船", "en": "steamship", "aliases": ["汽船", "蒸汽船"], "profile": "用蒸汽机等发动机带动、不用靠风帆和划桨就能航行的大船。", "hints": ["它是一种交通工具", "它在水上行驶", "它不用靠风帆"]}, {"zh": "高铁", "en": "high speed rail", "aliases": ["高速铁路", "高速列车", "bullet train"], "profile": "在专门修建的铁路上，以每小时200公里以上的速度飞驰的列车。", "hints": ["它是一种交通工具", "它要用电", "它跑得特别快"]}, {"zh": "鼠标", "en": "computer mouse", "aliases": ["滑鼠", "mouse"], "profile": "握在手里在桌上移动，就能控制电脑屏幕上箭头的小设备。", "hints": ["它和电脑有关", "它常放在桌子上", "它可以握在手里"]}, {"zh": "疫苗", "en": "vaccine", "aliases": [], "profile": "帮助身体提前认识病菌、学会抵抗它们的医学发明，打了它就不容易得某些病。", "hints": ["它和医学有关", "它能保护身体", "它常要打一针"]}, {"zh": "保温瓶", "en": "vacuum flask", "aliases": ["暖水瓶", "热水瓶", "保温杯", "thermos"], "profile": "瓶胆有两层、中间抽成真空，能让热水长时间保持热、冷饮保持冷的容器。", "hints": ["它是一种日常用品", "它不用电", "它能让水一直热乎乎的"]}]}, {"title_zh": "实验室助手", "title_en": "Lab Assistant", "step": 7, "offset": 0, "items": [{"zh": "电报", "en": "telegraph", "aliases": [], "profile": "用电线把电信号从一个地方传到另一个地方，再翻译成文字的通信方法。", "hints": ["它和通信有关", "它要用电", "它比电话出现得早"]}, {"zh": "盲文", "en": "Braille", "aliases": ["点字", "布莱尔盲文"], "profile": "用纸上凸起的小圆点组成字母，让看不见的人用手指摸着读的文字。", "hints": ["它和文字有关", "它由小圆点组成", "它要用手指去读"]}, {"zh": "邮票", "en": "postage stamp", "aliases": ["stamp"], "profile": "贴在信封上、表示已经付过邮费的小纸片，上面常印着漂亮的图案。", "hints": ["它和通信有关", "它是一张小纸片", "它常贴在信封上"]}, {"zh": "阿拉伯数字", "en": "Arabic numerals", "aliases": ["印度阿拉伯数字"], "profile": "从0到9的十个数字符号，今天全世界都用它们来写数和计算。", "hints": ["它和数学有关", "它一共有十个", "它写数时天天会用到"]}, {"zh": "细胞", "en": "cell", "aliases": [], "profile": "组成生物身体的最小单位，就像盖房子用的一块块砖，要用显微镜才能看见。", "hints": ["它是一项发现", "它和生物有关", "它非常小"]}, {"zh": "人造卫星", "en": "artificial satellite", "aliases": ["卫星", "satellite"], "profile": "被火箭送上太空、绕着地球不停转圈的机器，能帮我们通信、导航和看天气。", "hints": ["它是人造的机器", "它在太空中", "它绕着地球转"]}, {"zh": "听诊器", "en": "stethoscope", "aliases": [], "profile": "医生挂在脖子上、贴在胸口就能听到心跳和呼吸声的医疗工具。", "hints": ["它和医学有关", "它和声音有关", "它常挂在医生脖子上"]}, {"zh": "直升机", "en": "helicopter", "aliases": ["直升飞机"], "profile": "靠头顶的大旋翼转动升空的飞行器，能垂直起降，还能停在空中不动。", "hints": ["它能飞上天", "它能停在半空中", "它头顶有大螺旋桨"]}, {"zh": "地动仪", "en": "seismoscope", "aliases": ["候风地动仪"], "profile": "东汉张衡制造的仪器，能测出远方发生地震的大致方向。", "hints": ["它来自中国古代", "它是一种仪器", "它身上有八条龙"]}, {"zh": "日晷", "en": "sundial", "aliases": [], "profile": "靠太阳照出的影子落在刻度盘上的位置来看时间的古老计时工具。", "hints": ["它很古老", "它和时间有关", "它离不开太阳"]}, {"zh": "条形码", "en": "barcode", "aliases": ["条码"], "profile": "由一组粗细不同的黑白条纹组成，扫描一下就能读出商品信息。", "hints": ["它和信息有关", "它是黑白相间的", "它常印在商品包装上"]}, {"zh": "缝纫机", "en": "sewing machine", "aliases": [], "profile": "用针和线自动把布料缝在一起的机器，做衣服比手工快很多。", "hints": ["它是一种机器", "它和衣服有关", "它用针和线干活"]}, {"zh": "留声机", "en": "phonograph", "aliases": ["唱机"], "profile": "能把声音录下来再放出来的机器，是第一台既能录音又能放音的机器。", "hints": ["它是一种机器", "它和声音有关", "它有一个大喇叭"]}, {"zh": "青霉素", "en": "penicillin", "aliases": ["盘尼西林"], "profile": "从青霉菌里找到的一种药，能杀死让人生病的细菌，救了无数人的生命。", "hints": ["它和医学有关", "它来自一种霉菌", "它能对付细菌"]}, {"zh": "X射线", "en": "X-ray", "aliases": ["X光", "伦琴射线"], "profile": "一种眼睛看不见、能穿透人体的射线，医生用它拍片子，看到身体里的骨头。", "hints": ["它是一项发现", "它眼睛看不见", "它能照出骨头"]}]}, {"title_zh": "灵感工程师", "title_en": "Idea Engineer", "step": 5, "offset": 0, "items": [{"zh": "杂交水稻", "en": "hybrid rice", "aliases": [], "profile": "用两种不同的水稻培育出的新品种，产量高得多，让更多人能吃饱饭。", "hints": ["它和粮食有关", "它来自中国", "它长在稻田里"]}, {"zh": "光合作用", "en": "photosynthesis", "aliases": [], "profile": "绿色植物利用阳光，把二氧化碳和水变成养分并放出氧气的过程。", "hints": ["它是一项发现", "它和植物有关", "它需要阳光"]}, {"zh": "维生素", "en": "vitamin", "aliases": ["维他命"], "profile": "人体需要得很少但不能缺少的一类营养物质，多吃蔬菜水果就能获得很多种。", "hints": ["它和营养有关", "它有很多种", "它藏在蔬菜水果里"]}, {"zh": "电子邮件", "en": "email", "aliases": ["电邮", "e-mail"], "profile": "通过网络发送的信件，几秒钟就能送到世界另一头的人手里