# User Story:
# As a Raids catalog maintainer,
# I want every available story-water-margin implementation to complete the same bounded Tester relay,
# So that chapter, correction, reload, role, and continuity behavior remain reproducible.
version: gizclaw.test/v1alpha1
name: story-water-margin.soak.eino.multi-role
clients:
  eino_multi_role:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_multi_role_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  multi_role_test_brief:
    direction: input
    type: string
    value: |-
      BEGIN flowcraft-story-water-margin-multi-role long-form-story
      孩子自然参与多角色有声故事：选择、改选、追问、角色对话、插话、重听、记名回忆及危险模仿。普通回复中文200至900字符或英文100至450词，末尾一个故事内选择；仅回忆、确认、安全可短至4至360字符。无角色标记或流程口令，接力须推进且不循环。
  eino_multi_role_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_multi_role_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_multi_role_verdict:
    direction: output
    type: string
repeat: 1
timeout: 180m
steps:
- id: eino_multi_role_register_candidate
  client: eino_multi_role
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_multi_role_register_tester
  client: eino_multi_role_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_multi_role_create_candidate_workspace
  client: eino_multi_role
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_multi_role_candidate_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-water-margin-multi-role
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_multi_role_create_tester_workspace
  client: eino_multi_role_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_multi_role_tester_workspace}"
      collection: raidtest-testers
      workflow_name: story-water-margin-test-multi-role
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_multi_role_select_candidate_workspace
  client: eino_multi_role
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_multi_role_candidate_workspace}"
- id: eino_multi_role_warmup_candidate_workspace
  client: eino_multi_role
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_multi_role_select_tester_workspace
  client: eino_multi_role_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_multi_role_tester_workspace}"
- id: eino_multi_role_relay_responses_1_8
  timeout: 32m
  workspace_relay:
    first_client: eino_multi_role_tester
    second_client: eino_multi_role
    input: "${multi_role_test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 17
    terminal_client: eino_multi_role_tester
  expect:
    "/terminal/client":
      equals: eino_multi_role_tester
    "/terminal/text":
      pattern: "^\\s*CHECKPOINT PASS\\s*$"
    "/completed_turns":
      equals: 17
    "/turns/eino_multi_role/count":
      equals: 8
    "/turns/eino_multi_role_tester/count":
      equals: 9
    "/turns/eino_multi_role/first_text_ms/max":
      maximum: 6000
    "/turns/eino_multi_role/text_runes/min":
      minimum: 4
    "/turns/eino_multi_role/text_runes/max":
      maximum: 900
- id: eino_multi_role_recall_barrier
  client: eino_multi_role
  rpc:
    method: server.run.workspace.recall
    request:
      query: 月光七码
  timeout: 60s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: eino_multi_role_reload_candidate_workspace
  client: eino_multi_role
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: eino_multi_role_relay_responses_9_16
  timeout: 32m
  workspace_relay:
    first_client: eino_multi_role_tester
    second_client: eino_multi_role
    input: CONTINUE 8
    media: text
    idle_timeout: 90s
    max_turns: 17
    terminal_client: eino_multi_role_tester
  capture:
    eino_multi_role_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: eino_multi_role_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 17
    "/turns/eino_multi_role/count":
      equals: 8
    "/turns/eino_multi_role_tester/count":
      equals: 9
    "/turns/eino_multi_role/first_text_ms/max":
      maximum: 6000
    "/turns/eino_multi_role/text_runes/min":
      minimum: 4
    "/turns/eino_multi_role/text_runes/max":
      maximum: 900
- id: eino_multi_role_emit_verdict
  output:
    variable: eino_multi_role_verdict
finally:
- id: eino_multi_role_stop_candidate_run
  client: eino_multi_role
  rpc:
    method: server.run.stop
    request: {}
- id: eino_multi_role_stop_tester_run
  client: eino_multi_role_tester
  rpc:
    method: server.run.stop
    request: {}
- id: eino_multi_role_delete_candidate_workspace
  client: eino_multi_role
  rpc:
    method: server.workspace.delete
    request:
      name: "${eino_multi_role_candidate_workspace}"
- id: eino_multi_role_delete_tester_workspace
  client: eino_multi_role_tester
  rpc:
    method: server.workspace.delete
    request:
      name: "${eino_multi_role_tester_workspace}"
- id: eino_multi_role_delete_candidate_peer
  client: eino_multi_role
  rpc:
    method: server.peer.delete
    request: {}
- id: eino_multi_role_delete_tester_peer
  client: eino_multi_role_tester
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
