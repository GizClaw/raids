- id: warmup_artisan_workspace
  client: artisan
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: artisan_scene_setup_1
  client: artisan
  timeout: 2m
  peer_stream:
    mode: text
    input: 开始体验。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
