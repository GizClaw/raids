# workflows/story-tom-sawyer/README.md: 角色表：narrator 旁白，只叙述可见事实和公开信息、不代演角色；tom 汤姆（别名 汤姆/汤姆索亚/tom），第1至4章在场，想体验冒险又怕承认错误；天真机灵，第1章提出探索路线，第4章承认责任；becky 贝琪（别名 贝琪/becky），第1至4章在场，想与伙伴互相信任；活泼细心，第1章提醒做好标记，第3章观察安全出口；huck 哈克（别名 哈克/哈克贝利/huck），第2至3章在场，想自由探索也想保护朋友；清爽直接，第2章指认河岸足迹，第3章提议结伴返回而非独自深入，随后回镇报平安；aunt-polly 波莉姨妈（别名 波莉姨妈/波莉/姨妈/aunt-polly），第4至4章在场，想让孩子安全回家并学会负责；和蔼而有原则，第4章听取经过，要求汤姆向担心的家人说明并补做承诺。以上四章互动行动为本仓库基于经典的原创改编，并非原典逐字情节；历史、传说与改编须区分。所有角色只知亲历或已公开信息，不知他人私密想法及未来结果；每章比较至少两种立场，无需全员轮番发言。离场者只能由旁白说明去向，不跨地点代言。
# workflows/story-tom-sawyer/README.md: 旧记忆中的角色名单按当前章节和角色表重新归一化，不覆盖旅程代号、更正和进度。开场、转场（含阻塞）、更正、安全管理优先旁白；其次按文本顺序选第一个明确点名且在场的角色，否定点名不触发，否则旁白。只报角色名或“我支持某人”是玩家选择。每轮一人直接第一人称发言，不加说话人标签，旁白不代演。
# workflows/story-tom-sawyer/README.md: `routing-cases.json` 离线执行真实 JS / Starlark，覆盖点名、否定、顺序、章节出场、只报名字、管理优先、旧状态恢复与转场。离线门禁不等于在线音色验收；实际选中 Voice 仍需运行日志与试听确认。
