: "估俈傦僱凅刳告呱呴咕哌哭唂唃啒喾嗗嘏嚳固圐圣堀堌夃姑嫴孤家尳崓崫崮库庫廤怘愲扝扢挎捁掘搰故朏枯柧桍梏棝楛榖榾橭櫎毂汩沽泏泒淈滑濲瀔焅焸牯牿狜瓠痼瘔皋皷皼盬瞽矻硞磆祻秙稒穀窋窟笟箍箛篐糓絝縎绔罛罟羖股胍脵臌苦苽菇菰蓇薣蛄蛊蛌蠱袴裤褲角觚詁诂谷賈贾趶跍跨軱軲轂轱辜逧郀酤酷鈲鈷錮钴锢雇離顧顾餶馉骨骰骷鮕鮬鯝鲴鴣鵠鶻鸪鹄鹘鼓鼔齁", "可": "个介仡佫佮個假克刻剋割勀勊匌匼各合吤呄呵咯咳哥哿喀嗑嗝嗰嘅噶圪坷堁塥壳娔客尅屹岢峇嵑嵙嶱彁恪悈愅愘愙戈戓戨扢挌揢搁搕搿擖擱敋敤杚柯格棵榼槅樖櫊歁歌殼毼氪浩渇渴溘滆滒濭炣牁牫牱犐犵猲獦珂疙疴痾盍盖瞌砝砢硌硞碣碦磆磕礊礚科秴稞窠窼箇簻紇緙纥缂翗肐胢胳膈臈臵舸艐苛茖菏萪葛蓋薖虼蚵蛒蛤蝌袔袼裓觡詥課諽謌课趷軻輵轕轲醘鈳鉀鉻鉿錁錒鎑鎘鎶钶铬锞镉閘閣閤阁隔革鞈鞷韐韚頜頦顆颌颏颗饹騍騔骒骼髁髂鬲魺鮥鮯鰪鴐鴚鴿鵅鸽龕鿔", "台": "一丝丿乁乂义乊乙也亄亖亦亿仡以仪伇伊伺似伿佀佁佗佚佾侇依価俋俟俬倚偯偲傂儀億儓儗儩兕兿冝冭凘刈劓劮勚勩匇匜医印厕厭厮厶叕司叹吚听呓呔呭呹咍咝咦咿唈喦嗌嗣嘶噎噝噫囈四囼圛圪圯坄坨坮垼埶埸墿壱壹夁夕大太失夳夷奇奕奤妷姒姨姬娰媐媤嫕嫛嬄嬑嬟嬯孠孡孴它宐宜宧寱寲寺射尾屹峄峓崎崺嶧嶬嶷已巳巸帟帠幆庡廁廙廝异弈弋弌弬彛彜彝彞彵役徙忆忔忕忲态怈思怠怡怿恖恞悒悘悥意愢態憶懌懿戲戺扅扆扡抑抬拸挹掎掜揖搋搤撎撕擇擡攺敡敼斁斄斯施旑旖旲易昳晹暆曀曎杙杝杫枍析枱枻柂柶栘栧栺桋梩棭椅椬椸楒榏榹槷槸樴檍檥檯檹欥欭欹歖歝死殔殪殹毅毉汏汜汰汽沂沶泀泄泆泗泤泰洍洢洩洫浂浥浳涘渏渫湙溙溢漦漪潩澌澤澺瀃瀷炈炱炲焉焬焱焲熙熠熤熪熼燍燚燡燤燱牭犄狋狏猗獈玴珆瑿瓵畩異疑疙疫痍痬瘗瘞瘱癔益眙睪瞖矣硛硪磃礒礙祀祎祠禕禗禠禩私秇移稦穓竢竩笖笥箈箷簃簛籉籎籭粏糸糹紲絏絲維綺緦縊繄繶繹纟绎缌缢罳羛羠羡義羿翊翌翳翼耛耜耴肂肄肆肊肽胎胰能膉臆臺舣舦艗艤艺艾芅苅苔苡苢荑菥菭萓萟蓺蕬蕼薏薹藙藝蘙虉虒蚁蛇蛜蛡蛦蛳蛾蜤蜴螄螔螘螠蟖蟴蟻衣衤衪衵袂袘袣裔裛裿褘褹襗襼覗觺訑訲訳詍詑詒詣誃誒誼謕謚謻譩譯議譺讉讛议译诒诣谊豙豛豷貄貖貤貽賹贀贻跆跇跠踦軼輗輢轙轶辥辷迆迤迭迱迻逘逸遗遺邑邰郼酏酞醫醳醷釋釐釔釲釴釶鈘鈠鈦鈶鈻鉇鉈鉯鉰銉銕銥銯鋖錡鍶鎰鏔鐁鐿钀钇钛铱锶镒镱阣阤陁陭隶隿雉霅霬靉靾頉頤頥顊顗颐颱颸飔食飤飴飼饐饲饴駅駘駟騃騦驛驷驿骀骮鮐鮧鮨鯣鲐鳦鴺鶂鶃鶍鷁鷉鷊鷖鷥鷧鷾鸃鸶鹝鹢鹥麗黓黝黟黳鼶齮齸", "史": "世丗乨乭亊事什仕似佦使侍兘冟势勢匙十卋厔叓呞呩咶唑啇嗜嘘噬埘埶堤塒士失奭始姼媞嬕实実室宩宲寔實寺尸屍屎峕峙崼嵵市师師式弑弒彖徥忕忯恀恃惿戺拭拾挈提揓斯施时旹是昰時枾柹柿栻楴榁榯檡殖殺氏汁沶浉液湜湤湿溡溮溼澤澨濕灑炻烒煶狧狮狶獅瑡畤痑眂眎眡睗矢石示礻祏秲竍笶筮箷篒篩簭籂絁繹耆肢舍舐舓莳葹蒒蒔蓍虱蚀蝕蝨螫褆褷襫襹視视觢訑試詩誓諟諡謚識识试诗谥豉豕貰贳赫跩踶軾轼辻适逝遈遞適遰遾邿郝酾醳釃釈释釋釶鈰鉂鉃鉇鉈鉐鉽銴鍉鍦鎩铈食飠飭飾餙餝饣饰馶駛驶魳鮖鯴鰘鰣鰤鲥鲺鳲鳾鶳鸤鼫鼭齛", "叶": "业也些亪亱亵伳倻偕偞偰僁僷儶写冩冶劦勰协協卨卸吔吤咽唏啘喈喝嗋嘢噎噧嚈垥埜堨塮墅墷壄夑夜夾奊契娎媟孈寫射屑屓屟屧峫嶪嶫嶰廨徢恊愶慀懈懕抴拹拽挟挾捓捙掖接揞揲揳揶搚携摺撷擕擖擛擨擪擫擷攜斜旪晔暍暬曄曅曗曳曵枒枻枼枽桔梋械椰楔楪業榍榝榭槷檞欸歇歋歙殕殗殺汁泄泻洂洇洩涂液渫湝溉滊漜潰潱澥澲瀉瀣灺炧炨烨烲焆焎煠熀熁燁燮燲爕爗爷爺猲獦獬瑎璍瓛痷皣眭瞱瞸碿礏祄禼窫糏紲絏絜絬綊緤緳繲纈绁缬缷翓耶聶胁脅脇脋腋膎苴荼葉薢薤藛虵蝎蝑蝢蟹蠍蠏蠮蠱血衺裌褉褻襭觟解諜諧謁謝譮讗谐谒谢豫跬躞躠迦邂邪邺鄓鄴野釶釾鋣鍱鎁鎑鐷铘隰靥靨鞋鞢鞵韰頁頡页颉餘餣饁饐馌驜骱鬹魼鮭鲑鵺鸈黦齂齘齛齥龤", "吉": "丌丮乁乩亟亼亽伋伎佶倚偈偮僟其兾冀几击刉刏剂剞剤劑勣卙卟即卽厝及叝叽吇呰咭哜唧喞嗘嘰嚌圾坖垍基堲塈塉墼奇妀妓姞姫姬姼嫉季寂寄尐居屐屰岋岌峜嵆嵇嵴嶯己帺幾庴廭彐彑彶徛忌忣急悸惎愱憿懠懻戟戢技挤掎揖揤撃撠撽擊擠攲敧旡既旣暨暩曁朞期机极枅梞棋棘楖楫極槉槣樭機橶檕檝檵櫅櫭殛毄汥汲泲洁洎济淁済湒漃漈潗激濈濟瀱焏犄犱狤猗玑璣璾畟畸畿疵疾痵瘠瘵癠癪皀皍睽瞉瞿矶磯祭禝禨积秸稘稩稷稽穄穊積穖穧笄笈筓箕箿簊簎籍粢系紀紒級結給継緝績繋繫繼级纪给继绩缉罽羁羇羈耤耭肌胔脊脔脨膌臮艥艻芨芰苙茍茤荠莋萁葪蒩蒺蓟蓻蔇蕀蕺薊薺藉蘄蘎蘮蘻虀虮蜡蝍螏蟣蟻蟿蠀裚襀襋覉覊覘覬覿觊觙觭計訐記誋諅諔譏譤计讥记诘谻谿賫賷赍趌趞跂跡跻跽踑踖踦蹐蹟躋躤躸輯轚辑迹郅郆鄿銈銡錤鍓鏶鐖鑇鑙际隔際隮集雞雦雧霁霵霽革鞊鞿韲颳飢饑饥騎驥骥髻鬾魕魝魢魥鮆鯚鯽鰶鰿鱀鱭鱾鲚鲫鳮鵋鶏鶺鷄鷑鸄鸡鹡麂齊齌齍齎齏齐齑", "吐": "余兎兔凃凸唋啚図图圕圖圗土圡堍堗塗墿宊屠峹嵞嶀庩廜徒怢悇捈捸揬摕斁杜梌檡汢涂涋湥潳瑹痜瘏禿秃稌突筡腞腯荼莵菟葖蒤趃跌跿迌途酴釷鈯鋀鋵鍎钍馟駼鵌