筀簂簋繪胿膭茥蓕蘬蛫螝蟡袿襘規规觖觤詭謉譌诡貴贵赽趹跪蹶軌轨邽郌鐀閨闺陒隗鞼騩鬶鬹鮭鱖鱥鲑鳜鳺鴂龜龟", "魔": "万么伯佰冒劘劰勿唜嗼嘿嚤嚩嚰圽塻墨妺嫫嫼嬷寞尛帓帕帞庅怽懡戂抹摩摸摹撫擵攠无昧昩暯末枺模橅歾歿殁没沫湐漠瀎無爅狢獏瘼百皌眜眽眿瞐瞙砞磨礳秣粖糢絈絔縸纆耱脈脉膜艒茉莈莫蓦藐藦蘑蛨蟆蟔袜袹謨謩譕谟貃貈貉貊貌貘鄚銆鏌镆陌靺鞨饃饝馍驀髍魩魹麽默黙", "鮟": "侒俺儑匼厂厈咹唵啽垵垾埯堓婩媕安屽岸峖干广庵按揞晻暗案桉氨洝犴玵痷盒盦盫碪罯胺腤荌菴萻葊蓭裺誝諳谙豻貋遃鉗銨錌铵闇陰隌雸鞌鞍韽頇頞馣鴳鵪鶕鹌黯鿷", "鱇": "亢伉匟囥坑奋嫝嵻康忼慷扛抗摃杭槺沆漮炕犺砊穅粇糠羫荒躿邟鈧鏮钪閌闶阬骯", "鱼": "丂与乻予于亏亐伃伛余俁俞俣俼偊傴僪儥兪匬吁吳吾唷唹喁喅喐喩喻噊噢噳圄圉圩圫域堉堣堬奥妤妪娛娪娯娱媀媮嫗嬩宇宛寓寙尉屿峪峿崛崳嵎嵛嶎嶼庽庾彧御忬悆悇惌惐愈愉愚慾懊懙或戫扜扵拗挧捓捥揄敔斔斞於旕旟昙昱杅栩栯桙梧棛棜棫楀楡楰榆櫲欎欝欤欥欲歈歟歶毓毹氀汙汩浴淢淤淯渔渝湡滪漁潏澚澞澦澳灪灹焴煜煨熨燏燠爩牏狱狳獄獝玉王玗玙琙琟瑀瑜璵畬畭痏瘀瘉瘐癒盂盓睮矞砡硢硲礇礖礜祤禦禹禺秗稢稶穥穻窬窳竽箊篽籅籞籲粥紆緎緰繘纡罭羭羽聿肀育腧腴臾舁舆與舒艅艈芋芌苑茟茰菀菸萭萮萸蒮蓣蓹蔚蕍蕷薁藇蘌蘛虞虶蜍蜟蜮蝓蝺螸蟈衘衙衧袬裕褕覦觎誉語諛諭謣譽语谀谕谷豫貍貐貗踰軉輍輿轝込迂迃逳逾遇遹邘郁郚鄅酑醧釪鈺銉鋊鋙錥鍝鐍鐭钰铻閼閾阈陓隃隅隩雓雨雩霱預頨顒预飫餘饇饫馀馭騟驈驭骬髃鬰鬱鬻魊魚魣鮽鯲鰅鱊鱮鳿鴥鴧鴪鵒鷠鷸鸆鸒鹆鹬麌齬齵龉龥", "鲀": "吞吨吴呑啍噋囤坉屯庉忳憞敦旽暾朜氽汭沌涒炖焞燉畽窀純肫膯臀臋芚蜳褪豘豚軘逐錪霕飩饨魨黗", "鲎": "侯候厚后吼吽呴喉垕堠帿後洉犼猴瘊睺矦篌糇翭翵腄葔詬豞逅郈鄇銗鍭餱骺鮜鯸鱟鲘齁", "鲤": "丽仂位例俐俚俪傈儮儷兣凓刕列利剓剺劙力励勵历厉厘厤厯厲叓叕叻吏呖哩唎唳喱嚟嚦囄囇坜塛壢娌娳婯嫠孋孷屴岦峛峢峲巁廲悝悡悧悷慄戾扐扚捩搮擽攊攦攭斄暦曆曞朸李杝枥柂栃栎栗栛梨梩梸棃棙樆檪櫔櫟櫪欐欚歴歷氂沥沴泣浬浰涖淚溧漓澧濼濿瀝灑灕爄爏犁犂犛犡狸猁珕珞理琍瑮璃瓅瓈瓑瓥疠疬痢癘癧皪盠盭睝矖砅砬砺砾硌磿礪礫礰礼禮禲离秝穲立竰笠筣篥篱籬粒粝粴糎糲綟縭纅纚缡罹翮脷艃苈苙茘荔荲莅莉菞蒚蒞蓠蔾藜藶蘺蚸蛎蛠蜊蜧蝕蝷蟍蟸蠇蠡蠣蠫裏裡褵觻詈謧讈豊貍赲跞躒轢轣轹逦邌邐郦酈醨醴釃里釐鉝銐鋫鋰錅錑鎘鏫鑗鑠锂隶隷隸離雳霾靂靋颯驪骊鬁鬲鬴鯉鯏鯬鱧鱱鱳鱺鲡鳢鳨鴗鵹鷅鸝鹂麗麜黎黐黧", "鲨": "乷倽傻儍刹剎厦哈唦唼啑啥喢嗄噎帹廈挱挲接摋攝杀杉桬榝樧歃歰殺毮沙濈煞猀痧砂硰箑粆紗繌纱翜翣莎菨萐蔱裟賒鎩铩閯閷霅霎魦鯊鯋", "鲮": "令伶倰冷凌刢另呤囹坽夌姈婈孁岭岺崚嶺彾怜拎掕昤朎柃棂棱櫺欞泠淩澪瀮灵炩燯爧狑玲琌瓴皊砱磷祾秢稜竛笭紷綾绫羚翎聆舲苓菱蓤蔆蕶蘦蛉衑袊裬詅跉軨輘酃醽釘鈴錂铃閝阾陵零霊霗霛霝靇靈領领駖魿鯪鴒鸰鹷麢齡齢龄龗", "鲵": "伱伲你倪儗儞兒匿呢坭埿堄妮妳婗嫟嬭嬺孨孴尼屔屰嶷彌怩惄愵慝懝抐抳拟掜擬旎昵晲暱柅棿檷氼泥淣溺濔濘瀰灄爾狔猊痆眤睨祢禰秜籾縌聣聻胒腝腻膩臡苨薿蚭蛪蜺觬誽譺貎跜輗迡逆郳鈮鉨鑈铌隬霓馜鯢麑齯鿭", "鲸": "丼井京亰仱俓倞傹儆兢净凈刭剄劲勁坓坕坙境妌婙婛婧宑巠幜弪弳径徑惊憬憼擏敬旌旍晟景晶暻曔桱梷橸檠殑氏汫汬泾浄涇淨瀞烴燝猄獍獷璄璟璥痉痙睛秔稉穽竞竟竧竫競竸箐粇粳精経經经聙肼胫脛腈茎荆荊莖菁葏葝蜻蟼誩警踁迳逕醒鋞鏡镜阱陘青靓靖靘静靚靜頚頴頸颈驚鯨鵛鶁鶄麖麠鼱", "鲼": "份偾僨兝兺分匪吩哛噴坆坋坟墳奋奔奮妢岎帉幩弅忿愍愤憤扮拚敃昐朆朌枌梤棻棼橨氛汾濆瀵炃焚燌燓燔獖玢盼瞓砏秎竕粉粪糞紛纷羒羵翂肦膹芬葐蒶蕡蚠蚡衯訜豮豶賁躮轒酚鈖錀鐼隫雰頒餴饙馚馩魵鱝鳻黂黺鼖鼢", "鳄": "亞佮侉俄偔偽僫匎匼卾厄叱吪呃呝咢咹哦啈啊啐啞噁噩囐囮垩埡堊堨堮妸妿姶娥娾娿婀媕屙屵岋峉峨峩崿庵廅恶悪惡愕戹扼搕搤搹擜曷枙椏櫮歞歹歺洝涐湂猗玀珴琧疴痷痾皒睋砈砐砨砵硆硪磀礘胺腭苊莪萼蒍蕚蘁蚅蛤蛾蝁覨訛詻誐諤譌讍讹谔豟軛軶輵轭迗遌遏遻邑鄂鈋鈪鋨鍔鑩锇锷閜閼阏阨阸阿隘頋頞頟額顎颚额餓餩饿騀鬲魤魥鰐鰪鱷鴳鵈鵝鵞鶚鹅鹗齃齶齾", "鳗": "僈埋墁姏嫚屘幔幕悗慢慲摱曼槾樠満满滿漫澫澷熳獌睌瞒瞞矕絻縵缦蔄蔓蘰蛮螨蟎蠻襔謾谩蹣鄤鏋鏝镘鞔顢颟饅馒鬗鬘鰻", "鵎": "乇他仛佗侂侻咃唾嘽圫坨堶妥媠嫷它岮庹彵惰托扡拓拕拖挩捝撱杔杝柁柝棁椭楕槖橐橢毤毻汑池沰沱沲涶牠狏砣砤碢磚税箨籜紽綏脫脱舄莌萚蘀蛇蟺袉袘袥訑託詑説讬跅跎踻軃迆迤迱酡鉈鋖铊阤陀陁隋飥饦馱馲駄駝駞騨驒驝驮驼鬌魄魠鮀鰖鱓鴕鸵鼉鼍鼧鿳鿸", "鵼": "倥埪孔崆恐悾控椌涳矼硿穹空箜腔躻錓鞚", "鸟": "伄佻倜凋刀刁刟叼吊啁奝嫋嬝嬥嬲尥尿屌弔弴彫扚挑掉敦椆樢殦汈淍溺琱瘹瞗矵碉稠窎窵竨簓糶絩綢脲茑茮莜蓧蔦藋虭蛁蜩袅裊褭訋誂調调貂趙跳踔軺釣鈟銚銱鋽錭鑃钓铞铫雕雿魡鮉鯛鲷鳥鳭鵃鵰鼦", "鸡": "丌丮乁乩亟亼亽伋伎佶倚偈偮僟其兾冀几击刉刏剂剞剤劑勣卙卟即卽厝及叝叽吇吉呰咭哜唧喞嗘嘰嚌圾坖垍基堲塈塉墼奇妀妓姞姫姬姼嫉季寂寄尐居屐屰岋岌峜嵆嵇嵴嶯己帺幾庴廭彐彑彶徛忌忣急悸惎愱憿懠懻戟戢技挤掎揖揤撃撠撽擊擠攲敧旡既旣暨暩曁朞期机极枅梞棋棘楖楫極槉槣樭機橶檕檝檵櫅櫭殛毄汥汲泲洁洎济淁済湒漃漈潗激濈濟瀱焏犄犱狤猗玑璣璾畟畸畿疵疾痵瘠瘵癠癪皀皍睽瞉瞿矶磯祭禝禨积秸稘稩稷稽穄穊積穖穧笄笈筓箕箿簊簎籍粢系紀紒級結給継緝績繋繫繼级纪给继绩缉罽羁羇羈耤耭肌胔脊脔脨膌臮艥艻芨芰苙茍茤荠莋萁葪蒩蒺蓟蓻蔇蕀蕺薊薺藉蘄蘎蘮蘻虀虮蜡蝍螏蟣蟻蟿蠀裚襀襋覉覊覘覬覿觊觙觭計訐記誋諅諔譏譤计讥记诘谻谿賫賷赍趌趞跂跡跻跽踑踖踦蹐蹟躋躤躸輯轚辑迹郅郆鄿銈銡錤鍓鏶鐖鑇鑙际隔際隮集雞雦雧霁霵霽革鞊鞿韲颳飢饑饥騎驥骥髻鬾魕魝魢魥鮆鯚鯽鰶鰿鱀鱭鱾鲚鲫鳮鵋鶏鶺鷄鷑鸄鹡麂齊齌齍齎齏齐齑", "鸭": "丫乛亚亜亞伢俹劜厊压厑厓厭吖吾呀呾哑唖啞圔圠圧垭埡堊堐壓姶娅婭孲岈崕崖庌庘御押拁挜掗揠札枒桠椏椻歇氩氬浥涯漄潝烏牙犽猚猰玡琊瑘疋疨痖瘂睚砑碣磍稏穵窫笌聐芽蕥蚜衙襾訝讶軋輅輵轧迓邪釾錏鐚铔閘雅顔鴉鴨鵪鵶鸦齖齾", "鸮": "佼侾俏俲傚削効叟号呺呼咲咻哓哨哮唬啋啸嗃嘋嘐嘨嘮嘯嘵嚣嚻囂奡姣婋孝宯宵小崤庨彇恔恷憢捎揱搜撓撨效敩斅斆晓暁曉枭枵校梟梢橚櫹歊歒歗殽毊洨消涍淆滧漻潇潚澩瀟灱灲烋焇熇熽燆爻狡猇獟獢痚痟皛皢睄硝硣穘窙笑筊筱筿箫箾篠簘簫絞綃縿绡翛肖胶脩膮芍茭莦萧萷蕭薂藃虈虓蛸蟂蟏蟰蠨訤詨誟誵謏謞謼譊踃較轇逍郩銷销霄颵騷驍驕骁骹髇髐魈鴞鴵鵁鷍鷕", "鸵": "乇他仛佗侂侻咃唾嘽圫坨堶妥媠嫷它岮庹彵惰托扡拓拕拖挩捝撱杔杝柁柝棁椭楕槖橐橢毤毻汑池沰沱沲涶牠狏砣砤碢磚税箨籜紽綏脫脱舄莌萚蘀蛇蟺袉袘袥訑託詑説讬跅跎踻軃迆迤迱酡鉈鋖铊阤陀陁隋飥饦馱馲駄駝駞騨驒驝驮驼鬌魄魠鮀鰖鱓鴕鵎鼉鼍鼧鿳鿸", "鹅": "亞佮侉俄偔偽僫匎匼卾厄叱吪呃呝咢咹哦啈啊啐啞噁噩囐囮垩埡堊堨堮妸妿姶娥娾娿婀媕屙屵岋峉峨峩崿庵廅恶悪惡愕戹扼搕搤搹擜曷枙椏櫮歞歹歺洝涐湂猗玀珴琧疴痷痾皒睋砈砐砨砵硆硪磀礘胺腭苊莪萼蒍蕚蘁蚅蛤蛾蝁覨訛詻誐諤譌讍讹谔豟軛軶輵轭迗遌遏遻邑鄂鈋鈪鋨鍔鑩锇锷閜閼阏阨阸阿隘頋頞頟額顎颚额餓餩饿騀鬲魤魥鰐鰪鱷鳄鴳鵈鵝鵞鶚鹗齃齶齾", "鹉": "乄乌五亡仡仵伆伍侉侮俉倵儛兀剭务務勿午卼吳吴吾呉呒呜唔啎喔嗚嘸噁圬坞埡堥塢墲奦妩娒娪娬婺嫵寤屋屼岉峿嵍嵨巫幠庑廡弙忢忤怃恶悞悟悮惡憮戊扜扝扤捂揾摀敄於旄无旿晤杅杇杌柮梧橆歍武毋母汙汚污沕洖洿浯渞渥溩潕烏焐無熃熓物牾玝珷珸瑦璑甒痦盓瞀瞴矹碔祦禑窏窹笏筽箼粅膴舞芜芴茣莁蕪蘁蜈蝥螐蟱誈誣誤譕诬误趶躌迕逜邬郚鄔釫鋈鋘鋙錻鎢钨铻阢陚隖雺雾霚霧霿靰騖骛鯃鰞鴮鵐鵡鶩鷡鹀鹜鼯鼿齀齬", "鹤": "何佫劾合吓呵呼咊和咼哈哧哬啝喛喝嗃嗑嗬噈嚇垎壑姀害寉峆惒愒抲挌揭敆曷柇核格楁欱毼河洽涸渮渴澕焃煂熆熇燺爀犵狢猲癋皬盇盉盍盒硅碋礉禾秴穒篕籺粭紇繳纥翮翯苛荷菏萂藃藿蚵蝎螛蠚袔褐覈訶訸詥謞诃貈貉賀贺赫輅轄郃鉌鑉閡闔阂阖隺霍靍靎靏鞨頜颌餄餲饸鬩魺鲄鵠鶡鶮鶴鸖鹖麧齃齕龁龢", "鹦": "俓偀僌吋呎哩哽唡啢啨営嘤噟嚶塋夃央婴媖媵嫈嬰嬴孆孾嵤巆巊应廮影応愥應摬撄攍攖旲映景暎朠柍桜桯梬楹樱櫻櫿泂浧渶溁溋滎滢潁潆濙濚濴瀅瀛瀠瀯瀴灐灜焸煐熒營珱瑛瑩璎瓔甇甖甸瘿癭盁盈眏矨硬碤礯禜穎籝籯緓縈繩纓绬缨罂罃罌耺膡膺英茔荥荧莖莹莺萤营萦萾蓥藀蘡蛍蝇蝧蝿螢蠅蠳褮覮謍譍譻賏贏赢軈迎逞郢鍈鎣鐛鑍锳霙鞕韹韺頴颍颕颖鱦鴬鶑鶧鶯鷪鷹鸎鸚鹰", "鹫": "丩久乆九乣倃僦剹勼匓匛匶厩咎啾噍奺就廄廏廐愁慦捄揂揪揫摎救旧朻杦柩柾桕樛欍殧氿汣湫灸牞玖疚稵穋究糺糾紤繆纠臼舅舊舏萛蝤赳蹴酒镹阄韭韮鬏鬮鯦鳩鷲鸠麔齨", "鹬": "丂与乻予于亏亐伃伛余俁俞俣俼偊傴僪儥兪匬吁吳吾唷唹喁喅喐喩喻噊噢噳圄圉圩圫域堉堣堬奥妤妪娛娪娯娱媀媮嫗嬩宇宛寓寙尉屿峪峿崛崳嵎嵛嶎嶼庽庾彧御忬悆悇惌惐愈愉愚慾懊懙或戫扜扵拗挧捓捥揄敔斔斞於旕旟昙昱杅栩栯桙梧棛棜棫楀楡楰榆櫲欎欝欤欥欲歈歟歶毓毹氀汙汩浴淢淤淯渔渝湡滪漁潏澚澞澦澳灪灹焴煜煨熨燏燠爩牏狱狳獄獝玉王玗玙琙琟瑀瑜璵畬畭痏瘀瘉瘐癒盂盓睮矞砡硢硲礇礖礜祤禦禹禺秗稢稶穥穻窬窳竽箊篽籅籞籲粥紆緎緰繘纡罭羭羽聿肀育腧腴臾舁舆與舒艅艈芋芌苑茟茰菀菸萭萮萸蒮蓣蓹蔚蕍蕷薁藇蘌蘛虞虶蜍蜟蜮蝓蝺螸蟈衘衙衧袬裕褕覦觎誉語諛諭謣譽语谀谕谷豫貍貐貗踰軉輍輿轝込迂迃逳逾遇遹邘郁郚鄅酑醧釪鈺銉鋊鋙錥鍝鐍鐭钰铻閼閾阈陓隃隅隩雓雨雩霱預頨顒预飫餘饇饫馀馭騟驈驭骬髃鬰鬱鬻魊魚魣鮽鯲鰅鱊鱮鱼鳿鴥鴧鴪鵒鷠鷸鸆鸒鹆麌齬齵龉龥", "鹰": "俓偀僌吋呎哩哽唡啢啨営嘤噟嚶塋夃央婴媖媵嫈嬰嬴孆孾嵤巆巊应廮影応愥應摬撄攍攖旲映景暎朠柍桜桯梬楹樱櫻櫿泂浧渶