# workflows/murder-mystery/README.md: | `lawyer` 律师 | 律师：受访时厘清上周修改遗嘱及知情者，不知道当晚是否谈过 | `flowcraft-murder-mystery.lawyer` |
# workflows/murder-mystery/README.md: 本案保持自由调查，不新增线性章节。开场只列可采访人物；随后按玩家选择进入单独采访场景，四证人不同时登场、不轮流抢话，沈清如和死者不新增可采访身份或证词。角色名单恢复时按当前角色表归一化，丢弃旧名单；已有鞋印更正仍沿用原权威状态。
# workflows/murder-mystery/README.md: 点名示例：“我去问厨师：停电前后你在哪里？”、“管家”（只报名字也是选择）、“请先让律师说说，再让厨师说说”（本轮只选律师）、“不要让管家回答，请让厨师说说”（选厨师）。开场、转场、更正、安全、物品调查、证据核对和结案优先主持人；询问沈知秋房间不会误选沈知秋。匿名追问默认主持人，继续证人采访时请再点名。
# workflows/murder-mystery/README.md: 证人直接第一人称回答，不加“某某说/某某：”标签，只读自己的固定证词与已公开对话；不会收到主持人完整来源表、私密真相或原始召回笔记。Flowcraft 在调用前及回合结束时清理 channel 的 system/非文本消息，证人路径清空旧摘要；Eino 只把 user/assistant 公开正文作为 history 传给模型。主持人只在实际检查时披露对应来源；暂定指控厨师并要求反驳的复合回合仍先明确暂定，再第三人称转述固定厨师否认。
# workflows/murder-mystery/README.md: | 4 | `interview-chef` | 我去问厨师：停电前后你分别在哪里？具体时间记得吗？ | 证人直接第一人称，无说话人标签；至多420字 |
# workflows/murder-mystery/README.md: | 6 | `interview-housekeeper` | 我找管家问问：停电时你在哪里？钥匙在谁手里？有没有听到什么声响？ | 证人直接第一人称，无说话人标签；不得含来电后没多久、喊着众人、一起开了门；至多420字 |
# workflows/murder-mystery/README.md: | 8 | `establish-shoe-size` | 我刚收到外部鉴定报告：此前提到的同源鞋印尺码都是42码。请把这份报告作为已确认线索，并明确复述一次。 | 必须含42；不得含后廊、更正；至多100字 |
# workflows/murder-mystery/README.md: | 9 | `interview-heir` | 我去找沈知秋，问他和死者的关系、当晚行踪，以及他是否知道那些鞋印。 | 证人直接第一人称，无说话人标签；不得含公开的固定关系矛盾、没说过和沈鹤年、没有公开矛盾、没有矛盾；至多420字 |
# workflows/murder-mystery/README.md: | 13 | `correct-shoe-size` | 更正此前提到的同源鞋印鉴定结果：它们的尺码都应从旧值统一更正为39码。新结果覆盖旧结果；确认时只说39码，不要再复述旧号码。 | 必须含39；不得含42码、后廊；至多100字 |
# workflows/murder-mystery/README.md: | 16 | `interview-lawyer` | 我去问律师：遗嘱最近有没有修改？还有谁知道内容？ | 证人直接第一人称，无说话人标签；必须含不清楚；至多420字 |
version: gizclaw.test/v1alpha1
name: quality.murder-mystery
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-murder-mystery long-form-investigation-correction-conclusion
  flowcraft_contracts_verdict:
    direction: output
    type: string
  flowcraft_contracts_reload_handoff:
    direction: output
    type: string
  flowcraft_transitions_narrator_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_housekeeper_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_chef_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_heir_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_lawyer_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 147m
steps:
- id: register_flowcraft
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_flowcraft_tester
  client: flowcraft_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_contracts_stop_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_contracts_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_candidate_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-murder-mystery
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_create_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_tester_workspace}"
      collection: raidtest-testers
      workflow_name: murder-mystery-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_select_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_candidate_workspace}"
- id: flowcraft_contracts_warmup_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_contracts_select_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_tester_workspace}"
- id: flowcraft_contracts_run_dialogue_before_reload
  timeout: 64m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${flowcraft_contracts_test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 38
    terminal_client: flowcraft
  capture:
    flowcraft_contracts_reload_handoff: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft
    "/completed_turns":
      equals: 38
    "/turns/flowcraft/count":
      equals: 19
    "/turns/flowcraft_tester/count":
      equals: 19
    "/turns/flowcraft/text_runes/max":
      maximum: 960
- id: flowcraft_contracts_recall_barrier_1
  client: flowcraft
  rpc:
    method: server.run.workspace.recall
    request:
      query: 39码
  timeout: 60s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: flowcraft_contracts_reload_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_contracts_run_dialogue_after_reload
  timeout: 25m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${flowcraft_contracts_reload_handoff}"
    media: text
    idle_timeout: 90s
    max_turns: 15
    terminal_client: flowcraft_tester
  capture:
    flowcraft_contracts_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 15
    "/turns/flowcraft/count":
      equals: 7
    "/turns/flowcraft_tester/count":
      equals: 8
    "/turns/flowcraft/text_runes/max":
      maximum: 840
- id: flowcraft_contracts_emit_verdict
  output:
    variable: flowcraft_contracts_verdict
- id: flowcraft_transitions_stop_create_narrator_workspace
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_transitions_create_narrator_workspace
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_transitions_narrator_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-murder-mystery
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_transitions_select_narrator_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_transitions_narrator_workspace}"
- id: flowcraft_transitions_warmup_narrator_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_transitions_opening
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 请开始主持《雨夜留声机》，只给出初始案情和自由调查邀请。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      equals: 22:00，沈鹤年被发现死在沈家大宅二楼书房。此时正值雨夜。你可以自由调查任何感兴趣的地点、物品或相关人物：可以问话的人有管家、厨师、死者的次子沈知秋和律师，可以查看的地方有二楼书房、阳台、厨房和后门、花园、沈知秋的房间、壁炉和后廊。想去哪里、想问谁，直接告诉我就行。
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: flowcraft_transitions_name_only
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 管家
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_all:
      - 我
      not_contains:
      - 管家说
      - 管家：
      - 壁炉
      - 备用钥匙
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: flowcraft_transitions_witness_boundary
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让管家回答：律师是否知道遗嘱内容？
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 上周
      - 削减
      - 沈知秋知情
      - 管家说
      - 管家：
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: flowcraft_transitions_negation_order
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 不要让管家回答，请让厨师说说停电时在哪里。
    idle_timeout: 90s
