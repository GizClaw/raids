渊渕湲源溒灁焆爰猨猿獂瑗畹盶眢禐穿笎箢緣縁缘羱肙芫苑茒葾蒝蒬薗薳蚖蜎蜵蝝蝯螈衏袁裫裷褑褤謜貟贠輐轅辕远逺遠邍邧酛鈨鋺鎱阮院隕願駌騵魭鳶鴛鵷鶢鶰鸢鸳鹓黿鼋鼘鼝", "叔": "书侸俆俞俶倏倐儵兪咰售嗽塾墅姝娶婌孎孰尌尗属屬庶庻忬怷恕悆戍抒捈捒掓揄摅攄数數暏暑曙書朮术朱束杸杼枢树梳樞樹橾殊殳毹毺氀沭涑淑漱潄潏潻澍濖瀭焂熟瑹璹疋疎疏癙秫稌竖竪籔糬紓紵絉綀纾署翛腧舒荗荼菽蒁蒣蔬薥薯藪藷虪蜀蠴蠾術裋襡襩謶豎豫贖赎跾踈軗輸输述透鄃野鉥錰鏣鐲陎除隃鮛鱪鱰鵨鶐鷸黍鼠鼡", "古": "估俈傦僱凅刳告呱呴咕哌哭唂唃啒喾嗗嘏嚳固圐圣堀堌夃姑嫴孤家尳崓崫崮库庫廤怘愲扝扢挎捁掘搰故朏枯柧桍梏棝楛榖榾橭櫎毂汩沽泏泒淈滑濲瀔焅焸牯牿狜瓠痼瘔皋皷皼盬瞽矻硞磆祻秙稒穀窋窟笟箍箛篐糓絝縎绔罛罟羖股胍脵臌苦苽菇菰蓇薣蛄蛊蛌蠱袴裤褲角觚詁诂谷賈贾趶跍跨軱軲轂轱辜逧郀酤酷鈲鈷錮钴锢雇離顧顾餶馉骨骰骷鮕鮬鯝鲴鴣鵠鶻鸪鹄鹘鼓鼔齁", "可": "个介仡佫佮個假克刻剋割勀勊匌匼各合吤呄呵咯咳哥哿喀嗑嗝嗰嘅噶圪坷堁塥壳娔客尅屹岢峇嵑嵙嶱彁恪悈愅愘愙戈戓戨扢挌揢搁搕搿擖擱敋敤杚柯格棵榼槅樖櫊歁歌殼毼氪浩渇渴溘滆滒濭炣牁牫牱犐犵猲獦珂疙疴痾盍盖瞌砝砢硌硞碣碦磆磕礊礚科秴稞窠窼箇簻紇緙纥缂翗肐胢胳膈臈臵舸艐苛茖菏萪葛蓋薖虼蚵蛒蛤蝌袔袼裓觡詥課諽謌课趷軻輵轕轲醘鈳鉀鉻鉿錁錒鎑鎘鎶钶铬锞镉閘閣閤阁隔革鞈鞷韐韚頜頦顆颌颏颗饹騍騔骒骼髁髂鬲魺鮥鮯鰪鴐鴚鴿鵅鸽龕鿔", "史": "世丗乨乭亊事什仕似佦使侍兘冟势勢匙十卋厔叓呞呩咶唑啇嗜嘘噬埘埶堤塒士失奭始姼媞嬕实実室宩宲寔實寺尸屍屎峕峙崼嵵市师師式弑弒彖徥忕忯恀恃惿戺拭拾挈提揓斯施时旹是昰時枾柹柿栻楴榁榯檡殖殺氏汁沶浉液湜湤湿溡溮溼澤澨濕灑炻烒煶狧狮狶獅瑡畤痑眂眎眡睗矢石示礻祏秲竍笶筮箷篒篩簭籂絁繹耆肢舍舐舓莳葹蒒蒔蓍虱蚀蝕蝨螫褆褷襫襹視视觢訑試詩誓諟諡謚識识试诗谥豉豕貰贳赫跩踶軾轼辻适逝遈遞適遰遾邿郝酾醳釃釈释釋釶鈰鉂鉃鉇鉈鉐鉽銴鍉鍦鎩铈食飠飭飾餙餝饣饰馶駛驶魳鮖鯴鰘鰣鰤鲥鲺鳲鳾鶳鸤鼫鼭齛", "右": "丣亴优佑侑偤優冘卣又友叹呦哊唀嚘囿坳奥妋姷孧宥尢尤峟峳幼幽庮忧怞怣怮悠憂懮戭扰揂揄攸斿有朓柚栯梄梎楢槱櫌櫾汓汼沋油泅泑浟游湵滺瀀牖牗牰犹狖猶猷獶由甴疣痏祐禉秞糿繇纋羐羑羗耰聈聱肬脜脩苃莜莠莤莸蒏蕕蚘蚰蚴蜏蝣蝤褎訧誘诱貁輏輶迶逌逰遊邮郵鄾酉酭釉鈾銪銹铀铕駀魷鮋鯈鱿鲉麀黝鼬", "叶": "业也些亪亱亵伳倻偕偞偰僁僷儶写冩冶劦勰协協卨卸吔吤咽唏啘喈喝嗋嘢噎噧嚈垥埜堨塮墅墷壄夑夜夾奊契娎媟孈寫射屑屓屟屧峫嶪嶫嶰廨徢恊愶慀懈懕抴拹拽挟挾捓捙掖接揞揲揳揶搚携摺撷擕擖擛擨擪擫擷攜斜旪晔暍暬曄曅曗曳曵枒枻枼枽桔梋械椰楔楪業榍榝榭槷檞欸歇歋歙殕殗殺汁泄泻洂洇洩涂液渫湝溉滊漜潰潱澥澲瀉瀣灺炧炨烨烲焆焎煠熀熁燁燮燲爕爗爷爺猲獦獬瑎璍瓛痷皣眭瞱瞸碿礏祄禼窫糏紲絏絜絬綊緤緳繲纈绁缬缷翓耶聶胁脅脇脋腋膎苴荼葉薢薤藛虵蝎蝑蝢蟹蠍蠏蠮蠱血衺裌褉褻襭觟解諜諧謁謝譮讗谐谒谢豫跬躞躠迦邂邪邺鄓鄴野釶釾鋣鍱鎁鎑鐷铘隰靥靨鞋鞢鞵韰頁頡页颉餘餣饁饐馌驜骱鬹魼鮭鲑鵺鸈黦齂齘齛齥龤", "司": "丝亖以伺似佀佁佌佽価俟俬偨偲傂儩兕兹凘刺刾厕厮厶台呰呲咝啙嗣嘶噝四垐堲姒姕娰媤嬨孠寺嵯差已巳庛廁廝徙思恖愢慈措撕斯朿杫析枱柌柴柶栜栨梩楒榹次此死汜泀泗泚泤洍涘滋澌澬濨瀃燍牭玼珁瓷甆疵皉磁磃礠祀祠禗禠禩私竢笥簛籭粢糍糸糹絘絲緦縒纟缌罳耜肂肄肆胔茈茦茨茲莿菥蕬蕼薋薺虒蚝蛓蛳蜤螄螅螆螔蟖蟴蠀覗詞謕词貄賜赐趀趑跐辝辞辤辭逘釲鈶鈻鉰銉銯鋖鍶鐁锶雉雌颸飔食飤飴飺飼餈饲駟騃騦驷骴髊鮆鴜鶿鷀鷉鷥鸶鹚麗鼶齹", "后": "侯候厚吼吽呴喉垕堠帿後洉犼猴瘊睺矦篌糇翭翵腄葔詬豞逅郈鄇銗鍭餱骺鮜鯸鱟鲎鲘齁", "君": "俊儁军匀卷呁均埈姰寯峻懏捃攈攟旬晙桾棞汮浚濬焌焞燇狻珺畯皲皸皹睃碅竣筠箘箟莙菌葰蔨蚐蜠袀覠訇軍郡鈞銁銞鋆鍕钧陖隽雋餕馂駿骏鮶鲪鵔鵕鵘麇麏麕龜龟", "启": "七丌乞亓亝亟企伎俟倛偈傶僛其凄切刺剘勤吃吱呇呮咠唘唭啓啔啟喰嘁噐器圻埼夡奇契妻娸婍宿屺岂岐岓崎嵜己帺幾弃忔忮忯忾恓恝悽愒愭愾慼慽憇憩懠戚扢扱扺技抵挈捿掑揭摖支攲敧斉斊旂旗晵暣朞期杞枝柒栔栖桤桼梩棄棊棋棨棲榿槭檱櫀欫欹欺歧气気氣汔汽沏泣洓淇淒湆湇溪滊漆漬濝濟炁焏猉玂玘琦琪璂甈甭畦畸疧盀盵矵砌碁碕碛碶磎磜磧磩礘示祁祇祈祺禥禨稘稽竒簯簱籏粸紪絜綥綦綨綮綺緀緕緝纃绮缉缼罊耆肐肵脐臍舙艩芑芞芪荠萁萋萕葺蕲薺藄蘄蚑蚔蚚蛣蛴蜝蜞螇螧蟣蟿蠐衹袳裿褀褄觭訖諆諬諿讫豈起趞趿跂踑踖踦蹊躩軙軝迄迉逗邔郪鄿釮錡鏚鐖锜闙隑霋頎颀饑騎騏騹骐骑鬐鬾鬿魌鮨鯕鰭鲯鳍鵸鶀鶈鸂麒麡鼜齊齐齮", "吴": "乄乌五亡仡仵伆伍侉侮俉倵儛兀剭务務勿午卼吞吨吳吾呉呑呒呜唔啍啎喔嗚嘸噁噋囤圬坉坞埡堥塢墲奦妩娒娪娬婺嫵寤屋屯屼岉峿嵍嵨巫幠庉庑廡弙忢忤忳怃恶悞悟悮惡憞憮戊扜扝扤捂揾摀敄敦於