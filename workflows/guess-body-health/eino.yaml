胃": "为于亹伟伪位倭偉偎偽僞儰卫危厃叞味唩唯喂喡喴噲囗围圍圩堤墛壝委威娓媁媙媦寪尉尾屗峗峞崣崴嵔嵬嶶巋巍帏帷幃廆徫微恑惟愄愇慰懀捤捼揋揻撝撱斖暐有未机桅梶椲椳楲欈沇沩洈洧浘涠渨渭湋溈溦潍潙潿濊濰濻瀢炜為烓煀煒煟煨熨熭燰爲犚犩猗猚猥猬玮琟瑋璏瓗畏痏痿癐癓眭睢瞶硊硙碨磈磑立維緭緯縅纬维罻腲膸艉芛芟苇苿茟荱荽菋萎葦葨葳蒍蓶蔚蔿薇薳藯蘶蜲蜹蜼蝛蝟螱衛衞褽覣覹觿詴諉謂讆讏诿谓趡踒踓躗躛軎轊违逶違遗遺鄬醀錗鍏鍡鏏闈闱阢隇隈隗隹霨霺韋韑韙韡韦韪頠颹餧餵饖骩骪骫魏鮇鮠鮪鰃鰄鰖鲔鳂鳚", "胞": "佨保儤刨剥勹勽包匏呆咆嘐嚗垉堡堢報奅媬嫑孢宝宲寚寳寶庖忁怉抛报抱拋摽暴曓曝枹泡瀑炮炰煲爆爮犥狍珤瓟疱皰砲礟礮穮窇窌笣緥脟脬苞苴菢萢葆蕔薄藨藵虣蚫袌袍裒褒褓褜襃謈豹賲趵跑軳鉋鑤铇闁雹靌靤鞄颮飹飽饱駂骲髱鮑鲍鳵鴇鸨麃麅麭齙龅", "胰": "一丿乁乂义乊乙也亄亦亿仡以仪伇伊伿佁佗佚佾侇依俋倚偯儀億儗兿冝刈劓劮勚勩匇匜医印厭叕台叹吚听呓呭呹咦咿唈喦嗌噎噫囈圛圪圯坄坨垼埶埸墿壱壹夁夕失夷奇奕妷姨姬媐嫕嫛嬄嬑嬟孴它宐宜宧寱寲射尾屹峄峓崎崺嶧嶬嶷已巳巸帟帠幆庡廙异弈弋弌弬彛彜彝彞彵役忆忔怈怠怡怿恞悒悘悥意憶懌懿戲戺扅扆扡抑拸挹掎掜揖搋搤撎擇攺敡敼斁施旑旖易昳晹暆曀曎杙杝枍枻柂栘栧栺桋棭椅椬椸榏槷槸樴檍檥檹欥欭欹歖歝殔殪殹毅毉汽沂沶泄泆洢洩洫浂浥浳渏渫湙溢漪潩澤澺瀷炈焉焬焱焲熙熠熤熪熼燚燡燱犄狋狏猗獈玴珆瑿瓵畩異疑疙疫痍痬瘗瘞瘱癔益眙睪瞖矣硛硪礒礙祎禕秇移稦穓竩笖箷簃籎紲絏維綺縊繄繶繹绎缢羛羠羡義羿翊翌翳翼耛耴肄肊膉臆舣艗艤艺艾芅苅苡苢荑萓萟蓺薏藙藝蘙虉蚁蛇蛜蛡蛦蛾蜴螔螘螠蟻衣衤衪衵袂袘袣裔裛裿褘褹襗襼觺訑訲訳詍詑詒詣誃誒誼謚謻譩譯議譺讉讛议译诒诣谊豙豛豷貖貤貽賹贀贻跇跠踦軼輗輢轙轶辥辷迆迤迭迱迻逘逸遗遺邑郼酏醫醳醷釋釔釴釶鈘鈠鉇鉈鉯銕銥錡鎰鏔鐿钀钇铱镒镱阣阤陁陭隶隿雉霅霬靉靾頉頤頥顊顗颐食飴饐饴駅驛驿骮鮧鮨鯣鳦鴺鶂鶃鶍鷁鷊鷖鷧鷾鸃鹝鹢鹥黓黝黟黳齮齸", "胺": "亞佮侉侒俄俺偔偽僫儑匎匼卾厂厄厈叱吪呃呝咢咹哦唵啈啊啐啞啽噁噩囐囮垩垵垾埡埯堊堓堨堮妸妿姶娥娾娿婀婩媕安屙屵屽岋岸峉峖峨峩崿干广庵廅恶悪惡愕戹扼按揞搕搤搹擜晻暗曷枙案桉椏櫮歞歹歺氨洝涐湂犴猗玀玵珴琧疴痷痾皒盒盦盫睋砈砐砨砵硆硪碪磀礘罯腤腭苊荌莪菴萻萼葊蒍蓭蕚蘁蚅蛤蛾蝁裺覨訛詻誐誝諤諳譌讍讹谔谙豟豻貋軛軶輵轭迗遃遌遏遻邑鄂鈋鈪鉗銨鋨錌鍔鑩铵锇锷閜閼闇阏阨阸阿陰隌隘雸鞌鞍韽頇頋頞頟額顎颚额餓餩饿馣騀鬲魤魥鮟鰐鰪鱷鳄鴳鵈鵝鵞鵪鶕鶚鹅鹌鹗黯齃齶齾鿷", "脂": "之乿伎侄俧倁値值偫傂儨凪制剬劕劧卮厎厔只吱呮咥咫嗭嚔址坁坧垁埃埴執墆墌夂妷姪娡媞嬂寘實峙崻巵帋帙帜幟庢庤廌彘徏徔徝徵志忮怾恃恉慹憄懥懫戠执扺扻抧抵拓挃指挚捗掷搘搱摕摨摭摯擲擳擿支斦旘旨昵晊晢智杝杫枝枳柣栀栉栺桎梔梽植椥楖榰樀樲樴櫍櫛止歭殖氏氐汁汥汦沚治泜洔洷淔淽滍滞滯漐潌潪瀄炙熫犆狾猘璏瓆瓡畤疐疷疻痔痣瘈直眰知砋砥礩示祁祇祉祑祗祬禃禔秇秓秖秩秪积秲秷稙稚稺穉窒筫紙紩絷絺綕緻縶織纸织置翐耆聀职職肢胑胝胵膣膱至致臷臸芖芝芷茋茝菭薙藢蘵虒蚔蛭蜘螲蟙衹衼袟袠製襧覟觗觝觯觶訨誌識识豑豒豸貭質贄质贽趾跂跖跱踬踯踶蹛蹠蹢躑躓軄軹軽輊轵轾迣遟遲郅酈酯釞鉄銍銴鋕鑕铚锧阤阯陁陟隲隻雉馶馽駤騭騺驇骘鯯鳩鳷鴙鴲鶨鷙鸷黹鼅鿵", "脉": "万么买伯佅佰冒劘劢劰勱勿卖咪哩唛唜嗼嘪嘿嚤嚩嚰圽埋塻墨売妺嫫嫼嬷寞尛帓帕帞庅怽懡戂抹摩摸摹撫擵攠无昧昩暯末枺模橅歾歿殁没沫派湐漠瀎無爅狢獏瘼百皌眜眽眿瞐瞙砞磨礳秣粖糢絈絔縸纆耱脈膜艒茉荬莈莫蓦蕒薶藐藦蘑蛨蟆蟔衇袜袹謨謩譕谟貃貈貉貊貌貍貘買賣迈邁鄚銆鏌镆陌霡霢霾靺鞨饃饝馍驀髍魔魩魹鷶麥麦麽默黙鿏鿺", "脊": "丌丮乁乩亟亼亽伋伎佶倚偈偮僟其兾冀几击刉刏剂剞剤劑勣卙卟即卽厝及叝叽吇吉呰咭哜唧喞嗘嘰嚌圾坖垍基堲塈塉墼奇妀妓姞姫姬姼嫉季寂寄尐居屐屰岋岌峜嵆嵇嵴嶯己帺幾庴廭彐彑彶徛忌忣急悸惎愱憿懠懻戟戢技挤掎揖揤撃撠撽擊擠攲敧旡既旣暨暩曁朞期机极枅梞棋棘楖楫極槉槣樭機橶檕檝檵櫅櫭殛毄汥汲泲洁洎济淁済湒漃漈潗激濈濟瀱焏犄犱狤猗玑璣璾畟畸畿疵疾痵瘠瘵癠癪皀皍睽瞉瞿矶磯祭禝禨积秸稘稩稷稽穄穊積穖穧笄笈筓箕箿簊簎籍粢系紀紒級結給継緝績繋繫繼级纪给继绩缉罽羁羇羈耤耭肌胔脔脨膌臮艥艻芨芰苙茍茤荠莋萁葪蒩蒺蓟蓻蔇蕀蕺薊薺藉蘄蘎蘮蘻虀虮蜡蝍螏蟣蟻蟿蠀裚襀襋覉覊覘覬覿觊觙觭計訐記誋諅諔譏譤计讥记诘谻谿賫賷赍趌趞跂跡跻跽踑踖踦蹐蹟躋躤躸輯轚辑迹郅郆鄿銈銡錤鍓鏶鐖鑇鑙际隔際隮集雞雦雧霁霵霽革鞊鞿韲颳飢饑饥騎驥骥髻鬾魕魝魢魥鮆鯚鯽鰶鰿鱀鱭鱾鲚鲫鳮鵋鶏鶺鷄鷑鸄鸡鹡麂齊齌齍齎齏齐齑", "脏": "匨塟奘弉戕牂牫羘臓臟臧葬蔵藏賍賘贓贜赃銺駔驡驵髒", "脑": "匘呶垴堖夒婥嫐孬峱嶩巎巙怓恼悩惱憹挠摎撓橈淖澆猱獶獿瑙硇碙碯脳腝腦膠臑蛲蝚蟯詉譊鐃铙閙闹鬧", "脖": "亳仢伯佛侼僠僰剝剥勃募博卜哱啵噃嚗壆妭孛孹嶓帗帛彴怕愽懪拍拔拨挬搏撥播擗擘暴服柏柭桲榑檗檘欂殕泊波浡淿渤溊溥潑潘瀑煿爆牔犦犻狛猼玻瓝瓟番癶癷發白百皪盋砵碆磻礡礴秡穛箔箥簙簸簿糪紴缽肑胉膊般舶艊艴苩茀茷菠菩萡葧蒲蔔蔢蕃薄薜蘖蘗蚾袚袯袰袹襎襏襮詙譒豰趵跑跛踣蹳郣鈸鉑鉢鋍鎛鑮钵钹铂镈餑餺饽馎馛馞駁駮驋驳髆髉魄鮁鮊鱍鲅鲌鵓鹁", "脚": "乙亅交佼侥倔傕僑僥僬儌决刔剿劂劋勦勪匷卻厥叕叫叽吷呌咬啳喬嗟嘂嘄嘐嘦噍噘噭噱嚼埆壆夬妖妜姣娇嫶嬌嬓孂孒孓學屈屩屫峤峧崛崫嵺嶕嶠嶡嶣嶥弡彏徺徼恔悎憍憠憢憰憿戄抉挍挗挢捁捔掘搅摎摷撅撟撧撹攪攫敎教敥敫敽敿斍斠晈暞曒柽校桷梏椒構樔橋橛橜櫵欔欮殌氒決泬浇湫湬滘漖潏潐澆激灂灍灚烄焦焳煍熦燋燞爑爝爴爵狂狡獗獥玃玦玨珏珓瑴璚璬疦瘚皎皛皦皭矍矞矡矫矯砄礁稾穚穱穴窌窖笅筊簥糾絕絞絶繑繘繳纐绝绞缴胶腳膠膲臄臫艽芁芵茭茮菽萩蕉蕎蕝蕞蕨藠虠虳蚗蛙蛟蟜蟨蟩蟭蠼袦覐覚覺觉角觖觳觼訆訣誳譎譑譥诀谲貜賋赽趉趫趭趹跤踋蹶蹷蹻躩較轇轎轿较逫郊鄗酵醮釂釥鈌鉸鐍鐎鐝钁铰镢闋闕隦鞽餃饺駃騤驕骄骹髉鮫鱎鱖鲛鴂鴃鵁鵤鶌鷢鷦鷮鹪龣", "脱": "乇他仛佗侂侻俀僓咃唾啍嘽圫坨堶墤妥娧媠嫷它尵岮庹弚弟彵忒怢惰托扡拓拕拖挩捝推撱杔杝柁柝棁椭楕槖橐橔橢毤毻汑池沰沱沲涶焞煺牠狏砣砤碢磚税穨箨籜紽綏聉脫脮腿舄莌萚蓷藬蘀蘈蛇蛻蜕蟺袉袘袥褪訑託詑説謉讉讬跅跎踻蹆蹪軃迆迤迱追退酡鉈鋖铊阤陀陁隋隤頹頺頽颓飥饋饦馱馲駄駝駞駾騨騩驒驝驮驼骽鬌魄魋魠鮀鰖鱓鴕鵎鸵鼉鼍鼧鿳鿸", "腰": "么仸佻侥倄偠傜僥匋吆咬喓嗂嚙垚堯夭妖姚婹媱嬈宎尧尭岆峣崤崾嶢嶤幺幼徭徼怮恌愮抭揄揺搖摇摿撽暚曜杳枖柼楆榚榣樂殀殽洮淫溔滧瀹烄烑熎燿爻狕猶猺獟玅珧瑤瑶由疟瘧眑矅磘祅穾窅窈窑窔窯窰筄箹約繇纅约耀肴舀艞苭药葯葽蓔蕘薬藥蘨袎要覞訞詏謠謡讑谣趯踰軺轺遙遥邀邎銚鎐鑰钥铫闄陶隃靿顤颻飖餆餚騕驁鰩鳐鴁鴢鷂鷕鹞鼼齩", "腹": "不乀乶仅付伏伕佛俌俘俛俯偩偪傅冨冹凫刜副包匐呋咈咐哹哺嘸坿垘垺報复夫妇妋姇娐婏婦媍嬎嬔孚孵宓富尃岪峊巿市帗幅幞府弗弣彳彿復怀怤怫懯扶抚拂拊捊捬掊撨撫敷斧旉服枎枹柎柫柭栿桴棴椨椱榑氟汱沕沸泭洑浮涪溥滏澓炥烰焤父玞玸琈璷甫甶畉畐畗痡癁盙砆砩祓祔福禣秿稃稪竎符笰筟箁箙簠粰糐紨紱紼絥綍綒緮縛纀绂绋缚罘罦翇肤胕脯腐腑膚艀艴芙芣芾苻茀茯荂荴莆莩菔萉萯葍蓲蕧虙蚥蚨蚹蛗蜅蜉蝜蝠蝮衭袚袝袱複褔襆襥覄覆訃詂諨讣豧負費賦賻负赋赙赴趺跗踾軵輔輹輻辅辐还邚邞郍郙郛鄜酜酻釜釡鈇鉘鉜錇鍑鍢阜阝附陚鞴韍韛韨頫颫颰馥駙驸髴鬴鮄鮒鮲鰒鲋鳆鳧鳬鳺鴔鵩鶝麩麬麱麸黻黼", "腺": "仙仚伭佡俔僊僩僲僴先冼县咁咞咸哯唌啣嗛嘕垷埳堿壏奾妗妶姍姭姺娊娨娴娹婱嫌嫺嫻嬐孅宪寰尟尠屳岘峴崄嶮幰廯弦彡忺慊慳憪憲憸懢挦捍掀探揱搚搟撊撏攇攕显晛暹杴枮梘槏橌櫶欦毨氙洒洗涀涎湺溓澖濂瀗灑灦烍燹狝猃献獫獮獻玁现玹珗現甉痫癇癎盷省県睍瞯瞷矣硍碱礆礥祆禒禰秈稴筅筧箲籼粯糮絃絤綅綖綫線縣縿繊纎纖纤线缐羡羨羬肩胘脅膁臔臤臽舷苋苮莧莶薟藓藖蘚蘞蚬蚿蛝蜆衔衘褼襳見见誢誸諴譀譣豏賢贒贤赻跣跹蹮躚軐軒輱酰醎醶釤銑銛銜鋧錎錟鍁鍌鏾鑦铣铦锨锬閑閒闞闲限陥险陷険險霰韅韯韱顈顕顯餡饀馅馦鮮鰔鱻鲜鶱鷳鷴鷼鹇鹹麙麲黹鼸", "膀": "並乓仿傍厐厖嗙垹埲塝夆嫎尨帮幇幚幫庞彭彷徬房捠搒方旁梆棒棓榜汸沗浜滂炐牓玤硥磅稖篣紡綁縍绑耪肨胖胮膖舽艕蒡蚄蚌蛖蜯螃蠭覫謗谤趽逄逢邦邫鎊镑雱霶鞤騯髈鰟鳑龎龐", "膈": "个介仡佫佮個假割匌可各合吤呄咯哥哿嗝嗰嘅噶圪塥屹彁愅戈戓戨扢挌搁搿擖擱敋杚格槅櫊歌浩滆滒牫牱犵猲獦疙盖砝硌秴箇紇纥肐胳臈臵舸茖菏葛蓋虼蛒蛤袼裓觡詥諽謌輵轕鉀鉻鉿鎑鎘鎶铬镉閘閣閤阁隔革鞈鞷韐韚頜颌饹騔骼髂鬲魺鮥鮯鰪鴐鴚鴿鵅鸽鿔", "膜": "万么伯佰冒劘劰勿唜嗼嘿嚤嚩嚰圽塻墨妺嫫嫼嬷寞尛帓帕帞庅怽懡戂抹摩摸摹撫擵攠无昧昩暯末枺模橅歾歿殁没沫湐漠瀎無爅狢獏瘼百皌眜眽眿瞐瞙砞磨礳秣粖糢絈絔縸纆耱脈脉艒茉莈莫蓦藐藦蘑蛨蟆蟔袜袹謨謩譕谟貃貈貉貊貌貘鄚銆鏌镆陌靺鞨饃饝馍驀髍魔魩魹麽默黙", "膝": "习係俙傒僖兮凞匸卌卤卥卻厀吚吸呬呰咥咦咭唏唽喜喺嘻噏嚊嚱囍塈墍壐夕奊奚娭媐媳嬆嬉屃屎屖屣屭嵇嵠嶍嶲巂巇希席徆徙徯忚忥怬怸恄恓息悉悕惁惜愾慀憘憙戏戯戱戲扱扸摡撕擊既昔晞晰晳暿曦杫析枲栖桸棲椞椺榽槢樨橀橲檄欪欯欷歖歙氣氥汐洒洗浠淅渓溪滊漇漝潝潟澙濕灑烯焁焈焟焬煕熂熄熈熙熹熺熻燍燨爔牺犀犔犠犧狶猎獻玺琋璽瓕瘜皙盻睎瞦矖矽硒碏磎磶礂禊禧稀稧穸窸粞糦系細綌緆縘縰繥繫纚细绤羛義羲習翕翖肸肹脅腊舃舄舾茜莃莔菥葈葸蒠蒵蓆蓰蔇蕮薂虒虩蜤蜥蜴蝷螅螇蟋蟢蠵衋袭裼褶襲西覀覡覤觋觹觽觿訢詑誒諰謑謚謵譆谿豀豨豯貕赥赩趇趘蹊蹝躧遟邜郄郋郗郤鄎酅醯釐釳釸鈒鈢鉨鉩銑錫錯鎴鏭鑴铣锡闟阋隙隟隰隵雟雭霫霼飁餏餙餼饩饻騱騽驨鬩鯑鰓鰼鱚鳛鵗鸂黖鼳鼷鿭", "膳": "傓僐僤儃儋删刪剡剼单善單嘇圸埏墠墡壇姍姗嬗山