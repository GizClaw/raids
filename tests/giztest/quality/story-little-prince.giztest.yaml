  parallel:
  - id: flowcraft_transitions_opening_with_guidance
    client: flowcraft__transitions
    peer_stream:
      mode: text
      input: 请从第一章开始《小王子》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_transitions_opening_with_guidance
    client: eino__transitions
    peer_stream:
      mode: text
      input: 请从第一章开始《小王子》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: flowcraft_roles_narrator_chapter_setup_1
