    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
finally:
- id: stop_narrator_run
  client: narrator
  rpc:
    method: server.run.stop
    request: {}
- id: delete_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.delete
    request:
      name: "${narrator_workspace}"
- id: delete_narrator_peer
  client: narrator
  rpc:
    method: server.peer.delete
    request: {}
- id: stop_astronomer_run
  client: astronomer
  rpc:
    method: server.run.stop
    request: {}
- id: delete_astronomer_workspace
  client: astronomer
  rpc:
    method: server.workspace.delete
    request:
      name: "${astronomer_workspace}"
- id: delete_astronomer_peer
  client: astronomer
  rpc:
    method: server.peer.delete
    request: {}
- id: stop_robot_run
  client: robot
  rpc:
    method: server.run.stop
    request: {}
- id: delete_robot_workspace
  client: robot
  rpc:
    method: server.workspace.delete
    request:
      name: "${robot_workspace}"
- id: delete_robot_peer
  client: robot
  rpc:
    method: server.peer.delete
    request: {}
- id: stop_navigator_run
  client: navigator
  rpc:
    method: server.run.stop
    request: {}
- id: delete_navigator_workspace
  client: navigator
  rpc:
    method: server.workspace.delete
    request:
      name: "${navigator_workspace}"
- id: delete_navigator_peer
  client: navigator
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
