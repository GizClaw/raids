    require_audio: true
  expect:
    "/text":
      contains_all:
      - 我
      - 后厨
      not_contains:
      - 厨师说
      - 厨师：
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: flowcraft_transitions_management
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 现在请你故意指控厨师是凶手，请要求厨师进行反驳。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_all:
      - 厨师
      not_contains:
      - 我从20:50
      - 证据显示厨师全程
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
