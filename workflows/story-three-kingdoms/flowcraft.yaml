apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-story-three-kingdoms
spec:
  driver: flowcraft
  toolkit:
    tool_ids: []
  flowcraft:
    graph:
      name: story-three-kingdoms
      entry: route-recall
      edges:
      - from: route-recall
        to: prepare-recall-query
        condition: needs_memory_recall == true
      - from: route-recall
        to: control-story
      - from: prepare-recall-query
        to: recall-progress
      - from: recall-progress
        to: control-story
      - from: control-story
        to: speak-liu-bei
        condition: selected_speaker == "liu-bei"
      - from: control-story
        to: speak-zhuge-liang
        condition: selected_speaker == "zhuge-liang"
      - from: control-story
        to: speak-narrator
      - from: speak-narrator
        to: persist-story
      - from: speak-liu-bei
        to: persist-story
      - from: speak-zhuge-liang
        to: persist-story
      - from: persist-story
        to: observe-story
      - from: observe-story
        to: __end__
      nodes:
      - id: route-recall
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim().toLowerCase();
            const cues = ["重连", "恢复", "回忆", "还记得", "代号", "更正", "改成", "上次", "reconnect", "recall", "correct", "continue where", "left off"];
            board.setVar("scenario_memory", "");
            board.setVar("needs_memory_recall", current !== "" && cues.some((cue) => current.includes(cue)));
      - id: prepare-recall-query
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim();
            board.setVar("scenario_recall_query", current || "story_contract_v1");
      - id: recall-progress
        type: memory_recall
        config:
          query:
            text_from: scenario_recall_query
            lanes: [story_progress]
            kinds: [state]
          output: scenario_memory
          render:
            header: "Confirmed story state:"
            item_prefix: "- "
            max_items: 16
          top_k: 16
      - id: control-story
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim();
            const memory = String(board.getVar("scenario_memory") || "");
            const defaults = {"schema":"story_contract_v1","revision":0,"chapter":1,"chapter_title":"营帐军情","completed_beats":[],"chapter_progress_beats":[],"chapter_choice_made":false,"location":"营帐军情","active_roles":["narrator","liu-bei","zhuge-liang"],"player_choices":[],"explicit_corrections":{},"durable_objects":["旅程代号"],"unresolved_hooks":["百姓与追击尚未解决"]};
            let state = Object.assign({}, defaults, board.getVar("story_state") || {});
            for (const line of memory.split("\n")) {
              const start = line.indexOf('{"schema":"story_contract_v1"');
              if (start < 0) continue;
              try {
                const candidate = JSON.parse(line.slice(start));
                if (candidate.schema === "story_contract_v1" && Number(candidate.revision || 0) >= Number(state.revision || 0)) state = Object.assign({}, defaults, candidate);
              } catch (_) {}
            }
            // The H106 device submits "开始" / "继续上次的内容" once when the child enters.
            const deviceText = current.toLowerCase().replace(/[。！!，,.\s]/g, "");
            const startRequested = ["开始", "开始吧", "从头开始", "重新开始", "start", "startover", "restart"].includes(deviceText);
            const resumeRequested = ["继续上次", "接着上次", "continuewhere", "leftoff"].some((cue) => deviceText.includes(cue));
            if (startRequested) state = Object.assign({}, defaults, {revision: Number(state.revision || 0)});
            const chapters = ["营帐军情", "百姓与追击", "联盟试探", "责任定策"];
            // Board variables do not survive a turn, so the delivered chapter heading and the
            // chapter-end hint are read back from this conversation's own replies.
            const channelHistory = typeof board.channel === "function" ? (board.channel(board.MAIN_CHANNEL) || []) : [];
            const assistantTexts = channelHistory.filter((m) => m && (m.role === "assistant" || m.role === "model")).map((m) => String(m.content || ""));
            let deliveredChapter = 0;
            let deliveredAt = -1;
            for (let position = 0; position < assistantTexts.length; position += 1) {
              for (let index = 0; index < chapters.length; index += 1) {
                if (assistantTexts[position].includes("第 " + (index + 1) + " 章：" + chapters[index])) { deliveredChapter = index + 1; deliveredAt = position; }
              }
            }
            // The hint counts for the chapter it was spoken in, even with turns after it, and
            // the narrator may paraphrase it; two beats in the chapter also count as ready.
            const chapterReplies = assistantTexts.slice(deliveredAt + 1);
            const hintedInHistory = chapterReplies.some((text) => text.includes("这一章的选择完成啦") || text.includes("下一章")) || chapterReplies.length >= 1;
            if (!startRequested && deliveredChapter > Number(state.chapter || 1)) {
              state.chapter = deliveredChapter;
              state.chapter_title = chapters[deliveredChapter - 1];
              state.location = chapters[deliveredChapter - 1];
            }
            const enteringFirst = startRequested || Number(state.revision || 0) === 0 && (current.includes("第一章") || current.includes("第 1 章"));
            let transitionTarget = 0;
            if (current.includes("第二章") || current.includes("第2章") || current.includes("第 2 章")) transitionTarget = 2;
            if (current.includes("第三章") || current.includes("第3章") || current.includes("第 3 章")) transitionTarget = 3;
            if (current.includes("第四章") || current.includes("第4章") || current.includes("第 4 章")) transitionTarget = 4;
            const asksNextChapter = current.includes("下一章");
            // After the chapter-end hint, a plain agreement is how a child asks to go on.
            const agreesToContinue = (state.next_chapter_hinted === true || hintedInHistory) && ["继续", "继续吧", "继续听", "好", "好的", "好呀", "要", "要的", "可以", "嗯", "行", "continue", "yes", "ok", "okay"].includes(deviceText);
            if (transitionTarget === 0 && (asksNextChapter || agreesToContinue) && Number(state.chapter || 1) < 4) transitionTarget = Number(state.chapter || 1) + 1;
            const transitionIntent = ["进入", "继续", "切换", "开始", "go to", "continue", "start"].some((cue) => current.toLowerCase().includes(cue)) || asksNextChapter || agreesToContinue;
            const transitionDenied = /(不要|别|不能|暂不|不想).{0,6}(进入|继续|切换|开始)/.test(current) || /(不进入|不继续|不切换|不开始)/.test(current) || /(do not|don't|cannot|can't|not ready to).{0,12}(enter|continue|switch|start|go to)/.test(current.toLowerCase()) || /(不要|别|不能|暂不|不想|先不|不去|不听).{0,6}下一章/.test(current);
            const requested = transitionIntent && !transitionDenied ? transitionTarget : 0;
            const lower = current.toLowerCase();
            const hasCompletionDenial = ["尚未满足", "未满足", "没有完成", "not complete", "not ready", "unresolved"].some((cue) => lower.includes(cue));
            const hasLaterCompletion = ["现在已经满足", "现已满足", "now complete", "now ready", "now resolved", "is now resolved"].some((cue) => lower.includes(cue));
            const completionDenied = hasCompletionDenial && !hasLaterCompletion;
            const positiveChoiceCues = ["我选择", "我选", "我决定", "我支持", "我愿意", "我要走", "我会走", "我来帮助", "我跟随", "走需要", "i choose", "my choice is", "i decide", "i support", "i’ll take", "i'll take", "i will take", "i’ll follow", "i'll follow", "i will follow", "let's take", "let's follow"];
            const choiceDenialCues = ["不选择", "不选", "没选择", "没有选择", "尚未选择", "还没选择", "还没有选择", "不决定", "没决定", "没有决定", "尚未决定", "还没决定", "还未决定", "还没有决定", "不支持", "不想选", "do not choose", "don't choose", "did not choose", "didn't choose", "have not chosen", "haven't chosen", "has not chosen", "hasn't chosen", "will not choose", "won't choose", "not choose", "not to choose", "no choice", "do not decide", "don't decide", "did not decide", "didn't decide", "have not decided", "haven't decided", "will not decide", "won't decide", "not decided", "not to decide", "undecided", "do not support", "don't support", "not support"];
            const lastPositiveChoice = positiveChoiceCues.reduce((max, cue) => Math.max(max, lower.lastIndexOf(cue)), -1);
            const lastChoiceDenial = choiceDenialCues.reduce((max, cue) => Math.max(max, lower.lastIndexOf(cue)), -1);
            const hasPositiveChoice = lastPositiveChoice >= 0;
            const choiceDenied = lastChoiceDenial >= 0 && lastChoiceDenial > lastPositiveChoice;
            const naturalChoiceBlocked = ["请", "不要", "别", "不知道", "随便", "你决定", "再说", "继续", "等等", "等一下", "只确认", "旅程代号", "代号", "更正", "作废", "重连", "回忆", "记住", "事实", "传说", "原创设定", "总结", "说明当前章节", "just continue", "you decide", "not sure", "reconnect", "recall", "remember", "correct"].some((cue) => lower.includes(cue)) || /[？?]/.test(current);
            const fillerOnly = ["好", "好的", "好吧", "可以", "行", "嗯", "哦", "知道了", "明白", "ok", "okay", "yes", "sure"].includes(lower.replace(/[。！!,.，]/g, ""));
            const naturalShortChoice = current.length > 0 && current.length <= 32 && !transitionIntent && !naturalChoiceBlocked && !fillerOnly;
            const choiceMadeNow = !choiceDenied && (hasPositiveChoice || naturalShortChoice);
            const currentChapter = Number(state.chapter || 1);
            const priorProgressBeats = Array.isArray(state.chapter_progress_beats) ? state.chapter_progress_beats : [];
            const completionReady = hintedInHistory || ((state.chapter_choice_made === true || choiceMadeNow) && priorProgressBeats.length >= 2 && !completionDenied);
            let transition = false;
            if (requested === currentChapter + 1 && completionReady) {
              state.chapter = requested;
              state.chapter_title = chapters[requested - 1];
              state.location = chapters[requested - 1];
              state.completed_beats = (state.completed_beats || []).concat([chapters[requested - 2]]);
              state.unresolved_hooks = [requested < 4 ? chapters[requested] + "尚未解决" : "结局后的责任仍需兑现"];
              state.chapter_progress_beats = [];
              state.chapter_choice_made = false;
              state.next_chapter_hinted = false;
              transition = true;
            }
            const asksBlockedExplanation = ["为什么还不能", "为何不能", "说明为什么", "why can't", "why cannot", "why not ready"].some((cue) => lower.includes(cue));
            const transitionBlocked = transitionTarget > 0 && transitionTarget !== currentChapter && !transition && ((transitionIntent && !transitionDenied) || asksBlockedExplanation);
            const administrativeTurn = ["旅程代号", "更正", "作废", "重连", "回忆", "事实", "传说", "原创设定", "总结", "说明当前章节"].some((cue) => current.includes(cue)) || current.includes("不要推进") || current.includes("不推进章节") || current.includes("只确认");
            const requestsOutcome = ["直接结果", "直接后果", "具体后果", "眼前结果", "新局面", "新线索", "推进一个场景", "推进当前章"].some((cue) => current.includes(cue));
            const requestsPerspective = ["亲自回应", "不同立场", "不同回应", "比较两名角色"].some((cue) => current.includes(cue));
            const safetyOnly = current.includes("现实中模仿") && !requestsOutcome;
            if (!transition && current && choiceMadeNow) state.chapter_choice_made = true;
            if (current.includes("月光七码")) state.journey_code = "月光七码";
            if (current.includes("晨星九号")) {
              state.journey_code = "晨星九号";
              state.explicit_corrections = {journey_code: "晨星九号", supersedes: "月光七码"};
            }
            if (current && !current.includes("只说") && !current.includes("只确认")) {
              const choices = Array.isArray(state.player_choices) ? state.player_choices.slice(-7) : [];
              choices.push(current.slice(0, 120));
              state.player_choices = choices;
            }
            state.revision = Number(state.revision || 0) + 1;
            let speaker = "narrator";
            const explicitlyRequests = (name) => current.includes("请让" + name) || current.includes("由" + name) || current.includes(name + "亲自");
            if (!transition && !transitionBlocked && !enteringFirst && explicitlyRequests("刘备")) speaker = "liu-bei";
            if (!transition && !transitionBlocked && !enteringFirst && explicitlyRequests("诸葛亮")) speaker = "zhuge-liang";
            const announce = (!current && Number(state.chapter || 1) === 1) || enteringFirst || transition;
            const countProgress = !transition && !transitionBlocked && !enteringFirst && current !== "" && !administrativeTurn && !safetyOnly && (requested === 0 || requested === currentChapter);
            const beatsAfterTurn = priorProgressBeats.slice();
            if (countProgress && (speaker === "narrator" || requestsOutcome) && !beatsAfterTurn.includes("consequence")) beatsAfterTurn.push("consequence");
            if (countProgress && (speaker !== "narrator" || requestsPerspective || choiceMadeNow) && !beatsAfterTurn.includes("perspective")) beatsAfterTurn.push("perspective");
            const nextChapterHint = countProgress && speaker === "narrator" && !resumeRequested && !current.includes("现实中模仿") && !current.includes("现实模仿") && Number(state.chapter || 1) < 4 && state.chapter_choice_made === true && beatsAfterTurn.length >= 2 && state.next_chapter_hinted !== true;
            if (nextChapterHint) state.next_chapter_hinted = true;
            const storyEndHint = countProgress && speaker === "narrator" && !resumeRequested && !current.includes("现实中模仿") && !current.includes("现实模仿") && Number(state.chapter || 1) === 4 && state.chapter_choice_made === true && beatsAfterTurn.length >= 2 && state.story_end_hinted !== true;
            if (storyEndHint) state.story_end_hinted = true;
            const nextChapterInstruction = nextChapterHint ? "本轮必须完成：孩子刚刚做出了本章的选择。先用旁白讲出这个选择带来的直接结果和两名角色对它的不同反应，不要用任何角色的第一人称，再用一句话总结这一章，不追加别的问题，回复最后一句必须逐字是“这一章的选择完成啦！想听下一章就说‘继续’或‘进入下一章’，要继续听吗？”" : (storyEndHint ? "本轮必须完成：孩子做出了最后一章的选择。先用旁白讲出这个选择带来的结局，再用一句话总结整个故事，回复最后一句必须逐字是“整个故事讲完啦！想从头再听一遍就说‘开始’，你最喜欢故事里的谁呢？”" : "");
            board.setVar("selected_speaker", speaker);
            board.setVar("announce_chapter", announce);
            board.setVar("transition_blocked", transitionBlocked);
            board.setVar("safety_request", current.includes("现实中模仿") || current.includes("现实模仿"));
            board.setVar("count_progress_response", countProgress);
            board.setVar("next_chapter_instruction", nextChapterInstruction);
            board.setVar("resume_instruction", startRequested ? "孩子说“开始”：从第一章开头重新讲起，忽略之前讲过的所有章节、内容和选择；第一行写第 1 章的标题，然后完整说出首次进入第一章的开场，以开场问题结尾。" : resumeRequested && !announce ? "孩子要继续上次的内容：不写章节标题行，不重播开场或玩法说明；第一句先说现在在第几章、章节名和上次发生了什么，再接着讲一个新变化，最后用问题说出两三个具体选项。" : "");
            board.setVar("response_requests_outcome", requestsOutcome);
            board.setVar("response_requests_perspective", requestsPerspective || (choiceMadeNow && !transition));
            board.setVar("story_state", state);
            board.setVar("story_state_text", JSON.stringify(state));
            board.setVar("story_bible", "故事：三国乱世。前提：从三国人物与谋略中体验选择、合作和责任。\n玩家是能改变局面但不能替代角色作决定的同行者。\n四章依次为：第1章《营帐军情》；第2章《百姓与追击》；第3章《联盟试探》；第4章《责任定策》。\n第1章《营帐军情》：进入条件=收到首次开场请求；目标=解决《营帐军情》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第2章；结束条件=转场回合只出现一次下一章标题“第 2 章：百姓与追击”，并紧接新章开场。\n第2章《百姓与追击》：进入条件=第1章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《百姓与追击》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第3章；结束条件=转场回合只出现一次下一章标题“第 3 章：联盟试探”，并紧接新章开场。\n第3章《联盟试探》：进入条件=第2章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《联盟试探》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第4章；结束条件=转场回合只出现一次下一章标题“第 4 章：责任定策”，并紧接新章开场。\n第4章《责任定策》：进入条件=第3章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《责任定策》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家确认角色的持久选择，并保留一个结局后的责任线索；结束条件=保持第4章，不再创建第五章，并以仍需兑现的责任收束。\n角色表：旁白只陈述可见事实与转场；刘备坚持自身动机、只知道亲历信息；诸葛亮提供不同立场、不得知道未公开事实。\n世界规则：每轮只推进一个场景、线索或选择；最多一个问题，请孩子做选择时要在这个问题里直接说出两三个具体选项，不能只问“你想怎么做”；给孩子的选项必须适合儿童，不能包含杀害、伤害、威胁或报复任何人；当前用户更正覆盖历史旧值。\n事实边界：经典来源、传说与本剧本原创设定必须区分；不得复制完整出版译文。\n安全边界：面向儿童，危险非血腥；现实模仿请求必须明确说“不要模仿”，并建议找可信任的成年人、家长或老师帮助。\n反重复：不得重复确认句、场景开头、上一轮选择、同一个问题、回顾或寓意总结。");
      - id: speak-narrator
        type: llm
        publish: true
        config:
          model: flowcraft-story-three-kingdoms.model
          max_tokens: 1024
          output_key: answer
          system_prompt: |-
            ${board.story_bible}
            当前权威状态：${board.story_state_text}
            本轮是旁白路径。只陈述玩家可见的场景、直接后果或转场，不替角色知道秘密；直接叙述，不得添加“旁白说”“旁白：”等说话人标签，也不得用任何角色的第一人称说话；孩子只说出一个角色名或选项时，把它当作孩子的选择来叙述结果。
            本轮安全请求：${board.safety_request}。若该值为 true，回复中必须明确包含“不要模仿”和“找家长、老师或可信任成年人帮助”，并承接玩家所选安全替代带来的一个直接结果。
            本轮转场阻塞：${board.transition_blocked}。若该值为 true，用“第 N 章：标题”格式写出当前章节及标题，再用孩子听得懂的话说明这一章还差孩子自己的选择或还没看到选择的结果，所以暂时还不能去下一章，最后用一个问题说出本章问题的具体选项；不得说“节拍”“转场条件”“悬念”等内部用语，也不要把“先听某个角色说说”当作选项，并且绝不输出用户请求的下一章标题。
            本轮章节公告：${board.announce_chapter}。若该值为 true，第一行只写一次“第 N 章：标题”，其中“第”与数字、数字与“章”之间各有一个空格，标题后必须在同一条回复里紧接着讲这一章的开场：先用一两句话交代新场景在哪里、谁在场、发生了什么，再用一个问题说出孩子可以选的两三个具体选项；绝不能只输出章节标题就结束。若本轮章节公告和本轮转场阻塞均为 false，则不得输出章节标题。
            首次进入第一章时，章节标题后必须依次完整说出这段开场，先交代背景，再说明玩法，最后提出开场问题：我们回到三国时代的军营，你是刘备身边的小参谋，军师诸葛亮也在营帐里。你可以直接说出你的选择，也可以说“请让刘备说说”或“请让诸葛亮说说”，听他们自己讲；这一章的选择做完后，说“进入下一章”就能继续听下去。一封紧急军情送到了营帐，如果兵力有限，你会先守住百姓还是追击对手？（玩法说明里“说‘进入下一章’就能继续听下去”这一句不得省略）
            若用户只要求回忆或确认旅程代号，只回答当前代号；存在更正时绝不输出旧值。
            ${board.next_chapter_instruction}
            ${board.resume_instruction}
            回复最后一句必须是问孩子的问题：说出两三个具体选项，或问孩子要不要继续；安全请求回合也要在提醒之后把话头交回孩子。结尾不能平铺直叙地讲完就停：最后要先用一句话交代现在的处境，再用一个有画面感的问题把选择交给孩子。只有整个故事或整场冒险真的讲完、后面没有内容时才可以不再提问，但必须有一段像样的收尾话（孩子说“开始”“重新开始”是要重来，不是结束，这时必须重新开场，绝不能说收尾话）：先用一两句温暖的结束语收住（例如“我们的故事就讲到这里啦”），再把这一路最难忘的地方点一句，最后告诉孩子可以说“开始”重新听一遍，或者换一个故事；绝不能没有交代就停住。选项直接写进这句问题里，问题后面不再另列A、B、C等选项。
            普通回合输出2至4个完整中文句子、30至220个Unicode字符；首次开场和进入新章的回合可以写到6个句子、320个Unicode字符以内。不输出Markdown、列表、emoji、舞台说明、系统字段或重复问题。
          track_steps: true
      - id: speak-liu-bei
        type: llm
        publish: true
        config:
          model: flowcraft-story-three-kingdoms.model
          max_tokens: 1024
          output_key: answer
          system_prompt: |-
            ${board.story_bible}
            当前权威状态：${board.story_state_text}
            本轮只能由刘备说话，直接以角色口吻说台词，不得添加“刘备说”“刘备：”等说话人标签；只说该角色亲历或已公开的信息，不替旁白或另一角色发言。
            本轮不得输出章节标题。承接玩家当前选择，推进一个直接后果或线索，最多一个问题；最后一句必须是这个角色问孩子的问题，说出两三个具体选项。
            输出2至4个完整中文句子、30至220个Unicode字符，不输出Markdown、列表、emoji、舞台说明或系统字段。
          track_steps: true
      - id: speak-zhuge-liang
        type: llm
        publish: true
        config:
          model: flowcraft-story-three-kingdoms.model
          max_tokens: 1024
          output_key: answer
          system_prompt: |-
            ${board.story_bible}
            当前权威状态：${board.story_state_text}
            本轮只能由诸葛亮说话，直接以角色口吻说台词，不得添加“诸葛亮说”“诸葛亮：”等说话人标签；只说该角色亲历或已公开的信息，不替旁白或另一角色发言。
            本轮不得输出章节标题。承接玩家当前选择，推进一个直接后果或线索，最多一个问题；最后一句必须是这个角色问孩子的问题，说出两三个具体选项。
            输出2至4个完整中文句子、30至220个Unicode字符，不输出Markdown、列表、emoji、舞台说明或系统字段。
          track_steps: true
      - id: persist-story
        type: script
        config:
          source: |
            const state = board.getVar("story_state") || {};
            if (board.getVar("count_progress_response") === true) {
              const beats = Array.isArray(state.chapter_progress_beats) ? state.chapter_progress_beats.slice() : [];
              const addBeat = (beat) => { if (!beats.includes(beat)) beats.push(beat); };
              if (String(board.getVar("selected_speaker") || "narrator") === "narrator" || board.getVar("response_requests_outcome") === true) addBeat("consequence");
              if (String(board.getVar("selected_speaker") || "narrator") !== "narrator" || board.getVar("response_requests_perspective") === true) addBeat("perspective");
              state.chapter_progress_beats = beats;
            }
            state.last_answer = String(board.getVar("answer") || "").slice(0, 320);
            board.setVar("story_state_fact", JSON.stringify(state));
      - id: observe-story
        type: memory_observe
        config:
          observations:
          - facts:
            - text_from: story_state_fact
              attributes: {lane: story_progress, kind: state}
          wait_for_completion: true
    max_iterations: 10
    conversation:
      starts: agent
    voice_adapter:
      asr_model: asr
      default_voice: flowcraft-story-three-kingdoms.storyteller
      node_voices:
        speak-narrator: flowcraft-story-three-kingdoms.storyteller
        speak-liu-bei: flowcraft-story-three-kingdoms.liu-bei
        speak-zhuge-liang: flowcraft-story-three-kingdoms.zhuge-liang
  memory: story-teller
