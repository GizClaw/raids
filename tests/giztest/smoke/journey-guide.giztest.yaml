      maximum: 90000
    "/eino_history_turn_1_origin/events":
      non_empty: true
    "/eino_history_turn_1_origin/audio_bytes":
      minimum: 1
    "/eino_history_turn_1_origin/text_eos":
      equals: true
    "/eino_history_turn_1_origin/audio_eos":
      equals: true
    "/eino_history_turn_1_origin/first_audio_ms":
      maximum: 90000
    "/eino_history_turn_1_origin/audio_eos_ms":
      maximum: 90000
    "/eino_history_turn_1_origin/audio_integrity/streams":
      minimum: 1
    "/eino_history_turn_1_origin/audio_integrity/max_active":
      equals: 1
    "/eino_history_turn_1_origin/audio_integrity/open":
