          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_REALTIME
- id: probe_narrator
  timeout: 4m
  parallel:
  - id: flowcraft_multi_role_probe_narrator
    client: flowcraft_multi_role
    peer_stream:
      mode: text
      input: 请介绍这个体验，并从指定中文开场开始。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_multi_role_probe_narrator
    client: eino_multi_role
    peer_stream:
      mode: text
      input: 请介绍这个体验，并从指定中文开场开始。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  expect:
    "/flowcraft_multi_role_probe_narrator/text_eos":
      equals: true
    "/flowcraft_multi_role_probe_narrator/audio_eos":
      equals: true
    "/flowcraft_multi_role_probe_narrator/audio_bytes":
      minimum: 1
    "/flowcraft_multi_role_probe_narrator/first_text_ms":
      maximum: 6000
    "/flowcraft_multi_role_probe_narrator/first_audio_ms":
      maximum: 90000
    "/flowcraft_multi_role_probe_narrator/text":
      not_contains: ["###", "```", "- ", "* ", "【", "】", "进入下一章", "要不要继续", "想继续听就说", "这一章的选择完成啦", "等你说要不要", "是否继续听"]
      contains_all: ["今天我们是森林小侦探，要在森林步道上找植物和小动物留下的线索。你可以选一个线索先看，想不出来时就说“给我一个提示”。", "森林步道旁出现了叶片上的水珠和一串小脚印，你想先观察哪一个线索？"]
      min_length: 200
      max_length: 900
      non_empty: true
      pattern: "[？?]\\s*$"
    "/flowcraft_multi_role_probe_narrator/events":
      non_empty: true
    "/flowcraft_multi_role_probe_narrator/text_eos_ms":
      maximum: 180000
    "/flowcraft_multi_role_probe_narrator/audio_eos_ms":
      maximum: 180000
    "/flowcraft_multi_role_probe_narrator/audio_integrity/streams":
      equals: 1
    "/flowcraft_multi_role_probe_narrator/audio_integrity/max_active":
      equals: 1
    "/flowcraft_multi_role_probe_narrator/audio_integrity/open":
      equals: 0
    "/flowcraft_multi_role_probe_narrator/audio_integrity/violations":
      equals: 0
    "/flowcraft_multi_role_probe_narrator/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/flowcraft_multi_role_probe_narrator/audio_pacing/underruns":
      equals: 0
    "/eino_multi_role_probe_narrator/text_eos":
      equals: true
    "/eino_multi_role_probe_narrator/audio_eos":
      equals: true
    "/eino_multi_role_probe_narrator/audio_bytes":
      minimum: 1
    "/eino_multi_role_probe_narrator/first_text_ms":
      maximum: 6000
    "/eino_multi_role_probe_narrator/first_audio_ms":
      maximum: 90000
    "/eino_multi_role_probe_narrator/text":
      not_contains: ["###", "```", "- ", "* ", "【", "】", "进入下一章", "要不要继续", "想继续听就说", "这一章的选择完成啦", "等你说要不要", "是否继续听"]
      contains_all: ["今天我们是森林小侦探，要在森林步道上找植物和小动物留下的线索。你可以选一个线索先看，想不出来时就说“给我一个提示”。", "森林步道旁出现了叶片上的水珠和一串小脚印，你想先观察哪一个线索？"]
      min_length: 200
      max_length: 900
      non_empty: true
      pattern: "[？?]\\s*$"
    "/eino_multi_role_probe_narrator/events":
      non_empty: true
    "/eino_multi_role_probe_narrator/text_eos_ms":
      maximum: 180000
    "/eino_multi_role_probe_narrator/audio_eos_ms":
      maximum: 180000
    "/eino_multi_role_probe_narrator/audio_integrity/streams":
      equals: 1
    "/eino_multi_role_probe_narrator/audio_integrity/max_active":
      equals: 1
    "/eino_multi_role_probe_narrator/audio_integrity/open":
      equals: 0
    "/eino_multi_role_probe_narrator/audio_integrity/violations":
      equals: 0
    "/eino_multi_role_probe_narrator/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/eino_multi_role_probe_narrator/audio_pacing/underruns":
      equals: 0
- id: probe_narrator_first_response
  timeout: 15s
  parallel:
  - id: flowcraft_multi_role_probe_narrator_first_response
    client: flowcraft_multi_role
    peer_stream:
