# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for flowcraft-story-journey-center-earth,
# So that every reachable role path produces text and non-empty synthesized audio.
version: gizclaw.test/v1alpha1
name: story-journey-center-earth.flowcraft.roles
clients:
  narrator: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  axel: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  lidenbrock: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
  narrator_workspace: {direction: input, type: string, generate: token}
  axel_workspace: {direction: input, type: string, generate: token}
  lidenbrock_workspace: {direction: input, type: string, generate: token}
repeat: 1
timeout: 12m
steps:
- id: register_narrator
  client: narrator
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: ${narrator_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-journey-center-earth
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${narrator_workspace}"}}
- id: register_axel
  client: axel
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_axel_workspace
  client: axel
  rpc:
    method: server.workspace.create
    request:
      name: ${axel_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-journey-center-earth
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_axel_workspace
  client: axel
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${axel_workspace}"}}
- id: register_lidenbrock
  client: lidenbrock
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_lidenbrock_workspace
  client: lidenbrock
  rpc:
    method: server.workspace.create
    request:
      name: ${lidenbrock_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-journey-center-earth
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_lidenbrock_workspace
  client: lidenbrock
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${lidenbrock_workspace}"}}
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: "请由旁白承接当前故事，只推进一个可见线索。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 旁白}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: reject_premature_chapter_two
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: "请直接进入第二章；如果条件不足，只说明仍停留的当前章节。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_all:
      - "第 1 章"
      - "岩层入口"
      not_contains:
      - "第 2 章"
      - "地下水路"
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_axel
  client: axel
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让阿克塞尔亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 阿克塞尔}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_lidenbrock
  client: lidenbrock
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让黎登布洛克亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 黎登布洛克}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
finally:
- id: stop_narrator_run
  client: narrator
  rpc: {method: server.run.stop, request: {}}
- id: delete_narrator_workspace
  client: narrator
  rpc: {method: server.workspace.delete, request: {name: "${narrator_workspace}"}}
- id: delete_narrator_peer
  client: narrator
  rpc: {method: server.peer.delete, request: {}}
- id: stop_axel_run
  client: axel
  rpc: {method: server.run.stop, request: {}}
- id: delete_axel_workspace
  client: axel
  rpc: {method: server.workspace.delete, request: {name: "${axel_workspace}"}}
- id: delete_axel_peer
  client: axel
  rpc: {method: server.peer.delete, request: {}}
- id: stop_lidenbrock_run
  client: lidenbrock
  rpc: {method: server.run.stop, request: {}}
- id: delete_lidenbrock_workspace
  client: lidenbrock
  rpc: {method: server.workspace.delete, request: {name: "${lidenbrock_workspace}"}}
- id: delete_lidenbrock_peer
  client: lidenbrock
  rpc: {method: server.peer.delete, request: {}}
report:
  redact: [registration_token]
