- id: ja_zh_ja_to_zh_create_text
  client: ja_zh_ja_to_zh
  rpc:
    method: server.workspace.create
    request:
      name: "${ja_zh_ja_to_zh_text_workspace}"
      collection: translates
      workflow_name: translate-ja-zh
      parameters:
        asttranslate_workspace_parameters:
          agent_type: ASTTRANSLATE_WORKSPACE_PARAMETERS_AGENT_TYPE_AST_TRANSLATE
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: ja_zh_ja_to_zh_select_text
  client: ja_zh_ja_to_zh
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${ja_zh_ja_to_zh_text_workspace}"
- id: ja_zh_ja_to_zh_warmup_text
  client: ja_zh_ja_to_zh
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: ko_zh_ko_to_zh_create_text
