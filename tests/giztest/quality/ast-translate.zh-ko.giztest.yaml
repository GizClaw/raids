# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of ast-translate,
# So that safety, correction, recall, routing and language regressions fail at the original gates.
version: gizclaw.test/v1alpha1
name: ast-translate.quality.zh-ko
clients:
  ast:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  ast_case8_workspace_name:
    direction: input
    type: string
    generate: token
  ast_case8_audio_1:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case8_audio_2:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case8_audio_3:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case8_audio_4:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case8_audio_5:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case8_audio_6:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case8_audio_7:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case8_audio_8:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case8_audio_9:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ast_case8_audio_10:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
repeat: 1
timeout: 10m
steps:
- id: register_ast
  client: ast
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: ast_case8_stop_create_workspace
  client: ast
  rpc:
    method: server.run.stop
    request: {}
- id: ast_case8_create_workspace
  client: ast
  rpc:
    method: server.workspace.create
    request:
      name: "${ast_case8_workspace_name}"
      collection: translates
      workflow_name: translate-zh-ko
      parameters:
        asttranslate_workspace_parameters:
          agent_type: ASTTRANSLATE_WORKSPACE_PARAMETERS_AGENT_TYPE_AST_TRANSLATE
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: ast_case8_select_workspace
  client: ast
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${ast_case8_workspace_name}"
- id: ast_case8_warmup_workspace
  client: ast
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: ast_case8_synthesize_1_gratitude
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 我真的非常感谢你的热心帮助。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case8_audio_1
- id: ast_case8_turn_1_gratitude
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case8_audio_1}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 감사
      - 고맙
      - 고마워
      - 감사드립
      pattern: "\\p{Hangul}"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case8_synthesize_2_good-day
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 祝你今天度过愉快美好的一天。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case8_audio_2
- id: ast_case8_turn_2_good-day
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case8_audio_2}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      pattern: 좋은\s*하루|멋진\s*하루|행복한\s*하루|즐거운\s*하루|훌륭한\s*하루|좋은\s*날|멋진\s*날|하루\s*되
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case8_synthesize_3_farewell
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 期待下次和你再次见面。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case8_audio_3
- id: ast_case8_turn_3_farewell
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case8_audio_3}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      pattern: 다\s*시\s*만\s*나|다\s*음\s*에|또\s*만\s*나
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case8_synthesize_4_apology
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 给你带来不便我真的很抱歉。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case8_audio_4
- id: ast_case8_turn_4_apology
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case8_audio_4}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 미안
      - 죄송
      pattern: "\\p{Hangul}"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case8_synthesize_5_agreement
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 我完全同意这个计划。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case8_audio_5
- id: ast_case8_turn_5_agreement
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case8_audio_5}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 동의
      - 찬성
      pattern: "\\p{Hangul}"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case8_synthesize_6_ready
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 请告诉我你是否已经准备好出发。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case8_audio_6
- id: ast_case8_turn_6_ready
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case8_audio_6}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 준비
      pattern: "\\p{Hangul}"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case8_synthesize_7_help
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 你可以帮我搬一下这个箱子吗。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case8_audio_7
- id: ast_case8_turn_7_help
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case8_audio_7}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      pattern: 도\s*와|도\s*움|상\s*자\s*를(\s*\p{Hangul}){0,4}\s*(옮\s*겨|들\s*어)
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case8_synthesize_8_welcome
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 欢迎你来到我们的城市。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case8_audio_8
- id: ast_case8_turn_8_welcome
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case8_audio_8}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 환영
      pattern: "\\p{Hangul}"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case8_synthesize_9_congratulations
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 衷心祝贺你取得成功。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case8_audio_9
- id: ast_case8_turn_9_congratulations
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case8_audio_9}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 축하
      pattern: "\\p{Hangul}"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case8_synthesize_10_good-night
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 祝你今晚休息好并做个好梦。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case8_audio_10
- id: ast_case8_turn_10_good-night
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case8_audio_10}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      pattern: 안\s*녕\s*히\s*주\s*무|좋\s*은\s*꿈|잘\s*자|푹\s*쉬
      max_length: 200
    "/audio_bytes":
      minimum: 1
finally:
- id: stop_ast
  client: ast
  rpc:
    method: server.run.stop
    request: {}
- id: ast_case8_delete_workspace
  client: ast
  rpc:
    method: server.workspace.delete
    request:
      name: "${ast_case8_workspace_name}"
- id: delete_ast
  client: ast
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
