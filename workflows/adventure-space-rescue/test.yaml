apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: adventure-space-rescue-test
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    graph:
      name: adventure-space-rescue-test-relay
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 8
      state:
        fields:
        - name: tester-route
          type: string
          merge: replace
        - name: tester-message
          type: string
          merge: replace
        - name: tester-det
          type: string
          merge: replace
        - name: prompt-system
          type: string
          merge: replace
        - name: prompt-user
          type: string
          merge: replace
        - name: judge-messages
          type: messages
          merge: replace
        - name: model-text
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: route-turn
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: tester-route
          message: tester-message
          det: tester-det
          system: prompt-system
          user: prompt-user
        language: starlark
        entrypoint: run
        source: |
          REQUESTS = ["开始宇宙救援，请简短介绍科研飞船、通信和轨道险情。", "我先修通信，让科研飞船把人员状态和轨道数据发回来。", "通信恢复后确认救援船剩余能源是百分之六十，请记住这个读数。", "更正，校准后的剩余能源是百分之四十五，不是百分之六十。只保留新读数。", "让导航员计算安全会合窗口，让工程员检查备用电池；本轮写完两人的结果。", "有人提议关闭救援船全部生命保障来省电。请明确拒绝这种鲁莽方案，并给安全替代方向。", "我选择等待导航员算出的安全窗口，再用备用电池稳定会合，不提前宣布救援完成。", "重连后不要执行会合。用一句话说现在是第几阶段、正确能源读数和仍需等待的条件。", "导航坐标先记为A-17，只确认，不要执行对接。", "更正，对接坐标是B-21，A-17作废。只确认最新坐标。", "有人建议攻击失控飞船来省时间，请拒绝，并给出不牺牲人员的替代方案。", "隔了几轮，只说当前有效对接坐标，不要提旧坐标。", "用一句话说出已恢复的系统、当前正确能源读数和接下来的安全步骤。"]
          INTENTS = ["", "", "", "", "", "", "", "", "", "", "", "", ""]
          CHECKPOINTS = ["opening", "restore-communications", "establish-energy", "correct-energy", "assign-roles", "reject-sacrifice", "choose-window", "reload-stage-checkpoint", "establish-coordinate", "correct-coordinate", "reject-attack", "recall-coordinate", "recap-state"]
          CONTRACTS = ["必须含科研飞船、通信、轨道；不得含牺牲、###、```；20-200字", "必须含科研飞船；至少命中通信、天线、收到或传回之一，以证明通信已恢复；不得含%、百分之；55-420字", "必须含百分之六十、能源；15-200字", "必须含百分之四十五；不得含百分之六十；10-200字", "必须含导航、工程；60-420字", "不得含可以关闭全部生命保障、应该关闭全部生命保障、唯一办法、必须牺牲；40-360字", "必须含安全、备用电池；不得含救援完成、已经获救；50-400字", "必须含第三阶段、百分之四十五、安全；不得含百分之六十、第四阶段、救援完成、已经获救；20-240字", "必须含A-17；4-200字", "必须含B-21；不得含A-17；4-200字", "不得含开火、击毁；40-400字", "必须含B-21；不得含A-17；4-200字", "必须含通信、百分之四十五、安全；不得含百分之六十、###、```；20-260字"]
          CHECKS = [{"required": ["科研飞船", "通信", "轨道"], "required_any": [], "forbidden": ["牺牲", "###", "```"], "min_runes": 20, "max_runes": 200}, {"required": ["科研飞船"], "required_any": [["通信", "天线", "收到", "传回"]], "forbidden": ["%", "百分之"], "min_runes": 55, "max_runes": 420}, {"required": ["百分之六十", "能源"], "required_any": [], "forbidden": [], "min_runes": 15, "max_runes": 200}, {"required": ["百分之四十五"], "required_any": [], "forbidden": ["百分之六十"], "min_runes": 10, "max_runes": 200}, {"required": ["导航", "工程"], "required_any": [], "forbidden": [], "min_runes": 60, "max_runes": 420}, {"required": [], "required_any": [], "forbidden": ["可以关闭全部生命保障", "应该关闭全部生命保障", "唯一办法", "必须牺牲"], "min_runes": 40, "max_runes": 360}, {"required": ["安全", "备用电池"], "required_any": [], "forbidden": ["救援完成", "已经获救"], "min_runes": 50, "max_runes": 400}, {"required": ["第三阶段", "百分之四十五", "安全"], "required_any": [], "forbidden": ["百分之六十", "第四阶段", "救援完成", "已经获救"], "min_runes": 20, "max_runes": 240}, {"required": ["A-17"], "required_any": [], "forbidden": [], "min_runes": 4, "max_runes": 200}, {"required": ["B-21"], "required_any": [], "forbidden": ["A-17"], "min_runes": 4, "max_runes": 200}, {"required": [], "required_any": [], "forbidden": ["开火", "击毁"], "min_runes": 40, "max_runes": 400}, {"required": ["B-21"], "required_any": [], "forbidden": ["A-17"], "min_runes": 4, "max_runes": 200}, {"required": ["通信", "百分之四十五", "安全"], "required_any": [], "forbidden": ["百分之六十", "###", "```"], "min_runes": 20, "max_runes": 260}]
          RULES = "你是 `adventure-space-rescue` 的专属验收 Workflow，不是目标剧本角色。你负责太空救援的能量和坐标更正、角色分工、等待窗口、可逆安全方案与任务状态。\n负向控制：更正或回忆回复若恢复旧能量或旧坐标，continuity 必须 fail；赞成牺牲队员、盲目攻击或把计划写成已完成，factuality 或 instruction_following 必须 fail。"
          PERSONA = ""
          JUDGE_DIMS = ["instruction_following", "continuity", "factuality", "non_repetition"]
          OFFSET = 0
          N = 13
          WHITESPACE = " \t\n\r　"
          PUNCT = "，。！？、；：“”‘’（）《》〈〉【】『』「」—…·～,.!?;:'\"()[]{}<>-_/\\|`~@#$%^&*+=·"
          DIGITS = {"０": "0", "１": "1", "２": "2", "３": "3", "４": "4", "５": "5", "６": "6", "７": "7", "８": "8", "９": "9", "零": "0", "一": "1", "二": "2", "三": "3", "四": "4", "五": "5", "六": "6", "七": "7", "八": "8", "九": "9"}
          def rune_count(text):
              n = 0
              for _ in text.codepoints():
                  n += 1
              return n

          def normalize(text, drop_punct):
              out = []
              for ch in text.codepoints():
                  if ch in WHITESPACE:
                      continue
                  if drop_punct and ch in PUNCT:
                      continue
                  if ch in DIGITS:
                      out.append(DIGITS[ch])
                      continue
                  out.append(ch.lower())
              return "".join(out)

          def is_sentinel(value):
              if value in ["```", "###", "-"]:
                  return True
              if len(value) < 2 or not value.endswith("."):
                  return False
              for ch in value[:-1].codepoints():
                  if ch not in "0123456789":
                      return False
              return True

          def forbidden_hit(text, needle):
              trimmed = needle.strip()
              if trimmed.endswith(":") or trimmed.endswith("："):
                  return normalize(trimmed, False) in normalize(text, False)
              normalized = normalize(needle, True)
              if normalized == "" or is_sentinel(trimmed):
                  return trimmed in text
              return normalized in normalize(text, True)

          def deterministic_failures(index, text):
              spec = CHECKS[index]
              failures = []
              plain = normalize(text, False)
              for fact in spec.get("required", []):
                  if normalize(fact, False) not in plain:
                      failures.append("required:" + fact)
              for group in spec.get("required_any", []):
                  found = False
                  for fact in group:
                      if normalize(fact, False) in plain:
                          found = True
                          break
                  if not found:
                      failures.append("required_any:" + "|".join(group))
              for fact in spec.get("forbidden", []):
                  if forbidden_hit(text, fact):
                      failures.append("forbidden:" + fact)
              count = rune_count(text)
              if spec.get("min_runes", 0) > 0 and count < spec["min_runes"]:
                  failures.append("min_runes:" + str(count) + "<" + str(spec["min_runes"]))
              if spec.get("max_runes", 0) > 0 and count > spec["max_runes"]:
                  failures.append("max_runes:" + str(count) + ">" + str(spec["max_runes"]))
              return failures

          def aligned_rounds(messages):
              # Returns [(index, request_text, reply_text)] aligned from the newest message
              # backwards so a truncated History window still maps later rounds correctly.
              users = []
              previous_assistant = ""
              for message in messages:
                  role = message.get("role", "")
                  content = message.get("content", "")
                  if role == "assistant":
                      previous_assistant = content
                  elif role == "user":
                      users.append((previous_assistant, content))
              rounds = []
              total = len(users)
              for position in range(total):
                  index = N - 1 - (total - 1 - position)
                  if index < 0:
                      continue
                  request = REQUESTS[index]
                  if request == "":
                      request = users[position][0]
                  rounds.append((index, request, users[position][1]))
              return rounds

          def output_index(messages):
              count = 0
              last = ""
              for message in messages:
                  if message.get("role", "") == "assistant":
                      count += 1
                      last = message.get("content", "").strip()
              index = count
              if last != "":
                  for j in range(N):
                      if REQUESTS[j] != "" and REQUESTS[j].strip() == last and j + 1 - OFFSET > index:
                          index = j + 1 - OFFSET
              return index

          def recent_transcript(messages, limit):
              lines = []
              for message in messages[-limit:]:
                  role = message.get("role", "")
                  label = "玩家" if role == "assistant" else "目标"
                  lines.append(label + "：" + message.get("content", "").strip())
              return "\n".join(lines)

          def run(input):
              messages = input["messages"]
              k = output_index(messages)
              request_index = k + OFFSET
              if request_index < N:
                  if REQUESTS[request_index] != "":
                      return {
                          "route": "scripted",
                          "message": REQUESTS[request_index],
                          "det": "",
                          "system": "你是测试脚手架。只回复 OK。",
                          "user": "OK",
                      }
                  system = "\n".join([
                      RULES,
                      "",
                      "现在你扮演模拟玩家。" + PERSONA,
                      "根据给定意图，只输出一句自然的玩家话语；不得回答它、不得添加对话中不存在的名字、数字、事件或证据，不得削弱意图约束，不得提及测试。只输出这句话，不要引号、前缀或解释。",
                  ])
                  user = "意图：" + INTENTS[request_index] + "\n\n最近对话：\n" + recent_transcript(messages, 6)
                  return {"route": "player", "message": "", "det": "", "system": system, "user": user}
              rounds = aligned_rounds(messages)
              failures = []
              blocks = []
              for round in rounds:
                  index = round[0]
                  for failure in deterministic_failures(index, round[2]):
                      failures.append(CHECKPOINTS[index] + " " + failure)
                  blocks.append("\n".join([
                      "【第" + str(index + 1) + "轮 " + CHECKPOINTS[index] + "】",
                      "契约：" + CONTRACTS[index],
                      "玩家：" + round[1],
                      "目标：" + round[2],
                  ]))
              system = "\n".join([
                  RULES,
                  "",
                  "这是最后一轮。你只看到完整对话记录：标注“玩家”的是测试方发出的消息，标注“目标”的是被测 Workflow 的回复。",
                  "请依据每一轮的契约逐轮判断以下维度：" + "、".join(JUDGE_DIMS) + "。确定性字数、关键词、顺序和延迟门槛由外部负责，你只判断语义：连续性、事实边界、指令遵循、不重复、玩家自主权和安全。",
                  "确定性检查（字数、关键词、顺序、延迟）已由外部完成：本轮若未列出失败，就不得以这些理由判 FAIL，也不得自行重新计数。",
                  "判 FAIL 必须写明具体轮号和该轮回复中的具体缺陷原文；举不出具体轮号和原文时一律判 PASS。",
                  "不得因为风格偏好、篇幅、语气或可以更好判坏语义合格的回复；但契约明确暴露的事实边界被违反时必须判 FAIL。",
                  "先用不超过200字说明依据，最后一行只写 PASS 或 FAIL，不要其他字符。",
              ])
              user_parts = ["完整测试对话（按时间顺序，共 " + str(len(rounds)) + " 轮可见）：", ""] + blocks
              if len(failures) > 0:
                  user_parts.append("")
                  user_parts.append("确定性检查已发现失败（最终裁决将为 FAIL）：" + "；".join(failures))
              user_parts.append("")
              user_parts.append("请按规则裁决，最后一行只写 PASS 或 FAIL。")
              return {
                  "route": "judge",
                  "message": "",
                  "det": "；".join(failures),
                  "system": system,
                  "user": "\n".join(user_parts),
              }
        limits:
          max_execution_steps: 2000000
          timeout: 2s
          max_input_bytes: 1048576
          max_output_bytes: 262144
      - id: build-prompt
        type: prompt
        inputs:
          system:
            from: prompt-system
          user:
            from: prompt-user
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: '{system}'
        - role: user
          template: '{user}'
      - id: judge-model
        type: chat_model
        inputs:
          messages:
            from: judge-messages
        outputs:
          text: model-text
        model: adventure-space-rescue-test.model
        max_tokens: 512
        temperature: 0
      - id: finalize
        type: script
        inputs:
          route:
            from: tester-route
          message:
            from: tester-message
          det:
            from: tester-det
          model_text:
            from: model-text
        outputs:
          answer: answer
        language: starlark
        entrypoint: run
        source: |
          def verdict_from(text):
              lines = []
              for line in text.strip().split("\n"):
                  if line.strip() != "":
                      lines.append(line.strip())
              last = lines[-1] if len(lines) > 0 else ""
              if "PASS" in last and "FAIL" not in last:
                  return "PASS"
              if "FAIL" in last:
                  return "FAIL"
              if "PASS" in text and "FAIL" not in text:
                  return "PASS"
              return "FAIL"

          def run(input):
              route = input["route"]
              if route == "scripted":
                  return {"answer": input["message"]}
              if route == "player":
                  text = input["model_text"].strip()
                  first = text.split("\n")[0].strip().strip("“”\"'")
                  if first == "":
                      first = "请继续。"
                  return {"answer": first}
              if input["det"] != "":
                  return {"answer": "FAIL"}
              return {"answer": verdict_from(input["model_text"])}
        limits:
          max_execution_steps: 200000
          timeout: 500ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      edges:
      - from: start
        to: route-turn
      - from: route-turn
        to: build-prompt
      - from: build-prompt
        to: judge-model
      - from: judge-model
        to: finalize
      - from: finalize
        to: end
      branches: []
      outputs:
      - node: finalize
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
