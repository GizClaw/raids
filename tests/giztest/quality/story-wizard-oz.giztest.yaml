# workflows/story-wizard-oz/README.md: | 旁白 / 旁白, narrator | 1,2,3,4 | 只述可见事实、管理和转场，不代演 | `flowcraft-story-wizard-oz.storyteller` / `eino-story-wizard-oz.storyteller` | `flowcraft-story-wizard-oz.storyteller` / `eino-story-wizard-oz.storyteller` |
# workflows/story-wizard-oz/README.md: 角色表：narrator 旁白，只叙述可见事实和公开信息、不代演角色；dorothy 多萝西（别名 多萝西/dorothy），第1至4章在场，想回家也不丢下伙伴；活泼坚定，第1章选择黄砖路，第4章珍惜共同经历；scarecrow 稻草人（别名 稻草人/scarecrow），第1至4章在场，想证明自己会思考；清晰好奇，第1章比较岔路，第3章拆解迷城谜题；tin-man 铁皮人（别名 铁皮人/铁樵夫/tin man/tin-man），第2至4章在场，想表现善意；清爽温和，第2章帮助伙伴越过障碍，第3章优先照顾落后者，第4章认识自己的关心；lion 狮子（别名 狮子/胆小狮/lion），第2至4章在场，想在害怕时也帮助朋友；憨厚诚实，第2章陪伴伙伴面对考验，第3章守住退路，第4章承认勇气不是不害怕；glinda 格琳达（别名 格琳达/善女巫/glinda），第4至4章在场，想帮助伙伴看见自己的能力；温柔稳重，第4章听取旅程后解释归途线索，不预知玩家未公开的经历。以上四章互动行动为本仓库基于经典的原创改编，并非原典逐字情节；历史、传说与改编须区分。所有角色只知亲历或已公开信息，不知他人私密想法及未来结果；每章比较至少两种立场，无需全员轮番发言。离场者只能由旁白说明去向，不跨地点代言。
# workflows/story-wizard-oz/README.md: 旧记忆中的角色名单按当前章节和角色表重新归一化，不覆盖旅程代号、更正和进度。开场、转场（含阻塞）、更正、安全管理优先旁白；其次按文本顺序选第一个明确点名且在场的角色，否定点名不触发，否则旁白。只报角色名或“我支持某人”是玩家选择。每轮一人直接第一人称发言，不加说话人标签，旁白不代演。
# workflows/story-wizard-oz/README.md: `routing-cases.json` 离线执行真实 JS / Starlark，覆盖点名、否定、顺序、章节出场、只报名字、管理优先、旧状态恢复与转场。离线门禁不等于在线音色验收；实际选中 Voice 仍需运行日志与试听确认。
version: gizclaw.test/v1alpha1
name: quality.story-wizard-oz
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_test_brief:
