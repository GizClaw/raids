# User Story:
# As a Raids catalog maintainer,
# I want the `chat-assistant-test` Tester Workflow to drive `flowcraft-chat-assistant` through one live relay,
# So that the 12-response `default-assistant-general` route, its deterministic contracts, and the final verdict stay declarative.
version: gizclaw.test/v1alpha1
name: paired.flowcraft-chat-assistant
clients:
  candidate:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
  tester:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  candidate_workspace:
    direction: input
    type: string
    generate: token
  tester_workspace:
    direction: input
    type: string
    generate: token
  test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-chat-assistant long-form-correction-format-and-reload
  verdict:
    direction: output
    type: string
  reload_handoff:
    direction: output
    type: string
repeat: 1
timeout: 52m
steps:
- id: register_candidate
  client: candidate
  rpc:
    method: server.register
    request:
      token: ${registration_token}
- id: register_tester
  client: tester
  rpc:
    method: server.register
    request:
      token: ${registration_token}
- id: create_candidate_workspace
  client: candidate
  rpc:
    method: server.workspace.create
    request:
      name: ${candidate_workspace}
      collection: assistants
      workflow_name: general-assistant
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: create_tester_workspace
  client: tester
  rpc:
    method: server.workspace.create
    request:
      name: ${tester_workspace}
      collection: raidtest-testers
      workflow_name: chat-assistant-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_candidate_workspace
  client: candidate
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: ${candidate_workspace}
- id: select_tester_workspace
  client: tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: ${tester_workspace}
- id: run_dialogue_before_reload
  timeout: 30m
  workspace_relay:
    first_client: tester
    second_client: candidate
    input: ${test_brief}
    media: text
    max_turns: 18
    terminal_client: candidate
  capture:
    reload_handoff: /terminal/text
  expect:
    /terminal/client:
      equals: candidate
    /completed_turns:
      equals: 18
    /turns/candidate/count:
      equals: 9
    /turns/tester/count:
      equals: 9
    /turns/candidate/first_text_ms/max:
      maximum: 6000
- id: recall_barrier_1
  client: candidate
  rpc:
    method: server.run.workspace.recall
    request:
      query: 下周四
  timeout: 90s
  expect:
    /available:
      equals: true
    /hits:
      non_empty: true
- id: recall_barrier_2
  client: candidate
  rpc:
    method: server.run.workspace.recall
    request:
      query: 苏州
  timeout: 90s
  expect:
    /available:
      equals: true
    /hits:
      non_empty: true
- id: recall_barrier_3
  client: candidate
  rpc:
    method: server.run.workspace.recall
    request:
      query: 周宁
  timeout: 90s
  expect:
    /available:
      equals: true
    /hits:
      non_empty: true
- id: recall_barrier_4
  client: candidate
  rpc:
    method: server.run.workspace.recall
    request:
      query: G7105
  timeout: 90s
  expect:
    /available:
      equals: true
    /hits:
      non_empty: true
- id: recall_barrier_5
  client: candidate
  rpc:
    method: server.run.workspace.recall
    request:
      query: 三点
  timeout: 90s
  expect:
    /available:
      equals: true
    /hits:
      non_empty: true
- id: recall_barrier_6
  client: candidate
  rpc:
    method: server.run.workspace.recall
    request:
      query: 青桥
  timeout: 90s
  expect:
    /available:
      equals: true
    /hits:
      non_empty: true
- id: reload_candidate_workspace
  client: candidate
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: run_dialogue_after_reload
  timeout: 12m
  workspace_relay:
    first_client: tester
    second_client: candidate
    input: ${reload_handoff}
    media: text
    max_turns: 7
    terminal_client: tester
  capture:
    verdict: /terminal/text
  expect:
    /terminal/client:
      equals: tester
    /terminal/text:
      pattern: ^\s*PASS\s*$
    /completed_turns:
      equals: 7
    /turns/candidate/count:
      equals: 3
    /turns/tester/count:
      equals: 4
    /turns/candidate/first_text_ms/max:
      maximum: 6000
    /turns/candidate/text_runes/max:
      maximum: 200
- id: emit_verdict
  output:
    variable: verdict
finally:
- id: stop_candidate_run
  client: candidate
  rpc:
    method: server.run.stop
    request: {}
- id: stop_tester_run
  client: tester
  rpc:
    method: server.run.stop
    request: {}
- id: delete_candidate_workspace
  client: candidate
  rpc:
    method: server.workspace.delete
    request:
      name: ${candidate_workspace}
- id: delete_tester_workspace
  client: tester
  rpc:
    method: server.workspace.delete
    request:
      name: ${tester_workspace}
- id: delete_candidate_peer
  client: candidate
  rpc:
    method: server.peer.delete
    request: {}
- id: delete_tester_peer
  client: tester
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
