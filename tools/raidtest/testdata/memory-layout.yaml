apiVersion: gizclaw.admin/v1alpha1
kind: MemoryLayout
metadata: {id: fixture-memory}
spec:
  flowcraft:
    extraction: {model: fixture-memory.extract, mode: single_pass}
    bbh: {}
    lanes:
      - {name: facts, kind: note, description: Facts, extract: Extract facts, recall: Recall facts}
    write: {mode: sync, tier: general}
  mem0:
    custom_instructions: Store facts.
    custom_categories: {facts: Facts}
  volc_mem0:
    strategies:
      - {name: facts, type: semantic, custom_instructions: Store facts.}
