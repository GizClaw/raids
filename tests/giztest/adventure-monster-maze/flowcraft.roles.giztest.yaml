    request:
      name: "${gatekeeper_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-adventure-monster-maze
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_gatekeeper_workspace
  client: gatekeeper
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${gatekeeper_workspace}"
- id: warmup_gatekeeper_workspace
  client: gatekeeper
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: gatekeeper_scene_setup_1
  client: gatekeeper
  timeout: 2m
  peer_stream:
    mode: text
    input: 开始迷宫
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_gatekeeper
  client: gatekeeper
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让守门怪兽亲自回应。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      not_contains:
      - 守门怪兽说
      - 守门怪兽：
- id: probe_gatekeeper_first_response
  client: gatekeeper
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让守门怪兽亲自回应。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: register_riddle-spirit
  client: riddle-spirit
  rpc:
    method: server.register
    request:
