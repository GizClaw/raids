# workflows/story-arabian-nights/README.md: - Cast: 旁白与山鲁佐德、山鲁亚尔、辛巴达、老商人；出场与知情边界见下表。
# workflows/story-arabian-nights/README.md: | narrator 旁白 | 1–4 | 只述可见事实、选择后果与转场，不代演角色 | `flowcraft-story-arabian-nights.storyteller` / `eino-story-arabian-nights.storyteller` |
# workflows/story-arabian-nights/README.md: | `sinbad` 辛巴达 / 辛巴达、sinbad | 2、3、4 | 我想带同行者安全找到路；清爽行动派，第2章用航行见闻辨认灯光，第3章实地核对地图岔路，第4章带队抵达黎明之门。 | `flowcraft-story-arabian-nights.sinbad` / `eino-story-arabian-nights.sinbad` |
# workflows/story-arabian-nights/README.md: 角色只说亲历或公开信息，第一人称且不加“某某说／某某：”。开场、转场、更正、安全管理优先旁白；明确点名仅选择当前在场人物，多人按文本顺序选一个，否定点名不触发；其余由旁白承接。例：“请让山鲁佐德说说”、“不要让山鲁佐德说话，请让山鲁亚尔说说”、“请让山鲁亚尔说说，再让山鲁佐德说说”。只报选项中的角色名算玩家选择。旧记忆的角色数组按当前章节重建。
# workflows/story-arabian-nights/README.md: - 保留双引擎 64 响应 relay、reload、更正、安全与转场回归。
# workflows/story-arabian-nights/README.md: - `flowcraft.roles.giztest.yaml` 与 `eino.roles.giztest.yaml` 各含 5 个隔离 Workspace；角色探针先开场，后续人物逐章完成选择、后果、观点与转场。
# workflows/story-arabian-nights/README.md: - `routing-cases.json` 的 79 个案例执行两引擎真实选人源码，覆盖全部角色和章节、别名、否定、多人顺序、未出场、旧记忆及转场归一化。
version: gizclaw.test/v1alpha1
name: quality.story-arabian-nights
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-story-arabian-nights long-form-story
  flowcraft_contracts_verdict:
    direction: output
    type: string
  eino_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-story-arabian-nights long-form-story
  eino_contracts_verdict:
    direction: output
    type: string
  flowcraft_transitions_workspace:
    direction: input
    type: string
    generate: token
  eino_transitions_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_shahrazad_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_shahryar_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_sinbad_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_merchant_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_shahrazad_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_shahryar_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_sinbad_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_merchant_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_routing_workspace:
    direction: input
    type: string
    generate: token
  eino_routing_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 724m
steps:
- id: register_flowcraft
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_flowcraft_tester
  client: flowcraft_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino
  client: eino
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino_tester
  client: eino_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_contracts_stop_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_contracts_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_candidate_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-arabian-nights
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_create_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_tester_workspace}"
      collection: raidtest-testers
      workflow_name: story-arabian-nights-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_select_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_candidate_workspace}"
- id: flowcraft_contracts_warmup_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_contracts_select_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_tester_workspace}"
- id: flowcraft_contracts_relay_responses_1_8
  timeout: 32m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${flowcraft_contracts_test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 17
    terminal_client: flowcraft_tester
  expect:
    "/terminal/client":
      equals: flowcraft_tester
    "/terminal/text":
      pattern: "^\\s*CHECKPOINT PASS\\s*$"
    "/completed_turns":
      equals: 17
    "/turns/flowcraft/count":
      equals: 8
    "/turns/flowcraft_tester/count":
      equals: 9
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 4
    "/turns/flowcraft/text_runes/max":
      maximum: 360
- id: flowcraft_contracts_relay_responses_9_16
  timeout: 32m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: CONTINUE 8
    media: text
    idle_timeout: 90s
    max_turns: 17
    terminal_client: flowcraft_tester
  expect:
    "/terminal/client":
      equals: flowcraft_tester
    "/terminal/text":
      pattern: "^\\s*CHECKPOINT PASS\\s*$"
    "/completed_turns":
      equals: 17
    "/turns/flowcraft/count":
      equals: 8
    "/turns/flowcraft_tester/count":
      equals: 9
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 4
    "/turns/flowcraft/text_runes/max":
      maximum: 360
- id: flowcraft_contracts_relay_responses_17_32
  timeout: 64m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: CONTINUE 16
    media: text
    idle_timeout: 90s
    max_turns: 33
    terminal_client: flowcraft_tester
  expect:
    "/terminal/client":
      equals: flowcraft_tester
    "/terminal/text":
      pattern: "^\\s*CHECKPOINT PASS\\s*$"
    "/completed_turns":
      equals: 33
    "/turns/flowcraft/count":
      equals: 16
    "/turns/flowcraft_tester/count":
      equals: 17
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 4
    "/turns/flowcraft/text_runes/max":
      maximum: 360
- id: flowcraft_contracts_recall_barrier
  client: flowcraft
  rpc:
    method: server.run.workspace.recall
    request:
      query: 月光七码
  timeout: 60s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: flowcraft_contracts_reload_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_contracts_relay_responses_33_48
  timeout: 64m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: CONTINUE 32
    media: text
    idle_timeout: 90s
    max_turns: 33
    terminal_client: flowcraft_tester
  expect:
    "/terminal/client":
      equals: flowcraft_tester
    "/terminal/text":
      pattern: "^\\s*CHECKPOINT PASS\\s*$"
    "/completed_turns":
      equals: 33
    "/turns/flowcraft/count":
      equals: 16
    "/turns/flowcraft_tester/count":
      equals: 17
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 4
    "/turns/flowcraft/text_runes/max":
      maximum: 360
- id: flowcraft_contracts_relay_responses_49_64
  timeout: 64m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: CONTINUE 48
    media: text
    idle_timeout: 90s
    max_turns: 33
    terminal_client: flowcraft_tester
  capture:
    flowcraft_contracts_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 33
    "/turns/flowcraft/count":
      equals: 16
    "/turns/flowcraft_tester/count":
      equals: 17
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 4
    "/turns/flowcraft/text_runes/max":
      maximum: 360
- id: flowcraft_contracts_emit_verdict
  output:
    variable: flowcraft_contracts_verdict
- id: eino_contracts_stop_create_candidate_workspace
  client: eino
  rpc:
    method: server.run.stop
    request: {}
- id: eino_contracts_create_candidate_workspace
  client: eino
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_contracts_candidate_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-arabian-nights
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_contracts_create_tester_workspace
  client: eino_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_contracts_tester_workspace}"
      collection: raidtest-testers
      workflow_name: story-arabian-nights-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_contracts_select_candidate_workspace
  client: eino
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_contracts_candidate_workspace}"
- id: eino_contracts_warmup_candidate_workspace
  client: eino
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_contracts_select_tester_workspace
  client: eino_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_contracts_tester_workspace}"
- id: eino_contracts_relay_responses_1_8
  timeout: 32m
  workspace_relay:
    first_client: eino_tester
    second_client: eino
    input: "${eino_contracts_test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 17
    terminal_client: eino_tester
  expect:
    "/terminal/client":
      equals: eino_tester
    "/terminal/text":
      pattern: "^\\s*CHECKPOINT PASS\\s*$"
    "/completed_turns":
      equals: 17
    "/turns/eino/count":
      equals: 8
    "/turns/eino_tester/count":
      equals: 9
    "/turns/eino/first_text_ms/max":
      maximum: 6000
    "/turns/eino/text_runes/min":
      minimum: 4
