# User Story:
# As a Raids catalog maintainer,
# I want equal opening, role and realtime responsiveness gates for every implementation,
# So that text and audio respond promptly without overlap or playback stalls.
version: gizclaw.test/v1alpha1
name: story-journey-center-earth.smoke
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_multi_role:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_multi_role:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_text_workspace:
    direction: input
    type: string
    generate: token
  eino_text_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_realtime_workspace:
    direction: input
    type: string
    generate: token
  eino_realtime_workspace:
    direction: input
    type: string
    generate: token
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  flowcraft_multi_role_text_workspace:
    direction: input
    type: string
    generate: token
  eino_multi_role_text_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_realtime_workspace:
    direction: input
    type: string
    generate: token
  eino_multi_role_realtime_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 12m
steps:
- id: flowcraft_register
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_register
  client: eino
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_create_text
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_text_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-journey-center-earth
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_select_text
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_text_workspace}"
- id: flowcraft_warmup_text
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_create_text
  client: eino
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_text_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-journey-center-earth
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_select_text
  client: eino
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_text_workspace}"
- id: eino_warmup_text
  client: eino
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_create_realtime
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_realtime_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-journey-center-earth
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_REALTIME
- id: eino_create_realtime
  client: eino
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_realtime_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-journey-center-earth
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_REALTIME
- timeout: 2m
  id: flowcraft_narrator_chapter_setup_1
  client: flowcraft
  peer_stream:
    mode: text
    input: 请从第一章开始《地心游记》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains: 第 1 章：岩层入口
      non_empty: true
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/events":
      non_empty: true
    "/text_eos_ms":
      maximum: 90000
    "/audio_eos_ms":
      maximum: 90000
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- timeout: 2m
