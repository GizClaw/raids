    value: BEGIN flowcraft-story-water-margin long-form-story
  eino_contracts_verdict:
    direction: output
    type: string
  flowcraft_transitions_workspace:
    direction: input
    type: string
    generate: token
  eino_transitions_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_lin_chong_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_lu_zhishen_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_wu_song_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_song_jiang_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_lin_chong_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_lu_zhishen_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_wu_song_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_song_jiang_workspace:
