    "/eino_transitions_natural_consequence/text_eos":
      equals: true
    "/eino_transitions_natural_consequence/audio_eos":
      equals: true
    "/eino_transitions_natural_consequence/audio_bytes":
      minimum: 1
    "/eino_transitions_natural_consequence/first_text_ms":
      maximum: 6000
    "/flowcraft_roles_probe_narrator/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/flowcraft_roles_probe_narrator/text_eos":
      equals: true
    "/flowcraft_roles_probe_narrator/audio_eos":
      equals: true
    "/flowcraft_roles_probe_narrator/audio_bytes":
      minimum: 1
    "/flowcraft_roles_probe_narrator/first_text_ms":
      maximum: 6000
    "/flowcraft_roles_probe_narrator/first_audio_ms":
      maximum: 90000
    "/eino_roles_probe_narrator/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/eino_roles_probe_narrator/text_eos":
