name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go for Starlark checks
        uses: actions/setup-go@v5
        with:
          go-version-file: scripts/test/starlark/go.mod
          cache-dependency-path: scripts/test/starlark/go.sum

      - name: Download GizClaw v0.20.2
        env:
          GIZCLAW_ASSET: gizclaw_0.20.2_amd64.deb
          GIZCLAW_SHA256: 7944b9a8a1344a5512e6d2babac31a2fa04361b5c8eeb7902b0c2f96ab264820
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/$GIZCLAW_ASSET"
          root="$RUNNER_TEMP/gizclaw-v0.20.2"
          curl --fail --location --retry 3 \
            --output "$package" \
            "https://github.com/GizClaw/gizclaw/releases/download/v0.20.2/$GIZCLAW_ASSET"
          printf '%s  %s\n' "$GIZCLAW_SHA256" "$package" | sha256sum --check --status
          dpkg-deb --extract "$package" "$root"
          printf 'GIZCLAW=%s\n' "$root/usr/bin/gizclaw" >> "$GITHUB_ENV"

      - name: Validate Resources and Giztest documents
        run: make test-unit-resources

      - name: Check generated learn raid packages
        run: make test-unit-learn

      - name: Check catalog Voice invariants
        run: make test-unit-voices
