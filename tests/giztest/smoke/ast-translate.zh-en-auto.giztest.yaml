# User Story:
# As a Raids catalog maintainer,
# I want equal opening, role and realtime responsiveness gates for every implementation,
# So that text and audio respond promptly without overlap or playback stalls.
version: gizclaw.test/v1alpha1
name: ast-translate.smoke.zh-en-auto
clients:
  zh_en_auto_en_to_zh_auto:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  zh_en_auto_zh_to_en_auto:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  zh_en_auto_en_to_zh_auto_text_workspace:
    direction: input
    type: string
    generate: token
  zh_en_auto_zh_to_en_auto_text_workspace:
    direction: input
    type: string
    generate: token
  zh_en_auto_en_to_zh_auto_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  zh_en_auto_zh_to_en_auto_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  zh_en_auto_en_to_zh_auto_realtime_workspace:
    direction: input
    type: string
    generate: token
  zh_en_auto_zh_to_en_auto_realtime_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 12m
steps:
- id: zh_en_auto_en_to_zh_auto_register
  client: zh_en_auto_en_to_zh_auto
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: zh_en_auto_en_to_zh_auto_create_text
  client: zh_en_auto_en_to_zh_auto
  rpc:
    method: server.workspace.create
    request:
      name: "${zh_en_auto_en_to_zh_auto_text_workspace}"
      collection: translates
      workflow_name: translate-zh-en-auto
      parameters:
        asttranslate_workspace_parameters:
          agent_type: ASTTRANSLATE_WORKSPACE_PARAMETERS_AGENT_TYPE_AST_TRANSLATE
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: zh_en_auto_en_to_zh_auto_select_text
  client: zh_en_auto_en_to_zh_auto
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${zh_en_auto_en_to_zh_auto_text_workspace}"
- id: zh_en_auto_en_to_zh_auto_warmup_text
  client: zh_en_auto_en_to_zh_auto
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: zh_en_auto_en_to_zh_auto_create_realtime
  client: zh_en_auto_en_to_zh_auto
  rpc:
    method: server.workspace.create
    request:
      name: "${zh_en_auto_en_to_zh_auto_realtime_workspace}"
      collection: translates
      workflow_name: translate-zh-en-auto
      parameters:
        asttranslate_workspace_parameters:
          agent_type: ASTTRANSLATE_WORKSPACE_PARAMETERS_AGENT_TYPE_AST_TRANSLATE
          input: WORKSPACE_INPUT_MODE_REALTIME
- id: synthesize_zh_en_auto_en_to_zh_auto_audio
  client: zh_en_auto_en_to_zh_auto
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: I truly appreciate your generous help.
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: zh_en_auto_en_to_zh_auto_audio
- id: zh_en_auto_zh_to_en_auto_reconnect_before_register
  client: zh_en_auto_zh_to_en_auto
  reconnect: {}
- id: zh_en_auto_zh_to_en_auto_register
  client: zh_en_auto_zh_to_en_auto
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: zh_en_auto_zh_to_en_auto_create_text
  client: zh_en_auto_zh_to_en_auto
  rpc:
    method: server.workspace.create
    request:
      name: "${zh_en_auto_zh_to_en_auto_text_workspace}"
      collection: translates
      workflow_name: translate-zh-en-auto
      parameters:
        asttranslate_workspace_parameters:
          agent_type: ASTTRANSLATE_WORKSPACE_PARAMETERS_AGENT_TYPE_AST_TRANSLATE
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: zh_en_auto_zh_to_en_auto_select_text
  client: zh_en_auto_zh_to_en_auto
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${zh_en_auto_zh_to_en_auto_text_workspace}"
- id: zh_en_auto_en_to_zh_auto_setup_keepalive_1
  client: zh_en_auto_en_to_zh_auto
  rpc:
    method: server.run.status
    request: {}
- id: zh_en_auto_zh_to_en_auto_warmup_text
  client: zh_en_auto_zh_to_en_auto
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: zh_en_auto_zh_to_en_auto_create_realtime
  client: zh_en_auto_zh_to_en_auto
  rpc:
    method: server.workspace.create
    request:
      name: "${zh_en_auto_zh_to_en_auto_realtime_workspace}"
      collection: translates
      workflow_name: translate-zh-en-auto
      parameters:
        asttranslate_workspace_parameters:
          agent_type: ASTTRANSLATE_WORKSPACE_PARAMETERS_AGENT_TYPE_AST_TRANSLATE
          input: WORKSPACE_INPUT_MODE_REALTIME
- id: synthesize_zh_en_auto_zh_to_en_auto_audio
  client: zh_en_auto_zh_to_en_auto
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 我真的非常感谢你的热心帮助。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: zh_en_auto_zh_to_en_auto_audio
- id: suite_responses_1
  parallel:
  - id: zh_en_auto_en_to_zh_auto_turn_1_gratitude
    client: zh_en_auto_en_to_zh_auto
    peer_stream:
      mode: push-to-talk
      input: "${zh_en_auto_en_to_zh_auto_audio}"
      pacing: 20ms
      require_text: true
      require_audio: true
      idle_timeout: 90s
  - id: zh_en_auto_zh_to_en_auto_turn_1_gratitude
    client: zh_en_auto_zh_to_en_auto
    peer_stream:
      mode: push-to-talk
      input: "${zh_en_auto_zh_to_en_auto_audio}"
      pacing: 20ms
      require_text: true
      require_audio: true
      idle_timeout: 90s
  timeout: 2m
  expect:
    "/zh_en_auto_en_to_zh_auto_turn_1_gratitude/text":
      contains_any:
      - 谢谢
      - 感谢
      - 感激
      - 谢意
      pattern: "\\p{Han}"
      max_length: 200
      non_empty: true
    "/zh_en_auto_en_to_zh_auto_turn_1_gratitude/audio_bytes":
      minimum: 1
    "/zh_en_auto_en_to_zh_auto_turn_1_gratitude/events":
      non_empty: true
    "/zh_en_auto_en_to_zh_auto_turn_1_gratitude/text_eos":
      equals: true
    "/zh_en_auto_en_to_zh_auto_turn_1_gratitude/audio_eos":
      equals: true
    "/zh_en_auto_en_to_zh_auto_turn_1_gratitude/audio_integrity/streams":
      minimum: 1
    "/zh_en_auto_en_to_zh_auto_turn_1_gratitude/audio_integrity/max_active":
      equals: 1
    "/zh_en_auto_en_to_zh_auto_turn_1_gratitude/audio_integrity/open":
      equals: 0
    "/zh_en_auto_en_to_zh_auto_turn_1_gratitude/audio_integrity/violations":
      equals: 0
    "/zh_en_auto_en_to_zh_auto_turn_1_gratitude/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/zh_en_auto_en_to_zh_auto_turn_1_gratitude/audio_pacing/underruns":
      equals: 0
    "/zh_en_auto_zh_to_en_auto_turn_1_gratitude/text":
      contains_any:
      - thank
      - appreciate
      - grateful
      - thankful
      - appreciation
      - gratitude
      pattern: "[A-Za-z]"
      max_length: 200
      non_empty: true
    "/zh_en_auto_zh_to_en_auto_turn_1_gratitude/audio_bytes":
      minimum: 1
    "/zh_en_auto_zh_to_en_auto_turn_1_gratitude/events":
      non_empty: true
    "/zh_en_auto_zh_to_en_auto_turn_1_gratitude/text_eos":
      equals: true
    "/zh_en_auto_zh_to_en_auto_turn_1_gratitude/audio_eos":
      equals: true
    "/zh_en_auto_zh_to_en_auto_turn_1_gratitude/audio_integrity/streams":
      minimum: 1
    "/zh_en_auto_zh_to_en_auto_turn_1_gratitude/audio_integrity/max_active":
      equals: 1
    "/zh_en_auto_zh_to_en_auto_turn_1_gratitude/audio_integrity/open":
      equals: 0
    "/zh_en_auto_zh_to_en_auto_turn_1_gratitude/audio_integrity/violations":
      equals: 0
    "/zh_en_auto_zh_to_en_auto_turn_1_gratitude/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/zh_en_auto_zh_to_en_auto_turn_1_gratitude/audio_pacing/underruns":
      equals: 0
- id: zh_en_auto_en_to_zh_auto_select_realtime
  client: zh_en_auto_en_to_zh_auto
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${zh_en_auto_en_to_zh_auto_realtime_workspace}"
- id: zh_en_auto_en_to_zh_auto_warmup_realtime
  client: zh_en_auto_en_to_zh_auto
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: zh_en_auto_zh_to_en_auto_select_realtime
  client: zh_en_auto_zh_to_en_auto
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${zh_en_auto_zh_to_en_auto_realtime_workspace}"
- id: zh_en_auto_zh_to_en_auto_warmup_realtime
  client: zh_en_auto_zh_to_en_auto
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: suite_responses_2
  parallel:
  - id: zh_en_auto_en_to_zh_auto_realtime_roundtrip
    client: zh_en_auto_en_to_zh_auto
    peer_stream:
      mode: realtime
      input: "${zh_en_auto_en_to_zh_auto_audio}"
      pacing: 20ms
      require_text: true
      require_audio: true
      idle_timeout: 90s
  - id: zh_en_auto_zh_to_en_auto_realtime_roundtrip
    client: zh_en_auto_zh_to_en_auto
    peer_stream:
      mode: realtime
      input: "${zh_en_auto_zh_to_en_auto_audio}"
      pacing: 20ms
      require_text: true
      require_audio: true
      idle_timeout: 90s
  timeout: 2m
  expect:
    "/zh_en_auto_en_to_zh_auto_realtime_roundtrip/text":
      contains_any:
      - 谢谢
      - 感谢
      - 感激
      - 谢意
      pattern: "\\p{Han}"
      max_length: 200
      non_empty: true
    "/zh_en_auto_en_to_zh_auto_realtime_roundtrip/audio_bytes":
      minimum: 1
    "/zh_en_auto_en_to_zh_auto_realtime_roundtrip/events":
      non_empty: true
    "/zh_en_auto_en_to_zh_auto_realtime_roundtrip/text_eos":
      equals: true
    "/zh_en_auto_en_to_zh_auto_realtime_roundtrip/audio_eos":
      equals: true
    "/zh_en_auto_en_to_zh_auto_realtime_roundtrip/audio_integrity/streams":
      minimum: 1
    "/zh_en_auto_en_to_zh_auto_realtime_roundtrip/audio_integrity/max_active":
      equals: 1
    "/zh_en_auto_en_to_zh_auto_realtime_roundtrip/audio_integrity/open":
      equals: 0
    "/zh_en_auto_en_to_zh_auto_realtime_roundtrip/audio_integrity/violations":
      equals: 0
    "/zh_en_auto_en_to_zh_auto_realtime_roundtrip/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/zh_en_auto_en_to_zh_auto_realtime_roundtrip/audio_pacing/underruns":
      equals: 0
    "/zh_en_auto_zh_to_en_auto_realtime_roundtrip/text":
      contains_any:
      - thank
      - appreciate
      - grateful
      - thankful
      - appreciation
      - gratitude
      pattern: "[A-Za-z]"
      max_length: 200
      non_empty: true
    "/zh_en_auto_zh_to_en_auto_realtime_roundtrip/audio_bytes":
      minimum: 1
    "/zh_en_auto_zh_to_en_auto_realtime_roundtrip/events":
      non_empty: true
    "/zh_en_auto_zh_to_en_auto_realtime_roundtrip/text_eos":
      equals: true
    "/zh_en_auto_zh_to_en_auto_realtime_roundtrip/audio_eos":
      equals: true
    "/zh_en_auto_zh_to_en_auto_realtime_roundtrip/audio_integrity/streams":
      minimum: 1
    "/zh_en_auto_zh_to_en_auto_realtime_roundtrip/audio_integrity/max_active":
      equals: 1
    "/zh_en_auto_zh_to_en_auto_realtime_roundtrip/audio_integrity/open":
      equals: 0
    "/zh_en_auto_zh_to_en_auto_realtime_roundtrip/audio_integrity/violations":
      equals: 0
    "/zh_en_auto_zh_to_en_auto_realtime_roundtrip/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/zh_en_auto_zh_to_en_auto_realtime_roundtrip/audio_pacing/underruns":
      equals: 0
finally:
- id: zh_en_auto_en_to_zh_auto_stop_run
  client: zh_en_auto_en_to_zh_auto
  rpc:
    method: server.run.stop
    request: {}
- id: zh_en_auto_zh_to_en_auto_stop_run
  client: zh_en_auto_zh_to_en_auto
  rpc:
    method: server.run.stop
    request: {}
- id: zh_en_auto_en_to_zh_auto_delete_text
  client: zh_en_auto_en_to_zh_auto
  rpc:
    method: server.workspace.delete
    request:
      name: "${zh_en_auto_en_to_zh_auto_text_workspace}"
- id: zh_en_auto_zh_to_en_auto_delete_text
  client: zh_en_auto_zh_to_en_auto
  rpc:
    method: server.workspace.delete
    request:
      name: "${zh_en_auto_zh_to_en_auto_text_workspace}"
- id: zh_en_auto_en_to_zh_auto_delete_realtime
  client: zh_en_auto_en_to_zh_auto
  rpc:
    method: server.workspace.delete
    request:
      name: "${zh_en_auto_en_to_zh_auto_realtime_workspace}"
- id: zh_en_auto_zh_to_en_auto_delete_realtime
  client: zh_en_auto_zh_to_en_auto
  rpc:
    method: server.workspace.delete
    request:
      name: "${zh_en_auto_zh_to_en_auto_realtime_workspace}"
- id: zh_en_auto_en_to_zh_auto_delete_peer
  client: zh_en_auto_en_to_zh_auto
  rpc:
    method: server.peer.delete
    request: {}
- id: zh_en_auto_zh_to_en_auto_delete_peer
  client: zh_en_auto_zh_to_en_auto
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
