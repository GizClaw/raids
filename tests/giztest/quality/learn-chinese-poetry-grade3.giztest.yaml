    direction: input
    type: string
    generate: token
  eino_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-learn-chinese-poetry-grade3 core-experience
  eino_contracts_verdict:
    direction: output
    type: string
  eino_contracts_reload_handoff:
    direction: output
    type: string
repeat: 1
timeout: 94m
