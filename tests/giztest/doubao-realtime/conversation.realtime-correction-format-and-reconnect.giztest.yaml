# User Story:
# As a Raids catalog maintainer,
# I want to drive `doubao-realtime-conversation` through the scripted `default-assistant-doubao` / `realtime-correction-format-and-reconnect` turns over realtime input,
# So that the deterministic keyword, length, script, and latency gates run as one isolated declarative task.
version: gizclaw.test/v1alpha1
name: doubao-realtime.conversation.realtime-correction-format-and-reconnect
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  workspace_name:
    direction: input
    type: string
    generate: token
  audio_1:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_2:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_3:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_4:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_5:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_6:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_7:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_8:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_9:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_10:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
repeat: 1
timeout: 23m
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: ${registration_token}
- id: create_workspace
  client: peer
  rpc:
    method: server.workspace.create
    request:
      name: ${workspace_name}
      collection: assistants
      workflow_name: doubao-realtime
      parameters:
        doubao_realtime_workspace_parameters:
          agent_type: DOUBAO_REALTIME_WORKSPACE_PARAMETERS_AGENT_TYPE_DOUBAO_REALTIME
          input: WORKSPACE_INPUT_MODE_REALTIME
- id: select_workspace
  client: peer
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: ${workspace_name}
- id: synthesize_1_establish-appointment
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: doubao-realtime-conversation.assistant
      text: 记住我周五下午三点去看牙医陈医生。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_1
- id: turn_1_establish-appointment
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_1}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      non_empty: true
- id: synthesize_2_establish-clinic
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: doubao-realtime-conversation.assistant
      text: 诊所在朝阳路，项目是洗牙，也请一起记住。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_2
- id: turn_2_establish-clinic
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_2}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      contains_all:
      - 朝阳路
      - 洗牙
- id: synthesize_3_correct-time
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: doubao-realtime-conversation.assistant
      text: 更正，是下午四点，不是三点。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_3
- id: turn_3_correct-time
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_3}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      contains_all:
      - 四点
      not_contains:
      - 三点
- id: synthesize_4_immediate-recall
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: doubao-realtime-conversation.assistant
      text: 25个字以内说出星期、时间、医生、地点和项目。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_4
- id: turn_4_immediate-recall
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_4}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      contains_all:
      - 周五
      - 四点
      - 陈医生
      - 朝阳路
      - 洗牙
      not_contains:
      - 三点
      max_length: 25
- id: synthesize_5_short
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: doubao-realtime-conversation.assistant
      text: 10个字以内鼓励我，不要提就诊。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_5
- id: turn_5_short
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_5}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      not_contains:
      - 周五
      - 四点
      - 陈医生
      - 朝阳路
      - 洗牙
      max_length: 10
- id: synthesize_6_exact
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: doubao-realtime-conversation.assistant
      text: 只回答“知道了”，不要加其他内容。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_6
- id: turn_6_exact
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_6}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      contains_all:
      - 知道了
      max_length: 3
- id: synthesize_7_challenge-old-time
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: doubao-realtime-conversation.assistant
      text: 我记得还是下午三点，对吗？请按最新事实纠正。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_7
- id: turn_7_challenge-old-time
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_7}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      contains_all:
      - 四点
      not_contains:
      - 还是下午三点
      - 对的
      - 没错
      max_length: 20
- id: synthesize_8_partial-recall
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: doubao-realtime-conversation.assistant
      text: 只说医生和项目，15个字以内。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_8
- id: turn_8_partial-recall
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_8}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      contains_all:
      - 陈医生
      - 洗牙
      not_contains:
      - 朝阳路
      - 周五
      - 四点
      max_length: 15
- id: reload_before_reconnect-recall
  client: peer
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: synthesize_9_reconnect-recall
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: doubao-realtime-conversation.assistant
      text: 重连后20个字以内说出最新时间、医生和诊所地址。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_9
- id: turn_9_reconnect-recall
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_9}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      contains_all:
      - 四点
      - 陈医生
      - 朝阳路
      not_contains:
      - 三点
      max_length: 20
- id: synthesize_10_final-exact
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: doubao-realtime-conversation.assistant
      text: 最后只回答“预约已确认”，不要加标点。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_10
- id: turn_10_final-exact
  client: peer
  timeout: 2m
  peer_stream:
    mode: realtime
    input: ${audio_10}
    pacing: 20ms
    require_text: true
  expect:
    /text:
      contains_all:
      - 预约已确认
      max_length: 5
finally:
- id: stop_run
  client: peer
  rpc:
    method: server.run.stop
    request: {}
- id: delete_workspace
  client: peer
  rpc:
    method: server.workspace.delete
    request:
      name: ${workspace_name}
- id: delete_peer
  client: peer
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
