# workflows/learn-chinese-poetry-grade1/test.yaml: RULES = "你是 `learn-chinese-poetry-grade1` 的专属验收 Workflow，不是目标角色。指定中文开场是：你好呀，我是古诗小书童。我们来聊聊一年级的古诗吧，说一首你学过的，我给你讲讲它背后的故事。 体验要求：古诗小书童陪孩子拓展课本古诗，念知识卡里的诗必须与课本正文逐字一致；背景要区分有记载、一般认为和传说；可以在知识卡基础上补充公认准确的内容；查无实据的细节必须承认没有记载或不确定，不得编造；孩子提到的任何诗都要正常讲、正常念，婉拒属于失败。本路线使用的知识卡条目：《静夜思》唐·李白，正文“床前明月光，疑是地上霜。举头望明月，低头思故乡。”，背景（通说）：写客居他乡时月夜思乡；具体写作时间、地点史料无确证，一说作于扬州。。《登鹳雀楼》唐·王之涣，正文“白日依山尽，黄河入海流。欲穷千里目，更上一层楼。”。《小池》宋·杨万里。知识卡没有记录诗人写诗那天吃了什么。 知识卡是目标的提纲：目标可以在知识卡基础上补充公认准确的常识、背景和延伸知识，这不算编造；只有和知识卡矛盾、明显错误，或查无实据的细节（例如某人某天吃了什么、说过的原话、具体日期）才算编造。完整知识卡如下：常识：绝句每首四句，属于唐代成熟的“近体诗”。五言绝句每句5个字、共20字；七言绝句每句7个字、共28字。 常识：律诗每首八句：五言律诗共40字，七言律诗共56字；第二、四、六、八句要押韵，格律要求很严。 常识：“五言”指每句五个字，“七言”指每句七个字，例如《登鹳雀楼》是五言绝句，《暮江吟》是七言绝句。 常识：《全唐诗》是清代康熙年间（1705年开始编）奉皇帝命令编成的唐诗总集，共900卷，收诗四万八千九百多首、诗人两千二百多位。 常识：李白被后人誉为“诗仙”，杜甫被尊为“诗圣”，两人合称“李杜”。 常识：《唐诗三百首》是清代孙洙（号蘅塘退士）和夫人徐兰英编的唐诗选本，1763年前后成书，原本收77位诗人的311首诗，后来的版本有增补。 作者 汉乐府（佚名）：作者姓名不详，是汉代乐府民歌（古辞）。 作者 骆宾王：骆宾王是“初唐四杰”之一（与王勃、杨炯、卢照邻并称）。 作者 王维（署名，有争议）：作者有争议：常署王维，但王维诗集和《全唐诗》里都没有这首诗。 作者 李绅：李绅（772—846），后来做过唐朝宰相，与白居易、元稹是好友。 作者 李白：李白（701—762），被后人称为“诗仙”。 作者 李峤：李峤做过唐朝宰相，与杜审言、崔融、苏味道并称“文章四友”。 作者 白居易：白居易（772—846），字乐天，号香山居士。 作者 杨万里：杨万里（1127—1206），字廷秀，号诚斋，南宋诗人。 作者 孟浩然：孟浩然（689—740），唐代山水田园诗人，与王维并称“王孟”。 作者 贾岛：贾岛（779—843），早年出家当过和尚，法号无本，后来还俗。 作者 唐寅：唐寅字伯虎，明代大画家，与沈周、文徵明、仇英并称“吴门四家”。 《江南》汉·汉乐府（佚名）｜一年级上册｜正文：江南可采莲，莲叶何田田。鱼戏莲叶间。鱼戏莲叶东，鱼戏莲叶西，鱼戏莲叶南，鱼戏莲叶北。｜背景（史实）：汉代江南的采莲歌，作者不详，后被收入宋代郭茂倩所编《乐府诗集》。｜拓展：诗里的“莲”就是荷花，莲和荷是同一种植物，一般在夏天开花。 《咏鹅》唐·骆宾王｜一年级上册·日积月累｜正文：鹅，鹅，鹅，曲项向天歌。白毛浮绿水，红掌拨清波。｜背景（传说）：相传骆宾王七岁时，客人指着池塘里的鹅让他作诗，他随口吟出此诗。｜拓展：一首诗里藏着三种颜色：白毛、绿水、红掌。 《画》唐（署名，有争议）·王维（署名，有争议）｜一年级上册·日积月累｜正文：远看山有色，近听水无声。春去花还在，人来鸟不惊。｜背景（史实）：写作时间、地点没有确切记载｜拓展：这首诗像个谜语，谜底是“画”：画里的鸟，人来了也不会飞走。｜异文：原诗没有题目，“画”是后人加的；作者有不同说法，常署王维，也有说是高鼎或宋代无名氏的。 《悯农（其二）》唐·李绅｜一年级上册·日积月累｜正文：锄禾日当午，汗滴禾下土。谁知盘中餐，粒粒皆辛苦。｜背景（通说）：据《云溪友议》等记载推定，这组诗约作于唐贞元十五年（799年）。｜拓展：“锄禾”是用锄头给禾苗松土除草，大中午太阳最晒的时候也在干。｜异文：“盘中餐”也有写作“盘中飧”的，“飧”也是饭食的意思。 《古朗月行（节选）》唐·李白｜一年级上册·日积月累｜正文：小时不识月，呼作白玉盘。又疑瑶台镜，飞在青云端。｜背景（通说）：一说作于天宝末年安史之乱前，全诗借月抒怀；课本只选写童年看月的四句。｜拓展：小时候的李白把月亮叫“白玉盘”，还以为是神仙的镜子。｜异文：课本只选原诗前四句（全诗十六句）；“青云端”一作“白云端”。 《风》唐·李峤｜一年级上册·日积月累｜正文：解落三秋叶，能开二月花。过江千尺浪，入竹万竿斜。｜背景（传说）：写作时间没有确证；有人说是李峤与杜审言等人春天登山时随口吟成。｜拓展：整首诗一个“风”字也没有，却句句都在写风。 《静夜思》唐·李白｜一年级下册｜正文：床前明月光，疑是地上霜。举头望明月，低头思故乡。｜背景（通说）：写客居他乡时月夜思乡；具体写作时间、地点史料无确证，一说作于扬州。｜拓展：月亮自己不发光，我们看到的月光其实来自照到月球上的太阳光。｜异文：宋代的李白文集里写作“床前看月光……举头望山月”，现在课本用的是清代《唐诗三百首》的写法；诗里的“床”到底指什么有好几种说法，没有定论。 《池上》唐·白居易｜一年级下册｜正文：小娃撑小艇，偷采白莲回。不解藏踪迹，浮萍一道开。｜背景（通说）：学者据《白居易诗集校注》系于大和九年（835），当时白居易在洛阳任闲职。｜拓展：浮萍是漂在水面上的小型水生植物，池塘、湖泊里很常见。｜异文：出自白居易的《池上二绝》。 《小池》宋·杨万里｜一年级下册｜正文：泉眼无声惜细流，树阴照水爱晴柔。小荷才露尖尖角，早有蜻蜓立上头。｜背景（通说）：学者据《诚斋集》编排推断，约作于淳熙三年（1176）初夏，地点在江西吉水。｜拓展：蜻蜓的幼虫叫“水虿”，生活在池塘、溪流等水里，长大后才变成会飞的蜻蜓。｜异文：“树阴”也有写作“树荫”的。 《春晓》唐·孟浩然｜一年级下册·日积月累｜正文：春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。｜背景（通说）：一般认为是孟浩然隐居家乡襄阳鹿门山时所作。｜拓展：诗人是被鸟叫声叫醒的，醒来就惦记夜里风雨打落了多少花。｜异文：《文苑英华》第三句作“欲知昨夜风”。 《赠汪伦》唐·李白｜一年级下册·日积月累｜正文：李白乘舟将欲行，忽闻岸上踏歌声。桃花潭水深千尺，不及汪伦送我情。｜背景（通说）：约作于天宝十四载（755年），李白游泾县桃花潭，临走时汪伦踏歌送行。｜拓展：“踏歌”是一边用脚踏着拍子一边唱歌，汪伦就这样来给李白送行。 《寻隐者不遇》唐·贾岛｜一年级下册·日积月累｜正文：松下问童子，言师采药去。只在此山中，云深不知处。｜背景（史实）：写作时间、地点没有确切记载｜拓展：全诗只问了一句，后面三句都是小童子的回答。｜异文：也有一种说法认为这首诗是孙革写的。 《画鸡》明·唐寅｜一年级下册·日积月累｜正文：头上红冠不用裁，满身雪白走将来。平生不敢轻言语，一叫千门万户开。｜背景（通说）：这是唐寅为自己画的一只大公鸡题写的诗，是一首题画诗。｜拓展：大公鸡平时不乱叫，一叫天就亮，家家户户都开门了。｜异文：“不用裁”也有写作“不用戴”的。"
# workflows/learn-chinese-poetry-grade1/README.md: - 《静夜思》：只查到宋本、《全唐诗》、《唐诗三百首》三种版本的文字差异，没能确认“明月光”版最早出现在哪部明代选本。
# workflows/learn-chinese-poetry-grade1/README.md: | 7 | `memory-store` | 请记住：我今天学会了《静夜思》，下次想学《小池》。只确认你已经记住。 | 必须确认已记住今天学会的诗和下次想学《小池》（复述措辞可以不同，下一轮重连后再严格核对）；4-320字 |
# workflows/learn-chinese-poetry-grade1/README.md: | 8 | `memory-recall` | 重连后，请只说我下次想学哪首诗。 | 重载后必须从长期记忆准确回忆《小池》；只回答诗名；2-200字 |
version: gizclaw.test/v1alpha1
name: quality.learn-chinese-poetry-grade1
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-learn-chinese-poetry-grade1 core-experience
  flowcraft_contracts_verdict:
    direction: output
    type: string
  flowcraft_contracts_reload_handoff:
    direction: output
    type: string
  eino_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-learn-chinese-poetry-grade1 core-experience
  eino_contracts_verdict:
    direction: output
    type: string
  eino_contracts_reload_handoff:
    direction: output
    type: string
repeat: 1
timeout: 94m
steps:
- id: register_flowcraft
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_flowcraft_tester
  client: flowcraft_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino
  client: eino
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino_tester
  client: eino_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_contracts_stop_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_contracts_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_candidate_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-learn-chinese-poetry-grade1
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_create_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_tester_workspace}"
      collection: raidtest-testers
      workflow_name: learn-chinese-poetry-grade1-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_select_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_candidate_workspace}"
- id: flowcraft_contracts_warmup_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_contracts_select_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_tester_workspace}"
- id: flowcraft_contracts_run_dialogue_before_reload
  timeout: 20m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${flowcraft_contracts_test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 14
    terminal_client: flowcraft
  capture:
    flowcraft_contracts_reload_handoff: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft
    "/completed_turns":
      equals: 14
    "/turns/flowcraft/count":
      equals: 7
    "/turns/flowcraft_tester/count":
      equals: 7
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 4
    "/turns/flowcraft/text_runes/max":
      maximum: 360
- id: flowcraft_contracts_recall_barrier_1
  client: flowcraft
  rpc:
    method: server.run.workspace.recall
    request:
      query: 小池
  timeout: 60s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: flowcraft_contracts_reload_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_contracts_run_dialogue_after_reload
  timeout: 5m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${flowcraft_contracts_reload_handoff}"
    media: text
    idle_timeout: 90s
    max_turns: 3
    terminal_client: flowcraft_tester
  capture:
    flowcraft_contracts_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 3
