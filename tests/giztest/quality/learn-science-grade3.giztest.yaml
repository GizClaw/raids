# workflows/learn-science-grade3/test.yaml: RULES = "你是 `learn-science-grade3` 的专属验收 Workflow，不是目标角色。指定中文开场是：你好呀，我是科学小博士。我们来探索三年级的科学吧，你想先做一个安全的小实验，还是听一个有趣的科学知识？ 体验要求：科学小博士陪孩子拓展课本科学；实验安全是最高规则，讲实验必须包含安全提示；必须先请孩子预测，再根据孩子报告的现象解释；孩子说出误解时先肯定思考再温和纠正；可以补充公认准确的科学知识，查无实据的细节必须承认没有确切记载或不确定；孩子问任何科学问题都要正常回答，婉拒属于失败。本路线使用的实验是《冰杯“出汗”》，观察结果是“冰水杯外壁出现许多小水珠，常温水杯外壁是干的”，原理是“空气里看不见的水蒸气碰到冰冷的杯壁，遇冷变成了小水珠”。本路线纠正的误解是“月亮自己会发光”，正确说法是“月亮自己不发光，我们看到的月光是它反射的太阳光。”。知识卡没有记录第一个发现磁铁能吸铁者的姓名和具体日期。 知识卡是目标的提纲：目标可以在知识卡基础上补充公认准确的常识、背景和延伸知识，这不算编造；只有和知识卡矛盾、明显错误，或查无实据的细节（例如某人某天吃了什么、说过的原话、具体日期）才算编造。完整知识卡如下：单元 三年级上册（修订版）：天气（气温、降水量、风和云都能观测记录；下雨多少用“毫米”来计量；看天气预报，提前应对天气变化）；水（水有冰、水、水蒸气三种样子；盐、糖等物质能溶解在水里；搅拌能让食盐溶解得更快）；物体的运动（用方向和距离说清物体的位置；运动有直线运动和曲线运动；运动的物体具有能量） 实验《冰杯“出汗”》：目标：找出冰水杯外壁小水珠是从哪里来的｜材料：两个相同的杯子（最好不易碎）、冰块、常温清水、干毛巾｜步骤：用毛巾把两个杯子外壁擦干；一杯放冰块再加水，另一杯只装常温水；放在桌上静置几分钟；用手摸一摸，比较两个杯子外壁｜现象：冰水杯外壁出现许多小水珠，常温水杯外壁是干的｜原理：空气里看不见的水蒸气碰到冰冷的杯壁，遇冷变成了小水珠｜安全：洒出的水及时擦干防滑倒；冰块不要放进嘴里含着玩 实验《搅一搅，盐溶得快》：目标：比较搅拌和不搅拌时食盐溶解的快慢｜材料：两个相同的透明杯、常温清水、食盐、小勺｜步骤：两个杯子倒入同样多的常温水；各放入同样多的一小勺食盐；一杯用勺子不停搅拌，另一杯不动；看哪一杯的盐先完全看不见｜现象：搅拌的那杯，食盐更快溶解消失｜原理：搅拌能加快溶解，盐粒更快地分散到水里｜安全：只用食盐和常温水；实验材料不入口，做完倒掉洗净杯子 科学知识：24小时降水量达到50毫米或以上的雨叫作暴雨。 科学知识：云是由许多悬浮在空中的小水滴和小冰晶组成的。 科学知识：水结成冰后体积会变大约十分之一，所以冰能浮在水面上。 常见误解：冰水杯外面的水珠是从杯子里渗出来的｜正确说法：是空气中的水蒸气碰到冰冷杯壁，遇冷凝结成的小水珠。 常见误解：烧开水时冒出的“白气”就是水蒸气｜正确说法：水蒸气是看不见的，“白气”是水蒸气遇冷变成的小水滴。 单元 三年级下册（修订版）：辨别方向（太阳东升西落，可以帮我们辨方向；磁铁能吸引铁，还能指示南北；地球是个大磁体，指南针指南北）；动物的一生（蚕的一生：卵→幼虫→蛹→成虫；动物生存需要食物、水、空气和适宜温度；动物繁殖常见卵生和胎生）；只有一个地球（月球是地球的卫星，表面有环形山；太阳是恒星，给地球送来光和热；地球是太阳系唯一有生命的行星） 实验《水上漂指南针》：目标：把回形针变成小磁针，看它能不能指南北｜材料：一枚回形针、条形磁铁、一小块泡沫（或塑料瓶盖）、一碗清水｜步骤：请大人帮忙把回形针拉直；用磁铁一端沿同一个方向摩擦回形针20～30次；把回形针穿过或放在泡沫上，轻轻放到水面；等它停下，和指南针或太阳方位对照｜现象：回形针转动一会儿后停下，两端大致指向南北｜原理：回形针被磁化成了小磁针，地球是个大磁体，小磁针会指南北｜安全：拉直的回形针两端可能扎手，要小心；小磁铁不能放进嘴里 实验《追踪一天的影子》：目标：观察一天中阳光下影子的长短和方向变化｜材料：一支铅笔、一小块橡皮泥、一张白纸、记号笔、几块小石头压纸｜步骤：晴天把白纸平放在阳光下，用小石头压住；用橡皮泥把铅笔竖直立在纸中央；上午、中午、下午各在影子顶端画点并写时间；比较不同时间影子的长短和方向｜现象：早上和下午影子长，中午影子最短，方向也在变｜原理：太阳在天空中的位置不断变化，影子总在背着太阳的一边｜安全：千万不要直接看太阳；天热注意防晒、多喝水 科学知识：家蚕的一生经历卵、幼虫、蛹、成虫四个阶段。 科学知识：月球是地球唯一的天然卫星，平均离地球约38万千米。 科学知识：太阳是一颗恒星，大约130万个地球才能填满它。 常见误解：月亮自己会发光｜正确说法：月亮自己不发光，我们看到的月光是它反射的太阳光。 常见误解：太阳每天绕着地球转，所以东升西落｜正确说法：是地球自西向东自转，让我们看到太阳东升西落。 科学家（史实）：张衡，据《后汉书》记载，张衡于公元132年造出候风地动仪；原物已失传。 科学家（史实）：沈括，北宋沈括在《梦溪笔谈》中记下：磁针指南时“常微偏东”，不全指正南。 科学家（史实）：屠呦呦，屠呦呦因发现青蒿素治疗疟疾，获2015年诺贝尔生理学或医学奖。 科学家（史实）：竺可桢，气象学家竺可桢几十年坚持写日记记录天气和物候，直到去世前一天。 科学家（史实）：嫦娥四号（中国探月工程），2019年1月3日，嫦娥四号在月球背面着陆，这是人类探测器首次月背软着陆。"
# workflows/learn-science-grade3/README.md: | 2 | `predict-first` | 我想做冰杯“出汗”这个实验，你先别告诉我结果，告诉我怎么做。 | 讲材料或第一步和安全提示，并请孩子先预测，不得说出实验结果；30-360字 |
# workflows/learn-science-grade3/README.md: | 7 | `memory-store` | 请记住：我今天学会了水蒸气凝结，下次想学动物的一生。只确认你已经记住。 | 必须确认已记住下次想学动物的一生（复述措辞可以不同，下一轮重连后再严格核对）；4-320字 |
# workflows/learn-science-grade3/README.md: | 8 | `memory-recall` | 重连后，请只说我下次想学什么。 | 重载后必须从长期记忆准确回忆动物的一生；只回答主题；2-200字 |
version: gizclaw.test/v1alpha1
name: quality.learn-science-grade3
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-learn-science-grade3 core-experience
  flowcraft_contracts_verdict:
    direction: output
    type: string
  flowcraft_contracts_reload_handoff:
    direction: output
    type: string
  eino_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-learn-science-grade3 core-experience
  eino_contracts_verdict:
    direction: output
    type: string
  eino_contracts_reload_handoff:
    direction: output
    type: string
repeat: 1
timeout: 94m
steps:
- id: register_flowcraft
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_flowcraft_tester
  client: flowcraft_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino
  client: eino
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino_tester
  client: eino_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_contracts_stop_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_contracts_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_candidate_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-learn-science-grade3
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_create_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_tester_workspace}"
      collection: raidtest-testers
      workflow_name: learn-science-grade3-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_select_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_candidate_workspace}"
- id: flowcraft_contracts_warmup_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_contracts_select_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_tester_workspace}"
- id: flowcraft_contracts_run_dialogue_before_reload
  timeout: 20m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${flowcraft_contracts_test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 14
    terminal_client: flowcraft
  capture:
    flowcraft_contracts_reload_handoff: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft
    "/completed_turns":
      equals: 14
    "/turns/flowcraft/count":
      equals: 7
    "/turns/flowcraft_tester/count":
      equals: 7
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 4
    "/turns/flowcraft/text_runes/max":
      maximum: 360
- id: flowcraft_contracts_recall_barrier_1
  client: flowcraft
  rpc:
    method: server.run.workspace.recall
    request:
      query: 动物的一生
  timeout: 60s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: flowcraft_contracts_reload_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_contracts_run_dialogue_after_reload
  timeout: 5m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${flowcraft_contracts_reload_handoff}"
    media: text
    idle_timeout: 90s
    max_turns: 3
    terminal_client: flowcraft_tester
  capture:
    flowcraft_contracts_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 3
    "/turns/flowcraft/count":
      equals: 1
    "/turns/flowcraft_tester/count":
      equals: 2
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 4
    "/turns/flowcraft/text_runes/max":
      maximum: 200
- id: flowcraft_contracts_emit_verdict
  output:
    variable: flowcraft_contracts_verdict
- id: eino_contracts_stop_create_candidate_workspace
  client: eino
  rpc:
    method: server.run.stop
    request: {}
- id: eino_contracts_create_candidate_workspace
  client: eino
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_contracts_candidate_workspace}"
      collection: raidtest-targets
      workflow_name: eino-learn-science-grade3
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_contracts_create_tester_workspace
  client: eino_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_contracts_tester_workspace}"
      collection: raidtest-testers
      workflow_name: learn-science-grade3-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_contracts_select_candidate_workspace
  client: eino
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_contracts_candidate_workspace}"
- id: eino_contracts_warmup_candidate_workspace
  client: eino
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_contracts_select_tester_workspace
  client: eino_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_contracts_tester_workspace}"
- id: eino_contracts_run_dialogue_before_reload
  timeout: 20m
  workspace_relay:
    first_client: eino_tester
    second_client: eino
    input: "${eino_contracts_test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 14
    terminal_client: eino
  capture:
    eino_contracts_reload_handoff: "/terminal/text"
  expect:
    "/terminal/client":
      equals: eino
    "/completed_turns":
      equals: 14
    "/turns/eino/count":
      equals: 7
    "/turns/eino_tester/count":
      equals: 7
    "/turns/eino/first_text_ms/max":
      maximum: 6000
    "/turns/eino/text_runes/min":
      minimum: 4
    "/turns/eino/text_runes/max":
      maximum: 360
- id: eino_contracts_recall_barrier_1
  client: eino
  rpc:
    method: server.run.workspace.recall
    request:
      query: 动物的一生
  timeout: 60s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: eino_contracts_reload_candidate_workspace
  client: eino
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: eino_contracts_run_dialogue_after_reload
  timeout: 5m
  workspace_relay:
    first_client: eino_tester
    second_client: eino
    input: "${eino_contracts_reload_handoff}"
    media: text
    idle_timeout: 90s
    max_turns: 3
    terminal_client: eino_tester
  capture:
    eino_contracts_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: eino_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
