# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of adventure-treasure,
# So that safety, correction, recall, routing and language regressions fail at the original gates.
version: gizclaw.test/v1alpha1
name: adventure-treasure.quality.eino.multi-role
clients:
  eino_multi_role__routing:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  eino_multi_role_routing_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 30m
steps:
- id: eino_multi_role__routing_register
  client: eino_multi_role__routing
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_multi_role_routing_stop
  client: eino_multi_role__routing
  rpc:
    method: server.run.stop
    request: {}
- id: eino_multi_role_routing_create
  client: eino_multi_role__routing
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_multi_role_routing_workspace}"
      collection: raidtest-targets
      workflow_name: eino-adventure-treasure-multi-role
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_multi_role_routing_select
  client: eino_multi_role__routing
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_multi_role_routing_workspace}"
- id: eino_multi_role_routing_warmup
  client: eino_multi_role__routing
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- timeout: 4m
  id: eino_multi_role_routing_opening
  client: eino_multi_role__routing
  peer_stream:
    mode: text
    input: 开始体验吧，我想去冒险！
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      not_contains:
      - "【"
      - "】"
      - 进入下一章
      - 要不要继续
      - 想继续听就说
      - 这一章的选择完成啦
      - 等你说要不要
      - 是否继续听
      - say continue
      - say next chapter
      - would you like to continue
      min_length: 200
      max_length: 900
      pattern: "(还是|或|选|哪|谁|先| or |which|where|who)[^。.!！]*[？?]\\s*$"
    "/audio_integrity/streams":
      equals: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- timeout: 4m
  id: eino_multi_role_routing_negated_name
  client: eino_multi_role__routing
  peer_stream:
    mode: text
    input: 我选刚才第一个办法！
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - "【"
      - "】"
      - 进入下一章
      - 要不要继续
      - 想继续听就说
      - 这一章的选择完成啦
      - 等你说要不要
      - 是否继续听
      - say continue
      - say next chapter
      - would you like to continue
      min_length: 200
      max_length: 900
      pattern: "(还是|或|选|哪|谁|先| or |which|where|who)[^。.!！]*[？?]\\s*$"
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/audio_integrity/streams":
      equals: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- timeout: 4m
  id: eino_multi_role_routing_unavailable_role
  client: eino_multi_role__routing
  peer_stream:
    mode: text
    input: 等等，我改主意了，不选第一个了，我选另一个办法！
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - "【"
      - "】"
      - 进入下一章
      - 要不要继续
      - 想继续听就说
      - 这一章的选择完成啦
      - 等你说要不要
      - 是否继续听
      - say continue
      - say next chapter
      - would you like to continue
      min_length: 200
      max_length: 900
      pattern: "(还是|或|选|哪|谁|先| or |which|where|who)[^。.!！]*[？?]\\s*$"
      contains_any:
      - 改
      - 另一个
      - 另一
      - 换
      - 第二
      - 不选第一个
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/audio_integrity/streams":
      equals: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- timeout: 4m
  id: eino_multi_role_routing_bare_name
