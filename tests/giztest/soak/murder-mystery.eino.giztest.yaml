# User Story:
# As a Raids catalog maintainer,
# I want every available murder-mystery implementation to complete the same bounded Tester relay,
# So that the 26-response `default-murder-mystery` route, its deterministic contracts, and the final verdict stay declarative.
version: gizclaw.test/v1alpha1
name: murder-mystery.soak.eino
clients:
  eino:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-murder-mystery-multi-role long-form-investigation-correction-conclusion
  eino_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_verdict:
    direction: output
    type: string
  eino_reload_handoff:
    direction: output
    type: string
repeat: 1
timeout: 99m
steps:
- id: eino_register_candidate
  client: eino
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_register_tester
  client: eino_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_create_candidate_workspace
  client: eino
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_candidate_workspace}"
      workflow_name: eino-murder-mystery
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          safety_fence_level: 'off'
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_create_tester_workspace
  client: eino_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_tester_workspace}"
      workflow_name: murder-mystery-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          safety_fence_level: 'off'
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_select_candidate_workspace
  client: eino
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_candidate_workspace}"
- id: eino_warmup_candidate_workspace
  client: eino
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_select_tester_workspace
  client: eino_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_tester_workspace}"
- id: eino_run_dialogue_before_reload
  timeout: 64m
  workspace_relay:
    first_client: eino_tester
    second_client: eino
    input: "${test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 38
    terminal_client: eino
  capture:
    eino_reload_handoff: "/terminal/text"
  expect:
    "/terminal/client":
      equals: eino
    "/completed_turns":
      equals: 38
    "/turns/eino/count":
      equals: 19
    "/turns/eino_tester/count":
      equals: 19
    "/turns/eino/text_runes/max":
      maximum: 960
- id: eino_recall_barrier_1
  client: eino
  rpc:
    method: server.run.workspace.recall
    request:
      query: 39码
  timeout: 60s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: eino_reload_candidate_workspace
  client: eino
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: eino_run_dialogue_after_reload
  timeout: 25m
  workspace_relay:
    first_client: eino_tester
    second_client: eino
    input: "${eino_reload_handoff}"
    media: text
    idle_timeout: 90s
    max_turns: 15
    terminal_client: eino_tester
  capture:
    eino_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: eino_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 15
    "/turns/eino/count":
      equals: 7
    "/turns/eino_tester/count":
      equals: 8
    "/turns/eino/text_runes/max":
      maximum: 840
- id: eino_emit_verdict
  output:
    variable: eino_verdict
finally:
- id: eino_stop_candidate_run
  client: eino
  rpc:
    method: server.run.stop
    request: {}
- id: eino_stop_tester_run
  client: eino_tester
  rpc:
    method: server.run.stop
    request: {}
- id: eino_delete_candidate_workspace
  client: eino
  rpc:
    method: server.workspace.delete
    request:
      name: "${eino_candidate_workspace}"
- id: eino_delete_tester_workspace
  client: eino_tester
  rpc:
    method: server.workspace.delete
    request:
      name: "${eino_tester_workspace}"
- id: eino_delete_candidate_peer
  client: eino
  rpc:
    method: server.peer.delete
    request: {}
- id: eino_delete_tester_peer
  client: eino_tester
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
