# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for eino-story-animal-kingdom,
# So that each reachable role produces text and non-empty audio within the latency gates.
version: gizclaw.test/v1alpha1
name: story-animal-kingdom.eino.roles
clients:
  narrator:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  explorer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  animal-guide:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  elephant:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  owl:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  narrator_workspace:
    direction: input
    type: string
    generate: token
  explorer_workspace:
    direction: input
    type: string
    generate: token
  animal_guide_workspace:
    direction: input
    type: string
    generate: token
  elephant_workspace:
    direction: input
    type: string
    generate: token
  owl_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 36m
steps:
- id: register_narrator
  client: narrator
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: "${narrator_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-animal-kingdom
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${narrator_workspace}"
- id: warmup_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_explorer
  client: explorer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_explorer_workspace
  client: explorer
  rpc:
    method: server.workspace.create
    request:
      name: "${explorer_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-animal-kingdom
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_explorer_workspace
  client: explorer
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${explorer_workspace}"
- id: warmup_explorer_workspace
  client: explorer
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_animal-guide
  client: animal-guide
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_animal_guide_workspace
  client: animal-guide
  rpc:
    method: server.workspace.create
    request:
      name: "${animal_guide_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-animal-kingdom
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_animal_guide_workspace
  client: animal-guide
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${animal_guide_workspace}"
- id: warmup_animal_guide_workspace
  client: animal-guide
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_elephant
  client: elephant
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_elephant_workspace
  client: elephant
  rpc:
    method: server.workspace.create
    request:
      name: "${elephant_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-animal-kingdom
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_elephant_workspace
  client: elephant
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${elephant_workspace}"
- id: warmup_elephant_workspace
  client: elephant
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_owl
  client: owl
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_owl_workspace
  client: owl
  rpc:
    method: server.workspace.create
    request:
      name: "${owl_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-animal-kingdom
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_owl_workspace
  client: owl
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${owl_workspace}"
- id: warmup_owl_workspace
  client: owl
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: 请由旁白承接当前故事，只推进一个可见线索。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_narrator_first_response
  client: narrator
  timeout: 15s
  peer_stream:
    mode: text
    input: 请由旁白承接当前故事，只推进一个可见线索。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: explorer_chapter_setup_1
  client: explorer
  timeout: 2m
  peer_stream:
    mode: text
    input: 请从第一章开始《动物王国》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      contains: 变浅的河流
- id: probe_explorer
