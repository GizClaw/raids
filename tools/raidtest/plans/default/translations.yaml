version: v1
name: default-translations
driver: translate
persona: 直接说出待翻译句子的普通用户，不要求解释。
cases:
  - id: ja-to-zh
    workflow_id: ast-translate-ja-zh
    turns:
      - {id: translate, user: "Aliceさんは12個のリンゴを買いませんでした。", required: [Alice, "12"], required_any: [[没, 未, 不]], scripts: [han], require_punctuation: true, max_runes: 90}
  - id: ko-to-zh
    workflow_id: ast-translate-ko-zh
    turns:
      - {id: translate, user: "Alice는 27번 버스를 타지 않았습니다.", required: [Alice, "27"], required_any: [[没, 未, 不]], scripts: [han], require_punctuation: true, max_runes: 90}
  - id: zh-to-en-auto
    workflow_id: ast-translate-zh-en-auto
    turns:
      - {id: translate, user: "Alice没有在8点取消Paris会议。", required: [Alice, "8", Paris, not], scripts: [latin], require_punctuation: true, max_runes: 90}
  - id: en-to-zh-auto
    workflow_id: ast-translate-zh-en-auto
    turns:
      - {id: translate, user: "Alice did not cancel train G7331 at 9:30.", required: [Alice, G7331, "9:30"], required_any: [[没, 未, 不]], scripts: [han], require_punctuation: true, max_runes: 90}
  - id: zh-to-es
    workflow_id: ast-translate-zh-es
    turns:
      - {id: translate, user: "Marta没有取消12月5日的Madrid会议。", required: [Marta, "12", "5", Madrid, no], scripts: [latin], require_punctuation: true, max_runes: 90}
  - id: zh-to-fr
    workflow_id: ast-translate-zh-fr
    turns:
      - {id: translate, user: "Claire没有取消7点在Paris的会议。", required: [Claire, "7", Paris, pas], scripts: [latin], require_punctuation: true, max_runes: 90}
  - id: zh-to-ja
    workflow_id: ast-translate-zh-ja
    turns:
      - {id: translate, user: "Alice没有取消12点的Tokyo会议。", required: [Alice, "12", Tokyo, キャンセル], scripts: [japanese], require_punctuation: true, max_runes: 90}
  - id: zh-to-ko
    workflow_id: ast-translate-zh-ko
    turns:
      - {id: translate, user: "Alice没有取消下午3点的Seoul会议。", required: [Alice, "3", Seoul, 취소], scripts: [korean], require_punctuation: true, max_runes: 90}
