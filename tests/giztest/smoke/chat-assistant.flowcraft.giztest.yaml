# User Story:
# As a Raids catalog maintainer,
# I want equal opening, role and realtime responsiveness gates for every implementation,
# So that text and audio respond promptly without overlap or playback stalls.
version: gizclaw.test/v1alpha1
name: chat-assistant.smoke.flowcraft
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_text_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_realtime_workspace:
    direction: input
    type: string
    generate: token
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
repeat: 1
timeout: 12m
steps:
- id: flowcraft_register
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_create_text
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_text_workspace}"
      collection: assistants
      workflow_name: general-assistant
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_select_text
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_text_workspace}"
- id: flowcraft_warmup_text
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_create_realtime
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_realtime_workspace}"
      collection: assistants
      workflow_name: general-assistant
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_REALTIME
- id: flowcraft_opening
  timeout: 2m
  peer_stream:
    mode: text
    input: 我下周三要去杭州见周宁，车次是G7331，请记住；用一句自然口语复述这四项，不要标签或追问。
    require_audio: true
    require_text: true
    idle_timeout: 90s
  expect:
    "/text":
      not_contains:
      - 需要我
      - 要不要
      - 是准备
      - 还是
      - 吗
      - 呀
      - 时间：
      - 目的地：
      - 会见对象：
      - 车次：
      non_empty: true
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/first_text_ms":
      maximum: 6000
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
  client: flowcraft
- id: flowcraft_select_realtime
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_realtime_workspace}"
- id: flowcraft_warmup_realtime
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: synthesize_input_audio
  client: flowcraft
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 我下周三要去杭州见周宁，车次是G7331，请记住；用一句自然口语复述这四项，不要标签或追问。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: input_audio
- id: flowcraft_realtime_roundtrip
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${input_audio}"
    pacing: 20ms
    require_audio: true
    require_text: true
    idle_timeout: 90s
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/text":
      non_empty: true
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
  client: flowcraft
finally:
- id: flowcraft_stop_run
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_delete_text
  client: flowcraft
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_text_workspace}"
- id: flowcraft_delete_realtime
  client: flowcraft
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_realtime_workspace}"
- id: flowcraft_delete_peer
  client: flowcraft
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
