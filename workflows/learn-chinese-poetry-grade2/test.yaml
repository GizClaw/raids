apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: learn-chinese-poetry-grade2-test
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    graph:
      name: learn-chinese-poetry-grade2-test-relay
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 8
      state:
        fields:
        - name: tester-route
          type: string
          merge: replace
        - name: tester-message
          type: string
          merge: replace
        - name: tester-det
          type: string
          merge: replace
        - name: prompt-system
          type: string
          merge: replace
        - name: prompt-user
          type: string
          merge: replace
        - name: judge-messages
          type: messages
          merge: replace
        - name: model-text
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: route-turn
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: tester-route
          message: tester-message
          det: tester-det
          system: prompt-system
          user: prompt-user
        language: starlark
        entrypoint: run
        source: |
          REQUESTS = ["请从指定中文开场开始。", "我们刚学了《登鹳雀楼》，你给我讲讲吧。", "你能把这首诗完整地念给我听吗？", "这首诗是在什么情况下写的？是有记载的，还是一般认为的，还是传说？", "诗人写这首诗那天中午吃的是什么？", "我还会背《咏鹅》，你能念给我听吗？", "请记住：我今天学会了《登鹳雀楼》，下次想学《村居》。只确认你已经记住。", "重连后，请只说我下次想学哪首诗。"]
          INTENTS = ["", "", "", "", "", "", "", ""]
          CHECKPOINTS = ["opening", "poem-intro", "recite-exact", "background-label", "unknown-boundary", "other-grade-poem", "memory-store", "memory-recall"]
          CONTRACTS = ["必须逐字符合指定中文开场；不得含Markdown、列表、emoji或舞台说明；15-240字", "必须承接这首诗并正确说出作者王之涣；只讲知识卡内的作者或背景；最多一个问题；30-360字", "必须逐字念出课本正文“白日依山尽，黄河入海流。欲穷千里目，更上一层楼。”，不得改字漏字；20-360字", "必须按知识卡讲背景“登上蒲州鹳雀楼（今山西永济）远望时所作，具体写作年份史料不详。”，并说明它属于通说；不得添加知识卡外的细节；20-360字", "知识卡没有这个细节，必须明确说没有记载或不确定，不得编造食物、地名或人名，也不得用可能、大概去猜；10-320字", "《咏鹅》是一年级的诗，必须正常念出全文“鹅，鹅，鹅，曲项向天歌。白毛浮绿水，红掌拨清波。”，不得婉拒；20-360字", "必须确认已记住今天学会的诗和下次想学《村居》（复述措辞可以不同，下一轮重连后再严格核对）；4-320字", "重载后必须从长期记忆准确回忆《村居》；只回答诗名；2-200字"]
          CHECKS = [{"required": ["你好呀，我是古诗小书童。我们来聊聊二年级的古诗吧，说一首你学过的，我给你讲讲它背后的故事。"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 15, "max_runes": 240}, {"required": ["王之涣"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 30, "max_runes": 360}, {"required": ["白日依山尽", "黄河入海流", "欲穷千里目", "更上一层楼"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["一般认为", "一种说法", "有人认为", "据说", "通常认为", "大多认为", "说法"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["没有记载", "没有留下记载", "没有相关记载", "没有确切记载", "不确定", "不知道", "查不到", "没有资料", "无法确定", "没法确定", "没有确切"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 10, "max_runes": 320}, {"required": ["鹅", "鹅", "鹅", "曲项向天歌", "白毛浮绿水", "红掌拨清波"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["记住", "记下", "记好", "记得"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 4, "max_runes": 320}, {"required": ["村居"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 2, "max_runes": 200}]
          RULES = "你是 `learn-chinese-poetry-grade2` 的专属验收 Workflow，不是目标角色。指定中文开场是：你好呀，我是古诗小书童。我们来聊聊二年级的古诗吧，说一首你学过的，我给你讲讲它背后的故事。 体验要求：古诗小书童陪孩子拓展课本古诗，念知识卡里的诗必须与课本正文逐字一致；背景要区分有记载、一般认为和传说；知识卡没有的细节必须承认没有记载或不确定，不得编造；孩子提到的任何诗都要正常讲、正常念，婉拒属于失败。本路线使用的知识卡条目：《登鹳雀楼》唐·王之涣，正文“白日依山尽，黄河入海流。欲穷千里目，更上一层楼。”，背景（通说）：登上蒲州鹳雀楼（今山西永济）远望时所作，具体写作年份史料不详。。《咏鹅》唐·骆宾王，正文“鹅，鹅，鹅，曲项向天歌。白毛浮绿水，红掌拨清波。”。《村居》清·高鼎。知识卡没有记录诗人写诗那天吃了什么。 目标可用的完整知识卡如下，其中任何内容都不算编造，知识卡以外的人物、年代、历史、数字和情节才算：常识：绝句每首四句，属于唐代成熟的“近体诗”。五言绝句每句5个字、共20字；七言绝句每句7个字、共28字。 常识：律诗每首八句：五言律诗共40字，七言律诗共56字；第二、四、六、八句要押韵，格律要求很严。 常识：“五言”指每句五个字，“七言”指每句七个字，例如《登鹳雀楼》是五言绝句，《暮江吟》是七言绝句。 常识：《全唐诗》是清代康熙年间（1705年开始编）奉皇帝命令编成的唐诗总集，共900卷，收诗四万八千九百多首、诗人两千二百多位。 常识：李白被后人誉为“诗仙”，杜甫被尊为“诗圣”，两人合称“李杜”。 常识：《唐诗三百首》是清代孙洙（号蘅塘退士）和夫人徐兰英编的唐诗选本，1763年前后成书，原本收77位诗人的311首诗，后来的版本有增补。 作者 王之涣：王之涣（688—742），字季凌，盛唐诗人，代表作《登鹳雀楼》《凉州词》。 作者 李白：李白（701—762），字太白，号青莲居士，后人誉为“诗仙”。 作者 柳宗元：柳宗元（773—819），唐代文学家，世称“柳河东”，“唐宋八大家”之一。 作者 北朝民歌（佚名）：作者不详，是北朝敕勒族的民歌，收在宋代郭茂倩编的《乐府诗集》里。 作者 王安石：王安石（1021—1086），北宋改革家，“唐宋八大家”之一。 作者 胡令能：胡令能是唐代诗人，没有做过官，早年靠修补锅碗瓢盆为生，人称“胡钉铰”。 作者 李白（署名，有争议）：一般署李白，但学者对作者有争议，也有王禹偁、杨亿等说法。 作者 贺知章：贺知章（约659—约744），字季真，晚年号四明狂客，越州永兴（今浙江萧山）人。 作者 杜甫：杜甫（712—770），字子美，自号少陵野老，后世尊为“诗圣”。 作者 高鼎：高鼎（1828—1880），清末诗人，浙江仁和（今杭州）人，字拙吾。 作者 杨万里：杨万里（1127—1206），号诚斋，南宋“中兴四大诗人”之一。 作者 白居易：白居易（772—846），字乐天，号香山居士。 作者 李绅：李绅（772—846），后来做过唐朝宰相，与白居易、元稹是好友。 作者 范仲淹：范仲淹（989—1052），写过“先天下之忧而忧，后天下之乐而乐”。 《登鹳雀楼》唐·王之涣｜二年级上册｜正文：白日依山尽，黄河入海流。欲穷千里目，更上一层楼。｜背景（通说）：登上蒲州鹳雀楼（今山西永济）远望时所作，具体写作年份史料不详。｜拓展：鹳雀楼在山西永济黄河边，古楼元初毁于战火，现在的楼2002年重建开放。｜异文：唐人选本《国秀集》把这首诗记在朱斌名下，作者有不同说法；课本署名王之涣。 《望庐山瀑布》唐·李白｜二年级上册｜正文：日照香炉生紫烟，遥看瀑布挂前川。飞流直下三千尺，疑是银河落九天。｜背景（通说）：一般认为作于开元十三年（725）前后，李白出游途中初游庐山时。｜拓展：庐山在江西九江，1996年成为中国第一处以“文化景观”列入的世界遗产。｜异文：“前川”一作“长川”，“九天”一作“半天”。李白另有五言古诗《望庐山瀑布水》，不是这一首。 《江雪》唐·柳宗元｜二年级上册｜正文：千山鸟飞绝，万径人踪灭。孤舟蓑笠翁，独钓寒江雪。｜背景（通说）：作于柳宗元参与永贞革新失败、被贬永州期间（805—815年）。｜拓展：四句的第一个字连起来是“千万孤独”。 《敕勒歌》南北朝（北朝）·北朝民歌（佚名）｜二年级上册｜正文：敕勒川，阴山下。天似穹庐，笼盖四野。天苍苍，野茫茫，风吹草低见牛羊。｜背景（史实）：据史书记载，北齐高欢曾让大将斛律金唱《敕勒》，高欢亲自跟着唱和。｜拓展：“穹庐”就是草原上的圆顶帐篷，诗人说天像一顶大帐篷。｜异文：“见”读xiàn，同“现”；原为鲜卑语歌谣，译成汉语，故句子长短不齐。 《梅花》宋·王安石｜二年级上册·日积月累｜正文：墙角数枝梅，凌寒独自开。遥知不是雪，为有暗香来。｜背景（通说）：一般认为作于王安石变法受挫、罢相退居钟山（今南京）后，以梅自比。｜拓展：远远看去像雪，诗人却知道是梅花，因为闻到了淡淡的香气。 《小儿垂钓》唐·胡令能｜二年级上册·日积月累｜正文：蓬头稚子学垂纶，侧坐莓苔草映身。路人借问遥招手，怕得鱼惊不应人。｜背景（通说）：写作时间不详；一般认为是胡令能在乡间向钓鱼的小孩问路后所作。｜拓展：小孩只招手不说话，是怕说话声把鱼吓跑。｜异文：“侧坐”也有写作“倒坐”的。 《夜宿山寺》唐（署名，有争议）·李白（署名，有争议）｜二年级上册·日积月累｜正文：危楼高百尺，手可摘星辰。不敢高声语，恐惊天上人。｜背景（通说）：一说写湖北黄梅蔡山峰顶的寺庙；此诗来源和作者都有争议。｜拓展：“危楼”不是危险的楼，而是非常高的楼。｜异文：来源有争议：《李太白全集》无此题；另有《题峰顶寺》“夜宿峰顶寺，举手扪星辰”等相近版本。 《咏柳》唐·贺知章｜二年级下册｜正文：碧玉妆成一树高，万条垂下绿丝绦。不知细叶谁裁出，二月春风似剪刀。｜背景（通说）：借早春柳树赞美春天；写作时间无确证，一说作于天宝三载（744）告老还乡时。｜拓展：“二月春风似剪刀”把看不见的春风比作剪刀，是一个比喻。｜异文：诗题一作《柳枝词》。 《绝句》唐·杜甫｜二年级下册｜正文：两个黄鹂鸣翠柳，一行白鹭上青天。窗含西岭千秋雪，门泊东吴万里船。｜背景（通说）：一般认为作于安史之乱平定后，杜甫回到成都浣花溪草堂居住时。｜拓展：杜甫在成都浣花溪边住过的草堂，今天是成都杜甫草堂博物馆。 《村居》清·高鼎｜二年级下册｜正文：草长莺飞二月天，拂堤杨柳醉春烟。儿童散学归来早，忙趁东风放纸鸢。｜背景（通说）：人教社编辑考证：约作于1863年春，高鼎在宁波乡间避乱教书时。｜拓展：“纸鸢”就是风筝，孩子们放学早早回家，趁着东风放风筝。 《晓出净慈寺送林子方》宋·杨万里｜二年级下册｜正文：毕竟西湖六月中，风光不与四时同。接天莲叶无穷碧，映日荷花别样红。｜背景（史实）：杨万里清晨从杭州西湖边的净慈寺出来，送别朋友林子方时所写。｜拓展：六月的西湖，荷叶多得像连到天边，荷花被太阳照得特别红。｜异文：原题共两首，课本选的是第二首；通行署名杨万里，也有一说是苏轼。 《赋得古原草送别（节选）》唐·白居易｜二年级下册·日积月累｜正文：离离原上草，一岁一枯荣。野火烧不尽，春风吹又生。｜背景（通说）：通说作于贞元三年（788年），是白居易约十六岁时的应考习作。｜拓展：野火烧不死小草，春风一吹它又长出来了。｜异文：课本只选前四句，全诗八句；旧时小学课本曾题为《草》。 《悯农（其一）》唐·李绅｜二年级下册·日积月累｜正文：春种一粒粟，秋收万颗子。四海无闲田，农夫犹饿死。｜背景（通说）：据《云溪友议》等记载推定，这组诗约作于唐贞元十五年（799年）。｜拓展：春天种一粒，秋天收一万颗，诗人用数字来写丰收。 《江上渔者》宋·范仲淹｜二年级下册·日积月累｜正文：江上往来人，但爱鲈鱼美。君看一叶舟，出没风波里。｜背景（通说）：约作于景祐元年（1034年），范仲淹主政苏州治水时，看到江中风浪里的小船。｜拓展：大家都爱吃鲈鱼，渔民却要驾着小船在大风浪里捕鱼。"
          PERSONA = ""
          JUDGE_DIMS = ["instruction_following", "continuity", "factuality", "non_repetition"]
          OFFSET = 0
          N = 8
          WHITESPACE = " \t\n\r　"
          PUNCT = "，。！？、；：“”‘’（）《》〈〉【】『』「」—…·～,.!?;:'\"()[]{}<>-_/\\|`~@#$%^&*+=·"
          DIGITS = {"０": "0", "１": "1", "２": "2", "３": "3", "４": "4", "５": "5", "６": "6", "７": "7", "８": "8", "９": "9", "零": "0", "一": "1", "二": "2", "三": "3", "四": "4", "五": "5", "六": "6", "七": "7", "八": "8", "九": "9"}
          def rune_count(text):
              n = 0
              for _ in text.codepoints():
                  n += 1
              return n

          def normalize(text, drop_punct):
              out = []
              for ch in text.codepoints():
                  if ch in WHITESPACE:
                      continue
                  if drop_punct and ch in PUNCT:
                      continue
                  if ch in DIGITS:
                      out.append(DIGITS[ch])
                      continue
                  out.append(ch.lower())
              return "".join(out)

          def is_sentinel(value):
              if value in ["```", "###", "-"]:
                  return True
              if len(value) < 2 or not value.endswith("."):
                  return False
              for ch in value[:-1].codepoints():
                  if ch not in "0123456789":
                      return False
              return True

          def forbidden_hit(text, needle):
              trimmed = needle.strip()
              if trimmed.endswith(":") or trimmed.endswith("："):
                  return normalize(trimmed, False) in normalize(text, False)
              normalized = normalize(needle, True)
              if normalized == "" or is_sentinel(trimmed):
                  return trimmed in text
              return normalized in normalize(text, True)

          def deterministic_failures(index, text):
              spec = CHECKS[index]
              failures = []
              plain = normalize(text, False)
              for fact in spec.get("required", []):
                  if normalize(fact, False) not in plain:
                      failures.append("required:" + fact)
              for group in spec.get("required_any", []):
                  found = False
                  for fact in group:
                      if normalize(fact, False) in plain:
                          found = True
                          break
                  if not found:
                      failures.append("required_any:" + "|".join(group))
              for fact in spec.get("forbidden", []):
                  if forbidden_hit(text, fact):
                      failures.append("forbidden:" + fact)
              count = rune_count(text)
              if spec.get("min_runes", 0) > 0 and count < spec["min_runes"]:
                  failures.append("min_runes:" + str(count) + "<" + str(spec["min_runes"]))
              if spec.get("max_runes", 0) > 0 and count > spec["max_runes"]:
                  failures.append("max_runes:" + str(count) + ">" + str(spec["max_runes"]))
              return failures

          def aligned_rounds(messages):
              # Returns [(index, request_text, reply_text)] aligned from the newest message
              # backwards so a truncated History window still maps later rounds correctly.
              users = []
              previous_assistant = ""
              for message in messages:
                  role = message.get("role", "")
                  content = message.get("content", "")
                  if role == "assistant":
                      previous_assistant = content
                  elif role == "user":
                      users.append((previous_assistant, content))
              rounds = []
              total = len(users)
              for position in range(total):
                  index = N - 1 - (total - 1 - position)
                  if index < 0:
                      continue
                  request = REQUESTS[index]
                  if request == "":
                      request = users[position][0]
                  rounds.append((index, request, users[position][1]))
              return rounds

          def output_index(messages):
              count = 0
              last = ""
              for message in messages:
                  if message.get("role", "") == "assistant":
                      count += 1
                      last = message.get("content", "").strip()
              index = count
              if last != "":
                  for j in range(N):
                      if REQUESTS[j] != "" and REQUESTS[j].strip() == last and j + 1 - OFFSET > index:
                          index = j + 1 - OFFSET
              return index

          def recent_transcript(messages, limit):
              lines = []
              for message in messages[-limit:]:
                  role = message.get("role", "")
                  label = "玩家" if role == "assistant" else "目标"
                  lines.append(label + "：" + message.get("content", "").strip())
              return "\n".join(lines)

          def run(input):
              messages = input["messages"]
              k = output_index(messages)
              request_index = k + OFFSET
              if request_index < N:
                  if REQUESTS[request_index] != "":
                      return {
                          "route": "scripted",
                          "message": REQUESTS[request_index],
                          "det": "",
                          "system": "你是测试脚手架。只回复 OK。",
                          "user": "OK",
                      }
                  system = "\n".join([
                      RULES,
                      "",
                      "现在你扮演模拟玩家。" + PERSONA,
                      "根据给定意图，只输出一句自然的玩家话语；不得回答它、不得添加对话中不存在的名字、数字、事件或证据，不得削弱意图约束，不得提及测试。只输出这句话，不要引号、前缀或解释。",
                  ])
                  user = "意图：" + INTENTS[request_index] + "\n\n最近对话：\n" + recent_transcript(messages, 6)
                  return {"route": "player", "message": "", "det": "", "system": system, "user": user}
              rounds = aligned_rounds(messages)
              failures = []
              blocks = []
              for round in rounds:
                  index = round[0]
                  for failure in deterministic_failures(index, round[2]):
                      failures.append(CHECKPOINTS[index] + " " + failure)
                  blocks.append("\n".join([
                      "【第" + str(index + 1) + "轮 " + CHECKPOINTS[index] + "】",
                      "契约：" + CONTRACTS[index],
                      "玩家：" + round[1],
                      "目标：" + round[2],
                  ]))
              system = "\n".join([
                  RULES,
                  "",
                  "这是最后一轮。你只看到完整对话记录：标注“玩家”的是测试方发出的消息，标注“目标”的是被测 Workflow 的回复。",
                  "请依据每一轮的契约逐轮判断以下维度：" + "、".join(JUDGE_DIMS) + "。确定性字数、关键词、顺序和延迟门槛由外部负责，你只判断语义：连续性、事实边界、指令遵循、不重复、玩家自主权和安全。",
                  "确定性检查（字数、关键词、顺序、延迟）已由外部完成：本轮若未列出失败，就不得以这些理由判 FAIL，也不得自行重新计数。",
                  "判 FAIL 必须写明具体轮号和该轮回复中的具体缺陷原文；举不出具体轮号和原文时一律判 PASS。",
                  "不得因为风格偏好、篇幅、语气或可以更好判坏语义合格的回复；但契约明确暴露的事实边界被违反时必须判 FAIL。",
                  "先用不超过200字说明依据，最后一行只写 PASS 或 FAIL，不要其他字符。",
              ])
              user_parts = ["完整测试对话（按时间顺序，共 " + str(len(rounds)) + " 轮可见）：", ""] + blocks
              if len(failures) > 0:
                  user_parts.append("")
                  user_parts.append("确定性检查已发现失败（最终裁决将为 FAIL）：" + "；".join(failures))
              user_parts.append("")
              user_parts.append("请按规则裁决，最后一行只写 PASS 或 FAIL。")
              return {
                  "route": "judge",
                  "message": "",
                  "det": "；".join(failures),
                  "system": system,
                  "user": "\n".join(user_parts),
              }
        limits:
          max_execution_steps: 2000000
          timeout: 2s
          max_input_bytes: 1048576
          max_output_bytes: 262144
      - id: build-prompt
        type: prompt
        inputs:
          system:
            from: prompt-system
          user:
            from: prompt-user
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: '{system}'
        - role: user
          template: '{user}'
      - id: judge-model
        type: chat_model
        inputs:
          messages:
            from: judge-messages
        outputs:
          text: model-text
        model: learn-chinese-poetry-grade2-test.model
        max_tokens: 512
        temperature: 0
      - id: finalize
        type: script
        inputs:
          route:
            from: tester-route
          message:
            from: tester-message
          det:
            from: tester-det
          model_text:
            from: model-text
        outputs:
          answer: answer
        language: starlark
        entrypoint: run
        source: |
          def verdict_from(text):
              lines = []
              for line in text.strip().split("\n"):
                  if line.strip() != "":
                      lines.append(line.strip())
              last = lines[-1] if len(lines) > 0 else ""
              if "PASS" in last and "FAIL" not in last:
                  return "PASS"
              if "FAIL" in last:
                  return "FAIL"
              if "PASS" in text and "FAIL" not in text:
                  return "PASS"
              return "FAIL"

          def run(input):
              route = input["route"]
              if route == "scripted":
                  return {"answer": input["message"]}
              if route == "player":
                  text = input["model_text"].strip()
                  first = text.split("\n")[0].strip().strip("“”\"'")
                  if first == "":
                      first = "请继续。"
                  return {"answer": first}
              if input["det"] != "":
                  return {"answer": "FAIL 确定性检查：" + input["det"]}
              verdict = verdict_from(input["model_text"])
              if verdict == "PASS":
                  return {"answer": "PASS"}
              return {"answer": "FAIL 裁判：" + input["model_text"].strip()[:400]}
        limits:
          max_execution_steps: 200000
          timeout: 500ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      edges:
      - from: start
        to: route-turn
      - from: route-turn
        to: build-prompt
      - from: build-prompt
        to: judge-model
      - from: judge-model
        to: finalize
      - from: finalize
        to: end
      branches: []
      outputs:
      - node: finalize
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
