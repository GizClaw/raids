apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-story-robinson-crusoe-multi-role
spec:
  driver: flowcraft
  toolkit:
    tool_ids: []
  flowcraft:
    graph:
      name: story-robinson-crusoe
      entry: route-recall
      edges:
      - from: route-recall
        to: prepare-recall-query
        condition: needs_memory_recall == true
      - from: route-recall
        to: control-story
      - from: prepare-recall-query
        to: recall-progress
      - from: recall-progress
        to: control-story
      - from: persist-story
        to: observe-story
      - from: observe-story
        to: __end__
      - from: control-story
        to: narrate-story
      - from: narrate-story
        to: persist-story
      nodes:
      - id: route-recall
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim().toLowerCase();
            const cues = ["重连", "恢复", "回忆", "还记得", "代号", "更正", "改成", "reconnect", "recall", "correct"];
            board.setVar("scenario_memory", "");
            board.setVar("needs_memory_recall", current !== "" && cues.some((cue) => current.includes(cue)));
      - id: prepare-recall-query
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim();
            board.setVar("scenario_recall_query", current || "story_contract_v1");
      - id: recall-progress
        type: memory_recall
        config:
          query:
            text_from: scenario_recall_query
            lanes:
            - story_progress
            kinds:
            - state
          output: scenario_memory
          render:
            header: 'Confirmed story state:'
            item_prefix: "- "
            max_items: 16
          top_k: 16
      - id: control-story
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim();
            const memory = String(board.getVar("scenario_memory") || "");
            const roleTable = [{"key":"narrator","name":"旁白","aliases":["旁白","narrator"],"chapters":[1,2,3,4]},{"key":"robinson","name":"鲁滨逊","aliases":["鲁滨逊","robinson"],"chapters":[1,2,3,4]},{"key":"friday","name":"星期五","aliases":["星期五","friday"],"chapters":[1,2,3,4]},{"key":"captain","name":"船长","aliases":["船长","captain"],"chapters":[4]}];
            const defaults = {"schema":"story_contract_v1","revision":0,"chapter":1,"chapter_title":"退潮物资","completed_beats":[],"chapter_progress_beats":[],"chapter_choice_made":false,"location":"退潮物资","active_roles":roleTable.filter((role) => role.chapters.includes(1)).map((role) => role.key),"player_choices":[],"explicit_corrections":{},"durable_objects":["旅程代号"],"unresolved_hooks":["荒岛营地尚未解决"]};
            let state = Object.assign({}, defaults, board.getVar("story_state") || {});
            for (const line of memory.split("\n")) {
              const start = line.indexOf('{"schema":"story_contract_v1"');
              if (start < 0) continue;
              try {
                const candidate = JSON.parse(line.slice(start));
                if (candidate.schema === "story_contract_v1" && Number(candidate.revision || 0) >= Number(state.revision || 0)) state = Object.assign({}, defaults, candidate);
              } catch (_) {}
            }
            state.chapter = Math.max(1, Math.min(4, Math.floor(Number(state.chapter) || 1)));
            const chapters = ["退潮物资", "荒岛营地", "陌生脚印", "共同归航"];
            const enteringFirst = Number(state.revision || 0) === 0 && (current.includes("第一章") || current.includes("第 1 章") || /(?:start|begin|restart).{0,20}(?:chapter\s*1|first chapter)/i.test(current));
            let transitionTarget = 0;
            if (current.includes("第二章") || current.includes("第2章") || current.includes("第 2 章")) transitionTarget = 2;
            if (current.includes("第三章") || current.includes("第3章") || current.includes("第 3 章")) transitionTarget = 3;
            if (current.includes("第四章") || current.includes("第4章") || current.includes("第 4 章")) transitionTarget = 4;
            const asksNextChapter = current.includes("下一章");
            if (transitionTarget === 0 && asksNextChapter && Number(state.chapter || 1) < 4) transitionTarget = Number(state.chapter || 1) + 1;
            const transitionIntent = ["进入", "继续", "切换", "开始", "go to", "continue", "start"].some((cue) => current.toLowerCase().includes(cue)) || asksNextChapter;
            const transitionDenied = /(不要|别|不能|暂不|不想).{0,6}(进入|继续|切换|开始)/.test(current) || /(不进入|不继续|不切换|不开始)/.test(current) || /(do not|don't|cannot|can't|not ready to).{0,12}(enter|continue|switch|start|go to)/.test(current.toLowerCase()) || /(不要|别|不能|暂不|不想|先不|不去|不听).{0,6}下一章/.test(current);
            const requested = transitionIntent && !transitionDenied ? transitionTarget : 0;
            const lower = current.toLowerCase();
            const hasCompletionDenial = ["尚未满足", "未满足", "没有完成", "not complete", "not ready", "unresolved"].some((cue) => lower.includes(cue));
            const hasLaterCompletion = ["现在已经满足", "现已满足", "now complete", "now ready", "now resolved", "is now resolved"].some((cue) => lower.includes(cue));
            const completionDenied = hasCompletionDenial && !hasLaterCompletion;
            const positiveChoiceCues = ["我选择", "我选", "我决定", "我支持", "我愿意", "我要走", "我会走", "我来帮助", "我跟随", "走需要", "i choose", "my choice is", "i decide", "i support", "i’ll take", "i'll take", "i will take", "i’ll follow", "i'll follow", "i will follow", "let's take", "let's follow"];
            const choiceDenialCues = ["不选择", "不选", "没选择", "没有选择", "尚未选择", "还没选择", "还没有选择", "不决定", "没决定", "没有决定", "尚未决定", "还没决定", "还未决定", "还没有决定", "不支持", "不想选", "do not choose", "don't choose", "did not choose", "didn't choose", "have not chosen", "haven't chosen", "has not chosen", "hasn't chosen", "will not choose", "won't choose", "not choose", "not to choose", "no choice", "do not decide", "don't decide", "did not decide", "didn't decide", "have not decided", "haven't decided", "will not decide", "won't decide", "not decided", "not to decide", "undecided", "do not support", "don't support", "not support"];
            const lastPositiveChoice = positiveChoiceCues.reduce((max, cue) => Math.max(max, lower.lastIndexOf(cue)), -1);
            const lastChoiceDenial = choiceDenialCues.reduce((max, cue) => Math.max(max, lower.lastIndexOf(cue)), -1);
            const hasPositiveChoice = lastPositiveChoice >= 0;
            const choiceDenied = lastChoiceDenial >= 0 && lastChoiceDenial > lastPositiveChoice;
            const naturalChoiceBlocked = ["请", "不要", "别", "不知道", "随便", "你决定", "再说", "继续", "等等", "等一下", "只确认", "旅程代号", "代号", "更正", "作废", "重连", "回忆", "记住", "事实", "传说", "原创设定", "总结", "说明当前章节", "just continue", "you decide", "not sure", "reconnect", "recall", "remember", "correct"].some((cue) => lower.includes(cue)) || /[？?]/.test(current);
            const fillerOnly = ["好", "好的", "好吧", "可以", "行", "嗯", "哦", "知道了", "明白", "ok", "okay", "yes", "sure"].includes(lower.replace(/[。！!,.，]/g, ""));
            const naturalShortChoice = current.length > 0 && current.length <= 32 && !transitionIntent && !naturalChoiceBlocked && !fillerOnly;
            const choiceMadeNow = !choiceDenied && (hasPositiveChoice || naturalShortChoice);
            const currentChapter = Number(state.chapter || 1);
            const priorProgressBeats = Array.isArray(state.chapter_progress_beats) ? state.chapter_progress_beats : [];
            const completionReady = (state.chapter_choice_made === true || choiceMadeNow) && priorProgressBeats.length >= 2 && !completionDenied;
            let transition = false;
            if (requested === currentChapter + 1 && completionReady) {
              state.chapter = requested;
              state.chapter_title = chapters[requested - 1];
              state.location = chapters[requested - 1];
              state.completed_beats = (state.completed_beats || []).concat([chapters[requested - 2]]);
              state.unresolved_hooks = [requested < 4 ? chapters[requested] + "尚未解决" : "结局后的责任仍需兑现"];
              state.chapter_progress_beats = [];
              state.chapter_choice_made = false;
              state.next_chapter_hinted = false;
              transition = true;
            }
            const asksBlockedExplanation = ["为什么还不能", "为何不能", "说明为什么", "why can't", "why cannot", "why not ready"].some((cue) => lower.includes(cue));
            const transitionBlocked = transitionTarget > 0 && transitionTarget !== currentChapter && !transition && ((transitionIntent && !transitionDenied) || asksBlockedExplanation);
            const administrativeTurn = ["旅程代号", "更正", "改成", "纠正", "修正", "作废", "重连", "回忆", "事实", "传说", "原创设定", "总结", "说明当前章节"].some((cue) => current.includes(cue)) || current.includes("不要推进") || current.includes("不推进章节") || current.includes("只确认") || /\b(correct|correction|reconnect|recall)\b/i.test(current);
            const requestsOutcome = ["直接结果", "直接后果", "具体后果", "眼前结果", "新局面", "新线索", "推进一个场景", "推进当前章"].some((cue) => current.includes(cue));
            const requestsPerspective = ["亲自回应", "不同立场", "不同回应", "比较两名角色"].some((cue) => current.includes(cue));
            const safetyOnly = current.includes("现实中模仿") && !requestsOutcome;
            if (!transition && current && choiceMadeNow) state.chapter_choice_made = true;
            if (current.includes("月光七码")) state.journey_code = "月光七码";
            if (current.includes("晨星九号")) {
              state.journey_code = "晨星九号";
              state.explicit_corrections = {journey_code: "晨星九号", supersedes: "月光七码"};
            }
            if (current && !current.includes("只说") && !current.includes("只确认")) {
              const choices = Array.isArray(state.player_choices) ? state.player_choices.slice(-7) : [];
              choices.push(current.slice(0, 120));
              state.player_choices = choices;
            }
            state.revision = Number(state.revision || 0) + 1;
            // Always rebuild derived cast after recall and chapter changes; old arrays are not authoritative.
            state.active_roles = roleTable.filter((role) => role.chapters.includes(state.chapter)).map((role) => role.key);
            state.chapter_title = chapters[state.chapter - 1];
            state.location = state.chapter_title;
            const announce = (!current && Number(state.chapter || 1) === 1) || enteringFirst || transition;
            const safetyManagement = current.includes("现实中模仿") || current.includes("现实模仿");
            const countProgress = !transition && !transitionBlocked && !enteringFirst && current !== "" && !administrativeTurn && !safetyOnly && (requested === 0 || requested === currentChapter);
            const beatsAfterTurn = priorProgressBeats.slice();
            if (countProgress && !beatsAfterTurn.includes("consequence")) beatsAfterTurn.push("consequence");
            if (countProgress && !beatsAfterTurn.includes("perspective")) beatsAfterTurn.push("perspective");
            const nextChapterHint = countProgress && !current.includes("现实中模仿") && !current.includes("现实模仿") && Number(state.chapter || 1) < 4 && state.chapter_choice_made === true && beatsAfterTurn.length >= 2 && state.next_chapter_hinted !== true;
            if (nextChapterHint) state.next_chapter_hinted = true;
            const nextChapterInstruction = nextChapterHint ? "本轮必须完成：孩子刚刚做出了本章的选择。先用旁白讲出这个选择带来的直接结果，不再提问，回复最后一句必须逐字是“这一章的选择完成啦，想继续听就说‘进入下一章’。”" : "";
            board.setVar("announce_chapter", announce);
            board.setVar("transition_blocked", transitionBlocked);
            board.setVar("safety_request", current.includes("现实中模仿") || current.includes("现实模仿"));
            board.setVar("count_progress_response", countProgress);
            board.setVar("next_chapter_instruction", nextChapterInstruction);
            board.setVar("response_requests_outcome", requestsOutcome);
            board.setVar("response_requests_perspective", requestsPerspective);
            board.setVar("story_state", state);
            // Project prompt state only; persistence retains the complete state.
            const promptState = Object.assign({}, state);
            delete promptState.last_answer;
            board.setVar("story_state_text", JSON.stringify(promptState));
            board.setVar("story_bible", "故事：鲁滨逊漂流记。前提：通过荒岛生活学习计划、制作、观察与求助。\n玩家是能改变局面但不能替代角色作决定的同行者。\n世界规则：每轮只推进一个场景、线索或选择；最多一个问题，请孩子做选择时要在这个问题里直接说出两三个具体选项，不能只问“你想怎么做”；给孩子的选项必须适合儿童，不能包含杀害、伤害、威胁或报复任何人；当前用户更正覆盖历史旧值。\n事实边界：经典来源、传说与本剧本原创设定必须区分；不得复制完整出版译文。\n安全边界：面向儿童，危险非血腥；现实模仿请求必须明确说“不要模仿”，并建议找可信任的成年人、家长或老师帮助。\n反重复：不得重复确认句、场景开头、上一轮选择、同一个问题、回顾或寓意总结。" + "\n" + ["第1章《退潮物资》：进入条件=收到首次开场请求；目标=解决《退潮物资》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第2章；结束条件=转场回合只出现一次下一章标题“第 2 章：荒岛营地”，并紧接新章开场。","第2章《荒岛营地》：进入条件=第1章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《荒岛营地》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第3章；结束条件=转场回合只出现一次下一章标题“第 3 章：陌生脚印”，并紧接新章开场。","第3章《陌生脚印》：进入条件=第2章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《陌生脚印》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第4章；结束条件=转场回合只出现一次下一章标题“第 4 章：共同归航”，并紧接新章开场。","第4章《共同归航》：进入条件=第3章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《共同归航》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家确认角色的持久选择，并保留一个结局后的责任线索；结束条件=保持第4章，不再创建第五章，并以仍需兑现的责任收束。"][state.chapter - 1]);

            // Include the exact opening for initial and explicit first-chapter opening requests.
            const openingForms = ["第一章开始","第一章重新开始","第一章从头开始","第一章重来","第一章重开","第一章重启","开始第一章","重新开始第一章","从头开始第一章","重开第一章","重启第一章","第1章开始","第1章重新开始","第1章从头开始","第1章重来","第1章重开","第1章重启","开始第1章","重新开始第1章","从头开始第1章","重开第1章","重启第1章","startchapter1","startfirstchapter","startfromchapter1","startfromfirstchapter","startatchapter1","startatfirstchapter","startthechapter1","startthefirstchapter","beginchapter1","beginfirstchapter","beginfromchapter1","beginfromfirstchapter","beginatchapter1","beginatfirstchapter","beginthechapter1","beginthefirstchapter","restartchapter1","restartfirstchapter","restartfromchapter1","restartfromfirstchapter","restartatchapter1","restartatfirstchapter","restartthechapter1","restartthefirstchapter"];
            const requestedOpening = !transitionDenied && openingForms.some(cue => current.toLowerCase().replace(/\s/g, "").includes(cue));
            // A fresh narrator request is an opening even without the literal word "start".
            const promptHistory = typeof board.channel === "function" ? (board.channel(board.MAIN_CHANNEL) || []) : null;
            const firstNarration = state.chapter === 1 && !administrativeTurn && !safetyManagement && !choiceMadeNow && !memory.trim() && (promptHistory ? !promptHistory.some(m => m.role === "assistant" || m.role === "model") : Number(state.revision || 0) === 1);
            board.setVar("opening_instruction", (enteringFirst || !current || requestedOpening || firstNarration) ? "本轮是用户要求的第一章开场，优先于普通回合的反重复和不报章节规则。先写当前第一章标题，章节标题后保留以下背景和玩法，在同轮展开连续多角色故事，把开场问题移到整轮末尾：我们漂流到一座荒岛上，你是鲁滨逊的小帮手，星期五已经在岸边与你们一起清点物资。当前在场有鲁滨逊、星期五；船长在第4章出场。你可以直接说出你的选择，也可以说“请让鲁滨逊说说”或“请让星期五说说”，听当前在场者自己讲；这一章的选择做完后，说“进入下一章”就能继续听下去。潮水退去后留下了木板、绳子和一个空瓶子，你会先搭避雨处，还是先留下求救信号？（玩法说明里“说‘进入下一章’就能继续听下去”这一句不得省略）" : "");

            // Only the selected role needs private style details; narration compares present roles.
            const roleViews = ["当前角色资料：narrator 旁白，只在第1、2、3、4章在场，只述可见事实，不代演角色；robinson 鲁滨逊，只在第1、2、3、4章在场，想建立可持续的营地；清晰理性，第1章清点退潮物资；friday 星期五，只在第1、2、3、4章在场，想作为平等伙伴合作；清爽坦率，第1章建议标记安全营地，不凭空认定危险\n所有角色只说亲历或已公开信息，不知他人私密想法及未来结果。每章比较至少两种立场，不要求全员发声。章节行动属于本仓库儿童互动原创改编，不等同原典情节。本改编让星期五从第1章即作为平等伙伴在场，不采用主仆叙事。","当前角色资料：narrator 旁白，只在第1、2、3、4章在场，只述可见事实，不代演角色；robinson 鲁滨逊，只在第1、2、3、4章在场，想建立可持续的营地；清晰理性，；friday 星期五，只在第1、2、3、4章在场，想作为平等伙伴合作；清爽坦率，不凭空认定危险\n所有角色只说亲历或已公开信息，不知他人私密想法及未来结果。每章比较至少两种立场，不要求全员发声。章节行动属于本仓库儿童互动原创改编，不等同原典情节。本改编让星期五从第1章即作为平等伙伴在场，不采用主仆叙事。","当前角色资料：narrator 旁白，只在第1、2、3、4章在场，只述可见事实，不代演角色；robinson 鲁滨逊，只在第1、2、3、4章在场，想建立可持续的营地；清晰理性，；friday 星期五，只在第1、2、3、4章在场，想作为平等伙伴合作；清爽坦率，第3章核对脚印，不凭空认定危险\n所有角色只说亲历或已公开信息，不知他人私密想法及未来结果。每章比较至少两种立场，不要求全员发声。章节行动属于本仓库儿童互动原创改编，不等同原典情节。本改编让星期五从第1章即作为平等伙伴在场，不采用主仆叙事。","当前角色资料：narrator 旁白，只在第1、2、3、4章在场，只述可见事实，不代演角色；robinson 鲁滨逊，只在第1、2、3、4章在场，想建立可持续的营地；清晰理性，；friday 星期五，只在第1、2、3、4章在场，想作为平等伙伴合作；清爽坦率，不凭空认定危险；captain 船长，只在第4章在场，想带全员安全归航；幽默稳重，第4章核对人数与天气，并商议带走哪些物资。\n所有角色只说亲历或已公开信息，不知他人私密想法及未来结果。每章比较至少两种立场，不要求全员发声。章节行动属于本仓库儿童互动原创改编，不等同原典情节。本改编让星期五从第1章即作为平等伙伴在场，不采用主仆叙事。"];
            board.setVar("story_bible", board.getVar("story_bible") + "\n" + roleViews[state.chapter - 1]);
      - id: persist-story
        type: script
        config:
          source: |
            const state = board.getVar("story_state") || {};
            if (board.getVar("count_progress_response") === true) {
              const beats = Array.isArray(state.chapter_progress_beats) ? state.chapter_progress_beats.slice() : [];
              const addBeat = (beat) => { if (!beats.includes(beat)) beats.push(beat); };
              addBeat("consequence");
              addBeat("perspective");
              state.chapter_progress_beats = beats;
            }
            state.last_answer = String(board.getVar("answer") || "").slice(0, 1200);
            board.setVar("story_state_fact", JSON.stringify(state));
      - id: observe-story
        type: memory_observe
        config:
          observations:
          - facts:
            - text_from: story_state_fact
              attributes:
                lane: story_progress
                kind: state
          wait_for_completion: true
      - id: narrate-story
        type: llm
        publish: true
        config:
          model: flowcraft-story-robinson-crusoe-mr.model
          max_tokens: 2048
          output_key: answer
          system_prompt: |-
            ${board.story_bible}
            当前权威状态：${board.story_state_text}
            本轮安全请求：${board.safety_request}。若该值为 true，回复中必须明确包含“不要模仿”和“找家长、老师或可信任成年人帮助”，并承接玩家所选安全替代带来的一个直接结果。
            本轮转场阻塞：${board.transition_blocked}。若该值为 true，用“第 N 章：标题”格式写出当前章节及标题，再用孩子听得懂的话说明这一章还差孩子自己的选择或还没看到选择的结果，所以暂时还不能去下一章，最后用一个问题说出本章问题的具体选项；不得说“节拍”“转场条件”“悬念”等内部用语，也不要把“先听某个角色说说”当作选项，并且绝不输出用户请求的下一章标题。
            若 announce_chapter 为 true，在【旁白】后第一行只写一次“第 N 章：标题”，其中“第”与数字、数字与“章”之间各有一个空格，标题后必须在同一条回复里紧接着讲这一章的开场：先交代新场景在哪里、谁在场、发生了什么，接着用旁白和在场角色连续交替讲述，最后用一个问题说出孩子可以选的两三个具体选项；绝不能只输出章节标题就结束。若 announce_chapter 和 transition_blocked 均为 false，则不得输出章节标题。
            ${board.opening_instruction}
            若用户只要求回忆或确认旅程代号，只回答当前代号；存在更正时绝不输出旧值。
            ${board.next_chapter_instruction}
            普通讲述回合输出200至900个Unicode字符。不输出Markdown、列表、emoji、舞台说明、系统字段或重复问题。
            篇幅执行规则：所有普通叙述回合均须完整讲述，包括开场、转场、自然后果、不可用角色的替代回应、旁白线索钩子、角色探问、点名或否定点名后的继续讲述、事实边界说明和检查点总结。去除角色标记后，中文目标约 500 字，大约 1-2 分钟；不要少于 200 字，不要超过 900 字（按Unicode字符计数，标点、空格和换行也计入）。中文安排5段，每段约100字：旁白承接当前行动、在场角色的第一人称回应、另一在场角色的不同回应（只有一位时由旁白补充可观察细节）、旁白描述一个直接结果、旁白收束并按本轮规则给出选项。单角色探问仍保持该角色知识边界；事实说明和检查点用这5段展开当前已知细节，不因此新增剧情。英文按单词计数，目标约220个英文单词，大约1-2分钟；不要少于100个英文单词，不要超过450个英文单词，约5段、每段约44词，以匹配约1至2分钟语音；英文不适用中文字符上限，不翻译或重述整段中文背景。不能靠重复开场、旧对白或再讲一遍上一轮来补篇幅，也不能一句回应后立即结束。生成前安排各段篇幅，中文接近500字、英文接近220词时收束，不输出计数或分析。
            仅用户明确要求只确认、只说代号、限定范围更正/记忆回忆，或纯安全制止时，才按该特殊回合的原限制简短回答，不凑字数、不推进剧情。提到更正、否定角色名、改变选择或要求自然后果本身不构成短回复豁免；仍要求继续讲述时中文必须完成200至900字符、英文100至450词。不得为了长度新增事实、越过角色知识边界或推进下一章。
            有声书连续讲述：普通回合（含开场、转场和选择结果）中文正文200至900个Unicode字符，英文正文100至450个英文单词，约1至2分钟语音。旁白与2至4个当前在场角色来回交替讲述，旁白叙述与角色第一人称台词分段；场景确实只有一位角色时只用该角色，绝不为凑数让未在场角色出现。角色只知亲历或已公开信息。孩子可以随时插话；接续最新插话，不重播已讲段落。孩子点名想听某个在场角色时，在本段多给该角色台词；不单独切换整轮说话人，也不因点名改变场景。
            标记格式：每段必须恰好以一个全角标记开头，只能使用【旁白】、【鲁滨逊】、【星期五】、【船长】，标记后直接正文；不输出其它【】标记，不把舞台说明放进标记，不使用英文角色key作标记。旁白与角色台词分别成段，同一角色可以多次出现。章节标题放在【旁白】后的正文，标题规则保持不变。
            每轮结尾用【旁白】给出2至3个具体、儿童安全的选项，最多一个问题。选择完成结尾逐字句、第4章或终局、安全及限定范围的确认/更正/重连约束优先：这些特殊回合按原规则收束，不强加新问题；仅用户明确限定范围的确认、更正、记忆回忆或纯安全制止可短于200字，不为凑字数推进剧情。音色由段落标记映射，不输出Markdown、emoji或系统字段。
          track_steps: true
    max_iterations: 10
    conversation:
      starts: agent
    voice_adapter:
      asr_model: asr
      default_voice: flowcraft-story-robinson-crusoe-mr.storyteller
      speaker_voices:
        旁白: flowcraft-story-robinson-crusoe-mr.storyteller
        鲁滨逊: flowcraft-story-robinson-crusoe-mr.robinson
        星期五: flowcraft-story-robinson-crusoe-mr.friday
        船长: flowcraft-story-robinson-crusoe-mr.captain
  memory: story-teller
