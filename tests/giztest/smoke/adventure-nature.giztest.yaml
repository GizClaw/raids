    "/flowcraft_multi_role_probe_narrator_first_response/audio_bytes":
      minimum: 1
    "/flowcraft_multi_role_probe_narrator_first_response/first_text_ms":
      maximum: 2000
    "/flowcraft_multi_role_probe_narrator_first_response/first_audio_ms":
      maximum: 3000
    "/eino_multi_role_probe_narrator_first_response/events":
      non_empty: true
    "/eino_multi_role_probe_narrator_first_response/audio_bytes":
      minimum: 1
    "/eino_multi_role_probe_narrator_first_response/first_text_ms":
      maximum: 2000
    "/eino_multi_role_probe_narrator_first_response/first_audio_ms":
      maximum: 3000
    "/flowcraft_multi_role_probe_narrator_first_response/text":
      not_contains: ["【", "】", "进入下一章", "要不要继续", "想继续听就说", "这一章的选择完成啦", "等你说要不要", "是否继续听"]
    "/eino_multi_role_probe_narrator_first_response/text":
      not_contains: ["【", "】", "进入下一章", "要不要继续", "想继续听就说", "这一章的选择完成啦", "等你说要不要", "是否继续听"]
