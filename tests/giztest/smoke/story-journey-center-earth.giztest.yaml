    "/first_audio_ms":
      maximum: 90000
    "/events":
      non_empty: true
    "/text_eos_ms":
      maximum: 90000
    "/audio_eos_ms":
      maximum: 90000
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- timeout: 2m
  id: flowcraft_probe_narrator
  client: flowcraft
  peer_stream:
    mode: text
    input: 请从第一章开始《地心游记》，写出本地化章节标题并承接指定开场。
    idle_timeout: 90s
    require_text: true
    require_audio: true
