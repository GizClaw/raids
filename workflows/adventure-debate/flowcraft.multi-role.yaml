apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-adventure-debate-multi-role
spec:
  driver: flowcraft
  toolkit:
    tool_ids: []
  flowcraft:
    graph:
      name: adventure-debate
      entry: route-recall
      edges:
      - from: route-recall
        to: prepare-recall-query
        condition: needs_memory_recall == true
      - from: route-recall
        to: control-narration
      - from: prepare-recall-query
        to: recall-progress
      - from: recall-progress
        to: control-narration
      - from: narrate-story
        to: capture-progress
      - from: capture-progress
        to: observe-progress
      - from: observe-progress
        to: __end__
      - from: control-narration
        to: narrate-story
      nodes:
      - id: control-narration
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim().toLowerCase();
            const memory = String(board.getVar("scenario_memory") || "");
            let state = Object.assign({schema:"raid_scenario_state_v2", revision:0}, board.getVar("scenario_state") || {});
            for (const line of memory.split("\n")) {
              const start = line.indexOf('{"schema":');
              if (start < 0) continue;
              try { const old = JSON.parse(line.slice(start));
                if (old.schema === "raid_scenario_state_v2" && Number(old.revision || 0) > Number(state.revision || 0)) state = Object.assign({},state,old);
              } catch (_) {}
            }
            const roleTable = [{"key": "narrator", "name": "旁白", "aliases": ["旁白", "narrator"], "chapters": [1, 2, 3], "duty": "只负责叙述、管理和公开信息整理，不代演角色。"}, {"key": "proponent", "name": "正方小辩手", "aliases": ["正方小辩手", "proponent"], "chapters": [1, 3], "duty": "用校园生活例子支持当前分配的观点，承认反例。"}, {"key": "opponent", "name": "反方小辩手", "aliases": ["反方小辩手", "opponent"], "chapters": [1, 3], "duty": "复述对方理由后提出当前相反观点，不评价人格。"}, {"key": "fact-checker", "name": "事实核对员", "aliases": ["事实核对员", "fact-checker"], "chapters": [2, 3], "duty": "区分可核对的事实和个人偏好，不宣布谁永远正确。"}];
            const scenes = ["观点陈述", "例子核对", "换位讨论"];
            const any = (s, cues) => cues.some(c => s.includes(c));
            let scene = Number(state.voice_scene || 1);
            scene = Number.isFinite(scene) ? Math.max(1, Math.min(scenes.length, Math.floor(scene))) : 1;
            const history = typeof board.channel === "function" ? (board.channel(board.MAIN_CHANNEL) || []) : [];
            { // Delivered scene arrivals supersede recalled state.
              for (const m of history) {
                if (m.role !== "assistant") continue;
                const text = m.content || (m.parts || []).filter(p => p.type === "text").map(p => p.text || "").join("");
                for (let i=0;i<scenes.length;i++) if (text.includes("当前场景："+scenes[i]) || text.includes("来到"+scenes[i])) scene=i+1;
              }
            }
            let transition = false;
            if (!current || any(current, ["重新开始", "restart", "开场", "介绍这个体验", "开始体验"])) scene=1;
            else if (any(current,["进入下一章","进入下一场景"])) {scene=Math.min(scenes.length,scene+1); transition=true;}
            else {
              for (let i=0;i<scenes.length;i++) if (any(current,["进入"+scenes[i],"前往"+scenes[i],"来到"+scenes[i]])) {scene=i+1;transition=true;}

            }
            const phase = "explore";
            let side = state.debate_side === "flexible" ? "flexible" : "plan";
            if (!current || any(current, ["重新开始","restart","开场","开始体验"])) side="plan";
            if (any(current,["我支持保持灵活","我支持灵活","我选择灵活"])) side="flexible";
            else if (any(current,["我支持做计划","我支持计划","我选择计划"])) side="plan";
            else if (current.includes("我换边") && !any(current,["不要换边","不换边"])) side = side === "plan" ? "flexible" : "plan";
            state.debate_side=side;
            state.voice_scene=scene;
            state.active_roles=roleTable.filter(r=>r.chapters.includes(scene)).map(r=>r.key);
            let managementText=current;
            for (const role of roleTable) for (const alias of role.aliases) managementText=managementText.split(alias).join("");
            const management = !current || transition || any(managementText,["旅程", "更正", "纠正", "修正", "改成", "改变主意", "其实", "安全", "危险", "现实", "模仿", "受伤", "攻击", "牺牲", "停止", "总结", "结论", "回忆", "重连", "恢复", "请记住", "只确认", "只说", "换边", "correction", "correct", "actually", "danger", "safety", "restart", "重新开始", "开场", "介绍这个体验", "进入下一", "下一章", "下一场景", "转场", "开始体验", "从头开始", "第一章", "第1章", "开始冒险", "start", "begin", "介绍体验", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物"]) || phase !== "explore";
            state.chapter_choice_made=!!current && !management;
            delete state.selected_speaker;
            state.revision=Math.max(0,Number(state.revision || 0))+1;
            board.setVar("scenario_state",state);
            board.setVar("scenario_state_text",JSON.stringify(state));
            board.setVar("story_bible", "原创配角按场景出场，不知未来/秘密/未验证结果。\n首次让在场角色自然登场。\n正方小辩手跟随玩家当前支持的观点，反方小辩手负责另一观点；每次“我换边”由旁白明确交换双方当前观点。角色后续依据最近一次换边和玩家选择更新立场，不能固定支持计划或灵活。主持人只中立归纳，不代演对方；事实核对员不宣布胜负。");
            board.setVar("narration_context", "当前场景："+scenes[scene-1]+"。当前在场角色："+roleTable.filter(r=>state.active_roles.includes(r.key)).map(r=>r.name).join("、")+"。"+(transition ? "本轮由旁白说出‘来到"+scenes[scene-1]+"’，用旁白和在场角色台词交替描写具体行动，结尾给两三个观察选项。" : "") );

            board.setVar("narration_context", board.getVar("narration_context") + "当前正方小辩手支持"+(side === "plan" ? "做计划" : "保持灵活")+"，反方小辩手支持"+(side === "plan" ? "保持灵活" : "做计划")+"；这只是当前分工，不判定谁正确。换边回合旁白必须明确这两个当前观点，后续角色只代表最新观点。");


            // Keep the fixed opening out of ordinary-turn requests.
            const openingPrompt = !current || any(current, ["重新开始", "restart", "开场", "介绍这个体验", "开始体验", "start", "begin", "介绍体验"]);
            board.setVar("english_opening_instruction", openingPrompt && /english|英文|英语/i.test(current) ? "英文开场用普通词数预算，以下原句逐字放末尾，不另问/重译：Today's debate asks whether planning or flexibility matters more. Which side will you support first?" : "");
            board.setVar("opening_instruction", openingPrompt ? "中文开场：首段/末问逐字完整保留在首尾，中间连续讲述，只问一次：欢迎来到观点擂台，你是今天的小辩手，我是主持人。你先选一边说出理由，正方和反方小辩手会提出各自的理由，想换边的时候直接说“我换边”就行。今天的观点擂台题目是，做计划更重要，还是保持灵活更重要？你想先支持哪一边？" : "");

            board.setVar("story_bible", board.getVar("story_bible") + "\n" + ["场景1“观点陈述”：正方小辩手：用校园生活例子支持当前分配的观点，承认反例。；反方小辩手：复述对方理由后提出当前相反观点，不评价人格。","场景2“例子核对”：事实核对员：区分可核对的事实和个人偏好，不宣布谁永远正确。","场景3“换位讨论”：正方小辩手：用校园生活例子支持当前分配的观点，承认反例。；反方小辩手：复述对方理由后提出当前相反观点，不评价人格。；事实核对员：区分可核对的事实和个人偏好，不宣布谁永远正确。"].slice(scene - 1, Math.min(scene + 1, scenes.length)).join("\n"));
      - id: route-recall
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim();
            const normalized = current.toLowerCase();
            const containsAny = (values) => values.some((value) => normalized.includes(value));
            const storeCues = ["请记住", "记住：", "please remember", "remember this"];
            const durableReadCues = [
              "回忆", "还记得", "记得什么", "重连", "重新连接", "恢复",
              "继续上次", "接着上次", "上次", "之前", "代号",
              "recall", "do you remember", "what do you remember", "reconnect",
              "resume", "continue where", "last time", "previous",
            ];
            const correctionCues = [
              "更正", "纠正", "修正", "改成", "改变主意", "其实",
              "correction", "correct", "change my mind", "actually",
            ];
            const storeOverrideCues = durableReadCues
              .filter((value) => value !== "代号")
              .concat(correctionCues);
            const storeOnly = containsAny(storeCues) && !containsAny(storeOverrideCues);
            const needsRecall = current !== "" && !storeOnly
              && (containsAny(durableReadCues) || containsAny(correctionCues));
            board.setVar("scenario_memory", "");
            board.setVar("needs_memory_recall", needsRecall);
      - id: prepare-recall-query
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim();
            board.setVar("scenario_recall_query", current || "raid_scenario_state_v2");
      - id: recall-progress
        type: memory_recall
        config:
          query:
            text_from: scenario_recall_query
            lanes:
            - story_progress
            kinds:
            - state
            - note
            - event
          output: scenario_memory
          render:
            header: 'Confirmed scenario history:'
            item_prefix: "- "
            max_items: 12
          top_k: 12
      - id: capture-progress
        type: script
        config:
          source: |
            const state = Object.assign({}, board.getVar("scenario_state") || {});
            state.last_input = String(board.getVar("input") || "").slice(0,160);
            state.last_answer = String(board.getVar("answer") || "").slice(0,12000);
            const scenes = ["观点陈述", "例子核对", "换位讨论"];
            const roleTable = [{"key": "narrator", "name": "旁白", "aliases": ["旁白", "narrator"], "chapters": [1, 2, 3], "duty": "只负责叙述、管理和公开信息整理，不代演角色。"}, {"key": "proponent", "name": "正方小辩手", "aliases": ["正方小辩手", "proponent"], "chapters": [1, 3], "duty": "用校园生活例子支持当前分配的观点，承认反例。"}, {"key": "opponent", "name": "反方小辩手", "aliases": ["反方小辩手", "opponent"], "chapters": [1, 3], "duty": "复述对方理由后提出当前相反观点，不评价人格。"}, {"key": "fact-checker", "name": "事实核对员", "aliases": ["事实核对员", "fact-checker"], "chapters": [2, 3], "duty": "区分可核对的事实和个人偏好，不宣布谁永远正确。"}];
            for (let i = 0; i < scenes.length; i++) {
              if (state.last_answer.includes("来到" + scenes[i])) state.voice_scene = i + 1;
            }
            state.active_roles = roleTable.filter(r => r.chapters.includes(state.voice_scene || 1)).map(r => r.key);
            board.setVar("scenario_state_fact", JSON.stringify(state));
      - id: observe-progress
        type: memory_observe
        config:
          observations:
          - facts:
            - text_from: scenario_state_fact
              attributes:
                lane: story_progress
                kind: state
          wait_for_completion: false
      - id: narrate-story
        type: llm
        publish: true
        config:
          model: flowcraft-adventure-debate-mr.model
          max_tokens: 2048
          output_key: answer
          system_prompt: |-
            你是儿童友好的互动冒险主持人。
            ${board.opening_instruction}
            ${board.english_opening_instruction}
            不得重置场景；孩子不知道或求提示时，先给小提示再复述选项。
            体验要求：中立儿童安全命题；问一个理由，充分呈现对方最佳论据，以综合观点而非胜负收尾。
            安全边界：禁政治、仇恨、成人争执、人身攻击、施压说服，不能因分歧贬低他人。
            区分事实、传说、虚构及不确定性。
            现实危险/模仿：说明危险，逐字说“不要模仿”和“找家长、老师或可信任成年人帮助”，不提问。
            可核对的长期进度：${board.scenario_memory}
            承接已确认进度，不推翻/重播。
            默认自然中文，明确要求英文时用英文。
            ${board.story_bible}
            ${board.narration_context}

            连续有声书规则：普通轮讲选择后果，目标达成同轮续邻章/场景及开场，无需许可。末尾【旁白】问一次，给2至3个具体安全行动/地点/解法。中文回复以恰好一个全角问号？结束；英文用?，禁双问号/尾文。禁“进入下一章”“要不要继续”“想继续听就说”“这一章的选择完成啦”等流程口令；主动转场可承接，特殊轮优先。末场不增章，选择角色后续行动。实际转场用旁白“来到场景名。”，不预告。互动规则（普通200至900字）：承接孩子的选择；改选以最新意愿为准，不执行已否定的选择。追问、角色对话、插话和重听自然融入连续叙述，重听只重述所指片段后接回当前故事，不重开。普通回复末尾由旁白给一个故事内选择。记名确认与回忆可用4至360字符简答，记住最新旅程名字，不必提问或推进；安全优先制止危险模仿，说明安全替代并请孩子找家长、老师或可信任成年人帮助，4至360字符，不必提问。篇幅执行规则：去角色标记后，中文Unicode计数含标点空白，目标500字、5段每段约100字；不要少于 200 字，不要超过 900 字。英文100至450词，目标约220个英文单词、5段各44词，无中文上限。依次行动、两种回应、结果、选择。勿重复/虚构凑数或输出分析计数。
            有声书连续讲述：旁白叙述与角色第一人称台词分段，与2至4位在场角色交替；单角色不添人。只知亲历/公开信息。插话接续，点名仅增台词不换场/整轮。
            标记格式：每段选一个【旁白】、【正方小辩手】、【反方小辩手】、【事实核对员】后接正文，不输出其它【】标记或英文key；可再次发声，标题属旁白。
            音色由段落标记映射；仅朗读正文，禁Markdown/列表/emoji/舞台说明/系统字段/分析。
          track_steps: true
    max_iterations: 10
    conversation:
      starts: agent
    voice_adapter:
      asr_model: asr
      default_voice: flowcraft-adventure-debate-mr.adventure-guide
      speaker_voices:
        旁白: flowcraft-adventure-debate-mr.adventure-guide
        正方小辩手: flowcraft-adventure-debate-mr.proponent
        反方小辩手: flowcraft-adventure-debate-mr.opponent
        事实核对员: flowcraft-adventure-debate-mr.fact-checker
  memory: adventure
