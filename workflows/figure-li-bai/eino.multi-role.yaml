apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-figure-li-bai-multi-role
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: story-teller
  eino:
    audio_input: model
    voice_adapter:
      default_voice: eino-figure-li-bai-mr.storyteller
      speaker_voices:
        旁白: eino-figure-li-bai-mr.storyteller
        Narrator: eino-figure-li-bai-mr.storyteller
        李白: eino-figure-li-bai-mr.li-bai
        Li Bai: eino-figure-li-bai-mr.li-bai
    graph:
      name: figure-li-bai-eino
      compile:
        node_trigger_mode: any_predecessor
        primary_output_mode: first_output
        max_run_steps: 12
      state:
        fields:
        - {name: memory-query, type: string, merge: replace}
        - {name: memory-route, type: string, merge: replace}
        - {name: recalled, type: string, merge: replace}
        - {name: answer-messages, type: messages, merge: replace}
        - {name: answer, type: string, merge: replace}
      nodes:
      # Only the selected answer node publishes; control JSON stays internal.
      # Existing answer/answer-messages fields are overwritten before narration.
      - id: prepare-turn-intent
        type: prompt
        inputs:
          safety_fence: {from: input.safety_fence}
          conversation: {from: input.messages}
        outputs:
          messages: answer-messages
        format: go_template
        messages:
        - role: system
          template: |-
            {{.safety_fence}}

            [internal-turn-intent]
            只判断最后一条原音或文字的任务，不回答；历史是背景。
            plot：续讲亲历、感受、行动选择、重连/重开。
            research：核验史实、精确先后、文献出处、传说或他人后续经历。
            只讲可确定史实、无考须说明的限制优先research，不因亲历问法选plot；明确搁下考据续故事才plot。
            language依本轮指定，否则取本轮主要语种，勿沿用引文或历史语种。
        - placeholder: conversation
      - id: turn-intent-model
        type: chat_model
        inputs:
          messages: {from: answer-messages}
        outputs:
          text: answer
        model: eino-figure-li-bai-mr.intent-model
        temperature: 0
        # Internal two-field control object, not a user-facing response limit.
        max_tokens: 64
        structured_output:
          name: turn_intent
          schema:
            type: object
            additionalProperties: false
            required: [mode, language]
            properties:
              mode: {type: string, enum: [plot, research]}
              language: {type: string, minLength: 1, maxLength: 32}
      - id: prepare-memory-query
        type: script
        inputs:
          text: {from: input.text}
        outputs:
          query: memory-query
          route: memory-route
          memory: recalled
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              cues = ["重连", "恢复", "回忆", "还记得", "代号", "更正", "改成", "上次", "continue where", "left off"]
              recall = any([cue in text for cue in cues])
              return {"query": "李白的一生故事状态、角色、选择、更正和未解决线索；当前请求：" + text,
                      "route": "recall" if recall else "reply", "memory": ""}
        limits: {max_execution_steps: 10000, timeout: 250ms, max_input_bytes: 65536, max_output_bytes: 65536}
      - id: recall-memory
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 16
      - id: build-prompt
        type: script
        inputs:
          intent: {from: answer}
          safety_fence: {from: input.safety_fence}
          history: {from: input.messages}
          text: {from: input.text}
          memory: {from: recalled}
        outputs:
          messages: answer-messages
          route: memory-route
        language: starlark
        entrypoint: run
        source: |
          # Whole card units are lookup data, not an always-injected prompt.
          FACTS = [
              {'field': '人物', 'line': 1, 'part': 1, 'text': '李白', 'terms': {'name': 50, 'person': 100, '人物': 50, '李白': 4, 'bai': 5, 'li': 4}, 'rendered': '人物：李白', 'characters': 6, 'id': 'L1.1', 'en': 'Person: Li Bai'},
              {'field': '英文名', 'line': 2, 'part': 1, 'text': 'Li Bai', 'terms': {'bai': 100, 'english': 100, 'li': 100, 'name': 50, '文名': 100, '英文': 100}, 'rendered': '英文名：Li Bai', 'characters': 11, 'id': 'L2.1', 'en': 'English name: Li Bai'},
              {'field': '别名', 'line': 3, 'part': 1, 'text': '李太白、青莲居士、谪仙人、诗仙、李翰林', 'terms': {'alias': 100, 'nickname': 100, '仙人': 25, '别名': 100, '太白': 100, '居士': 50, '李太': 100, '李翰': 33, '翰林': 16, '莲居': 50, '诗仙': 33, '谪仙': 25, '青莲': 50, 'epithets': 100, 'hanlin': 25, 'jushi': 50, 'li': 4, 'names': 100, 'qinglian': 50, 'shixian': 33, 'taibai': 100, 'zhexianren': 100}, 'rendered': '别名：李太白、青莲居士、谪仙人、诗仙、李翰林', 'characters': 23, 'id': 'L3.1', 'en': 'Names and epithets: Li Taibai, Qinglian Jushi, Zhexianren, Shixian, Li Hanlin'},
              {'field': '性别', 'line': 4, 'part': 1, 'text': '男', 'terms': {'gender': 100, '性别': 100, 'male': 100}, 'rendered': '性别：男', 'characters': 5, 'id': 'L4.1', 'en': 'Gender: male'},
              {'field': '时代', 'line': 5, 'part': 1, 'text': '唐朝（701年—762年，生卒年另有异说）', 'terms': {'701': 50, '762': 33, 'dates': 100, 'era': 100, 'lifetime': 100, '世年': 100, '出生': 33, '卒年': 100, '去世': 100, '另有': 100, '唐朝': 50, '年代': 100, '年另': 100, '异说': 100, '时代': 50, '有异': 100, '朝代': 50, '生卒': 100, '生年': 100, 'also': 100, 'alternative': 100, 'birth': 50, 'death': 25, 'dynasty': 50, 'exist': 100, 'tang': 14}, 'rendered': '时代：唐朝（701年—762年，生卒年另有异说）', 'characters': 25, 'id': 'L5.1', 'en': 'Era: Tang dynasty (701–762; alternative birth and death dates also exist)'},
              {'field': '出生地', 'line': 6, 'part': 1, 'text': '一说生于西域碎叶城（今吉尔吉斯斯坦托克马克附近），约五岁随家迁居绵州昌隆（今四川江油）；一说生于蜀中', 'terms': {'birth': 100, 'birthplace': 100, 'born': 100, 'childhood': 100, '一说': 33, '于蜀': 100, '于西': 100, '五岁': 100, '今吉': 100, '今四': 100, '克附': 100, '克马': 100, '出生': 33, '叶城': 100, '吉尔': 100, '吉斯': 100, '四川': 100, '坦托': 100, '域碎': 100, '家迁': 100, '尔吉': 100, '居绵': 100, '岁随': 100, '川江': 100, '州昌': 100, '托克': 100, '斯坦': 100, '斯斯': 100, '昌隆': 100, '江油': 100, '生于': 100, '生地': 100, '碎叶': 100, '约五': 100, '绵州': 100, '蜀中': 33, '西域': 100, '说生': 100, '迁居': 100, '附近': 100, '随家': 100, '马克': 100, 'about': 50, 'account': 33, 'another': 100, 'changlong': 100, 'family': 100, 'five': 50, 'in': 3, 'jiangyou': 100, 'kyrgyzstan': 100, 'mianzhou': 100, 'modern': 100, 'move': 100, 'near': 33, 'one': 25, 'places': 33, 'shu': 14, 'sichuan': 100, 'suyab': 100, 'to': 4, 'tokmok': 100, 'when': 33}, 'rendered': '出生地：一说生于西域碎叶城（今吉尔吉斯斯坦托克马克附近），约五岁随家迁居绵州昌隆（今四川江油）；一说生于蜀中', 'characters': 55, 'id': 'L6.1', 'en': "Birthplace: one account places his birth in Suyab, near modern Tokmok in Kyrgyzstan, and his family's move to Changlong in Mianzhou, near modern Jiangyou in Sichuan, when he was about five; another places his birth in Shu"},
              {'field': '身份', 'line': 7, 'part': 1, 'text': '诗人、曾供奉翰林、漫游四方的文人', 'terms': {'identity': 100, 'occupation': 100, '供奉': 50, '四方': 100, '奉翰': 50, '文人': 100, '方的': 100, '曾供': 100, '游四': 100, '漫游': 33, '的文': 100, '翰林': 16, '诗人': 25, '身份': 100, 'attendant': 50, 'former': 100, 'hanlin': 25, 'letters': 100, 'man': 100, 'of': 7, 'poet': 20, 'travelled': 16, 'widely': 50}, 'rendered': '身份：诗人、曾供奉翰林、漫游四方的文人', 'characters': 20, 'id': 'L7.1', 'en': 'Identity: poet, former Hanlin attendant, and widely travelled man of letters'},
              {'field': '简介', 'line': 8, 'part': 1, 'text': '唐代浪漫主义诗人。李白《答湖州迦叶司马问白是何人》自称“青莲居士谪仙人”；《对酒忆贺监》记贺知章当面称谪仙人；李阳冰《唐李翰林草堂集序》记天宝出入翰林；诗仙为后人誉称，首次出现时点未据此确定', 'terms': {'biography': 100, 'overview': 100, 'zhizhang': 33, '为后': 100, '主义': 100, '义诗': 100, '人誉': 100, '仙为': 100, '仙人': 25, '代浪': 100, '何人': 100, '入翰': 100, '出入': 100, '出现': 100, '叶司': 100, '司马': 100, '后人': 20, '唐代': 50, '唐李': 33, '四明': 33, '堂集': 33, '士谪': 100, '天宝': 100, '宝出': 100, '对酒': 50, '居士': 50, '州迦': 100, '当面': 100, '忆贺': 50, '据此': 100, '时点': 100, '明狂': 33, '是何': 100, '未据': 100, '李白': 4, '李翰': 33, '李阳': 20, '林草': 50, '次出': 100, '此确': 100, '浪漫': 100, '湖州': 100, '漫主': 100, '点未': 100, '狂客': 33, '现时': 100, '白是': 100, '知章': 33, '确定': 100, '称谪': 100, '章当': 100, '答湖': 100, '简介': 100, '翰林': 16, '自称': 100, '草堂': 33, '莲居': 50, '誉称': 100, '记天': 100, '记贺': 50, '诗人': 25, '诗仙': 33, '谪仙': 25, '贺监': 50, '贺知': 33, '迦叶': 100, '酒忆': 50, '问白': 100, '阳冰': 20, '集序': 33, '青莲': 50, '面称': 100, '首次': 100, '马问': 100, 'appeared': 100, 'asking': 100, 'bai': 5, 'banished': 33, 'calling': 100, 'calls': 100, 'caotang': 50, 'collection': 33, 'do': 100, 'during': 50, 'establish': 50, 'first': 50, 'hanlin': 25, 'him': 20, 'himself': 100, 'honorific': 100, 'huzhou': 100, 'immortal': 25, 'in': 3, 'is': 16, 'it': 20, 'jiaye': 100, 'jushi': 50, 'later': 16, 'li': 4, 'not': 25, 'of': 7, 'over': 25, 'person': 50, 'poet': 20, 'preface': 20, 'qinglian': 50, 'records': 33, 'remembering': 33, 'reply': 100, 'romantic': 100, 'service': 100, 'shixian': 33, 'sima': 100, 'sources': 100, 'supervisor': 50, 'tang': 14, 'these': 100, 'tianbao': 100, 'to': 4, 'when': 33, 'who': 100, 'wine': 20, 'yangbing': 20}, 'rendered': '简介：唐代浪漫主义诗人。李白《答湖州迦叶司马问白是何人》自称“青莲居士谪仙人”；《对酒忆贺监》记贺知章当面称谪仙人；李阳冰《唐李翰林草堂集序》记天宝出入翰林；诗仙为后人誉称，首次出现时点未据此确定', 'characters': 99, 'id': 'L8.1', 'en': "Overview: a Tang Romantic poet. In Reply to the Huzhou Sima Jiaye Asking Who Bai Is, Li Bai calls himself Qinglian Jushi and a banished immortal. Remembering He the Supervisor over Wine records He