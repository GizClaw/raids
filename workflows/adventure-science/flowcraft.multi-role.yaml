apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-adventure-science-multi-role
spec:
  driver: flowcraft
  toolkit:
    tool_ids: []
  flowcraft:
    graph:
      name: adventure-science
      entry: route-recall
      edges:
      - from: route-recall
        to: prepare-recall-query
        condition: needs_memory_recall == true
      - from: route-recall
        to: control-narration
      - from: prepare-recall-query
        to: recall-progress
      - from: recall-progress
        to: control-narration
      - from: narrate-story
        to: capture-progress
      - from: capture-progress
        to: observe-progress
      - from: observe-progress
        to: __end__
      - from: control-narration
        to: narrate-story
      nodes:
      - id: control-narration
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim().toLowerCase();
            const memory = String(board.getVar("scenario_memory") || "");
            let state = Object.assign({schema:"raid_scenario_state_v2", revision:0}, board.getVar("scenario_state") || {});
            for (const line of memory.split("\n")) {
              const start = line.indexOf('{"schema":');
              if (start < 0) continue;
              try { const old = JSON.parse(line.slice(start));
                if (old.schema === "raid_scenario_state_v2" && Number(old.revision || 0) > Number(state.revision || 0)) state = Object.assign({},state,old);
              } catch (_) {}
            }
            const roleTable = [{"key": "narrator", "name": "旁白", "aliases": ["旁白", "narrator"], "chapters": [1, 2, 3], "duty": "只负责叙述、管理和公开信息整理，不代演角色。"}, {"key": "experimenter", "name": "实验伙伴", "aliases": ["实验伙伴", "experimenter"], "chapters": [1, 2], "duty": "提出温水冷水的可检验猜想，不把猜想当结果。"}, {"key": "observer", "name": "观察记录员", "aliases": ["观察记录员", "observer"], "chapters": [2], "duty": "记录已经展示的溶解现象，比较观察与预测。"}, {"key": "safety-teacher", "name": "安全老师", "aliases": ["安全老师", "safety-teacher"], "chapters": [1, 3], "duty": "指出实验中需要成年人协助的边界，区分思想实验与证据。"}];
            const scenes = ["实验猜想", "观察比较", "安全复盘"];
            const any = (s, cues) => cues.some(c => s.includes(c));
            let scene = Number(state.voice_scene || 1);
            scene = Number.isFinite(scene) ? Math.max(1, Math.min(scenes.length, Math.floor(scene))) : 1;
            const history = typeof board.channel === "function" ? (board.channel(board.MAIN_CHANNEL) || []) : [];
            { // Delivered scene arrivals supersede recalled state.
              for (const m of history) {
                if (m.role !== "assistant") continue;
                const text = m.content || (m.parts || []).filter(p => p.type === "text").map(p => p.text || "").join("");
                for (let i=0;i<scenes.length;i++) if (text.includes("当前场景："+scenes[i]) || text.includes("来到"+scenes[i])) scene=i+1;
              }
            }
            let transition = false;
            if (!current || any(current, ["重新开始", "restart", "开场", "介绍这个体验", "开始体验"])) scene=1;
            else if (any(current,["进入下一章","进入下一场景"])) {scene=Math.min(scenes.length,scene+1); transition=true;}
            else {
              for (let i=0;i<scenes.length;i++) if (any(current,["进入"+scenes[i],"前往"+scenes[i],"来到"+scenes[i]])) {scene=i+1;transition=true;}

            }
            const phase = "explore";
            state.voice_scene=scene;
            state.active_roles=roleTable.filter(r=>r.chapters.includes(scene)).map(r=>r.key);
            let managementText=current;
            for (const role of roleTable) for (const alias of role.aliases) managementText=managementText.split(alias).join("");
            const management = !current || transition || any(managementText,["更正", "纠正", "修正", "改成", "改变主意", "其实", "安全", "危险", "现实", "模仿", "受伤", "攻击", "牺牲", "停止", "总结", "结论", "回忆", "重连", "恢复", "请记住", "只确认", "只说", "换边", "correction", "correct", "actually", "danger", "safety", "restart", "重新开始", "开场", "介绍这个体验", "进入下一", "下一章", "下一场景", "转场", "开始体验", "从头开始", "第一章", "第1章", "开始冒险", "start", "begin", "介绍体验", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物"]) || phase !== "explore";
            state.chapter_choice_made=!!current && !management;
            delete state.selected_speaker;
            state.revision=Math.max(0,Number(state.revision || 0))+1;
            board.setVar("scenario_state",state);
            board.setVar("scenario_state_text",JSON.stringify(state));
            board.setVar("story_bible", "原创配角按场景出场，不知未来/秘密/未验证结果。\n首次让在场角色自然登场。");
            board.setVar("narration_context", "当前场景："+scenes[scene-1]+"。当前在场角色："+roleTable.filter(r=>state.active_roles.includes(r.key)).map(r=>r.name).join("、")+"。"+(transition ? "本轮由旁白说出‘来到"+scenes[scene-1]+"’，用旁白和在场角色台词交替描写具体行动，结尾给两三个观察选项。" : "") );


            // Keep the fixed opening out of ordinary-turn requests.
            const openingPrompt = !current || any(current, ["重新开始", "restart", "开场", "介绍这个体验", "开始体验", "start", "begin", "介绍体验"]);
            board.setVar("english_opening_instruction", openingPrompt && /english|英文|英语/i.test(current) ? "英文开场用普通词数预算，以下原句逐字放末尾，不另问/重译：There are warm and cold cups of water. In which will sugar dissolve faster, and why?" : "");
            board.setVar("opening_instruction", openingPrompt ? "中文开场：首段/末问逐字完整保留在首尾，中间连续讲述，只问一次：欢迎来到小小实验室，我是你的实验助手，我们用猜想、动手和观察来找答案。你先说出你的猜想，我们再一起看看实验结果。实验台上有两杯水，一杯温一杯冷，你猜哪一杯里的糖会溶得更快，是温水还是冷水？" : "");

            board.setVar("story_bible", board.getVar("story_bible") + "\n" + ["场景1“实验猜想”：实验伙伴：提出温水冷水的可检验猜想，不把猜想当结果。；安全老师：指出实验中需要成年人协助的边界，区分思想实验与证据。","场景2“观察比较”：实验伙伴：提出温水冷水的可检验猜想，不把猜想当结果。；观察记录员：记录已经展示的溶解现象，比较观察与预测。","场景3“安全复盘”：安全老师：指出实验中需要成年人协助的边界，区分思想实验与证据。"].slice(scene - 1, Math.min(scene + 1, scenes.length)).join("\n"));
      - id: route-recall
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim();
            const normalized = current.toLowerCase();
            const containsAny = (values) => values.some((value) => normalized.includes(value));
            const storeCues = ["请记住", "记住：", "please remember", "remember this"];
            const durableReadCues = [
              "回忆", "还记得", "记得什么", "重连", "重新连接", "恢复",
              "继续上次", "接着上次", "上次", "之前", "代号",
              "recall", "do you remember", "what do you remember", "reconnect",
              "resume", "continue where", "last time", "previous",
            ];
            const correctionCues = [
              "更正", "纠正", "修正", "改成", "改变主意", "其实",
              "correction", "correct", "change my mind", "actually",
            ];
            const storeOverrideCues = durableReadCues
              .filter((value) => value !== "代号")
              .concat(correctionCues);
            const storeOnly = containsAny(storeCues) && !containsAny(storeOverrideCues);
            const needsRecall = current !== "" && !storeOnly
              && (containsAny(durableReadCues) || containsAny(correctionCues));
            board.setVar("scenario_memory", "");
            board.setVar("needs_memory_recall", needsRecall);
      - id: prepare-recall-query
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim();
            board.setVar("scenario_recall_query", current || "raid_scenario_state_v2");
      - id: recall-progress
        type: memory_recall
        config:
          query:
            text_from: scenario_recall_query
            lanes:
            - story_progress
            kinds:
            - state
            - note
            - event
          output: scenario_memory
          render:
            header: 'Confirmed scenario history:'
            item_prefix: "- "
            max_items: 12
          top_k: 12
      - id: capture-progress
        type: script
        config:
          source: |
            const state = Object.assign({}, board.getVar("scenario_state") || {});
            state.last_input = String(board.getVar("input") || "").slice(0,160);
            state.last_answer = String(board.getVar("answer") || "").slice(0,12000);
            const scenes = ["实验猜想", "观察比较", "安全复盘"];
            const roleTable = [{"key": "narrator", "name": "旁白", "aliases": ["旁白", "narrator"], "chapters": [1, 2, 3], "duty": "只负责叙述、管理和公开信息整理，不代演角色。"}, {"key": "experimenter", "name": "实验伙伴", "aliases": ["实验伙伴", "experimenter"], "chapters": [1, 2], "duty": "提出温水冷水的可检验猜想，不把猜想当结果。"}, {"key": "observer", "name": "观察记录员", "aliases": ["观察记录员", "observer"], "chapters": [2], "duty": "记录已经展示的溶解现象，比较观察与预测。"}, {"key": "safety-teacher", "name": "安全老师", "aliases": ["安全老师", "safety-teacher"], "chapters": [1, 3], "duty": "指出实验中需要成年人协助的边界，区分思想实验与证据。"}];
            for (let i = 0; i < scenes.length; i++) {
              if (state.last_answer.includes("来到" + scenes[i])) state.voice_scene = i + 1;
            }
            state.active_roles = roleTable.filter(r => r.chapters.includes(state.voice_scene || 1)).map(r => r.key);
            board.setVar("scenario_state_fact", JSON.stringify(state));
      - id: observe-progress
        type: memory_observe
        config:
          observations:
          - facts:
            - text_from: scenario_state_fact
              attributes:
                lane: story_progress
                kind: state
          wait_for_completion: false
      - id: narrate-story
        type: llm
        publish: true
        config:
          model: flowcraft-adventure-science-mr.model
          max_tokens: 2048
          output_key: answer
          system_prompt: |-
            你是儿童友好的互动冒险主持人。
            ${board.opening_instruction}
            ${board.english_opening_instruction}
            不得重置场景；孩子不知道或求提示时，先给小提示再复述选项。
            体验要求：Ask for a prediction, describe or run a safe observation, compare evidence with the prediction, and invite a revised explanation.
            安全边界：No fire, mains electricity, pressure vessels, chemicals, ingestion, unsupervised tools, or claims that a thought experiment proves a fact.
            区分事实、传说、虚构及不确定性。
            现实危险/模仿：说明危险，逐字说“不要模仿”和“找家长、老师或可信任成年人帮助”，不提问。
            可核对的长期进度：${board.scenario_memory}
            承接已确认进度，不推翻/重播。
            默认自然中文，明确要求英文时用英文。
            ${board.story_bible}
            ${board.narration_context}

            连续有声书规则：普通轮讲选择后果，目标达成同轮续邻章/场景及开场，无需许可。末尾【旁白】问一次，给2至3个具体安全行动/地点/解法。中文回复以恰好一个全角问号？结束；英文用?，禁双问号/尾文。禁“进入下一章”“要不要继续”“想继续听就说”“这一章的选择完成啦”等流程口令；主动转场可承接，特殊轮优先。末场不增章，选择角色后续行动。实际转场用旁白“来到场景名。”，不预告。特殊优先：否定/拒选/不推进（含 do not choose/advance）：禁执行/转场/标题/口令；按原短上限确认“选择尚未作出”，原选择收尾，优先于只确认不提问。仅用户明确要求只确认、回忆、更正或制止时，按短契约不提问；安全优先。总结/检查点中文120至900字符、英文60至450词；与事实说明均不添剧情，以故事选择结束。续讲恢复普通要求。篇幅执行规则：去角色标记后，中文Unicode计数含标点空白，目标500字、5段每段约100字；不要少于 200 字，不要超过 900 字。英文100至450词，目标约220个英文单词、5段各44词，无中文上限。约1至2分钟；依次行动、两种回应、结果、选择。勿重复/虚构凑数或输出分析计数。
            点名、否定点名、更正或改选后仍续讲不豁免普通篇幅（中文200至900字符）。
            有声书连续讲述：旁白叙述与角色第一人称台词分段，与2至4位在场角色交替；单角色不添人。只知亲历/公开信息。插话接续，点名仅增台词不换场/整轮。
            标记格式：每段选一个【旁白】、【实验伙伴】、【观察记录员】、【安全老师】后接正文，不输出其它【】标记或英文key；可再次发声，标题属旁白。
            音色由段落标记映射；仅朗读正文，禁Markdown/列表/emoji/舞台说明/系统字段/分析。
          track_steps: true
    max_iterations: 10
    conversation:
      starts: agent
    voice_adapter:
      asr_model: asr
      default_voice: flowcraft-adventure-science-mr.adventure-guide
      speaker_voices:
        旁白: flowcraft-adventure-science-mr.adventure-guide
        实验伙伴: flowcraft-adventure-science-mr.experimenter
        观察记录员: flowcraft-adventure-science-mr.observer
        安全老师: flowcraft-adventure-science-mr.safety-teacher
  memory: adventure
