# workflows/chat-assistant/test.yaml: RULES = "你是 `chat-assistant` 的专属验收 Workflow，不是被测助手。你负责通用语音助手的事实建立、更正覆盖、短答格式、重载后的事实保持与自然口语。\n玩家角色设定：使用通用语音助手管理真实行程的普通用户，会分多次补充和纠正信息，并严格要求短答、精确措辞与重连后的事实保持。\n负向控制：回复与当前玩家话语无关、复活已被更正的旧事实、重复同义内容或违反明确的格式与字数指令时，对应维度必须 fail。"
# workflows/chat-assistant/README.md: | 3 | `correct-destination-train` | 更正一下，不是杭州，是苏州；车次也改成G7105。新值覆盖旧值，只复述这两个新值。 | 必须含苏州、G7105；不得含杭州、G7331、周宁、青桥、两点、需要我、还需要、要不要；语义维度：correction-handling、response-completeness |
# workflows/chat-assistant/README.md: | 8 | `correct-day-time` | 日期也更正为下周四，会议时间从下午两点改到下午三点。 | 必须含下周四、三点；不得含下周三、两点、需要我、要不要、核对一遍；语义维度：correction-handling |
version: gizclaw.test/v1alpha1
name: quality.chat-assistant
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-chat-assistant long-form-correction-format-and-reload
  flowcraft_contracts_verdict:
    direction: output
    type: string
  flowcraft_contracts_reload_handoff:
    direction: output
    type: string
repeat: 1
timeout: 52m
steps:
- id: register_flowcraft
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_flowcraft_tester
  client: flowcraft_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_contracts_stop_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_contracts_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_candidate_workspace}"
      collection: assistants
      workflow_name: general-assistant
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_create_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_tester_workspace}"
      collection: raidtest-testers
      workflow_name: chat-assistant-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_select_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_candidate_workspace}"
- id: flowcraft_contracts_warmup_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_contracts_select_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_tester_workspace}"
- id: flowcraft_contracts_run_dialogue_before_reload
  timeout: 30m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${flowcraft_contracts_test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 18
    terminal_client: flowcraft
  capture:
    flowcraft_contracts_reload_handoff: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft
    "/completed_turns":
      equals: 18
    "/turns/flowcraft/count":
      equals: 9
    "/turns/flowcraft_tester/count":
      equals: 9
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
- id: flowcraft_contracts_reload_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_contracts_run_dialogue_after_reload
  timeout: 12m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${flowcraft_contracts_reload_handoff}"
    media: text
    idle_timeout: 90s
    max_turns: 7
    terminal_client: flowcraft_tester
  capture:
    flowcraft_contracts_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 7
    "/turns/flowcraft/count":
      equals: 3
    "/turns/flowcraft_tester/count":
      equals: 4
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/max":
      maximum: 200
- id: flowcraft_contracts_emit_verdict
  output:
    variable: flowcraft_contracts_verdict
finally:
- id: stop_flowcraft
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: stop_flowcraft_tester
  client: flowcraft_tester
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_contracts_delete_candidate_workspace
  client: flowcraft
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_contracts_candidate_workspace}"
- id: flowcraft_contracts_delete_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_contracts_tester_workspace}"
- id: delete_flowcraft
  client: flowcraft
  rpc:
    method: server.peer.delete
    request: {}
- id: delete_flowcraft_tester
  client: flowcraft_tester
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
