: ["乘", "乘号"], "profile": "求几个相同的数加起来是多少的简便算法，结果叫积。", "hints": ["它是一种运算", "它比连着相加更快", "它的符号像个斜十字"]}, {"zh": "线段", "en": "line segment", "aliases": [], "profile": "直线上两个端点之间的一段，有两个端点，可以量出长度。", "hints": ["它是一种几何图形", "它是直直的", "它有两个端点"]}, {"zh": "奇数", "en": "odd number", "aliases": ["单数"], "profile": "不能被2整除的整数，比如1、3、5、7、9。", "hints": ["它是一类数", "它不能平均分成两份", "它的个位可以是7"]}, {"zh": "等号", "en": "equals sign", "aliases": ["等于号"], "profile": "由两条一样长的平行短线组成的符号，表示两边的大小相等。", "hints": ["它是一个数学符号", "它由两条短线组成", "它说明两边一样多"]}, {"zh": "厘米", "en": "centimeter", "aliases": ["公分", "centimetre"], "profile": "常用的长度单位，1米等于100个它，大约是一个指甲盖的宽度。", "hints": ["它是一个单位", "它用来量长度", "它大约有指甲盖那么宽"]}, {"zh": "除法", "en": "division", "aliases": ["除", "除号"], "profile": "把一个数平均分成几份、求每份是多少的运算，结果叫商。", "hints": ["它是一种运算", "它和平均分有关", "它的符号上下各有一个点"]}, {"zh": "六边形", "en": "hexagon", "aliases": ["六角形"], "profile": "有六条边和六个角的平面图形，蜂巢的格子就是这个形状。", "hints": ["它是一种平面图形", "它的边比正方形多", "它像蜂巢的格子"]}, {"zh": "直角", "en": "right angle", "aliases": [], "profile": "正好是90度的角，像书本、桌子的角那样方方正正。", "hints": ["它是一种角", "它的大小是固定的", "它像书本的角"]}, {"zh": "乘法表", "en": "times table", "aliases": ["乘法口诀", "九九乘法表", "九九表", "multiplication table"], "profile": "把1到9两两相乘的结果排成表或编成口诀，方便背下来快速计算。", "hints": ["它和计算有关", "它常常需要背诵", "它可以编成顺口的口诀"]}, {"zh": "千克", "en": "kilogram", "aliases": ["公斤"], "profile": "常用的质量单位，等于1000克，一升水大约就这么重。", "hints": ["它是一个单位", "它和轻重有关", "它比克大得多"]}, {"zh": "余数", "en": "remainder", "aliases": [], "profile": "平均分东西分不完时剩下的部分，一定比除数小。", "hints": ["它和除法有关", "它是剩下来的部分", "它总比除数小"]}, {"zh": "日历", "en": "calendar", "aliases": ["月历", "挂历", "台历"], "profile": "按年、月、日排好日期的表，可以查今天是几月几日、星期几。", "hints": ["它和时间有关", "它能查日子", "它通常一年换一本"]}, {"zh": "小时", "en": "hour", "aliases": ["钟头"], "profile": "常用的时间单位，1个它等于60分钟，一天一夜有24个它。", "hints": ["它是一个单位", "它和时间有关", "它比分钟长"]}]}, {"title_zh": "图形小侦探", "title_en": "Shape Detective", "step": 7, "offset": 0, "items": [{"zh": "分数", "en": "fraction", "aliases": [], "profile": "把一个整体平均分成几份，表示其中一份或几份的数，比如三分之一。", "hints": ["它是一类数", "它和平均分有关", "它写的时候中间有条横线"]}, {"zh": "小数", "en": "decimal", "aliases": [], "profile": "像0.5、3.14这样中间带一个圆点的数，可以表示比1小的部分。", "hints": ["它是一类数", "它的中间有一个点", "它常出现在价格标签上"]}, {"zh": "周长", "en": "perimeter", "aliases": [], "profile": "围成一个图形一周的所有边的长度总和。", "hints": ["它和长度有关", "它要绕着图形走一圈", "它是各条边加起来"]}, {"zh": "面积", "en": "area", "aliases": [], "profile": "物体表面或平面图形的大小，用平方厘米、平方米来计量。", "hints": ["它和大小有关", "它说的是一个面有多大", "它的单位里有平方"]}, {"zh": "千米", "en": "kilometer", "aliases": ["公里", "kilometre"], "profile": "比较长的长度单位，等于1000米，常用来计量城市之间的距离。", "hints": ["它是一个单位", "它用来量很长的距离", "它等于很多个米"]}, {"zh": "平行四边形", "en": "parallelogram", "aliases": [], "profile": "两组对边分别平行的四边形，拉一拉会改变形状，容易变形。", "hints": ["它是一种平面图形", "它有四条边", "它像被推歪的长方形"]}, {"zh": "梯形", "en": "trapezoid", "aliases": ["trapezium"], "profile": "只有一组对边平行的四边形，像堤坝的横截面那样。", "hints": ["它是一种平面图形", "它有四条边", "它只有一组边平行"]}, {"zh": "平行线", "en": "parallel lines", "aliases": ["平行"], "profile": "在同一个平面上、永远不会相交的两条直线。", "hints": ["它和直线有关", "它总是成对出现", "它们永远不会碰到"]}, {"zh": "垂直", "en": "perpendicular", "aliases": ["互相垂直"], "profile": "两条直线相交成直角时的位置关系，就像十字路口那样。", "hints": ["它和直线有关", "它说的是一种位置关系", "它会形成直角"]}, {"zh": "锐角", "en": "acute angle", "aliases": [], "profile": "比直角小、大于0度的角，看起来尖尖的。", "hints": ["它是一种角", "它比直角小", "它看起来尖尖的"]}, {"zh": "量角器", "en": "protractor", "aliases": [], "profile": "量角的大小的工具，常见的是半圆形，上面刻有0到180度。", "hints": ["它是一种工具", "它上面有刻度", "它通常是半圆的形状"]}, {"zh": "算盘", "en": "abacus", "aliases": ["珠算盘"], "profile": "用拨动算珠来计算的传统工具，中国古代就广泛使用。", "hints": ["它是一种计算工具", "它不需要用电", "它上面有许多珠子"]}, {"zh": "轴对称", "en": "line symmetry", "aliases": ["对称", "轴对称图形", "reflection symmetry"], "profile": "一个图形沿一条直线对折后，两边能完全重合的特点。", "hints": ["它和图形有关", "它要沿直线对折", "它让两边一模一样"]}, {"zh": "条形统计图", "en": "bar chart", "aliases": ["条形图", "柱状图", "bar graph"], "profile": "用长短不同的直条表示数量多少的统计图。", "hints": ["它和统计有关", "它能比较数量多少", "它由一根根直条组成"]}, {"zh": "平均数", "en": "average", "aliases": ["平均值"], "profile": "把几个数加起来再除以个数得到的数，表示一组数据的一般水平。", "hints": ["它和统计有关", "它要先加再除", "它代表一组数的一般水平"]}, {"zh": "闰年", "en": "leap year", "aliases": [], "profile": "二月有29天、全年有366天的年份，一般每四年出现一次。", "hints": ["它和日历有关", "它比平常多一天", "它一般四年出现一次"]}]}, {"title_zh": "数字探险家", "title_en": "Number Explorer", "step": 7, "offset": 0, "items": [{"zh": "质数", "en": "prime number", "aliases": ["素数"], "profile": "大于1、只能被1和它本身整除的整数，比如2、3、5、7。", "hints": ["它是一类数", "它和因数有关", "它只能被1和自己整除"]}, {"zh": "合数", "en": "composite number", "aliases": [], "profile": "除了1和它本身以外，还有别的因数的整数，比如4、6、8、9。", "hints": ["它是一类数", "它和因数有关", "它的因数至少有三个"]}, {"zh": "因数", "en": "factor", "aliases": ["约数"], "profile": "能整除一个整数的数，比如1、2、3、6都能整除6。", "hints": ["它和整除有关", "它说的是两个数的关系", "它和倍数是一对"]}, {"zh": "倍数", "en": "multiple", "aliases": [], "profile": "一个数乘整数得到的数，比如3、6、9、12都是3的这种数。", "hints": ["它和整除有关", "它有无穷多个", "它和因数是一对"]}, {"zh": "百分数", "en": "percentage", "aliases": ["百分比", "百分率"], "profile": "表示一个数是另一个数的百分之几的数，用%号表示。", "hints": ["它是一类数", "它有专门的符号", "它常出现在电量显示上"]}, {"zh": "比例", "en": "proportion", "aliases": [], "profile": "表示两个比相等的式子，比如2比3等于4比6。", "hints": ["它和比有关", "它里面有四个数", "它常用于放大和缩小"]}, {"zh": "半径", "en": "radius", "aliases": [], "profile": "连接圆心和圆上任意一点的线段，同一个圆里它都一样长。", "hints": ["它和圆有关", "它是一条线段", "它从圆心出发"]}, {"zh": "直径", "en": "diameter", "aliases": [], "profile": "穿过圆心、两端都在圆上的线段，是圆里最长的线段。", "hints": ["它和圆有关", "它是一条线段", "它穿过圆的中心"]}, {"zh": "体积", "en": "volume", "aliases": [], "profile": "物体所占空间的大小，用立方厘米、立方米等单位来计量。", "hints": ["它和大小有关", "它说的是占多大空间", "它的单位里有立方"]}, {"zh": "圆锥", "en": "cone", "aliases": ["圆锥体"], "profile": "底面是一个圆、侧面是曲面、顶上有一个尖的立体图形。", "hints": ["它是一种立体图形", "它有一个尖顶", "它像冰淇淋蛋筒"]}, {"zh": "方程", "en": "equation", "aliases": [], "profile": "含有未知数的等式，比如x加3等于5。", "hints": ["它是一种式子", "它里面有等号", "它藏着一个未知数"]}, {"zh": "扇形统计图", "en": "pie chart", "aliases": ["扇形图", "饼图", "饼状图"], "profile": "用整个圆表示总数、用扇形大小表示各部分占多少的统计图。", "hints": ["它和统计有关", "它能看出各部分占多少", "它的样子像切开的比萨"]}, {"zh": "罗马数字", "en": "Roman numerals", "aliases": [], "profile": "古罗马人用字母表示数的方法，比如I表示1、V表示5、X表示10。", "hints": ["它是一种写数的方法", "它