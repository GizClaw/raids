# User Story:
# As a Raids catalog maintainer,
# I want every available murder-mystery implementation to complete the same bounded Tester relay,
# So that the 26-response `default-murder-mystery` route, its deterministic contracts, and the final verdict stay declarative.
version: gizclaw.test/v1alpha1
name: murder-mystery.soak.eino.multi-role
clients:
  eino_multi_role:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_multi_role_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  test_brief:
    direction: input
    type: string
    value: 'BEGIN flowcraft-murder-mystery-multi-role long-form-investigation-correction-conclusion孩子自然参与多角色有声故事，内容由Tester宽松评审：有意思、生动、丰富、连贯、回应孩子。

'
  eino_multi_role_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_multi_role_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_multi_role_verdict:
    direction: output
    type: string
  eino_multi_role_reload_handoff:
    direction: output
    type: string
repeat: 1
timeout: 99m
steps:
- id: eino_multi_role_register_candidate
  client: eino_multi_role
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_multi_role_register_tester
  client: eino_multi_role_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_multi_role_create_candidate_workspace
  client: eino_multi_role
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_multi_role_candidate_workspace}"
      workflow_name: eino-murder-mystery-multi-role
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_multi_role_create_tester_workspace
  client: eino_multi_role_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_multi_role_tester_workspace}"
      workflow_name: murder-mystery-test-multi-role
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_multi_role_select_candidate_workspace
  client: eino_multi_role
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_multi_role_candidate_workspace}"
- id: eino_multi_role_warmup_candidate_workspace
  client: eino_multi_role
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_multi_role_select_tester_workspace
  client: eino_multi_role_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_multi_role_tester_workspace}"
- id: eino_multi_role_run_dialogue_before_reload
  timeout: 64m
  workspace_relay:
    first_client: eino_multi_role_tester
    second_client: eino_multi_role
    input: "${test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 38
    terminal_client: eino_multi_role
  capture:
    eino_multi_role_reload_handoff: "/terminal/text"
  expect:
    "/terminal/client":
      equals: eino_multi_role
    "/terminal/text":
      not_contains:
      - "【"
      - "】"
    "/completed_turns":
      equals: 38
    "/turns/eino_multi_role/count":
      equals: 19
    "/turns/eino_multi_role_tester/count":
      equals: 19
- id: eino_multi_role_recall_barrier_1
  client: eino_multi_role
  rpc:
    method: server.run.workspace.recall
    request:
      query: 39码
  timeout: 60s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: eino_multi_role_reload_candidate_workspace
  client: eino_multi_role
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: eino_multi_role_run_dialogue_after_reload
  timeout: 25m
  workspace_relay:
    first_client: eino_multi_role_tester
    second_client: eino_multi_role
    input: "${eino_multi_role_reload_handoff}"
    media: text
    idle_timeout: 90s
    max_turns: 15
    terminal_client: eino_multi_role_tester
  capture:
    eino_multi_role_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: eino_multi_role_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 15
    "/turns/eino_multi_role/count":
      equals: 7
    "/turns/eino_multi_role_tester/count":
      equals: 8
- id: eino_multi_role_emit_verdict
  output:
    variable: eino_multi_role_verdict
finally:
# Ephemeral peer deletion retires its owned Workspaces, including partial setup.
- id: eino_multi_role_stop_candidate_run
  client: eino_multi_role
  rpc:
    method: server.run.stop
    request: {}
- id: eino_multi_role_stop_tester_run
  client: eino_multi_role_tester
  rpc:
    method: server.run.stop
    request: {}
- id: eino_multi_role_delete_candidate_peer
  client: eino_multi_role
  rpc:
    method: server.peer.delete
    request: {}
- id: eino_multi_role_delete_tester_peer
  client: eino_multi_role_tester
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
