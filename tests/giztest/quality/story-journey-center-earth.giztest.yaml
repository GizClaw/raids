      - 地下水路
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
- id: flowcraft_transitions_enter_next_chapter_with_story
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 进入下一章。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
