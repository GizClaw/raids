- id: quality_round_1
  timeout: 2m
  parallel:
  - id: flowcraft_transitions_opening_with_guidance
    client: flowcraft__transitions
    peer_stream:
      mode: text
      input: 请从第一章开始《尼尔斯骑鹅旅行记》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_transitions_opening_with_guidance
    client: eino__transitions
    peer_stream:
      mode: text
      input: 请从第一章开始《尼尔斯骑鹅旅行记》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: flowcraft_roles_narrator_chapter_setup_1
    client: flowcraft__roles
    peer_stream:
      mode: text
      input: 请从第一章开始《尼尔斯骑鹅旅行记》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_roles_narrator_chapter_setup_1
    client: eino__roles
    peer_stream:
      mode: text
      input: 请从第一章开始《尼尔斯骑鹅旅行记》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: flowcraft_routing_opening
    client: flowcraft__routing
    peer_stream:
      mode: text
      input: 请从第一章开始《尼尔斯骑鹅旅行记》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_routing_opening
    client: eino__routing
    peer_stream:
      mode: text
      input: 请从第一章开始《尼尔斯骑鹅旅行记》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  expect:
    "/flowcraft_transitions_opening_with_guidance/text":
      contains_all:
      - 第 1 章
      - 湿地风向
      - 尼尔斯
      - 阿卡
      - 进入下一章
    "/flowcraft_transitions_opening_with_guidance/text_eos":
      equals: true
    "/flowcraft_transitions_opening_with_guidance/audio_eos":
      equals: true
    "/flowcraft_transitions_opening_with_guidance/audio_bytes":
      minimum: 1
    "/flowcraft_transitions_opening_with_guidance/first_text_ms":
      maximum: 6000
    "/eino_transitions_opening_with_guidance/text":
      contains_all:
      - 第 1 章
      - 湿地风向
      - 尼尔斯
      - 阿卡
      - 进入下一章
    "/eino_transitions_opening_with_guidance/text_eos":
      equals: true
    "/eino_transitions_opening_with_guidance/audio_eos":
      equals: true
    "/eino_transitions_opening_with_guidance/audio_bytes":
      minimum: 1
    "/eino_transitions_opening_with_guidance/first_text_ms":
      maximum: 6000
    "/flowcraft_roles_narrator_chapter_setup_1/text":
      contains: 第 1 章：湿地风向
    "/flowcraft_roles_narrator_chapter_setup_1/text_eos":
      equals: true
    "/flowcraft_roles_narrator_chapter_setup_1/audio_eos":
      equals: true
    "/flowcraft_roles_narrator_chapter_setup_1/audio_bytes":
      minimum: 1
    "/flowcraft_roles_narrator_chapter_setup_1/first_text_ms":
      maximum: 6000
    "/flowcraft_roles_narrator_chapter_setup_1/first_audio_ms":
      maximum: 90000
    "/eino_roles_narrator_chapter_setup_1/text":
      contains: 第 1 章：湿地风向
    "/eino_roles_narrator_chapter_setup_1/text_eos":
      equals: true
    "/eino_roles_narrator_chapter_setup_1/audio_eos":
      equals: true
    "/eino_roles_narrator_chapter_setup_1/audio_bytes":
      minimum: 1
    "/eino_roles_narrator_chapter_setup_1/first_text_ms":
      maximum: 6000
    "/eino_roles_narrator_chapter_setup_1/first_audio_ms":
      maximum: 90000
    "/flowcraft_routing_opening/text":
      contains_all:
      - 第 1 章
      - 湿地风向
      - 尼尔斯
      - 阿卡
      - 进入下一章
    "/flowcraft_routing_opening/text_eos":
