      - 责任试炼
      not_contains:
      - 第 1 章
      pattern: 第 2 章[：:]\s*责任试炼[\s\S]{20,}[。！？]
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
- id: flowcraft_transitions_continue_current_chapter
  client: flowcraft
