  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: housekeeper_opening_setup
  client: housekeeper
  timeout: 2m
  peer_stream:
    mode: text
    input: 请开始主持《雨夜留声机》，只给出初始案情和自由调查邀请。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      equals: 22:00，沈鹤年被发现死在沈家大宅二楼书房。此时正值雨夜。你可以自由调查任何感兴趣的地点、物品或相关人物：可以问话的人有管家、厨师、死者的次子沈知秋和律师，可以查看的地方有二楼书房、阳台、厨房和后门、花园、沈知秋的房间、壁炉和后廊。想去哪里、想问谁，直接告诉我就行。
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_housekeeper
  client: housekeeper
  timeout: 2m
  peer_stream:
    mode: text
    input: 我找管家问问：停电时你在哪里？钥匙在谁手里？有没有听到什么声响？
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 管家说
      - 管家：
      - 伪造密室
      - 经后廊返回
      - 私密真相
      - 留声机循环误导
      contains_all:
      - 我
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_housekeeper_first_response
  client: housekeeper
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让管家再简短说说自己的固定说法。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
