# User Story:
# As a Raids catalog maintainer,
# I want equal opening, role and realtime responsiveness gates for every implementation,
# So that text and audio respond promptly without overlap or playback stalls.
version: gizclaw.test/v1alpha1
name: journey-guide.smoke
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_history:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_memory_async:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_memory_recall:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_text_workspace:
    direction: input
    type: string
    generate: token
  eino_history_text_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_async_text_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_recall_text_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_realtime_workspace:
    direction: input
    type: string
    generate: token
  eino_history_realtime_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_async_realtime_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_recall_realtime_workspace:
    direction: input
    type: string
    generate: token
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
repeat: 1
timeout: 12m
steps:
- id: flowcraft_register
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_history_register
  client: eino_history
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_memory_async_register
  client: eino_memory_async
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_memory_recall_register
  client: eino_memory_recall
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_create_text
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_text_workspace}"
      collection: story-teller
      workflow_name: journey
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_select_text
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_text_workspace}"
- id: flowcraft_warmup_text
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_history_create_text
  client: eino_history
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_history_text_workspace}"
      collection: story-teller
      workflow_name: journey-eino-history
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_history_select_text
  client: eino_history
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_history_text_workspace}"
- id: eino_history_warmup_text
  client: eino_history
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_memory_async_create_text
  client: eino_memory_async
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_memory_async_text_workspace}"
      collection: story-teller
      workflow_name: journey-eino-memory-async
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_memory_async_select_text
  client: eino_memory_async
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_memory_async_text_workspace}"
- id: eino_memory_async_warmup_text
  client: eino_memory_async
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_memory_recall_create_text
  client: eino_memory_recall
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_memory_recall_text_workspace}"
      collection: story-teller
      workflow_name: journey-eino-memory-recall
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_memory_recall_select_text
