簂粿綶耠耯聒聝腂腘膕臛艧获菓萿蒦蔮藿虢蜮蜾蝈蝸蟈蠃蠖裹褁諕謋豁豰貨货越趏輠过過邩郭鈛鈥錁鍃鍋鐹鑊钬锅锪镬閄隻霍靃餜馃馘騞", "浑": "俒倱圂堚婚婫忶惛惽慁捆掍揮昆昏昬梡梱棍棔殙涽混渾湣湷溷焄焝煇珲琿眃睧睯碈緄緡繉荤葷觨諢诨轋閽阍顐餛餫馄魂鼲", "浮": "不乀乶仅付伏伕佛俌俘俛俯偩偪傅冨冹凫刜副包匐呋咈咐哹哺嘸坿垘垺報复夫妇妋姇娐婏婦媍嬎嬔孚孵宓富尃岪峊巿市帗幅幞府弗弣彳彿復怀怤怫懯扶抚拂拊捊捬掊撨撫敷斧旉服枎枹柎柫柭栿桴棴椨椱榑氟汱沕沸泭洑涪溥滏澓炥烰焤父玞玸琈璷甫甶畉畐畗痡癁盙砆砩祓祔福禣秿稃稪竎符笰筟箁箙簠粰糐紨紱紼絥綍綒緮縛纀绂绋缚罘罦翇肤胕脯腐腑腹膚艀艴芙芣芾苻茀茯荂荴莆莩菔萉萯葍蓲蕧虙蚥蚨蚹蛗蜅蜉蝜蝠蝮衭袚袝袱複褔襆襥覄覆訃詂諨讣豧負費賦賻负赋赙赴趺跗踾軵輔輹輻辅辐还邚邞郍郙郛鄜酜酻釜釡鈇鉘鉜錇鍑鍢阜阝附陚鞴韍韛韨頫颫颰馥駙驸髴鬴鮄鮒鮲鰒鲋鳆鳧鳬鳺鴔鵩鶝麩麬麱麸黻黼", "海": "亥侅咍咳咴嗐嗨嚡塰妎孩害拸氦浬烸猲絯胲还還郂酼醢閡頦餀饚駭駴骇骸", "消": "佼侾俏俲傚削効叟号呺呼咲咻哓哨哮唬啋啸嗃嘋嘐嘨嘮嘯嘵嚣嚻囂奡姣婋孝宯宵小崤庨彇恔恷憢捎揱搜撓撨效敩斅斆晓暁曉枭枵校梟梢橚櫹歊歒歗殽毊洨涍淆滧漻潇潚澩瀟灱灲烋焇熇熽燆爻狡猇獟獢痚痟皛皢睄硝硣穘窙笑筊筱筿箫箾篠簘簫絞綃縿绡翛肖胶脩膮芍茭莦萧萷蕭薂藃虈虓蛸蟂蟏蟰蠨訤詨誟誵謏謞謼譊踃較轇逍郩銷销霄颵騷驍驕骁骹髇髐魈鴞鴵鵁鷍鷕鸮", "涡": "仴倭偓划卧呙咶咼唩唬啯喔嗌嘓噁嚄囗囯囶囻国圀國埚埻堝墎夭婐婑媉媪崞帼幄幗彉彍惈慖我挝捰捼捾掴握摑撾擭斡杌枂果椁楃楇槨櫎沃活涴涹淉渥渦漍濄濣焥猓猧瓁瘑瘟瞃矆矌硪窝窩簂粿綶聒聝肟腂腘腛膕臒臥艧莴菓萵蒦蔮薶虢蜗蜮蜾蝈蝸蟈蠃裹褁踒踠輠过過郭鈛錁鍋鐹锅雘餜馃馘馧齷龌龏", "液": "世丗业也乨乭亊事亪亱什仕似佦使侍倻偞僷兘冟冶势勢匙十卋厔叓史叶吔呞呩咶咽唑啇啘喝嗜嘘嘢噎噬嚈埘埜埶堤堨塒墅墷壄士夜失奭始姼媞嬕实実室宩宲寔實寺射尸屍屎峕峙峫崼嵵嶪嶫市师師式弑弒彖徥忕忯恀恃惿懕戺抴拭拽拾挈捓捙掖提揓揞揲揶擖擛擨擪擫斜斯施时旹是昰時晔暍曄曅曗曳曵枒枼枽枾柹柿栻椰楪業楴榁榯檡歋殕殖殗殺氏汁沶洂洇浉涂湜湤湿溡溮溼漜潱澤澨澲濕灑炻烒烨焆煠煶熀燁爗爷爺狧狮狶獅瑡璍瓛畤痑痷皣眂眎眡睗瞱瞸矢石礏示礻祏秲窫竍笶筮箷篒篩簭籂絁緤繹耆耶聶肢腋舍舐舓荼莳葉葹蒒蒔蓍虱虵蚀蝕蝨螫蠮蠱褆褷襫襹視视觢訑試詩誓諟諡謁謚識识试诗谒谥豉豕貰贳赫跩踶軾轼辻适逝遈遞適遰遾邪邺邿郝鄓鄴酾醳釃釈释釋野釶釾鈰鉂鉃鉇鉈鉐鉽銴鋣鍉鍦鍱鎁鎑鎩鐷铈铘靥靨頁页食飠飭飾餘餙餝餣饁饐饣饰馌馶駛驜驶魳鮖鯴鰘鰣鰤鲥鲺鳲鳾鵺鶳鸈鸤黦鼫鼭齛", "混": "丨俒倱卵卷困圂坤堃堒堚壸壼婚婫尡崐崑忶悃惃惛惽慁捆掍揮昆昏昬晜梡梱棍棔殙浑涃涽渾湣湷溷滚滾潉焄焜焝煇熴猑珲琨琯琿瑻璭眃睏睔睧睯睴硱碈磙祵稇稛綑緄緡緷繉绲罤荤菎葷蓘蔉蜫衮袞裈裍裩裷褌觨諢謴诨豤貇輥轋辊醌錕锟閫閸閽阃阍頑顐餛餫馄騉髠髡髨魂鮌鯀鯤鰥鲧鲲鵾鶤鹍鼲齦", "温": "云伝傊允免刎勻匀匁吻呅员呚呡員問喗囩均塭夽奫妏妘娩媪孕宛尉尹彣忞忟怨恽惲愠愪慍抆抎抣揾搵文昀昧昷晕暈枟桽榅榲橒歾殁殒殞殟氲氳汶沄涒涢渂溫溳澐炆煇煴煾熅熉熨狁玟玧珳瑥璺畇瘒瘟盾眃眼磒秐稳穏穩笏筍筠筼篔紊紋紜絻緷緼縕縜繧纭纹缊耘耺聞肳脕脗腪芠芸苑荺莬菀蒀蒕蒷蕓蕰蕴薀藴蘊蚉蚊蜵蝹螡蟁褞豱賱贇赟輼轀辒运運郓郧鄆鄖酝醖醞鈗鋆鎾閺閿闅闦问闻阌阭限陨隕雯雲霣鞰韗韞韫韵韻頵顐餫饂馧馻馼駇魰鰛鰮鳁鳼鴍鴖鼤齫齳", "滑": "估侉傦僱凅划劃劐化华古叱吪告呱呴咕咶哇哌哗唂唃啒嗗嘏嘩固埖堌夃夻姑姡婲婳嫴嫿嬅孤學家尳崋崓崮怘愲扢找搳摦撶故敌杹枠枯柧桦梏棝椛榖榾槬樺橭檴櫎毂汩沽泒淈澅澮濲瀔焸牯牿猾獪瓠画畫畵痼皋皷皼盬瞽砉硴磆祻稒稞穀竵笟箍箛篐粿糀糓縎繣罛罟罫羖股胍脵腂臌舙花芲苦苽菇華菰蒊蒍蓇蕐薣蘤蛄蛊蛌螖蠱角觚觟詁話誮諙諣譁譮诂话谷豁賈贾軱軲輠轂轱辜逧酤釪釫鈲鈷鋘錮錵鏵钴铧锢雇離顧顾餶馉驊骅骨骰魤鮕鮭鯝鲴鴣鵠鶻鷨鸪鹄鹘黊鼓鼔", "漂": "俵僄儦剽勡嘌墂婊嫖幖彪彯徱慓摽旚朴杓标標檦殍淲滮潎瀌灬熛爂犥猋瓢瘭皫瞟磦票穮篻縹缥翲脿膔膘臕苞莩蔈薸藨螵表裱褾諘謤贆醥錶鏖鏢鑣镖镳闝顠颩颮颷飃飄飆飇飈飊飑飘飙飚驃驫骉骠髟魒鰾鳔麃", "火": "伙佸俰剨劐化吙呵和咟嚄嚯嚿壑夥奯姡惑或扮捇掝搉擭攉旤曤楇檴沎活湱漷濊濩瀖灬焃獲瓠癨眓矆矐砉礊祸禍秮秳穫篧耠耯膕臛艧获萿蒦藿蠖諕謋豁豰貨货越趏過邩鈥鍃鑊钬锪镬閄隻霍靃騞", "灭": "乜吀咩咪哶孭幭懱搣櫗滅瀎烕眜篾羋蔑薎蠛衊覕鑖鱴鴓", "灯": "丁仃僜凳叮啶噔墱奠奵嬁定嵿嶝帄忊憕戥掟朩椗橙櫈汀澄濎燈玎璒町疔登盯瞪矴碇碠磴磸竳等簦耵聢腚艠艼萣葶薡虰蝊覴訂订豋蹬邓鄧酊釘鋌錠鐙鐤钉铤锭镫隥靪頂顁顶飣饤鼎鼑", "灰": "会佪僡儶匯卉叀咴哕喙嘒噅噕噦嚖囘回囬圚堕墮壞婎媈嬒孈寭