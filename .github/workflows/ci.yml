name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download GizClaw v0.7.17
        env:
          GIZCLAW_ASSET: gizclaw_0.7.17_amd64.deb
          GIZCLAW_SHA256: 56e11253b30405f8c1da75219b64799799b6e652282c2421040ca36d3c633a51
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/$GIZCLAW_ASSET"
          root="$RUNNER_TEMP/gizclaw-v0.7.17"
          curl --fail --location --retry 3 \
            --output "$package" \
            "https://github.com/GizClaw/gizclaw/releases/download/v0.7.17/$GIZCLAW_ASSET"
          printf '%s  %s\n' "$GIZCLAW_SHA256" "$package" | sha256sum --check --status
          dpkg-deb --extract "$package" "$root"
          printf 'GIZCLAW=%s\n' "$root/usr/bin/gizclaw" >> "$GITHUB_ENV"

      - name: Validate Resources and Giztest documents
        run: make test-unit-resources

      - name: Check catalog Voice invariants
        run: make test-unit-voices
