        outputs: {messages: host-messages}
        format: f_string
        messages:
        - role: system
          template: |-
            {safety_fence}

            {rules}

            【谜底卡】
            简介：唐代大诗人，被称为“（已隐藏）”，写过《静夜思》《望庐山瀑布》。
            性别：男
