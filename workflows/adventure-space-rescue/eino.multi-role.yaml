apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-adventure-space-rescue-multi-role
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: adventure
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-adventure-space-rescue-mr.adventure-guide
      speaker_voices:
        旁白: eino-adventure-space-rescue-mr.adventure-guide
        救援队长: eino-adventure-space-rescue-mr.captain
        工程师: eino-adventure-space-rescue-mr.engineer
        领航员: eino-adventure-space-rescue-mr.navigator
        医护员: eino-adventure-space-rescue-mr.medic
    graph:
      name: adventure-space-rescue-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 20
      state:
        fields:
        - name: memory-query
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: stage-route
          type: string
          merge: replace
        - name: phase-key
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: scenario-policy
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: progress-fact
          type: string
          merge: replace
        - name: progress-lane
          type: string
          merge: replace
        - name: progress-kind
          type: string
          merge: replace
        - name: narration-context
          type: string
          merge: replace
        - name: voice-scene
          type: string
          merge: replace
        - name: voice-revision
          type: string
          merge: replace
      nodes:
      - id: control-narration
        type: script
        inputs:
          text:
            from: input.text
          history:
            from: input.messages
          memory:
            from: recalled
          stage_route:
            from: stage-route
        outputs:
          direction: narration-context
          scene: voice-scene
          revision: voice-revision
        language: starlark
        entrypoint: run
        source: |
          def any_cue(text, cues):
              return any([cue in text for cue in cues])

          def clause(text):
              for sep in ["，", "。", "；", "！", "？", ",", ";", "!", "?"]:
                  text = text.replace(sep, "|")
              for sep in ["但是", "而是", "再让", "改请", "改让", "but "]:
                  text = text.replace(sep, "|")
              return text

          def run(input):
              current = input["text"].strip().lower()
              memory = input.get("memory", "")
              scenes = ["恢复通信", "校准能源", "准备安全会合", "执行与收束"]
              roles = [{"key": "narrator", "name": "旁白", "aliases": ["旁白", "narrator"], "chapters": [1, 2, 3, 4], "duty": "只负责叙述、管理和公开信息整理，不代演角色。"}, {"key": "captain", "name": "救援队长", "aliases": ["救援队长", "captain"], "chapters": [1, 2, 3], "duty": "比较安全方案并让玩家决定，不自行执行救援。"}, {"key": "engineer", "name": "工程师", "aliases": ["工程师", "engineer"], "chapters": [2, 3], "duty": "解释已确认的能源与备用电池约束，不编造消耗数字。"}, {"key": "navigator", "name": "领航员", "aliases": ["领航员", "navigator"], "chapters": [3], "duty": "比较安全窗口和会合条件，不擅自宣布已经对接。"}, {"key": "medic", "name": "医护员", "aliases": ["医护员", "medic"], "chapters": [3], "duty": "核对已公开人员状态与生命保障，不把牺牲当英雄选择。"}]
              scene = 1
              revision = -1
              # Read only graph-authored state fields; legacy active_roles is never authoritative.
              for line in memory.split("\n"):
                  compact = line.replace(" ", "")
                  if '"schema":"raid_scenario_state_v2"' not in compact:
                      continue
                  rev = 0
                  if '"revision":' in compact:
                      value = compact.split('"revision":')[1].split(",")[0].split("}")[0]
                      if value.isdigit():
                          rev = int(value)
                  if rev >= revision and '"voice_scene":' not in compact:
                      for i in range(len(scenes)):
                          if scenes[i] in compact:
                              scene = i+1
                  if rev >= revision and '"voice_scene":' in compact:
                      value = compact.split('"voice_scene":')[1].split(",")[0].split("}")[0]
                      if value.isdigit():
                          scene = max(1, min(len(scenes), int(value)))
                          revision = rev
              for message in input.get("history", []):
                  if message.get("role", "") != "assistant":
                      continue
                  text = message.get("content", "")
                  for i in range(len(scenes)):
                      if "当前场景："+scenes[i] in text or "来到"+scenes[i] in text:
                          scene = i+1
              transition = False
              if not current or current.lower().rstrip("。！!") in ["开始", "开始吧", "从头开始", "重新开始", "start", "start over", "restart"] or any_cue(current, ["重新开始", "restart", "开场", "介绍这个体验", "开始体验"]):
                  scene = 1
              elif any_cue(current, ["进入下一章", "进入下一场景"]):
                  scene = min(len(scenes), scene+1)
                  transition = True
              else:
                  for i in range(len(scenes)):
                      if any_cue(current, ["进入"+scenes[i], "前往"+scenes[i], "来到"+scenes[i]]):
                          scene = i+1
                          transition = True
                  if any_cue(current, ["检查能源", "校准能源"]):
                      scene = 2
                      transition = True
                  if any_cue(current, ["等待安全窗口", "准备会合"]):
                      scene = 3
                      transition = True
              if not current or current.lower().rstrip("。！!") in ["开始", "开始吧", "从头开始", "重新开始", "start", "start over", "restart"] or any_cue(current, ['开始太空', '开始救援', '宇宙救援', '空间站']):
                  phase = "opening"
              elif any_cue(current, ['更正', '只确认', '有效坐标', '正确坐标', '有效能量', '只说有效', '回忆', '重连', '隔了几轮', '只说']):
                  phase = "correction"
              elif any_cue(current, ['总结', '救援状态', '任务状态', '回顾', '用一句话说出']):
                  phase = "conclusion"
              elif any_cue(current, ['牺牲', '攻击', '直接炸', '危险', '拒绝', '窗口', '角色分工']):
                  phase = "challenge"
              else:
                  phase = "explore"
              stage_route = input.get("stage_route", "")
              for i in range(len(scenes)):
                  if scenes[i] in stage_route:
                      scene = i+1
              active_roles = [r["key"] for r in roles if scene in r["chapters"]]
              management_text = current
              for role in roles:
                  for alias in role["aliases"]:
                      management_text = management_text.replace(alias, "")
              management = not current or transition or any_cue(management_text, ["旅程", "更正", "纠正", "修正", "改成", "改变主意", "其实", "安全", "危险", "现实", "模仿", "受伤", "攻击", "牺牲", "停止", "总结", "结论", "回忆", "重连", "恢复", "请记住", "只确认", "只说", "换边", "correction", "correct", "actually", "danger", "safety", "restart", "重新开始", "开场", "介绍这个体验", "进入下一", "下一章", "下一场景", "转场", "开始体验", "从头开始", "第一章", "第1章", "开始冒险", "start", "begin", "介绍体验", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物"]) or phase != "explore"
              direction = "原创配角按场景出场，不知未来/秘密/未验证结果。\n首次让在场角色自然登场。" + "\n当前场景："+scenes[scene-1]+"。当前在场角色："+"、".join([r["name"] for r in roles if r["key"] in active_roles])+"。"
              if transition:
                  direction += "本轮由旁白说出‘来到"+scenes[scene-1]+"’，用旁白和在场角色台词交替描写具体行动，结尾给两三个观察选项。"
              direction += "紧邻下一场景：" + (scenes[scene] if scene < len(scenes) else "终局") + "。当前及自然转场后的职责：" + "；".join([r["name"] + "：" + r["duty"] for r in roles if (scene in r["chapters"] or scene+1 in r["chapters"]) and r["key"] != "narrator"])
              # Content obligations follow voice style so role brevity cannot suppress them.
              safety_request = any([cue in current for cue in ["现实", "模仿", "照做", "安全", "危险", "受伤", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物", "danger", "safety", "imitate"]])
              turn_contract = ""
              if safety_request:
                  turn_contract = "本轮是安全请求，优先于角色风格和章节推进：制止危险模仿，给安全替代，并请孩子找家长、老师或可信任成年人帮助，简短回应。"
              direction += "\n本轮参考：" + turn_contract
              return {"direction": direction, "scene": str(scene), "revision": str(max(revision, len(input.get("history", [])))+1)}
        limits:
          max_execution_steps: 100000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"]
              base = "宇宙救援当前阶段、系统状态、能源读数和安全窗口"
              return {"query": base + ("；当前请求：" + text if text else "")}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-progress
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 12
      - id: route-stage
        type: script
        inputs:
          text:
            from: input.text
          history:
            from: input.messages
          memory:
            from: recalled
        outputs:
          phase: phase-key
          route: stage-route
          policy: scenario-policy
        language: starlark
        entrypoint: run
        source: |
          def contains_any(text, values):
              for value in values:
                  if value in text:
                      return True
              return False

          def run(input):
              current = input["text"].strip()
              # Restore graph-authored stage, then replay player actions only.
              stage = 1
              revision = -1
              for line in input["memory"].split("\n"):
                  compact = line.replace(" ", "")
                  if '"schema":"raid_scenario_state_v2"' not in compact or '"voice_scene":' not in compact:
                      continue
                  value = compact.split('"voice_scene":')[1].split(",")[0].split("}")[0]
                  rev = compact.split('"revision":')[1].split(",")[0].split("}")[0] if '"revision":' in compact else "0"
                  if value.isdigit() and rev.isdigit() and int(rev) >= revision:
                      stage = max(1, min(4, int(value)))
                      revision = int(rev)
              actions = [m.get("content", "") for m in input["history"] if m.get("role", "") == "user"] + [current]
              for action in actions:
                  if contains_any(action, ["开始太空", "开始救援", "宇宙救援", "重新开始", "restart"]):
                      stage = 1
                  if contains_any(action, ["说说", "说话", "发言", "回应", "回答", "talk", "speak", "answer"]):
                      continue
                  if contains_any(action, ["检查能源", "校准能源"]):
                      stage = max(stage, 2)
                  if contains_any(action, ["等待安全窗口", "准备会合"]):
                      stage = max(stage, 3)
                  if contains_any(action, ["现在执行会合", "开始执行会合", "开始对接", "完成救援"]) and not contains_any(action, ["不要", "不提前"]):
                      stage = 4
              if not current or current.lower().rstrip("。！!") in ["开始", "开始吧", "从头开始", "重新开始", "start", "start over", "restart"] or contains_any(current, ['开始太空', '开始救援', '宇宙救援', '空间站']):
                  phase = "opening"
              elif contains_any(current, ['更正', '只确认', '有效坐标', '正确坐标', '有效能量', '只说有效', '回忆', '重连', '隔了几轮', '只说']):
                  phase = "correction"
              elif contains_any(current, ['总结', '救援状态', '任务状态', '回顾', '用一句话说出']):
                  phase = "conclusion"
              elif contains_any(current, ['牺牲', '攻击', '直接炸', '危险', '拒绝', '窗口', '角色分工']):
                  phase = "challenge"
              else:
                  phase = "explore"
              route = ["第一阶段‘恢复通信’", "第二阶段‘校准能源’", "第三阶段‘准备安全会合’", "第四阶段‘执行与收束’"][stage - 1]
              return {"phase": phase, "route": route, "policy": "儿童宇宙救援：保持通信、能源、轨道和团队分工连续一致，讲清选择带来的影响。保护所有队员，拒绝牺牲、攻击或破坏生命保障，提供安全合作办法。" + ("开场保留身份/背景，展开连续故事，原问置末尾：你是宇宙救援队的小队员，我是飞船助手，我们要一起帮助遇到麻烦的飞船。每一步你都可以从两个办法里选一个，也可以说出你自己的主意。一艘科研飞船失去动力，氧气充足但轨道正在偏离，我们先修通信还是计算新轨道？输出问号后立即结束，不得添加船员人数、位置、风险解释、第二个问题或重复选项。" if phase == "opening" else "")}
        limits:
          max_execution_steps: 20000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      - id: prompt-opening
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: stage-route
          policy:
            from: scenario-policy
          direction:
            from: narration-context
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {policy}
            权威路径：{route}，旧记忆不得倒退阶段。
            孩子只能在你说完后按键回答：除安全提醒、只确认或回忆事实、用户限定句数字数或字段的回合外，每条回复的最后一句都必须是问孩子的问题，例如接下来想先调查什么、想先试哪个办法，绝不能以陈述句或角色台词结尾。孩子说“继续上次的内容”时，不重播开场，先用一句话说出上次进行到哪里，再接着冒险并以问题收尾；没有可承接的内容时按开场处理。
            相关长期进度只用于核对，不得覆盖更新的对话：
            {memory}
            本轮场景与在场角色约束：
            {direction}
            有声书连续讲述：约1至2分钟，旁白叙述与角色第一人称台词分段，让在场角色有来有回，生动有趣、细节丰富。回应孩子刚说的话，尊重改选和更正，记住最新事实；追问、插话和重听自然接续。故事自然推进，最后一句必须是向孩子提出的故事内问题，不能以旁白或角色台词结尾。回忆和确认可以简短；遇到现实危险，劝阻模仿并引导找家长、老师或可信任的大人。
            有声书连续讲述：旁白叙述与角色第一人称台词分段，与在场角色交替；单角色不添人。只知亲历/公开信息。插话接续，点名仅增台词不换场/整轮。
            标记格式：仅限【旁白】、【救援队长】、【工程师】、【领航员】、【医护员】，每段一个，标题用【旁白】。未列名人物（如路人、摊主）及孩子的话一律由【旁白】转述，如：卖糖粥的阿婆笑着说……；不输出其它【】标记，禁止新增姓名标记，禁止给孩子加标记。
            音色由段落标记映射；仅朗读正文，禁Markdown/列表/emoji/舞台说明/系统字段/分析。
        - placeholder: history
      - id: prompt-explore
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: stage-route
          policy:
            from: scenario-policy
          direction:
            from: narration-context
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {policy}
            权威路径：{route}，旧记忆不得倒退阶段。
            孩子只能在你说完后按键回答：除安全提醒、只确认或回忆事实、用户限定句数字数或字段的回合外，每条回复的最后一句都必须是问孩子的问题，例如接下来想先调查什么、想先试哪个办法，绝不能以陈述句或角色台词结尾。孩子说“继续上次的内容”时，不重播开场，先用一句话说出上次进行到哪里，再接着冒险并以问题收尾；没有可承接的内容时按开场处理。
