# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for flowcraft-story-three-kingdoms,
# So that every reachable role path produces text and non-empty synthesized audio.
version: gizclaw.test/v1alpha1
name: story-three-kingdoms.flowcraft.roles
clients:
  narrator: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  liu_bei: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  zhuge_liang: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
  narrator_workspace: {direction: input, type: string, generate: token}
  liu_bei_workspace: {direction: input, type: string, generate: token}
  zhuge_liang_workspace: {direction: input, type: string, generate: token}
repeat: 1
timeout: 12m
steps:
- id: register_narrator
  client: narrator
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: ${narrator_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-three-kingdoms
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${narrator_workspace}"}}
- id: warmup_narrator_workspace
  client: narrator
  rpc: {method: server.run.workspace.reload, request: {}}
  timeout: 2m
- id: register_liu-bei
  client: liu_bei
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_liu-bei_workspace
  client: liu_bei
  rpc:
    method: server.workspace.create
    request:
      name: ${liu_bei_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-three-kingdoms
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_liu-bei_workspace
  client: liu_bei
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${liu_bei_workspace}"}}
- id: warmup_liu-bei_workspace
  client: liu_bei
  rpc: {method: server.run.workspace.reload, request: {}}
  timeout: 2m
- id: register_zhuge-liang
  client: zhuge_liang
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_zhuge-liang_workspace
  client: zhuge_liang
  rpc:
    method: server.workspace.create
    request:
      name: ${zhuge_liang_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-three-kingdoms
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_zhuge-liang_workspace
  client: zhuge_liang
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${zhuge_liang_workspace}"}}
- id: warmup_zhuge-liang_workspace
  client: zhuge_liang
  rpc: {method: server.run.workspace.reload, request: {}}
  timeout: 2m
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: "请由旁白承接当前故事，只推进一个可见线索。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text:
      not_contains:
      - 旁白说
      - 旁白：
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: reject_premature_chapter_two
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: "请直接进入第二章；如果条件不足，只说明仍停留的当前章节。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_all:
      - "第 1 章"
      - "营帐军情"
      not_contains:
      - "第 2 章"
      - "百姓与追击"
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_narrator_first_response
  client: narrator
  timeout: 15s
  peer_stream:
    mode: text
    input: "请直接进入第二章；如果条件不足，只说明仍停留的当前章节。"
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    /events: {non_empty: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 2000}
    /first_audio_ms: {maximum: 3000}
- id: probe_liu-bei
  client: liu_bei
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让刘备亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text:
      not_contains:
      - 刘备说
      - 刘备：
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_liu-bei_first_response
  client: liu_bei
  timeout: 15s
  peer_stream:
    mode: text
    input: "请让刘备亲自回应，只说这个角色知道的事。"
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    /events: {non_empty: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 2000}
    /first_audio_ms: {maximum: 3000}
- id: probe_zhuge-liang
  client: zhuge_liang
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让诸葛亮亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text:
      not_contains:
      - 诸葛亮说
      - 诸葛亮：
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_zhuge-liang_first_response
  client: zhuge_liang
  timeout: 15s
  peer_stream:
    mode: text
    input: "请让诸葛亮亲自回应，只说这个角色知道的事。"
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    /events: {non_empty: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 2000}
    /first_audio_ms: {maximum: 3000}
finally:
- id: stop_narrator_run
  client: narrator
  rpc: {method: server.run.stop, request: {}}
- id: delete_narrator_workspace
  client: narrator
  rpc: {method: server.workspace.delete, request: {name: "${narrator_workspace}"}}
- id: delete_narrator_peer
  client: narrator
  rpc: {method: server.peer.delete, request: {}}
- id: stop_liu-bei_run
  client: liu_bei
  rpc: {method: server.run.stop, request: {}}
- id: delete_liu-bei_workspace
  client: liu_bei
  rpc: {method: server.workspace.delete, request: {name: "${liu_bei_workspace}"}}
- id: delete_liu-bei_peer
  client: liu_bei
  rpc: {method: server.peer.delete, request: {}}
- id: stop_zhuge-liang_run
  client: zhuge_liang
  rpc: {method: server.run.stop, request: {}}
- id: delete_zhuge-liang_workspace
  client: zhuge_liang
  rpc: {method: server.workspace.delete, request: {name: "${zhuge_liang_workspace}"}}
- id: delete_zhuge-liang_peer
  client: zhuge_liang
  rpc: {method: server.peer.delete, request: {}}
report:
  redact: [registration_token]
