# RuntimeProfile composition example only:
# - This file is not a RuntimeProfile published or applied by Raids.
# - Consuming products own their actual RuntimeProfile and all concrete resource bindings.
# - System Workflow IDs and resource aliases below illustrate one possible composition.
#
# Example maintenance guide:
# - Keep system Workflow IDs and Model, Voice, and PetDef aliases aligned with
#   the resources published by this repository.
# - Add, rename, or remove an alias whenever the corresponding Workflow reference changes.
# - Set each Model and PetDef resource_id to a matching metadata.name from models/
#   and petdefs/.
# - Voice placeholders are intentionally unbound. Replace them with Voice metadata.name
#   values selected by the consuming product when adapting this example.
# - Keep Workflow collections empty here; each consuming product owns its collections
#   and the rest of its Runtime Profile policy.
---
apiVersion: gizclaw.admin/v1alpha1
kind: RuntimeProfile
metadata:
  name: raids
spec:
  workflows:
    # System Workflows are resolved by role and are not exposed as selectable aliases.
    system:
      friend_chatroom: chatroom
      group_chatroom: chatroom
      pet: pet-care
    # Workflow collections are defined by each consuming product.
    collections: {}
  resources:
    models:
      asr:
        resource_id: volc-bigasr-sauc
        i18n: {en: {display_name: Speech Recognition}, zh-CN: {display_name: 语音识别}}
      realtime:
        resource_id: doubao-realtime-dialog
        i18n: {en: {display_name: Realtime Conversation}, zh-CN: {display_name: 实时对话}}
      translation:
        resource_id: volc-ast-translate
        i18n: {en: {display_name: Translation Model}, zh-CN: {display_name: 翻译模型}}
      chat:
        resource_id: doubao-seed-2-0-lite
        i18n: {en: {display_name: Chat}, zh-CN: {display_name: 对话}}
      extraction:
        resource_id: deepseek-v4-flash
        i18n: {en: {display_name: Extraction}, zh-CN: {display_name: 信息提取}}
      pet-chat:
        resource_id: doubao-seed-2-0-lite
        i18n: {en: {display_name: Pet Chat}, zh-CN: {display_name: 宠物对话}}
      pet-extract:
        resource_id: deepseek-v4-flash
        i18n: {en: {display_name: Pet Memory Extraction}, zh-CN: {display_name: 宠物记忆提取}}
      pet-asr:
        resource_id: volc-bigasr-sauc
        i18n: {en: {display_name: Pet Speech Recognition}, zh-CN: {display_name: 宠物语音识别}}
    voices:
      # Replace each placeholder with a Voice metadata.name selected by the consuming product.

      # workflows/doubao-realtime/conversation.yaml
      doubao-assistant:
        resource_id: <voice-resource-id>
        i18n: {en: {display_name: Doubao Assistant}, zh-CN: {display_name: 豆包助手}}

      # workflows/ast-translate/*.yaml
      translator:
        resource_id: <voice-resource-id>
        i18n: {en: {display_name: Translator}, zh-CN: {display_name: 翻译员}}

      # workflows/flowcraft/chat-assistant.yaml
      assistant-voice:
        resource_id: <voice-resource-id>
        i18n: {en: {display_name: General Assistant}, zh-CN: {display_name: 通用助手}}

      # workflows/pet/pet-care.yaml
      cute-pet:
        resource_id: <voice-resource-id>
        i18n: {en: {display_name: Cute Pet}, zh-CN: {display_name: 奶气萌宠}}

      # workflows/flowcraft/journey-guide.yaml
      journey-narrator:
        resource_id: <voice-resource-id>
        i18n: {en: {display_name: Journey Narrator}, zh-CN: {display_name: 西游记旁白}}
      journey-origin-narrator:
        resource_id: <voice-resource-id>
        i18n: {en: {display_name: Origin Narrator}, zh-CN: {display_name: 石猴出世篇旁白}}
      journey-heaven-narrator:
        resource_id: <voice-resource-id>
        i18n: {en: {display_name: Heavenly Court Narrator}, zh-CN: {display_name: 大闹天宫篇旁白}}
      journey-pilgrimage-narrator:
        resource_id: <voice-resource-id>
        i18n: {en: {display_name: Pilgrimage Narrator}, zh-CN: {display_name: 师徒集结篇旁白}}
      journey-trials-narrator:
        resource_id: <voice-resource-id>
        i18n: {en: {display_name: Trials Narrator}, zh-CN: {display_name: 三打白骨精篇旁白}}
      journey-kingdoms-narrator:
        resource_id: <voice-resource-id>
        i18n: {en: {display_name: Kingdoms Narrator}, zh-CN: {display_name: 女儿国篇旁白}}
      journey-arrival-narrator:
        resource_id: <voice-resource-id>
        i18n: {en: {display_name: Journey Completion Narrator}, zh-CN: {display_name: 灵山功成篇旁白}}

      # workflows/flowcraft/murder-mystery.yaml
      game-master:
        resource_id: <voice-resource-id>
        i18n: {en: {display_name: Game Master}, zh-CN: {display_name: 游戏主持人}}
      detective:
        resource_id: <voice-resource-id>
        i18n: {en: {display_name: Detective}, zh-CN: {display_name: 侦探}}
      police-officer:
        resource_id: <voice-resource-id>
        i18n: {en: {display_name: Police Officer}, zh-CN: {display_name: 警察}}
    pet_defs:
      bsod:
        resource_id: petdef-bsod
        i18n:
          en: {display_name: BSOD, description: A native Codex animated pet.}
          zh-CN: {display_name: BSOD, description: Codex 原生动画宠物。}
      codex:
        resource_id: petdef-codex
        i18n:
          en: {display_name: Codex, description: A native Codex animated pet.}
          zh-CN: {display_name: Codex, description: Codex 原生动画宠物。}
      dewey:
        resource_id: petdef-dewey
        i18n:
          en: {display_name: Dewey, description: A native Codex animated pet.}
          zh-CN: {display_name: Dewey, description: Codex 原生动画宠物。}
      fireball:
        resource_id: petdef-fireball
        i18n:
          en: {display_name: Fireball, description: A native Codex animated pet.}
          zh-CN: {display_name: Fireball, description: Codex 原生动画宠物。}
      hoots:
        resource_id: petdef-hoots
        i18n:
          en: {display_name: Hoots, description: A native Codex animated pet.}
          zh-CN: {display_name: Hoots, description: Codex 原生动画宠物。}
      null-signal:
        resource_id: petdef-null-signal
        i18n:
          en: {display_name: Null Signal, description: A native Codex animated pet.}
          zh-CN: {display_name: Null Signal, description: Codex 原生动画宠物。}
      rocky:
        resource_id: petdef-rocky
        i18n:
          en: {display_name: Rocky, description: A native Codex animated pet.}
          zh-CN: {display_name: Rocky, description: Codex 原生动画宠物。}
      seedy:
        resource_id: petdef-seedy
        i18n:
          en: {display_name: Seedy, description: A native Codex animated pet.}
          zh-CN: {display_name: Seedy, description: Codex 原生动画宠物。}
      stacky:
        resource_id: petdef-stacky
        i18n:
          en: {display_name: Stacky, description: A native Codex animated pet.}
          zh-CN: {display_name: Stacky, description: Codex 原生动画宠物。}
