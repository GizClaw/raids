  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_transitions_opening_with_guidance
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 请从第一章开始《地心游记》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_all:
      - 第 1 章
      - 岩层入口
      - 阿克塞尔
      - 黎登布洛克
      - 汉斯
      - 进入下一章
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
- id: flowcraft_transitions_natural_consequence
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 请继续当前场景，推进一个直接结果。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 第 2 章
      - 地下水路
      min_length: 4
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
- id: flowcraft_transitions_character_perspective
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让阿克塞尔亲自回应当前结果，说出不同的立场。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 第 2 章
      - 地下水路
      min_length: 4
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
- id: flowcraft_transitions_reject_negated_choice
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 我先不选择，请让阿克塞尔说明为什么还不能进入第二章；只说明仍停留的当前章节。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_all:
      - 第 1 章
      - 岩层入口
      not_contains:
      - 第 2 章
      - 地下水路
      contains_any:
      - 岩层入口
      - 第一章
      - 第 1 章
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
- id: flowcraft_transitions_choice_prompts_next_chapter
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 观察纹理
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
