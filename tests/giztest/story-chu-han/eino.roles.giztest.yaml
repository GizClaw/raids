  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_zhang-liang
  client: zhang-liang
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_zhang_liang_workspace
  client: zhang-liang
  rpc:
    method: server.workspace.create
    request:
      name: "${zhang_liang_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-chu-han
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_zhang_liang_workspace
  client: zhang-liang
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${zhang_liang_workspace}"
- id: warmup_zhang_liang_workspace
  client: zhang-liang
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: 请由旁白承接当前故事，只推进一个可见线索。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_narrator_first_response
  client: narrator
  timeout: 15s
  peer_stream:
    mode: text
    input: 请由旁白承接当前故事，只推进一个可见线索。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: xiang-yu_chapter_setup_1
  client: xiang-yu
  timeout: 2m
  peer_stream:
    mode: text
    input: 请从第一章开始《楚汉风云》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      contains: 承诺与力量
- id: probe_xiang-yu
  client: xiang-yu
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让项羽亲自回应，只说这个角色知道的事。
    idle_timeout: 90s
    require_text: true
    require_audio: true
