- id: quality_round_1
  timeout: 2m
  parallel:
  - id: flowcraft_benchmark_turn_1_origin
    client: flowcraft__benchmark
    peer_stream:
      mode: text
      input: 我从花果山出发，带着一枚青铜铃。承接我的行动，不要替我选择路线。
      require_text: true
      require_audio: true
