# User Story:
# As a Raids catalog maintainer,
# I want equal opening, role and realtime responsiveness gates for every implementation,
# So that text and audio respond promptly without overlap or playback stalls.
version: gizclaw.test/v1alpha1
name: story-little-prince.smoke
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_text_workspace:
    direction: input
    type: string
    generate: token
  eino_text_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_realtime_workspace:
    direction: input
    type: string
    generate: token
  eino_realtime_workspace:
    direction: input
    type: string
    generate: token
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
repeat: 1
timeout: 12m
steps:
- id: flowcraft_register
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_register
  client: eino
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_create_text
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_text_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-little-prince
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_select_text
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_text_workspace}"
- id: flowcraft_warmup_text
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_create_text
  client: eino
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_text_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-little-prince
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_select_text
  client: eino
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_text_workspace}"
- id: eino_warmup_text
  client: eino
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_create_realtime
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_realtime_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-little-prince
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_REALTIME
- id: eino_create_realtime
  client: eino
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_realtime_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-little-prince
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_REALTIME
- id: narrator_chapter_setup_1
  timeout: 2m
  parallel:
  - id: flowcraft_narrator_chapter_setup_1
    client: flowcraft
    peer_stream:
      mode: text
      input: 请从第一章开始《小王子》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_narrator_chapter_setup_1
    client: eino
    peer_stream:
      mode: text
      input: 请从第一章开始《小王子》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  expect:
    "/flowcraft_narrator_chapter_setup_1/text":
      contains: 第 1 章：唯一的花
      non_empty: true
    "/flowcraft_narrator_chapter_setup_1/text_eos":
      equals: true
    "/flowcraft_narrator_chapter_setup_1/audio_eos":
      equals: true
    "/flowcraft_narrator_chapter_setup_1/audio_bytes":
      minimum: 1
    "/flowcraft_narrator_chapter_setup_1/first_text_ms":
      maximum: 6000
    "/flowcraft_narrator_chapter_setup_1/first_audio_ms":
      maximum: 90000
    "/flowcraft_narrator_chapter_setup_1/events":
      non_empty: true
    "/flowcraft_narrator_chapter_setup_1/text_eos_ms":
      maximum: 90000
    "/flowcraft_narrator_chapter_setup_1/audio_eos_ms":
      maximum: 90000
    "/flowcraft_narrator_chapter_setup_1/audio_integrity/streams":
      minimum: 1
    "/flowcraft_narrator_chapter_setup_1/audio_integrity/max_active":
      equals: 1
    "/flowcraft_narrator_chapter_setup_1/audio_integrity/open":
      equals: 0
    "/flowcraft_narrator_chapter_setup_1/audio_integrity/violations":
      equals: 0
    "/flowcraft_narrator_chapter_setup_1/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/flowcraft_narrator_chapter_setup_1/audio_pacing/underruns":
      equals: 0
    "/eino_narrator_chapter_setup_1/text":
      contains: 第 1 章：唯一的花
      non_empty: true
    "/eino_narrator_chapter_setup_1/text_eos":
      equals: true
    "/eino_narrator_chapter_setup_1/audio_eos":
      equals: true
    "/eino_narrator_chapter_setup_1/audio_bytes":
      minimum: 1
    "/eino_narrator_chapter_setup_1/first_text_ms":
      maximum: 6000
    "/eino_narrator_chapter_setup_1/first_audio_ms":
      maximum: 90000
    "/eino_narrator_chapter_setup_1/events":
      non_empty: true
    "/eino_narrator_chapter_setup_1/text_eos_ms":
      maximum: 90000
    "/eino_narrator_chapter_setup_1/audio_eos_ms":
      maximum: 90000
    "/eino_narrator_chapter_setup_1/audio_integrity/streams":
      minimum: 1
    "/eino_narrator_chapter_setup_1/audio_integrity/max_active":
      equals: 1
    "/eino_narrator_chapter_setup_1/audio_integrity/open":
      equals: 0
    "/eino_narrator_chapter_setup_1/audio_integrity/violations":
      equals: 0
    "/eino_narrator_chapter_setup_1/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/eino_narrator_chapter_setup_1/audio_pacing/underruns":
      equals: 0
