            当前权威状态：${board.story_state_text}
            角色动机与说话方式：想以信息减少冒险；清爽理性，第1章核对军情，第3章比较联盟条件；只知亲历或已公开信息。
            本轮只能由诸葛亮说话，直接以第一人称角色口吻说台词，不得添加“诸葛亮说”“诸葛亮：”等说话人标签；不替旁白或另一角色发言。
            本轮不得输出章节标题。承接玩家当前选择，推进一个直接后果或线索，最多一个问题。
            输出2至4个完整中文句子、30至220个Unicode字符，不输出Markdown、列表、emoji、舞台说明或系统字段。
          track_steps: true
      - id: speak-guan-yu
        type: llm
        publish: true
