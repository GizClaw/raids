# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for flowcraft-story-gulliver,
# So that every reachable role path produces text and non-empty synthesized audio.
version: gizclaw.test/v1alpha1
name: story-gulliver.flowcraft.roles
clients:
  narrator: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  gulliver: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  local_guide: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
  narrator_workspace: {direction: input, type: string, generate: token}
  gulliver_workspace: {direction: input, type: string, generate: token}
  local_guide_workspace: {direction: input, type: string, generate: token}
repeat: 1
timeout: 12m
steps:
- id: register_narrator
  client: narrator
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: ${narrator_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-gulliver
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${narrator_workspace}"}}
- id: register_gulliver
  client: gulliver
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_gulliver_workspace
  client: gulliver
  rpc:
    method: server.workspace.create
    request:
      name: ${gulliver_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-gulliver
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_gulliver_workspace
  client: gulliver
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${gulliver_workspace}"}}
- id: register_local-guide
  client: local_guide
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_local-guide_workspace
  client: local_guide
  rpc:
    method: server.workspace.create
    request:
      name: ${local_guide_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-gulliver
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_local-guide_workspace
  client: local_guide
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${local_guide_workspace}"}}
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: "请由旁白承接当前故事，只推进一个可见线索。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 旁白}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: reject_premature_chapter_two
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: "请直接进入第二章；如果条件不足，只说明仍停留的当前章节。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_all:
      - "第 1 章"
      - "微小之城"
      not_contains:
      - "第 2 章"
      - "礼节冲突"
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_gulliver
  client: gulliver
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让格列佛亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 格列佛}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_local-guide
  client: local_guide
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让当地向导亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 当地向导}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
finally:
- id: stop_narrator_run
  client: narrator
  rpc: {method: server.run.stop, request: {}}
- id: delete_narrator_workspace
  client: narrator
  rpc: {method: server.workspace.delete, request: {name: "${narrator_workspace}"}}
- id: delete_narrator_peer
  client: narrator
  rpc: {method: server.peer.delete, request: {}}
- id: stop_gulliver_run
  client: gulliver
  rpc: {method: server.run.stop, request: {}}
- id: delete_gulliver_workspace
  client: gulliver
  rpc: {method: server.workspace.delete, request: {name: "${gulliver_workspace}"}}
- id: delete_gulliver_peer
  client: gulliver
  rpc: {method: server.peer.delete, request: {}}
- id: stop_local-guide_run
  client: local_guide
  rpc: {method: server.run.stop, request: {}}
- id: delete_local-guide_workspace
  client: local_guide
  rpc: {method: server.workspace.delete, request: {name: "${local_guide_workspace}"}}
- id: delete_local-guide_peer
  client: local_guide
  rpc: {method: server.peer.delete, request: {}}
report:
  redact: [registration_token]
