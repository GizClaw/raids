    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_all:
      - 第 2 章
      - 神山迷雾
      not_contains:
      - 第 1 章
      pattern: 第 2 章[：:]\s*神山迷雾[\s\S]{20,}[。！？]
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
- id: flowcraft_transitions_continue_current_chapter
