    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 第 2 章
      - 礼节冲突
      min_length: 4
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
- id: flowcraft_transitions_reject_negated_choice
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 我先不选择，请让格列佛说明为什么还不能进入第二章；只说明仍停留的当前章节。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
