# User Story:
# As a Raids assistant maintainer,
# I want the Eino chat assistant to answer live weather and date questions from web search,
# So that a missing search key, Tool binding or tool-call regression fails instead of an offline refusal.
# Requires tools/volc-web-search.yaml, the testing profile's web-search binding, and a
# search_api_key in volc-credential. Run: gizclaw test run tests/giztest/web-search
version: gizclaw.test/v1alpha1
name: chat-assistant.web-search.eino
clients:
  eino__web_search:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  eino_web_search_candidate_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 10m
steps:
- id: eino__web_search_register
  client: eino__web_search
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_web_search_stop_create_candidate_workspace
  client: eino__web_search
  rpc:
    method: server.run.stop
    request: {}
- id: eino_web_search_create_candidate_workspace
  client: eino__web_search
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_web_search_candidate_workspace}"
      collection: assistants
      workflow_name: chat-assistant
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_web_search_select_candidate_workspace
  client: eino__web_search
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_web_search_candidate_workspace}"
- id: eino_web_search_warmup_candidate_workspace
  client: eino__web_search
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_web_search_1
  client: eino__web_search
  timeout: 2m
  peer_stream:
    mode: text
    input: 上海今天天气怎么样？一两句话告诉我。
    require_text: true
    require_audio: true
    wait_for_history: true
    idle_timeout: 90s
  expect:
    "/text":
      not_contains:
      - 无法联网
      - 不能联网
      - 没有联网
      - 无法上网
      - 不能上网
      - 无法获取实时
      - 无法查询实时
      - 无法提供实时
      contains_any:
      - 度
      - ℃
      - 晴
      - 云
      - 雨
      - 雪
      - 阴
      - 风
      - 气温
    "/text_eos":
      equals: true
    "/first_text_ms":
      maximum: 15000
    "/audio_bytes":
      minimum: 1
    "/audio_eos":
      equals: true
- id: eino_web_search_2
  client: eino__web_search
  timeout: 2m
  peer_stream:
    mode: text
    input: 今天是几月几号？查一下再回答。
    require_text: true
    require_audio: true
    wait_for_history: true
    idle_timeout: 90s
  expect:
    "/text":
      not_contains:
      - 无法联网
      - 不能联网
      - 没有联网
      - 无法上网
      - 不能上网
      - 无法获取实时
      - 无法查询实时
      - 无法提供实时
      contains_all:
      - 月
      contains_any:
      - 号
      - 日
    "/text_eos":
      equals: true
    "/first_text_ms":
      maximum: 15000
    "/audio_bytes":
      minimum: 1
    "/audio_eos":
      equals: true
finally:
- id: eino__web_search_stop
  client: eino__web_search
  rpc:
    method: server.run.stop
    request: {}
- id: eino_web_search_delete_candidate_workspace
  client: eino__web_search
  rpc:
    method: server.workspace.delete
    request:
      name: "${eino_web_search_candidate_workspace}"
- id: eino__web_search_delete
  client: eino__web_search
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
