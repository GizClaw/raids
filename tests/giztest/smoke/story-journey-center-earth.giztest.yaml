    "/eino_narrator_chapter_setup_1/audio_integrity/streams":
      minimum: 1
    "/eino_narrator_chapter_setup_1/audio_integrity/max_active":
      equals: 1
    "/eino_narrator_chapter_setup_1/audio_integrity/open":
      equals: 0
    "/eino_narrator_chapter_setup_1/audio_integrity/violations":
      equals: 0
    "/eino_narrator_chapter_setup_1/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/eino_narrator_chapter_setup_1/audio_pacing/underruns":
