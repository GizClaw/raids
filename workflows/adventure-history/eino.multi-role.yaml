apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-adventure-history-multi-role
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: adventure
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-adventure-history-mr.adventure-guide
      speaker_voices:
        旁白: eino-adventure-history-mr.adventure-guide
        历史讲解员: eino-adventure-history-mr.historian
        工匠: eino-adventure-history-mr.artisan
        集市向导: eino-adventure-history-mr.market-guide
    graph:
      name: adventure-history-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: memory-query
          type: string
          merge: replace
        - name: memory-route
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: observation
          type: string
          merge: replace
        - name: narration-context
          type: string
          merge: replace
        - name: voice-scene
          type: string
          merge: replace
        - name: voice-revision
          type: string
          merge: replace
      nodes:
      - id: control-narration
        type: script
        inputs:
          text:
            from: input.text
          history:
            from: input.messages
          memory:
            from: recalled
        outputs:
          direction: narration-context
          scene: voice-scene
          revision: voice-revision
        language: starlark
        entrypoint: run
        source: |
          def any_cue(text, cues):
              return any([cue in text for cue in cues])

          def clause(text):
              for sep in ["，", "。", "；", "！", "？", ",", ";", "!", "?"]:
                  text = text.replace(sep, "|")
              for sep in ["但是", "而是", "再让", "改请", "改让", "but "]:
                  text = text.replace(sep, "|")
              return text

          def run(input):
              current = input["text"].strip().lower()
              memory = input.get("memory", "")
              scenes = ["古城观察", "集市观察", "工坊观察"]
              roles = [{"key": "narrator", "name": "旁白", "aliases": ["旁白", "narrator"], "chapters": [1, 2, 3], "duty": "只负责叙述、管理和公开信息整理，不代演角色。"}, {"key": "historian", "name": "历史讲解员", "aliases": ["历史讲解员", "historian"], "chapters": [1, 2, 3], "duty": "说明当前时代地点的证据和不确定性，不把改编当史料。"}, {"key": "artisan", "name": "工匠", "aliases": ["工匠", "artisan"], "chapters": [3], "duty": "在明确标记的情境重现中介绍日常劳动与工具用途，不提供危险操作。"}, {"key": "market-guide", "name": "集市向导", "aliases": ["集市向导", "market-guide"], "chapters": [2], "duty": "在情境重现中比较公开可见的交换和生活场景，不改变历史。"}]
              scene = 1
              revision = -1
              # Read only graph-authored state fields; legacy active_roles is never authoritative.
              for line in memory.split("\n"):
                  compact = line.replace(" ", "")
                  if '"schema":"raid_scenario_state_v2"' not in compact:
                      continue
                  rev = 0
                  if '"revision":' in compact:
                      value = compact.split('"revision":')[1].split(",")[0].split("}")[0]
                      if value.isdigit():
                          rev = int(value)
                  if rev >= revision and '"voice_scene":' in compact:
                      value = compact.split('"voice_scene":')[1].split(",")[0].split("}")[0]
                      if value.isdigit():
                          scene = max(1, min(len(scenes), int(value)))
                          revision = rev
              for message in input.get("history", []):
                  if message.get("role", "") != "assistant":
                      continue
                  text = message.get("content", "")
                  for i in range(len(scenes)):
                      if "当前场景："+scenes[i] in text or "来到"+scenes[i] in text:
                          scene = i+1
              transition = False
              if not current or any_cue(current, ["重新开始", "restart", "开场", "介绍这个体验", "开始体验"]):
                  scene = 1
              elif any_cue(current, ["进入下一章", "进入下一场景"]):
                  scene = min(len(scenes), scene+1)
                  transition = True
              else:
                  for i in range(len(scenes)):
                      if any_cue(current, ["进入"+scenes[i], "前往"+scenes[i], "来到"+scenes[i]]):
                          scene = i+1
                          transition = True
                  pass
              phase = "explore"
              active_roles = [r["key"] for r in roles if scene in r["chapters"]]
              management_text = current
              for role in roles:
                  for alias in role["aliases"]:
                      management_text = management_text.replace(alias, "")
              management = not current or transition or any_cue(management_text, ["更正", "纠正", "修正", "改成", "改变主意", "其实", "安全", "危险", "现实", "模仿", "受伤", "攻击", "牺牲", "停止", "总结", "结论", "回忆", "重连", "恢复", "请记住", "只确认", "只说", "换边", "correction", "correct", "actually", "danger", "safety", "restart", "重新开始", "开场", "介绍这个体验", "进入下一", "下一章", "下一场景", "转场", "开始体验", "从头开始", "第一章", "第1章", "开始冒险", "start", "begin", "介绍体验", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物"]) or phase != "explore"
              direction = "原创配角按场景出场，不知未来/秘密/未验证结果。\n首次让在场角色自然登场。\n人物对白每次先在正文说“这是情境重现”，紧接着由当前角色用“我”自称说台词；情境重现声明不替代角色自述，这些是虚构演示，不是历史原话，也不表示亲历真实历史。保持时空观察模式，不能改变历史。" + "\n当前场景："+scenes[scene-1]+"。当前在场角色："+"、".join([r["name"] for r in roles if r["key"] in active_roles])+"。"
              if transition:
                  direction += "本轮由旁白回应，正文第一句必须逐字是‘来到"+scenes[scene-1]+"。’，这句话不得省略、改写或替换为其他场景名。随后用旁白与在场角色台词交替讲述具体行动，结尾由旁白给两三个观察选项。"
              direction += "紧邻下一场景：" + (scenes[scene] if scene < len(scenes) else "终局") + "。当前及自然转场后的职责：" + "；".join([r["name"] + "：" + r["duty"] for r in roles if (scene in r["chapters"] or scene+1 in r["chapters"]) and r["key"] != "narrator"])
              # Content obligations follow voice style so role brevity cannot suppress them.
              safety_request = any([cue in current for cue in ["现实", "模仿", "照做", "安全", "危险", "受伤", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物", "danger", "safety", "imitate"]])
              turn_contract = ""
              if any([cue in current for cue in ["只说", "只确认", "不要推进", "不推进"]]):
                  turn_contract = "限定管理：更正优先，不推进/介绍角色；否定选择或不推进须简短确认未选择并重述原选择，其余只答所问不提问。"
              if safety_request:
                  turn_contract = "本轮是安全请求，优先于角色风格和章节推进：逐字说‘不要模仿’‘找家长、老师或可信任成年人帮助’，说明危险及安全替代直接结果，不提问/转场。"
              direction += "\n本轮内容硬约束：" + turn_contract
              opening_prompt = not current or any_cue(current, ["重新开始", "restart", "开场", "介绍这个体验", "开始体验", "start", "begin", "介绍体验"])
              if opening_prompt and any([cue in current for cue in ["english", "英文", "英语"]]):
                  direction += "\n" + "英文开场用普通词数预算，以下原句逐字放末尾，不另问/重译：The time-observation pod stops outside an ancient city. We may observe but not alter history. Market or city gate first? "
              if opening_prompt:
                  direction += "\n" + "中文开场：首段/末问逐字完整保留在首尾，中间连续讲述，只问一次：欢迎登上时空观察舱，我是你的向导，我们会悄悄回到古代，看看那时的人怎样生活。每一站你都可以选想先看的地方，也可以问我看到的东西是什么。时空观察舱停在一座古城外，我们只能观察不能改变历史，你想先看市场还是城门？ 中间讲述当前场景，整轮200至900字符；末尾指定句之后不得追加正文。"
              return {"direction": direction, "scene": str(scene), "revision": str(max(revision, len(input.get("history", [])))+1)}
        limits:
          max_execution_steps: 100000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
          route: memory-route
          memory: recalled
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              base = "当前互动剧本的已确认选择、场景进度、事实和用户明确要求记住的信息"
              route = "opening" if not text else ("recall" if any([cue in text for cue in ["重连", "恢复", "回忆", "上次", "之前", "更正", "改成", "还记得", "代号", "resume", "recall", "previous"]]) else "continue")
              return {"query": base + ("；当前请求：" + text if text else ""), "route": route, "memory": ""}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-memory
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 12
      - id: build-prompt
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          direction:
            from: narration-context
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            连续有声书规则：普通轮讲选择后果，目标达成同轮续邻章/场景及开场，无需许可。末尾【旁白】问一次，给2至3个具体安全行动/地点/解法。中文回复以恰好一个全角问号？结束；英文用?，禁双问号/尾文。禁“进入下一章”“要不要继续”“想继续听就说”“这一章的选择完成啦”等流程口令；主动转场可承接，特殊轮优先。末场不增章，选择角色后续行动。实际转场用旁白“来到场景名。”，不预告。回合规则表（普通200至900字；本轮分类）：续讲/改选｜普通；旁白线索钩子｜普通，展开悬念与角色反应；角色追问/亲自回应/裸角色名/否定点名｜普通，被点名者在场景中长篇发言，旁白和在场角色接续，禁单句台词；事实边界｜普通，多声部解释当前事实/传说/原创，不添剧情；总结/检查点｜多声部回顾已知情节与悬念，不添剧情，中文120至900字符、英文60至450词，目标仍500字。以上均连续多声部叙述，末尾【旁白】恰好一个故事内选择（2至3个具体行动），禁知识问答收尾；短句风格不缩短整轮。特殊优先：否定/拒选/不推进（含 do not choose/advance）｜按原短上限确认“选择尚未作出”，禁执行/转场/标题/口令，原选择收尾，优先于只确认不提问；仅用户明确要求只确认、回忆、更正或制止且不要求续讲｜短契约不提问；安全｜原安全契约优先。续讲恢复普通要求。篇幅执行规则：去角色标记后，中文Unicode计数含标点空白，目标500字、5段每段约100字；不要少于 200 字，不要超过 900 字。英文100至450词，目标约220个英文单词、5段各44词，无中文上限。依次行动、两种回应、结果、选择。勿重复/虚构凑数或输出分析计数。
            你是儿童友好的互动冒险主持人。
            不得重置场景；孩子不知道或求提示时，先给小提示再复述选项。
            体验要求：Set a place and period, offer observational choices, distinguish evidence from uncertainty, and explain how ordinary people lived.
            安全边界：Do not change timelines, fabricate certainty, glorify conquest, or expose children to graphic historical violence.
            区分事实、传说、虚构及不确定性。
            现实危险/模仿：说明危险，逐字说“不要模仿”和“找家长、老师或可信任成年人帮助”，不提问。
            默认自然中文，明确要求英文时用英文。

            记忆（更正优先）：
            {memory}
            本轮场景与在场角色约束：
            {direction}
            仅要求回忆旅程代号时，只输出记忆中的代号，不追加场景、选项或剧情。有声书连续讲述：旁白叙述与角色第一人称台词分段，与2至4位在场角色交替；单角色不添人。只知亲历/公开信息。插话接续，点名仅增台词不换场/整轮。
            标记格式：每段选一个【旁白】、【历史讲解员】、【工匠】、【集市向导】后接正文，不输出其它【】标记或英文key；可再次发声，标题属旁白。
            音色由段落标记映射；仅朗读正文，禁Markdown/列表/emoji/舞台说明/系统字段/分析。
        - placeholder: history
      - id: narrator-model
        type: chat_model
        inputs:
          messages:
            from: answer-messages
        outputs:
          text: answer
        model: eino-adventure-history-mr.model
        max_tokens: 2048
        temperature: 0.3
      - id: capture-observation
        type: script
        inputs:
          text:
            from: input.text
          answer:
            from: answer
          scene:
            from: voice-scene
          voice_revision:
            from: voice-revision
        outputs:
          fact: observation
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              scenes = ["古城观察", "集市观察", "工坊观察"]
              scene = input["scene"]
              for i in range(len(scenes)):
                  if "来到" + scenes[i] in input["answer"]:
                      scene = str(i + 1)
              routing = '{"schema":"raid_scenario_state_v2","voice_scene":' + scene + ',"revision":' + input["voice_revision"] + '}\n'
              text = input["text"].strip()
              return {"fact": routing + "用户本轮输入：" + text + "；助手本轮确认：\n" + input["answer"]}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 262144
      - id: observe-memory
        type: memory_observe
        facts:
        - text_from: observation
        wait_for_completion: false
      edges:
      - from: start
        to: prepare-memory-query
      - from: recall-memory
        to: control-narration
      - from: build-prompt
        to: narrator-model
      - from: capture-observation
        to: observe-memory
      - from: observe-memory
        to: end
      - from: control-narration
        to: build-prompt
      branches:
      - from: prepare-memory-query
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: recall
          to: recall-memory
        default: control-narration
      - from: narrator-model
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: opening
          to: end
        default: capture-observation
      outputs:
      - node: narrator-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
