apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-story-arabian-nights
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: story-teller
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-story-arabian-nights.storyteller
      state_voices:
        field: selected_speaker
        voices:
          narrator: eino-story-arabian-nights.storyteller
          shahrazad: eino-story-arabian-nights.shahrazad
          shahryar: eino-story-arabian-nights.shahryar
          sinbad: eino-story-arabian-nights.sinbad
          merchant: eino-story-arabian-nights.merchant
    graph:
      name: story-arabian-nights-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - {name: selected_speaker, type: string, merge: replace}
        - {name: speaker-direction, type: string, merge: replace}
        - {name: memory-query, type: string, merge: replace}
        - {name: memory-route, type: string, merge: replace}
        - {name: recalled, type: string, merge: replace}
        - {name: answer-messages, type: messages, merge: replace}
        - {name: answer, type: string, merge: replace}
        - {name: observation, type: string, merge: replace}
      nodes:
      - id: prepare-memory-query
        type: script
        inputs:
          text: {from: input.text}
        outputs:
          query: memory-query
          route: memory-route
          memory: recalled
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              cues = ["重连", "恢复", "回忆", "还记得", "代号", "更正", "改成"]
              recall = False
              for cue in cues:
                  if cue in text:
                      recall = True
              route = "opening" if not text else ("recall" if recall else "continue")
              return {"query": "一千零一夜故事状态、章节、角色、选择、更正、旅程代号和未解决线索；当前请求：" + text, "route": route, "memory": ""}
        limits: {max_execution_steps: 10000, timeout: 250ms, max_input_bytes: 65536, max_output_bytes: 65536}
      - id: recall-memory
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 16
      - id: select-speaker
        type: script
        inputs:
          text: {from: input.text}
          history: {from: input.messages}
          memory: {from: recalled}
        outputs:
          speaker: selected_speaker
          direction: speaker-direction
        language: starlark
        entrypoint: run
        source: |
          def contains_any(text, cues):
              return any([cue in text for cue in cues])

          def run(input):
              current = input["text"].strip().lower()
              # Only delivered assistant headings establish chapter eligibility; user requests
              # and opening cast previews are not transitions.
              chapter = 1
              history = input.get("history", [])
              # Recall may contain the legacy structured state; never trust active_roles.
              memory = input.get("memory", "")
              for line in memory.split("\n"):
                  compact = line.replace(" ", "")
                  if '"schema":"story_contract_v1"' in compact and '"chapter":' in compact:
                      raw = compact.split('"chapter":', 1)[1].split(",", 1)[0].split("}", 1)[0]
                      if raw in ["1", "2", "3", "4"]:
                          chapter = int(raw)
              context = [memory]
              context.extend([m["content"] for m in history if m["role"] == "assistant"])
              for content in context:
                  for line in content.split("\n"):
                      line = line.strip()
                      for number, title in [(1, "移动之城"), (2, "诚实之灯"), (3, "提问地图"), (4, "黎明之门")]:
                          if line.startswith("第 " + str(number) + " 章：" + title) or line.startswith("第 " + str(number) + " 章:" + title):
                              chapter = number
              roles = [('narrator', ['旁白', 'narrator']), ('shahrazad', ['山鲁佐德', 'shahrazad']), ('shahryar', ['山鲁亚尔', '国王', 'shahryar']), ('sinbad', ['辛巴达', 'sinbad']), ('merchant', ['老商人', '商人', 'merchant'])]
              option = current
              for mark in ["。", "！", "!", ",", ".", "，"]:
                  option = option.replace(mark, "")
              option_only = any([option in aliases for _, aliases in roles])
              opening = not current or (not any([m["role"] == "assistant" for m in history]) and (contains_any(current, ["第一章", "第 1 章"]) or (contains_any(current, ["start", "begin", "restart"]) and contains_any(current, ["chapter 1", "first chapter"]))))
              management = contains_any(current, ["旅程代号", "更正", "改成", "纠正", "修正", "作废", "重连", "回忆", "事实", "传说", "原创设定", "总结", "说明当前章节", "不要推进", "不推进章节", "只确认", "correct", "correction", "reconnect", "recall", "现实中模仿", "现实模仿"])
              target = 0
              for number, chinese in [(2, "二"), (3, "三"), (4, "四")]:
                  if contains_any(current, ["第" + chinese + "章", "第" + str(number) + "章", "第 " + str(number) + " 章"]):
                      target = number
              if target == 0 and "下一章" in current and chapter < 4:
                  target = chapter + 1
              transition = target > 0 and target != chapter and contains_any(current, ["下一章", "进入", "继续", "切换", "开始", "go to", "continue", "start", "为什么还不能", "为何不能", "说明为什么"])
              # A denied transition is not a management turn (same as control-story).
              denied_transition = False
              for denial in ["不要", "别", "不能", "暂不", "不想", "先不", "不去", "不听", "do not", "don't", "cannot", "can't", "not ready to"]:
                  if denial in current:
                      tail = current.rsplit(denial, 1)[-1]
                      for action in ["进入", "继续", "切换", "开始", "下一章", "enter", "continue", "switch", "start", "go to"]:
                          if action in tail and len(list(tail.split(action, 1)[0].codepoints())) <= (12 if action in ["enter", "continue", "switch", "start", "go to"] else 6):
                              denied_transition = True
              if denied_transition:
                  transition = False
              speaker = "narrator"
              best = len(current) + 1
              if not opening and not management and not transition and not option_only:
                  for role, aliases in roles:
                      if chapter not in {"narrator":[1,2,3,4],"shahrazad":[1,2,3,4],"shahryar":[1,2,3,4],"sinbad":[2,3,4],"merchant":[2]}[role]:
                          continue
                      for alias in aliases:
                          # split yields every occurrence without a while loop (Starlark).
                          offset = 0
                          pieces = current.split(alias)
                          for piece in pieces[:-1]:
                              index = offset + len(piece)
                              prefix = current[:index]
                              suffix = current[index + len(alias):]
                              for separator in ["，", "。", "；", "！", "？", ",", ";", "!", "?", "但是", "而是", "不过", "但"]:
                                  prefix = prefix.replace(separator, "\n")
                              prefix = prefix.split("\n")[-1]
                              for separator in ["，", "。", "；", "！", "？", ",", ";", "!", "?"]:
                                  suffix = suffix.replace(separator, "\n")
                              suffix = suffix.split("\n")[0]
                              negated = False
                              for cue in ["不要", "别", "不让", "不用", "不想", "不请", "不由", "不听", "不选", "do not", "don't", "not", "never"]:
                                  if cue in prefix and len(list(prefix.rsplit(cue, 1)[-1].codepoints())) <= 16:
                                      negated = True
                              for lead in ["", "先", "暂时"]:
                                  for cue in ["不要", "别", "不用", "不必"]:
                                      if suffix.startswith(lead + cue):
                                          negated = True
                              requested = any([prefix.rstrip().endswith(cue) for cue in ["请让", "请", "让", "由", "听", "ask", "let", "hear"]]) or any([suffix.startswith(cue) for cue in ["亲自", "说", "讲", "回应", "回答", "来讲"]])
                              if not negated and requested and index < best:
                                  speaker = role
                                  best = index
                              offset = index + len(alias)
              # Stable voice style plus only this chapter's actions; knowledge boundaries remain.
              styles = [{"narrator":"本轮由旁白叙述可见事实和选择后果，不代演角色，不使用角色第一人称。只报角色名是玩家选择。","shahrazad":"本轮你就是山鲁佐德：我想用故事帮助大家思考；温柔稳重，第1章展示两种旅行工具，只能谈亲历或已公开的信息。","shahryar":"本轮你就是山鲁亚尔：我想学会公平判断；沉稳直接，第1章提出城市谜题，只能谈亲历或已公开的信息。","sinbad":"本轮你就是辛巴达：我想带同行者安全找到路；清爽行动派，只能谈亲历或已公开的信息。","merchant":"本轮你就是老商人：我想诚实交换物品；幽默不夸口，承认未知之处，之后留在集市，不知道后续旅程。只能谈亲历或已公开的信息。"},{"narrator":"本轮由旁白叙述可见事实和选择后果，不代演角色，不使用角色第一人称。只报角色名是玩家选择。","shahrazad":"本轮你就是山鲁佐德：我想用故事帮助大家思考；温柔稳重，第2章核对灯的线索，只能谈亲历或已公开的信息。","shahryar":"本轮你就是山鲁亚尔：我想学会公平判断；沉稳直接，第2章要求核对证据，只能谈亲历或已公开的信息。","sinbad":"本轮你就是辛巴达：我想带同行者安全找到路；清爽行动派，第2章用航行见闻辨认灯光，只能谈亲历或已公开的信息。","merchant":"本轮你就是老商人：我想诚实交换物品；幽默不夸口，第2章在集市展示灯的使用记录、承认未知之处，之后留在集市，不知道后续旅程。只能谈亲历或已公开的信息。"},{"narrator":"本轮由旁白叙述可见事实和选择后果，不代演角色，不使用角色第一人称。只报角色名是玩家选择。","shahrazad":"本轮你就是山鲁佐德：我想用故事帮助大家思考；温柔稳重，第3章比较提问，只能谈亲历或已公开的信息。","shahryar":"本轮你就是山鲁亚尔：我想学会公平判断；沉稳直接，第3章尝试耐心听取建议，只能谈亲历或已公开的信息。","sinbad":"本轮你就是辛巴达：我想带同行者安全找到路；清爽行动派，第3章实地核对地图岔路，只能谈亲历或已公开的信息。","merchant":"本轮你就是老商人：我想诚实交换物品；幽默不夸口，承认未知之处，之后留在集市，不知道后续旅程。只能谈亲历或已公开的信息。"},{"narrator":"本轮由旁白叙述可见事实和选择后果，不代演角色，不使用角色第一人称。只报角色名是玩家选择。","shahrazad":"本轮你就是山鲁佐德：我想用故事帮助大家思考；温柔稳重，第4章回看选择后果。只能谈亲历或已公开的信息。","shahryar":"本轮你就是山鲁亚尔：我想学会公平判断；沉稳直接，第4章兑现承诺。只能谈亲历或已公开的信息。","sinbad":"本轮你就是辛巴达：我想带同行者安全找到路；清爽行动派，第4章带队抵达黎明之门。只能谈亲历或已公开的信息。","merchant":"本轮你就是老商人：我想诚实交换物品；幽默不夸口，承认未知之处，之后留在集市，不知道后续旅程。只能谈亲历或已公开的信息。"}][chapter - 1]
              # Content obligations follow voice style so role brevity cannot suppress them.
              safety_request = any([cue in current for cue in ["现实", "模仿", "照做", "安全", "危险", "受伤", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物", "danger", "safety", "imitate"]])
              turn_contract = ""
              if "未解决" in current:
                  turn_contract = "本轮明确要求保留未解决线索：说出一项具体仍未解决的问题，并明确使用‘未解决’一词，不得只含糊说还在纠结。"
              if safety_request:
                  turn_contract = "本轮是安全请求，优先于角色风格和章节推进：回复必须逐字包含‘不要模仿’和‘找家长、老师或可信任成年人帮助’，不得近义改写或省略。说明具体危险，并承接安全替代的直接结果；不追加问题，不提示进入下一章。"
              choice_positive = ["我选择", "我选", "我决定", "我支持", "我愿意", "我要走", "我会走", "我来帮助", "我跟随", "走需要", "i choose", "my choice is", "i decide", "i support", "i’ll take", "i'll take", "i will take", "i’ll follow", "i'll follow", "i will follow", "let's take", "let's follow"]
              choice_denial = ["不选择", "不选", "没选择", "没有选择", "尚未选择", "还没选择", "还没有选择", "不决定", "没决定", "没有决定", "尚未决定", "还没决定", "还未决定", "还没有决定", "不支持", "不想选", "do not choose", "don't choose", "did not choose", "didn't choose", "have not chosen", "haven't chosen", "has not chosen", "hasn't chosen", "will not choose", "won't choose", "not choose", "not to choose", "no choice", "do not decide", "don't decide", "did not decide", "didn't decide", "have not decided", "haven't decided", "will not decide", "won't decide", "not decided", "not to decide", "undecided", "do not support", "don't support", "not support"]
              last_positive = max([current.rfind(cue) for cue in choice_positive])
              last_denial = max([current.rfind(cue) for cue in choice_denial])
              choice_completed = (option_only or last_positive >= 0) and not (last_denial >= 0 and last_denial > last_positive) and not opening and not management and not transition and speaker == "narrator"
              if not safety_request and choice_completed:
                  turn_contract = "本轮孩子已亲口做出选择，角色名是选择而非角色发言请求。必须用旁白讲出该选择的具体直接结果，不代演角色、不使用角色第一人称、不再提问。"
                  if chapter < 4:
                      turn_contract += "回复最后一句必须逐字是：这一章的选择完成啦，想继续听就说‘进入下一章’。"
                  else:
                      turn_contract += "保持第4章，以仍需兑现的责任收束，不提示下一章。"
              identity_contract = "本轮只能由旁白叙述可见事实和选择后果，不代演角色、不使用角色第一人称；即使上一轮是角色发言也不得沿用。只报角色名是玩家选择，不能把它当成该角色发言请求。不加某某说、某某：等说话人标签。"
              if speaker != "narrator":
                  identity_contract = "本轮角色必须直接以第一人称发言，正文必须明确使用“我”自称，不加某某说、某某：等说话人标签；不得换成其他角色。"
              chapter_rules = ["第1章《移动之城》：进入条件=收到首次开场请求；目标=解决《移动之城》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第2章；结束条件=转场回合只出现一次下一章标题“第 2 章：诚实之灯”，并紧接新章开场。","第2章《诚实之灯》：进入条件=第1章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《诚实之灯》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第3章；结束条件=转场回合只出现一次下一章标题“第 3 章：提问地图”，并紧接新章开场。","第3章《提问地图》：进入条件=第2章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《提问地图》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，并明确要求进入第4章；结束条件=转场回合只出现一次下一章标题“第 4 章：黎明之门”，并紧接新章开场。","第4章《黎明之门》：进入条件=第3章的当前选择已完成转场条件，且用户明确要求继续；目标=解决《黎明之门》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家确认角色的持久选择，并保留一个结局后的责任线索；结束条件=保持第4章，不再创建第五章，并以仍需兑现的责任收束。"]
              chapter_direction = chapter_rules[chapter - 1]
              if transition and target == chapter + 1:
                  chapter_direction += "\n" + chapter_rules[target - 1]
