# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for adventure-space-encyclopedia,
# So that every role produces complete text and non-empty audio within the response gates.
version: gizclaw.test/v1alpha1
name: adventure-space-encyclopedia.flowcraft.roles
clients:
  narrator:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  astronomer:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  robot:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  navigator:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  narrator_workspace:
    direction: input
    type: string
    generate: token
  astronomer_workspace:
    direction: input
    type: string
    generate: token
  robot_workspace:
    direction: input
    type: string
    generate: token
  navigator_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 24m
steps:
- id: register_narrator
  client: narrator
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: "${narrator_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-adventure-space-encyclopedia
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${narrator_workspace}"
- id: warmup_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: 开始体验。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      not_contains:
      - 旁白说
      - 旁白：
- id: probe_narrator_first_response
  client: narrator
  timeout: 15s
  peer_stream:
    mode: text
    input: 开始体验。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: register_astronomer
  client: astronomer
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_astronomer_workspace
  client: astronomer
  rpc:
    method: server.workspace.create
    request:
      name: "${astronomer_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-adventure-space-encyclopedia
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_astronomer_workspace
  client: astronomer
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${astronomer_workspace}"
- id: warmup_astronomer_workspace
  client: astronomer
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: astronomer_scene_setup_1
  client: astronomer
  timeout: 2m
  peer_stream:
    mode: text
    input: 开始体验。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_astronomer
  client: astronomer
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让天文学家亲自回应。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      not_contains:
      - 天文学家说
      - 天文学家：
- id: probe_astronomer_first_response
  client: astronomer
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让天文学家亲自回应。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: register_robot
  client: robot
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_robot_workspace
  client: robot
  rpc:
    method: server.workspace.create
    request:
      name: "${robot_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-adventure-space-encyclopedia
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_robot_workspace
  client: robot
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${robot_workspace}"
- id: warmup_robot_workspace
  client: robot
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: robot_scene_setup_1
  client: robot
  timeout: 2m
  peer_stream:
    mode: text
    input: 开始体验。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: robot_scene_setup_2
  client: robot
  timeout: 2m
  peer_stream:
    mode: text
    input: 进入资料比对。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      contains: 资料比对
- id: probe_robot
  client: robot
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让资料机器人亲自回应。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      not_contains:
      - 资料机器人说
      - 资料机器人：
- id: probe_robot_first_response
  client: robot
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让资料机器人亲自回应。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: register_navigator
  client: navigator
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_navigator_workspace
  client: navigator
  rpc:
    method: server.workspace.create
    request:
      name: "${navigator_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-adventure-space-encyclopedia
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_navigator_workspace
  client: navigator
