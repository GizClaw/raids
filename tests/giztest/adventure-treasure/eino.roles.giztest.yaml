- id: create_old_sailor_workspace
  client: old-sailor
  rpc:
    method: server.workspace.create
    request:
      name: "${old_sailor_workspace}"
      collection: raidtest-targets
      workflow_name: eino-adventure-treasure
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
