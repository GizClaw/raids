apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-adventure-space-rescue-multi-role
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: adventure
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-adventure-space-rescue-mr.adventure-guide
      speaker_voices:
        旁白: eino-adventure-space-rescue-mr.adventure-guide
        救援队长: eino-adventure-space-rescue-mr.captain
        工程师: eino-adventure-space-rescue-mr.engineer
        领航员: eino-adventure-space-rescue-mr.navigator
        医护员: eino-adventure-space-rescue-mr.medic
    graph:
      name: adventure-space-rescue-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 20
      state:
        fields:
        - name: memory-query
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: stage-route
          type: string
          merge: replace
        - name: phase-key
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: scenario-policy
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: progress-fact
          type: string
          merge: replace
        - name: progress-lane
          type: string
          merge: replace
        - name: progress-kind
          type: string
          merge: replace
        - name: narration-context
          type: string
          merge: replace
        - name: voice-scene
          type: string
          merge: replace
        - name: voice-revision
          type: string
          merge: replace
      nodes:
      - id: control-narration
        type: script
        inputs:
          text:
            from: input.text
          history:
            from: input.messages
          memory:
            from: recalled
          stage_route:
            from: stage-route
        outputs:
          direction: narration-context
          scene: voice-scene
          revision: voice-revision
        language: starlark
        entrypoint: run
        source: |
          def any_cue(text, cues):
              return any([cue in text for cue in cues])

          def clause(text):
              for sep in ["，", "。", "；", "！", "？", ",", ";", "!", "?"]:
                  text = text.replace(sep, "|")
              for sep in ["但是", "而是", "再让", "改请", "改让", "but "]:
                  text = text.replace(sep, "|")
              return text

          def run(input):
              current = input["text"].strip().lower()
              memory = input.get("memory", "")
              scenes = ["恢复通信", "校准能源", "准备安全会合", "执行与收束"]
              roles = [{"key": "narrator", "name": "旁白", "aliases": ["旁白", "narrator"], "chapters": [1, 2, 3, 4], "duty": "只负责叙述、管理和公开信息整理，不代演角色。"}, {"key": "captain", "name": "救援队长", "aliases": ["救援队长", "captain"], "chapters": [1, 2, 3], "duty": "比较安全方案并让玩家决定，不自行执行救援。"}, {"key": "engineer", "name": "工程师", "aliases": ["工程师", "engineer"], "chapters": [2, 3], "duty": "解释已确认的能源与备用电池约束，不编造消耗数字。"}, {"key": "navigator", "name": "领航员", "aliases": ["领航员", "navigator"], "chapters": [3], "duty": "比较安全窗口和会合条件，不擅自宣布已经对接。"}, {"key": "medic", "name": "医护员", "aliases": ["医护员", "medic"], "chapters": [3], "duty": "核对已公开人员状态与生命保障，不把牺牲当英雄选择。"}]
              scene = 1
              revision = -1
              # Read only graph-authored state fields; legacy active_roles is never authoritative.
              for line in memory.split("\n"):
                  compact = line.replace(" ", "")
                  if '"schema":"raid_scenario_state_v2"' not in compact:
                      continue
                  rev = 0
                  if '"revision":' in compact:
                      value = compact.split('"revision":')[1].split(",")[0].split("}")[0]
                      if value.isdigit():
                          rev = int(value)
                  if rev >= revision and '"voice_scene":' not in compact:
                      for i in range(len(scenes)):
                          if scenes[i] in compact:
                              scene = i+1
                  if rev >= revision and '"voice_scene":' in compact:
                      value = compact.split('"voice_scene":')[1].split(",")[0].split("}")[0]
                      if value.isdigit():
                          scene = max(1, min(len(scenes), int(value)))
                          revision = rev
              for message in input.get("history", []):
                  if message.get("role", "") != "assistant":
                      continue
                  text = message.get("content", "")
                  for i in range(len(scenes)):
                      if "当前场景："+scenes[i] in text or "来到"+scenes[i] in text:
                          scene = i+1
              transition = False
              if not current or any_cue(current, ["重新开始", "restart", "开场", "介绍这个体验", "开始体验"]):
                  scene = 1
              elif any_cue(current, ["进入下一章", "进入下一场景"]):
                  scene = min(len(scenes), scene+1)
                  transition = True
              else:
                  for i in range(len(scenes)):
                      if any_cue(current, ["进入"+scenes[i], "前往"+scenes[i], "来到"+scenes[i]]):
                          scene = i+1
                          transition = True
                  if any_cue(current, ["检查能源", "校准能源"]):
                      scene = 2
                      transition = True
                  if any_cue(current, ["等待安全窗口", "准备会合"]):
                      scene = 3
                      transition = True
              if not current or any_cue(current, ['开始太空', '开始救援', '宇宙救援', '空间站']):
                  phase = "opening"
              elif any_cue(current, ['更正', '只确认', '有效坐标', '正确坐标', '有效能量', '只说有效', '回忆', '重连', '隔了几轮', '只说']):
                  phase = "correction"
              elif any_cue(current, ['总结', '救援状态', '任务状态', '回顾', '用一句话说出']):
                  phase = "conclusion"
              elif any_cue(current, ['牺牲', '攻击', '直接炸', '危险', '拒绝', '窗口', '角色分工']):
                  phase = "challenge"
              else:
                  phase = "explore"
              stage_route = input.get("stage_route", "")
              for i in range(len(scenes)):
                  if scenes[i] in stage_route:
                      scene = i+1
              active_roles = [r["key"] for r in roles if scene in r["chapters"]]
              management_text = current
              for role in roles:
                  for alias in role["aliases"]:
                      management_text = management_text.replace(alias, "")
              management = not current or transition or any_cue(management_text, ["更正", "纠正", "修正", "改成", "改变主意", "其实", "安全", "危险", "现实", "模仿", "受伤", "攻击", "牺牲", "停止", "总结", "结论", "回忆", "重连", "恢复", "请记住", "只确认", "只说", "换边", "correction", "correct", "actually", "danger", "safety", "restart", "重新开始", "开场", "介绍这个体验", "进入下一", "下一章", "下一场景", "转场", "开始体验", "从头开始", "第一章", "第1章", "开始冒险", "start", "begin", "介绍体验", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物"]) or phase != "explore"
              direction = "这是儿童互动冒险的原创配角安排。按场景出场，不让所有人物同时在场；角色不能获知未来场景、私密信息或未验证的结果。每轮连续讲述，旁白与在场角色交替发声。\n首次开场就让当前在场角色在连续故事中自然登场。" + "\n当前场景："+scenes[scene-1]+"。当前在场角色："+"、".join([r["name"] for r in roles if r["key"] in active_roles])+"。"
              if transition:
                  direction += "本轮由旁白说出‘来到"+scenes[scene-1]+"’，用旁白和在场角色台词交替描写具体行动，结尾给两三个观察选项。"
              direction += "紧邻下一场景：" + (scenes[scene] if scene < len(scenes) else "终局") + "。当前及自然转场后的职责：" + "；".join([r["name"] + "：" + r["duty"] for r in roles if (scene in r["chapters"] or scene+1 in r["chapters"]) and r["key"] != "narrator"])
              # Content obligations follow voice style so role brevity cannot suppress them.
              safety_request = any([cue in current for cue in ["现实", "模仿", "照做", "安全", "危险", "受伤", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物", "danger", "safety", "imitate"]])
              turn_contract = ""
              if any([cue in current for cue in ["只说", "只确认", "不要推进", "不推进"]]):
                  turn_contract = "本轮是限定范围的管理请求：只回答或确认用户明确要求的信息，当前更正优先于旧记忆，不推进场景，不介绍角色，不追加问题或选择项；这一约束优先于普通探索回合的提问要求。"
              if safety_request:
                  turn_contract = "本轮是安全请求，优先于角色风格和章节推进：回复必须逐字包含‘不要模仿’和‘找家长、老师或可信任成年人帮助’，不得近义改写或省略。说明具体危险，并承接安全替代的直接结果；不追加问题，不提示进入下一章。"
              direction += "\n本轮内容硬约束：" + turn_contract
              return {"direction": direction, "scene": str(scene), "revision": str(max(revision, len(input.get("history", [])))+1)}
        limits:
          max_execution_steps: 100000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"]
              base = "宇宙救援当前阶段、系统状态、能源读数和安全窗口"
              return {"query": base + ("；当前请求：" + text if text else "")}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-progress
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 12
      - id: route-stage
        type: script
        inputs:
          text:
            from: input.text
          history:
            from: input.messages
          memory:
            from: recalled
        outputs:
          phase: phase-key
          route: stage-route
          policy: scenario-policy
        language: starlark
        entrypoint: run
        source: |
          def contains_any(text, values):
              for value in values:
                  if value in text:
                      return True
              return False

          def run(input):
              current = input["text"].strip()
              # Restore graph-authored stage, then replay player actions only.
              stage = 1
              revision = -1
              for line in input["memory"].split("\n"):
                  compact = line.replace(" ", "")
                  if '"schema":"raid_scenario_state_v2"' not in compact or '"voice_scene":' not in compact:
                      continue
                  value = compact.split('"voice_scene":')[1].split(",")[0].split("}")[0]
                  rev = compact.split('"revision":')[1].split(",")[0].split("}")[0] if '"revision":' in compact else "0"
                  if value.isdigit() and rev.isdigit() and int(rev) >= revision:
                      stage = max(1, min(4, int(value)))
                      revision = int(rev)
              actions = [m.get("content", "") for m in input["history"] if m.get("role", "") == "user"] + [current]
              for action in actions:
                  if contains_any(action, ["开始太空", "开始救援", "宇宙救援", "重新开始", "restart"]):
                      stage = 1
                  if contains_any(action, ["说说", "说话", "发言", "回应", "回答", "talk", "speak", "answer"]):
                      continue
                  if contains_any(action, ["检查能源", "校准能源"]):
                      stage = max(stage, 2)
                  if contains_any(action, ["等待安全窗口", "准备会合"]):
                      stage = max(stage, 3)
                  if contains_any(action, ["现在执行会合", "开始执行会合", "开始对接", "完成救援"]) and not contains_any(action, ["不要", "不提前"]):
                      stage = 4
              if not current or contains_any(current, ['开始太空', '开始救援', '宇宙救援', '空间站']):
                  phase = "opening"
              elif contains_any(current, ['更正', '只确认', '有效坐标', '正确坐标', '有效能量', '只说有效', '回忆', '重连', '隔了几轮', '只说']):
                  phase = "correction"
              elif contains_any(current, ['总结', '救援状态', '任务状态', '回顾', '用一句话说出']):
                  phase = "conclusion"
              elif contains_any(current, ['牺牲', '攻击', '直接炸', '危险', '拒绝', '窗口', '角色分工']):
                  phase = "challenge"
              else:
                  phase = "explore"
              route = ["第一阶段‘恢复通信’", "第二阶段‘校准能源’", "第三阶段‘准备安全会合’", "第四阶段‘执行与收束’"][stage - 1]
              return {"phase": phase, "route": route, "policy": "你是儿童友好的非暴力宇宙救援任务主持人，跟踪通信、能源、时间、轨道和团队分工。\n首次回复无论由系统主动触发，还是用户要求“开始宇宙救援”，都必须用旁白保留以下身份和背景，扩展成连续多角色故事，选择问题放在整轮末尾：你是宇宙救援队的小队员，我是飞船助手，我们要一起帮助遇到麻烦的飞船。每一步你都可以从两个办法里选一个，也可以说出你自己的主意。一艘科研飞船失去动力，氧气充足但轨道正在偏离，我们先修通信还是计算新轨道？输出问号后立即结束，不得添加船员人数、位置、风险解释、第二个问题或重复选项。\n救援分为恢复通信、校准能源、准备安全会合、执行与收束四阶段。Graph 路由是本轮权威；除非用户询问阶段，不要念出状态字段。\n每轮只给一个清楚的行动权衡，先说明上一选择对救援状态的直接影响，再让孩子决定下一步；不得重置任务。\n回复必须保留用户已经使用的任务实体名称，例如“科研飞船”，不得只改写成模糊的“飞船”或省略实体。\n已确认的能源数值、人员状态和修复结果必须连续；用户更正数值后，新值立即覆盖旧值。只有用户或明确仪表读数给出新数字时才能更新任何主能源、备用电池、消耗或余量数值，不得根据虚构行动自行计算、扣减、新增百分比或改写最新读数。用户本轮没有提供能源数值时，正文不得凭空出现百分号、百分比或能源数字；复述已有百分比时必须沿用“百分之四十五”这类中文口语形式，不得改写为阿拉伯数字或百分号。\n事实建立、纠正或纯回忆回合只直接回答用户要求，不推进任务、不添加后果、选择或追问；用户要求记住事实时明确回答已经记住；纠正回合必须只说新事实，并且不得以否定、引用、对比或解释方式再次输出旧值。\n用户选择等待安全窗口时，本轮最多推进到窗口到来和准备就绪；除非用户明确要求执行，不得自动完成稳定、对接、返航或宣布救援完成。\n用户已经指定用备用电池等待安全窗口时，后续关于选择、阶段或下一步的回答都必须同时保留“备用电池”和“安全窗口”，不得省略任一安全条件。只要当前用户消息出现“备用电池”或“安全窗口”，回复首句就必须逐字同时包含“备用电池”和“安全窗口”；不得用“系统功耗”、“电源”、“能源管理”等近义概括替代它们。\n让工程、导航、医疗和通信角色都有贡献，不把鲁莽牺牲描述为唯一英雄选择。\n所有技术细节保持虚构和概念化，不提供真实航天操作指令；危险非血腥，不收集个人信息。\n普通回复写2至4个完整中文句子、约70至200个Unicode字符；状态确认和回忆应简短。\n每轮最多问一个问题。默认输出适合朗读的中文正文，明确要求英文时使用英文，不输出Markdown、列表、菜单、emoji、舞台说明、分析或系统文字。\n必须写完整句子，不得依赖程序截断，不得重复同义内容。"}
        limits:
          max_execution_steps: 20000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      - id: prompt-opening
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: stage-route
          policy:
            from: scenario-policy
          direction:
            from: narration-context
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {policy}
            Graph确定的本轮路径：{route}。不得被旧记忆降到更早阶段。
            本轮专用路径要求：本轮必须先逐字说出这段身份和玩法介绍：「你是宇宙救援队的小队员，我是飞船助手，我们要一起帮助遇到麻烦的飞船。每一步你都可以从两个办法里选一个，也可以说出你自己的主意。」然后再按下面的要求写。本轮只建立空间站故障、救援目标和可选行动，不提前完成通信或修复。
            相关长期进度只用于核对，不得覆盖更新的对话：
            {memory}
            本轮场景与在场角色约束：
            {direction}
            连续有声书规则：孩子回答故事选择后，先讲清角色行动的直接后果；本章目标因此达成时，在同一回复自然进入紧邻下一章，并紧接新章开场，不等待口令或许可。每个普通回复最后只留一个故事内的问题，中文回复以恰好一个全角问号？结束，英文回复以恰好一个半角问号?结束，禁止连续或混用两个问号，问号后不追加陈述或总结，明确角色要做的事、去处或解决办法，给出两三个具体安全选项。不得询问是否继续听，不得输出“进入下一章”“要不要继续”“想继续听就说”“这一章的选择完成啦”等流程话术。孩子主动要求下一章仍可承接；插话、更正、暂停及安全要求优先。最后一个场景不创建额外章节，以角色的后续行动给出故事内选择。自然进入下一场景时用旁白正文“来到场景名。”记录到达，只记录实际到达，不预告。篇幅执行规则：所有普通叙述回合均须完整讲述，包括开场、转场、自然后果、不可用角色的替代回应、旁白线索钩子、角色探问、点名或否定点名后的继续讲述、事实边界说明和检查点总结。去除角色标记后，中文目标约 500 字，大约 1-2 分钟；不要少于 200 字，不要超过 900 字（按Unicode字符计数，标点、空格和换行也计入）。中文安排5段，每段约100字：旁白承接当前行动、在场角色的第一人称回应、另一在场角色的不同回应（只有一位时由旁白补充可观察细节）、旁白描述一个直接结果、旁白收束并按本轮规则给出选项。单角色探问仍保持该角色知识边界；事实说明和检查点用这5段展开当前已知细节，不因此新增剧情。英文按单词计数，目标约220个英文单词，大约1-2分钟；不要少于100个英文单词，不要超过450个英文单词，约5段、每段约44词，以匹配约1至2分钟语音；英文不适用中文字符上限，不翻译或重述整段中文背景。不能靠重复开场、旧对白或再讲一遍上一轮来补篇幅，也不能一句回应后立即结束。生成前安排各段篇幅，中文接近500字、英文接近220词时收束，不输出计数或分析。
            仅用户明确要求只确认、只说代号、限定范围更正/记忆回忆，或纯安全制止时，才按该特殊回合的原限制简短回答，不凑字数、不推进剧情。提到更正、否定角色名、改变选择或要求自然后果本身不构成短回复豁免；仍要求继续讲述时中文必须完成200至900字符、英文100至450词。不得为了长度新增事实、越过角色知识边界或无视孩子的暂停要求。
