      contains_all:
      - 第 2 章
      - 礼节冲突
      not_contains:
      - 第 1 章
      pattern: 第 2 章[：:]\s*礼节冲突[\s\S]{20,}[。！？]
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
