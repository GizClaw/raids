# User Story:
# As a function-chat user,
# I want parallel answer and native-control lanes using Seed 2.1 Lite,
# So that one selected reply preserves ordinary Chat and actual device results.
version: gizclaw.test/v1alpha1
name: chat-assistant.soak.eino.function-chat
clients:
  eino_function_chat:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
  eino_function_chat_tester:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  test_brief:
    direction: input
    type: string
    value: BEGIN eino-chat-assistant long-form-correction-format-and-reload
  eino_function_chat_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_function_chat_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_function_chat_verdict:
    direction: output
    type: string
  eino_function_chat_reload_handoff:
    direction: output
    type: string
repeat: 1
timeout: 52m
steps:
- id: eino_function_chat_register_candidate
  client: eino_function_chat
  rpc:
    method: server.register
    request:
      token: ${registration_token}
- id: eino_function_chat_register_tester
  client: eino_function_chat_tester
  rpc:
    method: server.register
    request:
      token: ${registration_token}
- id: eino_function_chat_create_candidate_workspace
  client: eino_function_chat
  rpc:
    method: server.workspace.create
    request:
      name: ${eino_function_chat_candidate_workspace}
      workflow_name: function-assistant
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          safety_fence_level: 'off'
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_function_chat_create_tester_workspace
  client: eino_function_chat_tester
  rpc:
    method: server.workspace.create
    request:
      name: ${eino_function_chat_tester_workspace}
      workflow_name: chat-assistant-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          safety_fence_level: 'off'
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_function_chat_select_candidate_workspace
  client: eino_function_chat
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: ${eino_function_chat_candidate_workspace}
- id: eino_function_chat_warmup_candidate_workspace
  client: eino_function_chat
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_function_chat_select_tester_workspace
  client: eino_function_chat_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: ${eino_function_chat_tester_workspace}
- id: eino_function_chat_run_dialogue_before_reload
  timeout: 30m
  workspace_relay:
    first_client: eino_function_chat_tester
    second_client: eino_function_chat
    input: ${test_brief}
    media: text
    idle_timeout: 90s
    max_turns: 18
    terminal_client: eino_function_chat
  capture:
    eino_function_chat_reload_handoff: /terminal/text
  expect:
    /terminal/client:
      equals: eino_function_chat
    /completed_turns:
      equals: 18
    /turns/eino_function_chat/count:
      equals: 9
    /turns/eino_function_chat_tester/count:
      equals: 9
    /turns/eino_function_chat/first_text_ms/max:
      maximum: 6000
- id: eino_function_chat_reload_candidate_workspace
  client: eino_function_chat
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: eino_function_chat_run_dialogue_after_reload
  timeout: 12m
  workspace_relay:
    first_client: eino_function_chat_tester
    second_client: eino_function_chat
    input: ${eino_function_chat_reload_handoff}
    media: text
    idle_timeout: 90s
    max_turns: 7
    terminal_client: eino_function_chat_tester
  capture:
    eino_function_chat_verdict: /terminal/text
  expect:
    /terminal/client:
      equals: eino_function_chat_tester
    /terminal/text:
      pattern: ^\s*PASS\s*$
    /completed_turns:
      equals: 7
    /turns/eino_function_chat/count:
      equals: 3
    /turns/eino_function_chat_tester/count:
      equals: 4
    /turns/eino_function_chat/first_text_ms/max:
      maximum: 6000
- id: eino_function_chat_emit_verdict
  output:
    variable: eino_function_chat_verdict
finally:
- id: eino_function_chat_stop_candidate_run
  client: eino_function_chat
  rpc:
    method: server.run.stop
    request: {}
- id: eino_function_chat_stop_tester_run
  client: eino_function_chat_tester
  rpc:
    method: server.run.stop
    request: {}
- id: eino_function_chat_delete_candidate_workspace
  client: eino_function_chat
  rpc:
    method: server.workspace.delete
    request:
      name: ${eino_function_chat_candidate_workspace}
- id: eino_function_chat_delete_tester_workspace
  client: eino_function_chat_tester
  rpc:
    method: server.workspace.delete
    request:
      name: ${eino_function_chat_tester_workspace}
- id: eino_function_chat_delete_candidate_peer
  client: eino_function_chat
  rpc:
    method: server.peer.delete
    request: {}
- id: eino_function_chat_delete_tester_peer
  client: eino_function_chat_tester
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
