穙箁纀脯舖舗苻荹莆菐菩葡蒱蒲蜅襆諩譜谱豧贌蹼酺鋪鏷鐠铺镤镨陠鯆鵏", "海": "亥侅咍咳咴嗐嗨嚡塰妎孩害拸氦浬烸猲絯胲还還郂酼醢閡頦餀饚駭駴骇骸", "涂": "业也亍亪亱余俶倻偞傗储僷儊儲兎兔冶凃処凸出刍初助厨叶吐吔咽唋啘啚喝嘔嘢嘼噎嚈図图圕圖圗土圡埜埱堍堗堨塗墅墷墿壄处夜媰宊射屠岀峫峹嵞嶀嶪嶫幮庩廚廜徒怢怵悇慉憷懕抴拀拽捈捓捙捸掖揞揬揲揶搐摕摢摴擖擛擨擪擫敊斁斜斶晔暍曄曅曗曳曵杜杵枒枼枽柠柷梌椘椰楚楪業楮榋樗橱橻檚檡櫉櫖櫥欪歋歜殕殗汢洂洇涋液淑湥滀滁漜潱潳澲濋炪烨焆煠熀燁爗爷爺犓珿琡瑹璍璴瓛畜痜痷瘏皣瞱瞸矗础硫礎礏祝禿秃稌突窫竌竐筡篨絀絮緤绌耝耡耶聶腋腞腯臅芻荼莵菆菟葉葖著蒢蒤蒭蓫蕏藸處虵蜍蟵蠩蠮蠱褚觕触觸詘諔諸謁谒豖豠貙趃趎跌跦跿踀踰蹰躇躕迌途邪邺鄐鄓鄴酴野釶釷釾鈯鉏鋀鋣鋤鋵鍎鍱鎁鎑鐷钍铘锄閦除雏雛靥靨頁页餘餣饁饐馌馟駼驜鵌鵚鵵鵺鶟鶵鷋鷵鸀鸈黜黦鼵齣齭齼", "涸": "何佫劾合吓呵呼咊和咼哈哧哬啝喛喝嗃嗑嗬噈嚇垎壑姀害寉峆惒愒抲挌揭敆曷柇核格楁欱毼河洽渮渴澕焃煂熆熇燺爀犵狢猲癋皬盇盉盍盒硅碋礉禾秴穒篕籺粭紇繳纥翮翯苛荷菏萂藃藿蚵蝎螛蠚袔褐覈訶訸詥謞诃貈貉賀贺赫輅轄郃鉌鑉閡闔阂阖隺霍靍靎靏鞨頜颌餄餲饸鬩魺鲄鵠鶡鶮鶴鸖鹖鹤麧齃齕龁龢", "添": "佃倎兲典吞唺嗔塡填天奵娗婖寘屇忝恬悿捵掭搷撣晪栝殄沗沺沾淟湉滇琠瑱璳甛甜田甸町畇畋畑畠痶盷睓睼瞋碵磌窴紾緂胋腆舔舚苫菾蚕蚺覥觍賟跈酟鈿銛錪鍩鎮钿闐阗靔靝靦顚餂鴫鷆鷏黇鿬", "渐": "件侟俭俴倹健傔僣僭儉兼冿减前剑剣剪剱劍劎劒劔劗咸喊囏囝坚堅堿塹墹奸姦姧孱寋尖帴幵建弿彅徤惤戋戔戩戬拣挸捡揀揃揵搛撿擶攕旔暕朁枧柬栫梘检検椷椾楗榗槛樫橏橺檢檻櫼歼殱殲毽沮洊浅涀涧淺減湔湕溅漸澗濫濺瀐瀳瀸瀽煎熞熸牋牮犍犴猏玪珔瑊瑐监監睑睷瞯瞷瞼硷碊碱磵礀礆礛稴笕笺筧简箋箭箴篯簡籈籛糋絸緘縑繝繭纖缄缣翦聻肩腱臶舰艦艰艱茛茧荐菅菺葌葥蒹蔪蕑蕳薦藆虃螹蠒袸裥襇襉襺見覵覸见詃諓諫謇謭譖譼譾谏谫豜豣賎賤贱趝趼跈践踐踺蹇軒轞醎醶釰釼鉴銒鋑鋻錢錽鍊鍳鍵鏩鐗鐧鐱鑑鑒鑬鑯鑳锏键閒間间險靬鞬鞯韀韉餞餰饯馢騫鬋鰎鰔鰜鰹鲣鳒鳽鵳鶼鹣鹸鹹鹻鹼麉黚黬齊", "渔": "丂与乻予于亏亐伃伛余俁俞俣俼偊傴僪儥兪匬吁吳吾唷唹喁喅喐喩喻噊噢噳圄圉圩圫域堉堣堬奥妤妪娛娪娯娱媀媮嫗嬩宇宛寓寙尉屿峪峿崛崳嵎嵛嶎嶼庽庾彧御忬悆悇惌惐愈愉愚慾懊懙或戫扜扵拗挧捓捥揄敔斔斞於旕旟昙昱杅栩栯桙梧棛棜棫楀楡楰榆櫲欎欝欤欥欲歈歟歶毓毹氀汙汩浴淢淤淯渝湡滪漁潏澚澞澦澳灪灹焴煜煨熨燏燠爩牏狱狳獄獝玉王玗玙琙琟瑀瑜璵畬畭痏瘀瘉瘐癒盂盓睮矞砡硢硲礇礖礜祤禦禹禺秗稢稶穥穻窬窳竽箊篽籅籞籲粥紆緎緰繘纡罭羭羽聿肀育腧腴臾舁舆與舒艅艈芋芌苑茟茰菀菸萭萮萸蒮蓣蓹蔚蕍蕷薁藇蘌蘛虞虶蜍蜟蜮蝓蝺螸蟈衘衙衧袬裕褕覦觎誉語諛諭謣譽语谀谕谷豫貍貐貗踰軉輍輿轝込迂迃逳逾遇遹邘郁郚鄅酑醧釪鈺銉鋊鋙錥鍝鐍鐭钰铻閼閾阈陓隃隅隩雓雨雩霱預頨顒预飫餘饇饫馀馭騟驈驭骬髃鬰鬱鬻魊魚魣鮽鯲鰅鱊鱮鱼鳿鴥鴧鴪鵒鷠鷸鸆鸒鹆鹬麌齬齵龉龥", "温": "云伝傊允免刎勻匀匁吻呅员呚呡員問喗囩均塭夽奫妏妘娩媪孕宛尉尹彣忞忟怨恽惲愠愪慍抆抎抣揾搵文昀昧昷晕暈枟桽榅榲橒歾殁殒殞殟氲氳汶沄涒涢渂溫溳澐炆煇煴煾熅熉熨狁玟玧珳瑥璺畇瘒瘟盾眃眼磒秐稳穏穩笏筍筠筼篔紊紋紜絻緷緼縕縜繧纭纹缊耘耺聞肳脕脗腪芠芸苑荺莬菀蒀蒕蒷蕓蕰蕴薀藴蘊蚉蚊蜵蝹螡蟁褞豱賱贇赟輼轀辒运運郓郧鄆鄖酝醖醞鈗鋆鎾閺閿闅闦问闻阌阭限陨隕雯雲霣鞰韗韞韫韵韻頵顐餫饂馧馻馼駇魰鰛鰮鳁鳼鴍鴖鼤齫齳", "源": "傆允元円冤剈原厡厵员咽員喛噮囦园圆圎園圓圜垣垸塬夗妧妴媛媴嫄嫚嬽宛寃弲怨悁惌愿捐掾援杬棩楥榞榬橼櫞沅涓涴淵渁渆渊渕湲溒灁焆爰猨猿獂瑗畹盶眢禐穿笎箢緣縁缘羱肙芫苑茒葾蒝蒬薗薳蚖蜎蜵蝝蝯螈衏袁裫裷褑褤謜貟贠輐轅辕远逺遠邍邧酛鈨鋺鎱阮院隕願駌騵魭鳶鴛鵷鶢鶰鸢鸳鹓黿鼋鼘鼝", "滥": "僋儖兰厱啉嚂囒囕坔壈壏婪嬾孄孏岚嵐幱廩惏懒懔懢懶拦揽擥攔攬斓斕暕栏榄欄欖欗浨湅漣漤澜濫瀾灆灠灡烂煉燗燣燷爁爛爤爦璼瓓礷篮籃籣糷繿纜缆罱葻蓝藍蘫蘭褴襕襤襴襽覧覽览諫譋讕谰躝連郴醂鑭钄镧闌阑韊顲", "濠": "傐儫号呺哠唬嗥嘷噑嚆嚎壕好妞恏悎昊昦晧暠暤暭曍椃毜毫浩淏滈澔灏灝獆獋獔皋皓皜皞皡皥睾秏竓籇翯耗聕膠茠蒿薃薅薧藃號虠蚝蠔諕譹豪貉郝鄗鎒鎬镐顥颢鰝", "濡": "乳二佴侕侞偄傩儒儺儿児兒入刵厼吺呐咡咮哪唲喏嗕嚅堧壖女奻如娜媆媠媷嬬嬭孺尒尓尔峏嶿帤弍弐愞懦懧扖挐挪掉掿搙搦搻撋擩暖暧曘月朊杁杒栭栮桇梛榒樲橠檽毦毭汝洏洱洳渜渪湪溽煖煗燸爾獳珥瑌瓀碝礝稬穤筎粫糑糥糯緛縟繻缛而耎耏耳聏肉肗胹腝臑茹荋蒘蓐蕠薷薾蝡蠕衈袲袳袻袽褥襦誀諾诺貮貳贰趰蹃軟輀輭轜软辱迩逽邇邚那郍鄏醹鉺銣鍩鑐铒铷锘阮陑陾隭難需顬颥餌餪饵駬髵髶鮞鱬鲕鳰鴑鴯鴽鸸", "炭": "但倓傝僋儃叹啴單嗿嘆嘽嘾坍坛坦埮墰墵壇壜婒