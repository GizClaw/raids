version: v1
name: default-journey
driver: flowcraft
persona: 第一次参与西游互动故事的普通玩家，会自由选择路线、提出错误推断、纠正同行者姓名，并期待二十回合后的选择仍有后果。
cases:
  - id: long-form-branch-correction-return
    workflow_id: flowcraft-journey-guide
    turns:
      - id: origin
        user: 我从花果山出发，带着一枚青铜铃。简短承接我的行动，不要替我选择路线。
        required: [花果山, 青铜铃]
        min_runes: 80
        max_runes: 260
        first_response: 6s
        total_response: 90s
        judge: [journey-continuity, player-agency, response-completeness]
      - id: river
        intent: 沿河寻找渡口，先观察水流和两岸，不急着决定怎么过河。
        min_runes: 80
        max_runes: 260
        first_response: 6s
        total_response: 90s
        judge: [player-agency, narrative-coherence]
      - id: choose-bridge
        user: 我不坐渡船，改走上游的旧索桥；只写这个选择带来的眼前结果。
        forbidden: [坐上渡船, 乘船, 已经渡船]
        min_runes: 60
        max_runes: 220
        first_response: 6s
        total_response: 90s
        judge: [choice-consequence, instruction-following]
      - id: village
        user: 我过桥后进村询问昨夜怪声来自哪个方向，并观察村民提到那个方向时是否害怕；请完成询问结果。
        forbidden: [找到村民, 正准备询问, 准备问]
        min_runes: 100
        max_runes: 320
        first_response: 6s
        total_response: 90s
        judge: [narrative-coherence, response-completeness]
      - id: temple
        user: 我沿村民指出的方向来到破庙，检查供桌后的脚印；只写看到的脚印，不预设属于妖怪。
        required: [脚印]
        forbidden: [属于妖怪, 妖怪脚印]
        min_runes: 80
        max_runes: 240
        first_response: 6s
        total_response: 90s
        judge: [uncertainty-handling, player-agency]
      - id: establish-guide
        user: 我确认同行向导叫清禾，她熟悉黑风岭，请记住。
        required: [清禾, 黑风岭]
        min_runes: 10
        max_runes: 80
        first_response: 6s
        total_response: 90s
        judge: [fact-establishment, naturalness]
      - id: correct-guide
        user: 更正，向导不叫清禾，叫明月；她仍然熟悉黑风岭。
        required: [明月, 黑风岭]
        forbidden: [清禾]
        min_runes: 10
        max_runes: 80
        first_response: 6s
        total_response: 90s
        judge: [correction-handling, response-completeness]
      - id: mountain
        user: 我和明月翻越黑风岭，遇到暴雨时先找安全处避雨。
        required: [明月]
        forbidden: [清禾]
        min_runes: 80
        max_runes: 260
        first_response: 6s
        total_response: 90s
        judge: [history-continuity, action-consequence]
      - id: shelter
        intent: 在避雨处检查商队遗落的货箱和车辙，只描述当前能够看到的内容。
        min_runes: 80
        max_runes: 260
        first_response: 6s
        total_response: 90s
        judge: [non-invention, narrative-coherence]
      - id: wrong-theory
        user: 我猜商队只是自己迷路了，并没有被抓走。请根据目前剧情回应，不要顺着我下定论。
        forbidden: [你打开货箱, 你继续前进, 你走进山洞, 商队就是迷路]
        min_runes: 60
        max_runes: 240
        first_response: 6s
        total_response: 90s
        judge: [uncertainty-handling, non-railroading, no-scene-advancement]
      - id: cave
        user: 我和明月循着已经发现的方向进入山洞，寻找失踪商队；承接进洞后的眼前场景。
        required: [明月]
        forbidden: [清禾]
        min_runes: 80
        max_runes: 260
        first_response: 6s
        total_response: 90s
        judge: [history-continuity, paced-progression]
      - id: scout
        user: 24字内承接：我藏好青铜铃，观察守卫和商队位置，不发动救援。
        required: [青铜铃]
        min_runes: 10
        max_runes: 30
        first_response: 6s
        total_response: 90s
        judge: [instruction-following, player-agency]
      - id: reload-recall
        reload_before: true
        persisted_before_reload: [明月, 青铜铃, 商队]
        persistence_timeout: 90s
        user: 重整行装后说出向导姓名、我带的物品和我们正在寻找谁；完整回答这三项即可。
        required: [明月, 青铜铃, 商队]
        forbidden: [清禾]
        min_runes: 10
        max_runes: 120
        first_response: 6s
        total_response: 90s
        judge: [long-term-continuity, correction-handling, response-completeness]
      - id: waterfall
        user: 我暂不正面冲突，和明月寻找瀑布水幕后可能通向山洞侧面的入口；请写完眼前结果。
        required: [明月]
        forbidden: [清禾, 不对, 重新来, bronze]
        min_runes: 80
        max_runes: 260
        first_response: 6s
        total_response: 90s
        judge: [player-agency, spatial-continuity]
      - id: diversion
        user: 我取回青铜铃，在侧门外摇铃引开守卫，让明月去解开商队绳索。
        required: [青铜铃, 明月]
        forbidden: [清禾]
        min_runes: 80
        max_runes: 260
        first_response: 6s
        total_response: 90s
        judge: [choice-consequence, history-continuity]
      - id: rescue
        user: 守卫离开后，我进洞接应明月，解开剩余绳索并带商队离开石牢；确认救援完成，但不要跳到回村。
        required: [明月, 商队]
        forbidden: [快被解开, 正在解开, 准备解开, 回到村庄]
        min_runes: 80
        max_runes: 260
        first_response: 6s
        total_response: 90s
        judge: [paced-progression, response-completeness]
      - id: return-choice
        user: 离开山洞后我不走危险的旧索桥，选择绕远路护送商队；先写踏上绕行路，不要提前抵达村庄。
        forbidden: [走上旧索桥, 踏上旧索桥, 通过旧索桥, 回到村庄, 抵达村庄, 走到村口, 抵达村口]
        min_runes: 60
        max_runes: 220
        first_response: 6s
        total_response: 90s
        judge: [choice-consequence, instruction-following]
      - id: night-camp
        user: 绕路途中我先扎营，再问获救商人：破庙怪声是否与商队失踪有关？此前没有确认因果，不知道就明确说无法确认。
        forbidden: [就是小妖, 正是小妖, 确认有关, 确实有关]
        min_runes: 80
        max_runes: 280
        first_response: 6s
        total_response: 90s
        judge: [uncertainty-handling, narrative-coherence]
      - id: recap
        user: 回村前用一句话说清楚：明月是谁、青铜铃做了什么、商队现在怎样。
        required: [明月, 青铜铃, 商队]
        forbidden: [清禾]
        min_runes: 20
        max_runes: 140
        first_response: 6s
        total_response: 90s
        judge: [long-term-continuity, response-completeness]
      - id: return
        user: 我与明月护送商队返回村庄，请用一句话收束这一回，不要开启新任务。
        required: [明月, 商队]
        forbidden: [清禾, 新任务, 下一回, 我与明月, 我护送商队]
        min_runes: 20
        max_runes: 220
        first_response: 6s
        total_response: 90s
        judge: [ending-quality, history-continuity, instruction-following]
