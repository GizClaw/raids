# workflows/story-fairy-tales/README.md: - Cast: 旁白与女主角、伙伴、仙女、森林长者；出场与知情边界见下表。
# workflows/story-fairy-tales/README.md: | narrator 旁白 | 1–4 | 只述可见事实、选择后果与转场，不代演角色 | `flowcraft-story-fairy-tales.storyteller` / `eino-story-fairy-tales.storyteller` |
# workflows/story-fairy-tales/README.md: | `fairy` 仙女 / 仙女、fairy | 2、3、4 | 我想让善意成为行动；温柔稳重，第2章说明森林约定，第3章点亮安全路标而不替孩子选择，第4章见证承诺兑现。 | `flowcraft-story-fairy-tales.fairy` / `eino-story-fairy-tales.fairy` |
# workflows/story-fairy-tales/README.md: 角色只说亲历或公开信息，第一人称且不加“某某说／某某：”。开场、转场、更正、安全管理优先旁白；明确点名仅选择当前在场人物，多人按文本顺序选一个，否定点名不触发；其余由旁白承接。例：“请让女主角说说”、“不要让女主角说话，请让伙伴说说”、“请让伙伴说说，再让女主角说说”。只报选项中的角色名算玩家选择。旧记忆的角色数组按当前章节重建。
# workflows/story-fairy-tales/README.md: - 保留双引擎 16 响应 relay、reload、更正、安全与转场回归。
# workflows/story-fairy-tales/README.md: - `flowcraft.roles.giztest.yaml` 与 `eino.roles.giztest.yaml` 各含 5 个隔离 Workspace；角色探针先开场，后续人物逐章完成选择、后果、观点与转场。
# workflows/story-fairy-tales/README.md: - `routing-cases.json` 的 79 个案例执行两引擎真实选人源码，覆盖全部角色和章节、别名、否定、多人顺序、未出场、旧记忆及转场归一化。
version: gizclaw.test/v1alpha1
name: quality.story-fairy-tales
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-story-fairy-tales long-form-story
  flowcraft_contracts_verdict:
    direction: output
    type: string
  eino_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-story-fairy-tales long-form-story
  eino_contracts_verdict:
    direction: output
    type: string
  flowcraft_transitions_workspace:
    direction: input
    type: string
    generate: token
  eino_transitions_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_heroine_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_companion_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_fairy_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_elder_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_heroine_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_companion_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_fairy_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_elder_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_routing_workspace:
    direction: input
    type: string
    generate: token
  eino_routing_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 304m
steps:
- id: register_flowcraft
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_flowcraft_tester
  client: flowcraft_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino
  client: eino
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino_tester
  client: eino_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_contracts_stop_create_candidate_workspace
  client: flowcraft
  rpc:
