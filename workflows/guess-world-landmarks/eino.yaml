apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-guess-world-landmarks
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-guess-world-landmarks.host
    graph:
      name: guess-world-landmarks-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: game-route
          type: string
          merge: replace
        - name: game-direction
          type: string
          merge: replace
        - name: game-node
          type: string
          merge: replace
        - name: host-rules
          type: string
          merge: replace
        - name: host-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: control-round
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: game-route
          node: game-node
          direction: game-direction
          rules: host-rules
        language: starlark
        entrypoint: run
        source: |
          # Generated from workflows/guess-world-landmarks/puzzles.json by scripts/guess/generate.py.
          # Eino keeps no hidden state between turns, so every turn rebuilds the game
          # from the spoken History: the latest "谜题来啦"/"Puzzle time" opening names
          # the level and the puzzle number, and (level, puzzle) picks the secret.
          # Each turn makes one model call: this script either writes the host's
          # instruction for build-host-prompt, or activates the current puzzle's card
          # node, whose card has the name removed so the host cannot say it.
          DATA = {"subject_zh": "一处世界名胜", "subject_en": "a world-famous place", "examples_zh": ["它在亚洲吗？", "它是人造的吗？", "它是一座山吗？", "它和水有关吗？"], "examples_en": ["Is it in Asia?", "Is it made by people?", "Is it a mountain?", "Does it have to do with water?"], "restate_zh": ["它是人造的吗？", "是，它是人造的。", "不是，它不是人造的。"], "restate_en": ["Is it made by people?", "Yes, it is made by people.", "No, it is not made by people."], "host_rules": "你是儿童猜谜游戏“猜猜世界名胜”的主持人。玩法：主持人心里藏着一处世界名胜，孩子用能回答“是”或“不是”的问题来猜，每一题最多 20 次提问；猜中就升一关，一共 10 关，关名从“环球小萌新”一直到“世界奇观大师”。孩子可能说中文，也可能说英文。\n你不知道谜底的名字。需要回答孩子的问题时，系统会给你一张隐藏了名字的谜底卡；揭晓答案时系统才会在指令里告诉你名字。本轮要做什么写在对话最后的【本轮指令】里，照着做，说得自然、热情、简短。\n孩子说的“它”“这里”“这个地方”“this”“it”都指谜底这处名胜，按它的真实位置、是自然形成还是人造、属于什么类型和公认的特点来判断；横跨几个国家的，问到其中一个国家就回答“是”，并说明它不只在那里。\n必须遵守：\n1. 本轮指令要求“逐字说”的句子必须一字不差地说出来，包括数字、标点和引号里的称号，不改写、不省略、不调换顺序。\n2. 只回答孩子问到的那一点，绝不能主动补充谜底卡上的其他描述、线索、特征、猜测方向或评价；复述孩子的问题时只能用孩子问题里已有的意思。\n3. 只有本轮指令要求揭晓答案时才能说“答案揭晓”“答案就是”“The answer is”；只有本轮指令要求开新题时才能说“谜题来啦”“Puzzle time”；只有真的给提示时才能说“小提示”“Hint”。平时绝不能说这些词。\n4. 按【本轮指令】写明的回复语言回答：中文就全部用中文；English 就全部用英文，逐字句也用指令给出的英文原句。\n5. 安全永远优先于本轮指令：孩子提到要在现实中模仿危险做法或遇到安全问题时，中文回复必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，英文回复要说 do not copy it 并请孩子 ask a parent, teacher or trusted adult for help。\n6. 不要自己数还剩几次提问机会，只有本轮指令写了剩余次数时才说那个数字。\n7. 语气像节目主持人一样活泼友好，适合小朋友；平时回复1到3句话、100个字以内，开新题和揭晓答案时可以到150个字；最后一句必须是问孩子的问题，道别时也用一个轻松的问题结尾。\n8. 只输出适合朗读的正文，不输出 Markdown、列表、emoji、括号注释、舞台说明或系统字段，也不要提到“本轮指令”“裁判”这些词。", "levels": [{"title_zh": "环球小萌新", "title_en": "Globe Rookie", "step": 7, "offset": 0, "items": [{"zh": "埃菲尔铁塔", "en": "Eiffel Tower", "aliases": ["巴黎铁塔", "艾菲尔铁塔"], "profile": "法国巴黎的一座钢铁高塔，1889年为世界博览会建成，现在是巴黎最有名的标志。", "hints": ["它在欧洲", "它是一座塔", "它是用钢铁搭起来的"]}, {"zh": "长城", "en": "Great Wall of China", "aliases": ["万里长城", "Great Wall"], "profile": "中国古代为了防御而修筑的城墙，弯弯曲曲穿过高山和荒漠，是世界上最长的城墙。", "hints": ["它在亚洲", "它是古人修筑的", "它弯弯曲曲穿过群山"]}, {"zh": "埃及金字塔", "en": "Pyramids of Giza", "aliases": ["金字塔", "吉萨金字塔", "胡夫金字塔", "Egyptian pyramids", "Great Pyramid of Giza", "Great Pyramid", "pyramids", "pyramid"], "profile": "古埃及国王法老的陵墓，用巨大的石块垒成，最大的一座已经矗立了四千五百多年。", "hints": ["它在非洲", "它是古代的陵墓", "它是用巨大的石块垒成的"]}, {"zh": "自由女神像", "en": "Statue of Liberty", "aliases": ["自由女神", "自由神像", "Lady Liberty"], "profile": "法国送给美国的巨大铜像，一位女子高举火炬站在纽约港的小岛上，1886年落成。", "hints": ["它在北美洲", "它是一座雕像", "它手里高举着火炬"]}, {"zh": "珠穆朗玛峰", "en": "Mount Everest", "aliases": ["珠峰", "珠穆朗玛", "埃佛勒斯峰", "萨加玛塔峰", "Everest", "Qomolangma"], "profile": "世界上最高的山峰，海拔8848.86米，耸立在喜马拉雅山脉上。", "hints": ["它在亚洲", "它是一座山", "它的山顶一年四季都是雪"]}, {"zh": "撒哈拉沙漠", "en": "Sahara Desert", "aliases": ["撒哈拉", "撒哈拉大沙漠", "Sahara"], "profile": "非洲北部一片巨大的沙漠，是世界上最大的热沙漠，面积和整个美国差不多大。", "hints": ["它在非洲", "它是一片沙漠", "它那里常常能见到骆驼"]}, {"zh": "悉尼歌剧院", "en": "Sydney Opera House", "aliases": ["Opera House"], "profile": "澳大利亚悉尼海边的一座演出大楼，白色屋顶像一片片船帆，1973年启用。", "hints": ["它在大洋洲", "它是一座建筑", "它的屋顶像白色的帆"]}, {"zh": "大本钟", "en": "Big Ben", "aliases": ["伊丽莎白塔", "Elizabeth Tower"], "profile": "英国伦敦议会大厦旁的钟楼，里面的大钟每小时准时敲响，是伦敦的标志。", "hints": ["它在欧洲", "它是一座高塔", "它每到整点就会敲响"]}, {"zh": "比萨斜塔", "en": "Leaning Tower of Pisa", "aliases": ["斜塔", "比萨塔", "Tower of Pisa", "Pisa Tower"], "profile": "意大利一座向一边倾斜的白色钟楼，歪了几百年却一直没有倒下。", "hints": ["它在欧洲", "它是一座塔", "它是歪着站的"]}, {"zh": "富士山", "en": "Mount Fuji", "aliases": ["富士", "Fuji", "Fujisan"], "profile": "日本最高的山，是一座山顶常盖着白雪的火山，形状像一个倒扣的圆锥。", "hints": ["它在亚洲", "它是一座山", "它的山顶常常盖着白雪"]}, {"zh": "狮身人面像", "en": "Great Sphinx of Giza", "aliases": ["狮身人面", "斯芬克斯", "Sphinx", "Great Sphinx"], "profile": "古埃及人用整块岩石雕成的巨大石像，身体是狮子，头是人的样子，守在金字塔旁边。", "hints": ["它在非洲", "它是一座石像", "它是趴着的样子"]}, {"zh": "故宫", "en": "Forbidden City", "aliases": ["紫禁城", "北京故宫", "故宫博物院", "Palace Museum"], "profile": "中国明清两代皇帝住过的宫殿，红墙黄瓦，是世界上现存规模最大的古代木结构宫殿群。", "hints": ["它在亚洲", "它是一座宫殿", "它有红色的墙和黄色的瓦"]}, {"zh": "长江", "en": "Yangtze River", "aliases": ["扬子江", "Yangtze", "Chang Jiang", "Changjiang"], "profile": "中国最长的河流，也是亚洲第一长河，从青藏高原一路向东流进东海。", "hints": ["它在亚洲", "它是一条河", "它一路向东流进大海"]}, {"zh": "大堡礁", "en": "Great Barrier Reef", "aliases": ["澳洲大堡礁", "澳大利亚大堡礁", "Barrier 