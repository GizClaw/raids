      minimum: 1
    "/flowcraft_narrator_chapter_setup_1/first_text_ms":
      maximum: 6000
    "/flowcraft_narrator_chapter_setup_1/first_audio_ms":
      maximum: 90000
    "/flowcraft_narrator_chapter_setup_1/events":
      non_empty: true
    "/flowcraft_narrator_chapter_setup_1/text_eos_ms":
      maximum: 90000
