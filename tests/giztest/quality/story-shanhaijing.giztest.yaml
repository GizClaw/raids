# workflows/story-shanhaijing/README.md: | 旁白 / 旁白, narrator | 1,2,3,4 | 只述可见事实、管理和转场，不代演 | `flowcraft-story-shanhaijing.storyteller` / `eino-story-shanhaijing.storyteller` | `flowcraft-story-shanhaijing.storyteller` / `eino-story-shanhaijing.storyteller` |
# workflows/story-shanhaijing/README.md: 角色表：narrator 旁白，只叙述可见事实和公开信息、不代演角色；young-explorer 少年探险者（别名 少年探险者/小探险者/young-explorer），第1至4章在场，想画出可靠的图卷；天真短句，第1章标出岔路，第4章区分观察与想象；spirit-guide 灵兽向导（别名 灵兽向导/灵兽/spirit-guide），第1至4章在场，想保护山林；温柔稳重，第1章提醒尊重栖息地，第3章提出互不打扰的约定；jingwei 精卫（别名 精卫/jingwei），第2至3章在场，想坚持有意义的努力；活泼坚定，第2章在山海交界搬小石子并指认雾中海岸，第3章比较坚持与休息后飞回海边；kuafu 夸父（别名 夸父/kuafu），第2至4章在场，想知道远路的代价；憨厚沉稳，第2章在神山脚下寻找水源，第3章建议量力而行，第4章分享途中见闻。以上四章互动行动为本仓库基于经典的原创改编，并非原典逐字情节；历史、传说与改编须区分。所有角色只知亲历或已公开信息，不知他人私密想法及未来结果；每章比较至少两种立场，无需全员轮番发言。离场者只能由旁白说明去向，不跨地点代言。
# workflows/story-shanhaijing/README.md: 旧记忆中的角色名单按当前章节和角色表重新归一化，不覆盖旅程代号、更正和进度。开场、转场（含阻塞）、更正、安全管理优先旁白；其次按文本顺序选第一个明确点名且在场的角色，否定点名不触发，否则旁白。只报角色名或“我支持某人”是玩家选择。每轮一人直接第一人称发言，不加说话人标签，旁白不代演。
# workflows/story-shanhaijing/README.md: `routing-cases.json` 离线执行真实 JS / Starlark，覆盖点名、否定、顺序、章节出场、只报名字、管理优先、旧状态恢复与转场。离线门禁不等于在线音色验收；实际选中 Voice 仍需运行日志与试听确认。
version: gizclaw.test/v1alpha1
name: quality.story-shanhaijing
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-story-shanhaijing long-form-story
  flowcraft_contracts_verdict:
    direction: output
    type: string
  eino_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-story-shanhaijing long-form-story
  eino_contracts_verdict:
    direction: output
    type: string
  flowcraft_transitions_workspace:
    direction: input
    type: string
    generate: token
  eino_transitions_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_young_explorer_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_spirit_guide_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_jingwei_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_kuafu_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_young_explorer_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_spirit_guide_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_jingwei_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_kuafu_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_routing_workspace:
    direction: input
    type: string
    generate: token
  eino_routing_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 352m
steps:
- id: register_flowcraft
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_flowcraft_tester
  client: flowcraft_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino
  client: eino
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino_tester
  client: eino_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
