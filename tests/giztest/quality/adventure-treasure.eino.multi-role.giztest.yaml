      - 想继续听就说
      - 这一章的选择完成啦
      - 等你说要不要
      - 是否继续听
      - say continue
      - say next chapter
      - would you like to continue
      min_length: 200
      max_length: 900
      pattern: "(还是|或|选|哪|谁|先| or |which|where|who)[^。.!！]*[？?]\\s*$"
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/audio_integrity/streams":
      equals: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
