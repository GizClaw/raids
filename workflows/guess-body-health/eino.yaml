面", "它像一个口袋", "它能装下吃的饭"]}, {"zh": "皮肤", "en": "skin", "aliases": ["肌肤"], "profile": "包在全身最外面的一层，能保护身体、感觉冷热，是人体最大的器官。", "hints": ["它包着全身", "它能感觉冷热", "它怕太阳晒太久"]}, {"zh": "肌肉", "en": "muscles", "aliases": ["muscle"], "profile": "大多附着在骨头上、能收缩和放松的身体组织，让身体动起来。", "hints": ["它遍布全身", "它能收缩", "它让身体动起来"]}, {"zh": "血液", "en": "blood", "aliases": ["血"], "profile": "在全身管道里流动的红色液体，给身体各处送去氧气和营养。", "hints": ["它在身体里面", "它是一种液体", "它是红色的"]}, {"zh": "呼吸", "en": "breathing", "aliases": ["喘气", "breathe", "breath"], "profile": "把空气吸进肺里、再把废气呼出来的过程，一刻也不能停。", "hints": ["它是一种身体现象", "它一刻也不停", "它会让胸口起伏"]}, {"zh": "做梦", "en": "dreaming", "aliases": ["梦", "dream"], "profile": "睡着时脑子里出现的画面和故事，醒来后有时还记得。", "hints": ["它是一种身体现象", "它发生在睡着时", "它像在看电影"]}, {"zh": "鸡皮疙瘩", "en": "goose bumps", "aliases": ["起鸡皮疙瘩", "鸡皮", "goosebumps"], "profile": "冷或害怕时，皮肤上的汗毛竖起来，冒出一粒粒小疙瘩的现象。", "hints": ["它是一种身体现象", "它出现在皮肤上", "它常在觉得冷时出现"]}, {"zh": "视觉", "en": "sight", "aliases": ["vision"], "profile": "用眼睛看见光、颜色和形状的感觉，是五种基本感觉之一。", "hints": ["它是一种感觉", "它需要光", "它能看出颜色"]}, {"zh": "听觉", "en": "hearing", "aliases": ["听力"], "profile": "用耳朵听见声音的感觉，能分辨声音的大小、高低和方向。", "hints": ["它是一种感觉", "它和声音有关", "它怕太大的噪音"]}, {"zh": "味觉", "en": "taste", "aliases": ["sense of taste"], "profile": "用舌头尝出酸、甜、苦、咸、鲜等味道的感觉。", "hints": ["它是一种感觉", "它和吃东西有关", "它能分出酸和甜"]}, {"zh": "蛀牙", "en": "tooth decay", "aliases": ["龋齿", "虫牙", "cavity"], "profile": "细菌把糖变成酸，慢慢把牙齿腐蚀出小洞的问题，要勤刷牙来预防。", "hints": ["它和牙齿有关", "它是牙齿上的问题", "它和吃糖太多有关"]}, {"zh": "细菌", "en": "bacteria", "aliases": ["病菌", "bacterium", "germs"], "profile": "非常非常小、只能用显微镜看到的生物，有的让人生病，有的对身体有益。", "hints": ["它非常小", "它是一种生物", "它有好有坏"]}, {"zh": "维生素", "en": "vitamins", "aliases": ["维他命", "vitamin"], "profile": "身体需要量很少、却不可缺少的营养物质，蔬菜水果里很多。", "hints": ["它是一种营养", "它需要量很少", "它常用字母来分类"]}, {"zh": "钙", "en": "calcium", "aliases": ["钙质"], "profile": "让骨头和牙齿坚硬结实的营养元素，牛奶和豆制品里很多。", "hints": ["它是一种营养", "它是一种矿物质", "它让骨头更结实"]}]}, {"title_zh": "人体小博士", "title_en": "Body Scholar", "step": 7, "offset": 0, "items": [{"zh": "关节", "en": "joints", "aliases": ["骨关节", "joint"], "profile": "两块骨头相连、可以活动的地方，让身体能弯曲和转动。", "hints": ["它在骨头之间", "它全身有很多", "它让身体能弯曲"]}, {"zh": "脊柱", "en": "spine", "aliases": ["脊椎", "脊梁骨", "backbone"], "profile": "后背正中一节一节连起来的骨头，撑起上半身，保护里面的脊髓。", "hints": ["它是一种骨头", "它在后背", "它一节一节的"]}, {"zh": "喉咙", "en": "throat", "aliases": ["嗓子", "咽喉"], "profile": "脖子里面、嘴巴后方的通道，吃的东西和吸进的空气都会经过这里。", "hints": ["它在脖子里", "它是一个通道", "它和吞咽有关"]}, {"zh": "瞳孔", "en": "pupil", "aliases": ["瞳仁", "眼仁", "pupils"], "profile": "眼睛中间黑色的小圆孔，是光进入眼睛的入口，会随着明暗变大变小。", "hints": ["它在眼睛上", "它是黑色的", "它会变大变小"]}, {"zh": "味蕾", "en": "taste buds", "aliases": ["taste bud"], "profile": "舌头表面尝味道的小结构，能分辨酸、甜、苦、咸、鲜。", "hints": ["它在舌头上", "它非常小", "它能尝出甜味"]}, {"zh": "指纹", "en": "fingerprints", "aliases": ["手指纹", "fingerprint"], "profile": "手指头上弯弯曲曲的细小纹路，每个人都不一样。", "hints": ["它在手上", "它是一些纹路", "它每个人都不一样"]}, {"zh": "小肠", "en": "small intestine", "aliases": ["small intestines"], "profile": "肚子里又细又长、弯弯曲曲的管子，是消化食物和吸收营养的主要地方。", "hints": ["它在肚子里", "它非常长", "它能吸收营养"]}, {"zh": "消化", "en": "digestion", "aliases": ["digest"], "profile": "把吃进的食物分解成身体能吸收的营养的过程，从嘴巴就开始了。", "hints": ["它是一个过程", "它和吃东西有关", "它从嘴巴开始"]}, {"zh": "嗅觉", "en": "smell", "aliases": ["sense of smell"], "profile": "用鼻子闻出各种气味的感觉，能帮我们发现食物香不香、有没有坏。", "hints": ["它是一种感觉", "它和气味有关", "它能发现烟味"]}, {"zh": "触觉", "en": "touch", "aliases": ["sense of touch"], "profile": "通过皮肤感受冷热、软硬、粗细和疼痛的感觉。", "hints": ["它是一种感觉", "它和皮肤有关", "它能分出冷和热"]}, {"zh": "近视", "en": "nearsightedness", "aliases": ["近视眼", "myopia"], "profile": "看近处清楚、看远处模糊的眼睛问题，要注意用眼习惯来预防。", "hints": ["它和眼睛有关", "它是一种视力问题", "它会看不清远处"]}, {"zh": "疫苗", "en": "vaccine", "aliases": ["预防针", "vaccines"], "profile": "帮身体提前认识病菌、学会对抗它们的预防用品，通常打针接种。", "hints": ["它和预防生病有关", "它通常要打针", "它让身体认识病菌"]}, {"zh": "蛋白质", "en": "protein", "aliases": ["proteins"], "profile": "构成肌肉、皮肤和头发的重要营养，鸡蛋、牛奶、肉和豆子里都很多。", "hints": ["它是一种营养", "它在鸡蛋里很多", "它帮身体长肌肉"]}, {"zh": "均衡饮食", "en": "balanced diet", "aliases": ["营养均衡", "饮食均衡"], "profile": "各种食物都吃、不挑食也不吃太多的好习惯，让身体得到全面的营养。", "hints": ["它是一个好习惯", "它和吃饭有关", "它要求不挑食"]}, {"zh": "热身运动", "en": "warm up", "aliases": ["热身", "准备活动", "warming up"], "profile": "正式运动前先慢慢活动身体的准备动作，能减少运动时受伤。", "hints": ["它是一个好习惯", "它和运动有关", "它在运动前做"]}]}, {"title_zh": "器官探险家", "title_en": "Organ Explorer", "step": 7, "offset": 0, "items": [{"zh": "细胞", "en": "cells", "aliases": ["cell"], "profile": "构成人体的最小单位，非常小，要用显微镜才能看到，人体由几十万亿个组成。", "hints": ["它非常小", "它是身体的基本单位", "它要用显微镜看"]}, {"zh": "血管", "en": "blood vessels", "aliases": ["blood vessel"], "profile": "遍布全身的管道，让血液流到身体每一个地方。", "hints": ["它在身体里面", "它是一种管道", "它遍布全身"]}, {"zh": "脉搏", "en": "pulse", "aliases": [], "profile": "心脏跳动时，动脉跟着一下一下地跳，用手指在手腕上就能摸到。", "hints": ["它是一种身体现象", "它在手腕能摸到", "它和心跳一样快"]}, {"zh": "肝脏", "en": "liver", "aliases": ["肝"], "profile": "肚子右上方最大的内脏器官，能储存营养、分解有害物质。", "hints": ["它在身体里面", "它在肚子右上方", "它是最大的内脏"]}, {"zh": "肾脏", "en": "kidneys", "aliases": ["肾", "腰子", "kidney"], "profile": "后腰两侧一对像蚕豆的器官，负责过滤血液、制造尿液。", "hints": ["它在身体里面", "它有左右两个", "它的形状像豆子"]}, {"zh": "大肠", "en": "large intestine", "aliases": ["large bowel"], "profile": "接在小肠后面的粗管子，吸收剩下的水分，把食物残渣变成粪便排出。", "hints": ["它在肚子里", "它是一条粗管子", "它能吸收水分"]}, {"zh": "食道", "en": "esophagus", "aliases": ["食管", "gullet"], "profile": "连接喉咙和胃的肌肉管道，咽下的食物经它送进胃里。", "hints": ["它在身体里面", "它是一条管道", "它把食物送进胃"]}, {"zh": "气管", "en": "windpipe", "aliases": ["trachea"], "profile": "从喉咙通到肺、专门让空气进出的管道，由一圈圈软骨撑着。", "hints": ["它在身体里面", "它是一条管道", "它让空气通过"]}, {"zh": "声带", "en": "vocal cords", "aliases": ["vocal folds"], "profile": "喉咙里两片有弹性的薄片，空气经过时振动发出声音。", "hints": ["它在喉咙里", "它会振动", "它让我们能说话"]}, {"zh": "鼓膜", "en": "eardrum", "aliases": ["耳膜", "eardrums"], "profile": "耳朵里面一层薄薄的膜，声音传来时会像鼓面一样振动。", "hints": ["它在耳朵里", "它是一层薄膜", "它会振动"]}, {"zh": "病毒", "en": "virus", "aliases": ["viruses"], "profile": "比细菌小得多的微小病原体，只能在活细胞里复制，会让人感冒等。", "hints": ["它非常非常小", "它会让人生病", "它能在人之间传播"]}, {"zh": "免疫系统", "en": "immune system", "aliases": ["免疫力", "免疫"], "profile": "身体里的“保卫部队”，能发现并消灭入侵的病菌，让身体少生病。", "hints": ["它在身体里面", "它像一支军队", "它能打败病菌"]}, {"zh": "过敏", "en": "allergy", "aliases": ["过敏反应", "allergies"], "profile": "身体把花粉、灰尘或某些食物误当成坏东西，产生打喷嚏、发痒等反应。", "hints": ["它是一种身体反应", "它不会传染", "它和花粉有关"]}, {"zh": "脂肪", "en": "fat", "aliases": ["油脂", "fats"], "profile": "储存能量的一种营养，也能在皮下保暖，油、坚果和肉里都有。", "hints": ["它是一种营养", "它能储存能量", "它在食用油里很多"]}, {"zh": "碳水化合物", "en": "carbohydrates", "aliases": ["糖类", "碳水", "carbs"], "profile": "米饭、面包、土豆里最多的营养，是身体最主要的能量来源。", "hints": ["它是一种营养", "它提供能量", "它在米饭里最多"]}]}, {"title_zh": "细胞观察员", "title_en": "Cell Observer", "step": 5, "offset": 0, "items": [{"zh": "红细胞", "en": "red blood cells", "aliases": ["红血球", "red blood cell"], "profile": "血液里数量最多的细胞，呈红色，负责把氧气运到全身。", "hints": ["它在血液里", "它数量非常多", "它运送氧气"]}, {"zh": "白细胞", "en": "white blood cells", "aliases": ["白血球", "white blood cell"], "profile": "血液里的“卫兵”细胞，能吞掉或消灭入侵的病菌。", "hints": ["它在血液里", "它像卫兵", "它能消灭病菌"]}, {"zh": "血小板", "en": "platelets", "aliases": ["platelet"], "profile": "血液里很小的细胞碎片，受伤出血时能聚在一起帮助止血。", "hints": ["它在血液里", "它非常小", "它帮伤口止血"]}, {"zh": "动脉", "en": "arteries", "aliases": ["artery"], "profile": "把血液从心脏送往全身的血管，管壁厚而有弹性。", "hints": ["它在身体里面", "它是一种管道", "它从心脏出发"]}, {"zh": "静脉", "en": "veins", "aliases": ["vein"], "profile": "把血液从全身送回心脏的血管，手背上看到的青色细线就是它。", "hints": ["它在身体里面", "它是一种管道", "它通向心脏"]}, {"zh": "视网膜", "en": "retina", "aliases": [], "profile": "眼球最里面的一层薄膜，像相机的底片，把光变成信号传给大脑。", "hints": ["它在眼睛里", "它是一层薄膜", "它像相机底片"]}, {"zh": "晶状体", "en": "lens", "aliases": ["水晶体", "crystalline lens"], "profile": "眼睛里透明、像凸透镜一样的结构，能改变厚薄，让远近的东西都看清。", "hints": ["它在眼睛里", "它是透明的", "它像一个凸透镜"]}, {"zh": "膝跳反射", "en": "knee jerk reflex", "aliases": ["膝反射", "patellar reflex"], "profile": "轻敲膝盖下方时，小腿会不由自主地向前一踢的反射。", "hints": ["它是一种反射", "它和腿有关", "它不需要思考"]}, {"zh": "小脑", "en": "cerebellum", "aliases": [], "profile": "位于大脑后下方的脑部结构，负责保持身体平衡、让动作协调。", "hints": ["它在头部", "它是脑的一部分", "它帮身体保持平衡"]}, {"zh": "骨髓", "en": "bone marrow", "aliases": ["marrow"], "profile": "藏在骨头中间的柔软组织，是制造血细胞的工厂。", "hints": ["它在骨头里", "它是软的", "它能制造血细胞"]}, {"zh": "新陈代谢", "en": "metabolism", "aliases": ["代谢"], "profile": "身体里所有化学变化的总称，把食物变成能量，并用新的东西替换旧的。", "hints": ["它是一个过程", "它发生在细胞里", "它让身体得到能量"]}, {"zh": "血型", "en": "blood type", "aliases": ["blood group"], "profile": "按照红细胞表面的标记给血液分的类型，最常见的分法是A、B、AB、O四种。", "hints": ["它和血液有关", "它有好几种", "它常用字母表示"]}, {"zh": "膳食纤维", "en": "dietary fiber", "aliases": ["纤维", "粗纤维", "fibre"], "profile": "蔬菜、水果和粗粮里不能被消化的部分，能帮助肠道蠕动、预防便秘。", "hints": ["它是一种营养", "它不能被消化", "它在芹菜里很多"]}, {"zh": "有氧运动", "en": "aerobic exercise", "aliases": ["有氧锻炼", "aerobics"], "profile": "跑步、游泳、跳绳这类时间较长、强度中等的运动，能锻炼心肺。", "hints": ["它是一个好习惯", "它是一种运动", "它能锻炼心肺"]}]}, {"title_zh": "生理研究员", "title_en": "Physiology Researcher", "step": 5, "offset": 0, "items": [{"zh": "毛细血管", "en": "capillaries", "aliases": ["capillary"], "profile": "人体最细的血管，比头发还细很多，连接动脉和静脉。", "hints": ["它在身体里面", "它非常细", "它遍布全身"]}, {"zh": "肺泡", "en": "alveoli", "aliases": ["alveolus"], "profile": "肺里无数个像小气球一样的小泡泡，氧气和二氧化碳在这里交换。", "hints": ["它在肺里", "它像小气球", "它数量非常多"]}, {"zh": "胃酸", "en": "stomach acid", "aliases": ["胃液", "gastric acid"], "profile": "胃分泌的强酸性液体，能帮助消化食物，还能杀死吃进去的细菌。", "hints": ["它在身体里面", "它是一种液体", "它非常酸"]}, {"zh": "牙釉质", "en": "tooth enamel", "aliases": ["珐琅质", "釉质", "enamel"], "profile": "牙齿最外面一层白色硬壳，是人体最坚硬的物质。", "hints": ["它和牙齿有关", "它非常坚硬", "它在最外层"]}, {"zh": "横膈膜", "en": "diaphragm", "aliases": ["膈肌", "横膈"], "profile": "把胸腔和腹腔分开的一大片肌肉，一收一放带动呼吸。", "hints": ["它在身体里面", "它是一片肌肉", "它帮助呼吸"]}, {"zh": "甲状腺", "en": "thyroid", "aliases": ["thyroid gland"], "profile": "脖子前面一个像蝴蝶的腺体，分泌的激素能控制新陈代谢的快慢。", "hints": ["它在脖子里", "它像一只蝴蝶", "它会分泌激素"]}, {"zh": "激素", "en": "hormones", "aliases": ["荷尔蒙", "hormone"], "profile": "身体里的“化学信使”，由腺体分泌，随血液流动去指挥身体各部分工作。", "hints": ["它在血液里", "它像化学信使", "它能调节生长"]}, {"zh": "酶", "en": "enzymes", "aliases": ["酵素", "enzyme"], "profile": "身体里加快化学反应的“催化剂”，大多是蛋白质，消化食物离不开它。", "hints": ["它能加快反应", "它大多是蛋白质", "它帮助消化食物"]}, {"zh": "神经元", "en": "neuron", "aliases": ["神经细胞", "neurons", "nerve cell"], "profile": "能传递电信号的细胞，有长长的突起，大脑里有将近一千亿个。", "hints": ["它是一种细胞", "它能传递信号", 