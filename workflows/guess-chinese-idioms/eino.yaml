鈡鉖鉵銃銅銿鍾鐘钟铜铳锺隀餇鮦鲖鴤鼕鼨", "金": "仅今伒侭僅僸儘兓凚劤劲勁卺厪吟唫噤嚍埐堇堻墐壗妗婜嫤嬐嬧寖尽嶜巹巾廑惍慬搢斤斳晉晋枃榗槿歏殣津浕浸湛溍漌濅濜烬煡燼珒琎琻瑨瑾璡璶盡矜矝砛祲禁竻笒筋紟紧紾緊縉缙肋臸荕荩菫菳蓳藎衿襟覲觐觔謹谨賮贐赆近进進釒釿鋟錦钅锦靳饉馑馸鹶黅齽", "针": "侦侲偵唇圳坫塦填姫嫃寊屒帧帪弫慎戡抮挋振揕搸敶斟昣朕枕枮栕栚桢桭椹楨榐榛槇樼殝沴浈湞溱滇潧澵獉珍珎瑧瑱甄甽畛疹眕眞真眹砧碪祯禎禛稹竧箴籈紖紾絼縝縥纼缜聄胗臻萙葴蒖蓁薽蜄袗裖診誫謓诊貞賑贞赈趁軫轃轸辴遉酖酙針鈂鉁鋴錱鍖鍼鎭鎮镇阵陣陳震靕駗鬒鮝鱵鴆鸩黮黰黱鼎", "钓": "伄佻倜凋刀刁刟叼吊啁奝嬥屌弔弴彫扚挑掉敦椆殦汈淍琱瘹瞗矵碉稠窎窵竨簓糶絩綢莜蓧藋虭蛁蜩訋誂調调貂趙跳踔軺釣鈟銚銱鋽錭鑃铞铫雕雿魡鮉鯛鲷鳥鳭鵃鵰鸟鼦", "铁": "僣占呫帖怗怙惵聑萜蛈蝶詀貼贴跕鉄鉆銕鋨鐡鐵飻餮驖鴩", "铃": "令伶倰冷凌刢另呤囹坽夌姈婈孁岭岺崚嶺彾怜拎掕昤朎柃棂棱櫺欞泠淩澪瀮灵炩燯爧狑玲琌瓴皊砱磷祾秢稜竛笭紷綾绫羚翎聆舲苓菱蓤蔆蕶蘦蛉衑袊裬詅跉軨輘酃醽釘鈴錂閝阾陵零霊霗霛霝靇靈領领駖魿鯪鲮鴒鸰鹷麢齡齢龄龗", "锄": "亍俶傗储儊儲処出刍初助厨嘔嘼埱处媰岀幮廚怵慉憷拀搐摢摴敊斶杵柠柷椘楚楮榋樗橱橻檚櫉櫖櫥欪歜涂淑滀滁濋炪犓珿琡璴畜矗础硫礎祝竌竐篨絀絮绌耝耡臅芻菆著蒢蒭蓫蕏藸處蜍蟵蠩褚觕触觸詘諔諸豖豠貙趎跦踀踰蹰躇躕鄐鉏鋤閦除雏雛鶵鸀黜齣齭齼", "锯": "且举乬仇佝侷俥俱倨倶僪具冣凥剧劇勮匊句告咀啹坥埧埾壉姐姖娵娶婅婮寠局居屈屦屨岠岨崌巈巨巪弆忂怇怐怚惧愳懅懼抅拒拘拠拱挙挶捄据掬揈揟據擧昛枸柜桔梮椇椈椐榉榘橘檋櫸欅歫毩毱沮泃泦洰涺淗渠湨澽炬烥焗焣爠犋犑狊狙珇琚疽痀眗瞿矩砠租秬窭窶筥簍簴籧粔粷罝耟聚聥腒臄舉艍苣苴莒菊菹萭蒟蒩蓻蔞蘜蘧處虡蚷蛆蜛螶袓裾襷詎諊讵豦貗趄趉趜趡足跔跙距跼踘踞踽蹫蹻躆躹車軥輂车遽邭郰郹鄒鄹醵鉅鉏鋤鋦鋸鐻钜锔閰陱雎雛鞠鞫颶飓駏駒駶驕驧驹鬻鮈鮍鮔鴡鵙鵴鶋鶪鼰鼳齟龃", "长": "丈仉仗仧仩伥倀倘倡偿傽僘償儻兏厂厰唱嘗嚐场場塲墇娼嫜嫦尚尝嶂帐帳常幛幥廠张弡張彰徜怅悵惝慞扙掌敞昌昶晿暢暲杖棖椙樟氅涨涱淌淐漲漳焻猖獐玚琩瑒瑺璋瓺甞畅畼痮瘬瘴瞕礃章粀粻肠胀脹腸膓苌菖萇蔁蟐蟑裮裳誯賬账遧鄣鋹鋿錩鏛鏱锠長镸閶闛阊障鞝韔餦騿鬯鯧鱆鱨鲳鲿麞鼚", "门": "亹们們呇怋悗悶惛懑懣扪捫暪椚殙汶滿焖燜玧璊瞞穈菛虋鍆钔門閅闷鞔", "闻": "免刎匁吻呅呚呡問塭妏娩彣忞忟愠抆揾搵文昧昷桽榅榲歾殁殟汶渂温溫炆煴玟珳瑥璺瘒瘟眼稳穏穩笏紊紋絻緼纹聞肳脕脗芠莬蕰藴蚉蚊螡蟁褞豱輼轀辒鎾閺閿闅闦问阌限雯鞰韞顐饂馼駇魰鰛鰮鳁鳼鴍鴖鼤", "阳": "仰佒佯傟养劷勜卬咉坱垟央姎婸將岟崵崸徉怏恙愓慃懩扬抰揚攁敭旸昂昜映暘杨柍样楊楧様樣歍殃氜氧氱泱洋湯漾潒瀁炀炴烊煬玚珜瑒疡痒瘍癢眏眻礢禓秧紻羊羏羕羪胦英蛘蝆詇詳諹軮輰鉠鍚鐊钖阦陽雵霙霷鞅颺飏養駚鰑鴦鴹鸉鸯", "陆": "侓僂僇六刘剹劉勎勠卢卤噜嚕嚠嚧圥坴垆塯塶塷壚娽媹嬼峍嵧庐廇廘廬彔录懰戮掳摎摝撸擄擼攄攎斿旈旒曥枦柳栁栌桞桺椂榴樐樚橊橮橹櫓櫨氇氌沠泖泵泸流浏淕淥渌游溜滷漉漻潞澑澛瀂瀏瀘炉熘熝熮爐獹玈珋琉琭瑠瑬璐璢璷瓐甪畂畄留畱疁瘤瘳癅盝盧睩矑硉硐硫硵碌磂磟磠祿禄稑穋窌箓簏簬簵簶籙籚粶綹緑繆纑绺绿罏罶羀翏聊胪膔膚臚舮舻艣艪艫芦菉蒥蓅蓼蓾蔍蔞蕗藰蘆虂虏虜螰蟉蠦裗角觮觻謢谷賁賂赂趢路踛蹓蹗輅轆轤轳辂辘逯遛鄜酪醁鈩鉚鋶錄録錴鎏鎦鏀鏐鏕鏴鐂鐪鑥鑪锍镏镠镥陸雡霤露顱颅飀飂飅飗餾馏駠駵騄騮騼驑骝髗鬸魯魲鯥鰡鱳鱸鲁鲈鵦鵱鶹鷚鷺鸕鸬鹠鹨鹭鹵鹿麍麓黸", "障": "丈仉仗傽墇嫜嶂帐帳幛幥张弡張彰慞扙掌暲杖樟涨涱漲漳獐璋痮瘬瘴瞕礃章粀粻胀脹蔁蟑賬账遧鄣鏱長长鞝餦騿鱆麞", "难": "侽冉南喃囝囡妠娚婻嫨弇戁抩揇攤暔枏柟楠湳灘煵男畘罱腩莮萳蝻諵赧遖難", "雀": "丂乔侨俏偢傕僑僺削劁却卻喬喿嘺噭埆塙墝墧墽壳嫶屈峤峭崅嵪嶠巧帩幓幧悄悫愀愁愨慤憔招捎搉搞摮撬撽攉敠敫敲校桥榷槗樵橇橋橾殻殼毃毳汋決潐炔焦燆燋燩犞猎琷瘸癄皵睄瞧硗硚硝硞确碏確碻磝磽礄礉礐礭窍窯竅箾繑繰缲缺翘翹舄芍茭荍荞菬蒛蕉蕎藮蚗蟜觳誚譑譙诮谯趞趫趬跤跷踃踍踖蹺蹻躈郻鄗鄡鄥醮釥銚鍫鍬鏒鐈鐰锹闋闕阕阙陗隺鞒鞘鞩鞽韒頝顤顦驕骹髚髜鳥鵲鹊", "雪": "乴削吷哮噱嚯坹壆学學岤峃嶨怴敩斅斈桖樰決泧泬泶滈澩瀥炔燢狘疦疶瞲矆穴膤艝茓蒆薛血袕觷謔谑趐踅蹻轌辥辪雤靴鞾韡鱈鳕鷽鸴", "青": "丼井京亰亲仱俓倞倩倾傹傾儆儬兢净凈凊刭剄剠劲勁勍卿啨圊坓坕坙埥境声夝妌婙婛婧宑寈巠幜庆庼廎弪弳径徑情惊慶憬憼掅擎擏敬旌旍晟景晴晶暒暻曔桱梷棾樈橸檠檾櫦殑殸氏氢氫氰汫汬泾浄涇淨淸清渹漀濪瀞烴燝猄獍獷璄璟璥甠痉痙睛硘硜碃磬秔稉穽竞竟竧竫競竸箐粇粳精経經綪綮经罄聙肼胜胫脛腈苘茎荆荊莔莖菁葏葝蜻蟼親誩請