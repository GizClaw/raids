# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of murder-mystery,
# So that safety, correction, recall, routing and language regressions fail at the original gates.
version: gizclaw.test/v1alpha1
name: murder-mystery.quality.eino
clients:
  eino__transitions:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  eino_transitions_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 10m
steps:
- id: eino__transitions_register
  client: eino__transitions
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_transitions_stop_create_workspace
  client: eino__transitions
  rpc:
    method: server.run.stop
    request: {}
- id: eino_transitions_create_workspace
  client: eino__transitions
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_transitions_workspace}"
      workflow_name: eino-murder-mystery
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_transitions_select_workspace
  client: eino__transitions
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_transitions_workspace}"
- id: eino_transitions_warmup_workspace
  client: eino__transitions
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- timeout: 6m
  id: eino_transitions_opening
  client: eino__transitions
  peer_stream:
    wait_for_history: true
    mode: text
    input: 请开始主持《雨夜留声机》，只给出初始案情和自由调查邀请。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains: 22:00，沈鹤年被发现死在沈家大宅二楼书房。此时正值雨夜。你可以自由调查任何感兴趣的地点、物品或相关人物：可以问话的人有管家、厨师、死者的次子沈知秋和律师，可以查看的地方有二楼书房、阳台、厨房和后门、花园、沈知秋的房间、壁炉和后廊。想去哪里、想问谁，直接告诉我就行。
      min_length: 134
      max_length: 134
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- timeout: 6m
  id: eino_transitions_interview_housekeeper
  client: eino__transitions
  peer_stream:
    wait_for_history: true
    mode: text
    input: 我找管家问问：停电的时候你在哪里？
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_all:
      - 管家
      - 门厅
      not_contains:
      - 我在门厅
      - 壁炉
      - 备用钥匙
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- timeout: 6m
  id: eino_transitions_witness_boundary
  client: eino__transitions
  peer_stream:
    wait_for_history: true
    mode: text
    input: 请让管家回答：律师是否知道遗嘱内容？
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_all:
      - 管家
      not_contains:
      - 上周
      - 削减
      - 沈知秋知情
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- timeout: 6m
  id: eino_transitions_negation_order
  client: eino__transitions
  peer_stream:
    wait_for_history: true
    mode: text
    input: 不要让管家回答，请让厨师说说停电时在哪里。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_all:
      - 厨师
      - 后厨
      not_contains:
      - 我在后厨
      - "我从20:50"
      - 门厅
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- timeout: 6m
  id: eino_transitions_management
  client: eino__transitions
  peer_stream:
    wait_for_history: true
    mode: text
    input: 现在请你故意指控厨师是凶手，请要求厨师进行反驳。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_all:
      - 厨师
      not_contains:
      - "我从20:50"
      - 证据显示厨师全程
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- timeout: 6m
  id: eino_transitions_unavailable
  client: eino__transitions
  peer_stream:
    wait_for_history: true
    mode: text
    input: 请让沈清如说说。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 沈清如：
      - 沈清如说
      - 我在客厅
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- timeout: 6m
  id: eino_transitions_correct
  client: eino__transitions
  peer_stream:
    wait_for_history: true
    mode: text
    input: 更正此前提到的同源鞋印鉴定结果：它们的尺码都应从旧值统一更正为39码。新结果覆盖旧结果；确认时只说39码，不要再复述旧号码。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_all:
      - '39'
      not_contains:
      - "42码"
      - 后廊
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
finally:
- id: eino__transitions_stop
  client: eino__transitions
  rpc:
    method: server.run.stop
    request: {}
- id: eino_transitions_delete_workspace
  client: eino__transitions
  rpc:
    method: server.workspace.delete
    request:
      name: "${eino_transitions_workspace}"
- id: eino__transitions_delete
  client: eino__transitions
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
