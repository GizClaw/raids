# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for eino-story-alice,
# So that each reachable role produces text and non-empty audio within the latency gates.
version: gizclaw.test/v1alpha1
name: story-alice.eino.roles
clients:
  narrator:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  alice:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  white-rabbit:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  hatter:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  cheshire-cat:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  queen-of-hearts:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  narrator_workspace:
    direction: input
    type: string
    generate: token
  alice_workspace:
    direction: input
    type: string
    generate: token
  white_rabbit_workspace:
    direction: input
    type: string
    generate: token
  hatter_workspace:
    direction: input
    type: string
    generate: token
  cheshire_cat_workspace:
    direction: input
    type: string
    generate: token
  queen_of_hearts_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 60m
steps:
- id: register_narrator
  client: narrator
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: "${narrator_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-alice
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${narrator_workspace}"
- id: warmup_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_alice
  client: alice
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_alice_workspace
  client: alice
  rpc:
    method: server.workspace.create
    request:
      name: "${alice_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-alice
