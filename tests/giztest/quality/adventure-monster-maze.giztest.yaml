# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of adventure-monster-maze,
# So that safety, correction, recall, routing and language regressions fail at the original gates.
version: gizclaw.test/v1alpha1
name: quality.adventure-monster-maze
clients:
  flowcraft__roles: &1
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino__roles: &2
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft__routing: *1
  eino__routing: *2
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_little_monster_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_gatekeeper_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_riddle_spirit_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_little_monster_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_gatekeeper_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_riddle_spirit_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_routing_workspace:
    direction: input
    type: string
    generate: token
  eino_routing_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 10m
steps:
- id: flowcraft__roles_register
  client: flowcraft__roles
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino__roles_register
  client: eino__roles
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft__routing_register
  client: flowcraft__routing
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino__routing_register
  client: eino__routing
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_roles_stop_create_narrator_workspace
  client: flowcraft__roles
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_roles_create_narrator_workspace
  client: flowcraft__roles
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_roles_narrator_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-adventure-monster-maze
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_roles_select_narrator_workspace
  client: flowcraft__roles
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_roles_narrator_workspace}"
- id: flowcraft_roles_warmup_narrator_workspace
  client: flowcraft__roles
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_roles_stop_create_narrator_workspace
  client: eino__roles
  rpc:
    method: server.run.stop
    request: {}
- id: eino_roles_create_narrator_workspace
  client: eino__roles
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_roles_narrator_workspace}"
      collection: raidtest-targets
      workflow_name: eino-adventure-monster-maze
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
