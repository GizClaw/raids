- id: synthesize_input_audio
  client: flowcraft
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 我从花果山出发，带着一枚青铜铃。简短承接我的行动，不要替我选择路线。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: input_audio
- id: realtime_roundtrip
  timeout: 2m
  parallel:
  - id: flowcraft_realtime_roundtrip
    peer_stream:
      mode: realtime
      input: "${input_audio}"
      pacing: 20ms
      require_audio: true
      require_text: true
      idle_timeout: 90s
    client: flowcraft
  - id: eino_history_realtime_roundtrip
    peer_stream:
      mode: realtime
      input: "${input_audio}"
      pacing: 20ms
      require_audio: true
      require_text: true
      idle_timeout: 90s
    client: eino_history
  - id: eino_memory_async_realtime_roundtrip
    peer_stream:
      mode: realtime
      input: "${input_audio}"
      pacing: 20ms
      require_audio: true
      require_text: true
      idle_timeout: 90s
    client: eino_memory_async
