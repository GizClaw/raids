      contains_all:
      - 第 1 章
      - 湿地风向
      not_contains:
      - 第 2 章
      - 雁群协作
      contains_any:
      - 湿地风向
      - 第一章
      - 第 1 章
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
- id: flowcraft_transitions_choice_prompts_next_chapter
