    "/flowcraft_roles_astronomer_scene_setup_1/audio_eos":
      equals: true
    "/flowcraft_roles_astronomer_scene_setup_1/audio_bytes":
      minimum: 1
    "/flowcraft_roles_astronomer_scene_setup_1/first_text_ms":
