# User Story:
# As a Raids catalog maintainer,
# I want equal opening, role and roundtrip responsiveness gates for every implementation,
# So that text and audio respond promptly without overlap or playback stalls.
version: gizclaw.test/v1alpha1
name: journey-guide.smoke
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_history:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_memory_async:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_memory_recall:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_text_workspace:
    direction: input
    type: string
    generate: token
  eino_history_text_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_async_text_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_recall_text_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roundtrip_workspace:
    direction: input
    type: string
    generate: token
  eino_history_roundtrip_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_async_roundtrip_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_recall_roundtrip_workspace:
    direction: input
    type: string
    generate: token

repeat: 1
timeout: 12m
steps:
- id: flowcraft_register
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_history_register
  client: eino_history
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_memory_async_register
  client: eino_memory_async
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_memory_recall_register
  client: eino_memory_recall
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_create_text
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_text_workspace}"
      collection: story-teller
      workflow_name: journey
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_select_text
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_text_workspace}"
- id: flowcraft_warmup_text
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_history_create_text
  client: eino_history
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_history_text_workspace}"
      collection: story-teller
      workflow_name: journey-eino-history
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_history_select_text
  client: eino_history
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_history_text_workspace}"
- id: eino_history_warmup_text
  client: eino_history
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_memory_async_create_text
  client: eino_memory_async
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_memory_async_text_workspace}"
      collection: story-teller
      workflow_name: journey-eino-memory-async
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_memory_async_select_text
  client: eino_memory_async
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_memory_async_text_workspace}"
- id: eino_memory_async_warmup_text
  client: eino_memory_async
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_memory_recall_create_text
  client: eino_memory_recall
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_memory_recall_text_workspace}"
      collection: story-teller
      workflow_name: journey-eino-memory-recall
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_memory_recall_select_text
  client: eino_memory_recall
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_memory_recall_text_workspace}"
- id: eino_memory_recall_warmup_text
  client: eino_memory_recall
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_create_roundtrip
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_roundtrip_workspace}"
      collection: story-teller
      workflow_name: journey
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_history_create_roundtrip
  client: eino_history
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_history_roundtrip_workspace}"
      collection: story-teller
      workflow_name: journey-eino-history
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_memory_async_create_roundtrip
  client: eino_memory_async
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_memory_async_roundtrip_workspace}"
      collection: story-teller
      workflow_name: journey-eino-memory-async
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_memory_recall_create_roundtrip
  client: eino_memory_recall
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_memory_recall_roundtrip_workspace}"
      collection: story-teller
      workflow_name: journey-eino-memory-recall
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: turn_1_origin
  timeout: 2m
  parallel:
  - id: flowcraft_turn_1_origin
    client: flowcraft
    peer_stream:
      mode: text
      input: 我从花果山出发，带着一枚青铜铃。承接我的行动，不要替我选择路线。
      require_text: true
      require_audio: true
      idle_timeout: 90s
  - id: eino_history_turn_1_origin
    client: eino_history
    peer_stream:
      mode: text
      input: 我从花果山出发，带着一枚青铜铃。承接我的行动，不要替我选择路线。
      require_text: true
      require_audio: false
      idle_timeout: 90s
  - id: eino_memory_async_turn_1_origin
    client: eino_memory_async
    peer_stream:
      mode: text
      input: 我从花果山出发，带着一枚青铜铃。承接我的行动，不要替我选择路线。
      require_text: true
      require_audio: false
      idle_timeout: 90s
  - id: eino_memory_recall_turn_1_origin
    client: eino_memory_recall
    peer_stream:
      mode: text
      input: 我从花果山出发，带着一枚青铜铃。承接我的行动，不要替我选择路线。
      require_text: true
      require_audio: false
      idle_timeout: 90s
  expect:
    "/flowcraft_turn_1_origin/text":
      contains_all:
      - 花果山
      - 青铜铃
      min_length: 80
      max_length: 520
      non_empty: true
    "/flowcraft_turn_1_origin/first_text_ms":
      maximum: 6000
    "/flowcraft_turn_1_origin/text_eos_ms":
      maximum: 90000
    "/flowcraft_turn_1_origin/events":
      non_empty: true
    "/flowcraft_turn_1_origin/audio_bytes":
      minimum: 1
    "/flowcraft_turn_1_origin/text_eos":
      equals: true
    "/flowcraft_turn_1_origin/audio_eos":
      equals: true
    "/flowcraft_turn_1_origin/audio_integrity/streams":
      minimum: 1
    "/flowcraft_turn_1_origin/audio_integrity/max_active":
      equals: 1
    "/flowcraft_turn_1_origin/audio_integrity/open":
      equals: 0
    "/flowcraft_turn_1_origin/audio_integrity/violations":
      equals: 0
    "/flowcraft_turn_1_origin/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/flowcraft_turn_1_origin/audio_pacing/underruns":
      equals: 0
    "/eino_history_turn_1_origin/text":
      contains_all:
      - 花果山
      - 青铜铃
      min_length: 80
      max_length: 520
      non_empty: true
    "/eino_history_turn_1_origin/first_text_ms":
      maximum: 6000
    "/eino_history_turn_1_origin/text_eos_ms":
      maximum: 90000
    "/eino_history_turn_1_origin/events":
      non_empty: true
    "/eino_history_turn_1_origin/text_eos":
      equals: true
    "/eino_memory_async_turn_1_origin/text":
      contains_all:
      - 花果山
      - 青铜铃
      min_length: 80
      max_length: 520
      non_empty: true
    "/eino_memory_async_turn_1_origin/first_text_ms":
      maximum: 6000
    "/eino_memory_async_turn_1_origin/text_eos_ms":
      maximum: 90000
    "/eino_memory_async_turn_1_origin/events":
      non_empty: true
    "/eino_memory_async_turn_1_origin/text_eos":
      equals: true
    "/eino_memory_recall_turn_1_origin/text":
      contains_all:
      - 花果山
      - 青铜铃
      min_length: 80
      max_length: 520
      non_empty: true
    "/eino_memory_recall_turn_1_origin/first_text_ms":
      maximum: 6000
    "/eino_memory_recall_turn_1_origin/text_eos_ms":
      maximum: 90000
    "/eino_memory_recall_turn_1_origin/events":
      non_empty: true
    "/eino_memory_recall_turn_1_origin/text_eos":
      equals: true
- id: flowcraft_select_roundtrip
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_roundtrip_workspace}"
- id: flowcraft_warmup_roundtrip
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_history_select_roundtrip
  client: eino_history
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_history_roundtrip_workspace}"
- id: eino_history_warmup_roundtrip
  client: eino_history
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_memory_async_select_roundtrip
  client: eino_memory_async
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_memory_async_roundtrip_workspace}"
- id: eino_memory_async_warmup_roundtrip
  client: eino_memory_async
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_memory_recall_select_roundtrip
  client: eino_memory_recall
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_memory_recall_roundtrip_workspace}"
- id: eino_memory_recall_warmup_roundtrip
  client: eino_memory_recall
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: roundtrip
  timeout: 2m
  parallel:
  - id: flowcraft_roundtrip
    peer_stream:
      mode: text
      input: 我从花果山出发，带着一枚青铜铃。简短承接我的行动，不要替我选择路线。
      require_audio: true
      require_text: true
      idle_timeout: 90s
    client: flowcraft
  - id: eino_history_roundtrip
    peer_stream:
      mode: text
      input: 我从花果山出发，带着一枚青铜铃。简短承接我的行动，不要替我选择路线。
      require_audio: false
      require_text: true
      idle_timeout: 90s
    client: eino_history
  - id: eino_memory_async_roundtrip
    peer_stream:
      mode: text
      input: 我从花果山出发，带着一枚青铜铃。简短承接我的行动，不要替我选择路线。
      require_audio: false
      require_text: true
      idle_timeout: 90s
    client: eino_memory_async
  - id: eino_memory_recall_roundtrip
    peer_stream:
      mode: text
      input: 我从花果山出发，带着一枚青铜铃。简短承接我的行动，不要替我选择路线。
      require_audio: false
      require_text: true
      idle_timeout: 90s
    client: eino_memory_recall
  expect:
    "/flowcraft_roundtrip/events":
      non_empty: true
    "/flowcraft_roundtrip/audio_bytes":
      minimum: 1
    "/flowcraft_roundtrip/text_eos":
      equals: true
    "/flowcraft_roundtrip/audio_eos":
      equals: true
    "/flowcraft_roundtrip/text":
      non_empty: true
    "/flowcraft_roundtrip/audio_integrity/streams":
      minimum: 1
    "/flowcraft_roundtrip/audio_integrity/max_active":
      equals: 1
    "/flowcraft_roundtrip/audio_integrity/open":
      equals: 0
    "/flowcraft_roundtrip/audio_integrity/violations":
      equals: 0
    "/flowcraft_roundtrip/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/flowcraft_roundtrip/audio_pacing/underruns":
      equals: 0
    "/eino_history_roundtrip/events":
      non_empty: true
    "/eino_history_roundtrip/text_eos":
      equals: true
    "/eino_history_roundtrip/text":
      non_empty: true
    "/eino_memory_async_roundtrip/events":
      non_empty: true
    "/eino_memory_async_roundtrip/text_eos":
      equals: true
    "/eino_memory_async_roundtrip/text":
      non_empty: true
    "/eino_memory_recall_roundtrip/events":
      non_empty: true
    "/eino_memory_recall_roundtrip/text_eos":
      equals: true
    "/eino_memory_recall_roundtrip/text":
      non_empty: true
finally:
- id: flowcraft_stop_run
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: eino_history_stop_run
  client: eino_history
  rpc:
    method: server.run.stop
    request: {}
- id: eino_memory_async_stop_run
  client: eino_memory_async
  rpc:
    method: server.run.stop
    request: {}
- id: eino_memory_recall_stop_run
  client: eino_memory_recall
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_delete_text
  client: flowcraft
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_text_workspace}"
- id: eino_history_delete_text
  client: eino_history
  rpc:
    method: server.workspace.delete
    request:
      name: "${eino_history_text_workspace}"
- id: eino_memory_async_delete_text
  client: eino_memory_async
  rpc:
    method: server.workspace.delete
    request:
      name: "${eino_memory_async_text_workspace}"
- id: eino_memory_recall_delete_text
  client: eino_memory_recall
  rpc:
    method: server.workspace.delete
    request:
      name: "${eino_memory_recall_text_workspace}"
- id: flowcraft_delete_roundtrip
  client: flowcraft
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_roundtrip_workspace}"
- id: eino_history_delete_roundtrip
  client: eino_history
  rpc:
    method: server.workspace.delete
    request:
      name: "${eino_history_roundtrip_workspace}"
- id: eino_memory_async_delete_roundtrip
  client: eino_memory_async
  rpc:
    method: server.workspace.delete
    request:
      name: "${eino_memory_async_roundtrip_workspace}"
- id: eino_memory_recall_delete_roundtrip
  client: eino_memory_recall
  rpc:
    method: server.workspace.delete
    request:
      name: "${eino_memory_recall_roundtrip_workspace}"
- id: flowcraft_delete_peer
  client: flowcraft
  rpc:
    method: server.peer.delete
    request: {}
- id: eino_history_delete_peer
  client: eino_history
  rpc:
    method: server.peer.delete
    request: {}
- id: eino_memory_async_delete_peer
  client: eino_memory_async
  rpc:
    method: server.peer.delete
    request: {}
- id: eino_memory_recall_delete_peer
  client: eino_memory_recall
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
