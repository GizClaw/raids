    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: jingwei_chapter_setup_26
  client: jingwei
  timeout: 2m
  peer_stream:
    mode: text
    input: 请从第一章开始《山海经》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      contains: 第 1 章：图卷初开
- id: jingwei_chapter_setup_27
  client: jingwei
  timeout: 2m
  peer_stream:
    mode: text
    input: 我选择先帮助同伴并核对眼前线索，请推进一个直接结果。
