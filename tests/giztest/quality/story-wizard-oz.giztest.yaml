      mode: text
      input: 请从第一章开始《绿野仙踪》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_multi_role_transitions_opening_with_guidance
    client: eino_multi_role__transitions
    peer_stream:
      mode: text
      input: 请从第一章开始《绿野仙踪》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: flowcraft_multi_role_case5_restart_flowcraft_in_english
    client: flowcraft_multi_role__case5
    peer_stream:
      mode: text
      input: Please introduce this experience in English.
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_multi_role_case5_restart_flowcraft_in_english
    client: eino_multi_role__case5
    peer_stream:
      mode: text
      input: Please introduce this experience in English.
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: flowcraft_multi_role_routing_opening
    client: flowcraft_multi_role__routing
    peer_stream:
      mode: text
      input: 请从第一章开始《绿野仙踪》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_multi_role_routing_opening
    client: eino_multi_role__routing
    peer_stream:
      mode: text
      input: 请从第一章开始《绿野仙踪》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  expect:
    "/flowcraft_multi_role_transitions_opening_with_guidance/text":
      contains_all:
      - 第 1 章
      - 黄砖岔路
      - 多萝西
      - 稻草人
      - 进入下一章
      not_contains:
      - "【"
      - "】"
      min_length: 200
      max_length: 900
