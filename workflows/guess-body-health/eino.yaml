apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-guess-body-health
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-guess-body-health.host
    graph:
      name: guess-body-health-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: game-route
          type: string
          merge: replace
        - name: game-direction
          type: string
          merge: replace
        - name: game-node
          type: string
          merge: replace
        - name: host-rules
          type: string
          merge: replace
        - name: host-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: control-round
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: game-route
          node: game-node
          direction: game-direction
          rules: host-rules
        language: starlark
        entrypoint: run
        source: |
          # Generated from workflows/guess-body-health/puzzles.json by scripts/guess/generate.py.
          # Eino keeps no hidden state between turns, so every turn rebuilds the game
          # from the spoken History: the latest "谜题来啦"/"Puzzle time" opening names
          # the level and the puzzle number, and (level, puzzle) picks the secret.
          # Each turn makes one model call: this script either writes the host's
          # instruction for build-host-prompt, or activates the current puzzle's card
          # node, whose card has the name removed so the host cannot say it.
          DATA = {"subject_zh": "一个和身体健康有关的名词", "subject_en": "a word about the body and health", "examples_zh": ["它在身体里面吗？", "它是一种健康习惯吗？", "它能直接看见吗？", "它和吃东西有关吗？"], "examples_en": ["Is it inside the body?", "Is it a healthy habit?", "Can you see it directly?", "Does it have to do with eating?"], "restate_zh": ["它在身体里面吗？", "是，它在身体里面。", "不是，它不在身体里面。"], "restate_en": ["Is it inside the body?", "Yes, it is inside the body.", "No, it is not inside the body."], "host_rules": "你是儿童猜谜游戏“猜猜身体与健康”的主持人。玩法：主持人心里藏着一个和身体健康有关的名词，孩子用能回答“是”或“不是”的问题来猜，每一题最多 20 次提问；猜中就升一关，一共 10 关，关名从“身体小萌新”一直到“生命奥秘大师”。孩子可能说中文，也可能说英文。\n你不知道谜底的名字。需要回答孩子的问题时，系统会给你一张隐藏了名字的谜底卡；揭晓答案时系统才会在指令里告诉你名字。本轮要做什么写在对话最后的【本轮指令】里，照着做，说得自然、热情、简短。\n孩子说的“它”“这个东西”“this”“it”都指谜底名词。按谜底卡和公认的科学常识判断它是身体部位、器官、身体现象、感觉、健康习惯、营养还是医学名词，在身体哪里、有什么作用；孩子说自己身体不舒服时，不做诊断也不给治疗建议，只提醒他告诉大人、去看医生。\n必须遵守：\n1. 本轮指令要求“逐字说”的句子必须一字不差地说出来，包括数字、标点和引号里的称号，不改写、不省略、不调换顺序。\n2. 只回答孩子问到的那一点，绝不能主动补充谜底卡上的其他描述、线索、特征、猜测方向或评价；复述孩子的问题时只能用孩子问题里已有的意思。\n3. 只有本轮指令要求揭晓答案时才能说“答案揭晓”“答案就是”“The answer is”；只有本轮指令要求开新题时才能说“谜题来啦”“Puzzle time”；只有真的给提示时才能说“小提示”“Hint”。平时绝不能说这些词。\n4. 按【本轮指令】写明的回复语言回答：中文就全部用中文；English 就全部用英文，逐字句也用指令给出的英文原句。\n5. 安全永远优先于本轮指令：孩子提到要在现实中模仿危险做法或遇到安全问题时，中文回复必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，英文回复要说 do not copy it 并请孩子 ask a parent, teacher or trusted adult for help。\n6. 不要自己数还剩几次提问机会，只有本轮指令写了剩余次数时才说那个数字。\n7. 语气像节目主持人一样活泼友好，适合小朋友；平时回复1到3句话、100个字以内，开新题和揭晓答案时可以到150个字；最后一句必须是问孩子的问题，道别时也用一个轻松的问题结尾。\n8. 只输出适合朗读的正文，不输出 Markdown、列表、emoji、括号注释、舞台说明或系统字段，也不要提到“本轮指令”“裁判”这些词。", "levels": [{"title_zh": "身体小萌新", "title_en": "Body Rookie", "step": 7, "offset": 0, "items": [{"zh": "眼睛", "en": "eyes", "aliases": ["眼", "双眼", "eye"], "profile": "长在脸上、用来看东西的一对身体部位，能分辨颜色、形状和远近。", "hints": ["它长在脸上", "它通常有两个", "它能分辨颜色"]}, {"zh": "鼻子", "en": "nose", "aliases": ["鼻"], "profile": "长在脸中间、用来闻气味和呼吸的身体部位，下面有两个小孔。", "hints": ["它长在脸上", "它只有一个", "它能闻到花香"]}, {"zh": "耳朵", "en": "ears", "aliases": ["耳", "ear"], "profile": "长在头两侧、用来听声音的一对身体部位，里面的结构还能帮身体保持平衡。", "hints": ["它长在头上", "它通常有两个", "它能听见声音"]}, {"zh": "嘴巴", "en": "mouth", "aliases": ["嘴"], "profile": "长在脸下半部分的身体部位，用来吃东西、说话和尝味道。", "hints": ["它长在脸上", "它只有一个", "它能用来说话"]}, {"zh": "牙齿", "en": "teeth", "aliases": ["牙", "tooth"], "profile": "长在嘴里的坚硬白色小块，用来咬断和嚼碎食物，要天天刷干净。", "hints": ["它长在嘴里", "它非常坚硬", "它能嚼碎食物"]}, {"zh": "头发", "en": "hair", "aliases": [], "profile": "长在头顶上细细长长的毛，能保护头皮，剪短了还会再长出来。", "hints": ["它长在头上", "它细细长长的", "它剪短了还会再长"]}, {"zh": "手", "en": "hand", "aliases": ["双手", "hands"], "profile": "长在胳膊末端、有五根指头的身体部位，能拿东西、写字和画画。", "hints": ["它在身体外面", "它通常有两只", "它能拿起东西"]}, {"zh": "脚", "en": "foot", "aliases": ["脚丫", "脚丫子", "feet"], "profile": "长在腿最下面的身体部位，支撑身体站立和走路，有五个趾头。", "hints": ["它在身体最下面", "它通常有两只", "它要穿上鞋子"]}, {"zh": "舌头", "en": "tongue", "aliases": ["舌"], "profile": "藏在嘴里、软软会动的身体部位，能尝出酸甜苦咸，还能帮我们说话。", "hints": ["它藏在嘴里", "它很灵活", "它能尝出甜味"]}, {"zh": "眉毛", "en": "eyebrows", "aliases": ["眉", "eyebrow"], "profile": "长在眼睛上方的两道短毛，能挡住额头流下的汗水。", "hints": ["它长在脸上", "它是一些短短的毛", "它在眼睛上方"]}, {"zh": "刷牙", "en": "brushing teeth", "aliases": ["刷牙齿", "brush teeth"], "profile": "用牙刷和牙膏把牙齿清洁干净的好习惯，每天早晚都要做。", "hints": ["它是一个好习惯", "它每天早晚都要做", "它要用到牙膏"]}, {"zh": "洗手", "en": "washing hands", "aliases": ["洗洗手", "hand washing"], "profile": "用水和肥皂把双手洗干净的好习惯，能把细菌冲走。", "hints": ["它是一个好习惯", "它要用到水", "它在吃饭前要做"]}, {"zh": "睡觉", "en": "sleep", "aliases": ["睡眠"], "profile": "闭上眼睛让身体和大脑休息，小朋友每天都需要睡足够长的时间。", "hints": ["它是一个好习惯", "它通常在晚上", "它要闭上眼睛"]}, {"zh": "喝水", "en": "drinking water", "aliases": ["喝白开水", "多喝水"], "profile": "给身体补充水分的好习惯，口渴了或运动后都要记得。", "hints": ["它是一个好习惯", "它和口渴有关", "它常用到杯子"]}, {"zh": "打喷嚏", "en": "sneeze", "aliases": ["喷嚏", "sneezing"], "profile": "鼻子里痒痒时，身体突然用力把气从鼻子和嘴里喷出去的反应。", "hints": ["它是一种身体现象", "它会发出声音", "它和鼻子痒有关"]}, {"zh": "蔬菜", "en": "vegetables", "aliases": ["青菜", "vegetable"], "profile": "白菜、胡萝卜、西兰花这类可以吃的植物，含有丰富的维生素和膳食纤维。", "hints": ["它来自植物", "它能帮助消化", "它常常是绿色的"]}]}, {"title_zh": "健康小卫士", "title_en": "Health Guardian", "step": 7, "offset": 0, "items": [{"zh": "手指", "en": "fingers", "aliases": ["指头", "手指头", "finger"], "profile": "长在手掌前端的细长部分，一只手有五根，能捏住和按住东西。", "hints": ["它长在手上", "它一共有十根", "它能用来数数"]}, {"zh": "膝盖", "en": "knee", "aliases": ["膝", "膝关节", "knees"], "profile": "大腿和小腿连接处的关节，能让腿弯曲和伸直。", "hints": ["它长在腿上", "它能弯曲", "它在大腿和小腿之间"]}, {"zh": "肩膀", "en": "shoulders", "aliases": ["肩", "肩头", "shoulder"], "profile": "脖子两边、胳膊上端的身体部位，能让胳膊抬起和转圈。", "hints": ["它在身体上半部分", "它左右各一个", "它能背起书包"]}, {"zh": "脖子", "en": "neck", "aliases": ["颈", "颈部", "脖颈"], "profile": "连接头和身体的部分，能让头左右转动和上下点头。", "hints": ["它在身体上半部分", "它只有一个", "它能让头转动"]}, {"zh": "肚子", "en": "belly", "aliases": ["肚", "肚皮", "腹部", "tummy"], "profile": "身体中间、胸口下面的部分，里面装着胃和肠子等器官。", "hints": ["它在身体中间", "它里面装着器官", "它饿了会咕咕叫"]}, {"zh": "心脏", "en": "heart", "aliases": ["心"], "profile": "胸腔里一刻不停跳动的器官，像水泵一样把血液送到全身。", "hints": ["它在身体里面", "它由肌肉组成", "它一直在跳动"]}, {"zh": "骨头", "en": "bones", "aliases": ["骨骼", "bone"], "profile": "身体里坚硬的支架，撑起身体、保护内脏，成年人一共有206块。", "hints": ["它在身体里面", "它非常坚硬", "它能撑起整个身体"]}, {"zh": "打哈欠", "en": "yawn", "aliases": ["哈欠", "打呵欠", "呵欠", "yawning"], "profile": "困了或累了时，不由自主地张大嘴、深深吸一口气再呼出来的动作。", "hints": ["它是一种身体现象", "它要张大嘴巴", "它常在犯困时出现"]}, {"zh": "打嗝", "en": "hiccups", "aliases": ["呃逆", "hiccup"], "profile": "横膈膜突然一下一下地抽动，让喉咙发出“嗝”声的身体现象。", "hints": ["它是一种身体现象", "它会发出声音", "它常在吃太快后出现"]}, {"zh": "心跳", "en": "heartbeat", "aliases": ["心跳声"], "profile": "心脏收缩和舒张时产生的有节奏的跳动，把手放在胸口就能感觉到。", "hints": ["它是一种身体现象", "它很有节奏", "它运动后会变快"]}, {"zh": "发烧", "en": "fever", "aliases": ["发热"], "profile": "身体温度比平时高的现象，常常是身体在和病菌作战，要告诉大人。", "hints": ["它是一种身体现象", "它和体温有关", "它会让额头发烫"]}, {"zh": "口渴", "en": "thirst", "aliases": ["渴", "口干", "thirsty"], "profile": "身体缺水时，嘴巴和喉咙发干、想喝水的感觉。", "hints": ["它是一种感觉", "它和嘴巴有关", "它出现时想喝水"]}, {"zh": "出汗", "en": "sweating", "aliases": ["流汗", "汗", "sweat"], "profile": "天热或运动时，皮肤上冒出小水珠的现象，能帮身体降温。", "hints": ["它是一种身体现象", "它和皮肤有关", "它能帮身体降温"]}, {"zh": "换牙", "en": "losing baby teeth", "aliases": ["换乳牙", "掉牙"], "profile": "小朋友的乳牙一颗颗掉下，再长出恒牙的过程，大约从六岁开始。", "hints": ["它是一种身体现象", "它大约从六岁开始", "它会让嘴里出现缺口"]}, {"zh": "洗澡", "en": "bathing", "aliases": ["冲凉", "淋浴", "泡澡", "bath", "shower"], "profile": "用水和沐浴露把全身洗干净的好习惯，能洗掉汗水和脏东西。", "hints": ["它是一个好习惯", "它要用到很多水", "它能让全身干干净净"]}, {"zh": "运动", "en": "exercise", "aliases": ["锻炼", "体育锻炼", "sports"], "profile": "跑步、跳绳、游泳这类让身体动起来的活动，能让身体更强壮。", "hints": ["它是一个好习惯", "它会让人出汗", "它能让身体更强壮"]}]}, {"title_zh": "人体小侦探", "title_en": "Body Detective", "step": 7, "offset": 0, "items": [{"zh": "大脑", "en": "brain", "aliases": ["脑", "脑子"], "profile": "藏在头骨里、指挥全身的器官，负责思考、记忆和感受。", "hints": ["它在身体里面", "它藏在头部", "它负责思考"]}, {"zh": "肺", "en": "lungs", "aliases": ["肺部", "lung"], "profile": "胸腔里一对像海绵一样的器官，吸进氧气、呼出二氧化碳。", "hints": ["它在身体里面", "它有左右两个", "它帮我们呼吸"]}, {"zh": "胃", "en": "stomach", "aliases": ["胃部"], "profile": "肚子里像口袋一样的器官，能装下吃进去的食物，把它们磨碎并初步消化。", "hints": ["它在身体里面", "它像一个口袋", "它能装下吃的饭"]}, {"zh": "皮肤", "en": "skin", "aliases": ["肌肤"], "profile": "包在全身最外面的一层，能保护身体、感觉冷热，是人体最大的器官。", "hints": ["它包着全身", "它能感觉冷热", "它怕太阳晒太久"]}, {"zh": "肌肉", "en": "muscles", "aliases": ["muscle"], "profile": "大多附着在骨头上、能收缩和放松的身体组织，让身体动起来。", "hints": ["它遍布全身", "它能收缩", "它让身体动起来"]}, {"zh": "血液", "en": "blood", "aliases": ["血"], "profile": "在全身管道里流动的红色液体，给身体各处送去氧气和营养。", "hints": ["它在身体里面", "它是一种液体", "它是红色的"]}, {"zh": "呼吸", "en": "breathing", "aliases": ["喘气", "breathe", "breath"], "profile": "把空气吸进肺里、再把废气呼出来的过程，一刻也不能停。", "hints": ["它是一种身体现象", "它一刻也不停", "它会让胸口起伏"]}, {"zh": "做梦", "en": "dreaming", "aliases": ["梦", "dream"], "profile": "睡着时脑子里出现的画面和故事，醒来后有时还记得。", "hints": ["它是一种身体现象", "它发生在睡着时", "它像在看电影"]}, {"zh": "鸡皮疙瘩", "en": "goose bumps", "aliases": ["起鸡皮疙瘩", "鸡皮", "goosebumps"], "profile": "冷或害怕时，皮肤上的汗毛竖起来，冒出一粒粒小疙瘩的现象。", "hints": ["它是一种身体现象", "它出现在皮肤上", "它常在觉得冷时出现"]}, {"zh": "视觉", "en": "sight", "aliases": ["vision"], "profile": "用眼睛看见光、颜色和形状的感觉，是五种基本感觉之一。", "hints": ["它是一种感觉", "它需要光", "它能看出颜色"]}, {"zh": "听觉", "en": "hearing", "aliases": ["听力"], "profile": "用耳朵听见声音的感觉，能分辨声音的大小、高低和方向。", "hints": ["它是一种感觉", "它和声音有关", "它怕太大的噪音"]}, {"zh": "味觉", "en": "taste", "aliases": ["sense of taste"], "profile": "用舌头尝出酸、甜、苦、咸、鲜等味道的感觉。", "hints": ["它是一种感觉", "它和吃东西有关", "它能分出酸和甜"]}, {"zh": "蛀牙", "en": "tooth decay", "aliases": ["龋齿", "虫牙", "cavity"], "profile": "细菌把糖变成酸，慢慢把牙齿腐蚀出小洞的问题，要勤刷牙来预防。", "hints": ["它和牙齿有关", "它是牙齿上的问题", "它和吃糖太多有关"]}, {"zh": "细菌", "en": "bacteria", "aliases": ["病菌", "bacterium", "germs"], "profile": "非常非常小、只能用显微镜看到的生物，有的让人生病，有的对身体有益。", "hints": ["它非常小", "它是一种生物", "它有好有坏"]}, {"zh": "维生素", "en": "vitamins", "aliases": ["维他命", "vitamin"], "profile": "身体需要量很少、却不可缺少的营养物质，蔬菜水果里很多。", "hints": ["它是一种营养", "它需要量很少", "它常用字母来分类"]}, {"zh": "钙", "en": "calcium", "aliases": ["钙质"], "profile": "让骨头和牙齿坚硬结实的营养元素，牛奶和豆制品里很多。", "hints": ["它是一种营养", "它是一种矿物质", "它让骨头更结实"]}]}, {"title_zh": "人体小博士", "title_en": "Body Scholar", "step": 7, "offset": 0, "items": [{"zh": "关节", "en": "joints", "aliases": ["骨关节", "joint"], "profile": "两块骨头相连、可以活动的地方，让身体能弯曲和转动。", "hints": ["它在骨头之间", "它全身有很多", "它让身体能弯曲"]}, {"zh": "脊柱", "en": "spine", "aliases": ["脊椎", "脊梁骨", "backbone"], "profile": "后背正中一节一节连起来的骨头，撑起上半身，保护里面的脊髓。", "hints": ["它是一种骨头", "它在后背", "它一节一节的"]}, {"zh": "喉咙", "en": "throat", "aliases": ["嗓子", "咽喉"], "profile": "脖子里面、嘴巴后方的通道，吃的东西和吸进的空气都会经过这里。", "hints": ["它在脖子里", "它是一个通道", "它和吞咽有关"]}, {"zh": "瞳孔", "en": "pupil", "aliases": ["瞳仁", "眼仁", "pupils"], "profile": "眼睛中间黑色的小圆孔，是光进入眼睛的入口，会随着明暗变大变小。", "hints": ["它在眼睛上", "它是黑色的", "它会变大变小"]}, {"zh": "味蕾", "en": "taste buds", "aliases": ["taste bud"], "profile": "舌头表面尝味道的小结构，能分辨酸、甜、苦、咸、鲜。", "hints": ["它在舌头上", "它非常小", "它能尝出甜味"]}, {"zh": "指纹", "en": "fingerprints", "aliases": ["手指纹", "fingerprint"], "profile": "手指头上弯弯曲曲的细小纹路，每个人都不一样。", "hints": ["它在手上", "它是一些纹路", "它每个人都不一样"]}, {"zh": "小肠", "en": "small intestine", "aliases": ["small intestines"], "profile": "肚子里又细又长、弯弯曲曲的管子，是消化食物和吸收营养的主要地方。", "hints": ["它在肚子里", "它非常长", "它能吸收营养"]}, {"zh": "消化", "en": "digestion", "aliases": ["digest"], "profile": "把吃进的食物分解成身体能吸收的营养的过程，从嘴巴就开始了。", "hints": ["它是一个过程", "它和吃东西有关", "它从嘴巴开始"]}, {"zh": "嗅觉", "en": "smell", "aliases": ["sense of smell"], "profile": "用鼻子闻出各种气味的感觉，能帮我们发现食物香不香、有没有坏。", "hints": ["它是一种感觉", "它和气味有关", "它能发现烟味"]}, {"zh": "触觉", "en": "touch", "aliases": ["sense of touch"], "profile": "通过皮肤感受冷热、软硬、粗细和疼痛的感觉。", "hints": ["它是一种感觉", "它和皮肤有关", "它能分出冷和热"]}, {"zh": "近视", "en": "nearsightedness", "aliases": ["近视眼", "myopia"], "profile": "看近处清楚、看远处模糊的眼睛问题，要注意用眼习惯来预防。", "hints": ["它和眼睛有关", "它是一种视力问题", "它会看不清远处"]}, {"zh": "疫苗", "en": "vaccine", "aliases": ["预防针", "vaccines"], "profile": "帮身体提前认识病菌、学会对抗它们的预防用品，通常打针接种。", "hints": ["它和预防生病有关", "它通常要打针", "它让身体认识病菌"]}, {"zh": "蛋白质", "en": "protein", "aliases": ["proteins"], "profile": "构成肌肉、皮肤和头发的重要营养，鸡蛋、牛奶、肉和豆子里都很多。", "hints": ["它是一种营养", "它在鸡蛋里很多", "它帮身体长肌肉"]}, {"zh": "均衡饮食", "en": "balanced diet", "aliases": ["营养均衡", "饮食均衡"], "profile": "各种食物都吃、不挑食也不吃太多的好习惯，让身体得到全面的营养。", "hints": ["它是一个好习惯", "它和吃饭有关", "它要求不挑食"]}, {"zh": "热身运动", "en": "warm up", "aliases": ["热身", "准备活动", "warming up"], "profile": "正式运动前先慢慢活动身体的准备动作，能减少运动时受伤。", "hints": ["它是一个好习惯", "它和运动有关", "它在运动前做"]}]}, {"title_zh": "器官探险家", "title_en": "Organ Explorer", "step": 7, "offset": 0, "items": [{"zh": "细胞", "en": "cells", "aliases": ["cell"], "profile": "构成人体的最小单位，非常小，要用显微镜才能看到，人体由几十万亿个组成。", "hints": ["它非常小", "它是身体的基本单位", "它要用显微镜看"]}, {"zh": "血管", "en": "blood vessels", "aliases": ["blood vessel"], "profile": "遍布全身的管道，让血液流到身体每一个地方。", "hints": ["它在身体里面", "它是一种管道", "它遍布全身"]}, {"zh": "脉搏", "en": "pulse", "aliases": [], "profile": "心脏跳动时，动脉跟着一下一下地跳，用手指在手腕上就能摸到。", "hints": ["它是一种身体现象", "它在手腕能摸到", "它和心跳一样快"]}, {"zh": "肝脏", "en": "liver", "aliases": ["肝"], "profile": "肚子右上方最大的内脏器官，能储存营养、分解有害物质。", "hints": ["它在身体里面", "它在肚子右上方", "它是最大的内脏"]}, {"zh": "肾脏", "en": "kidneys", "aliases": ["肾", "腰子", "kidney"], "profile": "后腰两侧一对像蚕豆的器官，负责过滤血液、制造尿液。", "hints": ["它在身体里面", "它有左右两个", "它的形状像豆子"]}, {"zh": "大肠", "en": "large intestine", "aliases": ["large bowel"], "profile": "接在小肠后面的粗管子，吸收剩下的水分，把食物残渣变成粪便排出。", "hints": ["它在肚子里", "它是一条粗管子", "它能吸收水分"]}, {"zh": "食道", "en": "esophagus", "aliases": ["食管", "gullet"], "profile": "连接喉咙和胃的肌肉管道，咽下的食物经它送进胃里。", "hints": ["它在身体里面", "它是一条管道", "它把食物送进胃"]}, {"zh": "气管", "en": "windpipe", "aliases": ["trachea"], "profile": "从喉咙通到肺、专门让空气进出的管道，由一圈圈软骨撑着。", "hints": ["它在身体里面", "它是一条管道", "它让空气通过"]}, {"zh": "声带", "en": "vocal cords", "aliases": ["vocal folds"], "profile": "喉咙里两片有弹性的薄片，空气经过时振动发出声音。", "hints": ["它在喉咙里", "它会振动", "它让我们能说话"]}, {"zh": "鼓膜", "en": "eardrum", "aliases": ["耳膜", "eardrums"], "profile": "耳朵里面一层薄薄的膜，声音传来时会像鼓面一样振动。", "hints": ["它在耳朵里", "它是一层薄膜", "它会振动"]}, {"zh": "病毒", "en": "virus", "aliases": ["viruses"], "profile": "比细菌小得多的微小病原体，只能在活细胞里复制，会让人感冒等。", "hints": ["它非常非常小", "它会让人生病", "它能在人之间传播"]}, {"zh": "免疫系统", "en": "immune system", "aliases": ["免疫力", "免疫"], "profile": "身体里的“保卫部队”，能发现并消灭入侵的病菌，让身体少生病。", "hints": ["它在身体里面", "它像一支军队", "它能打败病菌"]}, {"zh": "过敏", "en": "allergy", "aliases": ["过敏反应", "allergies"], "profile": "身体把花粉、灰尘或某些食物误当成坏东西，产生打喷嚏、发痒等反应。", "hints": ["它是一种身体反应", "它不会传染", "它和花粉有关"]}, {"zh": "脂肪", "en": "fat", "aliases": ["油脂", "fats"], "profile": "储存能量的一种营养，也能在皮下保暖，油、坚果和肉里都有。", "hints": ["它是一种营养", "它能储存能量", "它在食用油里很多"]}, {"zh": "碳水化合物", "en": "carbohydrates", "aliases": ["糖类", "碳水", "carbs"], "profile": "米饭、面包、土豆里最多的营养，是身体最主要的能量来源。", "hints": ["它是一种营养", "它提供能量", "它在米饭里最多"]}]}, {"title_zh": "细胞观察员", "title_en": "Cell Observer", "step": 5, "offset": 0, "items": [{"zh": "红细胞", "en": "red blood cells", "aliases": ["红血球", "red blood cell"], "profile": "血液里数量最多的细胞，呈红色，负责把氧气运到全身。", "hints": ["它在血液里", "它数量非常多", "它运送氧气"]}, {"zh": "白细胞", "en": "white blood cells", "aliases": ["白血球", "white blood cell"], "profile": "血液里的“卫兵”细胞，能吞掉或消灭入侵的病菌。", "hints": ["它在血液里", "它像卫兵", "它能消灭病菌"]}, {"zh": "血小板", "en": "platelets", "aliases": ["platelet"], "profile": "血液里很小的细胞碎片，受伤出血时能聚在一起帮助止血。", "hints": ["它在血液里", "它非常小", "它帮伤口止血"]}, {"zh": "动脉", "en": "arteries", "aliases": ["artery"], "profile": "把血液从心脏送往全身的血管，管壁厚而有弹性。", "hints": ["它在身体里面", "它是一种管道", "它从心脏出发"]}, {"zh": "静脉", "en": "veins", "aliases": ["vein"], "profile": "把血液从全身送回心脏的血管，手背上看到的青色细线就是它。", "hints": ["它在身体里面", "它是一种管道", "它通向心脏"]}, {"zh": "视网膜", "en": "retina", "aliases": [], "profile": "眼球最里面的一层薄膜，像相机的底片，把光变成信号传给大脑。", "hints": ["它在眼睛里", "它是一层薄膜", "它像相机底片"]}, {"zh": "晶状体", "en": "lens", "aliases": ["水晶体", "crystalline lens"], "profile": "眼睛里透明、像凸透镜一样的结构，能改变厚薄，让远近的东西都看清。", "hints": ["它在眼睛里", "它是透明的", "它像一个凸透镜"]}, {"zh": "膝跳反射", "en": "knee jerk reflex", "aliases": ["膝反射", "patellar reflex"], "profile": "轻敲膝盖下方时，小腿会不由自主地向前一踢的反射。", "hints": ["它是一种反射", "它和腿有关", "它不需要思考"]}, {"zh": "小脑", "en": "cerebellum", "aliases": [], "profile": "位于大脑后下方的脑部结构，负责保持身体平衡、让动作协调。", "hints": ["它在头部", "它是脑的一部分", "它帮身体保持平衡"]}, {"zh": "骨髓", "en": "bone marrow", "aliases": ["marrow"], "profile": "藏在骨头中间的柔软组织，是制造血细胞的工厂。", "hints": ["它在骨头里", "它是软的", "它能制造血细胞"]}, {"zh": "新陈代谢", "en": "metabolism", "aliases": ["代谢"], "profile": "身体里所有化学变化的总称，把食物变成能量，并用新的东西替换旧的。", "hints": ["它是一个过程", "它发生在细胞里", "它让身体得到能量"]}, {"zh": "血型", "en": "blood type", "aliases": ["blood group"], "profile": "按照红细胞表面的标记给血液分的类型，最常见的分法是A、B、AB、O四种。", "hints": ["它和血液有关", "它有好几种", "它常用字母表示"]}, {"zh": "膳食纤维", "en": "dietary fiber", "aliases": ["纤维", "粗纤维", "fibre"], "profile": "蔬菜、水果和粗粮里不能被消化的部分，能帮助肠道蠕动、预防便秘。", "hints": ["它是一种营养", "它不能被消化", "它在芹菜里很多"]}, {"zh": "有氧运动", "en": "aerobic exercise", "aliases": ["有氧锻炼", "aerobics"], "profile": "跑步、游泳、跳绳这类时间较长、强度中等的运动，能锻炼心肺。", "hints": ["它是一个好习惯", "它是一种运动", "它能锻炼心肺"]}]}, {"title_zh": "生理研究员", "title_en": "Physiology Researcher", "step": 5, "offset": 0, "items": [{"zh": "毛细血管", "en": "capillaries", "aliases": ["capillary"], "profile": "人体最细的血管，比头发还细很多，连接动脉和静脉。", "hints": ["它在身体里面", "它非常细", "它遍布全身"]}, {"zh": "肺泡", "en": "alveoli", "aliases": ["alveolus"], "profile": "肺里无数个像小气球一样的小泡泡，氧气和二氧化碳在这里交换。", "hints": ["它在肺里", "它像小气球", "它数量非常多"]}, {"zh": "胃酸", "en": "stomach acid", "aliases": ["胃液", "gastric acid"], "profile": "胃分泌的强酸性液体，能帮助消化食物，还能杀死吃进去的细菌。", "hints": ["它在身体里面", "它是一种液体", "它非常酸"]}, {"zh": "牙釉质", "en": "tooth enamel", "aliases": ["珐琅质", "釉质", "enamel"], "profile": "牙齿最外面一层白色硬壳，是人体最坚