# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for flowcraft-story-three-kingdoms,
# So that every reachable role path produces text and non-empty synthesized audio.
version: gizclaw.test/v1alpha1
name: story-three-kingdoms.flowcraft.roles
clients:
  narrator:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  liu-bei:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  zhuge-liang:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  guan-yu:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  zhang-fei:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  narrator_workspace:
    direction: input
    type: string
    generate: token
  liu_bei_workspace:
    direction: input
    type: string
    generate: token
  zhuge_liang_workspace:
    direction: input
    type: string
    generate: token
  guan_yu_workspace:
    direction: input
    type: string
    generate: token
  zhang_fei_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 60m
steps:
- id: register_narrator
  client: narrator
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: "${narrator_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-three-kingdoms
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${narrator_workspace}"
- id: warmup_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_liu-bei
  client: liu-bei
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_liu_bei_workspace
  client: liu-bei
  rpc:
    method: server.workspace.create
    request:
      name: "${liu_bei_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-three-kingdoms
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_liu_bei_workspace
  client: liu-bei
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${liu_bei_workspace}"
- id: warmup_liu_bei_workspace
  client: liu-bei
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_zhuge-liang
  client: zhuge-liang
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_zhuge_liang_workspace
  client: zhuge-liang
  rpc:
    method: server.workspace.create
    request:
      name: "${zhuge_liang_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-three-kingdoms
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_zhuge_liang_workspace
  client: zhuge-liang
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${zhuge_liang_workspace}"
- id: warmup_zhuge_liang_workspace
  client: zhuge-liang
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_guan-yu
  client: guan-yu
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_guan_yu_workspace
  client: guan-yu
  rpc:
    method: server.workspace.create
    request:
      name: "${guan_yu_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-three-kingdoms
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_guan_yu_workspace
  client: guan-yu
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${guan_yu_workspace}"
- id: warmup_guan_yu_workspace
  client: guan-yu
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_zhang-fei
  client: zhang-fei
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_zhang_fei_workspace
  client: zhang-fei
  rpc:
    method: server.workspace.create
    request:
      name: "${zhang_fei_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-three-kingdoms
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_zhang_fei_workspace
  client: zhang-fei
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${zhang_fei_workspace}"
- id: warmup_zhang_fei_workspace
  client: zhang-fei
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: 请由旁白承接当前故事，只推进一个可见线索。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_narrator_first_response
  client: narrator
  timeout: 15s
  peer_stream:
    mode: text
    input: 请由旁白承接当前故事，只推进一个可见线索。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: probe_liu-bei
  client: liu-bei
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让刘备亲自回应，只说这个角色知道的事。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 刘备说
      - 刘备：
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_liu-bei_first_response
  client: liu-bei
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让刘备亲自回应，只说这个角色知道的事。
    completion: first_response
    first_text_timeout: 2s
