- id: stop_narrator_run
  client: narrator
  rpc:
    method: server.run.stop
    request: {}
- id: delete_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.delete
    request:
      name: "${narrator_workspace}"
- id: delete_narrator_peer
  client: narrator
  rpc:
    method: server.peer.delete
    request: {}
- id: stop_shahrazad_run
  client: shahrazad
  rpc:
    method: server.run.stop
    request: {}
- id: delete_shahrazad_workspace
  client: shahrazad
  rpc:
    method: server.workspace.delete
    request:
      name: "${shahrazad_workspace}"
- id: delete_shahrazad_peer
  client: shahrazad
  rpc:
    method: server.peer.delete
    request: {}
- id: stop_shahryar_run
