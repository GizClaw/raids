    "/eino_roles_astronomer_scene_setup_1/audio_eos":
      equals: true
    "/eino_roles_astronomer_scene_setup_1/audio_bytes":
      minimum: 1
    "/eino_roles_astronomer_scene_setup_1/first_text_ms":
      maximum: 6000
    "/eino_roles_astronomer_scene_setup_1/first_audio_ms":
      maximum: 90000
