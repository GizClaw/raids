apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: learn-math-grade6-test
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    graph:
      name: learn-math-grade6-test-relay
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 8
      state:
        fields:
        - name: tester-route
          type: string
          merge: replace
        - name: tester-message
          type: string
          merge: replace
        - name: tester-det
          type: string
          merge: replace
        - name: prompt-system
          type: string
          merge: replace
        - name: prompt-user
          type: string
          merge: replace
        - name: judge-messages
          type: messages
          merge: replace
        - name: model-text
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: route-turn
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: tester-route
          message: tester-message
          det: tester-det
          system: prompt-system
          user: prompt-user
        language: starlark
        entrypoint: run
        source: |
          REQUESTS = ["请从指定中文开场开始。", "我们来做这道题：在比例尺是1比100000的地图上，两个地方相距3厘米，实际相距多少千米？你先别告诉我答案，给我一点提示。", "我算出来是300米，对吗？", "我想不出来了，请告诉我答案和理由。", "给我讲一个数学小故事，它是有记载的、一般认为的，还是传说？", "发明乘法口诀的那个人叫什么名字？是哪一天发明的？", "请记住：我今天学会了比例尺，下次想学鸽巢问题。只确认你已经记住。", "重连后，请只说我下次想学什么。"]
          INTENTS = ["", "", "", "", "", "", "", ""]
          CHECKPOINTS = ["opening", "puzzle-no-spoiler", "wrong-answer", "reveal", "culture-label", "unknown-boundary", "memory-store", "memory-recall"]
          CONTRACTS = ["必须逐字符合指定中文开场；不得含Markdown、列表、emoji或舞台说明；15-240字", "只给第一步提示，不得说出答案；30-360字", "必须温和指出不对并再给一个提示，不得公布答案；20-360字", "必须说出正确答案3千米并用一两句讲清理由，算式说法不含符号；20-360字", "只讲知识卡里的数学文化或数学家故事并说明性质；20-360字", "知识卡没有这个细节，必须说没有确切记载或不确定，不得编造人名和日期；10-320字", "必须确认已记住下次想学鸽巢问题（复述措辞可以不同，下一轮重连后再严格核对）；4-320字", "重载后必须从长期记忆准确回忆鸽巢问题；只回答主题；2-200字"]
          CHECKS = [{"required": ["你好呀，我是数学小博士。我们来玩六年级的数学吧，你想听一个数学小故事，还是来挑战一道趣味题？"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 15, "max_runes": 240}, {"required": [], "required_any": [], "forbidden": ["###", "```", "- ", "* ", "3千米", "3公里"], "min_runes": 30, "max_runes": 360}, {"required": [], "required_any": [["不对", "不太对", "再想想", "不是", "差一点", "还不对"]], "forbidden": ["###", "```", "- ", "* ", "3千米", "3公里"], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["3千米", "3公里"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["记载", "一般认为", "传说", "相传", "据说"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["没有记载", "没有留下记载", "没有相关记载", "没有确切记载", "不确定", "不知道", "查不到", "没有资料", "无法确定", "没法确定", "没有确切"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 10, "max_runes": 320}, {"required": [], "required_any": [["记住", "记下", "记好", "记得"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 4, "max_runes": 320}, {"required": [], "required_any": [["鸽巢问题"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 2, "max_runes": 200}]
          RULES = "你是 `learn-math-grade6` 的专属验收 Workflow，不是目标角色。指定中文开场是：你好呀，我是数学小博士。我们来玩六年级的数学吧，你想听一个数学小故事，还是来挑战一道趣味题？ 体验要求：数学小博士陪孩子拓展课本数学；计算必须准确并先在心里验算；出题先提示、等孩子作答，孩子答错时温和指出并继续提示，不直接公布答案；孩子明确放弃后才说答案和理由；数学文化要区分有记载、一般认为和传说；可以补充公认准确的内容，查无实据的细节必须承认没有确切记载或不确定，不得编造；孩子问任何数学问题都要正常回答，婉拒属于失败。本路线使用的趣味题是“在比例尺是1比100000的地图上，两个地方相距3厘米，实际相距多少千米？”，正确答案是3千米，玩家会先答300米。知识卡没有记录发明乘法口诀者的姓名和具体日期。 知识卡是目标的提纲：目标可以在知识卡基础上补充公认准确的常识、背景和延伸知识，这不算编造；只有和知识卡矛盾、明显错误，或查无实据的细节（例如某人某天吃了什么、说过的原话、具体日期）才算编造。完整知识卡如下：单元 六年级上册（修订版）：一 确定位置（用数对（列，行）表示位置，如（2，3）；用方向和距离确定位置；描述物体的运动路线）；二 分数乘法（分数乘整数：分子乘整数，分母不变；分数乘分数：分子乘分子，分母乘分母；求一个数的几分之几是多少，用乘法）；三 分数除法（乘积是1的两个数互为倒数；除以一个数，等于乘它的倒数；工程问题：把总工作量看作1）；生活中的负数（负数表示相反意义的量，如零下4℃；数轴上，负数在0的左边）；四 圆（圆心、半径、直径；认识扇形；周长C=πd=2πr，π约等于3.14；圆面积S=πr²）；体育中的数学（研究体育里的数学，如跑道起跑线）；五 百分数（百分数表示一个数是另一个数的百分之几；百分率、折扣、利率、增长率）；水是生命之源（调查用水情况，设计节水方案）；六 复习与关联（整理分数乘除法、圆等知识；选学：数学广角·鸽巢问题） 拓展题 六年级上册《鸽巢问题》：7只鸽子飞回3个鸽笼，为什么总有一个鸽笼里至少有3只鸽子？｜思路：先尽量平均分：每个鸽笼先放2只。；3个鸽笼放了2×3=6只，还剩1只。；剩下这1只不管飞进哪个笼，那个笼就有3只。；所以总有一个笼里至少有3只。｜答案：总有一个鸽笼至少有3只 趣味题：一根绳子长12米，用去了三分之二，还剩多少米？｜提示：还剩几分之几？1减三分之二。；还剩三分之一。；12米的三分之一，就是12除以3。｜答案：4米 趣味题：早上气温是零下3度，中午比早上升高了8度，中午是多少度？｜提示：从零下3度往上数。；先升3度，到0度。；8度还剩5度，再往上升5度。｜答案：5℃（零上5度） 趣味题：一个圆的半径是1米，它的周长大约是多少米？（π取3.14）｜提示：周长=2×π×半径。；半径1米，直径就是2米。；3.14×2是多少？｜答案：6.28米 数学文化（史实）：祖冲之算出圆周率在3.1415926和3.1415927之间，还给出密率355/113。 数学文化（史实）：刘徽用割圆术：从圆内接正六边形开始，边数不断加倍，越来越接近圆。 数学文化（史实）：《墨经》说“圜，一中同长也”：圆有一个中心，到圆上各点一样长。 单元 六年级下册（旧版）：1 负数（用正数、负数表示相反意义的量；0既不是正数，也不是负数）；2 百分数（二）（折扣：八折就是原价的80%；成数、税率、利率）；生活与百分数（调查利率，设计合理的理财方案）；3 圆柱与圆锥（圆柱体积=底面积×高；等底等高的圆锥，体积是圆柱的三分之一；圆柱侧面展开是长方形）；4 比例（两个比相等的式子叫比例；正比例和反比例；比例尺=图上距离∶实际距离）；自行车里的数学（用齿轮齿数算自行车能走多远）；5 数学广角——鸽巢问题（4支笔放进3个笔筒，总有一个至少2支；物体数÷抽屉数有余数时，至少数=商+1）；6 整理和复习（整理小学六年学过的数学） 拓展题 六年级下册《鸽巢问题（抽屉原理）》：把4支铅笔放进3个笔筒，不管怎么放，为什么总有一个笔筒里至少有2支？｜思路：先尽量平均放：每个笔筒放1支。；3个笔筒放了3支，还剩1支。；这1支放进哪个笔筒，那个笔筒就有2支。；所以总有一个笔筒至少有2支。｜答案：总有一个笔筒至少有2支 趣味题：抽屉里有很多红袜子和白袜子，闭着眼睛拿，至少拿几只才能保证有两只颜色一样？｜提示：颜色只有两种，就像两个鸽笼。；最不走运时，前两只一红一白。；第三只一定和其中一只同色。｜答案：3只 趣味题：一个圆柱和一个圆锥等底等高，圆柱的体积是12立方分米，圆锥的体积是多少？｜提示：等底等高时，圆锥体积是圆柱的三分之一。；就是12的三分之一。；12除以3。｜答案：4立方分米 趣味题：在比例尺是1比100000的地图上，两个地方相距3厘米，实际相距多少千米？｜提示：图上1厘米表示实际100000厘米。；3×100000=300000厘米。；100000厘米是1千米。｜答案：3千米 数学文化（史实）：《九章算术》讲了正负数的加减法；刘徽用红算筹表示正数、黑算筹表示负数。 数学文化（史实）：1834年德国数学家狄利克雷把它叫“抽屉原理”，所以也叫狄利克雷原理。 数学家（史实）：华罗庚（1910—1985），江苏金坛人，初中毕业后靠刻苦自学成为著名数学家。 数学家（史实）：陈景润研究哥德巴赫猜想，证明了“1+2”，1973年发表，被称为“陈氏定理”。 数学家（传说）：传说高斯小时候飞快算出老师出的一串数之和；“1加到100”这个细节是后人加的。 数学家（史实）：祖冲之（429—500），南北朝数学家，算出圆周率在3.1415926和3.1415927之间。"
          PERSONA = ""
          JUDGE_DIMS = ["instruction_following", "continuity", "factuality", "non_repetition"]
          OFFSET = 0
          N = 8
          WHITESPACE = " \t\n\r　"
          PUNCT = "，。！？、；：“”‘’（）《》〈〉【】『』「」—…·～,.!?;:'\"()[]{}<>-_/\\|`~@#$%^&*+=·"
          DIGITS = {"０": "0", "１": "1", "２": "2", "３": "3", "４": "4", "５": "5", "６": "6", "７": "7", "８": "8", "９": "9", "零": "0", "一": "1", "二": "2", "三": "3", "四": "4", "五": "5", "六": "6", "七": "7", "八": "8", "九": "9"}
          def rune_count(text):
              n = 0
              for _ in text.codepoints():
                  n += 1
              return n

          def normalize(text, drop_punct):
              out = []
              for ch in text.codepoints():
                  if ch in WHITESPACE:
                      continue
                  if drop_punct and ch in PUNCT:
                      continue
                  if ch in DIGITS:
                      out.append(DIGITS[ch])
                      continue
                  out.append(ch.lower())
              return "".join(out)

          def is_sentinel(value):
              if value in ["```", "###", "-"]:
                  return True
              if len(value) < 2 or not value.endswith("."):
                  return False
              for ch in value[:-1].codepoints():
                  if ch not in "0123456789":
                      return False
              return True

          def forbidden_hit(text, needle):
              trimmed = needle.strip()
              if trimmed.endswith(":") or trimmed.endswith("："):
                  return normalize(trimmed, False) in normalize(text, False)
              normalized = normalize(needle, True)
              if normalized == "" or is_sentinel(trimmed):
                  return trimmed in text
              return normalized in normalize(text, True)

          def deterministic_failures(index, text):
              spec = CHECKS[index]
              failures = []
              plain = normalize(text, False)
              for fact in spec.get("required", []):
                  if normalize(fact, False) not in plain:
                      failures.append("required:" + fact)
              for group in spec.get("required_any", []):
                  found = False
                  for fact in group:
                      if normalize(fact, False) in plain:
                          found = True
                          break
                  if not found:
                      failures.append("required_any:" + "|".join(group))
              for fact in spec.get("forbidden", []):
                  if forbidden_hit(text, fact):
                      failures.append("forbidden:" + fact)
              count = rune_count(text)
              if spec.get("min_runes", 0) > 0 and count < spec["min_runes"]:
                  failures.append("min_runes:" + str(count) + "<" + str(spec["min_runes"]))
              if spec.get("max_runes", 0) > 0 and count > spec["max_runes"]:
                  failures.append("max_runes:" + str(count) + ">" + str(spec["max_runes"]))
              return failures

          def aligned_rounds(messages):
              # Returns [(index, request_text, reply_text)] aligned from the newest message
              # backwards so a truncated History window still maps later rounds correctly.
              users = []
              previous_assistant = ""
              for message in messages:
                  role = message.get("role", "")
                  content = message.get("content", "")
                  if role == "assistant":
                      previous_assistant = content
                  elif role == "user":
                      users.append((previous_assistant, content))
              rounds = []
              total = len(users)
              for position in range(total):
                  index = N - 1 - (total - 1 - position)
                  if index < 0:
                      continue
                  request = REQUESTS[index]
                  if request == "":
                      request = users[position][0]
                  rounds.append((index, request, users[position][1]))
              return rounds

          def output_index(messages):
              count = 0
              last = ""
              for message in messages:
                  if message.get("role", "") == "assistant":
                      count += 1
                      last = message.get("content", "").strip()
              index = count
              if last != "":
                  for j in range(N):
                      if REQUESTS[j] != "" and REQUESTS[j].strip() == last and j + 1 - OFFSET > index:
                          index = j + 1 - OFFSET
              return index

          def recent_transcript(messages, limit):
              lines = []
              for message in messages[-limit:]:
                  role = message.get("role", "")
                  label = "玩家" if role == "assistant" else "目标"
                  lines.append(label + "：" + message.get("content", "").strip())
              return "\n".join(lines)

          def run(input):
              messages = input["messages"]
              k = output_index(messages)
              request_index = k + OFFSET
              if request_index < N:
                  if REQUESTS[request_index] != "":
                      return {
                          "route": "scripted",
                          "message": REQUESTS[request_index],
                          "det": "",
                          "system": "你是测试脚手架。只回复 OK。",
                          "user": "OK",
                      }
                  system = "\n".join([
                      RULES,
                      "",
                      "现在你扮演模拟玩家。" + PERSONA,
                      "根据给定意图，只输出一句自然的玩家话语；不得回答它、不得添加对话中不存在的名字、数字、事件或证据，不得削弱意图约束，不得提及测试。只输出这句话，不要引号、前缀或解释。",
                  ])
                  user = "意图：" + INTENTS[request_index] + "\n\n最近对话：\n" + recent_transcript(messages, 6)
                  return {"route": "player", "message": "", "det": "", "system": system, "user": user}
              rounds = aligned_rounds(messages)
              failures = []
              blocks = []
              for round in rounds:
                  index = round[0]
                  for failure in deterministic_failures(index, round[2]):
                      failures.append(CHECKPOINTS[index] + " " + failure)
                  blocks.append("\n".join([
                      "【第" + str(index + 1) + "轮 " + CHECKPOINTS[index] + "】",
                      "契约：" + CONTRACTS[index],
                      "玩家：" + round[1],
                      "目标：" + round[2],
                  ]))
              system = "\n".join([
                  RULES,
                  "",
                  "这是最后一轮。你只看到完整对话记录：标注“玩家”的是测试方发出的消息，标注“目标”的是被测 Workflow 的回复。",
                  "请依据每一轮的契约逐轮判断以下维度：" + "、".join(JUDGE_DIMS) + "。确定性字数、关键词、顺序和延迟门槛由外部负责，你只判断语义：连续性、事实边界、指令遵循、不重复、玩家自主权和安全。",
                  "确定性检查（字数、关键词、顺序、延迟）已由外部完成：本轮若未列出失败，就不得以这些理由判 FAIL，也不得自行重新计数。",
                  "判 FAIL 必须写明具体轮号和该轮回复中的具体缺陷原文；举不出具体轮号和原文时一律判 PASS。",
                  "不得因为风格偏好、篇幅、语气或可以更好判坏语义合格的回复；但契约明确暴露的事实边界被违反时必须判 FAIL。",
                  "先用不超过200字说明依据，最后一行只写 PASS 或 FAIL，不要其他字符。",
              ])
              user_parts = ["完整测试对话（按时间顺序，共 " + str(len(rounds)) + " 轮可见）：", ""] + blocks
              if len(failures) > 0:
                  user_parts.append("")
                  user_parts.append("确定性检查已发现失败（最终裁决将为 FAIL）：" + "；".join(failures))
              user_parts.append("")
              user_parts.append("请按规则裁决，最后一行只写 PASS 或 FAIL。")
              return {
                  "route": "judge",
                  "message": "",
                  "det": "；".join(failures),
                  "system": system,
                  "user": "\n".join(user_parts),
              }
        limits:
          max_execution_steps: 2000000
          timeout: 2s
          max_input_bytes: 1048576
          max_output_bytes: 262144
      - id: build-prompt
        type: prompt
        inputs:
          system:
            from: prompt-system
          user:
            from: prompt-user
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: '{system}'
        - role: user
          template: '{user}'
      - id: judge-model
        type: chat_model
        inputs:
          messages:
            from: judge-messages
        outputs:
          text: model-text
        model: learn-math-grade6-test.model
        max_tokens: 512
        temperature: 0
      - id: finalize
        type: script
        inputs:
          route:
            from: tester-route
          message:
            from: tester-message
          det:
            from: tester-det
          model_text:
            from: model-text
        outputs:
          answer: answer
        language: starlark
        entrypoint: run
        source: |
          def verdict_from(text):
              lines = []
              for line in text.strip().split("\n"):
                  if line.strip() != "":
                      lines.append(line.strip())
              last = lines[-1] if len(lines) > 0 else ""
              if "PASS" in last and "FAIL" not in last:
                  return "PASS"
              if "FAIL" in last:
                  return "FAIL"
              if "PASS" in text and "FAIL" not in text:
                  return "PASS"
              return "FAIL"

          def run(input):
              route = input["route"]
              if route == "scripted":
                  return {"answer": input["message"]}
              if route == "player":
                  text = input["model_text"].strip()
                  first = text.split("\n")[0].strip().strip("“”\"'")
                  if first == "":
                      first = "请继续。"
                  return {"answer": first}
              if input["det"] != "":
                  return {"answer": "FAIL 确定性检查：" + input["det"]}
              verdict = verdict_from(input["model_text"])
              if verdict == "PASS":
                  return {"answer": "PASS"}
              return {"answer": "FAIL 裁判：" + input["model_text"].strip()[:400]}
        limits:
          max_execution_steps: 200000
          timeout: 500ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      edges:
      - from: start
        to: route-turn
      - from: route-turn
        to: build-prompt
      - from: build-prompt
        to: judge-model
      - from: judge-model
        to: finalize
      - from: finalize
        to: end
      branches: []
      outputs:
      - node: finalize
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
