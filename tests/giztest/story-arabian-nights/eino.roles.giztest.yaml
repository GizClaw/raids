# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for eino-story-arabian-nights,
# So that each reachable role produces text and non-empty audio within the latency gates.
version: gizclaw.test/v1alpha1
name: story-arabian-nights.eino.roles
clients:
  narrator:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  shahrazad:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  shahryar:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  sinbad:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  merchant:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  narrator_workspace:
    direction: input
    type: string
    generate: token
  shahrazad_workspace:
    direction: input
    type: string
    generate: token
  shahryar_workspace:
    direction: input
    type: string
    generate: token
  sinbad_workspace:
    direction: input
    type: string
    generate: token
  merchant_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 36m
steps:
- id: register_narrator
  client: narrator
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: "${narrator_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-arabian-nights
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${narrator_workspace}"
- id: warmup_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_shahrazad
  client: shahrazad
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_shahrazad_workspace
  client: shahrazad
  rpc:
    method: server.workspace.create
    request:
      name: "${shahrazad_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-arabian-nights
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_shahrazad_workspace
  client: shahrazad
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${shahrazad_workspace}"
- id: warmup_shahrazad_workspace
  client: shahrazad
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_shahryar
  client: shahryar
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_shahryar_workspace
  client: shahryar
  rpc:
    method: server.workspace.create
    request:
      name: "${shahryar_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-arabian-nights
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_shahryar_workspace
  client: shahryar
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${shahryar_workspace}"
- id: warmup_shahryar_workspace
  client: shahryar
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_sinbad
  client: sinbad
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_sinbad_workspace
  client: sinbad
  rpc:
    method: server.workspace.create
    request:
      name: "${sinbad_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-arabian-nights
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_sinbad_workspace
  client: sinbad
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${sinbad_workspace}"
- id: warmup_sinbad_workspace
  client: sinbad
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_merchant
  client: merchant
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_merchant_workspace
  client: merchant
  rpc:
    method: server.workspace.create
    request:
      name: "${merchant_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-arabian-nights
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_merchant_workspace
  client: merchant
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${merchant_workspace}"
- id: warmup_merchant_workspace
  client: merchant
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: 请由旁白承接当前故事，只推进一个可见线索。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_narrator_first_response
  client: narrator
  timeout: 15s
  peer_stream:
    mode: text
    input: 请由旁白承接当前故事，只推进一个可见线索。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: shahrazad_chapter_setup_1
  client: shahrazad
  timeout: 2m
  peer_stream:
    mode: text
    input: 请从第一章开始《一千零一夜》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      contains: 移动之城
- id: probe_shahrazad
  client: shahrazad
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让山鲁佐德亲自回应，只说这个角色知道的事。
    idle_timeout: 90s
    require_text: true
    require_audio: true
