    client: flowcraft
    peer_stream:
      mode: text
      input: 我从花果山出发，带着一枚青铜铃。承接我的行动，不要替我选择路线。
      require_text: true
      require_audio: true
      idle_timeout: 90s
  - id: eino_history_turn_1_origin
