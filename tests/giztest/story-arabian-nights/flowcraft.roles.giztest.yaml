# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for flowcraft-story-arabian-nights,
# So that every reachable role path produces text and non-empty synthesized audio.
version: gizclaw.test/v1alpha1
name: story-arabian-nights.flowcraft.roles
clients:
  narrator: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  shahrazad: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  shahryar: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
  narrator_workspace: {direction: input, type: string, generate: token}
  shahrazad_workspace: {direction: input, type: string, generate: token}
  shahryar_workspace: {direction: input, type: string, generate: token}
repeat: 1
timeout: 12m
steps:
- id: register_narrator
  client: narrator
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: ${narrator_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-arabian-nights
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${narrator_workspace}"}}
- id: register_shahrazad
  client: shahrazad
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_shahrazad_workspace
  client: shahrazad
  rpc:
    method: server.workspace.create
    request:
      name: ${shahrazad_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-arabian-nights
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_shahrazad_workspace
  client: shahrazad
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${shahrazad_workspace}"}}
- id: register_shahryar
  client: shahryar
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_shahryar_workspace
  client: shahryar
  rpc:
    method: server.workspace.create
    request:
      name: ${shahryar_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-arabian-nights
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_shahryar_workspace
  client: shahryar
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${shahryar_workspace}"}}
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: "请由旁白承接当前故事，只推进一个可见线索。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 旁白}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_shahrazad
  client: shahrazad
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让山鲁佐德亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 山鲁佐德}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_shahryar
  client: shahryar
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让山鲁亚尔亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 山鲁亚尔}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
finally:
- id: stop_narrator_run
  client: narrator
  rpc: {method: server.run.stop, request: {}}
- id: delete_narrator_workspace
  client: narrator
  rpc: {method: server.workspace.delete, request: {name: "${narrator_workspace}"}}
- id: delete_narrator_peer
  client: narrator
  rpc: {method: server.peer.delete, request: {}}
- id: stop_shahrazad_run
  client: shahrazad
  rpc: {method: server.run.stop, request: {}}
- id: delete_shahrazad_workspace
  client: shahrazad
  rpc: {method: server.workspace.delete, request: {name: "${shahrazad_workspace}"}}
- id: delete_shahrazad_peer
  client: shahrazad
  rpc: {method: server.peer.delete, request: {}}
- id: stop_shahryar_run
  client: shahryar
  rpc: {method: server.run.stop, request: {}}
- id: delete_shahryar_workspace
  client: shahryar
  rpc: {method: server.workspace.delete, request: {name: "${shahryar_workspace}"}}
- id: delete_shahryar_peer
  client: shahryar
  rpc: {method: server.peer.delete, request: {}}
report:
  redact: [registration_token]
