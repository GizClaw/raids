# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of adventure-monster-maze,
# So that safety, correction, recall, routing and language regressions fail at the original gates.
version: gizclaw.test/v1alpha1
name: quality.adventure-monster-maze
clients:
  flowcraft__routing:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino__routing:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_routing_workspace:
    direction: input
    type: string
    generate: token
  eino_routing_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 30m
steps:
- id: flowcraft__routing_register
  client: flowcraft__routing
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino__routing_register
  client: eino__routing
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_routing_stop
  client: flowcraft__routing
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_routing_create
  client: flowcraft__routing
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_routing_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-adventure-monster-maze
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_routing_select
  client: flowcraft__routing
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_routing_workspace}"
- id: flowcraft_routing_warmup
  client: flowcraft__routing
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_routing_stop
  client: eino__routing
  rpc:
    method: server.run.stop
    request: {}
- id: eino_routing_create
  client: eino__routing
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_routing_workspace}"
      collection: raidtest-targets
      workflow_name: eino-adventure-monster-maze
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_routing_select
  client: eino__routing
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_routing_workspace}"
- id: eino_routing_warmup
  client: eino__routing
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft__routing_keepalive_1
  client: flowcraft__routing
  rpc:
    method: server.run.status
    request: {}
- id: eino__routing_keepalive_1
  client: eino__routing
  rpc:
    method: server.run.status
    request: {}
- id: quality_round_1
  timeout: 4m
  parallel:
  - id: flowcraft_routing_opening
    client: flowcraft__routing
    peer_stream:
      mode: text
      input: 开始迷宫
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_routing_opening
    client: eino__routing
    peer_stream:
      mode: text
      input: 开始迷宫
      idle_timeout: 90s
      require_text: true
      require_audio: true
  expect:
    "/flowcraft_routing_opening/text_eos":
      equals: true
    "/flowcraft_routing_opening/audio_eos":
      equals: true
    "/flowcraft_routing_opening/audio_bytes":
      minimum: 1
    "/flowcraft_routing_opening/first_text_ms":
      maximum: 6000
    "/flowcraft_routing_opening/first_audio_ms":
      maximum: 90000
    "/flowcraft_routing_opening/text":
      not_contains:
      - "【"
      - "】"
      min_length: 300
      max_length: 600
    "/eino_routing_opening/text_eos":
      equals: true
    "/eino_routing_opening/audio_eos":
      equals: true
    "/eino_routing_opening/audio_bytes":
      minimum: 1
    "/eino_routing_opening/first_text_ms":
      maximum: 6000
    "/eino_routing_opening/first_audio_ms":
      maximum: 90000
    "/eino_routing_opening/text":
      not_contains:
      - "【"
      - "】"
      min_length: 300
      max_length: 600
    "/flowcraft_routing_opening/audio_integrity/streams":
      equals: 1
    "/flowcraft_routing_opening/audio_integrity/max_active":
      equals: 1
    "/flowcraft_routing_opening/audio_integrity/open":
      equals: 0
    "/flowcraft_routing_opening/audio_integrity/violations":
      equals: 0
    "/flowcraft_routing_opening/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/flowcraft_routing_opening/audio_pacing/underruns":
      equals: 0
    "/eino_routing_opening/audio_integrity/streams":
      equals: 1
    "/eino_routing_opening/audio_integrity/max_active":
      equals: 1
    "/eino_routing_opening/audio_integrity/open":
      equals: 0
    "/eino_routing_opening/audio_integrity/violations":
      equals: 0
    "/eino_routing_opening/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/eino_routing_opening/audio_pacing/underruns":
      equals: 0
- id: flowcraft__routing_keepalive_2
  client: flowcraft__routing
  rpc:
    method: server.run.status
    request: {}
- id: eino__routing_keepalive_2
