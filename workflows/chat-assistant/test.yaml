apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: chat-assistant-test
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    graph:
      name: chat-assistant-test-relay
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 8
      state:
        fields:
        - name: tester-route
          type: string
          merge: replace
        - name: tester-message
          type: string
          merge: replace
        - name: tester-det
          type: string
          merge: replace
        - name: prompt-system
          type: string
          merge: replace
        - name: prompt-user
          type: string
          merge: replace
        - name: judge-messages
          type: messages
          merge: replace
        - name: model-text
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: route-turn
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: tester-route
          message: tester-message
          det: tester-det
          system: prompt-system
          user: prompt-user
        language: starlark
        entrypoint: run
        source: |
          REQUESTS = ["我下周三要去杭州见周宁，车次是G7331，请记住；用一句自然口语复述这四项，不要标签或追问。", "这次是讨论青桥项目，会议在下午两点开始；只确认项目和时间，不要复述其他行程。", "更正一下，不是杭州，是苏州；车次也改成G7105。新值覆盖旧值，只复述这两个新值。", "先用不超过10个字鼓励我，不要谈行程。", "只回答“收到”，不要加其他内容。", "我是不是还是去杭州坐G7331？请按最新事实直接纠正我。", "只告诉我见谁、谈什么项目，不要复述其他信息。", "日期也更正为下周四，会议时间从下午两点改到下午三点。", "8个字以内提醒我早点休息，不要提行程。", "35个字以内完整告诉我：哪天、去哪、见谁、坐哪趟车、几点、谈什么项目。", "20个字以内只说目的地、联系人和车次。", "最后只回答“行程已更新”，不要加标点或解释。"]
          INTENTS = ["", "", "", "", "", "", "", "", "", "", "", ""]
          CHECKPOINTS = ["establish-trip", "establish-purpose", "correct-destination-train", "short-encouragement", "exact-answer", "challenge-stale-trip", "partial-recall", "correct-day-time", "unrelated-turn", "reload-recall", "compact-recall", "final-confirmation"]
          CONTRACTS = ["不得含需要我、要不要、是准备、还是、吗、呀、时间：、目的地：、会见对象：、车次：；语义维度：fact-establishment、naturalness", "必须含青桥、两点；不得含需要我、要不要、G7331、杭州、周宁；语义维度：fact-establishment、response-completeness", "必须含苏州、G7105；不得含杭州、G7331、周宁、青桥、两点、需要我、还需要、要不要；语义维度：correction-handling、response-completeness", "不得含苏州、杭州、G7105、G7331、周宁；至多200字；语义维度：instruction-following、relevance", "必须含收到；至多200字；语义维度：instruction-following", "必须含苏州、G7105；不得含仍去杭州、还是杭州、车次仍是G7331、还是G7331、对的、没错；至多200字；语义维度：correction-handling、non-sycophancy", "必须含周宁、青桥；不得含苏州、G7105、两点；至多200字；语义维度：history-continuity、instruction-following", "必须含下周四、三点；不得含下周三、两点、需要我、要不要、核对一遍；语义维度：correction-handling", "不得含苏州、G7105、周宁、青桥；至多200字；语义维度：instruction-following、relevance", "必须含下周四、苏州、周宁、G7105、三点、青桥；不得含下周三、杭州、G7331、两点；至多200字；语义维度：long-term-continuity、correction-handling、response-completeness", "必须含苏州、周宁、G7105；不得含杭州、G7331；至多200字；语义维度：instruction-following、history-continuity", "必须含行程已更新；至多200字；语义维度：instruction-following"]
          CHECKS = [{"required": [], "required_any": [], "forbidden": ["需要我", "要不要", "是准备", "还是", "吗", "呀", "时间：", "目的地：", "会见对象：", "车次："], "min_runes": 0, "max_runes": 0}, {"required": ["青桥", "两点"], "required_any": [], "forbidden": ["需要我", "要不要", "G7331", "杭州", "周宁"], "min_runes": 0, "max_runes": 0}, {"required": ["苏州", "G7105"], "required_any": [], "forbidden": ["杭州", "G7331", "周宁", "青桥", "两点", "需要我", "还需要", "要不要"], "min_runes": 0, "max_runes": 0}, {"required": [], "required_any": [], "forbidden": ["苏州", "杭州", "G7105", "G7331", "周宁"], "min_runes": 0, "max_runes": 200}, {"required": ["收到"], "required_any": [], "forbidden": [], "min_runes": 2, "max_runes": 2}, {"required": ["苏州", "G7105"], "required_any": [], "forbidden": ["仍去杭州", "还是杭州", "车次仍是G7331", "还是G7331", "对的", "没错"], "min_runes": 0, "max_runes": 200}, {"required": ["周宁", "青桥"], "required_any": [], "forbidden": ["苏州", "G7105", "两点"], "min_runes": 0, "max_runes": 200}, {"required": ["下周四", "三点"], "required_any": [], "forbidden": ["下周三", "两点", "需要我", "要不要", "核对一遍"], "min_runes": 0, "max_runes": 0}, {"required": [], "required_any": [], "forbidden": ["苏州", "G7105", "周宁", "青桥"], "min_runes": 0, "max_runes": 200}, {"required": ["下周四", "苏州", "周宁", "G7105", "三点", "青桥"], "required_any": [], "forbidden": ["下周三", "杭州", "G7331", "两点"], "min_runes": 0, "max_runes": 200}, {"required": ["苏州", "周宁", "G7105"], "required_any": [], "forbidden": ["杭州", "G7331"], "min_runes": 0, "max_runes": 200}, {"required": ["行程已更新"], "required_any": [], "forbidden": [], "min_runes": 5, "max_runes": 5}]
          RULES = "你是 `chat-assistant` 的专属验收 Workflow，不是被测助手。你负责通用语音助手的事实建立、更正覆盖、短答格式、重载后的事实保持与自然口语。\n玩家角色设定：使用通用语音助手管理真实行程的普通用户，会分多次补充和纠正信息，并严格要求短答、精确措辞与重连后的事实保持。\n负向控制：回复与当前玩家话语无关、复活已被更正的旧事实、重复同义内容或违反明确的格式与字数指令时，对应维度必须 fail。"
          PERSONA = "使用通用语音助手管理真实行程的普通用户，会分多次补充和纠正信息，并严格要求短答、精确措辞与重连后的事实保持。"
          JUDGE_DIMS = ["fact-establishment", "naturalness", "response-completeness", "correction-handling", "instruction-following", "relevance", "non-sycophancy", "history-continuity", "long-term-continuity"]
          OFFSET = 0
          N = 12
          WHITESPACE = " \t\n\r　"
          PUNCT = "，。！？、；：“”‘’（）《》〈〉【】『』「」—…·～,.!?;:'\"()[]{}<>-_/\\|`~@#$%^&*+=·"
          DIGITS = {"０": "0", "１": "1", "２": "2", "３": "3", "４": "4", "５": "5", "６": "6", "７": "7", "８": "8", "９": "9", "零": "0", "一": "1", "二": "2", "三": "3", "四": "4", "五": "5", "六": "6", "七": "7", "八": "8", "九": "9"}
          def rune_count(text):
              n = 0
              for _ in text.codepoints():
                  n += 1
              return n

          def normalize(text, drop_punct):
              out = []
              for ch in text.codepoints():
                  if ch in WHITESPACE:
                      continue
                  if drop_punct and ch in PUNCT:
                      continue
                  if ch in DIGITS:
                      out.append(DIGITS[ch])
                      continue
                  out.append(ch.lower())
              return "".join(out)

          def is_sentinel(value):
              if value in ["```", "###", "-"]:
                  return True
              if len(value) < 2 or not value.endswith("."):
                  return False
              for ch in value[:-1].codepoints():
                  if ch not in "0123456789":
                      return False
              return True

          def forbidden_hit(text, needle):
              trimmed = needle.strip()
              if trimmed.endswith(":") or trimmed.endswith("："):
                  return normalize(trimmed, False) in normalize(text, False)
              normalized = normalize(needle, True)
              if normalized == "" or is_sentinel(trimmed):
                  return trimmed in text
              return normalized in normalize(text, True)

          def deterministic_failures(index, text):
              spec = CHECKS[index]
              failures = []
              plain = normalize(text, False)
              for fact in spec.get("required", []):
                  if normalize(fact, False) not in plain:
                      failures.append("required:" + fact)
              for group in spec.get("required_any", []):
                  found = False
                  for fact in group:
                      if normalize(fact, False) in plain:
                          found = True
                          break
                  if not found:
                      failures.append("required_any:" + "|".join(group))
              for fact in spec.get("forbidden", []):
                  if forbidden_hit(text, fact):
                      failures.append("forbidden:" + fact)
              count = rune_count(text)
              if spec.get("min_runes", 0) > 0 and count < spec["min_runes"]:
                  failures.append("min_runes:" + str(count) + "<" + str(spec["min_runes"]))
              if spec.get("max_runes", 0) > 0 and count > spec["max_runes"]:
                  failures.append("max_runes:" + str(count) + ">" + str(spec["max_runes"]))
              return failures

          def aligned_rounds(messages):
              # Returns [(index, request_text, reply_text)] aligned from the newest message
              # backwards so a truncated History window still maps later rounds correctly.
              users = []
              previous_assistant = ""
              for message in messages:
                  role = message.get("role", "")
                  content = message.get("content", "")
                  if role == "assistant":
                      previous_assistant = content
                  elif role == "user":
                      users.append((previous_assistant, content))
              rounds = []
              total = len(users)
              for position in range(total):
                  index = N - 1 - (total - 1 - position)
                  if index < 0:
                      continue
                  request = REQUESTS[index]
                  if request == "":
                      request = users[position][0]
                  rounds.append((index, request, users[position][1]))
              return rounds

          def output_index(messages):
              count = 0
              last = ""
              for message in messages:
                  if message.get("role", "") == "assistant":
                      count += 1
                      last = message.get("content", "").strip()
              index = count
              if last != "":
                  for j in range(N):
                      if REQUESTS[j] != "" and REQUESTS[j].strip() == last and j + 1 - OFFSET > index:
                          index = j + 1 - OFFSET
              return index

          def recent_transcript(messages, limit):
              lines = []
              for message in messages[-limit:]:
                  role = message.get("role", "")
                  label = "玩家" if role == "assistant" else "目标"
                  lines.append(label + "：" + message.get("content", "").strip())
              return "\n".join(lines)

          def run(input):
              messages = input["messages"]
              k = output_index(messages)
              request_index = k + OFFSET
              if request_index < N:
                  if REQUESTS[request_index] != "":
                      return {
                          "route": "scripted",
                          "message": REQUESTS[request_index],
                          "det": "",
                          "system": "你是测试脚手架。只回复 OK。",
                          "user": "OK",
                      }
                  system = "\n".join([
                      RULES,
                      "",
                      "现在你扮演模拟玩家。" + PERSONA,
                      "根据给定意图，只输出一句自然的玩家话语；不得回答它、不得添加对话中不存在的名字、数字、事件或证据，不得削弱意图约束，不得提及测试。只输出这句话，不要引号、前缀或解释。",
                  ])
                  user = "意图：" + INTENTS[request_index] + "\n\n最近对话：\n" + recent_transcript(messages, 6)
                  return {"route": "player", "message": "", "det": "", "system": system, "user": user}
              rounds = aligned_rounds(messages)
              failures = []
              blocks = []
              for round in rounds:
                  index = round[0]
                  for failure in deterministic_failures(index, round[2]):
                      failures.append(CHECKPOINTS[index] + " " + failure)
                  blocks.append("\n".join([
                      "【第" + str(index + 1) + "轮 " + CHECKPOINTS[index] + "】",
                      "契约：" + CONTRACTS[index],
                      "玩家：" + round[1],
                      "目标：" + round[2],
                  ]))
              system = "\n".join([
                  RULES,
                  "",
                  "这是最后一轮。你只看到完整对话记录：标注“玩家”的是测试方发出的消息，标注“目标”的是被测 Workflow 的回复。",
                  "请依据每一轮的契约逐轮判断以下维度：" + "、".join(JUDGE_DIMS) + "。确定性字数、关键词、顺序和延迟门槛由外部负责，你只判断语义：连续性、事实边界、指令遵循、不重复、玩家自主权和安全。",
                  "确定性检查（字数、关键词、顺序、延迟）已由外部完成：本轮若未列出失败，就不得以这些理由判 FAIL，也不得自行重新计数。",
                  "判 FAIL 必须写明具体轮号和该轮回复中的具体缺陷原文；举不出具体轮号和原文时一律判 PASS。",
                  "不得因为风格偏好、篇幅、语气或可以更好判坏语义合格的回复；但契约明确暴露的事实边界被违反时必须判 FAIL。",
                  "先用不超过200字说明依据，最后一行只写 PASS 或 FAIL，不要其他字符。",
              ])
              user_parts = ["完整测试对话（按时间顺序，共 " + str(len(rounds)) + " 轮可见）：", ""] + blocks
              if len(failures) > 0:
                  user_parts.append("")
                  user_parts.append("确定性检查已发现失败（最终裁决将为 FAIL）：" + "；".join(failures))
              user_parts.append("")
              user_parts.append("请按规则裁决，最后一行只写 PASS 或 FAIL。")
              return {
                  "route": "judge",
                  "message": "",
                  "det": "；".join(failures),
                  "system": system,
                  "user": "\n".join(user_parts),
              }
        limits:
          max_execution_steps: 2000000
          timeout: 2s
          max_input_bytes: 1048576
          max_output_bytes: 262144
      - id: build-prompt
        type: prompt
        inputs:
          system:
            from: prompt-system
          user:
            from: prompt-user
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: '{system}'
        - role: user
          template: '{user}'
      - id: judge-model
        type: chat_model
        inputs:
          messages:
            from: judge-messages
        outputs:
          text: model-text
        model: chat-assistant-test.model
        max_tokens: 512
        temperature: 0
      - id: finalize
        type: script
        inputs:
          route:
            from: tester-route
          message:
            from: tester-message
          det:
            from: tester-det
          model_text:
            from: model-text
        outputs:
          answer: answer
        language: starlark
        entrypoint: run
        source: |
          def verdict_from(text):
              lines = []
              for line in text.strip().split("\n"):
                  if line.strip() != "":
                      lines.append(line.strip())
              last = lines[-1] if len(lines) > 0 else ""
              if "PASS" in last and "FAIL" not in last:
                  return "PASS"
              if "FAIL" in last:
                  return "FAIL"
              if "PASS" in text and "FAIL" not in text:
                  return "PASS"
              return "FAIL"

          def run(input):
              route = input["route"]
              if route == "scripted":
                  return {"answer": input["message"]}
              if route == "player":
                  text = input["model_text"].strip()
                  first = text.split("\n")[0].strip().strip("“”\"'")
                  if first == "":
                      first = "请继续。"
                  return {"answer": first}
              if input["det"] != "":
                  return {"answer": "确定性失败：" + input["det"] + "\nFAIL"}
              text = input["model_text"].strip()
              if verdict_from(text) == "PASS":
                  return {"answer": "PASS"}
              return {"answer": text if text != "" else "FAIL"}
        limits:
          max_execution_steps: 200000
          timeout: 500ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      edges:
      - from: start
        to: route-turn
      - from: route-turn
        to: build-prompt
      - from: build-prompt
        to: judge-model
      - from: judge-model
        to: finalize
      - from: finalize
        to: end
      branches: []
      outputs:
      - node: finalize
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
