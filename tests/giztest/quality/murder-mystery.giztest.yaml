    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: flowcraft_transitions_unavailable
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让沈清如说说。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 沈清如：
      - 沈清如说
      - 我在客厅
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: flowcraft_transitions_correct
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 更正此前提到的同源鞋印鉴定结果：它们的尺码都应从旧值统一更正为39码。新结果覆盖旧结果；确认时只说39码，不要再复述旧号码。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_all:
      - '39'
      not_contains:
      - 42码
      - 后廊
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
