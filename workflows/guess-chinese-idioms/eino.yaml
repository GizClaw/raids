里有动物", "它说的是做事太死板"]}, {"zh": "三人成虎", "en": "three people make a tiger", "aliases": [], "profile": "大臣问国王：三个人都说集市上有老虎，您信不信？说明说的人多了，谣言也会被当真。", "hints": ["它是一个历史故事", "它的主角是一位大臣", "它和谣言有关"]}, {"zh": "一鸣惊人", "en": "amazing everyone with one cry", "aliases": [], "profile": "大臣用一只三年不飞不叫的大鸟打比方劝国王，国王说这只鸟一叫就会让人吃惊。", "hints": ["它是一个历史故事", "它的主角是一位国王", "它说的是突然做出好成绩"]}, {"zh": "天衣无缝", "en": "heavenly clothes have no seams", "aliases": [], "profile": "郭翰夜里遇见从天上下来的织女，发现她的衣服没有一条缝，原来仙衣不用针线缝。", "hints": ["它是一个神话传说", "它的故事里有一位仙女", "它说的是完美没破绽"]}, {"zh": "点石成金", "en": "touching stone and turning it into gold", "aliases": [], "profile": "神仙用手指一点，石头就变成了金子，有个贪心的人却不要金子，只想要那根手指。", "hints": ["它是一个神话传说", "它的故事里有一位神仙", "它和把东西变好有关"]}, {"zh": "鹏程万里", "en": "the roc's ten thousand li journey", "aliases": [], "profile": "北海有条大鱼变成一只大鸟，翅膀像天边的云，一飞就是九万里。", "hints": ["它来自古人的寓言", "它的主角是一只大鸟", "它常用来祝福别人"]}, {"zh": "朝三暮四", "en": "three in the morning, four in the evening", "aliases": [], "profile": "养猴人说早上给三颗橡子、晚上给四颗，猴子们都生气；改成早四晚三，它们就高兴了。", "hints": ["它是一个寓言故事", "它的故事里有一群动物", "它说的是主意变来变去"]}, {"zh": "望洋兴叹", "en": "gazing at the ocean and sighing", "aliases": [], "profile": "秋天河水上涨，河神河伯很得意，到了北海看见无边的大海，才感叹自己渺小。", "hints": ["它来自古人的寓言", "它的主角是一位河神", "它说的是感到自己渺小"]}, {"zh": "道旁苦李", "en": "bitter plums by the roadside", "aliases": ["道边苦李"], "profile": "路边李树结满果子，小伙伴都去摘，七岁的王戎说树长在路边还没人摘，一定是苦的。", "hints": ["它是一个历史故事", "它的主角是一个小孩", "它和摘果子有关"]}, {"zh": "相濡以沫", "en": "moistening each other with spit", "aliases": [], "profile": "泉水干了，几条鱼困在地上，互相吐出唾沫把对方弄湿，一起坚持下去。", "hints": ["它来自古人的寓言", "它的主角是一些动物", "它说的是困难中彼此帮忙"]}, {"zh": "因材施教", "en": "teaching according to each student's talent", "aliases": [], "profile": "子路和冉有问了孔子同一个问题，孔子却给了相反的回答，因为两个学生的性格不一样。", "hints": ["它是一个历史故事", "它的主角是一位老师", "它说的是每个人不一样"]}, {"zh": "画荻教子", "en": "teaching a son by writing with reeds", "aliases": ["欧母画荻"], "profile": "欧阳修小时候家里穷，买不起纸笔，母亲就用荻草秆在地上写字教他读书。", "hints": ["它是一个历史故事", "它的主角是一位妈妈", "它和写字学习有关"]}, {"zh": "疑邻盗斧", "en": "suspecting the neighbour of stealing an axe", "aliases": ["疑邻窃斧", "亡斧疑邻"], "profile": "有人丢了斧头，怀疑是邻居的儿子偷的，越看越像；后来找到了斧头，再看又不像了。", "hints": ["它是一个寓言故事", "它和丢东西有关", "它说的是不要冤枉别人"]}]}, {"title_zh": "故事收藏家", "title_en": "Story Collector", "step": 5, "offset": 0, "items": [{"zh": "余音绕梁", "en": "the lingering song circles the beams", "aliases": ["绕梁三日"], "profile": "歌女韩娥路过齐国时唱歌换饭吃，她走后三天，歌声好像还绕着房梁没有散去。", "hints": ["它是一个古代故事", "它的主角是一位女子", "它和唱歌有关"]}, {"zh": "沧海桑田", "en": "blue seas turn into mulberry fields", "aliases": ["桑田沧海"], "profile": "仙女麻姑说，她已经三次看见东海变成了桑田，蓬莱附近的海水也比从前浅了。", "hints": ["它是一个神话传说", "它的主角是一位仙女", "它说的是变化很大"]}, {"zh": "庄周梦蝶", "en": "Zhuangzi dreams of a butterfly", "aliases": ["庄生梦蝶", "庄周梦蝴蝶"], "profile": "庄子梦见自己变成一只蝴蝶，醒来后分不清是自己梦见了蝴蝶，还是蝴蝶梦见了自己。", "hints": ["它来自古人的寓言", "它的主角是一位思想家", "它的故事里有一种昆虫"]}, {"zh": "黄粱一梦", "en": "the dream of yellow millet", "aliases": ["黄粱美梦", "一枕黄粱"], "profile": "穷书生卢生枕着仙人给的枕头睡着，梦里过了富贵的一生，醒来小米饭还没煮熟。", "hints": ["它来自一篇唐代小说", "它的主角是一个书生", "它说的是好愿望一场空"]}, {"zh": "渐入佳境", "en": "gradually reaching the best part", "aliases": [], "profile": "画家顾恺之吃甘蔗总从梢头吃起，别人觉得奇怪，他说这样越吃越甜，越来越好。", "hints": ["它是一个历史故事", "它的主角是一位画家", "它和吃东西有关"]}, {"zh": "断机教子", "en": "cutting the loom threads to teach a son", "aliases": ["孟母断织", "断织教子"], "profile": "孟子逃学回家，母亲拿刀割断正在织的布，告诉他半途而废就像断了的布一样没用。", "hints": ["它是一个历史故事", "它和一位思想家有关", "它说的是不能半途而废"]}, {"zh": "洛阳纸贵", "en": "paper prices rise in Luoyang", "aliases": [], "profile": "西晋的左思写成《三都赋》，人人争着抄写，京城的纸一下子变得很贵。", "hints": ["它是一个历史故事", "它的主角是一位作家", "它说的是作品很受欢迎"]}, {"zh": "江郎才尽", "en": "Jiang's talent runs dry", "aliases": [], "profile": "南朝的江淹年轻时文章写得好，传说他梦见有人要回一支五彩笔，从此再也写不出好文章。", "hints": ["它是一个历史故事", "它的主角是一位作家", "它和做梦有关"]}, {"zh": "韦编三绝", "en": "the leather bindings broke three times", "aliases": [], "profile": "孔子晚年爱读《易经》，一遍又一遍地翻看，把串竹简的皮绳都磨断了好几次。", "hints": ["它是一个历史故事", "它的主角是一位思想家", "它和读书有关"]}, {"zh": "举案齐眉", "en": "raising the tray to eyebrow level", "aliases": [], "profile": "东汉的梁鸿做工回家，妻子孟光端饭时总把托盘举得和眉毛一样高，表示敬重。", "hints": ["它是一个历史故事", "它的主角是一对夫