name: Validate YAML

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate YAML files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python -m pip install PyYAML==6.0.3

      - name: Parse YAML files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          import yaml

          output = subprocess.check_output(
              ["git", "ls-files", "-z", "--", "*.yaml", "*.yml"]
          )
          paths = [Path(path) for path in output.decode().split("\0") if path]
          failures = []

          for path in paths:
              try:
                  with path.open(encoding="utf-8") as stream:
                      list(yaml.compose_all(stream))
              except (OSError, UnicodeError, yaml.YAMLError) as error:
                  message = str(error).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error file={path}::{message}")
                  failures.append(path)

          if failures:
              print(f"Failed to parse {len(failures)} of {len(paths)} YAML files.")
              sys.exit(1)

          print(f"Successfully parsed {len(paths)} YAML files.")
          PY
