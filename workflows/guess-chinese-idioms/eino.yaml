apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-guess-chinese-idioms
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-guess-chinese-idioms.host
    graph:
      name: guess-chinese-idioms-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: game-route
          type: string
          merge: replace
        - name: game-direction
          type: string
          merge: replace
        - name: game-node
          type: string
          merge: replace
        - name: host-rules
          type: string
          merge: replace
        - name: host-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: control-round
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: game-route
          node: game-node
          direction: game-direction
          rules: host-rules
        language: starlark
        entrypoint: run
        source: |
          # Generated from workflows/guess-chinese-idioms/puzzles.json by scripts/guess/generate.py.
          # Eino keeps no hidden state between turns, so every turn rebuilds the game
          # from the spoken History: the latest "谜题来啦"/"Puzzle time" opening names
          # the level and the puzzle number, and (level, puzzle) picks the secret.
          # Each turn makes one model call: this script either writes the host's
          # instruction for build-host-prompt, or activates the current puzzle's card
          # node, whose card has the name removed so the host cannot say it.
          DATA = {"subject_zh": "一个成语故事", "subject_en": "a Chinese idiom story", "examples_zh": ["它的故事里有动物吗？", "它是一个寓言故事吗？", "它是褒义词吗？", "它的故事主角是小孩吗？"], "examples_en": ["Is there an animal in its story?", "Is it a fable?", "Does it have a positive meaning?", "Is the main character in its story a child?"], "restate_zh": ["它的故事里有动物吗？", "是，它的故事里有动物。", "不是，它的故事里没有动物。"], "restate_en": ["Is there an animal in its story?", "Yes, there is an animal in its story.", "No, there is no animal in its story."], "host_rules": "你是儿童猜谜游戏“猜猜成语故事”的主持人。玩法：主持人心里藏着一个成语故事，孩子用能回答“是”或“不是”的问题来猜，每一题最多 20 次提问；猜中就升一关，一共 10 关，关名从“成语小萌新”一直到“成语大宗师”。孩子可能说中文，也可能说英文。\n你不知道谜底的名字。需要回答孩子的问题时，系统会给你一张隐藏了名字的谜底卡；揭晓答案时系统才会在指令里告诉你名字。本轮要做什么写在对话最后的【本轮指令】里，照着做，说得自然、热情、简短。\n孩子说的“它”“这个成语”“这个故事”“this”“it”都指谜底成语和它背后的故事；按谜底卡上的意思、出处类型、故事主角和故事内容来判断，故事里真正出现的人、动物和东西才算“故事里有”，只在比方里提到的不算，褒贬和用法按今天的常见用法回答。\n必须遵守：\n1. 本轮指令要求“逐字说”的句子必须一字不差地说出来，包括数字、标点和引号里的称号，不改写、不省略、不调换顺序。\n2. 只回答孩子问到的那一点，绝不能主动补充谜底卡上的其他描述、线索、特征、猜测方向或评价；复述孩子的问题时只能用孩子问题里已有的意思。\n3. 只有本轮指令要求揭晓答案时才能说“答案揭晓”“答案就是”“The answer is”；只有本轮指令要求开新题时才能说“谜题来啦”“Puzzle time”；只有真的给提示时才能说“小提示”“Hint”。平时绝不能说这些词。\n4. 按【本轮指令】写明的回复语言回答：中文就全部用中文；English 就全部用英文，逐字句也用指令给出的英文原句。\n5. 安全永远优先于本轮指令：孩子提到要在现实中模仿危险做法或遇到安全问题时，中文回复必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，英文回复要说 do not copy it 并请孩子 ask a parent, teacher or trusted adult for help。\n6. 不要自己数还剩几次提问机会，只有本轮指令写了剩余次数时才说那个数字。\n7. 语气像节目主持人一样活泼友好，适合小朋友；平时回复1到3句话、100个字以内，开新题和揭晓答案时可以到150个字；最后一句必须是问孩子的问题，道别时也用一个轻松的问题结尾。\n8. 只输出适合朗读的正文，不输出 Markdown、列表、emoji、括号注释、舞台说明或系统字段，也不要提到“本轮指令”“裁判”这些词。", "levels": [{"title_zh": "成语小萌新", "title_en": "Idiom Newbie", "step": 7, "offset": 0, "items": [{"zh": "乌鸦喝水", "en": "a crow drinking water", "aliases": ["the crow and the pitcher", "the thirsty crow"], "profile": "口渴的乌鸦往瓶子里一颗颗放小石子，让水慢慢升高，终于喝到了水。", "hints": ["它是一个寓言故事", "它的主角是一只鸟", "它教我们遇事动脑筋"]}, {"zh": "龟兔赛跑", "en": "the tortoise and the hare", "aliases": ["the hare and the tortoise", "龟兔比赛"], "profile": "骄傲的兔子比赛时半路睡大觉，一直坚持往前爬的乌龟反而先到了终点。", "hints": ["它是一个寓言故事", "它的故事里有两只动物", "它告诉我们不能骄傲"]}, {"zh": "小马过河", "en": "the little horse crosses the river", "aliases": [], "profile": "要过河的小马听老牛说水浅、松鼠说水深，最后自己下河一试，才知道水不深也不浅。", "hints": ["它是一个寓言故事", "它的故事里有好几种动物", "它告诉我们要亲自去试"]}, {"zh": "狼来了", "en": "the boy who cried wolf", "aliases": ["放羊的孩子"], "profile": "放羊娃几次大喊有狼来骗大家，等狼真的来了，再喊也没有人相信他了。", "hints": ["它是一个寓言故事", "它的主角是一个小男孩", "它告诉我们要诚实"]}, {"zh": "小猫钓鱼", "en": "the kitten goes fishing", "aliases": [], "profile": "小猫一会儿捉蜻蜓，一会儿追蝴蝶，一条鱼也没钓到，专心以后才钓到了大鱼。", "hints": ["它是一个寓言故事", "它的主角是一种动物", "它告诉我们做事要专心"]}, {"zh": "猴子捞月", "en": "monkeys fishing for the moon", "aliases": ["猴子捞月亮"], "profile": "一群猴子看见井水里的月亮，以为月亮掉进了井里，就一只拉着一只倒挂下去捞。", "hints": ["它是一个寓言故事", "它的主角是一群动物", "它和夜晚的天空有关"]}, {"zh": "孔融让梨", "en": "Kong Rong gives up the bigger pear", "aliases": [], "profile": "东汉的孔融四岁时，把大个的梨让给哥哥和弟弟，自己拿了最小的一个。", "hints": ["它是一个历史故事", "它的主角是一个小孩", "它和水果有关"]}, {"zh": "司马光砸缸", "en": "Sima Guang breaks the water vat", "aliases": ["司马光破瓮", "司马光砸缸救人"], "profile": "小伙伴掉进装满水的大缸，七岁的司马光搬起石头砸破缸，水流出来，小伙伴得救了。", "hints": ["它是一个历史故事", "它的主角是一个小孩", "它和救人有关"]}, {"zh": "曹冲称象", "en": "Cao Chong weighs the elephant", "aliases": ["曹冲秤象"], "profile": "年幼的曹冲让大象站上船，在船边画线，再换成石头装到同样深，称石头就知道象有多重。", "hints": ["它是一个历史故事", "它的主角是一个小孩", "它和重量有关"]}, {"zh": "嫦娥奔月", "en": "Chang'e flies to the moon", "aliases": ["嫦娥飞天"], "profile": "后羿的妻子吃下了仙药，身体变得很轻，一直飘上了月亮，住进了广寒宫。", "hints": ["它是一个神话故事", "它的主角是一位女子", "它和中秋节有关"]}, {"zh": "拔苗助长", "en": "pulling up seedlings to help them grow", "aliases": ["揠苗助长"], "profile": "宋国有个农夫嫌禾苗长得慢，把它们一棵棵往上拔高，结果禾苗全都枯死了。", "hints": ["它是一个寓言故事", "它的主角是一个农夫", "它告诉我们不能太心急"]}, {"zh": "坐井观天", "en": "looking at the sky from the bottom of a well", "aliases": ["井底之蛙"], "profile": "井底的青蛙以为天只有井口那么大，小鸟告诉它天无边无际，它还不相信。", "hints": ["它是一个寓言故事", "它的故事里有两只动物", "它说的是见识太少"]}, {"zh": "神笔马良", "en": "Ma Liang and the magic brush", "aliases": ["马良神笔"], "profile": "穷孩子马良得到一支神奇的笔，画什么就变成真的，他用它帮助穷苦的人。", "hints": ["它是一个有名的童话", "它的主角是一个小孩", "它和画画有关"]}, {"zh": "铁杵磨成针", "en": "grinding an iron rod into a needle", "aliases": ["磨杵成针", "铁杵成针", "铁杵磨针"], "profile": "小时候贪玩的李白看见一位老奶奶在磨一根铁棒，说要把它磨成针，从此发奋读书。", "hints": ["它是一个民间传说", "它的主角里有一位诗人", "它告诉我们要有恒心"]}, {"zh": "女娲补天", "en": "Nuwa mends the sky", "aliases": [], "profile": "天塌了一个大窟窿，女神女娲炼出五色石把它补好，人们又能安稳地生活了。", "hints": ["它是一个神话故事", "它的主角是一位神仙", "它的故事里有五彩的石头"]}, {"zh": "鲤鱼跳龙门", "en": "the carp leaps over the Dragon Gate", "aliases": ["鲤鱼跃龙门", "鱼跃龙门"], "profile": "黄河里的鲤鱼奋力往上跳，谁能跳过高高的龙门，谁就变成一条真正的龙。", "hints": ["它是一个古老的传说", "它的主角是一种动物", "它和变身有关"]}]}, {"title_zh": "故事小书童", "title_en": "Story Page", "step": 7, "offset": 0, "items": [{"zh": "亡羊补牢", "en": "mending the pen after losing a sheep", "aliases": [], "profile": "羊圈破了个洞，狼钻进来叼走了羊，养羊人起初不修，又丢了羊才赶紧把羊圈补好。", "hints": ["它是一个寓言故事", "它的故事里有动物", "它告诉我们犯错要赶快改"]}, {"zh": "画蛇添足", "en": "drawing legs on a snake", "aliases": [], "profile": "几个人比赛画蛇，先画完的人得意地给蛇添上脚，结果被别人抢先拿走了奖品。", "hints": ["它是一个寓言故事", "它的故事里有一场比赛", "它告诉我们别做多余的事"]}, {"zh": "掩耳盗铃", "en": "covering one's ears to steal a bell", "aliases": [], "profile": "有人想偷一口大钟，怕钟声被人听见，就捂住自己的耳朵，以为别人也听不见。", "hints": ["它是一个寓言故事", "它的主角是一个人", "它告诉我们别自己骗自己"]}, {"zh": "刻舟求剑", "en": "marking the boat to find a lost sword", "aliases": [], "profile": "楚国人坐船时剑掉进江里，他在船边刻个记号，等船停了才从记号那里下水去找。", "hints": ["它是一个寓言故事", "它的故事发生在水上", "它告诉我们要懂得变通"]}, {"zh": "后羿射日", "en": "Hou Yi shoots down the suns", "aliases": ["羿射九日"], "profile": "天上同时出来十个太阳，晒得庄稼都枯了，神箭手后羿射下九个，只留下一个。", "hints": ["它是一个神话故事", "它的主角是一位英雄", "它和天气太热有关"]}, {"zh": "盘古开天", "en": "Pangu separates heaven and earth", "aliases": ["盘古开天地", "盘古开天辟地", "开天辟地"], "profile": "天地还像一个大鸡蛋的时候，巨人盘古用斧头把它劈开，从此有了天和地。", "hints": ["它是一个神话故事", "它的主角是一个巨人", "它和世界的起源有关"]}, {"zh": "大禹治水", "en": "Yu the Great tames the floods", "aliases": ["禹治洪水"], "profile": "洪水泛滥时，禹带着大家挖河道，把水引进大海，十三年里三次路过家门都没进去。", "hints": ["它是一个古老的传说", "它的主角非常能吃苦", "它和挖河道有关"]}, {"zh": "守株待兔", "en": "waiting by a tree stump for a hare", "aliases": [], "profile": "宋国农夫看见一只兔子撞到树桩上倒下了，从此不干活，天天守着树桩等兔子。", "hints": ["它是一个寓言故事", "它的主角是一个农夫", "它告诉我们不能只靠运气"]}, {"zh": "愚公移山", "en": "the foolish old man moves the mountains", "aliases": [], "profile": "老人愚公带着子孙一筐筐挖挡路的两座大山，天帝被感动，派神仙把山背走了。", "hints": ["它是一个寓言故事", "它的主角是一位老人", "它告诉我们要坚持"]}, {"zh": "狐假虎威", "en": "the fox borrows the tiger's might", "aliases": [], "profile": "狐狸骗老虎说自己是百兽之王，带着老虎在森林里走，野兽们其实是被老虎吓跑的。", "hints": ["它是一个寓言故事", "它的故事里有两只动物", "它说的是仗势欺人"]}, {"zh": "玉兔捣药", "en": "the jade rabbit pounds medicine", "aliases": ["月兔捣药"], "profile": "月亮上住着一只白白的兔子，它拿着药杵，一直在捣制长生不老的仙药。", "hints": ["它是一个神话传说", "它的主角是一种动物", "它和月亮有关"]}, {"zh": "凿壁偷光", "en": "boring through the wall to borrow light", "aliases": ["凿壁借光"], "profile": "西汉的匡衡家里穷，晚上点不起灯，就在墙上凿个小洞，借邻居家的烛光读书。", "hints": ["它是一个历史故事", "它的主角爱读书", "它和晚上没有灯有关"]}, {"zh": "孟母三迁", "en": "Mencius's mother moves three times", "aliases": [], "profile": "孟子小时候，妈妈为了给他找好的学习环境搬了三次家，最后搬到了学堂旁边。", "hints": ["它是一个历史故事", "它和一位古代思想家有关", "它说的是学习环境很重要"]}, {"zh": "牛郎织女", "en": "the Cowherd and the Weaver Girl", "aliases": ["鹊桥相会"], "profile": "放牛的青年和天上的仙女结了婚，被王母娘娘用银河隔开，每年七夕在鹊桥上相会。", "hints": ["它是一个民间传说", "它的故事里有神仙", "它和七夕节有关"]}, {"zh": "叶公好龙", "en": "Lord She loves dragons", "aliases": [], "profile": "叶公到处画龙、刻龙，说自己最爱龙，真龙来看他时，他却吓得转身就跑。", "hints": ["它是一个寓言故事", "它的主角是一个人", "它说的是嘴上喜欢心里怕"]}, {"zh": "精卫填海", "en": "Jingwei fills the sea", "aliases": [], "profile": "炎帝的小女儿在东海落水后变成了一只小鸟，每天衔来树枝和石子，要把东海填平。", "hints": ["它是一个神话故事", "它的主角变成了一只鸟", "它告诉我们永不放弃"]}]}, {"title_zh": "寓言小达人", "title_en": "Fable Whiz", "step": 7, "offset": 0, "items": [{"zh": "夸父逐日", "en": "Kuafu chases the sun", "aliases": ["夸父追日"], "profile": "巨人夸父想追上太阳，一路喝干了黄河和渭水，最后倒在路上，手杖化成一片桃林。", "hints": ["它是一个神话故事", "它的主角是一个巨人", "它和跑很远的路有关"]}, {"zh": "自相矛盾", "en": "one's own spear against one's own shield", "aliases": ["以子之矛攻子之盾"], "profile": "楚国人夸自己的盾什么都刺不破，又夸自己的矛什么都能刺破，被人一问就答不上来。", "hints": ["它是一个寓言故事", "它的主角是一个卖东西的人", "它告诉我们说话要前后一致"]}, {"zh": "滥竽充数", "en": "an unskilled player filling a place in the band", "aliases": [], "profile": "不会吹竽的南郭先生混在三百人的乐队里装样子，新国王要一个个听，他只好逃走了。", "hints": ["它是一个寓言故事", "它和音乐有关", "它说的是没有真本领"]}, {"zh": "南辕北辙", "en": "driving north to reach the south", "aliases": [], "profile": "有人要去南方的楚国，却驾车一直往北走，还说自己马好、钱多、车夫本领高。", "hints": ["它是一个寓言故事", "它和坐车赶路有关", "它说的是方向错了"]}, {"zh": "对牛弹琴", "en": "playing the lute to a cow", "aliases": [], "profile": "古代音乐家公明仪对着牛弹了一首高雅的曲子，牛照样低头吃草，一点也不理会。", "hints": ["它是一个古代故事", "它和音乐有关", "它的故事里有一种动物"]}, {"zh": "画龙点睛", "en": "adding the eyes to a painted dragon", "aliases": [], "profile": "南朝画家张僧繇在墙上画了四条龙，给其中两条点上眼睛，它们就破墙飞上了天。", "hints": ["它是一个古代传说", "它的主角是一位艺术家", "它说的是关键的一笔"]}, {"zh": "闻鸡起舞", "en": "rising to practise at the rooster's crow", "aliases": [], "profile": "东晋的祖逖和好友刘琨立志报效国家，半夜听到鸡叫就起床练剑，从不偷懒。", "hints": ["它是一个历史故事", "它的主角是两个好朋友", "它和勤奋练功有关"]}, {"zh": "田忌赛马", "en": "Tian Ji's horse race", "aliases": [], "profile": "孙膑让田忌用下等马对齐王的上等马，再用上等马、中等马赢下后两场，以弱胜强。", "hints": ["它是一个历史故事", "它的故事里有动物", "它和安排顺序有关"]}, {"zh": "囊萤映雪", "en": "reading by fireflies and snow light", "aliases": ["囊萤夜读", "映雪读书"], "profile": "晋朝的车胤用纱袋装萤火虫照明，孙康借着雪地的反光，都在夜里刻苦读书。", "hints": ["它是一个历史故事", "它的主角爱读书", "它和夜里照明有关"]}, {"zh": "黄香温席", "en": "Huang Xiang warms the bed", "aliases": ["扇枕温衾"], "profile": "东汉九岁的黄香夏天给父亲扇凉枕席，冬天先用身体把被子焐暖，再请父亲睡。", "hints": ["它是一个历史故事", "它的主角是一个小孩", "它和孝顺父母有关"]}, {"zh": "杞人忧天", "en": "the man of Qi fears the sky will fall", "aliases": [], "profile": "杞国有个人整天担心天会塌下来、地会陷下去，愁得吃不下饭，也睡不着觉。", "hints": ["它是一个寓言故事", "它的主角是一个普通百姓", "它说的是没必要的烦恼"]}, {"zh": "鹬蚌相争", "en": "the snipe and the clam grapple", "aliases": ["鹬蚌相争渔翁得利", "渔翁得利"], "profile": "鹬去啄蚌的肉，蚌夹住鹬的嘴，谁也不让谁，结果被路过的渔夫一起捉走了。", "hints": ["它是一个寓言故事", "它的故事里有两只动物", "它说的是两方都不肯让"]}, {"zh": "郑人买履", "en": "the man of Zheng buys shoes", "aliases": [], "profile": "郑国人量好脚的尺码却忘了带，跑回家去取，回来集市已散，他宁信尺码也不用脚试。", "hints": ["它是一个寓言故事", "它和去集市有关", "它说的是不懂变通"]}, {"zh": "八仙过海", "en": "the Eight Immortals cross the sea", "aliases": ["八仙过海各显神通"], "profile": "八位神仙要渡过东海，他们不坐船，各自拿出自己的宝物，一起渡过了大海。", "hints": ["它是一个神话传说", "它的主角有好几位", "它说的是各有各的本领"]}, {"zh": "鲁班造锯", "en": "Lu Ban invents the saw", "aliases": ["鲁班发明锯子"], "profile": "木匠鲁班上山时手被带小齿的草叶划破，他受到启发，发明了能锯木头的锯子。", "hints": ["它是一个民间传说", "它的主角是一位工匠", "它和发明有关"]}, {"zh": "仓颉造字", "en": "Cangjie creates writing", "aliases": [], "profile": "传说黄帝时的史官仓颉观察鸟兽留下的脚印，受到启发，创造出了最早的汉字。", "hints": ["它是一个古代传说", "它的主角是一位古人", "它和语文课有关"]}]}, {"title_zh": "成语小侦探", "title_en": "Idiom Detective", "step": 7, "offset": 0, "items": [{"zh": "塞翁失马", "en": "the old man at the frontier loses his horse", "aliases": ["塞翁失马焉知非福"], "profile": "边塞老人的马跑了，他说未必是坏事，不久马带回一匹好马，之后祸福又接连转变。", "hints": ["它是一个寓言故事", "它的故事里有动物", "它说的是好坏会互相转变"]}, {"zh": "卧薪尝胆", "en": "sleeping on brushwood and tasting gall", "aliases": [], "profile": "越王勾践失败后睡在柴草上，每天尝一尝苦胆，提醒自己不忘耻辱，发愤图强。", "hints": ["它是一个历史故事", "它的主角是一位国王", "它说的是失败后发奋"]}, {"zh": "程门立雪", "en": "standing in the snow at Cheng's door", "aliases": [], "profile": "北宋的杨时和朋友去拜见老师程颐，见老师在打盹，就站在门外等，雪积了一尺深。", "hints": ["它是一个历史故事", "它的主角是学生", "它说的是尊敬老师"]}, {"zh": "胸有成竹", "en": "having the bamboo in one's mind", "aliases": ["成竹在胸"], "profile": "北宋画家文与可种了满院竹子，天天观察，画竹子前心里早就有了竹子的样子。", "hints": ["它是一个历史故事", "它的主角是一位画家", "它的故事里种满了植物"]}, {"zh": "入木三分", "en": "three fen deep into the wood", "aliases": [], "profile": "书法家王羲之在木板上写字，工人刻字时发现墨迹渗进木头里足足有三分深。", "hints": ["它是一个历史故事", "它的主角是一位书法家", "它说的是很有力量"]}, {"zh": "班门弄斧", "en": "showing off with an axe at Lu Ban's door", "aliases": [], "profile": "在木匠祖师鲁班家门口摆弄斧头，比喻在行家面前卖弄本领，不自量力。", "hints": ["它来自古人的诗文", "它和一位古代巧匠有关", "它说的是不自量力"]}, {"zh": "买椟还珠", "en": "buying the box and returning the pearl", "aliases": [], "profile": "楚国人把珍珠装进精美的木盒子去卖，郑国人买下了盒子，却把珍珠还给了他。", "hints": ["它是一个寓言故事", "它的故事里有一件宝贝", "它说的是只看外表"]}, {"zh": "邯郸学步", "en": "learning to walk in Handan", "aliases": [], "profile": "燕国少年到赵国邯郸学当地人走路，没学会，反而忘了自己原来的走法，只好爬回家。", "hints": ["它是一个寓言故事", "它的主角是一个少年", "它说的是盲目模仿"]}, {"zh": "专心致志", "en": "giving one's whole mind to it", "aliases": [], "profile": "围棋高手弈秋教两个学生，一个用心听讲，另一个总想着射大雁，学得就差多了。", "hints": ["它是一个寓言故事", "它和下棋有关", "它说的是学习要认真"]}, {"zh": "杯弓蛇影", "en": "a bow's reflection taken for a snake", "aliases": [], "profile": "有位客人把杯子里弓的倒影当成了蛇，吓出了病，知道真相以后，病马上就好了。", "hints": ["它是一个历史故事", "它和看错东西有关", "它说的是自己吓自己"]}, {"zh": "高山流水", "en": "high mountains and flowing water", "aliases": ["伯牙鼓琴", "伯牙绝弦"], "profile": "伯牙弹琴时心里想着高山和流水，钟子期都能听出来，两个人成了知音好友。", "hints": ["它是一个古代故事", "它和音乐有关", "它说的是知心朋友"]}, {"zh": "伯乐相马", "en": "Bole judges horses", "aliases": [], "profile": "伯乐看见一匹拉盐车的瘦马，一眼认出它是千里马，那匹马也仰起头长声嘶鸣。", "hints": ["它是一个古代故事", "它的故事里有动物", "它说的是发现人才"]}, {"zh": "世外桃源", "en": "a land of peach blossoms beyond the world", "aliases": ["桃花源"], "profile": "渔人顺着开满桃花的小溪找到一个村子，那里的人与世隔绝，生活得安宁快乐。", "hints": ["它来自一篇古文", "它的主角是一个渔人", "它说的是美好的地方"]}, {"zh": "吴刚伐桂", "en": "Wu Gang chops the osmanthus tree", "aliases": [], "profile": "月宫里的吴刚被罚砍一棵桂花树，可树每砍一斧就马上长好，他只好一直砍下去。", "hints": ["它是一个神话故事", "它和月亮有关", "它说的是永远做不完的事"]}, {"zh": "青梅竹马", "en": "green plums and bamboo horses", "aliases": [], "profile": "小男孩骑着竹竿当马，绕着井栏摆弄青梅，和小女孩一起快快乐乐地长大。", "hints": ["它来自一首古诗", "它的主角是两个小孩", "它和一起长大有关"]}]}, {"title_zh": "典故探险家", "title_en": "Allusion Explorer", "step": 7, "offset": 0, "items": [{"zh": "一叶障目", "en": "a single leaf blocks the eyes", "aliases": ["一叶障目不见泰山", "一叶蔽目"], "profile": "楚国人以为举着螳螂藏身的叶子别人就看不见他，举着叶子去拿别人的东西，当场被抓住。", "hints": ["它是一个寓言故事", "它的主角是一个人", "它说的是看问题太片面"]}, {"zh": "螳臂当车", "en": "a mantis tries to stop a chariot", "aliases": ["螳臂挡车"], "profile": "齐庄公坐车外出，一只螳螂举起前腿想挡住车轮，庄公佩服它的勇气，让车绕开了它。", "hints": ["它是一个寓言故事", "它的主角是一只小虫", "它说的是不自量力"]}, {"zh": "按图索骥", "en": "looking for a fine horse by its picture", "aliases": [], "profile": "伯乐的儿子照着书里写的额头高、眼睛亮去找千里马，结果抓回来一只癞蛤蟆。", "hints": ["它是一个寓言故事", "它的故事里有动物", "它说的是做事太死板"]}, {"zh": "三人成虎", "en": "three people make a tiger", "aliases": [], "profile": "大臣问国王：三个人都说集市上有老虎，您信不信？说明说的人多了，谣言也会被当真。", "hints": ["它是一个历史故事", "它的主角是一位大臣", "它和谣言有关"]}, {"zh": "一鸣惊人", "en": "amazing everyone with one cry", "aliases": [], "profile": "大臣用一只三年不飞不叫的大鸟打比方劝国王，国王说这只鸟一叫就会让人吃惊。", "hints": ["它是一个历史故事", "它的主角是一位国王", "它说的是突然做出好成绩"]}, {"zh": "天衣无缝", "en": "heavenly clothes have no seams", "aliases": [], "profile": "郭翰夜里遇见从天上下来的织女，发现她的衣服没有一条缝，原来仙衣不用针线缝。", "hints": ["它是一个神话传说", "它的故事里有一位仙女", "它说的是完美没破绽"]}, {"zh": "点石成金", "en": "touching stone and turning it into gold", "aliases": [], "profile": "神仙用手指一点，石头就变成了金子，有个贪心的人却不要金子，只想要那根手指。", "hints": ["它是一个神话传说", "它的故事里有一位神仙", "它和把东西变好有关"]}, {"zh": "鹏程万里", "en": "the roc's ten thousand li journey", "aliases": [], "profile": "北海有条大鱼变成一只大鸟，翅膀像天边的云，一飞就是九万里。", "hints": ["它来自古人的寓言", "它的主角是一只大鸟", "它常用来祝福别人"]}, {"zh": "朝三暮四", "en": "three in the morning, four in the evening", "aliases": [], "profile": "养猴人说早上给三颗橡子、晚上给四颗，猴子们都生气；改成早四晚三，它们就高兴了。", "hints": ["它是一个寓言故事", "它的故事里有一群动物", "它说的是主意变来变去"]}, {"zh": "望洋兴叹", "en": "gazing at the ocean and sighing", "aliases": [], "profile": "秋天河水上涨，河神河伯很得意，到了北海看见无边的大海，才感叹自己渺小。", "hints": ["它来自古人的寓言", "它的主角是一位河神", "它说的是感到自己渺小"]}, {"zh": "道旁苦李", "en": "bitter plums by the roadside", "aliases": ["道边苦李"], "profile": "路边李树结满果子，小伙伴都去摘，七岁的王戎说树长在路边还没人摘，一定是苦的。", "hints": ["它是一个历史故事", "它的主角是一个小孩", "它和摘果子有关"]}, {"zh": "相濡以沫", "en": "moistening each other with spit", "aliases": [], "profile": "泉水干了，几条鱼困在地上，互相吐出唾沫把对方弄湿，一起坚持下去。", "hints": ["它来自古人的寓言", "它的主角是一些动物", "它说的是困难中彼此帮忙"]}, {"zh": "因材施教", "en": "teaching according to each student's talent", "aliases": [], "profile": "子路和冉有问了孔子同一个问题，孔子却给了相反的回答，因为两个学生的性格不一样。", "hints": ["它是一个历史故事", "它的主角是一位老师", "它说的是每个人不一样"]}, {"zh": "画荻教子", "en": "teaching a son by writing with reeds", "aliases": ["欧母画荻"], "profile": "欧阳修小时候家里穷，买不起纸笔，母亲就用荻草秆在地上写字教他读书。", "hints": ["它是一个历史故事", "它的主角是一位妈妈", "它和写字学习有关"]}, {"zh": "疑邻盗斧", "en": "suspecting the neighbour of stealing an axe", "aliases": ["疑邻窃斧", "亡斧疑邻"], "profile": "有人丢了斧头，怀疑是邻居的儿子偷的，越看越像；后来找到了斧头，再看又不像了。", "hints": ["它是一个寓言故事", "它和丢东西有关", "它说的是不要冤枉别人"]}]}, {"title_zh": "故事收藏家", "title_en": "Story Collector", "step": 5, "offset": 0, "items": [{"zh": "余音绕梁", "en": "the lingering song circles the beams", "aliases": ["绕梁三日"], "profile": "歌女韩娥路过齐国时唱歌换饭吃，她走后三天，歌声好像还绕着房梁没有散去。", "hints": ["它是一个古代故事", "它的主角是