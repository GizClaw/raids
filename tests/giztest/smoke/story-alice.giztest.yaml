      require_text: true
      require_audio: true
  expect:
    "/flowcraft_probe_narrator_first_response/events":
      non_empty: true
    "/flowcraft_probe_narrator_first_response/audio_bytes":
      minimum: 1
    "/flowcraft_probe_narrator_first_response/first_text_ms":
      maximum: 2000
    "/flowcraft_probe_narrator_first_response/first_audio_ms":
      maximum: 3000
    "/eino_probe_narrator_first_response/events":
      non_empty: true
    "/eino_probe_narrator_first_response/audio_bytes":
      minimum: 1
    "/eino_probe_narrator_first_response/first_text_ms":
      maximum: 2000
    "/eino_probe_narrator_first_response/first_audio_ms":
      maximum: 3000
- id: flowcraft_probe_narrator_stop_probe
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_probe_narrator_resume_workspace
  client: flowcraft
  timeout: 2m
  rpc:
    method: server.run.workspace.reload
