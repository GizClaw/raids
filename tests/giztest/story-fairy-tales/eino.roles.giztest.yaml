# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for eino-story-fairy-tales,
# So that each reachable role produces text and non-empty audio within the latency gates.
version: gizclaw.test/v1alpha1
name: story-fairy-tales.eino.roles
clients:
  narrator:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  heroine:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  companion:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  fairy:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  elder:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  narrator_workspace:
    direction: input
    type: string
    generate: token
  heroine_workspace:
    direction: input
    type: string
    generate: token
  companion_workspace:
    direction: input
    type: string
    generate: token
  fairy_workspace:
    direction: input
    type: string
    generate: token
  elder_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 36m
steps:
- id: register_narrator
  client: narrator
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: "${narrator_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-fairy-tales
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${narrator_workspace}"
- id: warmup_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_heroine
  client: heroine
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_heroine_workspace
  client: heroine
  rpc:
    method: server.workspace.create
    request:
      name: "${heroine_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-fairy-tales
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_heroine_workspace
  client: heroine
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${heroine_workspace}"
- id: warmup_heroine_workspace
  client: heroine
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_companion
  client: companion
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_companion_workspace
  client: companion
  rpc:
    method: server.workspace.create
    request:
      name: "${companion_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-fairy-tales
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_companion_workspace
  client: companion
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${companion_workspace}"
- id: warmup_companion_workspace
  client: companion
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_fairy
  client: fairy
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_fairy_workspace
  client: fairy
  rpc:
    method: server.workspace.create
    request:
      name: "${fairy_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-fairy-tales
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_fairy_workspace
  client: fairy
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${fairy_workspace}"
- id: warmup_fairy_workspace
  client: fairy
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_elder
  client: elder
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_elder_workspace
  client: elder
  rpc:
    method: server.workspace.create
    request:
      name: "${elder_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-fairy-tales
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_elder_workspace
  client: elder
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${elder_workspace}"
- id: warmup_elder_workspace
  client: elder
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: 请由旁白承接当前故事，只推进一个可见线索。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_narrator_first_response
  client: narrator
  timeout: 15s
  peer_stream:
    mode: text
    input: 请由旁白承接当前故事，只推进一个可见线索。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: heroine_chapter_setup_1
  client: heroine
  timeout: 2m
  peer_stream:
    mode: text
    input: 请从第一章开始《童话故事》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      contains: 善意之门
- id: probe_heroine
  client: heroine
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让女主角亲自回应，只说这个角色知道的事。
    idle_timeout: 90s
    require_text: true
    require_audio: true
