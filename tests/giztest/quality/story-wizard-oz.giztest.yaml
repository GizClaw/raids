- id: original_responses_60
  parallel:
  - id: flowcraft_transitions_opening_with_guidance
    client: flowcraft__transitions
    peer_stream:
      mode: text
      input: 请从第一章开始《绿野仙踪》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_transitions_opening_with_guidance
    client: eino__transitions
    peer_stream:
      mode: text
      input: 请从第一章开始《绿野仙踪》。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: flowcraft_roles_probe_narrator
    client: flowcraft__roles
    peer_stream:
      mode: text
      input: 请由旁白承接当前故事，只推进一个可见线索。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_roles_probe_narrator
    client: eino__roles
    peer_stream:
      mode: text
      input: 请由旁白承接当前故事，只推进一个可见线索。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: flowcraft_case5_restart_flowcraft_in_english
    client: flowcraft__case5
    peer_stream:
      mode: text
      input: Please introduce this experience in English.
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_case5_restart_flowcraft_in_english
    client: eino__case5
    peer_stream:
      mode: text
      input: Please introduce this experience in English.
      idle_timeout: 90s
      require_text: true
      require_audio: true
  timeout: 2m
  expect:
    "/flowcraft_transitions_opening_with_guidance/text":
      contains_all:
      - 第 1 章
      - 黄砖岔路
      - 多萝西
      - 稻草人
      - 进入下一章
    "/flowcraft_transitions_opening_with_guidance/text_eos":
      equals: true
    "/flowcraft_transitions_opening_with_guidance/audio_eos":
      equals: true
    "/flowcraft_transitions_opening_with_guidance/audio_bytes":
      minimum: 1
    "/flowcraft_transitions_opening_with_guidance/first_text_ms":
      maximum: 6000
    "/eino_transitions_opening_with_guidance/text":
      contains_all:
      - 第 1 章
      - 黄砖岔路
      - 多萝西
      - 稻草人
      - 进入下一章
    "/eino_transitions_opening_with_guidance/text_eos":
      equals: true
    "/eino_transitions_opening_with_guidance/audio_eos":
      equals: true
    "/eino_transitions_opening_with_guidance/audio_bytes":
      minimum: 1
    "/eino_transitions_opening_with_guidance/first_text_ms":
      maximum: 6000
    "/flowcraft_roles_probe_narrator/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/flowcraft_roles_probe_narrator/text_eos":
      equals: true
    "/flowcraft_roles_probe_narrator/audio_eos":
      equals: true
    "/flowcraft_roles_probe_narrator/audio_bytes":
      minimum: 1
    "/flowcraft_roles_probe_narrator/first_text_ms":
      maximum: 6000
    "/flowcraft_roles_probe_narrator/first_audio_ms":
      maximum: 90000
    "/eino_roles_probe_narrator/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/eino_roles_probe_narrator/text_eos":
      equals: true
    "/eino_roles_probe_narrator/audio_eos":
      equals: true
    "/eino_roles_probe_narrator/audio_bytes":
      minimum: 1
    "/eino_roles_probe_narrator/first_text_ms":
      maximum: 6000
    "/eino_roles_probe_narrator/first_audio_ms":
      maximum: 90000
    "/flowcraft_case5_restart_flowcraft_in_english/text":
      contains_all:
      - 'Chapter 1: The Yellow Brick Fork'
      - 'The yellow brick road splits three ways: courage, wisdom, or helping one
        another. Which path will you take first?'
      not_contains:
      - 第 1 章
      - 黄砖岔路
    "/flowcraft_case5_restart_flowcraft_in_english/text_eos":
      equals: true
    "/flowcraft_case5_restart_flowcraft_in_english/audio_eos":
      equals: true
    "/flowcraft_case5_restart_flowcraft_in_english/audio_bytes":
      minimum: 1
    "/flowcraft_case5_restart_flowcraft_in_english/first_text_ms":
      maximum: 6000
    "/flowcraft_case5_restart_flowcraft_in_english/first_audio_ms":
      maximum: 90000
    "/eino_case5_restart_flowcraft_in_english/text":
      contains_all:
      - 'Chapter 1: The Yellow Brick Fork'
      - 'The yellow brick road splits three ways: courage, wisdom, or helping one
        another. Which path will you take first?'
      not_contains:
      - 第 1 章
