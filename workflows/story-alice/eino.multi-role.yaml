apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-story-alice-multi-role
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: story-teller
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-story-alice-mr.storyteller
      speaker_voices:
        旁白: eino-story-alice-mr.storyteller
        Narrator: eino-story-alice-mr.storyteller
        爱丽丝: eino-story-alice-mr.alice
        Alice: eino-story-alice-mr.alice
        白兔: eino-story-alice-mr.white-rabbit
        White Rabbit: eino-story-alice-mr.white-rabbit
        帽匠: eino-story-alice-mr.hatter
        Hatter: eino-story-alice-mr.hatter
        柴郡猫: eino-story-alice-mr.cheshire-cat
        Cheshire Cat: eino-story-alice-mr.cheshire-cat
        红心王后: eino-story-alice-mr.queen-of-hearts
        Queen of Hearts: eino-story-alice-mr.queen-of-hearts
    graph:
      name: story-alice-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
        primary_output_mode: fixed
      state:
        fields:
        - name: memory-query
          type: string
          merge: replace
        - name: memory-route
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: observation
          type: string
          merge: replace
      nodes:
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
          route: memory-route
          memory: recalled
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              cues = ["重连", "恢复", "回忆", "还记得", "代号", "更正", "改成", "上次", "continue where", "left off"]
              recall = any([cue in text for cue in cues])
              route = "recall" if recall else "continue"
              return {"query": "爱丽丝梦游仙境故事进展、人物、选择、更正、旅程代号和未解决线索；当前请求：" + text, "route": route, "memory": ""}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-memory
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 16
      - id: filter-recalled-memory
        type: script
        inputs:
          memory:
            from: recalled
          history:
            from: input.messages
        outputs:
          memory: recalled
        language: starlark
        entrypoint: run
        source: |
          # Exact input deduplication, not factual judgment or response rewriting.
          def content(message):
              text = message.get("content", "")
              if not text:
                  text = "".join([part.get("text", "") for part in message.get("parts", []) if part.get("type") == "text"])
              return text

          def remember_pair(known, user, replies):
              if user and replies:
                  known[(user, "".join(replies).strip())] = True
                  known[(user, "\n".join(replies).strip())] = True

          def deduplicate_records(memory, known, marker, user_marker, reply_marker):
              records = memory.split(marker)
              if len(records) == 1:
                  return memory
              keep = [records[0]]
              for record in records[1:]:
                  pair = record.split(reply_marker, 1)
                  head = pair[0].split(user_marker, 1) if user_marker else ["", pair[0]]
                  # The record marker may already have consumed the first delimiter.
                  # Accept that exact boundary, without matching an unknown head prefix.
                  if user_marker.startswith("；") and len(head) == 1:
                      plain_marker = user_marker.split("；", 1)[1]
                      if plain_marker and pair[0].startswith(plain_marker):
                          head = pair[0].split(plain_marker, 1)
                  if len(pair) == 2 and len(head) == 2 and (head[1].strip(), pair[1].strip()) in known:
                      continue
                  keep.append(marker + record)
              return "".join(keep).strip()

          def deduplicate_memory(memory, history):
              # Preserve unrecognized records and everything outside the current History.
              known = {}
              user = ""
              replies = []
              for message in history:
                  role = message.get("role")
                  if role == "user":
                      remember_pair(known, user, replies)
                      user = content(message).strip()
                      replies = []
                  elif role == "assistant" and content(message).strip():
                      replies.append(content(message))
              remember_pair(known, user, replies)
              if not known:
                  return memory
              memory = deduplicate_records(memory, known, "- story_contract_v1；", "；用户本轮输入：", "；角色本轮叙事：\n")
              return deduplicate_records(memory, known, "- 用户：", "", "\n模型：")

          def run(input):
              return {"memory": deduplicate_memory(input["memory"], input["history"])}
        limits: {max_execution_steps: 200000, timeout: 250ms, max_input_bytes: 4194304, max_output_bytes: 4194304}
      - id: build-prompt
        type: prompt
        inputs:
          safety_fence:
            from: input.safety_fence
          history:
            from: input.messages
          memory:
            from: recalled
        outputs:
          messages: answer-messages
        format: go_template
        messages:
        - role: system
          template: |-
            {{.safety_fence}}

            正文依玩家本轮实际输入（原音或文本）所用或明确指定的语种；后附规则、资料和声道名不决定正文语种。
            主持第三人称爱丽丝互动故事，故事自然推进。需要玩家决定时再给可行方向；结束回顾告别。现实危险安全替代勿保证安全。
            重开讲玩法，重连续接；回忆假设重听不改进度。
            每段先标声道。【旁白】写叙事、动作；未配置人物也可出场，其发言只以第三人称转述。
            【爱丽丝】【白兔】【帽匠】【柴郡猫】【红心王后】只接该角色自己的直接台词；叙事或转述另起【旁白】段，不借用其他角色声道。使用预置的角色声道名。
            {{- $played := false -}}{{- range .history -}}{{- if . -}}{{- if eq .Role "assistant" -}}{{- $played = true -}}{{- end -}}{{- end -}}{{- end -}}{{if $played}}非重开承接最新场景和结果，角色回应眼前事；问事实就回答，不重演。{{else}}交代当前场景和选择，请玩家行动；不擅自跳过情节讲到结局。{{end}}
        - placeholder: history
        - role: user
          template: |-
            先完成玩家明确选择的可行行动再推进；障碍先说明并做可做部分，不反问已选。拿起不等于使用，效果只随已完成行为。
            更正优先，完成不回退。大小不因原作重置；条件未变，同体型对同路口通行性不变。物品按最后明确取放记位置和持有者，未取放不变；不补做玩家未选的使用；名字代号保留原话，不翻译。
            {{if .memory}}旧回忆仅补缺，以本局历史及更正为准：{{.memory}}{{end}}
      - id: narrator-model
        type: chat_model
        inputs:
          messages:
            from: answer-messages
        outputs:
          text: answer
        model: eino-story-alice-mr.model
        max_tokens: 4096
        temperature: 0.2
      - id: capture-observation
        type: script
        inputs:
          text:
            from: input.text
          answer:
            from: answer
        outputs:
          fact: observation
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              return {"fact": "用户：" + input["text"].strip() + "\n模型：" + input["answer"]}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 262144
      - id: observe-memory
        type: memory_observe
        facts:
        - text_from: observation
        wait_for_completion: true
      edges:
      - from: start
        to: prepare-memory-query
      - from: recall-memory
        to: filter-recalled-memory
      - from: filter-recalled-memory
        to: build-prompt
      - from: build-prompt
        to: narrator-model
      - from: narrator-model
        to: capture-observation
      - from: capture-observation
        to: observe-memory
      - from: observe-memory
        to: end
      branches:
      - from: prepare-memory-query
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: recall
          to: recall-memory
        default: build-prompt
      outputs:
      - node: narrator-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    limits:
      max_output_bytes: 4194304
