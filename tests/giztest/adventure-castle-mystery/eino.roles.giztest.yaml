    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: mechanic_scene_setup_3
  client: mechanic
  timeout: 2m
  peer_stream:
    mode: text
    input: 我比较风雨、松动零件与机械误差这些竞争假设，先说明哪些还没有证据。
    idle_timeout: 90s
    require_text: true
