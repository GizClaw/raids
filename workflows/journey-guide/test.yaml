apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: journey-guide-test
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    graph:
      name: journey-guide-test-relay
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 8
      state:
        fields:
        - name: tester-route
          type: string
          merge: replace
        - name: tester-message
          type: string
          merge: replace
        - name: tester-det
          type: string
          merge: replace
        - name: prompt-system
          type: string
          merge: replace
        - name: prompt-user
          type: string
          merge: replace
        - name: judge-messages
          type: messages
          merge: replace
        - name: model-text
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: route-turn
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: tester-route
          message: tester-message
          det: tester-det
          system: prompt-system
          user: prompt-user
        language: starlark
        entrypoint: run
        source: |
          REQUESTS = ["我从花果山出发，带着一枚青铜铃。简短承接我的行动，不要替我选择路线。", "", "我不坐渡船，改走上游的旧索桥；只写这个选择带来的眼前结果。", "我过桥后进村询问昨夜怪声来自哪个方向，并观察村民提到那个方向时是否害怕；请完成询问结果。", "我沿村民指出的方向来到破庙，检查供桌后的脚印；只写看到的脚印，不预设属于妖怪。", "我确认同行向导叫清禾，她熟悉黑风岭，请记住。", "更正，向导不叫清禾，叫明月；她仍然熟悉黑风岭。", "我和明月翻越黑风岭，遇到暴雨时先找安全处避雨。", "", "我猜商队只是自己迷路了，并没有被抓走。请根据目前剧情回应，不要顺着我下定论。", "我和明月循着已经发现的方向进入山洞，寻找失踪商队；承接进洞后的眼前场景。", "24字内承接：我藏好青铜铃，观察守卫和商队位置，不发动救援。", "重整行装后说出向导姓名、我带的物品和我们正在寻找谁；完整回答这三项即可。", "我暂不正面冲突，和明月寻找瀑布水幕后可能通向山洞侧面的入口；请写完眼前结果。", "我取回青铜铃，在侧门外摇铃引开守卫，让明月去解开商队绳索。", "守卫离开后，我进洞接应明月，解开剩余绳索并带商队离开石牢；确认救援完成，但不要跳到回村。", "离开山洞后我不走危险的旧索桥，选择绕远路护送商队；先写踏上绕行路，不要提前抵达村庄。", "绕路途中我先扎营，再问获救商人：破庙怪声是否与商队失踪有关？此前没有确认因果，不知道就明确说无法确认。", "回村前用一句话说清楚：明月是谁、青铜铃做了什么、商队现在怎样。", "我与明月护送商队返回村庄，请用一句话收束这一回，不要开启新任务。"]
          INTENTS = ["", "沿河寻找渡口，先观察水流和两岸，不急着决定怎么过河。", "", "", "", "", "", "", "在避雨处检查商队遗落的货箱和车辙，只描述当前能够看到的内容。", "", "", "", "", "", "", "", "", "", "", ""]
          CHECKPOINTS = ["origin", "river", "choose-bridge", "village", "temple", "establish-guide", "correct-guide", "mountain", "shelter", "wrong-theory", "cave", "scout", "reload-recall", "waterfall", "diversion", "rescue", "return-choice", "night-camp", "recap", "return"]
          CONTRACTS = ["必须含花果山、青铜铃；80-520字；语义维度：journey-continuity、player-agency、response-completeness", "80-520字；语义维度：player-agency、narrative-coherence", "不得含坐上渡船、乘船、已经渡船；60-440字；语义维度：choice-consequence、instruction-following", "不得含找到村民、正准备询问、准备问；100-640字；语义维度：narrative-coherence、response-completeness", "必须含脚印；不得含属于妖怪、妖怪脚印；80-480字；语义维度：uncertainty-handling、player-agency", "必须含清禾、黑风岭；10-200字；语义维度：fact-establishment、naturalness", "必须含明月、黑风岭；不得含清禾；10-200字；语义维度：correction-handling、response-completeness", "必须含明月；不得含清禾；80-520字；语义维度：history-continuity、action-consequence", "80-520字；语义维度：non-invention、narrative-coherence", "不得含你打开货箱、你继续前进、你走进山洞、商队就是迷路；60-480字；语义维度：uncertainty-handling、non-railroading、no-scene-advancement", "必须含明月；不得含清禾；80-520字；语义维度：history-continuity、paced-progression", "必须含青铜铃；10-200字；语义维度：instruction-following、player-agency", "必须含明月、青铜铃、商队；不得含清禾；10-240字；语义维度：long-term-continuity、correction-handling、response-completeness", "必须含明月；不得含清禾、不对、重新来、bronze；80-520字；语义维度：player-agency、spatial-continuity", "必须含青铜铃、明月；不得含清禾；80-520字；语义维度：choice-consequence、history-continuity", "必须含明月、商队；不得含快被解开、正在解开、准备解开、回到村庄；80-520字；语义维度：paced-progression、response-completeness", "不得含走上旧索桥、踏上旧索桥、通过旧索桥、回到村庄、抵达村庄、走到村口、抵达村口；60-440字；语义维度：choice-consequence、instruction-following", "不得含就是小妖、正是小妖、确认有关、确实有关；80-560字；语义维度：uncertainty-handling、narrative-coherence", "必须含明月、青铜铃、商队；不得含清禾；20-280字；语义维度：long-term-continuity、response-completeness", "必须含明月、商队；不得含清禾、新任务、下一回、我与明月、我护送商队；20-440字；语义维度：ending-quality、history-continuity、instruction-following"]
          CHECKS = [{"required": ["花果山", "青铜铃"], "required_any": [], "forbidden": [], "min_runes": 80, "max_runes": 520}, {"required": [], "required_any": [], "forbidden": [], "min_runes": 80, "max_runes": 520}, {"required": [], "required_any": [], "forbidden": ["坐上渡船", "乘船", "已经渡船"], "min_runes": 60, "max_runes": 440}, {"required": [], "required_any": [], "forbidden": ["找到村民", "正准备询问", "准备问"], "min_runes": 100, "max_runes": 640}, {"required": ["脚印"], "required_any": [], "forbidden": ["属于妖怪", "妖怪脚印"], "min_runes": 80, "max_runes": 480}, {"required": ["清禾", "黑风岭"], "required_any": [], "forbidden": [], "min_runes": 10, "max_runes": 200}, {"required": ["明月", "黑风岭"], "required_any": [], "forbidden": ["清禾"], "min_runes": 10, "max_runes": 200}, {"required": ["明月"], "required_any": [], "forbidden": ["清禾"], "min_runes": 80, "max_runes": 520}, {"required": [], "required_any": [], "forbidden": [], "min_runes": 80, "max_runes": 520}, {"required": [], "required_any": [], "forbidden": ["你打开货箱", "你继续前进", "你走进山洞", "商队就是迷路"], "min_runes": 60, "max_runes": 480}, {"required": ["明月"], "required_any": [], "forbidden": ["清禾"], "min_runes": 80, "max_runes": 520}, {"required": ["青铜铃"], "required_any": [], "forbidden": [], "min_runes": 10, "max_runes": 200}, {"required": ["明月", "青铜铃", "商队"], "required_any": [], "forbidden": ["清禾"], "min_runes": 10, "max_runes": 240}, {"required": ["明月"], "required_any": [], "forbidden": ["清禾", "不对", "重新来", "bronze"], "min_runes": 80, "max_runes": 520}, {"required": ["青铜铃", "明月"], "required_any": [], "forbidden": ["清禾"], "min_runes": 80, "max_runes": 520}, {"required": ["明月", "商队"], "required_any": [], "forbidden": ["快被解开", "正在解开", "准备解开", "回到村庄"], "min_runes": 80, "max_runes": 520}, {"required": [], "required_any": [], "forbidden": ["走上旧索桥", "踏上旧索桥", "通过旧索桥", "回到村庄", "抵达村庄", "走到村口", "抵达村口"], "min_runes": 60, "max_runes": 440}, {"required": [], "required_any": [], "forbidden": ["就是小妖", "正是小妖", "确认有关", "确实有关"], "min_runes": 80, "max_runes": 560}, {"required": ["明月", "青铜铃", "商队"], "required_any": [], "forbidden": ["清禾"], "min_runes": 20, "max_runes": 280}, {"required": ["明月", "商队"], "required_any": [], "forbidden": ["清禾", "新任务", "下一回", "我与明月", "我护送商队"], "min_runes": 20, "max_runes": 440}]
          RULES = "你是 `journey-guide` 的专属验收 Workflow，不是西游故事角色。你负责二十回合西游互动故事的路线选择后果、同行者纠正、暂不推进、重载后的长期连续性与收束质量。\n玩家角色设定：第一次参与西游互动故事的普通玩家，会自由选择路线、提出错误推断、纠正同行者姓名，并期待二十回合后的选择仍有后果。\n负向控制：回复与当前玩家话语无关、复活已被更正的旧事实、重复同义内容或违反明确的格式与字数指令时，对应维度必须 fail。"
          PERSONA = "第一次参与西游互动故事的普通玩家，会自由选择路线、提出错误推断、纠正同行者姓名，并期待二十回合后的选择仍有后果。"
          JUDGE_DIMS = ["journey-continuity", "player-agency", "response-completeness", "narrative-coherence", "choice-consequence", "instruction-following", "uncertainty-handling", "fact-establishment", "naturalness", "correction-handling", "history-continuity", "action-consequence", "non-invention", "non-railroading", "no-scene-advancement", "paced-progression", "long-term-continuity", "spatial-continuity", "ending-quality"]
          OFFSET = 0
          N = 20
          WHITESPACE = " \t\n\r　"
          PUNCT = "，。！？、；：“”‘’（）《》〈〉【】『』「」—…·～,.!?;:'\"()[]{}<>-_/\\|`~@#$%^&*+=·"
          DIGITS = {"０": "0", "１": "1", "２": "2", "３": "3", "４": "4", "５": "5", "６": "6", "７": "7", "８": "8", "９": "9", "零": "0", "一": "1", "二": "2", "三": "3", "四": "4", "五": "5", "六": "6", "七": "7", "八": "8", "九": "9"}
          def rune_count(text):
              n = 0
              for _ in text.codepoints():
                  n += 1
              return n

          def normalize(text, drop_punct):
              out = []
              for ch in text.codepoints():
                  if ch in WHITESPACE:
                      continue
                  if drop_punct and ch in PUNCT:
                      continue
                  if ch in DIGITS:
                      out.append(DIGITS[ch])
                      continue
                  out.append(ch.lower())
              return "".join(out)

          def is_sentinel(value):
              if value in ["```", "###", "-"]:
                  return True
              if len(value) < 2 or not value.endswith("."):
                  return False
              for ch in value[:-1].codepoints():
                  if ch not in "0123456789":
                      return False
              return True

          def forbidden_hit(text, needle):
              trimmed = needle.strip()
              if trimmed.endswith(":") or trimmed.endswith("："):
                  return normalize(trimmed, False) in normalize(text, False)
              normalized = normalize(needle, True)
              if normalized == "" or is_sentinel(trimmed):
                  return trimmed in text
              return normalized in normalize(text, True)

          def deterministic_failures(index, text):
              spec = CHECKS[index]
              failures = []
              plain = normalize(text, False)
              for fact in spec.get("required", []):
                  alternatives = [fact]
                  if index in [15, 19] and fact == "商队":
                      alternatives = ["商队", "商人", "商客"]
                  found = False
                  for alternative in alternatives:
                      if normalize(alternative, False) in plain:
                          found = True
                          break
                  if not found:
                      failures.append("required:" + fact)
              for group in spec.get("required_any", []):
                  found = False
                  for fact in group:
                      if normalize(fact, False) in plain:
                          found = True
                          break
                  if not found:
                      failures.append("required_any:" + "|".join(group))
              for fact in spec.get("forbidden", []):
                  if forbidden_hit(text, fact):
                      failures.append("forbidden:" + fact)
              count = rune_count(text)
              if spec.get("min_runes", 0) > 0 and count < spec["min_runes"]:
                  failures.append("min_runes:" + str(count) + "<" + str(spec["min_runes"]))
              if spec.get("max_runes", 0) > 0 and count > spec["max_runes"]:
                  failures.append("max_runes:" + str(count) + ">" + str(spec["max_runes"]))
              return failures

          def aligned_rounds(messages):
              # Returns [(index, request_text, reply_text)] aligned from the newest message
              # backwards so a truncated History window still maps later rounds correctly.
              users = []
              previous_assistant = ""
              for message in messages:
                  role = message.get("role", "")
                  content = message.get("content", "")
                  if role == "assistant":
                      previous_assistant = content
                  elif role == "user":
                      users.append((previous_assistant, content))
              rounds = []
              total = len(users)
              for position in range(total):
                  index = N - 1 - (total - 1 - position)
                  if index < 0:
                      continue
                  request = REQUESTS[index]
                  if request == "":
                      request = users[position][0]
                  rounds.append((index, request, users[position][1]))
              return rounds

          def output_index(messages):
              count = 0
              last = ""
              for message in messages:
                  if message.get("role", "") == "assistant":
                      count += 1
                      last = message.get("content", "").strip()
              index = count
              if last != "":
                  for j in range(N):
                      if REQUESTS[j] != "" and REQUESTS[j].strip() == last and j + 1 - OFFSET > index:
                          index = j + 1 - OFFSET
              return index

          def recent_transcript(messages, limit):
              lines = []
              for message in messages[-limit:]:
                  role = message.get("role", "")
                  label = "玩家" if role == "assistant" else "目标"
                  lines.append(label + "：" + message.get("content", "").strip())
              return "\n".join(lines)

          def run(input):
              messages = input["messages"]
              k = output_index(messages)
              request_index = k + OFFSET
              if request_index < N:
                  if REQUESTS[request_index] != "":
                      return {
                          "route": "scripted",
                          "message": REQUESTS[request_index],
                          "det": "",
                          "system": "你是测试脚手架。只回复 OK。",
                          "user": "OK",
                      }
                  system = "\n".join([
                      RULES,
                      "",
                      "现在你扮演模拟玩家。" + PERSONA,
                      "根据给定意图，只输出一句自然的玩家话语；不得回答它、不得添加对话中不存在的名字、数字、事件或证据，不得削弱意图约束，不得提及测试。只输出这句话，不要引号、前缀或解释。",
                  ])
                  user = "意图：" + INTENTS[request_index] + "\n\n最近对话：\n" + recent_transcript(messages, 6)
                  return {"route": "player", "message": "", "det": "", "system": system, "user": user}
              rounds = aligned_rounds(messages)
              failures = []
              blocks = []
              for round in rounds:
                  index = round[0]
                  for failure in deterministic_failures(index, round[2]):
                      failures.append(CHECKPOINTS[index] + " " + failure)
                  blocks.append("\n".join([
                      "【第" + str(index + 1) + "轮 " + CHECKPOINTS[index] + "】",
                      "契约：" + CONTRACTS[index],
                      "玩家：" + round[1],
                      "目标：" + round[2],
                  ]))
              system = "\n".join([
                  RULES,
                  "",
                  "这是最后一轮。你只看到完整对话记录：标注“玩家”的是测试方发出的消息，标注“目标”的是被测 Workflow 的回复。",
                  "请依据每一轮的契约逐轮判断以下维度：" + "、".join(JUDGE_DIMS) + "。确定性字数、关键词、顺序和延迟门槛由外部负责，你只判断语义：连续性、事实边界、指令遵循、不重复、玩家自主权和安全。",
                  "确定性检查（字数、关键词、顺序、延迟）已由外部完成：本轮若未列出失败，就不得以这些理由判 FAIL，也不得自行重新计数。",
                  "判 FAIL 必须写明具体轮号和该轮回复中的具体缺陷原文；举不出具体轮号和原文时一律判 PASS。",
                  "不得因为风格偏好、篇幅、语气或可以更好判坏语义合格的回复；但契约明确暴露的事实边界被违反时必须判 FAIL。",
                  "先用不超过200字说明依据，最后一行只写 PASS 或 FAIL，不要其他字符。",
              ])
              user_parts = ["完整测试对话（按时间顺序，共 " + str(len(rounds)) + " 轮可见）：", ""] + blocks
              if len(failures) > 0:
                  user_parts.append("")
                  user_parts.append("确定性检查已发现失败（最终裁决将为 FAIL）：" + "；".join(failures))
              user_parts.append("")
              user_parts.append("请按规则裁决，最后一行只写 PASS 或 FAIL。")
              return {
                  "route": "judge",
                  "message": "",
                  "det": "；".join(failures),
                  "system": system,
                  "user": "\n".join(user_parts),
              }
        limits:
          max_execution_steps: 2000000
          timeout: 2s
          max_input_bytes: 1048576
          max_output_bytes: 262144
      - id: build-prompt
        type: prompt
        inputs:
          system:
            from: prompt-system
          user:
            from: prompt-user
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: '{system}'
        - role: user
          template: '{user}'
      - id: judge-model
        type: chat_model
        inputs:
          messages:
            from: judge-messages
        outputs:
          text: model-text
        model: journey-guide-test.model
        max_tokens: 512
        temperature: 0
      - id: finalize
        type: script
        inputs:
          route:
            from: tester-route
          message:
            from: tester-message
          det:
            from: tester-det
          model_text:
            from: model-text
        outputs:
          answer: answer
        language: starlark
        entrypoint: run
        source: |
          def verdict_from(text):
              lines = []
              for line in text.strip().split("\n"):
                  if line.strip() != "":
                      lines.append(line.strip())
              last = lines[-1] if len(lines) > 0 else ""
              if "PASS" in last and "FAIL" not in last:
                  return "PASS"
              if "FAIL" in last:
                  return "FAIL"
              if "PASS" in text and "FAIL" not in text:
                  return "PASS"
              return "FAIL"

          def run(input):
              route = input["route"]
              if route == "scripted":
                  return {"answer": input["message"]}
              if route == "player":
                  text = input["model_text"].strip()
                  first = text.split("\n")[0].strip().strip("“”\"'")
                  if first == "":
                      first = "请继续。"
                  return {"answer": first}
              if input["det"] != "":
                  return {"answer": "确定性失败：" + input["det"] + "\nFAIL"}
              text = input["model_text"].strip()
              if verdict_from(text) == "PASS":
                  return {"answer": "PASS"}
              return {"answer": text if text != "" else "FAIL"}
        limits:
          max_execution_steps: 200000
          timeout: 500ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      edges:
      - from: start
        to: route-turn
      - from: route-turn
        to: build-prompt
      - from: build-prompt
        to: judge-model
      - from: judge-model
        to: finalize
      - from: finalize
        to: end
      branches: []
      outputs:
      - node: finalize
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
