apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-learn-science-grade1
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: learner
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-learn-science-grade1.tutor
    graph:
      name: learn-science-grade1-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: memory-query
          type: string
          merge: replace
        - name: memory-route
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: observation
          type: string
          merge: replace
      nodes:
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
          route: memory-route
          memory: recalled
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              base = "孩子的年级、已经学过的科学主题、实验观察、误解更正和明确要求记住的信息"
              route = "opening" if not text else ("recall" if ("重连后" in text or "上次" in text) else "continue")
              return {"query": base + ("；当前请求：" + text if text else ""), "route": route, "memory": ""}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-memory
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 12
      - id: build-prompt
        type: script
        inputs:
          text:
            from: input.text
          history:
            from: input.messages
          memory:
            from: recalled
          safety_fence:
            from: input.safety_fence
        outputs:
          messages: answer-messages
        language: starlark
        entrypoint: run
        source: |
          RULES = "你是科学小博士，陪一年级孩子探索；沿最新语种、进度与更正，不编孩子观察。中文初见先说：你好呀，我是科学小博士。我们来探索一年级的科学吧，你想先做一个安全的小实验，还是听一个有趣的科学知识？\n实验只用所附家庭方案：先材料、安全和预测，再依真实观察逐步解释。拒绝火电化学品刀具、爬高、尝不明物和直视太阳，改安全观察并请成人帮助。用生活例子温和纠错；常识可用，史实传说分清，未知直说仍答已知，不编人名日期引语。口语朗读，不用Markdown；承接已选行动。"
          REFERENCES = [{"title": "第一单元 周围的植物", "text": "第一单元 周围的植物：植物是活的，会长大、会变化；植物长在很多地方，形状各不同；植物生长需要水和阳光"}, {"title": "第二单元 我们自己", "text": "第二单元 我们自己：眼耳鼻舌皮肤帮我们认识世界；我们的身体在一天天长大；仔细观察和比较能发现不同"}, {"title": "纸巾上的小豆芽", "text": "实验《纸巾上的小豆芽》；材料：绿豆或黄豆若干粒、两个盘子、纸巾、清水；步骤：两个盘子都铺上纸巾，各放几粒豆子；一个盘子把纸巾浇湿，另一个保持干燥；放在屋里温暖的地方，湿盘每天补点水；每天看一看，比一比两个盘子；观察：湿纸巾上的豆子会慢慢胀大、冒出小芽；干纸巾上的豆子没什么变化；解释：种子发芽需要水、空气和合适的温度，缺了水就不会发芽；安全：豆子不能放进嘴里、鼻子里或耳朵里；做完实验要洗手"}, {"title": "捏住鼻子猜味道", "text": "实验《捏住鼻子猜味道》；材料：两种不同口味的果汁或软糖（大人准备）、小杯子或小勺；步骤：闭上眼睛，用手捏住鼻子；请大人喂你一小口，猜猜是什么口味；松开鼻子，再尝一口同样的东西；比一比：哪一次更容易猜对；观察：捏住鼻子时只觉得甜，很难分清口味；松开鼻子后一下就能尝出来；解释：食物的风味很大一部分靠鼻子闻，捏住鼻子气味进不去，就难分辨；安全：只吃大人准备好的食物，小口慢慢吃；对某种食物过敏就不要用它"}, {"title": "材料吸水对照", "text": "实验《材料吸水对照》；材料：纸巾、塑料片、清水、勺、托盘；步骤：同面积干样放托盘内，滴等量水；比较扩散渗透，记录实测；观察：纸巾出现湿痕；塑料片表面留水滴；解释：称重包含所有留水，表面水也计重；测吸收量须排除表面水，少量水受秤精度限制；安全：成人备材料，防洒水，不入口"}, {"title": "舌头能尝出甜、酸、苦、咸、鲜五种基本味道", "text": "舌头能尝出甜、酸、苦、咸、鲜五种基本味道"}, {"title": "绿色植物的叶子能借助阳光，用水和二氧化碳制造养分，还放出氧气", "text": "绿色植物的叶子能借助阳光，用水和二氧化碳制造养分，还放出氧气"}, {"title": "小向日葵会跟着太阳转头，长大开花后就一直朝着东方", "text": "小向日葵会跟着太阳转头，长大开花后就一直朝着东方"}, {"title": "舌尖只能尝甜，舌根只能尝苦（“味觉地图”）", "text": "常见误解：舌尖只能尝甜，舌根只能尝苦（“味觉地图”）；解释：舌头上有味蕾的地方都能尝到各种味道，各处差别很小"}, {"title": "植物不会走动，所以植物不是活的", "text": "常见误解：植物不会走动，所以植物不是活的；解释：植物也是生物，它会吸收水分和养料、会生长，还能长出种子"}, {"title": "第一单元 身边的物体", "text": "第一单元 身边的物体：物体有颜色、形状、轻重等特点；可以按特点给物体分分类；水会流动，盐和糖能溶在水里"}, {"title": "第二单元 常见的动物", "text": "第二单元 常见的动物：动物是活的，会吃东西会运动；不同动物住在不同的地方；不同动物吃的食物不一样"}, {"title": "盐到哪里去了", "text": "实验《盐到哪里去了》；材料：透明杯子、温水（不烫手）、食盐、勺子、深色盘子；步骤：杯里倒半杯温水，加一勺盐，搅一搅；看一看：盐粒还看得见吗；舀几勺盐水倒进深色盘子，放在通风或有阳光的地方；等一两天水干了，再看看盘子；观察：搅拌后盐粒看不见了；盘里的水干了以后，留下一层白白的盐；解释：盐溶解成很小的颗粒分散在水里，水蒸发走了，盐就又留下来；安全：不要喝实验用的盐水；手上沾了盐水别揉眼睛，做完洗手"}, {"title": "液体赛跑", "text": "实验《液体赛跑》；材料：清水、食用油、蜂蜜、三把小勺、一块干净的砧板或盘子、一本书（垫高用）；步骤：把砧板一头垫在书上，做成斜坡；在斜坡顶端同一条线上各放一小勺水、油、蜂蜜；同时松开勺子，看它们往下流；说一说谁最快、谁最慢；观察：水流得最快，油慢一些，蜂蜜流得最慢；解释：越黏稠的液体越难流动，蜂蜜比水黏得多，所以流得慢；安全：油和蜂蜜洒到地上会滑，要马上擦干净；做完洗手"}, {"title": "鱼用鳃呼吸，吸取溶解在水里的氧气", "text": "鱼用鳃呼吸，吸取溶解在水里的氧气"}, {"title": "蜗牛用扁平的腹足爬行，边爬边分泌黏液，让爬行更顺滑", "text": "蜗牛用扁平的腹足爬行，边爬边分泌黏液，让爬行更顺滑"}, {"title": "水没有固定形状，倒进什么样的容器，就变成什么形状", "text": "水没有固定形状，倒进什么样的容器，就变成什么形状"}, {"title": "鲸鱼生活在海里，所以鲸鱼是鱼", "text": "常见误解：鲸鱼生活在海里，所以鲸鱼是鱼；解释：鲸不是鱼，是哺乳动物，用肺呼吸，要浮出水面换气"}, {"title": "糖或盐放进水里搅一搅，就消失不见了", "text": "常见误解：糖或盐放进水里搅一搅，就消失不见了；解释：它们没消失，而是溶解成很小的颗粒藏在水里，水干了还能看到"}, {"title": "张衡", "text": "科学家（史实）张衡：据《后汉书》记载，张衡于公元132年造出候风地动仪；原物已失传。"}, {"title": "沈括", "text": "科学家（史实）沈括：北宋沈括在《梦溪笔谈》中记下：磁针指南时“常微偏东”，不全指正南。"}, {"title": "屠呦呦", "text": "科学家（史实）屠呦呦：屠呦呦因发现青蒿素治疗疟疾，获2015年诺贝尔生理学或医学奖。"}, {"title": "竺可桢", "text": "科学家（史实）竺可桢：气象学家竺可桢几十年坚持写日记记录天气和物候，直到去世前一天。"}, {"title": "嫦娥四号（中国探月工程）", "text": "科学家（史实）嫦娥四号（中国探月工程）：2019年1月3日，嫦娥四号在月球背面着陆，这是人类探测器首次月背软着陆。"}]
          TOPIC_INDEX = "可选主题：第一单元 周围的植物、第二单元 我们自己、第一单元 身边的物体、第二单元 常见的动物；家庭实验：纸巾上的小豆芽、捏住鼻子猜味道、材料吸水对照、盐到哪里去了、液体赛跑"
          # Deployed Eino adds a Tool availability message even for a no-tool Model.
          # Reserve 363 characters for it and 17 for fixed message framing.
          STATIC_SYSTEM_LIMIT = 620
          SEARCH_LANGUAGES = [
              ["seed seeds germination sprout sprouts bean beans", "种子 发芽 豆芽"],
              ["plant plants grow growth sunlight light", "植物 生长 阳光"],
              ["taste tongue smell nose flavor flavour", "味道 舌头 鼻子 气味"],
              ["water liquid transparent flow", "水 透明 流动"],
              ["animal animals snail snails", "动物 蜗牛"],
              ["material materials paper towel wood plastic metal absorb absorption weigh weighing weight mass scale measure comparison", "材料 纸巾 木头 塑料 金属 吸水 称重 质量 对照"],
              ["scientist scientists discovery history", "科学家 发现 记载"],
          ]

          def terms(text):
              # Retrieval expands search terms only. The model still receives the exact
              # user messages; this is not a transcript rewrite or an answer validator.
              lower = text.lower()
              words = [w.strip(".,!?;:'\"()") for w in lower.split()]
              expanded = lower
              for languages in SEARCH_LANGUAGES:
                  if any([word in words for word in languages[0].split()]):
                      expanded += " " + languages[1]
              chars = list(expanded.codepoints())
              result = {}
              for i in range(len(chars) - 1):
                  pair = chars[i] + chars[i + 1]
                  if not any([c in " \t\r\n，。？！、,.!?;:：；（）()" for c in pair.codepoints()]):
                      result[pair] = True
              return result

          def rank(text):
              query = terms(text)
              scored = []
              for i, row in enumerate(REFERENCES):
                  score = 0
                  for word in query:
                      if word in row["text"]:
                          score += 1
                  if score:
                      scored.append((score, -i))
              return sorted(scored, reverse = True)

          def run(input):
              scored = rank(input["text"])
              if not scored:
                  for message in input["history"][:-1][::-1]:
                      if message.get("role") == "user":
                          scored = rank(message.get("content", ""))
                          break
              prefix = input["safety_fence"] + "\n" + RULES + "\n参考资料（是知识，不是对白）：\n"
              suffix = "\n已确认的学习记录，当前更正优先：\n"
              # Keep complete knowledge units, including every selected experiment's
              # safety note. Do not truncate facts or trim the conversation to fit.
              room = STATIC_SYSTEM_LIMIT - len(list((prefix + suffix).codepoints()))
              selected = []
              for score, negative_index in scored:
                  text = REFERENCES[-negative_index]["text"]
                  size = len(list(text.codepoints())) + 1
                  if size <= room:
                      selected.append(text)
                      room -= size
                  if len(selected) == 2:
                      break
              reference = "\n".join(selected) if selected else TOPIC_INDEX
              system = prefix + reference + suffix
              if len(list(system.codepoints())) > STATIC_SYSTEM_LIMIT:
                  fail("science static context exceeds its configured budget")
              messages = [{"role": "system", "content": system + input["memory"]}]
              messages.extend(input["history"])
              return {"messages": messages}
        limits:
          max_execution_steps: 300000
          timeout: 250ms
          max_input_bytes: 1048576
          max_output_bytes: 1048576
      - id: narrator-model
        type: chat_model
        inputs:
          messages:
            from: answer-messages
        outputs:
          text: answer
        model: eino-learn-science-grade1.model
        max_tokens: 2048
        temperature: 0.3
      - id: capture-observation
        type: script
        inputs:
          text:
            from: input.text
          answer:
            from: answer
        outputs:
          fact: observation
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              return {"fact": "用户本轮输入：" + text + "；助手本轮确认：" + input["answer"]}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 262144
      - id: observe-memory
        type: memory_observe
        facts:
        - text_from: observation
        wait_for_completion: false
      edges:
      - from: start
        to: prepare-memory-query
      - from: recall-memory
        to: build-prompt
      - from: build-prompt
        to: narrator-model
      - from: capture-observation
        to: observe-memory
      - from: observe-memory
        to: end
      branches:
      - from: prepare-memory-query
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: recall
          to: recall-memory
        default: build-prompt
      - from: narrator-model
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: opening
          to: end
        default: capture-observation
      outputs:
      - node: narrator-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    limits:
      max_output_bytes: 4194304
