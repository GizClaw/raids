# User Story:
# As a Raids catalog maintainer,
# I want every available adventure-space-rescue implementation to complete the same bounded Tester relay,
# So that the 13-response `adventure-space-rescue-comparison` route, its deterministic contracts, and the final verdict stay declarative.
version: gizclaw.test/v1alpha1
name: soak.adventure-space-rescue
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_multi_role:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_multi_role_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_multi_role:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_multi_role_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  test_brief:
    direction: input
    type: string
    value: |-
      BEGIN flowcraft-adventure-space-rescue-multi-role communications-energy-and-teamwork
      普通讲述回合目标约 500 字，大约 1-2 分钟；不要少于 200 字，不要超过 900 字，旁白与当前在场角色连续交替，结尾给具体选择；下发文字不得残留【或】。安全、仅确认、更正或回忆回合遵守原限定要求，可短于200字。角色点名只调整本段台词比例。
  multi_role_test_brief:
    direction: input
    type: string
    value: |-
      BEGIN flowcraft-adventure-space-rescue-multi-role communications-energy-and-teamwork
      普通讲述回合目标约 500 字，大约 1-2 分钟；不要少于 200 字，不要超过 900 字，旁白与当前在场角色连续交替，结尾给具体选择；下发文字不得残留【或】。安全、仅确认、更正或回忆回合遵守原限定要求，可短于200字。角色点名只调整本段台词比例。
      连续有声书验收：只回答故事选择，不请求进入下一章；检查普通回复只有一个故事内结尾问题、没有流程口令，并在接力中自动推进章节或场景。
  flowcraft_candidate_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_verdict:
    direction: output
    type: string
  flowcraft_reload_handoff:
    direction: output
    type: string
  eino_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_verdict:
    direction: output
    type: string
  eino_reload_handoff:
    direction: output
    type: string
  flowcraft_multi_role_candidate_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_verdict:
    direction: output
    type: string
  flowcraft_multi_role_reload_handoff:
    direction: output
    type: string
  eino_multi_role_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_multi_role_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_multi_role_verdict:
    direction: output
    type: string
  eino_multi_role_reload_handoff:
    direction: output
    type: string
repeat: 1
timeout: 110m
steps:
- id: flowcraft_register_candidate
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_register_tester
  client: flowcraft_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_candidate_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-adventure-space-rescue
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_create_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_tester_workspace}"
      collection: raidtest-testers
      workflow_name: adventure-space-rescue-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_select_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_candidate_workspace}"
- id: flowcraft_warmup_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_select_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_tester_workspace}"
- id: flowcraft_run_dialogue_before_reload
  timeout: 24m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 14
    terminal_client: flowcraft
  capture:
    flowcraft_reload_handoff: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft
    "/completed_turns":
      equals: 14
    "/turns/flowcraft/count":
      equals: 7
    "/turns/flowcraft_tester/count":
      equals: 7
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 10
    "/turns/flowcraft/text_runes/max":
      maximum: 420
- id: flowcraft_reload_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_run_dialogue_after_reload
  timeout: 22m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${flowcraft_reload_handoff}"
    media: text
    idle_timeout: 90s
    max_turns: 13
    terminal_client: flowcraft_tester
  capture:
    flowcraft_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 13
    "/turns/flowcraft/count":
      equals: 6
    "/turns/flowcraft_tester/count":
      equals: 7
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 4
    "/turns/flowcraft/text_runes/max":
      maximum: 400
- id: flowcraft_emit_verdict
  output:
    variable: flowcraft_verdict
- id: eino_register_candidate
  client: eino
  rpc:
    method: server.register
    request:
