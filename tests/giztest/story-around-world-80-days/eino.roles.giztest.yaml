# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for eino-story-around-world-80-days,
# So that each reachable role produces text and non-empty audio within the latency gates.
version: gizclaw.test/v1alpha1
name: story-around-world-80-days.eino.roles
clients:
  narrator:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  fogg:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  aouda:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  passepartout:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  fix:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  narrator_workspace:
    direction: input
    type: string
    generate: token
  fogg_workspace:
    direction: input
    type: string
    generate: token
  aouda_workspace:
    direction: input
    type: string
    generate: token
  passepartout_workspace:
    direction: input
    type: string
    generate: token
  fix_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 36m
steps:
- id: register_narrator
  client: narrator
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: "${narrator_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-around-world-80-days
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${narrator_workspace}"
- id: warmup_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_fogg
  client: fogg
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_fogg_workspace
  client: fogg
  rpc:
    method: server.workspace.create
    request:
      name: "${fogg_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-around-world-80-days
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_fogg_workspace
  client: fogg
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${fogg_workspace}"
- id: warmup_fogg_workspace
  client: fogg
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_aouda
  client: aouda
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_aouda_workspace
  client: aouda
  rpc:
    method: server.workspace.create
    request:
      name: "${aouda_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-around-world-80-days
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_aouda_workspace
  client: aouda
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${aouda_workspace}"
- id: warmup_aouda_workspace
  client: aouda
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_passepartout
  client: passepartout
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_passepartout_workspace
  client: passepartout
  rpc:
    method: server.workspace.create
    request:
      name: "${passepartout_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-around-world-80-days
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_passepartout_workspace
  client: passepartout
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${passepartout_workspace}"
- id: warmup_passepartout_workspace
  client: passepartout
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_fix
  client: fix
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_fix_workspace
  client: fix
  rpc:
    method: server.workspace.create
    request:
      name: "${fix_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-around-world-80-days
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_fix_workspace
  client: fix
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${fix_workspace}"
- id: warmup_fix_workspace
  client: fix
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: 请由旁白承接当前故事，只推进一个可见线索。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_narrator_first_response
  client: narrator
  timeout: 15s
  peer_stream:
    mode: text
    input: 请由旁白承接当前故事，只推进一个可见线索。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: fogg_chapter_setup_1
  client: fogg
  timeout: 2m
  peer_stream:
    mode: text
    input: 请从第一章开始《环游地球八十天》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      contains: 伦敦启程
- id: probe_fogg
  client: fogg
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让福格亲自回应，只说这个角色知道的事。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 福格说
      - 福格：
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_fogg_first_response
  client: fogg
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让福格亲自回应，只说这个角色知道的事。
    completion: first_response
    first_text_timeout: 2s
