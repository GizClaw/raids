# workflows/story-aesop/routing-cases.json recovered-fox: input="请让狐狸亲自回应"; expect={"speaker":"fox"}
# workflows/story-aesop/routing-cases.json ready-transition: input="请让狐狸说说，进入下一章"; expect={"speaker":"narrator","flowcraft":{"story_state.chapter":{"equals":2},"story_state.active_roles":{"includes":"fox"}}}
