      - 青铜铃
      min_length: 80
      max_length: 520
    "/flowcraft_benchmark_turn_1_origin/first_text_ms":
      maximum: 6000
    "/flowcraft_benchmark_turn_1_origin/text_eos_ms":
      maximum: 90000
    "/eino_history_benchmark_turn_1_origin/text":
