        max_tokens: 2048
        temperature: 0.5
      - id: commit-progress
        type: script
        inputs:
          phase:
            from: phase-key
          route:
            from: stage-route
          text:
            from: input.text
          scene:
            from: voice-scene
          voice_revision:
            from: voice-revision
        outputs:
          progress: progress-fact
          lane: progress-lane
          kind: progress-kind
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              routing = '{"schema":"raid_scenario_state_v2","voice_scene":' + input["scene"] + ',"revision":' + input["voice_revision"] + '}\n'
              progress = "schema=raid_scenario_progress_v2; phase=" + input["phase"] + "; route=" + input["route"]
              if input["phase"] == "correction":
                  correction = "latest_valid_facts_preserved_from_history"
                  if "零点十五分" in input["text"]:
                      correction = "clock_time=零点十五分"
                  elif "39码" in input["text"]:
                      correction = "footprint_size=39码"
                  progress += "; correction_authority=latest_user_value; " + correction
              else:
                  progress += "; latest_input=" + input["text"]
              return {"progress": routing + progress, "lane": "case_state", "kind": "state"}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 131072
          max_output_bytes: 131072
      - id: observe-progress
        type: memory_observe
        facts:
        - text_from: progress-fact
          attributes:
            lane: progress-lane
            kind: progress-kind
        wait_for_completion: false
      edges:
      - from: start
        to: prepare-memory-query
      - from: prepare-memory-query
        to: recall-progress
      - from: recall-progress
        to: route-stage
      - from: prompt-opening
        to: narrator-model
      - from: prompt-explore
        to: narrator-model
      - from: prompt-correction
        to: narrator-model
      - from: prompt-challenge
        to: narrator-model
      - from: prompt-conclusion
        to: narrator-model
      - from: narrator-model
        to: commit-progress
      - from: commit-progress
        to: observe-progress
      - from: observe-progress
        to: end
      - from: route-stage
        to: control-narration
      branches:
      - from: control-narration
        mode: first_match
        routes:
        - when:
            field: phase-key
            op: eq
            value: opening
          to: prompt-opening
        - when:
            field: phase-key
            op: eq
            value: correction
          to: prompt-correction
        - when:
            field: phase-key
            op: eq
            value: challenge
          to: prompt-challenge
        - when:
            field: phase-key
            op: eq
            value: conclusion
          to: prompt-conclusion
        default: prompt-explore
      outputs:
      - node: narrator-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
