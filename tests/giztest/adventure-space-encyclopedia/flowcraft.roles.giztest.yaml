    method: server.run.workspace.set
    request:
      workspace_name: "${navigator_workspace}"
- id: warmup_navigator_workspace
  client: navigator
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: navigator_scene_setup_1
  client: navigator
  timeout: 2m
  peer_stream:
    mode: text
    input: 开始体验。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: navigator_scene_setup_2
  client: navigator
  timeout: 2m
  peer_stream:
    mode: text
    input: 进入星图定位。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      contains: 星图定位
- id: probe_navigator
  client: navigator
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让星图领航员亲自回应。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      not_contains:
      - 星图领航员说
      - 星图领航员：
- id: probe_navigator_first_response
  client: navigator
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让星图领航员亲自回应。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
