腓腹膚艀艴芙芣苻茀茇茯荂荴莆莩菔菲萉萯葍蓲蕜蕟蕡蕧虙蚥蚨蚹蛗蜅蜉蜚蜰蝜蝠蝮蟦衭袚袝袱裴裶複褔襆襏襥覄覆訃詂誹諨讣诽豧負費賁賦賻负费赋赙赴趺跗踾軵輔輹輻辅辐还邚邞郍郙郛鄜酜酻釜釡鈇鉘鉜錇鍑鍢鐨镄阜阝附陚陫霏靅非靟鞴韍韛韨頫颫颰飛飝飞餥馡馥駙騑騛驸髴鬴鮄鮒鮲鯡鰒鲋鲱鳆鳧鳬鳺鴔鵩鶝麩麬麱麸黻黼鼣鼥", "苏": "俗傃僁僳卹嗉嗖囌圱埣塐塑夙嫊宿愫愬憟捽搬摵梀棴榡樎樕橚櫯殐泝洬涑溯溸潚潥玊珟璛甦碿稡稣穌窣簌粛粟素縤縮缩肃肅膆莤蓿蔌藗蘇蘓觫訴謖诉谡趚蹜速遡遬酥鋉餗驌骕鯂鱐鷫鹔", "若": "偌叒喏婼嵶弱惹挼捼撋楉渃溺热焫熱爇箬篛芮蒻蹃鄀鰙鰯鶸", "范": "仮伋凡凢凣勫匥反噃墦奿婏嬎嬏帆幡忛憣払拚旙旛杋柉梵棥楓樊橎氾汎泛渢滼潘瀪瀿烦煩燔犯犿璠畈畨番盕矾礬笲笵範籓籵緐繁繙羳翻膰舤舧舩蕃薠藩蘩蟠蠜袢襎訉販贩蹯軓軬轓返釩鐇鐢钒颿飜飯飰饭鱕鷭", "茅": "乮侔兞冃冇冐冒勖務卯堥夘媢峁嵍帽愗懋戼描旄昴暓枆柕楙毛毣毷氂泖渵牟牦犛猫瑁皃眊瞀矛秏笷緢罞耄耗芼茂茆萺蓩蛑蝐蝥蟊袤覒貇貌貓貿贸軞鄚鄮酕鉚鉾錨铆锚霿髦髳鶜", "荀": "伨侚偱勋勛勲勳卂咰噀噚嚑坃埙塤壎壦奞姰孫寻尋峋巡巺巽廵徇循恂悛愻揗撏攳旬曛杊栒桪梭樳殉殾毥汛洒洵浔浚潠潭潯濬灥焄煇熏燂燅燖燻爋爓狥狻獯珣璕畃眴矄稄窨筍篔紃絢纁臐荤荨葷蔒蕁蕈薫薰蘍蟫蟳訊訓訙詢训讯询賐迅迿逊逡遁遜郇鄩醺鑂鑫顨馴駨驯鱏鱘鲟鶽", "荆": "丼井京亰仱俓倞傹儆兢净凈刭剄劲勁坓坕坙境妌婙婛婧宑巠幜弪弳径徑惊憬憼擏敬旌旍晟景晶暻曔桱梷橸檠殑氏汫汬泾浄涇淨瀞烴燝猄獍獷璄璟璥痉痙睛秔稉穽竞竟竧竫競竸箐粇粳精経經经聙肼胫脛腈茎荊莖菁葏葝蜻蟼誩警踁迳逕醒鋞鏡镜阱陘青靓靖靘静靚靜頚頴頸颈驚鯨鲸鵛鶁鶄麖麠鼱", "药": "么仸佻侥倄偠傜僥匋吆咬喓嗂嚙垚堯夭妖姚婹媱嬈宎尧尭岆峣崤崾嶢嶤幺幼徭徼怮恌愮抭揄揺搖摇摿撽暚曜杳枖柼楆榚榣樂殀殽洮淫溔滧瀹烄烑熎燿爻狕猶猺獟玅珧瑤瑶由疟瘧眑矅磘祅穾窅窈窑窔窯窰筄箹約繇纅约耀肴腰舀艞苭葯葽蓔蕘薬藥蘨袎要覞訞詏謠謡讑谣趯踰軺轺遙遥邀邎銚鎐鑰钥铫闄陶隃靿顤颻飖餆餚騕驁鰩鳐鴁鴢鷂鷕鹞鼼齩", "莹": "俓偀僌吋呎哩哽唡啢啨営嘤噟嚶塋夃央婴媖媵嫈嬰嬴孆孾嵤巆巊应廮影応愥應摬撄攍攖旲映景暎朠柍桜桯梬楹樱櫻櫿泂浧渶溁溋滎滢潁潆濙濚濴瀅瀛瀠瀯瀴灐灜焸煐熒營珱瑛瑩璎瓔甇甖甸瘿癭盁盈眏矨硬碤礯禜穎籝籯緓縈繩纓绬缨罂罃罌耺膡膺英茔荥荧莖莺萤营萦萾蓥藀蘡蛍蝇蝧蝿螢蠅蠳褮覮謍譍譻賏贏赢軈迎逞郢鍈鎣鐛鑍锳霙鞕韹韺頴颍颕颖鱦鴬鶑鶧鶯鷪鷹鸎鸚鹦鹰", "萧": "佼侾俏俲傚削効叟号呺呼咲咻哓哨哮唬啋啸嗃嘋嘐嘨嘮嘯嘵嚣嚻囂奡姣婋孝宯宵小崤庨彇恔恷憢捎揱搜撓撨效敩斅斆晓暁曉枭枵校梟梢橚櫹歊歒歗殽毊洨消涍淆滧漻潇潚澩瀟灱灲烋焇熇熽燆爻狡猇獟獢痚痟皛皢睄硝硣穘窙笑筊筱筿箫箾篠簘簫絞綃縿绡翛肖胶脩膮芍茭莦萷蕭薂藃虈虓蛸蟂蟏蟰蠨訤詨誟誵謏謞謼譊踃較轇逍郩銷销霄颵騷驍驕骁骹髇髐魈鴞鴵鵁鷍鷕鸮", "落": "佬倮僗僚儠儸儽剆剌劳労勞咯咾哰唠啦啰喇嗠嘐嘮嚹囉垃姥嫪嫽峈崂嶗恅憥憦拉挼捋捞捰揦揧搚摞摺撈撩擸攋攎攞攭旯曪朥果柆栳格椤楋樂橐橑橯櫟欏欙泺洛洜浶涝溂漯潦澇濼烙爉爍牢犖狫猓猡獠玀珞珯瓎痨瘌瘰癆癩癳皪砢砬硌硓硦碌磖磱礫窂笿箩簩籮粩絡纙络罖罗羅翋老耂耢耮脶腊腡臈臘臝茖荖荦菈萝蓏蓝蓼藍藞蘿蛒蛯蜡蜾蝋蝲蝸螺蟧蠃蠟蠡袼裸覙覶覼詻跞路躒躶躼軂轑辢辣逻邋邏酪醪鉻銠鎯鏍鐒鑞鑼铑铹锣镙镴雒鞡頱顟饠駱騾驘骆骡髝鬎鮥鮱鯻鱲鱳鴼鵅鸁鿲", "葛": "个介仡佫佮個假割匌可各合吤呄咯哥哿嗝嗰嘅噶圪塥屹彁愅戈戓戨扢挌搁搿擖擱敋杚格槅櫊歌浩滆滒牫牱犵猲獦疙盖砝硌秴箇紇纥肐胳膈臈臵舸茖菏蓋虼蛒蛤袼裓觡詥諽謌輵轕鉀鉻鉿鎑鎘鎶铬镉閘閣閤阁隔革鞈鞷韐韚頜颌饹騔骼髂鬲魺鮥鮯鰪鴐鴚鴿鵅鸽鿔", "蒲": "亳仆仢伯佛侼僕僠僰剝剥勃募匍博卜哱啵噃噗嚗圃圑圤埔堡墣壆妭孛孹嶓巬巭帗帛彴怕愽懪扑扶抪拍拔拨挬捗搏撥播撲擈擗擘攴攵普暜暴曝服朴柏柨柭桲榑樸檏檗檘欂殕氆泊波浡浦淿渤溊溥潑潘潽濮瀑炇烳煿爆牔犦犻狛猼獛玻璞瓝瓟甫番痡癶癷發白百皪盋瞨砲砵碆磻礡礴秡秿穙穛箁箔箥簙簸簿糪紴纀缽肑胉脖脯膊舖舗般舶艊艴苩苻茀茷荹莆菐菠菩萡葡葧蒱蔔蔢蕃薄薜蘖蘗蚾蜅袚袯袰袹襆襎襏襮詙諩譒譜谱豧豰贌趵跑跛踣蹳蹼郣酺鈸鉑鉢鋍鋪鎛鏷鐠鑮钵钹铂铺镈镤镨陠餑餺饽馎馛馞駁駮驋驳髆髉魄鮁鮊鯆鱍鲅鲌鵏鵓鹁", "蔡": "仨倸偲傪卅啋嚓囃埰婇寀彩才扐拆挱挲採揌摋撒擦攃材棌檫櫒殺毝泧洒潵灑猜睬磣礤礸綵縩纔纚脎菜萨薩虄裁訯財财趿跴踩躠遪采鈒鎝鏾钑隡霅靸鞈颯飒馺", "藏": "仓仺伧倉傖凔匨塟奘嵢弉戕欌沧滄濸牂牫獊瑲篬羘脏臓臟臧舱艙苍葬蒼蔵螥賍賘賶贓贜赃銺鑶駔驡驵髒鶬鸧", "藕": "偶区區吘吽呕嘔塸怄慪握摳敺樞櫙欧歐殴毆沤渥漚澫熰瓯甌筽紆耦腢膒蓲蕅藲謳讴遇醧鏂鴎鷗鸥齵", "虎": "乎乕乥乯互俿冱冴匢匫呼和唬唿喖嗀嗃