            {rules}

            【谜底卡】
            简介：长得像大豚鼠的小动物，住在非洲和中东的岩石间，却是大象和海牛的远亲。
            类别：哺乳动物（不是兔子也不是老鼠）
            生活在哪里：非洲和阿拉伯半岛的岩石山地和林地
            吃什么：草食，吃草、树叶和果子
            大小：和猫差不多大，四五十厘米长
            会不会飞：不会
            会不会游泳：不详
            特点：耳朵短圆；脚底有湿润的肉垫，能在岩石上抓稳；喜欢晒太阳
            注意：它不是兔子，和大象、海牛是远亲；它的门牙像小小的象牙
        - placeholder: history
        - role: system
