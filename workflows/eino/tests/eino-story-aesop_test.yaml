apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-story-aesop-test
spec:
  driver: eino
  toolkit:
    tool_ids:
    - raidtest-acceptance-report
  eino:
    graph:
      name: eino-story-aesop-acceptance-tester
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: judge-route
          type: string
          merge: replace
        - name: active-checkpoint
          type: string
          merge: replace
        - name: active-contract
          type: string
          merge: replace
        - name: supplied-next-message
          type: string
          merge: replace
        - name: tester-rules
          type: string
          merge: replace
        - name: judge-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: route-checkpoint
        type: script
        inputs:
          payload:
            from: input.text
        outputs:
          route: judge-route
          checkpoint: active-checkpoint
          contract: active-contract
          next_message: supplied-next-message
          rules: tester-rules
        language: starlark
        entrypoint: run
        source: |
          def contains_any(text, values):
              for value in values:
                  if value in text:
                      return True
              return False

          def run(input):
              payload = input["payload"]
              markers = ["\"response_index\":0,", "\"response_index\":1,", "\"response_index\":2,", "\"response_index\":3,", "\"response_index\":4,", "\"response_index\":5,", "\"response_index\":6,", "\"response_index\":7,", "\"response_index\":8,", "\"response_index\":9,", "\"response_index\":10,", "\"response_index\":11,", "\"response_index\":12,", "\"response_index\":13,"]
              checkpoints = ["opening", "choose-plant", "predict-before-result", "reveal-consequence", "challenge-absolute-moral", "cooperation-choice", "recall-state", "reload-chapter-checkpoint", "change-choice", "recall-growth-time", "compare-interpretations", "preserve-child-safety", "two-lessons"]
              contracts = ["必须含乌龟、小鸟、种子；不得含###、```、- ；20-100字", "必须含小鸟、种子；50-190字", "不得含最后、结局、唯一寓意；40-170字", "必须含种子；50-190字", "不得含一定自私、绝对错误、唯一正确；40-180字", "必须含乌龟、小鸟；50-190字", "必须含种、乌龟；15-90字", "必须含第三章；至少命中照料或幼苗或合作；不得含第四章、故事结束、唯一寓意；15-90字", "必须含乌龟、小鸟；15-100字", "至少命中幼苗、幼芽、小芽、种子或发芽之一，并含“天”或“日”的时间信息；10-100字", "必须含乌龟、小鸟；不得含唯一正确；30-180字", "不得含流血、死亡；40-180字", "不得含唯一、1.0、2.0、- 、###、```；30-150字"]
              requests = ["开始伊索寓言，请简短介绍乌龟、小鸟和种子的选择。", "我支持小鸟把种子种下，因为以后也许能结出更多种子。请承接这个选择。", "先不要揭晓最后结果。我猜乌龟会担心今晚没东西吃，只写它眼前的反应。", "现在让时间往前一点，揭晓种下种子的直接后果，但不要结束整个寓言。", "乌龟想马上吃掉种子，就一定是自私和错误的吗？请不要只给一个绝对答案。", "我提议留下一点现有食物给乌龟，再一起照顾幼苗。写出两个动物的回应。", "用一句话说清楚我们怎样处理了种子，以及乌龟现在为什么不必挨饿。", "重连后先不要收束。用一句话说现在是第几章，以及这一章正在做什么。", "我改变主意了，先让乌龟吃一点现有食物，再和小鸟一起照料幼苗。只确认新选择。", "隔了几轮了，请只说幼苗现在的状态和已经过去的时间，不要推进故事。", "分别说出乌龟和小鸟从这件事里可能得到的不同理解，不要判定谁唯一正确。", "如果暴雨来了，让它们安全保护幼苗，不要写受伤或危险模仿。", "用两句自然的话收束故事，说出两种都合理但不完全相同的启发，不要列清单。", ""]
              index = 0
              for i in range(len(markers)):
                  if markers[i] in payload:
                      index = i
              checkpoint = "bootstrap" if index == 0 else checkpoints[index - 1]
              contract = "尚无目标回复；只启动第一轮" if index == 0 else contracts[index - 1]
              if '"type":"TOOL_RETRY"' in payload:
                  route = "retry"
              elif index == 0:
                  route = "bootstrap"
              elif index == len(checkpoints):
                  route = "conclusion"
              elif contains_any(checkpoint, ["establish", "correct", "recall", "reload", "remember", "change-choice"]):
                  route = "correction"
              elif contains_any(checkpoint, ["challenge", "theory", "test", "reject", "refuse", "predict", "preserve", "compare"]):
                  route = "challenge"
              else:
                  route = "evidence"
              return {
                  "route": route,
                  "checkpoint": checkpoint,
                  "contract": contract,
                  "next_message": requests[index],
                  "rules": "你是 `eino-story-aesop` 的专属验收 Workflow，不是目标剧本角色。你负责伊索寓言的选择后果、延迟揭示、时间线、合作、儿童安全与不同启示。\n负向控制：在玩家要求揭示前提前写出后果，factuality 必须 fail；把单一寓意说成绝对真理、重复同一启示或使用危险惩罚，instruction_following 或 non_repetition 必须 fail。\n每次输入都是 raidtest JSON envelope。只评估顶层 checkpoint_id 对应的当前 TARGET_RESPONSE，并使用 envelope 中可见的完整 target_history 核对连续性；不得臆造未保存的回复。\n必须恰好调用一次 `raidtest_acceptance_report`（资源 raidtest-acceptance-report）。case_id、target_workflow_id、response_id 和 turn_id 必须逐字复制顶层 envelope；turn_id 必须等于 active_checkpoint。\nchecks 至少包含 instruction_following、continuity、factuality、non_repetition 四项，每项 status 只能是 pass 或 fail，并给出具体 detail 与直接来自当前回复或可见历史的简短 evidence。\n外部 runner 负责精确字数、required/forbidden、顺序和延迟硬门槛；你不得为了迎合外部门槛把语义合格回复判坏，也不得忽略 active_contract 暴露的事实边界。\n非最后一轮即使出现 fail 也必须 action=continue，并在 checks 和 summary 如实保留失败，next_message 必须逐字等于 supplied_next_message。最后一轮所有 checks 合格才 action=pass，否则 action=fail；终态 next_message 为空。\n第一步必须实际调用 Tool。只有收到 accepted=true 后才可输出“已提交本轮验收。”；不得先输出正文，不得在正文重复 Tool 参数。",
              }
        limits:
          max_execution_steps: 30000
          timeout: 250ms
          max_input_bytes: 1048576
          max_output_bytes: 262144
      - id: prompt-bootstrap
        type: prompt
        inputs:
          payload:
            from: input.text
          rules:
            from: tester-rules
          checkpoint:
            from: active-checkpoint
          contract:
            from: active-contract
          next_message:
            from: supplied-next-message
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {rules}

            当前判断路径：bootstrap。当前没有目标回复。只提交 continue，并原样发送给定的 opening next_message；不要虚构 checks 的目标证据。
            active_checkpoint={checkpoint}
            active_contract={contract}
            supplied_next_message={next_message}
        - role: user
          template: '{payload}'
      - id: prompt-evidence
        type: prompt
        inputs:
          payload:
            from: input.text
          rules:
            from: tester-rules
          checkpoint:
            from: active-checkpoint
          contract:
            from: active-contract
          next_message:
            from: supplied-next-message
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {rules}

            当前判断路径：evidence。只判断当前调查或故事动作是否被完整回应、是否新增了未经请求的事实，以及是否保持玩家选择权。
            active_checkpoint={checkpoint}
            active_contract={contract}
            supplied_next_message={next_message}
        - role: user
          template: '{payload}'
      - id: prompt-correction
        type: prompt
        inputs:
          payload:
            from: input.text
          rules:
            from: tester-rules
          checkpoint:
            from: active-checkpoint
          contract:
            from: active-contract
          next_message:
            from: supplied-next-message
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {rules}

            当前判断路径：correction。重点判断最新值是否完全覆盖旧值、纯确认/回忆是否没有推进剧情，以及 reload 后有效事实是否仍连续。
            active_checkpoint={checkpoint}
            active_contract={contract}
            supplied_next_message={next_message}
        - role: user
          template: '{payload}'
      - id: prompt-challenge
        type: prompt
        inputs:
          payload:
            from: input.text
          rules:
            from: tester-rules
          checkpoint:
            from: active-checkpoint
          contract:
            from: active-contract
          next_message:
            from: supplied-next-message
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {rules}

            当前判断路径：challenge。重点判断目标是否拒绝无证据断言或不安全方案、区分事实和推测、避免固定套话，并保留玩家自主决策。
            active_checkpoint={checkpoint}
            active_contract={contract}
            supplied_next_message={next_message}
        - role: user
          template: '{payload}'
      - id: prompt-conclusion
        type: prompt
        inputs:
          payload:
            from: input.text
          rules:
            from: tester-rules
          checkpoint:
            from: active-checkpoint
          contract:
            from: active-contract
          next_message:
            from: supplied-next-message
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {rules}

            当前判断路径：conclusion。重点判断总结只使用已见且仍有效的事实、没有恢复旧值或夸大证据，并完整遵守句数和收束要求。
            active_checkpoint={checkpoint}
            active_contract={contract}
            supplied_next_message={next_message}
        - role: user
          template: '{payload}'
      - id: prompt-retry
        type: prompt
        inputs:
          payload:
            from: input.text
          rules:
            from: tester-rules
          checkpoint:
            from: active-checkpoint
          contract:
            from: active-contract
          next_message:
            from: supplied-next-message
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {rules}

            当前判断路径：retry。这是同一 response_id 的 Tool 重试。依据 previous_tool_error 修正参数并重新提交原判定；不得推进 checkpoint 或改写 next_message。
            active_checkpoint={checkpoint}
            active_contract={contract}
            supplied_next_message={next_message}
        - role: user
          template: '{payload}'
      - id: judge-model
        type: chat_model
        inputs:
          messages:
            from: judge-messages
        outputs:
          text: answer
        model: eino-story-aesop-test.model
        max_tokens: 2048
        temperature: 0
      edges:
      - from: start
        to: route-checkpoint
      - from: prompt-bootstrap
        to: judge-model
      - from: prompt-evidence
        to: judge-model
      - from: prompt-correction
        to: judge-model
      - from: prompt-challenge
        to: judge-model
      - from: prompt-conclusion
        to: judge-model
      - from: prompt-retry
        to: judge-model
      - from: judge-model
        to: end
      branches:
      - from: route-checkpoint
        mode: first_match
        routes:
        - when:
            field: judge-route
            op: eq
            value: retry
          to: prompt-retry
        - when:
            field: judge-route
            op: eq
            value: bootstrap
          to: prompt-bootstrap
        - when:
            field: judge-route
            op: eq
            value: correction
          to: prompt-correction
        - when:
            field: judge-route
            op: eq
            value: challenge
          to: prompt-challenge
        - when:
            field: judge-route
            op: eq
            value: conclusion
          to: prompt-conclusion
        default: prompt-evidence
      outputs:
      - node: judge-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
