---
apiVersion: gizclaw.admin/v1alpha1
kind: MemoryLayout
metadata:
  id: adventure
spec:
  mem0:
    scope: workspace
    custom_instructions: |
      Store only investigation facts visible to the player. Preserve canonical names, numbers, negation,
      sources, and uncertainty. New explicit corrections replace older conflicting values. Do not store
      hidden solution facts, proposed actions, speculation, or assistant reasoning.
    custom_categories:
      case_state: Newest visible case phase and established state.
      discoveries: Clues and physical findings actually revealed to the player.
      interviews: Witness statements and their stated source or uncertainty.
      player_corrections: Newest explicit correction and the older value it supersedes.
    multilingual: true
    decay: false
  mem0_self_hosted:
    scope: workspace
    custom_instructions: |
      Store only investigation facts visible to the player. Preserve canonical names, numbers, negation,
      sources, and uncertainty. New explicit corrections replace older conflicting values. Do not store
      hidden solution facts, proposed actions, speculation, or assistant reasoning.
  volc_mem0:
    scope: workspace
    strategies:
      - {name: case_state, type: summary, custom_instructions: 'Keep only newest visible case state.'}
      - {name: discoveries, type: semantic, custom_instructions: 'Store revealed clues; newest explicit correction replaces an older value.'}
      - {name: interviews, type: semantic, custom_instructions: 'Store witness statements with source and uncertainty.'}
      - {name: player_corrections, type: summary, custom_instructions: 'Keep explicit corrections as authoritative and retire superseded values.'}
