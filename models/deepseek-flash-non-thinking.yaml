---
apiVersion: gizclaw.admin/v1alpha1
kind: Model
metadata:
  id: deepseek-flash-non-thinking
spec:
  kind: llm
  source: manual
  provider:
    kind: deepseek-tenant
    id: deepseek
  display_name: DeepSeek Flash (Non-thinking)
  description: DeepSeek Flash OpenAI-compatible text chat model with thinking disabled
  provider_data:
    api_mode: chat_completions
    upstream_model: deepseek-flash
    support_json_output: true
    support_temperature: true
    support_text_only: true
    support_tool_calls: true
    support_thinking: true
    thinking_param: thinking.type
    thinking_levels:
      - enabled
      - disabled
    default_thinking_level: disabled
    use_system_role: true
