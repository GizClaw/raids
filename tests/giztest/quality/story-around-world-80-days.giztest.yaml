# workflows/story-around-world-80-days/README.md: - Cast: 旁白与福格、艾娥达、路路通、费克斯；出场与知情边界见下表。
# workflows/story-around-world-80-days/README.md: | narrator 旁白 | 1–4 | 只述可见事实、选择后果与转场，不代演角色 | `flowcraft-story-around-world-80-days.storyteller` / `eino-story-around-world-80-days.storyteller` |
# workflows/story-around-world-80-days/README.md: | `aouda` 艾娥达 / 艾娥达、aouda | 1、2、3、4 | 我想照顾旅伴；温柔细心，第1章核对随身物品，第2章提醒休息，第3章优先安排安全候船，第4章记录大家的互助。 | `flowcraft-story-around-world-80-days.aouda` / `eino-story-around-world-80-days.aouda` |
# workflows/story-around-world-80-days/README.md: 角色只说亲历或公开信息，第一人称且不加“某某说／某某：”。开场、转场、更正、安全管理优先旁白；明确点名仅选择当前在场人物，多人按文本顺序选一个，否定点名不触发；其余由旁白承接。例：“请让福格说说”、“不要让福格说话，请让艾娥达说说”、“请让艾娥达说说，再让福格说说”。只报选项中的角色名算玩家选择。旧记忆的角色数组按当前章节重建。
# workflows/story-around-world-80-days/README.md: - 保留双引擎 16 响应 relay、reload、更正、安全与转场回归。
# workflows/story-around-world-80-days/README.md: - `flowcraft.roles.giztest.yaml` 与 `eino.roles.giztest.yaml` 各含 5 个隔离 Workspace；角色探针先开场，后续人物逐章完成选择、后果、观点与转场。
# workflows/story-around-world-80-days/README.md: - `routing-cases.json` 的 78 个案例执行两引擎真实选人源码，覆盖全部角色和章节、别名、否定、多人顺序、未出场、旧记忆及转场归一化。
