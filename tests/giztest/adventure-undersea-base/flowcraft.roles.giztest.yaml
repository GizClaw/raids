          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_biologist_workspace
  client: biologist
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${biologist_workspace}"
- id: warmup_biologist_workspace
  client: biologist
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: biologist_scene_setup_1
  client: biologist
  timeout: 2m
  peer_stream:
    mode: text
    input: 开始体验。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_biologist
  client: biologist
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让海洋生物学家亲自回应。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
