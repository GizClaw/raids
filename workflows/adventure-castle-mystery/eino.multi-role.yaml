apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-adventure-castle-mystery-multi-role
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: adventure
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-adventure-castle-mystery-mr.adventure-guide
      speaker_voices:
        旁白: eino-adventure-castle-mystery-mr.adventure-guide
        城堡管理员: eino-adventure-castle-mystery-mr.keeper
        机械师: eino-adventure-castle-mystery-mr.mechanic
        档案员: eino-adventure-castle-mystery-mr.archivist
    graph:
      name: adventure-castle-mystery-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 20
      state:
        fields:
        - name: memory-query
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: stage-route
          type: string
          merge: replace
        - name: phase-key
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: scenario-policy
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: progress-fact
          type: string
          merge: replace
        - name: progress-lane
          type: string
          merge: replace
        - name: progress-kind
          type: string
          merge: replace
        - name: narration-context
          type: string
          merge: replace
        - name: voice-scene
          type: string
          merge: replace
        - name: voice-revision
          type: string
          merge: replace
      nodes:
      - id: control-narration
        type: script
        inputs:
          text:
            from: input.text
          history:
            from: input.messages
          memory:
            from: recalled
          stage_route:
            from: stage-route
        outputs:
          direction: narration-context
          scene: voice-scene
          revision: voice-revision
        language: starlark
        entrypoint: run
        source: |
          def any_cue(text, cues):
              return any([cue in text for cue in cues])

          def clause(text):
              for sep in ["，", "。", "；", "！", "？", ",", ";", "!", "?"]:
                  text = text.replace(sep, "|")
              for sep in ["但是", "而是", "再让", "改请", "改让", "but "]:
                  text = text.replace(sep, "|")
              return text

          def run(input):
              current = input["text"].strip().lower()
              memory = input.get("memory", "")
              scenes = ["客观勘察", "日志校准", "竞争假设", "临时结论"]
              roles = [{"key": "narrator", "name": "旁白", "aliases": ["旁白", "narrator"], "chapters": [1, 2, 3, 4], "duty": "只负责叙述、管理和公开信息整理，不代演角色。"}, {"key": "keeper", "name": "城堡管理员", "aliases": ["城堡管理员", "keeper"], "chapters": [1, 2], "duty": "复述已公开的现场记录，不能新增目击者或嫌疑人。"}, {"key": "mechanic", "name": "机械师", "aliases": ["机械师", "mechanic"], "chapters": [3], "duty": "区分待检查零件与已验证事实，不能声称已经检测出故障。"}, {"key": "archivist", "name": "档案员", "aliases": ["档案员", "archivist"], "chapters": [2, 3], "duty": "核对公开日志与更正后的时间，不能编造档案证词。"}]
              scene = 1
              revision = -1
              # Read only graph-authored state fields; legacy active_roles is never authoritative.
              for line in memory.split("\n"):
                  compact = line.replace(" ", "")
                  if '"schema":"raid_scenario_state_v2"' not in compact:
                      continue
                  rev = 0
                  if '"revision":' in compact:
                      value = compact.split('"revision":')[1].split(",")[0].split("}")[0]
                      if value.isdigit():
                          rev = int(value)
                  if rev >= revision and '"voice_scene":' not in compact:
                      for i in range(len(scenes)):
                          if scenes[i] in compact:
                              scene = i+1
                  if rev >= revision and '"voice_scene":' in compact:
                      value = compact.split('"voice_scene":')[1].split(",")[0].split("}")[0]
                      if value.isdigit():
                          scene = max(1, min(len(scenes), int(value)))
                          revision = rev
              for message in input.get("history", []):
                  if message.get("role", "") != "assistant":
                      continue
                  text = message.get("content", "")
                  for i in range(len(scenes)):
                      if "当前场景："+scenes[i] in text or "来到"+scenes[i] in text:
                          scene = i+1
              transition = False
              if not current or current.lower().rstrip("。！!") in ["开始", "开始吧", "从头开始", "重新开始", "start", "start over", "restart"] or any_cue(current, ["重新开始", "restart", "开场", "介绍这个体验", "开始体验"]):
                  scene = 1
              elif any_cue(current, ["进入下一章", "进入下一场景"]):
                  scene = min(len(scenes), scene+1)
                  transition = True
              else:
                  for i in range(len(scenes)):
                      if any_cue(current, ["进入"+scenes[i], "前往"+scenes[i], "来到"+scenes[i]]):
                          scene = i+1
                          transition = True
                  if any_cue(current, ["查看机械日志", "核对机械日志"]):
                      scene = 2
                      transition = True
                  if any_cue(current, ["检查零件", "检验竞争假设"]):
                      scene = 3
                      transition = True
              if not current or current.lower().rstrip("。！!") in ["开始", "开始吧", "从头开始", "重新开始", "start", "start over", "restart"] or any_cue(current, ['开始城堡', '介绍钟楼']):
                  phase = "opening"
              elif any_cue(current, ['更正', '只确认', '有效鞋印', '正确时间', '正确尺码', '只说有效', '重连', '隔了几轮', '只说']):
                  phase = "correction"
              elif any_cue(current, ['总结', '暂时结论', '给出结论', '三句以内']):
                  phase = "conclusion"
              elif any_cue(current, ['我猜', '怀疑', '一定', '检验推理', '可能是', '能支持', '不能支持', '不要下结论', '第几阶段']):
                  phase = "challenge"
              else:
                  phase = "explore"
              stage_route = input.get("stage_route", "")
              for i in range(len(scenes)):
                  if scenes[i] in stage_route:
                      scene = i+1
              active_roles = [r["key"] for r in roles if scene in r["chapters"]]
              management_text = current
              for role in roles:
                  for alias in role["aliases"]:
                      management_text = management_text.replace(alias, "")
              management = not current or transition or any_cue(management_text, ["旅程", "更正", "纠正", "修正", "改成", "改变主意", "其实", "安全", "危险", "现实", "模仿", "受伤", "攻击", "牺牲", "停止", "总结", "结论", "回忆", "重连", "恢复", "请记住", "只确认", "只说", "换边", "correction", "correct", "actually", "danger", "safety", "restart", "重新开始", "开场", "介绍这个体验", "进入下一", "下一章", "下一场景", "转场", "开始体验", "从头开始", "第一章", "第1章", "开始冒险", "start", "begin", "介绍体验", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物"]) or phase != "explore"
              direction = "原创配角按场景出场，不知未来/秘密/未验证结果。\n首次让在场角色自然登场。\n三名配角不能新增任何改变案件结论的证词、目击、故障检测或档案。只复述本轮之前已公开且仍有效的观察；不知道就说明不知道。" + "\n当前场景："+scenes[scene-1]+"。当前在场角色："+"、".join([r["name"] for r in roles if r["key"] in active_roles])+"。"
              if transition:
                  direction += "本轮由旁白说出‘来到"+scenes[scene-1]+"’，用旁白和在场角色台词交替描写具体行动，结尾给两三个观察选项。"
              direction += "紧邻下一场景：" + (scenes[scene] if scene < len(scenes) else "终局") + "。当前及自然转场后的职责：" + "；".join([r["name"] + "：" + r["duty"] for r in roles if (scene in r["chapters"] or scene+1 in r["chapters"]) and r["key"] != "narrator"])
              # Content obligations follow voice style so role brevity cannot suppress them.
              safety_request = any([cue in current for cue in ["现实", "模仿", "照做", "安全", "危险", "受伤", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物", "danger", "safety", "imitate"]])
              turn_contract = ""
              if safety_request:
                  turn_contract = "本轮是安全请求，优先于角色风格和章节推进：制止危险模仿，给安全替代，并请孩子找家长、老师或可信任成年人帮助，简短回应。"
              direction += "\n本轮参考：" + turn_contract
              return {"direction": direction, "scene": str(scene), "revision": str(max(revision, len(input.get("history", [])))+1)}
        limits:
          max_execution_steps: 100000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"]
              base = "城堡谜案当前阶段、已观察证据、日志更正和待验证假设"
              return {"query": base + ("；当前请求：" + text if text else "")}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-progress
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 12
      - id: route-stage
        type: script
        inputs:
          text:
            from: input.text
          history:
            from: input.messages
          memory:
            from: recalled
        outputs:
          phase: phase-key
          route: stage-route
          policy: scenario-policy
        language: starlark
        entrypoint: run
        source: |
          def contains_any(text, values):
              for value in values:
                  if value in text:
                      return True
              return False

          def run(input):
              current = input["text"].strip()
              combined = input["memory"] + "\n" + ("" if contains_any(current, ["说说","说话","发言","回应","回答","talk","speak","answer"]) else current)
              for message in input["history"]:
                  if "content" in message and not contains_any(message["content"], ["说说","说话","发言","回应","回答","talk","speak","answer"]):
                      combined += "\n" + message["content"]
              if not current or current.lower().rstrip("。！!") in ["开始", "开始吧", "从头开始", "重新开始", "start", "start over", "restart"] or contains_any(current, ['开始城堡', '介绍钟楼']):
                  phase = "opening"
              elif contains_any(current, ['更正', '只确认', '有效鞋印', '正确时间', '正确尺码', '只说有效', '重连', '隔了几轮', '只说']):
                  phase = "correction"
              elif contains_any(current, ['总结', '暂时结论', '给出结论', '三句以内']):
                  phase = "conclusion"
              elif contains_any(current, ['我猜', '怀疑', '一定', '检验推理', '可能是', '能支持', '不能支持', '不要下结论', '第几阶段']):
                  phase = "challenge"
              else:
                  phase = "explore"
              conclude = contains_any(current, ["总结脚印", "暂时结论", "给出结论"])
              if conclude and "不要下结论" not in current:
                  route = "第四阶段‘临时结论’"
              elif contains_any(combined, ["竞争假设", "风雨", "松动零件", "机械误差", "修钟人", "不要下结论", "第几阶段"]):
                  route = "第三阶段‘竞争假设’"
              elif contains_any(combined, ["日志校准", "零点十五分", "零点零五分", "机械日志", "管理员最初记录"]):
                  route = "第二阶段‘日志校准’"
              else:
                  route = "第一阶段‘客观勘察’"
              return {"phase": phase, "route": route, "policy": "儿童城堡谜案：帮助孩子观察线索、验证猜想，区分观察、证词和推断，不作无证据指控。保留已知地点、时间和物件关系；未查明的来源不编成事实。非暴力、无恐怖。" + ("开场保留身份/背景，展开连续故事，原问置末尾：我们来到一座古老的城堡，你是来帮忙的小侦探，要找出钟声提前响起的原因。你可以说想先查看哪个线索，也可以说出你的猜想，我们一起验证。城堡钟楼在午夜提前响了，桌上留下湿脚印和一根蓝色羽毛，你想先验证哪个线索？" if phase == "opening" else "")}
        limits:
          max_execution_steps: 20000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      - id: prompt-opening
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: stage-route
          policy:
            from: scenario-policy
          direction:
            from: narration-context
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {policy}
            权威路径：{route}，旧记忆不得倒退阶段。
            孩子只能在你说完后按键回答：每条回复的最后一句都必须是问孩子的问题，安全提醒回合也要在提醒之后把话头交回孩子，只有用户明确限定句数、字数或字段时才可以短答；例如接下来想先调查什么、想先试哪个办法，绝不能以陈述句或角色台词结尾。结尾不能平铺直叙地讲完就停：最后要先用一句话交代现在的处境，再用一个有画面感的问题把选择交给孩子。只有整个故事或整场冒险真的讲完、后面没有内容时才可以不再提问，但必须有一段像样的收尾话：先用一两句温暖的结束语收住（例如“我们的故事就讲到这里啦”），再把这一路最难忘的地方点一句，最后告诉孩子可以说“开始”重新听一遍，或者换一个故事；绝不能没有交代就停住。孩子说“继续上次的内容”时，不重播开场，先用一句话说出上次进行到哪里，再接着冒险并以问题收尾；没有可承接的内容时按开场处理。
            相关长期进度只用于核对，不得覆盖更新的对话：
            {memory}
            本轮场景与在场角色约束：
            {direction}
            有声书连续讲述：约1至2分钟，旁白叙述与角色第一人称台词分段，让在场角色有来有回，生动有趣、细节丰富。回应孩子刚说的话，尊重改选和更正，记住最新事实；追问、插话和重听自然接续。故事自然推进，最后一句必须是向孩子提出的故事内问题，不能以旁白或角色台词结尾。回忆和确认可以简短；遇到现实危险，劝阻模仿并引导找家长、老师或可信任的大人。
            有声书连续讲述：旁白叙述与角色第一人称台词分段，与在场角色交替；单角色不添人。只知亲历/公开信息。插话接续，点名仅增台词不换场/整轮。
            标记格式：仅限【旁白】、【城堡管理员】、【机械师】、【档案员】，每段一个，标题用【旁白】。未列名人物（如路人、摊主）及孩子的话一律由【旁白】转述，如：卖糖粥的阿婆笑着说……；不输出其它【】标记，禁止新增姓名标记，禁止给孩子加标记。
            音色由段落标记映射；仅朗读正文，禁Markdown/列表/emoji/舞台说明/系统字段/分析。
        - placeholder: history
      - id: prompt-explore
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: stage-route
          policy:
            from: scenario-policy
          direction:
            from: narration-context
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {policy}
            权威路径：{route}，旧记忆不得倒退阶段。
            孩子只能在你说完后按键回答：每条回复的最后一句都必须是问孩子的问题，安全提醒回合也要在提醒之后把话头交回孩子，只有用户明确限定句数、字数或字段时才可以短答；例如接下来想先调查什么、想先试哪个办法，绝不能以陈述句或角色台词结尾。结尾不能平铺直叙地讲完就停：最后要先用一句话交代现在的处境，再用一个有画面感的问题把选择交给孩子。只有整个故事或整场冒险真的讲完、后面没有内容时才可以不再提问，但必须有一段像样的收尾话：先用一两句温暖的结束语收住（例如“我们的故事就讲到这里啦”），再把这一路最难忘的地方点一句，最后告诉孩子可以说“开始”重新听一遍，或者换一个故事；绝不能没有交代就停住。孩子说“继续上次的内容”时，不重播开场，先用一句话说出上次进行到哪里，再接着冒险并以问题收尾；没有可承接的内容时按开场处理。
            相关长期进度只用于核对，不得覆盖更新的对话：
            {memory}
            本轮场景与在场角色约束：
            {direction}
            有声书连续讲述：旁白叙述与角色第一人称台词分段，与在场角色交替；单角色不添人。只知亲历/公开信息。插话接续，点名仅增台词不换场/整轮。
            标记格式：仅限【旁白】、【城堡管理员】、【机械师】、【档案员】，每段一个，标题用【旁白】。未列名人物（如路人、摊主）及孩子的话一律由【旁白】转述，如：卖糖粥的阿婆笑着说……；不输出其它【】标记，禁止新增姓名标记，禁止给孩子加标记。
            音色由段落标记映射；仅朗读正文，禁Markdown/列表/emoji/舞台说明/系统字段/分析。
        - placeholder: history
      - id: prompt-correction
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: stage-route
          policy:
            from: scenario-policy
          direction:
            from: narration-context
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {policy}
            权威路径：{route}，旧记忆不得倒退阶段。
            孩子只能在你说完后按键回答：每条回复的最后一句都必须是问孩子的问题，安全提醒回合也要在提醒之后把话头交回孩子，只有用户明确限定句数、字数或字段时才可以短答；例如接下来想先调查什么、想先试哪个办法，绝不能以陈述句或角色台词结尾。结尾不能平铺直叙地讲完就停：最后要先用一句话交代现在的处境，再用一个有画面感的问题把选择交给孩子。只有整个故事或整场冒险真的讲完、后面没有内容时才可以不再提问，但必须有一段像样的收尾话：先用一两句温暖的结束语收住（例如“我们的故事就讲到这里啦”），再把这一路最难忘的地方点一句，最后告诉孩子可以说“开始”重新听一遍，或者换一个故事；绝不能没有交代就停住。孩子说“继续上次的内容”时，不重播开场，先用一句话说出上次进行到哪里，再接着冒险并以问题收尾；没有可承接的内容时按开场处理。
            相关长期进度只用于核对，不得覆盖更新的对话：
            {memory}
            本轮场景与在场角色约束：
            {direction}
            有声书连续讲述：旁白叙述与角色第一人称台词分段，与在场角色交替；单角色不添人。只知亲历/公开信息。插话接续，点名仅增台词不换场/整轮。
            标记格式：仅限【旁白】、【城堡管理员】、【机械师】、【档案员】，每段一个，标题用【旁白】。未列名人物（如路人、摊主）及孩子的话一律由【旁白】转述，如：卖糖粥的阿婆笑着说……；不输出其它【】标记，禁止新增姓名标记，禁止给孩子加标记。
            音色由段落标记映射；仅朗读正文，禁Markdown/列表/emoji/舞台说明/系统字段/分析。
        - placeholder: history
      - id: prompt-challenge
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: stage-route
          policy:
            from: scenario-policy
          direction:
            from: narration-context
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {policy}
            权威路径：{route}，旧记忆不得倒退阶段。
            孩子只能在你说完后按键回答：每条回复的最后一句都必须是问孩子的问题，安全提醒回合也要在提醒之后把话头交回孩子，只有用户明确限定句数、字数或字段时才可以短答；例如接下来想先调查什么、想先试哪个办法，绝不能以陈述句或角色台词结尾。结尾不能平铺直叙地讲完就停：最后要先用一句话交代现在的处境，再用一个有画面感的问题把选择交给孩子。只有整个故事或整场冒险真的讲完、后面没有内容时才可以不再提问，但必须有一段像样的收尾话：先用一两句温暖的结束语收住（例如“我们的故事就讲到这里啦”），再把这一路最难忘的地方点一句，最后告诉孩子可以说“开始”重新听一遍，或者换一个故事；绝不能没有交代就停住。孩子说“继续上次的内容”时，不重播开场，先用一句话说出上次进行到哪里，再接着冒险并以问题收尾；没有可承接的内容时按开场处理。
            相关长期进度只用于核对，不得覆盖更新的对话：
            {memory}
            本轮场景与在场角色约束：
            {direction}
