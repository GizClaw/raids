# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of story-shanhaijing,
# So that safety, correction, recall, routing and language regressions fail at the original gates.
version: gizclaw.test/v1alpha1
name: story-shanhaijing.quality.eino.multi-role
clients:
  eino_multi_role__transitions:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_multi_role__routing:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  eino_multi_role_transitions_workspace:
    direction: input
    type: string
    generate: token
  eino_multi_role_routing_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 30m
steps:
- id: eino_multi_role__transitions_register
  client: eino_multi_role__transitions
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_multi_role_transitions_stop_create_workspace
  client: eino_multi_role__transitions
  rpc:
    method: server.run.stop
    request: {}
- id: eino_multi_role_transitions_create_workspace
  client: eino_multi_role__transitions
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_multi_role_transitions_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-shanhaijing-multi-role
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_multi_role_transitions_select_workspace
  client: eino_multi_role__transitions
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_multi_role_transitions_workspace}"
- id: eino_multi_role_transitions_warmup_workspace
  client: eino_multi_role__transitions
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- timeout: 4m
  id: eino_multi_role_transitions_opening_with_guidance
  client: eino_multi_role__transitions
  peer_stream:
    mode: text
    input: 请从第一章开始《山海经》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_all:
      - 第 1 章
      - 图卷初开
      - 少年探险者
      - 灵兽向导
      not_contains:
      - "【"
      - "】"
      - 进入下一章
      - 要不要继续
      - 想继续听就说
      - 这一章的选择完成啦
      - 等你说要不要
      - 是否继续听
      min_length: 200
      max_length: 900
      pattern: "[？?]\\s*$"
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/audio_integrity/streams":
      equals: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- timeout: 4m
  id: eino_multi_role_transitions_natural_consequence
  client: eino_multi_role__transitions
  peer_stream:
    mode: text
    input: 请继续当前场景，推进一个直接结果。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - "【"
      - "】"
      - 进入下一章
      - 要不要继续
      - 想继续听就说
      - 这一章的选择完成啦
      - 等你说要不要
      - 是否继续听
      min_length: 200
      max_length: 900
      pattern: "[？?]\\s*$"
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/audio_integrity/streams":
      equals: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- id: eino_multi_role__routing_reconnect_before_register
  client: eino_multi_role__routing
  reconnect: {}
- id: eino_multi_role__routing_register
  client: eino_multi_role__routing
  rpc:
