- id: warmup_keeper_workspace
  client: keeper
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: keeper_scene_setup_1
  client: keeper
  timeout: 2m
  peer_stream:
    mode: text
    input: 开始城堡谜案
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_keeper
  client: keeper
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让城堡管理员亲自回应。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      not_contains:
      - 城堡管理员说
      - 城堡管理员：
- id: probe_keeper_first_response
  client: keeper
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让城堡管理员亲自回应。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
