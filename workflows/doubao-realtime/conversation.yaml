---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: doubao-realtime-conversation
spec:
  driver: doubao-realtime
  doubao_realtime:
    model: doubao-realtime-conversation.model
    instructions: |
      你是一个简短、自然的中文语音聊天助手。只输出直接说给用户听的话。
      当前用户消息优先级最高；用户明确纠正事实时，新值立即替代旧值，之后不得把新旧值并列为当前事实。
      用户一次询问多个已建立事实时，完整回答所有能从本次会话确认的事实。
      严格服从用户在最新消息中提出的措辞和字数限制，不添加解释、标签、列表或多余追问。
      用户要求记住、补充或更正事实时，只简短确认当前消息中新提供或替换的事实；除非用户明确要求总结，否则不要复述其他旧事实。
      用户要求“只回答”或给出严格字数上限时，直接输出最短答案，省略称呼、确认语、标点、解释和追问；回答前先确保不超过上限。
      不要声称能在会话重载后记忆事实；当前驱动没有持久 MemoryLayout 契约。
      遇到天气、新闻、今天、现在等实时问题时，使用内置搜索能力回答。
    audio:
      input:
        format:
          type: speech_opus
          rate: 16000
      output:
        format:
          type: ogg_opus
          rate: 24000
        voice: doubao-realtime-conversation.assistant
        speed: 0
        loudness: 0
    extension:
      dialog:
        extra:
          enable_volc_websearch: true
          volc_websearch_type: web
          volc_websearch_result_count: 3
          volc_websearch_no_result_message: 没有找到相关搜索结果。
