# workflows/story-robinson-crusoe/README.md: 角色表：narrator 旁白（别名 旁白/narrator），只在第1、2、3、4章在场，只述可见事实，不代演角色；robinson 鲁滨逊（别名 鲁滨逊/robinson），只在第1、2、3、4章在场，想建立可持续的营地；清晰理性，第1章清点退潮物资；friday 星期五（别名 星期五/friday），只在第1、2、3、4章在场，想作为平等伙伴合作；清爽坦率，第1章建议标记安全营地，第3章核对脚印，不凭空认定危险；captain 船长（别名 船长/captain），只在第4章在场，想带全员安全归航；幽默稳重，第4章核对人数与天气，并商议带走哪些物资。所有角色只说亲历或已公开信息，不知他人私密想法及未来结果。每章比较至少两种立场，不要求全员发声。章节行动属于本仓库儿童互动原创改编，不等同原典情节。本改编让星期五从第1章即作为平等伙伴在场，不采用主仆叙事。
# workflows/story-robinson-crusoe/README.md: 点名示例：“请让鲁滨逊说说”；“不要让鲁滨逊说话，请让星期五说说”；“请让星期五说说，再让鲁滨逊说说”只选文本顺序首个在场者。只说“鲁滨逊”或“我支持鲁滨逊”算玩家选择。开场、转场（含阻塞）、更正、安全管理优先旁白，未在场角色不可点名，旧记忆 active_roles 按章节重建。
# workflows/story-robinson-crusoe/README.md: 两份 roles Giztest 各有 4 个隔离 Workspace，后续角色先完成真实章节前置；检查 text/audio EOS、audio_bytes > 0，首响应保持文本 2s、音频 3s。保留 16 轮 relay、reload、更正、转场与 RealTime 用例；routing-cases.json 执行真实 JS 和 Starlark。离线门禁不证明实际音色正确，运行时 Voice ID 日志与试听仍需在线验收。
