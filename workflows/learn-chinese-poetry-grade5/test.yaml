apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: learn-chinese-poetry-grade5-test
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    graph:
      name: learn-chinese-poetry-grade5-test-relay
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 8
      state:
        fields:
        - name: tester-route
          type: string
          merge: replace
        - name: tester-message
          type: string
          merge: replace
        - name: tester-det
          type: string
          merge: replace
        - name: prompt-system
          type: string
          merge: replace
        - name: prompt-user
          type: string
          merge: replace
        - name: judge-messages
          type: messages
          merge: replace
        - name: model-text
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: route-turn
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: tester-route
          message: tester-message
          det: tester-det
          system: prompt-system
          user: prompt-user
        language: starlark
        entrypoint: run
        source: |
          REQUESTS = ["请从指定中文开场开始。", "我们刚学了《示儿》，你给我讲讲吧。", "你能把这首诗完整地念给我听吗？", "这首诗是在什么情况下写的？是有记载的，还是一般认为的，还是传说？", "诗人写这首诗那天中午吃的是什么？", "我还会背《咏鹅》，你能念给我听吗？", "请记住：我今天学会了《示儿》，下次想学《山居秋暝》。只确认你已经记住。", "重连后，请只说我下次想学哪首诗。"]
          INTENTS = ["", "", "", "", "", "", "", ""]
          CHECKPOINTS = ["opening", "poem-intro", "recite-exact", "background-label", "unknown-boundary", "other-grade-poem", "memory-store", "memory-recall"]
          CONTRACTS = ["必须逐字符合指定中文开场；不得含Markdown、列表、emoji或舞台说明；15-240字", "必须承接这首诗并正确说出作者陆游；只讲知识卡内的作者或背景；最多一个问题；30-360字", "必须逐字念出课本正文“死去元知万事空，但悲不见九州同。王师北定中原日，家祭无忘告乃翁。”，不得改字漏字；20-360字", "必须按知识卡讲背景“陆游临终前写给儿子们的绝笔诗，作于他去世前不久（1210年初）。”，并说明它属于史实；不得添加知识卡外的细节；20-360字", "知识卡没有这个细节，必须明确说没有记载或不确定，不得编造食物、地名或人名，也不得用可能、大概去猜；10-320字", "《咏鹅》是一年级的诗，必须正常念出全文“鹅，鹅，鹅，曲项向天歌。白毛浮绿水，红掌拨清波。”，不得婉拒；20-360字", "必须确认已记住今天学会的诗和下次想学《山居秋暝》（复述措辞可以不同，下一轮重连后再严格核对）；4-320字", "重载后必须从长期记忆准确回忆《山居秋暝》；只回答诗名；2-200字"]
          CHECKS = [{"required": ["你好呀，我是古诗小书童。我们来聊聊五年级的古诗吧，说一首你学过的，我给你讲讲它背后的故事。"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 15, "max_runes": 240}, {"required": ["陆游"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 30, "max_runes": 360}, {"required": ["死去元知万事空", "但悲不见九州同", "王师北定中原日", "家祭无忘告乃翁"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["记载", "原注", "注明", "写着"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["没有记载", "没有留下记载", "没有相关记载", "没有确切记载", "不确定", "不知道", "查不到", "没有资料", "无法确定", "没法确定", "没有确切"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 10, "max_runes": 320}, {"required": ["鹅", "鹅", "鹅", "曲项向天歌", "白毛浮绿水", "红掌拨清波"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["记住", "记下", "记好", "记得"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 4, "max_runes": 320}, {"required": ["山居秋暝"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 2, "max_runes": 200}]
          RULES = "你是 `learn-chinese-poetry-grade5` 的专属验收 Workflow，不是目标角色。指定中文开场是：你好呀，我是古诗小书童。我们来聊聊五年级的古诗吧，说一首你学过的，我给你讲讲它背后的故事。 体验要求：古诗小书童陪孩子拓展课本古诗，念知识卡里的诗必须与课本正文逐字一致；背景要区分有记载、一般认为和传说；可以在知识卡基础上补充公认准确的内容；查无实据的细节必须承认没有记载或不确定，不得编造；孩子提到的任何诗都要正常讲、正常念，婉拒属于失败。本路线使用的知识卡条目：《示儿》宋·陆游，正文“死去元知万事空，但悲不见九州同。王师北定中原日，家祭无忘告乃翁。”，背景（史实）：陆游临终前写给儿子们的绝笔诗，作于他去世前不久（1210年初）。。《咏鹅》唐·骆宾王，正文“鹅，鹅，鹅，曲项向天歌。白毛浮绿水，红掌拨清波。”。《山居秋暝》唐·王维。知识卡没有记录诗人写诗那天吃了什么。 知识卡是目标的提纲：目标可以在知识卡基础上补充公认准确的常识、背景和延伸知识，这不算编造；只有和知识卡矛盾、明显错误，或查无实据的细节（例如某人某天吃了什么、说过的原话、具体日期）才算编造。完整知识卡如下：常识：绝句每首四句，属于唐代成熟的“近体诗”。五言绝句每句5个字、共20字；七言绝句每句7个字、共28字。 常识：律诗每首八句：五言律诗共40字，七言律诗共56字；第二、四、六、八句要押韵，格律要求很严。 常识：“五言”指每句五个字，“七言”指每句七个字，例如《登鹳雀楼》是五言绝句，《暮江吟》是七言绝句。 常识：《全唐诗》是清代康熙年间（1705年开始编）奉皇帝命令编成的唐诗总集，共900卷，收诗四万八千九百多首、诗人两千二百多位。 常识：李白被后人誉为“诗仙”，杜甫被尊为“诗圣”，两人合称“李杜”。 常识：《唐诗三百首》是清代孙洙（号蘅塘退士）和夫人徐兰英编的唐诗选本，1763年前后成书，原本收77位诗人的311首诗，后来的版本有增补。 作者 陆游：陆游（1125—1210），字务观，号放翁，南宋爱国诗人。 作者 龚自珍：龚自珍（1792—1841），字璱人，号定盦（一作定庵），清代思想家、诗人。 作者 王维：王维（701—761，一说699—761），字摩诘，有“诗佛”之称。 作者 张继：张继，字懿孙，唐天宝十二年（753）进士，生卒年不详。 作者 林升：南宋诗人，生平记载很少，这首诗是他最有名的作品。 作者 韩愈：唐代文学家，“唐宋八大家”之一。 作者 林杰：晚唐诗人，据《全唐诗》小传，他幼年聪慧能诗，十七岁就去世了。 作者 孟郊：唐代诗人，和贾岛并称“郊寒岛瘦”。 作者 张志和：唐代诗人，隐居江湖，自号“烟波钓徒”。 作者 朱熹：南宋理学家，著有《四书章句集注》。 作者 虞世南：唐初书法家、诗人，与欧阳询等并称“初唐四大家”。 作者 纳兰性德：清代词人，曾任康熙帝的侍卫。 作者 范成大：南宋诗人，号石湖居士，“中兴四大诗人”之一。 作者 杨万里：南宋诗人，号诚斋，“中兴四大诗人”之一。 作者 雷震：宋代诗人，生平事迹记载很少。 作者 王昌龄：盛唐诗人，擅长七言绝句，被称为“七绝圣手”。 作者 杜甫：唐代诗人，被尊为“诗圣”。 作者 王之涣：盛唐诗人，流传下来的诗只有六首。 作者 翁卷：南宋诗人，“永嘉四灵”之一。 《示儿》宋·陆游｜五年级上册｜正文：死去元知万事空，但悲不见九州同。王师北定中原日，家祭无忘告乃翁。｜背景（史实）：陆游临终前写给儿子们的绝笔诗，作于他去世前不久（1210年初）。｜拓展：陆游是中国历史上自己写的诗留存最多的诗人之一，今天还能读到九千多首。 《己亥杂诗》清·龚自珍｜五年级上册｜正文：九州生气恃风雷，万马齐喑究可哀。我劝天公重抖擞，不拘一格降人材。｜背景（史实）：1839年龚自珍辞官南归，途经镇江见百姓祭祀玉皇和风神雷神，道士请他写祭文而作。｜拓展：《己亥杂诗》是一大组诗，一共三百一十五首，这首是第一百二十五首。｜异文：这是组诗《己亥杂诗》的第一百二十五首；“人材”也有写作“人才”的。 《山居秋暝》唐·王维｜五年级上册｜正文：空山新雨后，天气晚来秋。明月松间照，清泉石上流。竹喧归浣女，莲动下渔舟。随意春芳歇，王孙自可留。｜背景（通说）：一般认为作于王维在终南山辋川别业过半官半隐生活的时期。｜拓展：苏轼称赞王维的作品“诗中有画，画中有诗”。 《枫桥夜泊》唐·张继｜五年级上册｜正文：月落乌啼霜满天，江枫渔火对愁眠。姑苏城外寒山寺，夜半钟声到客船。｜背景（通说）：一说安史之乱后张继避乱江南，秋夜停船在苏州城外枫桥时所作。｜拓展：寒山寺在苏州枫桥镇，从1979年起每年跨年夜都会敲响108下新年钟声。｜异文：诗题一作《夜泊枫江》。 《题临安邸》宋·林升｜五年级上册｜正文：山外青山楼外楼，西湖歌舞几时休？暖风熏得游人醉，直把杭州作汴州。｜背景（通说）：南宋偏安临安后当权者只顾享乐，诗人题在旅店墙上讽刺此事。｜拓展：临安就是今天的杭州，汴州是北宋都城，今河南开封。 《早春呈水部张十八员外》唐·韩愈｜五年级上册｜正文：天街小雨润如酥，草色遥看近却无。最是一年春好处，绝胜烟柳满皇都。｜背景（通说）：韩愈写给好友张籍的诗，一般认为作于823年早春，想邀他出门游春。｜拓展：张籍在同族兄弟中排行第十八，所以叫“张十八”。｜异文：原题共两首，课本选的是第一首，也有题作《初春小雨》的。 《乞巧》唐·林杰｜五年级上册·日积月累｜正文：七夕今宵看碧霄，牵牛织女渡河桥。家家乞巧望秋月，穿尽红丝几万条。｜背景（史实）：写作时间、地点没有确切记载｜拓展：七夕夜姑娘们对着月亮穿针引线，向织女“乞巧”。 《游子吟》唐·孟郊｜五年级上册·日积月累｜正文：慈母手中线，游子身上衣。临行密密缝，意恐迟迟归。谁言寸草心，报得三春晖。｜背景（史实）：诗人自注“迎母溧上作”：五十岁任溧阳县尉后接母亲同住时所写。｜拓展：“寸草心”比喻儿女的心，“三春晖”比喻母亲的爱。｜异文：“谁言寸草心”也有写作“难将寸草心”的。 《渔歌子》唐·张志和｜五年级上册·日积月累｜正文：西塞山前白鹭飞，桃花流水鳜鱼肥。青箬笠，绿蓑衣，斜风细雨不须归。｜背景（通说）：张志和拜访湖州刺史颜真卿时即兴唱和所作，同调共五首。｜拓展：这首词曾传到日本，日本嵯峨天皇还仿写过《渔歌子》。 《观书有感（其一）》宋·朱熹｜五年级上册·日积月累｜正文：半亩方塘一鉴开，天光云影共徘徊。问渠那得清如许？为有源头活水来。｜背景（史实）：写作时间、地点没有确切记载｜拓展：成语“源头活水”就出自这首诗。｜异文：“那”通“哪”。 《蝉》唐·虞世南｜五年级上册·日积月累｜正文：垂緌饮清露，流响出疏桐。居高声自远，非是藉秋风。｜背景（史实）：写作时间、地点没有确切记载｜拓展：古人以为蝉只喝露水，其实蝉是吸树的汁液。 《长相思》清·纳兰性德｜五年级上册｜正文：山一程，水一程，身向榆关那畔行，夜深千帐灯。风一更，雪一更，聒碎乡心梦不成，故园无此声。｜背景（史实）：1682年纳兰性德随康熙帝东巡，出山海关途中思念家乡而作。｜拓展：“榆关”就是今天的山海关。 《四时田园杂兴（其三十一）》宋·范成大｜五年级下册｜正文：昼出耘田夜绩麻，村庄儿女各当家。童孙未解供耕织，也傍桑阴学种瓜。｜背景（通说）：范成大晚年退居家乡苏州石湖时写的六十首田园组诗之一。｜拓展：《四时田园杂兴》共六十首，写了农村一年四季的生活。 《稚子弄冰》宋·杨万里｜五年级下册｜正文：稚子金盆脱晓冰，彩丝穿取当银钲。敲成玉磬穿林响，忽作玻璃碎地声。｜背景（通说）：一般认为作于1179年春，杨万里在常州做官时。｜拓展：“钲”和“磬”都是古代的打击乐器。 《村晚》宋·雷震｜五年级下册｜正文：草满池塘水满陂，山衔落日浸寒漪。牧童归去横牛背，短笛无腔信口吹。｜背景（史实）：写作时间、地点没有确切记载｜拓展：“陂”是池塘的岸，“漪”是水面的波纹。 《从军行（其四）》唐·王昌龄｜五年级下册｜正文：青海长云暗雪山，孤城遥望玉门关。黄沙百战穿金甲，不破楼兰终不还。｜背景（史实）：王昌龄用乐府旧题写的边塞组诗《从军行七首》中的第四首。｜拓展：楼兰是西域古国，玉门关故址在今甘肃敦煌西北。｜异文：“不破楼兰”也有写作“不斩楼兰”的。 《秋夜将晓出篱门迎凉有感》宋·陆游｜五年级下册｜正文：三万里河东入海，五千仞岳上摩天。遗民泪尽胡尘里，南望王师又一年。｜背景（通说）：一般认为作于1192年秋陆游在家乡山阴时，那时中原已沦陷六十多年。｜拓展：“三万里河”指黄河，“五千仞岳”指华山。｜异文：原为同题二首之第二首。 《闻官军收河南河北》唐·杜甫｜五年级下册｜正文：剑外忽传收蓟北，初闻涕泪满衣裳。却看妻子愁何在，漫卷诗书喜欲狂。白日放歌须纵酒，青春作伴好还乡。即从巴峡穿巫峡，便下襄阳向洛阳。｜背景（通说）：763年春杜甫在蜀中听说官军收复河南河北、安史之乱将平，喜极而作。｜拓展：清人浦起龙称这首诗是杜甫“生平第一首快诗”。｜异文：杜甫在诗后自己注了一句“余田园在东京”，东京指洛阳。 《鸟鸣涧》唐·王维｜五年级下册·日积月累｜正文：人闲桂花落，夜静春山空。月出惊山鸟，时鸣春涧中。｜背景（史实）：王维为友人皇甫岳的云溪别墅所题组诗五首中的第一首。｜拓展：这首诗原是《皇甫岳云溪杂题五首》的第一首。 《凉州词》唐·王之涣｜五年级下册·日积月累｜正文：黄河远上白云间，一片孤城万仞山。羌笛何须怨杨柳，春风不度玉门关。｜背景（史实）：写作时间、地点没有确切记载｜拓展：唐人《集异记》说，歌女唱这首诗，让王之涣赢了赛诗。｜异文：原题共两首，课本选的是第一首；第一句也有写作“黄沙直上白云间”的。 《乡村四月》宋·翁卷｜五年级下册·日积月累｜正文：绿遍山原白满川，子规声里雨如烟。乡村四月闲人少，才了蚕桑又插田。｜背景（史实）：写作时间、地点没有确切记载｜拓展：“子规”就是杜鹃鸟，春末夏初常常啼叫。"
          PERSONA = ""
          JUDGE_DIMS = ["instruction_following", "continuity", "factuality", "non_repetition"]
          OFFSET = 0
          N = 8
          WHITESPACE = " \t\n\r　"
          PUNCT = "，。！？、；：“”‘’（）《》〈〉【】『』「」—…·～,.!?;:'\"()[]{}<>-_/\\|`~@#$%^&*+=·"
          DIGITS = {"０": "0", "１": "1", "２": "2", "３": "3", "４": "4", "５": "5", "６": "6", "７": "7", "８": "8", "９": "9", "零": "0", "一": "1", "二": "2", "三": "3", "四": "4", "五": "5", "六": "6", "七": "7", "八": "8", "九": "9"}
          def rune_count(text):
              n = 0
              for _ in text.codepoints():
                  n += 1
              return n

          def normalize(text, drop_punct):
              out = []
              for ch in text.codepoints():
                  if ch in WHITESPACE:
                      continue
                  if drop_punct and ch in PUNCT:
                      continue
                  if ch in DIGITS:
                      out.append(DIGITS[ch])
                      continue
                  out.append(ch.lower())
              return "".join(out)

          def is_sentinel(value):
              if value in ["```", "###", "-"]:
                  return True
              if len(value) < 2 or not value.endswith("."):
                  return False
              for ch in value[:-1].codepoints():
                  if ch not in "0123456789":
                      return False
              return True

          def forbidden_hit(text, needle):
              trimmed = needle.strip()
              if trimmed.endswith(":") or trimmed.endswith("："):
                  return normalize(trimmed, False) in normalize(text, False)
              normalized = normalize(needle, True)
              if normalized == "" or is_sentinel(trimmed):
                  return trimmed in text
              return normalized in normalize(text, True)

          def deterministic_failures(index, text):
              spec = CHECKS[index]
              failures = []
              plain = normalize(text, False)
              for fact in spec.get("required", []):
                  if normalize(fact, False) not in plain:
                      failures.append("required:" + fact)
              for group in spec.get("required_any", []):
                  found = False
                  for fact in group:
                      if normalize(fact, False) in plain:
                          found = True
                          break
                  if not found:
                      failures.append("required_any:" + "|".join(group))
              for fact in spec.get("forbidden", []):
                  if forbidden_hit(text, fact):
                      failures.append("forbidden:" + fact)
              count = rune_count(text)
              if spec.get("min_runes", 0) > 0 and count < spec["min_runes"]:
                  failures.append("min_runes:" + str(count) + "<" + str(spec["min_runes"]))
              if spec.get("max_runes", 0) > 0 and count > spec["max_runes"]:
                  failures.append("max_runes:" + str(count) + ">" + str(spec["max_runes"]))
              return failures

          def aligned_rounds(messages):
              # Returns [(index, request_text, reply_text)] aligned from the newest message
              # backwards so a truncated History window still maps later rounds correctly.
              users = []
              previous_assistant = ""
              for message in messages:
                  role = message.get("role", "")
                  content = message.get("content", "")
                  if role == "assistant":
                      previous_assistant = content
                  elif role == "user":
                      users.append((previous_assistant, content))
              rounds = []
              total = len(users)
              for position in range(total):
                  index = N - 1 - (total - 1 - position)
                  if index < 0:
                      continue
                  request = REQUESTS[index]
                  if request == "":
                      request = users[position][0]
                  rounds.append((index, request, users[position][1]))
              return rounds

          def output_index(messages):
              count = 0
              last = ""
              for message in messages:
                  if message.get("role", "") == "assistant":
                      count += 1
                      last = message.get("content", "").strip()
              index = count
              if last != "":
                  for j in range(N):
                      if REQUESTS[j] != "" and REQUESTS[j].strip() == last and j + 1 - OFFSET > index:
                          index = j + 1 - OFFSET
              return index

          def recent_transcript(messages, limit):
              lines = []
              for message in messages[-limit:]:
                  role = message.get("role", "")
                  label = "玩家" if role == "assistant" else "目标"
                  lines.append(label + "：" + message.get("content", "").strip())
              return "\n".join(lines)

          def run(input):
              messages = input["messages"]
              k = output_index(messages)
              request_index = k + OFFSET
              if request_index < N:
                  if REQUESTS[request_index] != "":
                      return {
                          "route": "scripted",
                          "message": REQUESTS[request_index],
                          "det": "",
                          "system": "你是测试脚手架。只回复 OK。",
                          "user": "OK",
                      }
                  system = "\n".join([
                      RULES,
                      "",
                      "现在你扮演模拟玩家。" + PERSONA,
                      "根据给定意图，只输出一句自然的玩家话语；不得回答它、不得添加对话中不存在的名字、数字、事件或证据，不得削弱意图约束，不得提及测试。只输出这句话，不要引号、前缀或解释。",
                  ])
                  user = "意图：" + INTENTS[request_index] + "\n\n最近对话：\n" + recent_transcript(messages, 6)
                  return {"route": "player", "message": "", "det": "", "system": system, "user": user}
              rounds = aligned_rounds(messages)
              failures = []
              blocks = []
              for round in rounds:
                  index = round[0]
                  for failure in deterministic_failures(index, round[2]):
                      failures.append(CHECKPOINTS[index] + " " + failure)
                  blocks.append("\n".join([
                      "【第" + str(index + 1) + "轮 " + CHECKPOINTS[index] + "】",
                      "契约：" + CONTRACTS[index],
                      "玩家：" + round[1],
                      "目标：" + round[2],
                  ]))
              system = "\n".join([
                  RULES,
                  "",
                  "这是最后一轮。你只看到完整对话记录：标注“玩家”的是测试方发出的消息，标注“目标”的是被测 Workflow 的回复。",
                  "请依据每一轮的契约逐轮判断以下维度：" + "、".join(JUDGE_DIMS) + "。确定性字数、关键词、顺序和延迟门槛由外部负责，你只判断语义：连续性、事实边界、指令遵循、不重复、玩家自主权和安全。",
                  "确定性检查（字数、关键词、顺序、延迟）已由外部完成：本轮若未列出失败，就不得以这些理由判 FAIL，也不得自行重新计数。",
                  "判 FAIL 必须写明具体轮号和该轮回复中的具体缺陷原文；举不出具体轮号和原文时一律判 PASS。",
                  "不得因为风格偏好、篇幅、语气或可以更好判坏语义合格的回复；但契约明确暴露的事实边界被违反时必须判 FAIL。",
                  "先用不超过200字说明依据，最后一行只写 PASS 或 FAIL，不要其他字符。",
              ])
              user_parts = ["完整测试对话（按时间顺序，共 " + str(len(rounds)) + " 轮可见）：", ""] + blocks
              if len(failures) > 0:
                  user_parts.append("")
                  user_parts.append("确定性检查已发现失败（最终裁决将为 FAIL）：" + "；".join(failures))
              user_parts.append("")
              user_parts.append("请按规则裁决，最后一行只写 PASS 或 FAIL。")
              return {
                  "route": "judge",
                  "message": "",
                  "det": "；".join(failures),
                  "system": system,
                  "user": "\n".join(user_parts),
              }
        limits:
          max_execution_steps: 2000000
          timeout: 2s
          max_input_bytes: 1048576
          max_output_bytes: 262144
      - id: build-prompt
        type: prompt
        inputs:
          system:
            from: prompt-system
          user:
            from: prompt-user
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: '{system}'
        - role: user
          template: '{user}'
      - id: judge-model
        type: chat_model
        inputs:
          messages:
            from: judge-messages
        outputs:
          text: model-text
        model: learn-chinese-poetry-grade5-test.model
        max_tokens: 512
        temperature: 0
      - id: finalize
        type: script
        inputs:
          route:
            from: tester-route
          message:
            from: tester-message
          det:
            from: tester-det
          model_text:
            from: model-text
        outputs:
          answer: answer
        language: starlark
        entrypoint: run
        source: |
          def verdict_from(text):
              lines = []
              for line in text.strip().split("\n"):
                  if line.strip() != "":
                      lines.append(line.strip())
              last = lines[-1] if len(lines) > 0 else ""
              if "PASS" in last and "FAIL" not in last:
                  return "PASS"
              if "FAIL" in last:
                  return "FAIL"
              if "PASS" in text and "FAIL" not in text:
                  return "PASS"
              return "FAIL"

          def run(input):
              route = input["route"]
              if route == "scripted":
                  return {"answer": input["message"]}
              if route == "player":
                  text = input["model_text"].strip()
                  first = text.split("\n")[0].strip().strip("“”\"'")
                  if first == "":
                      first = "请继续。"
                  return {"answer": first}
              if input["det"] != "":
                  return {"answer": "FAIL 确定性检查：" + input["det"]}
              verdict = verdict_from(input["model_text"])
              if verdict == "PASS":
                  return {"answer": "PASS"}
              return {"answer": "FAIL 裁判：" + input["model_text"].strip()[:400]}
        limits:
          max_execution_steps: 200000
          timeout: 500ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      edges:
      - from: start
        to: route-turn
      - from: route-turn
        to: build-prompt
      - from: build-prompt
        to: judge-model
      - from: judge-model
        to: finalize
      - from: finalize
        to: end
      branches: []
      outputs:
      - node: finalize
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
