          input: WORKSPACE_INPUT_MODE_REALTIME
- id: eino_memory_recall_create_realtime
  client: eino_memory_recall
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_memory_recall_realtime_workspace}"
      collection: story-teller
      workflow_name: journey-eino-memory-recall
      parameters:
