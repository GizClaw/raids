finally:
- id: stop_narrator_run
  client: narrator
  rpc:
    method: server.run.stop
    request: {}
- id: delete_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.delete
    request:
      name: "${narrator_workspace}"
- id: delete_narrator_peer
  client: narrator
  rpc:
    method: server.peer.delete
    request: {}
- id: stop_axel_run
  client: axel
  rpc:
    method: server.run.stop
    request: {}
- id: delete_axel_workspace
  client: axel
  rpc:
    method: server.workspace.delete
    request:
      name: "${axel_workspace}"
- id: delete_axel_peer
  client: axel
  rpc:
    method: server.peer.delete
    request: {}
- id: stop_lidenbrock_run
  client: lidenbrock
  rpc:
    method: server.run.stop
    request: {}
- id: delete_lidenbrock_workspace
  client: lidenbrock
  rpc:
    method: server.workspace.delete
    request:
      name: "${lidenbrock_workspace}"
- id: delete_lidenbrock_peer
  client: lidenbrock
  rpc:
    method: server.peer.delete
    request: {}
- id: stop_hans_run
  client: hans
  rpc:
    method: server.run.stop
    request: {}
- id: delete_hans_workspace
  client: hans
