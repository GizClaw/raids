    request:
      voice_name: giztest-input.ko
      text: 성공을 진심으로 축하드립니다.
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case2_audio_9
- id: ast_case2_turn_9_congratulations
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case2_audio_9}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 恭喜
      - 祝贺
      - 庆祝
      pattern: "\\p{Han}"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case2_synthesize_10_good-night
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ko
      text: 오늘 밤 푹 쉬고 좋은 꿈 꾸세요.
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case2_audio_10
- id: ast_case2_turn_10_good-night
  client: ast
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case2_audio_10}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 晚安
      - 好梦
      - 休息
      pattern: "\\p{Han}"
      max_length: 200
    "/audio_bytes":
      minimum: 1
finally:
- id: stop_ast
  client: ast
  rpc:
    method: server.run.stop
    request: {}
- id: ast_case2_delete_workspace
  client: ast
  rpc:
    method: server.workspace.delete
    request:
      name: "${ast_case2_workspace_name}"
- id: delete_ast
  client: ast
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
