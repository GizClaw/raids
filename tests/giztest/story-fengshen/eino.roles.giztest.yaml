# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for eino-story-fengshen,
# So that every reachable role path produces text and non-empty synthesized audio.
---
version: gizclaw.test/v1alpha1
name: story-fengshen.eino.roles
clients:
  narrator:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  nezha:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  jiang-ziya:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  yang-jian:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  lei-zhenzi:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  narrator_workspace:
    direction: input
    type: string
    generate: token
  nezha_workspace:
    direction: input
    type: string
    generate: token
  jiang_ziya_workspace:
    direction: input
    type: string
    generate: token
  yang_jian_workspace:
    direction: input
    type: string
    generate: token
  lei_zhenzi_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 50m
steps:
- id: register_narrator
  client: narrator
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: "${narrator_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-fengshen
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${narrator_workspace}"
- id: warmup_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: narrator_chapter_setup_1
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: 请从第一章开始《封神榜》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains: 第 1 章：法宝择主
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让旁白亲自回应，只说这个角色知道的事。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_narrator_first_response
  client: narrator
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让旁白亲自回应，只说这个角色知道的事。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: register_nezha
  client: nezha
  rpc:
    method: server.register
