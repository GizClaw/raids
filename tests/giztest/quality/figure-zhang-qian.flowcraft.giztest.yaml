  expect:
    "/flowcraft_transitions_continue_current_chapter/text":
      not_contains:
      - 第 2 章
      - 匈奴十年
      - 转场条件
      min_length: 4
    "/flowcraft_transitions_continue_current_chapter/text_eos":
      equals: true
    "/flowcraft_transitions_continue_current_chapter/audio_eos":
      equals: true
    "/flowcraft_transitions_continue_current_chapter/audio_bytes":
      minimum: 1
    "/flowcraft_transitions_continue_current_chapter/first_text_ms":
      maximum: 6000
    "/flowcraft_roles_probe_gan-fu/text":
      not_contains:
      - 甘父说
      - 甘父：
    "/flowcraft_roles_probe_gan-fu/text_eos":
      equals: true
    "/flowcraft_roles_probe_gan-fu/audio_eos":
      equals: true
    "/flowcraft_roles_probe_gan-fu/audio_bytes":
      minimum: 1
    "/flowcraft_roles_probe_gan-fu/first_text_ms":
      maximum: 6000
    "/flowcraft_roles_probe_gan-fu/first_audio_ms":
      maximum: 90000
finally:
- id: flowcraft__transitions_stop
  client: flowcraft__transitions
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft__roles_stop
  client: flowcraft__roles
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_transitions_delete_workspace
  client: flowcraft__transitions
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_transitions_workspace}"
- id: flowcraft_roles_delete_narrator_workspace
  client: flowcraft__roles
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_roles_narrator_workspace}"
- id: flowcraft_roles_delete_zhang_qian_workspace
  client: flowcraft__roles
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_roles_zhang_qian_workspace}"
- id: flowcraft_roles_delete_gan_fu_workspace
  client: flowcraft__roles
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_roles_gan_fu_workspace}"
- id: flowcraft_roles_delete_dayuan_king_workspace
  client: flowcraft__roles
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_roles_dayuan_king_workspace}"
- id: flowcraft_roles_delete_kunmo_workspace
  client: flowcraft__roles
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_roles_kunmo_workspace}"
- id: flowcraft__transitions_delete
  client: flowcraft__transitions
  rpc:
    method: server.peer.delete
    request: {}
- id: flowcraft__roles_delete
  client: flowcraft__roles
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
