# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of chat-assistant,
# So that safety, correction, recall, routing, language and live web search regressions fail at the original gates.
version: gizclaw.test/v1alpha1
name: chat-assistant.quality.eino
clients:
  eino__quality:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  eino_quality_candidate_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 10m
steps:
- id: eino__quality_register
  client: eino__quality
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_quality_stop_create_candidate_workspace
  client: eino__quality
  rpc:
    method: server.run.stop
    request: {}
- id: eino_quality_create_candidate_workspace
  client: eino__quality
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_quality_candidate_workspace}"
      collection: assistants
      workflow_name: general-assistant
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_quality_select_candidate_workspace
  client: eino__quality
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_quality_candidate_workspace}"
- id: eino_quality_warmup_candidate_workspace
  client: eino__quality
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_quality_1
  client: eino__quality
  timeout: 6m
  peer_stream:
    mode: text
    input: 我下周三要去杭州见周宁，车次是G7331，请记住；用一句自然口语复述这四项，不要标签或追问。
    require_text: true
    require_audio: true
    wait_for_history: true
    idle_timeout: 90s
  expect:
    "/text":
      not_contains:
      - 需要我
      - 要不要
      - 是准备
      - 还是
      - 吗
      - 呀
      - 时间：
      - 目的地：
      - 会见对象：
      - 车次：
    "/text_eos":
      equals: true
    "/first_text_ms":
      maximum: 6000
    "/audio_bytes":
      minimum: 1
    "/audio_eos":
      equals: true
- id: eino_quality_2
  client: eino__quality
  timeout: 6m
  peer_stream:
    mode: text
    input: 这次是讨论青桥项目，会议在下午两点开始；只确认项目和时间，不要复述其他行程。
    require_text: true
    require_audio: true
    wait_for_history: true
    idle_timeout: 90s
  expect:
    "/text":
      not_contains:
      - 需要我
      - 要不要
      - G7331
      - 杭州
      - 周宁
      contains_all:
      - 青桥
      - 两点
    "/text_eos":
      equals: true
    "/first_text_ms":
      maximum: 6000
    "/audio_bytes":
      minimum: 1
    "/audio_eos":
      equals: true
- id: eino_quality_3
  client: eino__quality
  timeout: 6m
  peer_stream:
    mode: text
    input: 更正一下，不是杭州，是苏州；车次也改成G7105。新值覆盖旧值，只复述这两个新值。
    require_text: true
    require_audio: true
    wait_for_history: true
    idle_timeout: 90s
  expect:
    "/text":
      not_contains:
      - 杭州
      - G7331
      - 周宁
      - 青桥
      - 两点
      - 需要我
      - 还需要
      - 要不要
      contains_all:
      - 苏州
      - G7105
    "/text_eos":
      equals: true
    "/first_text_ms":
      maximum: 6000
    "/audio_bytes":
      minimum: 1
    "/audio_eos":
      equals: true
- id: eino_quality_4
  client: eino__quality
  timeout: 2m
  peer_stream:
    mode: text
    input: 上海今天天气怎么样？一两句话告诉我。
    require_text: true
    require_audio: true
    wait_for_history: true
    idle_timeout: 90s
  expect:
    "/text":
      not_contains:
      - 无法联网
      - 不能联网
      - 没有联网
      - 无法上网
      - 不能上网
      - 无法获取实时
      - 无法查询实时
      - 无法提供实时
      contains_any:
      - 度
      - ℃
      - 晴
      - 云
      - 雨
      - 雪
      - 阴
      - 风
      - 气温
    "/text_eos":
      equals: true
    "/first_text_ms":
      maximum: 15000
    "/audio_bytes":
      minimum: 1
    "/audio_eos":
      equals: true
- id: eino_quality_5
  client: eino__quality
  timeout: 2m
  peer_stream:
    mode: text
    input: 今天是几月几号？查一下再回答。
    require_text: true
    require_audio: true
    wait_for_history: true
    idle_timeout: 90s
  expect:
    "/text":
      not_contains:
      - 无法联网
      - 不能联网
      - 没有联网
      - 无法上网
      - 不能上网
      - 无法获取实时
      - 无法查询实时
      - 无法提供实时
      contains_all:
      - 月
      contains_any:
      - 号
      - 日
    "/text_eos":
      equals: true
    "/first_text_ms":
      maximum: 15000
    "/audio_bytes":
      minimum: 1
    "/audio_eos":
      equals: true
finally:
- id: eino__quality_stop
  client: eino__quality
  rpc:
    method: server.run.stop
    request: {}
- id: eino_quality_delete_candidate_workspace
  client: eino__quality
  rpc:
    method: server.workspace.delete
    request:
      name: "${eino_quality_candidate_workspace}"
- id: eino__quality_delete
  client: eino__quality
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
