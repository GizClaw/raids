            角色动机与说话方式：想守住护送承诺；沉稳简短，第2章查看百姓撤离路线，第3章提出守信底线，第4章安排护送；只知亲历或已公开信息。
            本轮只能由关羽说话，直接以第一人称角色口吻说台词，不得添加“关羽说”“关羽：”等说话人标签；不替旁白或另一角色发言。
            本轮不得输出章节标题。承接玩家当前选择，推进一个直接后果或线索，最多一个问题。
            输出2至4个完整中文句子、30至220个Unicode字符，不输出Markdown、列表、emoji、舞台说明或系统字段。
          track_steps: true
      - id: speak-zhang-fei
        type: llm
        publish: true
        config:
          model: flowcraft-story-three-kingdoms.model
          max_tokens: 1024
          output_key: answer
          system_prompt: |-
            ${board.story_bible}
            当前权威状态：${board.story_state_text}
            角色动机与说话方式：想尽快保护同伴；直率憨厚，第2章提议守住路口而非盲目追击，第3章询问联盟能否互助，第4章帮助搬运粮食；只知亲历或已公开信息。
            本轮只能由张飞说话，直接以第一人称角色口吻说台词，不得添加“张飞说”“张飞：”等说话人标签；不替旁白或另一角色发言。
            本轮不得输出章节标题。承接玩家当前选择，推进一个直接后果或线索，最多一个问题。
            输出2至4个完整中文句子、30至220个Unicode字符，不输出Markdown、列表、emoji、舞台说明或系统字段。
          track_steps: true
      - id: persist-story
        type: script
        config:
          source: |
            const state = board.getVar("story_state") || {};
            if (board.getVar("count_progress_response") === true) {
              const beats = Array.isArray(state.chapter_progress_beats) ? state.chapter_progress_beats.slice() : [];
              const addBeat = (beat) => { if (!beats.includes(beat)) beats.push(beat); };
              if (String(board.getVar("selected_speaker") || "narrator") === "narrator" || board.getVar("response_requests_outcome") === true) addBeat("consequence");
              if (String(board.getVar("selected_speaker") || "narrator") !== "narrator" || board.getVar("response_requests_perspective") === true) addBeat("perspective");
              state.chapter_progress_beats = beats;
            }
            state.last_answer = String(board.getVar("answer") || "").slice(0, 320);
            board.setVar("story_state_fact", JSON.stringify(state));
      - id: observe-story
        type: memory_observe
        config:
          observations:
          - facts:
            - text_from: story_state_fact
              attributes:
                lane: story_progress
                kind: state
          wait_for_completion: true
    max_iterations: 10
    conversation:
      starts: agent
    voice_adapter:
      asr_model: asr
      default_voice: flowcraft-story-three-kingdoms.storyteller
      node_voices:
        speak-narrator: flowcraft-story-three-kingdoms.storyteller
        speak-liu-bei: flowcraft-story-three-kingdoms.liu-bei
        speak-zhuge-liang: flowcraft-story-three-kingdoms.zhuge-liang
        speak-guan-yu: flowcraft-story-three-kingdoms.guan-yu
        speak-zhang-fei: flowcraft-story-three-kingdoms.zhang-fei
  memory: story-teller
