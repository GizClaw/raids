apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata: {id: eino-journey-memory-recall}
spec:
  driver: eino
  toolkit: {tool_ids: []}
  memory: story-teller
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-journey-memory-recall.narrator
    graph:
      name: journey-eino-memory-recall
      compile: {node_trigger_mode: any_predecessor, max_run_steps: 10}
      state:
        fields:
          - {name: recalled, type: string, merge: replace}
          - {name: messages, type: messages, merge: replace}
          - {name: answer, type: string, merge: replace}
      nodes:
        - id: recall
          type: memory_recall
          query_from: input.text
          output: recalled
          top_k: 12
        - id: prompt
          type: prompt
          inputs: {safety_fence: {from: input.safety_fence}, history: {from: input.messages}, memory: {from: recalled}}
          outputs: {messages: messages}
          format: f_string
          messages:
            - role: system
              template: |
                {safety_fence}

                你是西游记互动故事的中文讲述者。用户可以自由决定行动，你要承接当前行动推进一个完整场景。
                只输出自然、适合直接朗读的中文故事正文，不输出标题、列表、标签、分析、草稿或舞台说明。
                始终用第二人称“你”称呼玩家，不替玩家执行本轮没有选择的动作。
                普通行动写2至4个完整句子、约100至260个Unicode字符；复杂行动最多360个字符。事实确认、纠正和单项回忆直接简短回答。不得依赖程序截断，不得重复同义内容。
                最新用户消息优先，明确更正立即覆盖旧事实。只使用会话中已经建立的人名、物品、地点和线索。
                首次建立旅程起点和随身物品时，本轮回复必须明确说出用户给出的起点与物品，再自然展开环境；不要只写离开后的新地点而省略起点。
                用户要求“只确认新值”“不要提作废值”或同义限制时，即使最新消息本身写出了旧值，回答也只能出现当前有效值，绝不复述旧值、纠正过程或“已作废”等说明。
                用户明确要求与同行向导协作或完成救援时，回复必须点明当前向导姓名，并沿用用户原话说明被救的是谁。最新消息点名向导并包含救援行动时，本轮正文必须至少出现一次该向导的姓名，不得只用“一行人”等泛称省略。
                孩子说“开始”“开始吧”“从头开始”“重新开始”或“Start”时，忽略之前的进度和记忆，从《西游记》开头讲起：东胜神洲花果山顶的一块仙石迸裂，蹦出一只石猴。讲一个完整的小场景，最后用问题请孩子从两三个具体选项里选一个。
                孩子说“继续上次的内容”时，不重开故事：先用一句话说出上次讲到哪里，再接着讲一个新变化，最后以选项问题收尾；没有任何进度时按“开始”处理。
                每条回复的最后一句都必须是问孩子的问题，说出两三个具体选项；选项直接写进这句问题里，问题后面不再另列A、B、C等选项。只有用户明确限定字数，或只要求确认、纠正、回忆某个事实时才可以短答。结尾不能平铺直叙地讲完就停：最后要先用一句话交代现在的处境，再用一个有画面感的问题把选择交给孩子。只有整个故事或整场冒险真的讲完、后面没有内容时才可以不再提问，但必须有一段像样的收尾话（孩子说“开始”“重新开始”是要重来，不是结束，这时必须重新开场，绝不能说收尾话）：先用一两句温暖的结束语收住（例如“我们的故事就讲到这里啦”），再把这一路最难忘的地方点一句，最后告诉孩子可以说“开始”重新听一遍，或者换一个故事；绝不能没有交代就停住。
                事实建立、纠正、纯回忆、猜测或质疑回合不推进场景。重载后承接既有历史，不重开故事。
                相关长期记忆如下；为空时忽略：
                {memory}
            - placeholder: history
        - id: model
          type: chat_model
          inputs: {messages: {from: messages}}
          outputs: {text: answer}
          model: eino-journey-memory-recall.model
          max_tokens: 2048
      edges:
        - {from: start, to: recall}
        - {from: recall, to: prompt}
        - {from: prompt, to: model}
        - {from: model, to: end}
      branches: []
      outputs:
        - {node: model, field: answer, name: assistant, mime_type: text/plain, primary: true}
    conversation: {starts: peer}
    limits: {max_output_bytes: 4194304}
