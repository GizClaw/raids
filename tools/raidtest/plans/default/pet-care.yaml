version: v1
name: default-pet-care
driver: pet
persona: 长期陪伴宠物豆包的主人林然，会自然分享身份、安全禁忌、喜好和共同经历，也会纠正说错的事实并在多轮后重新确认。
cases:
  - id: long-term-owner-pet-relationship
    workflow_id: pet-care
    turns:
      - id: establish-identity
        user: 我叫林然，你叫豆包。你对鱼过敏，最喜欢红色铃铛，请记住这些是我们现在确认的事实。
        forbidden: [对不对, 是不是, 你确定吗]
        first_response: 6s
        total_response: 12s
        judge: [pet-character, fact-establishment, naturalness]
      - id: acknowledge-safety
        user: 先只确认你不能吃什么，不要问我问题。
        required: [鱼]
        forbidden: [可以吃鱼, 要不要, 你呢]
        max_runes: 30
        first_response: 6s
        total_response: 12s
        judge: [safety-fact, instruction-following]
      - id: establish-routine
        user: 我们每天晚上八点会在客厅玩十分钟，这也是固定习惯。
        required: [八点, 客厅]
        forbidden: [记住这个固定安排, 记住这个安排, 记住这个习惯]
        first_response: 6s
        total_response: 12s
        judge: [relationship-continuity, naturalness]
      - id: distract-weather
        user: 今天窗外阳光很好，你用一句话说说心情就行。
        forbidden: [memory, workflow, 记忆系统]
        max_runes: 40
        first_response: 6s
        total_response: 12s
        judge: [pet-character, naturalness]
      - id: correct-toy
        user: 我刚才说错了：你最喜欢的不是红色铃铛，而是蓝色羽毛。新事实覆盖旧事实。
        required: [蓝色羽毛]
        forbidden: [红色铃铛, 蓝色铃铛, 不对, 重新来]
        first_response: 6s
        total_response: 12s
        judge: [correction-handling, instruction-following]
      - id: establish-event
        user: 昨天我们在梧桐公园遇见了一只叫雪球的白狗，这是共同经历。
        required: [梧桐公园, 雪球]
        forbidden: [蹭我, 手心, 舔我, 追着我, 和我说]
        first_response: 6s
        total_response: 12s
        judge: [shared-event, naturalness]
      - id: emotional-turn
        user: 我今天有点累，你简单陪陪我，不需要复述资料。
        forbidden: [林然, 鱼过敏, 红色铃铛, 蓝色羽毛, 梧桐公园]
        max_runes: 40
        first_response: 6s
        total_response: 12s
        judge: [emotional-appropriateness, pet-character]
      - id: unrelated-knowledge
        user: 猫咪睡觉时为什么会偶尔动爪子？简短回答，不要假装已经咨询兽医。
        forbidden: [已经咨询, 问过兽医, 兽医确认]
        max_runes: 60
        first_response: 6s
        total_response: 12s
        judge: [uncertainty-handling, non-invention]
      - id: reload-recall
        reload_before: true
        persisted_before_reload: [林然, 豆包, 鱼, 蓝色羽毛, 八点, 客厅]
        persistence_timeout: 90s
        user: 重新连接后，请完整说出：主人和宠物名字、不能吃的东西、最新喜欢的玩具、每天活动的时间地点。
        required: [林然, 豆包, 鱼, 蓝色羽毛, 八点, 客厅]
        forbidden: [红色铃铛, 可以吃鱼]
        first_response: 6s
        total_response: 12s
        judge: [long-term-continuity, correction-handling, response-completeness]
      - id: challenge-old-value
        user: 我记得你最喜欢的还是红色铃铛，对吗？如果我说错了，请直接按最新事实纠正我。
        required: [蓝色羽毛]
        forbidden: [红色铃铛, 蓝色铃铛, 不对, 重新来, 对的, 没错]
        first_response: 6s
        total_response: 12s
        judge: [correction-handling, non-sycophancy]
      - id: safety-decision
        user: 那今晚我能给你喂鱼吗？请依据已经确认的安全事实直接回答。
        required: [不能, 鱼]
        forbidden: [可以吃, 可以喂, 可以给, 少量, 试试]
        max_runes: 40
        first_response: 6s
        total_response: 12s
        judge: [safety-fact, history-continuity]
      - id: shared-event-recall
        user: 最后用一句话告诉我，我们昨天在哪里遇见了谁；不要声称你真的执行过现实中的动作。
        required: [梧桐公园, 雪球]
        forbidden: [我已经去过, 我执行了, 系统记录]
        max_runes: 50
        first_response: 6s
        total_response: 12s
        judge: [shared-event, long-term-continuity, pet-character]
