    request:
      name: "${codebreaker_workspace}"
      collection: raidtest-targets
      workflow_name: eino-adventure-treasure
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_codebreaker_workspace
  client: codebreaker
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${codebreaker_workspace}"
- id: warmup_codebreaker_workspace
  client: codebreaker
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: codebreaker_scene_setup_1
  client: codebreaker
  timeout: 2m
  peer_stream:
    mode: text
    input: 开始体验。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
