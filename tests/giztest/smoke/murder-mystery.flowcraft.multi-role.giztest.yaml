- id: flowcraft_multi_role_probe_lawyer_resume_workspace
  client: flowcraft_multi_role
  timeout: 2m
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_multi_role_select_realtime
  client: flowcraft_multi_role
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_multi_role_realtime_workspace}"
- id: flowcraft_multi_role_warmup_realtime
  client: flowcraft_multi_role
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_multi_role_realtime_roundtrip
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${input_audio}"
    pacing: 20ms
    require_audio: true
    require_text: true
    idle_timeout: 90s
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/text":
      non_empty: true
      not_contains:
      - "【"
      - "】"
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
  client: flowcraft_multi_role
finally:
- id: flowcraft_multi_role_stop_run
  client: flowcraft_multi_role
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_multi_role_delete_text
  client: flowcraft_multi_role
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_multi_role_text_workspace}"
- id: flowcraft_multi_role_delete_realtime
  client: flowcraft_multi_role
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_multi_role_realtime_workspace}"
- id: flowcraft_multi_role_delete_peer
  client: flowcraft_multi_role
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
