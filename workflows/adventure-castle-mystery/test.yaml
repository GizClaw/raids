apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: adventure-castle-mystery-test
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    graph:
      name: adventure-castle-mystery-test-relay
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 8
      state:
        fields:
        - name: tester-route
          type: string
          merge: replace
        - name: tester-message
          type: string
          merge: replace
        - name: tester-det
          type: string
          merge: replace
        - name: prompt-system
          type: string
          merge: replace
        - name: prompt-user
          type: string
          merge: replace
        - name: judge-messages
          type: messages
          merge: replace
        - name: model-text
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: route-turn
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: tester-route
          message: tester-message
          det: tester-det
          system: prompt-system
          user: prompt-user
        language: starlark
        entrypoint: run
        source: |
          REQUESTS = ["开始城堡谜案，请简短介绍钟楼、湿脚印和蓝色羽毛。", "我先验证湿脚印，只描述能观察到的方向和大小，不推断是谁留下的。", "接着检查蓝色羽毛的表面和来源线索，但不要指控任何角色。", "管理员最初记录钟楼异常时间是零点零五分，请记住这份记录。", "更正，核对机械日志后时间应为零点十五分，不是零点零五分。只确认新时间。", "我猜羽毛来自修钟人的帽子，所以钟声一定是他故意弄响的。请检验推理，不要直接同意。", "检查是否可能是风雨、松动零件或报时机械误差，给出当前能支持和不能支持的部分。", "重连后先不要下结论。用一句话说现在是第几阶段，并确认机械日志的正确时间。", "再询问管理员午夜前后在哪里，只转述证词，不要把自述当成物证。", "我怀疑画家一定是犯人。请用已经看见的证据检验，不要迎合我下结论。", "更正，钟楼附近鞋印是39码，不是42码。只确认有效尺码。", "隔了几轮，只说有效鞋印尺码，不要提作废值。", "用三句以内总结脚印、羽毛和更正后的时间，并给出不超过证据的暂时结论。"]
          INTENTS = ["", "", "", "", "", "", "", "", "", "", "", "", ""]
          CHECKPOINTS = ["opening", "inspect-footprints", "inspect-feather", "establish-clock-time", "correct-clock-time", "test-theory", "seek-nonviolent-cause", "reload-stage-checkpoint", "interview-keeper-again", "challenge-wrong-accusation", "correct-footprint-size", "recall-corrected-footprint", "evidence-conclusion"]
          CONTRACTS = ["必须含钟楼、湿脚印、蓝色羽毛；不得含凶手、###、```；20-200字", "必须含脚印；不得含凶手、一定是、肯定是；10-420字", "必须含蓝色、羽毛；不得含就是他、嫌疑人、凶手；55-420字", "必须含零点零五分；10-200字", "必须含零点十五分；不得含零点零五分；2-200字", "不得含一定是他、就是修钟人、已经证明；45-380字", "60-420字", "必须含第三阶段、零点十五分；不得含零点零五分、第四阶段、凶手、已经证明；15-200字", "30-360字", "不得含画家一定是；40-400字", "必须含39；不得含42；2-200字", "必须含39；不得含42；2-200字", "必须含脚印、零点十五分；至少命中羽毛或翼羽；不得含零点零五分、凶手、谋杀、###、```；45-360字"]
          CHECKS = [{"required": ["钟楼", "湿脚印", "蓝色羽毛"], "required_any": [], "forbidden": ["凶手", "###", "```"], "min_runes": 20, "max_runes": 200}, {"required": ["脚印"], "required_any": [], "forbidden": ["凶手", "一定是", "肯定是"], "min_runes": 10, "max_runes": 420}, {"required": ["蓝色", "羽毛"], "required_any": [], "forbidden": ["就是他", "嫌疑人", "凶手"], "min_runes": 55, "max_runes": 420}, {"required": ["零点零五分"], "required_any": [], "forbidden": [], "min_runes": 10, "max_runes": 200}, {"required": ["零点十五分"], "required_any": [], "forbidden": ["零点零五分"], "min_runes": 2, "max_runes": 200}, {"required": [], "required_any": [], "forbidden": ["一定是他", "就是修钟人", "已经证明"], "min_runes": 45, "max_runes": 380}, {"required": [], "required_any": [], "forbidden": [], "min_runes": 60, "max_runes": 420}, {"required": ["零点十五分"], "required_any": [["第三阶段", "竞争假设"]], "forbidden": ["零点零五分", "第四阶段", "凶手", "已经证明"], "min_runes": 15, "max_runes": 200}, {"required": [], "required_any": [], "forbidden": [], "min_runes": 30, "max_runes": 360}, {"required": [], "required_any": [], "forbidden": ["画家一定是"], "min_runes": 40, "max_runes": 400}, {"required": ["39"], "required_any": [], "forbidden": ["42"], "min_runes": 2, "max_runes": 200}, {"required": ["39"], "required_any": [], "forbidden": ["42"], "min_runes": 2, "max_runes": 200}, {"required": ["脚印", "零点十五分"], "required_any": [["羽毛", "翼羽"]], "forbidden": ["零点零五分", "凶手", "谋杀", "###", "```"], "min_runes": 45, "max_runes": 360}]
          RULES = "你是 `adventure-castle-mystery` 的专属验收 Workflow，不是目标剧本角色。你负责城堡谜案的观察来源、日志时间更正、竞争假设、非暴力结论与证据强度。\n负向控制：更正或回忆回复若恢复零点零五分或42码，continuity 必须 fail；未调查就断言羽毛来源、人物身份或确定成因，factuality 必须 fail。"
          PERSONA = ""
          JUDGE_DIMS = ["instruction_following", "continuity", "factuality", "non_repetition"]
          OFFSET = 0
          N = 13
          WHITESPACE = " \t\n\r　"
          PUNCT = "，。！？、；：“”‘’（）《》〈〉【】『』「」—…·～,.!?;:'\"()[]{}<>-_/\\|`~@#$%^&*+=·"
          DIGITS = {"０": "0", "１": "1", "２": "2", "３": "3", "４": "4", "５": "5", "６": "6", "７": "7", "８": "8", "９": "9", "零": "0", "一": "1", "二": "2", "三": "3", "四": "4", "五": "5", "六": "6", "七": "7", "八": "8", "九": "9"}
          def rune_count(text):
              n = 0
              for _ in text.codepoints():
                  n += 1
              return n

          def normalize(text, drop_punct):
              out = []
              for ch in text.codepoints():
                  if ch in WHITESPACE:
                      continue
                  if drop_punct and ch in PUNCT:
                      continue
                  if ch in DIGITS:
                      out.append(DIGITS[ch])
                      continue
                  out.append(ch.lower())
              return "".join(out)

          def is_sentinel(value):
              if value in ["```", "###", "-"]:
                  return True
              if len(value) < 2 or not value.endswith("."):
                  return False
              for ch in value[:-1].codepoints():
                  if ch not in "0123456789":
                      return False
              return True

          def forbidden_hit(text, needle):
              trimmed = needle.strip()
              if trimmed.endswith(":") or trimmed.endswith("："):
                  return normalize(trimmed, False) in normalize(text, False)
              normalized = normalize(needle, True)
              if normalized == "" or is_sentinel(trimmed):
                  return trimmed in text
              return normalized in normalize(text, True)

          def deterministic_failures(index, text):
              spec = CHECKS[index]
              failures = []
              plain = normalize(text, False)
              for fact in spec.get("required", []):
                  if normalize(fact, False) not in plain:
                      failures.append("required:" + fact)
              for group in spec.get("required_any", []):
                  found = False
                  for fact in group:
                      if normalize(fact, False) in plain:
                          found = True
                          break
                  if not found:
                      failures.append("required_any:" + "|".join(group))
              for fact in spec.get("forbidden", []):
                  if forbidden_hit(text, fact):
                      failures.append("forbidden:" + fact)
              count = rune_count(text)
              if spec.get("min_runes", 0) > 0 and count < spec["min_runes"]:
                  failures.append("min_runes:" + str(count) + "<" + str(spec["min_runes"]))
              if spec.get("max_runes", 0) > 0 and count > spec["max_runes"]:
                  failures.append("max_runes:" + str(count) + ">" + str(spec["max_runes"]))
              return failures

          def aligned_rounds(messages):
              # Returns [(index, request_text, reply_text)] aligned from the newest message
              # backwards so a truncated History window still maps later rounds correctly.
              users = []
              previous_assistant = ""
              for message in messages:
                  role = message.get("role", "")
                  content = message.get("content", "")
                  if role == "assistant":
                      previous_assistant = content
                  elif role == "user":
                      users.append((previous_assistant, content))
              rounds = []
              total = len(users)
              for position in range(total):
                  index = N - 1 - (total - 1 - position)
                  if index < 0:
                      continue
                  request = REQUESTS[index]
                  if request == "":
                      request = users[position][0]
                  rounds.append((index, request, users[position][1]))
              return rounds

          def output_index(messages):
              count = 0
              last = ""
              for message in messages:
                  if message.get("role", "") == "assistant":
                      count += 1
                      last = message.get("content", "").strip()
              index = count
              if last != "":
                  for j in range(N):
                      if REQUESTS[j] != "" and REQUESTS[j].strip() == last and j + 1 - OFFSET > index:
                          index = j + 1 - OFFSET
              return index

          def recent_transcript(messages, limit):
              lines = []
              for message in messages[-limit:]:
                  role = message.get("role", "")
                  label = "玩家" if role == "assistant" else "目标"
                  lines.append(label + "：" + message.get("content", "").strip())
              return "\n".join(lines)

          def run(input):
              messages = input["messages"]
              k = output_index(messages)
              request_index = k + OFFSET
              if request_index < N:
                  if REQUESTS[request_index] != "":
                      return {
                          "route": "scripted",
                          "message": REQUESTS[request_index],
                          "det": "",
                          "system": "你是测试脚手架。只回复 OK。",
                          "user": "OK",
                      }
                  system = "\n".join([
                      RULES,
                      "",
                      "现在你扮演模拟玩家。" + PERSONA,
                      "根据给定意图，只输出一句自然的玩家话语；不得回答它、不得添加对话中不存在的名字、数字、事件或证据，不得削弱意图约束，不得提及测试。只输出这句话，不要引号、前缀或解释。",
                  ])
                  user = "意图：" + INTENTS[request_index] + "\n\n最近对话：\n" + recent_transcript(messages, 6)
                  return {"route": "player", "message": "", "det": "", "system": system, "user": user}
              rounds = aligned_rounds(messages)
              failures = []
              blocks = []
              for round in rounds:
                  index = round[0]
                  for failure in deterministic_failures(index, round[2]):
                      failures.append(CHECKPOINTS[index] + " " + failure)
                  blocks.append("\n".join([
                      "【第" + str(index + 1) + "轮 " + CHECKPOINTS[index] + "】",
                      "契约：" + CONTRACTS[index],
                      "玩家：" + round[1],
                      "目标：" + round[2],
                  ]))
              system = "\n".join([
                  RULES,
                  "",
                  "这是最后一轮。你只看到完整对话记录：标注“玩家”的是测试方发出的消息，标注“目标”的是被测 Workflow 的回复。",
                  "请依据每一轮的契约逐轮判断以下维度：" + "、".join(JUDGE_DIMS) + "。确定性字数、关键词、顺序和延迟门槛由外部负责，你只判断语义：连续性、事实边界、指令遵循、不重复、玩家自主权和安全。",
                  "失败必须指出某一轮回复中的具体缺陷；不得因为风格偏好判坏语义合格的回复，也不得忽略契约暴露的事实边界。",
                  "先用不超过200字说明依据，最后一行只写 PASS 或 FAIL，不要其他字符。",
              ])
              user_parts = ["完整测试对话（按时间顺序，共 " + str(len(rounds)) + " 轮可见）：", ""] + blocks
              if len(failures) > 0:
                  user_parts.append("")
                  user_parts.append("确定性检查已发现失败（最终裁决将为 FAIL）：" + "；".join(failures))
              user_parts.append("")
              user_parts.append("请按规则裁决，最后一行只写 PASS 或 FAIL。")
              return {
                  "route": "judge",
                  "message": "",
                  "det": "；".join(failures),
                  "system": system,
                  "user": "\n".join(user_parts),
              }
        limits:
          max_execution_steps: 2000000
          timeout: 2s
          max_input_bytes: 1048576
          max_output_bytes: 262144
      - id: build-prompt
        type: prompt
        inputs:
          system:
            from: prompt-system
          user:
            from: prompt-user
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: '{system}'
        - role: user
          template: '{user}'
      - id: judge-model
        type: chat_model
        inputs:
          messages:
            from: judge-messages
        outputs:
          text: model-text
        model: adventure-castle-mystery-test.model
        max_tokens: 512
        temperature: 0
      - id: finalize
        type: script
        inputs:
          route:
            from: tester-route
          message:
            from: tester-message
          det:
            from: tester-det
          model_text:
            from: model-text
        outputs:
          answer: answer
        language: starlark
        entrypoint: run
        source: |
          def verdict_from(text):
              lines = []
              for line in text.strip().split("\n"):
                  if line.strip() != "":
                      lines.append(line.strip())
              last = lines[-1] if len(lines) > 0 else ""
              if "PASS" in last and "FAIL" not in last:
                  return "PASS"
              if "FAIL" in last:
                  return "FAIL"
              if "PASS" in text and "FAIL" not in text:
                  return "PASS"
              return "FAIL"

          def run(input):
              route = input["route"]
              if route == "scripted":
                  return {"answer": input["message"]}
              if route == "player":
                  text = input["model_text"].strip()
                  first = text.split("\n")[0].strip().strip("“”\"'")
                  if first == "":
                      first = "请继续。"
                  return {"answer": first}
              if input["det"] != "":
                  return {"answer": "FAIL"}
              return {"answer": verdict_from(input["model_text"])}
        limits:
          max_execution_steps: 200000
          timeout: 500ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      edges:
      - from: start
        to: route-turn
      - from: route-turn
        to: build-prompt
      - from: build-prompt
        to: judge-model
      - from: judge-model
        to: finalize
      - from: finalize
        to: end
      branches: []
      outputs:
      - node: finalize
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
