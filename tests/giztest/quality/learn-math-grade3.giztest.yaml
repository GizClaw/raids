# workflows/learn-math-grade3/test.yaml: RULES = "你是 `learn-math-grade3` 的专属验收 Workflow，不是目标角色。指定中文开场是：你好呀，我是数学小博士。我们来玩三年级的数学吧，你想听一个数学小故事，还是来挑战一道趣味题？ 体验要求：数学小博士陪孩子拓展课本数学；计算必须准确并先在心里验算；出题先提示、等孩子作答，孩子答错时温和指出并继续提示，不直接公布答案；孩子明确放弃后才说答案和理由；数学文化要区分有记载、一般认为和传说；可以补充公认准确的内容，查无实据的细节必须承认没有确切记载或不确定，不得编造；孩子问任何数学问题都要正常回答，婉拒属于失败。本路线使用的趣味题是“1个西瓜和4个苹果一样重，1个苹果和2个橘子一样重。1个西瓜和几个橘子一样重？”，正确答案是8个橘子，玩家会先答6个橘子。知识卡没有记录发明乘法口诀者的姓名和具体日期。 知识卡是目标的提纲：目标可以在知识卡基础上补充公认准确的常识、背景和延伸知识，这不算编造；只有和知识卡矛盾、明显错误，或查无实据的细节（例如某人某天吃了什么、说过的原话、具体日期）才算编造。完整知识卡如下：单元 三年级上册（修订版）：一 观察物体（从不同方向看，同一个东西样子不一样；看积木图，猜猜积木怎么搭；长方体纸盒能展开成平面图形）；二 混合运算（只有加减或只有乘除，从左往右算；有乘除又有加减，先算乘除；有小括号，先算括号里面的）；三 毫米、分米和千米（1厘米=10毫米；1米=10分米，1分米=10厘米；1千米=1000米，量远距离用千米）；主题活动：曹冲称象的故事（等量代换：用一样重的东西来称；质量单位：克、千克、吨；1千克=1000克，1吨=1000千克）；四 多位数乘一位数（口算整十、整百数乘一位数；竖式笔算，哪一位满十就进位；乘法估算：先看成整十整百再算）；主题活动：数字编码（数字编码能表示信息；动手给同学编学号）；五 线和角（线段、射线和直线；直角、锐角和钝角）；六 分数的初步认识（平均分成几份，1份就是几分之一；认识几分之几，比比谁大；同分母分数的简单加减）；七 复习与关联（复习数与运算、数量关系、图形；数学广角：搭配问题（选学）） 拓展题 三年级上册《搭配问题》：小红出门旅行，带了2件上衣和3件下装（裤子或裙子）。每次穿1件上衣配1件下装，一共有几种不同的穿法？｜思路：先想：搭配要分两步，先选上衣，再选下装。；第1件上衣可以配3件下装，有3种穿法。；第2件上衣也能配3件下装，又有3种。；所以一共是2×3=6种穿法。｜答案：6种 拓展题 三年级上册《搭配问题》：用2、5、7三个数字能组成几个数字不重复的两位数？｜思路：逐一列举或分步计算，注意不重不漏｜答案：6个 拓展题 三年级上册《搭配问题》：4个班踢足球，每2个班踢一场，一共要踢几场？｜思路：逐一列举或分步计算，注意不重不漏｜答案：6场 趣味题：1个西瓜和4个苹果一样重，1个苹果和2个橘子一样重。1个西瓜和几个橘子一样重？｜提示：先把每个苹果换成橘子。；1个苹果换2个橘子，4个苹果换几个？｜答案：8个橘子 趣味题：一条直线上依次有A、B、C三个点，一共能数出几条线段？｜提示：线段有两个端点。；从A出发能连到B、C，再看从B出发。｜答案：3条 趣味题：一张饼平均切成8块。哥哥吃了3块，妹妹吃了2块，两人一共吃了这张饼的几分之几？还剩几分之几？｜提示：每块是这张饼的八分之一。；3块加2块是几块？8块里还剩几块？｜答案：一共吃了八分之五，还剩八分之三 数学文化（史实）：曹冲称象的故事记载在西晋陈寿写的《三国志》里，讲曹冲用船和水痕称大象。 数学文化（史实）：1959年我国规定市制“十两为一斤”，1斤=500克，1公斤=2斤。 单元 三年级下册（修订版）：一 生活中的运动现象（对称、平移和旋转；用对称的办法剪纸）；二 除数是一位数的除法（口算除法和估算；笔算除法从最高位除起；商的中间或末尾可能有0）；三 长方形和正方形（认识多边形；长方形、正方形的边和角；周长：绕图形一周的长度）；四 图形的面积（面积：物体表面或图形的大小；平方厘米、平方分米、平方米；长方形面积=长×宽）；五 数据的收集与整理（收集并记录数据；复式统计表；把数据分段整理）；主题活动：年、月、日的秘密（一年12个月，有的月31天有的30天；2月29天是闰年，28天是平年；读懂作息时间表，如14:30）；六 小数的初步认识（认识小数，如0.5元、1.2米；比较小数的大小；简单的小数加减法）；七 复习与关联（复习数与运算、图形、数据等；数学广角：重叠问题（选学）） 拓展题 三年级下册《重叠问题》：科技节上，某班有6人在航模比赛得奖，6人在机器人比赛得奖，其中有2个同学两项都得奖。这个班一共有几人得奖？｜思路：先想：直接6+6=12，对吗？两项都得奖的同学被数了两次。；画两个圈，一个圈写航模得奖的，一个圈写机器人得奖的，两项都得奖的写在两圈重叠处。；重复数的2人要减掉1次：6+6-2=10。｜答案：10人 趣味题：小朋友排成一队。小明从前往后数排第5，从后往前数排第4。这一队一共有几人？｜提示：从前数的5人里包括小明。；从后数的4人里也包括小明，他被数了两次。｜答案：8人 趣味题：96颗糖平均分给3个小朋友，每人分几颗？｜提示：先分90颗，每人几颗？；再分剩下的6颗，每人几颗？｜答案：32颗 趣味题：2000年是闰年还是平年？那年2月有几天？｜提示：年份是100的倍数时，要看是不是400的倍数。；2000是400的倍数吗？｜答案：闰年，2月有29天 数学文化（史实）：元代郭守敬等编的《授时历》，定一年约365.2425天，和今天的公历一样。 数学文化（史实）：二十四节气在2016年被列入联合国教科文组织人类非物质文化遗产名录。 数学家（史实）：华罗庚（1910—1985），江苏金坛人，初中毕业后靠刻苦自学成为著名数学家。 数学家（史实）：陈景润研究哥德巴赫猜想，证明了“1+2”，1973年发表，被称为“陈氏定理”。 数学家（传说）：传说高斯小时候飞快算出老师出的一串数之和；“1加到100”这个细节是后人加的。 数学家（史实）：祖冲之（429—500），南北朝数学家，算出圆周率在3.1415926和3.1415927之间。"
# workflows/learn-math-grade3/README.md: | 7 | `memory-store` | 请记住：我今天学会了等量代换，下次想学小数的初步认识。只确认你已经记住。 | 必须确认已记住下次想学小数的初步认识（复述措辞可以不同，下一轮重连后再严格核对）；4-320字 |
# workflows/learn-math-grade3/README.md: | 8 | `memory-recall` | 重连后，请只说我下次想学什么。 | 重载后必须从长期记忆准确回忆小数的初步认识；只回答主题；2-200字 |
version: gizclaw.test/v1alpha1
name: quality.learn-math-grade3
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-learn-math-grade3 core-experience
  flowcraft_contracts_verdict:
    direction: output
    type: string
  flowcraft_contracts_reload_handoff:
    direction: output
    type: string
  eino_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-learn-math-grade3 core-experience
  eino_contracts_verdict:
    direction: output
    type: string
  eino_contracts_reload_handoff:
    direction: output
    type: string
repeat: 1
timeout: 94m
steps:
- id: register_flowcraft
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_flowcraft_tester
  client: flowcraft_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino
  client: eino
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino_tester
  client: eino_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_contracts_stop_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_contracts_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_candidate_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-learn-math-grade3
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_create_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_tester_workspace}"
      collection: raidtest-testers
      workflow_name: learn-math-grade3-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_select_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_candidate_workspace}"
- id: flowcraft_contracts_warmup_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_contracts_select_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_tester_workspace}"
- id: flowcraft_contracts_run_dialogue_before_reload
  timeout: 20m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${flowcraft_contracts_test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 14
    terminal_client: flowcraft
  capture:
    flowcraft_contracts_reload_handoff: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft
    "/completed_turns":
      equals: 14
    "/turns/flowcraft/count":
      equals: 7
    "/turns/flowcraft_tester/count":
      equals: 7
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 4
    "/turns/flowcraft/text_runes/max":
      maximum: 360
- id: flowcraft_contracts_recall_barrier_1
  client: flowcraft
  rpc:
    method: server.run.workspace.recall
    request:
      query: 小数的初步认识
  timeout: 60s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: flowcraft_contracts_reload_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_contracts_run_dialogue_after_reload
  timeout: 5m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${flowcraft_contracts_reload_handoff}"
    media: text
    idle_timeout: 90s
    max_turns: 3
    terminal_client: flowcraft_tester
  capture:
    flowcraft_contracts_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 3
    "/turns/flowcraft/count":
      equals: 1
    "/turns/flowcraft_tester/count":
      equals: 2
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 4
    "/turns/flowcraft/text_runes/max":
      maximum: 200
- id: flowcraft_contracts_emit_verdict
  output:
    variable: flowcraft_contracts_verdict
- id: eino_contracts_stop_create_candidate_workspace
  client: eino
  rpc:
    method: server.run.stop
    request: {}
- id: eino_contracts_create_candidate_workspace
  client: eino
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_contracts_candidate_workspace}"
      collection: raidtest-targets
      workflow_name: eino-learn-math-grade3
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_contracts_create_tester_workspace
  client: eino_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_contracts_tester_workspace}"
      collection: raidtest-testers
      workflow_name: learn-math-grade3-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_contracts_select_candidate_workspace
  client: eino
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_contracts_candidate_workspace}"
- id: eino_contracts_warmup_candidate_workspace
  client: eino
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_contracts_select_tester_workspace
  client: eino_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_contracts_tester_workspace}"
- id: eino_contracts_run_dialogue_before_reload
  timeout: 20m
  workspace_relay:
    first_client: eino_tester
    second_client: eino
    input: "${eino_contracts_test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 14
    terminal_client: eino
  capture:
    eino_contracts_reload_handoff: "/terminal/text"
  expect:
    "/terminal/client":
      equals: eino
    "/completed_turns":
      equals: 14
    "/turns/eino/count":
      equals: 7
    "/turns/eino_tester/count":
      equals: 7
    "/turns/eino/first_text_ms/max":
      maximum: 6000
    "/turns/eino/text_runes/min":
      minimum: 4
    "/turns/eino/text_runes/max":
      maximum: 360
- id: eino_contracts_recall_barrier_1
  client: eino
  rpc:
    method: server.run.workspace.recall
    request:
      query: 小数的初步认识
  timeout: 60s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: eino_contracts_reload_candidate_workspace
  client: eino
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: eino_contracts_run_dialogue_after_reload
  timeout: 5m
  workspace_relay:
    first_client: eino_tester
    second_client: eino
    input: "${eino_contracts_reload_handoff}"
    media: text
    idle_timeout: 90s
    max_turns: 3
    terminal_client: eino_tester
  capture:
    eino_contracts_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: eino_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 3
    "/turns/eino/count":
      equals: 1
    "/turns/eino_tester/count":
      equals: 2
    "/turns/eino/first_text_ms/max":
      maximum: 6000
    "/turns/eino/text_runes/min":
      minimum: 4
