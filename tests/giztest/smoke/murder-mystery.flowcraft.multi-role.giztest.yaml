    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/events":
      non_empty: true
    "/text_eos_ms":
      maximum: 90000
    "/audio_eos_ms":
      maximum: 90000
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- id: flowcraft_multi_role_probe_lawyer_first_response
  client: flowcraft_multi_role
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让律师再简短说说自己的固定说法。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
