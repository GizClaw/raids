# User Story:
# As a function-chat user,
# I want parallel Seed answer/control lanes,
# So that exact native receipts prove control while one selected reply enters History.
version: gizclaw.test/v1alpha1
name: chat-assistant.function-chat.testing
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  workspace:
    direction: input
    type: string
    generate: token
  story:
    direction: input
    type: string
    generate: token
  oracle:
    direction: input
    type: string
    generate: token
  other_workspace:
    direction: input
    type: string
    generate: token
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  selected_reply_0:
    direction: output
    type: string
  selected_reply_1:
    direction: output
    type: string
  selected_reply_2:
    direction: output
    type: string
  selected_reply_3:
    direction: output
    type: string
  selected_reply_4:
    direction: output
    type: string
  selected_reply_5:
    direction: output
    type: string
  selected_reply_6:
    direction: output
    type: string
  selected_reply_7:
    direction: output
    type: string
  selected_reply_8:
    direction: output
    type: string
  selected_reply_9:
    direction: output
    type: string
  selected_reply_10:
    direction: output
    type: string
  selected_reply_11:
    direction: output
    type: string
repeat: 1
timeout: 12m
steps:
- id: register
  client: peer
  rpc:
    method: server.register
    request:
      token: 9c845896-1447-5a7e-b799-a1df42694fb8
- id: install_read
  client: peer
  timeout: 5s
  client_rpc:
    method: client.mhs.v0.read
    response: &id001
      instances:
        display.main:
          hwd: display
          value:
            brightness_percent: 50
          write_fields:
          - brightness_percent
        led.status:
          hwd: led
          value:
            brightness_percent: 50
          write_fields:
          - brightness_percent
    expect_calls: 0
  expect:
    /calls:
      equals: 0
- id: install_write
  client: peer
  timeout: 5s
  client_rpc:
    method: client.mhs.v0.write
    response: *id001
    expect_calls: 0
  expect:
    /calls:
      equals: 0
- id: install_audioplayer_get
  client: peer
  timeout: 5s
  client_rpc:
    method: client.tool.v0.invoke
    response: &id002
      audio_player:
        items:
        - url: https://media.example.com/0.mp3
          title: 小星星
          source_ref: ${oracle}
        - url: https://media.example.com/1.mp3
          title: 卡农
          source_ref: ${oracle}
        - url: https://media.example.com/2.mp3
          title: 虫儿飞
          source_ref: ${oracle}
        current_index: 0
    expect_calls: 0
    tool: audioplayer.get
  expect:
    /calls:
      equals: 0
- id: install_audioplayer_playlist_get
  client: peer
  timeout: 5s
  client_rpc:
    method: client.tool.v0.invoke
    response: *id002
    expect_calls: 0
    tool: audioplayer.playlist.get
  expect:
    /calls:
      equals: 0
- id: install_audioplayer_play
  client: peer
  timeout: 5s
  client_rpc:
    method: client.tool.v0.invoke
    response: *id002
    expect_calls: 0
    tool: audioplayer.play
  expect:
    /calls:
      equals: 0
- id: install_audioplayer_stop
  client: peer
  timeout: 5s
  client_rpc:
    method: client.tool.v0.invoke
    response: *id002
    expect_calls: 0
    tool: audioplayer.stop
  expect:
    /calls:
      equals: 0
- id: install_run_workspace_set
  client: peer
  timeout: 5s
  client_rpc:
    method: client.tool.v0.invoke
    response:
      run_workspace: true
    expect_calls: 0
    tool: run.workspace.set
  expect:
    /calls:
      equals: 0
- id: create
  client: peer
  rpc:
    method: server.workspace.create
    request:
      name: ${workspace}
      workflow_name: function-assistant
      parameters: &id003
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
          safety_fence_level: 'off'
      toolkit:
        tool_names:
          value:
          - light.brightness
          - light.get
          - music.play
          - music.playlist
          - music.status
          - music.stop
          - screen.brightness
          - screen.get
          - workflow.switch
- id: create_story
  client: peer
  rpc:
    method: server.workspace.create
    request:
      name: ${story}
      workflow_name: eino-story-aesop
      parameters: *id003
- id: select
  client: peer
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: ${workspace}
- id: reload
  client: peer
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: catalog
  client: peer
  rpc:
    method: server.tool.list
    request:
      workspace_name: ${workspace}
      limit: 100
  expect:
    /items:
      count: 9
    /has_next:
      equals: false
    /items/0/name:
      equals: light.brightness
    /items/0/source:
      equals: mhs
    /items/0/available:
      equals: true
    /items/1/name:
      equals: light.get
    /items/1/source:
      equals: mhs
    /items/1/available:
      equals: true
    /items/2/name:
      equals: music.play
    /items/2/source:
      equals: client_tool
    /items/2/available:
      equals: true
    /items/3/name:
      equals: music.playlist
    /items/3/source:
      equals: client_tool
    /items/3/available:
      equals: true
    /items/4/name:
      equals: music.status
    /items/4/source:
      equals: client_tool
    /items/4/available:
      equals: true
    /items/5/name:
      equals: music.stop
    /items/5/source:
      equals: client_tool
    /items/5/available:
      equals: true
    /items/6/name:
      equals: screen.brightness
    /items/6/source:
      equals: mhs
    /items/6/available:
      equals: true
    /items/7/name:
      equals: screen.get
    /items/7/source:
      equals: mhs
    /items/7/available:
      equals: true
    /items/8/name:
      equals: workflow.switch
    /items/8/source:
      equals: client_tool
    /items/8/available:
      equals: true
- id: turn_0
  client: peer
  timeout: 90s
  peer_stream:
    mode: text
    input: 请记住我喜欢轻音乐，暗号是${oracle}。现在不播放，只回复“已记住”。
    require_text: true
    require_audio: false
    wait_for_history: true
  expect:
    /text_eos:
      equals: true
    /response_count:
      equals: 1
    /text:
      contains: 已记住
      not_contains:
      - NO_DEVICE_ACTION
    /reply:
      non_empty: true
      not_contains:
      - NO_DEVICE_ACTION
      pattern: ^已记住[。.!！]?$
  capture:
    selected_reply_0: /reply
- id: single_history_reply_0
  client: peer
  rpc:
    method: server.workspace.history.list
    request:
      workspace_name: ${workspace}
      order: WORKSPACE_HISTORY_LIST_REQUEST_ORDER_ASC
      limit: 100
  expect:
    /available:
      equals: true
    /has_next:
      equals: false
    /items:
      count: 2
    /items/0/type:
      equals: PEER_RUN_HISTORY_ENTRY_TYPE_GEAR
    /items/0/text:
      equals: 请记住我喜欢轻音乐，暗号是${oracle}。现在不播放，只回复“已记住”。
    /items/1/type:
      equals: PEER_RUN_HISTORY_ENTRY_TYPE_AGENT
    /items/1/text:
      equals: ${selected_reply_0}
