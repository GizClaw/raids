    "/turns/eino_history_tester/count":
      equals: 12
    "/turns/eino_history/first_text_ms/max":
      maximum: 6000
    "/turns/eino_history/text_runes/min":
      minimum: 10
    "/turns/eino_history/text_runes/max":
      maximum: 520
- id: eino_history_contracts_recall_barrier_1
  client: eino_history
  rpc:
    method: server.run.workspace.recall
