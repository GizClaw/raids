---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata: {id: ast-translate-zh-en-auto}
spec:
  driver: ast-translate
  ast_translate:
    translation_model: ast-translate-zh-en-auto.model
    lang_pair: auto
    mode: s2s
    voice: {tts_voice: ast-translate-zh-en-auto.translator}
    resource_id: volc.service_type.10053
    enable_source_language_detect: true
    denoise: false
