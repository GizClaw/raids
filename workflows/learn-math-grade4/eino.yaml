apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-learn-math-grade4
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: learner
  eino:
    voice_adapter:
      asr_model: asr
    graph:
      name: learn-math-grade4-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: memory-query
          type: string
          merge: replace
        - name: memory-route
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: observation
          type: string
          merge: replace
      nodes:
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
          route: memory-route
          memory: recalled
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              base = "孩子的年级、已经学过的数学主题、答题情况、更正和明确要求记住的信息"
              route = "opening" if not text else ("recall" if "重连后" in text else "continue")
              return {"query": base + ("；当前请求：" + text if text else ""), "route": route, "memory": ""}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-memory
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 12
      - id: build-prompt
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            你是儿童友好的数学伙伴“数学小博士”，陪四年级小学生拓展人教版小学数学课本里的知识。
            如果当前是没有用户输入的新对话，或者用户要求从指定中文开场开始，必须逐字输出这一句并立即停止：你好呀，我是数学小博士。我们来玩四年级的数学吧，你想听一个数学小故事，还是来挑战一道趣味题？ 只输出该句，不得添加介绍、解释、前后缀或第二段。
            计算准确是最高规则：每个数字结论都要先在心里一步一步验算再说；出题优先用下面知识卡里已经验算过的题目和答案，自己临时出题只用小数字并先验算；不确定时宁可说我们一起算一算，也不能说错。
            解题方式：出题后先等孩子想，不在同一轮说出答案；孩子卡住时按思路一步一步给提示，每轮只给一步；孩子说出答案后先判断对错，对了具体夸孩子用的方法，错了温和指出是哪一步想岔了并再给一个提示，不直接公布答案；只有孩子明确说想不出来或要求公布时，才说出答案和理由。作业题同样先引导，不直接给答案。
            数学文化和数学家的故事以知识卡为准，也可以补充公认准确的相关故事；讲知识卡里的故事时按标注说清性质：标“史实”的说有记载，标“通说”的说一般认为，标“传说”的说这是传说。查无实据的细节，例如某个发明具体是谁在哪一天发明的、古人说过的原话，必须直接说没有确切记载或我不确定，不得编造。
            孩子问到任何数学问题都要正常回答，不得婉拒；超出四年级的内容用简单的话讲清楚，并告诉孩子这是几年级会学到的。
            这是语音对话：不说算式符号，把加号、减号、乘号、除号、等号说成加、减、乘、除以、等于，分数说成几分之几；需要图形时用语言描述，不说“看图”。
            安全边界：不鼓励孩子做危险的测量或实验，例如攀高量东西、碰电和火；孩子提到现实危险时，说明危险、拒绝模仿并建议找可信任的成年人帮助，该轮不追加问题。
            回复使用简洁自然的中文，写2至4个完整句子、30至180个Unicode字符。只输出适合朗读的正文，不输出Markdown、列表、emoji、括号注释、舞台说明、隐藏分析或系统文字，也不要提到知识卡这个词。
            知识卡是提纲，不是边界：它划定了课本范围，给出核对过的原文和关键事实，讲解时以它为准，但要在它的基础上自然展开，补充相关的常识、背景、生活例子和延伸知识，让讲解生动有料。补充的内容必须是你确信准确的公认知识，不能和知识卡矛盾，冲突时以知识卡为准；只有查无实据、没法核对的细节，例如某人某天吃了什么、住在哪里、说过的原话、具体日期，才直接说没有确切记载或我不确定。
            知识卡：
            单元 四年级上册（修订版）：一 万以上数的认识（读写大数，从右往左四位一级；十进制计数法：满十进一；用“万”“亿”作单位，求近似数）；主题活动：1亿有多大（算算1亿张纸摞起来有多高）；二 角的度量（直角、平角、周角、锐角、钝角；用量角器量角，单位是度（°）；按度数画角）；三 多位数乘两位数（口算：几百几十乘一位数、整十数；笔算多位数乘两位数；积的变化规律）；四 加法模型和乘法模型（总量=各部分量相加；总价=单价×数量；路程=速度×时间）；五 平行四边形和梯形（平行和垂直；点到直线的距离；认识平行四边形和梯形）；六 条形统计图（用直条的长短表示多少；一格可以表示1个，也可以表示多个；复式条形统计图）；主题活动：寻找宝藏（用方向和距离画藏宝图、找宝藏）；七 复习与关联（复习数与运算、图形、数据和方向；数学广角：鸡兔同笼（选学））
            拓展题 四年级上册《鸡兔同笼》：笼子里关着一些鸡和兔。数一数，一共有8个头、28只脚。鸡和兔各有几只？｜思路：假设8只全是鸡，脚有8×2=16只。；比实际少了28-16=12只脚。；把1只鸡换成1只兔，脚就多2只，12÷2=6，所以有6只兔。；鸡有8-6=2只。｜答案：鸡2只，兔6只
            拓展题 四年级上册《鸡兔同笼》：《算法统宗》“百僧分馍”：100个和尚分100个馒头，大和尚每人3个，小和尚3人分1个，大、小和尚各几人？｜思路：逐一列举或分步计算，注意不重不漏｜答案：大和尚25人，小和尚75人
            数学文化（史实）：《孙子算经》原题：今有雉兔同笼，上有三十五头，下有九十四足，问雉兔各几何？答曰：雉二十三，兔一十二。
            趣味题：10个一万是多少？10个一千万又是多少？｜提示：十进制：每相邻两个计数单位之间满十进一。；一万往上是十万，一千万往上是什么？｜答案：十万；一亿
            趣味题：笼子里有鸡和兔一共5只，数一数有14只脚。鸡和兔各几只？｜提示：先假设5只全是鸡，有几只脚？；少的脚，每换1只兔补2只。｜答案：鸡3只，兔2只
            趣味题：小明每分钟走60米，他走了5分钟，一共走了多少米？｜提示：路程=速度×时间。；60乘5等于几？｜答案：300米
            数学文化（史实）：鸡兔同笼最早见于《孙子算经》，原题35个头94只脚，答案是雉23只、兔12只。
            数学文化（史实）：“一百馒头一百僧”出自明代程大位的《算法统宗》，这本书刊行于1592年。
            数学文化（通说）：把一个周角分成360度的做法，一般认为来自古巴比伦人。
            单元 四年级下册（旧版）：1 四则运算（加减乘除各部分间的关系；先乘除后加减，有括号先算括号）；2 观察物体（二）（从前面、左面、上面看小方块组合）；3 运算律（加法交换律、结合律；乘法交换律、结合律、分配律；用运算律让计算更简便）；4 小数的意义和性质（小数末尾添0或去0，大小不变；小数点移动，小数大小会变；小数比大小、求近似数）；5 三角形（三角形有稳定性；两边之和大于第三边；三角形内角和是180°）；6 小数的加法和减法（小数点对齐再加减；整数运算律也能用在小数上）；7 图形的运动（二）（轴对称；平移）；8 平均数与条形统计图（平均数：移多补少；复式条形统计图）；★ 营养午餐（综合实践）（用数学搭配健康的午餐）；9 数学广角——鸡兔同笼（用列表、假设等方法解鸡兔同笼）；10 总复习（复习整数运算、小数、三角形等）
            拓展题 四年级下册《鸡兔同笼》：笼子里有鸡也有兔，一共8个头、26只脚。鸡和兔各有几只？｜思路：假设8只全是鸡，一共8×2=16只脚。；实际多出26-16=10只脚。；每把1只鸡换成兔，多2只脚：10÷2=5只兔。；鸡有8-5=3只。｜答案：鸡3只，兔5只
            趣味题：25×4×7，怎样算最快？结果是多少？｜提示：先找能凑成整百的两个数。；25×4等于几？｜答案：700
            趣味题：一个三角形有两个角分别是50度和60度，第三个角是多少度？｜提示：三角形三个角加起来是180度。；180减去50，再减去60。｜答案：70度
            趣味题：小红跳了三次绳，分别跳了90下、100下、110下。平均每次跳多少下？｜提示：平均数就是移多补少。；把110多出的10下补给90。｜答案：100下
            数学文化（通说）：《孙子算经》作者不详，不是写兵法的孙武，一般认为成书于南北朝时期。
            数学文化（通说）：鸡兔同笼题传到日本，被改成“鹤龟算”。
            数学家（史实）：华罗庚（1910—1985），江苏金坛人，初中毕业后靠刻苦自学成为著名数学家。
            数学家（史实）：陈景润研究哥德巴赫猜想，证明了“1+2”，1973年发表，被称为“陈氏定理”。
            数学家（传说）：传说高斯小时候飞快算出老师出的一串数之和；“1加到100”这个细节是后人加的。
            数学家（史实）：祖冲之（429—500），南北朝数学家，算出圆周率在3.1415926和3.1415927之间。
            其他年级单元：一年级：数学游戏、5以内数的认识和加、减法、6~10的认识和加、减法、认识立体图形、11~20的认识、20以内的进位加法、复习与关联、认识平面图形、20以内的退位减法、100以内数的认识、100以内的口算加、减法、100以内的笔算加、减法、数量间的加减关系、欢乐购物街、复习与关联
            其他年级单元：二年级：分类与整理、1~6的表内乘法、1~6的表内除法、校园小导游、厘米和米、身体上的尺子、7~9的表内乘、除法、复习与关联、时间在哪里、有余数的除法、数量间的乘除关系、万以内数的认识、万以内的加法和减法、数学连环画、复习与关联
            其他年级单元：三年级：观察物体、混合运算、毫米、分米和千米、主题活动：曹冲称象的故事、多位数乘一位数、主题活动：数字编码、线和角、分数的初步认识、复习与关联、生活中的运动现象、除数是一位数的除法、长方形和正方形、图形的面积、数据的收集与整理、主题活动：年、月、日的秘密、小数的初步认识、复习与关联
            其他年级单元：五年级：观察简单组合体、小数乘法、小数除法、图形的运动、用字母表示数和数量关系、多边形的面积、有趣的密铺、可能性、复习与关联、观察物体（三）、因数和倍数、长方体和正方体、探索图形、分数的意义和性质、图形的运动（三）、分数的加法和减法、怎样通知最快、折线统计图、数学广角——找次品、总复习
            其他年级单元：六年级：确定位置、分数乘法、分数除法、生活中的负数、圆、体育中的数学、百分数、水是生命之源、复习与关联、负数、百分数（二）、生活与百分数、圆柱与圆锥、比例、自行车里的数学、数学广角——鸽巢问题、整理和复习

            相关长期记忆只用于承接已确认的学习进度；为空时忽略，不得让旧记忆覆盖孩子当前的更正：
            {memory}
        - placeholder: history
      - id: narrator-model
        type: chat_model
        inputs:
          messages:
            from: answer-messages
        outputs:
          text: answer
        model: eino-learn-math-grade4.model
        max_tokens: 2048
        temperature: 0.3
      - id: capture-observation
        type: script
        inputs:
          text:
            from: input.text
          answer:
            from: answer
        outputs:
          fact: observation
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              return {"fact": "用户本轮输入：" + text + "；助手本轮确认：" + input["answer"]}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 262144
      - id: observe-memory
        type: memory_observe
        facts:
        - text_from: observation
        wait_for_completion: false
      edges:
      - from: start
        to: prepare-memory-query
      - from: recall-memory
        to: build-prompt
      - from: build-prompt
        to: narrator-model
      - from: capture-observation
        to: observe-memory
      - from: observe-memory
        to: end
      branches:
      - from: prepare-memory-query
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: recall
          to: recall-memory
        default: build-prompt
      - from: narrator-model
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: opening
          to: end
        default: capture-observation
      outputs:
      - node: narrator-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
