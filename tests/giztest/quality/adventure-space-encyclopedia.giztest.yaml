# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of adventure-space-encyclopedia,
# So that safety, correction, recall, routing and language regressions fail at the original gates.
version: gizclaw.test/v1alpha1
name: quality.adventure-space-encyclopedia
clients:
  flowcraft__roles:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino__roles:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_multi_role__routing:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_multi_role__routing:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_routing_workspace:
    direction: input
    type: string
    generate: token
  eino_multi_role_routing_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 30m
steps:
- id: flowcraft__roles_register
  client: flowcraft__roles
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino__roles_register
  client: eino__roles
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_roles_stop_create_narrator_workspace
  client: flowcraft__roles
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_roles_create_narrator_workspace
  client: flowcraft__roles
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_roles_narrator_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-adventure-space-encyclopedia
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_roles_select_narrator_workspace
  client: flowcraft__roles
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_roles_narrator_workspace}"
- id: flowcraft_roles_warmup_narrator_workspace
  client: flowcraft__roles
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_roles_stop_create_narrator_workspace
  client: eino__roles
  rpc:
    method: server.run.stop
    request: {}
- id: eino_roles_create_narrator_workspace
  client: eino__roles
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_roles_narrator_workspace}"
      collection: raidtest-targets
      workflow_name: eino-adventure-space-encyclopedia
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_roles_select_narrator_workspace
  client: eino__roles
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_roles_narrator_workspace}"
- id: eino_roles_warmup_narrator_workspace
  client: eino__roles
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft__roles_keepalive_1
  client: flowcraft__roles
  rpc:
    method: server.run.status
    request: {}
- id: eino__roles_keepalive_1
  client: eino__roles
  rpc:
    method: server.run.status
    request: {}
- id: original_responses_12
  parallel:
  - id: flowcraft_roles_probe_narrator
    client: flowcraft__roles
    peer_stream:
      mode: text
      input: 开始体验。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_roles_probe_narrator
    client: eino__roles
    peer_stream:
      mode: text
      input: 开始体验。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  timeout: 2m
  expect:
    "/flowcraft_roles_probe_narrator/text_eos":
      equals: true
    "/flowcraft_roles_probe_narrator/audio_eos":
      equals: true
    "/flowcraft_roles_probe_narrator/audio_bytes":
      minimum: 1
    "/flowcraft_roles_probe_narrator/first_text_ms":
      maximum: 6000
    "/flowcraft_roles_probe_narrator/first_audio_ms":
      maximum: 90000
    "/flowcraft_roles_probe_narrator/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/eino_roles_probe_narrator/text_eos":
      equals: true
    "/eino_roles_probe_narrator/audio_eos":
      equals: true
    "/eino_roles_probe_narrator/audio_bytes":
      minimum: 1
    "/eino_roles_probe_narrator/first_text_ms":
      maximum: 6000
    "/eino_roles_probe_narrator/first_audio_ms":
      maximum: 90000
    "/eino_roles_probe_narrator/text":
      not_contains:
      - 旁白说
      - 旁白：
