            有声书连续讲述：普通回合（含开场、转场和选择结果）中文正文200至900个Unicode字符，英文正文100至450个英文单词，约1至2分钟语音。旁白与2至4个当前在场角色来回交替讲述，旁白叙述与角色第一人称台词分段；场景确实只有一位角色时只用该角色，绝不为凑数让未在场角色出现。角色只知亲历或已公开信息。孩子可以随时插话；接续最新插话，不重播已讲段落。孩子点名想听某个在场角色时，在本段多给该角色台词；不单独切换整轮说话人，也不因点名改变场景。
            标记格式：每段必须恰好以一个全角标记开头，只能使用【旁白】、【小怪兽】、【守门怪兽】、【谜题精灵】，标记后直接正文；不输出其它【】标记，不把舞台说明放进标记，不使用英文角色key作标记。旁白与角色台词分别成段，同一角色可以多次出现。章节标题放在【旁白】后的正文，标题规则保持不变。
            每轮结尾用【旁白】给出2至3个具体、儿童安全的选项，最多一个问题。安全及限定范围的确认/更正/重连约束优先：这些特殊回合按原规则收束，不强加新问题；仅用户明确限定范围的确认、更正、记忆回忆或纯安全制止可短于200字，不为凑字数推进剧情。音色由段落标记映射，不输出Markdown、emoji或系统字段。
        - placeholder: history
      - id: narrator-model
        type: chat_model
        inputs:
          messages:
            from: answer-messages
        outputs:
          text: answer
        model: eino-adventure-monster-maze-mr.model
        max_tokens: 2048
        temperature: 0.5
      - id: commit-progress
        type: script
        inputs:
          answer:
            from: answer
          phase:
            from: phase-key
          route:
            from: stage-route
          text:
            from: input.text
          scene:
            from: voice-scene
          voice_revision:
            from: voice-revision
        outputs:
          progress: progress-fact
          lane: progress-lane
          kind: progress-kind
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              scenes = ["月亮机关", "路线校准", "锁孔谜题", "怪兽合作"]
              scene = input["scene"]
              for i in range(len(scenes)):
                  if "来到" + scenes[i] in input["answer"]:
                      scene = str(i + 1)
              routing = '{"schema":"raid_scenario_state_v2","voice_scene":' + scene + ',"revision":' + input["voice_revision"] + '}\n'
              progress = "schema=raid_scenario_progress_v2; phase=" + input["phase"] + "; route=" + input["route"]
              if input["phase"] == "correction":
                  correction = "latest_valid_facts_preserved_from_history"
                  if "蘑菇花园" in input["text"] and ("右边" in input["text"] or "右侧" in input["text"] or "向右" in input["text"]):
                      correction = "garden_route=右边通往蘑菇花园"
                  elif "蓝色" in input["text"]:
                      correction = "marker_color=蓝色"
                  progress += "; correction_authority=latest_user_value; " + correction
              else:
                  progress += "; latest_input=" + input["text"]
              return {"progress": routing + progress, "lane": "case_state", "kind": "state"}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 131072
          max_output_bytes: 131072
      - id: observe-progress
        type: memory_observe
        facts:
        - text_from: progress-fact
          attributes:
            lane: progress-lane
            kind: progress-kind
        wait_for_completion: false
      edges:
      - from: start
        to: prepare-memory-query
      - from: prepare-memory-query
        to: recall-progress
      - from: recall-progress
        to: route-stage
      - from: prompt-opening
        to: narrator-model
      - from: prompt-explore
        to: narrator-model
      - from: prompt-correction
        to: narrator-model
      - from: prompt-challenge
        to: narrator-model
      - from: prompt-conclusion
        to: narrator-model
      - from: narrator-model
        to: commit-progress
      - from: commit-progress
        to: observe-progress
      - from: observe-progress
        to: end
      - from: route-stage
        to: control-narration
      branches:
      - from: control-narration
        mode: first_match
        routes:
        - when:
            field: phase-key
            op: eq
            value: opening
          to: prompt-opening
        - when:
            field: phase-key
            op: eq
            value: correction
          to: prompt-correction
        - when:
            field: phase-key
            op: eq
            value: challenge
          to: prompt-challenge
        - when:
            field: phase-key
            op: eq
            value: conclusion
          to: prompt-conclusion
        default: prompt-explore
      outputs:
      - node: narrator-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
