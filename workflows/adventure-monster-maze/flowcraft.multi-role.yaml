apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-adventure-monster-maze-multi-role
spec:
  driver: flowcraft
  toolkit:
    tool_ids: []
  flowcraft:
    graph:
      name: adventure-monster-maze
      entry: prepare-recall-query
      edges:
      - from: prepare-recall-query
        to: recall-progress
      - from: recall-progress
        to: route-phase
      - from: control-narration
        to: narrate-story
      - from: narrate-story
        to: reduce-state
      - from: reduce-state
        to: observe-progress
      - from: observe-progress
        to: __end__
      - from: route-phase
        to: control-narration
      nodes:
      - id: control-narration
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim().toLowerCase();
            const memory = String(board.getVar("scenario_memory") || "");
            let state = Object.assign({schema:"raid_scenario_state_v2", revision:0}, board.getVar("scenario_state") || {});
            for (const line of memory.split("\n")) {
              const start = line.indexOf('{"schema":');
              if (start < 0) continue;
              try { const old = JSON.parse(line.slice(start));
                if (old.schema === "raid_scenario_state_v2" && Number(old.revision || 0) > Number(state.revision || 0)) state = Object.assign({},state,old);
              } catch (_) {}
            }
            const roleTable = [{"key": "narrator", "name": "旁白", "aliases": ["旁白", "narrator"], "chapters": [1, 2, 3, 4], "duty": "只负责叙述、管理和公开信息整理，不代演角色。"}, {"key": "little-monster", "name": "小怪兽", "aliases": ["小怪兽", "little-monster"], "chapters": [4], "duty": "在玩家解锁相遇后提出一起帮忙的方法，不恐吓。"}, {"key": "gatekeeper", "name": "守门怪兽", "aliases": ["守门怪兽", "gatekeeper"], "chapters": [1, 2], "duty": "指向已经可见的按钮与路线，不替玩家按按钮。"}, {"key": "riddle-spirit", "name": "谜题精灵", "aliases": ["谜题精灵", "riddle-spirit"], "chapters": [3], "duty": "比较圆形三角形方形锁孔，给渐进提示，不替玩家解锁。"}];
            const scenes = ["月亮机关", "路线校准", "锁孔谜题", "怪兽合作"];
            const any = (s, cues) => cues.some(c => s.includes(c));
            if (!state.voice_scene && state.route) for (let i=0;i<scenes.length;i++) if(String(state.route).includes(scenes[i])) state.voice_scene=i+1;
            let scene = Number(state.voice_scene || 1);
            scene = Number.isFinite(scene) ? Math.max(1, Math.min(scenes.length, Math.floor(scene))) : 1;
            const history = typeof board.channel === "function" ? (board.channel(board.MAIN_CHANNEL) || []) : [];
            { // Delivered scene arrivals supersede recalled state.
              for (const m of history) {
                if (m.role !== "assistant") continue;
                const text = m.content || (m.parts || []).filter(p => p.type === "text").map(p => p.text || "").join("");
                for (let i=0;i<scenes.length;i++) if (text.includes("当前场景："+scenes[i]) || text.includes("来到"+scenes[i])) scene=i+1;
              }
            }
            let transition = false;
            if (!current || any(current, ["重新开始", "restart", "开场", "介绍这个体验", "开始体验"])) scene=1;
            else if (any(current,["进入下一章","进入下一场景"])) {scene=Math.min(scenes.length,scene+1); transition=true;}
            else {
              for (let i=0;i<scenes.length;i++) if (any(current,["进入"+scenes[i],"前往"+scenes[i],"来到"+scenes[i]])) {scene=i+1;transition=true;}
              if (any(current,["按下月亮", "打开月亮机关"])) {scene=2;transition=true;}
              if (any(current,["走进右边门", "查看锁孔"])) {scene=3;transition=true;}
              if (any(current,["解开锁后遇到小怪兽"])) {scene=4;transition=true;}
            }
            let phase = "explore";
            if (!current || any(current, ["开始迷宫", "进入迷宫", "怪兽迷宫"])) phase = "opening";
            else if (any(current, ["更正", "只确认", "有效路线", "正确路线", "正确颜色", "只说有效", "回忆", "重连", "隔了几轮", "只说"])) phase = "correction";
            else if (any(current, ["总结", "路线图", "结合线索", "出口", "回顾", "用一句话说出"])) phase = "conclusion";
            else if (any(current, ["我猜", "可能", "一定", "危险", "捷径", "牺牲", "尚不能", "不要替我"])) phase = "challenge";
            const stageRoute = String(board.getVar("scenario_route") || state.route || "");
            for (let i=0;i<scenes.length;i++) if(stageRoute.includes(scenes[i])) scene=Math.max(scene,i+1);
            state.voice_scene=scene;
            state.active_roles=roleTable.filter(r=>r.chapters.includes(scene)).map(r=>r.key);
            let managementText=current;
            for (const role of roleTable) for (const alias of role.aliases) managementText=managementText.split(alias).join("");
            const management = !current || transition || any(managementText,["更正", "纠正", "修正", "改成", "改变主意", "其实", "安全", "危险", "现实", "模仿", "受伤", "攻击", "牺牲", "停止", "总结", "结论", "回忆", "重连", "恢复", "请记住", "只确认", "只说", "换边", "correction", "correct", "actually", "danger", "safety", "restart", "重新开始", "开场", "介绍这个体验", "进入下一", "下一章", "下一场景", "转场", "开始体验", "从头开始", "第一章", "第1章", "开始冒险", "start", "begin", "介绍体验", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物"]) || phase !== "explore";
            state.chapter_choice_made=!!current && !management;
            delete state.selected_speaker;
            state.revision=Math.max(0,Number(state.revision || 0))+1;
            board.setVar("scenario_state",state);
            board.setVar("scenario_state_text",JSON.stringify(state));
            board.setVar("story_bible", "这是儿童互动冒险的原创配角安排。按场景出场，不让所有人物同时在场；角色不能获知未来场景、私密信息或未验证的结果。每轮连续讲述，旁白与在场角色交替发声。\n首次开场就让当前在场角色在连续故事中自然登场。");
            board.setVar("narration_context", "当前场景："+scenes[scene-1]+"。当前在场角色："+roleTable.filter(r=>state.active_roles.includes(r.key)).map(r=>r.name).join("、")+"。"+(transition ? "本轮由旁白说出‘来到"+scenes[scene-1]+"’，用旁白和在场角色台词交替描写具体行动，结尾给两三个观察选项。" : "") );


            board.setVar("story_bible", board.getVar("story_bible") + "\n" + ["场景1“月亮机关”：守门怪兽：指向已经可见的按钮与路线，不替玩家按按钮。","场景2“路线校准”：守门怪兽：指向已经可见的按钮与路线，不替玩家按按钮。","场景3“锁孔谜题”：谜题精灵：比较圆形三角形方形锁孔，给渐进提示，不替玩家解锁。","场景4“怪兽合作”：小怪兽：在玩家解锁相遇后提出一起帮忙的方法，不恐吓。"].slice(scene - 1, Math.min(scene + 1, scenes.length)).join("\n"));
      - id: prepare-recall-query
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim();
            board.setVar("scenario_recall_query", current || "raid_scenario_state_v2");
      - id: recall-progress
        type: memory_recall
        config:
          query:
            text_from: scenario_recall_query
            lanes:
            - case_state
            kinds:
            - state
            - note
            - event
          output: scenario_memory
          render:
            header: 'Confirmed scenario history:'
            item_prefix: "- "
            max_items: 12
          top_k: 12
      - id: route-phase
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim();
            const memory = String(board.getVar("scenario_memory") || "");
            const liveState = board.getVar("scenario_state") || {schema: "raid_scenario_state_v2", revision: 0};
            let prior = Object.assign({}, liveState);
            let priorRevision = Math.max(0, Number(prior.revision || 0));
            for (const line of memory.split("\n")) {
              const start = line.indexOf('{"schema":"raid_scenario_state_v2"');
              if (start < 0) continue;
              try {
                const candidate = JSON.parse(line.slice(start));
                if (!candidate || candidate.schema !== "raid_scenario_state_v2") continue;
                const candidateRevision = Math.max(0, Number(candidate.revision || 0));
                if (candidateRevision > priorRevision) {
                  prior = Object.assign({}, prior, candidate);
                  priorRevision = candidateRevision;
                }
              } catch (_) {
                // Recall may also contain natural-language notes; only Graph-authored JSON state is authoritative.
              }
            }
            const isSpeechRequest = text => ["说说","说话","发言","回应","回答","talk","speak","answer"].some(c => text.includes(c));
            let combined = memory + "\n" + (isSpeechRequest(current) ? "" : current);
            const messages = board.channel(board.MAIN_CHANNEL) || [];
            for (const message of messages) {
              if (message && typeof message.content === "string" && !isSpeechRequest(message.content)) combined += "\n" + message.content;
              const parts = message && Array.isArray(message.parts) ? message.parts : [];
              const text = parts.map((part) => part && part.type === "text" && typeof part.text === "string" ? part.text : "").join("");
              if (text && !isSpeechRequest(text)) combined += "\n" + text;
            }
            const containsAnyText = (text, values) => values.some((value) => text.includes(value));
            let phase = "explore";
            if (!current || containsAnyText(current, ["开始迷宫", "进入迷宫", "怪兽迷宫"])) phase = "opening";
            else if (containsAnyText(current, ["更正", "只确认", "有效路线", "正确路线", "正确颜色", "只说有效", "回忆", "重连", "隔了几轮", "只说"])) phase = "correction";
            else if (containsAnyText(current, ["总结", "路线图", "结合线索", "出口", "回顾", "用一句话说出"])) phase = "conclusion";
            else if (containsAnyText(current, ["我猜", "可能", "一定", "危险", "捷径", "牺牲", "尚不能", "不要替我"])) phase = "challenge";
            let route = "";
            if (containsAnyText(combined, ["解开锁后遇到", "遇到一只打喷嚏", "怪兽成为帮手", "第四区", "怪兽合作"])) route = "第四区‘怪兽合作’";
            else if (containsAnyText(combined, ["锁孔谜题", "锁孔", "圆形", "三角形", "方形", "小提示"])) route = "第三区‘锁孔谜题’";
            else if (containsAnyText(combined, ["蘑菇花园", "右边", "右侧", "向右", "左边", "路线", "地图"])) route = "第二区‘路线校准’";
            else route = "第一区‘月亮机关’";
            board.setVar("scenario_phase", phase);
            board.setVar("scenario_route", route);
            board.setVar("scenario_state", prior);
            board.setVar("scenario_state_text", JSON.stringify(prior));
            board.setVar("scenario_common_prompt", "你是儿童友好的怪兽迷宫主持人，用方向、图形和逻辑线索维护一张连续一致的虚构地图。\n迷宫分为四区：第一区“月亮机关”、第二区“路线校准”、第三区“锁孔谜题”、第四区“怪兽合作”。事实建立、纠正、回忆、索要提示和猜测不自动移动玩家；只有玩家明确行动才可移动。用户询问区域时按当前已经抵达的区域准确回答。\n区位映射必须稳定：月亮机关打开后是第二区路线校准；右边门的圆形、三角形、方形锁孔属于第三区；玩家明确说“解开锁后遇到小怪兽”时已经抵达第四区怪兽合作。重载后仍按这张映射回答，不得退回第三区。\n每轮只提供一个可解的空间或逻辑线索，承接孩子已走过的方向、门、图案和获得的物品，不得重置地图。\n孩子可以索要渐进提示；先给较小提示，不能直接替孩子做决定。明确更正路线或颜色后只保留新事实。地图方向沿用玩家本轮的“左边”或“右边”原词，不改写成岔路等新称呼。\n事实建立、纠正或纯回忆回合只直接回答用户要求，不推进迷宫、不添加环境、新发现或追问；纠正回合必须只说本轮用户给出的新路线，并且不得以否定、引用、对比、解释或未命名岔路方式再次输出旧路线。\n怪兽只能是友善帮手、迷糊守门人或非暴力障碍，不得恐怖、突然惊吓、威胁囚禁或要求现实危险动作。\n用户引入一只“小怪兽”时，本轮正文必须明确使用“小怪兽”这个称呼，不能只用“它”代替。\n当孩子提出猜测时，区分已观察线索与尚未证实的推断。\n普通回复写2至4个完整中文句子、约60至190个Unicode字符；地图回忆和提示应简短。\n每轮最多问一个问题。默认输出适合朗读的中文正文，明确要求英文时使用英文，不输出Markdown、列表、菜单、emoji、舞台说明、分析或系统文字。\n必须写完整句子，不得依赖程序截断，不得重复同义内容。" + (phase === "opening" ? "首次主动开场严格说：欢迎来到怪兽迷宫，你是聪明的迷宫探险家，这里的怪兽都很友好，只是爱出谜题。每一关你都可以说想按哪个按钮、往哪边走，想不出来就说“给我一个提示”。迷宫门上有月亮、星星和太阳三个按钮，墙上的影子只指向没有光的图案，你会按哪个？" : ""));
      - id: reduce-state
        type: script
        config:
          source: |
            const input = String(board.getVar("input") || "").trim();
            const phase = String(board.getVar("scenario_phase") || "explore");
            const prior = board.getVar("scenario_state") || {schema: "raid_scenario_state_v2", revision: 0};
            const next = Object.assign({}, prior);
            let changed = false;
            function set(name, value) {
              if (value && next[name] !== value) { next[name] = value; changed = true; }
            }
            next.phase = phase;
            next.route = String(board.getVar("scenario_route") || "");
            if (input.includes("蘑菇花园") && (input.includes("右边") || input.includes("右侧") || input.includes("向右"))) set("garden_route", "右边通往蘑菇花园");
            if (input.includes("蓝色")) set("marker_color", "蓝色");
            if (changed) next.revision = Math.max(0, Number(prior.revision || 0)) + 1;
            if (phase === "correction") {
              delete next.last_input;
              next.last_correction = JSON.stringify({garden_route: next.garden_route || "", marker_color: next.marker_color || ""});
            } else {
              next.last_input = input.slice(0, 160);
            }
            const scenes = ["月亮机关", "路线校准", "锁孔谜题", "怪兽合作"];
            const roleTable = [{"key": "narrator", "name": "旁白", "aliases": ["旁白", "narrator"], "chapters": [1, 2, 3, 4], "duty": "只负责叙述、管理和公开信息整理，不代演角色。"}, {"key": "little-monster", "name": "小怪兽", "aliases": ["小怪兽", "little-monster"], "chapters": [4], "duty": "在玩家解锁相遇后提出一起帮忙的方法，不恐吓。"}, {"key": "gatekeeper", "name": "守门怪兽", "aliases": ["守门怪兽", "gatekeeper"], "chapters": [1, 2], "duty": "指向已经可见的按钮与路线，不替玩家按按钮。"}, {"key": "riddle-spirit", "name": "谜题精灵", "aliases": ["谜题精灵", "riddle-spirit"], "chapters": [3], "duty": "比较圆形三角形方形锁孔，给渐进提示，不替玩家解锁。"}];
            next.last_answer = String(board.getVar("tmp_answer") || "").slice(0, 12000);
            for (let i = 0; i < scenes.length; i++) {
              if (next.last_answer.includes("来到" + scenes[i])) next.voice_scene = i + 1;
            }
            next.active_roles = roleTable.filter(r => r.chapters.includes(next.voice_scene || 1)).map(r => r.key);
            board.setVar("scenario_state", next);
            board.setVar("scenario_state_fact", JSON.stringify(next));
      - id: observe-progress
        type: memory_observe
        config:
          observations:
          - facts:
            - text_from: scenario_state_fact
              attributes:
                lane: case_state
                kind: state
          wait_for_completion: false
      - id: narrate-story
        type: llm
        publish: true
        config:
          model: flowcraft-adventure-monster-maze-mr.model
          max_tokens: 2048
          output_key: tmp_answer
          system_prompt: |-
            仅当 scenario_phase 为 opening 时遵守：
            ${board.scenario_common_prompt}
            本轮Graph路径：${board.scenario_route}。
            本轮必须先逐字说出这段身份和玩法介绍：「欢迎来到怪兽迷宫，你是聪明的迷宫探险家，这里的怪兽都很友好，只是爱出谜题。每一关你都可以说想按哪个按钮、往哪边走，想不出来就说“给我一个提示”。」然后再按下面的要求写。本轮只建立安全的迷宫入口、可选道路和玩家自主选择，不替玩家迈出第一步。
            可核对的长期进度：${board.scenario_memory}
            Graph状态：${board.scenario_state_text}
            ${board.story_bible}
            ${board.narration_context}

            仅当 scenario_phase 为 explore 时遵守：
            ${board.scenario_common_prompt}
            本轮Graph路径：${board.scenario_route}。
            本轮只推进玩家当前选择的一段路线，给一个眼前结果和至多一个分级提示，不擅自走完迷宫。最新用户要求只描述机关可见规则时，当前意图优先于历史区域，只写机关上可见的形状、对应关系和规则，不添加怪兽、其他角色、角色位置、动作或意图。
            可核对的长期进度：${board.scenario_memory}
            Graph状态：${board.scenario_state_text}
            ${board.story_bible}
            ${board.narration_context}

            仅当 scenario_phase 为 correction 时遵守：
            ${board.scenario_common_prompt}
            本轮Graph路径：${board.scenario_route}。
            本轮只确认最新路线、标记或颜色；旧值失效且不得再次输出，也不得推进位置。
            可核对的长期进度：${board.scenario_memory}
            Graph状态：${board.scenario_state_text}
            ${board.story_bible}
            ${board.narration_context}

            仅当 scenario_phase 为 challenge 时遵守：
            ${board.scenario_common_prompt}
            本轮Graph路径：${board.scenario_route}。
            本轮拒绝危险牺牲和无证据捷径，说明风险与可验证线索，把最终选择留给玩家。
            可核对的长期进度：${board.scenario_memory}
            Graph状态：${board.scenario_state_text}
            ${board.story_bible}
            ${board.narration_context}

            仅当 scenario_phase 为 conclusion 时遵守：
            ${board.scenario_common_prompt}
            本轮Graph路径：${board.scenario_route}。
            本轮按有效路线、标记和已见机关回顾，不恢复旧路线，不宣称未验证的出口。
            可核对的长期进度：${board.scenario_memory}
            Graph状态：${board.scenario_state_text}
            ${board.story_bible}
            ${board.narration_context}

            连续有声书规则：孩子回答故事选择后，先讲清角色行动的直接后果；本章目标因此达成时，在同一回复自然进入紧邻下一章，并紧接新章开场，不等待口令或许可。每个普通回复最后只留一个故事内的问题，以？（英文?）结束，明确角色要做的事、去处或解决办法，给出两三个具体安全选项。不得询问是否继续听，不得输出“进入下一章”“要不要继续”“想继续听就说”“这一章的选择完成啦”等流程话术。孩子主动要求下一章仍可承接；插话、更正、暂停及安全要求优先。最后一个场景不创建额外章节，以角色的后续行动给出故事内选择。自然进入下一场景时用旁白正文“来到场景名。”记录到达，只记录实际到达，不预告。篇幅执行规则：所有普通叙述回合均须完整讲述，包括开场、转场、自然后果、不可用角色的替代回应、旁白线索钩子、角色探问、点名或否定点名后的继续讲述、事实边界说明和检查点总结。去除角色标记后，中文目标约 500 字，大约 1-2 分钟；不要少于 200 字，不要超过 900 字（按Unicode字符计数，标点、空格和换行也计入）。中文安排5段，每段约100字：旁白承接当前行动、在场角色的第一人称回应、另一在场角色的不同回应（只有一位时由旁白补充可观察细节）、旁白描述一个直接结果、旁白收束并按本轮规则给出选项。单角色探问仍保持该角色知识边界；事实说明和检查点用这5段展开当前已知细节，不因此新增剧情。英文按单词计数，目标约220个英文单词，大约1-2分钟；不要少于100个英文单词，不要超过450个英文单词，约5段、每段约44词，以匹配约1至2分钟语音；英文不适用中文字符上限，不翻译或重述整段中文背景。不能靠重复开场、旧对白或再讲一遍上一轮来补篇幅，也不能一句回应后立即结束。生成前安排各段篇幅，中文接近500字、英文接近220词时收束，不输出计数或分析。
            仅用户明确要求只确认、只说代号、限定范围更正/记忆回忆，或纯安全制止时，才按该特殊回合的原限制简短回答，不凑字数、不推进剧情。提到更正、否定角色名、改变选择或要求自然后果本身不构成短回复豁免；仍要求继续讲述时中文必须完成200至900字符、英文100至450词。不得为了长度新增事实、越过角色知识边界或无视孩子的暂停要求。
            有声书连续讲述：普通回合（含开场、转场和选择结果）中文正文200至900个Unicode字符，英文正文100至450个英文单词，约1至2分钟语音。旁白与2至4个当前在场角色来回交替讲述，旁白叙述与角色第一人称台词分段；场景确实只有一位角色时只用该角色，绝不为凑数让未在场角色出现。角色只知亲历或已公开信息。孩子可以随时插话；接续最新插话，不重播已讲段落。孩子点名想听某个在场角色时，在本段多给该角色台词；不单独切换整轮说话人，也不因点名改变场景。
            标记格式：每段必须恰好以一个全角标记开头，只能使用【旁白】、【小怪兽】、【守门怪兽】、【谜题精灵】，标记后直接正文；不输出其它【】标记，不把舞台说明放进标记，不使用英文角色key作标记。旁白与角色台词分别成段，同一角色可以多次出现。章节标题放在【旁白】后的正文，标题规则保持不变。
            每轮结尾用【旁白】给出2至3个具体、儿童安全的选项，最多一个问题。安全及限定范围的确认/更正/重连约束优先：这些特殊回合按原规则收束，不强加新问题；仅用户明确限定范围的确认、更正、记忆回忆或纯安全制止可短于200字，不为凑字数推进剧情。音色由段落标记映射，不输出Markdown、emoji或系统字段。
