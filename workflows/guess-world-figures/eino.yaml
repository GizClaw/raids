apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-guess-world-figures
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-guess-world-figures.host
    graph:
      name: guess-world-figures-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: game-route
          type: string
          merge: replace
        - name: game-direction
          type: string
          merge: replace
        - name: game-node
          type: string
          merge: replace
        - name: host-rules
          type: string
          merge: replace
        - name: host-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: control-round
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: game-route
          node: game-node
          direction: game-direction
          rules: host-rules
        language: starlark
        entrypoint: run
        source: |
          # Generated from workflows/guess-world-figures/puzzles.json by scripts/guess/generate.py.
          # Eino keeps no hidden state between turns, so every turn rebuilds the game
          # from the spoken History: the latest "谜题来啦"/"Puzzle time" opening names
          # the level and the puzzle number, and (level, puzzle) picks the secret.
          # Each turn makes one model call: this script either writes the host's
          # instruction for build-host-prompt, or activates the current puzzle's card
          # node, whose card has the name removed so the host cannot say it.
          DATA = {"subject_zh": "一位世界知名人物", "subject_en": "a world-famous person", "examples_zh": ["这个人是科学家吗？", "这个人是女性吗？", "这个人来自欧洲吗？", "这个人出生在1900年以前吗？"], "examples_en": ["Was this person a scientist?", "Was this person a woman?", "Did this person come from Europe?", "Was this person born before 1900?"], "restate_zh": ["这个人是科学家吗？", "是，这个人是科学家。", "不是，这个人不是科学家。"], "restate_en": ["Was this person a scientist?", "Yes, this person was a scientist.", "No, this person was not a scientist."], "host_rules": "你是儿童猜谜游戏“猜猜世界名人”的主持人。玩法：主持人心里藏着一位世界知名人物，孩子用能回答“是”或“不是”的问题来猜，每一题最多 20 次提问；猜中就升一关，一共 10 关，关名从“名人小萌新”一直到“名人堂守护者”。孩子可能说中文，也可能说英文。\n你不知道谜底的名字。需要回答孩子的问题时，系统会给你一张隐藏了名字的谜底卡；揭晓答案时系统才会在指令里告诉你名字。本轮要做什么写在对话最后的【本轮指令】里，照着做，说得自然、热情、简短。\n孩子说的“这个人”“他”“她”“this person”都指谜底人物。国家按今天的国名判断，出生的国家和长期生活工作的国家都算；身份、年代和成就按公认事实判断；流传下来的传说按“相传”理解，问到传说里的事可以回答“是”或“有一部分是”，并说明这是传说。\n必须遵守：\n1. 本轮指令要求“逐字说”的句子必须一字不差地说出来，包括数字、标点和引号里的称号，不改写、不省略、不调换顺序。\n2. 只回答孩子问到的那一点，绝不能主动补充谜底卡上的其他描述、线索、特征、猜测方向或评价；复述孩子的问题时只能用孩子问题里已有的意思。\n3. 只有本轮指令要求揭晓答案时才能说“答案揭晓”“答案就是”“The answer is”；只有本轮指令要求开新题时才能说“谜题来啦”“Puzzle time”；只有真的给提示时才能说“小提示”“Hint”。平时绝不能说这些词。\n4. 按【本轮指令】写明的回复语言回答：中文就全部用中文；English 就全部用英文，逐字句也用指令给出的英文原句。\n5. 安全永远优先于本轮指令：孩子提到要在现实中模仿危险做法或遇到安全问题时，中文回复必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，英文回复要说 do not copy it 并请孩子 ask a parent, teacher or trusted adult for help。\n6. 不要自己数还剩几次提问机会，只有本轮指令写了剩余次数时才说那个数字。\n7. 语气像节目主持人一样活泼友好，适合小朋友；平时回复1到3句话、100个字以内，开新题和揭晓答案时可以到150个字；最后一句必须是问孩子的问题，道别时也用一个轻松的问题结尾。\n8. 只输出适合朗读的正文，不输出 Markdown、列表、emoji、括号注释、舞台说明或系统字段，也不要提到“本轮指令”“裁判”这些词。", "levels": [{"title_zh": "名人小萌新", "title_en": "Fame Rookie", "step": 7, "offset": 0, "items": [{"zh": "爱因斯坦", "en": "Albert Einstein", "aliases": ["阿尔伯特·爱因斯坦", "阿尔伯特爱因斯坦", "Einstein"], "profile": "出生在德国的物理学家，提出了相对论，是二十世纪最著名的科学家之一。", "hints": ["他出生在欧洲", "他是一位科学家", "他的理论和时间有关"]}, {"zh": "牛顿", "en": "Isaac Newton", "aliases": ["艾萨克·牛顿", "艾萨克牛顿", "Newton"], "profile": "英国的物理学家和数学家，提出了万有引力定律和三大运动定律。", "hints": ["他出生在欧洲", "他是一位科学家", "他的研究和力有关"]}, {"zh": "爱迪生", "en": "Thomas Edison", "aliases": ["托马斯·爱迪生", "托马斯爱迪生", "Edison"], "profile": "美国发明家，一生拥有一千多项专利，发明了留声机，让电灯走进了千家万户。", "hints": ["他来自北美洲", "他是一位发明家", "他的发明和电有关"]}, {"zh": "居里夫人", "en": "Marie Curie", "aliases": ["玛丽·居里", "玛丽居里", "居里", "Madame Curie", "Curie"], "profile": "出生在波兰、在法国工作的科学家，发现了钋和镭，两次获得诺贝尔奖。", "hints": ["她出生在欧洲", "她是一位科学家", "她的研究和化学元素有关"]}, {"zh": "贝多芬", "en": "Ludwig van Beethoven", "aliases": ["路德维希·凡·贝多芬", "Beethoven"], "profile": "德国作曲家，写了《命运交响曲》和第九交响曲里的《欢乐颂》，耳聋后仍坚持作曲。", "hints": ["他出生在欧洲", "他是一位音乐家", "他写过很多交响曲"]}, {"zh": "莫扎特", "en": "Wolfgang Amadeus Mozart", "aliases": ["沃尔夫冈·阿马德乌斯·莫扎特", "Mozart"], "profile": "奥地利作曲家，被称为“音乐神童”，五岁就开始作曲，一生写了六百多部作品。", "hints": ["他出生在欧洲", "他是一位音乐家", "他小时候就很有名"]}, {"zh": "达·芬奇", "en": "Leonardo da Vinci", "aliases": ["达芬奇", "列奥纳多·达·芬奇", "达文西", "Leonardo", "da Vinci"], "profile": "意大利文艺复兴时期的画家和发明家，画了《蒙娜丽莎》和《最后的晚餐》。", "hints": ["他出生在欧洲", "他是一位画家", "他还设计过很多机器"]}, {"zh": "安徒生", "en": "Hans Christian Andersen", "aliases": ["汉斯·克里斯蒂安·安徒生", "Andersen"], "profile": "丹麦作家，写了《丑小鸭》《海的女儿》《卖火柴的小女孩》等童话。", "hints": ["他出生在欧洲", "他是一位作家", "他写的故事适合小朋友"]}, {"zh": "梵高", "en": "Vincent van Gogh", "aliases": ["文森特·梵高", "凡高", "梵谷", "van Gogh"], "profile": "荷兰画家，画了《向日葵》和《星月夜》，画里有浓烈的颜色和旋转的笔触。", "hints": ["他出生在欧洲", "他是一位画家", "他很喜欢用明亮的黄色"]}, {"zh": "华特·迪士尼", "en": "Walt Disney", "aliases": ["迪士尼", "沃尔特·迪士尼", "华特迪士尼", "沃尔特迪士尼", "Disney"], "profile": "美国动画片制作人，和伙伴一起创造了米老鼠，还在美国建起了著名的主题乐园。", "hints": ["他来自北美洲", "他是做动画片的", "他创造过有名的卡通形象"]}, {"zh": "尼尔·阿姆斯特朗", "en": "Neil Armstrong", "aliases": ["阿姆斯特朗", "尼尔阿姆斯特朗", "Armstrong"], "profile": "美国宇航员，1969年乘阿波罗11号飞船登月，是第一个踏上月球的人。", "hints": ["他来自北美洲", "他飞上过太空", "他留下过一个有名的脚印"]}, {"zh": "伊索", "en": "Aesop", "aliases": [], "profile": "相传是古希腊的寓言家，讲过《龟兔赛跑》《狐狸和葡萄》等许多动物寓言。", "hints": ["他生活在很久很久以前", "他很会讲故事", "他的故事里常有小动物"]}, {"zh": "南丁格尔", "en": "Florence Nightingale", "aliases": ["弗洛伦斯·南丁格尔", "提灯女神", "Nightingale"], "profile": "英国护士，被称为“提灯女神”，开创了现代护理事业，国际护士节就在她生日这天。", "hints": ["她出生在欧洲", "她的工作和医院有关", "她照顾过很多受伤的士兵"]}, {"zh": "李小龙", "