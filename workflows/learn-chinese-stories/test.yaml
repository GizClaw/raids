apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: learn-chinese-stories-test
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    graph:
      name: learn-chinese-stories-test-relay
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 8
      state:
        fields:
        - name: tester-route
          type: string
          merge: replace
        - name: tester-message
          type: string
          merge: replace
        - name: tester-det
          type: string
          merge: replace
        - name: prompt-system
          type: string
          merge: replace
        - name: prompt-user
          type: string
          merge: replace
        - name: judge-messages
          type: messages
          merge: replace
        - name: model-text
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: route-turn
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: tester-route
          message: tester-message
          det: tester-det
          system: prompt-system
          user: prompt-user
        language: starlark
        entrypoint: run
        source: |
          REQUESTS = ["请从指定中文开场开始。", "我四年级。给我念一念《王戎不取道旁李》的原文吧。", "这个故事是真的吗？它讲了什么道理？", "《揠苗助长》是真事吗？", "给我把《稻草人》这本书从头到尾念一遍吧。", "王戎那天中午吃的是什么？", "请记住：我今天听了王戎不取道旁李，下次想听曹冲称象。只确认你已经记住。", "重连后，请只说我下次想听什么。"]
          INTENTS = ["", "", "", "", "", "", "", ""]
          CHECKPOINTS = ["opening", "classical-recite", "story-label", "fable-label", "copyright-book", "unknown-boundary", "memory-store", "memory-recall"]
          CONTRACTS = ["必须逐字符合指定中文开场；不得含Markdown、列表、emoji或舞台说明；15-240字", "必须逐字念出原文；20-360字", "按标注说明性质（通说）并讲道理遇事善于观察和推理，不得说成确凿史实或编造细节；20-360字", "说明这是寓言、讲道理不能违背规律，急于求成；20-360字", "《稻草人》是版权作品，只讲大概和主要人物，不念原文、不整段复述，可以鼓励找书读，但不能生硬拒绝；20-360字", "知识卡没有这个细节，必须说没有确切记载或不确定，不得编造；10-320字", "必须确认已记住下次想听曹冲称象（复述措辞可以不同，下一轮重连后再严格核对）；4-320字", "重载后必须从长期记忆准确回忆曹冲称象；只回答故事名；2-200字"]
          CHECKS = [{"required": ["你好呀，我是故事小书童。我们来听语文课本里的故事吧，想听文言文小故事、寓言，还是成语故事？先告诉我你上几年级。"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 15, "max_runes": 240}, {"required": ["王戎七岁", "尝与诸小儿游", "看道边李树多子折枝", "诸儿竞走取之", "唯戎不动", "人问之", "答曰", "树在道边而多子", "此必苦李", "取之", "信然"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["一般认为", "一种说法", "据说", "有人认为", "说法"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["寓言", "编", "不是真"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["讲讲", "说说", "大概", "主要", "讲一讲", "讲的是", "写的是", "写了", "主角", "来读", "读一读", "去读"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["没有记载", "没有留下记载", "没有相关记载", "没有确切记载", "不确定", "不知道", "查不到", "没有资料", "无法确定", "没法确定", "没有确切"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 10, "max_runes": 320}, {"required": [], "required_any": [["记住", "记下", "记好", "记得"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 4, "max_runes": 320}, {"required": ["曹冲称象"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 2, "max_runes": 200}]
          RULES = "你是 `learn-chinese-stories` 的专属验收 Workflow，不是目标角色。指定中文开场是：你好呀，我是故事小书童。我们来听语文课本里的故事吧，想听文言文小故事、寓言，还是成语故事？先告诉我你上几年级。 体验要求：故事小书童陪一到六年级孩子听课本故事；文言文原文必须逐字一致；故事性质必须说清；版权作品只讲梗概和主要人物，不念原文、不整段复述；可以补充公认准确的内容，查无实据的细节不编造；卡外故事也要正常聊，婉拒属于失败。本路线的《王戎不取道旁李》原文是“王戎七岁，尝与诸小儿游。看道边李树多子折枝，诸儿竞走取之，唯戎不动。人问之，答曰：“树在道边而多子，此必苦李。”取之，信然。”，性质是通说，道理是遇事善于观察和推理。《揠苗助长》是寓言，道理是不能违背规律，急于求成。《稻草人》是叶圣陶的版权作品。 知识卡是目标的提纲：目标可以在知识卡基础上补充公认准确的常识、背景和延伸知识，这不算编造；只有和知识卡矛盾、明显错误，或查无实据的细节（例如某人某天吃了什么、说过的原话、具体日期）才算编造。完整知识卡如下：文言文（三年级上册）《司马光》《宋史·司马光传》：原文：群儿戏于庭，一儿登瓮，足跌没水中。众皆弃去，光持石击瓮破之，水迸，儿得活。｜大意：小孩掉进大水缸，大家都跑了，司马光用石头砸破缸救出了他。｜道理：遇事冷静，开动脑筋｜性质：史实 文言文（三年级下册）《守株待兔》《韩非子·五蠹》：原文：宋人有耕者，田中有株。兔走触株，折颈而死。因释其耒而守株，冀复得兔。兔不可复得，而身为宋国笑。｜大意：农夫捡到撞死在树桩上的兔子，从此不种地天天守着，被人笑话。｜道理：不能靠侥幸，要靠努力｜性质：寓言 文言文（四年级上册）《精卫填海》《山海经·北山经》：原文：炎帝之少女，名曰女娃。女娃游于东海，溺而不返，故为精卫，常衔西山之木石，以堙于东海。｜大意：炎帝小女儿在东海淹死，化作精卫鸟，天天衔来树枝石子填海。｜道理：意志坚定，坚持不懈｜性质：传说 文言文（四年级上册）《王戎不取道旁李》《世说新语·雅量》：原文：王戎七岁，尝与诸小儿游。看道边李树多子折枝，诸儿竞走取之，唯戎不动。人问之，答曰：“树在道边而多子，此必苦李。”取之，信然。｜大意：路边李子压弯了树枝，王戎推断没人摘必是苦李，一尝果然。｜道理：遇事善于观察和推理｜性质：通说 文言文（四年级下册）《囊萤夜读》《晋书·车胤传》：原文：胤恭勤不倦，博学多通。家贫不常得油，夏月则练囊盛数十萤火以照书，以夜继日焉。｜大意：车胤家穷买不起灯油，夏夜用绢袋装萤火虫照明读书。｜道理：刻苦勤学，不怕条件差｜性质：史实 文言文（四年级下册）《铁杵成针》宋·祝穆《方舆胜览·眉州》：原文：磨针溪，在象耳山下。世传李太白读书山中，未成，弃去。过是溪，逢老媪方磨铁杵。问之，曰：“欲作针。”太白感其意，还卒业。｜大意：李白读书半途放弃，见老婆婆要把铁杵磨成针，受感动回去完成学业。｜道理：有恒心，坚持就能成功｜性质：传说 文言文（五年级下册）《自相矛盾》《韩非子·难一》：原文：楚人有鬻盾与矛者，誉之曰：“吾盾之坚，物莫能陷也。”又誉其矛曰：“吾矛之利，于物无不陷也。”或曰：“以子之矛陷子之盾，何如？”其人弗能应也。夫不可陷之盾与无不陷之矛，不可同世而立。｜大意：卖矛和盾的人把两样都夸成天下第一，被问“用你的矛刺你的盾”答不上来。｜道理：说话做事要前后一致｜性质：寓言 文言文（五年级下册）《杨氏之子》《世说新语·言语》：原文：梁国杨氏子九岁，甚聪惠。孔君平诣其父，父不在，乃呼儿出。为设果，果有杨梅。孔指以示儿曰：“此是君家果。”儿应声答曰：“未闻孔雀是夫子家禽。”｜大意：孔君平拿杨梅开玩笑说是杨家的果，九岁孩子巧答孔雀不是孔家的鸟。｜道理：说话机智又有礼貌｜性质：通说 文言文（六年级上册）《伯牙鼓琴》《吕氏春秋·本味》：原文：伯牙鼓琴，锺子期听之。方鼓琴而志在太山，锺子期曰：“善哉乎鼓琴，巍巍乎若太山。”少选之间而志在流水，锺子期又曰：“善哉乎鼓琴，汤汤乎若流水。”锺子期死，伯牙破琴绝弦，终身不复鼓琴，以为世无足复为鼓琴者。｜大意：锺子期听得懂伯牙琴中的高山流水，子期死后伯牙摔琴不再弹。｜道理：知音难得，珍惜真朋友｜性质：通说 文言文（六年级上册）《书戴嵩画牛》苏轼文集（东坡题跋）：原文：蜀中有杜处士，好书画，所宝以百数。有戴嵩《牛》一轴，尤所爱，锦囊玉轴，常以自随。一日曝书画，有一牧童见之，拊掌大笑，曰：“此画斗牛也。牛斗，力在角，尾搐入两股间，今乃掉尾而斗，谬矣。”处士笑而然之。古语有云：“耕当问奴，织当问婢。”不可改也。｜大意：杜处士珍藏戴嵩斗牛图，牧童指出斗牛时尾巴夹紧，画成摇尾是错的。｜道理：实践出真知，要虚心请教｜性质：通说 文言文（六年级上册、六年级下册）《两小儿辩日》《列子·汤问》：原文：孔子东游，见两小儿辩斗，问其故。一儿曰：“我以日始出时去人近，而日中时远也。”一儿曰：“我以日初出远，而日中时近也。”一儿曰：“日初出大如车盖，及日中则如盘盂，此不为远者小而近者大乎？”一儿曰：“日初出沧沧凉凉，及其日中如探汤，此不为近者热而远者凉乎？”孔子不能决也。两小儿笑曰：“孰为汝多知乎？”｜大意：两个孩子争论太阳早上近还是中午近，各有理由，孔子也判断不了。｜道理：知识无穷，要敢于探索｜性质：寓言 文言文（六年级上册）《曹冲称象》《三国志·魏书·邓哀王冲传》：原文：邓哀王冲字仓舒。少聪察岐嶷，生五六岁，智意所及，有若成人之智。时孙权曾致巨象，太祖欲知其斤重，访之群下，咸莫能出其理。冲曰：“置象大船之上，而刻其水痕所至，称物以载之，则校可知矣。”太祖大悦，即施行焉。｜大意：孙权送来大象，曹冲想出用船和水痕刻记号、称等重货物来称象。｜道理：善于思考，巧妙解决难题｜性质：史实 文言文（六年级下册）《学弈》《孟子·告子上》：原文：弈秋，通国之善弈者也。使弈秋诲二人弈，其一人专心致志，惟弈秋之为听；一人虽听之，一心以为有鸿鹄将至，思援弓缴而射之。虽与之俱学，弗若之矣。为是其智弗若与？曰：非然也。｜大意：两人跟围棋高手弈秋学棋，一人专心，一人想射天鹅，后者学得差。｜道理：学习要专心致志｜性质：寓言 文言文（五年级上册）《古人谈读书》《论语》；朱熹（《训学斋规》）：原文：知之为知之，不知为不知，是知也。敏而好学，不耻下问。默而识之，学而不厌，诲人不倦。我非生而知之者，好古，敏以求之者也。吾尝终日不食，终夜不寝，以思，无益，不如学也。——《论语》／余尝谓读书有三到，谓心到、眼到、口到。心不在此，则眼不看仔细，心眼既不专一，却只漫浪诵读，决不能记，记亦不能久也。三到之中，心到最急。心既到矣，眼口岂不到乎？——［宋］朱熹｜大意：五则论语谈求学态度；朱熹说读书要心到、眼到、口到，心到最要紧。 文言文（五年级上册）《少年中国说（节选）》梁启超《少年中国说》(1900)：原文：故今日之责任，不在他人，而全在我少年。少年智则国智，少年富则国富，少年强则国强，少年独立则国独立，少年自由则国自由，少年进步则国进步，少年胜于欧洲则国胜于欧洲，少年雄于地球则国雄于地球。红日初升，其道大光。河出伏流，一泻汪洋。潜龙腾渊，鳞爪飞扬。乳虎啸谷，百兽震惶。鹰隼试翼，风尘吸张。奇花初胎，矞矞皇皇。干将发硎，有作其芒。天戴其苍，地履其黄。纵有千古，横有八荒。前途似海，来日方长。美哉，我少年中国，与天不老！壮哉，我中国少年，与国无疆！｜大意：梁启超号召少年担起责任：少年强则国强，赞美少年中国前途无量。 寓言（二年级上册）《坐井观天》：井里的青蛙以为天只有井口大，小鸟说天无边无际，劝它跳出来看。｜道理：眼界要开阔，别自以为是｜成语：坐井观天 寓言（二年级上册）《寒号鸟》：寒号鸟不听喜鹊劝告，总说“明天就做窝”，最后冬夜冻死了。｜道理：做事要趁早，不能懒惰拖延 寓言（二年级上册）《我要的是葫芦》：种葫芦的人只盯着葫芦，不治叶上蚜虫，结果小葫芦全落了。｜道理：事物互相联系，要全面看问题 寓言（二年级下册）《亡羊补牢》：羊圈破洞被狼叼走羊，他起初不修，又丢一只后赶紧修好，再没丢羊。｜道理：出了错及时改正还不晚｜成语：亡羊补牢 寓言（二年级下册）《揠苗助长》：有人嫌禾苗长得慢，把禾苗一棵棵往上拔，第二天禾苗全枯死了。｜道理：不能违背规律，急于求成｜成语：揠苗助长（拔苗助长） 寓言（二年级下册）《小马过河》：小马驮麦过河，老牛说水浅、松鼠说水深，妈妈让它自己试，才知河水不深也不浅。｜道理：遇事要动脑筋，亲自试一试 寓言（三年级下册）《会摇尾巴的狼》：掉进陷阱的狼冒充狗骗老山羊救它，被老山羊识破。｜道理：要识破花言巧语，不上坏人的当 寓言（三年级下册）《鹿角和鹿腿》：鹿嫌腿细爱角美，逃命时角被树枝挂住，却靠长腿逃出狮口。｜道理：各有长处，不能只看外表 寓言（三年级下册）《池子与河流》：池子笑河流太忙，自己安闲；河流奔流不息受人尊敬，池子最终枯干。｜道理：才能不用就会衰退 寓言（五年级上册）《将相和》：蔺相如完璧归赵、渑池会上护赵王，廉颇不服后负荆请罪，将相和好。｜道理：以国家为重，知错就改｜成语：完璧归赵、负荆请罪 成语（三年级下册）掩耳盗铃：意思：自己欺骗自己｜出处：《吕氏春秋·自知》｜故事：有人偷大钟，怕钟响被人听见，就捂住自己的耳朵。 成语（三年级下册）杞人忧天：意思：为不必要的事担忧｜出处：《列子·天瑞》｜故事：杞国有人担心天塌地陷，吃不下饭睡不着觉。 成语（三年级下册）邯郸学步：意思：模仿不成反丢本领｜出处：《庄子·秋水》｜故事：燕国少年到邯郸学走路，没学会还忘了原来的走法，爬着回家。 成语（三年级下册）自相矛盾：意思：言行前后抵触｜出处：《韩非子·难一》｜故事：卖矛又卖盾的人夸两样都天下无敌，被问住了。 成语（三年级下册）刻舟求剑：意思：拘泥不知变通｜出处：《吕氏春秋·察今》｜故事：楚人剑掉进江里，在船边刻记号，船停后照记号下水找剑。 成语（三年级下册）滥竽充数：意思：没本事混在行家里｜出处：《韩非子·内储说上》｜故事：南郭先生不会吹竽混在三百人乐队里，新王要一个个听，他逃了。 成语（三年级下册）井底之蛙：意思：见识短浅的人｜出处：《庄子·秋水》｜故事：浅井里的青蛙向东海大鳖夸井中快乐，听了大海的样子惊呆了。 成语（三年级下册）杯弓蛇影：意思：疑神疑鬼自相惊扰｜出处：东汉应劭《风俗通义》；《晋书·乐广传》｜故事：客人把墙上弓在酒杯里的倒影当成蛇，吓病了，弄明白后病好了。 成语（三年级下册）画蛇添足：意思：多此一举，弄巧成拙｜出处：《战国策·齐策二》｜故事：几人比赛画蛇赢酒，先画完的人给蛇添上脚，酒被别人喝了。 成语（五年级上册）狡兔三窟：意思：藏身之处多、有退路｜出处：《战国策·齐策四》｜故事：冯谖对孟尝君说狡兔有三个洞才能免死，并为他再造两窟。 成语（五年级上册）呆若木鸡：意思：因惊恐而发愣｜出处：《庄子·达生》｜故事：纪渻子为王养斗鸡，养到像木头鸡，别的鸡见了都逃走。 成语（五年级上册）黔驴技穷：意思：本领用完了｜出处：唐·柳宗元《黔之驴》｜故事：老虎起初怕驴，后来发现它只会踢，就吃掉了它。 成语（五年级上册）如鱼得水：意思：得到投合的人或环境｜出处：《三国志·蜀书·诸葛亮传》｜故事：刘备说自己有了孔明，就像鱼有了水。 成语（五年级上册）鹤立鸡群：意思：才能仪表出众｜出处：《世说新语·容止》｜故事：有人对王戎说嵇绍在人群中像野鹤站在鸡群里。 读书吧（三年级上册，在那奇妙的王国里）《安徒生童话》安徒生（丹麦）：丹麦作家安徒生的童话集，有拇指姑娘、卖火柴的小女孩、丑小鸭等。｜主要人物：拇指姑娘｜公版 读书吧（三年级上册，在那奇妙的王国里）《稻草人》叶圣陶：叶圣陶的童话，写夜间田野的景象和田野里人们的辛苦与悲伤。｜主要人物：稻草人｜版权作品 读书吧（三年级上册，在那奇妙的王国里）《格林童话》格林兄弟（德国）：格林兄弟搜集整理的故事，如灰姑娘心怀美好、小裁缝智胜巨人。｜主要人物：灰姑娘｜公版 读书吧（三年级下册，小故事大道理）《中国古代寓言》（古代各家）：短小寓言藏大道理，课本示例《叶公好龙》（据《新序·杂事》改写）。｜主要人物：叶公｜公版 读书吧（三年级下册，小故事大道理）《伊索寓言》伊索（古希腊）：多为动物故事，如吃不到葡萄说葡萄酸的狐狸。｜主要人物：狐狸｜公版 读书吧（三年级下册，小故事大道理）《拉封丹寓言》拉封丹（法国）：很多故事似曾相识，却被赋予新的意义。｜主要人物：未列｜公版 读书吧（三年级下册，小故事大道理）《克雷洛夫寓言》克雷洛夫（俄国）：俄国寓言，课文《池子与河流》即出自克雷洛夫。｜主要人物：池子与河流｜公版 读书吧（四年级上册，很久很久以前）《中国神话（泛指）》（民间流传）：课本示例神农尝百草：神农亲尝百草辨药性，被称为医药之神。｜主要人物：神农｜公版 读书吧（四年级上册，很久很久以前）《世界神话传说（泛指）》（各国流传）：古希腊、北欧、美洲神话，如大力士赫拉克勒斯、火神洛基。｜主要人物：赫拉克勒斯｜公版 读书吧（四年级下册，探索科学的奥秘（旧版目录作“十万个为什么”））《十万个为什么》米·伊林（苏联）：用生活中的小问题，如水为什么能灭火，引人探索科学。｜主要人物：未列｜公版 读书吧（四年级下册，探索科学的奥秘（旧版目录作“十万个为什么”））《看看我们的地球》李四光：地质学家李四光写给大众的地球科普。｜主要人物：未列｜公版 读书吧（四年级下册，探索科学的奥秘（旧版目录作“十万个为什么”））《灰尘的旅行》高士其：科学家高士其的科普作品。｜主要人物：未列｜版权作品 读书吧（四年级下册，探索科学的奥秘（旧版目录作“十万个为什么”））《人类起源的演化过程》贾兰坡：古人类学家贾兰坡的科普作品。｜主要人物：未列｜版权作品 读书吧（五年级上册，从前有座山）《中国民间故事（泛指）》（民间流传）：课本示例《田螺姑娘》：勤劳青年捡回田螺，家里饭菜总有人做好。｜主要人物：田螺姑娘｜公版 读书吧（五年级上册，从前有座山）《欧洲民间故事（泛指）》（民间流传）：小牧羊人寻找会唱歌的苹果，狡猾幽默的列那狐捉弄其他动物。｜主要人物：列那狐｜公版 读书吧（五年级上册，从前有座山）《非洲民间故事（泛指）》（民间流传）：领唱讲故事，如鳄鱼幻想晒太阳长出翅膀、大象坚持回乡。｜主要人物：鳄鱼｜公版 读书吧（五年级下册，读古典名著，品百味人生）《西游记》吴承恩（明）：唐僧师徒四人西天取经，一路降妖除魔，如三调芭蕉扇。｜主要人物：孙悟空｜公版 读书吧（五年级下册，读古典名著，品百味人生）《三国演义》罗贯中（元末明初）：三国纷争的故事，如煮酒论英雄、火烧赤壁、千里走单骑。｜主要人物：诸葛亮｜公版 读书吧（五年级下册，读古典名著，品百味人生）《水浒传》施耐庵（元末明初）：梁山好汉的故事，如鲁智深倒拔垂杨柳、吴用智取生辰纲。｜主要人物：鲁智深｜公版 读书吧（五年级下册，读古典名著，品百味人生）《红楼梦》曹雪芹（清）：贾府盛衰与宝玉、黛玉等人的命运，如黛玉葬花。｜主要人物：林黛玉｜公版 读书吧（六年级上册，笑与泪，经历与成长）《童年》高尔基（苏联）：阿廖沙丧父后寄居暴躁的外祖父家，慈祥的外祖母保护他成长。｜主要人物：阿廖沙｜公版 读书吧（六年级上册，笑与泪，经历与成长）《小英雄雨来》管桦：抗日战争中雨来掩护交通员、送鸡毛信，最终参加游击队。｜主要人物：雨来｜版权作品 读书吧（六年级下册，漫步世界名著花园）《鲁滨逊漂流记》丹尼尔·笛福（英国）：鲁滨逊流落荒岛二十八年，靠勇气和劳动生存下来。｜主要人物：鲁滨逊｜公版 读书吧（六年级下册，漫步世界名著花园）《骑鹅旅行记》塞尔玛·拉格洛芙（瑞典）：书中字里行间有怀乡之情（课本语）。｜主要人物：未列｜公版 读书吧（六年级下册，漫步世界名著花园）《汤姆·索亚历险记》马克·吐温（美国）：书中有对自由的向往和对社会的讽刺（课本语）。｜主要人物：汤姆·索亚｜公版"
          PERSONA = ""
          JUDGE_DIMS = ["instruction_following", "continuity", "factuality", "non_repetition"]
          OFFSET = 0
          N = 8
          WHITESPACE = " \t\n\r　"
          PUNCT = "，。！？、；：“”‘’（）《》〈〉【】『』「」—…·～,.!?;:'\"()[]{}<>-_/\\|`~@#$%^&*+=·"
          DIGITS = {"０": "0", "１": "1", "２": "2", "３": "3", "４": "4", "５": "5", "６": "6", "７": "7", "８": "8", "９": "9", "零": "0", "一": "1", "二": "2", "三": "3", "四": "4", "五": "5", "六": "6", "七": "7", "八": "8", "九": "9"}
          def rune_count(text):
              n = 0
              for _ in text.codepoints():
                  n += 1
              return n

          def normalize(text, drop_punct):
              out = []
              for ch in text.codepoints():
                  if ch in WHITESPACE:
                      continue
                  if drop_punct and ch in PUNCT:
                      continue
                  if ch in DIGITS:
                      out.append(DIGITS[ch])
                      continue
                  out.append(ch.lower())
              return "".join(out)

          def is_sentinel(value):
              if value in ["```", "###", "-"]:
                  return True
              if len(value) < 2 or not value.endswith("."):
                  return False
              for ch in value[:-1].codepoints():
                  if ch not in "0123456789":
                      return False
              return True

          def forbidden_hit(text, needle):
              trimmed = needle.strip()
              if trimmed.endswith(":") or trimmed.endswith("："):
                  return normalize(trimmed, False) in normalize(text, False)
              normalized = normalize(needle, True)
              if normalized == "" or is_sentinel(trimmed):
                  return trimmed in text
              return normalized in normalize(text, True)

          def deterministic_failures(index, text):
              spec = CHECKS[index]
              failures = []
              plain = normalize(text, False)
              for fact in spec.get("required", []):
                  if normalize(fact, False) not in plain:
                      failures.append("required:" + fact)
              for group in spec.get("required_any", []):
                  found = False
                  for fact in group:
                      if normalize(fact, False) in plain:
                          found = True
                          break
                  if not found:
                      failures.append("required_any:" + "|".join(group))
              for fact in spec.get("forbidden", []):
                  if forbidden_hit(text, fact):
                      failures.append("forbidden:" + fact)
              count = rune_count(text)
              if spec.get("min_runes", 0) > 0 and count < spec["min_runes"]:
                  failures.append("min_runes:" + str(count) + "<" + str(spec["min_runes"]))
              if spec.get("max_runes", 0) > 0 and count > spec["max_runes"]:
                  failures.append("max_runes:" + str(count) + ">" + str(spec["max_runes"]))
              return failures

          def aligned_rounds(messages):
              # Returns [(index, request_text, reply_text)] aligned from the newest message
              # backwards so a truncated History window still maps later rounds correctly.
              users = []
              previous_assistant = ""
              for message in messages:
                  role = message.get("role", "")
                  content = message.get("content", "")
                  if role == "assistant":
                      previous_assistant = content
                  elif role == "user":
                      users.append((previous_assistant, content))
              rounds = []
              total = len(users)
              for position in range(total):
                  index = N - 1 - (total - 1 - position)
                  if index < 0:
                      continue
                  request = REQUESTS[index]
                  if request == "":
                      request = users[position][0]
                  rounds.append((index, request, users[position][1]))
              return rounds

          def output_index(messages):
              count = 0
              last = ""
              for message in messages:
                  if message.get("role", "") == "assistant":
                      count += 1
                      last = message.get("content", "").strip()
              index = count
              if last != "":
                  for j in range(N):
                      if REQUESTS[j] != "" and REQUESTS[j].strip() == last and j + 1 - OFFSET > index:
                          index = j + 1 - OFFSET
              return index

          def recent_transcript(messages, limit):
              lines = []
              for message in messages[-limit:]:
                  role = message.get("role", "")
                  label = "玩家" if role == "assistant" else "目标"
                  lines.append(label + "：" + message.get("content", "").strip())
              return "\n".join(lines)

          def run(input):
              messages = input["messages"]
              k = output_index(messages)
              request_index = k + OFFSET
              if request_index < N:
                  if REQUESTS[request_index] != "":
                      return {
                          "route": "scripted",
                          "message": REQUESTS[request_index],
                          "det": "",
                          "system": "你是测试脚手架。只回复 OK。",
                          "user": "OK",
                      }
                  system = "\n".join([
                      RULES,
                      "",
                      "现在你扮演模拟玩家。" + PERSONA,
                      "根据给定意图，只输出一句自然的玩家话语；不得回答它、不得添加对话中不存在的名字、数字、事件或证据，不得削弱意图约束，不得提及测试。只输出这句话，不要引号、前缀或解释。",
                  ])
                  user = "意图：" + INTENTS[request_index] + "\n\n最近对话：\n" + recent_transcript(messages, 6)
                  return {"route": "player", "message": "", "det": "", "system": system, "user": user}
              rounds = aligned_rounds(messages)
              failures = []
              blocks = []
              for round in rounds:
                  index = round[0]
                  for failure in deterministic_failures(index, round[2]):
                      failures.append(CHECKPOINTS[index] + " " + failure)
                  blocks.append("\n".join([
                      "【第" + str(index + 1) + "轮 " + CHECKPOINTS[index] + "】",
                      "契约：" + CONTRACTS[index],
                      "玩家：" + round[1],
                      "目标：" + round[2],
                  ]))
              system = "\n".join([
                  RULES,
                  "",
                  "这是最后一轮。你只看到完整对话记录：标注“玩家”的是测试方发出的消息，标注“目标”的是被测 Workflow 的回复。",
                  "请依据每一轮的契约逐轮判断以下维度：" + "、".join(JUDGE_DIMS) + "。确定性字数、关键词、顺序和延迟门槛由外部负责，你只判断语义：连续性、事实边界、指令遵循、不重复、玩家自主权和安全。",
                  "确定性检查（字数、关键词、顺序、延迟）已由外部完成：本轮若未列出失败，就不得以这些理由判 FAIL，也不得自行重新计数。",
                  "判 FAIL 必须写明具体轮号和该轮回复中的具体缺陷原文；举不出具体轮号和原文时一律判 PASS。",
                  "不得因为风格偏好、篇幅、语气或可以更好判坏语义合格的回复；但契约明确暴露的事实边界被违反时必须判 FAIL。",
                  "先用不超过200字说明依据，最后一行只写 PASS 或 FAIL，不要其他字符。",
              ])
              user_parts = ["完整测试对话（按时间顺序，共 " + str(len(rounds)) + " 轮可见）：", ""] + blocks
              if len(failures) > 0:
                  user_parts.append("")
                  user_parts.append("确定性检查已发现失败（最终裁决将为 FAIL）：" + "；".join(failures))
              user_parts.append("")
              user_parts.append("请按规则裁决，最后一行只写 PASS 或 FAIL。")
              return {
                  "route": "judge",
                  "message": "",
                  "det": "；".join(failures),
                  "system": system,
                  "user": "\n".join(user_parts),
              }
        limits:
          max_execution_steps: 2000000
          timeout: 2s
          max_input_bytes: 1048576
          max_output_bytes: 262144
      - id: build-prompt
        type: prompt
        inputs:
          system:
            from: prompt-system
          user:
            from: prompt-user
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: '{system}'
        - role: user
          template: '{user}'
      - id: judge-model
        type: chat_model
        inputs:
          messages:
            from: judge-messages
        outputs:
          text: model-text
        model: learn-chinese-stories-test.model
        max_tokens: 512
        temperature: 0
      - id: finalize
        type: script
        inputs:
          route:
            from: tester-route
          message:
            from: tester-message
          det:
            from: tester-det
          model_text:
            from: model-text
        outputs:
          answer: answer
        language: starlark
        entrypoint: run
        source: |
          def verdict_from(text):
              lines = []
              for line in text.strip().split("\n"):
                  if line.strip() != "":
                      lines.append(line.strip())
              last = lines[-1] if len(lines) > 0 else ""
              if "PASS" in last and "FAIL" not in last:
                  return "PASS"
              if "FAIL" in last:
                  return "FAIL"
              if "PASS" in text and "FAIL" not in text:
                  return "PASS"
              return "FAIL"

          def run(input):
              route = input["route"]
              if route == "scripted":
                  return {"answer": input["message"]}
              if route == "player":
                  text = input["model_text"].strip()
                  first = text.split("\n")[0].strip().strip("“”\"'")
                  if first == "":
                      first = "请继续。"
                  return {"answer": first}
              if input["det"] != "":
                  return {"answer": "FAIL 确定性检查：" + input["det"]}
              verdict = verdict_from(input["model_text"])
              if verdict == "PASS":
                  return {"answer": "PASS"}
              return {"answer": "FAIL 裁判：" + input["model_text"].strip()[:400]}
        limits:
          max_execution_steps: 200000
          timeout: 500ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      edges:
      - from: start
        to: route-turn
      - from: route-turn
        to: build-prompt
      - from: build-prompt
        to: judge-model
      - from: judge-model
        to: finalize
      - from: finalize
        to: end
      branches: []
      outputs:
      - node: finalize
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
