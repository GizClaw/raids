": [], "profile": "直线上一点和它一旁的部分，只有一个端点，向一方无限延伸。", "hints": ["它是一种几何图形", "它只有一个端点", "它像手电筒照出的光"]}, {"zh": "对顶角", "en": "vertical angles", "aliases": [], "profile": "两条直线相交时，位置相对、共用一个顶点的两个角，它们总是相等。", "hints": ["它和角有关", "它总是成对出现", "它的两个角大小一样"]}, {"zh": "角平分线", "en": "angle bisector", "aliases": [], "profile": "从角的顶点出发，把一个角分成两个相等部分的射线。", "hints": ["它和角有关", "它是一条射线", "它把角平均分开"]}, {"zh": "补角", "en": "supplementary angle", "aliases": [], "profile": "两个角加起来正好是180度时，这两个角互为这种角。", "hints": ["它和角有关", "它总是成对出现", "它们合起来是一个平角"]}]}, {"title_zh": "几何建筑师", "title_en": "Geometry Architect", "step": 5, "offset": 0, "items": [{"zh": "勾股定理", "en": "Pythagorean theorem", "aliases": ["毕达哥拉斯定理", "商高定理"], "profile": "直角三角形两条直角边的平方和，等于斜边的平方。", "hints": ["它是一个定理", "它和直角三角形有关", "它和三条边的平方有关"]}, {"zh": "无理数", "en": "irrational number", "aliases": [], "profile": "无限不循环的小数，不能写成两个整数之比，比如圆周率。", "hints": ["它是一类数", "它的小数写不完", "它不能写成分数"]}, {"zh": "平方根", "en": "square root", "aliases": [], "profile": "如果一个数自己乘自己等于a，这个数就叫a的它，比如3和负3都是9的它。", "hints": ["它是一个数", "它和平方有关", "它的符号像个钩子"]}, {"zh": "实数", "en": "real number", "aliases": [], "profile": "有理数和无理数的统称，每一个都能在数轴上找到一个点。", "hints": ["它是一类数", "它能在数轴上找到位置", "它包括有理数和无理数"]}, {"zh": "平面直角坐标系", "en": "Cartesian coordinate system", "aliases": ["直角坐标系", "坐标系"], "profile": "由两条互相垂直、原点重合的数轴组成，用一对数确定平面上点的位置。", "hints": ["它和位置有关", "它有两条数轴", "它用一对数表示点"]}, {"zh": "全等三角形", "en": "congruent triangles", "aliases": [], "profile": "形状和大小都完全一样、叠在一起能完全重合的两个三角形。", "hints": ["它和三角形有关", "它总是成对出现", "它们能完全重合"]}, {"zh": "等腰三角形", "en": "isosceles triangle", "aliases": [], "profile": "有两条边相等的三角形，它的两个底角也相等。", "hints": ["它是一种三角形", "它有两条边一样长", "它左右对称"]}, {"zh": "等边三角形", "en": "equilateral triangle", "aliases": ["正三角形"], "profile": "三条边都相等的三角形，三个角都是60度。", "hints": ["它是一种三角形", "它的三条边一样长", "它的每个角都是60度"]}, {"zh": "中位数", "en": "median", "aliases": [], "profile": "把一组数据从小到大排好后，正中间的那个数。", "hints": ["它和统计有关", "它需要先排序", "它在正中间"]}, {"zh": "众数", "en": "mode", "aliases": [], "profile": "一组数据中出现次数最多的那个数。", "hints": ["它和统计有关", "它和出现次数有关", "它是出现最多的那个"]}, {"zh": "二元一次方程组", "en": "system of linear equations", "aliases": [], "profile": "由两个含两个未知数的一次方程组成的方程组，通常能求出唯一一组解。", "hints": ["它不止一个等式", "它有两个未知数", "它能解鸡兔同笼问题"]}, {"zh": "不等式", "en": "inequality", "aliases": [], "profile": "用大于号、小于号等不等号连接的式子，比如x大于3。", "hints": ["它是一种式子", "它和比较大小有关", "它常用大于号或小于号"]}, {"zh": "因式分解", "en": "factorization", "aliases": ["分解因式"], "profile": "把一个多项式变成几个整式相乘形式的变形方法。", "hints": ["它是一种变形", "它和乘法方向相反", "它和多项式有关"]}, {"zh": "多边形", "en": "polygon", "aliases": [], "profile": "由三条或更多条线段首尾相连围成的平面图形，比如三角形、五边形。", "hints": ["它是一种平面图形", "它的边都是直的", "它的边至少有三条"]}]}, {"title_zh": "函数魔法师", "title_en": "Function Wizard", "step": 5, "offset": 0, "items": [{"zh": "函数", "en": "function", "aliases": [], "profile": "两个变量之间的一种对应关系，一个量变化时，另一个量随之确定地变化。", "hints": ["它和变化有关", "它说的是两个量的关系", "它可以画成图像"]}, {"zh": "一次函数", "en": "linear function", "aliases": [], "profile": "形如y等于kx加b、k不为0的函数，它的图像是一条直线。", "hints": ["它是一种函数", "它的图像是直的", "它的式子里x没有平方"]}, {"zh": "反比例函数", "en": "inverse proportion function", "aliases": [], "profile": "形如y等于k除以x、k不为0的函数，它的图像是双曲线。", "hints": ["它是一种函数", "它的图像有两支", "它让一个量越大另一个越小"]}, {"zh": "二次函数", "en": "quadratic function", "aliases": [], "profile": "形如y等于ax平方加bx加c、a不为0的函数，图像是抛物线。", "hints": ["它是一种函数", "它的图像是弯的", "它的式子里有平方"]}, {"zh": "抛物线", "en": "parabola", "aliases": [], "profile": "像投出的篮球在空中划过的弯曲路线，也是二次函数的图像。", "hints": ["它是一条曲线", "它是左右对称的", "它像扔出的球飞过的路线"]}, {"zh": "一元二次方程", "en": "quadratic equation", "aliases": [], "profile": "只含一个未知数、未知数最高次数是2的整式方程。", "hints": ["它是一种方程", "它只有一个未知数", "它的未知数有平方"]}, {"zh": "相似三角形", "en": "similar triangles", "aliases": [], "profile": "形状相同、大小可以不同的两个三角形，对应角相等，对应边成比例。", "hints": ["它和三角形有关", "它总是成对出现", "它们形状一样大小不同"]}, {"zh": "切线", "en": "tangent line", "aliases": [], "profile": "和圆只有一个公共点的直线，它和过那个点的半径互相垂直。", "hints": ["它是一条直线", "它和圆有关", "它只碰到圆的一个点"]}, {"zh": "正弦", "en": "sine", "aliases": ["sin"], "profile": "直角三角形里，一个锐角的对边和斜边的比值。", "hints": ["它和三角形有关", "它和角的大小有关", "它和对边、斜边有关"]}, {"zh": "概率", "en": "probability", "aliases": ["可能性"], "profile": "表示一件事情发生的可能有多大的数，在0到1之间。", "hints": ["它和随机事件有关", "它的值在0到1之间", "它和抛硬币有关"]}, {"zh": "方差", "en": "variance", "aliases": [], "profile": "衡量一组数据波动大小的量，它越大说明数据越分散。", "hints": ["它和统计有关", "它和平均数有关", "它越小数据越稳定"]}, {"zh": "黄金分割", "en": "golden ratio", "aliases": ["黄金比", "黄金比例"], "profile": "把一条线段分成两段，使较长段与全长之比约为0.618的分法，被认为特别好看。", "hints": ["它和比例有关", "它被认为很美", "它常用在绘画和建筑里"]}, {"zh": "中心对称", "en": "point symmetry", "aliases": ["中心对称图形"], "profile": "一个图形绕某一点旋转180度后，能和原来的图形完全重合的特点。", "hints": ["它和图形有关", "它要转半圈", "它围绕一个点"]}, {"zh": "三视图", "en": "three views", "aliases": [], "profile": "从正面、左面和上面观察同一个物体画出的三张图。", "hints": ["它和立体图形有关", "它由几张图组成", "它从不同方向看物体"]}]}, {"title_zh": "数学研究员", "title_en": "Math Researcher", "step": 7, "offset": 0, "items": [{"zh": "集合", "en": "set", "aliases": [], "profile": "把一些确定的、不同的对象放在一起看成一个整体，比如全班同学。", "hints": ["它和分类有关", "它把东西放在一起", "它里面的东西叫元素"]}, {"zh": "对数", "en": "logarithm", "aliases": [], "profile": "乘方的逆运算，如果10的2次方等于100，那么以10为底100的它就是2。", "hints": ["它是一种运算", "它和乘方有关", "它能把乘法变成加法"]}, {"zh": "指数函数", "en": "exponential function", "aliases": [], "profile": "形如y等于a的x次方的函数，a大于0且不等于1，能增长或衰减得非常快。", "hints": ["它是一种函数", "它的变量在右上角", "它能增长得非常快"]}, {"zh": "向量", "en": "vector", "aliases": ["矢量"], "profile": "既有大小又有方向的量，常画成一条带箭头的线段。", "hints": ["它和方向有关", "它有大小", "它常画成箭头"]}, {"zh": "等差数列", "en": "arithmetic sequence", "aliases": [], "profile": "从第二项起，每一项减去前一项的差都相同的一列数，比如1、3、5、7。", "hints": ["它是一列数", "它和相邻两项的差有关", "它每次增加同样多"]}, {"zh": "等比数列", "en": "geometric sequence", "aliases": [], "profile": "从第二项起，每一项与前一项的比都相同的一列数，比如1、2、4、8。", "hints": ["它是一列数", "它和相邻两项的比有关", "它常常成倍增长"]}, {"zh": "排列组合", "en": "permutations and combinations", "aliases": ["排列与组合"], "profile": "计算从一些东西里选出几个，按顺序或不按顺序各有多少种方法的计数方法。", "hints": ["它和计数有关", "它和挑选东西有关", "它要考虑顺序"]}, {"zh": "双曲线", "en": "hyperbola", "aliases": [], "profile": "由两支分开的曲线组成，平面上到两个定点距离之差不变的点形成它。", "hints": ["它是一种曲线", "它由两部分组成", "它和反比例函数有关"]}, {"zh": "弧度", "en": "radian", "aliases": ["弧度制"], "profile": "用弧长等于半径时的圆心角作为1个单位来度量角，180度等于π个它。", "hints": ["它是一个单位", "它用来量角", "它和半径有关"]}, {"zh": "标准差", "en": "standard deviation", "aliases": ["均方差"], "profile": "方差的算术平方根，用来衡量一组数据的分散程度。", "hints": ["它和统计有关", "它能衡量数据的分散", "它和方差有关"]}, {"zh": "阶乘", "en": "factorial", "aliases": [], "profile": "从1一直乘到n的连乘积，用n后面加感叹号表示，比如3的它是6。", "hints": ["它是一种运算", "它要连着乘", "它的符号是感叹号"]}, {"zh": "二进制", "en": "binary", "aliases": ["二进位制"], "profile": "只用0和1两个数字、逢二进一的记数方法，电脑内部就用它。", "hints": ["它是一种记数方法", "它只用两个数字", "它和电脑有关"]}, {"zh": "余弦定理", "en": "law of cosines", "aliases": [], "profile": "三角形中任一边的平方，等于另两边平方和减去这两边与夹角余弦乘积的两倍。", "hints": ["它是一个定理", "它和三角形有关", "它能由两边和夹角求第三边"]}]}, {"title_zh": "数学大师", "title_en": "Math Master", "step": 7, "offset": 0, "items": [{"zh": "导数", "en": "derivative", "aliases": ["微商"], "profile": "描述一个函数在某一点变化快慢的量，也就是瞬时变化率。", "hints": ["它和变化快慢有关", "它和切线有关", "它是微积分的一部分"]}, {"zh": "虚数", "en": "imaginary number", "aliases": [], "profile": "像3i、1+2i这样带着i的数，i的平方等于负1，这种数不在数轴上。", "hints": ["它是一类数", "它不在数轴上", "它离不开一个特殊的字母"]}, {"zh": "复数", "en": "complex number", "aliases": [], "profile": "由实数部分和虚数部分组成的数，形如a加bi。", "hints": ["它是一类数", "它由两部分组成", "它能在平面上表示"]}, {"zh": "极限", "en": "limit", "aliases": [], "profile": "一个量无限接近某个确定值的过程和结果，是微积分的基础。", "hints": ["它和无限有关", "它是微积分的基础", "它说的是越来越接近"]}, {"zh": "数学归纳法", "en": "mathematical induction", "aliases": ["归纳法"], "profile": "先证明第一步成立，再证明每一步成立都能推出下一步成立的证明方法。", "hints": ["它是一种证明方法", "它和正整数有关", "它像推倒多米诺骨牌"]}, {"zh": "二项式定理", "en": "binomial theorem", "aliases": [], "profile": "给出两个数的和的任意正整数次方展开式的定理。", "hints": ["它是一个定理", "它和乘方展开有关", "它的系数排成三角形"]}, {"zh": "正态分布", "en": "normal distribution", "aliases": ["高斯分布"], "profile": "中间高、两边低、左右对称的钟形分布，很多自然数据都符合它。", "hints": ["它和统计有关", "它的图像像一口钟", "它左右对称"]}, {"zh": "杨辉三角", "en": "Pascal's triangle", "aliases": ["帕斯卡三角形", "贾宪三角"], "profile": "把数排成三角形的数表，每个数等于它上方两个数之和。", "hints": ["它是一张数表", "它排成三角形", "它的两条边上都是1"]}, {"zh": "矩阵", "en": "matrix", "aliases": [], "profile": "把数排成横行竖列的长方形数表，在电脑图像和数据计算中很常用。", "hints": ["它是一张数表", "它有行也有列", "它常用于电脑图像"]}, {"zh": "自然常数", "en": "Euler's number", "aliases": ["欧拉数", "自然对数的底数"], "profile": "约等于2.718的无理数，在描述自然增长和复利时会自然出现。", "hints": ["它是一个数", "它的小数写不完", "它和复利增长有关"]}, {"zh": "斐波那契数列", "en": "Fibonacci sequence", "aliases": ["兔子数列"], "profile": "从1、1开始，每个数都等于前两个数之和的数列，比如1、1、2、3、5、8。", "hints": ["它是一列数", "它和前两个数的和有关", "它在向日葵上能找到"]}, {"zh": "反证法", "en": "proof by contradiction", "aliases": ["归谬法"], "profile": "先假设要证明的结论不成立，推出矛盾，从而说明结论成立的证明方法。", "hints": ["它是一种证明方法", "它先做一个假设", "它要推出矛盾"]}, {"zh": "无穷大", "en": "infinity", "aliases": ["无穷", "无限大"], "profile": "比任何数都大、没有尽头的概念，符号像一个横着的8。", "hints": ["它没有尽头", "它比任何数都大", "它的符号像横着的8"]}]}, {"title_zh": "无穷解谜者", "title_en": "Infinity Puzzle Solver", "step": 7, "offset": 0, "items": [{"zh": "积分", "en": "integral", "aliases": ["定积分"], "profile": "高等数学里求曲线下方面积等累积量的运算，和求导数互为逆运算。", "hints": ["它是一种运算", "它能求曲线下的面积", "它和导数正好相反"]}, {"zh": "欧拉恒等式", "en": "Euler's identity", "aliases": ["欧拉公式"], "profile": "把e、i、π、1和0这五个重要的数连在一个等式里，被称为最美的数学公式。", "hints": ["它是一个等式", "它包含五个重要的数", "它被称为最美的公式"]}, {"zh": "费马大定理", "en": "Fermat's Last Theorem", "aliases": ["费马最后定理"], "profile": "说n大于2时，x的n次方加y的n次方等于z的n次方没有正整数解的定理。", "hints": ["它是一个定理", "它和整数方程有关", "它等了三百多年才被证明"]}, {"zh": "哥德巴赫猜想", "en": "Goldbach's conjecture", "aliases": [], "profile": "猜想每个大于2的偶数都能写成两个质数之和，至今还没有被证明。", "hints": ["它还没被证明", "它和质数有关", "它和偶数有关"]}, {"zh": "黎曼猜想", "en": "Riemann hypothesis", "aliases": ["黎曼假设"], "profile": "关于质数分布规律的著名猜想，是千禧年七大数学难题之一，至今未被证明。", "hints": ["它还没被证明", "它和质数有关", "它有百万美元的奖金"]}, {"zh": "四色定理", "en": "four color theorem", "aliases": ["四色猜想", "四色问题"], "profile": "任何地图只用四种颜色涂色，就能让相邻的区域颜色都不相同。", "hints": ["它是一个定理", "它和颜色有关", "它和地图有关"]}, {"zh": "莫比乌斯带", "en": "Möbius strip", "aliases": ["莫比乌斯环", "Mobius strip"], "profile": "把纸条扭转半圈后首尾粘起来，得到的只有一个面、一条边的曲面。", "hints": ["它可以用纸条做", "它只有一个面", "它需要扭转半圈"]}, {"zh": "克莱因瓶", "en": "Klein bottle", "aliases": [], "profile": "一种没有里外之分的神奇曲面，在我们的三维空间里无法完整做出来。", "hints": ["它是一种曲面", "它没有里外之分", "它的样子像个瓶子"]}, {"zh": "分形", "en": "fractal", "aliases": ["碎形"], "profile": "局部和整体形状相似、不断放大也能看到相同花纹的几何图形。", "hints": ["它是一种形状", "它的局部像整体", "它在雪花上能找到"]}, {"zh": "拓扑学", "en": "topology", "aliases": ["拓扑"], "profile": "研究图形在拉伸、弯曲但不撕破时，哪些性质保持不变的数学分支。", "hints": ["它是一个数学分支", "它研究图形", "它把杯子和甜甜圈看成一样"]}, {"zh": "哥德尔不完备定理", "en": "Gödel's incompleteness theorems", "aliases": ["不完备定理", "哥德尔定理", "不完全性定理"], "profile": "证明任何足够复杂的数学系统里，总有真命题无法在系统内被证明的定理。", "hints": ["它是一个定理", "它和证明有关", "它说有些事证明不了"]}, {"zh": "超越数", "en": "transcendental number", "aliases": [], "profile": "不是任何整系数多项式方程的根的数，比如圆周率和自然常数。", "hints": ["它是一类数", "它的小数写不完", "它包括圆周率"]}]}]}
