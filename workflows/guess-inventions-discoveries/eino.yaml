          def compact(text):
              out = []
              for ch in text.lower().codepoints():
                  if ch in DROP:
                      continue
                  out.append(ch)
              return "".join(out)

          def has_cjk(text):
              for ch in text.codepoints():
                  code = ord(ch)
                  if code >= 19968 and code <= 40959:
                      return True
              return False

          def has_latin(text):
              for ch in text.codepoints():
                  if ch in LATIN:
                      return True
              return False

          def pick_lang(text, previous):
              if has_cjk(text):
                  return "zh"
              if has_latin(text):
                  return "en"
              if previous != "":
                  return previous
              return "zh"

          def read_int(chars, start):
              i = start
              for ch in chars[start:]:
                  if ch in SPACES:
                      i += 1
                  else:
                      break
              value = 0
              count = 0
              for ch in chars[i:]:
                  if ch in DIGITS:
                      value = value * 10 + DIGITS[ch]
                      count += 1
                  else:
                      break
              if count > 0:
                  return [value, i + count]
              seq = []
              for ch in chars[i:]:
                  if ch in CN_NUM or ch == "十":
                      seq.append(ch)
                  else:
                      break
              if len(seq) == 0:
                  return [-1, i]
              if "十" in seq:
                  pos = seq.index("十")
                  tens = 1
                  if pos > 0:
                      tens = CN_NUM.get(seq[pos - 1], 1)
                  ones = 0
                  if pos + 1 < len(seq):
                      ones = CN_NUM.get(seq[pos + 1], 0)
                  return [tens * 10 + ones, i + len(seq)]
              return [CN_NUM[seq[0]], i + len(seq)]

          def numbers_after(content, prefix, suffix):
              found = []
              chars = list(content.codepoints())
              pchars = list(prefix.codepoints())
              schars = list(suffix.codepoints())
              plen = len(pchars)
              for i in range(len(chars)):
                  if chars[i:i + plen] != pchars:
                      continue
                  got = read_int(chars, i + plen)
                  if got[0] < 0:
                      continue
                  j = got[1]
                  for ch in chars[j:]:
                      if ch in SPACES:
                          j += 1
                      else:
                          break
                  if len(schars) == 0 or chars[j:j + len(schars)] == schars:
                      found.append(got[0])
              return found

