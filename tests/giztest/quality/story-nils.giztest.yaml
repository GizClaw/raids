# workflows/story-nils/README.md: 角色表：narrator 旁白（别名 旁白/narrator），只在第1、2、3、4章在场，只述可见事实，不代演角色；nils 尼尔斯（别名 尼尔斯/nils），只在第1、2、3、4章在场，想学会照顾伙伴；天真直接，第1章观察风向；akka 阿卡（别名 阿卡/akka），只在第1、2、3、4章在场，想让雁群平安迁徙；和蔼沉稳，第1章比较休息地；morten 莫顿（别名 莫顿/morten），只在第1、2、3、4章在场，想证明自己能跟上队伍；清爽热心，第1章载着尼尔斯，第2章承认疲惫并接受轮换；smirre 斯密尔（别名 斯密尔/smirre），只在第2章在场，想寻找食物；理性谨慎，第2章在湿地岸边提出自己的觅食需求，与雁群商量保持距离；不追随北方雁群，不知空中经历。所有角色只说亲历或已公开信息，不知他人私密想法及未来结果。每章比较至少两种立场，不要求全员发声。章节行动属于本仓库儿童互动原创改编，不等同原典情节。
# workflows/story-nils/README.md: 点名示例：“请让尼尔斯说说”；“不要让尼尔斯说话，请让阿卡说说”；“请让阿卡说说，再让尼尔斯说说”只选文本顺序首个在场者。只说“尼尔斯”或“我支持尼尔斯”算玩家选择。开场、转场（含阻塞）、更正、安全管理优先旁白，未在场角色不可点名，旧记忆 active_roles 按章节重建。
# workflows/story-nils/README.md: 两份 roles Giztest 各有 5 个隔离 Workspace，后续角色先完成真实章节前置；检查 text/audio EOS、audio_bytes > 0，首响应保持文本 2s、音频 3s。保留 16 轮 relay、reload、更正、转场与 RealTime 用例；routing-cases.json 执行真实 JS 和 Starlark。离线门禁不证明实际音色正确，运行时 Voice ID 日志与试听仍需在线验收。
version: gizclaw.test/v1alpha1
name: quality.story-nils
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-story-nils long-form-story
  flowcraft_contracts_verdict:
    direction: output
    type: string
  eino_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-story-nils long-form-story
  eino_contracts_verdict:
    direction: output
    type: string
  flowcraft_transitions_workspace:
    direction: input
    type: string
    generate: token
  eino_transitions_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_nils_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_akka_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_morten_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_smirre_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_nils_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_akka_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_morten_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_smirre_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_routing_workspace:
    direction: input
    type: string
    generate: token
  eino_routing_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 332m
steps:
- id: register_flowcraft
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_flowcraft_tester
  client: flowcraft_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino
  client: eino
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino_tester
  client: eino_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_contracts_stop_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_contracts_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_candidate_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-nils
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_create_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_tester_workspace}"
      collection: raidtest-testers
      workflow_name: story-nils-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_select_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_candidate_workspace}"
- id: flowcraft_contracts_warmup_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_contracts_select_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_tester_workspace}"
- id: flowcraft_contracts_relay_responses_1_8
  timeout: 32m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${flowcraft_contracts_test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 17
    terminal_client: flowcraft_tester
  expect:
    "/terminal/client":
      equals: flowcraft_tester
    "/terminal/text":
      pattern: "^\\s*CHECKPOINT PASS\\s*$"
    "/completed_turns":
      equals: 17
    "/turns/flowcraft/count":
      equals: 8
    "/turns/flowcraft_tester/count":
      equals: 9
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 4
    "/turns/flowcraft/text_runes/max":
      maximum: 360
- id: flowcraft_contracts_recall_barrier
  client: flowcraft
  rpc:
    method: server.run.workspace.recall
    request:
      query: 月光七码
  timeout: 60s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: flowcraft_contracts_reload_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_contracts_relay_responses_9_16
  timeout: 32m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: CONTINUE 8
    media: text
    idle_timeout: 90s
    max_turns: 17
    terminal_client: flowcraft_tester
  capture:
    flowcraft_contracts_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 17
    "/turns/flowcraft/count":
      equals: 8
    "/turns/flowcraft_tester/count":
      equals: 9
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 4
