    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      not_contains:
      - 海洋生物学家说
      - 海洋生物学家：
- id: probe_biologist_first_response
  client: biologist
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让海洋生物学家亲自回应。
    completion: first_response
