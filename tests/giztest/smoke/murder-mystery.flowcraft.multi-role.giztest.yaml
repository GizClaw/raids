- id: flowcraft_multi_role_probe_heir
  client: flowcraft_multi_role
  timeout: 2m
  peer_stream:
    mode: text
    input: 我去找沈知秋，问他和死者的关系、当晚行踪，以及他是否知道那些鞋印。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      non_empty: true
      not_contains:
      - "【"
      - "】"
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/events":
      non_empty: true
    "/text_eos_ms":
      maximum: 90000
    "/audio_eos_ms":
      maximum: 90000
    "/audio_integrity/streams":
      minimum: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
