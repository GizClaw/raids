---
apiVersion: gizclaw.admin/v1alpha1
kind: Tool
metadata:
  id: volc-reference-search
spec:
  type: http_request
  invoke_name: reference_search
  description: 查证史实、诗文归属和出处；query不超过100字。
  input_schema:
    type: object
    properties:
      query: {type: string}
      search_type: {type: string, enum: [web]}
      count: {type: integer, enum: [3]}
    required: [query, search_type, count]
    additionalProperties: false
  http:
    url: https://open.feedcoopapi.com/search_api/web_search
    method: POST
    auth:
      method: volc_search
      credential: volc-credential
    body:
      - {argument_pointer: /query, target: /Query}
      - {argument_pointer: /search_type, target: /SearchType}
      - {argument_pointer: /count, target: /Count}
    # Retain source URL, attribution and summary; no results stays null.
    response_pointer: /Result
    timeout: 10s
    max_response_bytes: 1048576
