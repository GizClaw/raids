# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of story-nils,
# So that safety, correction, recall, routing and language regressions fail at the original gates.
version: gizclaw.test/v1alpha1
name: story-nils.quality.flowcraft.multi-role
clients:
  flowcraft_multi_role__transitions:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_multi_role__routing:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_multi_role_transitions_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_routing_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 30m
steps:
- id: flowcraft_multi_role__transitions_register
  client: flowcraft_multi_role__transitions
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_multi_role_transitions_stop_create_workspace
  client: flowcraft_multi_role__transitions
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_multi_role_transitions_create_workspace
  client: flowcraft_multi_role__transitions
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_multi_role_transitions_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-nils-multi-role
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_multi_role_transitions_select_workspace
  client: flowcraft_multi_role__transitions
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_multi_role_transitions_workspace}"
- id: flowcraft_multi_role_transitions_warmup_workspace
  client: flowcraft_multi_role__transitions
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- timeout: 4m
  id: flowcraft_multi_role_transitions_opening_with_guidance
  client: flowcraft_multi_role__transitions
  peer_stream:
    mode: text
    input: 请从第一章开始《尼尔斯骑鹅旅行记》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - "【"
      - "】"
      - 进入下一章
      - 要不要继续
      - 想继续听就说
      - 这一章的选择完成啦
      - 等你说要不要
      - 是否继续听
      - say continue
      - say next chapter
      - would you like to continue
      min_length: 200
      max_length: 900
      pattern: "(还是|或|选|哪|谁|先| or |which|where|who)[^。.!！]*[？?]\\s*$"
      contains_all:
      - 第 1 章
      - 湿地风向
      - 尼尔斯
      - 阿卡
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/audio_integrity/streams":
      equals: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- timeout: 4m
  id: flowcraft_multi_role_transitions_natural_consequence
  client: flowcraft_multi_role__transitions
  peer_stream:
    mode: text
    input: 我选刚才第一个办法！
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
