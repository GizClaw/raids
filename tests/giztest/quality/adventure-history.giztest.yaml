    "/eino_roles_historian_scene_setup_1/first_text_ms":
      maximum: 6000
    "/eino_roles_historian_scene_setup_1/first_audio_ms":
      maximum: 90000
    "/flowcraft_routing_negated_name/text":
      min_length: 4
      not_contains:
      - 历史讲解员说
      - 历史讲解员：
      - '历史讲解员:'
      - 我是历史讲解员
      - 作为历史讲解员
      - 我这只历史讲解员
    "/flowcraft_routing_negated_name/text_eos":
      equals: true
    "/flowcraft_routing_negated_name/audio_eos":
      equals: true
    "/flowcraft_routing_negated_name/audio_bytes":
      minimum: 1
    "/flowcraft_routing_negated_name/first_text_ms":
      maximum: 6000
    "/flowcraft_routing_negated_name/first_audio_ms":
      maximum: 90000
