services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment: {POSTGRES_USER: bootstrap, POSTGRES_PASSWORD: bootstrap, POSTGRES_DB: postgres}
    volumes: ["./postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U bootstrap -d postgres"]
      interval: 1s
      timeout: 2s
      retries: 120
  mem0:
    image: ghcr.io/gizclaw/gizclaw-mem0@sha256:db80bb68dd0d621d6f65037fa7818d4f41c0a63ed1ed32aea04269147987b320
    environment:
      MEM0_CONFIG: /run/mem0.yaml
      MEM0_API_KEY: "${GIZCLAW_MEM0_API_KEY}"
      VOLC_ARK_API_KEY: "${GIZCLAW_VOLC_ARK_API_KEY}"
    volumes: ["./mem0.yaml:/run/mem0.yaml:ro"]
    depends_on: {postgres: {condition: service_healthy}}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=1).read()"]
      interval: 2s
      timeout: 2s
      retries: 90
  server:
    user: "0:0"
    image: ghcr.io/gizclaw/gizclaw@sha256:122619e0ecc54e2fc7b3718f6ba08148ce868b7f3890b3ff9ee993ea271f5df5
    entrypoint: [/usr/bin/gizclaw, serve, --force, /workspace]
    volumes:
      - "${RAIDS_CHAT_E2E_STATE}/server/config.yaml:/workspace/config.yaml:ro"
      - "server-data:/workspace/data"
    depends_on: {mem0: {condition: service_healthy}}
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:9820/server-info"]
      interval: 1s
      timeout: 3s
      retries: 90
  edge:
    user: "0:0"
    image: ghcr.io/gizclaw/gizclaw@sha256:122619e0ecc54e2fc7b3718f6ba08148ce868b7f3890b3ff9ee993ea271f5df5
    entrypoint: [/usr/bin/gizclaw, edge, serve, /workspace]
    volumes: ["${RAIDS_CHAT_E2E_STATE}/edge/config.yaml:/workspace/config.yaml:ro"]
    depends_on: {server: {condition: service_healthy}}
    healthcheck:
      test: [CMD, curl, -fsS, "http://127.0.0.1:9821/server-info"]
      interval: 1s
      timeout: 3s
      retries: 90
  cli:
    image: ghcr.io/gizclaw/gizclaw@sha256:122619e0ecc54e2fc7b3718f6ba08148ce868b7f3890b3ff9ee993ea271f5df5
    entrypoint: [/bin/sh, -c, "sleep 21600"]
    working_dir: /raids
    environment:
      XDG_CONFIG_HOME: /state/cli
      GIZCLAW_VOLC_SPEECH_APP_ID:
      GIZCLAW_VOLC_SPEECH_API_KEY:
      GIZCLAW_VOLC_ARK_API_KEY:
      GIZCLAW_VOLC_SEARCH_API_KEY:
      GIZCLAW_VOLC_OPENAPI_ACCESS_KEY_ID:
      GIZCLAW_VOLC_OPENAPI_ACCESS_KEY:
      GIZCLAW_MEM0_ENDPOINT: http://mem0:8000
      GIZCLAW_MEM0_API_KEY:
      GIZCLAW_TEST_ENDPOINT: edge:9821
    volumes:
      - "${RAIDS_CHAT_E2E_REPO}:/raids:ro"
      - "${RAIDS_CHAT_E2E_STATE}:/state"
      - "${RAIDS_CHAT_E2E_REPORT}:/reports"
    depends_on: {edge: {condition: service_healthy}}
volumes:
  server-data:
