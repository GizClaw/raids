    peer_stream:
      mode: text
      input: 我从花果山出发，带着一枚青铜铃。承接我的行动，不要替我选择路线。
      require_text: true
      completion: first_response
      require_audio: true
      first_text_timeout: 2s
      first_audio_timeout: 3s
  - id: eino_history_turn_1_origin_first_response
    client: eino_history
    peer_stream:
      mode: text
      input: 我从花果山出发，带着一枚青铜铃。承接我的行动，不要替我选择路线。
