# User Story:
# As a Raids catalog maintainer,
# I want every available adventure-debate implementation to complete the same bounded Tester relay,
# So that the 7-response `adventure-debate-acceptance` route, its deterministic contracts, and the final verdict stay declarative.
version: gizclaw.test/v1alpha1
name: adventure-debate.soak.eino.multi-role
clients:
  eino_multi_role:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_multi_role_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  multi_role_test_brief:
    direction: input
    type: string
    value: |
      BEGIN flowcraft-adventure-debate-multi-role core-experience
      孩子自然参与多角色有声故事，内容由Tester宽松评审：有意思、生动、丰富、连贯、回应孩子。
  eino_multi_role_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_multi_role_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_multi_role_verdict:
    direction: output
    type: string
  eino_multi_role_reload_handoff:
    direction: output
    type: string
repeat: 1
timeout: 70m
steps:
- id: eino_multi_role_register_candidate
  client: eino_multi_role
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_multi_role_register_tester
  client: eino_multi_role_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_multi_role_create_candidate_workspace
  client: eino_multi_role
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_multi_role_candidate_workspace}"
      collection: raidtest-targets
      workflow_name: eino-adventure-debate-multi-role
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_multi_role_create_tester_workspace
  client: eino_multi_role_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_multi_role_tester_workspace}"
      collection: raidtest-testers
      workflow_name: adventure-debate-test-multi-role
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_multi_role_select_candidate_workspace
  client: eino_multi_role
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_multi_role_candidate_workspace}"
- id: eino_multi_role_warmup_candidate_workspace
  client: eino_multi_role
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_multi_role_select_tester_workspace
  client: eino_multi_role_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_multi_role_tester_workspace}"
- id: eino_multi_role_run_dialogue_before_reload
  timeout: 20m
  workspace_relay:
    first_client: eino_multi_role_tester
    second_client: eino_multi_role
    input: "${multi_role_test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 12
    terminal_client: eino_multi_role
  capture:
    eino_multi_role_reload_handoff: "/terminal/text"
  expect:
    "/terminal/client":
      equals: eino_multi_role
    "/completed_turns":
      equals: 12
    "/turns/eino_multi_role/count":
      equals: 6
    "/turns/eino_multi_role_tester/count":
      equals: 6
    "/turns/eino_multi_role/first_text_ms/max":
      maximum: 6000
    "/turns/eino_multi_role/text_runes/min":
      minimum: 1
- id: eino_multi_role_recall_barrier_1
  client: eino_multi_role
  rpc:
    method: server.run.workspace.recall
    request:
      query: 星火七号
  timeout: 60s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: eino_multi_role_reload_candidate_workspace
  client: eino_multi_role
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: eino_multi_role_run_dialogue_after_reload
  timeout: 5m
  workspace_relay:
    first_client: eino_multi_role_tester
    second_client: eino_multi_role
    input: "${eino_multi_role_reload_handoff}"
    media: text
    idle_timeout: 90s
    max_turns: 3
    terminal_client: eino_multi_role_tester
  capture:
    eino_multi_role_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: eino_multi_role_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 3
    "/turns/eino_multi_role/count":
      equals: 1
    "/turns/eino_multi_role_tester/count":
      equals: 2
    "/turns/eino_multi_role/first_text_ms/max":
      maximum: 6000
    "/turns/eino_multi_role/text_runes/min":
      minimum: 1
- id: eino_multi_role_emit_verdict
  output:
    variable: eino_multi_role_verdict
finally:
# Ephemeral peer deletion retires its owned Workspaces, including partial setup.
- id: eino_multi_role_stop_candidate_run
  client: eino_multi_role
  rpc:
    method: server.run.stop
    request: {}
- id: eino_multi_role_stop_tester_run
  client: eino_multi_role_tester
  rpc:
    method: server.run.stop
    request: {}
- id: eino_multi_role_delete_candidate_peer
  client: eino_multi_role
  rpc:
    method: server.peer.delete
    request: {}
- id: eino_multi_role_delete_tester_peer
  client: eino_multi_role_tester
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
