# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of doubao-realtime,
# So that safety, correction, recall, routing and language regressions fail at the original gates.
version: gizclaw.test/v1alpha1
name: quality.doubao-realtime
clients:
  doubao:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  doubao_case1_workspace_name:
    direction: input
    type: string
    generate: token
  doubao_case1_audio_1:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  doubao_case1_audio_2:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  doubao_case1_audio_3:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  doubao_case1_audio_4:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  doubao_case1_audio_5:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  doubao_case1_audio_6:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  doubao_case1_audio_7:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  doubao_case1_audio_8:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  doubao_case2_workspace_name:
    direction: input
    type: string
    generate: token
  doubao_case2_audio_1:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  doubao_case2_audio_2:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  doubao_case2_audio_3:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  doubao_case2_audio_4:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  doubao_case2_audio_5:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  doubao_case2_audio_6:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  doubao_case2_audio_7:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  doubao_case2_audio_8:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  doubao_case2_audio_9:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  doubao_case2_audio_10:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
repeat: 1
timeout: 10m
steps:
- id: register_doubao
  client: doubao
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: doubao_case1_stop_create_workspace
  client: doubao
  rpc:
    method: server.run.stop
    request: {}
- id: doubao_case1_create_workspace
  client: doubao
  rpc:
    method: server.workspace.create
    request:
      name: "${doubao_case1_workspace_name}"
      collection: assistants
      workflow_name: doubao-realtime
      parameters:
        doubao_realtime_workspace_parameters:
          agent_type: DOUBAO_REALTIME_WORKSPACE_PARAMETERS_AGENT_TYPE_DOUBAO_REALTIME
          input: WORKSPACE_INPUT_MODE_REALTIME
- id: doubao_case1_select_workspace
  client: doubao
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${doubao_case1_workspace_name}"
- id: doubao_case1_warmup_workspace
  client: doubao
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: doubao_case1_synthesize_1_establish-context
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 请记住：暗号是紫色灯塔，称呼我松果队长，我在计划周末露营，原本更喜欢轮船。请简短确认。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case1_audio_1
- id: doubao_case1_turn_1_establish-context
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case1_audio_1}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      contains_all:
      - 紫色灯塔
      min_length: 4
      max_length: 200
- id: doubao_case1_synthesize_2_recall-marker
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 我刚才说的暗号是什么？只回答暗号。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case1_audio_2
- id: doubao_case1_turn_2_recall-marker
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case1_audio_2}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      contains_all:
      - 紫色灯塔
      min_length: 4
      max_length: 200
- id: doubao_case1_synthesize_3_continue-topic
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 继续刚才的计划，我原本偏好的出行方式是什么？用一句话回答。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case1_audio_3
- id: doubao_case1_turn_3_continue-topic
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case1_audio_3}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      contains_all:
      - 轮船
      min_length: 4
      max_length: 200
- id: doubao_case1_synthesize_4_correct-fact
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 更正一下，我现在改为更喜欢出租车，请记住这个变化。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case1_audio_4
- id: doubao_case1_turn_4_correct-fact
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case1_audio_4}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      contains_all:
      - 出租车
      min_length: 4
      max_length: 200
- id: doubao_case1_synthesize_5_use-correction
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 那我现在更喜欢哪种方式？不要提已经更正的旧选择。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case1_audio_5
- id: doubao_case1_turn_5_use-correction
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case1_audio_5}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      contains_all:
      - 出租车
      not_contains:
      - 轮船
      min_length: 4
      max_length: 200
- id: doubao_case1_synthesize_6_short-answer
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 用不超过十二个字概括我正在计划的主题。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case1_audio_6
- id: doubao_case1_turn_6_short-answer
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case1_audio_6}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      contains_all:
      - 周末露营
      min_length: 4
      max_length: 200
- id: doubao_case1_synthesize_7_detailed-answer
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 请为这个计划给出三个具体建议，每点说明理由，回答至少八十字。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case1_audio_7
- id: doubao_case1_turn_7_detailed-answer
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case1_audio_7}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      min_length: 80
      max_length: 720
- id: doubao_case1_synthesize_8_final-summary
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 最后总结：我的称呼、暗号、计划主题和当前偏好分别是什么？不要提旧偏好。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case1_audio_8
- id: doubao_case1_turn_8_final-summary
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case1_audio_8}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      contains_all:
      - 松果队长
      - 紫色灯塔
      - 周末露营
      - 出租车
      not_contains:
      - 轮船
      min_length: 20
      max_length: 360
- id: doubao_case2_stop_create_workspace
  client: doubao
  rpc:
    method: server.run.stop
    request: {}
- id: doubao_case2_create_workspace
  client: doubao
  rpc:
    method: server.workspace.create
    request:
      name: "${doubao_case2_workspace_name}"
      collection: assistants
      workflow_name: doubao-realtime
      parameters:
        doubao_realtime_workspace_parameters:
          agent_type: DOUBAO_REALTIME_WORKSPACE_PARAMETERS_AGENT_TYPE_DOUBAO_REALTIME
          input: WORKSPACE_INPUT_MODE_REALTIME
- id: doubao_case2_select_workspace
  client: doubao
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${doubao_case2_workspace_name}"
- id: doubao_case2_warmup_workspace
  client: doubao
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: doubao_case2_synthesize_1_establish-appointment
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 记住我周五下午三点去看牙医陈医生。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case2_audio_1
- id: doubao_case2_turn_1_establish-appointment
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case2_audio_1}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      non_empty: true
- id: doubao_case2_synthesize_2_establish-clinic
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 诊所在朝阳路，项目是口腔洁治，也就是洗牙，也请一起记住。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case2_audio_2
- id: doubao_case2_turn_2_establish-clinic
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case2_audio_2}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      contains_all:
      - 朝阳路
      - 洗牙
- id: doubao_case2_synthesize_3_correct-time
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 更正，是下午四点，不是三点。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case2_audio_3
- id: doubao_case2_turn_3_correct-time
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case2_audio_3}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      contains_all:
      - 四点
      not_contains:
      - 还是下午三点
      - 仍是下午三点
      - 三点没问题
      - 三点是对的
- id: doubao_case2_synthesize_4_immediate-recall
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 25个字以内说出星期、时间、医生、地点和项目。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case2_audio_4
- id: doubao_case2_turn_4_immediate-recall
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case2_audio_4}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      contains_all:
      - 周五
      - 陈医生
      - 朝阳路
      - 洗牙
      contains_any:
      - 四点
      - 4点
      not_contains:
      - 三点
      max_length: 200
- id: doubao_case2_synthesize_5_short
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 10个字以内鼓励我，不要提就诊。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case2_audio_5
- id: doubao_case2_turn_5_short
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case2_audio_5}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      not_contains:
      - 周五
      - 四点
      - 陈医生
      - 朝阳路
      - 洗牙
      max_length: 200
- id: doubao_case2_synthesize_6_exact
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 只回答“知道了”，不要加其他内容。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case2_audio_6
- id: doubao_case2_turn_6_exact
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case2_audio_6}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      contains_all:
      - 知道了
      max_length: 200
- id: doubao_case2_synthesize_7_challenge-old-time
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 我记得还是下午三点，对吗？请按最新事实纠正。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case2_audio_7
- id: doubao_case2_turn_7_challenge-old-time
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case2_audio_7}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      contains_all:
      - 四点
      not_contains:
      - 仍是下午三点
      - 三点是对的
      - 下午三点没问题
      - 对的
      - 没错
      max_length: 200
- id: doubao_case2_synthesize_8_partial-recall
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 只说医生和项目，15个字以内。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case2_audio_8
- id: doubao_case2_turn_8_partial-recall
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case2_audio_8}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      contains_all:
      - 陈医生
      - 洗牙
      not_contains:
      - 朝阳路
      - 周五
      - 四点
      max_length: 200
- id: doubao_case2_reload_before_reconnect-recall
  client: doubao
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: doubao_case2_synthesize_9_reconnect-recall
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 重连后20个字以内说出最新时间、医生和诊所地址。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case2_audio_9
- id: doubao_case2_turn_9_reconnect-recall
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case2_audio_9}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      contains_all:
      - 四点
      - 陈医生
      - 朝阳路
      not_contains:
      - 三点
      max_length: 200
- id: doubao_case2_synthesize_10_final-exact
  client: doubao
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 最后只回答“预约已确认”，不要加标点。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: doubao_case2_audio_10
- id: doubao_case2_turn_10_final-exact
  client: doubao
  timeout: 2m
  peer_stream:
    mode: realtime
    input: "${doubao_case2_audio_10}"
    pacing: 20ms
    require_text: true
  expect:
    "/text":
      contains_all:
      - 预约已确认
      max_length: 200
finally:
- id: stop_doubao
  client: doubao
  rpc:
    method: server.run.stop
    request: {}
- id: doubao_case1_delete_workspace
  client: doubao
  rpc:
    method: server.workspace.delete
    request:
      name: "${doubao_case1_workspace_name}"
- id: doubao_case2_delete_workspace
  client: doubao
  rpc:
    method: server.workspace.delete
    request:
      name: "${doubao_case2_workspace_name}"
- id: delete_doubao
  client: doubao
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
