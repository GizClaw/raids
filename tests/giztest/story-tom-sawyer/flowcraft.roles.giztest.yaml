# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for flowcraft-story-tom-sawyer,
# So that every reachable role path produces text and non-empty synthesized audio.
version: gizclaw.test/v1alpha1
name: story-tom-sawyer.flowcraft.roles
clients:
  narrator:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  tom:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  becky:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  huck:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  aunt-polly:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  narrator_workspace:
    direction: input
    type: string
    generate: token
  tom_workspace:
    direction: input
    type: string
    generate: token
  becky_workspace:
    direction: input
    type: string
    generate: token
  huck_workspace:
    direction: input
    type: string
    generate: token
  aunt_polly_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 60m
steps:
- id: register_narrator
  client: narrator
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: "${narrator_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-tom-sawyer
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${narrator_workspace}"
- id: warmup_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_tom
  client: tom
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_tom_workspace
  client: tom
  rpc:
    method: server.workspace.create
    request:
      name: "${tom_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-tom-sawyer
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_tom_workspace
  client: tom
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${tom_workspace}"
- id: warmup_tom_workspace
  client: tom
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_becky
  client: becky
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_becky_workspace
  client: becky
  rpc:
    method: server.workspace.create
    request:
      name: "${becky_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-tom-sawyer
