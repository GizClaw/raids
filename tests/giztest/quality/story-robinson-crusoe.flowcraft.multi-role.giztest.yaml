# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of story-robinson-crusoe,
# So that rich, child-friendly replies receive lenient LLM review with unchanged audio and latency gates.
version: gizclaw.test/v1alpha1
name: story-robinson-crusoe.quality.flowcraft.multi-role
clients:
  flowcraft_multi_role__transitions:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_multi_role__routing:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_multi_role_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  flowcraft_multi_role_safety_alone_reply:
    direction: output
    type: string
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_multi_role_transitions_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_routing_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_review_0:
    direction: output
    type: string
  flowcraft_multi_role_review_1:
    direction: output
    type: string
  flowcraft_multi_role_review_2:
    direction: output
    type: string
  flowcraft_multi_role_review_3:
    direction: output
    type: string
  flowcraft_multi_role_review_4:
    direction: output
    type: string
  flowcraft_multi_role_review_5:
    direction: output
    type: string
  flowcraft_multi_role_review_6:
    direction: output
    type: string
  flowcraft_multi_role_review_7:
    direction: output
    type: string
  flowcraft_multi_role_review_8:
    direction: output
    type: string
  flowcraft_multi_role_review_9:
    direction: output
    type: string
  flowcraft_multi_role_review_10:
    direction: output
    type: string
  flowcraft_multi_role_review_11:
    direction: output
    type: string
repeat: 1
timeout: 30m
steps:
- id: flowcraft_multi_role__transitions_register
  client: flowcraft_multi_role__transitions
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_multi_role_transitions_stop_create_workspace
  client: flowcraft_multi_role__transitions
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_multi_role_transitions_create_workspace
  client: flowcraft_multi_role__transitions
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_multi_role_transitions_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-robinson-crusoe-multi-role
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_multi_role_transitions_select_workspace
  client: flowcraft_multi_role__transitions
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_multi_role_transitions_workspace}"
- id: flowcraft_multi_role_transitions_warmup_workspace
  client: flowcraft_multi_role__transitions
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- timeout: 4m
  id: flowcraft_multi_role_transitions_opening_with_guidance
  client: flowcraft_multi_role__transitions
  peer_stream:
    wait_for_history: true
    mode: text
    input: 请从第一章开始《鲁滨逊漂流记》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      min_length: 1
      not_contains:
      - "【"
      - "】"
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/audio_integrity/streams":
      equals: 1
    "/audio_integrity/max_active":
      equals: 1
    "/audio_integrity/open":
      equals: 0
    "/audio_integrity/violations":
      equals: 0
    "/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/audio_pacing/underruns":
      equals: 0
- id: flowcraft_multi_role_review_0_review_history
  client: flowcraft_multi_role__transitions
  timeout: 5s
  rpc:
    method: server.run.workspace.history
    request:
      limit: 1
      order: PEER_RUN_HISTORY_LIST_REQUEST_ORDER_DESC
  expect:
    /items/0/type:
      equals: PEER_RUN_HISTORY_ENTRY_TYPE_AGENT
    /items/0/text:
      min_length: 1
  capture:
    flowcraft_multi_role_review_0: /items/0/text
- timeout: 4m
  id: flowcraft_multi_role_transitions_natural_consequence
