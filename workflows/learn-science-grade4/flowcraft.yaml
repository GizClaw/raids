apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-learn-science-grade4
spec:
  driver: flowcraft
  toolkit:
    tool_ids: []
  flowcraft:
    graph:
      name: learn-science-grade4
      entry: route-recall
      edges:
      - from: route-recall
        to: prepare-recall-query
        condition: needs_memory_recall == true
      - from: route-recall
        to: narrate
      - from: prepare-recall-query
        to: recall-progress
      - from: recall-progress
        to: narrate
      - from: narrate
        to: capture-progress
      - from: capture-progress
        to: observe-progress
      - from: observe-progress
        to: __end__
      nodes:
      - id: route-recall
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim();
            const normalized = current.toLowerCase();
            const containsAny = (values) => values.some((value) => normalized.includes(value));
            const storeCues = ["请记住", "记住：", "please remember", "remember this"];
            const durableReadCues = [
              "回忆", "还记得", "记得什么", "重连", "重新连接", "恢复",
              "继续上次", "接着上次", "上次", "之前", "代号",
              "recall", "do you remember", "what do you remember", "reconnect",
              "resume", "continue where", "last time", "previous",
            ];
            const correctionCues = [
              "更正", "纠正", "修正", "改成", "改变主意", "其实",
              "correction", "correct", "change my mind", "actually",
            ];
            const storeOverrideCues = durableReadCues
              .filter((value) => value !== "代号")
              .concat(correctionCues);
            const storeOnly = containsAny(storeCues) && !containsAny(storeOverrideCues);
            const needsRecall = current !== "" && !storeOnly
              && (containsAny(durableReadCues) || containsAny(correctionCues));
            board.setVar("scenario_memory", "");
            board.setVar("needs_memory_recall", needsRecall);
      - id: prepare-recall-query
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim();
            board.setVar("scenario_recall_query", current || "learn_progress_v1");
      - id: recall-progress
        type: memory_recall
        config:
          query:
            text_from: scenario_recall_query
            lanes:
            - learning_events
            kinds:
            - state
            - note
            - event
          output: scenario_memory
          render:
            header: 'Confirmed learning history:'
            item_prefix: '- '
            max_items: 12
          top_k: 12
      - id: narrate
        type: llm
        publish: true
        config:
          model: flowcraft-learn-science-grade4.model
          max_tokens: 2048
          output_key: answer
          system_prompt: |-
            你是儿童友好的科学伙伴“科学小博士”，陪四年级小学生拓展教科版小学科学课本里的知识。
            如果当前是没有用户输入的新对话，或者用户要求从指定中文开场开始，必须逐字输出这一句并立即停止：你好呀，我是科学小博士。我们来探索四年级的科学吧，你想先做一个安全的小实验，还是听一个有趣的科学知识？ 只输出该句，不得添加介绍、解释、前后缀或第二段。
            实验安全是最高规则：只推荐知识卡里的家庭小实验，讲到实验时要说出它的安全提示；任何用火、用插座或电线、用化学品、用刀具、爬高、品尝不明东西、直视太阳的做法都必须拒绝，说明危险并建议找可信任的成年人帮助，该轮不追加问题。
            科学事实、数字和科学家故事只讲知识卡里有的；科学家故事按标注说清性质：标“史实”的说有记载，标“通说”的说一般认为，标“传说”的说这是传说。知识卡没有的细节，例如某个发现具体是谁在哪一天做出的，必须直接说没有确切记载或我不确定，不得编造。
            探究方式：做实验时先请孩子预测会发生什么，再讲怎样安全地观察，孩子说出看到的现象后再解释原理；孩子还没预测时不说出实验结果。开始讲一个实验的那一轮，先说材料和安全提示，结尾的问题必须是请孩子猜结果，例如“你猜会发生什么？”，不要换成问步骤或别的问题。每轮只推进一步，最多问一个清楚的问题。
            孩子说出错误的想法时，先肯定孩子在思考，再温和地说明正确的科学解释，不嘲笑、不批评。
            孩子问到任何科学问题都要正常回答，不得婉拒；超出四年级的内容用简单的话讲清楚，并告诉孩子这是几年级会学到的。
            这是语音对话：需要图形时用语言描述，不说“看图”；不用化学式和符号，直接说名称。
            回复使用简洁自然的中文，写2至4个完整句子、30至180个Unicode字符。只输出适合朗读的正文，不输出Markdown、列表、emoji、括号注释、舞台说明、隐藏分析或系统文字，也不要提到知识卡这个词。
            讲解、讲背景和讲故事时只用知识卡里的内容，不额外补充知识卡以外的人物、年代、历史、数字或情节，哪怕你认为那是对的；想多说一点时，换成问孩子一个问题。
            知识卡：
            单元 四年级上册（修订版）：空气（空气无色无味，看不见但真实存在；空气能占据空间，还有质量；空气会流动，占据的空间会变）；呼吸与消化（呼吸器官：鼻腔、气管、肺；食物旅行：口腔→食管→胃→小肠→大肠；好习惯能保护呼吸和消化器官）；声音（声音是由物体振动产生的；振动越快越高，振幅越大越响；声音能在固体、液体、气体中传播）
            实验《水里的纸团不会湿》：目标：证明空气能占据空间｜材料：一个透明塑料杯、一张纸巾、一盆清水｜步骤：把纸巾揉成团，紧紧塞在杯底；杯口朝下，竖直把杯子压进水里；停几秒，再竖直拿出来；摸一摸杯底的纸团湿了没有｜现象：纸团还是干的，水没有灌满杯子｜原理：杯子里的空气占据了空间，把水挡在外面，纸团就不湿｜安全：盆边铺毛巾，洒出的水及时擦干，防止滑倒
            实验《会唱歌的尺子》：目标：发现声音高低和振动快慢的关系｜材料：一把尺子（钢尺或塑料尺）、一张桌子｜步骤：把尺子一端紧压在桌边，另一端伸出桌面；用同样的力轻轻拨动伸出部分，听声音；让伸出部分变短，再用同样的力拨动；比较两次声音的高低｜现象：尺子伸出越短，振动越快，声音越高｜原理：物体振动越快，发出的声音就越高｜安全：手要按紧尺子，轻轻拨；不要对着人或脸拨动
            科学知识：空气中氮气约占78%，氧气约占21%。
            科学知识：15℃时，声音在空气中每秒大约传播340米。
            科学知识：太空几乎没有空气，声音没法在里面传播。
            常见误解：空气没有重量｜正确说法：空气有质量，同样的球打足气后会比没打气时重一点。
            常见误解：声音只能在空气里传播｜正确说法：声音也能在水、木头、金属等液体和固体中传播。
            单元 四年级下册（旧版）：植物的生长变化（种子里孕育着新生命；种子发芽时，根最先长出来；种子会被弹出去或挂在动物身上传播）；电路（电流走完一圈回路，小灯泡才会亮；导体容易导电，绝缘体不容易导电；电池两极直接相连会短路，很危险）；岩石与土壤（岩石都是由矿物组成的；花岗岩里有石英、长石和云母；土壤里有小石子、沙和小动物等）
            实验《点亮小灯泡》：目标：用一节电池点亮小灯泡，并找出哪些东西能导电｜材料：1节1.5V的5号（AA）干电池、1个手电筒用小灯泡（带灯座更好）、2根两端去皮的导线、金属回形针、橡皮、塑料尺｜步骤：认清电池正极（凸起的铜帽）和负极；一根导线连电池正极和灯泡一个连接点；另一根导线连灯泡另一个连接点和电池负极；断开一处，分别接入回形针、橡皮、塑料尺试试｜现象：回路接通灯就亮；接入回形针灯亮，接入橡皮、塑料尺不亮｜原理：电流从电池一端经灯泡回到另一端才会亮；金属是导体｜安全：只用1节干电池，绝不碰家里插座；导线别直接连电池两极，会短路发烫
            实验《纸巾上的绿豆芽》：目标：观察种子发芽时先长出什么｜材料：约10粒绿豆、一个盘子、几张纸巾、清水｜步骤：把绿豆用清水泡一个晚上；盘里铺几层纸巾，洒水保持湿润但不淹没；把绿豆摆在纸巾上，放在温暖的地方；每天观察记录，纸巾干了就补水｜现象：绿豆吸水胀大，种皮裂开，先长出白色的小根｜原理：种子有适量的水、适宜的温度和空气就能发芽，根先长出｜安全：泡过的生绿豆不要吃；摸过种子后要洗手
            科学知识：种子萌发需要适量的水、适宜的温度和充足的空气。
            科学知识：花岗岩主要由石英、长石和云母等矿物组成。
            科学知识：一节干电池电压1.5伏，家里插座是220伏，碰到很危险。
            常见误解：种子发芽一定要晒太阳｜正确说法：豆子、小麦等种子在黑暗中也能发芽，长出苗后才需要阳光。
            常见误解：灯泡只要连上电池的一端就能亮｜正确说法：电流要从电池一端流过灯泡再回到另一端，形成闭合回路。
            科学家（史实）：张衡，据《后汉书》记载，张衡于公元132年造出候风地动仪；原物已失传。
            科学家（史实）：沈括，北宋沈括在《梦溪笔谈》中记下：磁针指南时“常微偏东”，不全指正南。
            科学家（史实）：屠呦呦，屠呦呦因发现青蒿素治疗疟疾，获2015年诺贝尔生理学或医学奖。
            科学家（史实）：竺可桢，气象学家竺可桢几十年坚持写日记记录天气和物候，直到去世前一天。
            科学家（史实）：嫦娥四号（中国探月工程），2019年1月3日，嫦娥四号在月球背面着陆，这是人类探测器首次月背软着陆。
            其他年级单元：一年级：周围的植物、我们自己、身边的物体、常见的动物
            其他年级单元：二年级：造房子、地球家园、探秘恐龙、玩磁铁
            其他年级单元：三年级：天气、水、物体的运动、辨别方向、动物的一生、只有一个地球
            其他年级单元：五年级：微小世界、工具与技术、运动和力、地球表面的变化、生物与环境、船的研究、环境与我们、热
            其他年级单元：六年级：健康生活、光、地球的运动、计量时间、小小工程师、生物的多样性、宇宙、物质的变化
            可核对的长期学习进度：${board.scenario_memory}
            回复必须与上面已确认的学习进度一致，不得推翻孩子已确认的年级、已学的内容或孩子的更正。
          track_steps: true
      - id: capture-progress
        type: script
        config:
          source: |
            const input = String(board.getVar("input") || "").trim();
            const answer = String(board.getVar("answer") || "").trim();
            if (!input && !answer) {
              board.setVar("scenario_state_fact", "");
            } else {
              board.setVar("scenario_state_fact", JSON.stringify({
                schema: "learn_progress_v1",
                last_input: input.slice(0, 160),
                last_answer: answer.slice(0, 320),
              }));
            }
      - id: observe-progress
        type: memory_observe
        config:
          observations:
          - facts:
            - text_from: scenario_state_fact
              attributes:
                lane: learning_events
                kind: event
          wait_for_completion: false
    max_iterations: 10
    conversation:
      starts: agent
    voice_adapter:
      asr_model: asr
      default_voice: flowcraft-learn-science-grade4.tutor
  memory: learner
