    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
finally:
- id: stop_narrator_run
  client: narrator
  rpc:
    method: server.run.stop
    request: {}
- id: delete_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.delete
    request:
      name: "${narrator_workspace}"
- id: delete_narrator_peer
  client: narrator
  rpc:
    method: server.peer.delete
    request: {}
- id: stop_proponent_run
  client: proponent
  rpc:
    method: server.run.stop
    request: {}
- id: delete_proponent_workspace
  client: proponent
  rpc:
    method: server.workspace.delete
    request:
      name: "${proponent_workspace}"
- id: delete_proponent_peer
  client: proponent
  rpc:
    method: server.peer.delete
    request: {}
- id: stop_opponent_run
  client: opponent
  rpc:
    method: server.run.stop
    request: {}
- id: delete_opponent_workspace
  client: opponent
  rpc:
    method: server.workspace.delete
    request:
      name: "${opponent_workspace}"
- id: delete_opponent_peer
