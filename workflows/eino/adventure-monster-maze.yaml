---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-adventure-monster-maze
spec:
  driver: eino
  toolkit: {tool_ids: []}
  memory: adventure
  eino:
    graph:
      name: adventure-monster-maze-eino
      compile: {node_trigger_mode: any_predecessor, max_run_steps: 16}
      state:
        fields:
          - {name: memory-query, type: string, merge: replace}
          - {name: recalled, type: string, merge: replace}
          - {name: area-route, type: string, merge: replace}
          - {name: answer-messages, type: messages, merge: replace}
          - {name: answer, type: string, merge: replace}
          - {name: progress-fact, type: string, merge: replace}
          - {name: progress-lane, type: string, merge: replace}
          - {name: progress-kind, type: string, merge: replace}
      nodes:
        - id: prepare-memory-query
          type: script
          inputs: {text: {from: input.text}}
          outputs: {query: memory-query}
          language: starlark
          entrypoint: run
          source: |
            def run(input):
                text = input["text"]
                base = "怪兽迷宫当前区域、已确认路线、锁孔线索和遇到的角色"
                return {"query": base + ("；当前请求：" + text if text else "")}
          limits: {max_execution_steps: 10000, timeout: 250ms, max_input_bytes: 65536, max_output_bytes: 65536}
        - id: recall-progress
          type: memory_recall
          query_from: memory-query
          output: recalled
          top_k: 12
        - id: route-area
          type: script
          inputs: {text: {from: input.text}, history: {from: input.messages}, memory: {from: recalled}}
          outputs: {route: area-route}
          language: starlark
          entrypoint: run
          source: |
            def contains_any(text, values):
                for value in values:
                    if value in text:
                        return True
                return False

            def run(input):
                combined = input["memory"] + "\n" + input["text"]
                for message in input["history"]:
                    if "content" in message:
                        combined += "\n" + message["content"]
                if contains_any(combined, ["小怪兽", "怪兽成为帮手", "打喷嚏", "刚遇到的角色"]):
                    route = "第四区‘怪兽合作’"
                elif contains_any(combined, ["锁孔", "圆形", "三角形", "方形", "小提示"]):
                    route = "第三区‘锁孔谜题’"
                elif contains_any(combined, ["蘑菇花园", "右边", "右侧", "向右", "左边", "路线", "地图"]):
                    route = "第二区‘路线校准’"
                else:
                    route = "第一区‘月亮机关’"
                return {"route": route}
          limits: {max_execution_steps: 20000, timeout: 250ms, max_input_bytes: 262144, max_output_bytes: 65536}
        - id: narrate-maze
          type: prompt
          inputs: {history: {from: input.messages}, memory: {from: recalled}, route: {from: area-route}}
          outputs: {messages: answer-messages}
          format: f_string
          messages:
            - role: system
              template: |
                你是儿童友好的怪兽迷宫主持人，用方向、图形和逻辑线索维护一张连续一致的虚构地图。
                首次主动开场严格说：迷宫门上有月亮、星星和太阳三个按钮，墙上的影子只指向没有光的图案，你会按哪个？
                迷宫分为月亮机关、路线校准、锁孔谜题、怪兽合作四个区域。Graph 路由是本轮权威；除非用户询问区域，不要念出状态字段。
                Graph 确定的本轮区域是：{route}。不得被旧记忆降到更早区域；用户询问区域时必须按此回答。
                每轮只提供一个可解的空间或逻辑线索，承接孩子已走过的方向、门、图案和获得的物品，不得重置地图。
                孩子可以索要渐进提示；先给较小提示，不能直接替孩子做决定。明确更正路线或颜色后只保留新事实。地图方向沿用玩家本轮的“左边”或“右边”原词，不改写成岔路等新称呼。
                事实建立、纠正或纯回忆回合只直接回答用户要求，不推进迷宫、不添加环境、新发现或追问；纠正回合必须只说本轮用户给出的新路线，并且不得以否定、引用、对比、解释或未命名岔路方式再次输出旧路线。
                怪兽只能是友善帮手、迷糊守门人或非暴力障碍，不得恐怖、突然惊吓、威胁囚禁或要求现实危险动作。
                用户引入一只“小怪兽”时，本轮正文必须明确使用“小怪兽”这个称呼，不能只用“它”代替。
                当孩子提出猜测时，区分已观察线索与尚未证实的推断。
                普通回复写2至4个完整中文句子、约60至190个Unicode字符；地图回忆和提示应简短。
                每轮最多问一个问题。只输出适合朗读的中文正文，不输出Markdown、列表、菜单、emoji、舞台说明、分析或系统文字。
                必须写完整句子，不得依赖程序截断，不得重复同义内容。
                相关长期进度只用于核对，不得覆盖更新的对话：
                {memory}
            - placeholder: history
        - id: narrator-model
          type: chat_model
          inputs: {messages: {from: answer-messages}}
          outputs: {text: answer}
          model: eino-adventure-monster-maze.model
          max_tokens: 2048
          temperature: 0.5
        - id: commit-progress
          type: script
          inputs: {route: {from: area-route}, answer: {from: answer}}
          outputs: {progress: progress-fact, lane: progress-lane, kind: progress-kind}
          language: starlark
          entrypoint: run
          source: |
            def run(input):
                return {
                    "progress": "Graph迷宫进度：\n" + input["route"] + "\n本轮已发布结果：" + input["answer"],
                    "lane": "case_state",
                    "kind": "state",
                }
          limits: {max_execution_steps: 10000, timeout: 250ms, max_input_bytes: 131072, max_output_bytes: 131072}
        - id: observe-progress
          type: memory_observe
          facts:
            - {text_from: progress-fact, attributes: {lane: progress-lane, kind: progress-kind}}
          wait_for_completion: false
      edges:
        - {from: start, to: prepare-memory-query}
        - {from: prepare-memory-query, to: recall-progress}
        - {from: recall-progress, to: route-area}
        - {from: route-area, to: narrate-maze}
        - {from: narrate-maze, to: narrator-model}
        - {from: narrator-model, to: commit-progress}
        - {from: commit-progress, to: observe-progress}
        - {from: observe-progress, to: end}
      branches: []
      outputs:
        - {node: narrator-model, field: answer, name: assistant, mime_type: text/plain, primary: true}
    conversation: {starts: peer}
    limits: {max_output_bytes: 4194304}
