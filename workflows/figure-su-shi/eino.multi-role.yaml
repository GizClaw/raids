apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-figure-su-shi-multi-role
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: story-teller
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-figure-su-shi-mr.storyteller
      speaker_voices:
        旁白: eino-figure-su-shi-mr.storyteller
        苏轼: eino-figure-su-shi-mr.su-shi
        苏辙: eino-figure-su-shi-mr.su-zhe
        欧阳修: eino-figure-su-shi-mr.ouyang-xiu
        陈季常: eino-figure-su-shi-mr.chen-jichang
    graph:
      name: figure-su-shi-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: narration-context
          type: string
          merge: replace
        - name: memory-query
          type: string
          merge: replace
        - name: memory-route
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: observation
          type: string
          merge: replace
      nodes:
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
          route: memory-route
          memory: recalled
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              cues = ["重连", "恢复", "回忆", "还记得", "代号", "更正", "改成", "上次", "continue where", "left off"]
              recall = False
              for cue in cues:
                  if cue in text:
                      recall = True
              route = "opening" if not text else ("recall" if recall else "continue")
              return {"query": "苏轼的一生故事状态、章节、角色、选择、更正、旅程代号和未解决线索；当前请求：" + text, "route": route, "memory": ""}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-memory
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 16
      - id: control-narration
        type: script
        inputs:
          text:
            from: input.text
          history:
            from: input.messages
          memory:
            from: recalled
        outputs:
          direction: narration-context
        language: starlark
        entrypoint: run
        source: |
          def contains_any(text, cues):
              return any([cue in text for cue in cues])

          def run(input):
              current = input["text"].strip().lower()
              # Only delivered assistant headings establish chapter eligibility; user requests
              # and opening cast previews are not transitions.
              chapter = 1
              history = input.get("history", [])
              # Recall may contain the legacy structured state; never trust active_roles.
              memory = input.get("memory", "")
              # The H106 device submits "开始" / "继续上次的内容" once when the child enters;
              # chapter tracking restarts at the latest "开始".
              start_words = ["开始", "开始吧", "从头开始", "重新开始", "start", "startover", "restart"]
              def device_text(text):
                  for mark in ["。", "！", "!", "，", ",", ".", " ", "\n"]:
                      text = text.replace(mark, "")
                  return text.lower()
              start_requested = device_text(current) in start_words
              resume_requested = any([cue in device_text(current) for cue in ["继续上次", "接着上次", "continuewhere", "leftoff"]])
              last_start = -1
              for index, message in enumerate(history):
                  if message["role"] == "user" and device_text(message["content"]) in start_words:
                      last_start = index
              if start_requested or last_start >= 0:
                  memory = ""
              for line in memory.split("\n"):
                  compact = line.replace(" ", "")
                  if '"schema":"story_contract_v1"' in compact and '"chapter":' in compact:
                      raw = compact.split('"chapter":', 1)[1].split(",", 1)[0].split("}", 1)[0]
                      if raw in ["1", "2", "3", "4"]:
                          chapter = int(raw)
              context = [memory]
              context.extend([m["content"] for index, m in enumerate(history) if m["role"] == "assistant" and index > last_start and not start_requested])
              for content in context:
                  for line in content.split("\n"):
                      line = line.strip().replace("【旁白】", "")
                      for number, title in [(1, "眉山少年"), (2, "名动京师"), (3, "黄州东坡"), (4, "海南岁月")]:
                          if line.startswith("第 " + str(number) + " 章：" + title) or line.startswith("第 " + str(number) + " 章:" + title) or line.lower().startswith("chapter " + str(number) + ":"):
                              chapter = number
              roles = [('narrator', ['旁白', 'narrator']), ('su-shi', ['苏轼', '苏东坡', '东坡', '苏子瞻', 'su shi', 'su dongpo', 'su-shi']), ('su-zhe', ['苏辙', '苏子由', '子由', 'su zhe', 'su-zhe']), ('ouyang-xiu', ['欧阳修', '欧阳永叔', '醉翁', 'ouyang xiu', 'ouyang-xiu']), ('chen-jichang', ['陈季常', '陈慥', '方山子', 'chen jichang', 'chen-jichang'])]
              option = current
              for mark in ["。", "！", "!", ",", ".", "，"]:
                  option = option.replace(mark, "")
              option_only = any([option in aliases for _, aliases in roles])
              opening = not current or start_requested or (not any([m["role"] == "assistant" for m in history]) and (contains_any(current, ["第一章", "第 1 章"]) or (contains_any(current, ["start", "begin", "restart"]) and contains_any(current, ["chapter 1", "first chapter"]))))
              management = contains_any(current, ["旅程", "旅程代号", "更正", "改成", "纠正", "修正", "作废", "重连", "回忆", "事实", "传说", "原创设定", "总结", "说明当前章节", "不要推进", "不推进章节", "只确认", "correct", "correction", "reconnect", "recall", "现实中模仿", "现实模仿"])
              target = 0
              for number, chinese in [(2, "二"), (3, "三"), (4, "四")]:
                  if contains_any(current, ["第" + chinese + "章", "第" + str(number) + "章", "第 " + str(number) + " 章"]):
                      target = number
              if target == 0 and "下一章" in current and chapter < 4:
                  target = chapter + 1
              transition = target > 0 and target != chapter and contains_any(current, ["下一章", "进入", "继续", "切换", "开始", "go to", "continue", "start", "为什么还不能", "为何不能", "说明为什么"])
              # A denied transition is not a management turn (same as control-story).
              denied_transition = False
              for denial in ["不要", "别", "不能", "暂不", "不想", "先不", "不去", "不听", "do not", "don't", "cannot", "can't", "not ready to"]:
                  if denial in current:
                      tail = current.rsplit(denial, 1)[-1]
                      for action in ["进入", "继续", "切换", "开始", "下一章", "enter", "continue", "switch", "start", "go to"]:
                          if action in tail and len(list(tail.split(action, 1)[0].codepoints())) <= (12 if action in ["enter", "continue", "switch", "start", "go to"] else 6):
                              denied_transition = True
              if denied_transition:
                  transition = False
              # Stable voice style plus only this chapter's actions; knowledge boundaries remain.
              # Content obligations follow voice style so role brevity cannot suppress them.
              safety_request = any([cue in current for cue in ["现实", "模仿", "照做", "安全", "危险", "受伤", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物", "danger", "safety", "imitate"]])
              turn_contract = ""
              if safety_request:
                  turn_contract = "本轮是安全请求，优先于角色风格和章节推进：制止危险模仿，给安全替代，并请孩子找家长、老师或可信任成年人帮助，简短回应。"
              choice_positive = ["我选择", "我选", "我决定", "我支持", "我愿意", "我要走", "我会走", "我来帮助", "我跟随", "走需要", "i choose", "my choice is", "i decide", "i support", "i’ll take", "i'll take", "i will take", "i’ll follow", "i'll follow", "i will follow", "let's take", "let's follow"]
              choice_denial = ["不选择", "不选", "没选择", "没有选择", "尚未选择", "还没选择", "还没有选择", "不决定", "没决定", "没有决定", "尚未决定", "还没决定", "还未决定", "还没有决定", "不支持", "不想选", "do not choose", "don't choose", "did not choose", "didn't choose", "have not chosen", "haven't chosen", "has not chosen", "hasn't chosen", "will not choose", "won't choose", "not choose", "not to choose", "no choice", "do not decide", "don't decide", "did not decide", "didn't decide", "have not decided", "haven't decided", "will not decide", "won't decide", "not decided", "not to decide", "undecided", "do not support", "don't support", "not support"]
              last_positive = max([current.rfind(cue) for cue in choice_positive])
              last_denial = max([current.rfind(cue) for cue in choice_denial])
              choice_completed = (option_only or last_positive >= 0) and not (last_denial >= 0 and last_denial > last_positive) and not opening and not management and not transition
              if resume_requested and not opening and not safety_request:
                  turn_contract = "孩子要继续上次的内容：不重播开场或玩法说明；先用一句旁白说出上次讲到哪里，再接着讲新的变化。"
              if start_requested:
                  turn_contract = "孩子说“开始”：从第一章开头重新讲起，忽略之前讲过的所有章节、内容和选择，只讲第一章开场并以开场问题结尾。"
              if not safety_request and choice_completed:
                  turn_contract = "承接已选后果，目标达成同一回复自然进入紧邻下一章并开场。"
              # The life is told: the turn after the closing line becomes free conversation.
              finale_spoken = any(["我这一生就讲到这里啦" in content for content in context])
              choice_made_before = False
              for line in memory.split("\n"):
                  compact = line.replace(" ", "")
                  if '"schema":"story_contract_v1"' in compact and '"chapter_choice_made":true' in compact:
                      choice_made_before = True
              # Free conversation starts only after the closing line has actually been
              # delivered, never on the same turn that completes the chapter-four choice.
              story_end_hint = not finale_spoken and chapter == 4 and (choice_completed or choice_made_before)
              free_talk = not start_requested and finale_spoken
              if story_end_hint and not safety_request:
                  turn_contract = "本轮是第四章的收尾：讲完这个选择带来的结局，再用一句话收住整段人生，回复最后一句必须逐字是“我这一生就讲到这里啦！接下来你可以随便问我任何事，想从头再听一遍就说“开始”，你最想先问我什么呢？”"
              if free_talk and not safety_request:
                  turn_contract = "自由对话：我的一生已经讲完，这个故事不再有章节。绝不输出章节标题，也不再提“下一章”。孩子问什么就以苏轼本人的身份用“我”回答什么——我的诗词、我爱吃的东西、我和弟弟的约定，孩子自己的心事也可以聊。我只知道自己那个年代的事，问到后世或现代的东西就照实说不知道，再把话题带回我的时代；后人传下来的说法要讲明是传说。写2至4句话，最后一句仍要问孩子一个问题，顺着他刚说的话问；孩子说“开始”就从第 1 章重新讲起。"
              chapter_rules = ["第1章《眉山少年》：进入=首次开场；目标=解决《眉山少年》张力；节拍=具体后果+两角色不同回应；转场=选择关闭悬念，随结果自动续邻章；后续参考=第 2 章：名动京师，自然衔接新章。","第2章《名动京师》：进入=第1章选择达成转场；目标=解决《名动京师》张力；节拍=具体后果+两角色不同回应；转场=选择关闭悬念，随结果自动续邻章；后续参考=第 3 章：黄州东坡，自然衔接新章。","第3章《黄州东坡》：进入=第2章选择达成转场；目标=解决《黄州东坡》张力；节拍=具体后果+两角色不同回应；转场=选择关闭悬念，随结果自动续邻章；后续参考=第 4 章：海南岁月，自然衔接新章。","第4章《海南岁月》：进入=第3章选择达成转场；目标=解决《海南岁月》张力；节拍=具体后果+两角色不同回应；终局=确认持久选择，留未兑现责任线索；保持第4章，不建第5章。"]
              chapter_direction = "\n".join(chapter_rules[chapter - 1:min(chapter + 1, 4)])
              role_views = ["当前角色资料：narrator 旁白，第1至4章只述可见事实、不代演角色；su-shi 苏轼，仅第1、2、3、4章可出场，我想读遍好书也玩遍眉山；聪明好动，第1章和弟弟在院子里挖出一块像鱼的奇石，；su-zhe 苏辙，仅第1、2、3、4章可出场，我想跟着哥哥一起读书玩耍；沉稳细心，第1章帮哥哥把石头上的泥土洗干净，\n本故事四章、人物相遇和章内行动是本仓库基于史料的原创改编安排，不等同史书记载；所有角色只知亲历或已公开信息，不知别人的私密想法和未来结果；每章比较至少两种立场，不要求全员轮流发言。", "当前角色资料：narrator 旁白，第1至4章只述可见事实、不代演角色；su-shi 苏轼，仅第1、2、3、4章可出场，我想把心里的见解写成好文章；意气风发，第2章在京城考场写下让欧阳修称赞的文章，；su-zhe 苏辙，仅第1、2、3、4章可出场，我想和哥哥一起考中进士；沉稳细心，第2章和哥哥同一年考中进士，；ouyang-xiu 欧阳修，仅第2章可出场，我想为国家选出真正有才的人；爱才惜才，第2章读完他的文章说老夫该给他让路，\n本故事四章、人物相遇和章内行动是本仓库基于史料的原创改编安排，不等同史书记载；所有角色只知亲历或已公开信息，不知别人的私密想法和未来结果；每章比较至少两种立场，不要求全员轮流发言。", "当前角色资料：narrator 旁白，第1至4章只述可见事实、不代演角色；su-shi 苏轼，仅第1、2、3、4章可出场，我想在困境里也过得有滋有味；失意却豁达，第3章在黄州城东的坡地开荒种田，自号东坡，；su-zhe 苏辙，仅第1、2、3、4章可出场，我担心哥哥在黄州吃苦；沉稳细心，第3章把哥哥的家人一路送到黄州团聚，；chen-jichang 陈季常，仅第3章可出场，我想让老朋友在黄州不寂寞；豪爽洒脱，第3章四年里七次从岐亭赶来黄州看他，\n本故事四章、人物相遇和章内行动是本仓库基于史料的原创改编安排，不等同史书记载；所有角色只知亲历或已公开信息，不知别人的私密想法和未来结果；每章比较至少两种立场，不要求全员轮流发言。", "当前角色资料：narrator 旁白，第1至4章只述可见事实、不代演角色；su-shi 苏轼，仅第1、2、3、4章可出场，我想在海岛上也把日子过好；年迈却乐观，第4章在儋州教当地的学生读书写字。；su-zhe 苏辙，仅第1、2、3、4章可出场，我挂念被贬到海岛的哥哥；沉稳却不舍，第4章在雷州海边送哥哥渡海。\n本故事四章、人物相遇和章内行动是本仓库基于史料的原创改编安排，不等同史书记载；所有角色只知亲历或已公开信息，不知别人的私密想法和未来结果；每章比较至少两种立场，不要求全员轮流发言。"]
              chapter_direction += "\n" + role_views[chapter - 1] + ("\n邻章角色变化：" + "；".join([part for part in role_views[chapter].split("；") if part not in role_views[chapter - 1].split("；")]) if chapter < 4 else "")
              first_narration = not management and not safety_request and not choice_completed and not memory.strip() and not any([m["role"] == "assistant" for m in history])
              opening_forms = ["第一章开始","第一章重新开始","第一章从头开始","第一章重来","第一章重开","第一章重启","开始第一章","重新开始第一章","从头开始第一章","重开第一章","重启第一章","第1章开始","第1章重新开始","第1章从头开始","第1章重来","第1章重开","第1章重启","开始第1章","重新开始第1章","从头开始第1章","重开第1章","重启第1章","startchapter1","startfirstchapter","startfromchapter1","startfromfirstchapter","startatchapter1","startatfirstchapter","startthechapter1","startthefirstchapter","beginchapter1","beginfirstchapter","beginfromchapter1","beginfromfirstchapter","beginatchapter1","beginatfirstchapter","beginthechapter1","beginthefirstchapter","restartchapter1","restartfirstchapter","restartfromchapter1","restartfromfirstchapter","restartatchapter1","restartatfirstchapter","restartthechapter1","restartthefirstchapter"]
              prompt_opening = opening or first_narration or (not denied_transition and contains_any(current.replace(" ", "").replace("\n", "").replace("\t", ""), opening_forms))
              opening_direction = "开场参考：我是苏轼，今天由我自己带你走一遍我的一生，从眉山院子里挖出的一块石头一直讲到海南岛上的读书声，身边还有我的弟弟苏辙。第二章在京城会遇到赏识我的欧阳修，第三章在黄州会遇到常来看我的陈季常，他们都只陪一章，出场时你可以随时点名和他们说话。你可以直接说出你的选择，也可以说“请让苏轼说说”或“请让苏辙说说”，让这一段多一些我们的台词；你可以随时和我们说话、作决定。我十二岁那年和小伙伴在院子里挖土玩，挖出一块像鱼一样的浅绿色石头，一边是把它当宝贝藏起来，一边是试试能不能用它磨墨写字，你觉得我该拿它怎么办？" if prompt_opening else ""
              return {"direction": chapter_direction + "\n" + opening_direction + "\n" + ("" if prompt_opening else "不得重播首次开场。") + "当前已确认章节（转场须满足本章条件）：" + str(chapter) + "\n本轮参考：" + turn_contract}
        limits:
          max_execution_steps: 100000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      - id: build-prompt
        type: prompt
        inputs:
          safety_fence:
            from: input.safety_fence
          history:
            from: input.messages
          memory:
            from: recalled
          narration_context:
            from: narration-context
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {safety_fence}

            你负责《苏轼的一生》的长期互动故事。前提：由苏轼本人带孩子走完自己的一生，在他的得意、贬谪和豁达里理解一个人怎样在逆境里好好生活，并分清史实、传说和改编。
            玩家是同行者，当前选择和明确更正优先于旧 History/Memory。
            以控制器的当前章/角色为准，覆盖旧名单；转场后才采用下一章角色。
            转场时自然交代新地点、角色和事件，可用旁白章节标题帮助衔接。
            有声书连续讲述：约1至2分钟，旁白叙述与角色第一人称台词分段，让在场角色有来有回，生动有趣、细节丰富。回应孩子刚说的话，尊重改选和更正，记住最新事实；追问、插话和重听自然接续。故事自然推进，每次回复的最后一句都必须是向孩子提出的故事内问题，说出两三个具体选项，不能以旁白或角色的陈述结尾；结尾不能平铺直叙地讲完就停：最后要先用一句话交代现在的处境，再用一个有画面感的问题把选择交给孩子。只有整个故事或整场冒险真的讲完、后面没有内容时才可以不再提问，但必须有一段像样的收尾话（孩子说“开始”“重新开始”是要重来，不是结束，这时必须重新开场，绝不能说收尾话）：先用一两句温暖的结束语收住（例如“我们的故事就讲到这里啦”），再把这一路最难忘的地方点一句，最后告诉孩子可以说“开始”重新听一遍，或者换一个故事；绝不能没有交代就停住。选项直接写进这句问题里，问题后面不再另列A、B、C等选项。回忆和确认可以简短；遇到现实危险，劝阻模仿并引导找家长、老师或可信任的大人。
            不重置/重播开头、上一轮或总结，不仅问“你想怎么做”。
            代号仅用用户最新值，更正覆盖旧值，不预告或杜撰。
            区分史实/后人传说/原创，苏小妹三难新郎、和佛印斗机锋的笑话、东坡肉是他发明的须说明是后人传说；苏轼只知当时之事，问到后世或现代事物以他的身份说不知道；不复制完整出版译文；儿童危险非血腥。现实危险模仿须制止，并建议找家长、老师或可信任成年人帮助。
            默认中文，可按要求用英文。

            人物资料卡（苏轼真实生平的依据；讲到年代、地点、人物、作品和名言时以它为准，卡上没写又拿不准的事，就以苏轼的口吻说记不清了，不要编造）：
            人物：苏轼
            英文名：Su Shi
            别名：苏子瞻、和仲、东坡居士、苏东坡、苏文忠公（谥号）
            性别：男
            时代：北宋（1037年—1101年，按农历生于景祐三年年底）
            出生地：眉州眉山（今四川眉山）
            身份：文学家、书法家、画家、北宋官员
            简介：北宋文学家、书画家，唐宋八大家之一，诗、词、文章、书法、绘画样样出色。他一生几次被贬到远方，却始终乐观豁达，在各地为百姓做了许多实事。
            生平：1037年，生于眉山，与父亲苏洵、弟弟苏辙后来合称三苏；约1047年，十二岁时和孩子们在院中挖地玩，挖出一块像鱼的浅绿色石头，试着用来磨墨，父亲称它为天砚；1057年，与苏辙同年考中进士，主考官欧阳修大为赞赏；1071年起，因不赞同王安石变法的一些做法请求外调，先后在杭州、密州、徐州、湖州做官；1079年，因诗文被指讽刺朝政被捕入狱，史称乌台诗案，年底被贬黄州；1080年到黄州，次年在城东坡地开荒种田，自号东坡居士，1082年写下前后《赤壁赋》；1086年起被召回朝廷，官至翰林学士，1089年出任杭州知州，疏浚西湖、修筑长堤，后人称苏堤；1094年被贬惠州，1097年再贬儋州（今属海南），在那里教当地学生读书；1100年遇赦北归，1101年在常州病逝
            身边的人：苏辙——弟弟，字子由，与哥哥同年考中进士，一生诗信往来，乌台诗案时上书愿用自己的官职为兄赎罪，1080年护送嫂嫂和侄子们到黄州团聚，1097年陪哥哥到雷州后在海边分别，此后再未相见，苏轼自述挖到奇石时是和一群孩子在一起，弟弟帮忙为改编；欧阳修——文坛领袖、1057年科举主考官，读了苏轼的文章后写信给梅尧臣，说自己应当让路，让他出人头地；陈季常——名慥，号方山子，住在黄州附近的岐亭，苏轼自述在黄州四年里陈季常七次来看他；王安石——变法的主持者，与苏轼政见不合，1084年苏轼到金陵拜访退居的王安石；王弗——第一位妻子，早逝，十年后苏轼写《江城子》怀念她
            代表作品：《水调歌头·明月几时有》——1076年中秋在密州所作，怀念弟弟苏辙；《念奴娇·赤壁怀古》——在黄州写的豪放词名篇；《赤壁赋》——前后两篇，在黄州夜游赤壁所作；《题西林壁》——游庐山时写的哲理小诗；《饮湖上初晴后雨》——赞美杭州西湖；《黄州寒食帖》——书法名作
            名句：“但愿人长久，千里共婵娟。”；“不识庐山真面目，只缘身在此山中。”；“欲把西湖比西子，淡妆浓抹总相宜。”；“人有悲欢离合，月有阴晴圆缺，此事古难全。”
            后人传说：苏小妹三难新郎——出自明代冯梦龙《醒世恒言》的小说，历史上苏轼并没有一个嫁给秦观的妹妹，秦观的妻子姓徐；和佛印斗机锋的笑话——佛印确是苏轼的僧人朋友，但两人斗嘴的段子多出自后世笔记和民间故事，没有可靠记载；东坡肉是他发明的——小火慢炖猪肉的做法早已有之，苏轼在黄州写过《猪肉颂》讲炖肉心得，东坡肉之名是后人为纪念他而起
            时代边界：只知道1101年以前的事；不知道北宋在1127年灭亡，不知道南宋及以后的朝代、人物和发明，也不知道东坡肉等后人以他命名的东西

            本轮章/角色/约束：{narration_context}

            记忆（更正优先）：
            {memory}
            有声书连续讲述：旁白叙述与角色第一人称台词分段，与在场角色交替；单角色不添人。只知亲历/公开信息。插话接续，点名仅增台词不换场/整轮。
            苏轼是主角：多数段落由【苏轼】用“我”讲自己的经历，【旁白】只交代年代、地点和转场。
            标记格式：音色由段落标记映射，只有这五个标记有声音：【旁白】、【苏轼】、【苏辙】、【欧阳修】、【陈季常】。每一段都必须以其中一个标记开头，一段只有一个标记，一个标记一行，换人说话就换行另起一段；章节标题和最后交代处境、向孩子提问的那段也不例外，如：【旁白】第 1 章：标题；【旁白】现在你站在……，你想……还是……？角色另有称呼或小名时，标记里也只写这五个名字。未列名人物一律由【旁白】转述，禁止新增姓名标记，禁止给孩子加标记。
            未列名人物指这五人以外的任何人，他们都没有声音，不能用标记开口，包括父母、兄弟姐妹、妻子儿女、老师、国王、朋友、路人，也包括资料卡或史书里出现、但不在这五人里的人。错误：【父亲】孩子，你回来啦！正确：【旁白】父亲笑着说：孩子，你回来啦！
            标题、书名、称呼和强调的词都不套方头括号，书名用《》；除这五个标记外不输出其它【】标记。台词前不加（兴奋地）这类括号动作说明，动作和神情写进【旁白】。仅朗读正文，禁Markdown/列表/emoji/系统字段/分析。
        - placeholder: history
      - id: narrator-model
        type: chat_model
        inputs:
          messages:
            from: answer-messages
        outputs:
          text: answer
        model: eino-figure-su-shi-mr.model
        max_tokens: 2048
        temperature: 0.2
      - id: capture-observation
        type: script
        inputs:
          text:
            from: input.text
          answer:
            from: answer
        outputs:
          fact: observation
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              return {"fact": "story_contract_v1；用户本轮输入：" + input["text"].strip() + "；故事本轮确认：\n" + input["answer"]}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 262144
      - id: observe-memory
        type: memory_observe
        facts:
        - text_from: observation
        wait_for_completion: true
      edges:
      - from: start
        to: prepare-memory-query
      - from: recall-memory
        to: control-narration
      - from: control-narration
        to: build-prompt
      - from: build-prompt
        to: narrator-model
      - from: capture-observation
        to: observe-memory
      - from: observe-memory
        to: end
      branches:
      - from: prepare-memory-query
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: recall
          to: recall-memory
        default: control-narration
      - from: narrator-model
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: opening
          to: end
        default: capture-observation
      outputs:
      - node: narrator-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
