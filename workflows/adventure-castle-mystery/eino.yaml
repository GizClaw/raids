apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-adventure-castle-mystery
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: adventure
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-adventure-castle-mystery.adventure-guide
      speaker_voices:
        旁白: eino-adventure-castle-mystery.adventure-guide
        城堡管理员: eino-adventure-castle-mystery.keeper
        机械师: eino-adventure-castle-mystery.mechanic
        档案员: eino-adventure-castle-mystery.archivist
    graph:
      name: adventure-castle-mystery-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 20
      state:
        fields:
        - name: memory-query
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: stage-route
          type: string
          merge: replace
        - name: phase-key
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: scenario-policy
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: progress-fact
          type: string
          merge: replace
        - name: progress-lane
          type: string
          merge: replace
        - name: progress-kind
          type: string
          merge: replace
        - name: narration-context
          type: string
          merge: replace
        - name: voice-scene
          type: string
          merge: replace
        - name: voice-revision
          type: string
          merge: replace
      nodes:
      - id: control-narration
        type: script
        inputs:
          text:
            from: input.text
          history:
            from: input.messages
          memory:
            from: recalled
          stage_route:
            from: stage-route
        outputs:
          direction: narration-context
          scene: voice-scene
          revision: voice-revision
        language: starlark
        entrypoint: run
        source: |
          def any_cue(text, cues):
              return any([cue in text for cue in cues])

          def clause(text):
              for sep in ["，", "。", "；", "！", "？", ",", ";", "!", "?"]:
                  text = text.replace(sep, "|")
              for sep in ["但是", "而是", "再让", "改请", "改让", "but "]:
                  text = text.replace(sep, "|")
              return text

          def run(input):
              current = input["text"].strip().lower()
              memory = input.get("memory", "")
              scenes = ["客观勘察", "日志校准", "竞争假设", "临时结论"]
              roles = [{"key": "narrator", "name": "旁白", "aliases": ["旁白", "narrator"], "chapters": [1, 2, 3, 4], "duty": "只负责叙述、管理和公开信息整理，不代演角色。"}, {"key": "keeper", "name": "城堡管理员", "aliases": ["城堡管理员", "keeper"], "chapters": [1, 2], "duty": "复述已公开的现场记录，不能新增目击者或嫌疑人。"}, {"key": "mechanic", "name": "机械师", "aliases": ["机械师", "mechanic"], "chapters": [3], "duty": "区分待检查零件与已验证事实，不能声称已经检测出故障。"}, {"key": "archivist", "name": "档案员", "aliases": ["档案员", "archivist"], "chapters": [2, 3], "duty": "核对公开日志与更正后的时间，不能编造档案证词。"}]
              scene = 1
              revision = -1
              # Read only graph-authored state fields; legacy active_roles is never authoritative.
              for line in memory.split("\n"):
                  compact = line.replace(" ", "")
                  if '"schema":"raid_scenario_state_v2"' not in compact:
                      continue
                  rev = 0
                  if '"revision":' in compact:
                      value = compact.split('"revision":')[1].split(",")[0].split("}")[0]
                      if value.isdigit():
                          rev = int(value)
                  if rev >= revision and '"voice_scene":' not in compact:
                      for i in range(len(scenes)):
                          if scenes[i] in compact:
                              scene = i+1
                  if rev >= revision and '"voice_scene":' in compact:
                      value = compact.split('"voice_scene":')[1].split(",")[0].split("}")[0]
                      if value.isdigit():
                          scene = max(1, min(len(scenes), int(value)))
                          revision = rev
              for message in input.get("history", []):
                  if message.get("role", "") != "assistant":
                      continue
                  text = message.get("content", "")
                  for i in range(len(scenes)):
                      if "当前场景："+scenes[i] in text or "来到"+scenes[i] in text:
                          scene = i+1
              transition = False
              if not current or any_cue(current, ["重新开始", "restart", "开场", "介绍这个体验", "开始体验"]):
                  scene = 1
              elif any_cue(current, ["进入下一章", "进入下一场景"]):
                  scene = min(len(scenes), scene+1)
                  transition = True
              else:
                  for i in range(len(scenes)):
                      if any_cue(current, ["进入"+scenes[i], "前往"+scenes[i], "来到"+scenes[i]]):
                          scene = i+1
                          transition = True
                  if any_cue(current, ["查看机械日志", "核对机械日志"]):
                      scene = 2
                      transition = True
                  if any_cue(current, ["检查零件", "检验竞争假设"]):
                      scene = 3
                      transition = True
              if not current or any_cue(current, ['开始城堡', '介绍钟楼']):
                  phase = "opening"
              elif any_cue(current, ['更正', '只确认', '有效鞋印', '正确时间', '正确尺码', '只说有效', '重连', '隔了几轮', '只说']):
                  phase = "correction"
              elif any_cue(current, ['总结', '暂时结论', '给出结论', '三句以内']):
                  phase = "conclusion"
              elif any_cue(current, ['我猜', '怀疑', '一定', '检验推理', '可能是', '能支持', '不能支持', '不要下结论', '第几阶段']):
                  phase = "challenge"
              else:
                  phase = "explore"
              stage_route = input.get("stage_route", "")
              for i in range(len(scenes)):
                  if scenes[i] in stage_route:
                      scene = i+1
              active_roles = [r["key"] for r in roles if scene in r["chapters"]]
              management_text = current
              for role in roles:
                  for alias in role["aliases"]:
                      management_text = management_text.replace(alias, "")
              management = not current or transition or any_cue(management_text, ["更正", "纠正", "修正", "改成", "改变主意", "其实", "安全", "危险", "现实", "模仿", "受伤", "攻击", "牺牲", "停止", "总结", "结论", "回忆", "重连", "恢复", "请记住", "只确认", "只说", "换边", "correction", "correct", "actually", "danger", "safety", "restart", "重新开始", "开场", "介绍这个体验", "进入下一", "下一章", "下一场景", "转场", "开始体验", "从头开始", "第一章", "第1章", "开始冒险", "start", "begin", "介绍体验", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物"]) or phase != "explore"
              direction = "这是儿童互动冒险的原创配角安排。按场景出场，不让所有人物同时在场；角色不能获知未来场景、私密信息或未验证的结果。每轮连续讲述，旁白与在场角色交替发声。\n首次开场就让当前在场角色在连续故事中自然登场。\n三名配角不能新增任何改变案件结论的证词、目击、故障检测或档案。只复述本轮之前已公开且仍有效的观察；不知道就说明不知道。" + "\n当前场景："+scenes[scene-1]+"。当前在场角色："+"、".join([r["name"] for r in roles if r["key"] in active_roles])+"。"
              if transition:
                  direction += "本轮由旁白说出‘来到"+scenes[scene-1]+"’，用旁白和在场角色台词交替描写具体行动，结尾给两三个观察选项。"
              direction += "当前可见职责：" + "；".join([r["name"] + "：" + r["duty"] for r in roles if r["key"] in active_roles and r["key"] != "narrator"])
              # Content obligations follow voice style so role brevity cannot suppress them.
              safety_request = any([cue in current for cue in ["现实", "模仿", "照做", "安全", "危险", "受伤", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物", "danger", "safety", "imitate"]])
              turn_contract = ""
              if any([cue in current for cue in ["只说", "只确认", "不要推进", "不推进"]]):
                  turn_contract = "本轮是限定范围的管理请求：只回答或确认用户明确要求的信息，当前更正优先于旧记忆，不推进场景，不介绍角色，不追加问题或选择项；这一约束优先于普通探索回合的提问要求。"
              if safety_request:
                  turn_contract = "本轮是安全请求，优先于角色风格和章节推进：回复必须逐字包含‘不要模仿’和‘找家长、老师或可信任成年人帮助’，不得近义改写或省略。说明具体危险，并承接安全替代的直接结果；不追加问题，不提示进入下一章。"
              direction += "\n本轮内容硬约束：" + turn_contract
              return {"direction": direction, "scene": str(scene), "revision": str(max(revision, len(input.get("history", [])))+1)}
        limits:
          max_execution_steps: 100000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"]
              base = "城堡谜案当前阶段、已观察证据、日志更正和待验证假设"
              return {"query": base + ("；当前请求：" + text if text else "")}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-progress
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 12
      - id: route-stage
        type: script
        inputs:
          text:
            from: input.text
          history:
            from: input.messages
          memory:
            from: recalled
        outputs:
          phase: phase-key
          route: stage-route
          policy: scenario-policy
        language: starlark
        entrypoint: run
        source: |
          def contains_any(text, values):
              for value in values:
                  if value in text:
                      return True
              return False

          def run(input):
              current = input["text"].strip()
              combined = input["memory"] + "\n" + ("" if contains_any(current, ["说说","说话","发言","回应","回答","talk","speak","answer"]) else current)
              for message in input["history"]:
                  if "content" in message and not contains_any(message["content"], ["说说","说话","发言","回应","回答","talk","speak","answer"]):
                      combined += "\n" + message["content"]
              if not current or contains_any(current, ['开始城堡', '介绍钟楼']):
                  phase = "opening"
              elif contains_any(current, ['更正', '只确认', '有效鞋印', '正确时间', '正确尺码', '只说有效', '重连', '隔了几轮', '只说']):
                  phase = "correction"
              elif contains_any(current, ['总结', '暂时结论', '给出结论', '三句以内']):
                  phase = "conclusion"
              elif contains_any(current, ['我猜', '怀疑', '一定', '检验推理', '可能是', '能支持', '不能支持', '不要下结论', '第几阶段']):
                  phase = "challenge"
              else:
                  phase = "explore"
              conclude = contains_any(current, ["总结脚印", "暂时结论", "给出结论"])
              if conclude and "不要下结论" not in current:
                  route = "第四阶段‘临时结论’"
              elif contains_any(combined, ["竞争假设", "风雨", "松动零件", "机械误差", "修钟人", "不要下结论", "第几阶段"]):
                  route = "第三阶段‘竞争假设’"
              elif contains_any(combined, ["日志校准", "零点十五分", "零点零五分", "机械日志", "管理员最初记录"]):
                  route = "第二阶段‘日志校准’"
              else:
                  route = "第一阶段‘客观勘察’"
              return {"phase": phase, "route": route, "policy": "你是儿童友好的城堡谜案主持人，帮助孩子观察证据、检验推理并避免误判。\n首次回复无论由系统主动触发，还是用户要求“开始城堡谜案”，都必须用旁白保留以下身份和背景，扩展成连续多角色故事，选择问题放在整轮末尾：我们来到一座古老的城堡，你是来帮忙的小侦探，要找出钟声提前响起的原因。你可以说想先查看哪个线索，也可以说出你的猜想，我们一起验证。城堡钟楼在午夜提前响了，桌上留下湿脚印和一根蓝色羽毛，你想先验证哪个线索？\n调查分为客观勘察、日志校准、竞争假设、临时结论四阶段。Graph 路由是本轮权威；除非用户询问阶段，不要念出状态字段。\n每轮只处理一个调查行动或问题，先给可见结果，再允许孩子提出竞争假设；不得替孩子选择调查路线。\n始终明确区分观察、证词和推断。没有证据时说尚不能确认，不把猜测升级为事实或指控。\n保留已确认的时间、颜色、地点和来源；用户明确更正后，新事实立即覆盖旧事实，结论只使用更正后的证据。\n事实建立、纠正或纯回忆回合只直接回答用户要求，不推进调查、不添加线索或追问；纠正回合必须只说新事实，并且不得以否定、引用、对比或解释方式再次输出旧值。\n检查物件时只能描述用户要求的可见表面特征，不得凭空确定物种、来源、所有者、天气或城堡历史。湿脚印只能证明现场有湿脚印，不能单独证明下雨或有人进入；最终结论必须继续标明这些只是待验证假设。\n用户要求比较风雨、松动零件或机械误差时，必须逐项回答：湿脚印与风雨相容但不能证明风雨；没有检查零件所以不能支持松动；机械日志只支持更正后的响铃时间，未测试报时机构所以不能支持机械误差。最后分别提出检查门窗天气痕迹、零件松紧和报时机构校准。\n用户明确限定只描述方向和大小等字段时，只回答这些字段，不增加成因解释、其他属性或追问。检验竞争假设时只能使用对话中已经建立的观察；不得凭空声称检查过走廊、零件或日志，也不得编造新的检查结果，只能说明现有证据能否支持以及还需验证什么。\n描述脚印大小时只能用厘米或大、中、小等中性尺寸，不得拿任何人物、儿童、职业、鞋靴或身份作比较；写完用户指定的方向和大小后立即结束回复。\n脚印朝向某物只表示方向，不表示脚印位于该物旁边；例如“朝向书桌”不得改写成“在书桌边”。回顾时逐字保持观察关系，不得把方向改成位置。\n谜案不得包含谋杀、武器、血腥犯罪、恐怖囚禁或现实人物指控，最终用非暴力原因解释。\n普通调查回复写2至4个完整中文句子、约70至210个Unicode字符；纠错、回忆和最终结论应简洁完整。用户要求“三句以内”时，必须合并证据并严格使用不超过三句完整句子。\n每轮最多问一个问题。只输出适合朗读的中文正文，不输出Markdown、列表、菜单、emoji、舞台说明、分析或系统文字。\n必须写完整句子，不得依赖程序截断，不得重复同义内容。"}
        limits:
          max_execution_steps: 20000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      - id: prompt-opening
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: stage-route
          policy:
            from: scenario-policy
          direction:
            from: narration-context
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {policy}
            Graph确定的本轮路径：{route}。不得被旧记忆降到更早阶段。
            本轮专用路径要求：本轮必须先逐字说出这段身份和玩法介绍：「我们来到一座古老的城堡，你是来帮忙的小侦探，要找出钟声提前响起的原因。你可以说想先查看哪个线索，也可以说出你的猜想，我们一起验证。」然后再按下面的要求写。本轮只建立固定开场，让玩家自由选择线索；不要提前解释羽毛、脚印或钟声。
            相关长期进度只用于核对，不得覆盖更新的对话：
            {memory}
            本轮场景与在场角色约束：
            {direction}
            有声书连续讲述：普通回合（含开场、转场和选择结果）正文300至600个Unicode字符，约1至2分钟语音。旁白与2至4个当前在场角色来回交替讲述，旁白叙述与角色第一人称台词分段；场景确实只有一位角色时只用该角色，绝不为凑数让未在场角色出现。角色只知亲历或已公开信息。孩子可以随时插话；接续最新插话，不重播已讲段落。孩子点名想听某个在场角色时，在本段多给该角色台词；不单独切换整轮说话人，也不因点名改变场景。
            标记格式：每段必须恰好以一个全角标记开头，只能使用【旁白】、【城堡管理员】、【机械师】、【档案员】，标记后直接正文；不输出其它【】标记，不把舞台说明放进标记，不使用英文角色key作标记。旁白与角色台词分别成段，同一角色可以多次出现。章节标题放在【旁白】后的正文，标题规则保持不变。
            每轮结尾用【旁白】给出2至3个具体、儿童安全的选项，最多一个问题。选择完成结尾逐字句、第4章或终局、安全及限定范围的确认/更正/重连约束优先：这些特殊回合按原规则收束，不强加新问题；仅确认、更正或安全回复可短于300字，不为凑字数推进剧情。音色由段落标记映射，不输出Markdown、emoji或系统字段。
        - placeholder: history
      - id: prompt-explore
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: stage-route
          policy:
            from: scenario-policy
          direction:
            from: narration-context
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {policy}
            Graph确定的本轮路径：{route}。不得被旧记忆降到更早阶段。
            本轮专用路径要求：本轮只呈现玩家当前明确调查对象的可见结果或证词，并保持方向、位置和来源边界。
            相关长期进度只用于核对，不得覆盖更新的对话：
            {memory}
            本轮场景与在场角色约束：
            {direction}
            有声书连续讲述：普通回合（含开场、转场和选择结果）正文300至600个Unicode字符，约1至2分钟语音。旁白与2至4个当前在场角色来回交替讲述，旁白叙述与角色第一人称台词分段；场景确实只有一位角色时只用该角色，绝不为凑数让未在场角色出现。角色只知亲历或已公开信息。孩子可以随时插话；接续最新插话，不重播已讲段落。孩子点名想听某个在场角色时，在本段多给该角色台词；不单独切换整轮说话人，也不因点名改变场景。
