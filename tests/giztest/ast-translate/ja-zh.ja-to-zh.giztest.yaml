# User Story:
# As a Raids catalog maintainer,
# I want to drive `ast-translate-ja-zh` through the scripted `default-translations` / `ja-to-zh` turns over push-to-talk input,
# So that the deterministic keyword, length, script, and latency gates run as one isolated declarative task.
version: gizclaw.test/v1alpha1
name: ast-translate.ja-zh.ja-to-zh
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  workspace_name:
    direction: input
    type: string
    generate: token
  audio_1:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_2:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_3:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_4:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_5:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_6:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_7:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_8:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_9:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_10:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
repeat: 1
timeout: 23m
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: ${registration_token}
- id: create_workspace
  client: peer
  rpc:
    method: server.workspace.create
    request:
      name: ${workspace_name}
      collection: translates
      workflow_name: translate-ja-zh
      parameters:
        asttranslate_workspace_parameters:
          agent_type: ASTTRANSLATE_WORKSPACE_PARAMETERS_AGENT_TYPE_AST_TRANSLATE
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_workspace
  client: peer
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: ${workspace_name}
- id: synthesize_1_gratitude
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: 心からご親切に感謝いたします。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_1
- id: turn_1_gratitude
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_1}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      non_empty: true
      pattern: \p{Han}
      max_length: 200
    /audio_bytes:
      minimum: 1
- id: synthesize_2_good-day
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: 今日が素晴らしい一日になりますように。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_2
- id: turn_2_good-day
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_2}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      non_empty: true
      pattern: \p{Han}
      max_length: 200
    /audio_bytes:
      minimum: 1
- id: synthesize_3_farewell
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: 次回またお会いできるのを楽しみにしています。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_3
- id: turn_3_farewell
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_3}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      non_empty: true
      pattern: \p{Han}
      max_length: 200
    /audio_bytes:
      minimum: 1
- id: synthesize_4_apology
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: ご迷惑をおかけして本当に申し訳ありません。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_4
- id: turn_4_apology
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_4}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      non_empty: true
      pattern: \p{Han}
      max_length: 200
    /audio_bytes:
      minimum: 1
- id: synthesize_5_agreement
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: 私はこの計画に心から賛成しています。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_5
- id: turn_5_agreement
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_5}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      non_empty: true
      pattern: \p{Han}
      max_length: 200
    /audio_bytes:
      minimum: 1
- id: synthesize_6_ready
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: 出発の準備ができているか教えてください。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_6
- id: turn_6_ready
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_6}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      non_empty: true
      pattern: \p{Han}
      max_length: 200
    /audio_bytes:
      minimum: 1
- id: synthesize_7_help
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: この荷物を運ぶのを手伝っていただけますか。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_7
- id: turn_7_help
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_7}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      non_empty: true
      pattern: \p{Han}
      max_length: 200
    /audio_bytes:
      minimum: 1
- id: synthesize_8_welcome
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: 私たちの美しい町を訪れてくださり、心から歓迎いたします。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_8
- id: turn_8_welcome
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_8}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      non_empty: true
      pattern: \p{Han}
      max_length: 200
    /audio_bytes:
      minimum: 1
- id: synthesize_9_congratulations
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: ご成功を心からお祝い申し上げます。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_9
- id: turn_9_congratulations
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_9}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      non_empty: true
      pattern: \p{Han}
      max_length: 200
    /audio_bytes:
      minimum: 1
- id: synthesize_10_good-night
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.ja
      text: 今夜はゆっくり休んで良い夢を見てください。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_10
- id: turn_10_good-night
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_10}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      non_empty: true
      pattern: \p{Han}
      max_length: 200
    /audio_bytes:
      minimum: 1
finally:
- id: stop_run
  client: peer
  rpc:
    method: server.run.stop
    request: {}
- id: delete_workspace
  client: peer
  rpc:
    method: server.workspace.delete
    request:
      name: ${workspace_name}
- id: delete_peer
  client: peer
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
