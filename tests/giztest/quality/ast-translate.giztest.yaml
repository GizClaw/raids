  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: "${ast_case8_audio_4}"
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_any:
      - 미안
      - 죄송
      pattern: "\\p{Hangul}"
      max_length: 200
    "/audio_bytes":
      minimum: 1
- id: ast_case8_synthesize_5_agreement
  client: ast
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 我完全同意这个计划。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: ast_case8_audio_5
