  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
