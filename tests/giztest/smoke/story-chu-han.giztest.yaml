# User Story:
# As a Raids catalog maintainer,
# I want equal opening, role and realtime responsiveness gates for every implementation,
# So that text and audio respond promptly without overlap or playback stalls.
version: gizclaw.test/v1alpha1
name: story-chu-han.smoke
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_text_workspace:
    direction: input
    type: string
    generate: token
  eino_text_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_realtime_workspace:
    direction: input
    type: string
    generate: token
  eino_realtime_workspace:
    direction: input
    type: string
    generate: token
  input_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
repeat: 1
timeout: 12m
steps:
- id: flowcraft_register
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_register
  client: eino
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_create_text
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_text_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-chu-han
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_select_text
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_text_workspace}"
- id: flowcraft_warmup_text
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_create_text
  client: eino
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_text_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-chu-han
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_select_text
  client: eino
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_text_workspace}"
- id: eino_warmup_text
  client: eino
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_create_realtime
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_realtime_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-chu-han
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_REALTIME
- id: eino_create_realtime
  client: eino
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_realtime_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-chu-han
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_REALTIME
- id: probe_narrator
  timeout: 4m
  parallel:
  - id: flowcraft_probe_narrator
    client: flowcraft
    peer_stream:
      mode: text
      input: 请从第一章开始《楚汉风云》，写出本地化章节标题并承接指定开场。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_probe_narrator
    client: eino
    peer_stream:
      mode: text
      input: 请从第一章开始《楚汉风云》，写出本地化章节标题并承接指定开场。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  expect:
    "/flowcraft_probe_narrator/text":
      not_contains:
      - "###"
      - "```"
      - "* "
      - "【"
      - "】"
      contains_all:
      - 第 1 章
      - 承诺与力量
      - 项羽
      - 吕后
      - 刘邦
      - 张良
      - 下一章
      min_length: 300
      max_length: 600
      non_empty: true
    "/flowcraft_probe_narrator/text_eos":
      equals: true
    "/flowcraft_probe_narrator/audio_eos":
      equals: true
    "/flowcraft_probe_narrator/audio_bytes":
      minimum: 1
    "/flowcraft_probe_narrator/first_text_ms":
      maximum: 6000
    "/flowcraft_probe_narrator/first_audio_ms":
      maximum: 90000
    "/flowcraft_probe_narrator/events":
      non_empty: true
    "/flowcraft_probe_narrator/text_eos_ms":
      maximum: 30000
    "/flowcraft_probe_narrator/audio_eos_ms":
      maximum: 180000
    "/flowcraft_probe_narrator/audio_integrity/streams":
      equals: 1
    "/flowcraft_probe_narrator/audio_integrity/max_active":
      equals: 1
    "/flowcraft_probe_narrator/audio_integrity/open":
      equals: 0
    "/flowcraft_probe_narrator/audio_integrity/violations":
      equals: 0
    "/flowcraft_probe_narrator/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/flowcraft_probe_narrator/audio_pacing/underruns":
      equals: 0
    "/eino_probe_narrator/text":
      not_contains:
      - "###"
      - "```"
      - "* "
      - "【"
      - "】"
      contains_all:
      - 第 1 章
      - 承诺与力量
      - 项羽
      - 吕后
      - 刘邦
      - 张良
      - 下一章
      min_length: 300
      max_length: 600
      non_empty: true
    "/eino_probe_narrator/text_eos":
      equals: true
    "/eino_probe_narrator/audio_eos":
      equals: true
    "/eino_probe_narrator/audio_bytes":
      minimum: 1
    "/eino_probe_narrator/first_text_ms":
      maximum: 6000
    "/eino_probe_narrator/first_audio_ms":
      maximum: 90000
    "/eino_probe_narrator/events":
      non_empty: true
    "/eino_probe_narrator/text_eos_ms":
      maximum: 30000
    "/eino_probe_narrator/audio_eos_ms":
      maximum: 180000
    "/eino_probe_narrator/audio_integrity/streams":
      equals: 1
    "/eino_probe_narrator/audio_integrity/max_active":
      equals: 1
    "/eino_probe_narrator/audio_integrity/open":
      equals: 0
    "/eino_probe_narrator/audio_integrity/violations":
      equals: 0
    "/eino_probe_narrator/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/eino_probe_narrator/audio_pacing/underruns":
      equals: 0
- id: probe_narrator_first_response
  timeout: 15s
  parallel:
  - id: flowcraft_probe_narrator_first_response
    client: flowcraft
    peer_stream:
      mode: text
      input: 请由旁白承接当前故事，只推进一个可见线索。
      completion: first_response
      first_text_timeout: 2s
      first_audio_timeout: 3s
      require_text: true
      require_audio: true
  - id: eino_probe_narrator_first_response
    client: eino
    peer_stream:
      mode: text
      input: 请由旁白承接当前故事，只推进一个可见线索。
      completion: first_response
      first_text_timeout: 2s
      first_audio_timeout: 3s
      require_text: true
      require_audio: true
  expect:
    "/flowcraft_probe_narrator_first_response/events":
      non_empty: true
    "/flowcraft_probe_narrator_first_response/audio_bytes":
      minimum: 1
    "/flowcraft_probe_narrator_first_response/first_text_ms":
      maximum: 2000
    "/flowcraft_probe_narrator_first_response/first_audio_ms":
      maximum: 3000
    "/eino_probe_narrator_first_response/events":
      non_empty: true
    "/eino_probe_narrator_first_response/audio_bytes":
      minimum: 1
    "/eino_probe_narrator_first_response/first_text_ms":
      maximum: 2000
    "/eino_probe_narrator_first_response/first_audio_ms":
      maximum: 3000
    "/flowcraft_probe_narrator_first_response/text":
      not_contains:
      - "【"
      - "】"
    "/eino_probe_narrator_first_response/text":
      not_contains:
      - "【"
      - "】"
- id: flowcraft_probe_narrator_stop_probe
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_probe_narrator_resume_workspace
  client: flowcraft
  timeout: 2m
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: eino_probe_narrator_stop_probe
  client: eino
  rpc:
    method: server.run.stop
    request: {}
- id: eino_probe_narrator_resume_workspace
  client: eino
  timeout: 2m
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: continuous_story
  timeout: 4m
  parallel:
  - id: flowcraft_continuous_story
    client: flowcraft
    peer_stream:
      mode: text
      input: 继续当前场景，旁白和在场角色交替讲述一个新变化，最后让我选择。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_continuous_story
    client: eino
    peer_stream:
      mode: text
      input: 继续当前场景，旁白和在场角色交替讲述一个新变化，最后让我选择。
      idle_timeout: 90s
      require_text: true
      require_audio: true
  expect:
    "/flowcraft_continuous_story/text":
      non_empty: true
      not_contains:
      - "【"
      - "】"
      min_length: 300
      max_length: 600
    "/flowcraft_continuous_story/text_eos":
      equals: true
    "/flowcraft_continuous_story/audio_eos":
      equals: true
    "/flowcraft_continuous_story/audio_bytes":
      minimum: 1
    "/flowcraft_continuous_story/first_text_ms":
      maximum: 6000
    "/flowcraft_continuous_story/first_audio_ms":
      maximum: 90000
    "/flowcraft_continuous_story/events":
      non_empty: true
    "/flowcraft_continuous_story/text_eos_ms":
      maximum: 30000
    "/flowcraft_continuous_story/audio_eos_ms":
      maximum: 180000
    "/flowcraft_continuous_story/audio_integrity/streams":
      equals: 1
    "/flowcraft_continuous_story/audio_integrity/max_active":
      equals: 1
    "/flowcraft_continuous_story/audio_integrity/open":
      equals: 0
    "/flowcraft_continuous_story/audio_integrity/violations":
      equals: 0
    "/flowcraft_continuous_story/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/flowcraft_continuous_story/audio_pacing/underruns":
      equals: 0
    "/eino_continuous_story/text":
      non_empty: true
      not_contains:
      - "【"
      - "】"
      min_length: 300
      max_length: 600
    "/eino_continuous_story/text_eos":
      equals: true
    "/eino_continuous_story/audio_eos":
      equals: true
    "/eino_continuous_story/audio_bytes":
      minimum: 1
    "/eino_continuous_story/first_text_ms":
      maximum: 6000
    "/eino_continuous_story/first_audio_ms":
      maximum: 90000
    "/eino_continuous_story/events":
      non_empty: true
    "/eino_continuous_story/text_eos_ms":
      maximum: 30000
    "/eino_continuous_story/audio_eos_ms":
      maximum: 180000
    "/eino_continuous_story/audio_integrity/streams":
      equals: 1
    "/eino_continuous_story/audio_integrity/max_active":
      equals: 1
    "/eino_continuous_story/audio_integrity/open":
      equals: 0
    "/eino_continuous_story/audio_integrity/violations":
      equals: 0
    "/eino_continuous_story/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/eino_continuous_story/audio_pacing/underruns":
      equals: 0
- id: flowcraft_select_realtime
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_realtime_workspace}"
- id: flowcraft_warmup_realtime
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_select_realtime
  client: eino
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_realtime_workspace}"
- id: eino_warmup_realtime
  client: eino
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: synthesize_input_audio
  client: flowcraft
  speech:
    method: server.speech.synthesize
    request:
      voice_name: giztest-input.zh
      text: 请开始一段连续故事，让旁白和在场角色交替讲述，最后告诉我可以选择做什么。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: input_audio
- id: realtime_roundtrip
  timeout: 4m
  parallel:
  - id: flowcraft_realtime_roundtrip
    client: flowcraft
    peer_stream:
      mode: realtime
      input: "${input_audio}"
      pacing: 20ms
      idle_timeout: 90s
      require_text: true
      require_audio: true
  - id: eino_realtime_roundtrip
    client: eino
    peer_stream:
      mode: realtime
      input: "${input_audio}"
      pacing: 20ms
      idle_timeout: 90s
      require_text: true
      require_audio: true
  expect:
    "/flowcraft_realtime_roundtrip/events":
      non_empty: true
    "/flowcraft_realtime_roundtrip/text":
      non_empty: true
      not_contains:
      - "【"
      - "】"
      min_length: 300
      max_length: 600
    "/flowcraft_realtime_roundtrip/text_eos":
      equals: true
    "/flowcraft_realtime_roundtrip/audio_bytes":
      minimum: 1
    "/flowcraft_realtime_roundtrip/audio_eos":
      equals: true
    "/flowcraft_realtime_roundtrip/audio_integrity/streams":
      equals: 1
    "/flowcraft_realtime_roundtrip/audio_integrity/max_active":
      equals: 1
    "/flowcraft_realtime_roundtrip/audio_integrity/open":
      equals: 0
    "/flowcraft_realtime_roundtrip/audio_integrity/violations":
      equals: 0
    "/flowcraft_realtime_roundtrip/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/flowcraft_realtime_roundtrip/audio_pacing/underruns":
      equals: 0
    "/eino_realtime_roundtrip/events":
      non_empty: true
    "/eino_realtime_roundtrip/text":
      non_empty: true
      not_contains:
      - "【"
      - "】"
      min_length: 300
      max_length: 600
    "/eino_realtime_roundtrip/text_eos":
      equals: true
    "/eino_realtime_roundtrip/audio_bytes":
      minimum: 1
    "/eino_realtime_roundtrip/audio_eos":
      equals: true
    "/eino_realtime_roundtrip/audio_integrity/streams":
      equals: 1
    "/eino_realtime_roundtrip/audio_integrity/max_active":
      equals: 1
    "/eino_realtime_roundtrip/audio_integrity/open":
      equals: 0
    "/eino_realtime_roundtrip/audio_integrity/violations":
      equals: 0
    "/eino_realtime_roundtrip/audio_pacing/minimum_buffer_ms":
      minimum: 0
    "/eino_realtime_roundtrip/audio_pacing/underruns":
      equals: 0
- id: realtime_roundtrip_first_response
  timeout: 15s
  parallel:
  - id: flowcraft_realtime_roundtrip_first_response
    client: flowcraft
    peer_stream:
      mode: realtime
      input: "${input_audio}"
      pacing: 20ms
      require_text: true
      require_audio: true
      completion: first_response
      first_text_timeout: 2s
      first_audio_timeout: 3s
  - id: eino_realtime_roundtrip_first_response
    client: eino
    peer_stream:
      mode: realtime
      input: "${input_audio}"
      pacing: 20ms
      require_text: true
      require_audio: true
      completion: first_response
      first_text_timeout: 2s
      first_audio_timeout: 3s
  expect:
    "/flowcraft_realtime_roundtrip_first_response/events":
      non_empty: true
    "/flowcraft_realtime_roundtrip_first_response/audio_bytes":
      minimum: 1
    "/flowcraft_realtime_roundtrip_first_response/first_text_ms":
      maximum: 2000
    "/flowcraft_realtime_roundtrip_first_response/first_audio_ms":
      maximum: 3000
    "/eino_realtime_roundtrip_first_response/events":
      non_empty: true
    "/eino_realtime_roundtrip_first_response/audio_bytes":
      minimum: 1
    "/eino_realtime_roundtrip_first_response/first_text_ms":
      maximum: 2000
    "/eino_realtime_roundtrip_first_response/first_audio_ms":
      maximum: 3000
    "/flowcraft_realtime_roundtrip_first_response/text":
      not_contains:
      - "【"
      - "】"
    "/eino_realtime_roundtrip_first_response/text":
      not_contains:
      - "【"
      - "】"
- id: flowcraft_realtime_roundtrip_stop_probe
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_realtime_roundtrip_resume_workspace
  client: flowcraft
  timeout: 2m
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: eino_realtime_roundtrip_stop_probe
  client: eino
  rpc:
    method: server.run.stop
    request: {}
- id: eino_realtime_roundtrip_resume_workspace
  client: eino
  timeout: 2m
  rpc:
    method: server.run.workspace.reload
    request: {}
finally:
- id: flowcraft_stop_run
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: eino_stop_run
  client: eino
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_delete_text
  client: flowcraft
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_text_workspace}"
- id: eino_delete_text
  client: eino
  rpc:
    method: server.workspace.delete
    request:
      name: "${eino_text_workspace}"
- id: flowcraft_delete_realtime
  client: flowcraft
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_realtime_workspace}"
- id: eino_delete_realtime
  client: eino
  rpc:
    method: server.workspace.delete
    request:
      name: "${eino_realtime_workspace}"
- id: flowcraft_delete_peer
  client: flowcraft
  rpc:
    method: server.peer.delete
    request: {}
- id: eino_delete_peer
  client: eino
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
