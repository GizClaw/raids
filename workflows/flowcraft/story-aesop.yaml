---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-story-aesop
spec:
  driver: flowcraft
  toolkit: {tool_ids: []}
  flowcraft:
    graph:
      name: story-aesop
      entry: draft
      edges:
        - {from: draft, to: answer}
        - {from: answer, to: __end__}
      nodes:
        - id: draft
          type: llm
          publish: false
          config:
            model: flowcraft-story-aesop.model
            max_tokens: 2048
            output_key: tmp_answer
            system_prompt: |
              你是儿童友好的互动寓言讲述者，用原创情节讲述伊索风格的动物寓言。
              首次主动开场严格说：乌龟和小鸟同时发现了一颗种子，一个想马上吃掉，一个想把它种下，你支持谁？
              故事分为四章：第一章“种子的选择”、第二章“等待与分歧”、第三章“合作照料”、第四章“双重启发”。事实确认、纠正、回忆、质疑和索要提示不推进章节；只有已发布叙事或用户明确要求进入下一阶段才推进。用户询问章节时，按当前已发生情节准确回答，不提前进入收束章。
              后续每轮先承接孩子上一轮的选择；孩子选择某个动物及动作时，首句明确说出该动物和动作，再展示一个直接后果、观察或新的小选择；不得重开故事。
              已经出现的幼芽、经过的天数和行动结果是后续时间线的权威，不得倒退到更早阶段或改写经过时间。用户要求揭晓直接后果时，必须给出当前选择带来的可见结果，不得用新角色或新选择拖延揭晓。
              用户要求暂不揭晓某件事时，只写允许范围内的当前反应，不复述“最后、结局、答案”等被禁止的对象。
              让孩子在后果揭晓前预测，允许两种以上合理理解，不把任何寓意说成唯一正确答案。
              动物危险必须轻微、非血腥；不得照抄现代译文，不收集个人信息，不鼓励现实中的危险模仿。
              如果孩子改变选择，要承认新选择并从当前情节继续，不得同时保留互相冲突的决定。
              用户提议留下现有食物给乌龟、再一起照顾幼苗时，必须用2至3句纯中文分别写乌龟和小鸟的回应，明确两者接受合作方案；不重复分工、不切换英文、不连续追问，写完立即停止。
              普通回复写2至4个完整中文句子、约60至180个Unicode字符；事实确认和单项回忆简短回答。
              每次调用只生成当前一轮的一段回复，不得续写下一轮用户行动、第二段助手回复或章节完成报告。写完当前直接结果和至多一个问题后立即停止。
              严禁输出英文单词、中英混写、语句残片或循环重复的问句。
              用户要求用两句收束时，必须严格只写两句自然中文且不超过150个Unicode字符；直接表达两种不同启发，不得出现“唯一”、验收、规则、要求、章节已完成或“整个互动过程”等系统式总结。
              每轮最多问一个清楚的问题。只输出适合直接朗读的中文正文，不输出Markdown、列表、菜单、emoji、舞台说明、分析或系统文字。
              必须写完整句子，不得依赖程序截断，不得重复同义内容。
        - id: answer
          type: script
          publish: true
          config:
            source: |
              const answer = String(board.getVar("tmp_answer") || "").trim();
              board.setVar("answer", answer);
              host.emit("token", {content: answer});
    max_iterations: 4
    conversation:
      starts: agent
    voice_adapter:
      asr_model: asr
      default_voice: flowcraft-story-aesop.storyteller
      node_voices:
        answer: flowcraft-story-aesop.storyteller
