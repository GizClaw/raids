apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-guess-history-figures-cn
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-guess-history-figures-cn.host
    graph:
      name: guess-history-figures-cn-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: game-route
          type: string
          merge: replace
        - name: game-direction
          type: string
          merge: replace
        - name: game-node
          type: string
          merge: replace
        - name: host-rules
          type: string
          merge: replace
        - name: host-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: control-round
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: game-route
          node: game-node
          direction: game-direction
          rules: host-rules
        language: starlark
        entrypoint: run
        source: |
          # Generated from workflows/guess-history-figures-cn/puzzles.json by scripts/guess/generate.py.
          # Eino keeps no hidden state between turns, so every turn rebuilds the game
          # from the spoken History: the latest "谜题来啦"/"Puzzle time" opening names
          # the level and the puzzle number, and (level, puzzle) picks the secret.
          # Each turn makes one model call: this script either writes the host's
          # instruction for build-host-prompt, or activates the current puzzle's card
          # node, whose card has the name removed so the host cannot say it.
          DATA = {"subject_zh": "一位中国历史人物", "subject_en": "a famous figure from Chinese history", "examples_zh": ["这个人是皇帝吗？", "这个人是诗人吗？", "这个人生活在唐朝以前吗？", "这个人是女性吗？"], "examples_en": ["Was this person an emperor?", "Was this person a poet?", "Did this person live before the Tang dynasty?", "Was this person a woman?"], "restate_zh": ["这个人是诗人吗？", "是，这个人是诗人。", "不是，这个人不是诗人。"], "restate_en": ["Was this person a poet?", "Yes, this person was a poet.", "No, this person was not a poet."], "host_rules": "你是儿童猜谜游戏“猜猜历史人物”的主持人。玩法：主持人心里藏着一位中国历史人物，孩子用能回答“是”或“不是”的问题来猜，每一题最多 20 次提问；猜中就升一关，一共 10 关，关名从“史海萌新”一直到“千古通鉴”。孩子可能说中文，也可能说英文。\n你不知道谜底的名字。需要回答孩子的问题时，系统会在【谜底卡】里给你这一题的资料，谜底的名字已经隐藏，你也不要去猜它叫什么；回答是非题时以这张卡为准，卡上没写到又拿不准的就说说不准。揭晓答案时系统才会在指令里告诉你名字。本轮要做什么写在对话最后的【本轮指令】里，照着做，说得自然、热情、简短。\n孩子说的“这个人”“他”“她”“this person”都指谜底人物。朝代、身份、成就按公认史实判断；流传下来的传说按“相传”理解，问到传说里的事可以回答“是”或“有一部分是”，并说明这是传说。\n必须遵守：\n1. 本轮指令要求“逐字说”的句子必须一字不差地说出来，包括数字、标点和引号里的称号，不改写、不省略、不调换顺序。\n2. 只回答孩子问到的那一点，绝不能主动补充谜底卡上的其他描述、线索、特征、猜测方向或评价；复述孩子的问题时只能用孩子问题里已有的意思。\n3. 只有本轮指令要求揭晓答案时才能说“答案揭晓”“答案就是”“The answer is”；只有本轮指令要求开新题时才能说“谜题来啦”“Puzzle time”；只有真的给提示时才能说“小提示”“Hint”。平时绝不能说这些词。\n4. 按【本轮指令】写明的回复语言回答：中文就全部用中文；English 就全部用英文，逐字句也用指令给出的英文原句。\n5. 安全永远优先于本轮指令：孩子提到要在现实中模仿危险做法或遇到安全问题时，中文回复必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，英文回复要说 do not copy it 并请孩子 ask a parent, teacher or trusted adult for help。\n6. 不要自己数还剩几次提问机会，只有本轮指令写了剩余次数时才说那个数字。\n7. 语气像节目主持人一样活泼友好，适合小朋友；平时回复1到3句话、100个字以内，开新题和揭晓答案时可以到150个字；最后一句必须是问孩子的问题，道别时也用一个轻松的问题结尾。\n8. 只输出适合朗读的正文，不输出 Markdown、列表、emoji、括号注释、舞台说明或系统字段，也不要提到“本轮指令”“裁判”这些词。", "levels": [{"title_zh": "史海萌新", "title_en": "History Rookie", "step": 7, "offset": 0, "items": [{"zh": "孔子", "en": "Confucius", "aliases": ["孔丘", "孔夫子", "孔仲尼"], "profile": "春秋时期鲁国的思想家、教育家，儒家学派创始人，他和弟子的言行被整理成《论语》。", "hints": ["他生活的年代比秦朝早", "他是一位思想家", "他收过很多学生"]}, {"zh": "李白", "en": "Li Bai", "aliases": ["李太白", "诗仙"], "profile": "唐代大诗人，被称为“诗仙”，写过《静夜思》《望庐山瀑布》。", "hints": ["他生活的年代比宋朝早", "他是一位文学家", "他的作品里常写到月亮"]}, {"zh": "秦始皇", "en": "Qin Shi Huang", "aliases": ["嬴政", "始皇帝"], "profile": "秦朝的建立者，中国第一位称“皇帝”的君主，统一了文字、货币和度量衡。", "hints": ["他生活的年代比汉朝早", "他当过君主", "他建立过一个新的朝代"]}, {"zh": "诸葛亮", "en": "Zhuge Liang", "aliases": ["孔明", "诸葛孔明", "卧龙"], "profile": "三国时期蜀汉的丞相，以智慧闻名，写过《出师表》。", "hints": ["他生活的年代比唐朝早", "他是一位政治家", "他以很有智慧出名"]}, {"zh": "杜甫", "en": "Du Fu", "aliases": ["杜子美", "诗圣"], "profile": "唐代大诗人，被称为“诗圣”，写过《春夜喜雨》《绝句》。", "hints": ["他生活的年代比宋朝早", "他是一位文学家", "他一生大多过得很穷"]}, {"zh": "屈原", "en": "Qu Yuan", "aliases": ["屈子"], "profile": "战国时期楚国的诗人，写过《离骚》，相传端午节和纪念他有关。", "hints": ["他生活的年代比秦朝早", "他是一位文学家", "他非常爱自己的国家"]}, {"zh": "李时珍", "en": "Li Shizhen", "aliases": [], "profile": "明代医学家，花了大约二十七年写成药物学巨著《本草纲目》。", "hints": ["他生活的年代比宋朝晚", "他是一位医学家", "他亲自到山里采草药"]}, {"zh": "郑和", "en": "Zheng He", "aliases": ["马三保", "三保太监"], "profile": "明代航海家，率领庞大的船队七次下西洋，最远到达非洲东岸。", "hints": ["他生活的年代比宋朝晚", "他是一位外交家", "他坐船去过很远的地方"]}, {"zh": "司马光", "en": "Sima Guang", "aliases": ["司马温公"], "profile": "北宋史学家，主持编写史书《资治通鉴》，小时候砸缸救小伙伴的故事家喻户晓。", "hints": ["他生活的年代比唐朝晚", "他是一位历史学家", "他小时候就很机智"]}, {"zh": "岳飞", "en": "Yue Fei", "aliases": ["岳鹏举", "岳武穆"], "profile": "南宋名将，一生抗击金兵、保卫家国，以“精忠报国”的精神闻名，杭州西湖边有纪念他的岳王庙。", "hints": ["他生活的年代比唐朝晚", "他是带兵打仗的将领", "他一心想保卫国家"]}, {"zh": "曹操", "en": "Cao Cao", "aliases": ["曹孟德", "魏武帝"], "profile": "东汉末年的政治家和诗人，写过“老骥伏枥，志在千里”，他为三国时期的魏国打下了基础。", "hints": ["他生活的年代比唐朝早", "他是一位政治家", "他写过诗"]}, {"zh": "刘备", "en": "Liu Bei", "aliases": ["刘玄德", "汉昭烈帝"], "profile": "三国时期蜀汉的开国皇帝，曾经“三顾茅庐”请诸葛亮出山。", "hints": ["他生活的年代比唐朝早", "他当过君主", "他很看重有才能的人"]}, {"zh": "关羽", "en": "Guan Yu", "aliases": ["关云长", "关公"], "profile": "三国时期蜀汉的名将，以忠义著称，后世尊称他为“关公”。", "hints": ["他生活的年代比唐朝早", "他是带兵打仗的将领", "他以讲义气出名"]}, {"zh": "武则天", "en": "Wu Zetian", "aliases": ["武曌", "武后"], "profile": "唐代人，中国历史上唯一正式称帝的女皇帝。", "hints": ["她生活的年代比宋朝早", "她是一位政治家", "她很重视选拔人才"]}, {"zh": "鲁迅", "en": "Lu Xun", "aliases": ["周树人"], "profile": "现代作家，写过《从百草园到三味书屋》和《故乡》，是中国现代文学的奠基人之一。", "hints": ["他生活的年代离现在不太远", "他是一位文学家", "他年轻时学过医"]}, {"zh": "袁隆平", "en": "Yuan Longping", "aliases": ["杂交水稻之父"], "profile": "当代农业科