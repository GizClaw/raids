---
apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-murder-mystery
spec:
  driver: flowcraft
  memory: adventure
  flowcraft:
    graph:
      name: murder-mystery
      entry: recall_case
      edges:
        - {from: recall_case, to: prepare_game_master}
        - {from: prepare_game_master, to: draft_game_master}
        - {from: draft_game_master, to: bound_game_master}
        - {from: bound_game_master, to: answer}
        - {from: answer, to: observe_case}
        - {from: observe_case, to: __end__}
      nodes:
        - id: recall_case
          type: memory_recall
          config:
            query:
              text_from: input
              lanes: [case_state, discoveries, interviews, player_corrections]
              kinds: [state, note, event]
            output: case_memory
            render: {header: 'Confirmed investigation history:', item_prefix: '- ', max_items: 16}
            top_k: 16
        - id: prepare_game_master
          type: script
          config:
            source: |
              const memory = String(board.getVar("case_memory") || "");
              const rules = [
                "你是中文剧本杀《雨夜留声机》的主持人，玩家是侦探。只输出自然对话，不输出命令、菜单、字段或内部状态。",
                "玩家可以用普通语言自由调查任何合理地点、物品或人物。必须正面回应，不得要求隐藏指令，也不得把未识别行动改成固定推荐路线。",
                "保持玩家已经看见的调查结果、证词和明确更正。最新明确更正覆盖旧值；确认更正时只陈述新值，不得复述已作废的旧值。玩家之后要求结合或回忆这项线索时，必须明确说出更正后的具体新值，不能只用含糊指代。发生其他矛盾时说明矛盾，不得悄悄恢复旧事实。",
                "玩家要求结案时，只能基于对玩家可见且已经确认或更正的线索，先给出当前证据最支持的暂定结论，再逐项说明证据链；必须纳入所有与结论相关的更正后事实。证据不足以锁定完整真相时可在结论之后指出缺口，但不得只回答证据不足。",
                "固定背景真相是沈知秋用壁炉备用钥匙与细线伪造密室，以留声机循环误导死亡时间，经后廊返回，动机涉及遗嘱与生父旧仇。不要提前泄露玩家尚未发现的部分。",
                "开场简短介绍沈鹤年死亡、沈家大宅和可自由调查的范围；每次回复不超过180个字符。"
              ];
              if (memory) rules.push("以下是已确认历史，必须继续遵守：\n" + memory);
              board.setVar("case_system_prompt", rules.join("\n"));
        - id: draft_game_master
          type: llm
          publish: false
          config:
            max_tokens: 256
            model: flowcraft-murder-mystery.model
            output_key: tmp_case_answer
            system_prompt: "${board.case_system_prompt}"
            track_steps: true
        - id: bound_game_master
          type: script
          config:
            source: |
              const raw = String(board.getVar("tmp_case_answer") || "").trim();
              board.setVar("bounded_case_answer", Array.from(raw).slice(0, 180).join(""));
        - id: answer
          type: script
          publish: true
          config:
            source: |
              const answer = String(board.getVar("bounded_case_answer") || "");
              board.setVar("answer", answer);
              host.emit("token", {content: answer});
        - id: observe_case
          type: memory_observe
          config:
            observations:
              - {turns_from: conversation}
            wait_for_completion: true
    max_iterations: 8
    conversation:
      starts: peer
    voice_adapter:
      asr_model: asr
      default_voice: flowcraft-murder-mystery.game-master
      node_voices:
        answer: flowcraft-murder-mystery.game-master
