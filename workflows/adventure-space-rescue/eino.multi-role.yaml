        - placeholder: history
      - id: narrator-model
        type: chat_model
        inputs:
          messages:
            from: answer-messages
        outputs:
          text: answer
        model: eino-adventure-space-rescue-mr.model
        max_tokens: 2048
        temperature: 0.5
      - id: commit-progress
        type: script
        inputs:
          answer:
            from: answer
          phase:
            from: phase-key
          route:
            from: stage-route
          text:
            from: input.text
          scene:
            from: voice-scene
          voice_revision:
            from: voice-revision
        outputs:
          progress: progress-fact
          lane: progress-lane
          kind: progress-kind
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              scenes = ["恢复通信", "校准能源", "准备安全会合", "执行与收束"]
              scene = input["scene"]
              for i in range(len(scenes)):
                  if "来到" + scenes[i] in input["answer"]:
                      scene = str(i + 1)
              routing = '{"schema":"raid_scenario_state_v2","voice_scene":' + scene + ',"revision":' + input["voice_revision"] + '}\n'
              progress = "schema=raid_scenario_progress_v2; phase=" + input["phase"] + "; route=" + input["route"]
              if input["phase"] == "correction":
                  correction = "latest_valid_facts_preserved_from_history"
                  if "百分之四十五" in input["text"] or "45%" in input["text"]:
                      correction = "energy=百分之四十五"
                  elif "B-21" in input["text"]:
                      correction = "coordinate=B-21"
                  progress += "; correction_authority=latest_user_value; " + correction
              else:
                  progress += "; latest_input=" + input["text"]
              return {"progress": routing + progress, "lane": "case_state", "kind": "state"}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 131072
          max_output_bytes: 131072
      - id: observe-progress
        type: memory_observe
        facts:
        - text_from: progress-fact
          attributes:
            lane: progress-lane
            kind: progress-kind
        wait_for_completion: false
      edges:
      - from: start
        to: prepare-memory-query
      - from: prepare-memory-query
        to: recall-progress
      - from: recall-progress
        to: route-stage
      - from: prompt-opening
        to: narrator-model
      - from: prompt-explore
        to: narrator-model
      - from: prompt-correction
        to: narrator-model
      - from: prompt-challenge
        to: narrator-model
      - from: prompt-conclusion
        to: narrator-model
      - from: narrator-model
        to: commit-progress
      - from: commit-progress
        to: observe-progress
      - from: observe-progress
        to: end
      - from: route-stage
        to: control-narration
      branches:
      - from: control-narration
        mode: first_match
        routes:
        - when:
            field: phase-key
            op: eq
            value: opening
          to: prompt-opening
        - when:
            field: phase-key
            op: eq
            value: correction
          to: prompt-correction
        - when:
            field: phase-key
            op: eq
            value: challenge
          to: prompt-challenge
        - when:
            field: phase-key
            op: eq
            value: conclusion
          to: prompt-conclusion
        default: prompt-explore
      outputs:
      - node: narrator-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
