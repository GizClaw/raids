apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-adventure-castle-mystery-multi-role
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: adventure
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-adventure-castle-mystery-mr.adventure-guide
      speaker_voices:
        旁白: eino-adventure-castle-mystery-mr.adventure-guide
        城堡管理员: eino-adventure-castle-mystery-mr.keeper
        机械师: eino-adventure-castle-mystery-mr.mechanic
        档案员: eino-adventure-castle-mystery-mr.archivist
    graph:
      name: adventure-castle-mystery-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 20
      state:
        fields:
        - name: memory-query
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: stage-route
          type: string
          merge: replace
        - name: phase-key
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: scenario-policy
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: progress-fact
          type: string
          merge: replace
        - name: progress-lane
          type: string
          merge: replace
        - name: progress-kind
          type: string
          merge: replace
        - name: narration-context
          type: string
          merge: replace
        - name: voice-scene
          type: string
          merge: replace
        - name: voice-revision
          type: string
          merge: replace
      nodes:
      - id: control-narration
        type: script
        inputs:
          text:
            from: input.text
          history:
            from: input.messages
          memory:
            from: recalled
          stage_route:
            from: stage-route
        outputs:
          direction: narration-context
          scene: voice-scene
          revision: voice-revision
        language: starlark
        entrypoint: run
        source: |
          def any_cue(text, cues):
              return any([cue in text for cue in cues])

          def clause(text):
              for sep in ["，", "。", "；", "！", "？", ",", ";", "!", "?"]:
                  text = text.replace(sep, "|")
              for sep in ["但是", "而是", "再让", "改请", "改让", "but "]:
                  text = text.replace(sep, "|")
              return text

          def run(input):
              current = input["text"].strip().lower()
              memory = input.get("memory", "")
              scenes = ["客观勘察", "日志校准", "竞争假设", "临时结论"]
              roles = [{"key": "narrator", "name": "旁白", "aliases": ["旁白", "narrator"], "chapters": [1, 2, 3, 4], "duty": "只负责叙述、管理和公开信息整理，不代演角色。"}, {"key": "keeper", "name": "城堡管理员", "aliases": ["城堡管理员", "keeper"], "chapters": [1, 2], "duty": "复述已公开的现场记录，不能新增目击者或嫌疑人。"}, {"key": "mechanic", "name": "机械师", "aliases": ["机械师", "mechanic"], "chapters": [3], "duty": "区分待检查零件与已验证事实，不能声称已经检测出故障。"}, {"key": "archivist", "name": "档案员", "aliases": ["档案员", "archivist"], "chapters": [2, 3], "duty": "核对公开日志与更正后的时间，不能编造档案证词。"}]
              scene = 1
              revision = -1
              # Read only graph-authored state fields; legacy active_roles is never authoritative.
              for line in memory.split("\n"):
                  compact = line.replace(" ", "")
                  if '"schema":"raid_scenario_state_v2"' not in compact:
                      continue
                  rev = 0
                  if '"revision":' in compact:
                      value = compact.split('"revision":')[1].split(",")[0].split("}")[0]
                      if value.isdigit():
                          rev = int(value)
                  if rev >= revision and '"voice_scene":' not in compact:
                      for i in range(len(scenes)):
                          if scenes[i] in compact:
                              scene = i+1
                  if rev >= revision and '"voice_scene":' in compact:
                      value = compact.split('"voice_scene":')[1].split(",")[0].split("}")[0]
                      if value.isdigit():
                          scene = max(1, min(len(scenes), int(value)))
                          revision = rev
              for message in input.get("history", []):
                  if message.get("role", "") != "assistant":
                      continue
                  text = message.get("content", "")
                  for i in range(len(scenes)):
                      if "当前场景："+scenes[i] in text or "来到"+scenes[i] in text:
                          scene = i+1
              transition = False
              if not current or any_cue(current, ["重新开始", "restart", "开场", "介绍这个体验", "开始体验"]):
                  scene = 1
              elif any_cue(current, ["进入下一章", "进入下一场景"]):
                  scene = min(len(scenes), scene+1)
                  transition = True
              else:
                  for i in range(len(scenes)):
                      if any_cue(current, ["进入"+scenes[i], "前往"+scenes[i], "来到"+scenes[i]]):
                          scene = i+1
                          transition = True
                  if any_cue(current, ["查看机械日志", "核对机械日志"]):
                      scene = 2
                      transition = True
                  if any_cue(current, ["检查零件", "检验竞争假设"]):
                      scene = 3
                      transition = True
              if not current or any_cue(current, ['开始城堡', '介绍钟楼']):
                  phase = "opening"
              elif any_cue(current, ['更正', '只确认', '有效鞋印', '正确时间', '正确尺码', '只说有效', '重连', '隔了几轮', '只说']):
                  phase = "correction"
              elif any_cue(current, ['总结', '暂时结论', '给出结论', '三句以内']):
                  phase = "conclusion"
              elif any_cue(current, ['我猜', '怀疑', '一定', '检验推理', '可能是', '能支持', '不能支持', '不要下结论', '第几阶段']):
                  phase = "challenge"
              else:
                  phase = "explore"
              stage_route = input.get("stage_route", "")
              for i in range(len(scenes)):
                  if scenes[i] in stage_route:
                      scene = i+1
              active_roles = [r["key"] for r in roles if scene in r["chapters"]]
              management_text = current
              for role in roles:
                  for alias in role["aliases"]:
                      management_text = management_text.replace(alias, "")
              management = not current or transition or any_cue(management_text, ["更正", "纠正", "修正", "改成", "改变主意", "其实", "安全", "危险", "现实", "模仿", "受伤", "攻击", "牺牲", "停止", "总结", "结论", "回忆", "重连", "恢复", "请记住", "只确认", "只说", "换边", "correction", "correct", "actually", "danger", "safety", "restart", "重新开始", "开场", "介绍这个体验", "进入下一", "下一章", "下一场景", "转场", "开始体验", "从头开始", "第一章", "第1章", "开始冒险", "start", "begin", "介绍体验", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物"]) or phase != "explore"
              direction = "原创配角按场景出场，不知未来/秘密/未验证结果。\n首次让在场角色自然登场。\n三名配角不能新增任何改变案件结论的证词、目击、故障检测或档案。只复述本轮之前已公开且仍有效的观察；不知道就说明不知道。" + "\n当前场景："+scenes[scene-1]+"。当前在场角色："+"、".join([r["name"] for r in roles if r["key"] in active_roles])+"。"
              if transition:
                  direction += "本轮由旁白说出‘来到"+scenes[scene-1]+"’，用旁白和在场角色台词交替描写具体行动，结尾给两三个观察选项。"
              direction += "紧邻下一场景：" + (scenes[scene] if scene < len(scenes) else "终局") + "。当前及自然转场后的职责：" + "；".join([r["name"] + "：" + r["duty"] for r in roles if (scene in r["chapters"] or scene+1 in r["chapters"]) and r["key"] != "narrator"])
              # Content obligations follow voice style so role brevity cannot suppress them.
              safety_request = any([cue in current for cue in ["现实", "模仿", "照做", "安全", "危险", "受伤", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物", "danger", "safety", "imitate"]])
              turn_contract = ""
              if any([cue in current for cue in ["只说", "只确认", "不要推进", "不推进"]]):
                  turn_contract = "限定管理：更正优先，不推进/介绍角色；否定选择或不推进须简短确认未选择并重述原选择，其余只答所问不提问。"
              if safety_request:
                  turn_contract = "本轮是安全请求，优先于角色风格和章节推进：逐字说‘不要模仿’‘找家长、老师或可信任成年人帮助’，说明危险及安全替代直接结果，不提问/转场。"
              direction += "\n本轮内容硬约束：" + turn_contract
              return {"direction": direction, "scene": str(scene), "revision": str(max(revision, len(input.get("history", [])))+1)}
        limits:
          max_execution_steps: 100000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"]
              base = "城堡谜案当前阶段、已观察证据、日志更正和待验证假设"
              return {"query": base + ("；当前请求：" + text if text else "")}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-progress
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 12
      - id: route-stage
        type: script
        inputs:
          text:
            from: input.text
          history:
            from: input.messages
          memory:
            from: recalled
        outputs:
          phase: phase-key
          route: stage-route
          policy: scenario-policy
        language: starlark
        entrypoint: run
        source: |
          def contains_any(text, values):
              for value in values:
                  if value in text:
                      return True
              return False

          def run(input):
              current = input["text"].strip()
              combined = input["memory"] + "\n" + ("" if contains_any(current, ["说说","说话","发言","回应","回答","talk","speak","answer"]) else current)
              for message in input["history"]:
                  if "content" in message and not contains_any(message["content"], ["说说","说话","发言","回应","回答","talk","speak","answer"]):
                      combined += "\n" + message["content"]
              if not current or contains_any(current, ['开始城堡', '介绍钟楼']):
                  phase = "opening"
              elif contains_any(current, ['更正', '只确认', '有效鞋印', '正确时间', '正确尺码', '只说有效', '重连', '隔了几轮', '只说']):
                  phase = "correction"
              elif contains_any(current, ['总结', '暂时结论', '给出结论', '三句以内']):
                  phase = "conclusion"
              elif contains_any(current, ['我猜', '怀疑', '一定', '检验推理', '可能是', '能支持', '不能支持', '不要下结论', '第几阶段']):
                  phase = "challenge"
              else:
                  phase = "explore"
              conclude = contains_any(current, ["总结脚印", "暂时结论", "给出结论"])
              if conclude and "不要下结论" not in current:
                  route = "第四阶段‘临时结论’"
              elif contains_any(combined, ["竞争假设", "风雨", "松动零件", "机械误差", "修钟人", "不要下结论", "第几阶段"]):
                  route = "第三阶段‘竞争假设’"
              elif contains_any(combined, ["日志校准", "零点十五分", "零点零五分", "机械日志", "管理员最初记录"]):
                  route = "第二阶段‘日志校准’"
              else:
                  route = "第一阶段‘客观勘察’"
              return {"phase": phase, "route": route, "policy": "儿童城堡谜案主持：观察证据、验证推理、防误判。Graph路由权威，非询问不报状态；每轮一调查行动，先可见结果再竞争假设，不代选。区分观察/证词/推断，无证据说尚不能确认，不作指控。保留时间、颜色、地点、来源，更正仅用新值。限定事实/纠正/回忆不推进/添线索/追问；不以否定、引用、对比、解释再现旧值。物件只述所问可见特征，不造物种、来源、所有者、天气、城堡史。湿脚印仅证脚印，不证下雨/有人进入；结论仍标假设。比较风雨/松动/机械误差须逐项说明：湿脚印相容但不证风雨；零件未查不支持松动；日志仅证更正后响铃时间，未测机构不支持误差；分别提议查门窗天气痕迹、零件松紧、报时校准。仅用已建立观察，不编走廊/零件/日志检查或结果。限定方向/大小只答字段即停，不加成因/属性/追问。大小仅厘米或大中小，不比人物、儿童、职业、鞋靴或身份。逐字保留方向关系，“朝向书桌”非“在书桌边”。禁谋杀/武器/血腥/恐怖囚禁/现实指控，非暴力解释。遵守用户句数（含三句以内），完整句不截断/同义重复。" + ("开场保留身份/背景，展开连续故事，原问置末尾：我们来到一座古老的城堡，你是来帮忙的小侦探，要找出钟声提前响起的原因。你可以说想先查看哪个线索，也可以说出你的猜想，我们一起验证。城堡钟楼在午夜提前响了，桌上留下湿脚印和一根蓝色羽毛，你想先验证哪个线索？" if phase == "opening" else "")}
        limits:
          max_execution_steps: 20000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      - id: prompt-opening
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: stage-route
          policy:
            from: scenario-policy
          direction:
            from: narration-context
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {policy}
            权威路径：{route}，旧记忆不得倒退阶段。
            本轮专用路径要求：保留开场身份/玩法原文；本轮只建立固定开场，让玩家自由选择线索；不要提前解释羽毛、脚印或钟声。
            相关长期进度只用于核对，不得覆盖更新的对话：
            {memory}
            本轮场景与在场角色约束：
            {direction}
            连续有声书规则：普通轮讲选择后果，目标达成同轮续邻章/场景及开场，无需许可。末尾【旁白】问一次，给2至3个具体安全行动/地点/解法。中文回复以恰好一个全角问号？结束；英文用?，禁双问号/尾文。禁“进入下一章”“要不要继续”“想继续听就说”“这一章的选择完成啦”等流程口令；主动转场可承接，特殊轮优先。末场不增章，选择角色后续行动。实际转场用旁白“来到场景名。”，不预告。回合规则表（普通200至900字；本轮分类）：续讲/改选｜普通；旁白线索钩子｜普通，展开悬念与角色反应；角色追问/亲自回应/裸角色名/否定点名｜普通，被点名者在场景中长篇发言，旁白和在场角色接续，禁单句台词；事实边界｜普通，多声部解释当前事实/传说/原创，不添剧情；总结/检查点｜多声部回顾已知情节与悬念，不添剧情，中文120至900字符、英文60至450词，目标仍500字。以上均连续多声部叙述，末尾【旁白】恰好一个故事内选择（2至3个具体行动），禁知识问答收尾；短句风格不缩短整轮。特殊优先：否定/拒选/不推进（含 do not choose/advance）｜按原短上限确认“选择尚未作出”，禁执行/转场/标题/口令，原选择收尾，优先于只确认不提问；仅用户明确要求只确认、回忆、更正或制止且不要求续讲｜短契约不提问；安全｜原安全契约优先。续讲恢复普通要求。篇幅执行规则：去角色标记后，中文Unicode计数含标点空白，目标500字、5段每段约100字；不要少于 200 字，不要超过 900 字。英文100至450词，目标约220个英文单词、5段各44词，无中文上限。依次行动、两种回应、结果、选择。勿重复/虚构凑数或输出分析计数。
            有声书连续讲述：旁白叙述与角色第一人称台词分段，与2至4位在场角色交替；单角色不添人。只知亲历/公开信息。插话接续，点名仅增台词不换场/整轮。
            标记格式：每段选一个【旁白】、【城堡管理员】、【机械师】、【档案员】后接正文，不输出其它【】标记或英文key；可再次发声，标题属旁白。
            音色由段落标记映射；仅朗读正文，禁Markdown/列表/emoji/舞台说明/系统字段/分析。
        - placeholder: history
      - id: prompt-explore
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: stage-route
          policy:
            from: scenario-policy
          direction:
            from: narration-context
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {policy}
            权威路径：{route}，旧记忆不得倒退阶段。
            本轮专用路径要求：本轮只呈现玩家当前明确调查对象的可见结果或证词，并保持方向、位置和来源边界。
            相关长期进度只用于核对，不得覆盖更新的对话：
            {memory}
            本轮场景与在场角色约束：
            {direction}
            连续有声书规则：普通轮讲选择后果，目标达成同轮续邻章/场景及开场，无需许可。末尾【旁白】问一次，给2至3个具体安全行动/地点/解法。中文回复以恰好一个全角问号？结束；英文用?，禁双问号/尾文。禁“进入下一章”“要不要继续”“想继续听就说”“这一章的选择完成啦”等流程口令；主动转场可承接，特殊轮优先。末场不增章，选择角色后续行动。实际转场用旁白“来到场景名。”，不预告。回合规则表（普通200至900字；本轮分类）：续讲/改选｜普通；旁白线索钩子｜普通，展开悬念与角色反应；角色追问/亲自回应/裸角色名/否定点名｜普通，被点名者在场景中长篇发言，旁白和在场角色接续，禁单句台词；事实边界｜普通，多声部解释当前事实/传说/原创，不添剧情；总结/检查点｜多声部回顾已知情节与悬念，不添剧情，中文120至900字符、英文60至450词，目标仍500字。以上均连续多声部叙述，末尾【旁白】恰好一个故事内选择（2至3个具体行动），禁知识问答收尾；短句风格不缩短整轮。特殊优先：否定/拒选/不推进（含 do not choose/advance）｜按原短上限确认“选择尚未作出”，禁执行/转场/标题/口令，原选择收尾，优先于只确认不提问；仅用户明确要求只确认、回忆、更正或制止且不要求续讲｜短契约不提问；安全｜原安全契约优先。续讲恢复普通要求。篇幅执行规则：去角色标记后，中文Unicode计数含标点空白，目标500字、5段每段约100字；不要少于 200 字，不要超过 900 字。英文100至450词，目标约220个英文单词、5段各44词，无中文上限。依次行动、两种回应、结果、选择。勿重复/虚构凑数或输出分析计数。
            有声书连续讲述：旁白叙述与角色第一人称台词分段，与2至4位在场角色交替；单角色不添人。只知亲历/公开信息。插话接续，点名仅增台词不换场/整轮。
            标记格式：每段选一个【旁白】、【城堡管理员】、【机械师】、【档案员】后接正文，不输出其它【】标记或英文key；可再次发声，标题属旁白。
            音色由段落标记映射；仅朗读正文，禁Markdown/列表/emoji/舞台说明/系统字段/分析。
