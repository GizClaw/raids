ffset": 0, "items": [{"zh": "乌鸦喝水", "en": "a crow drinking water", "aliases": ["the crow and the pitcher", "the thirsty crow"], "profile": "口渴的乌鸦往瓶子里一颗颗放小石子，让水慢慢升高，终于喝到了水。", "hints": ["它是一个寓言故事", "它的主角是一只鸟", "它教我们遇事动脑筋"]}, {"zh": "龟兔赛跑", "en": "the tortoise and the hare", "aliases": ["the hare and the tortoise", "龟兔比赛"], "profile": "骄傲的兔子比赛时半路睡大觉，一直坚持往前爬的乌龟反而先到了终点。", "hints": ["它是一个寓言故事", "它的故事里有两只动物", "它告诉我们不能骄傲"]}, {"zh": "小马过河", "en": "the little horse crosses the river", "aliases": [], "profile": "要过河的小马听老牛说水浅、松鼠说水深，最后自己下河一试，才知道水不深也不浅。", "hints": ["它是一个寓言故事", "它的故事里有好几种动物", "它告诉我们要亲自去试"]}, {"zh": "狼来了", "en": "the boy who cried wolf", "aliases": ["放羊的孩子"], "profile": "放羊娃几次大喊有狼来骗大家，等狼真的来了，再喊也没有人相信他了。", "hints": ["它是一个寓言故事", "它的主角是一个小男孩", "它告诉我们要诚实"]}, {"zh": "小猫钓鱼", "en": "the kitten goes fishing", "aliases": [], "profile": "小猫一会儿捉蜻蜓，一会儿追蝴蝶，一条鱼也没钓到，专心以后才钓到了大鱼。", "hints": ["它是一个寓言故事", "它的主角是一种动物", "它告诉我们做事要专心"]}, {"zh": "猴子捞月", "en": "monkeys fishing for the moon", "aliases": ["猴子捞月亮"], "profile": "一群猴子看见井水里的月亮，以为月亮掉进了井里，就一只拉着一只倒挂下去捞。", "hints": ["它是一个寓言故事", "它的主角是一群动物", "它和夜晚的天空有关"]}, {"zh": "孔融让梨", "en": "Kong Rong gives up the bigger pear", "aliases": [], "profile": "东汉的孔融四岁时，把大个的梨让给哥哥和弟弟，自己拿了最小的一个。", "hints": ["它是一个历史故事", "它的主角是一个小孩", "它和水果有关"]}, {"zh": "司马光砸缸", "en": "Sima Guang breaks the water vat", "aliases": ["司马光破瓮", "司马光砸缸救人"], "profile": "小伙伴掉进装满水的大缸，七岁的司马光搬起石头砸破缸，水流出来，小伙伴得救了。", "hints": ["它是一个历史故事", "它的主角是一个小孩", "它和救人有关"]}, {"zh": "曹冲称象", "en": "Cao Chong weighs the elephant", "aliases": ["曹冲秤象"], "profile": "年幼的曹冲让大象站上船，在船边画线，再换成石头装到同样深，称石头就知道象有多重。", "hints": ["它是一个历史故事", "它的主角是一个小孩", "它和重量有关"]}, {"zh": "嫦娥奔月", "en": "Chang'e flies to the moon", "aliases": ["嫦娥飞天"], "profile": "后羿的妻子吃下了仙药，身体变得很轻，一直飘上了月亮，住进了广寒宫。", "hints": ["它是一个神话故事", "它的主角是一位女子", "它和中秋节有关"]}, {"zh": "拔苗助长", "en": "pulling up seedlings to help them grow", "aliases": ["揠苗助长"], "profile": "宋国有个农夫嫌禾苗长得慢，把它们一棵棵往上拔高，结果禾苗全都枯死了。", "hints": ["它是一个寓言故事", "它的主角是一个农夫", "它告诉我们不能太心急"]}, {"zh": "坐井观天", "en": "looking at the sky from the bottom of a well", "aliases": ["井底之蛙"], "profile": "井底的青蛙以为天只有井口那么大，小鸟告诉它天无边无际，它还不相信。", "hints": ["它是一个寓言故事", "它的故事里有两只动物", "它说的是见识太少"]}, {"zh": "神笔马良", "en": "Ma Liang and the magic brush", "aliases": ["马良神笔"], "profile": "穷孩子马良得到一支神奇的笔，画什么就变成真的，他用它帮助穷苦的人。", "hints": ["它是一个有名的童话", "它的主角是一个小孩", "它和画画有关"]}, {"zh": "铁杵磨成针", "en": "grinding an iron rod into a needle", "aliases": ["磨杵成针", "铁杵成针", "铁杵磨针"], "profile": "小时候贪玩的李白看见一位老奶奶在磨一根铁棒，说要把它磨成针，从此发奋读书。", "hints": ["它是一个民间传说", "它的主角里有一位诗人", "它告诉我们要有恒心"]}, {"zh": "女娲补天", "en": "Nuwa mends the sky", "aliases": [], "profile": "天塌了一个大窟窿，女神女娲炼出五色石把它补好，人们又能安稳地生活了。", "hints": ["它是一个神话故事", "它的主角是一位神仙", "它的故事里有五彩的石头"]}, {"zh": "鲤鱼跳龙门", "en": "the carp leaps over the Dragon Gate", "aliases": ["鲤鱼跃龙门", "鱼跃龙门"], "profile": "黄河里的鲤鱼奋力往上跳，谁能跳过高高的龙门，谁就变成一条真正的龙。", "hints": ["它是一个古老的传说", "它的主角是一种动物", "它和变身有关"]}]}, {"title_zh": "故事小书童", "title_en": "Story Page", "step": 7, "offset": 0, "items": [{"zh": "亡羊补牢", "en": "mending the pen after losing a sheep", "aliases": [], "profile": "羊圈破了个洞，狼钻进来叼走了羊，养羊人起初不修，又丢了羊才赶紧把羊圈补好。", "hints": ["它是一个寓言故事", "它的故事里有动物", "它告诉我们犯错要赶快改"]}, {"zh": "画蛇添足", "en": "drawing legs on a snake", "aliases": [], "profile": "几个人比赛画蛇，先画完的人得意地给蛇添上脚，结果被别人抢先拿走了奖品。", "hints": ["它是一个寓言故事", "它的故事里有一场比赛", "它告诉我们别做多余的事"]}, {"zh": "掩耳盗铃", "en": "covering one's ears to steal a bell", "aliases": [], "profile": "有人想偷一口大钟，怕钟声被人听见，就捂住自己的耳朵，以为别人也听不见。", "hints": ["它是一个寓言故事", "它的主角是一个人", "它告诉我们别自己骗自己"]}, {"zh": "刻舟求剑", "en": "marking the boat to find a lost sword", "aliases": [], "profile": "楚国人坐船时剑掉进江里，他在船边刻个记号，等船停了才从记号那里下水去找。", "hints": ["它是一个寓言故事", "它的故事发生在水上", "它告诉我们要懂得变通"]}, {"zh": "后羿射日", "en": "Hou Yi shoots down the suns", "aliases": ["羿射九日"], "profile": "天上同时出来十个太阳，晒得庄稼都枯了，神箭手后羿射下九个，只留下一个。", "hints": ["它是一个神话故事", "它的主角是一位英雄", "它和天气太热有关"]}, {"zh": "盘古开天", "en": "Pangu separates heaven and earth", "aliases": ["盘古开天地", "盘古开天辟地", "开天辟地"], "profile": "天地还像一个大鸡蛋的时候，巨人盘古用斧头把它劈开，从此有了天和地。", "hints": ["它是一个神话故事", "它的主角是一个巨人", "它和世界的起源有关"]}, {"zh": "大禹治水", "en": "Yu the Great tames the floods", "aliases": ["禹治洪水"], "profile": "洪水泛滥时，禹带着大家挖河道，把水引进大海，十三年里三次路过家门都没进去。", "hints": ["它是一个古老的传说", "它的主角非常能吃苦", "它和挖河道有关"]}, {"zh": "守株待兔", "en": "waiting by a tree stump for a hare", "aliases": [], "profile": "宋国农夫看见一只兔子撞到树桩上倒下了，从此不干活，天天守着树桩等兔子。", "hints": ["它是一个寓言故事", "它的主角是一个农夫", "它告诉我们不能只靠运气"]}, {"zh": "愚公移山", "en": "the foolish old man moves the mountains", "aliases": [], "profile": "老人愚公带着子孙一筐筐挖挡路的两座大山，天帝被感动，派神仙把山背走了。", "hints": ["它是一个寓言故事", "它的主角是一位老人", "它告诉我们要坚持"]}, {"zh": "狐假虎威", "en": "the fox borrows the tiger's might", "aliases": [], "profile": "狐狸骗老虎说自己是百兽之王，带着老虎在森林里走，野兽们其实是被老虎吓跑的。", "hints": ["它是一个寓言故事", "它的故事里有两只动物", "它说的是仗势欺人"]}, {"zh": "玉兔捣药", "en": "the jade rabbit pounds medicine", "aliases": ["月兔捣药"], "profile": "月亮上住着一只白白的兔子，它拿着药杵，一直在捣制长生不老的仙药。", "hints": ["它是一个神话传说", "它的主角是一种动物", "它和月亮有关"]}, {"zh": "凿壁偷光", "en": "boring through the wall to borrow light", "aliases": ["凿壁借光"], "profile": "西汉的匡衡家里穷，晚上点不起灯，就在墙上凿个小洞，借邻居家的烛光读书。", "hints": ["它是一个历史故事", "它的主角爱读书", "它和晚上没有灯有关"]}, {"zh": "孟母三迁", "en": "Mencius's mother moves three times", "aliases": [], "profile": "孟子小时候，妈妈为了给他找好的学习环境搬了三次家，最后搬到了学堂旁边。", "hints": ["它是一个历史故事", "它和一位古代思想家有关", "它说的是学习环境很重要"]}, {"zh": "牛郎织女", "en": "the Cowherd and the Weaver Girl", "aliases": ["鹊桥相会"], "profile": "放牛的青年和天上的仙女结了婚，被王母娘娘用银河隔开，每年七夕在鹊桥上相会。", "hints": ["它是一个民间传说", "它的故事里有神仙", "它和七夕节有关"]}, {"zh": "叶公好龙", "en": "Lord She loves dragons", "aliases": [], "profile": "叶公到处画龙、刻龙，说自己最爱龙，真龙来看他时，他却吓得转身就跑。", "hints": ["它是一个寓言故事", "它的主角是一个人", "它说的是嘴上喜欢心里怕"]}, {"zh": "精卫填海", "en": "Jingwei fills the sea", "aliases": [], "profile": "炎帝的小女儿在东海落水后变成了一只小鸟，每天衔来树枝和石子，要把东海填平。", "hints": ["它是一个神话故事", "它的主角变成了一只鸟", "它告诉我们永不放弃"]}]}, {"title_zh": "寓言小达人", "title_en": "Fable Whiz", "step": 7, "offset": 0, "items": [{"zh": "夸父逐日", "en": "Kuafu chases the sun", "aliases": ["夸父追日"], "profile": "巨人夸父想追上太阳，一路喝干了黄河和渭水，最后倒在路上，手杖化成一片桃林。", "hints": ["它是一个神话故事", "它的主角是一个巨人", "它和跑很远的路有关"]}, {"zh": "自相矛盾", "en": "one's own spear against one's own shield", "aliases": ["以子之矛攻子之盾"], "profile": "楚国人夸自己的盾什么都刺不破，又夸自己的矛什么都能刺破，被人一问就答不上来。", "hints": ["它是一个寓言故事", "它的主角是一个卖东西的人", "它告诉我们说话要前后一致"]}, {"zh": "滥竽充数", "en": "an unskilled player filling a place in the band", "aliases": [], "profile": "不会吹竽的南郭先生混在三百人的乐队里装样子，新国王要一个个听，他只好逃走了。", "hints": ["它是一个寓言故事", "它和音乐有关", "它说的是没有真本领"]}, {"zh": "南辕北辙", "en": "driving north to reach the south", "aliases": [], "profile": "有人要去南方的楚国，却驾车一直往北走，还说自己马好、钱多、车夫本领高。", "hints": ["它是一个寓言故事", "它和坐车赶路有关", "它说的是方向错了"]}, {"zh": "对牛弹琴", "en": "playing the lute to a cow", "aliases": [], "profile": "古代音乐家公明仪对着牛弹了一首高雅的曲子，牛照样低头吃草，一点也不理会。", "hints": ["它是一个古代故事", "它和音乐有关", "它的故事里有一种动物"]}, {"zh": "画龙点睛", "en": "adding the eyes to a painted dragon", "aliases": [], "profile": "南朝画家张僧繇在墙上画了四条龙，给其中两条点上眼睛，它们就破墙飞上了天。", "hints": ["它是一个古代传说", "它的主角是一位艺术家", "它说的是关键的一笔"]}, {"zh": "闻鸡起舞", "en": "rising to practise at the rooster's crow", "aliases": [], "profile": "东晋的祖逖和好友刘琨立志报效国家，半夜听到鸡叫就起床练剑，从不偷懒。", "hints": ["它是一个历史故事", "它的主角是两个好朋友", "它和勤奋练功有关"]}, {"zh": "田忌赛马", "en": "Tian Ji's horse race", "aliases": [], "profile": "孙膑让田忌用下等马对齐王的上等马，再用上等马、中等马赢下后两场，以弱胜强。", "hints": ["它是一个历史故事", "它的故事里有动物", "它和安排顺序有关"]}, {"zh": "囊萤映雪", "en": "reading by fireflies and snow light", "aliases": ["囊萤夜读", "映雪读书"], "profile": "晋朝的车胤用纱袋装萤火虫照明，孙康借着雪地的反光，都在夜里刻苦读书。", "hints": ["它是一个历史故事", "它的主角爱读书", "它和夜里照明有关"]}, {"zh": "黄香温席", "en": "Huang Xiang warms the bed", "aliases": ["扇枕温衾"], "profile": "东汉九岁的黄香夏天给父亲扇凉枕席，冬天先用身体把被子焐暖，再请父亲睡。", "hints": ["它是一个历史故事", "它的主角是一个小孩", "它和孝顺父母有关"]}, {"zh": "杞人忧天", "en": "the man of Qi fears the sky will fall", "aliases": [], "profile": "杞国有个人整天担心天会塌下来、地会陷下去，愁得吃不下饭，也睡不着觉。", "hints": ["它是一个寓言故事", "它的主角是一个普通百姓", "它说的是没必要的烦恼"]}, {"zh": "鹬蚌相争", "en": "the snipe and the clam grapple", "aliases": ["鹬蚌相争渔翁得利", "渔翁得利"], "profile": "鹬去啄蚌的肉，蚌夹住鹬的嘴，谁也不让谁，结果被路过的渔夫一起捉走了。", "hints": ["它是一个寓言故事", "它的故事里有两只动物", "它说的是两方都不肯让"]}, {"zh": "郑人买履", "en": "the man of Zheng buys shoes", "aliases": [], "profile": "郑国人量好脚的尺码却忘了带，跑回家去取，回来集市已散，他宁信尺码也不用脚试。", "hints": ["它是一个寓言故事", "它和去集市有关", "它说的是不懂变通"]}, {"zh": "八仙过海", "en": "the Eight Immortals cross the sea", "aliases": ["八仙过海各显神通"], "profile": "八位神仙要渡过东海，他们不坐船，各自拿出自己的宝物，一起渡过了大海。", "hints": ["它是一个神话传说", "它的主角有好几位", "它说的是各有各的本领"]}, {"zh": "鲁班造锯", "en": "Lu Ban invents the saw", "aliases": ["鲁班发明锯子"], "profile": "木匠鲁班上山时手被带小齿的草叶划破，他受到启发，发明了能锯木头的锯子。", "hints": ["它是一个民间传说", "它的主角是一位工匠", "它和发明有关"]}, {"zh": "仓颉造字", "en": "Cangjie creates writing", "aliases": [], "profile": "传说黄帝时的史官仓颉观察鸟兽留下的脚印，受到启发，创造出了最早的汉字。", "hints": ["它是一个古代传说", "它的主角是一位古人", "它和语文课有关"]}]}, {"title_zh": "成语小侦探", "title_en": "Idiom Detective", "step": 7, "offset": 0, "items": [{"zh": "塞翁失马", "en": "the old man at the frontier loses his horse", "aliases": ["塞翁失马焉知非福"], "profile": "边塞老人的马跑了，他说未必是坏事，不久马带回一匹好马，之后祸福又接连转变。", "hints": ["它是一个寓言故事", "它的故事里有动物", "它说的是好坏会互相转变"]}, {"zh": "卧薪尝胆", "en": "sleeping on brushwood and tasting gall", "aliases": [], "profile": "越王勾践失败后睡在柴草上，每天尝一尝苦胆，提醒自己不忘耻辱，发愤图强。", "hints": ["它是一个历史故事", "它的主角是一位国王", "它说的是失败后发奋"]}, {"zh": "程门立雪", "en": "standing in the snow at Cheng's door", "aliases": [], "profile": "北宋的杨时和朋友去拜见老师程颐，见老师在打盹，就站在门外等，雪积了一尺深。", "hints": ["它是一个历史故事", "它的主角是学生", "它说的是尊敬老师"]}, {"zh": "胸有成竹", "en": "having the bamboo in one's mind", "aliases": ["成竹在胸"], "profile": "北宋画家文与可种了满院竹子，天天观察，画竹子前心里早就有了竹子的样子。", "hints": ["它是一个历史故事", "它的主角是一位画家", "它的故事里种满了植物"]}, {"zh": "入木三分", "en": "three fen deep into the wood", "aliases": [], "profile": "书法家王羲之在木板上写字，工人刻字时发现墨迹渗进木头里足足有三分深。", "hints": ["它是一个历史故事", "它的主角是一位书法家", "它说的是很有力量"]}, {"zh": "班门弄斧", "en": "showing off with an axe at Lu Ban's door", "aliases": [], "profile": "在木匠祖师鲁班家门口摆弄斧头，比喻在行家面前卖弄本领，不自量力。", "hints": ["它来自古人的诗文", "它和一位古代巧匠有关", "它说的是不自量力"]}, {"zh": "买椟还珠", "en": "buying the box and returning the pearl", "aliases": [], "profile": "楚国人把珍珠装进精美的木盒子去卖，郑国人买下了盒子，却把珍珠还给了他。", "hints": ["它是一个寓言故事", "它的故事里有一件宝贝", "它说