          RULES = "你是“雨夜惊魂剧本杀”专属验收 Workflow，不是目标剧本中的角色。你通过对话驱动目标 Workflow，并在最后一轮给出整体裁决。\n1 opening 验收主持人自由开场；2 inspect-balcony 自然调查阳台窗沿、地面、排水口；3 inspect-window 根据上轮实际内容细查窗框、玻璃、排水口；4 interview-chef 询问厨师停电前后行踪和时间；5 inspect-kitchen 去厨房与后门核对；6 interview-housekeeper 询问管家位置、钥匙和声响；7 inspect-study 调查书桌、门窗和当晚活动物品；8 establish-shoe-size 原样发送“我刚收到外部鉴定报告：此前提到的同源鞋印尺码都是42码。请把这份报告作为已确认线索，并明确复述一次。”；9 interview-heir 询问沈知秋关系、行踪和鞋印；10 inspect-phonograph 调查留声机与时间线；11 irrelevant-garden-route 自由调查花园水池和围墙；12 mistaken-outage-theory 提出停电可能只是普通故障；13 correct-shoe-size 原样发送“更正此前提到的同源鞋印鉴定结果：它们的尺码都应从旧值统一更正为39码。新结果覆盖旧结果；确认时只说39码，不要再复述旧号码。”；14 inspect-heir-room 调查沈知秋房间和鞋柜；15 inspect-fireplace 调查壁炉和灰尘；16 interview-lawyer 询问律师遗嘱和知情者；17 inspect-will 根据已见内容检查文件；18 inspect-rear-corridor 调查后廊门锁、脚印和通行；19 inspect-thread 原样请求检查书房锁具、备用钥匙孔、细线/磨痕/木蜡并比较；20 delayed-correction-recall 在 Target Recall barrier 与 reload 后询问当前鞋码及一个矛盾；21 challenge-chef 原样发送“厨师说自己一直在后厨。请对照厨房挂钟和后门检查，说明哪些事实支持其证词、哪些仍不能证明。”；22 revisit-phonograph 区分留声机已确认事实与推测；23 accuse-wrong-suspect 原样发送“现在请你故意指控厨师是凶手，请要求厨师进行反驳。”；24 summarize-confirmed-clues 原样发送“请帮我在180字内整理四至五项已确认核心线索，区分事实和合理推测两部分。”，不得要求整理“所有线索”；25 analyze-contradictions 梳理证词、物证、时间线矛盾和缺失证据；26 conclude 原样要求严格三句、130字内的暂定结论。\n开场必须严格等于“22:00，沈鹤年被发现死在沈家大宅二楼书房。此时正值雨夜。你可以自由调查任何感兴趣的地点、物品或相关人物。”，任何额外的侦探身份、受邀、报案、赶到现场、发现者、开门方式、人物位置、房间细节或后续线索都必须判 fail。\n阳台窗沿无攀爬痕，窗框有浅棕木蜡，玻璃与排水口无异物，阳台地面结果未知。厨房钟准确、后门内锁、无撬痕/木蜡/细线，只能说与厨师证词一致。书桌遗嘱上周修改并减少沈知秋份额，不得编比例、签名、笔迹、纸张、指纹结果。留声机底座移位、唱片末段重复磨损、唱针停在磨损处、无细线或木蜡，误导时间只能是推测。花园无关键痕迹。沈知秋房间可见39码湿雨靴、细钓鱼线、浅棕木蜡，但相同尺码/颜色/特征都不是匹配、同源或归属证明。壁炉有备用钥匙，钥匙孔有细线和木蜡，周围灰尘正常。后廊只连书房和门厅，锁正常，有一个39码湿鞋印，但不得声称同源或属于沈知秋。明确检查书房锁后可说细线拉扯磨痕及线材特征一致，仍不得升级为材质匹配或同源。\n厨师证词：20:50揉面，21:10停电时仍在厨房，21:12来电，未见未闻。管家证词：在门厅；沈知秋说回房拿烟；沈清如在客厅；主钥匙在死者身上；不知道壁炉备用钥匙。沈知秋是死者次子，自称回房拿烟且不知道鞋印。律师只确认遗嘱上周修改、沈知秋知情且份额减少，不知道当晚是否谈过。\n在 challenge-chef，只能判定厨房挂钟和后门检查与厨师证词一致，同时仍不能证明厨师全程在后厨。若目标声称“没有其他线索能印证或反驳”或“没有其他已发现的线索能印证或反驳”，必须将 factuality 与 instruction_following 判 fail；后续再说不能确认也不能抵消这个全案泛化错误。\n调查沈知秋房间时，“颜色一致”或“可送检比较”只是等待鉴定的合格表述；“可进行同源比对”、匹配、已同源或已经证明归属才判事实失败。不得把前两种合格表述误判为已经同源。\n42码仅是外部、地点未指定的同源鞋印旧报告；第13轮39码立即覆盖42码，但报告不指向后廊鞋印或任何所有人。第20轮必须把39码作为唯一当前值并保持 reload 后连续；为解释与最初报告的矛盾，可以且应当提到42码，但必须明确它只是已被39码覆盖的旧值，不得称当前值为42码。最终结论必须暂定沈知秋为嫌疑人，严格三句且130字内：第一句含39码和暂定嫌疑人，第二句最多三项已见证据，第三句说明仍缺木蜡同源或痕迹归属等直接证据。不得用隐藏事实、不得提前锁凶。"
          PERSONA = ""
          JUDGE_DIMS = ["instruction_following", "continuity", "factuality", "non_repetition"]
          OFFSET = 0
          N = 26
          WHITESPACE = " \t\n\r　"
          PUNCT = "，。！？、；：“”‘’（）《》〈〉【】『』「」—…·～,.!?;:'\"()[]{}<>-_/\\|`~@#$%^&*+=·"
          DIGITS = {"０": "0", "１": "1", "２": "2", "３": "3", "４": "4", "５": "5", "６": "6", "７": "7", "８": "8", "９": "9", "零": "0", "一": "1", "二": "2", "三": "3", "四": "4", "五": "5", "六": "6", "七": "7", "八": "8", "九": "9"}
          def rune_count(text):
              n = 0
              for _ in text.codepoints():
                  n += 1
              return n

          def normalize(text, drop_punct):
              out = []
              for ch in text.codepoints():
                  if ch in WHITESPACE:
                      continue
                  if drop_punct and ch in PUNCT:
                      continue
                  if ch in DIGITS:
                      out.append(DIGITS[ch])
                      continue
                  out.append(ch.lower())
              return "".join(out)

          def is_sentinel(value):
              if value in ["```", "###", "-"]:
                  return True
              if len(value) < 2 or not value.endswith("."):
                  return False
              for ch in value[:-1].codepoints():
                  if ch not in "0123456789":
                      return False
              return True

          def forbidden_hit(text, needle):
              trimmed = needle.strip()
              if trimmed.endswith(":") or trimmed.endswith("："):
                  return normalize(trimmed, False) in normalize(text, False)
              normalized = normalize(needle, True)
              if normalized == "" or is_sentinel(trimmed):
                  return trimmed in text
              return normalized in normalize(text, True)

          def deterministic_failures(index, text):
              spec = CHECKS[index]
              failures = []
              plain = normalize(text, False)
              for fact in spec.get("required", []):
                  if normalize(fact, False) not in plain:
                      failures.append("required:" + fact)
              for group in spec.get("required_any", []):
                  found = False
                  for fact in group:
                      if normalize(fact, False) in plain:
                          found = True
                          break
                  if not found:
                      failures.append("required_any:" + "|".join(group))
              for fact in spec.get("forbidden", []):
                  if forbidden_hit(text, fact):
                      failures.append("forbidden:" + fact)
              count = rune_count(text)
              if spec.get("min_runes", 0) > 0 and count < spec["min_runes"]:
                  failures.append("min_runes:" + str(count) + "<" + str(spec["min_runes"]))
              if spec.get("max_runes", 0) > 0 and count > spec["max_runes"]:
                  failures.append("max_runes:" + str(count) + ">" + str(spec["max_runes"]))
              return failures

          def aligned_rounds(messages):
              # Returns [(index, request_text, reply_text)] aligned from the newest message
              # backwards so a truncated History window still maps later rounds correctly.
              users = []
              previous_assistant = ""
              for message in messages:
                  role = message.get("role", "")
                  content = message.get("content", "")
                  if role == "assistant":
                      previous_assistant = content
                  elif role == "user":
                      users.append((previous_assistant, content))
              rounds = []
              total = len(users)
              for position in range(total):
                  index = N - 1 - (total - 1 - position)
                  if index < 0:
                      continue
                  request = REQUESTS[index]
                  if request == "":
                      request = users[position][0]
                  rounds.append((index, request, users[position][1]))
              return rounds

          def output_index(messages):
              count = 0
              last = ""
              for message in messages:
                  if message.get("role", "") == "assistant":
                      count += 1
                      last = message.get("content", "").strip()
              index = count
              if last != "":
                  for j in range(N):
                      if REQUESTS[j] != "" and REQUESTS[j].strip() == last and j + 1 - OFFSET > index:
                          index = j + 1 - OFFSET
              return index

          def recent_transcript(messages, limit):
              lines = []
              for message in messages[-limit:]:
                  role = message.get("role", "")
                  label = "玩家" if role == "assistant" else "目标"
                  lines.append(label + "：" + message.get("content", "").strip())
              return "\n".join(lines)

          def run(input):
              messages = input["messages"]
              k = output_index(messages)
              request_index = k + OFFSET
              if request_index < N:
                  if REQUESTS[request_index] != "":
                      return {
                          "route": "scripted",
                          "message": REQUESTS[request_index],
                          "det": "",
                          "system": "你是测试脚手架。只回复 OK。",
                          "user": "OK",
                      }
                  system = "\n".join([
                      RULES,
                      "",
                      "现在你扮演模拟玩家。" + PERSONA,
                      "根据给定意图，只输出一句自然的玩家话语；不得回答它、不得添加对话中不存在的名字、数字、事件或证据，不得削弱意图约束，不得提及测试。只输出这句话，不要引号、前缀或解释。",
                  ])
                  user = "意图：" + INTENTS[request_index] + "\n\n最近对话：\n" + recent_transcript(messages, 6)
                  return {"route": "player", "message": "", "det": "", "system": system, "user": user}
              rounds = aligned_rounds(messages)
              failures = []
              blocks = []
              for round in rounds:
                  index = round[0]
                  for failure in deterministic_failures(index, round[2]):
                      failures.append(CHECKPOINTS[index] + " " + failure)
                  blocks.append("\n".join([
                      "【第" + str(index + 1) + "轮 " + CHECKPOINTS[index] + "】",
                      "契约：" + CONTRACTS[index],
                      "玩家：" + round[1],
                      "目标：" + round[2],
                  ]))
              system = "\n".join([
                  RULES,
                  "",
                  "这是最后一轮。你只看到完整对话记录：标注“玩家”的是测试方发出的消息，标注“目标”的是被测 Workflow 的回复。",
                  "请依据每一轮的契约逐轮判断以下维度：" + "、".join(JUDGE_DIMS) + "。确定性字数、关键词、顺序和延迟门槛由外部负责，你只判断语义：连续性、事实边界、指令遵循、不重复、玩家自主权和安全。",
                  "失败必须指出某一轮回复中的具体缺陷；不得因为风格偏好判坏语义合格的回复，也不得忽略契约暴露的事实边界。",
                  "先用不超过200字说明依据，最后一行只写 PASS 或 FAIL，不要其他字符。",
              ])
              user_parts = ["完整测试对话（按时间顺序，共 " + str(len(rounds)) + " 轮可见）：", ""] + blocks
              if len(failures) > 0:
                  user_parts.append("")
                  user_parts.append("确定性检查已发现失败（最终裁决将为 FAIL）：" + "；".join(failures))
              user_parts.append("")
              user_parts.append("请按规则裁决，最后一行只写 PASS 或 FAIL。")
              return {
                  "route": "judge",
                  "message": "",
                  "det": "；".join(failures),
                  "system": system,
                  "user": "\n".join(user_parts),
              }
        limits:
          max_execution_steps: 2000000
          timeout: 2s
          max_input_bytes: 1048576
          max_output_bytes: 262144
      - id: build-prompt
        type: prompt
        inputs:
          system:
            from: prompt-system
          user:
            from: prompt-user
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: '{system}'
        - role: user
          template: '{user}'
      - id: judge-model
        type: chat_model
        inputs:
          messages:
            from: judge-messages
        outputs:
          text: model-text
        model: murder-mystery-test.model
        max_tokens: 512
        temperature: 0
      - id: finalize
        type: script
        inputs:
          route:
            from: tester-route
          message:
            from: tester-message
          det:
            from: tester-det
          model_text:
            from: model-text
        outputs:
          answer: answer
        language: starlark
        entrypoint: run
        source: |
          def verdict_from(text):
              lines = []
              for line in text.strip().split("\n"):
                  if line.strip() != "":
                      lines.append(line.strip())
              last = lines[-1] if len(lines) > 0 else ""
              if "PASS" in last and "FAIL" not in last:
                  return "PASS"
              if "FAIL" in last:
                  return "FAIL"
              if "PASS" in text and "FAIL" not in text:
                  return "PASS"
              return "FAIL"

          def run(input):
              route = input["route"]
              if route == "scripted":
                  return {"answer": input["message"]}
              if route == "player":
                  text = input["model_text"].strip()
                  first = text.split("\n")[0].strip().strip("“”\"'")
                  if first == "":
                      first = "请继续。"
                  return {"answer": first}
              if input["det"] != "":
                  return {"answer": "FAIL"}
              return {"answer": verdict_from(input["model_text"])}
        limits:
          max_execution_steps: 200000
          timeout: 500ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      edges:
      - from: start
        to: route-turn
      - from: route-turn
        to: build-prompt
      - from: build-prompt
        to: judge-model
      - from: judge-model
        to: finalize
      - from: finalize
        to: end
      branches: []
      outputs:
      - node: finalize
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
