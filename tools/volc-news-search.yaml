apiVersion: gizclaw.admin/v1alpha1
kind: Tool
metadata:
  id: volc-news-search
spec:
  type: http_request
  invoke_name: news_search
  description: 为新闻播客一次取回10条报道或评论，供多次播放。仅当 Workflow State 标记 needs_search=true 且缓存中的未播新闻、事实和评论均耗尽时才调用。用户说继续本身不是检索理由；仍有未播内容时禁止调用，也不为缺少评论而提前检索。
  input_schema:
    type: object
    properties:
      query:
        type: string
        description: 一个简洁的中文搜索短语，不超过 100 个字，例如“2026年10月13日人工智能新闻”。
      search_type:
        type: string
        enum:
        - web
        description: 固定填 web。
      count:
        type: integer
        enum:
        - 10
        description: 固定填10，一批结果供多轮播放。
      time_range:
        anyOf:
        - type: string
          enum:
          - OneDay
          - OneWeek
        description: 扫描今日新闻填OneDay；整批补充背景和主流媒体评论填OneWeek。仍须核实每条来源的实际日期。
    required:
    - query
    - search_type
    - count
    - time_range
    additionalProperties: false
  http:
    url: https://open.feedcoopapi.com/search_api/web_search
    method: POST
    auth:
      method: volc_search
      credential: volc-credential
    body:
    - argument_pointer: /query
      target: /Query
    - argument_pointer: /search_type
      target: /SearchType
    - argument_pointer: /count
      target: /Count
    - argument_pointer: /time_range
      target: /TimeRange
    response_pointer: /Result
    timeout: 10s
    max_response_bytes: 1048576
