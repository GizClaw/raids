# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for flowcraft-story-chu-han,
# So that every reachable role path produces text and non-empty synthesized audio.
version: gizclaw.test/v1alpha1
name: story-chu-han.flowcraft.roles
clients:
  narrator: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  xiang_yu: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  empress_lu: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
  narrator_workspace: {direction: input, type: string, generate: token}
  xiang_yu_workspace: {direction: input, type: string, generate: token}
  empress_lu_workspace: {direction: input, type: string, generate: token}
repeat: 1
timeout: 12m
steps:
- id: register_narrator
  client: narrator
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: ${narrator_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-chu-han
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${narrator_workspace}"}}
- id: register_xiang-yu
  client: xiang_yu
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_xiang-yu_workspace
  client: xiang_yu
  rpc:
    method: server.workspace.create
    request:
      name: ${xiang_yu_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-chu-han
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_xiang-yu_workspace
  client: xiang_yu
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${xiang_yu_workspace}"}}
- id: register_empress-lu
  client: empress_lu
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_empress-lu_workspace
  client: empress_lu
  rpc:
    method: server.workspace.create
    request:
      name: ${empress_lu_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-chu-han
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_empress-lu_workspace
  client: empress_lu
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${empress_lu_workspace}"}}
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: "请由旁白承接当前故事，只推进一个可见线索。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 旁白}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_xiang-yu
  client: xiang_yu
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让项羽亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 项羽}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_empress-lu
  client: empress_lu
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让吕后亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 吕后}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
finally:
- id: stop_narrator_run
  client: narrator
  rpc: {method: server.run.stop, request: {}}
- id: delete_narrator_workspace
  client: narrator
  rpc: {method: server.workspace.delete, request: {name: "${narrator_workspace}"}}
- id: delete_narrator_peer
  client: narrator
  rpc: {method: server.peer.delete, request: {}}
- id: stop_xiang-yu_run
  client: xiang_yu
  rpc: {method: server.run.stop, request: {}}
- id: delete_xiang-yu_workspace
  client: xiang_yu
  rpc: {method: server.workspace.delete, request: {name: "${xiang_yu_workspace}"}}
- id: delete_xiang-yu_peer
  client: xiang_yu
  rpc: {method: server.peer.delete, request: {}}
- id: stop_empress-lu_run
  client: empress_lu
  rpc: {method: server.run.stop, request: {}}
- id: delete_empress-lu_workspace
  client: empress_lu
  rpc: {method: server.workspace.delete, request: {name: "${empress_lu_workspace}"}}
- id: delete_empress-lu_peer
  client: empress_lu
  rpc: {method: server.peer.delete, request: {}}
report:
  redact: [registration_token]
