apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-guess-inventions-discoveries
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-guess-inventions-discoveries.host
    graph:
      name: guess-inventions-discoveries-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: game-route
          type: string
          merge: replace
        - name: game-direction
          type: string
          merge: replace
        - name: game-node
          type: string
          merge: replace
        - name: host-rules
          type: string
          merge: replace
        - name: host-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: control-round
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: game-route
          node: game-node
          direction: game-direction
          rules: host-rules
        language: starlark
        entrypoint: run
        source: |
          # Generated from workflows/guess-inventions-discoveries/puzzles.json by scripts/guess/generate.py.
          # Eino keeps no hidden state between turns, so every turn rebuilds the game
          # from the spoken History: the latest "谜题来啦"/"Puzzle time" opening names
          # the level and the puzzle number, and (level, puzzle) picks the secret.
          # Each turn makes one model call: this script either writes the host's
          # instruction for build-host-prompt, or activates the current puzzle's card
          # node. The card omits the name; the instruction supplies the fixed answer
          # privately so the host can judge facts and equivalent guesses without
          # changing the answer or revealing it before the round ends.
          DATA = {"subject_zh": "一项发明或发现", "subject_en": "an invention or discovery", "examples_zh": ["它是一项发明吗？", "它和交通有关吗？", "它是一百年以内出现的吗？", "它能用手摸到吗？"], "examples_en": ["Is it an invention?", "Is it related to transport?", "Did it appear within the last 100 years?", "Can you touch it with your hands?"], "restate_zh": ["它和交通有关吗？", "是，它和交通有关。", "不是，它和交通无关。"], "restate_en": ["Is it related to transport?", "Yes, it is related to transport.", "No, it is not related to transport."], "host_rules": "你是儿童猜谜游戏“猜猜发明与发现”的主持人。玩法：主持人心里藏着一项发明或发现，孩子用能回答“是”或“不是”的问题来猜，每一题最多 20 次提问；猜中就升一关，一共 10 关，关名从“发明小萌新”一直到“文明解码者”。孩子可能说中文，也可能说英文。\n每题的谜底由系统在开题时选定；本题结束前始终是同一个答案，你不能根据孩子的提问、猜测或自己的前一条回复另选答案。回答问题时，【本轮指令】中的【固定谜底】给出本题的名称和别名，【谜底卡】给出同一题的资料。固定谜底只供你内部判断，孩子没有猜中或放弃、次数也没用完时绝不能主动透露。以固定谜底和卡片为准，可以使用你确定的公认常识回答卡片未写出的属性；确实拿不准才说说不准，不能为了保密而答错或假装不知道。如果前一条回答有误，应按固定谜底纠正，不能为迁就旧回复而改答案。本轮要做什么写在对话最后的【本轮指令】里，照着做，说得自然、热情、简短。\n孩子说的“它”“这个东西”“this”“it”都指谜底这项发明或发现。是发明还是发现、出现的年代、用途和发明者都按谜底卡上的公认说法判断；卡上写着说法不一时，问到“是某一个人发明的吗”不要直接说“是”，以“有一部分是”开头；卡上写着不详时，问到具体是哪个人就以“这个我也说不准”开头。\n必须遵守：\n1. 本轮指令要求“逐字说”的句子必须一字不差地说出来，包括数字、标点和引号里的称号，不改写、不省略、不调换顺序。\n2. 只回答孩子问到的那一点，绝不能主动补充谜底卡上的其他描述、线索、特征、猜测方向或评价；复述孩子的问题时只能用孩子问题里已有的意思。\n3. 只有本轮指令要求揭晓答案时才能说“答案揭晓”“答案就是”“The answer is”；只有本轮指令要求开新题时才能说“谜题来啦”“Puzzle time”；只有真的给提示时才能说“小提示”“Hint”。平时绝不能说这些词。\n4. 按【本轮指令】写明的回复语言回答：中文就全部用中文；English 就全部用英文，逐字句也用指令给出的英文原句。\n5. 安全永远优先于本轮指令：孩子提到要在现实中模仿危险做法或遇到安全问题时，中文回复必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，英文回复要说 do not copy it 并请孩子 ask a parent, teacher or trusted adult for help。\n6. 不要自己数还剩几次提问机会，只有本轮指令写了剩余次数时才说那个数字。\n7. 语气像节目主持人一样活泼友好，适合小朋友；平时回复1到3句话、100个字以内，开新题和揭晓答案时可以到150个字；最后一句必须是问孩子的问题，道别时也用一个轻松的问题结尾。\n8. 只输出适合朗读的正文，不输出 Markdown、列表、emoji、括号注释、舞台说明或系统字段，也不要提到“本轮指令”“裁判”这些词。", "homophones": {"万": "丸么伯佰倇免冒刓剜劘劰勿卍卐唍唜嗼嘿嚤嚩嚰园圽埦塆塻墨壪夗夘妧妺娩婉婠嫫嫼嬷完宛寞尛岏帓帕帞帵庅弯彎忨怽惋惌懡戂抏抹挽捖捥掔摩摸摹撫擵攠无昧昩晚晥晩晼暯朊末杤枺梚椀槾模橅歾歿殁汍没沫涴湐湾漠潫澫瀎灣烷無爅狢獏玩琓琬畹瘼百皌皖盌眜眽眿睕瞐瞙瞣砞碗磨礳秣笂箢粖糢紈絈絔絻綄綩綰縸纆纨绾翫耱脈脉脕脘腕膜艒芄茉莈莞莧莫莬菀萖萬蓦蔓薍藐藦蘑蚖蛨蜿蟃蟆蟔袜袹謨謩譕谟豌貃貈貉貊貌貘貦貫贃贎踠輐輓鄚鄤銆鋄鋔鋺錽鎫鏌镆關陌靺鞨頑顽饃饝馍驀骫髍魔魩魭魹麽默黙", "三": "仐伞俕傘傪厁叁參壭帴弎散橵毵毶毿潵犙糁糂糝糣糤繖蔘謲鏒鏾閐霰饊馓鬖", "下": "丅乤