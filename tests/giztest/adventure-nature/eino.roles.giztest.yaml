- id: tracker_scene_setup_2
  client: tracker
  timeout: 2m
  peer_stream:
    mode: text
    input: 进入足迹观察。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
