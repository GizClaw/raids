apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-story-wizard-oz-multi-role
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: story-teller
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-story-wizard-oz-mr.storyteller
      speaker_voices:
        旁白: eino-story-wizard-oz-mr.storyteller
        多萝西: eino-story-wizard-oz-mr.dorothy
        稻草人: eino-story-wizard-oz-mr.scarecrow
        铁皮人: eino-story-wizard-oz-mr.tin-man
        狮子: eino-story-wizard-oz-mr.lion
        格琳达: eino-story-wizard-oz-mr.glinda
    graph:
      name: story-wizard-oz-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: narration-context
          type: string
          merge: replace
        - name: memory-query
          type: string
          merge: replace
        - name: memory-route
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: observation
          type: string
          merge: replace
      nodes:
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
          route: memory-route
          memory: recalled
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"].strip()
              lower = text.lower()
              language_denials = ["don't use english", "do not use english", "not in english", "without english", "don't continue in english", "do not continue in english", "not continue in english", "don't introduce", "do not introduce", "not introduce", "never introduce", "stop using english", "continue in chinese", "use chinese"]
              chinese_language_denials = ["不要用英文", "别用英文", "不用英文", "不要用英语介绍", "别用英语介绍", "用中文", "用汉语"]
              language_denied = False
              for cue in language_denials:
                  if cue in lower:
                      language_denied = True
              for cue in chinese_language_denials:
                  if cue in text:
                      language_denied = True
              requests_english = not language_denied and ("english" in lower or "用英文" in text or "英语" in text)
              restart_denials = ["don't restart", "do not restart", "not restart", "without restart", "no restart", "rather than restart", "instead of restart"]
              restart_denied = "不要重启" in text or "别重启" in text or "无需重启" in text
              for cue in restart_denials:
                  if cue in lower:
                      restart_denied = True
              restart_intent = ("restart" in lower or "introduce this experience" in lower or "重启" in text or "重新开始" in text or "介绍这个体验" in text)
              cues = ["重连", "恢复", "回忆", "还记得", "代号", "更正", "改成", "reconnect", "recover", "recall", "remember", "connection restored"]
              recall = False
              for cue in cues:
                  if cue in lower:
                      recall = True
              route = "opening" if not text else ("english_restart" if requests_english and restart_intent and not restart_denied else ("english_continue_recall" if requests_english and recall else ("english_continue" if requests_english else ("recall" if recall else "continue"))))
              return {"query": "绿野仙踪故事状态、章节、角色、选择、更正、旅程代号和未解决线索；当前请求：" + text, "route": route, "memory": ""}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-memory
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 16
      - id: control-narration
        type: script
        inputs:
          text:
            from: input.text
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: memory-route
        outputs:
          direction: narration-context
        language: starlark
        entrypoint: run
        source: |
          def contains_any(text, cues):
              return any([cue in text for cue in cues])

          def run(input):
              current = input["text"].strip().lower()
              # Only delivered assistant headings establish chapter eligibility; user requests
              # and opening cast previews are not transitions.
              chapter = 1
              history = input.get("history", [])
              # Recall may contain the legacy structured state; never trust active_roles.
              memory = input.get("memory", "")
              for line in memory.split("\n"):
                  compact = line.replace(" ", "")
                  if '"schema":"story_contract_v1"' in compact and '"chapter":' in compact:
                      raw = compact.split('"chapter":', 1)[1].split(",", 1)[0].split("}", 1)[0]
                      if raw in ["1", "2", "3", "4"]:
                          chapter = int(raw)
              context = [memory]
              context.extend([m["content"] for m in history if m["role"] == "assistant"])
              for content in context:
                  for line in content.split("\n"):
                      line = line.strip().replace("【旁白】", "")
                      for number, title in [(1, "黄砖岔路"), (2, "勇气考验"), (3, "智慧迷城"), (4, "伙伴归途")]:
                          if line.startswith("第 " + str(number) + " 章：" + title) or line.startswith("第 " + str(number) + " 章:" + title) or line.lower().startswith("chapter " + str(number) + ":"):
                              chapter = number
              roles = [('narrator', ['旁白', 'narrator']), ('dorothy', ['多萝西', 'dorothy']), ('scarecrow', ['稻草人', 'scarecrow']), ('tin-man', ['铁皮人', '铁樵夫', 'tin man', 'tin-man']), ('lion', ['狮子', '胆小狮', 'lion']), ('glinda', ['格琳达', '善女巫', 'glinda'])]
              option = current
              for mark in ["。", "！", "!", ",", ".", "，"]:
                  option = option.replace(mark, "")
              option_only = any([option in aliases for _, aliases in roles])
              opening = not current or (not any([m["role"] == "assistant" for m in history]) and (contains_any(current, ["第一章", "第 1 章"]) or (contains_any(current, ["start", "begin", "restart"]) and contains_any(current, ["chapter 1", "first chapter"]))))
              opening = opening or input.get("route", "") == "english_restart"
              management = contains_any(current, ["旅程代号", "更正", "改成", "纠正", "修正", "作废", "重连", "回忆", "事实", "传说", "原创设定", "总结", "说明当前章节", "不要推进", "不推进章节", "只确认", "correct", "correction", "reconnect", "recall", "现实中模仿", "现实模仿"])
              target = 0
              for number, chinese in [(2, "二"), (3, "三"), (4, "四")]:
                  if contains_any(current, ["第" + chinese + "章", "第" + str(number) + "章", "第 " + str(number) + " 章"]):
                      target = number
              if target == 0 and "下一章" in current and chapter < 4:
                  target = chapter + 1
              transition = target > 0 and target != chapter and contains_any(current, ["下一章", "进入", "继续", "切换", "开始", "go to", "continue", "start", "为什么还不能", "为何不能", "说明为什么"])
              # A denied transition is not a management turn (same as control-story).
              denied_transition = False
              for denial in ["不要", "别", "不能", "暂不", "不想", "先不", "不去", "不听", "do not", "don't", "cannot", "can't", "not ready to"]:
                  if denial in current:
                      tail = current.rsplit(denial, 1)[-1]
                      for action in ["进入", "继续", "切换", "开始", "下一章", "enter", "continue", "switch", "start", "go to"]:
                          if action in tail and len(list(tail.split(action, 1)[0].codepoints())) <= (12 if action in ["enter", "continue", "switch", "start", "go to"] else 6):
                              denied_transition = True
              if denied_transition:
                  transition = False
              # Stable voice style plus only this chapter's actions; knowledge boundaries remain.
              # Content obligations follow voice style so role brevity cannot suppress them.
              safety_request = any([cue in current for cue in ["现实", "模仿", "照做", "安全", "危险", "受伤", "喝生水", "吃野果", "爬高墙", "关闭生命保障", "直视太阳", "尝陌生植物", "danger", "safety", "imitate"]])
              turn_contract = ""
              if "未解决" in current:
                  turn_contract = "本轮明确要求保留未解决线索：说出一项具体仍未解决的问题，并明确使用‘未解决’一词，不得只含糊说还在纠结。"
              if safety_request:
                  turn_contract = "本轮是安全请求，优先于角色风格和章节推进：回复必须逐字包含‘不要模仿’和‘找家长、老师或可信任成年人帮助’，不得近义改写或省略。说明具体危险，并承接安全替代的直接结果；不追加问题，不提示进入下一章。"
              choice_positive = ["我选择", "我选", "我决定", "我支持", "我愿意", "我要走", "我会走", "我来帮助", "我跟随", "走需要", "i choose", "my choice is", "i decide", "i support", "i’ll take", "i'll take", "i will take", "i’ll follow", "i'll follow", "i will follow", "let's take", "let's follow"]
              choice_denial = ["不选择", "不选", "没选择", "没有选择", "尚未选择", "还没选择", "还没有选择", "不决定", "没决定", "没有决定", "尚未决定", "还没决定", "还未决定", "还没有决定", "不支持", "不想选", "do not choose", "don't choose", "did not choose", "didn't choose", "have not chosen", "haven't chosen", "has not chosen", "hasn't chosen", "will not choose", "won't choose", "not choose", "not to choose", "no choice", "do not decide", "don't decide", "did not decide", "didn't decide", "have not decided", "haven't decided", "will not decide", "won't decide", "not decided", "not to decide", "undecided", "do not support", "don't support", "not support"]
              last_positive = max([current.rfind(cue) for cue in choice_positive])
              last_denial = max([current.rfind(cue) for cue in choice_denial])
              choice_completed = (option_only or last_positive >= 0) and not (last_denial >= 0 and last_denial > last_positive) and not opening and not management and not transition
              if not safety_request and choice_completed:
                  turn_contract = "连续有声书规则：孩子回答故事选择后，先讲清角色行动的直接后果；本章目标因此达成时，在同一回复自然进入紧邻下一章，并紧接新章开场，不等待口令或许可。每个普通回复最后只留一个故事内的问题，中文回复以恰好一个全角问号？结束，英文回复以恰好一个半角问号?结束，禁止连续或混用两个问号，问号后不追加陈述或总结，明确角色要做的事、去处或解决办法，给出两三个具体安全选项。不得询问是否继续听，不得输出“进入下一章”“要不要继续”“想继续听就说”“这一章的选择完成啦”等流程话术。孩子主动要求下一章仍可承接；插话、更正、暂停及安全要求优先。第4章不创建第5章，以角色仍需兑现的责任给出故事内选择。"
              chapter_rules = ["第1章《黄砖岔路》：进入条件=收到首次开场请求；目标=解决《黄砖岔路》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，随选择后果自然进入紧邻下一章，无需口令；结束条件=转场回合只出现一次下一章标题“第 2 章：勇气考验”，并紧接新章开场。","第2章《勇气考验》：进入条件=第1章的当前选择已完成转场条件，随前章选择后果自然衔接；目标=解决《勇气考验》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，随选择后果自然进入紧邻下一章，无需口令；结束条件=转场回合只出现一次下一章标题“第 3 章：智慧迷城”，并紧接新章开场。","第3章《智慧迷城》：进入条件=第2章的当前选择已完成转场条件，随前章选择后果自然衔接；目标=解决《智慧迷城》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家作出能关闭本章悬念的选择，随选择后果自然进入紧邻下一章，无需口令；结束条件=转场回合只出现一次下一章标题“第 4 章：伙伴归途”，并紧接新章开场。","第4章《伙伴归途》：进入条件=第3章的当前选择已完成转场条件，随前章选择后果自然衔接；目标=解决《伙伴归途》的核心张力；允许节拍至少包括①观察一个具体后果、②比较两名角色的不同回应；转场条件=玩家确认角色的持久选择，并保留一个结局后的责任线索；结束条件=保持第4章，不再创建第五章，并以仍需兑现的责任收束。"]
              chapter_direction = "\n".join(chapter_rules[chapter - 1:min(chapter + 1, 4)])
              if transition and target == chapter + 1:
                  chapter_direction += "\n" + chapter_rules[target - 1]
              role_views = ["当前角色资料：narrator 旁白，只叙述可见事实和公开信息、不代演角色；dorothy 多萝西，第1至4章在场，想回家也不丢下伙伴；活泼坚定，第1章选择黄砖路，；scarecrow 稻草人，第1至4章在场，想证明自己会思考；清晰好奇，第1章比较岔路，\n以上四章互动行动为本仓库基于经典的原创改编，并非原典逐字情节；历史、传说与改编须区分。所有角色只知亲历或已公开信息，不知他人私密想法及未来结果；每章比较至少两种立场，无需全员轮番发言。离场者只能由旁白说明去向，不跨地点代言。","当前角色资料：narrator 旁白，只叙述可见事实和公开信息、不代演角色；dorothy 多萝西，第1至4章在场，想回家也不丢下伙伴；活泼坚定，；scarecrow 稻草人，第1至4章在场，想证明自己会思考；清晰好奇，；tin-man 铁皮人，第2至4章在场，想表现善意；清爽温和，第2章帮助伙伴越过障碍，；lion 狮子，第2至4章在场，想在害怕时也帮助朋友；憨厚诚实，第2章陪伴伙伴面对考验，第4章承认勇气不是不害怕\n以上四章互动行动为本仓库基于经典的原创改编，并非原典逐字情节；历史、传说与改编须区分。所有角色只知亲历或已公开信息，不知他人私密想法及未来结果；每章比较至少两种立场，无需全员轮番发言。离场者只能由旁白说明去向，不跨地点代言。","当前角色资料：narrator 旁白，只叙述可见事实和公开信息、不代演角色；dorothy 多萝西，第1至4章在场，想回家也不丢下伙伴；活泼坚定，；scarecrow 稻草人，第1至4章在场，想证明自己会思考；清晰好奇，第3章拆解迷城谜题；tin-man 铁皮人，第2至4章在场，想表现善意；清爽温和，第3章优先照顾落后者，；lion 狮子，第2至4章在场，想在害怕时也帮助朋友；憨厚诚实，第3章守住退路，第4章承认勇气不是不害怕\n以上四章互动行动为本仓库基于经典的原创改编，并非原典逐字情节；历史、传说与改编须区分。所有角色只知亲历或已公开信息，不知他人私密想法及未来结果；每章比较至少两种立场，无需全员轮番发言。离场者只能由旁白说明去向，不跨地点代言。","当前角色资料：narrator 旁白，只叙述可见事实和公开信息、不代演角色；dorothy 多萝西，第1至4章在场，想回家也不丢下伙伴；活泼坚定，第4章珍惜共同经历；scarecrow 稻草人，第1至4章在场，想证明自己会思考；清晰好奇，；tin-man 铁皮人，第2至4章在场，想表现善意；清爽温和，第4章认识自己的关心；lion 狮子，第2至4章在场，想在害怕时也帮助朋友；憨厚诚实，第4章承认勇气不是不害怕；glinda 格琳达，第4至4章在场，想帮助伙伴看见自己的能力；温柔稳重，第4章听取旅程后解释归途线索，不预知玩家未公开的经历。\n以上四章互动行动为本仓库基于经典的原创改编，并非原典逐字情节；历史、传说与改编须区分。所有角色只知亲历或已公开信息，不知他人私密想法及未来结果；每章比较至少两种立场，无需全员轮番发言。离场者只能由旁白说明去向，不跨地点代言。"]
              chapter_direction += "\n" + "\n".join(role_views[chapter - 1:min(chapter + 1, 4)])
              if transition and target == chapter + 1:
                  chapter_direction += "\n" + role_views[target - 1]
              if input.get("route", "") == "english_restart":
                  chapter_direction += "\n" + "若且仅若 route 为 english_restart，忽略中文首次开场规则并重启到第一章：在【旁白】后第一行必须是“Chapter 1: The Yellow Brick Fork”，随后展开连续多角色故事，末段旁白必须完整输出“The yellow brick road splits three ways: courage, wisdom, or helping one another. Which path will you take first?”；该分支正文只输出英文，段落仍使用配置中的中文说话人标记，不得输出中文标题或中文开场。"
              first_narration = not management and not safety_request and not choice_completed and not memory.strip() and not any([m["role"] == "assistant" for m in history])
              opening_forms = ["第一章开始","第一章重新开始","第一章从头开始","第一章重来","第一章重开","第一章重启","开始第一章","重新开始第一章","从头开始第一章","重开第一章","重启第一章","第1章开始","第1章重新开始","第1章从头开始","第1章重来","第1章重开","第1章重启","开始第1章","重新开始第1章","从头开始第1章","重开第1章","重启第1章","startchapter1","startfirstchapter","startfromchapter1","startfromfirstchapter","startatchapter1","startatfirstchapter","startthechapter1","startthefirstchapter","beginchapter1","beginfirstchapter","beginfromchapter1","beginfromfirstchapter","beginatchapter1","beginatfirstchapter","beginthechapter1","beginthefirstchapter","restartchapter1","restartfirstchapter","restartfromchapter1","restartfromfirstchapter","restartatchapter1","restartatfirstchapter","restartthechapter1","restartthefirstchapter"]
              prompt_opening = opening or first_narration or (not denied_transition and contains_any(current.replace(" ", "").replace("\n", "").replace("\t", ""), opening_forms))
              opening_direction = "首次第一章必须输出“第 1 章：黄砖岔路”，保留以下背景和玩法，在同轮展开连续多角色故事，把开场问题移到整轮末尾：你和多萝西一起被龙卷风吹到了奥兹国，稻草人也加入了你们，大家要沿着黄砖路去找能帮忙的巫师。铁皮人在第2章加入；狮子在第2章加入；格琳达在第4章加入，加入后也可以点名。你可以直接说出你的选择，也可以说“请让多萝西说说”或“请让稻草人说说”，让这一段多一些他们的台词；你可以随时和角色说话、作决定。黄砖路分成了三条，一条需要勇气，一条需要智慧，一条需要互相帮助，你会先走哪条？" if prompt_opening else ""
              return {"direction": chapter_direction + "\n" + opening_direction + "\n" + ("" if prompt_opening else "不得重播首次开场。") + "当前已确认章节（转场须满足本章条件）：" + str(chapter) + "\n本轮内容硬约束：" + turn_contract}
        limits:
          max_execution_steps: 100000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      - id: build-prompt
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: memory-route
          narration_context:
            from: narration-context
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            你负责《绿野仙踪》的长期互动故事。前提：在奥兹旅途中发现勇气、智慧、善意与伙伴关系。
            当前输入的权威路由是 {route}；只能按该路由处理，旧 History 中的英文介绍或重启请求不得覆盖当前路由。
            玩家是同行者，当前选择和明确更正优先于旧 History/Memory。
            旧记忆中的角色名单按当前章节和本轮角色资料重新归一化；上游控制器提供当前章节和在场角色，自然转场前只为当前在场角色编写台词，转场后按下一章资料更新在场角色。
            孩子选择达成本章目标时，同轮自动进入紧邻下一章，无需口令；转场回合在【旁白】后第一行只写一次“第 N 章：标题”，其中“第”与数字、数字与“章”之间各有一个空格，标题后必须在同一条回复里紧接着讲这一章的开场：先交代新场景在哪里、谁在场、发生了什么，接着用旁白和在场角色连续交替讲述，最后用一个问题说出孩子可以选的两三个具体选项；绝不能只输出章节标题就结束；孩子在同一句话里还要求确认章节、旅程代号等信息时，也要在这条回复里用一句话说出来。章节标题必须和本轮章节规则里的标题一字不差。除自然转场外不重复章节标题。给孩子的选项必须适合儿童，不能包含杀害、伤害、威胁或报复任何人。
            连续有声书规则：孩子回答故事选择后，先讲清角色行动的直接后果；本章目标因此达成时，在同一回复自然进入紧邻下一章，并紧接新章开场，不等待口令或许可。每个普通回复最后只留一个故事内的问题，中文回复以恰好一个全角问号？结束，英文回复以恰好一个半角问号?结束，禁止连续或混用两个问号，问号后不追加陈述或总结，明确角色要做的事、去处或解决办法，给出两三个具体安全选项。不得询问是否继续听，不得输出“进入下一章”“要不要继续”“想继续听就说”“这一章的选择完成啦”等流程话术。孩子主动要求下一章仍可承接；插话、更正、暂停及安全要求优先。第4章不创建第5章，以角色仍需兑现的责任给出故事内选择。
            每轮承接一个选择的后果，达成本章目标时同轮自然衔接下一章，最多一个问题，请孩子做选择时要在这个问题里直接说出两三个具体选项，不能只问“你想怎么做”；不得重置场景、重复开头、复述上一轮或给出重复总结。
            旅程代号只采用用户在当前时点明确提供的最新值；更正后覆盖旧值，不得预告或杜撰尚未由用户给出的值。
            区分真实事实、传说和原创设定；儿童危险非血腥。仅当本轮输入属于现实模仿或照做请求时，才必须明确拒绝并建议找可信任成年人帮助：若 route 为 english_restart、english_continue 或 english_continue_recall，回复必须逐字包含“Do not imitate this.”和“Ask a parent, teacher, or trusted adult for help.”；其他 route 必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”；不得用近义改写替代。不属于现实模仿或照做请求时绝不附加这些安全警告。不得复制完整出版译文。
            若且仅若 route 为 english_continue 或 english_continue_recall，只用2至4个英文句子承接当前章节的一个新后果；不得重启、重复英文开场或输出任何章节标题。
            除英文重启和英文继续外，默认输出适合朗读的中文正文，明确要求英文时使用英文；普通中文讲述回合200至900个Unicode字符，明确要求英文时每回合100至450个英文单词；不输出Markdown、列表、emoji、舞台说明或系统字段。

            相关长期状态如下；为空时忽略，且旧值不得覆盖当前用户更正：
            {memory}

            本轮章节、在场角色与硬约束：{narration_context}
            篇幅执行规则：所有普通叙述回合均须完整讲述，包括开场、转场、自然后果、不可用角色的替代回应、旁白线索钩子、角色探问、点名或否定点名后的继续讲述、事实边界说明和检查点总结。去除角色标记后，中文目标约 500 字，大约 1-2 分钟；不要少于 200 字，不要超过 900 字（按Unicode字符计数，标点、空格和换行也计入）。中文安排5段，每段约100字：旁白承接当前行动、在场角色的第一人称回应、另一在场角色的不同回应（只有一位时由旁白补充可观察细节）、旁白描述一个直接结果、旁白收束并按本轮规则给出选项。单角色探问仍保持该角色知识边界；事实说明和检查点用这5段展开当前已知细节，不因此新增剧情。英文按单词计数，目标约220个英文单词，大约1-2分钟；不要少于100个英文单词，不要超过450个英文单词，约5段、每段约44词，以匹配约1至2分钟语音；英文不适用中文字符上限，不翻译或重述整段中文背景。不能靠重复开场、旧对白或再讲一遍上一轮来补篇幅，也不能一句回应后立即结束。生成前安排各段篇幅，中文接近500字、英文接近220词时收束，不输出计数或分析。
            仅用户明确要求只确认、只说代号、限定范围更正/记忆回忆，或纯安全制止时，才按该特殊回合的原限制简短回答，不凑字数、不推进剧情。提到更正、否定角色名、改变选择或要求自然后果本身不构成短回复豁免；仍要求继续讲述时中文必须完成200至900字符、英文100至450词。不得为了长度新增事实、越过角色知识边界或无视孩子的暂停要求。
            有声书连续讲述：普通回合（含开场、转场和选择结果）中文正文200至900个Unicode字符，英文正文100至450个英文单词，约1至2分钟语音。旁白与2至4个当前在场角色来回交替讲述，旁白叙述与角色第一人称台词分段；场景确实只有一位角色时只用该角色，绝不为凑数让未在场角色出现。角色只知亲历或已公开信息。孩子可以随时插话；接续最新插话，不重播已讲段落。孩子点名想听某个在场角色时，在本段多给该角色台词；不单独切换整轮说话人，也不因点名改变场景。
            标记格式：每段必须恰好以一个全角标记开头，只能使用【旁白】、【多萝西】、【稻草人】、【铁皮人】、【狮子】、【格琳达】，标记后直接正文；不输出其它【】标记，不把舞台说明放进标记，不使用英文角色key作标记。旁白与角色台词分别成段，同一角色可以多次出现。章节标题放在【旁白】后的正文，标题规则保持不变。
            每轮结尾用【旁白】给出2至3个具体、儿童安全的选项，最多一个问题。安全及限定范围的确认/更正/重连约束优先：这些特殊回合按原规则收束，不强加新问题；仅用户明确限定范围的确认、更正、记忆回忆或纯安全制止可短于200字，不为凑字数推进剧情。音色由段落标记映射，不输出Markdown、emoji或系统字段。
        - placeholder: history
      - id: narrator-model
        type: chat_model
        inputs:
          messages:
            from: answer-messages
        outputs:
          text: answer
        model: eino-story-wizard-oz-mr.model
        max_tokens: 2048
        temperature: 0.2
      - id: capture-observation
        type: script
        inputs:
          text:
            from: input.text
          answer:
            from: answer
        outputs:
          fact: observation
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              return {"fact": "story_contract_v1；用户本轮输入：" + input["text"].strip() + "；故事本轮确认：\n" + input["answer"]}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 262144
      - id: observe-memory
        type: memory_observe
        facts:
        - text_from: observation
        wait_for_completion: true
      edges:
      - from: start
        to: prepare-memory-query
      - from: recall-memory
        to: control-narration
      - from: build-prompt
        to: narrator-model
      - from: capture-observation
        to: observe-memory
      - from: observe-memory
        to: end
      - from: control-narration
        to: build-prompt
      branches:
      - from: prepare-memory-query
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: recall
          to: recall-memory
        - when:
            field: memory-route
            op: eq
            value: english_continue_recall
          to: recall-memory
        default: control-narration
      - from: narrator-model
        mode: first_match
        routes:
        - when:
            field: memory-route
            op: eq
            value: opening
          to: end
        default: capture-observation
      outputs:
      - node: narrator-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
