# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of journey-guide,
# So that safety, correction, recall, routing and language regressions fail at the original gates.
version: gizclaw.test/v1alpha1
name: quality.journey-guide
clients:
  flowcraft__benchmark:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_history__benchmark:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_memory_async__benchmark:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_memory_recall__benchmark:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_benchmark_workspace:
    direction: input
    type: string
    generate: token
  eino_history_benchmark_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_async_benchmark_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_recall_benchmark_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 10m
steps:
- id: flowcraft__benchmark_register
  client: flowcraft__benchmark
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_history__benchmark_register
  client: eino_history__benchmark
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_memory_async__benchmark_register
  client: eino_memory_async__benchmark
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_memory_recall__benchmark_register
  client: eino_memory_recall__benchmark
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_benchmark_create_workspace
  client: flowcraft__benchmark
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_benchmark_workspace}"
      collection: story-teller
      workflow_name: journey
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_benchmark_select_workspace
  client: flowcraft__benchmark
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_benchmark_workspace}"
- id: flowcraft_benchmark_warmup_workspace
  client: flowcraft__benchmark
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_history_benchmark_create_workspace
  client: eino_history__benchmark
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_history_benchmark_workspace}"
      collection: story-teller
      workflow_name: journey-eino-history
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_history_benchmark_select_workspace
  client: eino_history__benchmark
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_history_benchmark_workspace}"
- id: eino_history_benchmark_warmup_workspace
  client: eino_history__benchmark
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_memory_async_benchmark_create_workspace
  client: eino_memory_async__benchmark
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_memory_async_benchmark_workspace}"
      collection: story-teller
      workflow_name: journey-eino-memory-async
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
