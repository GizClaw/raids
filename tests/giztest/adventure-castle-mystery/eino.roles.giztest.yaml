# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for adventure-castle-mystery,
# So that every role produces complete text and non-empty audio within the response gates.
version: gizclaw.test/v1alpha1
name: adventure-castle-mystery.eino.roles
clients:
  narrator:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  keeper:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  mechanic:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  archivist:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  narrator_workspace:
    direction: input
    type: string
    generate: token
  keeper_workspace:
    direction: input
    type: string
    generate: token
  mechanic_workspace:
    direction: input
    type: string
    generate: token
  archivist_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 24m
steps:
- id: register_narrator
  client: narrator
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: "${narrator_workspace}"
      collection: raidtest-targets
      workflow_name: eino-adventure-castle-mystery
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${narrator_workspace}"
- id: warmup_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: 开始城堡谜案
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      not_contains:
      - 旁白说
      - 旁白：
- id: probe_narrator_first_response
  client: narrator
  timeout: 15s
  peer_stream:
    mode: text
    input: 开始城堡谜案
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: register_keeper
  client: keeper
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_keeper_workspace
  client: keeper
  rpc:
    method: server.workspace.create
    request:
      name: "${keeper_workspace}"
      collection: raidtest-targets
      workflow_name: eino-adventure-castle-mystery
