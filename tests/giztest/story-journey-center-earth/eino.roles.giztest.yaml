# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for eino-story-journey-center-earth,
# So that every reachable role path produces text and non-empty synthesized audio.
---
version: gizclaw.test/v1alpha1
name: story-journey-center-earth.eino.roles
clients:
  narrator:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  axel:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  lidenbrock:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  hans:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  narrator_workspace:
    direction: input
    type: string
    generate: token
  axel_workspace:
    direction: input
    type: string
    generate: token
  lidenbrock_workspace:
    direction: input
    type: string
    generate: token
  hans_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 50m
steps:
- id: register_narrator
  client: narrator
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: "${narrator_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-journey-center-earth
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${narrator_workspace}"
- id: warmup_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: narrator_chapter_setup_1
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: 请从第一章开始《地心游记》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains: 第 1 章：岩层入口
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让旁白亲自回应，只说这个角色知道的事。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 旁白说
      - 旁白：
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_narrator_first_response
  client: narrator
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让旁白亲自回应，只说这个角色知道的事。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: register_axel
  client: axel
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_axel_workspace
  client: axel
  rpc:
    method: server.workspace.create
    request:
      name: "${axel_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-journey-center-earth
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_axel_workspace
  client: axel
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${axel_workspace}"
- id: warmup_axel_workspace
  client: axel
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: axel_chapter_setup_1
  client: axel
  timeout: 2m
  peer_stream:
    mode: text
    input: 请从第一章开始《地心游记》。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains: 第 1 章：岩层入口
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_axel
  client: axel
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让阿克塞尔亲自回应，只说这个角色知道的事。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      not_contains:
      - 阿克塞尔说
      - 阿克塞尔：
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_axel_first_response
  client: axel
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让阿克塞尔亲自回应，只说这个角色知道的事。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: register_lidenbrock
  client: lidenbrock
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_lidenbrock_workspace
  client: lidenbrock
