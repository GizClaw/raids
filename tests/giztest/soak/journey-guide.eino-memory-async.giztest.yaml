# User Story:
# As a Raids catalog maintainer,
# I want every available journey-guide implementation to complete the same bounded Tester relay,
# So that the 20-response `default-journey` route, its deterministic contracts, and the final verdict stay declarative.
version: gizclaw.test/v1alpha1
name: journey-guide.soak.eino-memory-async
clients:
  eino_memory_async:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_memory_async_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-journey-guide long-form-branch-correction-return
  eino_memory_async_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_async_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_async_verdict:
    direction: output
    type: string
  eino_memory_async_reload_handoff:
    direction: output
    type: string
repeat: 1
timeout: 316m
steps:
- id: eino_memory_async_register_candidate
  client: eino_memory_async
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_memory_async_register_tester
  client: eino_memory_async_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: eino_memory_async_create_candidate_workspace
  client: eino_memory_async
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_memory_async_candidate_workspace}"
      collection: story-teller
      workflow_name: journey-eino-memory-async
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_memory_async_create_tester_workspace
  client: eino_memory_async_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_memory_async_tester_workspace}"
      collection: raidtest-testers
      workflow_name: journey-guide-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_memory_async_select_candidate_workspace
  client: eino_memory_async
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_memory_async_candidate_workspace}"
- id: eino_memory_async_warmup_candidate_workspace
  client: eino_memory_async
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: eino_memory_async_select_tester_workspace
  client: eino_memory_async_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${eino_memory_async_tester_workspace}"
- id: eino_memory_async_run_dialogue_before_reload
  timeout: 40m
  workspace_relay:
    first_client: eino_memory_async_tester
    second_client: eino_memory_async
    input: "${test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 24
    terminal_client: eino_memory_async
  capture:
    eino_memory_async_reload_handoff: "/terminal/text"
  expect:
    "/terminal/client":
      equals: eino_memory_async
    "/completed_turns":
      equals: 24
    "/turns/eino_memory_async/count":
      equals: 12
    "/turns/eino_memory_async_tester/count":
      equals: 12
    "/turns/eino_memory_async/first_text_ms/max":
      maximum: 6000
    "/turns/eino_memory_async/text_runes/min":
      minimum: 10
    "/turns/eino_memory_async/text_runes/max":
      maximum: 520
- id: eino_memory_async_recall_barrier_1
  client: eino_memory_async
  rpc:
    method: server.run.workspace.recall
    request:
      query: 明月
  timeout: 90s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: eino_memory_async_recall_barrier_2
  client: eino_memory_async
  rpc:
    method: server.run.workspace.recall
    request:
      query: 青铜铃
  timeout: 90s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: eino_memory_async_tester_recall_keepalive
  client: eino_memory_async_tester
  rpc:
    method: server.run.status
    request: {}
- id: eino_memory_async_recall_barrier_3
  client: eino_memory_async
  rpc:
    method: server.run.workspace.recall
    request:
      query: 商队
  timeout: 90s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: eino_memory_async_reload_candidate_workspace
  client: eino_memory_async
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: eino_memory_async_run_dialogue_after_reload
  timeout: 29m
  workspace_relay:
    first_client: eino_memory_async_tester
    second_client: eino_memory_async
    input: "${eino_memory_async_reload_handoff}"
    media: text
    idle_timeout: 90s
    max_turns: 17
    terminal_client: eino_memory_async_tester
  capture:
    eino_memory_async_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: eino_memory_async_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 17
    "/turns/eino_memory_async/count":
      equals: 8
    "/turns/eino_memory_async_tester/count":
      equals: 9
    "/turns/eino_memory_async/first_text_ms/max":
      maximum: 6000
    "/turns/eino_memory_async/text_runes/min":
      minimum: 10
    "/turns/eino_memory_async/text_runes/max":
      maximum: 200
- id: eino_memory_async_emit_verdict
  output:
    variable: eino_memory_async_verdict
finally:
- id: eino_memory_async_stop_candidate_run
  client: eino_memory_async
  rpc:
    method: server.run.stop
    request: {}
- id: eino_memory_async_stop_tester_run
  client: eino_memory_async_tester
  rpc:
    method: server.run.stop
    request: {}
- id: eino_memory_async_delete_candidate_workspace
  client: eino_memory_async
  rpc:
    method: server.workspace.delete
    request:
      name: "${eino_memory_async_candidate_workspace}"
- id: eino_memory_async_delete_tester_workspace
  client: eino_memory_async_tester
  rpc:
    method: server.workspace.delete
    request:
      name: "${eino_memory_async_tester_workspace}"
- id: eino_memory_async_delete_candidate_peer
  client: eino_memory_async
  rpc:
    method: server.peer.delete
    request: {}
- id: eino_memory_async_delete_tester_peer
  client: eino_memory_async_tester
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
