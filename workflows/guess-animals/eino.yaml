        messages:
        - role: system
          template: |-
            {safety_fence}

            {rules}

            【谜底卡】
            简介：几乎没有毛、皮肤粉红皱巴巴的非洲小动物，一大群住在地下隧道里，寿命特别长。
            类别：哺乳动物（啮齿类，不是鼹鼠也不是老鼠）
            生活在哪里：东非干燥草原的地下隧道
            吃什么：草食，吃植物的根和块茎
            大小：很小，约十厘米长，比猫小很多
            会不会飞：不会
            会不会游泳：不详
            特点：几乎无毛；大门牙露在嘴外；像蜜蜂一样有一只女王；能活三十多年
            注意：它能在很缺氧的地方活好一阵子；一个大家族里只有女王生宝宝
        - placeholder: history
        - role: system
          template: '【本轮指令】{direction}'
      - id: card-l10-p10
        type: prompt
        inputs: {safety_fence: {from: input.safety_fence}, rules: {from: host-rules}, history: {from: input.messages}, direction: {from: game-direction}}
        outputs: {messages: host-messages}
        format: f_string
