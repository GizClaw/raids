          def compact(text):
              out = []
              for ch in text.lower().codepoints():
                  if ch in DROP:
                      continue
                  out.append(ch)
              return "".join(out)

          def has_cjk(text):
              for ch in text.codepoints():
                  code = ord(ch)
                  if code >= 19968 and code <= 40959:
                      return True
              return False

          def has_latin(text):
              for ch in text.codepoints():
                  if ch in LATIN:
                      return True
              return False

          def pick_lang(text, previous):
              if has_cjk(text):
                  return "zh"
              if has_latin(text):
                  return "en"
              if previous != "":
                  return previous
              return "zh"

          def read_int(chars, start):
              i = start
              for ch in chars[start:]:
                  if ch in SPACES:
                      i += 1
                  else:
                      break
              value = 0
              count = 0
              for ch in chars[i:]:
                  if ch in DIGITS:
                      value = value * 10 + DIGITS[ch]
                      count += 1
                  else:
                      break
              if count > 0:
                  return [value, i + count]
              seq = []
