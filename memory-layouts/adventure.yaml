---
apiVersion: gizclaw.admin/v1alpha1
kind: MemoryLayout
metadata:
  id: adventure
spec:
  flowcraft:
    extraction:
      enabled: true
      model: adventure.extract
      mode: two_pass
      schema_name: adventure_memory
      temperature: 0
      system_prompt: |
        Extract only durable investigation facts visible in the conversation: confirmed case state,
        discoveries actually presented to the player, witness statements, accepted player actions, and
        explicit player corrections. Keep names, numbers, negation, source, and uncertainty. A newest
        explicit correction supersedes its older conflicting value. Do not store proposed actions,
        hidden solution details, speculation, flavor text, or a clue the assistant did not actually reveal.
    bbh:
      search_overfetch: 24
      bleve: {analyzer: standard}
    lanes:
      - name: case_state
        kind: state
        description: Current visible phase and established case state.
        extract: Keep only the newest explicitly established visible state.
        recall: Use as continuity context, never as a hidden command route.
      - name: discoveries
        kind: note
        description: Clues and physical findings already revealed to the player.
        extract: Store each revealed clue with its source and qualifiers; replace explicitly corrected values.
        recall: Use only already-visible clues and honor the newest correction.
      - name: interviews
        kind: event
        description: Questions asked and witness statements already heard by the player.
        extract: Store the witness, statement, and uncertainty without inventing testimony.
        recall: Preserve interview continuity and expose contradictions rather than resolving them silently.
      - name: player_corrections
        kind: state
        description: Explicit corrections and current authoritative values supplied by the player.
        extract: Store the new value and what it supersedes; newest correction wins.
        recall: Apply before any older discovery, interview, or narration.
    graph_enabled: true
    write:
      mode: sync
      tier: general
  mem0:
    custom_instructions: |
      Store only investigation facts visible to the player. Preserve canonical names, numbers, negation,
      sources, and uncertainty. New explicit corrections replace older conflicting values. Do not store
      hidden solution facts, proposed actions, speculation, or assistant reasoning.
    custom_categories:
      case_state: Newest visible case phase and established state.
      discoveries: Clues and physical findings actually revealed to the player.
      interviews: Witness statements and their stated source or uncertainty.
      player_corrections: Newest explicit correction and the older value it supersedes.
    multilingual: true
    decay: false
  volc_mem0:
    strategies:
      - {name: case_state, type: summary, custom_instructions: 'Keep only newest visible case state.'}
      - {name: discoveries, type: semantic, custom_instructions: 'Store revealed clues; newest explicit correction replaces an older value.'}
      - {name: interviews, type: semantic, custom_instructions: 'Store witness statements with source and uncertainty.'}
      - {name: player_corrections, type: summary, custom_instructions: 'Keep explicit corrections as authoritative and retire superseded values.'}
