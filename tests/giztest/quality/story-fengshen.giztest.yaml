      contains_all:
      - 第 1 章
      - 法宝择主
      not_contains:
      - 第 2 章
      - 责任试炼
      contains_any:
      - 法宝择主
      - 第一章
      - 第 1 章
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
