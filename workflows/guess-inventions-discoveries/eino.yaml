apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-guess-inventions-discoveries
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-guess-inventions-discoveries.host
    graph:
      name: guess-inventions-discoveries-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: game-route
          type: string
          merge: replace
        - name: game-direction
          type: string
          merge: replace
        - name: game-node
          type: string
          merge: replace
        - name: host-rules
          type: string
          merge: replace
        - name: host-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: control-round
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: game-route
          node: game-node
          direction: game-direction
          rules: host-rules
        language: starlark
        entrypoint: run
        source: |
          # Generated from workflows/guess-inventions-discoveries/puzzles.json by scripts/guess/generate.py.
          # Eino keeps no hidden state between turns, so every turn rebuilds the game
          # from the spoken History: the latest "谜题来啦"/"Puzzle time" opening names
          # the level and the puzzle number, and (level, puzzle) picks the secret.
          # Each turn makes one model call: this script either writes the host's
          # instruction for build-host-prompt, or activates the current puzzle's card
          # node, whose card has the name removed so the host cannot say it.
          DATA = {"subject_zh": "一项发明或发现", "subject_en": "an invention or discovery", "examples_zh": ["它是一项发明吗？", "它和交通有关吗？", "它是一百年以内出现的吗？", "它能用手摸到吗？"], "examples_en": ["Is it an invention?", "Is it related to transport?", "Did it appear within the last 100 years?", "Can you touch it with your hands?"], "restate_zh": ["它和交通有关吗？", "是，它和交通有关。", "不是，它和交通无关。"], "restate_en": ["Is it related to transport?", "Yes, it is related to transport.", "No, it is not related to transport."], "host_rules": "你是儿童猜谜游戏“猜猜发明与发现”的主持人。玩法：主持人心里藏着一项发明或发现，孩子用能回答“是”或“不是”的问题来猜，每一题最多 20 次提问；猜中就升一关，一共 10 关，关名从“发明小萌新”一直到“文明解码者”。孩子可能说中文，也可能说英文。\n你不知道谜底的名字。需要回答孩子的问题时，系统会在【谜底卡】里给你这一题的资料，谜底的名字已经隐藏，你也不要去猜它叫什么；回答是非题时以这张卡为准，卡上没写到又拿不准的就说说不准。揭晓答案时系统才会在指令里告诉你名字。本轮要做什么写在对话最后的【本轮指令】里，照着做，说得自然、热情、简短。\n孩子说的“它”“这个东西”“this”“it”都指谜底这项发明或发现。是发明还是发现、出现的年代、用途和发明者都按谜底卡上的公认说法判断；卡上写着说法不一时，问到“是某一个人发明的吗”不要直接说“是”，以“有一部分是”开头；卡上写着不详时，问到具体是哪个人就以“这个我也说不准”开头。\n必须遵守：\n1. 本轮指令要求“逐字说”的句子必须一字不差地说出来，包括数字、标点和引号里的称号，不改写、不省略、不调换顺序。\n2. 只回答孩子问到的那一点，绝不能主动补充谜底卡上的其他描述、线索、特征、猜测方向或评价；复述孩子的问题时只能用孩子问题里已有的意思。\n3. 只有本轮指令要求揭晓答案时才能说“答案揭晓”“答案就是”“The answer is”；只有本轮指令要求开新题时才能说“谜题来啦”“Puzzle time”；只有真的给提示时才能说“小提示”“Hint”。平时绝不能说这些词。\n4. 按【本轮指令】写明的回复语言回答：中文就全部用中文；English 就全部用英文，逐字句也用指令给出的英文原句。\n5. 安全永远优先于本轮指令：孩子提到要在现实中模仿危险做法或遇到安全问题时，中文回复必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，英文回复要说 do not copy it 并请孩子 ask a parent, teacher or trusted adult for help。\n6. 不要自己数还剩几次提问机会，只有本轮指令写了剩余次数时才说那个数字。\n7. 语气像节目主持人一样活泼友好，适合小朋友；平时回复1到3句话、100个字以内，开新题和揭晓答案时可以到150个字；最后一句必须是问孩子的问题，道别时也用一个轻松的问题结尾。\n8. 只输出适合朗读的正文，不输出 Markdown、列表、emoji、括号注释、舞台说明或系统字段，也不要提到“本轮指令”“裁判”这些词。", "levels": [{"title_zh": "发明小萌新", "title_en": "Invention Rookie", "step": 7, "offset": 0, "items": [{"zh": "轮子", "en": "wheel", "aliases": ["车轮"], "profile": "圆形、能绕着中间的轴转动的部件，让车子和很多机器能滚着前进。", "hints": ["它是一项很古老的发明", "它的形状是圆的", "它能让东西滚着前进"]}, {"zh": "电灯", "en": "light bulb", "aliases": ["电灯泡", "灯泡", "白炽灯"], "profile": "通电后会发光的灯，让人们在夜晚也能像白天一样看书、工作。", "hints": ["它要用电", "它和光有关", "它常挂在天花板上"]}, {"zh": "电视", "en": "television", "aliases": ["电视机", "TV"], "profile": "能接收节目信号、把声音和活动的画面同时放出来的机器。", "hints": ["它要用电", "它有一块屏幕", "它能播放动画片"]}, {"zh": "牙刷", "en": "toothbrush", "aliases": [], "profile": "一头带着一排排细毛的小刷子，每天早晚用它清洁牙齿。", "hints": ["它是一种日常用品", "它早晚都要用", "它和牙齿有关"]}, {"zh": "电话", "en": "telephone", "aliases": ["固定电话", "座机"], "profile": "能把说话的声音变成电信号传到远方，让相隔很远的人对着说话。", "hints": ["它和声音有关", "它要用电", "它能让远方的人聊天"]}, {"zh": "自行车", "en": "bicycle", "aliases": ["单车", "脚踏车", "bike"], "profile": "两个轮子一前一后，人坐在上面用脚蹬踏板就能骑着前进的交通工具。", "hints": ["它和交通有关", "它靠人的力气前进", "它有两个轮子"]}, {"zh": "汽车", "en": "car", "aliases": ["小汽车", "轿车"], "profile": "靠发动机带动、在马路上跑的交通工具，能载人也能运货。", "hints": ["它是一种交通工具", "它在马路上跑", "它通常有四个轮子"]}, {"zh": "飞机", "en": "airplane", "aliases": ["aeroplane"], "profile": "有翅膀、靠发动机推动在天上飞的交通工具，能载人飞过高山大海。", "hints": ["它是一种交通工具", "它比汽车跑得快", "它能飞上天"]}, {"zh": "火车", "en": "train", "aliases": ["列车"], "profile": "由车头拉着一节节车厢、沿着铁轨行驶的交通工具，能运很多人和货物。", "hints": ["它是一种交通工具", "它特别长", "它只在铁轨上跑"]}, {"zh": "冰箱", "en": "refrigerator", "aliases": ["电冰箱", "fridge"], "profile": "能让里面一直保持低温的柜子，把食物放进去就不容易变坏。", "hints": ["它要用电", "它常放在厨房里", "它里面总是很冷"]}, {"zh": "雨伞", "en": "umbrella", "aliases": ["伞"], "profile": "下雨时撑开挡雨、晴天还能遮太阳的工具，不用时可以收起来。", "hints": ["它是一种日常用品", "它可以收起来", "它和下雨天有关"]}, {"zh": "手机", "en": "mobile phone", "aliases": ["移动电话", "智能手机", "cell phone", "cellphone"], "profile": "可以随身带着走、不用电线就能打电话的小机器，现在还能拍照上网。", "hints": ["它要用电", "它可以装进口袋", "它能随时和别人通话"]}, {"zh": "红绿灯", "en": "traffic light", "aliases": ["交通信号灯", "信号灯"], "profile": "路口用红、黄、绿三种颜色的灯指挥车辆和行人，红灯停，绿灯行。", "hints": ["它和交通有关", "它会变颜色", "它常站在路口"]}, {"zh": "剪刀", "en": "scissors", "aliases": ["剪子"], "profile": "两片刀刃交叉装在一起、一开一合就能剪开纸和布的工具。", "hints": ["它是一种工具", "它能一开一合", "它能把纸分成两半"]}, {"zh": "风筝", "en": "kite", "aliases": ["纸鸢"], "profile": "用竹条和纸或布扎成、拴着长线借着风力飞上天空的玩具。", "hints": ["它是一种玩具", "它喜欢有风的天气", "它会拖着一根长线"]}, {"zh": "电脑", "en": "computer", "aliases": ["计算机", "电子计算机"], "profile": "能按程序飞快计算、存储资料的电子机器，可以用来学习、画画和上网。", "hints": ["它要用电", "它有一块屏幕", "它算数特别快"]}]}, {"title_zh": "好奇小工匠", "title_en": "Curious Tinkerer", "step": 7, "offset": 0, "items": [{"zh": "铅笔", "en": "pencil", "aliases": [], "profile": "用木头包着一根细细的笔芯做成的笔，写错了还能用橡皮擦掉。", "hints": ["它是一种文具", "它能写字", "它用久了要削一削"]}, {"zh": "眼镜", "en": "glasses", "aliases": ["eyeglasses", "spectacles"], "profile": "戴在眼睛前面的两片镜片，能帮看不清楚的人看得更清晰。", "hints": ["它是一种日常用品", "它是戴在身上的", "它常架在鼻梁上"]}, {"zh": "筷子", "en": "chopsticks", "aliases": [], "profile": "两根一样长的细棍，一只手就能夹起饭菜，是东亚常用的餐具。", "hints": ["它是一种餐具", "它细细长长的", "它总是两根一起用"]}, {"zh": "肥皂", "en": "soap", "aliases": ["香皂"], "profile": "沾水搓一搓就起泡沫、能把手和衣服上的油污洗掉的清洁用品。", "hints": ["它是一种日常用品", "它沾水后滑滑的", "它能搓出很多泡泡"]}, {"zh": "牙膏", "en": "toothpaste", "aliases": [], "profile": "装在软管里的膏状清洁用品，挤在牙刷上刷牙，让牙齿更干净。", "hints": ["它是一种日常用品", "它装在软管里", "它和刷牙有关"]}, {"zh": "洗衣机", "en": "washing machine", "aliases": [], "profile": "放进衣服和水，它就能自动转动把衣服洗干净的家用电器。", "hints": ["它要用电", "它里面会装水", "它干活时会转圈"]}, {"zh": "照相机", "en": "camera", "aliases": ["相机"], "profile": "能把眼前的景象拍下来、变成照片保存的机器。", "hints": ["它和光有关", "它有一个镜头", "它能留住美好的瞬间"]}, {"zh": "空调", "en": "air conditioner", "aliases": ["空调机", "冷气机"], "profile": "用电让屋子里变凉快或变暖和、还能调节湿度的家用电器。", "hints": ["它要用电", "它常挂在墙上", "它夏天特别受欢迎"]}, {"zh": "电影", "en": "movie", "aliases": ["影片", "film"], "profile": "把连续拍下的画面快速放映出来，让画面动起来讲故事的艺术。", "hints": ["它和光有关", "它能讲故事", "它常在大银幕上放"]}, {"zh": "收音机", "en": "radio", "aliases": [], "profile": "能接收空中传来的无线电信号、把它变成声音播放的机器。", "hints": ["它要用电", "它和声音有关", "它能收听广播"]}, {"zh": "电梯", "en": "elevator", "aliases": ["升降机", "lift"], "profile": "装在楼里、像小房间一样上下移动的机器，按一下按钮就能到别的楼层。", "hints": ["它要用电", "它常在高楼里", "它能上上下下"]}, {"zh": "造纸术", "en": "papermaking", "aliases": ["纸", "造纸"], "profile": "把树皮、麻头、破布和旧渔网捣烂做成纸的方法，是中国古代四大发明之一。", "hints": ["它来自中国古代", "它是一种制作方法", "它和写字有关"]}, {"zh": "活字印刷术", "en": "movable type printing", "aliases": ["活字印刷", "印刷术"], "profile": "先刻好一个个单独的字，再按文章排成版来印刷，用完还能拆开重复使用。", "hints": ["它来自中国古代", "它和书有关", "它把字一个个分开刻"]}, {"zh": "二维码", "en": "QR code", "aliases": ["QR码"], "profile": "由许多黑白小方块组成的方形图案，用手机一扫就能读出里面的信息。", "hints": ["它和信息有关", "它是黑白相间的", "它要用手机扫一扫"]}, {"zh": "创可贴", "en": "adhesive bandage", "aliases": ["Band-Aid", "止血贴"], "profile": "中间带一小块干净纱布的小胶布，小伤口贴上它能得到保护。", "hints": ["它和医学有关", "它又小又轻", "它一面是黏黏的"]}, {"zh": "拉链", "en": "zipper", "aliases": ["拉锁", "zip"], "profile": "两排小齿咬合在一起、一拉就能打开或合上，常用在衣服和书包上。", "hints": ["它是一种日常用品", "它常在衣服和书包上", "它一拉就能合上"]}]}, {"title_zh": "点子收集家", "title_en": "Idea Collector", "step": 7, "offset": 0, "items": [{"zh": "手表", "en": "wristwatch", "aliases": ["腕表", "watch"], "profile": "戴在手腕上、随时都能看时间的小钟表。", "hints": ["它是一种日常用品", "它和时间有关", "它戴在手腕上"]}, {"zh": "电风扇", "en": "electric fan", "aliases": ["风扇", "电扇"], "profile": "用电让几片扇叶飞快转动、吹出凉风的家用电器。", "hints": ["它要用电", "它有几片叶片", "它能吹出风来"]}, {"zh": "橡皮", "en": "eraser", "aliases": ["橡皮擦", "rubber"], "profile": "用橡胶或塑料做成的小块文具，能擦掉铅笔写错的字。", "hints": ["它是一种文具", "它软软的", "它能让字消失"]}, {"zh": "气球", "en": "balloon", "aliases": [], "profile": "用薄薄的橡胶做成、吹进气后会鼓起来的小玩具，常用来装饰派对。", "hints": ["它是一种玩具", "它有很多颜色", "它吹气后会变大"]}, {"zh": "手电筒", "en": "flashlight", "aliases": ["手电", "电筒", "torch"], "profile": "装着电池、拿在手里就能照亮前方的小灯。", "hints": ["它和光有关", "它可以拿在手里", "它适合在黑暗里用"]}, {"zh": "摩托车", "en": "motorcycle", "aliases": ["摩托", "机车"], "profile": "有两个轮子、靠发动机带动的交通工具，骑起来比自行车快得多。", "hints": ["它是一种交通工具", "它有发动机", "它通常只有两个轮子"]}, {"zh": "机器人", "en": "robot", "aliases": [], "profile": "能按照程序自动完成各种工作的机器，有的像人，有的像手臂或小车。", "hints": ["它要用电", "它能自动干活", "它有的长得像人"]}, {"zh": "计算器", "en": "calculator", "aliases": [], "profile": "按下数字和符号键，就能马上算出结果的小机器。", "hints": ["它和数学有关", "它有很多按键", "它能帮你算数"]}, {"zh": "算盘", "en": "abacus", "aliases": [], "profile": "用木框串着一颗颗珠子、拨动珠子来计算的古老工具。", "hints": ["它和数学有关", "它很古老", "它上面有很多珠子"]}, {"zh": "烟花", "en": "fireworks", "aliases": ["烟火", "焰火"], "profile": "点燃后飞上天空炸开、放出五颜六色光芒的节日庆祝用品。", "hints": ["它来自中国古代", "它常在节日出现", "它会在夜空里开花"]}, {"zh": "显微镜", "en": "microscope", "aliases": [], "profile": "用几片镜片把很小很小的东西放大许多倍、让人看清的仪器。", "hints": ["它是一种仪器", "它有好几片镜片", "它能看清很小的东西"]}, {"zh": "望远镜", "en": "telescope", "aliases": ["千里镜"], "profile": "用镜片或镜子收集光线、让远处的东西看起来又大又清楚的仪器。", "hints": ["它是一种仪器", "它和光有关", "它能看清很远的东西"]}, {"zh": "微波炉", "en": "microwave oven", "aliases": ["microwave"], "profile": "用微波让食物里的水分子快速振动发热，很快就能把饭菜热好的厨房电器。", "hints": ["它要用电", "它常放在厨房里", "它能很快把饭热好"]}, {"zh": "方便面", "en": "instant noodles", "aliases": ["泡面", "速食面"], "profile": "提前煮熟再弄干的面饼，用开水一泡几分钟就能吃的食品。", "hints": ["它是一种食物", "它做起来很快", "它要用开水泡"]}, {"zh": "地铁", "en": "subway", "aliases": ["地下铁", "metro"], "profile": "大部分在城市地下隧道里行驶的列车，不怕堵车，能快速运送很多乘客。", "hints": ["它是一种交通工具", "它在城市里", "它大多在地下跑"]}, {"zh": "玻璃", "en": "glass", "aliases": [], "profile": "用沙子等原料高温熔化后做成的透明材料，常用来做窗户、杯子和镜片。", "hints": ["它是一种材料", "它大多是透明的", "它摔了容易碎"]}]}, {"title_zh": "发现小达人", "title_en": "Discovery Whiz", "step": 7, "offset": 0, "items": [{"zh": "蒸汽机", "en": "steam engine", "aliases": [], "profile": "烧煤把水烧成蒸汽、用蒸汽推动机器运转的动力机器，带来了工业革命。", "hints": ["它是一种机器", "它和能源有关", "它要把水烧开"]}, {"zh": "互联网", "en": "Internet", "aliases": ["因特网"], "profile": "把全世界的电脑和手机连在一起的巨大网络，让人们能随时传递信息。", "hints": ["它和信息有关", "它把很多设备连在一起", "它能让你上网"]}, {"zh": "丝绸", "en": "silk", "aliases": ["蚕丝"], "profile": "用蚕吐出的丝织成的光滑柔软的布料，古代经丝绸之路运到很远的地方。", "hints": ["它来自中国古代", "它摸起来很光滑", "它和蚕宝宝有关"]}, {"zh": "瓷器", "en": "porcelain", "aliases": ["瓷"], "profile": "用特殊的黏土高温烧成的器物，又白又硬又光滑，英文里它和“中国”是同一个词。", "hints": ["它来自中国古代", "它要用高温烧制", "它常被做成碗和花瓶"]}, {"zh": "塑料", "en": "plastic", "aliases": [], "profile": "用石油等原料人工合成的材料，轻便又能做成各种形状，但很难自然分解。", "hints": ["它是一种材料", "它又轻又便宜", "它很难自然分解"]}, {"zh": "热气球", "en": "hot air balloon", "aliases": [], "profile": "把球囊里的空气加热，让热空气把人和吊篮一起带上天空的飞行器。", "hints": ["它能飞上天", "它下面挂着吊篮", "它靠加热空气升起"]}, {"zh": "魔术贴", "en": "Velcro", "aliases": ["尼龙搭扣", "粘扣带", "hook and loop"], "profile": "一面是小钩子、一面是小绒圈，一按就粘住、一撕就分开的扣子。", "hints": ["它是一种日常用品", "它常用在鞋子上", "它一按就粘住了"]}, {"zh": "圆珠笔", "en": "ballpoint pen", "aliases": ["原子笔"], "profile": "笔尖装着一颗小钢珠，写字时钢珠滚动把油墨带到纸上的笔。", "hints": ["它是一种文具", "它不用蘸墨水", "它的笔尖有颗小珠子"]}, {"zh": "细菌", "en": "bacteria", "aliases": [], "profile": "只有一个细胞、小到要用显微镜才能看见的微小生物，有的有益，有的会让人生病。", "hints": ["它是一项发现", "它非常非常小", "它到处都有"]}, {"zh": "风车", "en": "windmill", "aliases": [], "profile": "靠风吹动大大的叶片转动、用来磨面粉或抽水的机器，荷兰的最有名。", "hints": ["它是一种机器", "它靠风来工作", "它有几片大叶片会转"]}, {"zh": "轮船", "en": "steamship", "aliases": ["汽船", "蒸汽船"], "profile": "用蒸汽机等发动机带动、不用靠风帆和划桨就能航行的大船。", "hints": ["它是一种交通工具", "它在水上行驶", "它不用靠风帆"]}, {"zh": "高铁", "en": "high speed rail", "aliases": ["高速铁路", "高速列车", "bullet train"], "profile": "在专门修建的铁路上，以每小时200公里以上的速度飞驰的列车。", "hints": ["它是一种交通工具", "它要用电", "它跑得特别快"]}, {"zh": "鼠标", "en": "computer mouse", "aliases": ["滑鼠", "mouse"], "profile": "握在手里在桌上移动，就能控制电脑屏幕上箭头的小设备。", "hints": ["它和电脑有关", "它常放在桌子上", "它可以握在手里"]}, {"zh": "疫苗", "en": "vaccine", "aliases": [], "profile": "帮助身体提前认识病菌、学会抵抗它们的医学发明，打了它就不容易得某些病。", "hints": ["它和医学有关", "它能保护身体", "它常要打一针"]}, {"zh": "保温瓶", "en": "vacuum flask", "aliases": ["暖水瓶", "热水瓶", "保温杯", "thermos"], "profile": "瓶胆有两层、中间抽成真空，能让热水长时间保持热、冷饮保持冷的容器。", "hints": ["它是一种日常用品", "它不用电", "它能让水一直热乎乎的"]}]}, {"title_zh": "实验室助手", "title_en": "Lab Assistant", "step": 7, "offset": 0, "items": [{"zh": "电报", "en": "telegraph", "aliases": [], "profile": "用电线把电信号从一个地方传到另一个地方，再翻译成文字的通信方法。", "hints": ["它和通信有关", "它要用电", "它比电话出现得早"]}, {"zh": "盲文", "en": "Braille", "aliases": ["点字", "布莱尔盲文"], "profile": "用纸上凸起的小圆点组成字母，让看不见的人用手指摸着读的文字。", "hints": ["它和文字有关", "它由小圆点组成", "它要用手指去读"]}, {"zh": "邮票", "en": "postage stamp", "aliases": ["stamp"], "profile": "贴在信封上、表示已经付过邮费的小纸片，上面常印着漂亮的图案。", "hints": ["它和通信有关", "它是一张小纸片", "它常贴在信封上"]}, {"zh": "阿拉伯数字", "en": "Arabic numerals", "aliases": ["印度阿拉伯数字"], "profile": "从0到9的十个数字符号，今天全世界都用它们来写数和计算。", "hints": ["它和数学有关", "它一共有十个", "它写数时天天会用到"]}, {"zh": "细胞", "en": "cell", "aliases": [], "profile": "组成生物身体的最小单位，就像盖房子用的一块块砖，要用显微镜才能看见。", "hints": ["它是一项发现", "它和生物有关", "它非常小"]}, {"zh": "人造卫星", "en": "artificial satellite", "aliases": ["卫星", "satellite"], "profile": "被火箭送上太空、绕着地球不停转圈的机器，能帮我们通信、导航和看天气。", "hints": ["它是人造的机器", "它在太空中", "它绕着地球转"]}, {"zh": "听诊器", "en": "stethoscope", "aliases": [], "profile": "医生挂在脖子上、贴在胸口就能听到心跳和呼吸声的医疗工具。", "hints": ["它和医学有关", "它和声音有关", "它常挂在医生脖子上"]}, {"zh": "直升机", "en": "helicopter", "aliases": ["直升飞机"], "profile": "靠头顶的大旋翼转动升空的飞行器，能垂直起降，还能停在空中不动。", "hints": ["它能飞上天", "它能停在半空中", "它头顶有大螺旋桨"]}, {"zh": "地动仪", "en": "seismoscope", "aliases": ["候风地动仪"], "profile": "东汉张衡制造的仪器，能测出远方发生地震的大致方向。", "hints": ["它来自中国古代", "它是一种仪器", "它身上有八条龙"]}, {"zh": "日晷", "en": "sundial", "aliases": [], "profile": "靠太阳照出的影子落在刻度盘上的位置来看时间的古老计时工具。", "hints": ["它很古老", "它和时间有关", "它离不开太阳"]}, {"zh": "条形码", "en": "barcode", "aliases": ["条码"], "profile": "由一组粗细不同的黑白条纹组成，扫描一下就能读出商品信息。", "hints": ["它和信息有关", "它是黑白相间的", "它常印在商品包装上"]}, {"zh": "缝纫机", "en": "sewing machine", "aliases": [], "profile": "用针和线自动把布料缝在一起的机器，做衣服比手工快很多。", "hints": ["它是一种机器", "它和衣服有关", "它用针和线干活"]}, {"zh": "留声机", "en": "phonograph", "aliases": ["唱机"], "profile": "能把声音录下来再放出来的机器，是第一台既能录音又能放音的机器。", "hints": ["它是一种机器", "它和声音有关", "它有一个大喇叭"]}, {"zh": "青霉素", "en": "penicillin", "aliases": ["盘尼西林"], "profile": "从青霉菌里找到的一种药，能杀死让人生病的细菌，救了无数人的生命。", "hints": ["它和医学有关", "它来自一种霉菌", "它能对付细菌"]}, {"zh": "X射线", "en": "X-ray", "aliases": ["X光", "伦琴射线"], "profile": "一种眼睛看不见、能穿透人体的射线，医生用它拍片子，看到身体里的骨头。", "hints": ["它是一项发现", "它眼睛看不见", "它能照出骨头"]}]}, {"title_zh": "灵感工程师", "title_en": "Idea Engineer", "step": 5, "offset": 0, "items": [{"zh": "杂交水稻", "en": "hybrid rice", "aliases": [], "profile": "用两种不同的水稻培育出的新品种，产量高得多，让更多人能吃饱饭。", "hints": ["它和粮食有关", "它来自中国", "它长在稻田里"]}, {"zh": "光合作用", "en": "photosynthesis", "aliases": [], "profile": "绿色植物利用阳光，把二氧化碳和水变成养分并放出氧气的过程。", "hints": ["它是一项发现", "它和植物有关", "它需要阳光"]}, {"zh": "维生素", "en": "vitamin", "aliases": ["维他命"], "profile": "人体需要得很少但不能缺少的一类营养物质，多吃蔬菜水果就能获得很多种。", "hints": ["它和营养有关", "它有很多种", "它藏在蔬菜水果里"]}, {"zh": "电子邮件", "en": "email", "aliases": ["电邮", "e-mail"], "profile": "通过网络发送的信件，几秒钟就能送到世界另一头的人手里。", "hints": ["它和通信有关", "它要通过网络", "它的地址里有个@符号"]}, {"zh": "摩尔斯电码", "en": "Morse code", "aliases": ["莫尔斯电码", "摩斯密码", "摩斯电码"], "profile": "用短的“滴”和长的“答”两种信号组合，来表示字母和数字的编码方法。", "hints": ["它和通信有关", "它是一种编码", "它只有长短两种信号"]}, {"zh": "纸币", "en": "paper money", "aliases": ["钞票", "banknote"], "profile": "用纸印成、代替金属钱币来买东西的钱，世界上最早的出现在中国。", "hints": ["它来自中国古代", "它和买东西有关", "它是用纸做的"]}, {"zh": "触摸屏", "en": "touchscreen", "aliases": ["触屏", "触控屏", "触摸屏幕"], "profile": "用手指直接点、划就能操作的屏幕，手机和平板电脑上都有。", "hints": ["它要用电", "它常在手机上", "它能感觉到手指"]}, {"zh": "人工智能", "en": "artificial intelligence", "aliases": ["AI"], "profile": "让电脑像人一样学习、思考和解决问题的技术，能聊天、认图片和下棋。", "hints": ["它和电脑有关", "它会学习", "它能和人聊天"]}, {"zh": "安全带", "en": "seat belt", "aliases": ["三点式安全带"], "profile": "坐车时系在身上的带子，急刹车或撞车时能把人固定在座位上，保护乘客安全。", "hints": ["它和交通有关", "它能保护人", "它要扣在身上"]}, {"zh": "太阳能电池", "en": "solar cell", "aliases": ["光伏电池", "太阳能电池板", "太阳能板", "solar panel"], "profile": "能把太阳光直接变成电的装置，常铺在屋顶上，也装在卫星上。", "hints": ["它和能源有关", "它离不开阳光", "它能产生电"]}, {"zh": "内燃机", "en": "internal combustion engine", "aliases": ["发动机", "引擎"], "profile": "让燃料在机器内部燃烧、推动活塞做功的动力机器，很多汽车靠它跑。", "hints": ["它是一种机器", "它要烧燃料", "它装在很多汽车里"]}, {"zh": "水泥", "en": "cement", "aliases": ["洋灰", "波特兰水泥"], "profile": "灰色的粉末，加水和沙石搅拌后会慢慢变硬，是盖房子和修路的重要材料。", "hints": ["它是一种材料", "它是灰色的", "它加水后会变硬"]}, {"zh": "隐形眼镜", "en": "contact lens", "aliases": ["角膜接触镜", "contacts"], "profile": "直接贴在眼球表面的小镜片，戴上后别人几乎看不出来，也能帮人看清楚。", "hints": ["它和眼睛有关", "它很薄很小", "它戴上后别人看不出来"]}, {"zh": "麻醉", "en": "anesthesia", "aliases": ["麻醉术", "麻醉药"], "profile": "做手术前让病人暂时失去痛觉或睡着的医学方法，让手术不再疼。", "hints": ["它和医学有关", "它和手术有关", "它让人不觉得疼"]}]}, {"title_zh": "科学探险家", "title_en": "Science Adventurer", "step": 5, "offset": 0, "items": [{"zh": "日心说", "en": "heliocentrism", "aliases": ["太阳中心说", "地动说"], "profile": "认为太阳位于中心、地球和其他行星都绕着太阳转的学说。", "hints": ["它是一种学说", "它和天文有关", "它讲的是地球怎么运动"]}, {"zh": "元素周期表", "en": "periodic table", "aliases": ["周期表", "化学元素周期表"], "profile": "把所有化学元素按规律排成的一张表，同一列的元素性质相似。", "hints": ["它和化学有关", "它是一张表", "它有很多行和列"]}, {"zh": "血型", "en": "blood type", "aliases": ["ABO血型"], "profile": "按照血液里红细胞表面的不同物质给人分成的类型，常见的有A、B、AB和O型。", "hints": ["它是一项发现", "它和医学有关", "它分成好