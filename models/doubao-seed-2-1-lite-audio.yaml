---
apiVersion: gizclaw.admin/v1alpha1
kind: Model
metadata:
  id: doubao-seed-2-1-lite-audio
spec:
  kind: llm
  source: manual
  provider:
    kind: volc-tenant
    id: volc-cn-beijing
  display_name: Doubao Seed 2.1 Lite Audio
  description: Doubao Seed 2.1 Lite with native audio input through Volcengine Ark
  provider_data:
    api_mode: chat_completions
    service_tier: fast
    upstream_model: doubao-seed-2-1-lite-260915
    support_json_output: true
    support_temperature: true
    # GizClaw uses the Doubao audio/transcript adapter for non-text-only Models.
    support_text_only: false
    support_tool_calls: true
    support_thinking: true
    thinking_param: thinking.type
    thinking_levels:
      - enabled
      - disabled
    default_thinking_level: disabled
    use_system_role: true
