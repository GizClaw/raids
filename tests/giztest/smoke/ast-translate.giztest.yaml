# User Story:
# As a Raids catalog maintainer,
# I want equal opening, role and realtime responsiveness gates for every implementation,
# So that text and audio respond promptly without overlap or playback stalls.
version: gizclaw.test/v1alpha1
name: ast-translate.smoke
clients:
  ja_zh_ja_to_zh:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  ko_zh_ko_to_zh:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  zh_en_auto_en_to_zh_auto:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  zh_en_auto_zh_to_en_auto:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  zh_es_zh_to_es:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  zh_fr_zh_to_fr:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  zh_ja_zh_to_ja:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  zh_ko_zh_to_ko:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  ja_zh_ja_to_zh_text_workspace:
    direction: input
    type: string
    generate: token
  ko_zh_ko_to_zh_text_workspace:
    direction: input
    type: string
    generate: token
  zh_en_auto_en_to_zh_auto_text_workspace:
    direction: input
    type: string
    generate: token
  zh_en_auto_zh_to_en_auto_text_workspace:
    direction: input
    type: string
    generate: token
  zh_es_zh_to_es_text_workspace:
    direction: input
    type: string
    generate: token
  zh_fr_zh_to_fr_text_workspace:
    direction: input
    type: string
    generate: token
  zh_ja_zh_to_ja_text_workspace:
    direction: input
    type: string
    generate: token
  zh_ko_zh_to_ko_text_workspace:
    direction: input
    type: string
    generate: token
  ja_zh_ja_to_zh_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ko_zh_ko_to_zh_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  zh_en_auto_en_to_zh_auto_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  zh_en_auto_zh_to_en_auto_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  zh_es_zh_to_es_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  zh_fr_zh_to_fr_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  zh_ja_zh_to_ja_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  zh_ko_zh_to_ko_audio:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  ja_zh_ja_to_zh_realtime_workspace:
    direction: input
    type: string
    generate: token
  ko_zh_ko_to_zh_realtime_workspace:
    direction: input
    type: string
    generate: token
  zh_en_auto_en_to_zh_auto_realtime_workspace:
    direction: input
    type: string
    generate: token
  zh_en_auto_zh_to_en_auto_realtime_workspace:
    direction: input
    type: string
    generate: token
  zh_es_zh_to_es_realtime_workspace:
    direction: input
    type: string
    generate: token
  zh_fr_zh_to_fr_realtime_workspace:
    direction: input
    type: string
    generate: token
  zh_ja_zh_to_ja_realtime_workspace:
    direction: input
    type: string
    generate: token
  zh_ko_zh_to_ko_realtime_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 12m
steps:
- id: ja_zh_ja_to_zh_register
  client: ja_zh_ja_to_zh
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: ko_zh_ko_to_zh_register
