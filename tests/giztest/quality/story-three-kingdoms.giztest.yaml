    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      contains_all:
      - 第 2 章
      - 百姓与追击
      not_contains:
      - 第 1 章
      pattern: 第 2 章[：:]\s*百姓与追击[\s\S]{20,}[。！？]
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
- id: flowcraft_transitions_continue_current_chapter
  client: flowcraft
  timeout: 2m
  peer_stream:
    mode: text
    input: 请继续第二章当前场景，推进一个直接结果，不要重复章节标题。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
