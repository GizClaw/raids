          satiety: 1.3888888889
          hygiene: 0.7
          mood: 1.0
        energy_recovery_per_hour: 10
        life_decay:
          max_loss_per_hour: 4
          exponent: 2
          contributing_weights:
            health: 0.25
            satiety: 0.25
            hygiene: 0.25
            mood: 0.25
