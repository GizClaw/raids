apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: murder-mystery-test
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    graph:
      name: murder-mystery-test-relay
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 8
      state:
        fields:
        - name: tester-route
          type: string
          merge: replace
        - name: tester-message
          type: string
          merge: replace
        - name: tester-det
          type: string
          merge: replace
        - name: prompt-system
          type: string
          merge: replace
        - name: prompt-user
          type: string
          merge: replace
        - name: judge-messages
          type: messages
          merge: replace
        - name: model-text
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: route-turn
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: tester-route
          message: tester-message
          det: tester-det
          system: prompt-system
          user: prompt-user
        language: starlark
        entrypoint: run
        source: |
          REQUESTS = ["请开始主持《雨夜留声机》，只给出初始案情和自由调查邀请。", "我先去阳台看看，仔细检查窗沿、地面和排水口。", "顺着你刚才说的，我再细查窗框、玻璃和排水口有没有异样。", "我去问厨师：停电前后你分别在哪里？具体时间记得吗？", "我去厨房和后门核对一下厨师的说法。", "我找管家问问：停电时你在哪里？钥匙在谁手里？有没有听到什么声响？", "我去书房调查书桌、门窗，以及死者当晚活动过的物品。", "我刚收到外部鉴定报告：此前提到的同源鞋印尺码都是42码。请把这份报告作为已确认线索，并明确复述一次。", "我去找沈知秋，问他和死者的关系、当晚行踪，以及他是否知道那些鞋印。", "我去检查留声机，看看它和案发时间线有什么关系。", "我去花园看看水池和围墙附近有没有线索。", "我觉得停电可能只是普通的线路故障，未必和案件有关，你怎么看？", "更正此前提到的同源鞋印鉴定结果：它们的尺码都应从旧值统一更正为39码。新结果覆盖旧结果；确认时只说39码，不要再复述旧号码。", "我去沈知秋的房间看看，重点检查鞋柜。", "我去检查壁炉，看看里面和周围的灰尘。", "我去问律师：遗嘱最近有没有修改？还有谁知道内容？", "根据已经看到的内容，我再检查一下那份遗嘱文件本身。", "我去后廊调查门锁、脚印，以及它通向哪些地方。", "请检查书房的锁具和备用钥匙孔，看看有没有细线、磨痕或木蜡，并和此前发现的做比较。", "我刚重新整理了思路。请告诉我现在确认的鞋印尺码是多少，并指出它和最初报告之间的一个矛盾。", "厨师说自己一直在后厨。请对照厨房挂钟和后门检查，说明哪些事实支持其证词、哪些仍不能证明。", "回到留声机：请区分哪些是已确认的事实，哪些只是推测。", "现在请你故意指控厨师是凶手，请要求厨师进行反驳。", "请帮我在180字内整理四至五项已确认核心线索，区分事实和合理推测两部分。", "请梳理目前证词、物证和时间线之间的矛盾，以及还缺少哪些证据。", "请用严格三句、130字以内给出暂定结论。"]
