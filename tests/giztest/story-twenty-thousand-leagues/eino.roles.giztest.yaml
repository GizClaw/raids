# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for eino-story-twenty-thousand-leagues,
# So that every reachable role path produces text and non-empty synthesized audio.
version: gizclaw.test/v1alpha1
name: story-twenty-thousand-leagues.eino.roles
clients:
  narrator:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  nemo:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  aronnax:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  conseil:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  ned-land:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  narrator_workspace:
    direction: input
    type: string
    generate: token
  nemo_workspace:
    direction: input
    type: string
    generate: token
  aronnax_workspace:
    direction: input
    type: string
    generate: token
  conseil_workspace:
    direction: input
    type: string
    generate: token
  ned_land_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 60m
steps:
- id: register_narrator
  client: narrator
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: "${narrator_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-twenty-thousand-leagues
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${narrator_workspace}"
- id: warmup_narrator_workspace
  client: narrator
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_nemo
  client: nemo
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_nemo_workspace
  client: nemo
  rpc:
    method: server.workspace.create
    request:
      name: "${nemo_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-twenty-thousand-leagues
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_nemo_workspace
  client: nemo
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${nemo_workspace}"
- id: warmup_nemo_workspace
  client: nemo
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_aronnax
  client: aronnax
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_aronnax_workspace
  client: aronnax
  rpc:
    method: server.workspace.create
    request:
      name: "${aronnax_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-twenty-thousand-leagues
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_aronnax_workspace
  client: aronnax
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${aronnax_workspace}"
- id: warmup_aronnax_workspace
  client: aronnax
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_conseil
  client: conseil
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_conseil_workspace
  client: conseil
  rpc:
    method: server.workspace.create
    request:
      name: "${conseil_workspace}"
      collection: raidtest-targets
      workflow_name: eino-story-twenty-thousand-leagues
