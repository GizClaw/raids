apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-story-alice-test
spec:
  driver: eino
  toolkit:
    tool_ids:
    - raidtest-acceptance-report
  eino:
    graph:
      name: flowcraft-story-alice-acceptance-tester
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: judge-route
          type: string
          merge: replace
        - name: active-checkpoint
          type: string
          merge: replace
        - name: active-contract
          type: string
          merge: replace
        - name: supplied-next-message
          type: string
          merge: replace
        - name: tester-rules
          type: string
          merge: replace
        - name: judge-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: route-checkpoint
        type: script
        inputs:
          payload:
            from: input.text
        outputs:
          route: judge-route
          checkpoint: active-checkpoint
          contract: active-contract
          next_message: supplied-next-message
          rules: tester-rules
        language: starlark
        entrypoint: run
        source: |
          def contains_any(text, values):
              for value in values:
                  if value in text:
                      return True
              return False

          def run(input):
              payload = input["payload"]
              markers = ["\"response_index\":0,", "\"response_index\":1,", "\"response_index\":2,", "\"response_index\":3,", "\"response_index\":4,", "\"response_index\":5,", "\"response_index\":6,", "\"response_index\":7,", "\"response_index\":8,", "\"response_index\":9,", "\"response_index\":10,", "\"response_index\":11,", "\"response_index\":12,", "\"response_index\":13,"]
              checkpoints = ["opening", "choose-question-watch", "challenge-rule", "ask-small-hint", "propose-solution", "establish-door", "correct-door", "reload-chapter-checkpoint", "remember-password", "correct-password", "test-rule-counterexample", "recall-password", "recap-and-exit"]
              contracts = ["必须含兔子、两块表；不得含###、```、- ；20-120字", "必须含问题、表；45-185字", "40-180字", "不得含答案就是、正确答案是、你选择；20-110字", "35-170字", "必须含蓝色、门；不得含你打开了、你推开了、你进入了；15-90字", "必须含绿色、问号；不得含蓝色；10-80字", "必须含第三章、绿色；不得含蓝色、第四章、你打开、你进入；15-90字", "必须含茶杯向左；8-80字", "必须含茶杯向右；不得含茶杯向左；8-80字", "40-190字", "必须含茶杯向右；不得含茶杯向左；4-60字", "必须含问题、绿色；不得含蓝色、你打开、你进入、###、```；25-140字"]
              requests = ["", "我先看显示问题的那块表，想知道它到底问了什么。", "如果答案表总比问题表快一分钟，那它怎么可能回答还没出现的问题？先回应我的质疑。", "给我一个小提示，不要直接告诉我谜底，也不要替我选下一步。", "我猜两块表不是在预测，而是在把同一个问题拆成先后两面。这个解释成立吗？", "我们来到一扇蓝色小门前，门把手像问号。请记住颜色，不要开门。", "更正，小门不是蓝色，是绿色；其他细节不变。只确认正确事实。", "重连后先别开门。用一句话说现在是第几章，并确认门的正确颜色。", "先记住门边口令是“茶杯向左”，只简短确认，不要开门。", "更正，口令是“茶杯向右”，旧口令作废。只确认新口令。", "如果所有会说话的门都诚实，这扇门刚才自相矛盾，该怎样检验规则而不是直接相信？", "隔了几轮，现在只说有效口令，不要提已经作废的那个。", "用两句完整的话说出我先看的手表和门的正确颜色，再让我自己决定是否开门。", ""]
              index = 0
              for i in range(len(markers)):
                  if markers[i] in payload:
                      index = i
              checkpoint = "bootstrap" if index == 0 else checkpoints[index - 1]
              contract = "尚无目标回复；只启动第一轮" if index == 0 else contracts[index - 1]
              if '"type":"TOOL_RETRY"' in payload:
                  route = "retry"
              elif index == 0:
                  route = "bootstrap"
              elif index == len(checkpoints):
                  route = "conclusion"
              elif contains_any(checkpoint, ["establish", "correct", "recall", "reload", "remember", "change-choice"]):
                  route = "correction"
              elif contains_any(checkpoint, ["challenge", "theory", "test", "reject", "refuse", "predict", "preserve", "compare"]):
                  route = "challenge"
              else:
                  route = "evidence"
              return {
                  "route": route,
                  "checkpoint": checkpoint,
                  "contract": contract,
                  "next_message": requests[index],
                  "rules": "你是 `flowcraft-story-alice` 的专属验收 Workflow，不是目标剧本角色。你负责爱丽丝谜题的怀表规则、分级提示、门色和口令更正、反例、角色连续与玩家自主推理。\n负向控制：更正或回忆回复若恢复旧门色或旧口令，continuity 必须 fail；直接公布谜底、替玩家行动或强迫固定路线，instruction_following 必须 fail。\n每次输入都是 raidtest JSON envelope。只评估顶层 checkpoint_id 对应的当前 TARGET_RESPONSE，并使用 envelope 中可见的完整 target_history 核对连续性；不得臆造未保存的回复。\n必须恰好调用一次 `raidtest_acceptance_report`（资源 raidtest-acceptance-report）。case_id、target_workflow_id、response_id 和 turn_id 必须逐字复制顶层 envelope；turn_id 必须等于 active_checkpoint。\nchecks 至少包含 instruction_following、continuity、factuality、non_repetition 四项，每项 status 只能是 pass 或 fail，并给出具体 detail 与直接来自当前回复或可见历史的简短 evidence。\n外部 runner 负责精确字数、required/forbidden、顺序和延迟硬门槛；你不得为了迎合外部门槛把语义合格回复判坏，也不得忽略 active_contract 暴露的事实边界。\n非最后一轮即使出现 fail 也必须 action=continue，并在 checks 和 summary 如实保留失败，next_message 必须逐字等于 supplied_next_message。最后一轮所有 checks 合格才 action=pass，否则 action=fail；终态 next_message 为空。\n第一步必须实际调用 Tool。只有收到 accepted=true 后才可输出“已提交本轮验收。”；不得先输出正文，不得在正文重复 Tool 参数。",
              }
        limits:
          max_execution_steps: 30000
          timeout: 250ms
          max_input_bytes: 1048576
          max_output_bytes: 262144
      - id: prompt-bootstrap
        type: prompt
        inputs:
          payload:
            from: input.text
          rules:
            from: tester-rules
          checkpoint:
            from: active-checkpoint
          contract:
            from: active-contract
          next_message:
            from: supplied-next-message
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {rules}

            当前判断路径：bootstrap。当前没有目标回复。只提交 continue，并原样发送给定的 opening next_message；不要虚构 checks 的目标证据。
            active_checkpoint={checkpoint}
            active_contract={contract}
            supplied_next_message={next_message}
        - role: user
          template: '{payload}'
      - id: prompt-evidence
        type: prompt
        inputs:
          payload:
            from: input.text
          rules:
            from: tester-rules
          checkpoint:
            from: active-checkpoint
          contract:
            from: active-contract
          next_message:
            from: supplied-next-message
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {rules}

            当前判断路径：evidence。只判断当前调查或故事动作是否被完整回应、是否新增了未经请求的事实，以及是否保持玩家选择权。
            active_checkpoint={checkpoint}
            active_contract={contract}
            supplied_next_message={next_message}
        - role: user
          template: '{payload}'
      - id: prompt-correction
        type: prompt
        inputs:
          payload:
            from: input.text
          rules:
            from: tester-rules
          checkpoint:
            from: active-checkpoint
          contract:
            from: active-contract
          next_message:
            from: supplied-next-message
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {rules}

            当前判断路径：correction。重点判断最新值是否完全覆盖旧值、纯确认/回忆是否没有推进剧情，以及 reload 后有效事实是否仍连续。
            active_checkpoint={checkpoint}
            active_contract={contract}
            supplied_next_message={next_message}
        - role: user
          template: '{payload}'
      - id: prompt-challenge
        type: prompt
        inputs:
          payload:
            from: input.text
          rules:
            from: tester-rules
          checkpoint:
            from: active-checkpoint
          contract:
            from: active-contract
          next_message:
            from: supplied-next-message
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {rules}

            当前判断路径：challenge。重点判断目标是否拒绝无证据断言或不安全方案、区分事实和推测、避免固定套话，并保留玩家自主决策。
            active_checkpoint={checkpoint}
            active_contract={contract}
            supplied_next_message={next_message}
        - role: user
          template: '{payload}'
      - id: prompt-conclusion
        type: prompt
        inputs:
          payload:
            from: input.text
          rules:
            from: tester-rules
          checkpoint:
            from: active-checkpoint
          contract:
            from: active-contract
          next_message:
            from: supplied-next-message
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {rules}

            当前判断路径：conclusion。重点判断总结只使用已见且仍有效的事实、没有恢复旧值或夸大证据，并完整遵守句数和收束要求。
            active_checkpoint={checkpoint}
            active_contract={contract}
            supplied_next_message={next_message}
        - role: user
          template: '{payload}'
      - id: prompt-retry
        type: prompt
        inputs:
          payload:
            from: input.text
          rules:
            from: tester-rules
          checkpoint:
            from: active-checkpoint
          contract:
            from: active-contract
          next_message:
            from: supplied-next-message
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {rules}

            当前判断路径：retry。这是同一 response_id 的 Tool 重试。依据 previous_tool_error 修正参数并重新提交原判定；不得推进 checkpoint 或改写 next_message。
            active_checkpoint={checkpoint}
            active_contract={contract}
            supplied_next_message={next_message}
        - role: user
          template: '{payload}'
      - id: judge-model
        type: chat_model
        inputs:
          messages:
            from: judge-messages
        outputs:
          text: answer
        model: flowcraft-story-alice-test.model
        max_tokens: 2048
        temperature: 0
      edges:
      - from: start
        to: route-checkpoint
      - from: prompt-bootstrap
        to: judge-model
      - from: prompt-evidence
        to: judge-model
      - from: prompt-correction
        to: judge-model
      - from: prompt-challenge
        to: judge-model
      - from: prompt-conclusion
        to: judge-model
      - from: prompt-retry
        to: judge-model
      - from: judge-model
        to: end
      branches:
      - from: route-checkpoint
        mode: first_match
        routes:
        - when:
            field: judge-route
            op: eq
            value: retry
          to: prompt-retry
        - when:
            field: judge-route
            op: eq
            value: bootstrap
          to: prompt-bootstrap
        - when:
            field: judge-route
            op: eq
            value: correction
          to: prompt-correction
        - when:
            field: judge-route
            op: eq
            value: challenge
          to: prompt-challenge
        - when:
            field: judge-route
            op: eq
            value: conclusion
          to: prompt-conclusion
        default: prompt-evidence
      outputs:
      - node: judge-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
