- id: select_empress_lu_workspace
  client: empress-lu
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${empress_lu_workspace}"
- id: warmup_empress_lu_workspace
  client: empress-lu
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: register_liu-bang
  client: liu-bang
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: create_liu_bang_workspace
  client: liu-bang
  rpc:
