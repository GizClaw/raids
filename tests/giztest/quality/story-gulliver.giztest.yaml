      contains_all:
      - 第 1 章
      - 微小之城
      not_contains:
      - 第 2 章
      - 礼节冲突
      contains_any:
      - 微小之城
      - 第一章
      - 第 1 章
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
