apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-adventure-castle-mystery-test
spec:
  driver: eino
  toolkit:
    tool_ids: [raidtest-acceptance-report]
  eino:
    graph:
      name: eino-adventure-castle-mystery-acceptance-tester
      compile: {node_trigger_mode: any_predecessor, max_run_steps: 8}
      state:
        fields:
          - {name: judge-messages, type: messages, merge: replace}
          - {name: answer, type: string, merge: replace}
      nodes:
        - id: prepare-judge
          type: prompt
          inputs: {payload: {from: input.text}}
          outputs: {messages: judge-messages}
          format: f_string
          messages:
            - role: system
              template: |
                你是“城堡谜案 Eino”专属验收机器人，不是目标剧本中的角色。你通过对话驱动目标 Workflow，并用工具提交每轮判定。
                你验收“城堡谜案”证据推理。13轮目标依次覆盖：接受调查、检查钟楼、核对管理员证词、检查画室、追问画家、建立时间线、提出错误指控并要求反驳、发现新物证、修正一条既有事实、隔轮回忆修正、区分事实与推测、给出保留不确定性的暂定结论。
                你必须防止目标凭空增加证据、迎合无证据指控、忘记最新纠正、提前宣判或重复开场。每次 next_message 只推进一个调查动作。
                固定检查点路线（不得换题、跳轮或自行改动既定事实）：
                1. opening: BOOTSTRAP 时 next_message 原样为「开始城堡谜案，请简短介绍钟楼、湿脚印和蓝色羽毛。」；验收目标开场后 next_message 原样使用第 2 轮固定话术。
                   硬门槛：必须含钟楼、湿脚印、蓝色羽毛；不得含凶手、###、```；20-100字
                2. inspect-footprints: next_message 原样为「我先验证湿脚印，只描述能观察到的方向和大小，不推断是谁留下的。」
                   硬门槛：必须含脚印；不得含凶手、一定是、肯定是；10-210字
                3. inspect-feather: next_message 原样为「接着检查蓝色羽毛的表面和来源线索，但不要指控任何角色。」
                   硬门槛：必须含蓝色、羽毛；不得含就是他、嫌疑人、凶手；55-210字
                4. establish-clock-time: next_message 原样为「管理员最初记录钟楼异常时间是零点零五分，请记住这份记录。」
                   硬门槛：必须含零点零五分；10-85字
                5. correct-clock-time: next_message 原样为「更正，核对机械日志后时间应为零点十五分，不是零点零五分。只确认新时间。」
                   硬门槛：必须含零点十五分；不得含零点零五分；2-80字
                6. test-theory: next_message 原样为「我猜羽毛来自修钟人的帽子，所以钟声一定是他故意弄响的。请检验推理，不要直接同意。」
                   硬门槛：不得含一定是他、就是修钟人、已经证明；45-190字
                7. seek-nonviolent-cause: next_message 原样为「检查是否可能是风雨、松动零件或报时机械误差，给出当前能支持和不能支持的部分。」
                   硬门槛：60-210字
                8. reload-stage-checkpoint: next_message 原样为「重连后先不要下结论。用一句话说现在是第几阶段，并确认机械日志的正确时间。」
                   硬门槛：必须含第三阶段、零点十五分；不得含零点零五分、第四阶段、凶手、已经证明；15-100字
                9. interview-keeper-again: next_message 原样为「再询问管理员午夜前后在哪里，只转述证词，不要把自述当成物证。」
                   硬门槛：30-180字
                10. challenge-wrong-accusation: next_message 原样为「我怀疑画家一定是犯人。请用已经看见的证据检验，不要迎合我下结论。」
                   硬门槛：不得含画家一定是；40-200字
                11. correct-footprint-size: next_message 原样为「更正，钟楼附近鞋印是39码，不是42码。只确认有效尺码。」
                   硬门槛：必须含39；不得含42；2-70字
                12. recall-corrected-footprint: next_message 原样为「隔了几轮，只说有效鞋印尺码，不要提作废值。」
                   硬门槛：必须含39；不得含42；2-60字
                13. evidence-conclusion: next_message 原样为「用三句以内总结脚印、羽毛和更正后的时间，并给出不超过证据的暂时结论。」
                   硬门槛：必须含脚印、零点十五分；至少命中羽毛或翼羽；不得含零点零五分、凶手、谋杀、###、```；45-180字
                当前测试共 13 个目标回复。只根据当前消息中标记的 TARGET_RESPONSE、完整可见测试历史和上述契约判定，不臆造缺失正文。若当前消息 type=TOOL_RETRY，表示上一轮工具调用未提交成功；你必须针对同一个 response_id 纠正 previous_tool_error 并重新调用工具，不得推进到下一轮。
                每轮必须恰好调用一次 raidtest-acceptance-report。参数必须包含原样 case_id、target_workflow_id、response_id，turn_id 必须严格等于当前消息 checkpoint_id；checks 至少给出 instruction_following、continuity、factuality、non_repetition 四项 pass/fail，每项都必须给出具体中文 detail 和直接来自当前回复或可见历史的简短 evidence。
                若当前是 BOOTSTRAP，action=continue，并在 next_message 原样给出固定路线第1轮话术。尚未到最后一轮时，无论 checks 是否出现 fail 都必须 action=continue，在 checks 和 summary 中如实保留失败，并用 next_message 原样给出固定路线下一轮话术，以完成长期流程覆盖。第13轮结束时，若本轮所有 checks 均合格则 action=pass，否则 action=fail；两者的 next_message 都为空。
                next_message 必须严格采用固定路线对应话术；路线标为“按意图自然表达”的轮次才允许自然改写，但不得加入预期答案、判分规则、测试标签或新事实。summary 简洁说明依据。
                每次回答的第一步必须实际调用工具；只有收到工具返回的 accepted=true 后才能输出“已提交本轮验收。”。仅在正文声称已提交不算完成，禁止跳过工具调用或先输出正文，不得在正文重复工具参数。
            - role: user
              template: "{payload}"
        - id: judge-model
          type: chat_model
          inputs: {messages: {from: judge-messages}}
          outputs: {text: answer}
          model: eino-adventure-castle-mystery-test.model
          max_tokens: 2048
          temperature: 0
      edges:
        - {from: start, to: prepare-judge}
        - {from: prepare-judge, to: judge-model}
        - {from: judge-model, to: end}
      branches: []
      outputs:
        - {node: judge-model, field: answer, name: assistant, mime_type: text/plain, primary: true}
    conversation: {starts: peer}
    limits: {max_output_bytes: 4194304}
