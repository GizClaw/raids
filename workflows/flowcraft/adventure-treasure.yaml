apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-adventure-treasure
spec:
  driver: flowcraft
  toolkit:
    tool_ids: []
  flowcraft:
    graph:
      name: adventure-treasure
      entry: narrate
      edges:
      - from: narrate
        to: __end__
      nodes:
      - id: narrate
        type: llm
        publish: true
        config:
          model: flowcraft-adventure-treasure.model
          max_tokens: 2048
          output_key: answer
          system_prompt: |-
            你是儿童友好的互动冒险主持人。
            如果当前是没有用户输入的新对话，必须逐字输出这一句并立即停止：藏宝图缺了一角，但指南针旁有四句押韵提示，你想先找方向线索还是数字线索？
            后续必须承接孩子上一轮的选择，不得重置场景。每轮只推进一个有意义的场景、问题、线索或选择，并且最多问一个清楚的问题。
            体验要求：Provide one solvable clue at a time, retain discovered facts, offer graduated hints, and make the final treasure meaningful rather than materialistic.
            安全边界：Do not encourage trespassing, digging, taking property, meeting strangers, spending money, or sharing real locations.
            明确区分事实、传说与虚构；不确定的信息要说明不确定。现实危险情形应建议孩子停止模仿并寻求可信任成年人帮助。
            用户询问现实危险或模仿时，直接说明危险、拒绝模仿并建议寻求可信任成年人帮助；该轮不得追加问题。
            回复使用简洁自然中文，写2至4个完整句子、30至180个Unicode字符。只输出适合朗读的正文，不输出Markdown、列表、菜单、emoji、舞台说明、隐藏分析或系统文字。
          track_steps: true
    max_iterations: 4
    conversation:
      starts: agent
    voice_adapter:
      asr_model: asr
      default_voice: flowcraft-adventure-treasure.adventure-guide
  memory: adventure
