": ["它和力有关", "它是一种物品", "它藏在圆珠笔里"]}, {"zh": "闪电", "en": "lightning", "aliases": ["雷电"], "profile": "雷雨云里积累的大量电荷突然放电时发出的强烈亮光。", "hints": ["它和光有关", "它是一种自然现象", "它常在暴风雨时出现"]}, {"zh": "声音", "en": "sound", "aliases": [], "profile": "由物体振动产生，靠空气等物质传播，能被耳朵听到。", "hints": ["它是一种现象", "它用眼睛看不到", "它和耳朵有关"]}, {"zh": "镜子", "en": "mirror", "aliases": ["平面镜"], "profile": "表面光滑、能清楚地反射光线、照出人影的物体。", "hints": ["它和光有关", "它是一种物品", "它在洗脸台上很常见"]}, {"zh": "肥皂泡", "en": "soap bubble", "aliases": ["泡泡"], "profile": "由一层薄薄的肥皂水膜包住空气形成，表面会映出彩色的光。", "hints": ["它和光有关", "它非常轻", "它在洗手时常出现"]}, {"zh": "跷跷板", "en": "seesaw", "aliases": ["翘翘板"], "profile": "一种杠杆，中间有支点，两边的人轮流一上一下。", "hints": ["它和力有关", "它是一种物品", "它在游乐场很常见"]}]}, {"title_zh": "好奇学徒", "title_en": "Curious Apprentice", "step": 7, "offset": 0, "items": [{"zh": "浮力", "en": "buoyancy", "aliases": [], "profile": "液体或气体对浸在里面的物体向上托的力，船能浮在水面上就靠它。", "hints": ["它用眼睛看不到", "它的方向总是朝上", "它和游泳圈有关"]}, {"zh": "杠杆", "en": "lever", "aliases": [], "profile": "能绕着一个固定点转动的硬棒，用它可以省力或者省距离。", "hints": ["它和力有关", "它是一种简单机械", "它藏在剪刀里"]}, {"zh": "滑轮", "en": "pulley", "aliases": ["定滑轮", "动滑轮"], "profile": "绕着轴转动、边缘有槽的轮子，升旗时旗杆顶上就装着一个。", "hints": ["它和力有关", "它是一种工具", "它常装在旗杆顶上"]}, {"zh": "惯性", "en": "inertia", "aliases": [], "profile": "物体保持原来运动状态的性质，公交车突然刹车时人会向前倾。", "hints": ["它和运动有关", "它不是一种力", "它和急刹车有关"]}, {"zh": "反射", "en": "reflection", "aliases": ["光的反射"], "profile": "光碰到物体表面后返回原来那一侧的现象，我们能照镜子就是因为它。", "hints": ["它和光有关", "它是一种现象", "它和照镜子有关"]}, {"zh": "折射", "en": "refraction", "aliases": ["光的折射"], "profile": "光从一种物质斜着进入另一种物质时方向发生偏折，插在水里的筷子看起来像折断了。", "hints": ["它和光有关", "它是一种现象", "它和水中的筷子有关"]}, {"zh": "蒸发", "en": "evaporation", "aliases": [], "profile": "液体在任何温度下都会从表面慢慢变成气体的现象，湿衣服晾干就是它。", "hints": ["它和热有关", "它是一个过程", "它让湿衣服变干"]}, {"zh": "凝固", "en": "freezing", "aliases": ["结冰"], "profile": "物质从液体变成固体的过程，水在0摄氏度时会结成冰。", "hints": ["它和热有关", "它是一个过程", "它让蜡烛油变硬"]}, {"zh": "熔化", "en": "melting", "aliases": ["融化"], "profile": "物质从固体变成液体的过程，冰块在温暖的地方会慢慢变成水。", "hints": ["它和热有关", "它是一个过程", "它让巧克力变软"]}, {"zh": "导体", "en": "conductor", "aliases": [], "profile": "容易让电流通过的物体，比如铜、铁等金属。", "hints": ["它和电有关", "它是一类材料", "它常常是一种金属"]}, {"zh": "绝缘体", "en": "insulator", "aliases": [], "profile": "不容易让电流通过的物体，比如塑料、橡胶和干木头。", "hints": ["它和电有关", "它是一类材料", "它常包在电线外面"]}, {"zh": "电路", "en": "circuit", "aliases": [], "profile": "由电源、导线、开关和用电器连接起来、让电流流通的路径。", "hints": ["它能看见一部分", "它和开关有关", "它要连成一整圈"]}, {"zh": "音调", "en": "pitch", "aliases": [], "profile": "声音的高低，由发声物体振动的快慢决定，振动越快声音越高。", "hints": ["它是一个物理量", "它能用耳朵听出来", "它有高有低"]}, {"zh": "凸透镜", "en": "convex lens", "aliases": [], "profile": "中间厚、边缘薄的透镜，能把光线会聚起来，放大镜就是一种。", "hints": ["它和光有关", "它是一种物品", "它的中间比边上厚"]}, {"zh": "液化", "en": "condensation", "aliases": [], "profile": "气体变成液体的过程，冬天窗玻璃上的小水珠就是水蒸气这样变来的。", "hints": ["它和热有关", "它是一个过程", "它让窗上出现水珠"]}, {"zh": "升华", "en": "sublimation", "aliases": [], "profile": "固体不经过液体直接变成气体的过程，衣柜里的樟脑丸会越来越小。", "hints": ["它和热有关", "它是一个过程", "它让樟脑丸变小"]}]}, {"title_zh": "实验小能手", "title_en": "Lab Whiz", "step": 7, "offset": 0, "items": [{"zh": "压强", "en": "pressure", "aliases": [], "profile": "物体单位面积上受到的压力，刀刃磨得越薄，压强越大，越好切东西。", "hints": ["它和力有关", "它是一个物理量", "它让磨薄的刀更好切"]}, {"zh": "大气压", "en": "atmospheric pressure", "aliases": ["大气压强", "气压"], "profile": "包围地球的空气对物体产生的压强，用吸管喝饮料就靠它。", "hints": ["它和力有关", "它用眼睛看不到", "它帮你用吸管喝饮料"]}, {"zh": "密度", "en": "density", "aliases": [], "profile": "物体质量和体积的比值，同样大小的铁块比木块重，是因为铁的这个值大。", "hints": ["它是物质的一种性质", "它需要测量再算出来", "它和铁块木块谁重有关"]}, {"zh": "速度", "en": "speed", "aliases": ["速率"], "profile": "表示物体运动快慢的量，等于路程除以时间。", "hints": ["它是一个物理量", "它和运动有关", "它和跑步比赛有关"]}, {"zh": "能量", "en": "energy", "aliases": [], "profile": "物体做功的本领，有光能、热能、电能等多种形式，可以互相转化。", "hints": ["它用眼睛看不到", "它有很多种形式", "它可以靠吃饭补充"]}, {"zh": "动能", "en": "kinetic energy", "aliases": [], "profile": "物体因为运动而具有的能量，速度越快、质量越大，它就越大。", "hints": ["它和力有关", "它是一个物理量", "它让飞来的足球撞倒东西"]}, {"zh": "势能", "en": "potential energy", "aliases": ["重力势能", "弹性势能"], "profile": "物体因为被举高或者被拉伸压缩而储存的能量。", "hints": ["它和力有关", "它用眼睛看不到", "它藏在拉开的弓里"]}, {"zh": "热传导", "en": "heat conduction", "aliases": [], "profile": "热从物体温度高的部分传到温度低的部分，用勺子搅热汤时勺柄会变热。", "hints": ["它和温度有关", "它是一个过程", "它让汤里的勺柄变烫"]}, {"zh": "对流", "en": "convection", "aliases": ["热对流"], "profile": "液体或气体流动时把热量带到别处，烧开水时水会上下翻滚。", "hints": ["它和热有关", "它在固体里不会发生", "它让烧开的水上下翻滚"]}, {"zh": "热辐射", "en": "thermal radiation", "aliases": [], "profile": "热不需要任何东西传递，直接以电磁波的形式发出，晒太阳会觉得暖和。", "hints": ["它和光有关", "它是一个过程", "它让晒太阳时很暖和"]}, {"zh": "光年", "en": "light year", "aliases": [], "profile": "光在一年里走过的距离，是天文学里的长度单位，大约是九万四千六百亿公里。", "hints": ["它和宇宙有关", "它是一个单位", "它能说明星星有多远"]}, {"zh": "光速", "en": "speed of light", "aliases": [], "profile": "光在真空中传播的速度，大约每秒三十万公里，是宇宙中最快的速度。", "hints": ["它是一个物理量", "它用眼睛看不到", "它比声音快得多"]}, {"zh": "音色", "en": "timbre", "aliases": ["音品"], "profile": "声音的特色，闭着眼也能分辨出是钢琴还是笛子在响，靠的就是它。", "hints": ["它是一种现象", "它能用耳朵听出来", "它让你在电话里认出妈妈"]}, {"zh": "响度", "en": "loudness", "aliases": ["音量"], "profile": "声音的强弱，由发声物体振动的幅度决定，振幅越大声音越响。", "hints": ["它和耳朵有关", "它离得越远越轻", "它和大喊小声有关"]}, {"zh": "电磁铁", "en": "electromagnet", "aliases": [], "profile": "通电时有磁性、断电后磁性消失的装置，由线圈缠绕铁芯制成。", "hints": ["它是一种装置", "它身上缠着线圈", "它能用开关控制"]}, {"zh": "单摆", "en": "pendulum", "aliases": ["钟摆"], "profile": "用细线挂着小重物来回摆动的装置，线长一样时每摆一次的时间几乎相同。", "hints": ["它和力有关", "它是一种装置", "它很像荡秋千"]}]}, {"title_zh": "力学侦探", "title_en": "Mechanics Detective", "step": 7, "offset": 0, "items": [{"zh": "牛顿第一定律", "en": "Newton's first law", "aliases": ["惯性定律"], "profile": "一切物体在没有受到外力时，总保持静止或匀速直线运动的状态。", "hints": ["它和力有关", "它是科学家总结的", "它和急刹车时前倾有关"]}, {"zh": "万有引力", "en": "universal gravitation", "aliases": ["万有引力定律"], "profile": "任何两个有质量的物体之间都存在的互相吸引的力，由牛顿总结成定律。", "hints": ["它和宇宙相关", "它用眼睛看不到", "它让月亮绕着地球转"]}, {"zh": "质量", "en": "mass", "aliases": [], "profile": "物体所含物质的多少，单位是千克，不会因为位置改变而改变。", "hints": ["它用眼睛看不到", "它到月球上也不变", "它要用秤来称"]}, {"zh": "加速度", "en": "acceleration", "aliases": [], "profile": "表示速度变化快慢的物理量，汽车起步越来越快时就有它。", "hints": ["它和运动有关", "它是一个物理量", "它在汽车起步时能感到"]}, {"zh": "功率", "en": "power", "aliases": [], "profile": "表示做功快慢的物理量，单位是瓦特。", "hints": ["它是一个物理量", "它和电有关", "它常标在电器上"]}, {"zh": "机械效率", "en": "mechanical efficiency", "aliases": [], "profile": "有用功占总功的比例，任何机械的这个值都小于百分之百。", "hints": ["它和力有关", "它是一个物理量", "它常用百分数表示"]}, {"zh": "比热容", "en": "specific heat capacity", "aliases": ["比热"], "profile": "单位质量的物质温度升高1摄氏度吸收的热量，水的这个值比较大，所以海边昼夜温差小。", "hints": ["它是一个物理量", "它和温度有关", "它让海边昼夜温差小"]}, {"zh": "沸点", "en": "boiling point", "aliases": [], "profile": "液体沸腾时的温度，在一个标准大气压下水的是100摄氏度。", "hints": ["它是一个物理量", "它和热有关", "它和烧开水有关"]}, {"zh": "熔点", "en": "melting point", "aliases": [], "profile": "晶体开始熔化时的温度，冰的是0摄氏度。", "hints": ["它和热有关", "它是一个物理量", "它和冰块化成水有关"]}, {"zh": "电压", "en": "voltage", "aliases": [], "profile": "推动电荷定向移动形成电流的“推动力”，单位是伏特，一节干电池是1.5伏。", "hints": ["它是一个物理量", "它用眼睛看不到", "它常被比作推动力"]}, {"zh": "电阻", "en": "resistance", "aliases": [], "profile": "导体对电流的阻碍作用，单位是欧姆。", "hints": ["它是一个物理量", "它在又细又长的线里更大", "它和调光台灯有关"]}, {"zh": "欧姆定律", "en": "Ohm's law", "aliases": [], "profile": "导体中的电流跟两端的电压成正比，跟电阻成反比。", "hints": ["它和电有关", "它是德国科学家发现的", "它和小灯泡亮度有关"]}, {"zh": "串联", "en": "series circuit", "aliases": ["串联电路"], "profile": "把用电器一个接一个首尾相连，电流只有一条路径。", "hints": ["它和电有关", "它是一种连接方式", "它和节日小彩灯有关"]}, {"zh": "并联", "en": "parallel circuit", "aliases": ["并联电路"], "profile": "把用电器并排连接在两点之间，电流有多条路径，家里的电灯就是这样连接的。", "hints": ["它和电有关", "它是一种连接方式", "它常用在家里的电灯上"]}, {"zh": "短路", "en": "short circuit", "aliases": [], "profile": "电流不经过用电器直接从电源正极流回负极，会产生危险的大电流。", "hints": ["它是一种现象", "它和电有关", "它可能冒出火花"]}]}, {"title_zh": "光电探索者", "title_en": "Light and Current Explorer", "step": 7, "offset": 0, "items": [{"zh": "电磁感应", "en": "electromagnetic induction", "aliases": [], "profile": "闭合电路的一部分导体在磁场里切割磁感线时会产生电流，由法拉第发现。", "hints": ["它是一种现象", "它用眼睛看不到", "它是英国科学家发现的"]}, {"zh": "发电机", "en": "generator", "aliases": [], "profile": "利用电磁感应把机械能转化为电能的机器。", "hints": ["它是一种装置", "它和磁有关", "它有的靠烧柴油工作"]}, {"zh": "电动机", "en": "electric motor", "aliases": ["马达"], "profile": "利用通电线圈在磁场里受力转动，把电能转化为机械能的机器。", "hints": ["它是一种装置", "它会转起来", "它藏在风扇里"]}, {"zh": "交流电", "en": "alternating current", "aliases": ["交变电流"], "profile": "大小和方向随时间周期性变化的电流，家庭电路里用的就是这种。", "hints": ["它是一种现象", "它用眼睛看不到", "它藏在家里的插座里"]}, {"zh": "直流电", "en": "direct current", "aliases": [], "profile": "方向不随时间改变的电流，电池提供的就是这种。", "hints": ["它是一种现象", "它用眼睛看不到", "它在手机里用得到"]}, {"zh": "磁场", "en": "magnetic field", "aliases": [], "profile": "磁体周围存在的一种看不见的特殊物质，能对放进去的磁体产生力的作用。", "hints": ["它是一种现象", "它用眼睛看不到", "它让指南针指向南北"]}, {"zh": "色散", "en": "dispersion of light", "aliases": ["光的色散"], "profile": "白光通过三棱镜后被分解成红橙黄绿蓝靛紫七种色光的现象，牛顿研究过它。", "hints": ["它和光有关", "它是一种现象", "它和雨后彩虹有关"]}, {"zh": "三棱镜", "en": "prism", "aliases": ["棱镜"], "profile": "横截面是三角形的透明玻璃体，能把白光分解成彩色的光带。", "hints": ["它和光有关", "它是透明的", "它在科学课实验里用到"]}, {"zh": "红外线", "en": "infrared", "aliases": ["红外光"], "profile": "人眼看不见、位于红光外侧的光，电视遥控器和测温枪都用到它。", "hints": ["它和光有关", "它用眼睛看不到", "它和电视遥控器有关"]}, {"zh": "紫外线", "en": "ultraviolet", "aliases": ["紫外光"], "profile": "人眼看不见、位于紫光外侧的光，能杀菌，照多了会晒伤皮肤。", "hints": ["它和光有关", "它用眼睛看不到", "它会把人晒黑"]}, {"zh": "超声波", "en": "ultrasound", "aliases": [], "profile": "频率高于两万赫兹、人耳听不到的声音，蝙蝠靠它辨别方向，医院的B超也用它。", "hints": ["它是一种现象", "它在医院里用得到", "它和蝙蝠有关"]}, {"zh": "次声波", "en": "infrasound", "aliases": [], "profile": "频率低于20赫兹、人耳听不到的声音，大象可以用它远距离交流。", "hints": ["它是一种现象", "它在地震时会产生", "它和大象有关"]}, {"zh": "共振", "en": "resonance", "aliases": ["共鸣"], "profile": "外界振动的频率和物体自身振动的频率相同时，物体振动会变得特别强烈。", "hints": ["它是一种现象", "它可能弄坏桥梁", "它和荡秋千有关"]}, {"zh": "真空", "en": "vacuum", "aliases": [], "profile": "几乎没有任何物质的空间，声音不能在里面传播，光却可以。", "hints": ["它是一种现象", "它里面声音传不出", "它和食品包装有关"]}, {"zh": "光纤", "en": "optical fiber", "aliases": ["光导纤维"], "profile": "利用光在细玻璃丝里不断全反射来传递信息，网络信号靠它传得又快又远。", "hints": ["它是一种物品", "它非常细", "它和家里上网有关"]}]}, {"title_zh": "能量工程师", "title_en": "Energy Engineer", "step": 5, "offset": 0, "items": [{"zh": "能量守恒定律", "en": "conservation of energy", "aliases": ["能量守恒"], "profile": "能量既不会凭空产生，也不会凭空消失，只能从一种形式转化为另一种形式。", "hints": ["它和力热光电都有关", "它是一条科学原理", "它说明永动机造不出来"]}, {"zh": "永动机", "en": "perpetual motion machine", "aliases": [], "profile": "一种设想中不消耗能量就能永远工作的机器，违反能量守恒定律，造不出来。", "hints": ["它和力与热有关", "它是一种想象中的装置", "它让许多尝试者都失败了"]}, {"zh": "静电", "en": "static electricity", "aliases": ["摩擦起电"], "profile": "物体上积累的不流动的电荷，冬天脱毛衣时会听到噼啪声。", "hints": ["它是一种现象", "它在冬天很常见", "它能让梳子吸起碎纸屑"]}, {"zh": "避雷针", "en": "lightning rod", "aliases": [], "profile": "装在高大建筑顶上的金属尖杆，把雷电引入大地来保护建筑，由富兰克林发明。", "hints": ["它和电有关", "它是用金属做的", "它常装在高楼的顶上"]}, {"zh": "半导体", "en": "semiconductor", "aliases": [], "profile": "导电能力介于导体和绝缘体之间的材料，比如硅，是电脑芯片的基础。", "hints": ["它和电有关", "它是一类材料", "它藏在手机和电脑的芯片里"]}, {"zh": "二极管", "en": "diode", "aliases": ["发光二极管"], "profile": "只允许电流从一个方向通过的电子元件，能发光的一种叫LED。", "hints": ["它和电有关", "它是一种小小的电子元件", "它常用在电器的指示灯里"]}, {"zh": "激光", "en": "laser", "aliases": ["镭射"], "profile": "颜色非常纯、方向非常集中的一种光，可以用来测距、切割和做手术。", "hints": ["它是一种现象", "它是人造出来的", "它能用来做手术"]}, {"zh": "全反射", "en": "total internal reflection", "aliases": [], "profile": "光从水或玻璃射向空气、角度足够斜时，全部被反射回去的现象。", "hints": ["它和光有关", "它是一种现象", "它帮助光纤传递网络信号"]}, {"zh": "衍射", "en": "diffraction", "aliases": [], "profile": "波遇到障碍物或小孔时绕到后面继续传播的现象，隔着墙也能听到声音就和它有关。", "hints": ["它和光与声都有关", "它是一种现象", "它让你在墙角另一边听到说话声"]}, {"zh": "干涉", "en": "interference", "aliases": [], "profile": "两列频率相同的波相遇时，有的地方互相加强、有的地方互相减弱，肥皂泡上的彩色条纹就是它。", "hints": ["它和光与声都有关", "它是波才有的现象", "它让肥皂泡出现彩色条纹"]}, {"zh": "多普勒效应", "en": "Doppler effect", "aliases": [], "profile": "声源靠近时听到的声音变高、远离时变低的现象，救护车开过时声音会变。", "hints": ["它和声音有关", "它是一种现象", "它让救护车开过时笛声变调"]}, {"zh": "声呐", "en": "sonar", "aliases": ["声纳"], "profile": "利用声波在水中传播和反射来探测水下物体的设备。", "hints": ["它是一种设备", "它常在水里工作", "它能帮渔船找到鱼群"]}, {"zh": "动量", "en": "momentum", "aliases": [], "profile": "物体质量和速度的乘积，可以理解为运动物体的“冲劲”。", "hints": ["它属于力学知识", "它要计算才能知道", "它让满载大卡车很难马上停住"]}, {"zh": "热机", "en": "heat engine", "aliases": [], "profile": "把燃料燃烧放出的热转化为机械能的机器，比如汽车的发动机。", "hints": ["它是一种装置", "它要烧燃料才能工作", "它能让老式蒸汽火车跑起来"]}]}, {"title_zh": "物理研究员", "title_en": "Physics Researcher", "step": 5, "offset": 0, "items": [{"zh": "原子", "en": "atom", "aliases": [], "profile": "组成物质的一种基本微粒，由原子核和绕着它运动的电子组成。", "hints": ["它属于微观世界", "它小到普通显微镜也看不到", "它组成了身边所有的东西"]}, {"zh": "原子核", "en": "atomic nucleus", "aliases": [], "profile": "位于原子中心、由质子和中子组成的极小核心，几乎集中了原子全部的质量。", "hints": ["它属于微观世界", "它带正电", "它位于一个微小结构的中心"]}, {"zh": "电子", "en": "electron", "aliases": [], "profile": "带负电、绕着原子核运动的微小粒子，由汤姆孙发现。", "hints": ["它属于微观世界", "它被认为不能再分了", "它在金属导线里跑来跑去"]}, {"zh": "质子", "en": "proton", "aliases": [], "profile": "原子核里带正电的粒子，它的数目决定了是哪一种元素。", "hints": ["它属于微观世界", "它带正电", "它藏在一个极小的核心里"]}, {"zh": "中子", "en": "neutron", "aliases": [], "profile": "原子核里不带电的粒子，由查德威克发现。", "hints": ["它属于微观世界", "它不带电", "它能在核电站里引发反应"]}, {"zh": "放射性", "en": "radioactivity", "aliases": ["放射现象"], "profile": "某些原子核自发放出射线的性质，居里夫人为研究它作出了巨大贡献。", "hints": ["它和原子核有关", "它是一种现象", "它能帮医院治疗癌症"]}, {"zh": "半衰期", "en": "half life", "aliases": [], "profile": "放射性物质里有一半原子核发生衰变所需要的时间。", "hints": ["它和原子核有关", "它是一段时间长度", "它能帮考古学家推算文物年代"]}, {"zh": "核聚变", "en": "nuclear fusion", "aliases": ["聚变"], "profile": "轻的原子核结合成较重的原子核并放出巨大能量的过程，太阳就靠它发光发热。", "hints": ["它是一个过程", "它会放出巨大的能量", "它让太阳发光发热"]}, {"zh": "核裂变", "en": "nuclear fission", "aliases": ["裂变"], "profile": "重的原子核分裂成较轻的原子核并放出巨大能量的过程，核电站利用它发电。", "hints": ["它发生在微观世界里", "它会放出巨大的能量", "它被人们用来发电"]}, {"zh": "同位素", "en": "isotope", "aliases": [], "profile": "质子数相同、中子数不同的同一种元素的原子。", "hints": ["它和原子核有关", "它不一定有放射性", "它的一个例子是碳十四"]}, {"zh": "光电效应", "en": "photoelectric effect", "aliases": [], "profile": "光照到金属表面时打出电子的现象，爱因斯坦因为解释它获得了诺贝尔奖。", "hints": ["它和量子世界有关", "它是一种现象", "它和太阳能板的原理相近"]}, {"zh": "光子", "en": "photon", "aliases": [], "profile": "光的最小能量单位，可以看作一份一份的“光粒子”。", "hints": ["它属于微观世界", "它不带电", "它从太阳和灯里大量飞出来"]}, {"zh": "电磁波", "en": "electromagnetic wave", "aliases": [], "profile": "电场和磁场交替变化向外传播形成的波，手机信号和光都是它。", "hints": ["它能在真空里传播", "它有的能看见有的看不见", "它能传递手机信号"]}, {"zh": "波长", "en": "wavelength", "aliases": [], "profile": "相邻两个波峰之间的距离，不同颜色的光这个值不一样。", "hints": ["它和光与声都有关", "它是一段距离", "它在红光和紫光里不一样"]}]}, {"title_zh": "理论物理学家", "title_en": "Theoretical Physicist", "step": 7, "offset": 0, "items": [{"zh": "相对论", "en": "theory of relativity", "aliases": ["狭义相对论", "广义相对论"], "profile": "爱因斯坦提出的关于时间、空间和引力的理论。", "hints": ["它是一套科学学说", "它和时间与空间有关", "它帮导航卫星校正时间"]}, {"zh": "质能方程", "en": "mass energy equation", "aliases": ["E=mc²"], "profile": "爱因斯坦提出的公式，说明质量和能量可以互相转换。", "hints": ["它和原子核有关", "它是一个公式", "它可以算出太阳放出多少光和热"]}, {"zh": "时间膨胀", "en": "time dilation", "aliases": ["钟慢效应"], "profile": "物体运动得越接近光速，它上面的时间就过得越慢的相对论效应。", "hints": ["它和宇宙天体有关", "它已被实验证实", "它要用精密的原子钟才测得出"]}, {"zh": "黑洞", "en": "black hole", "aliases": [], "profile": "引力强到连光都逃不出去的天体，可以由大质量恒星走到生命尽头后坍缩形成。", "hints": ["它和宇宙有关", "它是一种天体", "它的引力非常非常强"]}, {"zh": "引力波", "en": "gravitational wave", "aliases": [], "profile": "时空弯曲产生的涟漪，由爱因斯坦预言，2015年首次被直接探测到。", "hints": ["它和宇宙有关", "它要用巨型仪器才能探测", "它曾在两个黑洞合并时被测到"]}, {"zh": "宇宙大爆炸", "en": "Big Bang", "aliases": ["大爆炸", "大爆炸理论"], "profile": "认为宇宙大约在138亿年前从一个极热极密的状态膨胀而来的理论。", "hints": ["它和天文学有关", "它是一种理论", "它发生在一百多亿年前"]}, {"zh": "红移", "en": "redshift", "aliases": [], "profile": "天体远离我们时发出的光波长变长、颜色偏向红色的现象，说明宇宙在膨胀。", "hints": ["它和光有关", "它是一种现象", "它说明天体正在远离我们"]}, {"zh": "暗物质", "en": "dark matter", "aliases": [], "profile": "不发光、看不见，但通过引力影响星系运动而被推断存在的物质。", "hints": ["它和宇宙有关", "它到底是什么还没人知道", "它靠引力影响星系运动"]}, {"zh": "暗能量", "en": "dark energy", "aliases": [], "profile": "被认为推动宇宙加速膨胀的一种神秘能量。", "hints": ["它和天文学有关", "它的本质至今还是个谜", "它和宇宙加速膨胀有关"]}, {"zh": "中子星", "en": "neutron star", "aliases": [], "profile": "大质量恒星爆炸后留下的极其致密的天体，一小勺它的物质就有上亿吨重。", "hints": ["它和天文学有关", "它是一种天体", "它一小勺就有上亿吨重"]}, {"zh": "超新星", "en": "supernova", "aliases": [], "profile": "某些恒星在生命末期发生的剧烈爆炸，亮度可以一时超过整个星系。", "hints": ["它和天文学有关", "它是一种现象", "它会一下子变得极其明亮"]}, {"zh": "事件视界", "en": "event horizon", "aliases": [], "profile": "黑洞周围的一道边界，任何东西一旦越过就再也出不来。", "hints": ["它和宇宙有关", "它不是实实在在的墙", "它是黑洞的一部分"]}, {"zh": "光谱", "en": "spectrum", "aliases": [], "profile": "光按波长排列形成的彩色图案，天文学家用它分析星星由什么组成。", "hints": ["它和天文学有关", "它是彩色的", "它能告诉我们星星由什么组成"]}]}, {"title_zh": "物理大师", "title_en": "Physics Master", "step": 7, "offset": 0, "items": [{"zh": "量子力学", "en": "quantum mechanics", "aliases": ["量子论"], "profile": "研究原子、电子等微观粒子运动规律的物理学理论。", "hints": ["它是一种理论", "它研究微观世界", "它帮人们造出了手机芯片"]}, {"zh": "薛定谔的猫", "en": "Schrödinger's cat", "aliases": [], "profile": "薛定谔提出的思想实验，用盒子里一只说不清状态的猫来比喻量子叠加。", "hints": ["它和量子世界有关", "它是一个思想实验", "它和盒子里一只动物有关"]}, {"zh": "不确定性原理", "en": "uncertainty principle", "aliases": ["测不准原理"], "profile": "海森堡提出，微观粒子的位置和速度不能同时被精确测定。", "hints": ["它和量子世界有关", "它是一条规律", "它和测量微观粒子有关"]}, {"zh": "量子纠缠", "en": "quantum entanglement", "aliases": [], "profile": "两个粒子之间存在的神奇关联，测量其中一个会立刻关联到另一个的状态。", "hints": ["它发生在微观世界", "它已被实验证实", "它让两个微粒像被绑在一起"]}, {"zh": "超导", "en": "superconductivity", "aliases": ["超导体", "超导现象"], "profile": "某些材料在极低温度下电阻突然变为零的现象。", "hints": ["它和电有关", "它要在极低温度下才出现", "它能让磁铁悬浮起来"]}, {"zh": "绝对零度", "en": "absolute zero", "aliases": [], "profile": "理论上的最低温度，大约是零下273.15摄氏度。", "hints": ["它和热有关", "它非常非常冷", "它永远无法真正达到"]}, {"zh": "熵", "en": "entropy", "aliases": [], "profile": "描述一个系统混乱程度的物理量，孤立系统里它总是倾向于增加。", "hints": ["它和热有关", "它是一个物理量", "它能解释房间为什么越来越乱"]}, {"zh": "热力学第二定律", "en": "second law of thermodynamics", "aliases": [], "profile": "热量不能自发地从低温物体传到高温物体。", "hints": ["它是一条自然法则", "它和温度有关", "它解释了冰箱为什么要耗电"]}, {"zh": "布朗运动", "en": "Brownian motion", "aliases": [], "profile": "悬浮在液体或气体里的微小颗粒不停地做无规则运动，由布朗在显微镜下发现。", "hints": ["它是一种现象", "它要用显微镜才能看到", "它和分子不停碰撞有关"]}, {"zh": "等离子体", "en": "plasma", "aliases": ["电浆"], "profile": "由带电粒子组成的物质状态，被称为物质的第四态，闪电和太阳里都有。", "hints": ["它可以用眼睛看到", "它是一种物质状态", "它藏在闪电和霓虹灯里"]}, {"zh": "超流", "en": "superfluidity", "aliases": ["超流体"], "profile": "某些液体在极低温度下完全没有黏性，甚至能沿着容器壁往上爬的现象。", "hints": ["它和量子世界有关", "它要在极低温度下才出现", "它能让液体自己沿杯壁往上爬"]}, {"zh": "量子隧穿", "en": "quantum tunneling", "aliases": ["隧道效应"], "profile": "微观粒子能够穿过按经典物理本来越不过去的能量壁垒的现象。", "hints": ["它发生在微观世界", "它已被实验证实", "它让微粒好像能越墙而过"]}, {"zh": "麦克斯韦方程组", "en": "Maxwell's equations", "aliases": [], "profile": "麦克斯韦总结的描述电场和磁场规律的一组方程，预言了电磁波的存在。", "hints": ["它和电与磁有关", "它是一套公式", "它预言了电磁波的存在"]}]}, {"title_zh": "宇宙解谜者", "title_en": "Cosmic Puzzle Solver", "step": 7, "offset": 0, "items": [{"zh": "希格斯玻色子", "en": "Higgs boson", "aliases": ["希格斯粒子", "上帝粒子"], "profile": "让其他基本粒子获得质量的粒子，2012年在大型强子对撞机中被发现。", "hints": ["它属于微观世界", "它存在的时间极短", "它是在巨型对撞机里被发现的"]}, {"zh": "夸克", "en": "quark", "aliases": [], "profile": "组成质子和中子的更小的基本粒子，一共有六种。", "hints": ["它属于微观世界", "它总是成群结队出现", "它一共有六种"]}, {"zh": "反物质", "en": "antimatter", "aliases": [], "profile": "由反粒子组成的物质，和普通物质相遇会湮灭并放出巨大能量。", "hints": ["它和微观世界有关", "它是真实存在的", "它遇到普通东西会一起消失"]}, {"zh": "中微子", "en": "neutrino", "aliases": [], "profile": "质量极小、几乎不和其他物质发生作用的粒子，每秒都有大量它穿过我们的身体。", "hints": ["它不带电", "它要用地下的巨型探测器才能捉到", "它每秒都在大量穿过我们的身体"]}, {"zh": "弦理论", "en": "string theory", "aliases": ["超弦理论"], "profile": "认为基本粒子其实是极小的振动的“弦”的理论设想，还没有被实验证实。", "hints": ["它是一种设想", "它还没有被实验证实", "它说最小的东西都在振动"]}, {"zh": "标准模型", "en": "Standard Model", "aliases": [], "profile": "描述已知基本粒子和其中三种基本相互作用的物理理论。", "hints": ["它是一种理论", "它已被大量实验证实", "它和各种基本粒子有关"]}, {"zh": "霍金辐射", "en": "Hawking radiation", "aliases": [], "profile": "霍金预言黑洞会向外发出的微弱辐射，会让黑洞慢慢“蒸发”。", "hints": ["它和宇宙有关", "它还没有被观测到", "它会让黑洞慢慢变小"]}, {"zh": "虫洞", "en": "wormhole", "aliases": [], "profile": "理论上连接宇宙中两个遥远地方的时空隧道，至今还没有被发现。", "hints": ["它和宇宙有关", "它从来没有被发现过", "它常出现在科幻电影里"]}, {"zh": "宇宙微波背景辐射", "en": "cosmic microwave background", "aliases": ["微波背景辐射"], "profile": "宇宙大爆炸留下的“余温”，均匀地充满整个宇宙。", "hints": ["它和天文学有关", "它要用特殊望远镜才能探测到", "它是很久很久以前留下的余温"]}, {"zh": "卡西米尔效应", "en": "Casimir effect", "aliases": [], "profile": "真空中两块靠得很近的金属板会互相吸引的量子现象。", "hints": ["它和量子世界有关", "它发生在真空里", "它表现为极小的吸引力"]}, {"zh": "引力透镜", "en": "gravitational lensing", "aliases": ["引力透镜效应"], "profile": "大质量天体的引力让经过附近的光线弯曲，像透镜一样放大后方天体的现象。", "hints": ["它和天文学有关", "它是一种现象", "它能让远处星系的像变形"]}, {"zh": "光速不变原理", "en": "constancy of the speed of light", "aliases": [], "profile": "无论怎样运动的观察者，测得的真空中的光速都一样，是狭义相对论的基础。", "hints": ["它是一条规律", "它和相对论有关", "它和每秒约三十万公里有关"]}]}]}
