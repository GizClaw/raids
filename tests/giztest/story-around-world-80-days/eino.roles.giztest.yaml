    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
- id: aouda_chapter_setup_1
  client: aouda
  timeout: 2m
  peer_stream:
    mode: text
    input: 请从第一章开始《环游地球八十天》。
    idle_timeout: 90s
    require_text: true
