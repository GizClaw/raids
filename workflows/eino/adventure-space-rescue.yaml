apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-adventure-space-rescue
spec:
  driver: eino
  toolkit:
    tool_ids: []
  memory: adventure
  eino:
    graph:
      name: adventure-space-rescue-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 20
      state:
        fields:
        - name: memory-query
          type: string
          merge: replace
        - name: recalled
          type: string
          merge: replace
        - name: stage-route
          type: string
          merge: replace
        - name: phase-key
          type: string
          merge: replace
        - name: answer-messages
          type: messages
          merge: replace
        - name: scenario-policy
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
        - name: progress-fact
          type: string
          merge: replace
        - name: progress-lane
          type: string
          merge: replace
        - name: progress-kind
          type: string
          merge: replace
      nodes:
      - id: prepare-memory-query
        type: script
        inputs:
          text:
            from: input.text
        outputs:
          query: memory-query
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              text = input["text"]
              base = "宇宙救援当前阶段、系统状态、能源读数和安全窗口"
              return {"query": base + ("；当前请求：" + text if text else "")}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 65536
          max_output_bytes: 65536
      - id: recall-progress
        type: memory_recall
        query_from: memory-query
        output: recalled
        top_k: 12
      - id: route-stage
        type: script
        inputs:
          text:
            from: input.text
          history:
            from: input.messages
          memory:
            from: recalled
        outputs:
          phase: phase-key
          route: stage-route
          policy: scenario-policy
        language: starlark
        entrypoint: run
        source: |
          def contains_any(text, values):
              for value in values:
                  if value in text:
                      return True
              return False

          def run(input):
              current = input["text"].strip()
              combined = input["memory"] + "\n" + current
              for message in input["history"]:
                  if "content" in message:
                      combined += "\n" + message["content"]
              if not current or contains_any(current, ['开始太空', '开始救援', '空间站']):
                  phase = "opening"
              elif contains_any(current, ['更正', '只确认', '有效坐标', '正确坐标', '有效能量', '只说有效', '回忆', '重连', '隔了几轮', '只说']):
                  phase = "correction"
              elif contains_any(current, ['总结', '救援状态', '任务状态', '回顾', '用一句话说出']):
                  phase = "conclusion"
              elif contains_any(current, ['牺牲', '攻击', '直接炸', '危险', '拒绝', '窗口', '角色分工']):
                  phase = "challenge"
              else:
                  phase = "explore"
              execute = contains_any(current, ["现在执行会合", "开始执行会合", "开始对接", "完成救援"])
              if execute and "不要" not in current and "不提前" not in current:
                  route = "第四阶段‘执行与收束’"
              elif contains_any(combined, ["安全窗口", "备用电池", "导航员", "工程员", "生命保障", "会合"]):
                  route = "第三阶段‘准备安全会合’"
              elif contains_any(combined, ["能源", "能量", "百分之六十", "百分之四十五", "校准"]):
                  route = "第二阶段‘校准能源’"
              else:
                  route = "第一阶段‘恢复通信’"
              return {"phase": phase, "route": route, "policy": "你是儿童友好的非暴力宇宙救援任务主持人，跟踪通信、能源、时间、轨道和团队分工。\n首次回复无论由系统主动触发，还是用户要求“开始宇宙救援”，都必须严格只说：一艘科研飞船失去动力，氧气充足但轨道正在偏离，我们先修通信还是计算新轨道？输出问号后立即结束，不得添加船员人数、位置、风险解释、第二个问题或重复选项。\n救援分为恢复通信、校准能源、准备安全会合、执行与收束四阶段。Graph 路由是本轮权威；除非用户询问阶段，不要念出状态字段。\n每轮只给一个清楚的行动权衡，先说明上一选择对救援状态的直接影响，再让孩子决定下一步；不得重置任务。\n回复必须保留用户已经使用的任务实体名称，例如“科研飞船”，不得只改写成模糊的“飞船”或省略实体。\n已确认的能源数值、人员状态和修复结果必须连续；用户更正数值后，新值立即覆盖旧值。只有用户或明确仪表读数给出新数字时才能更新任何主能源、备用电池、消耗或余量数值，不得根据虚构行动自行计算、扣减、新增百分比或改写最新读数。用户本轮没有提供能源数值时，正文不得凭空出现百分号、百分比或能源数字；复述已有百分比时必须沿用“百分之四十五”这类中文口语形式，不得改写为阿拉伯数字或百分号。\n事实建立、纠正或纯回忆回合只直接回答用户要求，不推进任务、不添加后果、选择或追问；用户要求记住事实时明确回答已经记住；纠正回合必须只说新事实，并且不得以否定、引用、对比或解释方式再次输出旧值。\n用户选择等待安全窗口时，本轮最多推进到窗口到来和准备就绪；除非用户明确要求执行，不得自动完成稳定、对接、返航或宣布救援完成。\n用户已经指定用备用电池等待安全窗口时，后续关于选择、阶段或下一步的回答都必须同时保留“备用电池”和“安全窗口”，不得省略任一安全条件。只要当前用户消息出现“备用电池”或“安全窗口”，回复首句就必须逐字同时包含“备用电池”和“安全窗口”；不得用“系统功耗”、“电源”、“能源管理”等近义概括替代它们。\n让工程、导航、医疗和通信角色都有贡献，不把鲁莽牺牲描述为唯一英雄选择。\n所有技术细节保持虚构和概念化，不提供真实航天操作指令；危险非血腥，不收集个人信息。\n普通回复写2至4个完整中文句子、约70至200个Unicode字符；状态确认和回忆应简短。\n每轮最多问一个问题。只输出适合朗读的中文正文，不输出Markdown、列表、菜单、emoji、舞台说明、分析或系统文字。\n必须写完整句子，不得依赖程序截断，不得重复同义内容。"}
        limits:
          max_execution_steps: 20000
          timeout: 250ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      - id: prompt-opening
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: stage-route
          policy:
            from: scenario-policy
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {policy}
            Graph确定的本轮路径：{route}。不得被旧记忆降到更早阶段。
            本轮专用路径要求：本轮只建立空间站故障、救援目标和可选行动，不提前完成通信或修复。
            相关长期进度只用于核对，不得覆盖更新的对话：
            {memory}
        - placeholder: history
      - id: prompt-explore
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: stage-route
          policy:
            from: scenario-policy
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {policy}
            Graph确定的本轮路径：{route}。不得被旧记忆降到更早阶段。
            本轮专用路径要求：本轮只执行玩家当前选择的一项救援行动，保持能量、坐标、角色和等待窗口连续。
            相关长期进度只用于核对，不得覆盖更新的对话：
            {memory}
        - placeholder: history
      - id: prompt-correction
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: stage-route
          policy:
            from: scenario-policy
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {policy}
            Graph确定的本轮路径：{route}。不得被旧记忆降到更早阶段。
            本轮专用路径要求：本轮只确认最新有效能量或坐标；旧值立即失效且不得再次输出，也不得推进任务。
            相关长期进度只用于核对，不得覆盖更新的对话：
            {memory}
        - placeholder: history
      - id: prompt-challenge
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: stage-route
          policy:
            from: scenario-policy
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {policy}
            Graph确定的本轮路径：{route}。不得被旧记忆降到更早阶段。
            本轮专用路径要求：本轮拒绝牺牲队员、盲目攻击等不安全方案，给出可逆替代方案并保留团队选择。
            相关长期进度只用于核对，不得覆盖更新的对话：
            {memory}
        - placeholder: history
      - id: prompt-conclusion
        type: prompt
        inputs:
          history:
            from: input.messages
          memory:
            from: recalled
          route:
            from: stage-route
          policy:
            from: scenario-policy
        outputs:
          messages: answer-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {policy}
            Graph确定的本轮路径：{route}。不得被旧记忆降到更早阶段。
            本轮专用路径要求：本轮只总结已经确认的通信、能量、坐标、角色和窗口，不把计划写成已完成事实。
            相关长期进度只用于核对，不得覆盖更新的对话：
            {memory}
        - placeholder: history
      - id: narrator-model
        type: chat_model
        inputs:
          messages:
            from: answer-messages
        outputs:
          text: answer
        model: eino-adventure-space-rescue.model
        max_tokens: 2048
        temperature: 0.5
      - id: commit-progress
        type: script
        inputs:
          phase:
            from: phase-key
          route:
            from: stage-route
          text:
            from: input.text
        outputs:
          progress: progress-fact
          lane: progress-lane
          kind: progress-kind
        language: starlark
        entrypoint: run
        source: |
          def run(input):
              progress = "schema=raid_scenario_progress_v2; phase=" + input["phase"] + "; route=" + input["route"]
              if input["phase"] == "correction":
                  correction = "latest_valid_facts_preserved_from_history"
                  if "百分之四十五" in input["text"] or "45%" in input["text"]:
                      correction = "energy=百分之四十五"
                  elif "B-21" in input["text"]:
                      correction = "coordinate=B-21"
                  progress += "; correction_authority=latest_user_value; " + correction
              else:
                  progress += "; latest_input=" + input["text"]
              return {"progress": progress, "lane": "case_state", "kind": "state"}
        limits:
          max_execution_steps: 10000
          timeout: 250ms
          max_input_bytes: 131072
          max_output_bytes: 131072
      - id: observe-progress
        type: memory_observe
        facts:
        - text_from: progress-fact
          attributes:
            lane: progress-lane
            kind: progress-kind
        wait_for_completion: false
      edges:
      - from: start
        to: prepare-memory-query
      - from: prepare-memory-query
        to: recall-progress
      - from: recall-progress
        to: route-stage
      - from: prompt-opening
        to: narrator-model
      - from: prompt-explore
        to: narrator-model
      - from: prompt-correction
        to: narrator-model
      - from: prompt-challenge
        to: narrator-model
      - from: prompt-conclusion
        to: narrator-model
      - from: narrator-model
        to: commit-progress
      - from: commit-progress
        to: observe-progress
      - from: observe-progress
        to: end
      branches:
      - from: route-stage
        mode: first_match
        routes:
        - when:
            field: phase-key
            op: eq
            value: opening
          to: prompt-opening
        - when:
            field: phase-key
            op: eq
            value: correction
          to: prompt-correction
        - when:
            field: phase-key
            op: eq
            value: challenge
          to: prompt-challenge
        - when:
            field: phase-key
            op: eq
            value: conclusion
          to: prompt-conclusion
        default: prompt-explore
      outputs:
      - node: narrator-model
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
