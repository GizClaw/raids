# User Story:
# As a Raids catalog maintainer,
# I want to drive `ast-translate-zh-fr` through the scripted `default-translations` / `zh-to-fr` turns over push-to-talk input,
# So that the deterministic keyword, length, script, and latency gates run as one isolated declarative task.
version: gizclaw.test/v1alpha1
name: ast-translate.zh-fr.zh-to-fr
clients:
  peer:
    identity: ephemeral
    connection: webrtc
    access_point: ${endpoint}
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  workspace_name:
    direction: input
    type: string
    generate: token
  audio_1:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_2:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_3:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_4:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_5:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_6:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_7:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_8:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_9:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
  audio_10:
    direction: output
    type: audio
    max_bytes: 16777216
    media_type: audio/ogg
    codec: opus
repeat: 1
timeout: 23m
steps:
- id: register_peer
  client: peer
  rpc:
    method: server.register
    request:
      token: ${registration_token}
- id: create_workspace
  client: peer
  rpc:
    method: server.workspace.create
    request:
      name: ${workspace_name}
      collection: translates
      workflow_name: translate-zh-fr
      parameters:
        asttranslate_workspace_parameters:
          agent_type: ASTTRANSLATE_WORKSPACE_PARAMETERS_AGENT_TYPE_AST_TRANSLATE
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_workspace
  client: peer
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: ${workspace_name}
- id: synthesize_1_gratitude
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: flowcraft-chat-assistant.assistant
      text: 我真的非常感谢你的热心帮助。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_1
- id: turn_1_gratitude
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_1}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_any:
      - merci
      - remercie
      - reconnaissant
      pattern: '[A-Za-z]'
      max_length: 90
    /audio_bytes:
      minimum: 1
- id: synthesize_2_good-day
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: flowcraft-chat-assistant.assistant
      text: 祝你今天度过愉快美好的一天。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_2
- id: turn_2_good-day
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_2}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_any:
      - bonne journée
      - merveilleuse
      - excellente
      - agréable
      pattern: '[A-Za-z]'
      max_length: 90
    /audio_bytes:
      minimum: 1
- id: synthesize_3_farewell
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: flowcraft-chat-assistant.assistant
      text: 期待下次和你再次见面。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_3
- id: turn_3_farewell
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_3}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_any:
      - au revoir
      - à bientôt
      - à la prochaine
      - revoir
      - prochaine
      pattern: '[A-Za-z]'
      max_length: 90
    /audio_bytes:
      minimum: 1
- id: synthesize_4_apology
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: flowcraft-chat-assistant.assistant
      text: 给你带来不便我真的很抱歉。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_4
- id: turn_4_apology
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_4}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_any:
      - désolé
      - désolée
      - pardon
      - excuse
      pattern: '[A-Za-z]'
      max_length: 90
    /audio_bytes:
      minimum: 1
- id: synthesize_5_agreement
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: flowcraft-chat-assistant.assistant
      text: 我完全同意这个计划。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_5
- id: turn_5_agreement
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_5}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_any:
      - d'accord
      - accord
      - approuve
      pattern: '[A-Za-z]'
      max_length: 90
    /audio_bytes:
      minimum: 1
- id: synthesize_6_ready
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: flowcraft-chat-assistant.assistant
      text: 请告诉我你是否已经准备好出发。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_6
- id: turn_6_ready
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_6}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_any:
      - prêt
      - prête
      - préparé
      - préparée
      pattern: '[A-Za-z]'
      max_length: 90
    /audio_bytes:
      minimum: 1
- id: synthesize_7_help
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: flowcraft-chat-assistant.assistant
      text: 你可以帮我搬一下这个箱子吗。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_7
- id: turn_7_help
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_7}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_any:
      - aide
      - aider
      pattern: '[A-Za-z]'
      max_length: 90
    /audio_bytes:
      minimum: 1
- id: synthesize_8_welcome
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: flowcraft-chat-assistant.assistant
      text: 欢迎你来到我们的城市。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_8
- id: turn_8_welcome
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_8}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_any:
      - bienvenue
      pattern: '[A-Za-z]'
      max_length: 90
    /audio_bytes:
      minimum: 1
- id: synthesize_9_congratulations
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: flowcraft-chat-assistant.assistant
      text: 衷心祝贺你取得成功。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_9
- id: turn_9_congratulations
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_9}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_any:
      - félicitations
      - bravo
      - félicite
      pattern: '[A-Za-z]'
      max_length: 90
    /audio_bytes:
      minimum: 1
- id: synthesize_10_good-night
  client: peer
  speech:
    method: server.speech.synthesize
    request:
      voice_name: flowcraft-chat-assistant.assistant
      text: 祝你今晚休息好并做个好梦。
      accepted_content_types:
      - audio/ogg
    cache: run
  save_as: audio_10
- id: turn_10_good-night
  client: peer
  timeout: 2m
  peer_stream:
    mode: push-to-talk
    input: ${audio_10}
    pacing: 20ms
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_any:
      - bonne nuit
      - beaux rêves
      - bien dormir
      pattern: '[A-Za-z]'
      max_length: 90
    /audio_bytes:
      minimum: 1
finally:
- id: stop_run
  client: peer
  rpc:
    method: server.run.stop
    request: {}
- id: delete_workspace
  client: peer
  rpc:
    method: server.workspace.delete
    request:
      name: ${workspace_name}
- id: delete_peer
  client: peer
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
