# User Story:
# As a Raids catalog maintainer,
# I want every available chat-assistant implementation to complete the same bounded Tester relay,
# So that the 12-response `default-assistant-general` route, its deterministic contracts, and the final verdict stay declarative.
version: gizclaw.test/v1alpha1
name: chat-assistant.soak.flowcraft
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-chat-assistant long-form-correction-format-and-reload
  flowcraft_candidate_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_verdict:
    direction: output
    type: string
  flowcraft_reload_handoff:
    direction: output
    type: string
repeat: 1
timeout: 52m
steps:
- id: flowcraft_register_candidate
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_register_tester
  client: flowcraft_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_candidate_workspace}"
      collection: assistants
      workflow_name: general-assistant
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_create_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_tester_workspace}"
      collection: raidtest-testers
      workflow_name: chat-assistant-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_select_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_candidate_workspace}"
- id: flowcraft_warmup_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_select_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_tester_workspace}"
- id: flowcraft_run_dialogue_before_reload
  timeout: 30m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 18
    terminal_client: flowcraft
  capture:
    flowcraft_reload_handoff: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft
    "/completed_turns":
      equals: 18
    "/turns/flowcraft/count":
      equals: 9
    "/turns/flowcraft_tester/count":
      equals: 9
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
- id: flowcraft_reload_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_run_dialogue_after_reload
  timeout: 12m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${flowcraft_reload_handoff}"
    media: text
    idle_timeout: 90s
    max_turns: 7
    terminal_client: flowcraft_tester
  capture:
    flowcraft_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 7
    "/turns/flowcraft/count":
      equals: 3
    "/turns/flowcraft_tester/count":
      equals: 4
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/max":
      maximum: 200
- id: flowcraft_emit_verdict
  output:
    variable: flowcraft_verdict
finally:
- id: flowcraft_stop_candidate_run
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_stop_tester_run
  client: flowcraft_tester
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_delete_candidate_workspace
  client: flowcraft
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_candidate_workspace}"
- id: flowcraft_delete_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_tester_workspace}"
- id: flowcraft_delete_candidate_peer
  client: flowcraft
  rpc:
    method: server.peer.delete
    request: {}
- id: flowcraft_delete_tester_peer
  client: flowcraft_tester
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
