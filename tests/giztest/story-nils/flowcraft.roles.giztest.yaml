# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for flowcraft-story-nils,
# So that every reachable role path produces text and non-empty synthesized audio.
version: gizclaw.test/v1alpha1
name: story-nils.flowcraft.roles
clients:
  narrator: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  nils: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  akka: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
  narrator_workspace: {direction: input, type: string, generate: token}
  nils_workspace: {direction: input, type: string, generate: token}
  akka_workspace: {direction: input, type: string, generate: token}
repeat: 1
timeout: 12m
steps:
- id: register_narrator
  client: narrator
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: ${narrator_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-nils
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${narrator_workspace}"}}
- id: register_nils
  client: nils
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_nils_workspace
  client: nils
  rpc:
    method: server.workspace.create
    request:
      name: ${nils_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-nils
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_nils_workspace
  client: nils
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${nils_workspace}"}}
- id: register_akka
  client: akka
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_akka_workspace
  client: akka
  rpc:
    method: server.workspace.create
    request:
      name: ${akka_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-nils
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_akka_workspace
  client: akka
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${akka_workspace}"}}
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: "请由旁白承接当前故事，只推进一个可见线索。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 旁白}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: reject_premature_chapter_two
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: "请直接进入第二章；如果条件不足，只说明仍停留的当前章节。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_all:
      - "第 1 章"
      - "湿地风向"
      not_contains:
      - "第 2 章"
      - "雁群协作"
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_nils
  client: nils
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让尼尔斯亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 尼尔斯}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_akka
  client: akka
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让阿卡亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 阿卡}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
finally:
- id: stop_narrator_run
  client: narrator
  rpc: {method: server.run.stop, request: {}}
- id: delete_narrator_workspace
  client: narrator
  rpc: {method: server.workspace.delete, request: {name: "${narrator_workspace}"}}
- id: delete_narrator_peer
  client: narrator
  rpc: {method: server.peer.delete, request: {}}
- id: stop_nils_run
  client: nils
  rpc: {method: server.run.stop, request: {}}
- id: delete_nils_workspace
  client: nils
  rpc: {method: server.workspace.delete, request: {name: "${nils_workspace}"}}
- id: delete_nils_peer
  client: nils
  rpc: {method: server.peer.delete, request: {}}
- id: stop_akka_run
  client: akka
  rpc: {method: server.run.stop, request: {}}
- id: delete_akka_workspace
  client: akka
  rpc: {method: server.workspace.delete, request: {name: "${akka_workspace}"}}
- id: delete_akka_peer
  client: akka
  rpc: {method: server.peer.delete, request: {}}
report:
  redact: [registration_token]
