name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python for repository scripts
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python script dependencies
        run: python -m pip install -r scripts/requirements.txt

      - name: Set up Go for Starlark checks
        uses: actions/setup-go@v5
        with:
          go-version-file: scripts/test/chat-assistant/go.mod
          cache-dependency-path: |
            scripts/test/starlark/go.sum
            scripts/test/chat-assistant/go.sum

      - name: Download GizClaw v0.26.0
        env:
          GIZCLAW_ASSET: gizclaw_0.26.0_amd64.deb
          GIZCLAW_SHA256: bb2d6b4ec3ea2c676e2f123fc391ac709e945a0bf461829a81c460afe6bd11b4
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/$GIZCLAW_ASSET"
          root="$RUNNER_TEMP/gizclaw-v0.26.0"
          curl --fail --location --retry 3 \
            --output "$package" \
            "https://github.com/GizClaw/gizclaw/releases/download/v0.26.0/$GIZCLAW_ASSET"
          printf '%s  %s\n' "$GIZCLAW_SHA256" "$package" | sha256sum --check --status
          dpkg-deb --extract "$package" "$root"
          printf 'GIZCLAW=%s\n' "$root/usr/bin/gizclaw" >> "$GITHUB_ENV"

      - name: Validate Resources and Giztest documents
        run: make test-unit-resources

      - name: Check generated learn raid packages
        run: make test-unit-learn

      - name: Check generated guess raid packages
        run: make test-unit-guess

      - name: Check generated figure raid packages
        run: make test-unit-figure

      - name: Check catalog Voice invariants
        run: make test-unit-voices

      - name: Check Chat memory and controlled search results
        run: make test-unit-chat-assistant
