version: v1
name: story-aesop-comparison
driver: scripted-comparison
paired: true
cases:
  - id: seed-choice-and-lessons
    turns:
      - id: opening
        required: [乌龟, 小鸟, 种子]
        forbidden: ["###", "```", "- "]
        min_runes: 20
        max_runes: 100
        first_response: 6s
        total_response: 90s
      - id: choose-plant
        required: [小鸟, 种子]
        min_runes: 50
        max_runes: 190
        first_response: 6s
        total_response: 90s
      - id: predict-before-result
        forbidden: [结局, 故事结束, 唯一寓意]
        min_runes: 40
        max_runes: 170
        first_response: 6s
        total_response: 90s
      - id: reveal-consequence
        required_any: [[种子, 种皮, 幼苗, 幼芽, 小芽, 发芽]]
        min_runes: 50
        max_runes: 190
        first_response: 6s
        total_response: 90s
      - id: challenge-absolute-moral
        forbidden: [一定自私, 绝对错误, 唯一正确]
        min_runes: 40
        max_runes: 180
        first_response: 6s
        total_response: 90s
      - id: cooperation-choice
        required: [乌龟, 小鸟]
        min_runes: 50
        max_runes: 190
        first_response: 6s
        total_response: 90s
      - id: recall-state
        required: [种, 乌龟]
        min_runes: 15
        max_runes: 90
        first_response: 6s
        total_response: 90s
      - id: reload-chapter-checkpoint
        reload_before: true
        required: [第三章]
        required_any: [[照料, 幼苗, 合作]]
        forbidden: [第四章, 故事结束, 唯一寓意]
        min_runes: 15
        max_runes: 90
        first_response: 6s
        total_response: 90s
      - id: change-choice
        required: [乌龟, 小鸟]
        min_runes: 15
        max_runes: 100
        first_response: 6s
        total_response: 90s
      - id: recall-growth-time
        required_any: [[幼苗, 幼芽, 小芽, 种子, 发芽], [天, 日]]
        min_runes: 10
        max_runes: 100
        first_response: 6s
        total_response: 90s
      - id: compare-interpretations
        required: [乌龟, 小鸟]
        forbidden: [唯一正确]
        min_runes: 30
        max_runes: 180
        first_response: 6s
        total_response: 90s
      - id: preserve-child-safety
        forbidden: [流血, 死亡]
        min_runes: 40
        max_runes: 180
        first_response: 6s
        total_response: 90s
      - id: two-lessons
        forbidden: [唯一, 1., 2., "- ", "###", "```"]
        min_runes: 30
        max_runes: 150
        first_response: 6s
        total_response: 90s
