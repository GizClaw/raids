apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-guess-math-terms
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-guess-math-terms.host
    graph:
      name: guess-math-terms-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: game-route
          type: string
          merge: replace
        - name: game-direction
          type: string
          merge: replace
        - name: game-node
          type: string
          merge: replace
        - name: host-rules
          type: string
          merge: replace
        - name: host-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: control-round
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: game-route
          node: game-node
          direction: game-direction
          rules: host-rules
        language: starlark
        entrypoint: run
        source: |
          # Generated from workflows/guess-math-terms/puzzles.json by scripts/guess/generate.py.
          # Eino keeps no hidden state between turns, so every turn rebuilds the game
          # from the spoken History: the latest "谜题来啦"/"Puzzle time" opening names
          # the level and the puzzle number, and (level, puzzle) picks the secret.
          # Each turn makes one model call: this script either writes the host's
          # instruction for build-host-prompt, or activates the current puzzle's card
          # node, whose card has the name removed so the host cannot say it.
          DATA = {"subject_zh": "一个数学名词", "subject_en": "a math word", "examples_zh": ["它是一种图形吗？", "它是一个数吗？", "它和计算有关吗？", "它和测量有关吗？"], "examples_en": ["Is it a shape?", "Is it a number?", "Is it about calculating?", "Is it used for measuring?"], "restate_zh": ["它是一个数吗？", "是，它是一个数。", "不是，它不是一个数。"], "restate_en": ["Is it a number?", "Yes, it is a number.", "No, it is not a number."], "host_rules": "你是儿童猜谜游戏“猜猜数学名词”的主持人。玩法：主持人心里藏着一个数学名词，孩子用能回答“是”或“不是”的问题来猜，每一题最多 20 次提问；猜中就升一关，一共 10 关，关名从“数学小萌新”一直到“无穷解谜者”。孩子可能说中文，也可能说英文。\n你不知道谜底的名字。需要回答孩子的问题时，系统会在【谜底卡】里给你这一题的资料，谜底的名字已经隐藏，你也不要去猜它叫什么；回答是非题时以这张卡为准，卡上没写到又拿不准的就说说不准。揭晓答案时系统才会在指令里告诉你名字。本轮要做什么写在对话最后的【本轮指令】里，照着做，说得自然、热情、简短。\n孩子说的“它”“这个东西”“this”“it”都指谜底名词。按这个数学名词在课本里的本来含义、常见例子和日常生活里的用法来判断；是图形、数、运算、单位或工具、定理或公式还是概念，也要按它的本意判断。\n必须遵守：\n1. 本轮指令要求“逐字说”的句子必须一字不差地说出来，包括数字、标点和引号里的称号，不改写、不省略、不调换顺序。\n2. 只回答孩子问到的那一点，绝不能主动补充谜底卡上的其他描述、线索、特征、猜测方向或评价；复述孩子的问题时只能用孩子问题里已有的意思。\n3. 只有本轮指令要求揭晓答案时才能说“答案揭晓”“答案就是”“The answer is”；只有本轮指令要求开新题时才能说“谜题来啦”“Puzzle time”；只有真的给提示时才能说“小提示”“Hint”。平时绝不能说这些词。\n4. 按【本轮指令】写明的回复语言回答：中文就全部用中文；English 就全部用英文，逐字句也用指令给出的英文原句。\n5. 安全永远优先于本轮指令：孩子提到要在现实中模仿危险做法或遇到安全问题时，中文回复必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，英文回复要说 do not copy it 并请孩子 ask a parent, teacher or trusted adult for help。\n6. 不要自己数还剩几次提问机会，只有本轮指令写了剩余次数时才说那个数字。\n7. 语气像节目主持人一样活泼友好，适合小朋友；平时回复1到3句话、100个字以内，开新题和揭晓答案时可以到150个字；最后一句必须是问孩子的问题，道别时也用一个轻松的问题结尾。\n8. 只输出适合朗读的正文，不输出 Markdown、列表、emoji、括号注释、舞台说明或系统字段，也不要提到“本轮指令”“裁判”这些词。", "levels": [{"title_zh": "数学小萌新", "title_en": "Math Sprout", "step": 7, "offset": 0, "items": [{"zh": "圆形", "en": "circle", "aliases": ["圆", "圆圈"], "profile": "没有角、边是一条弯弯曲线的平面图形，边上每一点到中心的距离都一样。", "hints": ["它是一种平面图形", "它一个角也没有", "它的样子像车轮"]}, {"zh": "正方形", "en": "square", "aliases": [], "profile": "四条边一样长、四个角都是直角的平面图形。", "hints": ["它是一种平面图形", "它有四个角", "它的四条边一样长"]}, {"zh": "三角形", "en": "triangle", "aliases": ["三角"], "profile": "由三条线段首尾相连围成的平面图形，有三个角。", "hints": ["它是一种平面图形", "它的边都是直的", "它的角比正方形少"]}, {"zh": "长方形", "en": "rectangle", "aliases": ["矩形"], "profile": "四个角都是直角、对边一样长的平面图形。", "hints": ["它是一种平面图形", "它有四个直角", "它像一扇门的形状"]}, {"zh": "椭圆形", "en": "oval", "aliases": ["椭圆", "ellipse"], "profile": "像把圆压扁后得到的平面图形，没有角，边是光滑的曲线。", "hints": ["它是一种平面图形", "它没有角", "它像鸡蛋侧面的轮廓"]}, {"zh": "半圆形", "en": "semicircle", "aliases": ["半圆"], "profile": "把圆沿直径切成两半后得到的平面图形，一条边直、一条边弯。", "hints": ["它是一种平面图形", "它的边有直有弯", "它像量角器的形状"]}, {"zh": "五角星", "en": "star", "aliases": ["星形", "星星", "五星"], "profile": "有五个尖尖的角、看起来闪闪发光的平面图形，常印在奖励贴纸上。", "hints": ["它是一种平面图形", "它有很多尖尖的角", "它常出现在奖励贴纸上"]}, {"zh": "球体", "en": "sphere", "aliases": ["球", "圆球", "球形"], "profile": "从哪个方向看都是圆的立体图形，表面上每一点到中心的距离都一样。", "hints": ["它是一种立体图形", "它没有棱角", "它可以向各个方向滚"]}, {"zh": "正方体", "en": "cube", "aliases": ["立方体"], "profile": "由六个一样大的正方形围成的立体图形，有八个顶点和十二条棱。", "hints": ["它是一种立体图形", "它有六个面", "它的样子像骰子"]}, {"zh": "零", "en": "zero", "aliases": ["0"], "profile": "表示“一个也没有”的数，比所有正数都小，比所有负数都大。", "hints": ["它是一个数", "它表示什么都没有", "它写出来像个鸡蛋"]}, {"zh": "十", "en": "ten", "aliases": ["10"], "profile": "比九多一的数，正好是两只手手指头的个数。", "hints": ["它是一个数", "它是一个偶数", "它等于你手指的个数"]}, {"zh": "一半", "en": "half", "aliases": ["二分之一"], "profile": "把一个东西平均分成两份，其中的每一份就是它。", "hints": ["它和分东西有关", "它比一整个小", "它和平均分成两份有关"]}, {"zh": "加法", "en": "addition", "aliases": ["加", "加号"], "profile": "把两个或几个数合起来，求一共是多少的运算，结果叫和。", "hints": ["它是一种运算", "它能算出一共有多少", "它的符号像个十字"]}, {"zh": "减法", "en": "subtraction", "aliases": ["减", "减号"], "profile": "从一个数里去掉一部分，求还剩多少的运算，结果叫差。", "hints": ["它是一种运算", "它能算出还剩多少", "它的符号是一条短横线"]}, {"zh": "钟表", "en": "clock", "aliases": ["时钟", "钟", "闹钟", "手表"], "profile": "用来看时间的工具，表盘上有数字和会转动的指针。", "hints": ["它和时间有关", "它有会转的指针", "它常挂在墙上"]}, {"zh": "尺子", "en": "ruler", "aliases": ["直尺", "尺"], "profile": "上面有刻度、用来量长度和画直线的工具。", "hints": ["它和测量有关", "它上面有很多刻度", "它常放在文具盒里"]}]}, {"title_zh": "算术小能手", "title_en": "Arithmetic Whiz", "step": 7, "offset": 0, "items": [{"zh": "长方体", "en": "cuboid", "aliases": ["rectangular prism"], "profile": "由六个长方形围成的立体图形，相对的两个面完全一样，有八个顶点。", "hints": ["它是一种立体图形", "它有六个面", "它的样子像鞋盒"]}, {"zh": "圆柱", "en": "cylinder", "aliases": ["圆柱体"], "profile": "上下两个面是一样大的圆、侧面是弯曲面的立体图形。", "hints": ["它是一种立体图形", "它躺下能滚动", "它的样子像易拉罐"]}, {"zh": "偶数", "en": "even number", "aliases": ["双数"], "profile": "能被2整除的整数，比如0、2、4、6、8。", "hints": ["它是一类数", "它能平均分成两份", "它的个位可以是8"]}, {"zh": "乘法", "en": "multiplication", "aliases": ["乘", "乘号"], "profile": "求几个相同的数加起来是多少的简便算法，结果叫积。", "hints": ["它是一种运算", "它比连着相加更快", "它的符号像个斜十字"]}, {"zh": "线段", "en": "line segment", "aliases": [], "profile": "直线上两个端点之间的一段，有两个端点，可以量出长度。", "hints": ["它是一种几何图形", "它是直直的", "它有两个端点"]}, {"zh": "奇数", "en": "odd number", "aliases": ["单数"], "profile": "不能被2整除的整数，比如1、3、5、7、9。", "hints": ["它是一类数", "它不能平均分成两份", "它的个位可以是7"]}, {"zh": "等号", "en": "equals sign", "aliases": ["等于号"], "profile": "由两条一样长的平行短线组成的符号，表示两边的大小相等。", "hints": ["它是一个数学符号", "它由两条短线组成", "它说明两边一样多"]}, {"zh": "厘米", "en": "centimeter", "aliases": ["公分", "centimetre"], "profile": "常用的长度单位，1米等于100个它，大约是一个指甲盖的宽度。", "hints": ["它是一个单位", "它用来量长度", "它大约有指甲盖那么宽"]}, {"zh": "除法", "en": "division", "aliases": ["除", "除号"], "profile": "把一个数平均分成几份、求每份是多少的运算，结果叫商。", "hints": ["它是一种运算", "它和平均分有关", "它的符号上下各有一个点"]}, {"zh": "六边形", "en": "hexagon", "aliases": ["六角形"], "profile": "有六条边和六个角的平面图形，蜂巢的格子就是这个形状。", "hints": ["它是一种平面图形", "它的边比正方形多", "它像蜂巢的格子"]}, {"zh": "直角", "en": "right angle", "aliases": [], "profile": "正好是90度的角，像书本、桌子的角那样方方正正。", "hints": ["它是一种角", "它的大小是固定的", "它像书本的角"]}, {"zh": "乘法表", "en": "times table", "aliases": ["乘法口诀", "九九乘法表", "九九表", "multiplication table"], "profile": "把1到9两两相乘的结果排成表或编成口诀，方便背下来快速计算。", "hints": ["它和计算有关", "它常常需要背诵", "它可以编成顺口的口诀"]}, {"zh": "千克", "en": "kilogram", "aliases": ["公斤"], "profile": "常用的质量单位，等于1000克，一升水大约就这么重。", "hints": ["它是一个单位", "它和轻重有关", "它比克大得多"]}, {"zh": "余数", "en": "remainder", "aliases": [], "profile": "平均分东西分不完时剩下的部分，一定比除数小。", "hints": ["它和除法有关", "它是剩下来的部分", "它总比除数小"]}, {"zh": "日历", "en": "calendar", "aliases": ["月历", "挂历", "台历"], "profile": "按年、月、日排好日期的表，可以查今天是几月几日、星期几。", "hints": ["它和时间有关", "它能查日子", "它通常一年换一本"]}, {"zh": "小时", "en": "hour", "aliases": ["钟头"], "profile": "常用的时间单位，1个它等于60分钟，一天一夜有24个它。", "hints": ["它是一个单位", "它和时间有关", "它比分钟长"]}]}, {"title_zh": "图形小侦探", "title_en": "Shape Detective", "step": 7, "offset": 0, "items": [{"zh": "分数", "en": "fraction", "aliases": [], "profile": "把一个整体平均分成几份，表示其中一份或几份的数，比如三分之一。", "hints": ["它是一类数", "它和平均分有关", "它写的时候中间有条横线"]}, {"zh": "小数", "en": "decimal", "aliases": [], "profile": "像0.5、3.14这样中间带一个圆点的数，可以表示比1小的部分。", "hints": ["它是一类数", "它的中间有一个点", "它常出现在价格标签上"]}, {"zh": "周长", "en": "perimeter", "aliases": [], "profile": "围成一个图形一周的所有边的长度总和。", "hints": ["它和长度有关", "它要绕着图形走一圈", "它是各条边加起来"]}, {"zh": "面积", "en": "area", "aliases": [], "profile": "物体表面或平面图形的大小，用平方厘米、平方米来计量。", "hints": ["它和大小有关", "它说的是一个面有多大", "它的单位里有平方"]}, {"zh": "千米", "en": "kilometer", "aliases": ["公里", "kilometre"], "profile": "比较长的长度单位，等于1000米，常用来计量城市之间的距离。", "hints": ["它是一个单位", "它用来量很长的距离", "它等于很多个米"]}, {"zh": "平行四边形", "en": "parallelogram", "aliases": [], "profile": "两组对边分别平行的四边形，拉一拉会改变形状，容易变形。", "hints": ["它是一种平面图形", "它有四条边", "它像被推歪的长方形"]}, {"zh": "梯形", "en": "trapezoid", "aliases": ["trapezium"], "profile": "只有一组对边平行的四边形，像堤坝的横截面那样。", "hints": ["它是一种平面图形", "它有四条边", "它只有一组边平行"]}, {"zh": "平行线", "en": "parallel lines", "aliases": ["平行"], "profile": "在同一个平面上、永远不会相交的两条直线。", "hints": ["它和直线有关", "它总是成对出现", "它们永远不会碰到"]}, {"zh": "垂直", "en": "perpendicular", "aliases": ["互相垂直"], "profile": "两条直线相交成直角时的位置关系，就像十字路口那样。", "hints": ["它和直线有关", "它说的是一种位置关系", "它会形成直角"]}, {"zh": "锐角", "en": "acute angle", "aliases": [], "profile": "比直角小、大于0度的角，看起来尖尖的。", "hints": ["它是一种角", "它比直角小", "它看起来尖尖的"]}, {"zh": "量角器", "en": "protractor", "aliases": [], "profile": "量角的大小的工具，常见的是半圆形，上面刻有0到180度。", "hints": ["它是一种工具", "它上面有刻度", "它通常是半圆的形状"]}, {"zh": "算盘", "en": "abacus", "aliases": ["珠算盘"], "profile": "用拨动算珠来计算的传统工具，中国古代就广泛使用。", "hints": ["它是一种计算工具", "它不需要用电", "它上面有许多珠子"]}, {"zh": "轴对称", "en": "line symmetry", "aliases": ["对称", "轴对称图形", "reflection symmetry"], "profile": "一个图形沿一条直线对折后，两边能完全重合的特点。", "hints": ["它和图形有关", "它要沿直线对折", "它让两边一模一样"]}, {"zh": "条形统计图", "en": "bar chart", "aliases": ["条形图", "柱状图", "bar graph"], "profile": "用长短不同的直条表示数量多少的统计图。", "hints": ["它和统计有关", "它能比较数量多少", "它由一根根直条组成"]}, {"zh": "平均数", "en": "average", "aliases": ["平均值"], "profile": "把几个数加起来再除以个数得到的数，表示一组数据的一般水平。", "hints": ["它和统计有关", "它要先加再除", "它代表一组数的一般水平"]}, {"zh": "闰年", "en": "leap year", "aliases": [], "profile": "二月有29天、全年有366天的年份，一般每四年出现一次。", "hints": ["它和日历有关", "它比平常多一天", "它一般四年出现一次"]}]}, {"title_zh": "数字探险家", "title_en": "Number Explorer", "step": 7, "offset": 0, "items": [{"zh": "质数", "en": "prime number", "aliases": ["素数"], "profile": "大于1、只能被1和它本身整除的整数，比如2、3、5、7。", "hints": ["它是一类数", "它和因数有关", "它只能被1和自己整除"]}, {"zh": "合数", "en": "composite number", "aliases": [], "profile": "除了1和它本身以外，还有别的因数的整数，比如4、6、8、9。", "hints": ["它是一类数", "它和因数有关", "它的因数至少有三个"]}, {"zh": "因数", "en": "factor", "aliases": ["约数"], "profile": "能整除一个整数的数，比如1、2、3、6都能整除6。", "hints": ["它和整除有关", "它说的是两个数的关系", "它和倍数是一对"]}, {"zh": "倍数", "en": "multiple", "aliases": [], "profile": "一个数乘整数得到的数，比如3、6、9、12都是3的这种数。", "hints": ["它和整除有关", "它有无穷多个", "它和因数是一对"]}, {"zh": "百分数", "en": "percentage", "aliases": ["百分比", "百分率"], "profile": "表示一个数是另一个数的百分之几的数，用%号表示。", "hints": ["它是一类数", "它有专门的符号", "它常出现在电量显示上"]}, {"zh": "比例", "en": "proportion", "aliases": [], "profile": "表示两个比相等的式子，比如2比3等于4比6。", "hints": ["它和比有关", "它里面有四个数", "它常用于放大和缩小"]}, {"zh": "半径", "en": "radius", "aliases": [], "profile": "连接圆心和圆上任意一点的线段，同一个圆里它都一样长。", "hints": ["它和圆有关", "它是一条线段", "它从圆心出发"]}, {"zh": "直径", "en": "diameter", "aliases": [], "profile": "穿过圆心、两端都在圆上的线段，是圆里最长的线段。", "hints": ["它和圆有关", "它是一条线段", "它穿过圆的中心"]}, {"zh": "体积", "en": "volume", "aliases": [], "profile": "物体所占空间的大小，用立方厘米、立方米等单位来计量。", "hints": ["它和大小有关", "它说的是占多大空间", "它的单位里有立方"]}, {"zh": "圆锥", "en": "cone", "aliases": ["圆锥体"], "profile": "底面是一个圆、侧面是曲面、顶上有一个尖的立体图形。", "hints": ["它是一种立体图形", "它有一个尖顶", "它像冰淇淋蛋筒"]}, {"zh": "方程", "en": "equation", "aliases": [], "profile": "含有未知数的等式，比如x加3等于5。", "hints": ["它是一种式子", "它里面有等号", "它藏着一个未知数"]}, {"zh": "扇形统计图", "en": "pie chart", "aliases": ["扇形图", "饼图", "饼状图"], "profile": "用整个圆表示总数、用扇形大小表示各部分占多少的统计图。", "hints": ["它和统计有关", "它能看出各部分占多少", "它的样子像切开的比萨"]}, {"zh": "罗马数字", "en": "Roman numerals", "aliases": [], "profile": "古罗马人用字母表示数的方法，比如I表示1、V表示5、X表示10。", "hints": ["它是一种写数的方法", "它来自古代欧洲", "它用字母来表示数"]}, {"zh": "平方米", "en": "square meter", "aliases": ["平米", "square metre"], "profile": "常用的面积单位，边长1米的正方形面积就是这么大。", "hints": ["它是一个单位", "它用来量面积", "它常用来说房间多大"]}, {"zh": "钝角", "en": "obtuse angle", "aliases": [], "profile": "大于直角、小于平角的角，也就是在90度到180度之间。", "hints": ["它是一种角", "它比直角大", "它看起来张得很开"]}]}, {"title_zh": "代数小勇士", "title_en": "Algebra Knight", "step": 7, "offset": 0, "items": [{"zh": "负数", "en": "negative number", "aliases": [], "profile": "比0小的数，前面带一个负号，比如零下5摄氏度记作负5。", "hints": ["它是一类数", "它比0小", "它常出现在冬天的温度里"]}, {"zh": "圆周率", "en": "pi", "aliases": ["π", "派"], "profile": "圆的周长和直径的比值，约等于3.14，是一个永远写不完的小数。", "hints": ["它是一个数", "它和圆有关", "它的小数永远写不完"]}, {"zh": "绝对值", "en": "absolute value", "aliases": [], "profile": "数轴上一个数到0的距离，所以它永远不会是负数。", "hints": ["它和距离有关", "它不会是负数", "它写的时候有两条竖线"]}, {"zh": "有理数", "en": "rational number", "aliases": [], "profile": "能写成两个整数相除形式的数，包括整数和分数。", "hints": ["它是一类数", "它能写成分数", "它包括所有整数"]}, {"zh": "数轴", "en": "number line", "aliases": [], "profile": "规定了原点、正方向和单位长度的直线，可以用点来表示数。", "hints": ["它和数有关", "它画出来是一条直线", "它上面有原点"]}, {"zh": "相反数", "en": "opposite number", "aliases": [], "profile": "只有符号不同的两个数互为这种数，比如3和负3。", "hints": ["它总是成对出现", "它和正负号有关", "它们加起来等于0"]}, {"zh": "倒数", "en": "reciprocal", "aliases": [], "profile": "乘积是1的两个数互为这种数，比如2和二分之一。", "hints": ["它总是成对出现", "它和乘法有关", "它们的乘积是1"]}, {"zh": "乘方", "en": "exponentiation", "aliases": ["幂", "次方", "power"], "profile": "把同一个数连续乘好几次的运算，比如求2乘2乘2的结果。", "hints": ["它是一种运算", "它和乘法有关", "它的结果常常增长很快"]}, {"zh": "科学记数法", "en": "scientific notation", "aliases": [], "profile": "把很大或很小的数写成一个数乘10的几次方的简便写法。", "hints": ["它是一种写数的方法", "它适合写很大的数", "它会用到10"]}, {"zh": "代数式", "en": "algebraic expression", "aliases": [], "profile": "用运算符号把数和表示数的字母连起来的式子，比如2a加b。", "hints": ["它是一种式子", "它里面有字母", "它没有等号"]}, {"zh": "一元一次方程", "en": "linear equation in one variable", "aliases": [], "profile": "只含一个未知数、未知数的次数是1的整式方程，比如2x加1等于7。", "hints": ["它是一种等式", "它只有一个未知数", "它的未知数没有平方"]}, {"zh": "射线", "en": "ray", "aliases": [], "profile": "直线上一点和它一旁的部分，只有一个端点，向一方无限延伸。", "hints": ["它是一种几何图形", "它只有一个端点", "它像手电筒照出的光"]}, {"zh": "对顶角", "en": "vertical angles", "aliases": [], "profile": "两条直线相交时，位置相对、共用一个顶点的两个角，它们总是相等。", "hints": ["它和角有关", "它总是成对出现", "它的两个角大小一样"]}, {"zh": "角平分线", "en": "angle bisector", "aliases": [], "profile": "从角的顶点出发，把一个角分成两个相等部分的射线。", "hints": ["它和角有关", "它是一条射线", "它把角平均分开"]}, {"zh": "补角", "en": "supplementary angle", "aliases": [], "profile": "两个角加起来正好是180度时，这两个角互为这种角。", "hints": ["它和角有关", "它总是成对出现", "它们合起来是一个平角"]}]}, {"title_zh": "几何建筑师", "title_en": "Geometry Architect", "step": 5, "offset": 0, "items": [{"zh": "勾股定理", "en": "Pythagorean theorem", "aliases": ["毕达哥拉斯定理", "商高定理"], "profile": "直角三角形两条直角边的平方和，等于斜边的平方。", "hints": ["它是一个定理", "它和直角三角形有关", "它和三条边的平方有关"]}, {"zh": "无理数", "en": "irrational number", "aliases": [], "profile": "无限不循环的小数，不能写成两个整数之比，比如圆周率。", "hints": ["它是一类数", "它的小数写不完", "它不能写成分数"]}, {"zh": "平方根", "en": "square root", "aliases": [], "profile": "如果一个数自己乘自己等于a，这个数就叫a的它，比如3和负3都是9的它。", "hints": ["它是一个数", "它和平方有关", "它的符号像个钩子"]}, {"zh": "实数", "en": "real number", "aliases": [], "profile": "有理数和无理数的统称，每一个都能在数轴上找到一个点。", "hints": ["它是一类数", "它能在数轴上找到位置", "它包括有理数和无理数"]}, {"zh": "平面直角坐标系", "en": "Cartesian coordinate system", "aliases": ["直角坐标系", "坐标系"], "profile": "由两条互相垂直、原点重合的数轴组成，用一对数确定平面上点的位置。", "hints": ["它和位置有关", "它有两条数轴", "它用一对数表示点"]}, {"zh": "全等三角形", "en": "congruent triangles", "aliases": [], "profile": "形状和大小都完全一样、叠在一起能完全重合的两个三角形。", "hints": ["它和三角形有关", "它总是成对出现", "它们能完全重合"]}, {"zh": "等腰三角形", "en": "isosceles triangle", "aliases": [], "profile": "有两条边相等的三角形，它的两个底角也相等。", "hints": ["它是一种三角形", "它有两条边一样长", "它左右对称"]}, {"zh": "等边三角形", "en": "equilateral triangle", "aliases": ["正三角形"], "profile": "三条边都相等的三角形，三个角都是60度。", "hints": ["它是一种三角形", "它的三条边一样长", "它的每个角都是60度"]}, {"zh": "中位数", "en": "median", "aliases": [], "profile": "把一组数据从小到大排好后，正中间的那个数。", "hints": ["它和统计有关", "它需要先排序", "它在正中间"]}, {"zh": "众数", "en": "mode", "aliases": [], "profile": "一组数据中出现次数最多的那个数。", "hints": ["它和统计有关", "它和出现次数有关", "它是出现最多的那个"]}, {"zh": "二元一次方程组", "en": "system of linear equations", "aliases": [], "profile": "由两个含两个未知数的一次方程组成的方程组，通常能求出唯一一组解。", "hints": ["它不止一个等式", "它有两个未知数", "它能解鸡兔同笼问题"]}, {"zh": "不等式", "en": "inequality", "aliases": [], "profile": "用大于号、小于号等不等号连接的式子，比如x大于3。", "hints": ["它是一种式子", "它和比较大小有关", "它常用大于号或小于号"]}, {"zh": "因式分解", "en": "factorization", "aliases": ["分解因式"], "profile": "把一个多项式变成几个整式相乘形式的变形方法。", "hints": ["它是一种变形", "它和乘法方向相反", "它和多项式有关"]}, {"zh": "多边形", "en": "polygon", "aliases": [], "profile": "由三条或更多条线段首尾相连围成的平面图形，比如三角形、五边形。", "hints": ["它是一种平面图形", "它的边都是直的", "它的边至少有三条"]}]}, {"title_zh": "函数魔法师", "title_en": "Function Wizard", "step": 5, "offset": 0, "items": [{"zh": "函数", "en": "function", "aliases": [], "profile": "两个变量之间的一种对应关系，一个量变化时，另一个量随之确定地变化。", "hints": ["它和变化有关", "它说的是两个量的关系", "它可以画成图像"]}, {"zh": "一次函数", "en": "linear function", "aliases": [], "profile": "形如y等于kx加b、k不为0的函数，它的图像是一条直线。", "hints": ["它是一种函数", "它的图像是直的", "它的式子里x没有平方"]}, {"zh": "反比例函数", "en": "inverse proportion function", "aliases": [], "profile": "形如y等于k除以x、k不为0的函数，它的图像是双曲线。", "hints": ["它是一种函数", "它的图像有两支", "它让一个量越大另一个越小"]}, {"zh": "二次函数", "en": "quadratic function", "aliases": [], "profile": "形如y等于ax平方加bx加c、a不为0的函数，图像是抛物线。", "hints": ["它是一种函数", "它的图像是弯的", "它的式子里有平方"]}, {"zh": "抛物线", "en": "parabola", "aliases": [], "profile": "像投出的篮球在空中划过的弯曲路线，也是二次函数的图像。", "hints": ["它是一条曲线", "它是左右对称的", "它像扔出的球飞过的路线"]}, {"zh": "一元二次方程", "en": "quadratic equation", "aliases": [], "profile": "只含一个未知数、未知数最高次数是2的整式方程。", "hints": ["它是一种方程", "它只有一个未知数", "它的未知数有平方"]}, {"zh": "相似三角形", "en": "similar triangles", "aliases": [], "profile": "形状相同、大小可以不同的两个三角形，对应角相等，对应边成比例。", "hints": ["它和三角形有关", "它总是成对出现", "它们形状一样大小不同"]}, {"zh": "切线", "en": "tangent line", "aliases": [], "profile": "和圆只有一个公共点的直线，它和过那个点的半径互相垂直。", "hints": ["它是一条直线", "它和圆有关", "它只碰到圆的一个点"]}, {"zh": "正弦", "en": "sine", "aliases": ["sin"], "profile": "直角三角形里，一个锐角的对边和斜边的比值。", "hints": ["它和三角形有关", "它和角的大小有关", "它和对边、斜边有关"]}, {"zh": "概率", "en": "probability", "aliases": ["可能性"], "profile": "表示一件事情发生的可能有多大的数，在0到1之间。", "hints": ["它和随机事件有关", "它的值在0到1之间", "它和抛硬币有关"]}, {"zh": "方差", "en": "variance", "aliases": [], "profile": "衡量一组数据波动大小的量，它越大说明数据越分散。", "hints": ["它和统计有关", "它和平均数有关", "它越小数据越稳定"]}, {"zh": "黄金分割", "en": "golden ratio", "aliases": ["黄金比", "黄金比例"], "profile": "把一条线段分成两段，使较长段与全长之比约为0.618的分法，被认为特别好看。", "hints": ["它和比例有关", "它被认为很美", "它常用在绘画和建筑里"]}, {"zh": "中心对称", "en": "point symmetry", "aliases": ["中心对称图形"], "profile": "一个图形绕某一点旋转180度后，能和原来的图形完全重合的特点。", "hints": ["它和图形有关", "它要转半圈", "它围绕一个点"]}, {"zh": "三视图", "en": "three views", "aliases": [], "profile": "从正面、左面和上面观察同一个物体画出的三张图。", "hints": ["它和立体图形有关", "它由几张图组成", "它从不同方向看物体"]}]}, {"title_zh": "数学研究员", "title_en": "Math Researcher", "step": 7, "offset": 0, "items": [{"zh": "集合", "en": "set", "aliases": [], "profile": "把一些确定的、不同的对象放在一起看成一个整体，比如全班同学。", "hints": ["它和分类有关", "它把东西放在一起", "它里面的东西叫元素"]}, {"zh": "对数", "en": "logarithm", "aliases": [], "profile": "乘方的逆运算，如果10的2次方等于100，那么以10为底100的它就是2。", "hints": ["它是一种运算", "它和乘方有关", "它能把乘法变成加法"]}, {"zh": "指数函数", "en": "exponential function", "aliases": [], "profile": "形如y等于a的x次方的函数，a大于0且不等于1，能增长或衰减得非常快。", "hints": ["它是一种函数", "它的变量在右上角", "它能增长得非常快"]}, {"zh": "向量", "en": "vector", "aliases": ["矢量"], "profile": "既有大小又有方向的量，常画成一条带箭头的线段。", "hints": ["它和方向有关", "它有大小", "它常画成箭头"]}, {"zh": "等差数列", "en": "arithmetic sequence", "aliases": [], "profile": "从第二项起，每一项减去前一项的差都相同的一列数，比如1、3、5、7。", "hints": ["它是一列数", "它和相邻两项的差有关", "它每次增加同样多"]}, {"zh": "等比数列", "en": "geometric sequence", "aliases": [], "profile": "从第二项起，每一项与前一项的比都相同的一列数，比如1、2、4、8。", "hints": ["它是一列数", "它和相邻两项的比有关", "它常常成倍增长"]}