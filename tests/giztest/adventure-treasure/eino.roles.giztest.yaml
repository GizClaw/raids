finally:
- id: stop_narrator_run
  client: narrator
  rpc:
    method: server.run.stop
    request: {}
- id: delete_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.delete
    request:
      name: "${narrator_workspace}"
- id: delete_narrator_peer
  client: narrator
  rpc:
    method: server.peer.delete
    request: {}
- id: stop_cartographer_run
  client: cartographer
  rpc:
    method: server.run.stop
    request: {}
- id: delete_cartographer_workspace
  client: cartographer
  rpc:
    method: server.workspace.delete
    request:
      name: "${cartographer_workspace}"
- id: delete_cartographer_peer
