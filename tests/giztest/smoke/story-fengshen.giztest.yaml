    "/eino_narrator_chapter_setup_1/audio_eos":
      equals: true
    "/eino_narrator_chapter_setup_1/audio_bytes":
      minimum: 1
    "/eino_narrator_chapter_setup_1/first_text_ms":
      maximum: 6000
    "/eino_narrator_chapter_setup_1/first_audio_ms":
      maximum: 90000
    "/eino_narrator_chapter_setup_1/events":
      non_empty: true
    "/eino_narrator_chapter_setup_1/text_eos_ms":
      maximum: 90000
    "/eino_narrator_chapter_setup_1/audio_eos_ms":
