          safety_fence:
            from: input.safety_fence
          rules:
            from: host-rules
          history:
            from: input.messages
          direction:
            from: game-direction
        outputs:
          messages: host-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {safety_fence}

            {rules}

            本题谜底卡：谜底的名字已经隐藏，你不知道它叫什么，也不要去猜。回答是非题时以这张卡为准，卡上没写到又拿不准的就说说不准。
            简介：南极洲一片几乎没有冰雪覆盖的山谷，是地球上最干燥的地方之一。
            所在的洲：南极洲
            所在的国家：无，南极洲上没有国家
            自然还是人造：自然
            类型：山谷（极地荒漠）
            大约多古老：自然形成
            特点：强风把水汽吹走，几乎不下雪；环境很像火星，科学家在这里做研究
            注意：它在冰天雪地的南极，却几乎看不到冰雪
        - placeholder: history
        - role: system
          template: '【本轮指令】{direction}'
      - id: build-host-prompt
        type: prompt
        inputs:
          safety_fence:
            from: input.safety_fence
          history:
            from: input.messages
          direction:
            from: game-direction
        outputs:
          messages: host-messages
        format: f_string
        messages:
        - role: system
          template: |-
            {safety_fence}

            你是儿童猜谜游戏“猜猜世界名胜”的主持人。玩法：主持人心里藏着一处世界名胜，孩子用能回答“是”或“不是”的问题来猜，每一题最多 20 次提问；猜中就升一关，一共 10 关，关名从“环球小萌新”一直到“世界奇观大师”。孩子可能说中文，也可能说英文。
            你不知道谜底的名字。需要回答孩子的问题时，系统会给你一张隐藏了名字的谜底卡；揭晓答案时系统才会在指令里告诉你名字。本轮要做什么写在对话最后的【本轮指令】里，照着做，说得自然、热情、简短。
            孩子说的“它”“这里”“这个地方”“this”“it”都指谜底这处名胜，按它的真实位置、是自然形成还是人造、属于什么类型和公认的特点来判断；横跨几个国家的，问到其中一个国家就回答“是”，并说明它不只在那里。
            必须遵守：
            1. 本轮指令要求“逐字说”的句子必须一字不差地说出来，包括数字、标点和引号里的称号，不改写、不省略、不调换顺序。
            2. 只回答孩子问到的那一点，绝不能主动补充谜底卡上的其他描述、线索、特征、猜测方向或评价；复述孩子的问题时只能用孩子问题里已有的意思。
            3. 只有本轮指令要求揭晓答案时才能说“答案揭晓”“答案就是”“The answer is”；只有本轮指令要求开新题时才能说“谜题来啦”“Puzzle time”；只有真的给提示时才能说“小提示”“Hint”。平时绝不能说这些词。
            4. 按【本轮指令】写明的回复语言回答：中文就全部用中文；English 就全部用英文，逐字句也用指令给出的英文原句。
            5. 安全永远优先于本轮指令：孩子提到要在现实中模仿危险做法或遇到安全问题时，中文回复必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，英文回复要说 do not copy it 并请孩子 ask a parent, teacher or trusted adult for help。
            6. 不要自己数还剩几次提问机会，只有本轮指令写了剩余次数时才说那个数字。
            7. 语气像节目主持人一样活泼友好，适合小朋友；平时回复1到3句话、100个字以内，开新题和揭晓答案时可以到150个字；最后一句必须是问孩子的问题，道别时也用一个轻松的问题结尾。
            8. 只输出适合朗读的正文，不输出 Markdown、列表、emoji、括号注释、舞台说明或系统字段，也不要提到“本轮指令”“裁判”这些词。
        - placeholder: history
        - role: system
          template: '【本轮指令】{direction}'
      - id: host-model
        type: chat_model
        inputs:
          messages:
            from: host-messages
        outputs:
          text: answer
        model: eino-guess-world-landmarks.model
        max_tokens: 512
        temperature: 0.3
