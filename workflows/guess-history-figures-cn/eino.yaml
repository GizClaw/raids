apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: eino-guess-history-figures-cn
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    voice_adapter:
      asr_model: asr
      default_voice: eino-guess-history-figures-cn.host
    graph:
      name: guess-history-figures-cn-eino
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 12
      state:
        fields:
        - name: game-route
          type: string
          merge: replace
        - name: game-direction
          type: string
          merge: replace
        - name: game-node
          type: string
          merge: replace
        - name: host-rules
          type: string
          merge: replace
        - name: host-messages
          type: messages
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: control-round
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: game-route
          node: game-node
          direction: game-direction
          rules: host-rules
        language: starlark
        entrypoint: run
        source: |
          # Generated from workflows/guess-history-figures-cn/puzzles.json by scripts/guess/generate.py.
          # Eino keeps no hidden state between turns, so every turn rebuilds the game
          # from the spoken History: the latest "谜题来啦"/"Puzzle time" opening names
          # the level and the puzzle number, and (level, puzzle) picks the secret.
          # Each turn makes one model call: this script either writes the host's
          # instruction for build-host-prompt, or activates the current puzzle's card
          # node. The card omits the name; the instruction supplies the fixed answer
          # privately so the host can judge facts and equivalent guesses without
          # changing the answer or revealing it before the round ends.
          DATA = {"subject_zh": "一位中国历史人物", "subject_en": "a famous figure from Chinese history", "examples_zh": ["这个人是皇帝吗？", "这个人是诗人吗？", "这个人生活在唐朝以前吗？", "这个人是女性吗？"], "examples_en": ["Was this person an emperor?", "Was this person a poet?", "Did this person live before the Tang dynasty?", "Was this person a woman?"], "restate_zh": ["这个人是诗人吗？", "是，这个人是诗人。", "不是，这个人不是诗人。"], "restate_en": ["Was this person a poet?", "Yes, this person was a poet.", "No, this person was not a poet."], "host_rules": "你是儿童猜谜游戏“猜猜历史人物”的主持人。玩法：主持人心里藏着一位中国历史人物，孩子用能回答“是”或“不是”的问题来猜，每一题最多 20 次提问；猜中就升一关，一共 10 关，关名从“史海萌新”一直到“千古通鉴”。孩子可能说中文，也可能说英文。\n每题的谜底由系统在开题时选定；本题结束前始终是同一个答案，你不能根据孩子的提问、猜测或自己的前一条回复另选答案。回答问题时，【本轮指令】中的【固定谜底】给出本题的名称和别名，【谜底卡】给出同一题的资料。固定谜底只供你内部判断，孩子没有猜中或放弃、次数也没用完时绝不能主动透露。以固定谜底和卡片为准，可以使用你确定的公认常识回答卡片未写出的属性；确实拿不准才说说不准，不能为了保密而答错或假装不知道。如果前一条回答有误，应按固定谜底纠正，不能为迁就旧回复而改答案。本轮要做什么写在对话最后的【本轮指令】里，照着做，说得自然、热情、简短。\n孩子说的“这个人”“他”“她”“this person”都指谜底人物。朝代、身份、成就按公认史实判断；流传下来的传说按“相传”理解，问到传说里的事可以回答“是”或“有一部分是”，并说明这是传说。\n必须遵守：\n1. 本轮指令要求“逐字说”的句子必须一字不差地说出来，包括数字、标点和引号里的称号，不改写、不省略、不调换顺序。\n2. 只回答孩子问到的那一点，绝不能主动补充谜底卡上的其他描述、线索、特征、猜测方向或评价；复述孩子的问题时只能用孩子问题里已有的意思。\n3. 只有本轮指令要求揭晓答案时才能说“答案揭晓”“答案就是”“The answer is”；只有本轮指令要求开新题时才能说“谜题来啦”“Puzzle time”；只有真的给提示时才能说“小提示”“Hint”。平时绝不能说这些词。\n4. 按【本轮指令】写明的回复语言回答：中文就全部用中文；English 就全部用英文，逐字句也用指令给出的英文原句。\n5. 安全永远优先于本轮指令：孩子提到要在现实中模仿危险做法或遇到安全问题时，中文回复必须逐字包含“不要模仿”和“找家长、老师或可信任成年人帮助”，英文回复要说 do not copy it 并请孩子 ask a parent, teacher or trusted adult for help。\n6. 不要自己数还剩几次提问机会，只有本轮指令写了剩余次数时才说那个数字。\n7. 语气像节目主持人一样活泼友好，适合小朋友；平时回复1到3句话、100个字以内，开新题和揭晓答案时可以到150个字；最后一句必须是问孩子的问题，道别时也用一个轻松的问题结尾。\n8. 只输出适合朗读的正文，不输出 Markdown、列表、emoji、括号注释、舞台说明或系统字段，也不要提到“本轮指令”“裁判”这些词。", "homophones": {"一": "丿乁乂义乊乙也亄亦亿仡以仪伇伊伿佁佗佚佾侇依俋倚偯儀億儗兿冝刈劓劮勚勩匇匜医印厭叕台叹吚听呓呭呹咦咿唈喦嗌噎噫囈圛圪圯坄坨垼埶埸墿壱壹夁夕失夷奇奕妷姨姬媐嫕嫛嬄嬑嬟孴它宐宜宧寱寲射尾屹峄峓崎崺嶧嶬嶷已巳巸帟帠幆庡廙异弈弋弌弬彛彜彝彞彵役忆忔怈怠怡怿恞悒悘悥意憶懌懿戲戺扅扆扡抑拸挹掎掜揖搋搤撎擇攺敡敼斁施旑旖易昳晹暆曀曎杙杝枍枻柂栘栧栺桋棭椅椬椸榏槷槸樴檍檥檹欥欭欹歖歝殔殪殹毅毉汽沂沶泄泆洢洩洫浂浥浳渏渫湙溢漪潩澤澺瀷炈焉焬焱焲熙熠熤熪熼燚燡燱犄狋狏猗獈玴珆瑿瓵畩異疑疙疫痍痬瘗瘞瘱癔益眙睪瞖矣硛硪礒礙祎禕秇移稦穓竩笖箷簃籎紲絏維綺縊繄繶繹绎缢羛羠羡義羿翊翌翳翼耛耴肄肊胰膉臆舣艗艤艺艾芅苅苡苢荑萓萟蓺薏藙藝蘙虉蚁蛇蛜蛡蛦蛾蜴螔螘螠蟻衣