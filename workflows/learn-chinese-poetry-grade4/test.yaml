apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: learn-chinese-poetry-grade4-test
spec:
  driver: eino
  toolkit:
    tool_ids: []
  eino:
    graph:
      name: learn-chinese-poetry-grade4-test-relay
      compile:
        node_trigger_mode: any_predecessor
        max_run_steps: 8
      state:
        fields:
        - name: tester-route
          type: string
          merge: replace
        - name: tester-message
          type: string
          merge: replace
        - name: tester-det
          type: string
          merge: replace
        - name: prompt-system
          type: string
          merge: replace
        - name: prompt-user
          type: string
          merge: replace
        - name: judge-messages
          type: messages
          merge: replace
        - name: model-text
          type: string
          merge: replace
        - name: answer
          type: string
          merge: replace
      nodes:
      - id: route-turn
        type: script
        inputs:
          text:
            from: input.text
          messages:
            from: input.messages
        outputs:
          route: tester-route
          message: tester-message
          det: tester-det
          system: prompt-system
          user: prompt-user
        language: starlark
        entrypoint: run
        source: |
          REQUESTS = ["请从指定中文开场开始。", "我们刚学了《题西林壁》，你给我讲讲吧。", "你能把这首诗完整地念给我听吗？", "这首诗是在什么情况下写的？是有记载的，还是一般认为的，还是传说？", "诗人写这首诗那天中午吃的是什么？", "我还会背《静夜思》，你能念给我听吗？", "请记住：我今天学会了《题西林壁》，下次想学《出塞》。只确认你已经记住。", "重连后，请只说我下次想学哪首诗。"]
          INTENTS = ["", "", "", "", "", "", "", ""]
          CHECKPOINTS = ["opening", "poem-intro", "recite-exact", "background-label", "unknown-boundary", "other-grade-poem", "memory-store", "memory-recall"]
          CONTRACTS = ["必须逐字符合指定中文开场；不得含Markdown、列表、emoji或舞台说明；15-240字", "必须承接这首诗并正确说出作者苏轼；只讲知识卡内的作者或背景；最多一个问题；30-360字", "必须逐字念出课本正文“横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。”，不得改字漏字；20-360字", "必须按知识卡讲背景“元丰七年（1084）苏轼由黄州改任汝州，途经九江游庐山，题写于西林寺墙壁。”，并说明它属于通说；不得添加知识卡外的细节；20-360字", "知识卡没有这个细节，必须明确说没有记载或不确定，不得编造食物、地名或人名，也不得用可能、大概去猜；10-320字", "《静夜思》是一年级的诗，必须正常念出全文“床前明月光，疑是地上霜。举头望明月，低头思故乡。”，不得婉拒；20-360字", "必须确认已记住今天学会的诗和下次想学《出塞》（复述措辞可以不同，下一轮重连后再严格核对）；4-320字", "重载后必须从长期记忆准确回忆《出塞》；只回答诗名；2-200字"]
          CHECKS = [{"required": ["你好呀，我是古诗小书童。我们来聊聊四年级的古诗吧，说一首你学过的，我给你讲讲它背后的故事。"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 15, "max_runes": 240}, {"required": ["苏轼"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 30, "max_runes": 360}, {"required": ["横看成岭侧成峰", "远近高低各不同", "不识庐山真面目", "只缘身在此山中"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["一般认为", "一种说法", "有人认为", "据说", "通常认为", "大多认为", "说法"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["没有记载", "没有留下记载", "没有相关记载", "没有确切记载", "不确定", "不知道", "查不到", "没有资料", "无法确定", "没法确定", "没有确切"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 10, "max_runes": 320}, {"required": ["床前明月光", "疑是地上霜", "举头望明月", "低头思故乡"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 20, "max_runes": 360}, {"required": [], "required_any": [["记住", "记下", "记好", "记得"]], "forbidden": ["###", "```", "- ", "* "], "min_runes": 4, "max_runes": 320}, {"required": ["出塞"], "required_any": [], "forbidden": ["###", "```", "- ", "* "], "min_runes": 2, "max_runes": 200}]
          RULES = "你是 `learn-chinese-poetry-grade4` 的专属验收 Workflow，不是目标角色。指定中文开场是：你好呀，我是古诗小书童。我们来聊聊四年级的古诗吧，说一首你学过的，我给你讲讲它背后的故事。 体验要求：古诗小书童陪孩子拓展课本古诗，念知识卡里的诗必须与课本正文逐字一致；背景要区分有记载、一般认为和传说；知识卡没有的细节必须承认没有记载或不确定，不得编造；孩子提到的任何诗都要正常讲、正常念，婉拒属于失败。本路线使用的知识卡条目：《题西林壁》宋·苏轼，正文“横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。”，背景（通说）：元丰七年（1084）苏轼由黄州改任汝州，途经九江游庐山，题写于西林寺墙壁。。《静夜思》唐·李白，正文“床前明月光，疑是地上霜。举头望明月，低头思故乡。”。《出塞》唐·王昌龄。知识卡没有记录诗人写诗那天吃了什么。 目标可用的完整知识卡如下，其中任何内容都不算编造，知识卡以外的人物、年代、历史、数字和情节才算：常识：绝句每首四句，属于唐代成熟的“近体诗”。五言绝句每句5个字、共20字；七言绝句每句7个字、共28字。 常识：律诗每首八句：五言律诗共40字，七言律诗共56字；第二、四、六、八句要押韵，格律要求很严。 常识：“五言”指每句五个字，“七言”指每句七个字，例如《登鹳雀楼》是五言绝句，《暮江吟》是七言绝句。 常识：《全唐诗》是清代康熙年间（1705年开始编）奉皇帝命令编成的唐诗总集，共900卷，收诗四万八千九百多首、诗人两千二百多位。 常识：李白被后人誉为“诗仙”，杜甫被尊为“诗圣”，两人合称“李杜”。 常识：《唐诗三百首》是清代孙洙（号蘅塘退士）和夫人徐兰英编的唐诗选本，1763年前后成书，原本收77位诗人的311首诗，后来的版本有增补。 作者 白居易：白居易（772—846），字乐天，号香山居士。 作者 苏轼：苏轼（1037—1101），字子瞻，号东坡居士，北宋文学家、书画家。 作者 王昌龄：王昌龄（约698—约756），字少伯，盛唐边塞诗人，卒年说法不一。 作者 李清照：李清照（1084—约1155），号易安居士，宋代著名女词人。 作者 卢钺：作者一般认为是卢钺（号梅坡），他的生平事迹记载很少。 作者 王翰：王翰是盛唐诗人，并州晋阳（今山西太原）人，性格豪放。 作者 李商隐：李商隐（约813—约858），与杜牧并称“小李杜”，诗意常含蓄难懂。 作者 李白：李白比孟浩然小十二岁，非常敬重他，还写过《赠孟浩然》。 作者 高适：高适（约704—765），边塞诗人，与岑参并称“高岑”，官做到节度使。 作者 范成大：范成大（1126—1193），号石湖居士，曾出使金国而不辱使命。 作者 杨万里：杨万里（1127—1206），号诚斋，与陆游、范成大、尤袤并称“中兴四大诗人”。 作者 辛弃疾：辛弃疾（1140—1207），号稼轩，年轻时曾率五十余骑闯入金营擒拿叛徒张安国。 作者 卢纶：卢纶（约739—约799），是“大历十才子”之一。 作者 王冕：王冕（1287—1359，生年一说1310），农家出身，小时放牛时偷偷去学堂听书，后以画梅著名。 作者 罗隐：罗隐（833—910）考了十几次进士都没考中，后来改名“隐”。 《暮江吟》唐·白居易｜四年级上册｜正文：一道残阳铺水中，半江瑟瑟半江红。可怜九月初三夜，露似真珠月似弓。｜背景（通说）：一般认为约作于长庆二年（822），白居易赴杭州任刺史途中。｜拓展：农历初三前后的月亮是弯弯的“蛾眉月”，太阳落山后出现在西边低空。 《题西林壁》宋·苏轼｜四年级上册｜正文：横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。｜背景（通说）：元丰七年（1084）苏轼由黄州改任汝州，途经九江游庐山，题写于西林寺墙壁。｜拓展：西林寺在江西庐山西北麓，东晋时创建，东边不远就是东林寺。｜异文：“各不同”一作“总不同”等，“只缘”一作“祇缘”。 《出塞》唐·王昌龄｜四年级上册｜正文：秦时明月汉时关，万里长征人未还。但使龙城飞将在，不教胡马度阴山。｜背景（通说）：“出塞”是乐府旧题；一般认为是王昌龄早年游历西北边塞时所作。｜拓展：阴山是横亘在今内蒙古中部的山脉，东西长1200多公里。｜异文：原题《出塞二首》，课文选第一首。 《夏日绝句》宋·李清照｜四年级上册｜正文：生当作人杰，死亦为鬼雄。至今思项羽，不肯过江东。｜背景（通说）：一般认为作于北宋灭亡、宋室南渡以后，借项羽宁死不肯过江东抒发感慨。｜拓展：安徽和县乌江镇附近有霸王祠，传统上认为那里是项羽自刎的地方。｜异文：诗题一作《乌江》；“作”“为”二字古本有互换。 《雪梅》宋·卢钺｜四年级上册｜正文：梅雪争春未肯降，骚人阁笔费评章。梅须逊雪三分白，雪却输梅一段香。｜背景（史实）：写作时间、地点没有确切记载｜拓展：梅花在冬末早春开放，常常和雪同时出现，所以才有“梅雪争春”。｜异文：原为《雪梅二首》其一；作者常署“卢梅坡”，教材作“卢钺”。“降”读xiáng。 《凉州词》唐·王翰｜四年级上册｜正文：葡萄美酒夜光杯，欲饮琵琶马上催。醉卧沙场君莫笑，古来征战几人回？｜背景（史实）：《凉州词》是唐代曲名，起源于凉州（今甘肃武威），写作时间没有确切记载。｜拓展：教材注释说，夜光杯是用美玉做的酒杯，传说夜里能发光。｜异文：原题共两首，课本选的是第一首；第一句也有写作“黄沙直上白云间”的。 《赠刘景文》宋·苏轼｜四年级上册·日积月累｜正文：荷尽已无擎雨盖，菊残犹有傲霜枝。一年好景君须记，最是橙黄橘绿时。｜背景（通说）：一般认为作于1090年初冬，苏轼在杭州时写给好友刘景文，勉励对方。｜拓展：“擎雨盖”指荷叶，像一把能举起来挡雨的伞。｜异文：“最是”一作“正是”。旧版在三年级上册课文（古诗三首），修订版移入四年级上册语文园地一。 《嫦娥》唐·李商隐｜四年级上册·日积月累｜正文：云母屏风烛影深，长河渐落晓星沉。嫦娥应悔偷灵药，碧海青天夜夜心。｜背景（史实）：写作时间没有确切记载，诗的寓意历来说法不一。｜拓展：我国的探月工程就叫“嫦娥工程”，探测器叫“嫦娥一号”“嫦娥五号”等。 《黄鹤楼送孟浩然之广陵》唐·李白｜四年级上册·日积月累｜正文：故人西辞黄鹤楼，烟花三月下扬州。孤帆远影碧空尽，唯见长江天际流。｜背景（通说）：一般认为是730年春李白在江夏送孟浩然去扬州时所作，一说728年。｜拓展：黄鹤楼在今湖北武汉，广陵就是今天的江苏扬州。｜异文：“唯见”一作“惟见”；“孤帆远影碧空尽”一作“孤帆远映碧山尽”。 《别董大》唐·高适｜四年级上册·日积月累｜正文：千里黄云白日曛，北风吹雁雪纷纷。莫愁前路无知己，天下谁人不识君？｜背景（通说）：一般认为747年冬高适与琴师董庭兰在睢阳相会后分别时所作。｜拓展：唐朝人常按排行称呼朋友，“董大”就是姓董、排行老大。｜异文：原为《别董大二首》其一。 《四时田园杂兴（其二十五）》宋·范成大｜四年级下册｜正文：梅子金黄杏子肥，麦花雪白菜花稀。日长篱落无人过，惟有蜻蜓蛱蝶飞。｜背景（史实）：范成大晚年退居苏州石湖，1186年写成《四时田园杂兴》六十首。｜拓展：这组诗共60首，分春日、晚春、夏日、秋日、冬日五组。｜异文：“惟有”一作“唯有”。 《宿新市徐公店》宋·杨万里｜四年级下册｜正文：篱落疏疏一径深，树头新绿未成阴。儿童急走追黄蝶，飞入菜花无处寻。｜背景（通说）：一般认为是1192年杨万里途经新市（今浙江德清一带）住宿时所作。｜拓展：黄蝴蝶飞进黄色油菜花里，颜色一样，所以找不到了。｜异文：原为《宿新市徐公店二首》其二；“树头新绿”一作“树头花落”。 《清平乐·村居》宋·辛弃疾｜四年级下册｜正文：茅檐低小，溪上青青草。醉里吴音相媚好，白发谁家翁媪？大儿锄豆溪东，中儿正织鸡笼。最喜小儿亡赖，溪头卧剥莲蓬。｜背景（史实）：辛弃疾闲居带湖（今江西上饶）时所作。｜拓展：词牌“清平乐”的“乐”读yuè，是音乐的“乐”。｜异文：这是一首词；“亡赖”同“无赖”，这里指顽皮。 《芙蓉楼送辛渐》唐·王昌龄｜四年级下册｜正文：寒雨连江夜入吴，平明送客楚山孤。洛阳亲友如相问，一片冰心在玉壶。｜背景（通说）：一般认为作于王昌龄任江宁丞时，在润州（今镇江）芙蓉楼送别友人辛渐。｜拓展：“一片冰心在玉壶”：像冰装在玉壶里一样清清白白。｜异文：原为《芙蓉楼送辛渐二首》其一。 《塞下曲》唐·卢纶｜四年级下册｜正文：月黑雁飞高，单于夜遁逃。欲将轻骑逐，大雪满弓刀。｜背景（史实）：原是《和张仆射塞下曲六首》中的第三首，写将士雪夜追敌。｜拓展：“单于”读chán yú，是古代匈奴首领的称呼。｜异文：原题《和张仆射塞下曲六首》，此为其三。 《墨梅》元·王冕｜四年级下册｜正文：我家洗砚池头树，朵朵花开淡墨痕。不要人夸好颜色，只留清气满乾坤。｜背景（通说）：这是王冕题在自己所画墨梅上的诗，具体写作时间说法不一。｜拓展：墨梅是只用墨汁画的梅花，所以花朵是淡淡的墨色。｜异文：“我家”一作“吾家”，“朵朵”一作“个个”，“好颜色”一作“颜色好”。 《蜂》唐·罗隐｜四年级下册·日积月累｜正文：不论平地与山尖，无限风光尽被占。采得百花成蜜后，为谁辛苦为谁甜？｜背景（史实）：写作时间、地点没有确切记载｜拓展：蜜蜂把花蜜带回蜂巢，扇动翅膀让水分蒸发，才酿成蜂蜜。 《独坐敬亭山》唐·李白｜四年级下册·日积月累｜正文：众鸟高飞尽，孤云独去闲。相看两不厌，只有敬亭山。｜背景（通说）：敬亭山在今安徽宣城；一说作于753年李白游宣城时，写作时间有争议。｜拓展：“相看两不厌”：诗人和山互相看着都不嫌烦，把山当成了朋友。｜异文：“只有”一作“唯有”。"
          PERSONA = ""
          JUDGE_DIMS = ["instruction_following", "continuity", "factuality", "non_repetition"]
          OFFSET = 0
          N = 8
          WHITESPACE = " \t\n\r　"
          PUNCT = "，。！？、；：“”‘’（）《》〈〉【】『』「」—…·～,.!?;:'\"()[]{}<>-_/\\|`~@#$%^&*+=·"
          DIGITS = {"０": "0", "１": "1", "２": "2", "３": "3", "４": "4", "５": "5", "６": "6", "７": "7", "８": "8", "９": "9", "零": "0", "一": "1", "二": "2", "三": "3", "四": "4", "五": "5", "六": "6", "七": "7", "八": "8", "九": "9"}
          def rune_count(text):
              n = 0
              for _ in text.codepoints():
                  n += 1
              return n

          def normalize(text, drop_punct):
              out = []
              for ch in text.codepoints():
                  if ch in WHITESPACE:
                      continue
                  if drop_punct and ch in PUNCT:
                      continue
                  if ch in DIGITS:
                      out.append(DIGITS[ch])
                      continue
                  out.append(ch.lower())
              return "".join(out)

          def is_sentinel(value):
              if value in ["```", "###", "-"]:
                  return True
              if len(value) < 2 or not value.endswith("."):
                  return False
              for ch in value[:-1].codepoints():
                  if ch not in "0123456789":
                      return False
              return True

          def forbidden_hit(text, needle):
              trimmed = needle.strip()
              if trimmed.endswith(":") or trimmed.endswith("："):
                  return normalize(trimmed, False) in normalize(text, False)
              normalized = normalize(needle, True)
              if normalized == "" or is_sentinel(trimmed):
                  return trimmed in text
              return normalized in normalize(text, True)

          def deterministic_failures(index, text):
              spec = CHECKS[index]
              failures = []
              plain = normalize(text, False)
              for fact in spec.get("required", []):
                  if normalize(fact, False) not in plain:
                      failures.append("required:" + fact)
              for group in spec.get("required_any", []):
                  found = False
                  for fact in group:
                      if normalize(fact, False) in plain:
                          found = True
                          break
                  if not found:
                      failures.append("required_any:" + "|".join(group))
              for fact in spec.get("forbidden", []):
                  if forbidden_hit(text, fact):
                      failures.append("forbidden:" + fact)
              count = rune_count(text)
              if spec.get("min_runes", 0) > 0 and count < spec["min_runes"]:
                  failures.append("min_runes:" + str(count) + "<" + str(spec["min_runes"]))
              if spec.get("max_runes", 0) > 0 and count > spec["max_runes"]:
                  failures.append("max_runes:" + str(count) + ">" + str(spec["max_runes"]))
              return failures

          def aligned_rounds(messages):
              # Returns [(index, request_text, reply_text)] aligned from the newest message
              # backwards so a truncated History window still maps later rounds correctly.
              users = []
              previous_assistant = ""
              for message in messages:
                  role = message.get("role", "")
                  content = message.get("content", "")
                  if role == "assistant":
                      previous_assistant = content
                  elif role == "user":
                      users.append((previous_assistant, content))
              rounds = []
              total = len(users)
              for position in range(total):
                  index = N - 1 - (total - 1 - position)
                  if index < 0:
                      continue
                  request = REQUESTS[index]
                  if request == "":
                      request = users[position][0]
                  rounds.append((index, request, users[position][1]))
              return rounds

          def output_index(messages):
              count = 0
              last = ""
              for message in messages:
                  if message.get("role", "") == "assistant":
                      count += 1
                      last = message.get("content", "").strip()
              index = count
              if last != "":
                  for j in range(N):
                      if REQUESTS[j] != "" and REQUESTS[j].strip() == last and j + 1 - OFFSET > index:
                          index = j + 1 - OFFSET
              return index

          def recent_transcript(messages, limit):
              lines = []
              for message in messages[-limit:]:
                  role = message.get("role", "")
                  label = "玩家" if role == "assistant" else "目标"
                  lines.append(label + "：" + message.get("content", "").strip())
              return "\n".join(lines)

          def run(input):
              messages = input["messages"]
              k = output_index(messages)
              request_index = k + OFFSET
              if request_index < N:
                  if REQUESTS[request_index] != "":
                      return {
                          "route": "scripted",
                          "message": REQUESTS[request_index],
                          "det": "",
                          "system": "你是测试脚手架。只回复 OK。",
                          "user": "OK",
                      }
                  system = "\n".join([
                      RULES,
                      "",
                      "现在你扮演模拟玩家。" + PERSONA,
                      "根据给定意图，只输出一句自然的玩家话语；不得回答它、不得添加对话中不存在的名字、数字、事件或证据，不得削弱意图约束，不得提及测试。只输出这句话，不要引号、前缀或解释。",
                  ])
                  user = "意图：" + INTENTS[request_index] + "\n\n最近对话：\n" + recent_transcript(messages, 6)
                  return {"route": "player", "message": "", "det": "", "system": system, "user": user}
              rounds = aligned_rounds(messages)
              failures = []
              blocks = []
              for round in rounds:
                  index = round[0]
                  for failure in deterministic_failures(index, round[2]):
                      failures.append(CHECKPOINTS[index] + " " + failure)
                  blocks.append("\n".join([
                      "【第" + str(index + 1) + "轮 " + CHECKPOINTS[index] + "】",
                      "契约：" + CONTRACTS[index],
                      "玩家：" + round[1],
                      "目标：" + round[2],
                  ]))
              system = "\n".join([
                  RULES,
                  "",
                  "这是最后一轮。你只看到完整对话记录：标注“玩家”的是测试方发出的消息，标注“目标”的是被测 Workflow 的回复。",
                  "请依据每一轮的契约逐轮判断以下维度：" + "、".join(JUDGE_DIMS) + "。确定性字数、关键词、顺序和延迟门槛由外部负责，你只判断语义：连续性、事实边界、指令遵循、不重复、玩家自主权和安全。",
                  "确定性检查（字数、关键词、顺序、延迟）已由外部完成：本轮若未列出失败，就不得以这些理由判 FAIL，也不得自行重新计数。",
                  "判 FAIL 必须写明具体轮号和该轮回复中的具体缺陷原文；举不出具体轮号和原文时一律判 PASS。",
                  "不得因为风格偏好、篇幅、语气或可以更好判坏语义合格的回复；但契约明确暴露的事实边界被违反时必须判 FAIL。",
                  "先用不超过200字说明依据，最后一行只写 PASS 或 FAIL，不要其他字符。",
              ])
              user_parts = ["完整测试对话（按时间顺序，共 " + str(len(rounds)) + " 轮可见）：", ""] + blocks
              if len(failures) > 0:
                  user_parts.append("")
                  user_parts.append("确定性检查已发现失败（最终裁决将为 FAIL）：" + "；".join(failures))
              user_parts.append("")
              user_parts.append("请按规则裁决，最后一行只写 PASS 或 FAIL。")
              return {
                  "route": "judge",
                  "message": "",
                  "det": "；".join(failures),
                  "system": system,
                  "user": "\n".join(user_parts),
              }
        limits:
          max_execution_steps: 2000000
          timeout: 2s
          max_input_bytes: 1048576
          max_output_bytes: 262144
      - id: build-prompt
        type: prompt
        inputs:
          system:
            from: prompt-system
          user:
            from: prompt-user
        outputs:
          messages: judge-messages
        format: f_string
        messages:
        - role: system
          template: '{system}'
        - role: user
          template: '{user}'
      - id: judge-model
        type: chat_model
        inputs:
          messages:
            from: judge-messages
        outputs:
          text: model-text
        model: learn-chinese-poetry-grade4-test.model
        max_tokens: 512
        temperature: 0
      - id: finalize
        type: script
        inputs:
          route:
            from: tester-route
          message:
            from: tester-message
          det:
            from: tester-det
          model_text:
            from: model-text
        outputs:
          answer: answer
        language: starlark
        entrypoint: run
        source: |
          def verdict_from(text):
              lines = []
              for line in text.strip().split("\n"):
                  if line.strip() != "":
                      lines.append(line.strip())
              last = lines[-1] if len(lines) > 0 else ""
              if "PASS" in last and "FAIL" not in last:
                  return "PASS"
              if "FAIL" in last:
                  return "FAIL"
              if "PASS" in text and "FAIL" not in text:
                  return "PASS"
              return "FAIL"

          def run(input):
              route = input["route"]
              if route == "scripted":
                  return {"answer": input["message"]}
              if route == "player":
                  text = input["model_text"].strip()
                  first = text.split("\n")[0].strip().strip("“”\"'")
                  if first == "":
                      first = "请继续。"
                  return {"answer": first}
              if input["det"] != "":
                  return {"answer": "FAIL 确定性检查：" + input["det"]}
              verdict = verdict_from(input["model_text"])
              if verdict == "PASS":
                  return {"answer": "PASS"}
              return {"answer": "FAIL 裁判：" + input["model_text"].strip()[:400]}
        limits:
          max_execution_steps: 200000
          timeout: 500ms
          max_input_bytes: 262144
          max_output_bytes: 65536
      edges:
      - from: start
        to: route-turn
      - from: route-turn
        to: build-prompt
      - from: build-prompt
        to: judge-model
      - from: judge-model
        to: finalize
      - from: finalize
        to: end
      branches: []
      outputs:
      - node: finalize
        field: answer
        name: assistant
        mime_type: text/plain
        primary: true
    conversation:
      starts: peer
    limits:
      max_output_bytes: 4194304
