# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for flowcraft-story-robinson-crusoe,
# So that every reachable role path produces text and non-empty synthesized audio.
version: gizclaw.test/v1alpha1
name: story-robinson-crusoe.flowcraft.roles
clients:
  narrator: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  robinson: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  friday: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
  narrator_workspace: {direction: input, type: string, generate: token}
  robinson_workspace: {direction: input, type: string, generate: token}
  friday_workspace: {direction: input, type: string, generate: token}
repeat: 1
timeout: 12m
steps:
- id: register_narrator
  client: narrator
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: ${narrator_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-robinson-crusoe
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${narrator_workspace}"}}
- id: register_robinson
  client: robinson
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_robinson_workspace
  client: robinson
  rpc:
    method: server.workspace.create
    request:
      name: ${robinson_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-robinson-crusoe
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_robinson_workspace
  client: robinson
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${robinson_workspace}"}}
- id: register_friday
  client: friday
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_friday_workspace
  client: friday
  rpc:
    method: server.workspace.create
    request:
      name: ${friday_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-robinson-crusoe
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_friday_workspace
  client: friday
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${friday_workspace}"}}
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: "请由旁白承接当前故事，只推进一个可见线索。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 旁白}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_robinson
  client: robinson
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让鲁滨逊亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 鲁滨逊}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_friday
  client: friday
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让星期五亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 星期五}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
finally:
- id: stop_narrator_run
  client: narrator
  rpc: {method: server.run.stop, request: {}}
- id: delete_narrator_workspace
  client: narrator
  rpc: {method: server.workspace.delete, request: {name: "${narrator_workspace}"}}
- id: delete_narrator_peer
  client: narrator
  rpc: {method: server.peer.delete, request: {}}
- id: stop_robinson_run
  client: robinson
  rpc: {method: server.run.stop, request: {}}
- id: delete_robinson_workspace
  client: robinson
  rpc: {method: server.workspace.delete, request: {name: "${robinson_workspace}"}}
- id: delete_robinson_peer
  client: robinson
  rpc: {method: server.peer.delete, request: {}}
- id: stop_friday_run
  client: friday
  rpc: {method: server.run.stop, request: {}}
- id: delete_friday_workspace
  client: friday
  rpc: {method: server.workspace.delete, request: {name: "${friday_workspace}"}}
- id: delete_friday_peer
  client: friday
  rpc: {method: server.peer.delete, request: {}}
report:
  redact: [registration_token]
