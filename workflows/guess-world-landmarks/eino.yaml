 "亲倩倾傾儬凊剠勍卿啨圊埥声夝寈庆庼廎情慶掅擎擏晴暒棾樈檠檾櫦殑殸氢氫氰涇淸渹漀濪甠硘硜碃磬箐精綪綮罄胜苘莔葝蜻親請謦请軽輕轻郬鑋靑青靘頃顷鯖鯨鲭鶄黥", "渠": "且举乬仇伹佉佝佢侷俥俱倨倶僪具冣凥刞剧劇劬勮匊匤区區厺去取句告呿咀唟啹坥埧埾壉姐姖娵娶婅婮寠局居屈屦屨岖岠岨岴崌嶇巈巨巪弆忂怇怐怚惧愳憈懅懼戌戵抅抾拒拘拠拱挙挶捄据掬揈揟據擧敺斪昛曲朐枸柜桔梮椇椈椐榉榘橘檋櫸欅欋欪歫毆毩毱氍沮泃泦洰浀涺淗淭湨澽灈炬烥焌焗焣爠犋犑狊狙珇琚璖璩疽痀癯眗瞿矩砠磲祛租秬窭窶竘竬筁筥簍簴籧粔粬粷紶組絇罝翑翵耝耟聚聥胊胠脥腒臄臞舉艍苣苴莒菃菊菹萭葋蒟蒩蓻蔞蕖蘜蘧處虡蚷蚼蛆蛐蜛蜡蝺螶蟝蠷蠼衐衢袓袪裾襷覰覷覻觑詎詓詘誇誳諊讵诎豦貗趄趉趋趍趜趡趣趨足跔跙距跼踘踞踽蹫蹻躆躣躯躹軀車軥輂车迲遽邭郰郹鄒鄹醵鉅鉏鉤鋤鋦鋸鐻鑺钜锔锯镼閰閴闃阒阹陱雎雛鞠鞫颶飓駆駈駏駒駶騶驅驕驧驱驹髷鬻魼鮈鮍鮔鰸鱋鴝鴡鵙鵴鶋鶌鶪鸜鸲麮麯麴麹黢鼁鼩鼰鼳齟齲龃龋", "港": "亢仜伉共冈冮刚剛厷叿吰吽呍哄哅唝嗊嚝垬堈堽妅娂宏宖屸岗岡崗巆弘彋愩戅戆戇扛抗掆揈撔晎杠棡槓汪汯泓洚洪浤浲渱渹溝潂澋澒灴烘焢焵焹牨犅犺玒玜瓨疘矼硔硡碙竑竤筻篊粠紅紘紭綋綱红纮纲缸罁罓罡翃翝耾肛肮舼苰荭葒葓蕻薨虹訇訌謍讧谹谼谾軣輷轟轰釭鈜鉷銾鋐鋼鍧鎠钢閎閧闀闂闳阬霐霟鞃頏鬨魟鴻鸿黉黌鿍", "湖": "乎乕乥乯互俿冱冴匢匫呼和唬唿喖嗀嗃嘑嘝嚛囫垀壶壷壺姱婟媩嫭嫮寣岵帍幠弖弧忽怘怙恗惚惡戏戯戲戶户戸戽扈抇护搰摢擭斛昈昒曶枑核楛楜槲槴欻歑汩汻沍沪泘洿浒淈淲淴滬滸滹濩瀫烀焀煳熩狐猢琥瑚瓠瓡瓳礐祜穫笏箎箶簄粐糊絗綔縎縠羽胍胡膴芐芔芦芴苦苸萀葫蔛蔰虍虎虖虝蝴螜衚觳觷許謼護许豰軤轷鄠醐鈷鋘錿鍙鍸隺雇雐雽韄頀頶餬鬍魱鯱鰗鱯鳠鳸鴩鵠鶘鶦鶮鶻鸌鹄鹕鹘鹱", "湾": "万丸倇免刓剜卍卐唍园埦塆壪夗夘妧娩婉婠完宛岏帵弯彎忨惋惌抏挽捖捥掔晚晥晩晼朊杤梚椀槾汍涴潫澫灣烷玩琓琬畹皖盌睕瞣碗笂箢紈絻綄綩綰纨绾翫脕脘腕芄莞莧莬菀萖萬蔓薍蚖蜿蟃豌貦貫贃贎踠輐輓鄤鋄鋔鋺錽鎫關頑顽骫魭", "湿": "世丗乨乭亊事什仕似佦使侍兘冟势勢匙十卋厔叓史呞呩咶唑啇嗜嘘噬埘埶堤塒士失奭始姼媞嬕实実室宩宲寔實寺尸屍屎峕峙崼嵵市师師式弑弒彖徥忕忯恀恃惿戺拭拾挈提揓斯施时旹是昰時枾柹柿栻楴榁榯檡殖殺氏汁沶浉液湜湤溡溮溼澤澨濕灑炻烒煶狧狮狶獅瑡畤痑眂眎眡睗矢石示礻祏秲竍笶筮箷篒篩簭籂絁繹耆肢舍舐舓莳葹蒒蒔蓍虱蚀蝕蝨螫褆褷襫襹視视觢訑試詩誓諟諡謚識识试诗谥豉豕貰贳赫跩踶軾轼辻适逝遈遞適遰遾邿郝酾醳釃釈释釋釶鈰鉂鉃鉇鉈鉐鉽銴鍉鍦鎩铈食飠飭飾餙餝饣饰馶駛驶魳鮖鯴鰘鰣鰤鲥鲺鳲鳾鶳鸤鼫鼭齛", "源": "傆允元円冤剈原厡厵员咽員喛噮囦园圆圎園圓圜垣垸塬夗妧妴媛媴嫄嫚嬽宛寃弲怨悁惌愿捐掾援杬棩楥榞榬橼櫞沅涓涴淵渁渆渊渕湲溒灁焆爰猨猿獂瑗畹盶眢禐穿笎箢緣縁缘羱肙芫苑茒葾蒝蒬薗薳蚖蜎蜵蝝蝯螈衏袁裫裷褑褤謜貟贠輐轅辕远逺遠邍邧酛鈨鋺鎱阮院隕願駌騵魭鳶鴛鵷鶢鶰鸢鸳鹓黿鼋鼘鼝", "滨": "份傧儐宾彬摈擯攽斌梹椕槟檳殡殯氞汃浜濒濱濵瀕玢瑸璸砏繽缤膑臏虨訜豩豳賓賔贇邠鑌镔霦頻顮髌髕髩鬂鬓鬢", "漠": "万么伯佰冒劘劰勿唜嗼嘿嚤嚩嚰圽塻墨妺嫫嫼嬷寞尛帓帕帞庅怽懡戂抹摩摸摹撫擵攠无昧昩暯末枺模橅歾歿殁没沫湐瀎無爅狢獏瘼百皌眜眽眿瞐瞙砞磨礳秣粖糢絈絔縸纆耱脈脉膜艒茉莈莫蓦藐藦蘑蛨蟆蟔袜袹謨謩譕谟貃貈貉貊貌貘鄚銆鏌镆陌靺鞨饃饝馍驀髍魔魩魹麽默黙", "漪": "一丿乁乂义乊乙也亄亦亿仡以仪伇伊伿佁佗佚佾侇依俋倚偯儀億儗兿冝刈劓劮勚勩匇匜医印厭叕台叹吚听呓呭呹咦咿唈喦嗌噎噫囈圛圪圯坄坨垼埶埸墿壱壹夁夕失夷奇奕妷姨姬媐嫕嫛嬄嬑嬟孴它宐宜宧寱寲射尾屹峄峓崎崺嶧嶬嶷已巳巸帟帠幆庡廙异弈弋弌弬彛彜彝彞彵役忆忔怈怠怡怿恞悒悘悥意憶懌懿戲戺扅扆扡抑拸挹掎掜揖搋搤撎擇攺敡敼斁施旑旖易昳晹暆曀曎杙杝枍枻柂栘栧栺桋棭椅椬椸榏槷槸樴檍檥檹欥欭欹歖歝殔殪殹毅毉汽沂沶泄泆洢洩洫浂浥浳渏渫湙溢潩澤澺瀷炈焉焬焱焲熙熠熤熪熼燚燡燱犄狋狏猗獈玴珆瑿瓵畩異疑疙疫痍痬瘗瘞瘱癔益眙睪瞖矣硛硪礒礙祎禕秇移稦穓竩笖箷簃籎紲絏維綺縊繄繶繹绎缢羛羠羡義羿翊翌翳翼耛耴肄肊胰膉臆舣艗艤艺艾芅苅苡苢荑萓萟蓺薏藙藝蘙虉蚁蛇蛜蛡蛦蛾蜴螔螘螠蟻衣衤衪衵袂袘袣裔裛裿褘褹襗襼觺訑訲訳詍詑詒詣誃誒誼謚謻譩譯議譺讉讛议译诒诣谊豙豛豷貖貤貽賹贀贻跇跠踦軼輗輢轙轶辥辷迆迤迭迱迻逘逸遗遺邑郼酏醫醳醷釋釔釴釶鈘鈠鉇鉈鉯銕銥錡鎰鏔鐿钀钇铱镒镱阣阤陁陭隶隿雉霅霬靉靾頉頤頥顊顗颐食飴饐饴駅驛驿骮鮧鮨鯣鳦鴺鶂鶃鶍鷁鷊鷖鷧鷾鸃鹝鹢鹥黓黝黟黳齮齸", "潘": "乑亳仢仮伋伯伴佛侼僠僰冸凡凢凣判剝剥勃募勫匥半博卜卞反叛哱啵噃嚗坢墦壆奿妭姍婏媻嬎嬏孛孹審嶓帆帗帛幋幡弁彦彴忛怕愽憣懪払扳拌拍拔拚拨挬搏搫撥播擗擘攀旙旛暴服杋柈柉柏柭桲梵棥楓榑槃樊橎檗檘欂殕氾汎沜泊泛波泮洀浡淿