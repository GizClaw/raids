“沙漠之舟”。", "hints": ["它生活在沙漠里", "它能很久不喝水", "它的背上有驼峰"]}, {"zh": "河马", "en": "hippo", "aliases": ["hippopotamus"], "profile": "大嘴巴、身体圆滚滚的非洲大动物，白天大多泡在河湖里，晚上上岸吃草。", "hints": ["它生活在非洲", "它白天喜欢泡在水里", "它的嘴巴能张得特别大"]}, {"zh": "鳄鱼", "en": "crocodile", "aliases": ["鳄", "短吻鳄", "alligator"], "profile": "嘴巴长、牙齿尖、身上披着硬鳞甲的大型爬行动物，常静静地趴在水边晒太阳。", "hints": ["它是爬行动物", "它常待在水边", "它有一张长长的大嘴"]}, {"zh": "松鼠", "en": "squirrel", "aliases": ["小松鼠"], "profile": "尾巴又大又蓬松的小动物，爱在树上跳来跳去，还会把坚果藏起来过冬。", "hints": ["它很会爬树", "它爱吃坚果", "它有一条蓬松的大尾巴"]}, {"zh": "老鼠", "en": "mouse", "aliases": ["小老鼠", "耗子", "rat"], "profile": "个子小、跑得快、门牙一直在长的啮齿动物，常在夜里出来找吃的。", "hints": ["它的个子很小", "它爱在夜里活动", "它有一条细长的尾巴"]}, {"zh": "蜗牛", "en": "snail", "aliases": ["小蜗牛"], "profile": "背着螺旋形的壳慢慢爬行的软体动物，爬过的地方会留下一道亮亮的黏液。", "hints": ["它爬得很慢", "它喜欢潮湿的地方", "它背着一个螺旋形的壳"]}, {"zh": "鹦鹉", "en": "parrot", "aliases": ["鹦哥", "小鹦鹉"], "profile": "羽毛鲜艳、嘴巴弯弯的聪明鸟儿，有的能学人说话，很多人把它当宠物养。", "hints": ["它是一种鸟", "它的羽毛颜色很鲜艳", "它能学人说话"]}, {"zh": "海豚", "en": "dolphin", "aliases": ["小海豚"], "profile": "聪明友好的海洋哺乳动物，用肺呼吸，会发出声音互相交流，常跃出水面。", "hints": ["它生活在海里", "它非常聪明", "它要浮出水面换气"]}]}, {"title_zh": "自然观察员", "title_en": "Nature Watcher", "step": 7, "offset": 0, "items": [{"zh": "北极熊", "en": "polar bear", "aliases": ["白熊"], "profile": "生活在北极冰雪世界里的大熊，全身白毛，很会游泳，是最大的陆地食肉动物之一。", "hints": ["它生活在很冷的地方", "它是一种熊", "它全身都是白色的毛"]}, {"zh": "狼", "en": "wolf", "aliases": ["灰狼", "野狼"], "profile": "长得像大狗的野生猛兽，成群生活、一起打猎，常在夜里发出长长的嚎叫。", "hints": ["它是一种野兽", "它喜欢成群生活", "它常在夜里嚎叫"]}, {"zh": "狐狸", "en": "fox", "aliases": ["狐", "小狐狸", "赤狐"], "profile": "尾巴蓬松、嘴巴尖尖的小型野兽，机灵又警觉，常在故事里扮演聪明的角色。", "hints": ["它生活在野外", "它的嘴巴尖尖的", "它有一条蓬松的大尾巴"]}, {"zh": "刺猬", "en": "hedgehog", "aliases": ["小刺猬"], "profile": "背上长满尖刺的小动物，遇到危险会缩成一个刺球，喜欢在晚上出来找虫子吃。", "hints": ["它个子小小的", "它喜欢在晚上活动", "它的背上长满了刺"]}, {"zh": "蝙蝠", "en": "bat", "aliases": [], "profile": "唯一真正会飞的哺乳动物，白天倒挂着睡觉，夜里靠听回声找路和捉虫。", "hints": ["它喜欢在晚上活动", "它会飞", "它睡觉时倒挂着"]}, {"zh": "猫头鹰", "en": "owl", "aliases": ["鸮", "夜猫子"], "profile": "脸盘圆圆、眼睛大大的夜行鸟，头能转很大的角度，飞起来几乎没有声音。", "hints": ["它是一种鸟", "它喜欢在夜里活动", "它的眼睛又大又圆"]}, {"zh": "孔雀", "en": "peacock", "aliases": ["蓝孔雀", "绿孔雀", "peafowl"], "profile": "雄的能展开拖在身后的漂亮长羽毛，像一把缀满眼睛花纹的彩色大扇子。", "hints": ["它是一种鸟", "它的羽毛特别漂亮", "它会开屏"]}, {"zh": "天鹅", "en": "swan", "aliases": ["白天鹅", "黑天鹅"], "profile": "脖子细长、姿态优雅的大型水鸟，大多通体洁白，会成群迁徙，常一生成对生活。", "hints": ["它是一种鸟", "它的脖子又细又长", "它常在湖面上游"]}, {"zh": "啄木鸟", "en": "woodpecker", "aliases": [], "profile": "嘴巴又尖又硬的鸟，笃笃笃地敲开树皮捉害虫，被人们称为“森林医生”。", "hints": ["它是一种鸟", "它常在树林里", "它会用嘴敲树干"]}, {"zh": "燕子", "en": "swallow", "aliases": ["家燕", "小燕子"], "profile": "尾巴像剪刀的小鸟，春天飞回来在屋檐下用泥做窝，秋天飞到温暖的地方。", "hints": ["它是一种鸟", "它每年都会迁徙", "它的尾巴像一把剪刀"]}, {"zh": "鲨鱼", "en": "shark", "aliases": ["鲨"], "profile": "在海洋里生活了几亿年的鱼类家族，骨骼是软骨，嗅觉灵敏，种类有好几百种。", "hints": ["它生活在海里", "它是一种鱼", "它的牙齿掉了还能再长"]}, {"zh": "章鱼", "en": "octopus", "aliases": ["八爪鱼"], "profile": "有八条长腕、身体软软的海洋动物，很聪明，会变颜色，遇到危险还能喷墨逃跑。", "hints": ["它生活在海里", "它的身体软软的", "它有八条长长的腕"]}, {"zh": "螃蟹", "en": "crab", "aliases": ["蟹", "小螃蟹"], "profile": "披着硬壳、有一对大钳子的节肢动物，常横着走路，海里、河里和岸边都能见到。", "hints": ["它有硬硬的外壳", "它常横着走路", "它有一对大钳子"]}, {"zh": "海星", "en": "starfish", "aliases": ["sea star"], "profile": "身体像五角星的海洋动物，没有大脑，断掉的腕还能慢慢再长出来。", "hints": ["它生活在海里", "它爬得很慢", "它的样子像一颗星星"]}, {"zh": "蜻蜓", "en": "dragonfly", "aliases": [], "profile": "有两对透明长翅膀、眼睛特别大的昆虫，飞得又快又灵活，常在水边捉蚊子。", "hints": ["它是一种昆虫", "它常在水边飞", "它有两对透明的翅膀"]}, {"zh": "瓢虫", "en": "ladybug", "aliases": ["七星瓢虫", "花大姐", "ladybird"], "profile": "身体圆圆、背上常有红底黑点的小甲虫，很多种会吃蚜虫，帮菜园除害虫。", "hints": ["它是一种昆虫", "它的身体圆圆的", "它背上有小圆点"]}]}, {"title_zh": "丛林探险家", "title_en": "Jungle Explorer", "step": 7, "offset": 0, "items": [{"zh": "蓝鲸", "en": "blue whale", "aliases": [], "profile": "地球上有史以来最大的动物，生活在大海里，却主要靠吃很小的磷虾长这么大。", "hints": ["它生活在大海里", "它是哺乳动物", "它是世界上最大的动物"]}, {"zh": "海龟", "en": "sea turtle", "aliases": [], "profile": "在大海里游来游去的龟，四肢变成了船桨一样的鳍，妈妈会爬上沙滩产蛋。", "hints": ["它是爬行动物", "它生活在海里", "它背着一个硬壳"]}, {"zh": "海马", "en": "seahorse", "aliases": [], "profile": "头长得像马、尾巴能卷住海草的小鱼，由爸爸在育儿袋里孵出宝宝。", "hints": ["它生活在海里", "它游得很慢", "它的头长得像马"]}, {"zh": "水母", "en": "jellyfish", "aliases": ["海蜇"], "profile": "身体像透明果冻、飘在海里的动物，没有大脑和心脏，触手上有会蜇人的刺细胞。", "hints": ["它生活在海里", "它的身体软软的", "它的身体透明像果冻"]}, {"zh": "变色龙", "en": "chameleon", "aliases": ["避役"], "profile": "能改变身体颜色的蜥蜴，两只眼睛可以各看各的，用超长的舌头弹出去粘虫子。", "hints": ["它是一种蜥蜴", "它的舌头特别长", "它能改变身体颜色"]}, {"zh": "壁虎", "en": "gecko", "aliases": ["守宫"], "profile": "常趴在墙上捉蚊子的小蜥蜴，遇到危险能断掉尾巴逃跑，尾巴还能再长出来。", "hints": ["它是一种爬行动物", "它喜欢在晚上捉虫", "它能在墙上爬"]}, {"zh": "萤火虫", "en": "firefly", "aliases": [], "profile": "尾巴会一闪一闪发光的小甲虫，夏天夜晚在草丛和水边飞舞，像一盏盏小灯笼。", "hints": ["它是一种昆虫", "它在夏天的夜里出现", "它的身体会发光"]}, {"zh": "蚕", "en": "silkworm", "aliases": ["家蚕", "蚕宝宝"], "profile": "只吃桑叶的小虫子，长大后吐丝结茧，人们用它吐的丝织成漂亮的丝绸。", "hints": ["它是一种昆虫", "它只吃一种叶子", "它会吐丝结茧"]}, {"zh": "蜘蛛", "en": "spider", "aliases": [], "profile": "有八条腿、会吐丝织网捉虫子的小动物，它不是昆虫。", "hints": ["它会捉虫子吃", "它有八条腿", "它会吐丝织网"]}, {"zh": "蚯蚓", "en": "earthworm", "aliases": [], "profile": "住在泥土里、身体长长软软的环节动物，吃土里的烂叶子，能让土壤变得松软肥沃。", "hints": ["它住在泥土里", "它没有腿", "它的身体又细又长"]}, {"zh": "考拉", "en": "koala", "aliases": ["树袋熊", "无尾熊"], "profile": "抱着树睡大觉的毛茸茸动物，只生活在澳大利亚，宝宝在妈妈的育儿袋里长大。", "hints": ["它生活在澳大利亚", "它很爱睡觉", "它几乎只吃桉树叶"]}, {"zh": "犀牛", "en": "rhino", "aliases": ["犀", "rhinoceros"], "profile": "鼻子上长着一只或两只大角的庞大动物，皮肤又厚又硬，生活在非洲和亚洲。", "hints": ["它是一种很大的动物", "它的皮肤又厚又硬", "它的鼻子上长着角"]}, {"zh": "猎豹", "en": "cheetah", "aliases": [], "profile": "陆地上跑得最快的动物，身材苗条，身上有黑色实心斑点，脸上有两道像泪痕的黑纹。", "hints": ["它是一种猛兽", "它身上有斑点", "它是陆地上跑得最快的动物"]}, {"zh": "大猩猩", "en": "gorilla", "aliases": [], "profile": "体形最大的类人猿，强壮但性情温和，成群生活在非洲的森林里，主要吃植物。", "hints": ["它生活在非洲", "它没有尾巴", "它是最大的类人猿"]}, {"zh": "鸵鸟", "en": "ostrich", "aliases": ["非洲鸵鸟"], "profile": "世界上最大的鸟，不会飞，但跑得飞快，下的蛋也是所有鸟蛋里最大的。", "hints": ["它是一种鸟", "它不会飞", "它是世界上最大的鸟"]}]}, {"title_zh": "荒野追踪者", "title_en": "Wild Tracker", "step": 7, "offset": 0, "items": [{"zh": "火烈鸟", "en": "flamingo", "aliases": ["红鹳"], "profile": "粉红色的长腿水鸟，常用一条腿站着，把头倒过来在水里滤食小虾和藻类。", "hints": ["它生活在水边", "它的腿又细又长", "它的羽毛是粉红色的"]}, {"zh": "树懒", "en": "sloth", "aliases": [], "profile": "生活在中南美洲雨林里的慢性子动物，一辈子大多倒挂在树上，动作特别慢。", "hints": ["它生活在树上", "它的动作特别慢", "它常倒挂着睡觉"]}, {"zh": "食蚁兽", "en": "anteater", "aliases": ["大食蚁兽"], "profile": "鼻子像长管子、舌头细长的动物，没有牙齿，一天能舔食成千上万只蚂蚁和白蚁。", "hints": ["它生活在美洲", "它没有牙齿", "它最爱吃蚂蚁"]}, {"zh": "海獭", "en": "sea otter", "aliases": [], "profile": "常仰面漂在海上的毛茸茸动物，会用石头敲开贝壳，睡觉时还会裹着海藻免得漂走。", "hints": ["它生活在海里", "它会使用工具", "它常仰面漂在水上"]}, {"zh": "海豹", "en": "seal", "aliases": [], "profile": "身体圆滚、四肢变成鳍的海洋哺乳动物，在岸上一扭一扭地爬，在水里游得飞快。", "hints": ["它生活在海里", "它是哺乳动物", "它在岸上靠肚子挪动"]}, {"zh": "螳螂", "en": "mantis", "aliases": ["刀螂", "praying mantis"], "profile": "前腿像两把大刀的昆虫，常静静地举着前腿等待，飞快地捉住路过的小虫。", "hints": ["它是一种昆虫", "它会捉虫子吃", "它的前腿像两把大刀"]}, {"zh": "蝉", "en": "cicada", "aliases": ["知了"], "profile": "夏天趴在树上大声鸣叫的昆虫，幼虫要在地下住好几年，才爬出来蜕壳。", "hints": ["它是一种昆虫", "它夏天最常见", "它的叫声特别响"]}, {"zh": "蝎子", "en": "scorpion", "aliases": ["蝎"], "profile": "尾巴高高翘起、末端有毒针的节肢动物，和蜘蛛是亲戚，有八条腿和一对钳子。", "hints": ["它喜欢在夜里活动", "它有一对钳子", "它的尾巴末端有毒刺"]}, {"zh": "蟾蜍", "en": "toad", "aliases": ["癞蛤蟆", "蛤蟆"], "profile": "皮肤疙疙瘩瘩的两栖动物，比青蛙更爱待在陆地上，是捉害虫的好帮手。", "hints": ["它是两栖动物", "它会捉害虫", "它的皮肤上有很多疙瘩"]}, {"zh": "丹顶鹤", "en": "red crowned crane", "aliases": ["仙鹤", "red-crowned crane"], "profile": "头顶有一块红色、羽毛黑白分明的高大水鸟，常在东亚的湿地里翩翩起舞。", "hints": ["它是一种鸟", "它的腿又细又长", "它的头顶是红色的"]}, {"zh": "白头海雕", "en": "bald eagle", "aliases": ["白头鹰"], "profile": "头和尾巴是白色、身体深褐色的大型猛禽，生活在北美洲，常在水边捕鱼。", "hints": ["它是一种鸟", "它生活在北美洲", "它的头是白色的"]}, {"zh": "雪豹", "en": "snow leopard", "aliases": [], "profile": "生活在亚洲高山雪线附近的大猫，灰白色的毛上有黑色花斑，尾巴又长又粗。", "hints": ["它是一种猛兽", "它生活在高高的雪山上", "它的尾巴又长又粗"]}, {"zh": "眼镜蛇", "en": "cobra", "aliases": [], "profile": "受到威胁时会竖起上身、把脖子张开成扁扁一片的毒蛇，生活在亚洲和非洲。", "hints": ["它是一种爬行动物", "它有毒", "它的脖子能张开变扁"]}, {"zh": "小丑鱼", "en": "clownfish", "aliases": ["海葵鱼"], "profile": "身上有橙白条纹的小鱼，住在会蜇人的海葵中间，却不会被蜇伤。", "hints": ["它生活在海里", "它身上有条纹", "它住在海葵里"]}, {"zh": "驯鹿", "en": "reindeer", "aliases": [], "profile": "生活在北极附近寒冷地区的鹿，雄的雌的都长着大角，能成群长途迁徙。", "hints": ["它生活在很冷的地方", "它是一种鹿", "它头上有大大的角"]}]}, {"title_zh": "动物侦探", "title_en": "Animal Detective", "step": 5, "offset": 0, "items": [{"zh": "鸭嘴兽", "en": "platypus", "aliases": [], "profile": "嘴巴像鸭子、尾巴像河狸的奇特动物，是会下蛋的哺乳动物，只生活在澳大利亚。", "hints": ["它生活在澳大利亚", "它很会游泳", "它的嘴巴像鸭子的嘴"]}, {"zh": "羊驼", "en": "alpaca", "aliases": [], "profile": "毛又厚又软、脖子长长的南美洲动物，是骆驼的亲戚，生气时会吐口水。", "hints": ["它生活在南美洲的山区", "它的毛又厚又软", "它生气时会吐口水"]}, {"zh": "牦牛", "en": "yak", "aliases": [], "profile": "身披长长黑毛的大牛，能在又高又冷的高原上生活，被人用来驮东西、产奶。", "hints": ["它生活在很冷的地方", "它的毛又长又厚", "它是一种牛"]}, {"zh": "蜂鸟", "en": "hummingbird", "aliases": [], "profile": "世界上最小的鸟类家族，翅膀扇得飞快，能在花前悬停吸花蜜，还能倒着飞。", "hints": ["它是一种鸟", "它的个子特别小", "它能在空中停住不动"]}, {"zh": "狐獴", "en": "meerkat", "aliases": ["猫鼬"], "profile": "常用后腿站起来放哨的非洲小动物，一大家子住在地洞里，轮流站岗保护大家。", "hints": ["它生活在非洲", "它住在地洞里", "它常用后腿站起来放哨"]}, {"zh": "电鳗", "en": "electric eel", "aliases": [], "profile": "能放出强大电流的南美淡水鱼，用电来找路、保护自己和捉鱼。", "hints": ["它是一种鱼", "它生活在南美洲", "它能放电"]}, {"zh": "寄居蟹", "en": "hermit crab", "aliases": [], "profile": "把软软的肚子藏在空螺壳里的小动物，长大了会换一个更大的壳住。", "hints": ["它生活在海边", "它有一对钳子", "它住在捡来的壳里"]}, {"zh": "霸王龙", "en": "Tyrannosaurus rex", "aliases": ["暴龙", "T rex", "T-rex"], "profile": "生活在约六千六百万年前的巨大食肉恐龙，头大牙尖、前肢很短，早已灭绝。", "hints": ["它已经灭绝了", "它是吃肉的", "它的前肢特别短"]}, {"zh": "猛犸象", "en": "mammoth", "aliases": ["长毛象", "猛犸", "woolly mammoth"], "profile": "身披长毛、长着弯弯长牙的古代大象，生活在冰河时代的寒冷地区，早已灭绝。", "hints": ["它已经灭绝了", "它生活在很冷的地方", "它全身长着长毛"]}, {"zh": "箭毒蛙", "en": "poison dart frog", "aliases": ["毒箭蛙"], "profile": "颜色特别鲜艳的小蛙，住在中南美洲的雨林里，皮肤有毒，鲜艳的颜色是在警告别人别吃它。", "hints": ["它生活在雨林里", "它的颜色特别鲜艳", "它的皮肤有毒"]}, {"zh": "小熊猫", "en": "red panda", "aliases": ["红熊猫", "小猫熊"], "profile": "毛色红棕、尾巴上有一圈圈花纹的可爱动物，住在亚洲的高山森林里，爱吃竹子。", "hints": ["它住在高山的森林里", "它的毛是红棕色的", "它的尾巴上有环纹"]}, {"zh": "河狸", "en": "beaver", "aliases": ["海狸"], "profile": "会用锋利的牙齿啃倒树木、在河里筑起大坝的动物，被称为“动物建筑师”。", "hints": ["它很会游泳", "它的尾巴扁扁的", "它会啃树筑坝"]}, {"zh": "白蚁", "en": "termite", "aliases": [], "profile": "名字里有“蚁”却和蟑螂更亲的昆虫，成群住在巨大的土堆巢里，爱吃木头。", "hints": ["它是一种昆虫", "它喜欢成群生活", "它爱啃木头"]}, {"zh": "珊瑚虫", "en": "coral", "aliases": ["珊瑚"], "profile": "看起来像石头或植物，其实是一群群小小的动物，它们分泌的骨骼堆成了海里的礁石。", "hints": ["它生活在海里", "它长大后就不动了", "它看起来像石头或植物"]}]}, {"title_zh": "生态研究员", "title_en": "Ecology Researcher", "step": 5, "offset": 0, "items": [{"zh": "穿山甲", "en": "pangolin", "aliases": ["鲮鲤"], "profile": "全身披着鳞片的哺乳动物，遇到危险会卷成一个球，用长舌头舔食蚂蚁和白蚁。", "hints": ["它很会挖洞", "它没有牙齿", "它全身长着鳞片"]}, {"zh": "犰狳", "en": "armadillo", "aliases": [], "profile": "背上披着一节一节骨质铠甲的美洲动物，有的种类遇到危险能卷成一个球。", "hints": ["它生活在美洲", "它很会挖洞", "它背上有一节节的硬甲"]}, {"zh": "海牛", "en": "manatee", "aliases": [], "profile": "身体圆滚、性情温和的水中哺乳动物，一天大部分时间都在慢悠悠地吃水草。", "hints": ["它生活在水里", "它性情很温和", "它的尾巴像一把圆扇子"]}, {"zh": "翻车鱼", "en": "ocean sunfish", "aliases": ["翻车鲀", "sunfish", "mola"], "profile": "身体扁圆、像被切掉一半的大鱼，常侧躺在海面晒太阳，是最重的硬骨鱼之一。", "hints": ["它生活在大海里", "它常侧躺在海面上", "它看起来像只有一个大头"]}, {"zh": "飞鱼", "en": "flying fish", "aliases": [], "profile": "胸鳍像翅膀一样长的鱼，能冲出水面在空中滑翔很远，躲开水下的大鱼。", "hints": ["它生活在海里", "它是一种鱼", "它能跃出水面滑翔"]}, {"zh": "鮟鱇鱼", "en": "anglerfish", "aliases": ["鮟鱇"], "profile": "头上长着“小钓竿”的鱼，深海里的种类钓竿顶端会发光，引诱小鱼靠近。", "hints": ["它生活在海里", "它的嘴巴很大", "它头上有根像钓竿的刺"]}, {"zh": "竹节虫", "en": "stick insect", "aliases": [], "profile": "长得像一根细树枝的昆虫，一动不动时很难被发现，是伪装高手。", "hints": ["它是一种昆虫", "它是伪装高手", "它长得像一根树枝"]}, {"zh": "独角仙", "en": "rhinoceros beetle", "aliases": ["兜虫", "双叉犀金龟"], "profile": "雄的头上长着一只大角的甲虫，力气特别大，能推动比自己重很多倍的东西。", "hints": ["它是一种昆虫", "它的力气特别大", "它头上长着一只角"]}, {"zh": "科莫多巨蜥", "en": "Komodo dragon", "aliases": ["科莫多龙"], "profile": "世界上最大的蜥蜴，只生活在印度尼西亚的几个小岛上，嗅觉非常灵敏。", "hints": ["它是一种爬行动物", "它生活在小岛上", "它是世界上最大的蜥蜴"]}, {"zh": "响尾蛇", "en": "rattlesnake", "aliases": [], "profile": "尾巴尖有一串角质环的毒蛇，遇到危险时会摇尾巴发出沙沙响声警告对方。", "hints": ["它生活在美洲", "它是一种毒蛇", "它的尾巴会发出响声"]}, {"zh": "巨嘴鸟", "en": "toucan", "aliases": ["鵎鵼"], "profile": "嘴巴又大又鲜艳的热带鸟，大嘴看起来很重，其实里面像海绵一样，非常轻。", "hints": ["它生活在雨林里", "它是一种鸟", "它的嘴巴又大又鲜艳"]}, {"zh": "信天翁", "en": "albatross", "aliases": [], "profile": "翅膀张开最长的鸟，能在海洋上空滑翔很久几乎不扇翅膀，一生大部分时间在海上。", "hints": ["它是一种鸟", "它生活在大海上", "它的翅膀特别长"]}, {"zh": "始祖鸟", "en": "Archaeopteryx", "aliases": [], "profile": "生活在约一亿五千万年前、既像恐龙又像鸟的古老动物，有羽毛、牙齿和长尾巴。", "hints": ["它已经灭绝了", "它身上有羽毛", "它的嘴里有牙齿"]}, {"zh": "大鲵", "en": "Chinese giant salamander", "aliases": ["娃娃鱼"], "profile": "世界上最大的两栖动物之一，生活在山区清澈的溪流里，叫声有点像婴儿哭。", "hints": ["它是两栖动物", "它生活在山里的溪流中", "它的叫声像婴儿哭"]}]}, {"title_zh": "博物学家", "title_en": "Naturalist", "step": 7, "offset": 0, "items": [{"zh": "独角鲸", "en": "narwhal", "aliases": ["一角鲸"], "profile": "生活在北极海域的鲸，雄的嘴边伸出一根螺旋状长牙，看起来像独角兽的角。", "hints": ["它生活在北极的海里", "它是一种鲸", "它有一根很长的牙"]}, {"zh": "蝠鲼", "en": "manta ray", "aliases": ["魔鬼鱼"], "profile": "身体扁平像一张大毯子的鱼，扇动翅膀一样的胸鳍在海里滑行，是体形最大的鳐类。", "hints": ["它生活在海里", "它的身体扁扁的", "它游起来像在海里飞"]}, {"zh": "叶海龙", "en": "leafy seadragon", "aliases": [], "profile": "浑身长着像海藻叶子一样装饰的小鱼，漂在海里就像一片海草，是海马的亲戚。", "hints": ["它生活在海里", "它是伪装高手", "它长得像一片海藻"]}, {"zh": "鹦鹉螺", "en": "nautilus", "aliases": [], "profile": "住在螺旋形带花纹贝壳里的海洋动物，是章鱼的远亲，被称为“活化石”。", "hints": ["它生活在深海里", "它背着一个螺旋形的壳", "它有很多条触手"]}, {"zh": "鲎", "en": "horseshoe crab", "aliases": ["马蹄蟹"], "profile": "长得像一顶大头盔、拖着一根尖尾巴的海洋动物，血液是蓝色的，被称为“活化石”。", "hints": ["它生活在海里", "它的血是蓝色的", "它的壳像一个马蹄"]}, {"zh": "美西螈", "en": "axolotl", "aliases": ["六角恐龙", "墨西哥钝口螈"], "profile": "长着一圈毛茸茸外鳃、总像在微笑的两栖动物，一辈子都保持幼年的样子。", "hints": ["它是两栖动物", "它一辈子生活在水里", "它头两边有毛茸茸的鳃"]}, {"zh": "针鼹", "en": "echidna", "aliases": [], "profile": "浑身长刺、嘴巴像细管子的动物，是和鸭嘴兽一样会下蛋的哺乳动物。", "hints": ["它生活在澳大利亚一带", "它会下蛋", "它身上长满了刺"]}, {"zh": "狐猴", "en": "lemur", "aliases": ["环尾狐猴"], "profile": "只生活在非洲马达加斯加岛的灵长类动物，大眼睛，很多种有一条长长的尾巴。", "hints": ["它生活在一个大岛上", "它是灵长类动物", "它有一条长长的尾巴"]}, {"zh": "海鬣蜥", "en": "marine iguana", "aliases": [], "profile": "唯一会下海觅食的蜥蜴，只生活在加拉帕戈斯群岛，会潜到水里啃海藻。", "hints": ["它是一种蜥蜴", "它生活在海岛上", "它会潜水吃海藻"]}, {"zh": "几维鸟", "en": "kiwi", "aliases": ["鹬鸵"], "profile": "只生活在新西兰的不会飞的鸟，圆圆的身体、长长的嘴，鼻孔长在嘴巴尖上。", "hints": ["它是一种鸟", "它不会飞", "它的鼻孔长在嘴巴尖上"]}, {"zh": "渡渡鸟", "en": "dodo", "aliases": [], "profile": "曾生活在印度洋毛里求斯岛上、不会飞的大鸟，被人类发现后不到一百年就灭绝了。", "hints": ["它已经灭绝了", "它不会飞", "它生活在一个小岛上"]}, {"zh": "螳螂虾", "en": "mantis shrimp", "aliases": ["皮皮虾", "虾蛄"], "profile": "出拳速度超快的海洋甲壳动物，能打碎贝壳，还有动物里最复杂的眼睛之一。", "hints": ["它生活在海里", "它的眼睛很特别", "它出拳特别快"]}, {"zh": "抹香鲸", "en": "sperm whale", "aliases": [], "profile": "头部巨大、像一个方盒子的齿鲸，能潜到很深的海里捕食乌贼。", "hints": ["它生活在大海里", "它能潜到很深的地方", "它的头又大又方"]}]}, {"title_zh": "动物学大师", "title_en": "Zoology Master", "step": 7, "offset": 0, "items": [{"zh": "眼镜猴", "en": "tarsier", "aliases": ["跗猴"], "profile": "眼睛大得出奇的小动物，每只眼睛都和它的大脑差不多大，住在东南亚岛屿的森林里。", "hints": ["它生活在东南亚", "它的个子很小", "它的眼睛大得出奇"]}, {"zh": "土豚", "en": "aardvark", "aliases": [], "profile": "长着像驴的耳朵、像猪的鼻子的非洲动物，夜里用长舌头舔食白蚁和蚂蚁。", "hints": ["它生活在非洲", "它很会挖洞", "它的耳朵又长又尖"]}, {"zh": "袋獾", "en": "Tasmanian devil", "aliases": ["塔斯马尼亚恶魔"], "profile": "只生活在澳大利亚南边一个大岛上的有袋动物，全身黑毛，叫声很凶，咬合力很强。", "hints": ["它生活在一个岛上", "它是有袋动物", "它的叫声很凶"]}, {"zh": "儒艮", "en": "dugong", "aliases": [], "profile": "身体圆胖、尾巴像海豚的温和海洋哺乳动物，靠吃海草生活，传说中美人鱼的原型之一。", "hints": ["它生活在海里", "它只吃海草", "它的尾巴像海豚的尾巴"]}, {"zh": "腔棘鱼", "en": "coelacanth", "aliases": ["矛尾鱼", "拉蒂迈鱼"], "profile": "曾被认为早已灭绝的古老鱼类，1938年又在南非海里被发现，被称为“活化石”。", "hints": ["它是一种鱼", "它生活在深海里", "它曾被认为早就灭绝了"]}, {"zh": "弹涂鱼", "en": "mudskipper", "aliases": ["跳跳鱼"], "profile": "能离开水在泥滩上跳来跳去的鱼，用胸鳍撑着走路，眼睛长在头顶。", "hints": ["它是一种鱼", "它常待在海边泥滩", "它能在陆地上蹦跳"]}, {"zh": "水熊虫", "en": "tardigrade", "aliases": ["水熊"], "profile": "只有不到一毫米长的小动物，长得像胖胖的小熊，能在极冷、极热甚至太空中活下来。", "hints": ["它的个子非常小", "它长得像胖胖的小熊", "它能在太空中活下来"]}, {"zh": "蜉蝣", "en": "mayfly", "aliases": [], "profile": "幼虫在水里生活一两年，长成会飞的成虫后，通常只活几小时到一两天的昆虫。", "hints": ["它是一种昆虫", "它小时候生活在水里", "它长大后只能活很短时间"]}, {"zh": "琴鸟", "en": "lyrebird", "aliases": [], "profile": "澳大利亚的一种鸟，雄的尾羽展开像古希腊的竖琴，能模仿各种声音，连相机快门声都会学。", "hints": ["它是一种鸟", "它是模仿声音的高手", "它的尾羽像一把竖琴"]}, {"zh": "鲸头鹳", "en": "shoebill", "aliases": ["鞋嘴鹳"], "profile": "嘴巴又宽又大像一只木鞋的大鸟，常一动不动地站在沼泽里，耐心等鱼游过来。", "hints": ["它是一种鸟", "它生活在非洲的沼泽里", "它的嘴巴像一只大鞋子"]}, {"zh": "三叶虫", "en": "trilobite", "aliases": [], "profile": "几亿年前生活在海洋里的节肢动物，身体从左到右分成三块，早已灭绝，