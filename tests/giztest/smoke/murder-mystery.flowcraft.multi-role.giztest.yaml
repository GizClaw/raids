  timeout: 2m
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_multi_role_probe_chef
  client: flowcraft_multi_role
  timeout: 2m
  peer_stream:
    mode: text
    input: 我去问厨师：停电前后你分别在哪里？具体时间记得吗？
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text":
      non_empty: true
      not_contains:
      - "【"
      - "】"
    "/text_eos":
