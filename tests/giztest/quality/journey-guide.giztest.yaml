# workflows/journey-guide/test.yaml: RULES = "你是 `journey-guide` 的专属验收 Workflow，不是西游故事角色。你负责二十回合西游互动故事的路线选择后果、同行者纠正、暂不推进、重载后的长期连续性与收束质量。\n玩家角色设定：第一次参与西游互动故事的普通玩家，会自由选择路线、提出错误推断、纠正同行者姓名，并期待二十回合后的选择仍有后果。\n负向控制：回复与当前玩家话语无关、复活已被更正的旧事实、重复同义内容或违反明确的格式与字数指令时，对应维度必须 fail。"
# workflows/journey-guide/README.md: | 7 | `correct-guide` | 更正，向导不叫清禾，叫明月；她仍然熟悉黑风岭。 | 必须含明月、黑风岭；不得含清禾；10-80字；语义维度：correction-handling、response-completeness |
# workflows/journey-guide/README.md: | 8 | `mountain` | 我和明月翻越黑风岭，遇到暴雨时先找安全处避雨。 | 必须含明月；不得含清禾；80-260字；语义维度：history-continuity、action-consequence |
version: gizclaw.test/v1alpha1
name: quality.journey-guide
clients:
  flowcraft:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_history:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_history_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_memory_async:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_memory_async_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_memory_recall:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_memory_recall_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-journey-guide long-form-branch-correction-return
  flowcraft_contracts_verdict:
    direction: output
    type: string
  flowcraft_contracts_reload_handoff:
    direction: output
    type: string
  eino_history_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_history_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_history_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-journey-guide long-form-branch-correction-return
  eino_history_contracts_verdict:
    direction: output
    type: string
  eino_history_contracts_reload_handoff:
    direction: output
    type: string
  eino_memory_async_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_async_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_async_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-journey-guide long-form-branch-correction-return
  eino_memory_async_contracts_verdict:
    direction: output
    type: string
  eino_memory_async_contracts_reload_handoff:
    direction: output
    type: string
  eino_memory_recall_contracts_candidate_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_recall_contracts_tester_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_recall_contracts_test_brief:
    direction: input
    type: string
    value: BEGIN flowcraft-journey-guide long-form-branch-correction-return
  eino_memory_recall_contracts_verdict:
    direction: output
    type: string
  eino_memory_recall_contracts_reload_handoff:
    direction: output
    type: string
  flowcraft_benchmark_workspace:
    direction: input
    type: string
    generate: token
  eino_history_benchmark_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_async_benchmark_workspace:
    direction: input
    type: string
    generate: token
  eino_memory_recall_benchmark_workspace:
    direction: input
    type: string
    generate: token
repeat: 1
timeout: 388m
steps:
- id: register_flowcraft
  client: flowcraft
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_flowcraft_tester
  client: flowcraft_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino_history
  client: eino_history
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino_history_tester
  client: eino_history_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino_memory_async
  client: eino_memory_async
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino_memory_async_tester
  client: eino_memory_async_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino_memory_recall
  client: eino_memory_recall
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: register_eino_memory_recall_tester
  client: eino_memory_recall_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_contracts_stop_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_contracts_create_candidate_workspace
  client: flowcraft
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_candidate_workspace}"
      collection: story-teller
      workflow_name: journey
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_create_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_contracts_tester_workspace}"
      collection: raidtest-testers
      workflow_name: journey-guide-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_contracts_select_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_candidate_workspace}"
- id: flowcraft_contracts_warmup_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_contracts_select_tester_workspace
  client: flowcraft_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_contracts_tester_workspace}"
- id: flowcraft_contracts_run_dialogue_before_reload
  timeout: 40m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${flowcraft_contracts_test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 24
    terminal_client: flowcraft
  capture:
    flowcraft_contracts_reload_handoff: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft
    "/completed_turns":
      equals: 24
    "/turns/flowcraft/count":
      equals: 12
    "/turns/flowcraft_tester/count":
      equals: 12
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 10
    "/turns/flowcraft/text_runes/max":
      maximum: 520
- id: flowcraft_contracts_recall_barrier_1
  client: flowcraft
  rpc:
    method: server.run.workspace.recall
    request:
      query: 明月
  timeout: 90s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: flowcraft_contracts_recall_barrier_2
  client: flowcraft
  rpc:
    method: server.run.workspace.recall
    request:
      query: 青铜铃
  timeout: 90s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: flowcraft_contracts_recall_barrier_3
  client: flowcraft
  rpc:
    method: server.run.workspace.recall
    request:
      query: 商队
  timeout: 90s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: flowcraft_contracts_reload_candidate_workspace
  client: flowcraft
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_contracts_run_dialogue_after_reload
  timeout: 29m
  workspace_relay:
    first_client: flowcraft_tester
    second_client: flowcraft
    input: "${flowcraft_contracts_reload_handoff}"
    media: text
    idle_timeout: 90s
    max_turns: 17
    terminal_client: flowcraft_tester
  capture:
    flowcraft_contracts_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 17
    "/turns/flowcraft/count":
      equals: 8
    "/turns/flowcraft_tester/count":
      equals: 9
    "/turns/flowcraft/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft/text_runes/min":
      minimum: 10
    "/turns/flowcraft/text_runes/max":
      maximum: 200
- id: flowcraft_contracts_emit_verdict
  output:
    variable: flowcraft_contracts_verdict
- id: eino_history_contracts_stop_create_candidate_workspace
  client: eino_history
  rpc:
    method: server.run.stop
    request: {}
- id: eino_history_contracts_create_candidate_workspace
  client: eino_history
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_history_contracts_candidate_workspace}"
      collection: story-teller
      workflow_name: journey-eino-history
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: eino_history_contracts_create_tester_workspace
  client: eino_history_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${eino_history_contracts_tester_workspace}"
      collection: raidtest-testers
      workflow_name: journey-guide-test
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
