# User Story:
# As a Raids quality maintainer,
# I want identical quality contracts for every implementation of story-wizard-oz,
# So that safety, correction, recall, routing and language regressions fail at the original gates.
version: gizclaw.test/v1alpha1
name: quality.story-wizard-oz
clients:
  flowcraft__transitions: &1
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino__transitions: &2
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft__roles: *1
  eino__roles: *2
  flowcraft__case5: *1
  eino__case5: *2
  flowcraft_multi_role__transitions:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_multi_role__transitions:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_multi_role__case5:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_multi_role__case5:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_multi_role__routing:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  eino_multi_role__routing:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  flowcraft_transitions_workspace:
    direction: input
    type: string
    generate: token
  eino_transitions_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_dorothy_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_scarecrow_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_roles_tin_man_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_narrator_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_dorothy_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_scarecrow_workspace:
    direction: input
    type: string
    generate: token
  eino_roles_tin_man_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_case5_flowcraft_workspace:
    direction: input
    type: string
    generate: token
  eino_case5_flowcraft_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_transitions_workspace:
    direction: input
    type: string
    generate: token
  eino_multi_role_transitions_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_case5_flowcraft_workspace:
    direction: input
    type: string
    generate: token
  eino_multi_role_case5_flowcraft_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_routing_workspace:
    direction: input
    type: string
    generate: token
  eino_multi_role_routing_workspace:
    direction: input
    type: string
    generate: token
