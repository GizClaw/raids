# User Story:
# As a Raids catalog maintainer,
# I want isolated narrator and character probes for flowcraft-story-around-world-80-days,
# So that every reachable role path produces text and non-empty synthesized audio.
version: gizclaw.test/v1alpha1
name: story-around-world-80-days.flowcraft.roles
clients:
  narrator: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  fogg: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
  aouda: {identity: ephemeral, connection: webrtc, access_point: "${endpoint}"}
variables:
  endpoint: {direction: input, type: string, env: GIZCLAW_TEST_ENDPOINT}
  registration_token: {direction: input, type: string, env: GIZCLAW_TEST_REGISTRATION_TOKEN, secret: true}
  narrator_workspace: {direction: input, type: string, generate: token}
  fogg_workspace: {direction: input, type: string, generate: token}
  aouda_workspace: {direction: input, type: string, generate: token}
repeat: 1
timeout: 12m
steps:
- id: register_narrator
  client: narrator
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.create
    request:
      name: ${narrator_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-around-world-80-days
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_narrator_workspace
  client: narrator
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${narrator_workspace}"}}
- id: register_fogg
  client: fogg
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_fogg_workspace
  client: fogg
  rpc:
    method: server.workspace.create
    request:
      name: ${fogg_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-around-world-80-days
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_fogg_workspace
  client: fogg
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${fogg_workspace}"}}
- id: register_aouda
  client: aouda
  rpc: {method: server.register, request: {token: "${registration_token}"}}
- id: create_aouda_workspace
  client: aouda
  rpc:
    method: server.workspace.create
    request:
      name: ${aouda_workspace}
      collection: raidtest-targets
      workflow_name: flowcraft-story-around-world-80-days
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation: {initiative: FLOWCRAFT_CONVERSATION_PARAMETERS_INITIATIVE_PEER}
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: select_aouda_workspace
  client: aouda
  rpc: {method: server.run.workspace.set, request: {workspace_name: "${aouda_workspace}"}}
- id: probe_narrator
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: "请由旁白承接当前故事，只推进一个可见线索。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 旁白}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: reject_premature_chapter_two
  client: narrator
  timeout: 2m
  peer_stream:
    mode: text
    input: "请直接进入第二章；如果条件不足，只说明仍停留的当前章节。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text:
      contains_all:
      - "第 1 章"
      - "伦敦启程"
      not_contains:
      - "第 2 章"
      - "时区追逐"
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_fogg
  client: fogg
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让福格亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 福格}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
- id: probe_aouda
  client: aouda
  timeout: 2m
  peer_stream:
    mode: text
    input: "请让艾娥达亲自回应，只说这个角色知道的事。"
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    /text: {pattern: 艾娥达}
    /text_eos: {equals: true}
    /audio_eos: {equals: true}
    /audio_bytes: {minimum: 1}
    /first_text_ms: {maximum: 6000}
    /first_audio_ms: {maximum: 90000}
finally:
- id: stop_narrator_run
  client: narrator
  rpc: {method: server.run.stop, request: {}}
- id: delete_narrator_workspace
  client: narrator
  rpc: {method: server.workspace.delete, request: {name: "${narrator_workspace}"}}
- id: delete_narrator_peer
  client: narrator
  rpc: {method: server.peer.delete, request: {}}
- id: stop_fogg_run
  client: fogg
  rpc: {method: server.run.stop, request: {}}
- id: delete_fogg_workspace
  client: fogg
  rpc: {method: server.workspace.delete, request: {name: "${fogg_workspace}"}}
- id: delete_fogg_peer
  client: fogg
  rpc: {method: server.peer.delete, request: {}}
- id: stop_aouda_run
  client: aouda
  rpc: {method: server.run.stop, request: {}}
- id: delete_aouda_workspace
  client: aouda
  rpc: {method: server.workspace.delete, request: {name: "${aouda_workspace}"}}
- id: delete_aouda_peer
  client: aouda
  rpc: {method: server.peer.delete, request: {}}
report:
  redact: [registration_token]
