# User Story:
# As a Raids catalog maintainer,
# I want every available story-chu-han implementation to complete the same bounded Tester relay,
# So that natural conversation receives lenient LLM review with recall and playback checks.
version: gizclaw.test/v1alpha1
name: story-chu-han.soak.flowcraft.multi-role
clients:
  flowcraft_multi_role:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
  flowcraft_multi_role_tester:
    identity: ephemeral
    connection: webrtc
    access_point: "${endpoint}"
variables:
  endpoint:
    direction: input
    type: string
    env: GIZCLAW_TEST_ENDPOINT
  registration_token:
    direction: input
    type: string
    env: GIZCLAW_TEST_REGISTRATION_TOKEN
    secret: true
  multi_role_test_brief:
    direction: input
    type: string
    value: |
      BEGIN flowcraft-story-chu-han-multi-role long-form-story
      孩子自然参与多角色有声故事，内容由Tester宽松评审：有意思、生动、丰富、连贯、回应孩子。
  flowcraft_multi_role_candidate_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_tester_workspace:
    direction: input
    type: string
    generate: token
  flowcraft_multi_role_verdict:
    direction: output
    type: string
repeat: 1
timeout: 180m
steps:
- id: flowcraft_multi_role_register_candidate
  client: flowcraft_multi_role
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_multi_role_register_tester
  client: flowcraft_multi_role_tester
  rpc:
    method: server.register
    request:
      token: "${registration_token}"
- id: flowcraft_multi_role_create_candidate_workspace
  client: flowcraft_multi_role
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_multi_role_candidate_workspace}"
      collection: raidtest-targets
      workflow_name: flowcraft-story-chu-han-multi-role
      parameters:
        flowcraft_workspace_parameters:
          agent_type: FLOWCRAFT_WORKSPACE_PARAMETERS_AGENT_TYPE_FLOWCRAFT
          conversation:
            initiative: CONVERSATION_PARAMETERS_INITIATIVE_PEER
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_multi_role_create_tester_workspace
  client: flowcraft_multi_role_tester
  rpc:
    method: server.workspace.create
    request:
      name: "${flowcraft_multi_role_tester_workspace}"
      collection: raidtest-testers
      workflow_name: story-chu-han-test-multi-role
      parameters:
        eino_workspace_parameters:
          agent_type: EINO_WORKSPACE_PARAMETERS_AGENT_TYPE_EINO
          input: WORKSPACE_INPUT_MODE_PUSH_TO_TALK
- id: flowcraft_multi_role_select_candidate_workspace
  client: flowcraft_multi_role
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_multi_role_candidate_workspace}"
- id: flowcraft_multi_role_warmup_candidate_workspace
  client: flowcraft_multi_role
  rpc:
    method: server.run.workspace.reload
    request: {}
  timeout: 2m
- id: flowcraft_multi_role_select_tester_workspace
  client: flowcraft_multi_role_tester
  rpc:
    method: server.run.workspace.set
    request:
      workspace_name: "${flowcraft_multi_role_tester_workspace}"
- id: flowcraft_multi_role_relay_responses_1_8
  timeout: 32m
  workspace_relay:
    first_client: flowcraft_multi_role_tester
    second_client: flowcraft_multi_role
    input: "${multi_role_test_brief}"
    media: text
    idle_timeout: 90s
    max_turns: 17
    terminal_client: flowcraft_multi_role_tester
  expect:
    "/terminal/client":
      equals: flowcraft_multi_role_tester
    "/terminal/text":
      pattern: "^\\s*CHECKPOINT PASS\\s*$"
    "/completed_turns":
      equals: 17
    "/turns/flowcraft_multi_role/count":
      equals: 8
    "/turns/flowcraft_multi_role_tester/count":
      equals: 9
    "/turns/flowcraft_multi_role/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft_multi_role/text_runes/min":
      minimum: 1
- id: flowcraft_multi_role_recall_barrier
  client: flowcraft_multi_role
  rpc:
    method: server.run.workspace.recall
    request:
      query: 月光七码
  timeout: 60s
  expect:
    "/available":
      equals: true
    "/hits":
      non_empty: true
- id: flowcraft_multi_role_reload_candidate_workspace
  client: flowcraft_multi_role
  rpc:
    method: server.run.workspace.reload
    request: {}
- id: flowcraft_multi_role_relay_responses_9_16
  timeout: 32m
  workspace_relay:
    first_client: flowcraft_multi_role_tester
    second_client: flowcraft_multi_role
    input: CONTINUE 8
    media: text
    idle_timeout: 90s
    max_turns: 17
    terminal_client: flowcraft_multi_role_tester
  capture:
    flowcraft_multi_role_verdict: "/terminal/text"
  expect:
    "/terminal/client":
      equals: flowcraft_multi_role_tester
    "/terminal/text":
      pattern: "^\\s*PASS\\s*$"
    "/completed_turns":
      equals: 17
    "/turns/flowcraft_multi_role/count":
      equals: 8
    "/turns/flowcraft_multi_role_tester/count":
      equals: 9
    "/turns/flowcraft_multi_role/first_text_ms/max":
      maximum: 6000
    "/turns/flowcraft_multi_role/text_runes/min":
      minimum: 1
- id: flowcraft_multi_role_emit_verdict
  output:
    variable: flowcraft_multi_role_verdict
finally:
- id: flowcraft_multi_role_stop_candidate_run
  client: flowcraft_multi_role
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_multi_role_stop_tester_run
  client: flowcraft_multi_role_tester
  rpc:
    method: server.run.stop
    request: {}
- id: flowcraft_multi_role_delete_candidate_workspace
  client: flowcraft_multi_role
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_multi_role_candidate_workspace}"
- id: flowcraft_multi_role_delete_tester_workspace
  client: flowcraft_multi_role_tester
  rpc:
    method: server.workspace.delete
    request:
      name: "${flowcraft_multi_role_tester_workspace}"
- id: flowcraft_multi_role_delete_candidate_peer
  client: flowcraft_multi_role
  rpc:
    method: server.peer.delete
    request: {}
- id: flowcraft_multi_role_delete_tester_peer
  client: flowcraft_multi_role_tester
  rpc:
    method: server.peer.delete
    request: {}
report:
  redact:
  - registration_token
