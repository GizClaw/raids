    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
- id: probe_safety-teacher
  client: safety-teacher
  timeout: 2m
  peer_stream:
    mode: text
    input: 请让安全老师亲自回应。
    idle_timeout: 90s
    require_text: true
    require_audio: true
  expect:
    "/text_eos":
      equals: true
    "/audio_eos":
      equals: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 6000
    "/first_audio_ms":
      maximum: 90000
    "/text":
      not_contains:
      - 安全老师说
      - 安全老师：
- id: probe_safety-teacher_first_response
  client: safety-teacher
  timeout: 15s
  peer_stream:
    mode: text
    input: 请让安全老师亲自回应。
    completion: first_response
    first_text_timeout: 2s
    first_audio_timeout: 3s
    require_text: true
    require_audio: true
  expect:
    "/events":
      non_empty: true
    "/audio_bytes":
      minimum: 1
    "/first_text_ms":
      maximum: 2000
    "/first_audio_ms":
      maximum: 3000
finally:
- id: stop_narrator_run
  client: narrator
  rpc:
    method: server.run.stop
    request: {}
- id: delete_narrator_workspace
  client: narrator
  rpc:
    method: server.workspace.delete
    request:
      name: "${narrator_workspace}"
- id: delete_narrator_peer
  client: narrator
  rpc:
    method: server.peer.delete
    request: {}
- id: stop_experimenter_run
  client: experimenter
  rpc:
    method: server.run.stop
    request: {}
- id: delete_experimenter_workspace
  client: experimenter
  rpc:
    method: server.workspace.delete
    request:
      name: "${experimenter_workspace}"
- id: delete_experimenter_peer
  client: experimenter
  rpc:
    method: server.peer.delete
    request: {}
- id: stop_observer_run
  client: observer
  rpc:
    method: server.run.stop
    request: {}
- id: delete_observer_workspace
  client: observer
  rpc:
    method: server.workspace.delete
    request:
      name: "${observer_workspace}"
- id: delete_observer_peer
