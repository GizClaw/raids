name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download GizClaw v0.7.7
        env:
          GIZCLAW_ASSET: gizclaw_0.7.7_amd64.deb
          GIZCLAW_SHA256: c3e6e6ebcf0cc430d772ece52762bf32d76bad5d3ea041e55b0bc96fd77783b3
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/$GIZCLAW_ASSET"
          root="$RUNNER_TEMP/gizclaw-v0.7.7"
          curl --fail --location --retry 3 \
            --output "$package" \
            "https://github.com/GizClaw/gizclaw/releases/download/v0.7.7/$GIZCLAW_ASSET"
          printf '%s  %s\n' "$GIZCLAW_SHA256" "$package" | sha256sum --check --status
          dpkg-deb --extract "$package" "$root"
          printf 'GIZCLAW=%s\n' "$root/usr/bin/gizclaw" >> "$GITHUB_ENV"

      - name: Validate Resources and Giztest documents
        run: make test-unit-resources

      - name: Check catalog Voice invariants
        run: make test-unit-voices

