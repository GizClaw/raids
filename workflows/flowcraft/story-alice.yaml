apiVersion: gizclaw.admin/v1alpha1
kind: Workflow
metadata:
  id: flowcraft-story-alice
spec:
  driver: flowcraft
  toolkit:
    tool_ids: []
  flowcraft:
    graph:
      name: story-alice
      entry: prepare-recall-query
      edges:
      - from: prepare-recall-query
        to: recall-progress
      - from: recall-progress
        to: route-phase
      - from: route-phase
        to: narrate-opening
        condition: scenario_phase == "opening"
      - from: route-phase
        to: narrate-correction
        condition: scenario_phase == "correction"
      - from: route-phase
        to: narrate-challenge
        condition: scenario_phase == "challenge"
      - from: route-phase
        to: narrate-conclusion
        condition: scenario_phase == "conclusion"
      - from: route-phase
        to: narrate-explore
      - from: narrate-opening
        to: reduce-state
      - from: narrate-explore
        to: reduce-state
      - from: narrate-correction
        to: reduce-state
      - from: narrate-challenge
        to: reduce-state
      - from: narrate-conclusion
        to: reduce-state
      - from: reduce-state
        to: observe-progress
      - from: observe-progress
        to: __end__
      nodes:
      - id: prepare-recall-query
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim();
            board.setVar("scenario_recall_query", current || "raid_scenario_state_v2");
      - id: recall-progress
        type: memory_recall
        config:
          query:
            text_from: scenario_recall_query
            lanes:
            - story_progress
            kinds:
            - state
            - note
            - event
          output: scenario_memory
          render:
            header: 'Confirmed scenario history:'
            item_prefix: '- '
            max_items: 12
          top_k: 12
      - id: route-phase
        type: script
        config:
          source: |
            const current = String(board.getVar("input") || "").trim();
            const memory = String(board.getVar("scenario_memory") || "");
            const prior = board.getVar("scenario_state") || {schema: "raid_scenario_state_v2", revision: 0};
            let combined = memory + "\n" + current;
            const messages = board.channel(board.MAIN_CHANNEL) || [];
            for (const message of messages) {
              if (message && typeof message.content === "string") combined += "\n" + message.content;
              const parts = message && Array.isArray(message.parts) ? message.parts : [];
              const text = parts.map((part) => part && part.type === "text" && typeof part.text === "string" ? part.text : "").join("");
              if (text) combined += "\n" + text;
            }
            const containsAnyText = (text, values) => values.some((value) => text.includes(value));
            let phase = "explore";
            if (!current || containsAnyText(current, ["开始爱丽丝", "开始故事", "怀表"])) phase = "opening";
            else if (containsAnyText(current, ["更正", "只确认", "有效颜色", "有效口令", "正确口令", "正确颜色", "回忆", "重连", "隔了几轮", "只说"])) phase = "correction";
            else if (containsAnyText(current, ["总结", "离开", "回顾", "出口", "用两句完整的话说出"])) phase = "conclusion";
            else if (containsAnyText(current, ["反例", "规则", "提示", "不要替我", "我猜", "悖论"])) phase = "challenge";
            let route = "";
            if (containsAnyText(current, ["我打开绿色", "我推开绿色", "我走进门", "我进入门后"])) route = "第四章‘由玩家决定的门后旅程’";
            else if (prior.door_color || containsAnyText(current, ["蓝色小门", "绿色小门", "门把手", "门的正确颜色", "门边口令", "有效口令"])) route = "第三章‘绿色小门’";
            else if (containsAnyText(combined, ["悖论", "提示", "谜底", "解释成立", "快一分钟", "问题表"])) route = "第二章‘悖论与提示’";
            else route = "第一章‘两块手表’";
            board.setVar("scenario_phase", phase);
            board.setVar("scenario_route", route);
            board.setVar("scenario_state_text", JSON.stringify(prior));
            board.setVar("scenario_common_prompt", "你是儿童友好的梦境逻辑故事主持人，创作原创的仙境式规则、语言游戏和谜题。\n首次主动开场严格说：一只戴着两块表的兔子说其中一块显示问题，另一块显示答案，你会先看哪一块？\n故事分为四章：第一章“两块手表”、第二章“悖论与提示”、第三章“绿色小门”、第四章“由玩家决定的门后旅程”。事实建立、纠正、回忆、质疑和索要提示不推进章节；只有可见叙事或玩家明确行动才推进。用户询问章节时按当前已发生情节准确回答，不得因为提到第四章就替玩家开门。\n在用户明确建立一扇门之前，第一、二章绝对不得出现门、门色、门把手、钥匙、口令或第三、四章场景；系统中的未来章节名称不是已经发生的剧情。用户首次查看问题表时，问题只围绕两块表如何对应同一个尚未出现的问题，不得偷渡未来场景。\n后续每轮只呈现一个荒诞规则或可推理的小谜题，承接孩子上一轮查看的手表、发现和质疑；孩子选择查看某块表或物件时，首句明确复述其选择的对象，再给出内容；不得重置场景。\n孩子可以反问规则、索要渐进提示或提出不同解法；先确认其推理中成立的部分，再说明仍缺什么。用户质疑答案表比问题表快一分钟时，必须直接说明这不能证明预知未来，只能作为待验证规则，并用稍后对照同一问题在两块表上的内容来检验；该轮不得引入新物件、场景、行动或选择。用户提出“两块表把同一个问题拆成先后两面”时，只判断该解释与现有观察是否相容以及尚缺哪项表内证据，不得跳到门或安排动作。\n不得照抄现代改编、歌曲或新增影视角色；困惑应有趣而不令人恐惧，不收集个人信息。\n最新明确更正覆盖旧事实，之后只把更正后的颜色、物品或规则当作当前事实。门及其把手、墙壁、植物和装饰不得自行增加用户没有给出的颜色，避免旧颜色伪装成其他物件继续出现。\n事实建立、纠正或纯回忆回合只直接回答用户要求，不推进场景、不添加环境、新发现或追问；用户要求记住颜色时只确认该物件及颜色；纠正回合必须只说新事实，并且不得以否定、引用、对比或解释方式再次输出旧值。\n普通回复写2至4个完整中文句子、约60至180个Unicode字符；提示和事实回忆应更短。\n每轮最多问一个问题。只输出适合朗读的中文正文，不输出Markdown、列表、菜单、emoji、舞台说明、分析或系统文字。\n必须写完整句子，不得依赖程序截断，不得重复同义内容。");
      - id: narrate-opening
        type: llm
        publish: true
        config:
          model: flowcraft-story-alice.model
          max_tokens: 2048
          output_key: tmp_answer
          system_prompt: |-
            ${board.scenario_common_prompt}
            本轮Graph路径：${board.scenario_route}。
            本轮只建立怀表悖论、可交谈角色和玩家选择，不替玩家解谜。
            可核对的长期进度：${board.scenario_memory}
            Graph状态：${board.scenario_state_text}
          track_steps: true
      - id: narrate-explore
        type: llm
        publish: true
        config:
          model: flowcraft-story-alice.model
          max_tokens: 2048
          output_key: tmp_answer
          system_prompt: |-
            ${board.scenario_common_prompt}
            本轮Graph路径：${board.scenario_route}。
            本轮只处理玩家当前选择的角色、物件或门，保持人物与物件来源连续。
            可核对的长期进度：${board.scenario_memory}
            Graph状态：${board.scenario_state_text}
          track_steps: true
      - id: narrate-correction
        type: llm
        publish: true
        config:
          model: flowcraft-story-alice.model
          max_tokens: 2048
          output_key: tmp_answer
          system_prompt: |-
            ${board.scenario_common_prompt}
            本轮Graph路径：${board.scenario_route}。
            本轮只确认最新门色或口令；旧值失效且不得再次输出，也不得顺便解开下一步。
            可核对的长期进度：${board.scenario_memory}
            Graph状态：${board.scenario_state_text}
          track_steps: true
      - id: narrate-challenge
        type: llm
        publish: true
        config:
          model: flowcraft-story-alice.model
          max_tokens: 2048
          output_key: tmp_answer
          system_prompt: |-
            ${board.scenario_common_prompt}
            本轮Graph路径：${board.scenario_route}。
            本轮用分级提示或反例检验规则，不直接公布答案，并把最终推理留给玩家。已经作废的门色或口令不得再次输出，也不得建议玩家尝试。检验诚实规则时只描述“提出中性问题、比较前后回答是否一致”这一方法，不给出口令，不使用第二人称祈使或建议句，不问玩家是否执行。用户质疑两块表的规则时，只解释当前矛盾和可检验条件，不得凭空增加第三块表、新角色或新道具，也不得指定伸手、摸口袋、开门等固定行动。
            可核对的长期进度：${board.scenario_memory}
            Graph状态：${board.scenario_state_text}
          track_steps: true
      - id: narrate-conclusion
        type: llm
        publish: true
        config:
          model: flowcraft-story-alice.model
          max_tokens: 2048
          output_key: tmp_answer
          system_prompt: |-
            ${board.scenario_common_prompt}
            本轮Graph路径：${board.scenario_route}。
            本轮只使用有效门色、口令和已验证规则完成回顾或离场，不恢复作废事实。
            可核对的长期进度：${board.scenario_memory}
            Graph状态：${board.scenario_state_text}
          track_steps: true
      - id: reduce-state
        type: script
        config:
          source: |
            const input = String(board.getVar("input") || "").trim();
            const phase = String(board.getVar("scenario_phase") || "explore");
            const prior = board.getVar("scenario_state") || {schema: "raid_scenario_state_v2", revision: 0};
            const next = Object.assign({}, prior);
            let changed = false;
            function set(name, value) {
              if (value && next[name] !== value) { next[name] = value; changed = true; }
            }
            next.phase = phase;
            next.route = String(board.getVar("scenario_route") || "");
            if (input.includes("绿色")) set("door_color", "绿色");
            else if (input.includes("蓝色小门")) set("door_color", "蓝色");
            if (input.includes("茶杯向右")) set("password", "茶杯向右");
            if (changed) next.revision = Math.max(0, Number(prior.revision || 0)) + 1;
            if (phase === "correction") {
              delete next.last_input;
              next.last_correction = JSON.stringify({door_color: next.door_color || "", password: next.password || ""});
            } else {
              next.last_input = input.slice(0, 160);
            }
            board.setVar("scenario_state", next);
            board.setVar("scenario_state_fact", JSON.stringify(next));
      - id: observe-progress
        type: memory_observe
        config:
          observations:
          - facts:
            - text_from: scenario_state_fact
              attributes:
                lane: story_progress
                kind: state
          wait_for_completion: false
    max_iterations: 10
    conversation:
      starts: agent
    voice_adapter:
      asr_model: asr
      default_voice: flowcraft-story-alice.storyteller
  memory: story-teller
