          MILESTONES = [7, 15, 31, 47, 63]
          RULES = '你是 `story-arabian-nights` 的专属验收 Workflow，不是目标剧本角色。必须检查《一千零一夜》的章节连续性、角色知识边界、当前更正优先、儿童安全、事实文化边界和反重复。' + " 评审按本轮请求分类：只有普通叙述轮才要求连续有声书、故事选择、选择后果和自动推进；仅在可见接力包含普通叙述轮时检查推进及原地循环。回忆、只说代号、确认、更正和安全轮只按各自范围、长度、事实及安全契约判断，不因没有推进、角色对白或结尾问题判 FAIL；重复正确代号不算循环。总结/检查点不新增剧情，仍以一个故事内选择结束，中文至少120字符、英文至少60词。 普通叙述的结尾选择须涉及角色行动、地点或解法，不得是流程/许可问题；选择达成目标后同轮自然衔接下一章/场景。"
          N = 64
          WHITESPACE = " \t\n\r　"
          PUNCT = "，。！？、；：“”‘’（）《》〈〉【】『』「」—…·～,.!?;:'\"()[]{}<>-_/\\|`~@#$%^&*+="

          def rune_count(text):
              n = 0
              for _ in text.codepoints():
                  n += 1
              return n

          def english_word_count(text):
              # Whitespace-delimited words containing Latin letters; contractions and
              # hyphenated words count once, punctuation-only tokens do not count.
              count = 0
              for token in text.split():
                  for ch in token.codepoints():
                      if ("a" <= ch.lower() and ch.lower() <= "z"):
                          count += 1
                          break
              return count

          def is_english(text):
              latin = 0
              han = 0
              for ch in text.codepoints():
                  if "a" <= ch.lower() and ch.lower() <= "z":
                      latin += 1
                  elif "㐀" <= ch and ch <= "鿿":
                      han += 1
              return latin > han

          def normalize(text, drop_punct):
              out = []
              for ch in text.codepoints():
                  if ch in WHITESPACE:
                      continue
                  if drop_punct and ch in PUNCT:
                      continue
                  out.append(ch.lower())
              return "".join(out)

          def strip_markers(text):
              for marker in ['【旁白】', '【山鲁佐德】', '【山鲁亚尔】', '【辛巴达】', '【老商人】']:
                  text = text.replace(marker, "")
              return text.strip()

          def deterministic_failures(index, text):
              text = strip_markers(text)
              spec = CHECKS[index]
              failures = []
              if spec.get("story_choice", False):
                  if not text.endswith("？") and not text.endswith("?"):
                      failures.append("story_choice:missing final question")
                  sentences = []
                  sentence = ""
                  for char in text.codepoints():
                      sentence += char
                      if char in "。！？.!?":
                          if sentence.strip():
                              if sentence.strip() in ["？", "?"] and sentences:
                                  sentences[-1] += sentence.strip()
                              else:
                                  sentences.append(sentence.strip())
                          sentence = ""
                  if sentence.strip():
                      sentences.append(sentence.strip())
                  ending = " ".join(sentences[-2:]).lower()
                  if ending.count("？") + ending.count("?") > 2:
                      failures.append("story_choice:too many final questions")
                  # A plot choice may span two sentences, but never ask about the process.
                  if any([cue in ending for cue in ["继续推进故事", "核对一次内容", "核对内容", "内容的分类", "继续听", "继续讲", "continue the story", "check the classification"]]):
                      failures.append("story_choice:process question")
                  if not any([cue in ending for cue in ["还是", "或", "选", "哪", "谁", "先", " or ", "which", "where", "who"]]):
                      failures.append("story_choice:missing story options")
              plain = normalize(text, False)
              for fact in spec.get("required", []):
                  if normalize(fact, False) not in plain:
                      failures.append("required:" + fact)
              for group in spec.get("required_any", []):
                  found = False
                  for fact in group:
                      if normalize(fact, False) in plain:
                          found = True
                  if not found:
                      failures.append("required_any:" + "|".join(group))
              for fact in spec.get("forbidden", []):
                  needle = normalize(fact, True)
                  if (needle == "" and fact in text) or (needle != "" and needle in normalize(text, True)):
                      failures.append("forbidden:" + fact)
              if spec.get("min_words", 0) > 0 and is_english(text):
                  count = english_word_count(text)
                  if count < spec["min_words"]:
                      failures.append("min_words:" + str(count))
                  if count > spec["max_words"]:
                      failures.append("max_words:" + str(count))
              else:
                  count = rune_count(text)
                  if count < spec.get("min_runes", 0):
                      failures.append("min_runes:" + str(count))
                  if spec.get("max_runes", 0) > 0 and count > spec["max_runes"]:
                      failures.append("max_runes:" + str(count))
              return failures

          def request_index(text):
              value = text.strip()
              for i in range(N):
                  if REQUESTS[i].strip() == value:
                      return i
              return -1

          def previous_request_index(messages):
              for offset in range(len(messages)):
                  message = messages[len(messages) - 1 - offset]
                  if message.get("role", "") == "assistant":
                      index = request_index(message.get("content", ""))
                      if index >= 0:
                          return index
              return -1

          def segment_start(index):
              start = 0
              for milestone in MILESTONES:
                  if milestone < index:
                      start = milestone + 1
              return start

          def segment_rounds(messages, start, end):
              rounds = []
              pending = -1
              for message in messages:
                  role = message.get("role", "")
                  text = message.get("content", "").strip()
                  if role == "assistant":
                      pending = request_index(text)
                  elif role == "user" and pending >= start and pending <= end:
                      rounds.append((pending, REQUESTS[pending], text))
                      pending = -1
              return rounds

          def run(input):
              text = input["text"].strip()
              messages = input["messages"]
              if text.startswith("BEGIN "):
                  return {"route": "scripted", "message": REQUESTS[0], "det": "", "system": "只回复 OK", "user": "OK"}
              if text.startswith("CONTINUE "):
                  pieces = text.split()
                  index = int(pieces[-1])
                  if index >= 0 and index < N:
                      return {"route": "scripted", "message": REQUESTS[index], "det": "", "system": "只回复 OK", "user": "OK"}
                  return {"route": "final", "message": "", "det": "invalid continuation", "system": "只回复 FAIL", "user": "FAIL"}
              index = previous_request_index(messages)
              if index < 0:
                  return {"route": "final", "message": "", "det": "missing request alignment", "system": "只回复 FAIL", "user": "FAIL"}
              if index not in MILESTONES:
                  return {"route": "scripted", "message": REQUESTS[index + 1], "det": "", "system": "只回复 OK", "user": "OK"}
              start = segment_start(index)
              rounds = segment_rounds(messages, start, index)
              failures = []
              blocks = []
              seen = {}
              for round in rounds:
                  seen[round[0]] = True
                  for failure in deterministic_failures(round[0], round[2]):
                      failures.append(CHECKPOINTS[round[0]] + " " + failure)
                  blocks.append("【第" + str(round[0] + 1) + "轮 " + CHECKPOINTS[round[0]] + "】\n契约：" + CONTRACTS[round[0]] + "\n玩家：" + round[1] + "\n目标：" + round[2])
              relay_text = normalize("\n".join([r[2] for r in rounds]), False)
              if index == 7 and not any([heading in relay_text for heading in ["第2章", "第3章", "第4章", "chapter2", "chapter3", "chapter4"]]):
                  failures.append("progression:no automatic chapter progression by checkpoint 8")
              if index == N - 1 and not any([heading in relay_text for heading in ["第4章", "chapter4"]]):
                  failures.append("progression:final chapter not reached")
              for expected in range(start, index + 1):
                  if expected not in seen:
                      failures.append("missing:" + str(expected + 1))
              route = "final" if index == N - 1 else "checkpoint"
              system = RULES + "\n逐轮判断指令遵循、连续性、事实与安全、角色知识边界和反重复。只有具体缺陷才判 FAIL。若判 FAIL，先用一行简述具体缺陷；最后一行只写 PASS 或 FAIL。"
              user = "\n\n".join(blocks) + "\n\n确定性失败：" + ("；".join(failures) if failures else "无")
              return {"route": route, "message": "", "det": "；".join(failures), "system": system, "user": user}

          def multi_role_contract_regression():
              if "只有普通叙述轮" not in RULES or "重复正确代号不算循环" not in RULES:
                  fail("special relay judge scope")
              for i in range(len(CHECKPOINTS)):
                  if CHECKPOINTS[i].startswith("checkpoint") and CHECKS[i].get("story_choice", False):
                      if CHECKS[i]["min_runes"] != 120 or CHECKS[i]["min_words"] != 60:
                          fail("summary checkpoint bounds")
                      for size in [119, 120, 186]:
                          failures = deterministic_failures(i, "景" * size)
                          if any([f.startswith("min_runes:") for f in failures]) != (size < 120):
                              fail("summary Chinese boundary")
                      for size in [59, 60, 99]:
                          failures = deterministic_failures(i, " ".join(["adventure"] * size))
                          if any([f.startswith("min_words:") for f in failures]) != (size < 60):
                              fail("summary English boundary")
                      if not any([f.startswith("story_choice:") for f in deterministic_failures(i, "景" * 120)]):
                          fail("summary must retain final choice")
              return True

          # Explicit offline regression entrypoint; avoid spending the live module
          # initialization budget on synthetic long responses.
          def multi_role_contract_metadata_regression():
              if "只有普通叙述轮" not in RULES or "重复正确代号不算循环" not in RULES:
                  fail("special relay judge scope")
              for i in range(len(CHECKPOINTS)):
                  if CHECKPOINTS[i].startswith("checkpoint") and CHECKS[i].get("story_choice", False):
                      if CHECKS[i]["min_runes"] != 120 or CHECKS[i]["min_words"] != 60:
                          fail("summary checkpoint bounds")
              return True

          MULTI_ROLE_CONTRACT_REGRESSION = multi_role_contract_metadata_regression()
